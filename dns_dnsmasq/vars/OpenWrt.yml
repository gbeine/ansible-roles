---
# Included by tasks/main.yml on OpenWrt

# The default configuration of dnsmasq in OpenWrt (package/network/services/dnsmasq/files/dhcp.conf),
# written as options of dnsmasq, the role translates them to the UCI configuration /etc/config/dhcp
dns_dnsmasq__config_default:
  domain-needed: true
  bogus-priv: true
  filterwin2k: false
  localise-queries: true
  stop-dns-rebind: true
  rebind-localhost-ok: true
  local: '/lan/'
  domain: 'lan'
  expand-hosts: true
  no-negcache: false
  cache-size: 1000
  dhcp-authoritative: true
  read-ethers: true
  dhcp-leasefile: '/tmp/dhcp.leases'
  resolv-file: '/tmp/resolv.conf.d/resolv.conf.auto'
  bind-dynamic: true
  local-service: true
  edns-packet-max: 1232
  filter-AAAA: false
  filter-A: false
  dhcp-range: [ 'lan,192.168.1.100,192.168.1.249,255.255.255.0,12h' ]
  no-dhcp-interface: [ 'wan' ]

dns_dnsmasq__openwrt_uci_config: '/etc/config/dhcp'

# Options of dnsmasq and their UCI options in the section dnsmasq, taken from dnsmasq.init of OpenWrt
dns_dnsmasq__openwrt_bool_options:
  all-servers: 'allservers'
  bind-dynamic: 'nonwildcard'
  bogus-priv: 'boguspriv'
  dhcp-authoritative: 'authoritative'
  dhcp-fqdn: 'fqdn'
  dhcp-rapid-commit: 'rapidcommit'
  dhcp-sequential-ip: 'sequential_ip'
  dnssec: 'dnssec'
  domain-needed: 'domainneeded'
  expand-hosts: 'expandhosts'
  filter-A: 'filter_a'
  filter-AAAA: 'filter_aaaa'
  filterwin2k: 'filterwin2k'
  local-service: 'localservice'
  localise-queries: 'localise_queries'
  log-dhcp: 'logdhcp'
  log-queries: 'logqueries'
  no-hosts: 'nohosts'
  no-negcache: 'nonegcache'
  no-ping: 'noping'
  no-resolv: 'noresolv'
  proxy-dnssec: 'proxydnssec'
  quiet-dhcp: 'quietdhcp'
  read-ethers: 'readethers'
  rebind-localhost-ok: 'rebind_localhost'
  script-arp: 'scriptarp'
  stop-dns-rebind: 'rebind_protection'
  strict-order: 'strictorder'

dns_dnsmasq__openwrt_value_options:
  cache-size: 'cachesize'
  dhcp-lease-max: 'dhcpleasemax'
  dhcp-leasefile: 'leasefile'
  dns-forward-max: 'dnsforwardmax'
  domain: 'domain'
  edns-packet-max: 'ednspacket_max'
  local: 'local'
  local-ttl: 'local_ttl'
  log-facility: 'logfacility'
  max-cache-ttl: 'max_cache_ttl'
  max-port: 'maxport'
  max-ttl: 'max_ttl'
  min-cache-ttl: 'min_cache_ttl'
  min-port: 'minport'
  port: 'port'
  query-port: 'queryport'
  resolv-file: 'resolvfile'

dns_dnsmasq__openwrt_list_options:
  addn-hosts: 'addnhosts'
  address: 'address'
  bogus-nxdomain: 'bogusnxdomain'
  except-interface: 'notinterface'
  interface: 'interface'
  listen-address: 'listen_address'
  rebind-domain-ok: 'rebind_domain'
  server: 'server'

# The init script treats these UCI options as enabled if they are missing,
# without the option of dnsmasq the role writes 0
dns_dnsmasq__openwrt_default_enabled: [ 'boguspriv', 'rebind_protection', 'nonwildcard' ]

# Options of dnsmasq written to their own UCI sections
dns_dnsmasq__openwrt_section_options:
  - 'cname'
  - 'dhcp-host'
  - 'dhcp-option'
  - 'dhcp-range'
  - 'host-record'
  - 'mx-host'
  - 'no-dhcp-interface'
  - 'srv-host'

# Section types managed by the role, prune removes undeclared sections of these types only,
# host-record gives sections domain, hostrecord is kept to remove the sections of former versions of the role
dns_dnsmasq__openwrt_section_types: [ 'dnsmasq', 'dhcp', 'tag', 'host', 'domain', 'hostrecord', 'cname', 'srvhost', 'mxhost' ]

# Options of the sections dhcp managed by the role, odhcpd and others keep their options (dhcpv6, ra, ...)
dns_dnsmasq__openwrt_dhcp_options: [ 'interface', 'start', 'limit', 'dynamicdhcp', 'leasetime', 'ignore', 'dhcp_option' ]

# Limit of static pools, default of dnsmasq.init and odhcpd, written by LuCI for static pools
dns_dnsmasq__openwrt_static_limit: '150'
