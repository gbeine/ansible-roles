---
# Entries of dhcp-host in dnsmasq_config are dictionaries with the options of the UCI section host of OpenWrt,
# taken from dhcp_host_add in dnsmasq.init of OpenWrt
dns_dnsmasq__dhcp_host_options:
  - 'broadcast'
  - 'dns'
  - 'duid'
  - 'hostid'
  - 'instance'
  - 'ip'
  - 'leasetime'
  - 'mac'
  - 'match_tag'
  - 'name'
  - 'tag'

# Options with a list of values, OpenWrt stores them separated by spaces
dns_dnsmasq__dhcp_host_list_options: [ 'mac', 'tag', 'match_tag' ]

# Options without counterpart in dnsmasq.conf, ignored with a warning on Debian
dns_dnsmasq__dhcp_host_openwrt_only: [ 'instance' ]
