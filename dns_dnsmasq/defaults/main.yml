---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/dns-dnsmasq
#

dns_dnsmasq__ip: "{{ dnsmasq_ip | mandatory }}"
dns_dnsmasq__ipv6: "{{ dnsmasq_ipv6 }}"
dns_dnsmasq__network: "{{ dnsmasq_network | mandatory }}"
dns_dnsmasq__hostname: "{{ dnsmasq_hostname | mandatory }}"
dns_dnsmasq__timezone: "{{ dnsmasq_timezone | mandatory }}"
dns_dnsmasq__labels: "{{ dnsmasq_labels }}"

dns_dnsmasq__version: "{{ dnsmasq_version | default('2.90-r3-alpine-3') }}"

dns_dnsmasq__publish: "{{ dnsmasq_publish | default([]) }}"

dns_dnsmasq__enable_dhcp: "{{ dnsmasq_enable_dhcp | default(false) }}"

dns_dnsmasq__container: "{{ dns_dnsmasq__container_default | combine(dnsmasq_container | default({})) }}"

dns_dnsmasq__autoupdate_enabled: "{{ dnsmasq_autoupdate_enabled | default(false) }}"
dns_dnsmasq__autoupdate_schedule: "{{ dnsmasq_autoupdate_schedule }}"

#
# Defaults - do not change
#

dns_dnsmasq__podman_name: 'dnsmasq'
dns_dnsmasq__podman_image: 'docker.io/4km3/dnsmasq'
dns_dnsmasq__podman_tag: "{{ dns_dnsmasq__version }}"

dns_dnsmasq__container_default:
  name: "{{ dns_dnsmasq__podman_name }}"
  hostname: "{{ dns_dnsmasq__hostname }}"
  image: "{{ dns_dnsmasq__podman_image }}:{{ dns_dnsmasq__podman_tag }}"
  ip: "{{ dns_dnsmasq__ip }}"
  ipv6: "{{ dns_dnsmasq__ipv6 | default(omit) }}"
  network: "{{ dns_dnsmasq__network }}"
  timezone: "{{ dns_dnsmasq__timezone }}"
  labels: "{{ dns_dnsmasq__labels | default(omit) }}"
  # Without DHCP the key is omitted, the module gets no cap_add at all
  cap_add: "{{ ['NET_ADMIN'] if dns_dnsmasq__enable_dhcp | bool else omit }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
  publish: "{{ dns_dnsmasq__publish }}"
