---

- name: 'Install dnsmasq'
  tags: [ 'dns_dnsmasq' ]
  block:

    - name: 'Validate the configuration'
      ansible.builtin.assert:
        that:
          - dns_dnsmasq__config is mapping
          - dns_dnsmasq__config_invalid_keys | length == 0
          - dns_dnsmasq__config_invalid_values | length == 0
          - dns_dnsmasq__config_dhcp_hosts_valid | bool
          - dns_dnsmasq__config_invalid_dhcp_hosts | length == 0
        # Only the failing checks are reported
        fail_msg: >-
          {{ [ ('dnsmasq_config has to be a dictionary: ' ~ dns_dnsmasq__config)
                 if dns_dnsmasq__config is not mapping else '',
               ('dnsmasq_config has invalid option names: ' ~ dns_dnsmasq__config_invalid_keys | join(', '))
                 if dns_dnsmasq__config_invalid_keys | length > 0 else '',
               ('dnsmasq_config values have to be a boolean, a string, a number or a list of strings and numbers: '
                ~ dns_dnsmasq__config_invalid_values | join(', '))
                 if dns_dnsmasq__config_invalid_values | length > 0 else '',
               ('dnsmasq_config dhcp-host has to be a list of dictionaries: ' ~ dns_dnsmasq__config_dhcp_hosts)
                 if not dns_dnsmasq__config_dhcp_hosts_valid | bool else '',
               ('dnsmasq_config dhcp-host has invalid entries: ' ~ dns_dnsmasq__config_invalid_dhcp_hosts | join(', '))
                 if dns_dnsmasq__config_invalid_dhcp_hosts | length > 0 else '' ]
             | select | join('. ') }}
        quiet: true
      vars:
        # dhcp-host is a list of dictionaries with the options of the UCI section host on all platforms,
        # false omits it like any other option
        dns_dnsmasq__config_dhcp_hosts: >-
          {{ [] if dns_dnsmasq__config is not mapping or dns_dnsmasq__config['dhcp-host'] | default(false) is false
             else dns_dnsmasq__config['dhcp-host'] }}
        dns_dnsmasq__config_dhcp_hosts_valid: >-
          {{ dns_dnsmasq__config_dhcp_hosts is sequence
             and dns_dnsmasq__config_dhcp_hosts is not string
             and dns_dnsmasq__config_dhcp_hosts is not mapping
             and dns_dnsmasq__config_dhcp_hosts | reject('mapping') | list | length == 0 }}
        dns_dnsmasq__config_invalid_dhcp_hosts: >-
          {%- set patterns = {
                'broadcast': '^(True|False|0|1)$',
                'dns': '^(True|False|0|1)$',
                'duid': '^[0-9A-Fa-f]{2}(:?[0-9A-Fa-f]{2})*$',
                'hostid': '^(0x)?[0-9A-Fa-f]{1,8}$',
                'instance': '^[A-Za-z0-9_]+$',
                'ip': '^(ignore|(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])([.](25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3})$',
                'leasetime': '^([0-9]+[smhdw]?|infinite)$',
                'mac': '^([0-9A-Fa-f*]{1,2}[:-]){5}[0-9A-Fa-f*]{1,2}$',
                'match_tag': '^[A-Za-z0-9_.-]+$',
                'name': '^[A-Za-z0-9][A-Za-z0-9_.-]*$',
                'tag': '^[A-Za-z0-9_.-]+$' } -%}
          {%- set ns = namespace(invalid=[]) -%}
          {%- for entry in (dns_dnsmasq__config_dhcp_hosts if dns_dnsmasq__config_dhcp_hosts_valid | bool else []) -%}
          {%-   set reasons = [] -%}
          {%-   set unknown = entry.keys() | reject('in', dns_dnsmasq__dhcp_host_options) | list -%}
          {%-   if unknown | length > 0 -%}{%- set _ = reasons.append('unknown options ' ~ unknown | join(' ')) -%}{%- endif -%}
          {%-   for key, value in entry.items() if key in dns_dnsmasq__dhcp_host_options -%}
          {%-     set values = value if key in dns_dnsmasq__dhcp_host_list_options and value is sequence
                                       and value is not string and value is not mapping else [ value ] -%}
          {%-     if values | length == 0 or values | reject('string') | reject('number') | reject('boolean') | list | length > 0
                     or values | map('string') | select('search', '\n') | list | length > 0
                     or values | map('string') | reject('match', patterns[key]) | list | length > 0 -%}
          {%-       set _ = reasons.append('invalid ' ~ key ~ ' ' ~ values | join(' ')) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%-   if entry.mac is not defined and entry.duid is not defined and entry.name is not defined -%}
          {%-     set _ = reasons.append('needs mac, duid or name') -%}
          {%-   endif -%}
          {%-   if entry.ip is not defined and entry.hostid is not defined -%}
          {%-     set _ = reasons.append('needs ip or hostid') -%}
          {%-   endif -%}
          {%-   if entry.dns | default(false) | string in ['True', '1']
                 and (entry.ip | default('ignore') == 'ignore' or entry.name is not defined) -%}
          {%-     set _ = reasons.append('dns needs an IPv4 address in ip and name') -%}
          {%-   endif -%}
          {%-   if reasons | length > 0 -%}
          {%-     set label = entry.name if entry.name is defined and entry.name is string
                              else (entry.mac if entry.mac is defined and entry.mac is string else '#' ~ loop.index) -%}
          {%-     set ns.invalid = ns.invalid + [ label ~ ' (' ~ reasons | join(', ') ~ ')' ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.invalid }}
        # Option names of dnsmasq consist of letters, digits and dashes
        dns_dnsmasq__config_invalid_keys: >-
          {{ (dns_dnsmasq__config.keys() | list if dns_dnsmasq__config is mapping else [])
             | reject('match', '^[A-Za-z0-9][A-Za-z0-9-]*$') | list }}
        # Strings must not contain line breaks, they would add further options
        dns_dnsmasq__config_invalid_values: >-
          {%- set ns = namespace(invalid=[]) -%}
          {%- for key, value in (dns_dnsmasq__config.items() if dns_dnsmasq__config is mapping else []) if key != 'dhcp-host' -%}
          {%-   set values = value if value is sequence and value is not string and value is not mapping else [ value ] -%}
          {%-   if value is not boolean and (value is mapping
                  or values | select('boolean') | list | length > 0
                  or values | reject('string') | reject('number') | list | length > 0
                  or values | select('string') | select('search', '\n') | list | length > 0) -%}
          {%-     set ns.invalid = ns.invalid + [ key ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.invalid }}

    # OpenWrt has no Python, raw works without facts on every system
    - name: 'Detect OpenWrt'
      ansible.builtin.raw: 'cat /etc/openwrt_release 2>/dev/null || true'
      register: 'dns_dnsmasq__release_file'
      changed_when: false
      check_mode: false

    - name: 'Set the platform'
      ansible.builtin.set_fact:
        dns_dnsmasq__openwrt: "{{ dns_dnsmasq__release_file.stdout is search('DISTRIB_ID=.?OpenWrt') }}"

    - name: 'Install dnsmasq as podman quadlet on Debian'
      ansible.builtin.include_tasks: 'debian.yml'
      when: not dns_dnsmasq__openwrt | bool

    - name: 'Configure dnsmasq on OpenWrt'
      ansible.builtin.include_tasks: 'openwrt.yml'
      when: dns_dnsmasq__openwrt | bool
