---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    dns_dnsmasq__test_case: "{{ dns_dnsmasq__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    dns_dnsmasq__test_quadlet_path: '/etc/containers/systemd/dnsmasq.container'

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ dns_dnsmasq__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksums of the quadlet unit and the configuration before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: [ "{{ dns_dnsmasq__test_quadlet_path }}", "{{ dns_dnsmasq__test_config_file }}" ]
      register: 'dns_dnsmasq__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include
    - name: 'Run dns_dnsmasq with dnsmasq_enable_dhcp not a boolean (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        dnsmasq_enable_dhcp: 'maybe'
        dns_dnsmasq__test_invalid:
          message: 'dnsmasq_enable_dhcp is not a boolean'
          search: '^dnsmasq_enable_dhcp has to be a boolean: maybe$'

    - name: 'Run dns_dnsmasq with dnsmasq_publish not a list (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        dnsmasq_publish: '53:53/udp'
        dns_dnsmasq__test_invalid:
          message: 'dnsmasq_publish is not a list'
          search: '^dnsmasq_publish has to be a list: 53:53/udp$'

    - name: 'Run dns_dnsmasq with dnsmasq_labels not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        dnsmasq_labels: [ 'molecule.test=dnsmasq' ]
        dns_dnsmasq__test_invalid:
          message: 'dnsmasq_labels is not a dictionary'
          search: "^dnsmasq_labels has to be a dictionary if set: \\['molecule\\.test=dnsmasq'\\]$"

    - name: 'Run dns_dnsmasq with dnsmasq_config not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        dnsmasq_config: [ 'domain-needed' ]
        dns_dnsmasq__test_invalid:
          message: 'dnsmasq_config is not a dictionary'
          # combine of the defaults fails before the role checks anything
          search: 'failed to combine variables, expected dicts'

    - name: 'Run dns_dnsmasq with a dictionary as value in dnsmasq_config (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        dnsmasq_config:
          domain-needed: true
          server: { address: '9.9.9.9' }
        dns_dnsmasq__test_invalid:
          message: 'a dictionary as value in dnsmasq_config'
          search: '^dnsmasq_config values have to be a boolean, a string, a number or a list of strings and numbers: server$'

    - name: 'Run dns_dnsmasq with a dhcp-host as string (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        dnsmasq_config:
          dhcp-host: [ '02:00:00:00:00:01,10.89.0.150' ]
        dns_dnsmasq__test_invalid:
          message: 'a dhcp-host as string'
          search: "^dnsmasq_config dhcp-host has to be a list of dictionaries: \\['02:00:00:00:00:01,10\\.89\\.0\\.150'\\]$"

    - name: 'Run dns_dnsmasq with an invalid dhcp-host (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        dnsmasq_config:
          dhcp-host:
            - { mac: '02:00:00:00:00:01', name: 'printer', foo: 'bar' }
        dns_dnsmasq__test_invalid:
          message: 'an invalid dhcp-host'
          search: '^dnsmasq_config dhcp-host has invalid entries: printer \(unknown options foo, needs ip or hostid\)$'

    # The variables are valid, dnsmasq --test rejects the unknown option before the configuration is replaced
    - name: 'Run dns_dnsmasq with an unknown option in dnsmasq_config (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        dnsmasq_config:
          domain-needed: true
          molecule-no-such-option: true
        dns_dnsmasq__test_invalid:
          message: 'an unknown option in dnsmasq_config'
          search: 'dnsmasq: bad option at line'

    - name: 'Change the role variables of the test case'
      when: dns_dnsmasq__test_case.side_effect is defined
      block:

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command: 'systemctl show --property=ActiveEnterTimestampMonotonic --value dnsmasq'
          register: 'dns_dnsmasq__test_started_before'
          changed_when: false

        - name: 'Set the changed role variables'
          ansible.builtin.set_fact:
            "{{ item.key }}": "{{ item.value }}"
          loop: "{{ dns_dnsmasq__test_case.side_effect.role_vars | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: 'Run dns_dnsmasq with the changed role variables'
          ansible.builtin.include_role:
            name: 'dns_dnsmasq'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command: 'systemctl show --property=ActiveEnterTimestampMonotonic --value dnsmasq'
          register: 'dns_dnsmasq__test_started_after'
          changed_when: false

        - name: 'Read the state of the service after the change'
          ansible.builtin.command: 'systemctl is-active dnsmasq'
          register: 'dns_dnsmasq__test_active_after'
          changed_when: false
          failed_when: false

        - name: 'Assert the expected changes and the restart of the service'
          ansible.builtin.assert:
            that:
              - (dns_dnsmasq__quadlet_result is changed) == ('quadlet' in dns_dnsmasq__test_case.side_effect.changed)
              - (dns_dnsmasq__config_result is changed) == ('config' in dns_dnsmasq__test_case.side_effect.changed)
              - dns_dnsmasq__test_started_after.stdout | int > dns_dnsmasq__test_started_before.stdout | int
            fail_msg: >-
              quadlet changed: {{ dns_dnsmasq__quadlet_result is changed }},
              configuration changed: {{ dns_dnsmasq__config_result is changed }},
              expected changes: {{ dns_dnsmasq__test_case.side_effect.changed | join(', ') }},
              start before {{ dns_dnsmasq__test_started_before.stdout }}, after {{ dns_dnsmasq__test_started_after.stdout }},
              state {{ dns_dnsmasq__test_active_after.stdout }}
