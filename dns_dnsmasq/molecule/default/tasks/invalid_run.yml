---
# Runs dns_dnsmasq with the invalid role variables passed as include parameters,
# the role has to fail at the validation before it changes anything.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run dns_dnsmasq with invalid variables (expect ERROR): {{ dns_dnsmasq__test_invalid.message }}"
  block:

    - name: 'Run dns_dnsmasq, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'dns_dnsmasq'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ dns_dnsmasq__test_invalid.message }}"

  rescue:

    - name: 'Read the checksum of the quadlet unit after the invalid run'
      ansible.builtin.stat:
        path: "{{ dns_dnsmasq__test_quadlet_path }}"
        checksum_algorithm: 'md5'
      register: 'dns_dnsmasq__test_md5_after'

    - name: 'Assert the run failed at the validation before any change'
      ansible.builtin.assert:
        that:
          - ansible_failed_result.msg | default('') is search(dns_dnsmasq__test_invalid.search)
          - dns_dnsmasq__test_md5_after.stat.checksum == dns_dnsmasq__test_md5_before.stat.checksum
        fail_msg: >-
          Failure: {{ ansible_failed_result.msg | default('') }}
          Checksum before: {{ dns_dnsmasq__test_md5_before.stat.checksum }}, after: {{ dns_dnsmasq__test_md5_after.stat.checksum }}.
