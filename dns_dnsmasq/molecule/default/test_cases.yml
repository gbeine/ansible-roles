---
# Network created by container_podman in prepare.yml, shared by all test cases
dns_dnsmasq__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

dns_dnsmasq__test_image: 'docker.io/4km3/dnsmasq:2.90-r3-alpine-3'

dns_dnsmasq__test_config_file: '/srv/dnsmasq/dnsmasq.conf'

# Static leases as dictionaries with the options of the UCI section host,
# instance has no counterpart in dnsmasq.conf and is ignored with a warning
dns_dnsmasq__test_dhcp_hosts:
  - { mac: '02:00:00:00:00:01', ip: '10.89.0.150', name: 'printer' }
  - { duid: '00010001c792bc873c1acc1dfe46', ip: '10.89.0.151', name: 'wallbox', dns: true, tag: 'iot', leasetime: '12h', instance: 'main' }

dns_dnsmasq__test_cases:

  # side_effect enables DHCP, only the quadlet changes, verify checks the state afterwards
  - name: 'molecule-dnsmasq-dns'
    role_vars:
      dnsmasq_home: '/srv/dnsmasq'
      dnsmasq_ip: '10.89.0.10'
      dnsmasq_network: 'podman-molecule'
      dnsmasq_hostname: 'dnsmasq-molecule'
      dnsmasq_timezone: 'Europe/Berlin'
      dnsmasq_config:
        domain-needed: true
        bogus-priv: true
        log-queries: false
        address: [ '/molecule.test/10.89.0.99' ]
    side_effect:
      changed: [ 'quadlet' ]
      role_vars:
        dnsmasq_enable_dhcp: true
    expect:
      ip: '10.89.0.10'
      ip6: ~
      dhcp: true
      labels: {}
      config:
        - 'address=/molecule.test/10.89.0.99'
        - 'bogus-priv'
        - 'domain-needed'
      resolve:
        molecule.test: '10.89.0.99'

  # side_effect adds an address, only the configuration changes, verify checks the state afterwards
  - name: 'molecule-dnsmasq-dhcp'
    role_vars:
      dnsmasq_home: '/srv/dnsmasq'
      dnsmasq_ip: '10.89.0.10'
      dnsmasq_ipv6: 'fd00:89::10'
      dnsmasq_network: 'podman-molecule'
      dnsmasq_hostname: 'dnsmasq-molecule'
      dnsmasq_timezone: 'Europe/Berlin'
      dnsmasq_enable_dhcp: true
      dnsmasq_labels:
        molecule.test: 'dnsmasq'
      dnsmasq_config:
        domain-needed: true
        domain: 'molecule.lan'
        address: [ '/molecule.test/10.89.0.99' ]
        dhcp-range: '10.89.0.100,10.89.0.200,12h'
        dhcp-authoritative: true
        dhcp-host: "{{ dns_dnsmasq__test_dhcp_hosts }}"
    side_effect:
      changed: [ 'config' ]
      role_vars:
        dnsmasq_config:
          domain-needed: true
          domain: 'molecule.lan'
          address: [ '/molecule.test/10.89.0.99', '/changed.test/10.89.0.98' ]
          dhcp-range: '10.89.0.100,10.89.0.200,12h'
          dhcp-authoritative: true
          dhcp-host: "{{ dns_dnsmasq__test_dhcp_hosts }}"
    expect:
      ip: '10.89.0.10'
      ip6: 'fd00:89::10'
      dhcp: true
      labels:
        molecule.test: 'dnsmasq'
      config:
        - 'address=/molecule.test/10.89.0.99'
        - 'address=/changed.test/10.89.0.98'
        - 'dhcp-authoritative'
        - 'dhcp-host=02:00:00:00:00:01,10.89.0.150,printer'
        - 'dhcp-host=id:00:01:00:01:c7:92:bc:87:3c:1a:cc:1d:fe:46,set:iot,10.89.0.151,wallbox,12h'
        - 'dhcp-range=10.89.0.100,10.89.0.200,12h'
        - 'domain=molecule.lan'
        - 'domain-needed'
        - 'host-record=wallbox,wallbox.molecule.lan,10.89.0.151'
      resolve:
        molecule.test: '10.89.0.99'
        changed.test: '10.89.0.98'
        wallbox: '10.89.0.151'
        wallbox.molecule.lan: '10.89.0.151'
