---
# Network created by container_podman in prepare.yml, shared by all test cases
dns_dnsmasq__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

dns_dnsmasq__test_image: 'docker.io/4km3/dnsmasq:2.90-r3-alpine-3'

dns_dnsmasq__test_cases:

  # side_effect enables DHCP, verify checks the state afterwards
  - name: 'molecule-dnsmasq-dns'
    role_vars:
      dnsmasq_ip: '10.89.0.10'
      dnsmasq_network: 'podman-molecule'
      dnsmasq_hostname: 'dnsmasq-molecule'
      dnsmasq_timezone: 'Europe/Berlin'
    side_effect:
      role_vars:
        dnsmasq_enable_dhcp: true
    expect:
      ip: '10.89.0.10'
      ip6: ~
      dhcp: true
      labels: {}

  - name: 'molecule-dnsmasq-dhcp'
    role_vars:
      dnsmasq_ip: '10.89.0.10'
      dnsmasq_ipv6: 'fd00:89::10'
      dnsmasq_network: 'podman-molecule'
      dnsmasq_hostname: 'dnsmasq-molecule'
      dnsmasq_timezone: 'Europe/Berlin'
      dnsmasq_enable_dhcp: true
      dnsmasq_labels:
        molecule.test: 'dnsmasq'
    expect:
      ip: '10.89.0.10'
      ip6: 'fd00:89::10'
      dhcp: true
      labels:
        molecule.test: 'dnsmasq'
