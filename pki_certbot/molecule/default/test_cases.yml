---
# Network created by container_podman in prepare.yml
pki_certbot__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24

pki_certbot__test_image: 'c0d3.sh/container/certbot:latest'

# ACME test server, started in prepare.yml, its TLS root is added to the CA certificates of the host
pki_certbot__test_pebble:
  name: 'pebble'
  image: 'ghcr.io/letsencrypt/pebble:latest'
  ip: '10.89.0.20'
  root: '/test/certs/pebble.minica.pem'

pki_certbot__test_realm: 'molecule.example.test'

pki_certbot__test_vars:
  certbot_home: '/opt/certbot-molecule'
  certbot_ip: '10.89.0.50'
  certbot_network: 'podman-molecule'
  certbot_hostname: 'certbot-molecule'
  certbot_timezone: 'Europe/Berlin'
  certbot_email: 'admin@example.test'
  certbot_provider_server:
    pebble: 'https://pebble:14000/dir'
  certbot_provider: 'pebble'
  certbot_realms:
    - realm: 'molecule.example.test'
  certbot_plugins:
    dns-hetzner:
      dns_hetzner_api_token: 'molecule-dummy-token'

# Changed in side_effect.yml: the podman socket changes the quadlet, the plugin is removed
pki_certbot__test_side_effect_vars:
  certbot_podman_socket: true
  certbot_plugins: {}
