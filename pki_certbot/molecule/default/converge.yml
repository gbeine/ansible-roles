---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    pki_certbot__test_case: "{{ pki_certbot__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  pre_tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ pki_certbot__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the TLS root of pebble'
      ansible.builtin.slurp:
        src: "{{ pki_certbot__test_pebble.host_root }}"
      register: 'pki_certbot__test_pebble_root'
      when: pki_certbot__test_case.private_ca

    - name: 'Set the TLS root of pebble as private CA'
      ansible.builtin.set_fact:
        certbot_ca_certificates:
          pebble: "{{ pki_certbot__test_pebble_root.content | b64decode }}"
      when: pki_certbot__test_case.private_ca

  tasks:

    - name: 'Run pki_certbot'
      ansible.builtin.include_role:
        name: 'pki_certbot'
