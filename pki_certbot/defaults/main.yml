---

pki_certbot__pki_dir: "{{ certbot_pki_dir | default(pki_certbot__pki_dir_default) }}"
pki_certbot__email: "{{ certbot_email | default('') }}"
pki_certbot__provider: "{{ certbot_provider | default('acme-staging-v02') }}"

pki_certbot__dhparams_size: "{{ certbot_dhparams_size | default(pki_common__dhparams_size) }}"

pki_certbot__realms: "{{ certbot_realms | default([])}}"

pki_certbot__use_podman: "{{ certbot_use_podman | default(false) }}"

pki_certbot__podman_provider: "{{ certbot_podman_provider | default('dns-hetzner') }}"
pki_certbot__podman_hostname: "{{ certbot_podman_hostname | default('certbot.' + dns_hostname) }}"
pki_certbot__podman_ip: "{{ certbot_podman_ip | mandatory }}"
pki_certbot__podman_network: "{{ certbot_podman_net | mandatory }}"
pki_certbot__podman_home: "{{ certbot_home | mandatory }}"
pki_certbot__podman_etc: "{{ certbot_podman_etc | default(pki_certbot__podman_home + '/etc') }}"
pki_certbot__podman_lib: "{{ certbot_podman_lib | default(pki_certbot__podman_home + '/lib') }}"
pki_certbot__podman_log: "{{ certbot_podman_log | default(pki_certbot__podman_home + '/log') }}"

pki_certbot__environment: "{{ certbot_environment | default(pki_certbot__environment_default) }}"

pki_certbot__docker_sock: "{{ certbot_docker_sock | default(false) }}"
pki_certbot__podman_sock: "{{ certbot_podman_sock | default(false) }}"

pki_certbot__dns_hetzner_api_token: "{{ pki_certbot_dns_hetzner_api_token | mandatory }}"

#
# Do not change from here
#

pki_certbot__accounts_dir: "{{ pki_certbot__pki_dir }}/accounts"
pki_certbot__renewal_dir: "{{ pki_certbot__pki_dir }}/renewal"

pki_certbot__global_options: "--server {{ pki_certbot__provider_server[pki_certbot__provider] }}"
pki_certbot__register_options: "{{ pki_certbot__global_options }} --email {{ pki_certbot__email }} --agree-tos --no-eff-email"

pki_certbot__packages: "{{ pki_certbot__packages_default[bootstrap_ansible__distribution] | default([]) }}"

pki_certbot__pki_dir_default: '/etc/letsencrypt'

pki_certbot__environment_default: {}

pki_certbot__volumes_default:
    - "{{ certbot__podman_etc }}:{{ pki_certbot__pki_dir }}"
    - "{{ pki_certbot__podman_lib }}:/var/lib/letsencrypt"
    - "{{ pki_certbot__podman_log }}:/var/log/letsencrypt"

pki_certbot__volumes_docker_sock: "{{ [ '/var/run/docker.sock:/var/run/docker.sock' ] if pki_certbot__docker_sock else [] }}"
pki_certbot__volumes_podman_sock: "{{ [ '/var/run/podman/podman.sock:/var/run/podman/podman.sock' ] if pki_certbot__podman_sock else [] }}"

pki_certbot__provider_server:
  acme-v02: 'https://acme-v02.api.letsencrypt.org/directory'
  acme-staging-v02: 'https://acme-staging-v02.api.letsencrypt.org/directory'

pki_certbot__podman_run: "podman run -it --rm --name {{ pki_certbot__podman_container.name }} -v {{ pki_certbot__podman_container.volumes | join(' -v ') }} {{ pki_certbot__podman_container.image }}"
pki_certbot__podman_certbot_options: "{{ pki_certbot__global_options }} {{ pki_certbot__podman_certbot_options_default[pki_certbot__podman_provider] }}"

pki_certbot__podman_container: "{{ pki_certbot__podman_container_default }}"

pki_certbot__podman_container_default:
  name: 'certbot'
  hostname: "{{ pki_certbot__podman_hostname }}"
  image: "{{ pki_certbot__podman_images_default[pki_certbot__podman_provider] }}"
  ip: "{{ pki_certbot__podman_ip }}"
  network: "{{ pki_certbot__podman_network }}"
  rm: true
  volumes: "{{ pki_certbot__volumes_default + pki_certbot__volumes_podman_sock + pki_certbot__volumes_docker_sock }}"

pki_certbot__podman_images_default:
  certbot: 'docker.io/certbot/certbot:latest'
  dns-hetzner: 'docker.io/gbeine/dns-hetzner:latest'

pki_certbot__podman_certbot_options_default:
  certbot: ''
  dns-hetzner: '--authenticator dns-hetzner --dns-hetzner-credentials /etc/letsencrypt/dns-hetzner'

pki_certbot__packages_default:
  Debian:
    - 'certbot'
    - 'python3-icu'
  Raspbian:
    - 'certbot'
    - 'python3-icu'

pki_certbot__podman_systemd_services:
  - name: 'certbot-podman-renew'
    description: 'certbot renew'
    wants:
      - 'certbot-podman-renew.timer'
    type: 'simple'
    user: 'root'
    exec_start: "{{ pki_certbot__podman_run }} renew"
    environment:
      PATH: '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

pki_certbot__podman_systemd_timers:
  - name: 'certbot-podman-renew'
    description: 'certbot renew Timer'
    on_calendar: 'daily'
    persistent: 'true'
    wanted_by:
      - 'timers.target'
    enabled: true
