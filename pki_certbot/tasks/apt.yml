---

- name: Install ACME pki support
  block:

    - name: Currently not supported
      ansible.builtin.fail:
        msg: Currently not supported

    - name: Install pki packages
      ansible.builtin.apt:
        update_cache: yes
        install_recommends: no
        pkg: "{{ pki_certbot__packages }}"

    - name: Register or update ACME account
      when: pki_certbot__email | length > 0
      ansible.builtin.shell: |
        certbot update_account {{ pki_certbot__register_options }} || certbot register {{ pki_certbot__register_options }}
      environment: "{{ pki_certbot__environment }}"
