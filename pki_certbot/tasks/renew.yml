---

- name: 'Create the renew units'
  ansible.builtin.template:
    src: "{{ pki_certbot__renew_name }}.{{ item }}.j2"
    dest: "{{ pki_certbot__systemd_dir }}/{{ pki_certbot__renew_name }}.{{ item }}"
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop:
    - 'service'
    - 'timer'
  register: 'pki_certbot__renew_units'

- name: 'Start and enable the renew timer'
  ansible.builtin.systemd_service:
    name: "{{ pki_certbot__renew_name }}.timer"
    daemon_reload: "{{ pki_certbot__renew_units is changed }}"
    state: 'started'
    enabled: true
  when: 'not ansible_check_mode'
