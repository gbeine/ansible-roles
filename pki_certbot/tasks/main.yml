---

- name: 'Install Certbot'
  tags: [ 'pki_certbot' ]
  block:

    - name: 'Validate the configuration'
      ansible.builtin.import_tasks: 'validate.yml'

    - name: 'Install Certbot using podman'
      ansible.builtin.import_tasks: 'podman.yml'

    - name: 'Register ACME accounts'
      ansible.builtin.include_tasks: 'accounts.yml'
      when: 'not ansible_check_mode'

    - name: 'Create certificates'
      ansible.builtin.include_tasks: 'realms.yml'
      when: 'not ansible_check_mode'

    - name: 'Install the renew timer'
      ansible.builtin.import_tasks: 'renew.yml'
