---

- name: 'Install Certbot'
  tags: [ 'pki', 'pki_certbot' ]
  block:

    - name: 'Install Certbot using package management'
      ansible.builtin.include_tasks:
        file: 'apt.yml'
      when: 'not pki_certbot__use_podman'

    - name: 'Install Certbot using podman'
      ansible.builtin.include_tasks:
        file: 'podman.yml'
      when: 'pki_certbot__use_podman'

    - name: 'Register or update ACME accounts'
      ansible.builtin.include_tasks:
        file: 'accounts.yml'

    - name: 'Create certificates'
      ansible.builtin.include_tasks:
        file: 'realms.yml'
