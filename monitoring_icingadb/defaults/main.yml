---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-icingadb
#

monitoring_icingadb__ip: "{{ icingadb_ip | mandatory }}"
monitoring_icingadb__ipv6: "{{ icingadb_ipv6 }}"
monitoring_icingadb__network: "{{ icingadb_network | mandatory }}"
monitoring_icingadb__hostname: "{{ icingadb_hostname | mandatory }}"
monitoring_icingadb__timezone: "{{ icingadb_timezone | mandatory }}"

monitoring_icingadb__version: "{{ icingadb_version | default('latest') }}"

monitoring_icingadb__container: "{{ monitoring_icingadb__podman_container_default | combine(icingadb_container | default({})) }}"

# The configuration of Icinga DB (ICINGADB_*), merged over the default, null removes a variable of the default
monitoring_icingadb__environment: "{{ monitoring_icingadb__environment_default | combine(icingadb_environment | default({})) }}"

# Secrets with name, data and target, the target is the variable of the password, e.g. ICINGADB_DATABASE_PASSWORD
monitoring_icingadb__secrets: "{{ icingadb_secrets | default([]) }}"

monitoring_icingadb__autoupdate_enabled: "{{ icingadb_autoupdate_enabled | default(false) }}"
monitoring_icingadb__autoupdate_schedule: "{{ icingadb_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The defaults of the former versions of the role, Icinga DB itself uses the port 6380 of Redis
monitoring_icingadb__environment_default:
  ICINGADB_DATABASE_PORT: 3306
  ICINGADB_DATABASE_DATABASE: 'icinga'
  ICINGADB_DATABASE_USER: 'icinga'
  ICINGADB_REDIS_PORT: 6379

monitoring_icingadb__environment_required: [ 'ICINGADB_DATABASE_HOST', 'ICINGADB_REDIS_HOST' ]

# Generated from internal/config/config.go of Icinga DB v1.6.0 and the env tags of database, redis, logging, config/tls.go
# and notifications/source of icinga-go-library v0.10.0, update with new versions of Icinga DB:
# the variables of the options of Icinga DB without the passwords
monitoring_icingadb__environment_allowed_options:
  - 'ICINGADB_DATABASE_TYPE'
  - 'ICINGADB_DATABASE_HOST'
  - 'ICINGADB_DATABASE_PORT'
  - 'ICINGADB_DATABASE_DATABASE'
  - 'ICINGADB_DATABASE_USER'
  - 'ICINGADB_DATABASE_TLS'
  - 'ICINGADB_DATABASE_CERT'
  - 'ICINGADB_DATABASE_KEY'
  - 'ICINGADB_DATABASE_CA'
  - 'ICINGADB_DATABASE_INSECURE'
  - 'ICINGADB_DATABASE_OPTIONS_MAX_CONNECTIONS'
  - 'ICINGADB_DATABASE_OPTIONS_MAX_CONNECTIONS_PER_TABLE'
  - 'ICINGADB_DATABASE_OPTIONS_MAX_PLACEHOLDERS_PER_STATEMENT'
  - 'ICINGADB_DATABASE_OPTIONS_MAX_ROWS_PER_TRANSACTION'
  - 'ICINGADB_DATABASE_OPTIONS_WSREP_SYNC_WAIT'
  - 'ICINGADB_REDIS_HOST'
  - 'ICINGADB_REDIS_PORT'
  - 'ICINGADB_REDIS_USERNAME'
  - 'ICINGADB_REDIS_DATABASE'
  - 'ICINGADB_REDIS_TLS'
  - 'ICINGADB_REDIS_CERT'
  - 'ICINGADB_REDIS_KEY'
  - 'ICINGADB_REDIS_CA'
  - 'ICINGADB_REDIS_INSECURE'
  - 'ICINGADB_REDIS_OPTIONS_BLOCK_TIMEOUT'
  - 'ICINGADB_REDIS_OPTIONS_HMGET_COUNT'
  - 'ICINGADB_REDIS_OPTIONS_HSCAN_COUNT'
  - 'ICINGADB_REDIS_OPTIONS_MAX_HMGET_CONNECTIONS'
  - 'ICINGADB_REDIS_OPTIONS_TIMEOUT'
  - 'ICINGADB_REDIS_OPTIONS_XREAD_COUNT'
  - 'ICINGADB_LOGGING_LEVEL'
  - 'ICINGADB_LOGGING_OUTPUT'
  - 'ICINGADB_LOGGING_INTERVAL'
  - 'ICINGADB_LOGGING_OPTIONS'
  - 'ICINGADB_RETENTION_HISTORY_DAYS'
  - 'ICINGADB_RETENTION_SLA_DAYS'
  - 'ICINGADB_RETENTION_INTERVAL'
  - 'ICINGADB_RETENTION_COUNT'
  - 'ICINGADB_RETENTION_OPTIONS'
  - 'ICINGADB_NOTIFICATIONS_URL'
  - 'ICINGADB_NOTIFICATIONS_ICINGAWEB2_URL'
  - 'ICINGADB_NOTIFICATIONS_USERNAME'
  - 'ICINGADB_NOTIFICATIONS_TLS'
  - 'ICINGADB_NOTIFICATIONS_CERT'
  - 'ICINGADB_NOTIFICATIONS_KEY'
  - 'ICINGADB_NOTIFICATIONS_CA'
  - 'ICINGADB_NOTIFICATIONS_INSECURE'
  - 'ICINGADB_NOTIFICATIONS_DEFAULT_RELATIONS'
  - 'ICINGADB_NOTIFICATIONS_SYNCHRONIZE_WITH_DATABASE'

# Generated as above: the boolean variables, Icinga DB parses them with strconv.ParseBool
monitoring_icingadb__environment_booleans:
  - 'ICINGADB_DATABASE_TLS'
  - 'ICINGADB_DATABASE_INSECURE'
  - 'ICINGADB_REDIS_TLS'
  - 'ICINGADB_REDIS_INSECURE'
  - 'ICINGADB_NOTIFICATIONS_TLS'
  - 'ICINGADB_NOTIFICATIONS_INSECURE'
  - 'ICINGADB_NOTIFICATIONS_SYNCHRONIZE_WITH_DATABASE'

# The variables of the passwords and the variables of their files (PASSWORD_FILE of icinga-go-library)
monitoring_icingadb__secret_files:
  ICINGADB_DATABASE_PASSWORD: 'ICINGADB_DATABASE_PASSWORD_FILE'
  ICINGADB_REDIS_PASSWORD: 'ICINGADB_REDIS_PASSWORD_FILE'
  ICINGADB_NOTIFICATIONS_PASSWORD: 'ICINGADB_NOTIFICATIONS_PASSWORD_FILE'

monitoring_icingadb__secret_variables: "{{ monitoring_icingadb__secret_files.keys() | list }}"
monitoring_icingadb__secrets_required: [ 'ICINGADB_DATABASE_PASSWORD' ]

monitoring_icingadb__environment_allowed: >-
  {{ monitoring_icingadb__environment_allowed_options + (monitoring_icingadb__secret_files.values() | list) }}

monitoring_icingadb__secrets_dir: '/run/secrets'

# The file variables of the secrets, e.g. { 'ICINGADB_DATABASE_PASSWORD_FILE': '/run/secrets/icingadb_database_password' }
monitoring_icingadb__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if monitoring_icingadb__secrets is sequence and monitoring_icingadb__secrets is not string -%}
  {%-   for secret in monitoring_icingadb__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in monitoring_icingadb__secret_files -%}
  {%-     set _ = environment.update({ monitoring_icingadb__secret_files[secret.target]: monitoring_icingadb__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The messages of Icinga DB after the login to the database and to Redis
monitoring_icingadb__ready: 'Waiting for Icinga 2 to write into Redis|Taking over|Starting history sync'

monitoring_icingadb__podman_name: 'icingadb'
monitoring_icingadb__podman_image: 'docker.io/icinga/icingadb'
monitoring_icingadb__podman_tag: "{{ monitoring_icingadb__version }}"

monitoring_icingadb__podman_container_default:
  name: "{{ monitoring_icingadb__podman_name }}"
  hostname: "{{ monitoring_icingadb__hostname }}"
  image: "{{ monitoring_icingadb__podman_image }}:{{ monitoring_icingadb__podman_tag }}"
  ip: "{{ monitoring_icingadb__ip }}"
  ipv6: "{{ monitoring_icingadb__ipv6 | default(omit) }}"
  network: "{{ monitoring_icingadb__network }}"
  timezone: "{{ monitoring_icingadb__timezone }}"
  # null removes a variable of the default
  environment: >-
    {{ monitoring_icingadb__environment | dict2items | rejectattr('value', 'none') | items2dict
       | combine(monitoring_icingadb__environment_secrets_files) }}
  secrets: >-
    {{ (monitoring_icingadb__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ monitoring_icingadb__secrets_dir ~ '/\1') | list)
      if (monitoring_icingadb__secrets is sequence and monitoring_icingadb__secrets is not string and monitoring_icingadb__secrets | length > 0)
      else omit }}
