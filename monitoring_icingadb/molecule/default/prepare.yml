---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_icingadb__test_case: "{{ monitoring_icingadb__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    podman_networks:
      - "{{ monitoring_icingadb__test_network }}"
    podman_default_network: "{{ monitoring_icingadb__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Pull the images, so the first start of the services does not time out'
      containers.podman.podman_image:
        name: "{{ item }}"
      loop:
        - "{{ monitoring_icingadb__test_image }}"
        - "{{ monitoring_icingadb__test_case.database.image }}"
        - "{{ monitoring_icingadb__test_case.redis.image }}"
      register: 'monitoring_icingadb__test_pull'
      until: monitoring_icingadb__test_pull is succeeded
      retries: 5
      delay: 30

    - name: 'Start the database'
      containers.podman.podman_container:
        name: "{{ monitoring_icingadb__test_case.database.name }}"
        image: "{{ monitoring_icingadb__test_case.database.image }}"
        network: "{{ monitoring_icingadb__test_network.name }}"
        ip: "{{ monitoring_icingadb__test_case.database.ip }}"
        env: "{{ monitoring_icingadb__test_case.database.environment }}"
        state: 'started'

    - name: 'Start Redis'
      containers.podman.podman_container:
        name: "{{ monitoring_icingadb__test_case.redis.name }}"
        image: "{{ monitoring_icingadb__test_case.redis.image }}"
        network: "{{ monitoring_icingadb__test_network.name }}"
        ip: "{{ monitoring_icingadb__test_case.redis.ip }}"
        command: "{{ monitoring_icingadb__test_case.redis.command }}"
        state: 'started'

    - name: 'Wait for the database and Redis'
      ansible.builtin.wait_for:
        host: "{{ item.host }}"
        port: "{{ item.port }}"
        timeout: 120
      loop:
        - host: "{{ monitoring_icingadb__test_case.database.ip }}"
          port: "{{ monitoring_icingadb__test_case.database.port }}"
        - host: "{{ monitoring_icingadb__test_case.redis.ip }}"
          port: 6379
