---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/webserver-sws
#

webserver_sws__home: "{{ sws_home | mandatory }}"
webserver_sws__ip: "{{ sws_ip | mandatory }}"
webserver_sws__ipv6: "{{ sws_ipv6 }}"
webserver_sws__network: "{{ sws_network | mandatory }}"
webserver_sws__hostname: "{{ sws_hostname | mandatory }}"
webserver_sws__timezone: "{{ sws_timezone | mandatory }}"
webserver_sws__labels: "{{ sws_labels }}"

webserver_sws__vhosts: "{{ sws_vhosts | default([]) }}"

webserver_sws__container: "{{ webserver_sws__podman_container_default | combine(sws_container | default({})) }}"

webserver_sws__autoupdate_enabled: "{{ sws_autoupdate_enabled | default(false) }}"

#
# podman defaults
#

webserver_sws__podman_name: 'sws'
webserver_sws__podman_image: 'ghcr.io/static-web-server/static-web-server'
webserver_sws__podman_tag: '2'

webserver_sws__podman_home: "{{ webserver_sws__home }}"
webserver_sws__podman_root_dir: "{{ webserver_sws__podman_home }}/public"
webserver_sws__podman_vhost_dir: "{{ webserver_sws__podman_home }}/vhosts"
webserver_sws__podman_config_file: "{{ webserver_sws__podman_home }}/sws.toml"

webserver_sws__podman_container_default:
  name: "{{ webserver_sws__podman_name }}"
  hostname: "{{ webserver_sws__hostname }}"
  image: "{{ webserver_sws__podman_image }}:{{ webserver_sws__podman_tag }}"
  ip: "{{ webserver_sws__ip }}"
  ipv6: "{{ webserver_sws__ipv6 | default(omit) }}"
  network: "{{ webserver_sws__network }}"
  timezone: "{{ webserver_sws__timezone }}"
  environment:
    SERVER_ROOT: '/var/public'
    SERVER_CONFIG_FILE: '/etc/sws.toml'
  labels: "{{ webserver_sws__labels | default(omit) }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ webserver_sws__podman_config_file }}:/etc/sws.toml:ro"
    - "{{ webserver_sws__podman_root_dir }}:/var/public:ro"
    - "{{ webserver_sws__podman_vhost_dir }}:/var/vhosts:ro"
