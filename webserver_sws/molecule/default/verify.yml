---
- name: 'Verify'
  hosts: 'all'

  vars_files:
    - 'test_cases.yml'

  vars:
    webserver_sws__test_case: "{{ webserver_sws__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  tasks:

    - name: 'Read generated quadlet unit'
      ansible.builtin.command: 'cat /etc/containers/systemd/sws.container'
      register: 'webserver_sws__quadlet'
      changed_when: false

    - name: 'Assert IPv4/IPv6 expectations'
      ansible.builtin.assert:
        that:
          - "('IP=' + webserver_sws__test_case.expect.ip) in webserver_sws__quadlet.stdout"
          - "webserver_sws__test_case.expect.ip6 is none or ('IP6=' + webserver_sws__test_case.expect.ip6) in webserver_sws__quadlet.stdout"
          - "webserver_sws__test_case.expect.ip6 is not none or 'IP6=' not in webserver_sws__quadlet.stdout"

    - name: 'Assert the sws service is active'
      ansible.builtin.command: 'systemctl is-active sws'
      changed_when: false
