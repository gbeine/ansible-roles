---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    webserver_sws__test_case: "{{ webserver_sws__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    webserver_sws__test_home: "{{ webserver_sws__test_case.role_vars.sws_home }}"
    podman_networks:
      - "{{ webserver_sws__test_network }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Ensure /etc/timezone exists'
      ansible.builtin.copy:
        dest: '/etc/timezone'
        content: |
          Etc/UTC
        force: false
        mode: '644'

    - name: 'Pull the sws image, so the first start of the service does not time out'
      containers.podman.podman_image:
        name: "{{ webserver_sws__test_image }}"

    - name: 'Create content directories'
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '755'
      loop: "{{ [ webserver_sws__test_home + '/public' ] + webserver_sws__test_case.expect.vhosts | map('regex_replace', '^', webserver_sws__test_home + '/vhosts/') | list }}"

    - name: 'Create the default page'
      ansible.builtin.copy:
        dest: "{{ webserver_sws__test_home }}/public/index.html"
        content: |
          molecule default
        mode: '644'

    - name: 'Create the pages of the virtual hosts'
      ansible.builtin.copy:
        dest: "{{ webserver_sws__test_home }}/vhosts/{{ item }}/index.html"
        content: |
          molecule {{ item }}
        mode: '644'
      loop: "{{ webserver_sws__test_case.expect.vhosts }}"
