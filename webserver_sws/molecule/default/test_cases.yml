---
# Network created by container_podman in prepare.yml, shared by all test cases
webserver_sws__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

webserver_sws__test_image: 'ghcr.io/static-web-server/static-web-server:2'

webserver_sws__test_cases:

  # Without virtual hosts, sws.toml contains only the header
  - name: 'molecule-sws-ipv4-only'
    role_vars:
      sws_home: '/opt/sws-molecule'
      sws_ip: '10.89.0.10'
      sws_network: 'podman-molecule'
      sws_hostname: 'sws-molecule'
      sws_timezone: 'Europe/Berlin'
    expect:
      ip: '10.89.0.10'
      ip6: ~
      vhosts: []
      urls:
        - url: 'http://10.89.0.10/'
          content: 'molecule default'

  # With a virtual host, served via IPv4 and IPv6
  - name: 'molecule-sws-ipv6'
    role_vars:
      sws_home: '/opt/sws-molecule'
      sws_ip: '10.89.0.10'
      sws_ipv6: 'fd00:89::10'
      sws_network: 'podman-molecule'
      sws_hostname: 'sws-molecule'
      sws_timezone: 'Europe/Berlin'
      sws_vhosts:
        - 'example.org'
    expect:
      ip: '10.89.0.10'
      ip6: 'fd00:89::10'
      vhosts:
        - 'example.org'
      urls:
        - url: 'http://10.89.0.10/'
          content: 'molecule default'
        - url: 'http://[fd00:89::10]/'
          content: 'molecule default'
        - url: 'http://10.89.0.10/'
          host: 'example.org'
          content: 'molecule example.org'
