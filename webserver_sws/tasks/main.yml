---

- name: 'Install Static Web Server'
  tags: [ 'webserver_sws' ]
  block:

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item }}"
        state: 'directory'
      with_items:
        - "{{ webserver_sws__podman_home }}"
        - "{{ webserver_sws__podman_root_dir }}"
        - "{{ webserver_sws__podman_vhost_dir }}"

    - name: 'Generate configuration'
      ansible.builtin.template:
        src: 'sws.toml.j2'
        dest: "{{ webserver_sws__podman_config_file }}"
      notify: 'Restart SWS container'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ webserver_sws__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[webserver_sws__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ webserver_sws__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ webserver_sws__container.name }}"
        hostname: "{{ webserver_sws__container.hostname }}"
        image: "{{ webserver_sws__container.image }}"
        ip: "{{ webserver_sws__container.ip }}"
        network: "{{ webserver_sws__container.network }}"
        timezone: "{{ webserver_sws__container.timezone }}"
        env: "{{ webserver_sws__container.environment }}"
        label: "{{ webserver_sws__container.labels }}"
        volume: "{{ webserver_sws__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'webserver_sws__ipv6 | length == 0'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ webserver_sws__container.name }}"
        hostname: "{{ webserver_sws__container.hostname }}"
        image: "{{ webserver_sws__container.image }}"
        ip: "{{ webserver_sws__container.ip }}"
        ip6: "{{ webserver_sws__container.ipv6 }}"
        network: "{{ webserver_sws__container.network }}"
        timezone: "{{ webserver_sws__container.timezone }}"
        env: "{{ webserver_sws__container.environment }}"
        label: "{{ webserver_sws__container.labels }}"
        volume: "{{ webserver_sws__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'webserver_sws__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ webserver_sws__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode | bool else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'webserver_sws__autoupdate_enabled'
      block:
        - name: 'Create autoupdate systemd service'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ webserver_sws__container.name }} container

              [Service]
              Type=oneshot
              ExecStart=/usr/bin/podman pull {{ webserver_sws__container.image }}
              ExecStartPost=/usr/bin/systemctl restart {{ webserver_sws__container.name }}
            dest: "/etc/systemd/system/container-{{ webserver_sws__container.name }}-update.service"
            mode: '0644'
            owner: root
            group: root

        - name: 'Create autoupdate systemd timer'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ webserver_sws__container.name }} timer

              [Timer]
              OnCalendar=*-*-* 00/3:00:00
              RandomizedDelaySec=30m
              Persistent=true

              [Install]
              WantedBy=timers.target
            dest: "/etc/systemd/system/container-{{ webserver_sws__container.name }}-update.timer"
            mode: '0644'
            owner: root
            group: root

        - name: 'Start and enable autoupdate timer'
          ansible.builtin.systemd:
            name: "container-{{ webserver_sws__container.name }}-update.timer"
            daemon_reload: true
            state: 'started'
            enabled: true
          when: 'not ansible_check_mode'
