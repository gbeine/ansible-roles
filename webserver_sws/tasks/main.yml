---

- name: 'Install Static Web Server'
  tags: [ 'webserver_sws' ]
  block:

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item }}"
        state: 'directory'
      with_items:
        - "{{ webserver_sws__podman_data_dir }}"
        - "{{ webserver_sws__podman_root_dir }}"
        - "{{ webserver_sws__podman_vhost_dir }}"

    - name: 'Generate configuration'
      ansible.builtin.template:
        src: 'sws.toml.j2'
        dest: "{{ webserver_sws__podman_config_file }}"
      notify: 'Restart SWS container'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ webserver_sws__container.name }}"
        hostname: "{{ webserver_sws__container.hostname }}"
        image: "{{ webserver_sws__container.image }}"
        ip: "{{ webserver_sws__container.ip }}"
        network: "{{ webserver_sws__container.network }}"
        restart_policy: "{{ webserver_sws__container.restart_policy }}"
        timezone: "{{ webserver_sws__container.timezone }}"
        env: "{{ webserver_sws__container.environment }}"
        volume: "{{ webserver_sws__container.volumes }}"
        pull: 'always'
        recreate: "{{ podman___update_mode | default(false) }}"
      when: 'webserver_sws__ipv6 | length == 0'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ webserver_sws__container.name }}"
        hostname: "{{ webserver_sws__container.hostname }}"
        image: "{{ webserver_sws__container.image }}"
        ip: "{{ webserver_sws__container.ip }}"
        ipv6: "{{ webserver_sws__container.ipv6 }}"
        network: "{{ webserver_sws__container.network }}"
        restart_policy: "{{ webserver_sws__container.restart_policy }}"
        timezone: "{{ webserver_sws__container.timezone }}"
        env: "{{ webserver_sws__container.environment }}"
        volume: "{{ webserver_sws__container.volumes }}"
        pull: 'always'
        recreate: "{{ podman___update_mode | default(false) }}"
      when: 'webserver_sws__ipv6 | length > 0'
