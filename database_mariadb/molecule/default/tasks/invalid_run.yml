---
# Runs database_mariadb with the invalid role variables passed as include parameters,
# the role has to fail before the quadlet unit or custom.cnf change.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run database_mariadb with invalid variables (expect ERROR): {{ database_mariadb__test_invalid.message }}"
  block:

    - name: 'Run database_mariadb, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'database_mariadb'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ database_mariadb__test_invalid.message }}"

  rescue:

    - name: 'Read the checksums of the checked files after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ database_mariadb__test_checked_files }}"
      register: 'database_mariadb__test_md5_after'

    - name: 'Assert the run failed before the checked files changed'
      ansible.builtin.assert:
        that:
          - database_mariadb__test_failure is search(database_mariadb__test_invalid.search, multiline=true)
          - database_mariadb__test_before | select('equalto', '') | list | length == 0
          - database_mariadb__test_after == database_mariadb__test_before
        fail_msg: >-
          Failure: {{ database_mariadb__test_failure }}
          Checksums before: {{ database_mariadb__test_before | join(', ') }},
          after: {{ database_mariadb__test_after | join(', ') }}.
      vars:
        # Double quotes, so \n is a line break for the anchors of the searches
        database_mariadb__test_failure: "{{ [ ansible_failed_result.msg | default(''), ansible_failed_result.stderr | default('') ] | join('\n') }}"
        database_mariadb__test_before: "{{ database_mariadb__test_md5_before.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
        database_mariadb__test_after: "{{ database_mariadb__test_md5_after.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
