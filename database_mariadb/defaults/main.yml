---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-mariadb
#

database_mariadb__home: "{{ mariadb_home | mandatory }}"
database_mariadb__ip: "{{ mariadb_ip | mandatory }}"
database_mariadb__ipv6: "{{ mariadb_ipv6 }}"
database_mariadb__network: "{{ mariadb_network | mandatory }}"
database_mariadb__hostname: "{{ mariadb_hostname | mandatory }}"
database_mariadb__timezone: "{{ mariadb_timezone | mandatory }}"
database_mariadb__labels: "{{ mariadb_labels }}"

# The user and group of /config, the image runs MariaDB as this user
database_mariadb__uid: "{{ mariadb_uid | mandatory }}"
database_mariadb__gid: "{{ mariadb_gid | mandatory }}"

database_mariadb__version: "{{ mariadb_version | default('latest') }}"

database_mariadb__container: "{{ database_mariadb__podman_container_default | combine(mariadb_container | default({})) }}"

# Variables of the image, e.g. CLI_OPTS, the role sets PUID, PGID, TZ and the file variable of the root password
database_mariadb__environment: "{{ database_mariadb__environment_default | combine(mariadb_environment | default({})) }}"

# Secrets with name, data and target, the target MYSQL_ROOT_PASSWORD is mandatory
database_mariadb__secrets: "{{ mariadb_secrets | default([]) }}"

# The sections of custom.cnf, every section is merged over the section of the default,
# a string or number writes "option = value", true the option without value, a list one line per element,
# false or null removes the option
database_mariadb__config: "{{ database_mariadb__config_default | combine(mariadb_config | default({}), recursive=true) }}"

# Databases with name, encoding and collation, accounts with name, host and privileges, the passwords of the accounts
database_mariadb__databases: "{{ mariadb_databases | default([]) }}"
database_mariadb__accounts: "{{ mariadb_accounts | default([]) }}"
database_mariadb__passwords: "{{ mariadb_passwords | default({}) }}"

database_mariadb__autoupdate_enabled: "{{ mariadb_autoupdate_enabled | default(false) }}"
database_mariadb__autoupdate_schedule: "{{ mariadb_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The default of custom.cnf of the image (root/defaults/custom.cnf of linuxserver/docker-mariadb),
# without the options set by the role
database_mariadb__config_default:
  client:
    default-character-set: 'utf8mb4'
  mysqld_safe:
    nice: 0
  mysqld:
    lc_messages_dir: '/usr/share/mariadb'
    lc_messages: 'en_US'
    tmpdir: '/tmp'
    skip-external-locking: true
    key_buffer_size: '128M'
    max_connections: 100
    connect_timeout: 5
    wait_timeout: 600
    max_allowed_packet: '16M'
    thread_cache_size: 128
    thread_stack: '192K'
    sort_buffer_size: '4M'
    bulk_insert_buffer_size: '16M'
    tmp_table_size: '32M'
    max_heap_table_size: '32M'
    character_set_server: 'utf8mb4'
    collation_server: 'utf8mb4_general_ci'
    transaction_isolation: 'READ-COMMITTED'
    binlog_format: 'MIXED'
    myisam-recover-options: 'BACKUP'
    table_open_cache: 400
    myisam_sort_buffer_size: '512M'
    concurrent_insert: 2
    read_buffer_size: '2M'
    read_rnd_buffer_size: '1M'
    query_cache_limit: '128K'
    query_cache_size: '64M'
    query_cache_type: 'DEMAND'
    console: 1
    log_warnings: 2
    log_error: '/config/log/mysql/mariadb-error.log'
    slow_query_log: 1
    slow_query_log_file: '/config/log/mysql/mariadb-slow.log'
    long_query_time: 5
    log_bin: '/config/log/mysql/mariadb-bin'
    log_bin_index: '/config/log/mysql/mariadb-bin.index'
    expire_logs_days: 10
    max_binlog_size: '100M'
    slave_connections_needed_for_purge: 0
    default_storage_engine: 'InnoDB'
    innodb_buffer_pool_size: '256M'
    innodb_log_buffer_size: '8M'
    innodb_file_per_table: 1
    innodb_open_files: 400
    innodb_io_capacity: 400
    innodb_flush_method: 'O_DIRECT'
  mysqldump:
    quick: true
    quote-names: true
    max_allowed_packet: '16M'

# The options set by the role, the image, the role and backup_mysql depend on them
database_mariadb__config_role:
  client:
    port: "{{ database_mariadb__port }}"
    socket: "{{ database_mariadb__socket }}"
  mysqld_safe:
    socket: "{{ database_mariadb__socket }}"
  mysqld:
    user: 'abc'
    pid-file: '/run/mysqld/mysqld.pid'
    socket: "{{ database_mariadb__socket }}"
    port: "{{ database_mariadb__port }}"
    basedir: '/usr'
    datadir: '/config/databases'

# The order of the sections in custom.cnf, the allowed options of every section are in database_mariadb__config_allowed
database_mariadb__config_sections: [ 'client', 'mysql', 'mysqldump', 'mysqld_safe', 'mysqld' ]

# Options carrying a password, they must not be written to custom.cnf
database_mariadb__config_passwords: [ 'password', 'wsrep_sst_auth' ]

# The prefixes of options, removed before the check of the names
database_mariadb__config_prefixes: [ 'loose_', 'skip_', 'enable_', 'disable_', 'maximum_' ]

database_mariadb__port: 3306
database_mariadb__socket: '/run/mysqld/mysqld.sock'

database_mariadb__environment_default:
  PUID: "{{ database_mariadb__uid | string }}"
  PGID: "{{ database_mariadb__gid | string }}"
  TZ: "{{ database_mariadb__timezone }}"

# The variables of the image (readme-vars.yml of linuxserver/docker-mariadb and the base image),
# the databases and the user of the image are managed by the role
database_mariadb__environment_allowed:
  - 'PUID'
  - 'PGID'
  - 'TZ'
  - 'UMASK'
  - 'CLI_OPTS'
  - 'REMOTE_SQL'
  # The file variable of the root password, set by the role
  - 'FILE__MYSQL_ROOT_PASSWORD'

database_mariadb__environment_managed: [ 'MYSQL_DATABASE', 'MYSQL_USER', 'MYSQL_PASSWORD' ]

# The base image of linuxserver reads FILE__<VARIABLE> as file
database_mariadb__secret_files:
  MYSQL_ROOT_PASSWORD: 'FILE__MYSQL_ROOT_PASSWORD'

database_mariadb__secret_variables: "{{ database_mariadb__secret_files.keys() | list }}"
database_mariadb__secrets_required: [ 'MYSQL_ROOT_PASSWORD' ]
database_mariadb__secrets_dir: '/run/secrets'

# The data of a secret by its target, the role manages databases and accounts as root
database_mariadb__secret_data: >-
  {%- set data = {} -%}
  {%- if database_mariadb__secrets is sequence and database_mariadb__secrets is not string and database_mariadb__secrets is not mapping -%}
  {%-   for secret in database_mariadb__secrets if secret is mapping and secret.target is defined and secret.data is defined -%}
  {%-     set _ = data.update({ secret.target: secret.data }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ data }}
database_mariadb__root_password: "{{ database_mariadb__secret_data.MYSQL_ROOT_PASSWORD | default('') }}"

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
database_mariadb__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if database_mariadb__secrets is sequence and database_mariadb__secrets is not string and database_mariadb__secrets is not mapping -%}
  {%-   for secret in database_mariadb__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in database_mariadb__secret_files -%}
  {%-     set _ = environment.update({ database_mariadb__secret_files[secret.target]: database_mariadb__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The names of databases and accounts
database_mariadb__object_name_pattern: '^[A-Za-z0-9_.$-]+$'

# The packages of the controlled host for ansible.mariadb
database_mariadb__packages: [ 'python3-pymysql' ]

database_mariadb__podman_name: 'mariadb'
database_mariadb__podman_image: 'lscr.io/linuxserver/mariadb'

database_mariadb__podman_container_default:
  name: "{{ database_mariadb__podman_name }}"
  hostname: "{{ database_mariadb__hostname }}"
  image: "{{ database_mariadb__podman_image }}:{{ database_mariadb__version }}"
  ip: "{{ database_mariadb__ip }}"
  ipv6: "{{ database_mariadb__ipv6 | default(omit) }}"
  network: "{{ database_mariadb__network }}"
  timezone: "{{ database_mariadb__timezone }}"
  labels: "{{ database_mariadb__labels | default(omit) }}"
  # Set with mariadb_environment and mariadb_secrets, merged over the default
  environment: "{{ database_mariadb__environment | combine(database_mariadb__environment_secrets_files) }}"
  # backup_mysql uses the container mariadb
  volumes:
    - "{{ database_mariadb__home }}:/config"
  secrets: "{{ database_mariadb__podman_secrets if database_mariadb__podman_secrets | length > 0 else omit }}"

# The podman secrets of mariadb_secrets, entries without name are left out, the validation of the secrets reports them
database_mariadb__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- if database_mariadb__secrets is sequence and database_mariadb__secrets is not string and database_mariadb__secrets is not mapping -%}
  {%-   for secret in database_mariadb__secrets if secret is mapping and secret.name is defined -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ database_mariadb__secrets_dir ~ '/' ~ secret.name) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ secrets }}

