---

- name: 'Deploy OpenSSH container'
  tags: [ 'security_openssh' ]
  block:

    - name: 'Create OpenSSH directories'
      ansible.builtin.file:
        dest: "{{ item }}"
        state: 'directory'
        owner: "{{ security_openssh__uid }}"
        group: "{{ security_openssh__uid }}"
        mode: '700'
      with_items:
        - "{{ security_openssh__podman_data_dir }}"

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ security_openssh__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[security_openssh__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ security_openssh__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ security_openssh__container.name }}"
        hostname: "{{ security_openssh__container.hostname }}"
        image: "{{ security_openssh__container.image }}"
        ip: "{{ security_openssh__container.ip }}"
        network: "{{ security_openssh__container.network }}"
        timezone: "{{ security_openssh__container.timezone }}"
        env: "{{ security_openssh__container.environment }}"
        publish: "{{ security_openssh__container.publish }}"
        volume: "{{ security_openssh__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'security_openssh__ipv6 | length == 0'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ security_openssh__container.name }}"
        hostname: "{{ security_openssh__container.hostname }}"
        image: "{{ security_openssh__container.image }}"
        ip: "{{ security_openssh__container.ip }}"
        ip6: "{{ security_openssh__container.ipv6 }}"
        network: "{{ security_openssh__container.network }}"
        timezone: "{{ security_openssh__container.timezone }}"
        env: "{{ security_openssh__container.environment }}"
        publish: "{{ security_openssh__container.publish }}"
        volume: "{{ security_openssh__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'security_openssh__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ security_openssh__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode is defined and podman___update_mode else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'security_openssh__autoupdate_enabled'
      block:
        - name: 'Create autoupdate systemd service'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ security_openssh__container.name }} container

              [Service]
              Type=oneshot
              ExecStart=/usr/bin/podman pull {{ security_openssh__container.image }}
              ExecStartPost=/usr/bin/systemctl restart {{ security_openssh__container.name }}
            dest: "/etc/systemd/system/container-{{ security_openssh__container.name }}-update.service"
            mode: '0644'
            owner: root
            group: root

        - name: 'Create autoupdate systemd timer'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ security_openssh__container.name }} timer

              [Timer]
              OnCalendar=*-*-* 08:00:00
              RandomizedDelaySec=30m
              Persistent=true

              [Install]
              WantedBy=timers.target
            dest: "/etc/systemd/system/container-{{ security_openssh__container.name }}-update.timer"
            mode: '0644'
            owner: root
            group: root

        - name: 'Start and enable autoupdate timer'
          ansible.builtin.systemd:
            name: "container-{{ security_openssh__container.name }}-update.timer"
            daemon_reload: true
            state: 'started'
            enabled: true
          when: 'not ansible_check_mode'

