---
# Runs security_openssh with the invalid role variables passed as include parameters,
# the role has to fail before the quadlet unit or the secrets change.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run security_openssh with invalid variables (expect ERROR): {{ security_openssh__test_invalid.message }}"
  block:

    - name: 'Run security_openssh, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'security_openssh'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ security_openssh__test_invalid.message }}"

  rescue:

    - name: 'Read the checksums of the checked files after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ security_openssh__test_checked_files }}"
      register: 'security_openssh__test_md5_after'

    - name: 'Assert the run failed before the checked files changed'
      ansible.builtin.assert:
        that:
          - security_openssh__test_failure is search(security_openssh__test_invalid.search, multiline=true)
          - security_openssh__test_before | select('equalto', '') | list | length == 0
          - security_openssh__test_after == security_openssh__test_before
        fail_msg: >-
          Failure: {{ security_openssh__test_failure }}
          Checksums before: {{ security_openssh__test_before | join(', ') }},
          after: {{ security_openssh__test_after | join(', ') }}.
      vars:
        # Double quotes, so \n is a line break for the anchors of the searches
        security_openssh__test_failure: "{{ [ ansible_failed_result.msg | default(''), ansible_failed_result.stderr | default('') ] | join('\n') }}"
        security_openssh__test_before: "{{ security_openssh__test_md5_before.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
        security_openssh__test_after: "{{ security_openssh__test_md5_after.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
