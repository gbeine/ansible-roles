---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    security_openssh__test_case: "{{ security_openssh__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    security_openssh__test_vars: "{{ security_openssh__test_case.role_vars }}"
    security_openssh__test_secrets: "{{ security_openssh__test_vars.openssh_secrets | default([]) }}"
    security_openssh__test_config: "{{ security_openssh__test_vars.openssh_config | default({}) }}"
    security_openssh__test_checked_files:
      - "{{ security_openssh__test_quadlet_path }}"
      - "{{ security_openssh__test_config_path }}"

  tasks:

    - name: 'Read the public key of the test'
      ansible.builtin.slurp:
        src: "{{ security_openssh__test_key }}.pub"
      register: 'security_openssh__test_public_key'

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ security_openssh__test_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Add the public key to the environment'
      ansible.builtin.set_fact:
        openssh_environment: "{{ openssh_environment | combine({ 'PUBLIC_KEY': security_openssh__test_public_key.content | b64decode | trim }) }}"
        security_openssh__test_environment: "{{ openssh_environment | combine({ 'PUBLIC_KEY': security_openssh__test_public_key.content | b64decode | trim }) }}"

    - name: 'Read the checksums of the checked files before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ security_openssh__test_checked_files }}"
      register: 'security_openssh__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include

    - name: 'Run security_openssh with openssh_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        openssh_container: [ 'environment' ]
        security_openssh__test_invalid:
          message: 'openssh_container not a dictionary'
          search: 'failed to combine variables, expected dicts'

    - name: 'Run security_openssh with openssh_secrets not a list (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        openssh_secrets: { 'name': 'openssh_user_password', 'data': 'x', 'target': 'USER_PASSWORD' }
        security_openssh__test_invalid:
          message: 'openssh_secrets not a list'
          search: '^openssh_secrets has to be a list$'

    - name: 'Run security_openssh with a secret without target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        openssh_secrets: "{{ security_openssh__test_secrets + [ { 'name': 'openssh_other', 'data': 'x' } ] }}"
        security_openssh__test_invalid:
          message: 'a secret without target'
          search: '^openssh_secrets entries need name, data and target$'

    - name: 'Run security_openssh with an unknown secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        openssh_secrets: "{{ security_openssh__test_secrets + [ { 'name': 'openssh_other', 'data': 'x', 'target': 'MOLECULE_SECRET' } ] }}"
        security_openssh__test_invalid:
          message: 'an unknown secret'
          search: 'Unknown secrets: MOLECULE_SECRET\.'

    - name: 'Run security_openssh without PUBLIC_KEY (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        openssh_environment: "{{ security_openssh__test_environment | combine({ 'PUBLIC_KEY': '' }) }}"
        security_openssh__test_invalid:
          message: 'without PUBLIC_KEY'
          search: '^OpenSSH needs the environment variables PUBLIC_KEY, missing or empty: PUBLIC_KEY\.$'

    - name: 'Run security_openssh with the password and its file variable in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        openssh_environment: "{{ security_openssh__test_environment | combine({ 'USER_PASSWORD': 'plain', 'USER_PASSWORD_FILE': '/tmp/password' }) }}"
        security_openssh__test_invalid:
          message: 'the password and its file variable in the environment'
          search: '^Secrets and their file variables must not be set in openssh_environment: USER_PASSWORD, USER_PASSWORD_FILE\.$'

    - name: 'Run security_openssh with DOCKER_MODS (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        openssh_environment: "{{ security_openssh__test_environment | combine({ 'DOCKER_MODS': 'linuxserver/mods:openssh-server-ssh-tunnel' }) }}"
        security_openssh__test_invalid:
          message: 'DOCKER_MODS'
          search: 'Unknown environment variables: DOCKER_MODS\.'

    - name: 'Run security_openssh with invalid values of the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        openssh_environment: "{{ security_openssh__test_environment | combine({ 'SUDO_ACCESS': 'yes', 'LISTEN_PORT': 'ssh', 'USER_NAME': 'Molecule User', 'UMASK': '999' }) }}"
        security_openssh__test_invalid:
          message: 'invalid values of the environment'
          search: >-
            ^These variables are booleans, allowed are true and false: SUDO_ACCESS\.
            These variables have to be numbers: LISTEN_PORT\.
            USER_NAME has to be a name of a user of lower case letters, digits, \., _ and -, not root\.
            UMASK has to be an octal umask, e\.g\. 022\.$

    - name: 'Run security_openssh with openssh_config not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        openssh_config: [ 'ClientAliveInterval 30' ]
        security_openssh__test_invalid:
          message: 'openssh_config not a dictionary'
          search: 'openssh_config has to be a dictionary of the options of sshd\.|failed to combine variables, expected dicts'

    - name: 'Run security_openssh with invalid options of sshd (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        openssh_config: "{{ security_openssh__test_config | combine({ 'Client-Alive': 30, 'Port': 22, 'Banner': { 'file': '/etc/issue' }, 'Subsystem': 'sftp\ninternal-sftp' }) }}"
        security_openssh__test_invalid:
          message: 'invalid options of sshd'
          search: >-
            ^The options of openssh_config are names of letters and digits: Client-Alive\.
            These options are set by the image or the role and must not be set in openssh_config: Port, .*\.
            The values of openssh_config have to be strings, numbers, booleans, null or lists of them: Banner\.
            The values of openssh_config must not contain line breaks: Subsystem\.$

    # The configuration is valid for the role, sshd rejects the unknown option before the file is replaced
    - name: 'Run security_openssh with an option unknown to sshd (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        openssh_config: "{{ security_openssh__test_config | combine({ 'MoleculeUnknown': 'yes' }) }}"
        security_openssh__test_invalid:
          message: 'an option unknown to sshd'
          search: 'failed to validate|Bad configuration option'

    - name: 'Change an option of sshd'
      when: security_openssh__test_case.side_effect is defined
      block:

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'openssh' ]
          register: 'security_openssh__test_started_before'
          changed_when: false

        - name: 'Set the changed options of sshd'
          ansible.builtin.set_fact:
            openssh_config: "{{ security_openssh__test_case.side_effect.config }}"

        - name: 'Run security_openssh with the changed options of sshd'
          ansible.builtin.include_role:
            name: 'security_openssh'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'openssh' ]
          register: 'security_openssh__test_started_after'
          changed_when: false

        - name: 'Assert the changed configuration and the restart of the service'
          ansible.builtin.assert:
            that:
              - security_openssh__config_result is changed
              - security_openssh__quadlet_result is not changed
              - security_openssh__secrets_result is not changed
              - security_openssh__test_started_after.stdout | int > security_openssh__test_started_before.stdout | int
            fail_msg: >-
              configuration changed: {{ security_openssh__config_result is changed }},
              quadlet changed: {{ security_openssh__quadlet_result is changed }},
              secrets changed: {{ security_openssh__secrets_result is changed }},
              start before {{ security_openssh__test_started_before.stdout }}, after {{ security_openssh__test_started_after.stdout }}
