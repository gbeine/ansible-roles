---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/smarthome-gladys
#

smarthome_gladys__home: "{{ gladys_home | mandatory }}"
smarthome_gladys__ip: "{{ gladys_ip | mandatory }}"
smarthome_gladys__ipv6: "{{ gladys_ipv6 | default('') }}"
smarthome_gladys__network: "{{ gladys_network | mandatory }}"
smarthome_gladys__hostname: "{{ gladys_hostname | mandatory }}"
smarthome_gladys__timezone: "{{ gladys_timezone | mandatory }}"
smarthome_gladys__labels: "{{ gladys_labels | default('') }}"

smarthome_gladys__version: "{{ gladys_version | default('v4') }}"

smarthome_gladys__container: "{{ smarthome_gladys__container_default | combine(gladys_container | default({})) }}"

smarthome_gladys__autoupdate_enabled: "{{ gladys_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

smarthome_gladys__podman_name: 'gladys'
smarthome_gladys__podman_image: 'docker.io/gladysassistant/gladys'
smarthome_gladys__podman_tag: "{{ smarthome_gladys__version }}"

smarthome_gladys__podman_home: "{{ smarthome_gladys__home }}"

smarthome_gladys__data_dir: '/var/lib/gladysassistant'

smarthome_gladys__container_default:
  name: "{{ smarthome_gladys__podman_name }}"
  hostname: "{{ smarthome_gladys__hostname }}"
  image: "{{ smarthome_gladys__podman_image }}:{{ smarthome_gladys__podman_tag }}"
  ip: "{{ smarthome_gladys__ip }}"
  ipv6: "{{ smarthome_gladys__ipv6 }}"
  network: "{{ smarthome_gladys__network }}"
  timezone: "{{ smarthome_gladys__timezone }}"
  environment:
    TZ: "{{ smarthome_gladys__timezone }}"
    SQLITE_FILE_PATH: "{{ smarthome_gladys__data_dir }}/gladys-production.db"
  labels: "{{ smarthome_gladys__labels }}"
  volumes:
    - "{{ smarthome_gladys__podman_home }}:{{ smarthome_gladys__data_dir }}"
