---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks:
      - "{{ app_wallos__test_network }}"
    podman_default_network: "{{ app_wallos__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    # verify signs in with curl, it keeps the cookie of the session in a file
    - name: 'Install curl'
      ansible.builtin.apt:
        name: [ 'curl' ]
        state: 'present'
        update_cache: true

    - name: 'Pull the image, so the first start of the service does not time out'
      containers.podman.podman_image:
        name: "{{ app_wallos__test_image }}"
      register: 'app_wallos__test_pull'
      until: app_wallos__test_pull is succeeded
      retries: 5
      delay: 30
