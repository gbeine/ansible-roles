---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_wallos__test_case: "{{ app_wallos__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    app_wallos__expect: "{{ app_wallos__test_case.expect }}"
    app_wallos__test_admin: "{{ app_wallos__test_case.role_vars.wallos_admin }}"
    app_wallos__test_url: "http://{{ app_wallos__expect.ip }}"
    app_wallos__test_cookies: '/tmp/wallos-molecule-cookies'

  tasks:

    - name: 'Read the generated quadlet unit'
      ansible.builtin.slurp:
        src: "{{ app_wallos__test_quadlet_path }}"
      register: 'app_wallos__test_quadlet'

    # podman may quote values, the quotes are removed before the lines are compared
    - name: 'Assert the quadlet unit'
      ansible.builtin.assert:
        that:
          - ('Image=' + app_wallos__test_image) in app_wallos__test_quadlet_lines
          - ('IP=' + app_wallos__expect.ip) in app_wallos__test_quadlet_lines
          - app_wallos__expect.ip6 is none or ('IP6=' + app_wallos__expect.ip6) in app_wallos__test_quadlet_lines
          - app_wallos__expect.ip6 is not none or app_wallos__test_quadlet_lines | select('match', 'IP6=') | list | length == 0
          - ('Environment=TZ=' + app_wallos__test_case.role_vars.wallos_timezone) in app_wallos__test_quadlet_lines
          - app_wallos__expect.quadlet | reject('in', app_wallos__test_quadlet_lines) | list | length == 0
          # The time zone is set with TZ, /etc/localtime is not mounted
          - app_wallos__test_quadlet_lines | select('search', '/etc/localtime|/etc/timezone') | list | length == 0
          # The secrets are mounted as files, never passed in the environment
          - app_wallos__test_quadlet_lines | select('search', 'type=env') | list | length == 0
          - app_wallos__test_quadlet_lines | select('match', 'Environment=OIDC_CLIENT_SECRET=') | list | length == 0
        fail_msg: "{{ app_wallos__test_quadlet_lines | to_json }}"
      vars:
        app_wallos__test_quadlet_lines: "{{ (app_wallos__test_quadlet.content | b64decode | regex_replace('\"', '')).splitlines() }}"

    - name: 'Read the state of the service'
      ansible.builtin.command:
        argv: [ 'systemctl', 'is-active', 'wallos' ]
      register: 'app_wallos__test_service'
      changed_when: false
      failed_when: false

    - name: 'Read the environment of the container'
      ansible.builtin.command:
        argv: [ 'podman', 'inspect', '--format', '{{ "{{" }} json .Config.Env {{ "}}" }}', 'wallos' ]
      register: 'app_wallos__test_env'
      changed_when: false

    - name: 'Read the directories of Wallos'
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ app_wallos__test_case.role_vars.wallos_home }}/db"
        - "{{ app_wallos__test_case.role_vars.wallos_home }}/logos"
      register: 'app_wallos__test_dirs'

    # startup.sh sets www-data to PUID and PGID, the database belongs to it
    - name: 'Read the owner of the database in the container'
      ansible.builtin.command:
        argv: [ 'podman', 'exec', 'wallos', 'stat', '-c', '%u:%g', '/var/www/html/db/wallos.db' ]
      register: 'app_wallos__test_db_owner'
      changed_when: false

    - name: 'Assert the service, the environment and the owners'
      ansible.builtin.assert:
        that:
          - app_wallos__test_service.stdout == 'active'
          - ('TZ=' + app_wallos__test_case.role_vars.wallos_timezone) in (app_wallos__test_env.stdout | from_json)
          - (app_wallos__test_env.stdout | from_json) | select('match', 'OIDC_CLIENT_SECRET=') | list | length == 0
          - app_wallos__test_dirs.results | map(attribute='stat.uid') | unique | list == [ app_wallos__expect.uid ]
          - app_wallos__test_dirs.results | map(attribute='stat.gid') | unique | list == [ app_wallos__expect.uid ]
          - app_wallos__test_db_owner.stdout == (app_wallos__expect.uid | string) ~ ':' ~ (app_wallos__expect.uid | string)
        fail_msg: >-
          service {{ app_wallos__test_service.stdout }}, environment {{ app_wallos__test_env.stdout }},
          directories {{ app_wallos__test_dirs.results | map(attribute='stat.uid') | list }}, database {{ app_wallos__test_db_owner.stdout }}

    - name: 'Wait until Wallos answers'
      ansible.builtin.uri:
        url: "{{ app_wallos__test_url }}/health.php"
        return_content: true
      register: 'app_wallos__test_health'
      until: (app_wallos__test_health.content | default('') | trim) == 'OK'
      retries: 30
      delay: 2

    # The administrator exists, Wallos closes the registration
    - name: 'Request the registration'
      ansible.builtin.command:
        argv: [ 'curl', '-s', '-o', '/dev/null', '-w', '%{http_code} %{redirect_url}', "{{ app_wallos__test_url }}/registration.php" ]
      register: 'app_wallos__test_registration'
      changed_when: false

    - name: 'Read the login page'
      ansible.builtin.uri:
        url: "{{ app_wallos__test_url }}/login.php"
        return_content: true
      register: 'app_wallos__test_login_page'

    # The password is passed on stdin, curl reads it with password@-
    - name: 'Log in as the administrator'
      ansible.builtin.command:
        argv:
          - 'curl'
          - '-s'
          - '-c'
          - "{{ app_wallos__test_cookies }}"
          - '-o'
          - '/dev/null'
          - '-w'
          - '%{http_code} %{redirect_url}'
          - '--data-urlencode'
          - "username={{ app_wallos__test_admin.username }}"
          - '--data-urlencode'
          - 'password@-'
          - "{{ app_wallos__test_url }}/login.php"
        stdin: "{{ app_wallos__expect.password }}"
        stdin_add_newline: false
      register: 'app_wallos__test_login'
      changed_when: false

    # admin.php redirects users that are not the administrator
    - name: 'Read the administration page with the session'
      ansible.builtin.command:
        argv: [ 'curl', '-s', '-b', "{{ app_wallos__test_cookies }}", '-w', '\n%{http_code}', "{{ app_wallos__test_url }}/admin.php" ]
      register: 'app_wallos__test_admin_page'
      changed_when: false

    - name: 'Remove the cookies of the session'
      ansible.builtin.file:
        path: "{{ app_wallos__test_cookies }}"
        state: 'absent'

    - name: 'Assert the closed registration and the login of the administrator'
      ansible.builtin.assert:
        that:
          - app_wallos__test_registration.stdout is match('^302 .*/login\.php')
          - app_wallos__test_login.stdout is match('^302 ')
          - app_wallos__test_login.stdout is not search('login\.php|totp\.php')
          - app_wallos__test_admin_page.stdout_lines | last == '200'
        fail_msg: >-
          registration {{ app_wallos__test_registration.stdout }}, login {{ app_wallos__test_login.stdout }},
          administration page {{ app_wallos__test_admin_page.stdout_lines | last }}

    # The login with OIDC is only shown if the variables reach PHP-FPM,
    # the administration page shows the fields managed by the environment and the notes about the secret file
    - name: 'Assert the login with OIDC and the client secret file'
      ansible.builtin.assert:
        that:
          - (app_wallos__test_login_page.content is search('https://sso\.example\.org/authorize')) == app_wallos__expect.oidc
          - not app_wallos__expect.oidc or app_wallos__test_admin_page.stdout is search('data-managed-by="OIDC_CLIENT_SECRET_FILE"')
          # Wallos shows the client secret read from the file, after side_effect the changed one
          - not app_wallos__expect.oidc or app_wallos__test_admin_page.stdout is search('value="' ~ app_wallos__expect.client_secret ~ '"')
          - app_wallos__test_admin_page.stdout is not search('secret file is not readable')
        fail_msg: >-
          OIDC on the login page {{ app_wallos__test_login_page.content is search('https://sso\.example\.org/authorize') }},
          secret file managed {{ app_wallos__test_admin_page.stdout is search('data-managed-by="OIDC_CLIENT_SECRET_FILE"') }},
          not readable {{ app_wallos__test_admin_page.stdout is search('secret file is not readable') }}
