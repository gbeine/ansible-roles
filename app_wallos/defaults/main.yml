---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/app-wallos
#

app_wallos__home: "{{ wallos_home | mandatory }}"
app_wallos__ip: "{{ wallos_ip | mandatory }}"
app_wallos__ipv6: "{{ wallos_ipv6 }}"
app_wallos__network: "{{ wallos_network | mandatory }}"
app_wallos__hostname: "{{ wallos_hostname | mandatory }}"
app_wallos__timezone: "{{ wallos_timezone | mandatory }}"
app_wallos__labels: "{{ wallos_labels }}"

app_wallos__version: "{{ wallos_version | default('latest') }}"

app_wallos__container: "{{ app_wallos__podman_container_default | combine(wallos_container | default({})) }}"

# The configuration of Wallos, merged over the default, e.g. PUID, PGID, SSRF_ALLOWLIST and OIDC_*
app_wallos__environment: "{{ app_wallos__environment_default | combine(wallos_environment | default({})) }}"

# Secrets with name, data and target, they are mounted below /run/secrets and the role sets the file variable of the target
app_wallos__secrets: "{{ wallos_secrets | default([]) }}"

# The administrator of Wallos with username, email and password, language and currency are optional
app_wallos__admin: "{{ wallos_admin | mandatory }}"

app_wallos__autoupdate_enabled: "{{ wallos_autoupdate_enabled | default(false) }}"
app_wallos__autoupdate_schedule: "{{ wallos_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_wallos__environment_default:
  TZ: "{{ app_wallos__timezone }}"

# startup.sh of the image sets the user www-data to PUID and PGID (82 by default) and owns db and logos by it
app_wallos__uid: "{{ app_wallos__environment.PUID | default(82) }}"
app_wallos__gid: "{{ app_wallos__environment.PGID | default(82) }}"
app_wallos__id_variables: [ 'PUID', 'PGID' ]

# nginx of the image serves HTTP on port 80, /health.php answers OK
app_wallos__port: 80

# Wallos reads these values as booleans (wallos_parse_oidc_boolean), the role allows true and false
app_wallos__environment_booleans:
  - 'OIDC_AUTO_CREATE_USER'
  - 'OIDC_DISABLE_PASSWORD_LOGIN'
  - 'OIDC_ENABLED'
  - 'OIDC_REQUIRE_EMAIL_VERIFIED'

app_wallos__secrets_dir: '/run/secrets'

# The secrets mounted as files, Wallos reads the target from the file variable (includes/oidc_settings.php of Wallos v5.11.1)
app_wallos__secret_files:
  OIDC_CLIENT_SECRET: 'OIDC_CLIENT_SECRET_FILE'

# The targets of the secrets, they must not be set in wallos_environment
app_wallos__secret_variables: "{{ app_wallos__secret_files.keys() | list }}"

# Generated from startup.sh, endpoints/cronjobs/settimezone.php, includes/oidc_settings.php and includes/ssrf_helper.php of Wallos v5.11.1
# without the secrets and DEMO_MODE, the demo mode makes the instance a demo, update with new versions of the image
app_wallos__environment_allowed:
  - 'TZ'
  - 'PUID'
  - 'PGID'
  - 'SSRF_ALLOWLIST'
  - 'OIDC_AUTH_URL'
  - 'OIDC_AUTO_CREATE_USER'
  - 'OIDC_CLIENT_ID'
  - 'OIDC_DISABLE_PASSWORD_LOGIN'
  - 'OIDC_ENABLED'
  - 'OIDC_ISSUER'
  - 'OIDC_LOGOUT_URL'
  - 'OIDC_PROVIDER_NAME'
  - 'OIDC_REDIRECT_URL'
  - 'OIDC_REQUIRE_EMAIL_VERIFIED'
  - 'OIDC_SCOPES'
  - 'OIDC_TOKEN_URL'
  - 'OIDC_USER_IDENTIFIER'
  - 'OIDC_USERINFO_URL'
  # The file variables of the secrets, set by the role
  - 'OIDC_CLIENT_SECRET_FILE'

# The administrator, Wallos passes usernames through htmlentities, the pattern keeps them unchanged
app_wallos__admin_keys: [ 'username', 'email', 'password', 'language', 'currency' ]
app_wallos__admin_name_pattern: '^[A-Za-z0-9._@-]+$'
app_wallos__admin_email_pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]+$'
# The preselection of the registration form of Wallos
app_wallos__admin_default:
  language: 'en'
  currency: 'EUR'

# Generated from includes/i18n/languages.php of Wallos v5.11.1
app_wallos__admin_languages:
  - 'en'
  - 'ar'
  - 'az'
  - 'ca'
  - 'cs'
  - 'da'
  - 'de'
  - 'el'
  - 'es'
  - 'fr'
  - 'hu'
  - 'id'
  - 'it'
  - 'ja'
  - 'jp'
  - 'ko'
  - 'nl'
  - 'pl'
  - 'pt'
  - 'pt_br'
  - 'ro'
  - 'ru'
  - 'sl'
  - 'sr'
  - 'sr_lat'
  - 'tr'
  - 'uk'
  - 'vi'
  - 'zh_cn'
  - 'zh_tw'

# Generated from the currencies of registration.php of Wallos v5.11.1
app_wallos__admin_currencies:
  - 'AUD'
  - 'BGN'
  - 'BRL'
  - 'CAD'
  - 'CHF'
  - 'CNY'
  - 'CZK'
  - 'DKK'
  - 'EUR'
  - 'GBP'
  - 'HKD'
  - 'HUF'
  - 'IDR'
  - 'ILS'
  - 'INR'
  - 'ISK'
  - 'JPY'
  - 'KRW'
  - 'MXN'
  - 'MYR'
  - 'NOK'
  - 'NZD'
  - 'PHP'
  - 'PLN'
  - 'RON'
  - 'RUB'
  - 'SEK'
  - 'SGD'
  - 'THB'
  - 'TRY'
  - 'TWD'
  - 'UAH'
  - 'USD'
  - 'ZAR'

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
app_wallos__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if app_wallos__secrets is sequence and app_wallos__secrets is not string and app_wallos__secrets is not mapping -%}
  {%-   for secret in app_wallos__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in app_wallos__secret_files -%}
  {%-     set _ = environment.update({ app_wallos__secret_files[secret.target]: app_wallos__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The environment of the container, booleans in lower case
app_wallos__environment_container: >-
  {%- set environment = {} -%}
  {%- for key, value in app_wallos__environment.items() -%}
  {%-   set _ = environment.update({ key: (value | string | lower) if value is boolean else value }) -%}
  {%- endfor -%}
  {{ environment | combine(app_wallos__environment_secrets_files) }}

# The podman secrets of wallos_secrets, entries without name or target are left out, the validation of the secrets reports them
app_wallos__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- if app_wallos__secrets is sequence and app_wallos__secrets is not string and app_wallos__secrets is not mapping -%}
  {%-   for secret in app_wallos__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ app_wallos__secrets_dir ~ '/' ~ secret.name) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ secrets }}

app_wallos__podman_name: 'wallos'
app_wallos__podman_image: 'docker.io/bellamy/wallos'
app_wallos__podman_tag: "{{ app_wallos__version }}"

app_wallos__podman_home: "{{ app_wallos__home }}"
app_wallos__podman_db_dir: "{{ app_wallos__podman_home }}/db"
app_wallos__podman_logos_dir: "{{ app_wallos__podman_home }}/logos"

app_wallos__podman_container_default:
  name: "{{ app_wallos__podman_name }}"
  hostname: "{{ app_wallos__hostname }}"
  image: "{{ app_wallos__podman_image }}:{{ app_wallos__podman_tag }}"
  ip: "{{ app_wallos__ip }}"
  ipv6: "{{ app_wallos__ipv6 | default(omit) }}"
  network: "{{ app_wallos__network }}"
  timezone: "{{ app_wallos__timezone }}"
  # Set with wallos_environment and wallos_secrets, merged over the default
  environment: "{{ app_wallos__environment_container }}"
  labels: "{{ app_wallos__labels | default(omit) }}"
  secrets: "{{ app_wallos__podman_secrets if app_wallos__podman_secrets | length > 0 else omit }}"
  # wallos_container.volumes replaces the list completely
  volumes:
    - "{{ app_wallos__podman_db_dir }}:/var/www/html/db"
    - "{{ app_wallos__podman_logos_dir }}:/var/www/html/images/uploads/logos"
