---

- name: 'Install pass'
  tags: [ 'security', 'security_pass' ]
  block:

    # A failing template in the variables (e.g. pass_environment or pass_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          - security_pass__container | length > 0
          - security_pass__environment | length > 0
        quiet: true

    - name: 'Validate the configuration'
      ansible.builtin.assert:
        that:
          - security_pass__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ security_pass__errors | join(' ') }}"
        quiet: true
      vars:
        security_pass__former: >-
          {{ security_pass__former_variables | dict2items
             | selectattr('key', 'in', query('ansible.builtin.varnames', '^(' ~ (security_pass__former_variables.keys() | join('|')) ~ ')$')) | list }}
        security_pass__errors: >-
          {%- set errors = [] -%}
          {%- for former in security_pass__former -%}
          {%-   set _ = errors.append(former.value ~ ': ' ~ former.key ~ '.') -%}
          {%- endfor -%}
          {%- set lines = security_pass__environment | dict2items | selectattr('value', 'string') | selectattr('value', 'search', '[\r\n]')
                          | map(attribute='key') | list -%}
          {%- if lines | length > 0 -%}
          {%-   set _ = errors.append('Values of pass_environment must not contain line breaks: ' ~ (lines | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if security_pass__autoupdate_enabled is not boolean -%}
          {%-   set _ = errors.append('pass_autoupdate_enabled has to be a boolean.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment of the container after merging pass_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables'
      when: security_pass__container.environment | default(none) is mapping
      ansible.builtin.assert:
        that:
          - security_pass__unknown | length == 0
        fail_msg: >-
          Unknown environment variables: {{ security_pass__unknown | join(', ') }}.
          Allowed are {{ security_pass__environment_allowed | join(', ') }}.
        quiet: true
      vars:
        security_pass__unknown: >-
          {{ security_pass__container.environment.keys() | map('string') | reject('in', security_pass__environment_allowed) | list }}

    - name: 'Create directories'
      ansible.builtin.file:
        path: "{{ security_pass__podman_home }}"
        mode: '0700'
        state: 'directory'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ security_pass__container.name }}"
        hostname: "{{ security_pass__container.hostname }}"
        image: "{{ security_pass__container.image }}"
        network: "{{ security_pass__container.network }}"
        timezone: "{{ security_pass__container.timezone }}"
        env: "{{ security_pass__container.environment | default(omit) }}"
        etc_hosts: "{{ security_pass__container.etc_hosts | default(omit) }}"
        volume: "{{ security_pass__container.volumes | default(omit) }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if security_pass__container.requires is defined %}
          Requires={{ security_pass__container.requires | join(' ') }}
          {% endif %}
          {% if security_pass__container.wants is defined %}
          Wants={{ security_pass__container.wants | join(' ') }}
          {% endif %}
          {% if security_pass__container.after is defined %}
          After={{ security_pass__container.after | join(' ') }}
          {% endif %}
          {% if security_pass__container.part_of is defined %}
          PartOf={{ security_pass__container.part_of | join(' ') }}
          {% endif %}
          {% if security_pass__container.binds_to is defined %}
          BindsTo={{ security_pass__container.binds_to | join(' ') }}
          {% endif %}
          {% if security_pass__container.requires_mounts_for is defined %}
          RequiresMountsFor={{ security_pass__container.requires_mounts_for | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'security_pass__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ security_pass__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if security_pass__restart | bool else 'started' }}"
        enabled: true
      vars:
        security_pass__running: >-
          {{ (ansible_facts.services[security_pass__container.name + '.service'].state | default('')) == 'running' }}
        security_pass__restart: "{{ security_pass__running | bool and security_pass__quadlet_result is changed }}"
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'security_pass__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ security_pass__container.name }}"
        container_image: "{{ security_pass__container.image }}"
        container_schedule: "{{ security_pass__autoupdate_schedule }}"
