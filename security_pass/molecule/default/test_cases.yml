---
# Network created by container_podman in prepare.yml, pass itself has no network
security_pass__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24

security_pass__test_image: 'c0d3.sh/container/pass-docker:latest'

security_pass__test_vars:
  pass_home: '/opt/pass-molecule'
  pass_hostname: 'pass-molecule'
  pass_timezone: 'Europe/Berlin'
  pass_environment:
    GNUPAGENT_MAX_CACHE_TTL: '3600'

# Environment changed in side_effect.yml, the running service must be restarted
security_pass__test_side_effect_ttl: '7200'
