---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/security-pass
#

security_pass__home: "{{ pass_home | mandatory }}"
security_pass__hostname: "{{ pass_hostname | mandatory }}"
security_pass__timezone: "{{ pass_timezone | mandatory }}"

security_pass__container: "{{ security_pass__podman_container_default | combine(pass_container | default({})) }}"

#
# podman defaults
#

security_pass__uid: 1000
security_pass__gid: "{{ security_pass__uid }}"

security_pass__podman_name: 'pass'
security_pass__podman_image: 'c0d3.sh/container/pass-docker'
security_pass__podman_tag: 'latest'

security_pass__podman_home: "{{ security_pass__home }}"

security_pass__podman_container_default:
  name: "{{ security_pass__podman_name }}"
  hostname: "{{ security_pass__hostname }}"
  image: "{{ security_pass__podman_image }}:{{ security_pass__podman_tag }}"
  timezone: "{{ security_pass__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ security_pass__podman_home }}:/config"
