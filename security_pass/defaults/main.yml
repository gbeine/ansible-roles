---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/security-pass
#

security_pass__home: "{{ pass_home | mandatory }}"
security_pass__hostname: "{{ pass_hostname | mandatory }}"
security_pass__timezone: "{{ pass_timezone | mandatory }}"

security_pass__version: "{{ pass_version | default('latest') }}"

# User and group of the files in /config, passed as PUID and PGID to the linuxserver base image
security_pass__uid: "{{ pass_uid | default(911) }}"
security_pass__gid: "{{ pass_gid | default(security_pass__uid) }}"

security_pass__environment: "{{ security_pass__environment_default | combine(pass_environment | default({})) }}"

security_pass__container: "{{ security_pass__podman_container_default | combine(pass_container | default({})) }}"

security_pass__autoupdate_enabled: "{{ pass_autoupdate_enabled | default(false) }}"
security_pass__autoupdate_schedule: "{{ pass_autoupdate_schedule }}"

#
# Defaults - do not change
#

security_pass__environment_default:
  PUID: "{{ security_pass__uid | string }}"
  PGID: "{{ security_pass__gid | string }}"

security_pass__podman_name: 'pass'
security_pass__podman_image: 'c0d3.sh/container/pass-docker'
security_pass__podman_tag: "{{ security_pass__version }}"

security_pass__podman_home: "{{ security_pass__home }}"

security_pass__podman_container_default:
  name: "{{ security_pass__podman_name }}"
  hostname: "{{ security_pass__hostname }}"
  image: "{{ security_pass__podman_image }}:{{ security_pass__podman_tag }}"
  network: 'none'
  timezone: "{{ security_pass__timezone }}"
  environment: "{{ security_pass__environment }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ security_pass__podman_home }}:/config"
