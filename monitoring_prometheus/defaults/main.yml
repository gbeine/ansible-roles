---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-prometheus
#

monitoring_prometheus__home: "{{ prometheus_home | mandatory }}"
monitoring_prometheus__ip: "{{ prometheus_ip | mandatory }}"
monitoring_prometheus__ipv6: "{{ prometheus_ipv6 }}"
monitoring_prometheus__network: "{{ prometheus_network | mandatory }}"
monitoring_prometheus__hostname: "{{ prometheus_hostname | mandatory }}"
monitoring_prometheus__timezone: "{{ prometheus_timezone | mandatory }}"
monitoring_prometheus__labels: "{{ prometheus_labels }}"

monitoring_prometheus__version: "{{ prometheus_version | default('latest') }}"

monitoring_prometheus__environment: "{{ monitoring_prometheus__environment_default | combine(prometheus_environment | default({})) }}"

# Files below /run/secrets in the container, e.g. for password_file or bearer_token_file in the configuration
monitoring_prometheus__secrets: "{{ prometheus_secrets | default([]) }}"

# prometheus.yml, every key replaces the key of the default (the prometheus.yml of the image)
monitoring_prometheus__config: "{{ monitoring_prometheus__config_default | combine(prometheus_config | default({})) }}"

# Rule files, the name of the file without .yml and its content, the role adds them to rule_files
monitoring_prometheus__rules: "{{ prometheus_rules | default({}) }}"

monitoring_prometheus__container: "{{ monitoring_prometheus__podman_container_default | combine(prometheus_container | default({})) }}"

monitoring_prometheus__autoupdate_enabled: "{{ prometheus_autoupdate_enabled | default(false) }}"
monitoring_prometheus__autoupdate_schedule: "{{ prometheus_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_prometheus__etc_dir: '/etc/prometheus'
monitoring_prometheus__rules_dir: "{{ monitoring_prometheus__etc_dir }}/rules"
monitoring_prometheus__data_dir: '/prometheus'
monitoring_prometheus__secrets_dir: '/run/secrets'

# User and group nobody of the image
monitoring_prometheus__uid: 65534
monitoring_prometheus__gid: 65534

monitoring_prometheus__environment_default:
  TZ: "{{ monitoring_prometheus__timezone }}"

# documentation/examples/prometheus.yml of the image without comments and empty keys
monitoring_prometheus__config_default:
  global:
    scrape_interval: '15s'
    evaluation_interval: '15s'
  scrape_configs:
    - job_name: 'prometheus'
      static_configs:
        - targets: [ 'localhost:9090' ]
          labels:
            app: 'prometheus'
      scrape_native_histograms: true

# Names of rule files and secrets
monitoring_prometheus__name_pattern: '^[A-Za-z0-9._-]+$'

monitoring_prometheus__podman_name: 'prometheus'
monitoring_prometheus__podman_image: 'docker.io/prom/prometheus'
monitoring_prometheus__podman_tag: "{{ monitoring_prometheus__version }}"

monitoring_prometheus__podman_home: "{{ monitoring_prometheus__home }}"
monitoring_prometheus__podman_config_file: "{{ monitoring_prometheus__podman_home }}/prometheus.yml"
monitoring_prometheus__podman_rules_dir: "{{ monitoring_prometheus__podman_home }}/rules"
monitoring_prometheus__podman_data_dir: "{{ monitoring_prometheus__podman_home }}/data"

monitoring_prometheus__podman_container_default:
  name: "{{ monitoring_prometheus__podman_name }}"
  hostname: "{{ monitoring_prometheus__hostname }}"
  image: "{{ monitoring_prometheus__podman_image }}:{{ monitoring_prometheus__podman_tag }}"
  ip: "{{ monitoring_prometheus__ip }}"
  ipv6: "{{ monitoring_prometheus__ipv6 | default(omit) }}"
  network: "{{ monitoring_prometheus__network }}"
  timezone: "{{ monitoring_prometheus__timezone }}"
  environment: "{{ monitoring_prometheus__environment }}"
  labels: "{{ monitoring_prometheus__labels | default(omit) }}"
  # The flags of the image, prometheus_container.command replaces them completely
  command:
    - "--config.file={{ monitoring_prometheus__etc_dir }}/prometheus.yml"
    - "--storage.tsdb.path={{ monitoring_prometheus__data_dir }}"
  secrets: >-
    {{ (monitoring_prometheus__secrets | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ monitoring_prometheus__secrets_dir ~ '/\1') | list)
      if (monitoring_prometheus__secrets | default([]) | length > 0)
      else omit }}
  # prometheus_container.volumes replaces them completely
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ monitoring_prometheus__podman_config_file }}:{{ monitoring_prometheus__etc_dir }}/prometheus.yml:ro"
    - "{{ monitoring_prometheus__podman_rules_dir }}:{{ monitoring_prometheus__rules_dir }}:ro"
    - "{{ monitoring_prometheus__podman_data_dir }}:{{ monitoring_prometheus__data_dir }}"
