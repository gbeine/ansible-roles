---
# Network created by container_podman in prepare.yml
app_karakeep__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_karakeep__test_image: 'ghcr.io/karakeep-app/karakeep:release'
app_karakeep__test_quadlet_path: '/etc/containers/systemd/karakeep.container'

# Meilisearch and the Chrome of Karakeep, deployed by prepare.yml with their roles on molecule-karakeep, test credentials only
app_karakeep__test_meilisearch:
  ip: '10.89.0.20'
  master_key: 'molecule-meilisearch-master-key'
app_karakeep__test_chrome:
  ip: '10.89.0.21'

app_karakeep__test_cases:

  # Only the mandatory variables, without Meilisearch and Chrome
  - name: 'molecule-karakeep-default'
    role_vars:
      karakeep_home: '/opt/karakeep'
      karakeep_ip: '10.89.0.100'
      karakeep_network: 'podman-molecule'
      karakeep_hostname: 'karakeep-default'
      karakeep_timezone: 'Europe/Berlin'
      karakeep_environment:
        NEXTAUTH_URL: 'http://10.89.0.100:3000'
      karakeep_secrets:
        - name: 'karakeep_nextauth_secret'
          data: 'molecule-nextauth-secret-default'
          target: 'NEXTAUTH_SECRET'
      karakeep_admin:
        name: 'Molecule Admin'
        email: 'admin@molecule.test'
        password: 'molecule-admin-password'
    services: false
    expect:
      ip: '10.89.0.100'
      ip6: ~
      admin:
        name: 'Molecule Admin'
        email: 'admin@molecule.test'
        password: 'molecule-admin-password'
      quadlet:
        - 'Secret=karakeep_nextauth_secret,type=env,target=NEXTAUTH_SECRET'
        - 'Volume=/opt/karakeep/data:/data:Z'
      env:
        - 'TZ=Europe/Berlin'
        - 'DATA_DIR=/data'
        - 'NEXTAUTH_URL=http://10.89.0.100:3000'

  # IPv6, labels, Meilisearch, Chrome and booleans
  - name: 'molecule-karakeep'
    role_vars:
      karakeep_home: '/opt/karakeep'
      karakeep_ip: '10.89.0.101'
      karakeep_ipv6: 'fd00:89::101'
      karakeep_network: 'podman-molecule'
      karakeep_hostname: 'karakeep-molecule'
      karakeep_timezone: 'Europe/Berlin'
      karakeep_labels:
        traefik.enable: 'true'
      karakeep_environment:
        NEXTAUTH_URL: 'http://10.89.0.101:3000'
        MEILI_ADDR: 'http://10.89.0.20:7700'
        BROWSER_WEB_URL: 'http://10.89.0.21:9222'
        DISABLE_SIGNUPS: true
        CRAWLER_STORE_SCREENSHOT: false
      karakeep_secrets:
        - name: 'karakeep_nextauth_secret'
          data: 'molecule-nextauth-secret'
          target: 'NEXTAUTH_SECRET'
        - name: 'karakeep_meili_master_key'
          data: 'molecule-meilisearch-master-key'
          target: 'MEILI_MASTER_KEY'
      karakeep_admin:
        name: 'Molecule Admin'
        email: 'admin@molecule.test'
        password: 'molecule-admin-password'
    services: true
    side_effect:
      environment:
        NEXTAUTH_URL: 'http://10.89.0.101:3000'
        MEILI_ADDR: 'http://10.89.0.20:7700'
        BROWSER_WEB_URL: 'http://10.89.0.21:9222'
        DISABLE_SIGNUPS: true
        CRAWLER_STORE_SCREENSHOT: true
      admin:
        name: 'Molecule Librarian'
        email: 'admin@molecule.test'
        password: 'molecule-admin-changed'
    expect:
      ip: '10.89.0.101'
      ip6: 'fd00:89::101'
      admin:
        name: 'Molecule Librarian'
        email: 'admin@molecule.test'
        password: 'molecule-admin-changed'
        former_password: 'molecule-admin-password'
      quadlet:
        - 'Secret=karakeep_nextauth_secret,type=env,target=NEXTAUTH_SECRET'
        - 'Secret=karakeep_meili_master_key,type=env,target=MEILI_MASTER_KEY'
        - 'Label=traefik.enable=true'
      env:
        - 'TZ=Europe/Berlin'
        - 'DATA_DIR=/data'
        - 'NEXTAUTH_URL=http://10.89.0.101:3000'
        - 'MEILI_ADDR=http://10.89.0.20:7700'
        - 'BROWSER_WEB_URL=http://10.89.0.21:9222'
        - 'DISABLE_SIGNUPS=true'
        - 'CRAWLER_STORE_SCREENSHOT=true'
