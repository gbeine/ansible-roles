---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/app-karakeep
#

app_karakeep__home: "{{ karakeep_home | mandatory }}"
app_karakeep__ip: "{{ karakeep_ip | mandatory }}"
app_karakeep__ipv6: "{{ karakeep_ipv6 }}"
app_karakeep__network: "{{ karakeep_network | mandatory }}"
app_karakeep__hostname: "{{ karakeep_hostname | mandatory }}"
app_karakeep__timezone: "{{ karakeep_timezone | mandatory }}"
app_karakeep__labels: "{{ karakeep_labels }}"

app_karakeep__version: "{{ karakeep_version | default('release') }}"

app_karakeep__container: "{{ app_karakeep__podman_container_default | combine(karakeep_container | default({})) }}"

# The configuration of Karakeep, merged over the default, NEXTAUTH_URL is mandatory,
# MEILI_ADDR connects Meilisearch (app_meilisearch) and BROWSER_WEB_URL the Chrome (app_karakeep_chrome)
app_karakeep__environment: "{{ app_karakeep__environment_default | combine(karakeep_environment | default({})) }}"

# Secrets with name, data and target, NEXTAUTH_SECRET is mandatory
app_karakeep__secrets: "{{ karakeep_secrets | default([]) }}"

# The administrator of Karakeep with name, email and password
app_karakeep__admin: "{{ karakeep_admin | mandatory }}"

app_karakeep__autoupdate_enabled: "{{ karakeep_autoupdate_enabled | default(false) }}"
app_karakeep__autoupdate_schedule: "{{ karakeep_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_karakeep__podman_name: 'karakeep'
app_karakeep__podman_image: 'ghcr.io/karakeep-app/karakeep'
app_karakeep__port: 3000

app_karakeep__environment_default:
  TZ: "{{ app_karakeep__timezone }}"

# NEXTAUTH_URL is the public URL of Karakeep, it is used in links, emails and the checks of the origin
app_karakeep__environment_required: [ 'NEXTAUTH_URL' ]

# Set by the role, the compose file of Karakeep says: DON'T CHANGE THIS
app_karakeep__environment_role:
  DATA_DIR: '/data'

# NEXTAUTH_SECRET signs the sessions
app_karakeep__secrets_required: [ 'NEXTAUTH_SECRET' ]

# Meilisearch needs its address and its master key
app_karakeep__meilisearch_pair: [ 'MEILI_ADDR', 'MEILI_MASTER_KEY' ]

# The environment of the container, booleans in lower case, Karakeep only accepts true and false
app_karakeep__environment_container: >-
  {%- set environment = {} -%}
  {%- for key, value in (app_karakeep__environment | combine(app_karakeep__environment_role)).items() -%}
  {%-   set _ = environment.update({ key: (value | string | lower) if value is boolean else value }) -%}
  {%- endfor -%}
  {{ environment }}

app_karakeep__admin_keys: [ 'name', 'email', 'password' ]
app_karakeep__admin_email_pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
# The limits of packages/shared/types/users.ts of Karakeep v0.34.1
app_karakeep__admin_name_length: 128
app_karakeep__password_length_min: 8
app_karakeep__password_length_max: 128

app_karakeep__podman_container_default:
  name: "{{ app_karakeep__podman_name }}"
  hostname: "{{ app_karakeep__hostname }}"
  image: "{{ app_karakeep__podman_image }}:{{ app_karakeep__version }}"
  ip: "{{ app_karakeep__ip }}"
  ipv6: "{{ app_karakeep__ipv6 | default(omit) }}"
  network: "{{ app_karakeep__network }}"
  timezone: "{{ app_karakeep__timezone }}"
  labels: "{{ app_karakeep__labels | default(omit) }}"
  # Set with karakeep_environment, merged over the default
  environment: "{{ app_karakeep__environment_container }}"
  volumes:
    - "{{ app_karakeep__home }}/data:/data:Z"
  # Karakeep reads the secrets only from the environment,
  # entries without name or target are left out, the validation of the secrets reports them
  secrets: >-
    {{ (app_karakeep__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='name')
        | zip(app_karakeep__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='target'))
        | map('join', ',type=env,target=') | list)
      if (app_karakeep__secrets is sequence and app_karakeep__secrets is not string and app_karakeep__secrets | length > 0)
      else omit }}

# Targets of the secrets in karakeep_secrets, Karakeep reads them only from the environment
app_karakeep__secrets_allowed:
  - 'NEXTAUTH_SECRET'
  - 'MEILI_MASTER_KEY'
  - 'MEILI_VECTOR_MASTER_KEY'
  - 'OPENAI_API_KEY'
  - 'EMBEDDING_OPENAI_API_KEY'
  - 'SMTP_PASSWORD'
  - 'OAUTH_CLIENT_SECRET'
  - 'ASSET_STORE_S3_SECRET_ACCESS_KEY'
  - 'STRIPE_SECRET_KEY'
  - 'STRIPE_WEBHOOK_SECRET'
  - 'TURNSTILE_SECRET_KEY'
  - 'PROMETHEUS_AUTH_TOKEN'

app_karakeep__secret_variables: "{{ app_karakeep__secrets_allowed }}"

# The stringBool and optionalStringBool fields of packages/shared/config.ts of Karakeep v0.34.1, only true and false are valid
app_karakeep__environment_booleans:
  - 'ASSET_STORE_S3_FORCE_PATH_STYLE'
  - 'BROWSER_CONNECT_ONDEMAND'
  - 'CHAT_ENABLED'
  - 'CRAWLER_DOWNLOAD_BANNER_IMAGE'
  - 'CRAWLER_ENABLE_ADBLOCKER'
  - 'CRAWLER_ENABLE_AUTOCONSENT'
  - 'CRAWLER_FULL_PAGE_ARCHIVE'
  - 'CRAWLER_FULL_PAGE_SCREENSHOT'
  - 'CRAWLER_HEADLESS_BROWSER'
  - 'CRAWLER_STORE_PDF'
  - 'CRAWLER_STORE_SCREENSHOT'
  - 'CRAWLER_VIDEO_DOWNLOAD'
  - 'CRAWLER_VIDEO_DOWNLOAD_ON_DEMAND'
  - 'DB_WAL_MODE'
  - 'DEGRADED_MODE'
  - 'DISABLE_NEW_RELEASE_CHECK'
  - 'DISABLE_PASSWORD_AUTH'
  - 'DISABLE_SIGNUPS'
  - 'EMAIL_VERIFICATION_REQUIRED'
  - 'EMBEDDING_ENABLE_AUTO_INDEXING'
  - 'EVENT_LOGS_ENABLED'
  - 'FREE_BROWSER_CRAWLING_ENABLED'
  - 'INFERENCE_ENABLE_AUTO_SUMMARIZATION'
  - 'INFERENCE_ENABLE_AUTO_TAGGING'
  - 'INFERENCE_SUPPORTS_STRUCTURED_OUTPUT'
  - 'INFERENCE_USE_MAX_COMPLETION_TOKENS'
  - 'OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING'
  - 'OAUTH_AUTO_REDIRECT'
  - 'OCR_USE_LLM'
  - 'OTEL_EVENT_LOGS_EXPORT_ENABLED'
  - 'OTEL_TRACING_ENABLED'
  - 'PAID_BROWSER_CRAWLING_ENABLED'
  - 'RATE_LIMITING_ENABLED'
  - 'SEMANTIC_SEARCH_ENABLED'
