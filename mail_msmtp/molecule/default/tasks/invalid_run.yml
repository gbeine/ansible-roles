---
# Runs mail_msmtp with the invalid role variables passed as include parameters,
# the role has to fail before the quadlet unit changes.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run mail_msmtp with invalid variables (expect ERROR): {{ mail_msmtp__test_invalid.message }}"
  block:

    - name: 'Run mail_msmtp, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'mail_msmtp'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ mail_msmtp__test_invalid.message }}"

  rescue:

    - name: 'Read the checksum of the quadlet unit after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ mail_msmtp__test_checked_files }}"
      register: 'mail_msmtp__test_md5_after'

    - name: 'Assert the run failed before the quadlet unit changed'
      ansible.builtin.assert:
        that:
          - mail_msmtp__test_failure is search(mail_msmtp__test_invalid.search, multiline=true)
          - mail_msmtp__test_before | select('equalto', '') | list | length == 0
          - mail_msmtp__test_after == mail_msmtp__test_before
        fail_msg: >-
          Failure: {{ mail_msmtp__test_failure }}
          Checksums before: {{ mail_msmtp__test_before | join(', ') }},
          after: {{ mail_msmtp__test_after | join(', ') }}.
      vars:
        # Double quotes, so \n is a line break for the anchors of the searches
        mail_msmtp__test_failure: "{{ [ ansible_failed_result.msg | default(''), ansible_failed_result.stderr | default('') ] | join('\n') }}"
        mail_msmtp__test_before: "{{ mail_msmtp__test_md5_before.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
        mail_msmtp__test_after: "{{ mail_msmtp__test_md5_after.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
