---
# Network created by container_podman in prepare.yml
mail_msmtp__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

mail_msmtp__test_image: 'ghcr.io/crazy-max/msmtpd:latest'

# Smarthost receiving the mails relayed by msmtpd, started in prepare.yml
mail_msmtp__test_mailpit:
  name: 'molecule-mailpit'
  image: 'docker.io/axllent/mailpit:latest'
  ip: '10.89.0.20'

mail_msmtp__test_vars:
  msmtp_ip: '10.89.0.10'
  msmtp_ipv6: 'fd00:89::10'
  msmtp_network: 'podman-molecule'
  msmtp_hostname: 'msmtpd-molecule'
  msmtp_timezone: 'Europe/Berlin'
  msmtp_environment:
    SMTP_HOST: '10.89.0.20'
    SMTP_PORT: '1025'
    SMTP_TLS: 'off'
    SMTP_STARTTLS: 'off'
    SMTP_AUTH: 'plain'
    SMTP_FROM: 'molecule@example.test'
  msmtp_secrets:
    - name: 'msmtpd_smtp_user'
      data: 'molecule'
      target: 'SMTP_USER'
    - name: 'msmtpd_smtp_password'
      data: 'molecule-smtp-password'
      target: 'SMTP_PASSWORD'

# Environment changed in side_effect.yml, the running service must be restarted
mail_msmtp__test_side_effect_environment:
  SMTP_DOMAIN: 'msmtpd-molecule.example.test'
