---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/mail-msmtp
#

mail_msmtp__ip: "{{ msmtp_ip | mandatory }}"
mail_msmtp__ipv6: "{{ msmtp_ipv6 }}"
mail_msmtp__network: "{{ msmtp_network | mandatory }}"
mail_msmtp__hostname: "{{ msmtp_hostname | mandatory }}"
mail_msmtp__timezone: "{{ msmtp_timezone | mandatory }}"
mail_msmtp__labels: "{{ msmtp_labels }}"

mail_msmtp__version: "{{ msmtp_version | default('latest') }}"

mail_msmtp__container: "{{ mail_msmtp__podman_container_default | combine(msmtp_container | default({})) }}"
mail_msmtp__environment: "{{ mail_msmtp__environment_default | combine(msmtp_environment | default({})) }}"
mail_msmtp__secrets: "{{ msmtp_secrets | default([]) }}"

mail_msmtp__autoupdate_enabled: "{{ msmtp_autoupdate_enabled | default(false) }}"
mail_msmtp__autoupdate_schedule: "{{ msmtp_autoupdate_schedule }}"

#
# Defaults - do not change
#

mail_msmtp__environment_default:
  TZ: "{{ mail_msmtp__timezone }}"

mail_msmtp__environment_required:
  - 'SMTP_HOST'

# Required when SMTP_AUTH is set and not off
mail_msmtp__secrets_required_auth:
  - 'SMTP_USER'
  - 'SMTP_PASSWORD'

# The targets of the secrets, they must not be set in msmtp_environment
mail_msmtp__secret_variables: "{{ mail_msmtp__secret_files.keys() | list }}"

# The secrets are mounted as files, the image reads the variable target from the file variable
mail_msmtp__secret_files:
  SMTP_USER: 'SMTP_USER_FILE'
  SMTP_PASSWORD: 'SMTP_PASSWORD_FILE'

mail_msmtp__secrets_dir: '/run/secrets'

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
mail_msmtp__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if mail_msmtp__secrets is sequence and mail_msmtp__secrets is not string and mail_msmtp__secrets is not mapping -%}
  {%-   for secret in mail_msmtp__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in mail_msmtp__secret_files -%}
  {%-     set _ = environment.update({ mail_msmtp__secret_files[secret.target]: mail_msmtp__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The variables of the image without the user and the password, from the README and rootfs/etc/cont-init.d of crazy-max/docker-msmtpd 1.8.34
mail_msmtp__environment_allowed:
  - 'TZ'
  - 'PUID'
  - 'PGID'
  - 'LISTEN_PORT'
  - 'SMTP_HOST'
  - 'SMTP_PORT'
  - 'SMTP_TLS'
  - 'SMTP_STARTTLS'
  - 'SMTP_TLS_CHECKCERT'
  - 'SMTP_AUTH'
  - 'SMTP_DOMAIN'
  - 'SMTP_FROM'
  - 'SMTP_FROM_FULL_NAME'
  - 'SMTP_ALLOW_FROM_OVERRIDE'
  - 'SMTP_SET_FROM_HEADER'
  - 'SMTP_SET_DATE_HEADER'
  - 'SMTP_REMOVE_BCC_HEADERS'
  - 'SMTP_UNDISCLOSED_RECIPIENTS'
  - 'SMTP_DSN_NOTIFY'
  - 'SMTP_DSN_RETURN'
  # The file variables of the secrets, set by the role
  - 'SMTP_USER_FILE'
  - 'SMTP_PASSWORD_FILE'

mail_msmtp__podman_name: 'msmtpd'
mail_msmtp__podman_image: 'ghcr.io/crazy-max/msmtpd'
mail_msmtp__podman_tag: "{{ mail_msmtp__version }}"

mail_msmtp__podman_container_default:
  name: "{{ mail_msmtp__podman_name }}"
  hostname: "{{ mail_msmtp__hostname }}"
  image: "{{ mail_msmtp__podman_image }}:{{ mail_msmtp__podman_tag }}"
  ip: "{{ mail_msmtp__ip }}"
  ipv6: "{{ mail_msmtp__ipv6 | default(omit) }}"
  network: "{{ mail_msmtp__network }}"
  timezone: "{{ mail_msmtp__timezone }}"
  # Set with msmtp_environment and msmtp_secrets, merged over the default
  environment: "{{ mail_msmtp__environment | combine(mail_msmtp__environment_secrets_files) }}"
  labels: "{{ mail_msmtp__labels | default(omit) }}"
  secrets: >-
    {{ (mail_msmtp__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ mail_msmtp__secrets_dir ~ '/\1') | list)
      if (mail_msmtp__secrets is sequence and mail_msmtp__secrets is not string and mail_msmtp__secrets | length > 0)
      else omit }}
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
