---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/matrix-synapse
#

matrix_synapse__home: "{{ matrix_home | mandatory }}"
matrix_synapse__ip: "{{ matrix_ip | mandatory }}"
matrix_synapse__ipv6: "{{ matrix_ipv6 }}"
matrix_synapse__network: "{{ matrix_network | mandatory }}"
matrix_synapse__hostname: "{{ matrix_hostname | mandatory }}"
matrix_synapse__timezone: "{{ matrix_timezone | mandatory }}"
matrix_synapse__labels: "{{ matrix_labels | default({}) }}"

matrix_synapse__version: "{{ matrix_version | default('latest') }}"

matrix_synapse__db_type: "{{ matrix_db_type | default('postgresql') }}"
matrix_synapse__db_host: "{{ matrix_db_host | default('') }}"
matrix_synapse__db_port: "{{ matrix_db_port | default(5432) }}"
matrix_synapse__db_user: "{{ matrix_db_user | default('synapse') }}"
matrix_synapse__db_pass: "{{ matrix_db_pass | default('') }}"
matrix_synapse__db_name: "{{ matrix_db_name | default('synapse') }}"

matrix_synapse__server_name: "{{ matrix_server_name | mandatory }}"
matrix_synapse__report_stats: "{{ matrix_report_stats | default(true) }}"
matrix_synapse__http_port: "{{ matrix_http_port | default(8008) }}"
matrix_synapse__dns_servers: "{{ matrix_dns_servers | default([]) }}"

matrix_synapse__setup: "{{ matrix_setup | default(true) }}"

matrix_synapse__container: "{{ matrix_synapse__container_default | combine(matrix_container | default({})) }}"

matrix_synapse__autoupdate_enabled: "{{ matrix_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

matrix_synapse__uid: 991
matrix_synapse__gid: "{{ matrix_synapse__uid }}"

matrix_synapse__podman_name: 'matrix'
matrix_synapse__podman_image: 'docker.io/matrixdotorg/synapse'
matrix_synapse__podman_tag: "{{ matrix_synapse__version }}"

matrix_synapse__podman_home: "{{ matrix_synapse__home }}"
matrix_synapse__podman_data_dir: "{{ matrix_synapse__podman_home }}/data"

matrix_synapse__container_default:
  name: "{{ matrix_synapse__podman_name }}"
  hostname: "{{ matrix_synapse__hostname }}"
  image: "{{ matrix_synapse__podman_image }}:{{ matrix_synapse__podman_tag }}"
  ip: "{{ matrix_synapse__ip }}"
  ipv6: "{{ matrix_synapse__ipv6 | default(omit) }}"
  network: "{{ matrix_synapse__network }}"
  timezone: "{{ matrix_synapse__timezone }}"
  dns_servers: "{{ matrix_synapse__dns_servers }}"
  environment:
    POSTGRES_HOST: "{{ matrix_synapse__db_host }}"
    POSTGRES_PORT: "{{ matrix_synapse__db_port }}"
    POSTGRES_DB: "{{ matrix_synapse__db_name }}"
    POSTGRES_USER: "{{ matrix_synapse__db_user }}"
    SYNAPSE_SERVER_NAME: "{{ matrix_synapse__server_name }}"
    SYNAPSE_REPORT_STATS:  "{{ matrix_synapse__report_stats | ternary('yes', 'no') }}"
    SYNAPSE_HTTP_PORT: "{{ matrix_synapse__http_port }}"
    UID: "{{ matrix_synapse__uid }}"
    GID: "{{ matrix_synapse__gid }}"
    TZ: "{{ matrix_synapse__timezone }}"
  labels: "{{ matrix_synapse__labels }}"
  secrets:
    - "matrix_synapse_postgres_password,type=env,target=POSTGRES_PASSWORD"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ matrix_synapse__podman_data_dir }}:/data"
