---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/keycloak
#

security_keycloak__ip: "{{ keycloak_ip | mandatory }}"
security_keycloak__ipv6: "{{ keycloak_ipv6 | default('') }}"
security_keycloak__network: "{{ keycloak_network | mandatory }}"
security_keycloak__hostname: "{{ keycloak_hostname | mandatory }}"
security_keycloak__timezone: "{{ keycloak_timezone | mandatory }}"
security_keycloak__labels: "{{ keycloak_labels | default({}) }}"
security_keycloak__publish: "{{ keycloak_publish | default([]) }}"

security_keycloak__version: "{{ keycloak_version | default('latest') }}"

security_keycloak__db_type: "{{ keycloak_db_type | default('mariadb') }}"
security_keycloak__db_host: "{{ keycloak_db_host | mandatory }}"
security_keycloak__db_port: "{{ keycloak_db_port | default(3306) }}"
security_keycloak__db_user: "{{ keycloak_db_user | default('keycloak') }}"
security_keycloak__db_pass: "{{ keycloak_db_pass | mandatory }}"
security_keycloak__db_name: "{{ keycloak_db_name | default('keycloak') }}"

security_keycloak__http_enabled: "{{ keycloak_http_enabled | default(false) }}"
security_keycloak__health_enabled: "{{ keycloak_health_enabled | default(false) }}"
security_keycloak__metrics_enabled: "{{ keycloak_metrics_enabled | default(false) }}"
security_keycloak__url: "{{ keycloak_url | mandatory }}"
security_keycloak__proxy_headers: "{{ keycloak_proxy_headers | default('xforwarded') }}"
security_keycloak__log: "{{ keycloak_log | default('console') }}"
security_keycloak__log_level: "{{ keycloak_log_level | default('INFO') }}"
security_keycloak__proxy_address_forwarding: "{{ keycloak_proxy_address_forwarding | default(false) }}"

security_keycloak__admin: "{{ keycloak_admin | mandatory }}"
security_keycloak__password: "{{ keycloak_password | mandatory }}"

security_keycloak__container: "{{ security_keycloak__container_default | combine(keycloak_container | default({})) }}"

security_keycloak__autoupdate_enabled: "{{ keycloak_autoupdate_enabled | default(false) }}"

security_keycloak__realms: "{{ keycloak_realms | default([]) }}"

security_keycloak__auth_url: "https://{{ security_keycloak__url }}"
security_keycloak__auth_username: "{{ security_keycloak__admin }}"
security_keycloak__auth_password: "{{ security_keycloak__password }}"
security_keycloak__auth_realm: 'master'
security_keycloak__auth_client_id: 'admin-cli'

#
# Defaults - do not change
#

security_keycloak__http_port: 8080
security_keycloak__https_port: 8443
security_keycloak__uid: 1000
security_keycloak__gid: "{{ security_keycloak__uid }}"

security_keycloak__podman_name: 'keycloak'
security_keycloak__podman_image: 'quay.io/keycloak/keycloak'
security_keycloak__podman_tag: "{{ security_keycloak__version }}"

security_keycloak__container_default:
  name: "{{ security_keycloak__podman_name }}"
  hostname: "{{ security_keycloak__hostname }}"
  image: "{{ security_keycloak__podman_image }}:{{ security_keycloak__podman_tag }}"
  ip: "{{ security_keycloak__ip }}"
  ipv6: "{{ security_keycloak__ipv6 }}"
  network: "{{ security_keycloak__network }}"
  timezone: "{{ security_keycloak__timezone }}"
  environment:
    KC_DB: "{{ security_keycloak__db_type }}"
    KC_DB_SCHEMA: "{{ security_keycloak__db_name }}"
    KC_DB_URL_HOST: "{{ security_keycloak__db_host }}"
    KC_DB_USERNAME: "{{ security_keycloak__db_user }}"
    KC_HTTP_ENABLED: "{{ security_keycloak__http_enabled | ternary('true', 'false') }}"
    KC_HEALTH_ENABLED: "{{ security_keycloak__health_enabled | ternary('true', 'false') }}"
    KC_METRICS_ENABLED: "{{ security_keycloak__metrics_enabled | ternary('true', 'false') }}"
    KC_HOSTNAME: "{{ security_keycloak__url }}"
    KC_PROXY_HEADERS: "{{ security_keycloak__proxy_headers }}"
    KC_LOG: "{{ security_keycloak__log }}"
    KC_LOG_LEVEL: "{{ security_keycloak__log_level }}"
    KEYCLOAK_ADMIN: "{{ security_keycloak__admin }}"
    PROXY_ADDRESS_FORWARDING: "{{ security_keycloak__proxy_address_forwarding | ternary('true', 'false') }}"
  labels: "{{ security_keycloak__labels }}"
  secrets:
    - "keycloak_database_passwd,type=env,target=KC_DB_PASSWORD"
    - "keycloak_admin_passwd,type=env,target=KEYCLOAK_ADMIN_PASSWORD"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
  shm_size: '256m'
  command: 'start-dev'
