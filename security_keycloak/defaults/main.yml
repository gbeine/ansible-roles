---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/keycloak
#

security_keycloak__ip: "{{ keycloak_ip | mandatory }}"
security_keycloak__ipv6: "{{ keycloak_ipv6 }}"
security_keycloak__network: "{{ keycloak_network | mandatory }}"
security_keycloak__hostname: "{{ keycloak_hostname | mandatory }}"
security_keycloak__timezone: "{{ keycloak_timezone | mandatory }}"
security_keycloak__labels: "{{ keycloak_labels }}"

security_keycloak__version: "{{ keycloak_version | default('latest') }}"

security_keycloak__container: "{{ security_keycloak__podman_container_default | combine(keycloak_container | default({})) }}"

# Variables of the start script and the JVM, e.g. JAVA_OPTS_APPEND, the options of Keycloak are set with keycloak_config
security_keycloak__environment: "{{ security_keycloak__environment_default | combine(keycloak_environment | default({})) }}"

# Options of Keycloak written to keycloak.conf, e.g. hostname, db, db-url-host, http-enabled
security_keycloak__config: "{{ security_keycloak__config_default | combine(keycloak_config | default({})) }}"

# Keys of the options with a free part in their names, e.g. { 'datasource': [ 'audit' ], 'log_category': [ 'org.keycloak' ] }
security_keycloak__keys: "{{ keycloak_keys | default({}) }}"

# Secrets with name, data and target, the targets are the password options of Keycloak, e.g. db-password
security_keycloak__secrets: "{{ keycloak_secrets | default([]) }}"

# Realms with their clients, required actions and user federations
security_keycloak__realms: "{{ keycloak_realms | default([]) }}"

security_keycloak__autoupdate_enabled: "{{ keycloak_autoupdate_enabled | default(false) }}"
security_keycloak__autoupdate_schedule: "{{ keycloak_autoupdate_schedule }}"

#
# Defaults - do not change
#

security_keycloak__environment_default:
  TZ: "{{ security_keycloak__timezone }}"

security_keycloak__config_default:
  db: 'mariadb'
  db-username: 'keycloak'
  db-url-database: 'keycloak'
  http-enabled: true
  proxy-headers: 'xforwarded'
  health-enabled: true
  log: 'console'

# The options of keycloak_config and keycloak_keys, the defaults are empty, so the role checks that they are dictionaries
security_keycloak__config_custom: "{{ keycloak_config | default({}) }}"

security_keycloak__config_required: [ 'hostname', 'db-url-host' ]

# Options only used for the initialization and the login of the role, never written to the keycloak.conf of the service
security_keycloak__init_options: [ 'bootstrap-admin-username' ]
security_keycloak__admin_username: "{{ security_keycloak__config['bootstrap-admin-username'] | default('admin', true) }}"

# Options set for the initialization only: no cluster with a running Keycloak, the admin is created before the start is reported
security_keycloak__init_config:
  cache: 'local'
  server-async-bootstrap: false

# The ports and the path of the API used by the role
security_keycloak__https_only: "{{ not (security_keycloak__config['http-enabled'] | default(false) | bool) }}"
security_keycloak__api_scheme: "{{ 'https' if security_keycloak__https_only else 'http' }}"
security_keycloak__api_port: >-
  {{ security_keycloak__config['https-port'] | default(8443) if security_keycloak__https_only
     else security_keycloak__config['http-port'] | default(8080) }}
security_keycloak__api_path: "{{ (security_keycloak__config['http-relative-path'] | default('/', true) | string).rstrip('/') }}"
security_keycloak__api_url: >-
  {{ security_keycloak__api_scheme }}://{{ security_keycloak__ip }}:{{ security_keycloak__api_port }}{{ security_keycloak__api_path }}

# Characters of the keys of keycloak_keys, e.g. a datasource, a log category, a feature or an SPI with provider and option
security_keycloak__key_pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'

security_keycloak__secrets_required: [ 'db-password', 'bootstrap-admin-password' ]

# The secrets only used for the initialization and the login of the role
security_keycloak__secrets_init: [ 'bootstrap-admin-password' ]

# Generated from quarkus/config-api/src/main/java/org/keycloak/config/*Options.java of Keycloak 26.8.2,
# the password options of Keycloak, they are set with keycloak_secrets
security_keycloak__secrets_allowed_options:
  - 'bootstrap-admin-password'
  - 'config-keystore-password'
  - 'db-mtls-key-store-password'
  - 'db-password'
  - 'db-tls-trust-store-password'
  - 'https-certificate-key-file-password'
  - 'https-key-store-password'
  - 'https-management-certificate-key-file-password'
  - 'https-management-key-store-password'
  - 'https-management-trust-store-password'
  - 'https-trust-store-password'
  - 'vault-pass'

# Generated from quarkus/dist/src/main/content/bin/kc.sh and quarkus/container/Dockerfile of Keycloak 26.8.2,
# the variables of the start script and the JVM, the options of Keycloak (KC_*) are set with keycloak_config
security_keycloak__environment_allowed:
  - 'TZ'
  - 'JAVA_OPTS'
  - 'JAVA_OPTS_APPEND'
  - 'JAVA_OPTS_KC_HEAP'
  - 'JAVA_ADD_OPENS'
  - 'KC_DEBUG'
  - 'KC_DEBUG_PORT'
  - 'KC_DEBUG_SUSPEND'
  - 'KC_RUN_IN_CONTAINER'

# The valid keys of keycloak_keys by family, invalid keys are reported by the validation of the keys
security_keycloak__keys_valid: >-
  {%- set result = {} -%}
  {%- if security_keycloak__keys is mapping -%}
  {%-   for family, keys in security_keycloak__keys.items()
          if family in security_keycloak__keys_families and keys is sequence and keys is not string and keys is not mapping -%}
  {%-     set _ = result.update({ family: keys | select('string') | select('match', security_keycloak__key_pattern) | unique | list }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ result }}

# The options composed from the keys of keycloak_keys
security_keycloak__config_allowed_keys: >-
  {%- set names = [] -%}
  {%- for family, keys in security_keycloak__keys_valid.items() -%}
  {%-   for template in security_keycloak__keys_families[family] -%}
  {%-     for key in keys -%}
  {%-       set _ = names.append(template | replace('<key>', key)) -%}
  {%-     endfor -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ names }}

security_keycloak__config_booleans_keys: >-
  {%- set names = [] -%}
  {%- for template in security_keycloak__keys_booleans -%}
  {%-   for key in security_keycloak__keys_valid.datasource | default([]) -%}
  {%-     set _ = names.append(template | replace('<key>', key)) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ names }}

security_keycloak__secrets_allowed_keys: >-
  {%- set names = [] -%}
  {%- for template in security_keycloak__keys_secrets -%}
  {%-   for key in security_keycloak__keys_valid.datasource | default([]) -%}
  {%-     set _ = names.append(template | replace('<key>', key)) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ names }}

# The options of keycloak_config, the targets of keycloak_secrets and the boolean options
security_keycloak__config_allowed: "{{ security_keycloak__config_allowed_options + security_keycloak__config_allowed_keys + security_keycloak__init_options }}"
security_keycloak__config_booleans: "{{ security_keycloak__config_booleans_options + security_keycloak__config_booleans_keys }}"
security_keycloak__secrets_allowed: "{{ security_keycloak__secrets_allowed_options + security_keycloak__secrets_allowed_keys }}"

# The options written to keycloak.conf: the configuration without the options of the initialization and the secrets,
# entries without name, data or target are left out, the validation of the secrets reports them
security_keycloak__secret_options: >-
  {%- set options = {} -%}
  {%- if security_keycloak__secrets is sequence and security_keycloak__secrets is not string and security_keycloak__secrets is not mapping -%}
  {%-   for secret in security_keycloak__secrets
          if secret is mapping and secret.name is defined and secret.data is defined and secret.target is defined -%}
  {%-     set _ = options.update({ secret.target | string: secret.data | string }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ options }}

security_keycloak__conf: >-
  {{ security_keycloak__config | dict2items | rejectattr('key', 'in', security_keycloak__init_options) | items2dict
     | combine(security_keycloak__secret_options | dict2items | rejectattr('key', 'in', security_keycloak__secrets_init) | items2dict) }}

# The options of the initialization: the admin, a local cache and the creation of the admin before the start is reported
security_keycloak__init_conf: >-
  {{ security_keycloak__conf
     | combine({ 'bootstrap-admin-username': security_keycloak__admin_username })
     | combine(security_keycloak__secret_options | dict2items | selectattr('key', 'in', security_keycloak__secrets_init) | items2dict)
     | combine(security_keycloak__init_config) }}

security_keycloak__admin_password: "{{ security_keycloak__secret_options['bootstrap-admin-password'] | default('') }}"

# The keys of the entries of keycloak_realms, their clients and user federations, booleans are checked
security_keycloak__realm_keys: [ 'realm', 'id', 'display_name', 'enabled', 'login_with_email', 'required_actions', 'clients', 'user_federation' ]
security_keycloak__realm_booleans: [ 'enabled', 'login_with_email' ]
security_keycloak__client_keys:
  - 'client_id'
  - 'name'
  - 'description'
  - 'root_url'
  - 'client_authenticator_type'
  - 'secret'
  - 'redirect_uris'
  - 'web_origins'
  - 'standard_flow_enabled'
  - 'implicit_flow_enabled'
  - 'direct_access_grants_enabled'
  - 'service_accounts_enabled'
  - 'authorization_services_enabled'
  - 'public_client'
  - 'protocol'
  - 'attributes'
security_keycloak__client_booleans:
  - 'standard_flow_enabled'
  - 'implicit_flow_enabled'
  - 'direct_access_grants_enabled'
  - 'service_accounts_enabled'
  - 'authorization_services_enabled'
  - 'public_client'
security_keycloak__federation_keys: [ 'federation_id', 'federation_name', 'provider_id', 'config', 'mappers' ]

security_keycloak__podman_name: 'keycloak'
security_keycloak__podman_image: 'quay.io/keycloak/keycloak'
security_keycloak__podman_tag: "{{ security_keycloak__version }}"

# keycloak.conf with the passwords is a podman secret, the user keycloak (1000) of the image reads it
security_keycloak__conf_file: '/opt/keycloak/conf/keycloak.conf'
security_keycloak__conf_secret: "{{ security_keycloak__container.name }}-config"
security_keycloak__init_name: "{{ security_keycloak__container.name }}-init"
security_keycloak__init_secret: "{{ security_keycloak__container.name }}-init-config"
security_keycloak__secret_mount: "type=mount,target={{ security_keycloak__conf_file }},uid=1000,gid=0,mode=0400"

# The log messages of the initialization: the admin was created on a new installation, Keycloak started without creating it
security_keycloak__init_created: 'Created temporary admin user with username'
security_keycloak__init_started: 'started in [0-9.]+s'

security_keycloak__podman_container_default:
  name: "{{ security_keycloak__podman_name }}"
  hostname: "{{ security_keycloak__hostname }}"
  image: "{{ security_keycloak__podman_image }}:{{ security_keycloak__podman_tag }}"
  ip: "{{ security_keycloak__ip }}"
  ipv6: "{{ security_keycloak__ipv6 | default(omit) }}"
  network: "{{ security_keycloak__network }}"
  timezone: "{{ security_keycloak__timezone }}"
  # Set with keycloak_environment, merged over the default
  environment: "{{ security_keycloak__environment }}"
  labels: "{{ security_keycloak__labels | default(omit) }}"
  shm_size: '256m'
  command: 'start'

# Generated from quarkus/config-api/src/main/java/org/keycloak/config/*Options.java of Keycloak 26.8.2,
# the families of keycloak_keys with the options composed from a key, <key> is replaced by the key:
# datasource from DatabaseOptions.Datasources (the options of the default datasource with the name of a datasource),
# log_category from log-level-<category>, feature from feature-<name>, header from the *-header-<header> options,
# spi from the options of the providers spi-<spi>--<provider>--<option>
security_keycloak__keys_families:
  datasource:
    - 'db-connect-timeout-<key>'
    - 'db-debug-jpql-<key>'
    - 'db-driver-<key>'
    - 'db-enabled-<key>'
    - 'db-health-exclude-<key>'
    - 'db-kind-<key>'
    - 'db-log-slow-queries-threshold-<key>'
    - 'db-mtls-key-store-file-<key>'
    - 'db-mtls-key-store-type-<key>'
    - 'db-pool-initial-size-<key>'
    - 'db-pool-max-lifetime-<key>'
    - 'db-pool-max-size-<key>'
    - 'db-pool-min-size-<key>'
    - 'db-schema-<key>'
    - 'db-tls-mode-<key>'
    - 'db-tls-trust-store-file-<key>'
    - 'db-tls-trust-store-type-<key>'
    - 'db-url-database-<key>'
    - 'db-url-full-<key>'
    - 'db-url-host-<key>'
    - 'db-url-port-<key>'
    - 'db-url-properties-<key>'
    - 'db-username-<key>'
    - 'transaction-xa-enabled-<key>'
  log_category:
    - 'log-level-<key>'
  feature:
    - 'feature-<key>'
  header:
    - 'telemetry-header-<key>'
    - 'telemetry-logs-header-<key>'
    - 'telemetry-metrics-header-<key>'
    - 'tracing-header-<key>'
  spi:
    - 'spi-<key>'

# The boolean options of the families
security_keycloak__keys_booleans:
  - 'db-debug-jpql-<key>'
  - 'db-enabled-<key>'
  - 'db-health-exclude-<key>'
  - 'transaction-xa-enabled-<key>'

# The password options of the families, they are set with keycloak_secrets
security_keycloak__keys_secrets:
  - 'db-mtls-key-store-password-<key>'
  - 'db-password-<key>'
  - 'db-tls-trust-store-password-<key>'

# Generated from quarkus/config-api/src/main/java/org/keycloak/config/*Options.java of Keycloak 26.8.2,
