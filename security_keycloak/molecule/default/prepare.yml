---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    security_keycloak__test_case: "{{ security_keycloak__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    podman_networks:
      - "{{ security_keycloak__test_network }}"
    podman_default_network: "{{ security_keycloak__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Pull the images, so the first start of the services does not time out'
      containers.podman.podman_image:
        name: "{{ item }}"
      loop:
        - "{{ security_keycloak__test_image }}"
        - "{{ security_keycloak__test_case.database.image }}"
      register: 'security_keycloak__test_pull'
      until: security_keycloak__test_pull is succeeded
      retries: 5
      delay: 30

    - name: 'Start the database'
      containers.podman.podman_container:
        name: "{{ security_keycloak__test_case.database.name }}"
        image: "{{ security_keycloak__test_case.database.image }}"
        network: "{{ security_keycloak__test_network.name }}"
        ip: "{{ security_keycloak__test_case.database.ip }}"
        env: "{{ security_keycloak__test_case.database.environment }}"
        state: 'started'

    - name: 'Wait for the database'
      ansible.builtin.wait_for:
        host: "{{ security_keycloak__test_case.database.ip }}"
        port: "{{ security_keycloak__test_case.database.port }}"
        timeout: 120
