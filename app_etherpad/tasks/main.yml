---

- name: 'Deploy etherpad container'
  tags: [ 'app_etherpad' ]
  block:

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        owner: "{{ app_etherpad__uid }}"
        group: "{{ app_etherpad__gid }}"
        mode: "{{ item.mode | default('0700') }}"
        state: 'directory'
      with_items:
        - dest: "{{ app_etherpad__podman_home }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.key }}"
        data: "{{ item.value }}"
      with_dict: "{{ app_etherpad__secrets }}"

    - name: 'Create configuration'
      ansible.builtin.copy:
        dest: "{{ app_etherpad__podman_home }}"
        owner: "{{ app_etherpad__uid }}"
        group: "{{ app_etherpad__gid }}"
        mode: "{{ item.mode | default('0600') }}"
        src: 'settings.json'
      when: 'not podman___update_mode | bool'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ app_etherpad__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[app_etherpad__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ app_etherpad__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_etherpad__container.name }}"
        hostname: "{{ app_etherpad__container.hostname }}"
        image: "{{ app_etherpad__container.image }}"
        ip: "{{ app_etherpad__container.ip }}"
        network: "{{ app_etherpad__container.network }}"
        timezone: "{{ app_etherpad__container.timezone }}"
        env: "{{ app_etherpad__container.environment }}"
        label: "{{ app_etherpad__container.labels }}"
        secrets: "{{ app_etherpad__container.secrets }}"
        volume: "{{ app_etherpad__container.volumes }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if app_etherpad__container.requires is defined %}
          Requires={{ app_etherpad__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'app_etherpad__ipv6 | length == 0'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_etherpad__container.name }}"
        hostname: "{{ app_etherpad__container.hostname }}"
        image: "{{ app_etherpad__container.image }}"
        ip: "{{ app_etherpad__container.ip }}"
        ip6: "{{ app_etherpad__container.ipv6 }}"
        network: "{{ app_etherpad__container.network }}"
        timezone: "{{ app_etherpad__container.timezone }}"
        env: "{{ app_etherpad__container.environment }}"
        label: "{{ app_etherpad__container.labels }}"
        secrets: "{{ app_etherpad__container.secrets }}"
        volume: "{{ app_etherpad__container.volumes }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if app_etherpad__container.requires is defined %}
          Requires={{ app_etherpad__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'app_etherpad__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ app_etherpad__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode | bool else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'
