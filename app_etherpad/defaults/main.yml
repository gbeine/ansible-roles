---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/etherpad
#

app_etherpad__home: "{{ etherpad_home | mandatory }}"
app_etherpad__ip: "{{ etherpad_ip | mandatory }}"
app_etherpad__ipv6: "{{ etherpad_ipv6 | default('') }}"
app_etherpad__network: "{{ etherpad_network | mandatory }}"
app_etherpad__hostname: "{{ etherpad_hostname | mandatory }}"
app_etherpad__timezone: "{{ etherpad_timezone | mandatory }}"
app_etherpad__labels: "{{ etherpad_labels | default({}) }}"

app_etherpad__version: "{{ etherpad_version | default('latest') }}"

app_etherpad__container: "{{ app_etherpad__podman_container_default | combine(etherpad_container | default({})) }}"

app_etherpad__db_host: "{{ etherpad_db_host | mandatory }}"
app_etherpad__db_port: "{{ etherpad_db_port | default(5432) }}"
app_etherpad__db_user: "{{ etherpad_db_user | default('etherpad') }}"
app_etherpad__db_pass: "{{ etherpad_db_pass | mandatory }}"
app_etherpad__db_type: "{{ etherpad_db_type | default('postgres') }}"
app_etherpad__db_name: "{{ etherpad_db_name | default('etherpad') }}"

app_etherpad__title: "{{ etherpad_title | default('Etherpad') }}"
app_etherpad__port: 9001
app_etherpad__admin_password: "{{ etherpad_admin_password | mandatory }}"
app_etherpad__user_password: "{{ etherpad_user_password | default('') }}"

app_etherpad__cookie_key_rotation_interval: "{{ etherpad_cookie_key_rotation_interval | default(86400000) }}"
app_etherpad__cookie_same_site: "{{ etherpad_cookie_same_site | default('Lax') }}"
app_etherpad__cookie_session_lifetime: "{{ etherpad_cookie_session_lifetime | default(864000000) }}"
app_etherpad__cookie_session_refresh_interval: "{{ etherpad_cookie_session_refresh_interval | default(86400000) }}"
app_etherpad__show_settings_in_admin_page: "{{ etherpad_show_settings_in_admin_page | default(true) }}"
app_etherpad__trust_proxy: "{{ etherpad_trust_proxy | default(false) }}"
app_etherpad__import_max_file_size: "{{ etherpad_import_max_file_size | default(52428800) }}"
app_etherpad__import_export_max_req_per_ip: "{{ etherpad_import_export_max_req_per_ip | default(10) }}"
app_etherpad__import_export_rate_limit_window: "{{ etherpad_import_export_rate_limit_window | default(90000) }}"
app_etherpad__commit_rate_limit_duration: "{{ etherpad_commit_rate_limit_duration | default(1) }}"
app_etherpad__commit_rate_limit_points: "{{ etherpad_commit_rate_limit_points | default(10) }}"
app_etherpad__suppress_errors_in_pad_text: "{{ etherpad_suppress_errors_in_pad_text | default(false) }}"
app_etherpad__require_session: "{{ etherpad_require_session | default(false) }}"
app_etherpad__edit_only: "{{ etherpad_edit_only | default(false) }}"
app_etherpad__minify: "{{ etherpad_minify | default(true) }}"
app_etherpad__max_age: "{{ etherpad_max_age | default(21600) }}"
app_etherpad__soffice: "{{ etherpad_soffice | default('/usr/bin/soffice') }}"
app_etherpad__allow_unknown_file_ends: "{{ etherpad_allow_unknown_file_ends | default(true) }}"
app_etherpad__require_authentication: "{{ etherpad_require_authentication | default(false) }}"
app_etherpad__require_authorization: "{{ etherpad_require_authorization | default(false) }}"
app_etherpad__automatic_reconnection_timeout: "{{ etherpad_automatic_reconnection_timeout | default(0) }}"
app_etherpad__focus_line_percentage_above: "{{ etherpad_focus_line_percentage_above | default(0) }}"
app_etherpad__focus_line_percentage_below: "{{ etherpad_focus_line_percentage_below | default(0) }}"
app_etherpad__focus_line_percentage_arrow_up: "{{ etherpad_focus_line_percentage_arrow_up | default(0) }}"
app_etherpad__focus_line_duration: "{{ etherpad_focus_line_duration | default(0) }}"
app_etherpad__focus_line_caret_scroll: "{{ etherpad_focus_line_caret_scroll | default(false) }}"
app_etherpad__socketio_max_http_buffer_size: "{{ etherpad_socketio_max_http_buffer_size | default(50000) }}"

#
# Defaults - do not change
#

app_etherpad__uid: 5001
app_etherpad__gid: "{{ etherpad_gid | default(app_etherpad__uid) }}"

app_etherpad__podman_name: 'etherpad'
app_etherpad__podman_image: 'c0d3.sh/container/etherpad'
app_etherpad__podman_tag: "{{ app_etherpad__version }}"

app_etherpad__podman_home: "{{ app_etherpad__home }}"

app_etherpad__podman_container_default:
  name: "{{ app_etherpad__podman_name }}"
  hostname: "{{ app_etherpad__hostname }}"
  image: "{{ app_etherpad__podman_image }}:{{ app_etherpad__podman_tag }}"
  ip: "{{ app_etherpad__ip }}"
  ipv6: "{{ app_etherpad__ipv6 }}"
  network: "{{ app_etherpad__network }}"
  timezone: "{{ app_etherpad__timezone }}"
  environment:
    TZ: "{{ app_etherpad__timezone }}"
    TITLE: "{{ app_etherpad__title }}"
    DB_TYPE: "{{ app_etherpad__db_type }}"
    DB_HOST: "{{ app_etherpad__db_host }}"
    DB_PORT: "{{ app_etherpad__db_port }}"
    DB_USER: "{{ app_etherpad__db_user }}"
    DB_NAME: "{{ app_etherpad__db_name }}"
    COOKIE_KEY_ROTATION_INTERVAL: "{{ app_etherpad__cookie_key_rotation_interval }}"
    COOKIE_SAME_SITE: "{{ app_etherpad__cookie_same_site }}"
    COOKIE_SESSION_LIFETIME: "{{ app_etherpad__cookie_session_lifetime }}"
    COOKIE_SESSION_REFRESH_INTERVAL: "{{ app_etherpad__cookie_session_refresh_interval }}"
    SHOW_SETTINGS_IN_ADMIN_PAGE: "{{ app_etherpad__show_settings_in_admin_page | ternary('true', 'false') }}"
    TRUST_PROXY: "{{ app_etherpad__trust_proxy | ternary('true', 'false') }}"
    IMPORT_MAX_FILE_SIZE: "{{ app_etherpad__import_max_file_size }}"
    IMPORT_EXPORT_MAX_REQ_PER_IP: "{{ app_etherpad__import_export_max_req_per_ip }}"
    IMPORT_EXPORT_RATE_LIMIT_WINDOW: "{{ app_etherpad__import_export_rate_limit_window }}"
    COMMIT_RATE_LIMIT_DURATION: "{{ app_etherpad__commit_rate_limit_duration }}"
    COMMIT_RATE_LIMIT_POINTS: "{{ app_etherpad__commit_rate_limit_points }}"
    SUPPRESS_ERRORS_IN_PAD_TEXT: "{{ app_etherpad__suppress_errors_in_pad_text | ternary('true', 'false') }}"
    REQUIRE_SESSION: "{{ app_etherpad__require_session | ternary('true', 'false') }}"
    EDIT_ONLY: "{{ app_etherpad__edit_only | ternary('true', 'false') }}"
    MINIFY: "{{ app_etherpad__minify | ternary('true', 'false') }}"
    MAX_AGE: "{{ app_etherpad__max_age }}"
    SOFFICE: "{{ app_etherpad__soffice }}"
    ALLOW_UNKNOWN_FILE_ENDS: "{{ app_etherpad__allow_unknown_file_ends | ternary('true', 'false') }}"
    REQUIRE_AUTHENTICATION: "{{ app_etherpad__require_authentication | ternary('true', 'false') }}"
    REQUIRE_AUTHORIZATION: "{{ app_etherpad__require_authorization | ternary('true', 'false') }}"
    AUTOMATIC_RECONNECTION_TIMEOUT: "{{ app_etherpad__automatic_reconnection_timeout }}"
    FOCUS_LINE_PERCENTAGE_ABOVE: "{{ app_etherpad__focus_line_percentage_above }}"
    FOCUS_LINE_PERCENTAGE_BELOW: "{{ app_etherpad__focus_line_percentage_below }}"
    FOCUS_LINE_PERCENTAGE_ARROW_UP: "{{ app_etherpad__focus_line_percentage_arrow_up }}"
    FOCUS_LINE_DURATION: "{{ app_etherpad__focus_line_duration }}"
    FOCUS_LINE_CARET_SCROLL: "{{ app_etherpad__focus_line_caret_scroll | ternary('true', 'false') }}"
    SOCKETIO_MAX_HTTP_BUFFER_SIZE: "{{ app_etherpad__socketio_max_http_buffer_size }}"
  labels: "{{ app_etherpad__labels }}"
  secrets: >-
    {{
      [
        "etherpad_db_pass,type=env,target=DB_PASS",
        "etherpad_admin_password,type=env,target=ADMIN_PASSWORD"
      ]
    }}
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_etherpad__podman_home }}/settings.json:/opt/etherpad-lite/settings.json"

app_etherpad__secrets_base:
  etherpad_db_pass: "{{ app_etherpad__db_pass }}"
  etherpad_admin_password: "{{ app_etherpad__admin_password }}"

app_etherpad__secrets_optional:
  etherpad_user_password: "{{ app_etherpad__user_password }}"

app_etherpad__secrets: >-
  {{
    app_etherpad__secrets_base
    | combine(
      app_etherpad__secrets_optional
      | dict2items
      | selectattr('value', 'ne', '')
      | items2dict
    )
  }}
