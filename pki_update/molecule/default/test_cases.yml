---
# The service restarted by the timer, created by prepare.yml
pki_update__test_service: 'molecule-pki'

pki_update__test_cases:

  # The mandatory values only
  - name: 'molecule-pki-update-default'
    role_vars:
      pki_service: "{{ pki_update__test_service }}"
      pki_certificate: '/etc/pki/molecule/cert.pem'
    expect:
      certificates: [ '/etc/pki/molecule/cert.pem' ]
      schedule: '*-*-* 00/4:00:00'

  # Two certificates, the first of certbot, a link to the archive, and an own schedule
  - name: 'molecule-pki-update'
    role_vars:
      pki_service: "{{ pki_update__test_service }}"
      pki_certificate:
        - '/opt/certbot/etc/live/molecule.test/fullchain.pem'
        - '/etc/pki/molecule/second.pem'
      pki_schedule: '*-*-* 00/6:00:00'
    side_effect:
      # A changed schedule restarts the timer
      pki_schedule: '*-*-* 00/8:00:00'
    expect:
      certificates: [ '/opt/certbot/etc/live/molecule.test/fullchain.pem', '/etc/pki/molecule/second.pem' ]
      # The archive of the first certificate
      archive: '/opt/certbot/etc/archive/molecule.test/fullchain1.pem'
      schedule: '*-*-* 00/8:00:00'
