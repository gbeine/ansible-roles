---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/pki-update
#

# The systemd service restarted after a renewal, without .service, e.g. opensmtpd
pki_update__service: "{{ pki_service | mandatory }}"

# The certificate of the service, an absolute path or a list of absolute paths, links are followed,
# e.g. /opt/certbot/etc/live/mx.example.org/fullchain.pem, the service restarts if one of them is renewed
pki_update__certificate: "{{ pki_certificate | mandatory }}"

# OnCalendar of the timer, every four hours by default
pki_update__schedule: "{{ pki_schedule | default('*-*-* 00/4:00:00') }}"

#
# Defaults - do not change
#

pki_update__certificates: "{{ [ pki_update__certificate ] if pki_update__certificate is string else pki_update__certificate }}"

pki_update__systemd_dir: '/etc/systemd/system'
pki_update__name_pattern: '^[A-Za-z0-9_.-]+$'
# Paths are written to Environment= of the unit separated by spaces
pki_update__path_pattern: '^/[A-Za-z0-9_.@+/-]+$'
pki_update__units: [ 'pki-update.service', 'pki-update.timer' ]
pki_update__service_override_dir: "{{ pki_update__systemd_dir }}/pki-update@{{ pki_update__service }}.service.d"
pki_update__timer_override_dir: "{{ pki_update__systemd_dir }}/pki-update@{{ pki_update__service }}.timer.d"
