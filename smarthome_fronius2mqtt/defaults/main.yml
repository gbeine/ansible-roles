---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/smarthome-fronius2mqtt
#

smarthome_fronius2mqtt__home: "{{ fronius2mqtt_home | mandatory }}"
smarthome_fronius2mqtt__ip: "{{ fronius2mqtt_ip | mandatory }}"
smarthome_fronius2mqtt__ipv6: "{{ fronius2mqtt_ipv6 }}"
smarthome_fronius2mqtt__network: "{{ fronius2mqtt_network | mandatory }}"
smarthome_fronius2mqtt__hostname: "{{ fronius2mqtt_hostname | mandatory }}"
smarthome_fronius2mqtt__timezone: "{{ fronius2mqtt_timezone | mandatory }}"

smarthome_fronius2mqtt__version: "{{ fronius2mqtt_version | default('latest') }}"

smarthome_fronius2mqtt__container: "{{ smarthome_fronius2mqtt__container_default | combine(fronius2mqtt_container | default({})) }}"

smarthome_fronius2mqtt__config: "{{ fronius2mqtt_config | mandatory }}"

#
# Defaults - do not change
#

smarthome_fronius2mqtt__podman_name: 'fronius2mqtt'
smarthome_fronius2mqtt__podman_image: 'c0d3.sh/smarthome/fronius2mqtt'
smarthome_fronius2mqtt__podman_tag: "{{ smarthome_fronius2mqtt__version }}"

smarthome_fronius2mqtt__podman_home: "{{ smarthome_fronius2mqtt__home }}"

smarthome_fronius2mqtt__container_default:
  name: "{{ smarthome_fronius2mqtt__podman_name }}"
  hostname: "{{ smarthome_fronius2mqtt__hostname }}"
  image: "{{ smarthome_fronius2mqtt__podman_image }}:{{ smarthome_fronius2mqtt__podman_tag }}"
  ip: "{{ smarthome_fronius2mqtt__ip }}"
  ipv6: "{{ smarthome_fronius2mqtt__ipv6 }}"
  network: "{{ smarthome_fronius2mqtt__network }}"
  timezone: "{{ smarthome_fronius2mqtt__timezone }}"
  publish: []
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ smarthome_fronius2mqtt__podman_home }}/fronius2mqtt.conf:/etc/fronius2mqtt.conf:ro"
