---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/pki-easyrsa-ca
#

# The PKI of Easy-RSA on the controller, shared with pki_easyrsa_cert and pki_easyrsa_deploy
pki_easyrsa_ca__pki_dir: "{{ easyrsa_pki_dir | default(common_globals__pki_secrets_dir ~ '/pki') }}"

pki_easyrsa_ca__cn: "{{ easyrsa_ca_cn | mandatory }}"

# The password of the private key of the CA, from the vault
pki_easyrsa_ca__password: "{{ easyrsa_ca_password | mandatory }}"

# The commands of Easy-RSA and OpenSSL on the controller, without easyrsa_openssl_path Easy-RSA uses its default
pki_easyrsa_ca__path: "{{ easyrsa_path | default('easyrsa') }}"
pki_easyrsa_ca__openssl_path: "{{ easyrsa_openssl_path | default(omit) }}"

# The options of Easy-RSA for the CA (EASYRSA_*, see vars.example of Easy-RSA), null removes an option of the default
pki_easyrsa_ca__config: "{{ pki_easyrsa_ca__config_default | combine(easyrsa_ca_config | default({})) }}"

#
# Defaults - do not change
#

pki_easyrsa_ca__config_default:
  EASYRSA_DN: 'cn_only'
  EASYRSA_ALGO: 'rsa'
  EASYRSA_KEY_SIZE: 2048
  EASYRSA_CA_EXPIRE: 3650
  EASYRSA_CRL_DAYS: 180
  EASYRSA_DIGEST: 'sha256'

# Generated from vars.example of Easy-RSA v3.2.7, the options used by build-ca and gen-crl.
# EASYRSA_PKI, EASYRSA_BATCH, EASYRSA_PASSIN, EASYRSA_PASSOUT, EASYRSA_NO_PASS and EASYRSA_OPENSSL are set by the role,
# EASYRSA_REQ_CN is easyrsa_ca_cn.
pki_easyrsa_ca__config_allowed:
  - 'EASYRSA_DN'
  - 'EASYRSA_REQ_COUNTRY'
  - 'EASYRSA_REQ_PROVINCE'
  - 'EASYRSA_REQ_CITY'
  - 'EASYRSA_REQ_ORG'
  - 'EASYRSA_REQ_EMAIL'
  - 'EASYRSA_REQ_OU'
  - 'EASYRSA_KEY_SIZE'
  - 'EASYRSA_ALGO'
  - 'EASYRSA_CURVE'
  - 'EASYRSA_CA_EXPIRE'
  - 'EASYRSA_CRL_DAYS'
  - 'EASYRSA_DIGEST'
