---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_foundryvtt__test_case: "{{ app_foundryvtt__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  tasks:

    - name: 'Check the instance'
      ansible.builtin.include_tasks: 'tasks/check_instance.yml'
      vars:
        app_foundryvtt__expect: "{{ app_foundryvtt__test_case.expect }}"
