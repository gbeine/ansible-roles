---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  tasks:

    # The same way as documented in docs/notes.md, foundryvtt_instances is defined in test_cases.yml
    - name: 'Run app_foundryvtt for all instances'
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../tasks/loop.yml"
