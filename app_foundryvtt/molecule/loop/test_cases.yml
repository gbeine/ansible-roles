---
# Network created by container_podman in prepare.yml
app_foundryvtt__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_foundryvtt__test_version: '14.369'
app_foundryvtt__test_image: "c0d3cr.io/container/foundry:{{ app_foundryvtt__test_version }}"

app_foundryvtt__test_quadlet_absent: [ 'Environment=TZ=', 'Volume=/etc/localtime', 'Volume=/etc/timezone' ]

# Instances deployed with tasks/loop.yml
foundryvtt_instances:

  - home: '/opt/foundry-one'
    hostname: 'foundry-one'
    ip: '10.89.0.112'
    network: 'podman-molecule'
    timezone: 'Europe/Berlin'
    version: "{{ app_foundryvtt__test_version }}"
    container:
      name: 'foundry-one'

  - home: '/opt/foundry-two'
    hostname: 'foundry-two'
    ip: '10.89.0.113'
    ipv6: 'fd00:89::113'
    network: 'podman-molecule'
    timezone: 'Europe/Berlin'
    version: "{{ app_foundryvtt__test_version }}"
    container:
      name: 'foundry-two'

app_foundryvtt__test_expect:

  - name: 'foundry-one'
    ip: '10.89.0.112'
    ip6: ~
    home: '/opt/foundry-one'
    quadlet:
      - 'Volume=/opt/foundry-one:/data'
      - 'User=99'
      - 'Group=100'
    quadlet_absent: "{{ app_foundryvtt__test_quadlet_absent + [ 'Environment=' ] }}"
    env: []
    urls:
      - 'http://10.89.0.112:30000/api/status'

  - name: 'foundry-two'
    ip: '10.89.0.113'
    ip6: 'fd00:89::113'
    home: '/opt/foundry-two'
    quadlet:
      - 'Volume=/opt/foundry-two:/data'
      - 'User=99'
      - 'Group=100'
    quadlet_absent: "{{ app_foundryvtt__test_quadlet_absent + [ 'Environment=' ] }}"
    env: []
    urls:
      - 'http://10.89.0.113:30000/api/status'
      - 'http://[fd00:89::113]:30000/api/status'
