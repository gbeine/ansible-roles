---

- name: 'Loop over Foundry VTT instances'
  tags: [ 'app', 'app_foundryvtt' ]
  ansible.builtin.include_role:
    name: 'app_foundryvtt'
  loop: "{{ foundryvtt_instances }}"
  loop_control:
    loop_var: 'foundryvtt'
    label: "{{ foundryvtt.hostname }}"
  vars:
    foundryvtt_home: "{{ foundryvtt.home }}"
    foundryvtt_ip: "{{ foundryvtt.ip }}"
    foundryvtt_ipv6: "{{ foundryvtt.ipv6 }}"
    foundryvtt_network: "{{ foundryvtt.network }}"
    foundryvtt_hostname: "{{ foundryvtt.hostname }}"
    foundryvtt_timezone: "{{ foundryvtt.timezone }}"
    foundryvtt_labels: "{{ foundryvtt.labels }}"
    foundryvtt_version: "{{ foundryvtt.version }}"
    foundryvtt_container: "{{ foundryvtt.container }}"
    foundryvtt_environment: "{{ foundryvtt.environment }}"
    foundryvtt_autoupdate_enabled: "{{ foundryvtt.autoupdate_enabled }}"
    foundryvtt_autoupdate_schedule: "{{ foundryvtt.autoupdate_schedule }}"
