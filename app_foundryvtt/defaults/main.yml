---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/foundryvtt
#

# The user data directory of Foundry VTT with Config, Data and Logs
app_foundryvtt__home: "{{ foundryvtt_home | mandatory }}"
app_foundryvtt__ip: "{{ foundryvtt_ip | mandatory }}"
app_foundryvtt__ipv6: "{{ foundryvtt_ipv6 }}"
app_foundryvtt__network: "{{ foundryvtt_network | mandatory }}"
app_foundryvtt__hostname: "{{ foundryvtt_hostname | mandatory }}"
app_foundryvtt__timezone: "{{ foundryvtt_timezone | mandatory }}"
app_foundryvtt__labels: "{{ foundryvtt_labels }}"

# The tag of the image, it contains the release of Foundry VTT the license is valid for
app_foundryvtt__version: "{{ foundryvtt_version | mandatory }}"

# Foundry VTT has no default environment
app_foundryvtt__environment: "{{ foundryvtt_environment }}"

app_foundryvtt__container: "{{ app_foundryvtt__podman_container_default | combine(foundryvtt_container | default({})) }}"

app_foundryvtt__autoupdate_enabled: "{{ foundryvtt_autoupdate_enabled | default(false) }}"
app_foundryvtt__autoupdate_schedule: "{{ foundryvtt_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_foundryvtt__podman_name: 'foundryvtt'
app_foundryvtt__podman_image: 'c0d3cr.io/container/foundry'
app_foundryvtt__podman_tag: "{{ app_foundryvtt__version }}"

app_foundryvtt__podman_home: "{{ app_foundryvtt__home }}"

# The image runs as user 99 without group, the role sets the group 100 of the image (GUID)
app_foundryvtt__uid: 99
app_foundryvtt__gid: 100

# Names of containers
app_foundryvtt__name_pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]*$'

# Generated from dist of Foundry VTT 14.369 and the Dockerfile of node,
# FOUNDRY_DATA, FOUNDRY_HOME and FOUNDRY_VTT_DATA_PATH are set by the image and its command
app_foundryvtt__environment_allowed:
  - 'TZ'
  - 'NODE_OPTIONS'
  - 'FOUNDRY_ACME_DIRECTORY'
  - 'FOUNDRY_IP_SERVICE'
  - 'FOUNDRY_PACKAGE_DETAILS_URL'
  - 'FOUNDRY_PACKAGE_INDEX_URL'
  - 'FOUNDRY_PACKAGE_OWNED_URL'

app_foundryvtt__podman_container_default:
  name: "{{ app_foundryvtt__podman_name }}"
  hostname: "{{ app_foundryvtt__hostname }}"
  image: "{{ app_foundryvtt__podman_image }}:{{ app_foundryvtt__podman_tag }}"
  ip: "{{ app_foundryvtt__ip }}"
  ipv6: "{{ app_foundryvtt__ipv6 | default(omit) }}"
  network: "{{ app_foundryvtt__network }}"
  timezone: "{{ app_foundryvtt__timezone }}"
  labels: "{{ app_foundryvtt__labels | default(omit) }}"
  user: "{{ app_foundryvtt__uid }}:{{ app_foundryvtt__gid }}"
  environment: "{{ app_foundryvtt__environment | default(omit) }}"
  # foundryvtt_container.volumes replaces the list completely
  volumes:
    - "{{ app_foundryvtt__podman_home }}:/data"
