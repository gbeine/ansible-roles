---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/foundryvtt
#

app_foundryvtt__containers: "{{ foundryvtt_containers | default([]) }}"

app_foundryvtt__name: "{{ foundryvtt_name | mandatory }}"
app_foundryvtt__home: "{{ foundryvtt_home | mandatory }}"
app_foundryvtt__ip: "{{ foundryvtt_ip | mandatory }}"
app_foundryvtt__ipv6: "{{ foundryvtt_ipv6 }}"
app_foundryvtt__network: "{{ foundryvtt_network | mandatory }}"
app_foundryvtt__hostname: "{{ foundryvtt_hostname | mandatory }}"
app_foundryvtt__timezone: "{{ foundryvtt_timezone | mandatory }}"
app_foundryvtt__environment: "{{ foundryvtt_environment }}"
app_foundryvtt__labels: "{{ foundryvtt_labels }}"
app_foundryvtt__volumes: "{{ foundryvtt_volumes }}"

app_foundryvtt__version: "{{ foundryvtt_version | mandatory }}"

app_foundryvtt__container: "{{ app_foundryvtt__podman_container_default | combine(foundryvtt_container | default({})) }}"

app_foundryvtt__autoupdate_enabled: "{{ foundryvtt_autoupdate_enabled | default(false) }}"
app_foundryvtt__autoupdate_schedule: "{{ foundryvtt_autoupdate_schedule | default('*-*-* 05:00:00') }}"

#
# Defaults - do not change
#

app_foundryvtt__podman_name: "{{ app_foundryvtt__name }}"
app_foundryvtt__podman_image: 'c0d3.sh/container/foundry'
app_foundryvtt__podman_tag: "{{ app_foundryvtt__version }}"

app_foundryvtt__podman_home: "{{ app_foundryvtt__home }}"

app_foundryvtt__podman_container_default:
  name: "{{ app_foundryvtt__podman_name }}"
  hostname: "{{ app_foundryvtt__hostname }}"
  image: "{{ app_foundryvtt__podman_image }}:{{ app_foundryvtt__podman_tag }}"
  ip: "{{ app_foundryvtt__ip }}"
  ipv6: "{{ app_foundryvtt__ipv6 }}"
  network: "{{ app_foundryvtt__network }}"
  timezone: "{{ app_foundryvtt__timezone }}"
  environment: "{{ app_foundryvtt__environment }}"
  labels: "{{ app_foundryvtt__labels }}"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_foundryvtt__podman_home }}:/data"
