---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/smarthome-mqttbroker
#

smarthome_mqttbroker__home: "{{ mqttbroker_home | mandatory }}"
smarthome_mqttbroker__ip: "{{ mqttbroker_ip | mandatory }}"
smarthome_mqttbroker__ipv6: "{{ mqttbroker_ipv6 | default('') }}"
smarthome_mqttbroker__network: "{{ mqttbroker_network | mandatory }}"
smarthome_mqttbroker__hostname: "{{ mqttbroker_hostname | mandatory }}"
smarthome_mqttbroker__timezone: "{{ mqttbroker_timezone | mandatory }}"

smarthome_mqttbroker__version: "{{ mqttbroker_version | default('latest') }}"

smarthome_mqttbroker__container: "{{ smarthome_mqttbroker__container_default | combine(mqttbroker_container | default({})) }}"

smarthome_mqttbroker__config: "{{ mqttbroker_config | default({}) }}"

#
# Defaults - do not change
#

smarthome_mqttbroker__podman_name: 'mqttbroker'
smarthome_mqttbroker__podman_image: 'docker.io/gbeine/mqttbroker'
smarthome_mqttbroker__podman_tag: "{{ smarthome_mqttbroker__version }}"

smarthome_mqttbroker__podman_home: "{{ smarthome_mqttbroker__home }}"

smarthome_mqttbroker__container_default:
  name: "{{ smarthome_mqttbroker__podman_name }}"
  hostname: "{{ smarthome_mqttbroker__hostname }}"
  image: "{{ smarthome_mqttbroker__podman_image }}:{{ smarthome_mqttbroker__podman_tag }}"
  ip: "{{ smarthome_mqttbroker__ip }}"
  ipv6: "{{ smarthome_mqttbroker__ipv6 }}"
  network: "{{ smarthome_mqttbroker__network }}"
  timezone: "{{ bootstrap_timezone__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ smarthome_mqttbroker__podman_home }}/mqttbroker.conf:/etc/mqttbroker.conf:ro"
