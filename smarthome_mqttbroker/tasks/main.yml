---

- name: 'Install mqttbroker'
  tags: [ 'smarthome_mqttbroker' ]
  block:

    - name: 'Create mqttbroker directories'
      ansible.builtin.file:
        path: "{{ item }}"
        state: 'directory'
      with_items:
        - "{{ smarthome_mqttbroker__home }}"

    - name: 'Generate configuration'
      ansible.builtin.copy:
        content: "{{ smarthome_mqttbroker__config | to_nice_json(indent=4) }}"
        dest: "{{ smarthome_mqttbroker__podman_home }}/mqttbroker.conf"
        mode: '400'
      notify:
        - 'Restart mqttbroker container'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ smarthome_mqttbroker__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[smarthome_mqttbroker__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ smarthome_mqttbroker__container.image }}"
        force: true
      when: 'podman___update_mode'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ smarthome_mqttbroker__container.name }}"
        hostname: "{{ smarthome_mqttbroker__container.hostname }}"
        image: "{{ smarthome_mqttbroker__container.image }}"
        ip: "{{ smarthome_mqttbroker__container.ip }}"
        network: "{{ smarthome_mqttbroker__container.network }}"
        timezone: "{{ smarthome_mqttbroker__container.timezone }}"
        volume: "{{ smarthome_mqttbroker__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'smarthome_mqttbroker__ipv6 | length == 0'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ smarthome_mqttbroker__container.name }}"
        hostname: "{{ smarthome_mqttbroker__container.hostname }}"
        image: "{{ smarthome_mqttbroker__container.image }}"
        ip: "{{ smarthome_mqttbroker__container.ip }}"
        ip6: "{{ smarthome_mqttbroker__container.ipv6 }}"
        network: "{{ smarthome_mqttbroker__container.network }}"
        timezone: "{{ smarthome_mqttbroker__container.timezone }}"
        volume: "{{ smarthome_mqttbroker__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'smarthome_mqttbroker__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ smarthome_mqttbroker__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode is defined and podman___update_mode else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'
