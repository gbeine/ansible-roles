---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    pki_easyrsa__test_case: "{{ pki_easyrsa__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  pre_tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ pki_easyrsa__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  tasks:

    # pki_easyrsa_ca and pki_easyrsa_cert run on the controller, pki_easyrsa_deploy on the host
    - name: 'Run the roles of Easy-RSA'
      ansible.builtin.include_role:
        name: "{{ pki_easyrsa__test_role }}"
      loop: "{{ pki_easyrsa__test_roles }}"
      loop_control:
        loop_var: 'pki_easyrsa__test_role'
