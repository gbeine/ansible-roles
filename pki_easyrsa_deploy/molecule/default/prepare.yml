---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    pki_easyrsa__test_case: "{{ pki_easyrsa__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  tasks:

    # ssl-cert provides the group of the private keys, bootstrap_debian installs it with debian_pki_enable
    - name: 'Install the packages of the PKI'
      ansible.builtin.apt:
        name: [ 'ca-certificates', 'openssl', 'ssl-cert' ]
        state: 'present'
        update_cache: true

    - name: 'Create the group of the realm with owner and group'
      ansible.builtin.group:
        name: 'molecule'
        state: 'present'
      when: pki_easyrsa__test_case.expect.realms | selectattr('owner', 'eq', 'molecule') | list | length > 0

    - name: 'Create the user of the realm with owner and group'
      ansible.builtin.user:
        name: 'molecule'
        group: 'molecule'
        shell: '/usr/sbin/nologin'
        create_home: false
        state: 'present'
      when: pki_easyrsa__test_case.expect.realms | selectattr('owner', 'eq', 'molecule') | list | length > 0
