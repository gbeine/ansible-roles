---

- name: "Create the directories of the realm {{ realm.name }}"
  ansible.builtin.file:
    path: "{{ pki_easyrsa_deploy__realms_dir }}/{{ realm.name }}/{{ item.name }}"
    state: 'directory'
    owner: "{{ realm.owner | default(item.owner) }}"
    group: "{{ realm.group | default(item.group) }}"
    mode: "{{ item.mode }}"
  loop: "{{ pki_easyrsa_deploy__realm_structure }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Copy the private key of the realm {{ realm.name }}"
  ansible.builtin.copy:
    src: "{{ pki_easyrsa_deploy__pki_dir }}/private/{{ realm.name }}.key"
    dest: "{{ pki_easyrsa_deploy__realms_dir }}/{{ realm.name }}/private/{{ realm.name }}.key"
    owner: "{{ realm.owner | default(pki_easyrsa_deploy__private_owner) }}"
    group: "{{ realm.group | default(pki_easyrsa_deploy__private_group) }}"
    mode: "{{ pki_easyrsa_deploy__private_file_mode }}"

# The fullchain is the certificate followed by the CA certificate, both read on the controller
- name: "Copy the certificates of the realm {{ realm.name }}"
  ansible.builtin.copy:
    src: "{{ item.src | default(omit) }}"
    content: "{{ item.content | default(omit) }}"
    dest: "{{ pki_easyrsa_deploy__realms_dir }}/{{ realm.name }}/public/{{ item.dest }}"
    owner: "{{ realm.owner | default(pki_easyrsa_deploy__public_owner) }}"
    group: "{{ realm.group | default(pki_easyrsa_deploy__public_group) }}"
    mode: "{{ pki_easyrsa_deploy__public_file_mode }}"
  loop:
    - src: "{{ pki_easyrsa_deploy__pki_dir }}/issued/{{ realm.name }}.crt"
      dest: "{{ realm.name }}.crt"
    - src: "{{ pki_easyrsa_deploy__pki_dir }}/ca.crt"
      dest: 'ca.crt'
    # The CRL of the CA, written by pki_easyrsa_ca and after revocations by pki_easyrsa_cert
    - src: "{{ pki_easyrsa_deploy__pki_dir }}/crl.pem"
      dest: 'crl.pem'
    - content: >-
        {{ lookup('ansible.builtin.file', pki_easyrsa_deploy__pki_dir ~ '/issued/' ~ realm.name ~ '.crt', rstrip=false)
           ~ lookup('ansible.builtin.file', pki_easyrsa_deploy__pki_dir ~ '/ca.crt', rstrip=false) }}
      dest: "{{ realm.name }}.fullchain.crt"
  loop_control:
    label: "{{ item.dest }}"

# The names of the files of certbot, so services can use certificates of Easy-RSA and ACME the same way
- name: "Create the links of the realm {{ realm.name }} compatible with certbot"
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ pki_easyrsa_deploy__realms_dir }}/{{ realm.name }}/{{ item.dest }}"
    state: 'link'
    force: true
  loop:
    - src: "public/{{ realm.name }}.crt"
      dest: 'cert.pem'
    - src: "public/{{ realm.name }}.fullchain.crt"
      dest: 'fullchain.pem'
    - src: 'public/ca.crt'
      dest: 'chain.pem'
    - src: "private/{{ realm.name }}.key"
      dest: 'privkey.pem'
  loop_control:
    label: "{{ item.dest }}"
