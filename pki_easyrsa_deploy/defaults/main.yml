---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/pki-easyrsa-deploy
#

# The PKI of Easy-RSA on the controller, the source of the certificates
pki_easyrsa_deploy__pki_dir: "{{ easyrsa_pki_dir | default(common_globals__pki_secrets_dir ~ '/pki') }}"

# The commonName of the CA, the name of the CA certificate in the CA certificates of the host
pki_easyrsa_deploy__ca_cn: "{{ easyrsa_ca_cn | mandatory }}"

#
# Defaults - do not change
#

# The realms of the site, the role deploys the realms with easyrsa: true
pki_easyrsa_deploy__realms: "{{ common_globals__pki_realms }}"
pki_easyrsa_deploy__realms_dir: "{{ common_globals__pki_realms_dir }}"
pki_easyrsa_deploy__realm_structure: "{{ common_globals__pki_realm_structure }}"

pki_easyrsa_deploy__private_owner: "{{ common_globals__pki_private_owner }}"
pki_easyrsa_deploy__private_group: "{{ common_globals__pki_private_group }}"
pki_easyrsa_deploy__private_file_mode: "{{ common_globals__pki_private_file_mode }}"
pki_easyrsa_deploy__public_owner: "{{ common_globals__pki_public_owner }}"
pki_easyrsa_deploy__public_group: "{{ common_globals__pki_public_group }}"
pki_easyrsa_deploy__public_file_mode: "{{ common_globals__pki_public_file_mode }}"

pki_easyrsa_deploy__ca_certificates_dir: "{{ common_globals__pki_ca_certificates_dir }}"
pki_easyrsa_deploy__ca_name: "{{ pki_easyrsa_deploy__ca_cn | regex_replace('[^a-zA-Z0-9-_]', '_') }}"
pki_easyrsa_deploy__ca_certificates_file: "{{ pki_easyrsa_deploy__ca_certificates_dir }}/{{ pki_easyrsa_deploy__ca_name }}.crt"

pki_easyrsa_deploy__name_pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
# Users and groups of the realms
pki_easyrsa_deploy__account_pattern: '^[a-z_][a-z0-9_.-]*$'

# The realms with certificates of Easy-RSA, entries that are no dictionaries are reported by the validation
pki_easyrsa_deploy__realms_easyrsa: >-
  {{ pki_easyrsa_deploy__realms | select('mapping') | selectattr('easyrsa', 'defined') | selectattr('easyrsa', 'true') | list
     if pki_easyrsa_deploy__realms is sequence and pki_easyrsa_deploy__realms is not string and pki_easyrsa_deploy__realms is not mapping
     else [] }}
