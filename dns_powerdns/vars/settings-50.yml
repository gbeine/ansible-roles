---
# yamllint disable rule:line-length
#
# Settings of PowerDNS Authoritative Server 5.0
# Generated from: pdns_server --config=default --launch=gpgsql (docker.io/powerdns/pdns-auth-50)
#

dns_powerdns__release_settings:
  - name: "ignore-unknown-settings"
    description: "Configuration settings to ignore if they are unknown"
    default: ""
  - name: "8bit-dns"
    description: "Allow 8bit dns queries"
    default: "no"
  - name: "allow-axfr-ips"
    description: "Allow zonetransfers only to these subnets"
    default: "127.0.0.0/8,::1"
  - name: "allow-dnsupdate-from"
    description: "A global setting to allow DNS updates from these IP ranges."
    default: "127.0.0.0/8,::1"
  - name: "allow-notify-from"
    description: "Allow AXFR NOTIFY from these IP ranges. If empty, drop all incoming notifies."
    default: "0.0.0.0/0,::/0"
  - name: "allow-unsigned-autoprimary"
    description: "Allow autoprimaries to create zones without TSIG signed NOTIFY"
    default: "yes"
  - name: "allow-unsigned-notify"
    description: "Allow unsigned notifications for TSIG secured zones"
    default: "yes"
  - name: "also-notify"
    description: "When notifying a zone, also notify these nameservers"
    default: ""
  - name: "any-to-tcp"
    description: "Answer ANY queries with tc=1, shunting to TCP"
    default: "yes"
  - name: "api"
    description: "Enable/disable the REST API (including HTTP listener)"
    default: "no"
  - name: "api-key"
    description: "Static pre-shared authentication key for access to the REST API"
    default: ""
  - name: "autosecondary"
    description: "Act as an autosecondary"
    default: "no"
  - name: "axfr-fetch-timeout"
    description: "Maximum time in seconds for inbound AXFR to start or be idle after starting"
    default: "10"
  - name: "axfr-lower-serial"
    description: "Also AXFR a zone from a primary with a lower serial"
    default: "no"
  - name: "cache-ttl"
    description: "Seconds to store packets in the PacketCache"
    default: "20"
  - name: "carbon-instance"
    description: "If set overwrites the instance name default"
    default: "auth"
  - name: "carbon-interval"
    description: "Number of seconds between carbon (graphite) updates"
    default: "30"
  - name: "carbon-namespace"
    description: "If set overwrites the first part of the carbon string"
    default: "pdns"
  - name: "carbon-ourname"
    description: "If set, overrides our reported hostname for carbon stats"
    default: ""
  - name: "carbon-server"
    description: "If set, send metrics in carbon (graphite) format to this server IP address"
    default: ""
  - name: "chroot"
    description: "If set, chroot to this directory for more security"
    default: ""
  - name: "config-dir"
    description: "Location of configuration directory (pdns.conf)"
    default: "/etc/powerdns"
  - name: "config-name"
    description: "Name of this virtual configuration - will rename the binary image"
    default: ""
  - name: "consistent-backends"
    description: "Assume individual zones are not divided over backends. Send only ANY lookup operations to the backend to reduce the number of lookups"
    default: "yes"
  - name: "control-console"
    description: "Debugging switch - don't use"
    default: "no"
  - name: "daemon"
    description: "Operate as a daemon"
    default: "no"
  - name: "default-api-rectify"
    description: "Default API-RECTIFY value for zones"
    default: "yes"
  - name: "default-catalog-zone"
    description: "Catalog zone to assign newly created primary zones (via the API) to"
    default: ""
  - name: "default-ksk-algorithm"
    description: "Default KSK algorithm"
    default: "ecdsa256"
  - name: "default-ksk-size"
    description: "Default KSK size (0 means default)"
    default: "0"
  - name: "default-publish-cdnskey"
    description: "Default value for PUBLISH-CDNSKEY"
    default: ""
  - name: "default-publish-cds"
    description: "Default value for PUBLISH-CDS"
    default: ""
  - name: "default-soa-content"
    description: "Default SOA content"
    default: "a.misconfigured.dns.server.invalid hostmaster.@ 0 10800 3600 604800 3600"
  - name: "default-soa-edit"
    description: "Default SOA-EDIT value"
    default: ""
  - name: "default-soa-edit-signed"
    description: "Default SOA-EDIT value for signed zones"
    default: ""
  - name: "default-ttl"
    description: "Seconds a result is valid if not set otherwise"
    default: "3600"
  - name: "default-zsk-algorithm"
    description: "Default ZSK algorithm"
    default: ""
  - name: "default-zsk-size"
    description: "Default ZSK size (0 means default)"
    default: "0"
  - name: "delay-notifications"
    description: "Configure a delay to send out notifications, no delay by default"
    default: "0"
  - name: "direct-dnskey"
    description: "Fetch DNSKEY, CDS and CDNSKEY RRs from backend during DNSKEY or CDS/CDNSKEY synthesis"
    default: "no"
  - name: "direct-dnskey-signature"
    description: "Fetch signature of DNSKEY RRs from backend directly"
    default: "no"
  - name: "disable-axfr"
    description: "Disable zonetransfers but do allow TCP queries"
    default: "no"
  - name: "disable-axfr-rectify"
    description: "Disable the rectify step during an outgoing AXFR. Only required for regression testing."
    default: "no"
  - name: "disable-syslog"
    description: "Disable logging to syslog, useful when running inside a supervisor that logs stderr"
    default: "no"
  - name: "distributor-threads"
    description: "Default number of Distributor (backend) threads to start"
    default: "3"
  - name: "dname-processing"
    description: "If we should support DNAME records"
    default: "no"
  - name: "dnsproxy-udp-port-range"
    description: "Select DNS Proxy outgoing UDP port from given range (lower upper)"
    default: "10000 60000"
  - name: "dnssec-key-cache-ttl"
    description: "Seconds to cache DNSSEC keys from the database"
    default: "30"
  - name: "dnsupdate"
    description: "Enable/Disable DNS update (RFC2136) support. Default is no."
    default: "no"
  - name: "dnsupdate-require-tsig"
    description: "Require TSIG secured DNS updates. Default is no."
    default: "no"
  - name: "domain-metadata-cache-ttl"
    description: "Seconds to cache zone metadata from the database"
    default: ""
  - name: "edns-cookie-secret"
    description: "When set, set a server cookie when responding to a query with a Client cookie (in hex)"
    default: ""
  - name: "edns-subnet-processing"
    description: "If we should act on EDNS Subnet options"
    default: "no"
  - name: "enable-lua-records"
    description: "Process Lua records for all zones (metadata overrides this)"
    default: "no"
  - name: "entropy-source"
    description: "If set, read entropy from this file"
    default: "/dev/urandom"
  - name: "expand-alias"
    description: "Expand ALIAS records"
    default: "no"
  - name: "forward-dnsupdate"
    description: "A global setting to allow DNS update packages that are for a Secondary zone, to be forwarded to the primary."
    default: "yes"
  - name: "forward-notify"
    description: "IP addresses to forward received notifications to regardless of primary or secondary settings"
    default: ""
  - name: "guardian"
    description: "Run within a guardian process"
    default: "no"
  - name: "include-dir"
    description: "Include *.conf files from this directory"
    default: ""
  - name: "launch"
    description: "Which backends to launch and order to query them in"
    default: ""
  - name: "load-modules"
    description: "Load this module - supply absolute or relative path"
    default: ""
  - name: "local-address"
    description: "Local IP addresses to which we bind"
    default: "0.0.0.0, ::"
  - name: "local-address-nonexist-fail"
    description: "Fail to start if one or more of the local-address's do not exist on this server"
    default: "yes"
  - name: "local-port"
    description: "The port on which we listen"
    default: "53"
  - name: "log-dns-details"
    description: "If PDNS should log DNS non-erroneous details"
    default: "no"
  - name: "log-dns-queries"
    description: "If PDNS should log all incoming DNS queries"
    default: "no"
  - name: "log-timestamp"
    description: "Print timestamps in log lines"
    default: "yes"
  - name: "logging-facility"
    description: "Log under a specific facility"
    default: ""
  - name: "loglevel"
    description: "Amount of logging. Higher is more. Do not set below 3"
    default: "4"
  - name: "loglevel-show"
    description: "Include log level indicator in log output"
    default: "no"
  - name: "lua-axfr-script"
    description: "Script to be used to edit incoming AXFRs"
    default: ""
  - name: "lua-consistent-hashes-cleanup-interval"
    description: "Pre-computed hashes cleanup interval (in seconds)"
    default: "3600"
  - name: "lua-consistent-hashes-expire-delay"
    description: "Cleanup pre-computed hashes that haven't been used for the given delay (in seconds). See pickchashed() Lua function"
    default: "86400"
  - name: "lua-dnsupdate-policy-script"
    description: "Lua script with DNS update policy handler"
    default: ""
  - name: "lua-global-include-dir"
    description: "Include *.lua files from this directory into Lua contexts"
    default: ""
  - name: "lua-health-checks-expire-delay"
    description: "Stops doing health checks after the record hasn't been used for that delay (in seconds)"
    default: "3600"
  - name: "lua-health-checks-interval"
    description: "Lua records health checks monitoring interval in seconds"
    default: "5"
  - name: "lua-prequery-script"
    description: "Lua script with prequery handler (DO NOT USE)"
    default: ""
  - name: "lua-records-exec-limit"
    description: "Lua records scripts execution limit (instructions count). Values <= 0 mean no limit"
    default: "1000"
  - name: "lua-records-insert-whitespace"
    description: "Insert whitespace when combining Lua chunks"
    default: "no"
  - name: "max-cache-entries"
    description: "Maximum number of entries in the query cache"
    default: "1000000"
  - name: "max-ent-entries"
    description: "Maximum number of empty non-terminals in a zone"
    default: "100000"
  - name: "max-generate-steps"
    description: "Maximum number of $GENERATE steps when loading a zone from a file"
    default: "0"
  - name: "max-include-depth"
    description: "Maximum number of nested $INCLUDE directives while processing a zone file"
    default: "20"
  - name: "max-nsec3-iterations"
    description: "Limit the number of NSEC3 hash iterations"
    default: "100"
  - name: "max-packet-cache-entries"
    description: "Maximum number of entries in the packet cache"
    default: "1000000"
  - name: "max-pointers-per-name"
    description: "Maximum number of name pointers followed per name"
    default: "10"
  - name: "max-pointers-per-packet-byte"
    description: "Maximum number of name pointers per DNS packet byte followed"
    default: "4"
  - name: "max-pointers-to-pointers"
    description: "Maximum number of name pointers pointing directly to another pointer per name"
    default: "4"
  - name: "max-queue-length"
    description: "Maximum queuelength before considering situation lost"
    default: "5000"
  - name: "max-signature-cache-entries"
    description: "Maximum number of signatures cache entries"
    default: ""
  - name: "max-tcp-connection-duration"
    description: "Maximum time in seconds that a TCP DNS connection is allowed to stay open."
    default: "0"
  - name: "max-tcp-connections"
    description: "Maximum number of TCP connections"
    default: "20"
  - name: "max-tcp-connections-per-client"
    description: "Maximum number of simultaneous TCP connections per client"
    default: "0"
  - name: "max-tcp-transactions-per-conn"
    description: "Maximum number of subsequent queries per TCP connection"
    default: "0"
  - name: "module-dir"
    description: "Default directory for modules"
    default: "/usr/local/lib/pdns"
  - name: "negquery-cache-ttl"
    description: "Seconds to store negative query results in the QueryCache"
    default: "60"
  - name: "no-shuffle"
    description: "Set this to prevent random shuffling of answers - for regression testing"
    default: "off"
  - name: "non-local-bind"
    description: "Enable binding to non-local addresses by using FREEBIND / BINDANY socket options"
    default: "no"
  - name: "only-notify"
    description: "Only send AXFR NOTIFY to these IP addresses or netmasks"
    default: "0.0.0.0/0,::/0"
  - name: "outgoing-axfr-expand-alias"
    description: "Expand ALIAS records during outgoing AXFR"
    default: "no"
  - name: "overload-queue-length"
    description: "Maximum queuelength moving to packetcache only"
    default: "0"
  - name: "prevent-self-notification"
    description: "Don't send notifications to what we think is ourself"
    default: "yes"
  - name: "primary"
    description: "Act as a primary"
    default: "no"
  - name: "proxy-protocol-from"
    description: "A Proxy Protocol header is only allowed from these subnets, and is mandatory then too."
    default: ""
  - name: "proxy-protocol-maximum-size"
    description: "The maximum size of a proxy protocol payload, including the TLV values"
    default: "512"
  - name: "query-cache-ttl"
    description: "Seconds to store query results in the QueryCache"
    default: "20"
  - name: "query-local-address"
    description: "Source IP addresses for sending queries"
    default: "0.0.0.0 ::"
  - name: "query-logging"
    description: "Hint backends that queries should be logged"
    default: "no"
  - name: "queue-limit"
    description: "Maximum number of milliseconds to queue a query"
    default: "1500"
  - name: "receiver-threads"
    description: "Default number of receiver threads to start"
    default: "1"
  - name: "resolve-across-zones"
    description: "Resolve CNAME targets and other referrals across local zones"
    default: "yes"
  - name: "resolver"
    description: "Use this resolver for ALIAS and the internal stub resolver"
    default: "no"
  - name: "retrieval-threads"
    description: "Number of AXFR-retrieval threads for secondary operation"
    default: "2"
  - name: "reuseport"
    description: "Enable higher performance on compliant kernels by using SO_REUSEPORT allowing each receiver thread to open its own socket"
    default: "no"
  - name: "rng"
    description: "Specify the random number generator to use. Valid values are auto,sodium,openssl,getrandom,arc4random,urandom."
    default: "auto"
  - name: "secondary"
    description: "Act as a secondary"
    default: "no"
  - name: "secondary-check-signature-freshness"
    description: "Check signatures in SOA freshness check. Sets DO flag on SOA queries. Outside some very problematic scenarios, say yes here."
    default: "yes"
  - name: "secondary-do-renotify"
    description: "If this secondary should send out notifications after receiving zone transfers from a primary"
    default: "no"
  - name: "security-poll-suffix"
    description: "Zone name from which to query security update notifications"
    default: "secpoll.powerdns.com."
  - name: "send-signed-notify"
    description: "Send TSIG secured NOTIFY if TSIG key is configured for a zone"
    default: "yes"
  - name: "server-id"
    description: "Returned when queried for 'id.server' TXT or NSID, defaults to hostname - disabled or custom"
    default: ""
  - name: "setgid"
    description: "If set, change group id to this gid for more security"
    default: ""
  - name: "setuid"
    description: "If set, change user id to this uid for more security"
    default: ""
  - name: "signing-threads"
    description: "Default number of signer threads to start"
    default: "3"
  - name: "socket-dir"
    description: "Where the controlsocket will live, /var/run/pdns when unset and not chrooted. Set to the RUNTIME_DIRECTORY environment variable when that variable has a value (e.g. under systemd)."
    default: ""
  - name: "svc-autohints"
    description: "Transparently fill ipv6hint=auto ipv4hint=auto SVC params with AAAA/A records for the target name of the record (if within the same zone)"
    default: "no"
  - name: "tcp-control-address"
    description: "If set, PowerDNS can be controlled over TCP on this address"
    default: ""
  - name: "tcp-control-port"
    description: "If set, PowerDNS can be controlled over TCP on this address"
    default: "53000"
  - name: "tcp-control-range"
    description: "If set, remote control of PowerDNS is possible over these networks only"
    default: "127.0.0.0/8, 10.0.0.0/8, 192.168.0.0/16, 172.16.0.0/12, ::1/128, fe80::/10"
  - name: "tcp-control-secret"
    description: "If set, PowerDNS can be controlled over TCP after passing this secret"
    default: ""
  - name: "tcp-fast-open"
    description: "Enable TCP Fast Open support on the listening sockets, using the supplied numerical value as the queue size"
    default: "0"
  - name: "tcp-idle-timeout"
    description: "Maximum time in seconds that a TCP DNS connection is allowed to stay open while being idle"
    default: "5"
  - name: "traceback-handler"
    description: "Enable the traceback handler (Linux only)"
    default: "yes"
  - name: "trusted-notification-proxy"
    description: "IP address of incoming notification proxy"
    default: ""
  - name: "udp-truncation-threshold"
    description: "Maximum UDP response size before we truncate"
    default: "1232"
  - name: "upgrade-unknown-types"
    description: "Transparently upgrade known TYPExxx records. Recommended to keep off, except for PowerDNS upgrades until data sources are cleaned up"
    default: "no"
  - name: "version-string"
    description: "PowerDNS version in packets - full, anonymous, powerdns or custom"
    default: "full"
  - name: "views"
    description: "Enable views (variants) of zones, for backends which support them"
    default: "no"
  - name: "webserver"
    description: "Start a webserver for monitoring (api=yes also enables the HTTP listener)"
    default: "no"
  - name: "webserver-address"
    description: "IP Address or path to UNIX domain socket for webserver/API to listen on"
    default: "127.0.0.1"
  - name: "webserver-allow-from"
    description: "Webserver/API access is only allowed from these subnets"
    default: "127.0.0.1,::1"
  - name: "webserver-connection-timeout"
    description: "Webserver/API request/response timeout in seconds"
    default: "5"
  - name: "webserver-hash-plaintext-credentials"
    description: "Whether to hash passwords and api keys supplied in plaintext, to prevent keeping the plaintext version in memory at runtime"
    default: "no"
  - name: "webserver-loglevel"
    description: "Amount of logging in the webserver (none, normal, detailed)"
    default: "normal"
  - name: "webserver-max-bodysize"
    description: "Webserver/API maximum request/response body size in megabytes"
    default: "2"
  - name: "webserver-password"
    description: "Password required for accessing the webserver"
    default: ""
  - name: "webserver-port"
    description: "Port of webserver/API to listen on"
    default: "8081"
  - name: "webserver-print-arguments"
    description: "If the webserver should print arguments"
    default: "no"
  - name: "workaround-11804"
    description: "Workaround for issue 11804: send single RR per AXFR chunk"
    default: "no"
  - name: "write-pid"
    description: "Write a PID file"
    default: "yes"
  - name: "xfr-cycle-interval"
    description: "Schedule primary/secondary SOA freshness checks once every .. seconds"
    default: "60"
  - name: "xfr-max-received-mbytes"
    description: "Maximum number of megabytes received from an incoming XFR"
    default: "100"
  - name: "zone-cache-refresh-interval"
    description: "Seconds to cache list of known zones"
    default: "300"
  - name: "zone-metadata-cache-ttl"
    description: "Seconds to cache zone metadata from the database"
    default: "60"

dns_powerdns__release_gpgsql_settings:
  - name: "gpgsql-dbname"
    description: "Backend database name to connect to"
    default: ""
  - name: "gpgsql-dnssec"
    description: "Enable DNSSEC processing"
    default: "no"
  - name: "gpgsql-extra-connection-parameters"
    description: "Extra parameters to add to connection string"
    default: ""
  - name: "gpgsql-host"
    description: "Database backend host to connect to"
    default: ""
  - name: "gpgsql-password"
    description: "Database backend password to connect with"
    default: ""
  - name: "gpgsql-port"
    description: "Database backend port to connect to"
    default: ""
  - name: "gpgsql-prepared-statements"
    description: "Use prepared statements instead of parameterized queries"
    default: "yes"
  - name: "gpgsql-user"
    description: "Database backend user to connect as"
    default: ""

# Further settings of the gpgsql backend, written only when set
dns_powerdns__release_gpgsql_queries:
  - "gpgsql-activate-domain-key-query"
  - "gpgsql-add-domain-key-query"
  - "gpgsql-any-id-query"
  - "gpgsql-any-query"
  - "gpgsql-autoprimary-add"
  - "gpgsql-autoprimary-name-to-ips"
  - "gpgsql-autoprimary-query"
  - "gpgsql-autoprimary-remove"
  - "gpgsql-basic-query"
  - "gpgsql-clear-domain-all-keys-query"
  - "gpgsql-clear-domain-all-metadata-query"
  - "gpgsql-clear-domain-metadata-query"
  - "gpgsql-deactivate-domain-key-query"
  - "gpgsql-delete-comment-rrset-query"
  - "gpgsql-delete-comments-query"
  - "gpgsql-delete-domain-query"
  - "gpgsql-delete-empty-non-terminal-query"
  - "gpgsql-delete-names-query"
  - "gpgsql-delete-rrset-query"
  - "gpgsql-delete-tsig-key-query"
  - "gpgsql-delete-zone-query"
  - "gpgsql-get-all-domain-metadata-query"
  - "gpgsql-get-all-domains-query"
  - "gpgsql-get-domain-metadata-query"
  - "gpgsql-get-last-inserted-key-id-query"
  - "gpgsql-get-order-after-query"
  - "gpgsql-get-order-before-query"
  - "gpgsql-get-order-first-query"
  - "gpgsql-get-order-last-query"
  - "gpgsql-get-tsig-key-query"
  - "gpgsql-get-tsig-keys-query"
  - "gpgsql-id-query"
  - "gpgsql-info-all-primary-query"
  - "gpgsql-info-all-secondaries-query"
  - "gpgsql-info-consumer-members-query"
  - "gpgsql-info-producer-members-query"
  - "gpgsql-info-zone-query"
  - "gpgsql-insert-comment-query"
  - "gpgsql-insert-empty-non-terminal-order-query"
  - "gpgsql-insert-record-query"
  - "gpgsql-insert-zone-query"
  - "gpgsql-list-autoprimaries"
  - "gpgsql-list-comments-query"
  - "gpgsql-list-domain-keys-query"
  - "gpgsql-list-query"
  - "gpgsql-list-subzone-query"
  - "gpgsql-nullify-ordername-and-update-auth-query"
  - "gpgsql-nullify-ordername-and-update-auth-type-query"
  - "gpgsql-publish-domain-key-query"
  - "gpgsql-remove-domain-key-query"
  - "gpgsql-remove-empty-non-terminals-from-zone-query"
  - "gpgsql-search-comments-query"
  - "gpgsql-search-records-query"
  - "gpgsql-set-domain-metadata-query"
  - "gpgsql-set-tsig-key-query"
  - "gpgsql-unpublish-domain-key-query"
  - "gpgsql-update-account-query"
  - "gpgsql-update-catalog-query"
  - "gpgsql-update-kind-query"
  - "gpgsql-update-lastcheck-query"
  - "gpgsql-update-options-query"
  - "gpgsql-update-ordername-and-auth-query"
  - "gpgsql-update-ordername-and-auth-type-query"
  - "gpgsql-update-primary-query"
  - "gpgsql-update-serial-query"
