---
# Network created by container_podman in prepare.yml, shared by all test cases
dns_powerdns__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

# Database for the gpgsql backend, started in prepare.yml
dns_powerdns__test_database:
  name: 'molecule-postgres'
  image: 'docker.io/library/postgres:17'
  ip: '10.89.0.20'
  database: 'powerdns'
  user: 'powerdns'
  password: 'molecule-db-password'

dns_powerdns__test_api_key: 'molecule-api-key'

# Role variables shared by all test cases, the release is set per test case
dns_powerdns__test_common:
  powerdns_home: '/opt/powerdns-molecule'
  powerdns_ip: '10.89.0.10'
  powerdns_ipv6: 'fd00:89::10'
  powerdns_network: 'podman-molecule'
  powerdns_hostname: 'powerdns-molecule'
  powerdns_timezone: 'Europe/Berlin'
  powerdns_gpgsql_enabled: true
  powerdns_gpgsql_settings:
    gpgsql-host: '10.89.0.20'
    gpgsql-password: 'molecule-db-password'
  powerdns_settings:
    api: true
    api-key: 'molecule-api-key'
    webserver-address: '0.0.0.0'
    webserver-allow-from: [ '10.89.0.0/24', '127.0.0.1', '::1' ]
    loglevel: 5

# Settings changed in side_effect.yml, the running service must be restarted
dns_powerdns__test_side_effect_settings:
  default-ttl: 600

dns_powerdns__test_cases:

  - name: 'molecule-powerdns-50'
    release: '50'
    expect:
      # Settings only known to this release, written with their default
      settings:
        - 'views=no'
      absent:
        - 'webserver-max-concurrent-connections'

  - name: 'molecule-powerdns-51'
    release: '51'
    expect:
      settings:
        - 'views=no'
        - 'webserver-max-concurrent-connections=100'
      absent: []
