---

- name: 'Install PowerDNS using podman'
  block:

    - name: 'Create PowerDNS directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0755') }}"
        state: 'directory'
      with_items:
        - dest: "{{ dns_powerdns__podman_data_dir }}"
        - dest: "{{ dns_powerdns__podman_config_dir }}"
        - dest: "{{ dns_powerdns__podman_config_dir }}/{{ dns_powerdns__include_subdir }}"
        - dest: "{{ dns_powerdns__podman_run_dir }}"
          owner: '953'
          group: '953'

    - name: 'Generate PowerDNS configuration'
      ansible.builtin.template:
        src: 'pdns.conf.j2'
        dest: "{{ dns_powerdns__podman_config_dir }}/pdns.conf"
      when: 'not podman___update_mode'
      notify: 'Restart PowerDNS container'

    - name: 'Generate PowerDNS pgsql backend configuration'
      ansible.builtin.template:
        src: 'gpgsql.conf.j2'
        dest: "{{ dns_powerdns__podman_config_dir }}/{{ dns_powerdns__include_subdir }}/gpgsql.conf"
      notify: 'Restart PowerDNS container'
      when: 'not podman___update_mode and dns_powerdns__gpgsql'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ dns_powerdns__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[dns_powerdns__container.name + ".service"] is defined'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ dns_powerdns__podman_image }}"
        tag: "{{ dns_powerdns__podman_version }}"
      when: 'podman___update_mode | default(false)'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ dns_powerdns__container.name }}"
        hostname: "{{ dns_powerdns__container.hostname }}"
        image: "{{ dns_powerdns__container.image }}"
        ip: "{{ dns_powerdns__container.ip }}"
        network: "{{ dns_powerdns__container.network }}"
        expose: "{{ dns_powerdns__container.expose }}"
        publish: "{{ dns_powerdns__container.publish }}"
        timezone: "{{ dns_powerdns__container.timezone }}"
        label: "{{ dns_powerdns__container.labels }}"
        volume: "{{ dns_powerdns__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target

          [Service]
          {% if dns_powerdns__container.requires is defined %}
          Requires={{ dns_powerdns__container.requires | join(',') }}
          {% endif %}
          {% if dns_powerdns__container.exec_start_pre is defined %}
          {% for command in dns_powerdns__container.exec_start_pre %}
          ExecStartPre={{ command }}
          {% endfor %}
          {% endif %}
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | default(false) }}"
      when: 'dns_powerdns__ipv6 | length == 0'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ dns_powerdns__container.name }}"
        hostname: "{{ dns_powerdns__container.hostname }}"
        image: "{{ dns_powerdns__container.image }}"
        ip: "{{ dns_powerdns__container.ip }}"
        ip6: "{{ dns_powerdns__container.ipv6 }}"
        network: "{{ dns_powerdns__container.network }}"
        expose: "{{ dns_powerdns__container.expose }}"
        publish: "{{ dns_powerdns__container.publish }}"
        timezone: "{{ dns_powerdns__container.timezone }}"
        label: "{{ dns_powerdns__container.labels }}"
        volume: "{{ dns_powerdns__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target

          [Service]
          {% if dns_powerdns__container.requires is defined %}
          Requires={{ dns_powerdns__container.requires | join(',') }}
          {% endif %}
          {% if dns_powerdns__container.exec_start_pre is defined %}
          {% for command in dns_powerdns__container.exec_start_pre %}
          ExecStartPre={{ command }}
          {% endfor %}
          {% endif %}
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | default(false) }}"
      when: 'dns_powerdns__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ dns_powerdns__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode is defined and podman___update_mode else 'started' }}"
        enabled: true
