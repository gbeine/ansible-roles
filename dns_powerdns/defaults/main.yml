---

dns_powerdns__use_podman: "{{ powerdns_use_podman | default(true) }}"

dns_powerdns__home: "{{ powerdns_home | mandatory }}"
dns_powerdns__ip: "{{ powerdns_ip | mandatory }}"
dns_powerdns__ipv6: "{{ powerdns_ipv6 | default('') }}"
dns_powerdns__network: "{{ powerdns_network | mandatory }}"
dns_powerdns__hostname: "{{ powerdns_hostname | mandatory }}"
dns_powerdns__timezone: "{{ powerdns_timezone | mandatory }}"
dns_powerdns__labels: "{{ powerdns_labels | default({}) }}"

dns_powerdns__publish: "{{ powerdns_publish | default([]) }}"

dns_powerdns__ignore_unknown_settings: "{{ powerdns_ignore_unknown_settings | default([]) }}"
dns_powerdns__8bit_dns: "{{ powerdns_8bit_dns | default(false) }}"
dns_powerdns__allow_axfr_ips: "{{ powerdns_allow_axfr_ips | default([ '127.0.0.0/8', '::1' ]) }}"
dns_powerdns__allow_dnsupdate_from: "{{ powerdns_allow_dnsupdate_from | default([ '127.0.0.0/8', '::1' ]) }}"
dns_powerdns__allow_notify_from: "{{ powerdns_allow_notify_from | default([ '0.0.0.0/0', '::/0' ]) }}"
dns_powerdns__allow_unsigned_autoprimary: "{{ powerdns_allow_unsigned_autoprimary | default(true) }}"
dns_powerdns__allow_unsigned_notify: "{{ powerdns_allow_unsigned_notify | default(true) }}"
dns_powerdns__also_notify: "{{ powerdns_also_notify | default([]) }}"
dns_powerdns__any_to_tcp: "{{ powerdns_any_to_tcp | default(true) }}"
dns_powerdns__api: "{{ powerdns_api | default(false) }}"
dns_powerdns__api_key: "{{ powerdns_api_key | default('') }}"
dns_powerdns__autosecondary: "{{ powerdns_autosecondary | default(false) }}"
dns_powerdns__axfr_fetch_timeout: 10
dns_powerdns__axfr_lower_serial: "{{ powerdns_axfr_lower_serial | default(false) }}"
dns_powerdns__cache_ttl: 20
dns_powerdns__carbon_instance: 'auth'
dns_powerdns__carbon_interval: 30
dns_powerdns__carbon_namespace: 'pdns'
dns_powerdns__carbon_ourname: ''
dns_powerdns__carbon_server: ''
dns_powerdns__chroot: ''
dns_powerdns__config_dir: '/etc/powerdns'
dns_powerdns__config_name: ''
dns_powerdns__consistent_backends: "{{ powerdns_consistent_backends | default(true) }}"
dns_powerdns__control_console: "{{ powerdns_control_console | default(false) }}"
dns_powerdns__daemon: "{{ powerdns_daemon | default(false) }}"
dns_powerdns__default_api_rectify: "{{ powerdns_default_api_rectify | default(true) }}"
dns_powerdns__default_catalog_zone: ''
# https://doc.powerdns.com/authoritative/settings.html#default-ksk-algorithm
dns_powerdns__default_ksk_algorithm: "{{ powerdns_default_ksk_algorithm | default('ecdsa256') }}"
dns_powerdns__default_ksk_size: "{{ powerdns_default_ksk_size | default(0) }}"
dns_powerdns__default_publish_cdnskey: "{{ powerdns_default_publish_cdnskey | default('') }}"
dns_powerdns__default_publish_cds: "{{ powerdns_default_publish_cds | default('') }}"
dns_powerdns__default_soa_content: ''
dns_powerdns__default_soa_edit: ''
dns_powerdns__default_soa_edit_signed: ''
dns_powerdns__default_ttl: 3600
dns_powerdns__default_zsk_algorithm: "{{ powerdns_default_zsk_algorithm | default('') }}"
dns_powerdns__default_zsk_size: "{{ powerdns_default_zsk_size | default(0) }}"
dns_powerdns__delay_notifications: 0
dns_powerdns__direct_dnskey: "{{ powerdns_direct_dnskey | default(false) }}"
dns_powerdns__disable_axfr: "{{ powerdns_disable_axfr | default(false) }}"
dns_powerdns__disable_axfr_rectify: "{{ powerdns_disable_axfr_rectify | default(false) }}"
dns_powerdns__disable_syslog: "{{ powerdns_disable_syslog | default(false) }}"
dns_powerdns__distributor_threads: 3
dns_powerdns__dname_processing: no
dns_powerdns__dnsproxy_udp_port_range: '10000 60000'
dns_powerdns__dnssec_key_cache_ttl: 30
dns_powerdns__dnsupdate: "{{ powerdns_dnsupdate | default(false) }}"
dns_powerdns__dnsupdate_require_tsig: "{{ powerdns_dnsupdate_require_tsig | default(false) }}"
dns_powerdns__edns_cookie_secret: ''
dns_powerdns__edns_subnet_processing: "{{ powerdns_edns_subnet_processing | default(false) }}"
# https://doc.powerdns.com/authoritative/settings.html#enable-gss-tsig
dns_powerdns__enable_gss_tsig: "{{ powerdns_enable_gss_tsig | default(false) }}"
dns_powerdns__enable_lua_records: "{{ powerdns_enable_lua_records | default(false) }}"
dns_powerdns__entropy_source: '/dev/urandom'
dns_powerdns__expand_alias: "{{ powerdns_expand_alias | default(false) }}"
dns_powerdns__resolve_across_zones: "{{ powerdns_resolve_across_zones | default(true) }}"
dns_powerdns__forward_dnsupdate: "{{ powerdns_forward_dnsupdate | default(true) }}"
dns_powerdns__forward_notify: "{{ powerdns_forward_notify | default([]) }}"
dns_powerdns__guardian: "{{ powerdns_guardian | default(false) }}"
dns_powerdns__include_dir: "{{ powerdns_include_dir | default(dns_powerdns__config_dir + '/' + dns_powerdns__include_subdir) }}"
dns_powerdns__launch: "{{ powerdns_launch | default([]) }}"
dns_powerdns__load_modules: "{{ powerdns_load_modules | default([]) }}"
dns_powerdns__local_address: "{{ powerdns_local_address | default([ '0.0.0.0', '::' ]) }}"
dns_powerdns__local_address_nonexist_fail: "{{ powerdns_local_address_nonexist_fail | default(true) }}"
dns_powerdns__local_port: "{{ powerdns_local_port | default(53) }}"
dns_powerdns__log_dns_details: "{{ powerdns_log_dns_details | default(false) }}"
dns_powerdns__log_dns_queries: "{{ powerdns_log_dns_queries | default(false) }}"
dns_powerdns__log_timestamp: "{{ powerdns_log_timestamp | default(true) }}"
dns_powerdns__logging_facility: ''
dns_powerdns__loglevel: "{{ powerdns_loglevel | default(4) }}"
dns_powerdns__loglevel_show: "{{ powerdns_loglevel_show | default(false) }}"
dns_powerdns__lua_axfr_script: ''
dns_powerdns__lua_consistent_hashes_cleanup_interval: 3600
dns_powerdns__lua_consistent_hashes_expire_delay: 86400
dns_powerdns__lua_dnsupdate_policy_script: ''
dns_powerdns__lua_global_include_dir: ''
dns_powerdns__lua_health_checks_expire_delay: 3600
dns_powerdns__lua_health_checks_interval: 5
dns_powerdns__lua_prequery_script: ''
dns_powerdns__lua_records_exec_limit: 1000
dns_powerdns__lua_records_insert_whitespace: "{{ powerdns_lua_records_insert_whitespace | default(true) }}"
dns_powerdns__max_cache_entries: 1000000
dns_powerdns__max_ent_entries: 100000
dns_powerdns__max_generate_steps: 0
dns_powerdns__max_include_depth: 20
dns_powerdns__max_nsec3_iterations: 100
dns_powerdns__max_packet_cache_entries: 1000000
dns_powerdns__max_queue_length: 5000
dns_powerdns__max_signature_cache_entries: 2147483647
dns_powerdns__max_tcp_connection_duration: 0
dns_powerdns__max_tcp_connections: 20
dns_powerdns__max_tcp_connections_per_client: 0
dns_powerdns__max_tcp_transactions_per_conn: 0
dns_powerdns__module_dir: ''
dns_powerdns__negquery_cache_ttl: 60
dns_powerdns__no_shuffle: "{{ powerdns_no_shuffle | default(false) }}"
dns_powerdns__non_local_bind: "{{ powerdns_non_local_bind | default(false) }}"
dns_powerdns__only_notify: "{{ powerdns_only_notify | default([ '0.0.0.0/0', '::/0' ]) }}"
dns_powerdns__outgoing_axfr_expand_alias: "{{ powerdns_outgoing_axfr_expand_alias | default(false) }}"
dns_powerdns__overload_queue_length: 0
dns_powerdns__prevent_self_notification: "{{ powerdns_prevent_self_notification | default(true) }}"
dns_powerdns__primary: "{{ powerdns_primary | default(false) }}"
dns_powerdns__proxy_protocol_from: "{{ powerdns_proxy_protocol_from | default([]) }}"
dns_powerdns__proxy_protocol_maximum_size: 512
dns_powerdns__query_cache_ttl: 20
dns_powerdns__query_local_address: "{{ powerdns_query_local_address | default([ '0.0.0.0', '::' ]) }}"
dns_powerdns__query_logging: "{{ powerdns_query_logging | default(false) }}"
dns_powerdns__queue_limit: 1500
dns_powerdns__receiver_threads: 1
dns_powerdns__resolver: "{{ powerdns_resolver | default([]) }}"
dns_powerdns__retrieval_threads: 2
dns_powerdns__reuseport: "{{ powerdns_reuseport | default(false) }}"
# https://doc.powerdns.com/authoritative/settings.html#rng
dns_powerdns__rng: 'auto'
dns_powerdns__secondary: "{{ powerdns_secondary | default(false) }}"
dns_powerdns__secondary_check_signature_freshness: "{{ powerdns_secondary_check_signature_freshness | default(true) }}"
dns_powerdns__secondary_do_renotify: "{{ powerdns_secondary_do_renotify | default(false) }}"
dns_powerdns__security_poll_suffix: 'secpoll.powerdns.com.'
dns_powerdns__send_signed_notify: "{{ powerdns_send_signed_notify | default(true) }}"
dns_powerdns__server_id: "{{ powerdns_server_id | default(dns_hostname) }}"
dns_powerdns__setgid: ''
dns_powerdns__setuid: ''
dns_powerdns__signing_threads: 3
dns_powerdns__socket_dir: ''
dns_powerdns__svc_autohints: "{{ powerdns_svc_autohints | default(false) }}"
dns_powerdns__tcp_control_address: ''
dns_powerdns__tcp_control_port: 53000
dns_powerdns__tcp_control_range: [ '127.0.0.0/8', '10.0.0.0/8', '192.168.0.0/16', '172.16.0.0/12', '::1/128', 'fe80::/10' ]
dns_powerdns__tcp_control_secret: ''
dns_powerdns__tcp_fast_open: 0
dns_powerdns__tcp_idle_timeout: 5
dns_powerdns__traceback_handler: "{{ powerdns_traceback_handler | default(true) }}"
dns_powerdns__trusted_notification_proxy: "{{ powerdns_trusted_notification_proxy | default([]) }}"
dns_powerdns__udp_truncation_threshold: 1232
dns_powerdns__upgrade_unknown_types: "{{ powerdns_upgrade_unknown_types | default(false) }}"
# https://doc.powerdns.com/authoritative/settings.html#version-string
dns_powerdns__version_string: 'full'
dns_powerdns__views: "{{ powerdns_views | default(false) }}"
dns_powerdns__webserver: "{{ powerdns_webserver | default(false) }}"
dns_powerdns__webserver_address: "{{ powerdns_webserver_address | default('127.0.0.1') }}"
dns_powerdns__webserver_allow_from: "{{ powerdns_webserver_allow_from | default([ '127.0.0.1', '::1' ]) }}"
dns_powerdns__webserver_connection_timeout: 5
dns_powerdns__webserver_hash_plaintext_credentials: "{{ powerdns_webserver_hash_plaintext_credentials | default(false) }}"
dns_powerdns__webserver_loglevel: "{{ powerdns_webserver_loglevel | default('normal') }}"
dns_powerdns__webserver_max_bodysize: 2
dns_powerdns__webserver_password: "{{ powerdns_webserver_password | default('') }}"
dns_powerdns__webserver_port: "{{ powerdns_webserver_port | default(8081) }}"
dns_powerdns__webserver_print_arguments: "{{ powerdns_webserver_print_arguments | default(false) }}"
dns_powerdns__workaround_11804: "{{ powerdns_workaround_11804 | default(false) }}"
dns_powerdns__write_pid: "{{ powerdns_write_pid | default(true) }}"
dns_powerdns__xfr_cycle_interval: 60
dns_powerdns__xfr_max_received_mbytes: 100
dns_powerdns__zone_cache_refresh_interval: 300
dns_powerdns__zone_metadata_cache_ttl: 60

dns_powerdns__gpgsql: "{{ powerdns_backend_gpgsql | default(false) }}"
dns_powerdns__gpgsql_dbname: "{{ powerdns_backend_gpgsql_dbname | default('powerdns') }}"
dns_powerdns__gpgsql_dnssec: "{{ powerdns_backend_gpgsql_dnssec | default(true) }}"
dns_powerdns__gpgsql_extra_connection_parameters: "{{ powerdns_backend_gpgsqlextra_connection_parameters | default('') }}"
dns_powerdns__gpgsql_host: "{{ powerdns_backend_gpgsql_host | mandatory }}"
dns_powerdns__gpgsql_password: "{{ powerdns_backend_gpgsql_password | mandatory }}"
dns_powerdns__gpgsql_gpgsql_port: "{{ powerdns_backend_gpgsql_port | default(5432) }}"
dns_powerdns__gpgsql_prepared_statements: "{{ powerdns_backend_gpgsql_prepared_statements | default(true) }}"
dns_powerdns__gpgsql_user: "{{ powerdns_backend_gpgsql_user | default('powerdns') }}"

dns_powerdns__container: "{{ dns_powerdns__podman_container_default | combine(powerdns_container | default({})) }}"

#
# podman defaults
#

dns_powerdns__include_subdir: 'pdns.d'

dns_powerdns__podman_name: 'powerdns'
dns_powerdns__podman_image: 'docker.io/powerdns/pdns-auth-49'
dns_powerdns__podman_version: 'latest'

dns_powerdns__podman_data_dir: "{{ dns_powerdns__home }}"
dns_powerdns__podman_config_dir: "{{ dns_powerdns__podman_data_dir }}/config"
dns_powerdns__podman_run_dir: "{{ dns_powerdns__podman_data_dir }}/run"

dns_powerdns__podman_container_default:
  name: "{{ dns_powerdns__podman_name }}"
  hostname: "{{ dns_powerdns__hostname }}"
  image: "{{ dns_powerdns__podman_image }}:{{ dns_powerdns__podman_version }}"
  ip: "{{ dns_powerdns__ip }}"
  ipv6: "{{ dns_powerdns__ipv6 }}"
  network: "{{ dns_powerdns__network }}"
  timezone: "{{ dns_powerdns__timezone }}"
  labels: "{{ dns_powerdns__labels }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ dns_powerdns__podman_config_dir }}:{{ dns_powerdns__config_dir }}:ro"
    - "{{ dns_powerdns__podman_run_dir }}:/run/pdns"
  expose:
    - "{{ dns_powerdns__local_port }}/tcp"
    - "{{ dns_powerdns__local_port }}/udp"
    - "{{ dns_powerdns__webserver_port }}/tcp"
  publish: "{{ dns_powerdns__publish }}"
