---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/dns-powerdns
#

dns_powerdns__home: "{{ powerdns_home | mandatory }}"
dns_powerdns__ip: "{{ powerdns_ip | mandatory }}"
dns_powerdns__ipv6: "{{ powerdns_ipv6 }}"
dns_powerdns__network: "{{ powerdns_network | mandatory }}"
dns_powerdns__hostname: "{{ powerdns_hostname | mandatory }}"
dns_powerdns__timezone: "{{ powerdns_timezone | mandatory }}"
dns_powerdns__labels: "{{ powerdns_labels | default({}) }}"

dns_powerdns__release: "{{ powerdns_release | default('49') }}"
dns_powerdns__version: "{{ powerdns_version | default('latest') }}"

dns_powerdns__publish: "{{ powerdns_publish | default([]) }}"

dns_powerdns__settings: "{{ dns_powerdns__settings_default | combine(powerdns_settings | default({})) }}"

dns_powerdns__gpgsql_enabled: "{{ powerdns_gpgsql_enabled | default(false) }}"
dns_powerdns__gpgsql_settings: "{{ dns_powerdns__gpgsql_settings_default | combine(powerdns_gpgsql_settings | default({})) }}"

dns_powerdns__container: "{{ dns_powerdns__podman_container_default | combine(powerdns_container | default({})) }}"

dns_powerdns__autoupdate_enabled: "{{ powerdns_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

dns_powerdns__releases: [ '49', '50', '51' ]

dns_powerdns__config_dir: '/etc/powerdns'
dns_powerdns__include_subdir: 'pdns.d'

dns_powerdns__settings_default:
  include-dir: "{{ dns_powerdns__config_dir }}/{{ dns_powerdns__include_subdir }}"

# Settings written even without value, launch+= in pdns.d needs a parent launch
dns_powerdns__settings_always: [ 'launch' ]

dns_powerdns__gpgsql_settings_default:
  gpgsql-dbname: 'powerdns'
  gpgsql-dnssec: true
  gpgsql-user: 'powerdns'

dns_powerdns__uid: 953
dns_powerdns__gid: 953

dns_powerdns__podman_name: 'powerdns'
dns_powerdns__podman_image: "docker.io/powerdns/pdns-auth-{{ dns_powerdns__release }}"

dns_powerdns__podman_home: "{{ dns_powerdns__home }}"
dns_powerdns__podman_config_dir: "{{ dns_powerdns__podman_home }}/config"
dns_powerdns__podman_run_dir: "{{ dns_powerdns__podman_home }}/run"

dns_powerdns__podman_container_default:
  name: "{{ dns_powerdns__podman_name }}"
  hostname: "{{ dns_powerdns__hostname }}"
  image: "{{ dns_powerdns__podman_image }}:{{ dns_powerdns__version }}"
  ip: "{{ dns_powerdns__ip }}"
  ipv6: "{{ dns_powerdns__ipv6 | default(omit) }}"
  network: "{{ dns_powerdns__network }}"
  timezone: "{{ dns_powerdns__timezone }}"
  labels: "{{ dns_powerdns__labels }}"
  # PowerDNS runs as user pdns in the container and needs to bind to local-port
  sysctls:
    net.ipv4.ip_unprivileged_port_start: "{{ dns_powerdns__settings['local-port'] | default(53) | string }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ dns_powerdns__podman_config_dir }}:{{ dns_powerdns__config_dir }}:ro"
    - "{{ dns_powerdns__podman_run_dir }}:/run/pdns"
  expose:
    - "{{ dns_powerdns__settings['local-port'] | default(53) }}/tcp"
    - "{{ dns_powerdns__settings['local-port'] | default(53) }}/udp"
    - "{{ dns_powerdns__settings['webserver-port'] | default(8081) }}/tcp"
  publish: "{{ dns_powerdns__publish }}"
