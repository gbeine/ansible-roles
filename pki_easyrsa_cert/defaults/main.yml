---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/pki-easyrsa-cert
#

# The PKI of Easy-RSA on the controller, created by pki_easyrsa_ca
pki_easyrsa_cert__pki_dir: "{{ easyrsa_pki_dir | default(common_globals__pki_secrets_dir ~ '/pki') }}"

# The password of the private key of the CA, from the vault
pki_easyrsa_cert__password: "{{ easyrsa_ca_password | mandatory }}"

# The commands of Easy-RSA and OpenSSL on the controller, without easyrsa_openssl_path Easy-RSA uses its default
pki_easyrsa_cert__path: "{{ easyrsa_path | default('easyrsa') }}"
pki_easyrsa_cert__openssl_path: "{{ easyrsa_openssl_path | default(omit) }}"

# The options of Easy-RSA for the certificates (EASYRSA_*, see vars.example of Easy-RSA), null removes an option of the default,
# easyrsa_config of a realm is merged over them
pki_easyrsa_cert__config: "{{ pki_easyrsa_cert__config_default | combine(easyrsa_cert_config | default({})) }}"

# The validity of the CRL written after a revocation, it is an option of the CA
pki_easyrsa_cert__crl_days: "{{ (easyrsa_ca_config | default({})).EASYRSA_CRL_DAYS | default(180, true) }}"

# The realms of the host, set in host_vars, the role creates the certificates of the realms with easyrsa: true
pki_easyrsa_cert__realms: "{{ easyrsa_realms | default([]) }}"

#
# Defaults - do not change
#

# The former variable of the realms, the role rejects it
pki_easyrsa_cert__realms_former: "{{ pki_realms | default([]) | length > 0 }}"

pki_easyrsa_cert__config_default:
  EASYRSA_DN: 'cn_only'
  EASYRSA_ALGO: 'rsa'
  EASYRSA_KEY_SIZE: 2048
  EASYRSA_CERT_EXPIRE: 825
  EASYRSA_PRE_EXPIRY_WINDOW: 30
  EASYRSA_DIGEST: 'sha256'

# Generated from vars.example of Easy-RSA v3.2.7, the options used by build-*-full, renew, revoke and gen-crl.
# EASYRSA_CRL_DAYS is an option of the CA in easyrsa_ca_config.
# EASYRSA_PKI, EASYRSA_BATCH, EASYRSA_PASSIN, EASYRSA_PASSOUT, EASYRSA_NO_PASS and EASYRSA_OPENSSL are set by the role.
pki_easyrsa_cert__config_allowed:
  - 'EASYRSA_DN'
  - 'EASYRSA_REQ_COUNTRY'
  - 'EASYRSA_REQ_PROVINCE'
  - 'EASYRSA_REQ_CITY'
  - 'EASYRSA_REQ_ORG'
  - 'EASYRSA_REQ_EMAIL'
  - 'EASYRSA_REQ_OU'
  - 'EASYRSA_PRESERVE_DN'
  - 'EASYRSA_KEY_SIZE'
  - 'EASYRSA_ALGO'
  - 'EASYRSA_CURVE'
  - 'EASYRSA_CERT_EXPIRE'
  - 'EASYRSA_RAND_SN'
  - 'EASYRSA_PRE_EXPIRY_WINDOW'
  - 'EASYRSA_NS_SUPPORT'
  - 'EASYRSA_NS_COMMENT'
  - 'EASYRSA_DIGEST'

# The keys of a realm read by the role, other keys of a realm belong to other roles
pki_easyrsa_cert__crl_config: { EASYRSA_CRL_DAYS: "{{ pki_easyrsa_cert__crl_days }}" }

pki_easyrsa_cert__realm_keys: [ 'easyrsa', 'easyrsa_type', 'easyrsa_san', 'easyrsa_config' ]
pki_easyrsa_cert__types: [ 'server', 'client', 'cs' ]
pki_easyrsa_cert__name_pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
pki_easyrsa_cert__san_pattern: '^(DNS|IP):[^\s,]+$'

# The realms with certificates of Easy-RSA, entries that are no dictionaries are reported by the validation
pki_easyrsa_cert__realms_easyrsa: >-
  {{ pki_easyrsa_cert__realms | select('mapping') | selectattr('easyrsa', 'defined') | selectattr('easyrsa', 'true') | list
     if pki_easyrsa_cert__realms is sequence and pki_easyrsa_cert__realms is not string and pki_easyrsa_cert__realms is not mapping
     else [] }}
