---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/keeper
#

app_keeper__ip: "{{ keeper_ip | mandatory }}"
app_keeper__ipv6: "{{ keeper_ipv6 }}"
app_keeper__network: "{{ keeper_network | mandatory }}"
app_keeper__hostname: "{{ keeper_hostname | mandatory }}"
app_keeper__timezone: "{{ keeper_timezone | mandatory }}"
app_keeper__labels: "{{ keeper_labels | default({}) }}"

app_keeper__version: "{{ keeper_version | default('2.11') }}"

app_keeper__container: "{{ app_keeper__podman_container_default | combine(keeper_container | default({})) }}"

app_keeper__db_host: "{{ keeper_db_host | mandatory }}"
app_keeper__db_port: "{{ keeper_db_port | default(5432) }}"
app_keeper__db_user: "{{ keeper_db_user | default('keeper') }}"
app_keeper__db_pass: "{{ keeper_db_pass | mandatory }}"
app_keeper__db_name: "{{ keeper_db_name | default('keeper') }}"

app_keeper__redis_host: "{{ keeper_redis_host | mandatory }}"
app_keeper__redis_port: "{{ keeper_redis_port | default(6379) }}"

app_keeper__url: "{{ keeper_url | mandatory }}"
app_keeper__encryption_key: "{{ keeper_encryption_key }}"
app_keeper__better_auth_secret: "{{ keeper_better_auth_secret }}"

#
# Defaults - do not change
#

app_keeper__podman_name: 'keeper'
app_keeper__podman_image: 'ghcr.io/ridafkih/keeper-services'
app_keeper__podman_tag: "{{ app_keeper__version }}"

app_keeper__db_url: "postgres://{{ app_keeper__db_user }}:{{ app_keeper__db_pass }}@{{ app_keeper__db_host }}:{{ app_keeper__db_port }}/{{ app_keeper__db_name }}"

app_keeper__podman_container_default:
  name: "{{ app_keeper__podman_name }}"
  hostname: "{{ app_keeper__hostname }}"
  image: "{{ app_keeper__podman_image }}:{{ app_keeper__podman_tag }}"
  ip: "{{ app_keeper__ip }}"
  ipv6: "{{ app_keeper__ipv6 | default(omit) }}"
  network: "{{ app_keeper__network }}"
  timezone: "{{ app_keeper__timezone }}"
  environment:
    WORKER_JOB_QUEUE_ENABLED: 'true'
    TRUSTED_ORIGINS: "{{ app_keeper__url }}"
    BETTER_AUTH_URL: 'http://localhost:3000/'
    REDIS_URL: "redis://{{ app_keeper__redis_host }}:{{ app_keeper__redis_port }}/"
#    PASSKEY_RP_ID
#    PASSKEY_RP_NAME
#    PASSKEY_ORIGIN
#    GOOGLE_CLIENT_ID
#    MICROSOFT_CLIENT_ID
  labels: "{{ app_keeper__labels }}"
  secrets:
    - "keeper_database_url,type=env,target=DATABASE_URL"
    - "keeper_encryption_key,type=env,target=ENCRYPTION_KEY"
    - "keeper_better_auth_secret,type=env,target=BETTER_AUTH_SECRET"
#    GOOGLE_CLIENT_SECRET8
#    MICROSOFT_CLIENT_SECRET
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
