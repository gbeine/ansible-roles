---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_keeper__test_case: "{{ app_keeper__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    app_keeper__expect: "{{ app_keeper__test_case.expect }}"
    app_keeper__test_url: "http://{{ app_keeper__expect.ip }}:3000"
    # The secrets of the test case, they must not be part of the unit
    app_keeper__test_plain: "{{ app_keeper__test_case.role_vars.keeper_secrets | map(attribute='data') | list }}"

  tasks:

    - name: 'Read the generated quadlet unit'
      ansible.builtin.slurp:
        src: "{{ app_keeper__test_quadlet_path }}"
      register: 'app_keeper__test_quadlet'

    # podman may quote values, the quotes are removed before the lines are compared
    - name: 'Assert the quadlet unit'
      ansible.builtin.assert:
        that:
          - ('Image=' + app_keeper__test_image) in app_keeper__test_quadlet_lines
          - ('IP=' + app_keeper__expect.ip) in app_keeper__test_quadlet_lines
          - app_keeper__expect.ip6 is none or ('IP6=' + app_keeper__expect.ip6) in app_keeper__test_quadlet_lines
          - app_keeper__expect.ip6 is not none or app_keeper__test_quadlet_lines | select('match', 'IP6=') | list | length == 0
          - app_keeper__expect.quadlet | reject('in', app_keeper__test_quadlet_lines) | list | length == 0
          - app_keeper__test_quadlet_lines | select('match', 'Volume=') | list | length == 0
          - app_keeper__test_plain | select('in', app_keeper__test_quadlet.content | b64decode) | list | length == 0
        fail_msg: "{{ app_keeper__test_quadlet_lines | reject('search', 'Secret=') | list | to_json }}"
      vars:
        app_keeper__test_quadlet_lines: "{{ (app_keeper__test_quadlet.content | b64decode | regex_replace('\"', '')).splitlines() }}"

    - name: 'Read the state of the keeper service'
      ansible.builtin.command: 'systemctl is-active keeper'
      register: 'app_keeper__test_service'
      changed_when: false
      failed_when: false

    - name: 'Inspect the keeper container'
      ansible.builtin.command: 'podman inspect keeper'
      register: 'app_keeper__test_inspect'
      changed_when: false

    # The secrets are passed with type=env and are part of the environment of the process, they are left out of the message
    - name: 'Assert the service, the container addresses and the environment'
      ansible.builtin.assert:
        that:
          - app_keeper__test_service.stdout == 'active'
          - app_keeper__test_net.IPAddress == app_keeper__expect.ip
          - app_keeper__expect.ip6 is none or app_keeper__test_net.GlobalIPv6Address == app_keeper__expect.ip6
          - app_keeper__expect.env | reject('in', app_keeper__test_env) | list | length == 0
          - app_keeper__test_env | select('match', '(TZ|COMMERCIAL_MODE)=') | reject('eq', 'COMMERCIAL_MODE=false') | list | length == 0
          - app_keeper__test_container.Config.Timezone == app_keeper__test_case.role_vars.keeper_timezone
        fail_msg: >-
          service {{ app_keeper__test_service.stdout }}, time zone {{ app_keeper__test_container.Config.Timezone | default('') }},
          IPv4 {{ app_keeper__test_net.IPAddress }}, IPv6 {{ app_keeper__test_net.GlobalIPv6Address }},
          environment {{ app_keeper__test_env | reject('search', '(SECRET|KEY|_URL|HEADERS)=') | join(', ') }}
      vars:
        app_keeper__test_container: "{{ (app_keeper__test_inspect.stdout | from_json)[0] }}"
        app_keeper__test_net: "{{ app_keeper__test_container.NetworkSettings.Networks[app_keeper__test_case.role_vars.keeper_network] }}"
        app_keeper__test_env: "{{ app_keeper__test_container.Config.Env }}"

    # systemd counts only the restarts after a crash, a restart loop is reported with the journal
    - name: 'Read the automatic restarts of the service'
      ansible.builtin.command:
        argv: [ 'systemctl', 'show', '--property=NRestarts', '--value', 'keeper' ]
      register: 'app_keeper__test_restarts'
      changed_when: false

    - name: 'Read the journal of the service'
      ansible.builtin.command:
        argv: [ 'journalctl', '-u', 'keeper', '-n', '80', '--no-pager' ]
      register: 'app_keeper__test_journal'
      changed_when: false
      failed_when: false

    - name: 'Assert the service did not restart by itself'
      ansible.builtin.assert:
        that:
          - app_keeper__test_restarts.stdout | int == 0
        fail_msg: "{{ [ 'automatic restarts: ' ~ app_keeper__test_restarts.stdout ] + app_keeper__test_journal.stdout_lines | default([]) }}"

    - name: 'Read the health check'
      ansible.builtin.uri:
        url: "{{ app_keeper__test_url }}/api/health"
        return_content: true
      register: 'app_keeper__test_health'

    # better-auth checks the origin of the requests, it has to be BETTER_AUTH_URL.
    # The second sign-up is refused, the user is stored in PostgreSQL
    - name: 'Sign up twice, sign in with the password and a wrong password'
      ansible.builtin.uri:
        url: "{{ app_keeper__test_url }}/api/auth/username-only/{{ item.action }}"
        method: 'POST'
        body_format: 'json'
        body:
          username: "{{ app_keeper__test_user.username }}"
          password: "{{ item.password }}"
        headers:
          Origin: "{{ app_keeper__expect.url }}"
        status_code: [ 200, 400, 401, 403 ]
        return_content: true
      loop:
        - { name: 'sign-up', action: 'sign-up', password: "{{ app_keeper__test_user.password }}", status: 200 }
        - { name: 'second sign-up', action: 'sign-up', password: "{{ app_keeper__test_user.password }}", status: 400 }
        - { name: 'sign-in', action: 'sign-in', password: "{{ app_keeper__test_user.password }}", status: 200 }
        - { name: 'wrong password', action: 'sign-in', password: 'molecule-wrong-password', status: 401 }
      loop_control:
        label: "{{ item.name }}"
      register: 'app_keeper__test_auth'
      no_log: true

    # The session cookie of the sign-in identifies the user
    - name: 'Read the session of the signed in user'
      ansible.builtin.uri:
        url: "{{ app_keeper__test_url }}/api/auth/get-session"
        headers:
          Cookie: "{{ app_keeper__test_auth.results[2].cookies_string | default('') }}"
          Origin: "{{ app_keeper__expect.url }}"
        return_content: true
      register: 'app_keeper__test_session'

    - name: 'Read the users in PostgreSQL'
      ansible.builtin.command:
        argv: [ 'podman', 'exec', '-e', "PGPASSWORD={{ app_keeper__test_database.password }}", "{{ app_keeper__test_database.name }}",
                'psql', '-h', '127.0.0.1', '-U', 'keeper', '-d', 'keeper', '-tAc', 'SELECT username FROM "user" ORDER BY username' ]
      register: 'app_keeper__test_users'
      changed_when: false

    - name: 'Assert the health check, the sign-ups, the sign-ins, the session and the user'
      ansible.builtin.assert:
        that:
          - (app_keeper__test_health.json | default({})).status | default('') == 'ok'
          - app_keeper__test_status == app_keeper__test_auth.results | map(attribute='item.status') | list
          - (app_keeper__test_session.json | default({}, true)).user.username | default('') == app_keeper__test_user.username
          - app_keeper__test_users.stdout_lines == [ app_keeper__test_user.username ]
        fail_msg: >-
          health {{ app_keeper__test_health.json | default({}) | to_json }},
          auth {{ app_keeper__test_auth.results | map(attribute='item.name') | zip(app_keeper__test_status) | list | to_json }},
          session {{ (app_keeper__test_session.json | default({}, true)).user | default({}) | to_json }},
          users {{ app_keeper__test_users.stdout_lines | to_json }}
      vars:
        app_keeper__test_status: "{{ app_keeper__test_auth.results | map(attribute='status') | list }}"
