---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks:
      - "{{ app_keeper__test_network }}"
    podman_default_network: "{{ app_keeper__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false
    app_keeper__test_services: [ "{{ app_keeper__test_database }}", "{{ app_keeper__test_redis }}" ]

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Pull the images, so the first start of the services does not time out'
      containers.podman.podman_image:
        name: "{{ item }}"
      loop: "{{ [ app_keeper__test_image ] + app_keeper__test_services | map(attribute='image') | list }}"
      register: 'app_keeper__test_pull'
      until: app_keeper__test_pull is succeeded
      retries: 5
      delay: 30

    # Keeper keeps its state in PostgreSQL and Redis
    - name: 'Start PostgreSQL and Redis'
      containers.podman.podman_container:
        name: "{{ item.name }}"
        image: "{{ item.image }}"
        network: "{{ app_keeper__test_network.name }}"
        ip: "{{ item.ip }}"
        env: "{{ item.env }}"
        command: "{{ item.command if item.command | length > 0 else omit }}"
        state: 'started'
      loop: "{{ app_keeper__test_services }}"
      loop_control:
        label: "{{ item.name }}"

    - name: 'Wait for PostgreSQL and Redis'
      ansible.builtin.command:
        argv: "{{ [ 'podman', 'exec', item.name ] + item.ready }}"
      loop: "{{ app_keeper__test_services }}"
      loop_control:
        label: "{{ item.name }}"
      register: 'app_keeper__test_ready'
      until: app_keeper__test_ready.rc == 0 and app_keeper__test_ready.stdout is search('accepting connections|PONG')
      retries: 60
      delay: 2
      changed_when: false
