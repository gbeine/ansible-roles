---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-icinga-web
#

monitoring_icinga_web__home: "{{ icingaweb_home | mandatory }}"
monitoring_icinga_web__ip: "{{ icingaweb_ip | mandatory }}"
monitoring_icinga_web__ipv6: "{{ icingaweb_ipv6 }}"
monitoring_icinga_web__network: "{{ icingaweb_network | mandatory }}"
monitoring_icinga_web__hostname: "{{ icingaweb_hostname | mandatory }}"
monitoring_icinga_web__timezone: "{{ icingaweb_timezone | mandatory }}"
monitoring_icinga_web__labels: "{{ icingaweb_labels }}"

monitoring_icinga_web__version: "{{ icingaweb_version | default('latest') }}"

monitoring_icinga_web__container: "{{ monitoring_icinga_web__podman_container_default | combine(icingaweb_container | default({})) }}"

# Variables of the image, the options of Icinga Web are set with icingaweb_config
monitoring_icinga_web__environment: "{{ icingaweb_environment }}"

# Secrets with name, data and target, the target is <file>.<section>.<option> of a password of icingaweb_config,
# e.g. resources.icingaweb_db.password, or passwords.<backend>.<user> for a user of a database authentication backend
monitoring_icinga_web__secrets: "{{ icingaweb_secrets | default([]) }}"

# The INI files of Icinga Web: file, e.g. resources or modules/icingadb/redis, section and option, merged recursively over the default
monitoring_icinga_web__config: "{{ monitoring_icinga_web__config_default | combine(icingaweb_config | default({}), recursive=true) }}"

# The enabled modules
monitoring_icinga_web__modules: "{{ icingaweb_modules | default(['icingadb']) }}"

monitoring_icinga_web__autoupdate_enabled: "{{ icingaweb_autoupdate_enabled | default(false) }}"
monitoring_icinga_web__autoupdate_schedule: "{{ icingaweb_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The configuration of the former versions of the role
monitoring_icinga_web__config_default:
  config:
    global:
      config_resource: 'icingaweb_db'
    logging:
      log: 'php'
  authentication:
    icingaweb2:
      backend: 'db'
      resource: 'icingaweb_db'
  groups:
    icingaweb2:
      backend: 'db'
      resource: 'icingaweb_db'
  roles:
    Administrators:
      users: 'icingaadmin'
      permissions: '*'
      groups: 'Administrators'
  resources:
    icingaweb_db:
      type: 'db'
      db: 'mysql'
      dbname: 'icingaweb'
      username: 'icingaweb'
      charset: 'utf8mb4'
    icingadb:
      type: 'db'
      db: 'mysql'
      dbname: 'icinga'
      username: 'icingaweb'
      charset: 'utf8mb4'
  modules/icingadb/config:
    icingadb:
      resource: 'icingadb'
  modules/icingadb/redis:
    redis1:
      port: 6379
  modules/icingadb/commandtransports:
    icinga2:
      transport: 'api'

monitoring_icinga_web__config_required:
  - 'resources.icingaweb_db.host'
  - 'resources.icingadb.host'
  - 'modules/icingadb/redis.redis1.host'
  - 'modules/icingadb/commandtransports.icinga2.host'
  - 'modules/icingadb/commandtransports.icinga2.username'

# Generated from application/forms/Config of Icinga Web v2.14.1 and application/forms and library/Icingadb/Common/IcingaRedis.php
# of Icinga DB Web v1.5.0, update with new versions: the options of the files by section, * is any section name,
# the passwords are secrets, roles also take the restrictions of the modules (<module>/<restriction>)
monitoring_icinga_web__config_allowed:
  config:
    global: [ 'config_resource', 'module_path', 'show_application_state_messages', 'show_stacktraces' ]
    logging: [ 'application', 'facility', 'file', 'level', 'log' ]
    themes: [ 'default', 'default_mode', 'disabled' ]
    authentication: [ 'default_domain' ]
  authentication:
    '*': [ 'backend', 'resource', 'domain', 'base_dn', 'filter', 'user_class', 'user_name_attribute', 'strip_username_regexp' ]
  groups:
    '*': [ 'backend', 'resource', 'domain', 'base_dn', 'group_class', 'group_filter', 'group_member_attribute', 'group_name_attribute',
           'nested_group_search', 'user_backend', 'user_base_dn', 'user_class', 'user_filter', 'user_name_attribute' ]
  roles:
    '*': [ 'users', 'groups', 'parent', 'unrestricted', 'permissions', 'refusals' ]
  resources:
    '*': [ 'type', 'db', 'dbname', 'host', 'port', 'username', 'charset', 'use_ssl', 'ssl_ca', 'ssl_capath', 'ssl_cert', 'ssl_cipher',
           'ssl_do_not_verify_server_cert', 'ssl_key', 'hostname', 'encryption', 'root_dn', 'bind_dn', 'timeout', 'filename', 'fields',
           'user', 'private_key' ]
  modules/icingadb/config:
    icingadb: [ 'resource', 'disable_optimizer_for_history_queries' ]
    redis: [ 'tls', 'insecure', 'ca', 'cert', 'key' ]
  modules/icingadb/redis:
    redis1: [ 'host', 'port', 'database', 'username' ]
    redis2: [ 'host', 'port', 'database', 'username' ]
  modules/icingadb/commandtransports:
    '*': [ 'transport', 'host', 'port', 'username' ]

# Restrictions of the modules in roles, e.g. icingadb/filter/objects
monitoring_icinga_web__config_roles_pattern: '^[a-z0-9-]+/[a-z0-9/_-]+$'

# The passwords of the files, they are set with icingaweb_secrets
monitoring_icinga_web__config_secret_options:
  resources: [ 'password', 'bind_pw' ]
  modules/icingadb/redis: [ 'password' ]
  modules/icingadb/commandtransports: [ 'password' ]

monitoring_icinga_web__secrets_required: [ 'resources.icingaweb_db.password', 'resources.icingadb.password' ]

# The users of database authentication backends, the entrypoint of the image creates them from the environment
monitoring_icinga_web__secrets_users_pattern: '^passwords\.[A-Za-z0-9_.-]+\.[^.]+$'

# The former variables of the role and their replacement
monitoring_icinga_web__former_variables:
  icingaweb_admin_password: 'the secret passwords.icingaweb2.icingaadmin'
  icingaweb_redis_host: 'modules/icingadb/redis.redis1.host'
  icingaweb_redis_port: 'modules/icingadb/redis.redis1.port'
  icingaweb_icinga_host: 'modules/icingadb/commandtransports.icinga2.host'
  icingaweb_icinga_user: 'modules/icingadb/commandtransports.icinga2.username'
  icingaweb_icinga_password: 'the secret modules/icingadb/commandtransports.icinga2.password'
  icingaweb_db_host: 'resources.icingaweb_db.host'
  icingaweb_db_name: 'resources.icingaweb_db.dbname'
  icingaweb_db_user: 'resources.icingaweb_db.username'
  icingaweb_db_pass: 'the secret resources.icingaweb_db.password'
  icingaweb_icingadb_host: 'resources.icingadb.host'
  icingaweb_icingadb_name: 'resources.icingadb.dbname'
  icingaweb_icingadb_user: 'resources.icingadb.username'
  icingaweb_icingadb_pass: 'the secret resources.icingadb.password'

# Names of secrets
monitoring_icinga_web__name_pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'

# The variables of the entrypoint of the image that are no options of Icinga Web
monitoring_icinga_web__environment_allowed: [ 'ICINGAWEB_SERIALIZER_COMPAT' ]

# The user www-data of the image
monitoring_icinga_web__uid: 33
monitoring_icinga_web__gid: 33

monitoring_icinga_web__podman_name: 'icingaweb'
monitoring_icinga_web__podman_image: 'docker.io/icinga/icingaweb2'
monitoring_icinga_web__podman_tag: "{{ monitoring_icinga_web__version }}"

monitoring_icinga_web__podman_data_dir: "{{ monitoring_icinga_web__home }}/data"
monitoring_icinga_web__etc_dir: "{{ monitoring_icinga_web__podman_data_dir }}/etc/icingaweb2"
monitoring_icinga_web__container_etc_dir: '/data/etc/icingaweb2'

# The secrets of the files by the files, e.g. { 'resources': { 'icingaweb_db': { 'password': 'secret' } } }, broken entries are left out
monitoring_icinga_web__config_secrets: >-
  {%- set result = {} -%}
  {%- if monitoring_icinga_web__secrets is sequence and monitoring_icinga_web__secrets is not string -%}
  {%-   for secret in monitoring_icinga_web__secrets if secret is mapping and secret.target is defined and secret.data is defined -%}
  {%-     set parts = secret.target | string | regex_search('^(.+)\.([^.]+)\.([^.]+)$', '\\1', '\\2', '\\3') -%}
  {%-     if parts and parts[0] in monitoring_icinga_web__config_secret_options and parts[2] in monitoring_icinga_web__config_secret_options[parts[0]] -%}
  {%-       set _ = result.update({ parts[0]: (result[parts[0]] | default({})) | combine({ parts[1]: { parts[2]: secret.data } }, recursive=true) }) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ result }}

# The files of the configuration with their content: null removes a file, a section or an option,
# the values are quoted and escaped like Icinga Web writes them, booleans are 1 and 0
monitoring_icinga_web__config_files: >-
  {%- set files = {} -%}
  {%- for file, sections in (monitoring_icinga_web__config | combine(monitoring_icinga_web__config_secrets, recursive=true)).items() if sections is mapping -%}
  {%-   set content = {} -%}
  {%-   for section, options in sections.items() if options is mapping -%}
  {%-     set values = {} -%}
  {%-     for key, value in options.items() if value is not none -%}
  {%-       set text = ((value | ternary('1', '0')) if value is boolean else (value | join(',') if (value is sequence and value is not string) else value | string)) -%}
  {%-       set _ = values.update({ key: '"' ~ (text | replace('\\', '\\\\') | replace('"', '\\"')) ~ '"' }) -%}
  {%-     endfor -%}
  {%-     set _ = content.update({ section: values }) -%}
  {%-   endfor -%}
  {%-   set _ = files.update({ file: content }) -%}
  {%- endfor -%}
  {{ files }}

# The files with passwords, they are podman secrets <container name>-<file>, e.g. icingaweb-resources
monitoring_icinga_web__config_secret_files: "{{ monitoring_icinga_web__config_secrets.keys() | list }}"

# The users of database authentication backends as secrets in the environment
monitoring_icinga_web__secrets_env: >-
  {{ (monitoring_icinga_web__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined')
      | selectattr('target', 'match', monitoring_icinga_web__secrets_users_pattern) | list)
     if (monitoring_icinga_web__secrets is sequence and monitoring_icinga_web__secrets is not string) else [] }}

# The podman secrets of the container: the files with passwords and the users
monitoring_icinga_web__container_secrets: >-
  {%- set secrets = [] -%}
  {%- for file in monitoring_icinga_web__config_secret_files -%}
  {%-   set _ = secrets.append(monitoring_icinga_web__container.name ~ '-' ~ (file | replace('/', '-')) ~ ',type=mount,target='
                             ~ monitoring_icinga_web__container_etc_dir ~ '/' ~ file ~ '.ini,uid=' ~ monitoring_icinga_web__uid
                             ~ ',gid=' ~ monitoring_icinga_web__gid ~ ',mode=0400') -%}
  {%- endfor -%}
  {%- for secret in monitoring_icinga_web__secrets_env -%}
  {%-   set _ = secrets.append(secret.name ~ ',type=env,target=icingaweb.' ~ secret.target) -%}
  {%- endfor -%}
  {{ secrets }}

monitoring_icinga_web__podman_container_default:
  name: "{{ monitoring_icinga_web__podman_name }}"
  hostname: "{{ monitoring_icinga_web__hostname }}"
  image: "{{ monitoring_icinga_web__podman_image }}:{{ monitoring_icinga_web__podman_tag }}"
  ip: "{{ monitoring_icinga_web__ip }}"
  ipv6: "{{ monitoring_icinga_web__ipv6 | default(omit) }}"
  network: "{{ monitoring_icinga_web__network }}"
  timezone: "{{ monitoring_icinga_web__timezone }}"
  # The entrypoint enables the modules, it renders no files without further icingaweb.* variables
  environment: >-
    {{ (monitoring_icinga_web__environment if monitoring_icinga_web__environment is defined else {})
       | combine({ 'icingaweb.enabledModules': monitoring_icinga_web__modules | join(',') }) }}
  labels: "{{ monitoring_icinga_web__labels | default(omit) }}"
  # icingaweb_container.volumes replaces the list completely
  volumes:
    - "{{ monitoring_icinga_web__podman_data_dir }}:/data"
