---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-icingaweb
#

monitoring_icinga_web__home: "{{ icingaweb_home | mandatory }}"
monitoring_icinga_web__ip: "{{ icingaweb_ip | mandatory }}"
monitoring_icinga_web__ipv6: "{{ icingaweb_ipv6 }}"
monitoring_icinga_web__network: "{{ icingaweb_network | mandatory }}"
monitoring_icinga_web__hostname: "{{ icingaweb_hostname | mandatory }}"
monitoring_icinga_web__timezone: "{{ icingaweb_timezone | mandatory }}"
monitoring_icinga_web__labels: "{{ icingaweb_labels | default({}) }}"

monitoring_icinga_web__version: "{{ icingaweb_version | default('latest') }}"

monitoring_icinga_web__container: "{{ monitoring_icinga_web__pdoman_container_default | combine(icingaweb_container | default({})) }}"

monitoring_icinga_web__admin_password: "{{ icingaweb_admin_password | mandatory }}"
monitoring_icinga_web__redis_host: "{{ icingaweb_redis_host | mandatory }}"
monitoring_icinga_web__redis_port: "{{ icingaweb_redis_port | default(6379) }}"
monitoring_icinga_web__icinga_host: "{{ icingaweb_icinga_host | mandatory }}"
monitoring_icinga_web__icinga_user: "{{ icingaweb_icinga_user | mandatory }}"
monitoring_icinga_web__icinga_password: "{{ icingaweb_icinga_password | mandatory }}"
monitoring_icinga_web__db_host: "{{ icingaweb_db_host | mandatory }}"
monitoring_icinga_web__db_name: "{{ icingaweb_db_name | default('icingaweb') }}"
monitoring_icinga_web__db_user: "{{ icingaweb_db_user | default('icingaweb') }}"
monitoring_icinga_web__db_password: "{{ icingaweb_db_pass | mandatory }}"
monitoring_icinga_web__icingadb_host: "{{ icingaweb_icingadb_host | mandatory }}"
monitoring_icinga_web__icingadb_name: "{{ icingaweb_icingadb_name | default('icinga') }}"
monitoring_icinga_web__icingadb_user: "{{ icingaweb_icingadb_user | default('icingaweb') }}"
monitoring_icinga_web__icingadb_password: "{{ icingaweb_icingadb_pass | mandatory }}"

#
# Defaults - do not change
#

monitoring_icinga_web__uid: 'www-data'
monitoring_icinga_web__gid: 'www-data'

monitoring_icinga_web__podman_name: 'icingaweb'
monitoring_icinga_web__podman_image: 'docker.io/icinga/icingaweb2'
monitoring_icinga_web__podman_tag: "{{ monitoring_icinga_web__version }}"

monitoring_icinga_web__podman_home: "{{ monitoring_icinga_web__home }}"
monitoring_icinga_web__podman_data_dir: "{{ monitoring_icinga_web__podman_home }}/data"

monitoring_icinga_web__pdoman_container_default:
  name: "{{ monitoring_icinga_web__podman_name }}"
  hostname: "{{ monitoring_icinga_web__hostname }}"
  image: "{{ monitoring_icinga_web__podman_image }}:{{ monitoring_icinga_web__podman_tag }}"
  ip: "{{ monitoring_icinga_web__ip }}"
  ipv6: "{{ monitoring_icinga_web__ipv6 }}"
  network: "{{ monitoring_icinga_web__network }}"
  timezone: "{{ monitoring_icinga_web__timezone }}"
  environment:
    icingaweb.enabledModules: 'icingadb'
    icingaweb.authentication.icingaweb2.backend: 'db'
    icingaweb.authentication.icingaweb2.resource: 'icingaweb_db'
    icingaweb.config.global.config_backend: 'db'
    icingaweb.config.global.config_resource: 'icingaweb_db'
    icingaweb.config.logging.log: 'php'
    icingaweb.groups.icingaweb2.backend: 'db'
    icingaweb.groups.icingaweb2.resource: 'icingaweb_db'
    icingaweb.modules.icingadb.config.icingadb.resource: 'icingadb'
    icingaweb.modules.icingadb.redis.redis1.host: "{{ monitoring_icinga_web__redis_host }}"
    icingaweb.modules.icingadb.redis.redis1.port: "{{ monitoring_icinga_web__redis_port }}"
    icingaweb.modules.icingadb.commandtransports.icinga2.transport: 'api'
    icingaweb.modules.icingadb.commandtransports.icinga2.host: "{{ monitoring_icinga_web__icinga_host }}"
    icingaweb.modules.icingadb.commandtransports.icinga2.username: "{{ monitoring_icinga_web__icinga_user }}"
    icingaweb.resources.icingaweb_db.type: 'db'
    icingaweb.resources.icingaweb_db.db: 'mysql'
    icingaweb.resources.icingaweb_db.host: "{{ monitoring_icinga_web__db_host }}"
    icingaweb.resources.icingaweb_db.dbname: "{{ monitoring_icinga_web__db_name }}"
    icingaweb.resources.icingaweb_db.username: "{{ monitoring_icinga_web__db_user }}"
    icingaweb.resources.icingaweb_db.charset: 'utf8mb4'
    icingaweb.resources.icingadb.type: 'db'
    icingaweb.resources.icingadb.db: 'mysql'
    icingaweb.resources.icingadb.host: "{{ monitoring_icinga_web__icingadb_host }}"
    icingaweb.resources.icingadb.dbname: "{{ monitoring_icinga_web__icingadb_name }}"
    icingaweb.resources.icingadb.username: "{{ monitoring_icinga_web__icingadb_user }}"
    icingaweb.resources.icingadb.charset: 'utf8mb4'
    icingaweb.roles.Administrators.users: 'icingaadmin'
    icingaweb.roles.Administrators.permissions: '*'
    icingaweb.roles.Administrators.groups: 'Administrators'
  labels: "{{ monitoring_icinga_web__labels }}"
  secrets:
    - "icingaweb_admin_password,type=env,target=icingaweb.passwords.icingaweb2.icingaadmin"
    - "icingaweb_icinga_password,type=env,target=icingaweb.modules.icingadb.commandtransports.icinga2.password"
    - "icingaweb_db_password,type=env,target=icingaweb.resources.icingaweb_db.password"
    - "icingaweb_icingadb_password,type=env,target=icingaweb.resources.icingadb.password"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ monitoring_icinga_web__podman_data_dir }}:/data"
