---

- name: 'Install Icinga Web'
  tags: [ 'monitoring', 'monitoring_icinga_web' ]
  block:

    # A failing template in the variables (e.g. icingaweb_container or icingaweb_config not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - monitoring_icinga_web__container | length > 0
          - monitoring_icinga_web__config | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - monitoring_icinga_web__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_icinga_web__invalid | join('. ') }}"
        quiet: true
      vars:
        monitoring_icinga_web__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = monitoring_icinga_web__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('icingaweb_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('icingaweb_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of icingaweb_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    # Icinga Web checks the values of the options when it uses them
    - name: 'Validate the configuration'
      ansible.builtin.assert:
        that:
          - monitoring_icinga_web__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_icinga_web__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_icinga_web__former: >-
          {{ query('ansible.builtin.varnames', '^(' ~ (monitoring_icinga_web__former_variables.keys() | join('|')) ~ ')$') | sort }}
        monitoring_icinga_web__errors: >-
          {%- set errors = [] -%}
          {%- set allowed = monitoring_icinga_web__config_allowed -%}
          {%- set ns = namespace(files=[], values=[], unknown=[], secrets=[], lines=[], present=[]) -%}
          {%- for file, sections in monitoring_icinga_web__config.items() if sections is not none -%}
          {%-   if file not in allowed -%}
          {%-     set ns.files = ns.files + [ file | string ] -%}
          {%-   elif sections is not mapping -%}
          {%-     set ns.values = ns.values + [ file ] -%}
          {%-   else -%}
          {%-     for section, options in sections.items() if options is not none -%}
          {%-       set keys = allowed[file][section] | default(allowed[file]['*'] | default(none)) -%}
          {%-       if keys is none -%}
          {%-         set ns.unknown = ns.unknown + [ file ~ '.' ~ section ] -%}
          {%-       elif options is not mapping -%}
          {%-         set ns.values = ns.values + [ file ~ '.' ~ section ] -%}
          {%-       else -%}
          {%-         for key, value in options.items() if value is not none -%}
          {%-           set path = file ~ '.' ~ section ~ '.' ~ key -%}
          {%-           set _ = ns.present.append(path) -%}
          {%-           if key in monitoring_icinga_web__config_secret_options[file] | default([]) -%}
          {%-             set ns.secrets = ns.secrets + [ path ] -%}
          {%-           elif key not in keys and not (file == 'roles' and key is match(monitoring_icinga_web__config_roles_pattern)) -%}
          {%-             set ns.unknown = ns.unknown + [ path ] -%}
          {%-           elif value is mapping or (value | string ~ '.').splitlines() | length > 1 -%}
          {%-             set ns.lines = ns.lines + [ path ] -%}
          {%-           endif -%}
          {%-         endfor -%}
          {%-       endif -%}
          {%-     endfor -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- set missing = monitoring_icinga_web__config_required | reject('in', ns.present) | list -%}
          {%- if ns.files | length > 0 -%}
          {%-   set _ = errors.append('Unknown files in icingaweb_config: ' ~ (ns.files | join(', ')) ~ ', allowed are ' ~ (allowed.keys() | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.values | length > 0 -%}
          {%-   set _ = errors.append('The files and sections of icingaweb_config are dictionaries: ' ~ (ns.values | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown sections or options in icingaweb_config: ' ~ (ns.unknown | join(', ')) ~ ', allowed are the options of monitoring_icinga_web__config_allowed.') -%}
          {%- endif -%}
          {%- if ns.secrets | length > 0 -%}
          {%-   set _ = errors.append('Passwords are set with icingaweb_secrets, not in icingaweb_config: ' ~ (ns.secrets | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.lines | length > 0 -%}
          {%-   set _ = errors.append('The values of icingaweb_config are strings, numbers, booleans or lists without line breaks: ' ~ (ns.lines | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if missing | length > 0 -%}
          {%-   set _ = errors.append('Icinga Web needs the options ' ~ (monitoring_icinga_web__config_required | join(', ')) ~ ', missing: ' ~ (missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if monitoring_icinga_web__former | length > 0 -%}
          {%-   set names = [] -%}
          {%-   for name in monitoring_icinga_web__former -%}
          {%-     set _ = names.append(name ~ ' (' ~ monitoring_icinga_web__former_variables[name] ~ ')') -%}
          {%-   endfor -%}
          {%-   set _ = errors.append('The options of Icinga Web are set with icingaweb_config now: ' ~ (names | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if monitoring_icinga_web__modules is string or monitoring_icinga_web__modules is not sequence
                 or monitoring_icinga_web__modules | reject('string') | list | length > 0
                 or monitoring_icinga_web__modules | reject('match', '^[a-z0-9-]+$') | list | length > 0 -%}
          {%-   set _ = errors.append('icingaweb_modules has to be a list of names of modules.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the targets of the secrets'
      ansible.builtin.assert:
        that:
          - monitoring_icinga_web__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_icinga_web__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_icinga_web__targets: "{{ monitoring_icinga_web__secrets | map(attribute='target') | map('string') | list }}"
        monitoring_icinga_web__errors: >-
          {%- set errors = [] -%}
          {%- set ns = namespace(unknown=[], sections=[]) -%}
          {%- for target in monitoring_icinga_web__targets if target is not match(monitoring_icinga_web__secrets_users_pattern) -%}
          {%-   set parts = target | regex_search('^(.+)\.([^.]+)\.([^.]+)$', '\\1', '\\2', '\\3') -%}
          {%-   if not parts or parts[0] not in monitoring_icinga_web__config_secret_options or parts[2] not in monitoring_icinga_web__config_secret_options[parts[0]] -%}
          {%-     set ns.unknown = ns.unknown + [ target ] -%}
          {%-   elif (monitoring_icinga_web__config[parts[0]] | default({}))[parts[1]] | default(none) is not mapping -%}
          {%-     set ns.sections = ns.sections + [ target ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- set missing = monitoring_icinga_web__secrets_required | reject('in', monitoring_icinga_web__targets) | list -%}
          {%- set duplicates = monitoring_icinga_web__targets | community.general.counter | dict2items | selectattr('value', 'gt', 1) | map(attribute='key') | list -%}
          {%- set names = monitoring_icinga_web__secrets | map(attribute='name') | map('string') | reject('match', monitoring_icinga_web__name_pattern) | list -%}
          {%- set data = monitoring_icinga_web__secrets | rejectattr('data', 'string') | map(attribute='name') | list
                         + monitoring_icinga_web__secrets | selectattr('data', 'string') | selectattr('data', 'search', '^$|[\r\n]') | map(attribute='name') | list -%}
          {%- if ns.unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (ns.unknown | join(', ')) ~ ', allowed are the passwords of monitoring_icinga_web__config_secret_options'
                                    ~ ' (<file>.<section>.<option>, e.g. resources.icingaweb_db.password) and passwords.<backend>.<user>.') -%}
          {%- endif -%}
          {%- if ns.sections | length > 0 -%}
          {%-   set _ = errors.append('The sections of these secrets are not part of icingaweb_config: ' ~ (ns.sections | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if missing | length > 0 -%}
          {%-   set _ = errors.append('Icinga Web needs the secrets ' ~ (monitoring_icinga_web__secrets_required | join(', ')) ~ ', missing: ' ~ (missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if duplicates | length > 0 -%}
          {%-   set _ = errors.append('Every target of icingaweb_secrets is set once: ' ~ (duplicates | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if names | length > 0 -%}
          {%-   set _ = errors.append('The names of icingaweb_secrets start with a letter or digit, followed by letters, digits, ., _ and -: ' ~ (names | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if data | length > 0 -%}
          {%-   set _ = errors.append('Secrets are strings that are not empty and without line breaks: ' ~ (data | unique | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the environment'
      when: monitoring_icinga_web__environment is defined
      ansible.builtin.assert:
        that:
          - monitoring_icinga_web__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_icinga_web__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_icinga_web__errors: >-
          {%- set errors = [] -%}
          {%- set environment = monitoring_icinga_web__environment -%}
          {%- if environment is not mapping -%}
          {%-   set _ = errors.append('icingaweb_environment has to be a dictionary.') -%}
          {%- else -%}
          {%-   set options = environment.keys() | select('match', '^icingaweb') | list -%}
          {%-   set lines = environment | dict2items | selectattr('value', 'string') | selectattr('value', 'search', '[\r\n]') | map(attribute='key') | list -%}
          {%-   if options | length > 0 -%}
          {%-     set _ = errors.append('The options of Icinga Web are set with icingaweb_config, icingaweb_modules and icingaweb_secrets now: ' ~ (options | join(', ')) ~ '.') -%}
          {%-   endif -%}
          {%-   if lines | length > 0 -%}
          {%-     set _ = errors.append('Values must not contain line breaks: ' ~ (lines | join(', ')) ~ '.') -%}
          {%-   endif -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment of the container after merging icingaweb_container,
    # icingaweb.* would make the entrypoint overwrite the files of the role
    - name: 'Validate the allowed environment variables'
      when: monitoring_icinga_web__container.environment is mapping
      ansible.builtin.assert:
        that:
          - monitoring_icinga_web__unknown | length == 0
        fail_msg: >-
          Unknown environment variables: {{ monitoring_icinga_web__unknown | join(', ') }}.
          Allowed are the variables {{ monitoring_icinga_web__environment_allowed | join(', ') }} and icingaweb.enabledModules,
          the options of Icinga Web are set with icingaweb_config and icingaweb_secrets.
        quiet: true
      vars:
        monitoring_icinga_web__unknown: >-
          {{ monitoring_icinga_web__container.environment.keys()
             | reject('in', monitoring_icinga_web__environment_allowed + [ 'icingaweb.enabledModules' ]) | list }}

    - name: 'Create directories'
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ monitoring_icinga_web__uid }}"
        group: "{{ monitoring_icinga_web__gid }}"
        mode: '0750'
        state: 'directory'
      loop: >-
        {{ [ monitoring_icinga_web__podman_data_dir, monitoring_icinga_web__podman_data_dir ~ '/etc', monitoring_icinga_web__etc_dir ]
           + ((monitoring_icinga_web__config_files.keys() | select('search', '/') | map('dirname') | list)
              + (monitoring_icinga_web__config_files.keys() | select('search', '/.*/') | map('dirname') | map('dirname') | list))
             | unique | sort | map('regex_replace', '^', monitoring_icinga_web__etc_dir ~ '/') | list }}

    # The files without passwords, the files with passwords are podman secrets
    - name: 'Generate the configuration'
      ansible.builtin.copy:
        content: "{{ monitoring_icinga_web__config_files[item] | community.general.to_ini }}"
        dest: "{{ monitoring_icinga_web__etc_dir }}/{{ item }}.ini"
        owner: "{{ monitoring_icinga_web__uid }}"
        group: "{{ monitoring_icinga_web__gid }}"
        mode: '0640'
      loop: "{{ monitoring_icinga_web__config_files.keys() | reject('in', monitoring_icinga_web__config_secret_files) | list }}"
      register: 'monitoring_icinga_web__config_result'

    - name: 'Read the files of the passwords on the host'
      ansible.builtin.stat:
        path: "{{ monitoring_icinga_web__etc_dir }}/{{ item }}.ini"
      loop: "{{ monitoring_icinga_web__config_secret_files }}"
      register: 'monitoring_icinga_web__secret_files_stat'

    # Former versions wrote the passwords to the files, podman leaves an empty file as mount point
    - name: 'Remove the files of the passwords on the host'
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: 'absent'
      loop: "{{ monitoring_icinga_web__secret_files_stat.results | selectattr('stat.exists') | selectattr('stat.size', 'gt', 0) | list }}"
      loop_control:
        label: "{{ item.item }}"

    # Files of icingaweb_config set to null
    - name: 'Remove files of the configuration'
      ansible.builtin.file:
        path: "{{ monitoring_icinga_web__etc_dir }}/{{ item.key }}.ini"
        state: 'absent'
      loop: "{{ monitoring_icinga_web__config | dict2items | selectattr('value', 'none') | list }}"
      loop_control:
        label: "{{ item.key }}"
      register: 'monitoring_icinga_web__config_removed'

    # The files with passwords are complete INI files, they never exist on the host
    - name: 'Create the secrets of the files with passwords'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ monitoring_icinga_web__container.name }}-{{ item | replace('/', '-') }}"
        data: "{{ monitoring_icinga_web__config_files[item] | community.general.to_ini }}"
      loop: "{{ monitoring_icinga_web__config_secret_files }}"
      register: 'monitoring_icinga_web__config_secrets_result'

    - name: 'Create the secrets of the users'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ monitoring_icinga_web__secrets_env }}"
      register: 'monitoring_icinga_web__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ monitoring_icinga_web__container.name }}"
        hostname: "{{ monitoring_icinga_web__container.hostname }}"
        image: "{{ monitoring_icinga_web__container.image }}"
        ip: "{{ monitoring_icinga_web__container.ip }}"
        ip6: "{{ monitoring_icinga_web__container.ipv6 | default(omit) }}"
        network: "{{ monitoring_icinga_web__container.network }}"
        timezone: "{{ monitoring_icinga_web__container.timezone }}"
        command: "{{ monitoring_icinga_web__container.command | default(omit) }}"
        env: "{{ monitoring_icinga_web__container.environment | default(omit) }}"
        etc_hosts: "{{ monitoring_icinga_web__container.etc_hosts | default(omit) }}"
        expose: "{{ monitoring_icinga_web__container.expose | default(omit) }}"
        label: "{{ monitoring_icinga_web__container.labels | default(omit) }}"
        publish: "{{ monitoring_icinga_web__container.publish | default(omit) }}"
        secrets: "{{ monitoring_icinga_web__container_secrets }}"
        volume: "{{ monitoring_icinga_web__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if monitoring_icinga_web__container.requires is defined %}
          Requires={{ monitoring_icinga_web__container.requires | join(' ') }}
          {% endif %}
          {% if monitoring_icinga_web__container.wants is defined %}
          Wants={{ monitoring_icinga_web__container.wants | join(' ') }}
          {% endif %}
          {% if monitoring_icinga_web__container.after is defined %}
          After={{ monitoring_icinga_web__container.after | join(' ') }}
          {% endif %}
          {% if monitoring_icinga_web__container.part_of is defined %}
          PartOf={{ monitoring_icinga_web__container.part_of | join(' ') }}
          {% endif %}
          {% if monitoring_icinga_web__container.binds_to is defined %}
          BindsTo={{ monitoring_icinga_web__container.binds_to | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'monitoring_icinga_web__quadlet_result'

    # A failed start of the service only reports the exit code, the reason is in the journal
    - name: 'Start Icinga Web'
      when: 'not ansible_check_mode'
      block:

        - name: 'Start and enable container'
          ansible.builtin.systemd_service:
            name: "{{ monitoring_icinga_web__container.name }}"
            daemon_reload: true
            state: "{{ 'restarted' if monitoring_icinga_web__restart | bool else 'started' }}"
            enabled: true
          vars:
            monitoring_icinga_web__running: >-
              {{ (ansible_facts.services[monitoring_icinga_web__container.name + '.service'].state | default('')) == 'running' }}
            monitoring_icinga_web__restart: >-
              {{ monitoring_icinga_web__running | bool
                 and (monitoring_icinga_web__config_result is changed
                      or monitoring_icinga_web__config_removed is changed
                      or monitoring_icinga_web__config_secrets_result is changed
                      or monitoring_icinga_web__secrets_result is changed
                      or monitoring_icinga_web__quadlet_result is changed) }}

      rescue:

        - name: 'Read the log of the failed start'
          ansible.builtin.command:
            argv: [ 'journalctl', '-u', "{{ monitoring_icinga_web__container.name }}", '-n', '80', '--no-pager' ]
          register: 'monitoring_icinga_web__start_journal'
          changed_when: false

        - name: 'Fail with the log of the failed start'
          ansible.builtin.fail:
            msg: "{{ [ monitoring_icinga_web__container.name ~ ' did not start' ] + monitoring_icinga_web__start_journal.stdout_lines }}"

    # The entrypoint imports the schema and creates the users before Apache starts, it exits if that fails
    - name: 'Wait for Icinga Web'
      ansible.builtin.uri:
        url: "http://{{ monitoring_icinga_web__container.ip }}:8080/authentication/login"
      register: 'monitoring_icinga_web__ready'
      until: monitoring_icinga_web__ready.status | default(-1) == 200
      retries: 40
      delay: 3
      failed_when: false
      when: 'not ansible_check_mode'

    - name: 'Read the log of Icinga Web'
      when:
        - not ansible_check_mode
        - monitoring_icinga_web__ready.status | default(-1) != 200
      ansible.builtin.command:
        argv: [ 'journalctl', '-u', "{{ monitoring_icinga_web__container.name }}", '-n', '60', '--no-pager' ]
      register: 'monitoring_icinga_web__journal'
      changed_when: false

    - name: 'Assert that Icinga Web answers'
      when: 'not ansible_check_mode'
      ansible.builtin.assert:
        that:
          - monitoring_icinga_web__journal is skipped
        fail_msg: "{{ monitoring_icinga_web__journal.stdout_lines | default([]) }}"
        quiet: true

    - name: 'Enable autoupdate on container'
      when: 'monitoring_icinga_web__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ monitoring_icinga_web__container.name }}"
        container_image: "{{ monitoring_icinga_web__container.image }}"
        container_schedule: "{{ monitoring_icinga_web__autoupdate_schedule }}"
