---
# Network created by container_podman in prepare.yml
app_meilisearch__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_meilisearch__test_image: 'docker.io/getmeili/meilisearch:v1.41.0'
app_meilisearch__test_quadlet_path: '/etc/containers/systemd/meilisearch.container'

# The document of the search test, added before the restart of the side effect on molecule-meilisearch
app_meilisearch__test_document:
  id: 1
  title: 'Molecule bookmarks of Karakeep'

app_meilisearch__test_cases:

  # Only the mandatory variables and the master key
  - name: 'molecule-meilisearch-default'
    role_vars:
      meilisearch_home: '/opt/meilisearch'
      meilisearch_ip: '10.89.0.95'
      meilisearch_network: 'podman-molecule'
      meilisearch_hostname: 'meilisearch-default'
      meilisearch_timezone: 'Europe/Berlin'
      meilisearch_secrets:
        - name: 'meilisearch_master_key'
          data: 'molecule-master-key-default'
          target: 'MEILI_MASTER_KEY'
    expect:
      ip: '10.89.0.95'
      ip6: ~
      master_key: 'molecule-master-key-default'
      quadlet:
        - 'Secret=meilisearch_master_key,type=env,target=MEILI_MASTER_KEY'
        - 'Volume=/opt/meilisearch/data:/meili_data:Z'
      env:
        - 'TZ=Europe/Berlin'
        - 'MEILI_ENV=production'
        - 'MEILI_NO_ANALYTICS=true'

  # IPv6, labels, the log level, the indexing threads and a boolean
  - name: 'molecule-meilisearch'
    role_vars:
      meilisearch_home: '/opt/meilisearch'
      meilisearch_ip: '10.89.0.96'
      meilisearch_ipv6: 'fd00:89::96'
      meilisearch_network: 'podman-molecule'
      meilisearch_hostname: 'meilisearch-molecule'
      meilisearch_timezone: 'Europe/Berlin'
      meilisearch_labels:
        traefik.enable: 'false'
      meilisearch_environment:
        MEILI_LOG_LEVEL: 'WARN'
        MEILI_MAX_INDEXING_THREADS: '1'
        MEILI_EXPERIMENTAL_ENABLE_METRICS: true
      meilisearch_secrets:
        - name: 'meilisearch_master_key'
          data: 'molecule-master-key-options'
          target: 'MEILI_MASTER_KEY'
    # A valid change of the side effect, the quadlet unit changes and Meilisearch has to restart
    side_effect:
      meilisearch_environment:
        MEILI_LOG_LEVEL: 'INFO'
        MEILI_MAX_INDEXING_THREADS: '1'
        MEILI_EXPERIMENTAL_ENABLE_METRICS: true
    expect:
      ip: '10.89.0.96'
      ip6: 'fd00:89::96'
      master_key: 'molecule-master-key-options'
      quadlet:
        - 'Secret=meilisearch_master_key,type=env,target=MEILI_MASTER_KEY'
        - 'Label=traefik.enable=false'
      env:
        - 'TZ=Europe/Berlin'
        - 'MEILI_ENV=production'
        - 'MEILI_NO_ANALYTICS=true'
        - 'MEILI_LOG_LEVEL=INFO'
        - 'MEILI_MAX_INDEXING_THREADS=1'
        - 'MEILI_EXPERIMENTAL_ENABLE_METRICS=true'
