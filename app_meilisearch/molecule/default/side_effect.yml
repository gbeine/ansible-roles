---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_meilisearch__test_case: "{{ app_meilisearch__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    app_meilisearch__test_vars: "{{ app_meilisearch__test_case.role_vars }}"
    app_meilisearch__test_environment: "{{ app_meilisearch__test_vars.meilisearch_environment | default({}) }}"
    app_meilisearch__test_secrets: "{{ app_meilisearch__test_vars.meilisearch_secrets }}"
    app_meilisearch__test_url: "http://{{ app_meilisearch__test_case.expect.ip }}:7700"
    app_meilisearch__test_config: "{{ app_meilisearch__test_vars.meilisearch_config | default({}) }}"
    app_meilisearch__test_checked_files:
      - "{{ app_meilisearch__test_quadlet_path }}"
      - "{{ app_meilisearch__test_config_path }}"

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ app_meilisearch__test_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksums of the checked files before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ app_meilisearch__test_checked_files }}"
      register: 'app_meilisearch__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include

    - name: 'Run app_meilisearch with meilisearch_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_container: [ 'environment' ]
        app_meilisearch__test_invalid:
          message: 'meilisearch_container not a dictionary'
          search: 'failed to combine variables, expected dicts'

    - name: 'Run app_meilisearch with a secret without target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_secrets: "{{ app_meilisearch__test_secrets + [ { 'name': 'meilisearch_other', 'data': 'x' } ] }}"
        app_meilisearch__test_invalid:
          message: 'a secret without target'
          search: '^`meilisearch_secrets` entries need name, data and target$'

    - name: 'Run app_meilisearch without the master key (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_secrets: []
        app_meilisearch__test_invalid:
          message: 'no master key'
          search: '^Meilisearch needs the secrets MEILI_MASTER_KEY, missing: MEILI_MASTER_KEY\.$'

    - name: 'Run app_meilisearch with a short master key (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_secrets:
          - name: 'meilisearch_master_key'
            data: 'shortkey'
            target: 'MEILI_MASTER_KEY'
        app_meilisearch__test_invalid:
          message: 'a short master key'
          search: '^The secret MEILI_MASTER_KEY needs at least 16 characters\.$'

    - name: 'Run app_meilisearch with the master key in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_environment: "{{ app_meilisearch__test_environment | combine({ 'MEILI_MASTER_KEY': 'molecule-master-key-plain' }) }}"
        app_meilisearch__test_invalid:
          message: 'the master key in the environment'
          search: '^Secrets must not be set in meilisearch_environment: MEILI_MASTER_KEY\.$'

    - name: 'Run app_meilisearch with meilisearch_config not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_config: [ 'log_level' ]
        app_meilisearch__test_invalid:
          message: 'meilisearch_config not a dictionary'
          search: 'failed to combine variables, expected dicts'

    - name: 'Run app_meilisearch with an unknown option (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_config: "{{ app_meilisearch__test_config | combine({ 'experimental_dumpless_upgrade': true }) }}"
        app_meilisearch__test_invalid:
          message: 'an unknown option'
          search: '^Unknown options in meilisearch_config: experimental_dumpless_upgrade\.'

    - name: 'Run app_meilisearch with the master key in the configuration (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_config: "{{ app_meilisearch__test_config | combine({ 'master_key': 'molecule-master-key-plain' }) }}"
        app_meilisearch__test_invalid:
          message: 'the master key in the configuration'
          search: '^These options are passed as secrets with meilisearch_secrets, not in meilisearch_config: MEILI_MASTER_KEY\.$'

    - name: 'Run app_meilisearch with an invalid environment of Meilisearch (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_config: "{{ app_meilisearch__test_config | combine({ 'env': 'test' }) }}"
        app_meilisearch__test_invalid:
          message: 'an invalid environment of Meilisearch'
          search: '^env has to be one of production, development, got test\.$'

    - name: 'Run app_meilisearch with a string as boolean in the configuration (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_config: "{{ app_meilisearch__test_config | combine({ 'no_analytics': 'true' }) }}"
        app_meilisearch__test_invalid:
          message: 'a string as boolean in the configuration'
          search: '^These options are booleans, use true or false without quotes: no_analytics\.$'

    - name: 'Run app_meilisearch with a line break in an option (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_config: "{{ app_meilisearch__test_config | combine({ 'log_level': 'WARN\nDEBUG' }) }}"
        app_meilisearch__test_invalid:
          message: 'a line break in an option'
          search: '^Options must not contain line breaks: log_level\.$'

    - name: 'Run app_meilisearch with an invalid boolean in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_environment: "{{ app_meilisearch__test_environment | combine({ 'MEILI_IGNORE_MISSING_DUMP': 'yes' }) }}"
        app_meilisearch__test_invalid:
          message: 'an invalid boolean in the environment'
          search: '^These variables have to be the strings true or false: MEILI_IGNORE_MISSING_DUMP\.$'

    - name: 'Run app_meilisearch with a line break in a value (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_environment: "{{ app_meilisearch__test_environment | combine({ 'MEILI_IMPORT_DUMP': '/meili_data/dumps/a.dump\nb', 'MEILI_IGNORE_DUMP_IF_DB_EXISTS': 'true' }) }}"
        app_meilisearch__test_invalid:
          message: 'a line break in a value'
          search: '^Values must not contain line breaks: MEILI_IMPORT_DUMP\.$'

    - name: 'Run app_meilisearch with MEILI_IGNORE_MISSING_DUMP without MEILI_IMPORT_DUMP (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_environment:
          MEILI_IGNORE_MISSING_DUMP: 'true'
        app_meilisearch__test_invalid:
          message: 'MEILI_IGNORE_MISSING_DUMP without MEILI_IMPORT_DUMP'
          search: '^MEILI_IGNORE_MISSING_DUMP needs MEILI_IMPORT_DUMP\.$'

    - name: 'Run app_meilisearch with MEILI_IMPORT_DUMP without MEILI_IGNORE_DUMP_IF_DB_EXISTS (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_environment:
          MEILI_IMPORT_DUMP: '/meili_data/dumps/molecule.dump'
        app_meilisearch__test_invalid:
          message: 'MEILI_IMPORT_DUMP without MEILI_IGNORE_DUMP_IF_DB_EXISTS'
          search: "^MEILI_IMPORT_DUMP needs MEILI_IGNORE_DUMP_IF_DB_EXISTS: 'true', the quadlet unit imports on every start\\.$"

    - name: 'Run app_meilisearch with MEILI_IMPORT_DUMP and MEILI_IMPORT_SNAPSHOT (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_environment:
          MEILI_IMPORT_DUMP: '/meili_data/dumps/molecule.dump'
          MEILI_IGNORE_DUMP_IF_DB_EXISTS: 'true'
          MEILI_IMPORT_SNAPSHOT: '/meili_data/snapshots/molecule.snapshot'
          MEILI_IGNORE_SNAPSHOT_IF_DB_EXISTS: 'true'
        app_meilisearch__test_invalid:
          message: 'MEILI_IMPORT_DUMP and MEILI_IMPORT_SNAPSHOT'
          search: '^MEILI_IMPORT_DUMP and MEILI_IMPORT_SNAPSHOT cannot be set together\.$'

    - name: 'Run app_meilisearch with MEILI_CONFIG_FILE_PATH in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_environment: "{{ app_meilisearch__test_environment | combine({ 'MEILI_CONFIG_FILE_PATH': '/meili_data/config.toml' }) }}"
        app_meilisearch__test_invalid:
          message: 'MEILI_CONFIG_FILE_PATH in the environment'
          search: '^These variables are set by the role and must not be set in meilisearch_environment: MEILI_CONFIG_FILE_PATH\.$'

    - name: 'Run app_meilisearch with an option in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_environment: "{{ app_meilisearch__test_environment | combine({ 'MEILI_LOG_LEVEL': 'DEBUG' }) }}"
        app_meilisearch__test_invalid:
          message: 'an option in the environment'
          search: '^Unknown environment variables: MEILI_LOG_LEVEL\.'

    - name: 'Run app_meilisearch with an unknown environment variable (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_environment: "{{ app_meilisearch__test_environment | combine({ 'MEILI_SERVER_PROVIDER': 'molecule' }) }}"
        app_meilisearch__test_invalid:
          message: 'an unknown environment variable'
          search: '^Unknown environment variables: MEILI_SERVER_PROVIDER\.'

    - name: 'Run app_meilisearch with an unknown secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        meilisearch_secrets: "{{ app_meilisearch__test_secrets + [ { 'name': 'meilisearch_api_key', 'data': 'x', 'target': 'MEILI_API_KEY' } ] }}"
        app_meilisearch__test_invalid:
          message: 'an unknown secret'
          search: '^Unknown secrets: MEILI_API_KEY\.'

    - name: 'Change the configuration of Meilisearch'
      when: app_meilisearch__test_case.side_effect is defined
      block:

        # verify finds the document after the restart, the data is kept in the volume
        - name: 'Add the document of the search test before the restart'
          ansible.builtin.include_tasks: 'tasks/add_document.yml'

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'meilisearch' ]
          register: 'app_meilisearch__test_started_before'
          changed_when: false

        - name: 'Set the changed configuration'
          ansible.builtin.set_fact:
            meilisearch_config: "{{ app_meilisearch__test_case.side_effect.meilisearch_config }}"

        - name: 'Run app_meilisearch with the changed configuration'
          ansible.builtin.include_role:
            name: 'app_meilisearch'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'meilisearch' ]
          register: 'app_meilisearch__test_started_after'
          changed_when: false

        # Only the configuration file changes, the quadlet unit is unchanged
        - name: 'Assert the changed configuration file and the restart of the service'
          ansible.builtin.assert:
            that:
              - app_meilisearch__config_result is changed
              - app_meilisearch__quadlet_result is not changed
              - app_meilisearch__test_started_after.stdout | int > app_meilisearch__test_started_before.stdout | int
            fail_msg: >-
              configuration changed: {{ app_meilisearch__config_result is changed }}, quadlet changed: {{ app_meilisearch__quadlet_result is changed }},
              start before {{ app_meilisearch__test_started_before.stdout }}, after {{ app_meilisearch__test_started_after.stdout }}

    - name: 'Run the role again without a change'
      when: app_meilisearch__test_case.side_effect is not defined
      block:

        - name: 'Read the start time of the service before the run without a change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'meilisearch' ]
          register: 'app_meilisearch__test_unchanged_before'
          changed_when: false

        - name: 'Run app_meilisearch without a change'
          ansible.builtin.include_role:
            name: 'app_meilisearch'

        - name: 'Read the start time of the service after the run without a change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'meilisearch' ]
          register: 'app_meilisearch__test_unchanged_after'
          changed_when: false

        - name: 'Assert no restart and no change'
          ansible.builtin.assert:
            that:
              - app_meilisearch__config_result is not changed
              - app_meilisearch__quadlet_result is not changed
              - app_meilisearch__secrets_result is not changed
              - app_meilisearch__test_unchanged_after.stdout == app_meilisearch__test_unchanged_before.stdout
            fail_msg: >-
              configuration changed: {{ app_meilisearch__config_result is changed }}, quadlet changed: {{ app_meilisearch__quadlet_result is changed }},
              secrets changed: {{ app_meilisearch__secrets_result is changed }},
              start before {{ app_meilisearch__test_unchanged_before.stdout }}, after {{ app_meilisearch__test_unchanged_after.stdout }}
