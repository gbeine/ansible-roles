---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/app-meilisearch
#

app_meilisearch__home: "{{ meilisearch_home | mandatory }}"
app_meilisearch__ip: "{{ meilisearch_ip | mandatory }}"
app_meilisearch__ipv6: "{{ meilisearch_ipv6 }}"
app_meilisearch__network: "{{ meilisearch_network | mandatory }}"
app_meilisearch__hostname: "{{ meilisearch_hostname | mandatory }}"
app_meilisearch__timezone: "{{ meilisearch_timezone | mandatory }}"
app_meilisearch__labels: "{{ meilisearch_labels }}"

# Meilisearch migrates its database between versions only with a dump or MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE,
# so the default is a fixed version
app_meilisearch__version: "{{ meilisearch_version | default('v1.41.0') }}"

app_meilisearch__container: "{{ app_meilisearch__podman_container_default | combine(meilisearch_container | default({})) }}"

# The configuration of Meilisearch, merged over the default
app_meilisearch__environment: "{{ app_meilisearch__environment_default | combine(meilisearch_environment | default({})) }}"

# Secrets with name, data and target, MEILI_MASTER_KEY is mandatory
app_meilisearch__secrets: "{{ meilisearch_secrets | default([]) }}"

app_meilisearch__autoupdate_enabled: "{{ meilisearch_autoupdate_enabled | default(false) }}"
app_meilisearch__autoupdate_schedule: "{{ meilisearch_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_meilisearch__podman_name: 'meilisearch'
app_meilisearch__podman_image: 'docker.io/getmeili/meilisearch'
app_meilisearch__port: 7700

app_meilisearch__environment_default:
  TZ: "{{ app_meilisearch__timezone }}"
  MEILI_ENV: 'production'
  MEILI_NO_ANALYTICS: true

app_meilisearch__environments: [ 'production', 'development' ]

# In production Meilisearch protects all routes except GET /health with the master key
app_meilisearch__secrets_required: [ 'MEILI_MASTER_KEY' ]
app_meilisearch__master_key_length: 16

# The environment of the container, booleans in lower case
app_meilisearch__environment_container: >-
  {%- set environment = {} -%}
  {%- for key, value in app_meilisearch__environment.items() -%}
  {%-   set _ = environment.update({ key: (value | string | lower) if value is boolean else value }) -%}
  {%- endfor -%}
  {{ environment }}

app_meilisearch__podman_container_default:
  name: "{{ app_meilisearch__podman_name }}"
  hostname: "{{ app_meilisearch__hostname }}"
  image: "{{ app_meilisearch__podman_image }}:{{ app_meilisearch__version }}"
  ip: "{{ app_meilisearch__ip }}"
  ipv6: "{{ app_meilisearch__ipv6 | default(omit) }}"
  network: "{{ app_meilisearch__network }}"
  timezone: "{{ app_meilisearch__timezone }}"
  labels: "{{ app_meilisearch__labels | default(omit) }}"
  # Set with meilisearch_environment, merged over the default
  environment: "{{ app_meilisearch__environment_container }}"
  volumes:
    - "{{ app_meilisearch__home }}/data:/meili_data:Z"
  # Meilisearch reads the secrets only from the environment,
  # entries without name or target are left out, the validation of the secrets reports them
  secrets: >-
    {{ (app_meilisearch__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='name')
        | zip(app_meilisearch__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='target'))
        | map('join', ',type=env,target=') | list)
      if (app_meilisearch__secrets is sequence and app_meilisearch__secrets is not string and app_meilisearch__secrets | length > 0)
      else omit }}

# Targets of the secrets in meilisearch_secrets, Meilisearch reads them only from the environment
app_meilisearch__secrets_allowed:
  - 'MEILI_MASTER_KEY'
  - 'MEILI_TASK_WEBHOOK_AUTHORIZATION_HEADER'
  - 'MEILI_EXPERIMENTAL_PERSONALIZATION_API_KEY'

app_meilisearch__secret_variables: "{{ app_meilisearch__secrets_allowed }}"

# The options of crates/meilisearch/src/option.rs of Meilisearch v1.41.0 with the type bool
app_meilisearch__environment_booleans:
  - 'MEILI_NO_ANALYTICS'
  - 'MEILI_SSL_REQUIRE_AUTH'
  - 'MEILI_SSL_RESUMPTION'
  - 'MEILI_SSL_TICKETS'
  - 'MEILI_IGNORE_MISSING_SNAPSHOT'
  - 'MEILI_IGNORE_SNAPSHOT_IF_DB_EXISTS'
  - 'MEILI_IGNORE_MISSING_DUMP'
  - 'MEILI_IGNORE_DUMP_IF_DB_EXISTS'
  - 'MEILI_EXPERIMENTAL_CONTAINS_FILTER'
  - 'MEILI_EXPERIMENTAL_ENABLE_METRICS'
  - 'MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE'
  - 'MEILI_EXPERIMENTAL_ENABLE_LOGS_ROUTE'
  - 'MEILI_EXPERIMENTAL_REPLICATION_PARAMETERS'
  - 'MEILI_EXPERIMENTAL_REDUCE_INDEXING_MEMORY_USAGE'
  - 'MEILI_EXPERIMENTAL_NO_SNAPSHOT_COMPACTION'

# Generated from the MEILI_* constants of crates/meilisearch/src/option.rs of Meilisearch v1.41.0 without the secrets,
# update with new versions of the image
app_meilisearch__environment_allowed:
  - 'MEILI_CONFIG_FILE_PATH'
  - 'MEILI_DB_PATH'
  - 'MEILI_DUMP_DIR'
  - 'MEILI_ENV'
  - 'MEILI_EXPERIMENTAL_ALLOWED_IP_NETWORKS'
  - 'MEILI_EXPERIMENTAL_CONTAINS_FILTER'
  - 'MEILI_EXPERIMENTAL_DROP_SEARCH_AFTER'
  - 'MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE'
  - 'MEILI_EXPERIMENTAL_EMBEDDING_CACHE_ENTRIES'
  - 'MEILI_EXPERIMENTAL_ENABLE_LOGS_ROUTE'
  - 'MEILI_EXPERIMENTAL_ENABLE_METRICS'
  - 'MEILI_EXPERIMENTAL_LIMIT_BATCHED_TASKS_TOTAL_SIZE'
  - 'MEILI_EXPERIMENTAL_LOGS_MODE'
  - 'MEILI_EXPERIMENTAL_MAX_NUMBER_OF_BATCHED_TASKS'
  - 'MEILI_EXPERIMENTAL_NB_SEARCHES_PER_CORE'
  - 'MEILI_EXPERIMENTAL_NO_SNAPSHOT_COMPACTION'
  - 'MEILI_EXPERIMENTAL_REDUCE_INDEXING_MEMORY_USAGE'
  - 'MEILI_EXPERIMENTAL_REPLICATION_PARAMETERS'
  - 'MEILI_EXPERIMENTAL_SEARCH_QUEUE_SIZE'
  - 'MEILI_HTTP_ADDR'
  - 'MEILI_HTTP_PAYLOAD_SIZE_LIMIT'
  - 'MEILI_IGNORE_DUMP_IF_DB_EXISTS'
  - 'MEILI_IGNORE_MISSING_DUMP'
  - 'MEILI_IGNORE_MISSING_SNAPSHOT'
  - 'MEILI_IGNORE_SNAPSHOT_IF_DB_EXISTS'
  - 'MEILI_IMPORT_DUMP'
  - 'MEILI_IMPORT_SNAPSHOT'
  - 'MEILI_LOG_LEVEL'
  - 'MEILI_MAX_INDEXING_MEMORY'
  - 'MEILI_MAX_INDEXING_THREADS'
  - 'MEILI_NO_ANALYTICS'
  - 'MEILI_SCHEDULE_SNAPSHOT'
  - 'MEILI_SNAPSHOT_DIR'
  - 'MEILI_SSL_AUTH_PATH'
  - 'MEILI_SSL_CERT_PATH'
  - 'MEILI_SSL_KEY_PATH'
  - 'MEILI_SSL_OCSP_PATH'
  - 'MEILI_SSL_REQUIRE_AUTH'
  - 'MEILI_SSL_RESUMPTION'
  - 'MEILI_SSL_TICKETS'
  - 'MEILI_TASK_WEBHOOK_URL'
  - 'TZ'
