---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-icingadb
#

monitoring_icinga_icingadb__ip: "{{ icingadb_ip | mandatory }}"
monitoring_icinga_icingadb__ipv6: "{{ icingadb_ipv6 | default('') }}"
monitoring_icinga_icingadb__network: "{{ icingadb_network | mandatory }}"
monitoring_icinga_icingadb__hostname: "{{ icingadb_hostname | mandatory }}"
monitoring_icinga_icingadb__timezone: "{{ icingadb_timezone | mandatory }}"

monitoring_icinga_icingadb__version: "{{ icingadb_version | default('latest') }}"

monitoring_icinga_icingadb__container: "{{ monitoring_icinga_icingadb__podman_container_default | combine(icingadb_container | default({})) }}"

monitoring_icinga_icingadb__redis_host: "{{ icingadb_redis_host | mandatory }}"
monitoring_icinga_icingadb__redis_port: "{{ icingadb_redis_port | default(6379) }}"
monitoring_icinga_icingadb__db_host: "{{ icingadb_db_host | mandatory }}"
monitoring_icinga_icingadb__db_port: "{{ icingadb_db_port | default(3306) }}"
monitoring_icinga_icingadb__db_user: "{{ icingadb_db_user | default('icinga') }}"
monitoring_icinga_icingadb__db_pass: "{{ icingadb_db_pass | mandatory }}"
monitoring_icinga_icingadb__db_name: "{{ icingadb_db_name | default('icinga') }}"

#
# Defaults - do not change
#

monitoring_icinga_icingadb__podman_name: 'icingadb'
monitoring_icinga_icingadb__podman_image: 'docker.io/icinga/icingadb'
monitoring_icinga_icingadb__podman_tag: "{{ monitoring_icinga_icingadb__version }}"

monitoring_icinga_icingadb__podman_container_default:
    name: "{{ monitoring_icinga_icingadb__podman_name }}"
    hostname: "{{ monitoring_icinga_icingadb__hostname }}"
    image: "{{ monitoring_icinga_icingadb__podman_image }}:{{ monitoring_icinga_icingadb__podman_tag }}"
    ip: "{{ monitoring_icinga_icingadb__ip }}"
    ipv6: "{{ monitoring_icinga_icingadb__ipv6 }}"
    network: "{{ monitoring_icinga_icingadb__network }}"
    timezone: "{{ monitoring_icinga_icingadb__timezone }}"
    environment:
      ICINGADB_REDIS_HOST: "{{ monitoring_icinga_icingadb__redis_host }}"
      ICINGADB_REDIS_PORT: "{{ monitoring_icinga_icingadb__redis_port }}"
      ICINGADB_DATABASE_HOST: "{{ monitoring_icinga_icingadb__db_host }}"
      ICINGADB_DATABASE_PORT: "{{ monitoring_icinga_icingadb__db_port }}"
      ICINGADB_DATABASE_DATABASE: "{{ monitoring_icinga_icingadb__db_name }}"
      ICINGADB_DATABASE_USER: "{{ monitoring_icinga_icingadb__db_user }}"
    secrets:
      - "icingadb_database_password,type=env,target=ICINGADB_DATABASE_PASSWORD"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
