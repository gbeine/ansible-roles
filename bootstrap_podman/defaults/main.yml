---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/bootstrap-podman
#

bootstrap_podman__default_network: "{{ podman_network | mandatory }}"
bootstrap_podman__default_environment: "{{ podman_environment | default({}) }}"

bootstrap_podman__networks: "{{ podman_networks | default([]) }}"

bootstrap_podman__containers: "{{ podman_containers | default([]) }}"

bootstrap_podman__socket_enabled: "{{ podman_socket_enabled | default(true) }}"
bootstrap_podman__tcp_address: "{{ podman_tcp_address | default('') }}"
bootstrap_podman__tcp_port: "{{ podman_tcp_port | default(2376) }}"
bootstrap_podman__tcp_requires: "{{ podman_tcp_requires | default([]) }}"

bootstrap_podman__cleanup_enabled: "{{ podman_cleanup_enabled | default(true) }}"

# Variables to be overridden via --extra-vars on in playbooks

podman___update_mode: false
