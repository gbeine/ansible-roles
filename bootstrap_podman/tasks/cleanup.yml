---

- name: 'Create podman-image-cleanup.service'
  ansible.builtin.template:
    src: 'podman-image-cleanup.service.j2'
    dest:  "/etc/systemd/system/podman-image-cleanup.service"
  when: 'bootstrap_podman__cleanup_enabled'

- name: 'Create podman-image-cleanup.timer'
  ansible.builtin.template:
    src: 'podman-image-cleanup.timer.j2'
    dest:  "/etc/systemd/system/podman-image-cleanup.timer"
  when: 'bootstrap_podman__cleanup_enabled'

- name: 'Start and enable podman cleanup timer'
  ansible.builtin.systemd:
    name: "podman-image-cleanup.timer"
    daemon_reload: true
    state: 'started'
    enabled: true
  when: 'not ansible_check_mode and bootstrap_podman__cleanup_enabled'
