---

- name: 'Install podman'
  tags: [ 'podman', 'bootstrap_podman' ]
  block:

    - name: 'Include OS-specific variables (native)'
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_os_family }}.yml"

    - name: 'Install podman packages'
      ansible.builtin.apt:
        update_cache: 'yes'
        install_recommends: 'no'
        pkg: "{{ bootstrap_podman__packages }}"

    - name: 'Include podman network configuration tasks'
      ansible.builtin.include_tasks:
        file: 'network.yml'

    - name: 'Include podman socket configuration tasks'
      ansible.builtin.include_tasks:
        file: 'socket.yml'
