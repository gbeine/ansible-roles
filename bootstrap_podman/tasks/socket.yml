---

- name: 'Enable podman.socket'
  ansible.builtin.systemd_service:
    enabled: true
    state: 'started'
    name: 'podman.socket'
  when: 'not ansible_check_mode and bootstrap_podman__socket_enabled'

- name: 'Create podman-tcp.service'
  ansible.builtin.import_role:
    name: 'systemd_services'
  vars:
    systemd_services:
      - name: 'podman-tcp'
        description: 'podman socket via TCP'
        type: 'simple'
        user: 'root'
        exec_start: "podman system service tcp://{{ bootstrap_podman__socket_address }}:{{ bootstrap_podman__socket_port }} --time=0"
        environment:
          PATH: '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
        wanted_by:
          - 'default.target'
  when: 'not ansible_check_mode and bootstrap_podman__socket_address | length > 0'

- name: 'Enable podman-tcp.service'
  ansible.builtin.systemd:
    enabled: true
    state: 'started'
    name: 'podman-tcp.service'
  when: 'not ansible_check_mode and bootstrap_podman__socket_address | length > 0'
