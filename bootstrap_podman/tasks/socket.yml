---

- name: 'Enable podman.socket'
  ansible.builtin.systemd_service:
    enabled: true
    state: 'started'
    name: 'podman.socket'
  when: 'not ansible_check_mode and bootstrap_podman__socket_enabled'

- name: 'Create podman-tcp.service'
  ansible.builtin.template:
    src: 'podman-tcp.service.j2'
    dest:  "/etc/systemd/system/podman-tcp.service"
  when: 'bootstrap_podman__tcp_address | length > 0'

- name: 'Enable podman-tcp.service'
  ansible.builtin.systemd_service:
    enabled: true
    state: 'started'
    name: 'podman-tcp.service'
  when: 'not ansible_check_mode and bootstrap_podman__tcp_address | length > 0'
