---

- name: 'Enable podman.socket'
  ansible.builtin.systemd_service:
    enabled: true
    state: 'started'
    name: 'podman.socket'
  when: 'not ansible_check_mode and bootstrap_podman__socket_enabled'

- name: 'Create podman-tcp.service'
  ansible.builtin.import_role:
    name: 'systemd_service'
  vars:
    service_name: 'podman-tcp'
    service_description: 'podman socket via TCP'
    service_requires: "{{ bootstrap_podman__tcp_requires }}"
    service_after: "{{ bootstrap_podman__tcp_requires }}"
    service_type: 'simple'
    service_exec_start:
      - "podman system service tcp://{{ bootstrap_podman__tcp_address }}:{{ bootstrap_podman__tcp_port }} --time=0"
    service_environment:
      - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
    service_wanted_by:
      - 'default.target'
# See https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html#StartLimitIntervalSec=interval
# These four entries ensure that the service is restarted on failure but only for a limited number of times.
    service_restart_sec: '5s'
    service_restart: 'on-failure'
    service_start_limit_burst: '5'
    service_start_limit_interval_sec: 'infinity'
  when: 'bootstrap_podman__tcp_address | length > 0'

- name: 'Enable podman-tcp.service'
  ansible.builtin.systemd_service:
    enabled: true
    state: 'started'
    name: 'podman-tcp.service'
  when: 'not ansible_check_mode and bootstrap_podman__tcp_address | length > 0'
