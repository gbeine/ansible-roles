---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks:
      - "{{ security_traefik_forward_auth__test_network }}"
    podman_default_network: "{{ security_traefik_forward_auth__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    # verify sends the requests of Traefik with curl
    - name: 'Install curl'
      ansible.builtin.apt:
        name: [ 'curl' ]
        state: 'present'
        update_cache: true

    - name: 'Pull the image, so the first start of the service does not time out'
      containers.podman.podman_image:
        name: "{{ security_traefik_forward_auth__test_image }}"
      register: 'security_traefik_forward_auth__test_pull'
      until: security_traefik_forward_auth__test_pull is succeeded
      retries: 5
      delay: 30
