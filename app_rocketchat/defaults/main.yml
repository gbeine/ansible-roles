---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/rocketchat
#

app_rocketchat__home: "{{ rocketchat_home | mandatory }}"
app_rocketchat__ip: "{{ rocketchat_ip | mandatory }}"
app_rocketchat__ipv6: "{{ rocketchat_ipv6 }}"
app_rocketchat__network: "{{ rocketchat_network | mandatory }}"
app_rocketchat__hostname: "{{ rocketchat_hostname | mandatory }}"
app_rocketchat__timezone: "{{ rocketchat_timezone | mandatory }}"

app_rocketchat__version: "{{ rocketchat_version | default('latest') }}"

app_rocketchat__container: "{{ app_rocketchat__podman_container_default | combine(rocketchat_container | default({})) }}"

app_rocketchat__url: "{{ rocketchat_url | default('http://localhost:3000') }}"

app_rocketchat__mongodb_host: "{{ rocketchat_mongodb_host | mandatory }}"
app_rocketchat__mongodb_database: "{{ rocketchat_mongodb_database | default('rocketchat') }}"
app_rocketchat__mongodb_oplog_database: "{{ rocketchat_mongodb_oplog | default('local') }}"
app_rocketchat__mongodb_username: "{{ rocketchat_mongodb_username | mandatory }}"
app_rocketchat__mongodb_password: "{{ rocketchat_mongodb_password | mandatory }}"
app_rocketchat__mongodb_auth_source: "{{ rocketchat_mongodb_auth_source | default('admin') }}"
app_rocketchat__mongodb_oplog_options: "{{ rocketchat_mongodb_oplog_options | default(app_rocketchat__mongodb_options) }}"

app_rocketchat__autoupdate_enabled: "{{ rocketchat_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

app_rocketchat__mongodb_auth: "{{ app_rocketchat__mongodb_username }}:{{ app_rocketchat__mongodb_password }}"
app_rocketchat__mongodb_options: "authSource={{ app_rocketchat__mongodb_auth_source }}"
app_rocketchat__mongodb_url: "mongodb://{{ app_rocketchat__mongodb_auth }}@{{ app_rocketchat__mongodb_host }}/{{ app_rocketchat__mongodb_database }}?{{ app_rocketchat__mongodb_options }}"
app_rocketchat__mongodb_oplog_url: "mongodb://{{ app_rocketchat__mongodb_auth }}@{{ app_rocketchat__mongodb_host }}/{{ app_rocketchat__mongodb_oplog_database }}?{{ app_rocketchat__mongodb_oplog_options }}"

app_rocketchat__podman_name: 'rocketchat'
app_rocketchat__podman_image: 'docker.io/rocketchat/rocket.chat'
app_rocketchat__podman_tag: "{{ app_rocketchat__version }}"

app_rocketchat__podman_container_default:
  name: "{{ app_rocketchat__podman_name }}"
  hostname: "{{ app_rocketchat__hostname }}"
  image: "{{ app_rocketchat__podman_image }}:{{ app_rocketchat__podman_tag }}"
  ip: "{{ app_rocketchat__ip }}"
  ipv6: "{{ app_rocketchat__ipv6 }}"
  network: "{{ app_rocketchat__network }}"
  timezone: "{{ app_rocketchat__timezone }}"
  environment:
    TZ: "{{ app_rocketchat__timezone }}"
    ROOT_URL: "{{ app_rocketchat__url }}"
  secrets:
    - "rocketchat_mongo_url,type=env,target=MONGO_URL"
    - "rocketchat_mongo_oplog_url,type=env,target=MONGO_OPLOG_URL"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
  shm_size: '256m'
