---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/backup
#

backup__enable: "{{ backup_enable | default(false) }}"
backup__logfile: "{{ backup_logfile | default('/var/log/backup-daily.log') }}"
backup__error_logfile: "{{ backup_error_logfile | default('/var/log/backup-error.log') }}"

backup_ssh__enable: "{{ backup_ssh_enable | default(false) }}"
backup_borg__enable: "{{ backup_borg_enable | default(false) }}"
backup_restic__enable: "{{ backup_restic_enable | default(false) }}"
backup_mysql__enable: "{{ backup_mysql_enable | default(false) }}"
backup_postgresql__enable: "{{ backup_postgresql_enable | default(false) }}"
backup_openldap__enable: "{{ backup_openldap_enable | default(false) }}"
backup_gitlab__enable: "{{ backup_gitlab_enable | default(false) }}"
backup_influxdb__enable: "{{ backup_influxdb_enable | default(false) }}"
backup_mongodb__enable: "{{ backup_mongodb_enable | default(false) }}"
backup_foundryvtt__enable: "{{ backup_foundryvtt_enable | default(false) }}"

#
# Defaults - do not change
#

backup__etc_dir: '/etc/backup'
backup__lib_dir: '/usr/local/lib/backup'

backup__files:
  - '900.backup'

backup__logrotate_files:
  - name: 'backup'
    definitions:
      - logs:
          - "{{ backup__logfile }}"
          - "{{ backup__error_logfile }}"
        options:
          - 'daily'
          - 'rotate 28'
          - 'compress'
          - 'delaycompress'
          - 'missingok'
          - 'notifempty'
