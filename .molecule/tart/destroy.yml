---
- name: 'Destroy'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false

  tasks:

    - name: 'Stop the VMs'
      ansible.builtin.command: "tart stop '{{ item.name }}'"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
      register: 'tart_stop'
      changed_when: tart_stop.rc == 0
      failed_when: false

    - name: 'Delete the VMs'
      ansible.builtin.command: "tart delete '{{ item.name }}'"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
      register: 'tart_delete'
      changed_when: tart_delete.rc == 0
      failed_when: false

    - name: 'Remove additional disks'
      ansible.builtin.file:
        path: "{{ molecule_ephemeral_directory }}/{{ item.name }}-disk.img"
        state: absent
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: 'Reset the instance config'
      ansible.builtin.copy:
        content: "{{ [] | to_yaml }}"
        dest: "{{ molecule_instance_config }}"
        mode: '600'
