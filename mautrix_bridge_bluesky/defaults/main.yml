---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/mautrix-bridges
#

mautrix_bridge_bluesky__home: "{{ mautrix_bridge_bluesky_home | mandatory }}"
mautrix_bridge_bluesky__ip: "{{ mautrix_bridge_bluesky_ip | mandatory }}"
mautrix_bridge_bluesky__ipv6: "{{ mautrix_bridge_bluesky_ipv6 }}"
mautrix_bridge_bluesky__network: "{{ mautrix_bridge_bluesky_network | mandatory }}"
mautrix_bridge_bluesky__hostname: "{{ mautrix_bridge_bluesky_hostname | mandatory }}"
mautrix_bridge_bluesky__timezone: "{{ mautrix_bridge_bluesky_timezone | mandatory }}"

mautrix_bridge_bluesky__version: "{{ mautrix_bridge_bluesky_version | default('latest') }}"

mautrix_bridge_bluesky__dns_servers: "{{ mautrix_bridge_bluesky_dns_servers | default([]) }}"

mautrix_bridge_bluesky__setup: "{{ mautrix_bridge_bluesky_setup | default(true) }}"

mautrix_bridge_bluesky__container: "{{ mautrix_bridge_bluesky__container_default | combine(mautrix_bridge_bluesky_container | default({}))  }}"

mautrix_bridge_bluesky__autoupdate_enabled: "{{ mautrix_bridge_bluesky_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

mautrix_bridge_bluesky__uid: 1337
mautrix_bridge_bluesky__gid: "{{ mautrix_bridge_bluesky__uid }}"

mautrix_bridge_bluesky__podman_name: 'mautrix-bluesky'
mautrix_bridge_bluesky__podman_image: 'dock.mau.dev/mautrix/bluesky'
mautrix_bridge_bluesky__podman_tag: "{{ mautrix_bridge_bluesky__version }}"

mautrix_bridge_bluesky__podman_home: "{{ mautrix_bridge_bluesky__home }}"

mautrix_bridge_bluesky__container_default:
  name: "{{ mautrix_bridge_bluesky__podman_name }}"
  hostname: "{{ mautrix_bridge_bluesky__hostname }}"
  image: "{{ mautrix_bridge_bluesky__podman_image }}:{{ mautrix_bridge_bluesky__podman_tag }}"
  ip: "{{ mautrix_bridge_bluesky__ip }}"
  ipv6: "{{ mautrix_bridge_bluesky__ipv6 | default(omit) }}"
  network: "{{ mautrix_bridge_bluesky__network }}"
  timezone: "{{ mautrix_bridge_bluesky__timezone }}"
  dns_servers: "{{ mautrix_bridge_bluesky__dns_servers }}"
  environment:
    TZ: "{{ mautrix_bridge_bluesky__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ mautrix_bridge_bluesky__podman_home }}:/data"
