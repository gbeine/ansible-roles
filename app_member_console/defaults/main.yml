---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/member-console
#

app_member_console__ip: "{{ member_console_ip | mandatory }}"
app_member_console__ipv6: "{{ member_console_ipv6 }}"
app_member_console__network: "{{ member_console_network | mandatory }}"
app_member_console__hostname: "{{ member_console_hostname | mandatory }}"
app_member_console__timezone: "{{ member_console_timezone | mandatory }}"
app_member_console__labels: "{{ member_console_labels | default({}) }}"

app_member_console__version: "{{ member_console_version | default('latest') }}"

app_member_console__container: "{{ app_member_console__podman_container_default | combine(member_console_container | default({})) }}"

app_member_console__ldap_host: "{{ member_console_ldap_host | mandatory }}"
app_member_console__ldap_port: "{{ member_console_ldap_port | default('636') }}"
app_member_console__ldap_encryption: "{{ member_console_ldap_encryption | default(true) }}"
app_member_console__ldap_base_dn: "{{ member_console_ldap_base_dn | default('dc=example,dc=org') }}"
app_member_console__ldap_bind_dn: "{{ member_console_ldap_bind_dn | default('cn=member-console,ou=system,dc=example,dc=org') }}"
app_member_console__ldap_bind_password: "{{ member_console_ldap_bind_password | mandatory }}"
app_member_console__ldap_user_bind_template: "{{ member_console_ldap_user_bind_template | default('uid={username},ou=people,dc=example,dc=org') }}"
app_member_console__ldap_user_base_dn: "{{ member_console_ldap_user_base_dn | default('ou=people,dc=example,dc=org') }}"
app_member_console__ldap_group_base_dn: "{{ member_console_ldap_group_base_dn | default('ou=group,dc=example,dc=org') }}"

app_member_console__admin_users: "{{ member_console_admin_users | mandatory }}"
app_member_console__email_domain: "{{ member_console_email_domain | default('example.org') }}"
app_member_console__password_reset_token_salt: "{{ member_console_password_reset_token_salt | mandatory }}"

app_member_console__email_host: "{{ member_console_email_host | mandatory }}"
app_member_console__email_port: "{{ member_console_email_port | default('587') }}"
app_member_console__email_tls: "{{ member_console_email_tls | default(true) }}"
app_member_console__email_username: "{{ member_console_email_username | mandatory }}"
app_member_console__email_password: "{{ member_console_email_password | mandatory }}"
app_member_console__email_sender_address: "{{ member_console_email_sender_address | default('no-reply@example.org') }}"

app_member_console__autoupdate_enabled: "{{ member_console_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

app_member_console__podman_name: 'member-console'
app_member_console__podman_image: 'forgejo.isaqb.org/infrastructure/member-console'
app_member_console__podman_tag: "{{ app_member_console__version }}"

app_member_console__podman_container_default:
  name: "{{ app_member_console__podman_name }}"
  hostname: "{{ app_member_console__hostname }}"
  image: "{{ app_member_console__podman_image }}:{{ app_member_console__podman_tag }}"
  ip: "{{ app_member_console__ip }}"
  ipv6: "{{ app_member_console__ipv6 }}"
  network: "{{ app_member_console__network }}"
  timezone: "{{ app_member_console__timezone }}"
  environment:
    ADMIN_USERS: "{{ app_member_console__admin_users }}"
    EMAIL_DOMAIN: "{{ app_member_console__email_domain }}"
    LDAP_HOST: "{{ app_member_console__ldap_host }}"
    LDAP_PORT: "{{ app_member_console__ldap_port }}"
    LDAP_ENCRYPTION: "{{ app_member_console__ldap_encryption | lower }}"
    LDAP_BASE_DN: "{{ app_member_console__ldap_base_dn }}"
    LDAP_USER_BIND_TEMPLATE: "{{ app_member_console__ldap_user_bind_template }}"
    LDAP_USER_BASE_DN: "{{ app_member_console__ldap_user_base_dn }}"
    LDAP_GROUP_BASE_DN: "{{ app_member_console__ldap_group_base_dn }}"
    EMAIL_HOST: "{{ app_member_console__email_host }}"
    EMAIL_PORT: "{{ app_member_console__email_port }}"
    EMAIL_TLS: "{{ app_member_console__email_tls | lower }}"
    EMAIL_SENDER_ADDRESS: "{{ app_member_console__email_sender_address }}"
  labels: "{{ app_member_console__labels }}"
  secrets:
    - "member_console_ldap_bind_dn,type=env,target=LDAP_BIND_DN"
    - "member_console_ldap_bind_password,type=env,target=LDAP_BIND_PASSWORD"
    - "member_console_password_reset_token_salt,type=env,target=PASSWORD_RESET_TOKEN_SALT"
    - "member_console_email_username,type=env,target=EMAIL_USERNAME"
    - "member_console_email_password,type=env,target=EMAIL_PASSWORD"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
