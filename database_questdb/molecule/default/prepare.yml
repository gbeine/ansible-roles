---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks:
      - "{{ database_questdb__test_network }}"
    podman_default_network: "{{ database_questdb__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Pull the images, so the first start of the service and the client of verify do not time out'
      containers.podman.podman_image:
        name: "{{ item }}"
      loop:
        - "{{ database_questdb__test_image }}"
        - "{{ database_questdb__test_psql_image }}"
