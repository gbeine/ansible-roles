---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    database_questdb__test_case: "{{ database_questdb__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ database_questdb__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Run database_questdb'
      ansible.builtin.include_role:
        name: 'database_questdb'
