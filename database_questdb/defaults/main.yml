# The data directory, owned by the user questdb of the image
database_questdb__data_owner: 10001
database_questdb__data_group: 10001

database_questdb__port: 9000

database_questdb__podman_name: 'questdb'
database_questdb__podman_image: 'docker.io/questdb/questdb'
database_questdb__podman_tag: "{{ database_questdb__version }}"

database_questdb__podman_container_default:
  name: "{{ database_questdb__podman_name }}"
  hostname: "{{ database_questdb__hostname }}"
  image: "{{ database_questdb__podman_image }}:{{ database_questdb__podman_tag }}"
  ip: "{{ database_questdb__ip }}"
  ipv6: "{{ database_questdb__ipv6 | default(omit) }}"
  network: "{{ database_questdb__network }}"
  timezone: "{{ database_questdb__timezone }}"
  # Set with questdb_environment and questdb_secrets, merged over the default
  environment: "{{ database_questdb__environment | combine(database_questdb__environment_secrets_files) }}"
  labels: "{{ database_questdb__labels | default(omit) }}"
  # questdb_container.volumes replaces the list completely, backup_questdb backs up questdb_home
  volumes:
    - "{{ database_questdb__home }}:/var/lib/questdb"
  # The secrets are mounted for the user of the image
  secrets: >-
    {{ database_questdb__podman_secrets
       if (database_questdb__secrets is sequence and database_questdb__secrets is not string and database_questdb__secrets | length > 0)
       else omit }}

# The podman secrets of questdb_secrets, entries without name are left out, the validation of the secrets reports them
database_questdb__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- for secret in database_questdb__secrets if secret is mapping and secret.name is defined -%}
  {%-   set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ database_questdb__secrets_dir ~ '/' ~ secret.name
                               ~ ',uid=' ~ database_questdb__data_owner ~ ',gid=' ~ database_questdb__data_group ~ ',mode=0400') -%}
  {%- endfor -%}
  {{ secrets }}
