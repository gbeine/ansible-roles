---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-questdb
#

database_questdb__home: "{{ questdb_home | mandatory }}"
database_questdb__ip: "{{ questdb_ip | mandatory }}"
database_questdb__ipv6: "{{ questdb_ipv6 }}"
database_questdb__network: "{{ questdb_network | mandatory }}"
database_questdb__hostname: "{{ questdb_hostname | mandatory }}"
database_questdb__timezone: "{{ questdb_timezone | mandatory }}"
database_questdb__labels: "{{ questdb_labels }}"

database_questdb__version: "{{ questdb_version | default('latest') }}"

database_questdb__container: "{{ database_questdb__podman_container_default | combine(questdb_container | default({})) }}"

# The keys of server.conf, the keys set by the role are merged last
database_questdb__config: "{{ database_questdb__config_default | combine(database_questdb__config_custom) | combine(database_questdb__config_role) }}"

# The variables of the image that are no keys of QuestDB, there is no default
database_questdb__environment: "{{ questdb_environment }}"

# Secrets with name, data and target, mounted below /run/secrets, the target is the key of server.conf,
# the role sets <key>.file to the file of the secret
database_questdb__secrets: "{{ questdb_secrets | default([]) }}"

database_questdb__autoupdate_enabled: "{{ questdb_autoupdate_enabled | default(false) }}"
database_questdb__autoupdate_schedule: "{{ questdb_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The keys of questdb_config, the role checks that it is a dictionary
database_questdb__config_custom: "{{ questdb_config | default({}) }}"

# The active keys of conf/server.conf of the image (core/src/main/resources/io/questdb/site/conf/server.conf of QuestDB 10.2.0)
database_questdb__config_default:
  query.timeout: '1m'
  cairo.sql.copy.root: 'import'

# The keys set by the role, they must not be set in questdb_config: the files of the secrets,
# the strict validation of QuestDB does not know the keys <key>.file and would stop QuestDB
database_questdb__config_role: >-
  {%- set config = { 'config.validation.strict': false } -%}
  {%- if database_questdb__secrets is sequence and database_questdb__secrets is not string and database_questdb__secrets is not mapping -%}
  {%-   for secret in database_questdb__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in database_questdb__secrets_allowed -%}
  {%-     set _ = config.update({ secret.target ~ '.file': database_questdb__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ config }}

# The lines of server.conf, null removes a key, lists are separated by commas
database_questdb__config_lines: >-
  {%- set lines = [] -%}
  {%- for key, value in (database_questdb__config.items() | sort) if value is not none -%}
  {%-   if value is boolean -%}
  {%-     set text = value | string | lower -%}
  {%-   elif value is sequence and value is not string and value is not mapping -%}
  {%-     set text = value | map('string') | join(',') -%}
  {%-   else -%}
  {%-     set text = value | string -%}
  {%-   endif -%}
  {%-   set _ = lines.append(key ~ '=' ~ text | replace('\\', '\\\\')) -%}
  {%- endfor -%}
  {{ lines }}

# The keys of QuestDB carrying secrets, read from the file of <key>.file (getSecretFilePath in PropServerConfiguration.java of QuestDB 10.2.0)
database_questdb__secrets_allowed: [ 'pg.password', 'pg.readonly.password', 'http.password' ]

# Without the password of the PostgreSQL user QuestDB uses the well known password quest
database_questdb__secrets_required: [ 'pg.password' ]

database_questdb__secrets_dir: '/run/secrets'

# The variables of docker-entrypoint.sh of QuestDB 10.2.0 without the internal QDB_PACKAGE and QUESTDB_DATA_DIR, which depends on the volume,
# and TZ, the keys of QuestDB are set with questdb_config
database_questdb__environment_allowed:
  - 'JVM_PREPEND'
  - 'DO_CHOWN'
  - 'RUN_AS_ROOT'
  - 'QUESTDB_UID'
  - 'QUESTDB_GID'
  - 'IGNORE_DATA_ROOT_MOUNT_CHECK'
  - 'DEFAULT_LOCAL_DIRS'
  - 'PROFILER_ENABLED'
  - 'PROFILER_CUSTOM_PARAMS'
  - 'PROFILER_EVENT'
  - 'PROFILER_INTERVAL'
  - 'PROFILER_ALLOC_INTERVAL'
  - 'PROFILER_LOCK_THRESHOLD'
  - 'PROFILE_NAME'
  - 'PROFILER_LOOP'
  - 'PROFILER_EXTRA_OPTS'
  - 'PROFILER_OUTPUT_DIR'
  - 'TZ'

