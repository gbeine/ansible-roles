---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-questdb
#

database_questdb__home: "{{ questdb_home | mandatory }}"
database_questdb__ip: "{{ questdb_ip | mandatory }}"
database_questdb__ipv6: "{{ questdb_ipv6 }}"
database_questdb__network: "{{ questdb_network | mandatory }}"
database_questdb__hostname: "{{ questdb_hostname | mandatory }}"
database_questdb__timezone: "{{ questdb_timezone | mandatory }}"
database_questdb__labels: "{{ questdb_labels }}"

database_questdb__version: "{{ questdb_version | default('latest') }}"

database_questdb__container: "{{ database_questdb__podman_container_default | combine(questdb_container | default({})) }}"

# The configuration of QuestDB, every key of server.conf is set with QDB_<KEY>
database_questdb__environment: "{{ database_questdb__environment_default | combine(questdb_environment | default({})) }}"

# Secrets with name, data and target, mounted below /run/secrets, the role sets the file variable of the target
database_questdb__secrets: "{{ questdb_secrets | default([]) }}"

database_questdb__autoupdate_enabled: "{{ questdb_autoupdate_enabled | default(false) }}"
database_questdb__autoupdate_schedule: "{{ questdb_autoupdate_schedule }}"

#
# Defaults - do not change
#

database_questdb__environment_default:
  TZ: "{{ database_questdb__timezone }}"

database_questdb__environment_required: []

# The targets of the secrets, they must not be set in questdb_environment
database_questdb__secret_variables: "{{ database_questdb__secret_files.keys() | list }}"

# The sensitive keys of QuestDB, read from the file variable QDB_<KEY>_FILE
# (getSecretFilePath in PropServerConfiguration.java of QuestDB 10.2.0)
database_questdb__secret_files:
  QDB_PG_PASSWORD: 'QDB_PG_PASSWORD_FILE'
  QDB_PG_READONLY_PASSWORD: 'QDB_PG_READONLY_PASSWORD_FILE'
  QDB_HTTP_PASSWORD: 'QDB_HTTP_PASSWORD_FILE'

# Without the password of the PostgreSQL user QuestDB uses the well known password quest
database_questdb__secrets_required: [ 'QDB_PG_PASSWORD' ]

database_questdb__secrets_dir: '/run/secrets'

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
database_questdb__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if database_questdb__secrets is sequence and database_questdb__secrets is not string and database_questdb__secrets is not mapping -%}
  {%-   for secret in database_questdb__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in database_questdb__secret_files -%}
  {%-     set _ = environment.update({ database_questdb__secret_files[secret.target]: database_questdb__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# Generated from PropertyKey.java and docker-entrypoint.sh of QuestDB 10.2.0: QDB_<KEY> for every key without the debug keys,
# the sensitive keys and the keys with a hyphen, which are no valid names of environment variables,
# the variables of the entrypoint without the internal QDB_PACKAGE and QUESTDB_DATA_DIR, which depends on the volume,
# the file variables of the secrets and TZ, update with new versions of the image
