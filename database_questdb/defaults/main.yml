---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-questdb
#

database_questdb__home: "{{ questdb_home | mandatory }}"
database_questdb__ip: "{{ questdb_ip | mandatory }}"
database_questdb__ipv6: "{{ questdb_ipv6 }}"
database_questdb__network: "{{ questdb_network | mandatory }}"
database_questdb__hostname: "{{ questdb_hostname | mandatory }}"
database_questdb__timezone: "{{ questdb_timezone | mandatory }}"
database_questdb__labels: "{{ questdb_labels }}"

database_questdb__version: "{{ questdb_version | default('latest') }}"

database_questdb__container: "{{ database_questdb__podman_container_default | combine(questdb_container | default({})) }}"

database_questdb__autoupdate_enabled: "{{ questdb_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

database_questdb__uid: 10001
database_questdb__gid: "{{ database_questdb__uid }}"

database_questdb__podman_name: 'questdb'
database_questdb__podman_image: 'docker.io/questdb/questdb'
database_questdb__podman_tag: "{{ database_questdb__version }}"

database_questdb__podman_home: "{{ database_questdb__home }}"

database_questdb__podman_container_default:
  name: "{{ database_questdb__podman_name }}"
  hostname: "{{ database_questdb__hostname }}"
  image: "{{ database_questdb__podman_image }}:{{ database_questdb__podman_tag }}"
  ip: "{{ database_questdb__ip }}"
  ipv6: "{{ database_questdb__ipv6 | default(omit) }}"
  network: "{{ database_questdb__network }}"
  timezone: "{{ database_questdb__timezone }}"
  labels: "{{ database_questdb__labels | default(omit) }}"
  volumes:
    - "/etc/localtime:/etc/localtime:ro"
    - "/etc/timezone:/etc/timezone:ro"
    - "{{ database_questdb__podman_home }}:/var/lib/questdb"
