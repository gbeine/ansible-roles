---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/security-pocketid
#

# Contains the data of Pocket ID (the SQLite database and the uploads) and the copies of the certificate
security_pocketid__home: "{{ pocketid_home | mandatory }}"
security_pocketid__ip: "{{ pocketid_ip | mandatory }}"
security_pocketid__ipv6: "{{ pocketid_ipv6 }}"
security_pocketid__network: "{{ pocketid_network | mandatory }}"
security_pocketid__hostname: "{{ pocketid_hostname | mandatory }}"
security_pocketid__timezone: "{{ pocketid_timezone | mandatory }}"
security_pocketid__labels: "{{ pocketid_labels }}"

security_pocketid__version: "{{ pocketid_version | default('latest') }}"

security_pocketid__container: "{{ security_pocketid__podman_container_default | combine(pocketid_container | default({})) }}"

# The configuration of Pocket ID, merged over the default, APP_URL is mandatory
security_pocketid__environment: "{{ security_pocketid__environment_default | combine(pocketid_environment | default({})) }}"

# Secrets with name, data and target, the target is the variable of Pocket ID, e.g. ENCRYPTION_KEY,
# the secrets are mounted below /run/secrets and the role sets the file variable of the target
security_pocketid__secrets: "{{ pocketid_secrets | default([]) }}"

# The first admin, created once through the API: username and optionally email, first_name, last_name, display_name and locale
security_pocketid__admin: "{{ pocketid_admin | mandatory }}"

# The groups, users and OIDC clients managed through the API, entries with state absent are removed
security_pocketid__groups: "{{ pocketid_groups | default([]) }}"
security_pocketid__users: "{{ pocketid_users | default([]) }}"
security_pocketid__clients: "{{ pocketid_clients | default([]) }}"

# The certificate of the host: { realm: <name> } copies fullchain.pem and privkey.pem of <dir>/<name> to <home>/tls on every start
# of the container, Pocket ID serves HTTPS then; dir defaults to the realms of common_globals, e.g. /opt/certbot/etc/live for pki_certbot
security_pocketid__tls: "{{ pocketid_tls | default({}) }}"

security_pocketid__autoupdate_enabled: "{{ pocketid_autoupdate_enabled | default(false) }}"
security_pocketid__autoupdate_schedule: "{{ pocketid_autoupdate_schedule }}"

# The timer of pki_update restarts Pocket ID after a renewal of the certificate of pocketid_tls
security_pocketid__pki_update_enabled: "{{ pocketid_pki_update_enabled | default(true) }}"
security_pocketid__pki_update_schedule: "{{ pocketid_pki_update_schedule | default('*-*-* 00/4:00:00') }}"

#
# Defaults - do not change
#

# The image of Pocket ID is updated by container_update, Pocket ID does not need to check for new versions
security_pocketid__environment_default:
  ANALYTICS_DISABLED: true
  VERSION_CHECK_DISABLED: true

security_pocketid__environment_required: [ 'APP_URL' ]

# The port of Pocket ID (PORT is not allowed, the role uses the port), the health check answers 204
security_pocketid__port: 1411

# The user of the entrypoint (PUID and PGID of scripts/docker/entrypoint.sh), it owns /app/data and reads the certificate
security_pocketid__uid: 1000
security_pocketid__gid: 1000

# The secrets mounted as files, Pocket ID reads the variable from the file of <variable>_FILE
# (options:"file" in backend/internal/common/env_config.go and sensitive:"true" in backend/internal/appconfig/model.go of Pocket ID v2.19.3)
security_pocketid__secret_files:
  ENCRYPTION_KEY: 'ENCRYPTION_KEY_FILE'
  STATIC_API_KEY: 'STATIC_API_KEY_FILE'
  DB_CONNECTION_STRING: 'DB_CONNECTION_STRING_FILE'
  S3_SECRET_ACCESS_KEY: 'S3_SECRET_ACCESS_KEY_FILE'
  MAXMIND_LICENSE_KEY: 'MAXMIND_LICENSE_KEY_FILE'
  SMTP_PASSWORD: 'SMTP_PASSWORD_FILE'
  LDAP_BIND_PASSWORD: 'LDAP_BIND_PASSWORD_FILE'

# The key encrypts the data of Pocket ID, the role manages Pocket ID with the API key
security_pocketid__secrets_required: [ 'ENCRYPTION_KEY', 'STATIC_API_KEY' ]

# Pocket ID needs at least 16 bytes for these secrets (ValidateEnvConfig)
security_pocketid__secrets_min_length:
  ENCRYPTION_KEY: 16
  STATIC_API_KEY: 16

# The targets of the secrets, they must not be set in pocketid_environment
security_pocketid__secret_variables: "{{ security_pocketid__secret_files.keys() | list }}"

security_pocketid__secrets_dir: '/run/secrets'

# Generated from backend/internal/common/env_config.go and backend/internal/appconfig/model.go of Pocket ID v2.19.3
# and PUID and PGID of scripts/docker/entrypoint.sh, without the secrets, APP_ENV (set by the image), PORT, HOST, UNIX_SOCKET,
# UNIX_SOCKET_MODE and SYSTEMD_SOCKET (the role uses the port), TLS_CERT, TLS_KEY, TLS_CERT_FILE and TLS_KEY_FILE (set with pocketid_tls),
# EXPERIMENTAL_* and the former EMAIL_LOGIN_NOTIFICATION_ENABLED and EMAIL_VERIFICATION_ENABLED, update with new versions of the image
security_pocketid__environment_allowed:
  - 'TZ'
  - 'PUID'
  - 'PGID'
  - 'APP_URL'
  - 'INTERNAL_APP_URL'
  - 'TRUST_PROXY'
  - 'PROXY_PROTOCOL'
  - 'TRUSTED_PLATFORM'
  - 'AUDIT_LOG_RETENTION_DAYS'
  - 'ANALYTICS_DISABLED'
  - 'ALLOW_DOWNGRADE'
  - 'ALLOW_INSECURE_CALLBACK_URLS'
  - 'UI_CONFIG_DISABLED'
  - 'DISABLE_RATE_LIMITING'
  - 'VERSION_CHECK_DISABLED'
  - 'FILE_BACKEND'
  - 'UPLOAD_PATH'
  - 'S3_BUCKET'
  - 'S3_REGION'
  - 'S3_ENDPOINT'
  - 'S3_ACCESS_KEY_ID'
  - 'S3_FORCE_PATH_STYLE'
  - 'S3_DISABLE_DEFAULT_INTEGRITY_CHECKS'
  - 'LOCAL_IPV6_RANGES'
  - 'OUTBOUND_ALLOWED_HOSTS_CLIENT_LOGO'
  - 'OUTBOUND_ALLOWED_HOSTS_CLIENT_METADATA'
  - 'OUTBOUND_ALLOWED_HOSTS_SCIM'
  - 'OUTBOUND_ALLOWED_HOSTS_BACKCHANNEL_LOGOUT'
  - 'OUTBOUND_ALLOWED_HOSTS_FEDERATED_JWKS'
  - 'OUTBOUND_ALLOWED_HOSTS_LDAP_PICTURE'
  - 'GEOLITE_DB_PATH'
  - 'GEOLITE_DB_URL'
  - 'CLOUDFLARE_LOCATION_HEADERS'
  - 'ICON_LIBRARY_URL'
  - 'ACTORS_PORT'
  - 'ACTORS_HOST'
  - 'LOG_LEVEL'
  - 'LOG_JSON'
  - 'LOG_QUERY_ARGS'
  - 'DISMISS_SQLITE_STORAGE_WARNING'
  # The configuration of the application, read from the environment with UI_CONFIG_DISABLED
  - 'APP_NAME'
  - 'SESSION_DURATION'
  - 'HOME_PAGE_URL'
  - 'EMAILS_VERIFIED'
  - 'ACCENT_COLOR'
  - 'DISABLE_ANIMATIONS'
  - 'ALLOW_OWN_ACCOUNT_EDIT'
  - 'ALLOW_USER_SIGNUPS'
  - 'SIGNUP_DEFAULT_USER_GROUP_IDS'
  - 'SIGNUP_DEFAULT_CUSTOM_CLAIMS'
  - 'REQUIRE_USER_EMAIL'
  - 'SMTP_HOST'
  - 'SMTP_PORT'
  - 'SMTP_FROM'
  - 'SMTP_USER'
  - 'SMTP_TLS'
  - 'SMTP_SKIP_CERT_VERIFY'
  - 'EMAIL_LOGIN_NOTIFICATION_MODE'
  - 'EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED'
  - 'EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED'
  - 'EMAIL_API_KEY_EXPIRATION_ENABLED'
  - 'EMAIL_VERIFICATION'
  - 'LDAP_ENABLED'
  - 'LDAP_URL'
  - 'LDAP_BIND_DN'
  - 'LDAP_BASE'
  - 'LDAP_USER_SEARCH_FILTER'
  - 'LDAP_USER_GROUP_SEARCH_FILTER'
  - 'LDAP_SKIP_CERT_VERIFY'
  - 'LDAP_ATTRIBUTE_USER_UNIQUE_IDENTIFIER'
  - 'LDAP_ATTRIBUTE_USER_USERNAME'
  - 'LDAP_ATTRIBUTE_USER_EMAIL'
  - 'LDAP_ATTRIBUTE_USER_FIRST_NAME'
  - 'LDAP_ATTRIBUTE_USER_LAST_NAME'
  - 'LDAP_ATTRIBUTE_USER_DISPLAY_NAME'
  - 'LDAP_ATTRIBUTE_USER_PROFILE_PICTURE'
  - 'LDAP_ATTRIBUTE_GROUP_MEMBER'
  - 'LDAP_ATTRIBUTE_GROUP_UNIQUE_IDENTIFIER'
  - 'LDAP_ATTRIBUTE_GROUP_NAME'
  - 'LDAP_ADMIN_GROUP_NAME'
  - 'LDAP_SOFT_DELETE_USERS'
  - 'WEBAUTHN_USER_VERIFICATION'
  - 'WEBAUTHN_ALLOW_SYNCED_PASSKEYS'
  - 'WEBAUTHN_AUTHENTICATOR_ATTACHMENT'
  - 'CIMD_URL_ALLOWLIST'
  - 'AUTO_CREATE_OIDC_CLIENT_SECRET'
  # The file variables of the secrets, set by the role
  - 'ENCRYPTION_KEY_FILE'
  - 'STATIC_API_KEY_FILE'
  - 'DB_CONNECTION_STRING_FILE'
  - 'S3_SECRET_ACCESS_KEY_FILE'
  - 'MAXMIND_LICENSE_KEY_FILE'
  - 'SMTP_PASSWORD_FILE'
  - 'LDAP_BIND_PASSWORD_FILE'
  # The certificate of pocketid_tls, set by the role
  - 'TLS_CERT_FILE'
  - 'TLS_KEY_FILE'

# Set by the role with pocketid_tls, they must not be set in pocketid_environment
security_pocketid__environment_role: [ 'TLS_CERT', 'TLS_KEY', 'TLS_CERT_FILE', 'TLS_KEY_FILE', 'PORT', 'HOST', 'UNIX_SOCKET', 'SYSTEMD_SOCKET' ]

# Generated from the bool fields of env_config.go and the type:"bool" fields of appconfig/model.go of Pocket ID v2.19.3
security_pocketid__environment_booleans:
  - 'ANALYTICS_DISABLED'
  - 'ALLOW_DOWNGRADE'
  - 'ALLOW_INSECURE_CALLBACK_URLS'
  - 'UI_CONFIG_DISABLED'
  - 'DISABLE_RATE_LIMITING'
  - 'VERSION_CHECK_DISABLED'
  - 'S3_FORCE_PATH_STYLE'
  - 'S3_DISABLE_DEFAULT_INTEGRITY_CHECKS'
  - 'CLOUDFLARE_LOCATION_HEADERS'
  - 'LOG_JSON'
  - 'LOG_QUERY_ARGS'
  - 'EMAILS_VERIFIED'
  - 'DISABLE_ANIMATIONS'
  - 'ALLOW_OWN_ACCOUNT_EDIT'
  - 'REQUIRE_USER_EMAIL'
  - 'SMTP_SKIP_CERT_VERIFY'
  - 'EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED'
  - 'EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED'
  - 'EMAIL_API_KEY_EXPIRATION_ENABLED'
  - 'LDAP_ENABLED'
  - 'LDAP_SKIP_CERT_VERIFY'
  - 'LDAP_SOFT_DELETE_USERS'
  - 'WEBAUTHN_ALLOW_SYNCED_PASSKEYS'
  - 'AUTO_CREATE_OIDC_CLIENT_SECRET'

# The patterns of Pocket ID (backend/internal/dto/validations.go of v2.19.3)
security_pocketid__username_pattern: '^[a-zA-Z0-9]([a-zA-Z0-9_.@-]*[a-zA-Z0-9])?$'
security_pocketid__client_id_pattern: '^[a-zA-Z0-9._-]+$'

# Pocket ID requires the email of every user unless REQUIRE_USER_EMAIL is false,
# the role only knows the setting from the environment with UI_CONFIG_DISABLED
security_pocketid__email_required: "{{ not (security_pocketid__environment.UI_CONFIG_DISABLED | default(false) is sameas true
                                        and security_pocketid__environment.REQUIRE_USER_EMAIL | default(true) is sameas false) }}"

# The keys of the entries of pocketid_admin, pocketid_groups, pocketid_users and pocketid_clients
security_pocketid__admin_keys: [ 'username', 'email', 'first_name', 'last_name', 'display_name', 'locale' ]
security_pocketid__group_keys: [ 'name', 'friendly_name', 'state' ]
security_pocketid__user_keys: [ 'username', 'email', 'first_name', 'last_name', 'display_name', 'locale', 'admin', 'disabled', 'groups', 'state' ]
security_pocketid__user_booleans: [ 'admin', 'disabled' ]
security_pocketid__client_keys:
  - 'id'
  - 'name'
  - 'description'
  - 'callback_urls'
  - 'logout_callback_urls'
  - 'launch_url'
  - 'public'
  - 'pkce'
  - 'skip_consent'
  - 'requires_reauthentication'
  - 'groups'
  - 'secret'
  - 'state'
security_pocketid__client_booleans: [ 'public', 'pkce', 'skip_consent', 'requires_reauthentication' ]
# Pocket ID accepts own secrets of at least 16 printable ASCII characters (OidcClientSecretCreateDto)
security_pocketid__client_secret_length: 16

# The API of Pocket ID, https with the certificate of pocketid_tls
security_pocketid__api_scheme: "{{ 'https' if security_pocketid__tls_valid | bool else 'http' }}"
security_pocketid__api_url: "{{ security_pocketid__api_scheme }}://{{ security_pocketid__ip }}:{{ security_pocketid__port }}"
security_pocketid__api_key: >-
  {{ security_pocketid__secrets | select('mapping') | selectattr('target', 'defined') | selectattr('target', 'eq', 'STATIC_API_KEY')
     | map(attribute='data') | first | default('') }}

security_pocketid__podman_name: 'pocket-id'
security_pocketid__podman_image: 'ghcr.io/pocket-id/pocket-id'
security_pocketid__podman_tag: "{{ security_pocketid__version }}"

security_pocketid__podman_home: "{{ security_pocketid__home }}"
security_pocketid__podman_data_dir: "{{ security_pocketid__podman_home }}/data"
security_pocketid__data_target: '/app/data'

# The certificate of the realm in the realms of common_globals (pki_easyrsa_deploy) or in pocketid_tls.dir (e.g. pki_certbot),
# ExecStartPre of the quadlet unit copies the files to <home>/tls, the user of Pocket ID (1000) reads them
security_pocketid__realms_dir: "{{ common_globals__pki_realms_dir }}"
security_pocketid__podman_tls_dir: "{{ security_pocketid__podman_home }}/tls"
security_pocketid__tls_target: '/app/tls'
security_pocketid__tls_keys: [ 'realm', 'dir' ]
security_pocketid__tls_realm_pattern: '^[A-Za-z0-9_.-]+$'
security_pocketid__tls_realm: "{{ security_pocketid__tls.realm | default('') if security_pocketid__tls is mapping else '' }}"
security_pocketid__tls_dir: "{{ security_pocketid__tls.dir | default(security_pocketid__realms_dir) if security_pocketid__tls is mapping else security_pocketid__realms_dir }}"
security_pocketid__tls_dir_valid: "{{ security_pocketid__tls_dir is string and security_pocketid__tls_dir is match('/') and security_pocketid__tls_dir is not search('[\\n\\r]') }}"
security_pocketid__tls_valid: >-
  {{ security_pocketid__tls_realm is string and security_pocketid__tls_realm is match(security_pocketid__tls_realm_pattern)
     and security_pocketid__tls_dir_valid | bool }}
security_pocketid__tls_files:
  - src: "{{ security_pocketid__tls_dir }}/{{ security_pocketid__tls_realm }}/fullchain.pem"
    dest: "{{ security_pocketid__podman_tls_dir }}/fullchain.pem"
    mode: '0644'
  - src: "{{ security_pocketid__tls_dir }}/{{ security_pocketid__tls_realm }}/privkey.pem"
    dest: "{{ security_pocketid__podman_tls_dir }}/privkey.pem"
    mode: '0600'
# The commands of ExecStartPre, install follows the links of the realm
security_pocketid__tls_commands: >-
  {{ security_pocketid__tls_files | map(attribute='mode') | zip(security_pocketid__tls_files | map(attribute='src'), security_pocketid__tls_files | map(attribute='dest'))
     | map('join', ' ') | map('regex_replace', '^', 'install -o ' ~ security_pocketid__uid ~ ' -g ' ~ security_pocketid__gid ~ ' -m ') | list
     if security_pocketid__tls_valid | bool else [] }}
# Pocket ID serves HTTPS with the files of TLS_CERT_FILE and TLS_KEY_FILE
security_pocketid__environment_tls: >-
  {{ { 'TLS_CERT_FILE': security_pocketid__tls_target ~ '/fullchain.pem', 'TLS_KEY_FILE': security_pocketid__tls_target ~ '/privkey.pem' }
     if security_pocketid__tls_valid | bool else {} }}

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
security_pocketid__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if security_pocketid__secrets is sequence and security_pocketid__secrets is not string and security_pocketid__secrets is not mapping -%}
  {%-   for secret in security_pocketid__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in security_pocketid__secret_files -%}
  {%-     set _ = environment.update({ security_pocketid__secret_files[secret.target]: security_pocketid__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The environment of the container, booleans in lower case
security_pocketid__environment_container: >-
  {%- set environment = {} -%}
  {%- for key, value in security_pocketid__environment.items() if value is not none -%}
  {%-   set _ = environment.update({ key: (value | string | lower) if value is boolean else value }) -%}
  {%- endfor -%}
  {{ environment | combine(security_pocketid__environment_secrets_files, security_pocketid__environment_tls) }}

# The podman secrets of pocketid_secrets mounted as files, entries without name are left out, the validation of the secrets reports them
security_pocketid__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- if security_pocketid__secrets is sequence and security_pocketid__secrets is not string and security_pocketid__secrets is not mapping -%}
  {%-   for secret in security_pocketid__secrets if secret is mapping and secret.name is defined -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ security_pocketid__secrets_dir ~ '/' ~ secret.name
                                 ~ ',uid=' ~ security_pocketid__uid ~ ',gid=' ~ security_pocketid__gid ~ ',mode=0400') -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ secrets }}

security_pocketid__podman_container_default:
  name: "{{ security_pocketid__podman_name }}"
  hostname: "{{ security_pocketid__hostname }}"
  image: "{{ security_pocketid__podman_image }}:{{ security_pocketid__podman_tag }}"
  ip: "{{ security_pocketid__ip }}"
  ipv6: "{{ security_pocketid__ipv6 | default(omit) }}"
  network: "{{ security_pocketid__network }}"
  timezone: "{{ security_pocketid__timezone }}"
  # Set with pocketid_environment and pocketid_secrets, merged over the default
  environment: "{{ security_pocketid__environment_container }}"
  labels: "{{ security_pocketid__labels | default(omit) }}"
  secrets: "{{ security_pocketid__podman_secrets if security_pocketid__podman_secrets | length > 0 else omit }}"
  # pocketid_container.volumes replaces the list completely
  volumes: >-
    {{ [ security_pocketid__podman_data_dir ~ ':' ~ security_pocketid__data_target ]
       + ([ security_pocketid__podman_tls_dir ~ ':' ~ security_pocketid__tls_target ~ ':ro' ] if security_pocketid__tls_valid | bool else []) }}
  # Copies the certificate of the realm on every start, a renewed certificate is used after the next restart
  exec_start_pre: "{{ security_pocketid__tls_commands }}"
