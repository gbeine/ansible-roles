---
# Network created by container_podman in prepare.yml, shared by all test cases
webserver_anubis__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

webserver_anubis__test_image: 'ghcr.io/techarohq/anubis:latest'

# Networks that are never challenged by the default policy
webserver_anubis__test_trusted_hosts:
  - '192.0.2.0/24'

webserver_anubis__test_cases:

  - name: 'molecule-anubis-ipv4-only'
    role_vars:
      anubis_home: '/opt/anubis-molecule'
      anubis_ip: '10.89.0.10'
      anubis_network: 'podman-molecule'
      anubis_hostname: 'anubis-molecule'
      anubis_timezone: 'Europe/Berlin'
      anubis_trusted_hosts: "{{ webserver_anubis__test_trusted_hosts }}"
      anubis_environment:
        TARGET: 'http://10.89.0.1:8080'
    expect:
      ip: '10.89.0.10'
      ip6: ~
      env:
        - 'BIND=:8923'
        - 'BIND_NETWORK=tcp'
        - 'POLICY_FNAME=/data/cfg/botPolicies.yaml'
        - 'TARGET=http://10.89.0.1:8080'
      secrets: []

  - name: 'molecule-anubis-ipv6'
    role_vars:
      anubis_home: '/opt/anubis-molecule'
      anubis_ip: '10.89.0.10'
      anubis_ipv6: 'fd00:89::10'
      anubis_network: 'podman-molecule'
      anubis_hostname: 'anubis-molecule'
      anubis_timezone: 'Europe/Berlin'
      anubis_trusted_hosts: "{{ webserver_anubis__test_trusted_hosts }}"
      anubis_environment:
        TARGET: 'http://10.89.0.1:8080'
        WEBMASTER_EMAIL: 'webmaster@example.org'
      anubis_secrets:
        # Test key only, generated for this scenario
        - name: 'anubis_molecule_ed25519'
          data: '25218ec6bdd8e2a0ce5a2225067ac1be0cfed3a7424308180e74e02bbf364c9c'
          target: 'ED25519_PRIVATE_KEY_HEX'
    # side_effect changes the difficulty, the quadlet unit changes and Anubis has to restart
    side_effect:
      role_vars:
        anubis_environment:
          TARGET: 'http://10.89.0.1:8080'
          WEBMASTER_EMAIL: 'webmaster@example.org'
          DIFFICULTY: '5'
    expect:
      ip: '10.89.0.10'
      ip6: 'fd00:89::10'
      env:
        - 'BIND=:8923'
        - 'BIND_NETWORK=tcp'
        - 'POLICY_FNAME=/data/cfg/botPolicies.yaml'
        - 'TARGET=http://10.89.0.1:8080'
        - 'WEBMASTER_EMAIL=webmaster@example.org'
        - 'DIFFICULTY=5'
        # The key is mounted as file, it is never part of the environment
        - 'ED25519_PRIVATE_KEY_HEX_FILE=/run/secrets/anubis_molecule_ed25519'
      secrets:
        - 'anubis_molecule_ed25519,type=mount,target=/run/secrets/anubis_molecule_ed25519'
