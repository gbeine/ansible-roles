---
# Runs webserver_anubis with the invalid role variables passed as include parameters,
# the role has to fail before the quadlet unit changes.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run webserver_anubis with invalid variables (expect ERROR): {{ webserver_anubis__test_invalid.message }}"
  block:

    - name: 'Run webserver_anubis, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'webserver_anubis'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ webserver_anubis__test_invalid.message }}"

  rescue:

    - name: 'Read the checksum of the quadlet unit after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ webserver_anubis__test_checked_files }}"
      register: 'webserver_anubis__test_md5_after'

    - name: 'Assert the run failed before the quadlet unit changed'
      ansible.builtin.assert:
        that:
          - webserver_anubis__test_failure is search(webserver_anubis__test_invalid.search, multiline=true)
          - webserver_anubis__test_before | select('equalto', '') | list | length == 0
          - webserver_anubis__test_after == webserver_anubis__test_before
        fail_msg: >-
          Failure: {{ webserver_anubis__test_failure }}
          Checksums before: {{ webserver_anubis__test_before | join(', ') }},
          after: {{ webserver_anubis__test_after | join(', ') }}.
      vars:
        # Double quotes, so \n is a line break for the anchors of the searches
        webserver_anubis__test_failure: "{{ [ ansible_failed_result.msg | default(''), ansible_failed_result.stderr | default('') ] | join('\n') }}"
        webserver_anubis__test_before: "{{ webserver_anubis__test_md5_before.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
        webserver_anubis__test_after: "{{ webserver_anubis__test_md5_after.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
