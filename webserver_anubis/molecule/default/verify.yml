---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    webserver_anubis__test_case: "{{ webserver_anubis__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    webserver_anubis__expect: "{{ webserver_anubis__test_case.expect }}"

  tasks:

    - name: 'Read the generated quadlet unit'
      ansible.builtin.slurp:
        src: '/etc/containers/systemd/anubis.container'
      register: 'webserver_anubis__test_quadlet'

    - name: 'Assert the IPv4 and IPv6 addresses in the quadlet unit'
      ansible.builtin.assert:
        that:
          - ('IP=' + webserver_anubis__expect.ip) in webserver_anubis__test_quadlet_lines
          - webserver_anubis__expect.ip6 is none or ('IP6=' + webserver_anubis__expect.ip6) in webserver_anubis__test_quadlet_lines
          - webserver_anubis__expect.ip6 is not none or webserver_anubis__test_quadlet_lines | select('match', 'IP6=') | list | length == 0
          - ('Network=' + webserver_anubis__test_case.role_vars.anubis_network) in webserver_anubis__test_quadlet_lines
          - >-
            webserver_anubis__test_quadlet_lines | select('match', 'Secret=') | map('regex_replace', '^Secret=', '') | list | sort
            == webserver_anubis__expect.secrets | sort
          - webserver_anubis__test_quadlet_lines | select('search', 'type=env') | list | length == 0
        fail_msg: "{{ webserver_anubis__test_quadlet.content | b64decode }}"
      vars:
        webserver_anubis__test_quadlet_lines: "{{ (webserver_anubis__test_quadlet.content | b64decode).splitlines() }}"

    - name: 'Read the bot policy'
      ansible.builtin.slurp:
        src: "{{ webserver_anubis__test_case.role_vars.anubis_home }}/botPolicies.yaml"
      register: 'webserver_anubis__test_policy'

    - name: 'Assert the bot policy contains the trusted hosts'
      ansible.builtin.assert:
        that:
          - webserver_anubis__test_trusted.remote_addresses == webserver_anubis__test_trusted_hosts
      vars:
        webserver_anubis__test_trusted: >-
          {{ (webserver_anubis__test_policy.content | b64decode | from_yaml).bots
             | selectattr('name', 'defined') | selectattr('name', 'eq', 'trusted-internal-network') | first }}

    - name: 'Read the state of the anubis service'
      ansible.builtin.command: 'systemctl is-active anubis'
      register: 'webserver_anubis__test_service'
      changed_when: false
      failed_when: false

    - name: 'Assert the anubis service is active'
      ansible.builtin.assert:
        that:
          - webserver_anubis__test_service.stdout == 'active'

    - name: 'Inspect the anubis container'
      ansible.builtin.command: 'podman inspect anubis'
      register: 'webserver_anubis__test_inspect'
      changed_when: false

    - name: 'Assert the container addresses and environment'
      ansible.builtin.assert:
        that:
          - webserver_anubis__test_net.IPAddress == webserver_anubis__expect.ip
          - webserver_anubis__expect.ip6 is none or webserver_anubis__test_net.GlobalIPv6Address == webserver_anubis__expect.ip6
          - webserver_anubis__expect.env is subset(webserver_anubis__test_container.Config.Env)
          - webserver_anubis__test_container.Config.Env | select('match', 'ED25519_PRIVATE_KEY_HEX=') | list | length == 0
        fail_msg: >-
          IPv4 {{ webserver_anubis__test_net.IPAddress }}, IPv6 {{ webserver_anubis__test_net.GlobalIPv6Address }},
          environment {{ webserver_anubis__test_container.Config.Env | select('match', '(TARGET|WEBMASTER_EMAIL|DIFFICULTY|ED25519_PRIVATE_KEY_HEX_FILE)=') | list }}
      vars:
        webserver_anubis__test_container: "{{ (webserver_anubis__test_inspect.stdout | from_json)[0] }}"
        webserver_anubis__test_net: "{{ webserver_anubis__test_container.NetworkSettings.Networks[webserver_anubis__test_case.role_vars.anubis_network] }}"

    - name: 'Check the podman secrets'
      ansible.builtin.command:
        argv: [ 'podman', 'secret', 'exists', "{{ item.split(',') | first }}" ]
      loop: "{{ webserver_anubis__expect.secrets }}"
      changed_when: false

    # A browser gets the challenge of Anubis, the private key is read from the secret file at the start.
    # Anubis expects the address of the client from the reverse proxy in X-Real-Ip, without it Anubis answers with 500
    - name: 'Request Anubis as browser behind a reverse proxy'
      ansible.builtin.uri:
        url: "http://{{ webserver_anubis__expect.ip }}:8923/"
        headers:
          User-Agent: 'Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0'
          X-Real-Ip: '203.0.113.10'
        return_content: true
        status_code: [ 200, 401 ]
      register: 'webserver_anubis__test_challenge'
      until: webserver_anubis__test_challenge.status | default(0) in [ 200, 401 ]
      retries: 10
      delay: 3

    # The error page of Anubis contains the script anubis_challenge with null
    - name: 'Assert Anubis answers with the challenge'
      ansible.builtin.assert:
        that:
          - webserver_anubis__test_challenge.content is search('id="anubis_challenge"')
          - webserver_anubis__test_challenge.content is not search('id="anubis_challenge" type="application/json">null')
        fail_msg: "{{ webserver_anubis__test_challenge.status }}: {{ webserver_anubis__test_challenge.content | default('') | truncate(500) }}"
