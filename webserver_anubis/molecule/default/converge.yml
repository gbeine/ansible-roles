---
- name: 'Converge'
  hosts: 'all'

  vars_files:
    - 'test_cases.yml'

  vars:
    podman___update_mode: false
    # webserver_anubis__config_default (the fallback used when anubis_config isn't
    # set) references this global var for its 'trusted-internal-network' rule.
    trusted_hosts:
      - '10.89.0.0/24'
      - 'fd00:89::/64'
    webserver_anubis__test_case: "{{ webserver_anubis__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  tasks:

    - name: 'Run webserver_anubis'
      ansible.builtin.include_role:
        name: 'webserver_anubis'
      vars:
        anubis_home: "{{ webserver_anubis__test_case.role_vars.anubis_home }}"
        anubis_ip: "{{ webserver_anubis__test_case.role_vars.anubis_ip }}"
        anubis_ipv6: "{{ webserver_anubis__test_case.role_vars.anubis_ipv6 | default(omit) }}"
        anubis_network: "{{ webserver_anubis__test_case.role_vars.anubis_network }}"
        anubis_hostname: "{{ webserver_anubis__test_case.role_vars.anubis_hostname }}"
        anubis_timezone: "{{ webserver_anubis__test_case.role_vars.anubis_timezone }}"
        anubis_target: "{{ webserver_anubis__test_case.role_vars.anubis_target }}"
