---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/webserver-anubis
#

webserver_anubis__home: "{{ anubis_home | mandatory }}"
webserver_anubis__ip: "{{ anubis_ip | mandatory }}"
webserver_anubis__ipv6: "{{ anubis_ipv6 }}"
webserver_anubis__network: "{{ anubis_network | mandatory }}"
webserver_anubis__hostname: "{{ anubis_hostname | mandatory }}"
webserver_anubis__timezone: "{{ anubis_timezone | mandatory }}"
webserver_anubis__labels: "{{ anubis_labels }}"

webserver_anubis__version: "{{ anubis_version | default('latest') }}"

# Networks that are never challenged, e.g. internal networks or monitoring, used by the default bot policy
webserver_anubis__trusted_hosts: "{{ anubis_trusted_hosts | default(['127.0.0.1/32', '::1/128']) }}"

# The bot policy, every key replaces the key of the default completely
webserver_anubis__config: "{{ webserver_anubis__config_default | combine(anubis_config | default({})) }}"

webserver_anubis__container: "{{ webserver_anubis__podman_container_default | combine(anubis_container | default({})) }}"
webserver_anubis__environment: "{{ webserver_anubis__environment_default | combine(anubis_environment | default({})) }}"
webserver_anubis__secrets: "{{ anubis_secrets | default([]) }}"


webserver_anubis__autoupdate_enabled: "{{ anubis_autoupdate_enabled | default(false) }}"
webserver_anubis__autoupdate_schedule: "{{ anubis_autoupdate_schedule }}"

#
# Defaults - do not change
#

webserver_anubis__environment_default:
  BIND: ':8923'
  BIND_NETWORK: 'tcp'
  POLICY_FNAME: '/data/cfg/botPolicies.yaml'

webserver_anubis__environment_required:
  - 'BIND'
  - 'BIND_NETWORK'
  - 'POLICY_FNAME'
  - 'TARGET'

# Variables carrying secrets, they must be passed with anubis_secrets,
# HS512_SECRET has no file variable and is not supported
webserver_anubis__secret_variables:
  - 'ED25519_PRIVATE_KEY_HEX'
  - 'HS512_SECRET'

# The secrets are mounted as files, the image reads the variable target from the file variable
webserver_anubis__secret_files:
  ED25519_PRIVATE_KEY_HEX: 'ED25519_PRIVATE_KEY_HEX_FILE'

webserver_anubis__secrets_dir: '/run/secrets'

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
webserver_anubis__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if webserver_anubis__secrets is sequence and webserver_anubis__secrets is not string and webserver_anubis__secrets is not mapping -%}
  {%-   for secret in webserver_anubis__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in webserver_anubis__secret_files -%}
  {%-     set _ = environment.update({ webserver_anubis__secret_files[secret.target]: webserver_anubis__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The variables of Anubis v1.28.2 (docs/docs/admin/installation.mdx and the flags of cmd/anubis/main.go)
# without the secrets, the variables of BotStopper, the command line modes and the deprecated THOTH_*
webserver_anubis__environment_allowed:
  - 'BASE_PREFIX'
  - 'BIND'
  - 'BIND_NETWORK'
  - 'COOKIE_DOMAIN'
  - 'COOKIE_DYNAMIC_DOMAIN'
  - 'COOKIE_EXPIRATION_TIME'
  - 'CUSTOM_REAL_IP_HEADER'
  - 'COOKIE_PARTITIONED'
  - 'COOKIE_PREFIX'
  - 'COOKIE_HTTP_ONLY'
  - 'COOKIE_SECURE'
  - 'COOKIE_SAME_SITE'
  - 'DIFFICULTY'
  - 'DIFFICULTY_IN_JWT'
  - 'DYNAMIC_COOKIE_SUFFIX'
  - 'JWT_RESTRICTION_HEADER'
  - 'METRICS_BIND'
  - 'METRICS_BIND_NETWORK'
  - 'OG_EXPIRY_TIME'
  - 'OG_PASSTHROUGH'
  - 'OG_CACHE_CONSIDER_HOST'
  - 'POLICY_FNAME'
  - 'PUBLIC_URL'
  - 'REDIRECT_DOMAINS'
  - 'SERVE_ROBOTS_TXT'
  - 'SLOG_LEVEL'
  - 'SOCKET_MODE'
  - 'STRIP_BASE_PREFIX'
  - 'TARGET'
  - 'USE_REMOTE_ADDRESS'
  - 'WEBMASTER_EMAIL'
  - 'XFF_STRIP_PRIVATE'
  - 'FORCED_LANGUAGE'
  - 'TARGET_DISABLE_KEEPALIVE'
  - 'TARGET_HOST'
  - 'TARGET_INSECURE_SKIP_VERIFY'
  - 'TARGET_SNI'
  - 'PRESERVE_REFERER_QUERY_PARAM'
  # The file variables of the secrets, set by the role
  - 'ED25519_PRIVATE_KEY_HEX_FILE'

webserver_anubis__podman_name: 'anubis'
webserver_anubis__podman_image: 'ghcr.io/techarohq/anubis'
webserver_anubis__podman_tag: "{{ webserver_anubis__version }}"

webserver_anubis__podman_home: "{{ webserver_anubis__home }}"

webserver_anubis__podman_container_default:
  name: "{{ webserver_anubis__podman_name }}"
  hostname: "{{ webserver_anubis__hostname }}"
  image: "{{ webserver_anubis__podman_image }}:{{ webserver_anubis__podman_tag }}"
  ip: "{{ webserver_anubis__ip }}"
  ipv6: "{{ webserver_anubis__ipv6 | default(omit) }}"
  network: "{{ webserver_anubis__network }}"
  timezone: "{{ webserver_anubis__timezone }}"
  # Set with anubis_environment and anubis_secrets, merged over the default
  environment: "{{ webserver_anubis__environment | combine(webserver_anubis__environment_secrets_files) }}"
  labels: "{{ webserver_anubis__labels | default(omit) }}"
  secrets: >-
    {{ (webserver_anubis__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ webserver_anubis__secrets_dir ~ '/\1') | list)
      if (webserver_anubis__secrets is sequence and webserver_anubis__secrets is not string and webserver_anubis__secrets | length > 0)
      else omit }}
  # anubis_container.volumes replaces the list completely
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ webserver_anubis__podman_home }}/botPolicies.yaml:/data/cfg/botPolicies.yaml:ro"

webserver_anubis__config_default:
  bots:
    # Pathological bots to deny
    - import: (data)/bots/_deny-pathological.yaml
    - import: (data)/bots/aggressive-brazilian-scrapers.yaml

    # Aggressively block AI/LLM related bots/agents by default
    - import: (data)/meta/ai-block-aggressive.yaml

    # x.ai has a scraper known to hammer git-hosting instances (Forgejo/Gitea/GitLab)
    - import: (data)/crawlers/xai.yaml

    - name: trusted-internal-network
      remote_addresses: "{{ webserver_anubis__trusted_hosts }}"
      action: ALLOW

    - name: known-scraper-ranges
      action: DENY
      remote_addresses:
        - "57.141.0.0/16" # Meta
        - "57.142.0.0/15" # Meta
        - "57.144.0.0/15" # Meta
        - "57.146.0.0/15" # Meta
        - "57.148.0.0/15" # Meta

    # Search engine crawlers to allow, defaults to:
    #   - Google (so they don't try to bypass Anubis)
    #   - Apple
    #   - Bing
    #   - DuckDuckGo
    #   - Qwant
    #   - The Internet Archive
    #   - Kagi
    #   - Marginalia
    #   - Mojeek
    - import: (data)/crawlers/_allow-good.yaml

    # Challenge Firefox AI previews
    - import: (data)/clients/x-firefox-ai.yaml

    # Allow common "keeping the internet working" routes (well-known, favicon, robots.txt)
    - import: (data)/common/keep-internet-working.yaml

    # Without this rule, weight stays at 0 for every client not explicitly matched,
    # and the thresholds below never trigger. This base value of 10 is what makes
    # the entire weight/threshold system below effective.
    - name: generic-browser
      user_agent_regex: >-
        Mozilla|Opera
      action: WEIGH
      weight:
        adjust: 10

  dnsbl: true

  status_codes:
    CHALLENGE: 200
    DENY: 200

  store:
    backend: memory
    parameters: { }

  thresholds:
    - name: minimal-suspicion # This client is likely fine, its soul is lighter than a feather
      expression: weight <= 0 # a feather weighs zero units
      action: ALLOW # Allow the traffic through
    - name: mild-suspicion
      expression:
        all:
          - weight > 0
          - weight < 10
      action: CHALLENGE
      challenge:
        # https://anubis.techaro.lol/docs/admin/configuration/challenges/metarefresh
        algorithm: metarefresh
        difficulty: 1
        report_as: 1
    - name: moderate-suspicion
      expression:
        all:
          - weight >= 10
          - weight < 20
      action: CHALLENGE
      challenge:
        # https://anubis.techaro.lol/docs/admin/configuration/challenges/proof-of-work
        algorithm: fast
        difficulty: 2 # two leading zeros, very fast for most clients
        report_as: 2
    - name: mild-proof-of-work
      expression:
        all:
          - weight >= 20
          - weight < 30
      action: CHALLENGE
      challenge:
        algorithm: fast
        difficulty: 4
        report_as: 4
    - name: extreme-suspicion
      expression:
        all:
          - weight >= 30
          - weight < 40
      action: CHALLENGE
      challenge:
        algorithm: slow
        difficulty: 8
        report_as: 4
    - name: nuclear-suspicion
      expression: weight >= 40
      action: CHALLENGE
      challenge:
        algorithm: slow
        difficulty: 12
        report_as: 4
