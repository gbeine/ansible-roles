---

- name: 'Install Anubis'
  tags: [ 'webserver', 'webserver_anubis' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or anubis_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - webserver_anubis__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - webserver_anubis__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ webserver_anubis__invalid | join('. ') }}"
        quiet: true
      vars:
        webserver_anubis__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = webserver_anubis__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('anubis_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('anubis_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of anubis_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - webserver_anubis__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ webserver_anubis__errors | join(' ') }}"
        quiet: true
      vars:
        webserver_anubis__environment_missing: >-
          {{ webserver_anubis__environment_required
             | reject('in', webserver_anubis__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        webserver_anubis__secrets_in_environment: >-
          {{ (webserver_anubis__secrets | map(attribute='target') | list
              + webserver_anubis__secret_variables + webserver_anubis__secret_files.values() | list)
             | select('in', webserver_anubis__environment.keys() | list) | unique | list }}
        webserver_anubis__errors: >-
          {%- set errors = [] -%}
          {%- if webserver_anubis__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('Anubis needs the environment variables ' ~ (webserver_anubis__environment_required | join(', ')) ~ ', missing or empty: ' ~ (webserver_anubis__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if webserver_anubis__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets and their file variables must not be set in anubis_environment: ' ~ (webserver_anubis__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging anubis_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - webserver_anubis__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ webserver_anubis__errors | join(' ') }}"
        quiet: true
      vars:
        webserver_anubis__environment_unknown: >-
          {{ (webserver_anubis__container.environment | default({})).keys()
             | reject('in', webserver_anubis__environment_allowed) | list }}
        webserver_anubis__secrets_unknown: >-
          {{ webserver_anubis__secrets | map(attribute='target') | reject('in', webserver_anubis__secret_files.keys() | list) | list }}
        webserver_anubis__errors: >-
          {%- set errors = [] -%}
          {%- if webserver_anubis__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (webserver_anubis__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if webserver_anubis__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (webserver_anubis__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the variables of the image (webserver_anubis__environment_allowed) and the secrets ' ~ (webserver_anubis__secret_files.keys() | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ webserver_anubis__podman_home }}"
        mode: '0755'
        state: 'directory'

    - name: 'Generate configuration'
      ansible.builtin.copy:
        content: "{{ webserver_anubis__config | to_nice_yaml(indent=2) }}"
        dest: "{{ webserver_anubis__podman_home }}/botPolicies.yaml"
        mode: '0644'
      register: 'webserver_anubis__config_result'

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ webserver_anubis__secrets }}"
      register: 'webserver_anubis__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ webserver_anubis__container.name }}"
        hostname: "{{ webserver_anubis__container.hostname }}"
        image: "{{ webserver_anubis__container.image }}"
        ip: "{{ webserver_anubis__container.ip }}"
        ip6: "{{ webserver_anubis__container.ipv6 | default(omit) }}"
        network: "{{ webserver_anubis__container.network }}"
        timezone: "{{ webserver_anubis__container.timezone }}"
        env: "{{ webserver_anubis__container.environment | default(omit) }}"
        etc_hosts: "{{ webserver_anubis__container.etc_hosts | default(omit) }}"
        expose: "{{ webserver_anubis__container.expose | default(omit) }}"
        label: "{{ webserver_anubis__container.labels | default(omit) }}"
        publish: "{{ webserver_anubis__container.publish | default(omit) }}"
        secrets: "{{ webserver_anubis__container.secrets | default(omit) }}"
        volume: "{{ webserver_anubis__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if webserver_anubis__container.requires is defined %}
          Requires={{ webserver_anubis__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'webserver_anubis__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ webserver_anubis__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if webserver_anubis__restart | bool else 'started' }}"
        enabled: true
      vars:
        webserver_anubis__running: >-
          {{ (ansible_facts.services[webserver_anubis__container.name + '.service'].state | default('')) == 'running' }}
        webserver_anubis__restart: >-
          {{ webserver_anubis__running | bool
             and (webserver_anubis__config_result is changed
                  or webserver_anubis__secrets_result is changed
                  or webserver_anubis__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'webserver_anubis__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ webserver_anubis__container.name }}"
        container_image: "{{ webserver_anubis__container.image }}"
        container_schedule: "{{ webserver_anubis__autoupdate_schedule }}"
