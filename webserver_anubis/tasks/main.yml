---

- name: 'Install Anubis'
  tags: [ 'webserver_anubis' ]
  block:

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item }}"
        state: 'directory'
      with_items:
        - "{{ webserver_traefik__podman_data_dir }}"

    - name: 'Install default bot policies'
      ansible.builtin.copy:
        src: 'botPolicies.yaml'
        dest: "{{ webserver_anubis__home }}/botPolicies.yaml"
        mode: '0644'
      when: 'not podman___update_mode and webserver_anubis__bot_policies | length == 0'

# See: https://docs.ansible.com/ansible/latest/collections/containers/podman/podman_container_module.html
    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ webserver_anubis__container.name }}"
        hostname: "{{ webserver_anubis__container.hostname }}"
        image: "{{ webserver_anubis__container.image }}"
        ip: "{{ webserver_anubis__container.ip }}"
        network: "{{ webserver_anubis__container.network }}"
        restart_policy: "{{ webserver_anubis__container.restart_policy  }}"
        timezone: "{{ webserver_anubis__container.timezone }}"
        env: "{{ webserver_anubis__container.environment }}"
        publish: "{{ webserver_anubis__container.publish }}"
        volume: "{{ webserver_anubis__container.volumes }}"
        pull: 'always'
        recreate: "{{ podman___update_mode | default(false) }}"
      when: 'webserver_anubis__ipv6 | length == 0'

