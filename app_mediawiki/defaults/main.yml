---

#
# Substitutes - do not change
#

app_mediawiki__network: "{{ mediawiki_network | mandatory }}"
app_mediawiki__timezone: "{{ mediawiki_timezone | mandatory }}"

app_mediawiki__version: "{{ mediawiki_version | default('1.42') }}"

app_mediawiki__containers: "{{ mediawiki_containers | default([]) }}"

#
# Defaults - do not change
#

app_mediawiki__podman_image: 'docker.io/gbeine/mediawiki'
app_mediawiki__podman_tag: "{{ app_mediawiki__version }}"

app_mediawiki__container_default:
  image: "{{ app_mediawiki__podman_image }}:{{ app_mediawiki__podman_tag }}"
  network: "{{ app_mediawiki__network }}"
  timezone: "{{ app_mediawiki__timezone }}"
  labels: {}
