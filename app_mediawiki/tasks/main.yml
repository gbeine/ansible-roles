---

- name: 'Deploy MediaWiki containers'
  tags: [ 'app_mediawiki' ]
  block:

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ item.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[item.name + ".service"] is defined  and podman___update_mode | bool'
      with_items: "{{ app_mediawiki__containers }}"

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ item.image | default(app_mediawiki__container_default.image) }}"
        force: true
      when: 'podman___update_mode | bool'
      with_items: "{{ app_mediawiki__containers }}"

    - name: 'Create containers'
      include_tasks: 'site.yml'
      loop_control:
        loop_var: 'site'
      with_items: "{{ app_mediawiki__containers }}"

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ item.name | mandatory }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode is defined and podman___update_mode else 'started' }}"
        enabled: true
      with_items: "{{ app_mediawiki__containers }}"
      when: 'not ansible_check_mode'
