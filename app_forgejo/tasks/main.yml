---

- name: 'Deploy Forgejo container'
  tags: [ 'app_forgejo' ]
  block:

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        owner: "{{ app_forgejo__uid }}"
        group: "{{ app_forgejo__gid }}"
        mode: "{{ item.mode | default('0700') }}"
        state: 'directory'
      with_items:
        - dest: "{{ app_forgejo__podman_home }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: 'forgejo_database_passwd'
        data: "{{ app_forgejo__db_pass }}"

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ app_forgejo__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[app_forgejo__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ app_forgejo__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name:  'Install container'
      containers.podman.podman_container:
        name: "{{ app_forgejo__container.name }}"
        hostname: "{{ app_forgejo__container.hostname }}"
        image: "{{ app_forgejo__container.image }}"
        ip: "{{ app_forgejo__container.ip }}"
        network: "{{ app_forgejo__container.network }}"
        timezone: "{{ app_forgejo__container.timezone }}"
        env: "{{ app_forgejo__container.environment }}"
        label: "{{ app_forgejo__container.labels }}"
        publish: "{{ app_forgejo__container.publish }}"
        secrets: "{{ app_forgejo__container.secrets }}"
        volume: "{{ app_forgejo__container.volumes }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if app_forgejo__container.requires is defined %}
          Requires={{ app_forgejo__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'app_forgejo__ipv6 | length == 0'

    - name:  'Install container'
      containers.podman.podman_container:
        name: "{{ app_forgejo__container.name }}"
        hostname: "{{ app_forgejo__container.hostname }}"
        image: "{{ app_forgejo__container.image }}"
        ip: "{{ app_forgejo__container.ip }}"
        ip6: "{{ app_forgejo__container.ipv6 }}"
        network: "{{ app_forgejo__container.network }}"
        timezone: "{{ app_forgejo__container.timezone }}"
        env: "{{ app_forgejo__container.environment }}"
        label: "{{ app_forgejo__container.labels }}"
        publish: "{{ app_forgejo__container.publish }}"
        secrets: "{{ app_forgejo__container.secrets }}"
        volume: "{{ app_forgejo__container.volumes }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if app_forgejo__container.requires is defined %}
          Requires={{ app_forgejo__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'app_forgejo__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ app_forgejo__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode | bool else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'app_forgejo__autoupdate_enabled'
      block:
        - name: 'Create autoupdate systemd service'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ app_forgejo__container.name }} container

              [Service]
              Type=oneshot
              ExecStart=/usr/bin/podman pull {{ app_forgejo__container.image }}
              ExecStartPost=/usr/bin/systemctl restart {{ app_forgejo__container.name }}
            dest: "/etc/systemd/system/container-{{ app_forgejo__container.name }}-update.service"
            mode: '0644'
            owner: root
            group: root

        - name: 'Create autoupdate systemd timer'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ app_forgejo__container.name }} timer

              [Timer]
              OnCalendar=*-*-* 08:00:00
              RandomizedDelaySec=30m
              Persistent=true

              [Install]
              WantedBy=timers.target
            dest: "/etc/systemd/system/container-{{ app_forgejo__container.name }}-update.timer"
            mode: '0644'
            owner: root
            group: root

        - name: 'Start and enable autoupdate timer'
          ansible.builtin.systemd:
            name: "container-{{ app_forgejo__container.name }}-update.timer"
            daemon_reload: true
            state: 'started'
            enabled: true
          when: 'not ansible_check_mode'

