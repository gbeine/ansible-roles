---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/forgejo
#

app_forgejo__home: "{{ forgejo_home | mandatory }}"
app_forgejo__ip: "{{ forgejo_ip | mandatory }}"
app_forgejo__ipv6: "{{ forgejo_ipv6 }}"
app_forgejo__network: "{{ forgejo_network | mandatory }}"
app_forgejo__hostname: "{{ forgejo_hostname | mandatory }}"
app_forgejo__timezone: "{{ forgejo_timezone | mandatory }}"
app_forgejo__labels: "{{ forgejo_labels | default({}) }}"

# The user and group of /data, the image runs Forgejo as the user git with this uid and gid
app_forgejo__uid: "{{ forgejo_uid | mandatory }}"
app_forgejo__gid: "{{ forgejo_gid | default(app_forgejo__uid) }}"

app_forgejo__version: "{{ forgejo_version | default('17') }}"

app_forgejo__container: "{{ app_forgejo__podman_container_default | combine(forgejo_container | default({})) }}"

# The configuration of Forgejo as FORGEJO__<section>__<KEY>, merged over the default
app_forgejo__environment: "{{ app_forgejo__environment_default | combine(forgejo_environment | default({})) }}"

# Secrets with name, data and target, e.g. FORGEJO__security__SECRET_KEY or FORGEJO__database__PASSWD
app_forgejo__secrets: "{{ forgejo_secrets | default([]) }}"

# The names of sections and keys of options with free names, one list per family, see app_forgejo__keys_families
app_forgejo__keys: "{{ forgejo_keys | default({}) }}"

# The administrator of Forgejo with name, email and password
app_forgejo__admin: "{{ forgejo_admin | mandatory }}"

app_forgejo__autoupdate_enabled: "{{ forgejo_autoupdate_enabled | default(false) }}"
app_forgejo__autoupdate_schedule: "{{ forgejo_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_forgejo__podman_name: 'forgejo'
app_forgejo__podman_image: 'codeberg.org/forgejo/forgejo'

app_forgejo__port: "{{ app_forgejo__environment.FORGEJO__server__HTTP_PORT | default(3000) }}"

# INSTALL_LOCK skips the installation page, Forgejo creates its database and the role creates the administrator
app_forgejo__environment_default:
  USER_UID: "{{ app_forgejo__uid | string }}"
  USER_GID: "{{ app_forgejo__gid | string }}"
  FORGEJO__database__DB_TYPE: 'mysql'
  FORGEJO__security__INSTALL_LOCK: true

app_forgejo__database_types: [ 'mysql', 'postgres', 'sqlite3' ]

# mysql and postgres need these variables and the secret FORGEJO__database__PASSWD
app_forgejo__environment_database: [ 'FORGEJO__database__HOST', 'FORGEJO__database__NAME', 'FORGEJO__database__USER' ]

# Without SECRET_KEY Forgejo uses a fixed key known to everybody (modules/setting/security.go)
app_forgejo__secrets_required: [ 'FORGEJO__security__SECRET_KEY' ]

app_forgejo__secrets_dir: '/run/secrets'

app_forgejo__admin_keys: [ 'name', 'email', 'password' ]
# The names of users of Forgejo (modules/validation) and MIN_PASSWORD_LENGTH of Forgejo
app_forgejo__admin_name_pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
app_forgejo__admin_email_pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
app_forgejo__password_length: 8

# The keys of forgejo_keys, sections are lower case, keys of sections with free keys may contain upper case letters
app_forgejo__keys_pattern: '^[a-z0-9_][a-z0-9_.-]*$'
app_forgejo__keys_pattern_free: '^[A-Za-z0-9_.][A-Za-z0-9_.-]*$'

# The keys of forgejo_keys, entries of the wrong type are left out, the validation reports them
app_forgejo__keys_valid: >-
  {%- set keys = {} -%}
  {%- for family in app_forgejo__keys_families -%}
  {%-   set values = app_forgejo__keys[family] | default([]) if app_forgejo__keys is mapping else [] -%}
  {%-   set _ = keys.update({ family: (values | select('string') | list) if values is sequence and values is not string and values is not mapping else [] }) -%}
  {%- endfor -%}
  {{ keys }}

# The options of the keys, Forgejo encodes . and - in the names of the variables as _0X2E_ and _0X2D_
app_forgejo__environment_allowed_keys: >-
  {%- set names = [] -%}
  {%- for family, definition in app_forgejo__keys_families.items() -%}
  {%-   for key in app_forgejo__keys_valid[family] -%}
  {%-     if definition.options is none -%}
  {%-       set _ = names.append('FORGEJO__' ~ (definition.section | replace('.', '_0X2E_') | replace('-', '_0X2D_'))
                                 ~ '__' ~ (key | replace('.', '_0X2E_') | replace('-', '_0X2D_'))) -%}
  {%-     else -%}
  {%-       for option in definition.options -%}
  {%-         set variable = 'FORGEJO__' ~ ((definition.section ~ key) | replace('.', '_0X2E_') | replace('-', '_0X2D_')) ~ '__' ~ option -%}
  {%-         set _ = names.append(variable ~ '__FILE' if option in definition.secrets else variable) -%}
  {%-       endfor -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ names }}

app_forgejo__secret_files_keys: >-
  {%- set files = {} -%}
  {%- for family, definition in app_forgejo__keys_families.items() -%}
  {%-   for key in app_forgejo__keys_valid[family] -%}
  {%-     for option in definition.secrets -%}
  {%-       set variable = 'FORGEJO__' ~ ((definition.section ~ key) | replace('.', '_0X2E_') | replace('-', '_0X2D_')) ~ '__' ~ option -%}
  {%-       set _ = files.update({ variable: variable ~ '__FILE' }) -%}
  {%-     endfor -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ files }}

app_forgejo__environment_allowed: "{{ app_forgejo__environment_allowed_options + app_forgejo__environment_allowed_keys }}"
app_forgejo__secret_files: "{{ app_forgejo__secret_files_options | combine(app_forgejo__secret_files_keys) }}"
app_forgejo__secret_variables: "{{ app_forgejo__secret_files.keys() | list }}"

# The file variables of the secrets
app_forgejo__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if app_forgejo__secrets is sequence and app_forgejo__secrets is not string and app_forgejo__secrets is not mapping -%}
  {%-   for secret in app_forgejo__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in app_forgejo__secret_files -%}
  {%-     set _ = environment.update({ app_forgejo__secret_files[secret.target]: app_forgejo__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The environment of the container, Forgejo reads booleans as true and false
app_forgejo__environment_container: >-
  {%- set environment = {} -%}
  {%- for key, value in (app_forgejo__environment | combine(app_forgejo__environment_secrets_files)).items() -%}
  {%-   set _ = environment.update({ key: (value | string | lower) if value is boolean else value }) -%}
  {%- endfor -%}
  {{ environment }}

app_forgejo__podman_container_default:
  name: "{{ app_forgejo__podman_name }}"
  hostname: "{{ app_forgejo__hostname }}"
  image: "{{ app_forgejo__podman_image }}:{{ app_forgejo__version }}"
  ip: "{{ app_forgejo__ip }}"
  ipv6: "{{ app_forgejo__ipv6 | default(omit) }}"
  network: "{{ app_forgejo__network }}"
  timezone: "{{ app_forgejo__timezone }}"
  labels: "{{ app_forgejo__labels | default(omit) }}"
  # Set with forgejo_environment and forgejo_secrets, merged over the default
  environment: "{{ app_forgejo__environment_container }}"
  volumes:
    - "{{ app_forgejo__home }}:/data"
  # Entries without name are left out, the validation of the secrets reports them
  secrets: >-
    {{ (app_forgejo__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ app_forgejo__secrets_dir ~ '/\1') | list)
      if (app_forgejo__secrets is sequence and app_forgejo__secrets is not string and app_forgejo__secrets | length > 0)
      else omit }}

# The families of forgejo_keys, sections with a name (section is the prefix of the name) and sections with free keys (options is null),
# generated from custom/conf/app.example.ini of Forgejo v17.0.1
app_forgejo__keys_families:
  storage:
    section: 'storage.'
    options: [ 'STORAGE_TYPE', 'SERVE_DIRECT', 'PATH', 'MINIO_ENDPOINT', 'MINIO_ACCESS_KEY_ID', 'MINIO_SECRET_ACCESS_KEY', 'MINIO_BUCKET', 'MINIO_BUCKET_LOOKUP', 'MINIO_LOCATION', 'MINIO_BASE_PATH', 'MINIO_USE_SSL', 'MINIO_INSECURE_SKIP_VERIFY', 'MINIO_CHECKSUM_ALGORITHM' ]
    secrets: [ 'MINIO_SECRET_ACCESS_KEY' ]
  queue:
    section: 'queue.'
    options: [ 'TYPE', 'DATADIR', 'LENGTH', 'BATCH_LENGTH', 'CONN_STR', 'QUEUE_NAME', 'SET_NAME', 'MAX_WORKERS' ]
    secrets: [ 'CONN_STR' ]
  log:
    section: 'log.'
    options: [ 'MODE', 'LEVEL', 'FLAGS', 'EXPRESSION', 'EXCLUSION', 'PREFIX', 'COLORIZE', 'STDERR', 'FILE_NAME', 'LOG_ROTATE', 'MAX_SIZE_SHIFT', 'DAILY_ROTATE', 'MAX_DAYS', 'COMPRESS', 'COMPRESSION_LEVEL', 'RECONNECT_ON_MSG', 'RECONNECT', 'PROTOCOL', 'ADDR' ]
    secrets: []
  markup:
    section: 'markup.'
    options: [ 'ENABLED', 'FILE_EXTENSIONS', 'RENDER_COMMAND', 'IS_INPUT_FILE', 'RENDER_CONTENT_MODE' ]
    secrets: []
  markup.sanitizer:
    section: 'markup.sanitizer.'
    options: [ 'ELEMENT', 'ALLOW_ATTR', 'REGEXP' ]
    secrets: []
  funding:
    section: 'funding.'
    options: [ 'TEMPLATE', 'TITLE', 'INPUT_PATTERN' ]
    secrets: []
  git.config:
    section: 'git.config'
    options: ~
    secrets: []
  repository.mimetype_mapping:
    section: 'repository.mimetype_mapping'
    options: ~
    secrets: []
  highlight.mapping:
    section: 'highlight.mapping'
    options: ~
    secrets: []
  mailer.override_header:
    section: 'mailer.override_header'
    options: ~
    secrets: []

