---

#
# Substitutes - do not change
#

app_forgejo__user: "{{ forgejo_user | default('forgejo') }}"
app_forgejo__uid: "{{ forgejo_uid | mandatory }}"
app_forgejo__gid: "{{ forgejo_gid | default(app_forgejo__uid) }}"
app_forgejo__home: "{{ forgejo_home | mandatory }}"

app_forgejo__hostname: "{{ forgejo_hostname | default('forgejo.' + dns_hostname) }}"
app_forgejo__ip: "{{ forgejo_ip | mandatory }}"
app_forgejo__ipv6: "{{ forgejo_ipv6 | default('') }}"
app_forgejo__version: "{{ forgejo_version | default('10') }}"

app_forgejo__network: "{{ forgejo_network | mandatory }}"
app_forgejo__hosts: "{{ forgejo_hosts | default({}) }}"
app_forgejo__timezone: "{{ forgejo_timezone | default(bootstrap_timezone__timezone) }}"

app_forgejo__db_type: "{{ forgejo_db_type | default('mysql') }}"
app_forgejo__db_host: "{{ forgejo_db_host | mandatory }}"
app_forgejo__db_port: "{{ forgejo_db_port | default(3306) }}"
app_forgejo__db_user: "{{ forgejo_db_user | default('forgejo') }}"
app_forgejo__db_pass: "{{ forgejo_db_pass | mandatory }}"
app_forgejo__db_database: "{{ forgejo_db_database | default('forgejo') }}"

app_forgejo__container: "{{ app_forgejo__container_default | combine(forgejo_container | default({})) }}"
app_forgejo__publish: "{{ forgejo_publish | default([]) }}"

app_forgejo__ca_file: "{{ forgejo_ca | default('') }}"

#
# Defaults - do not change
#

# See: https://forgejo.org/docs/latest/admin/installation-docker/
app_forgejo__container_default:
  name: 'forgejo'
  hostname: "{{ app_forgejo__hostname }}"
  image: "codeberg.org/forgejo/forgejo:{{ app_forgejo__version }}"
  ip: "{{ app_forgejo__ip }}"
  network: "{{ app_forgejo__network }}"
  restart_policy: 'always'
  environment:
    USER_UID: "{{ app_forgejo__uid }}"
    USER_GID: "{{ app_forgejo__gid }}"
    FORGEJO__database__DB_TYPE: "{{ app_forgejo__db_type }}"
    FORGEJO__database__HOST: "{{ app_forgejo__db_host }}:{{ app_forgejo__db_port }}"
    FORGEJO__database__USER: "{{ app_forgejo__db_user }}"
    FORGEJO__database__PASSWD: "{{ app_forgejo__db_pass }}"
    FORGEJO__database__NAME: "{{ app_forgejo__db_database }}"
  volumes:
    - "{{ app_forgejo__home }}:/data"
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
  hosts: "{{ app_forgejo__hosts }}"
  timezone: "{{ app_forgejo__timezone }}"
  publish: "{{ app_forgejo__publish }}"
