---
# The token of the instance runner, created by prepare.yml in GitLab on the VM
- name: 'Read the token of the runner'
  when: app_gitlab_runner__test_case.token_file is defined
  ansible.builtin.slurp:
    src: "{{ app_gitlab_runner__test_case.token_file }}"
  register: 'app_gitlab_runner__test_token'

- name: 'Set the secret of the token'
  when: app_gitlab_runner__test_case.token_file is defined
  ansible.builtin.set_fact:
    gitlab_runner_secrets:
      - name: 'gitlab_runner_token'
        data: "{{ app_gitlab_runner__test_token.content | b64decode | trim }}"
        target: 'token'
  no_log: true
