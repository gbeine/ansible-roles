---
prerun: false
driver:
  name: 'default'
  options:
    managed: true
platforms:
  - name: 'molecule-gitlab-runner-default'
  # GitLab runs on this VM for the registration and needs at least 4 GB of memory
  - name: 'molecule-gitlab-runner'
    memory: 6144
    cpu: 4
provisioner:
  name: 'ansible'
  playbooks:
    create: '../../../.molecule/tart/create.yml'
    destroy: '../../../.molecule/tart/destroy.yml'
  config_options:
    defaults:
      callback_result_format: 'yaml'
      gathering: 'smart'
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_ROLES_PATH: '../../../'
  inventory:
    group_vars:
      all:
        ansible_become_password: '${MOLECULE_TART_PASSWORD:-admin}'
verifier:
  name: 'ansible'
scenario:
  test_sequence:
    - 'destroy'
    - 'syntax'
    - 'create'
    - 'prepare'
    # converge with --check on the VMs where the role never ran
    - 'check'
    - 'converge'
    - 'idempotence'
    - 'side_effect'
    - 'verify'
    - 'destroy'
