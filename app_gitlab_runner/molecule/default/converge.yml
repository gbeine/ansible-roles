---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_gitlab_runner__test_case: "{{ app_gitlab_runner__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  pre_tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ app_gitlab_runner__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Set the token of the runner'
      ansible.builtin.include_tasks: 'tasks/token.yml'

  tasks:

    - name: 'Run app_gitlab_runner'
      ansible.builtin.include_role:
        name: 'app_gitlab_runner'
