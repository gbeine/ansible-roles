---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/gitlab-runner
#

# Contains config.toml of the runner, mounted as /etc/gitlab-runner
app_gitlab_runner__home: "{{ gitlab_runner_home | mandatory }}"
app_gitlab_runner__ip: "{{ gitlab_runner_ip | mandatory }}"
app_gitlab_runner__ipv6: "{{ gitlab_runner_ipv6 }}"
app_gitlab_runner__network: "{{ gitlab_runner_network | mandatory }}"
app_gitlab_runner__hostname: "{{ gitlab_runner_hostname | mandatory }}"
app_gitlab_runner__timezone: "{{ gitlab_runner_timezone | mandatory }}"
app_gitlab_runner__labels: "{{ gitlab_runner_labels }}"

app_gitlab_runner__version: "{{ gitlab_runner_version | default('latest') }}"

# The URL of GitLab, needed to register the runner with the token of gitlab_runner_secrets
app_gitlab_runner__url: "{{ gitlab_runner_url | default('') }}"

# The template of the runner for the registration, one [[runners]] entry of config.toml, merged recursively over the default
app_gitlab_runner__config: "{{ app_gitlab_runner__config_default | combine(gitlab_runner_config | default({}), recursive=true) }}"

# The authentication token of the runner (glrt-...) with name, data and the target token, only used for the registration
app_gitlab_runner__secrets: "{{ gitlab_runner_secrets | default([]) }}"

# GitLab Runner has no default environment
app_gitlab_runner__environment: "{{ gitlab_runner_environment }}"

app_gitlab_runner__container: "{{ app_gitlab_runner__podman_container_default | combine(gitlab_runner_container | default({})) }}"

app_gitlab_runner__autoupdate_enabled: "{{ gitlab_runner_autoupdate_enabled | default(false) }}"
app_gitlab_runner__autoupdate_schedule: "{{ gitlab_runner_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_gitlab_runner__podman_name: 'gitlab-runner'
app_gitlab_runner__podman_image: 'docker.io/gitlab/gitlab-runner'
app_gitlab_runner__podman_tag: "{{ app_gitlab_runner__version }}"

app_gitlab_runner__podman_home: "{{ app_gitlab_runner__home }}"

app_gitlab_runner__config_file: "{{ app_gitlab_runner__podman_home }}/config.toml"
# The template is only written for the registration and removed afterwards
app_gitlab_runner__register_file: "{{ app_gitlab_runner__podman_home }}/register.toml"
app_gitlab_runner__register_name: "{{ app_gitlab_runner__podman_name }}-init"
# The socket of podman on the host, the docker executor uses it as /var/run/docker.sock
app_gitlab_runner__podman_socket: '/run/podman/podman.sock'

# The docker executor with the podman socket of the host
app_gitlab_runner__config_default:
  executor: 'docker'
  docker:
    image: 'alpine:latest'

# The options set by the role for the registration
app_gitlab_runner__config_role: [ 'name', 'url', 'token' ]

# Generated from docs/configuration/advanced-configuration.md of GitLab Runner v19.6.0:
# the options of the [[runners]] section and its subsections, the content of the subsections is not checked
app_gitlab_runner__config_allowed:
  - 'limit'
  - 'executor'
  - 'shell'
  - 'builds_dir'
  - 'cache_dir'
  - 'environment'
  - 'allowed_docker_credential_helpers'
  - 'request_concurrency'
  - 'strict_check_interval'
  - 'output_limit'
  - 'pre_get_sources_script'
  - 'post_get_sources_script'
  - 'pre_build_script'
  - 'post_build_script'
  - 'clone_url'
  - 'api_url'
  - 'job_router_url'
  - 'debug_trace_disabled'
  - 'clean_git_config'
  - 'use_git_packfile_uris'
  - 'unhealthy_requests_limit'
  - 'unhealthy_interval'
  - 'job_status_final_update_retry_limit'
  - 'prepare_timeout'
  - 'get_sources_timeout'
  - 'runtime_environment_ttl'
  - 'artifact'
  - 'autoscaler'
  - 'cache'
  - 'custom'
  - 'custom_build_dir'
  - 'docker'
  - 'experimental'
  - 'feature_flags'
  - 'instance'
  - 'kubernetes'
  - 'machine'
  - 'parallels'
  - 'referees'
  - 'ssh'
  - 'virtualbox'

# Generated from The executors of docs/configuration/advanced-configuration.md of GitLab Runner v19.6.0
app_gitlab_runner__executors:
  - 'shell'
  - 'docker'
  - 'docker-windows'
  - 'ssh'
  - 'parallels'
  - 'virtualbox'
  - 'docker+machine'
  - 'kubernetes'
  - 'docker-autoscaler'
  - 'instance'
  - 'custom'

# The target of the secret, register reads it from CI_SERVER_TOKEN
app_gitlab_runner__secrets_allowed: [ 'token' ]
app_gitlab_runner__secrets_env: 'CI_SERVER_TOKEN'

# Entries without name, data or target are left out, the validation of the secrets reports them
app_gitlab_runner__secrets_valid: >-
  {{ (app_gitlab_runner__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('data', 'defined')
      | selectattr('target', 'defined') | list)
     if (app_gitlab_runner__secrets is sequence and app_gitlab_runner__secrets is not string) else [] }}
app_gitlab_runner__token_secret: >-
  {{ (app_gitlab_runner__secrets_valid | selectattr('target', 'eq', 'token') | map(attribute='name') | first)
     if app_gitlab_runner__secrets_valid | selectattr('target', 'eq', 'token') | list | length > 0 else '' }}

# Generated from the entrypoint of the image and the flags of run, log/configuration.go of GitLab Runner v19.6.0,
# CONFIG_FILE is set by the image, the token is only passed to the registration
app_gitlab_runner__environment_allowed:
  - 'TZ'
  - 'CA_CERTIFICATES_PATH'
  - 'LISTEN_ADDRESS'
  - 'LOG_SYSLOG'
  - 'LOG_FORMAT'
  - 'LOG_LEVEL'
  - 'RUNNER_DEBUG'

app_gitlab_runner__podman_container_default:
  name: "{{ app_gitlab_runner__podman_name }}"
  hostname: "{{ app_gitlab_runner__hostname }}"
  image: "{{ app_gitlab_runner__podman_image }}:{{ app_gitlab_runner__podman_tag }}"
  ip: "{{ app_gitlab_runner__ip }}"
  ipv6: "{{ app_gitlab_runner__ipv6 | default(omit) }}"
  network: "{{ app_gitlab_runner__network }}"
  timezone: "{{ app_gitlab_runner__timezone }}"
  labels: "{{ app_gitlab_runner__labels | default(omit) }}"
  environment: "{{ app_gitlab_runner__environment | default(omit) }}"
  # The jobs of the docker executor run in containers of the podman of the host
  wants: [ 'podman.socket' ]
  after: [ 'podman.socket' ]
  # gitlab_runner_container.volumes replaces the list completely
  volumes:
    - "{{ app_gitlab_runner__podman_home }}:/etc/gitlab-runner"
    - "{{ app_gitlab_runner__podman_socket }}:/var/run/docker.sock"
