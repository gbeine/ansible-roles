---

- name: 'Install Diun'
  tags: [ 'monitoring_diun' ]
  block:

    - name: 'Create Diun user directories'
      ansible.builtin.file:
        mode: '750'
        path: "{{ item }}"
        state: 'directory'
      with_items:
        - "{{ monitoring_diun__podman_etc_dir }}"
        - "{{ monitoring_diun__podman_data_dir }}"

    - name: 'Generate configuration files'
      ansible.builtin.template:
        src: 'diun.yml.j2'
        dest: "{{ monitoring_diun__podman_etc_dir }}/diun.yml"
        mode: '640'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ monitoring_diun__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[monitoring_diun__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ monitoring_diun__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name: 'Install Diun container'
      containers.podman.podman_container:
        name: "{{ monitoring_diun__container.name }}"
        hostname: "{{ monitoring_diun__container.hostname }}"
        image: "{{ monitoring_diun__container.image }}"
        ip: "{{ monitoring_diun__container.ip }}"
        ip6: "{{ monitoring_diun__container.ipv6 | default(omit, true) }}"
        network: "{{ monitoring_diun__container.network }}"
        timezone: "{{ monitoring_diun__container.timezone }}"
        env: "{{ monitoring_diun__container.environment | default(omit) }}"
        etc_hosts: "{{ monitoring_diun__container.etc_hosts | default(omit) }}"
        expose: "{{ monitoring_diun__container.expose | default(omit) }}"
        label: "{{ monitoring_diun__container.labels | default(omit) }}"
        publish: "{{ monitoring_diun__container.publish | default(omit) }}"
        secrets: "{{ monitoring_diun__container.secrets | default(omit) }}"
        volume: "{{ monitoring_diun__container.volumes | default(omit) }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ monitoring_diun__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode | bool else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'monitoring_diun__autoupdate_enabled'
      include_role:
        name: 'container_update'
      vars:
        container_name: "{{ monitoring_diun__container.name }}"
        container_image: "{{ monitoring_diun__container.image }}"
