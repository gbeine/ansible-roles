---

- name: 'Install Diun'
  tags: [ 'monitoring', 'monitoring_diun' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or diun_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - monitoring_diun__container | length > 0
        quiet: true

    # The keys become part of the names of environment variables, the keys of regopts without '_'
    - name: 'Validate the keys'
      ansible.builtin.assert:
        that:
          - monitoring_diun__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_diun__invalid | join('. ') }}"
        quiet: true
      vars:
        monitoring_diun__invalid: >-
          {%- set errors = [] -%}
          {%- set keys = monitoring_diun__keys -%}
          {%- if keys is not mapping -%}
          {%-   set _ = errors.append('diun_keys has to be a dictionary') -%}
          {%- else -%}
          {%-   set unknown = keys.keys() | reject('in', monitoring_diun__keys_families) | list -%}
          {%-   if unknown | length > 0 -%}
          {%-     set _ = errors.append('unknown entries in diun_keys: ' ~ unknown | join(', ')
                                        ~ ', allowed are ' ~ monitoring_diun__keys_families | join(', ')) -%}
          {%-   endif -%}
          {%-   for family in monitoring_diun__keys_families if family in keys -%}
          {%-     set values = keys[family] -%}
          {%-     set pattern = '^[A-Z0-9]+$' if family == 'regopts' else '^[A-Z0-9_]+$' -%}
          {%-     if values is not sequence or values is string or values is mapping -%}
          {%-       set _ = errors.append('diun_keys.' ~ family ~ ' has to be a list') -%}
          {%-     elif values | reject('string') | list | length > 0 or values | reject('match', pattern) | list | length > 0 -%}
          {%-       set _ = errors.append('diun_keys.' ~ family ~ ' contains invalid keys, allowed are '
                                          ~ ('uppercase letters and digits' if family == 'regopts' else 'uppercase letters, digits and _')
                                          ~ ': ' ~ (values | select('string') | reject('match', pattern) | list
                                                    + values | reject('string') | map('string') | list) | join(', ')) -%}
          {%-     elif values | unique | list | length != values | length -%}
          {%-       set _ = errors.append('diun_keys.' ~ family ~ ' contains duplicate keys') -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - monitoring_diun__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_diun__invalid | join('. ') }}"
        quiet: true
      vars:
        monitoring_diun__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = monitoring_diun__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('diun_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('diun_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of diun_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - monitoring_diun__secrets_in_environment | length == 0
        fail_msg: >-
          Secrets and their file variables must not be set in diun_environment:
          {{ monitoring_diun__secrets_in_environment | join(', ') | default('none', true) }}.
        quiet: true
      vars:
        monitoring_diun__secrets_in_environment: >-
          {{ (monitoring_diun__secrets | map(attribute='target') | list
              + monitoring_diun__secret_variables + monitoring_diun__secret_files.values() | list)
             | select('in', monitoring_diun__environment.keys() | list) | unique | list }}

    # Checks the environment and the secrets of the container after merging diun_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - monitoring_diun__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_diun__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_diun__environment_unknown: >-
          {{ (monitoring_diun__container.environment | default({})).keys()
             | reject('in', monitoring_diun__environment_allowed) | list }}
        monitoring_diun__secrets_unknown: >-
          {{ monitoring_diun__secrets | map(attribute='target')
             | reject('in', monitoring_diun__secret_files.keys() | list) | list }}
        monitoring_diun__errors: >-
          {%- set errors = [] -%}
          {%- if monitoring_diun__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (monitoring_diun__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if monitoring_diun__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (monitoring_diun__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the options of diun in monitoring_diun__environment_allowed and the targets in monitoring_diun__secret_files, options with keys in their names need the keys in diun_keys.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create directories'
      ansible.builtin.file:
        path: "{{ monitoring_diun__podman_data_dir }}"
        mode: '0750'
        state: 'directory'

    # The configuration is passed with environment variables, the file of earlier versions of the role is not used anymore
    - name: 'Remove the configuration file of earlier versions'
      ansible.builtin.file:
        path: "{{ monitoring_diun__podman_etc_dir }}/diun.yml"
        state: 'absent'

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ monitoring_diun__secrets }}"
      register: 'monitoring_diun__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ monitoring_diun__container.name }}"
        hostname: "{{ monitoring_diun__container.hostname }}"
        image: "{{ monitoring_diun__container.image }}"
        ip: "{{ monitoring_diun__container.ip }}"
        ip6: "{{ monitoring_diun__container.ipv6 | default(omit) }}"
        network: "{{ monitoring_diun__container.network }}"
        timezone: "{{ monitoring_diun__container.timezone }}"
        env: "{{ monitoring_diun__container.environment | default(omit) }}"
        etc_hosts: "{{ monitoring_diun__container.etc_hosts | default(omit) }}"
        expose: "{{ monitoring_diun__container.expose | default(omit) }}"
        label: "{{ monitoring_diun__container.labels | default(omit) }}"
        publish: "{{ monitoring_diun__container.publish | default(omit) }}"
        secrets: "{{ monitoring_diun__container.secrets | default(omit) }}"
        volume: "{{ monitoring_diun__container.volumes | default(omit) }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if monitoring_diun__container.requires is defined %}
          Requires={{ monitoring_diun__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'monitoring_diun__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ monitoring_diun__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if monitoring_diun__restart | bool else 'started' }}"
        enabled: true
      vars:
        monitoring_diun__running: >-
          {{ (ansible_facts.services[monitoring_diun__container.name + '.service'].state | default('')) == 'running' }}
        monitoring_diun__restart: >-
          {{ monitoring_diun__running | bool
             and (monitoring_diun__secrets_result is changed or monitoring_diun__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'monitoring_diun__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ monitoring_diun__container.name }}"
        container_image: "{{ monitoring_diun__container.image }}"
        container_schedule: "{{ monitoring_diun__autoupdate_schedule }}"
