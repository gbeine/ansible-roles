---

- name: 'Install Diun'
  tags: [ 'monitoring_diun' ]
  block:

    - name: 'Create Diun user directories'
      ansible.builtin.file:
        mode: '750'
        path: "{{ item }}"
        state: 'directory'
      with_items:
        - "{{ monitoring_diun__podman_etc_dir }}"
        - "{{ monitoring_diun__podman_data_dir }}"

    - name: 'Generate configuration files'
      ansible.builtin.template:
        src: 'diun.yml.j2'
        dest: "{{ monitoring_diun__podman_etc_dir }}/diun.yml"
        mode: '640'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ monitoring_diun__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[monitoring_diun__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ monitoring_diun__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name: 'Install Diun container'
      containers.podman.podman_container:
        name: "{{ monitoring_diun__container.name }}"
        hostname: "{{ monitoring_diun__container.hostname }}"
        image: "{{ monitoring_diun__container.image }}"
        ip: "{{ monitoring_diun__container.ip }}"
        network: "{{ monitoring_diun__container.network }}"
        timezone: "{{ monitoring_diun__container.timezone }}"
        volume: "{{ monitoring_diun__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'monitoring_diun__ipv6 | length == 0'

    - name: 'Install Diun container'
      containers.podman.podman_container:
        name: "{{ monitoring_diun__container.name }}"
        hostname: "{{ monitoring_diun__container.hostname }}"
        image: "{{ monitoring_diun__container.image }}"
        ip: "{{ monitoring_diun__container.ip }}"
        ip6: "{{ monitoring_diun__container.ipv6 }}"
        network: "{{ monitoring_diun__container.network }}"
        timezone: "{{ monitoring_diun__container.timezone }}"
        volume: "{{ monitoring_diun__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'monitoring_diun__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ monitoring_diun__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode | bool else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'monitoring_diun__autoupdate_enabled'
      block:
        - name: 'Create autoupdate systemd service'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ monitoring_diun__container.name }} container

              [Service]
              Type=oneshot
              ExecStart=/usr/bin/podman pull {{ monitoring_diun__container.image }}
              ExecStartPost=/usr/bin/systemctl restart {{ monitoring_diun__container.name }}
            dest: "/etc/systemd/system/container-{{ monitoring_diun__container.name }}-update.service"
            mode: '0644'
            owner: root
            group: root

        - name: 'Create autoupdate systemd timer'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ monitoring_diun__container.name }} timer

              [Timer]
              OnCalendar=*-*-* 04:00:00
              RandomizedDelaySec=30m
              Persistent=true

              [Install]
              WantedBy=timers.target
            dest: "/etc/systemd/system/container-{{ monitoring_diun__container.name }}-update.timer"
            mode: '0644'
            owner: root
            group: root

        - name: 'Start and enable autoupdate timer'
          ansible.builtin.systemd:
            name: "container-{{ monitoring_diun__container.name }}-update.timer"
            daemon_reload: true
            state: 'started'
            enabled: true
          when: 'not ansible_check_mode'
