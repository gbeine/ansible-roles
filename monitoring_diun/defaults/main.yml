---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-diun
#

monitoring_diun__home: "{{ diun_home | mandatory }}"
monitoring_diun__ip: "{{ diun_ip | mandatory }}"
monitoring_diun__ipv6: "{{ diun_ipv6 | default(omit) }}"
monitoring_diun__network: "{{ diun_network | default(diun_net) | mandatory }}"
monitoring_diun__hostname: "{{ diun_hostname | mandatory }}"
monitoring_diun__timezone: "{{ diun_timezone | mandatory }}"
monitoring_diun__labels: "{{ diun_labels | default({}) }}"

monitoring_diun__version: "{{ diun_version | default('latest') }}"

monitoring_diun__publish: "{{ diun_publish | default([]) }}"
monitoring_diun__volumes: "{{ diun_volumes | default([]) }}"

# Watch the containers of the host with the docker provider through the podman socket
monitoring_diun__provider_podman: "{{ diun_provider_podman | default(true) }}"

monitoring_diun__environment: >-
  {{ monitoring_diun__environment_default
     | combine(monitoring_diun__provider_podman_environment if monitoring_diun__provider_podman | bool else {})
     | combine(diun_environment | default({})) }}
monitoring_diun__secrets: "{{ diun_secrets | default([]) }}"

monitoring_diun__container: "{{ monitoring_diun__podman_container_default | combine(diun_container | default({})) }}"

monitoring_diun__autoupdate_enabled: "{{ diun_autoupdate_enabled | default(false) }}"
monitoring_diun__autoupdate_schedule: "{{ diun_autoupdate_schedule | default('*-*-* 04:00:00') }}"

#
# Defaults - do not change
#

monitoring_diun__environment_default:
  TZ: "{{ monitoring_diun__timezone }}"
  DIUN_DB_PATH: '/data/diun.db'
  DIUN_WATCH_WORKERS: '10'
  DIUN_WATCH_SCHEDULE: '0 */6 * * *'
  DIUN_WATCH_JITTER: '30s'
  DIUN_WATCH_FIRSTCHECKNOTIF: 'false'
  DIUN_WATCH_RUNONSTARTUP: 'true'
  DIUN_WATCH_COMPAREDIGEST: 'false'
  DIUN_DEFAULTS_WATCHREPO: 'false'
  DIUN_DEFAULTS_NOTIFYON: 'new,update'
  DIUN_DEFAULTS_MAXTAGS: '10'
  DIUN_DEFAULTS_SORTTAGS: 'reverse'

monitoring_diun__provider_podman_environment:
  DIUN_PROVIDERS_DOCKER: 'true'
  DIUN_PROVIDERS_DOCKER_ENDPOINT: 'unix:///var/run/docker.sock'
  DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: 'false'
  DIUN_PROVIDERS_DOCKER_WATCHSTOPPED: 'false'

monitoring_diun__podman_socket: '/run/podman/podman.sock'

# Variables carrying secrets match this pattern, they must be passed with diun_secrets
monitoring_diun__secret_pattern: '(?i)(PASSWORD|TOKEN|SECRET|WEBHOOKURL)'

monitoring_diun__podman_name: 'diun'
monitoring_diun__podman_image: 'docker.io/crazymax/diun'
monitoring_diun__podman_tag: "{{ monitoring_diun__version }}"

monitoring_diun__podman_home: "{{ monitoring_diun__home }}"
monitoring_diun__podman_etc_dir: "{{ monitoring_diun__podman_home }}/etc"
monitoring_diun__podman_data_dir: "{{ monitoring_diun__podman_home }}/data"

monitoring_diun__podman_container_default:
  name: "{{ monitoring_diun__podman_name }}"
  hostname: "{{ monitoring_diun__hostname }}"
  image: "{{ monitoring_diun__podman_image }}:{{ monitoring_diun__podman_tag }}"
  ip: "{{ monitoring_diun__ip }}"
  ipv6: "{{ monitoring_diun__ipv6 }}"
  network: "{{ monitoring_diun__network }}"
  timezone: "{{ monitoring_diun__timezone }}"
  environment: "{{ monitoring_diun__environment }}"
  labels: "{{ monitoring_diun__labels }}"
  publish: "{{ monitoring_diun__publish }}"
  secrets: >-
    {{ (monitoring_diun__secrets | map(attribute='name') | zip(monitoring_diun__secrets | map(attribute='target'))
        | map('join', ',type=env,target=') | list)
      if (monitoring_diun__secrets | default([]) | length > 0)
      else omit }}
  volumes: >-
    {{ [monitoring_diun__podman_data_dir + ':/data']
       + ([monitoring_diun__podman_socket + ':/var/run/docker.sock:ro'] if monitoring_diun__provider_podman | bool else [])
       + monitoring_diun__volumes }}
