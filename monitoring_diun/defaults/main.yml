---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-diun
#

monitoring_diun__home: "{{ diun_home | mandatory }}"
monitoring_diun__ip: "{{ diun_ip | mandatory }}"
monitoring_diun__ipv6: "{{ diun_ipv6 }}"
monitoring_diun__network: "{{ diun_network | mandatory }}"
monitoring_diun__hostname: "{{ diun_hostname | mandatory }}"
monitoring_diun__timezone: "{{ diun_timezone | mandatory }}"
monitoring_diun__labels: "{{ diun_labels }}"

monitoring_diun__version: "{{ diun_version | default('latest') }}"

# Watch the containers of the host with the docker provider through the podman socket
monitoring_diun__provider_podman: "{{ diun_provider_podman | default(true) }}"

monitoring_diun__container: "{{ monitoring_diun__podman_container_default | combine(diun_container | default({})) }}"
monitoring_diun__environment: >-
  {{ monitoring_diun__environment_default
     | combine(monitoring_diun__provider_podman_environment if monitoring_diun__provider_podman | bool else {})
     | combine(diun_environment | default({})) }}
monitoring_diun__secrets: "{{ diun_secrets | default([]) }}"

# Keys that diun composes into the names of options, e.g. regopts: [ 'GHCR' ] allows DIUN_REGOPTS_GHCR_NAME
monitoring_diun__keys: "{{ diun_keys | default({}) }}"

monitoring_diun__autoupdate_enabled: "{{ diun_autoupdate_enabled | default(false) }}"
monitoring_diun__autoupdate_schedule: "{{ diun_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_diun__environment_default:
  TZ: "{{ monitoring_diun__timezone }}"
  DIUN_DB_PATH: '/data/diun.db'
  DIUN_WATCH_WORKERS: '10'
  DIUN_WATCH_SCHEDULE: '0 */6 * * *'
  DIUN_WATCH_JITTER: '30s'
  DIUN_WATCH_FIRSTCHECKNOTIF: 'false'
  DIUN_WATCH_RUNONSTARTUP: 'true'
  DIUN_WATCH_COMPAREDIGEST: 'false'
  DIUN_DEFAULTS_WATCHREPO: 'false'
  DIUN_DEFAULTS_NOTIFYON: 'new,update'
  DIUN_DEFAULTS_MAXTAGS: '10'
  DIUN_DEFAULTS_SORTTAGS: 'reverse'

monitoring_diun__provider_podman_environment:
  DIUN_PROVIDERS_DOCKER: 'true'
  DIUN_PROVIDERS_DOCKER_ENDPOINT: 'unix:///var/run/docker.sock'
  DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: 'false'
  DIUN_PROVIDERS_DOCKER_WATCHSTOPPED: 'false'

monitoring_diun__podman_socket: '/run/podman/podman.sock'

# The targets of the secrets, they must not be set in diun_environment
monitoring_diun__secret_variables: "{{ monitoring_diun__secret_files.keys() | list }}"

# The secrets are mounted as files, diun reads the option target from the file variable
monitoring_diun__secret_files: "{{ monitoring_diun__secret_files_options | combine(monitoring_diun__secret_files_keys) }}"

# Generated from the *File options of internal/model of diun v4.33.1
monitoring_diun__secret_files_options:
  DIUN_METRICS_TOKEN: 'DIUN_METRICS_TOKENFILE'
  DIUN_NOTIF_AMQP_PASSWORD: 'DIUN_NOTIF_AMQP_PASSWORDFILE'
  DIUN_NOTIF_AMQP_USERNAME: 'DIUN_NOTIF_AMQP_USERNAMEFILE'
  DIUN_NOTIF_APPRISE_TOKEN: 'DIUN_NOTIF_APPRISE_TOKENFILE'
  DIUN_NOTIF_DISCORD_WEBHOOKURL: 'DIUN_NOTIF_DISCORD_WEBHOOKURLFILE'
  DIUN_NOTIF_ELASTICSEARCH_PASSWORD: 'DIUN_NOTIF_ELASTICSEARCH_PASSWORDFILE'
  DIUN_NOTIF_ELASTICSEARCH_USERNAME: 'DIUN_NOTIF_ELASTICSEARCH_USERNAMEFILE'
  DIUN_NOTIF_GOTIFY_TOKEN: 'DIUN_NOTIF_GOTIFY_TOKENFILE'
  DIUN_NOTIF_MAIL_PASSWORD: 'DIUN_NOTIF_MAIL_PASSWORDFILE'
  DIUN_NOTIF_MAIL_USERNAME: 'DIUN_NOTIF_MAIL_USERNAMEFILE'
  DIUN_NOTIF_MATRIX_PASSWORD: 'DIUN_NOTIF_MATRIX_PASSWORDFILE'
  DIUN_NOTIF_MATRIX_USER: 'DIUN_NOTIF_MATRIX_USERFILE'
  DIUN_NOTIF_MQTT_PASSWORD: 'DIUN_NOTIF_MQTT_PASSWORDFILE'
  DIUN_NOTIF_MQTT_USERNAME: 'DIUN_NOTIF_MQTT_USERNAMEFILE'
  DIUN_NOTIF_NTFY_TOKEN: 'DIUN_NOTIF_NTFY_TOKENFILE'
  DIUN_NOTIF_PUSHOVER_RECIPIENT: 'DIUN_NOTIF_PUSHOVER_RECIPIENTFILE'
  DIUN_NOTIF_PUSHOVER_TOKEN: 'DIUN_NOTIF_PUSHOVER_TOKENFILE'
  DIUN_NOTIF_ROCKETCHAT_TOKEN: 'DIUN_NOTIF_ROCKETCHAT_TOKENFILE'
  DIUN_NOTIF_SLACK_WEBHOOKURL: 'DIUN_NOTIF_SLACK_WEBHOOKURLFILE'
  DIUN_NOTIF_TEAMS_WEBHOOKURL: 'DIUN_NOTIF_TEAMS_WEBHOOKURLFILE'
  DIUN_NOTIF_TELEGRAM_CHATIDS: 'DIUN_NOTIF_TELEGRAM_CHATIDSFILE'
  DIUN_NOTIF_TELEGRAM_TOKEN: 'DIUN_NOTIF_TELEGRAM_TOKENFILE'
  DIUN_WATCH_HEALTHCHECKS_UUID: 'DIUN_WATCH_HEALTHCHECKS_UUIDFILE'

monitoring_diun__secrets_dir: '/run/secrets'

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
monitoring_diun__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if monitoring_diun__secrets is sequence and monitoring_diun__secrets is not string and monitoring_diun__secrets is not mapping -%}
  {%-   for secret in monitoring_diun__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-     if secret.target in monitoring_diun__secret_files -%}
  {%-       set _ = environment.update({ monitoring_diun__secret_files[secret.target]: monitoring_diun__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

monitoring_diun__environment_allowed: "{{ monitoring_diun__environment_allowed_options + monitoring_diun__environment_allowed_keys }}"

# The options of diun v4.33.1 (docs/config, docs/notif, docs/providers and docs/usage/command-line.md) as environment variables,
