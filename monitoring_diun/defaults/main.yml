---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-diun
#

monitoring_diun__home: "{{ diun_home | mandatory }}"
monitoring_diun__ip: "{{ diun_ip | mandatory }}"
monitoring_diun__ipv6: "{{ diun_ipv6 }}"
monitoring_diun__network: "{{ diun_network | mandatory }}"
monitoring_diun__hostname: "{{ diun_hostname | mandatory }}"
monitoring_diun__timezone: "{{ diun_timezone | mandatory }}"
monitoring_diun__labels: "{{ diun_labels }}"

monitoring_diun__version: "{{ diun_version | default('latest') }}"

# Watch the containers of the host with the docker provider through the podman socket
monitoring_diun__provider_podman: "{{ diun_provider_podman | default(true) }}"

monitoring_diun__container: "{{ monitoring_diun__podman_container_default | combine(diun_container | default({})) }}"

# Variables of the command line and the image, e.g. LOG_LEVEL, the options of diun are set with diun_config
monitoring_diun__environment: "{{ diun_environment }}"

# Secrets with name, data and target, the target is the path of the option in diun.yml, e.g. notif.mail.password
monitoring_diun__secrets: "{{ diun_secrets | default([]) }}"

# Options of diun.yml, merged recursively over the default, lists like regopts replace the lists of the default
monitoring_diun__config: >-
  {{ monitoring_diun__config_default
     | combine(monitoring_diun__config_provider_podman if monitoring_diun__provider_podman | bool else {}, recursive=true)
     | combine(diun_config | default({}), recursive=true) }}

monitoring_diun__autoupdate_enabled: "{{ diun_autoupdate_enabled | default(false) }}"
monitoring_diun__autoupdate_schedule: "{{ diun_autoupdate_schedule }}"

#
# Defaults - do not change
#

# db.path is set by the image (DIUN_DB_PATH=/data/diun.db)
monitoring_diun__config_default:
  watch:
    workers: 10
    schedule: '0 */6 * * *'
    jitter: '30s'
    firstCheckNotif: false
    runOnStartup: true
    compareDigest: false
  defaults:
    watchRepo: false
    notifyOn: [ 'new', 'update' ]
    maxTags: 10
    sortTags: 'reverse'

monitoring_diun__config_provider_podman:
  providers:
    docker:
      endpoint: 'unix:///var/run/docker.sock'
      watchByDefault: false
      watchStopped: false

# The options of diun_config, the role checks that it is a dictionary
monitoring_diun__config_custom: "{{ diun_config | default({}) }}"

monitoring_diun__podman_socket: '/run/podman/podman.sock'

# The variables of the command line (cmd/main.go) and of the image (Dockerfile) of diun v4.33.1,
# the options of diun (DIUN_*) are set with diun_config
monitoring_diun__environment_allowed:
  - 'TZ'
  - 'LOG_LEVEL'
  - 'LOG_JSON'
  - 'LOG_CALLER'
  - 'LOG_NOCOLOR'
  - 'PROFILER'
  - 'PROFILER_PATH'
  - 'GRPC_AUTHORITY'

monitoring_diun__secrets_dir: '/run/secrets'

# The secrets by the path of their option, entries of regopts by their name, secrets with an unknown target are left out
monitoring_diun__config_secrets: >-
  {%- set result = { 'options': {}, 'regopts': {} } -%}
  {%- if monitoring_diun__secrets is sequence and monitoring_diun__secrets is not string and monitoring_diun__secrets is not mapping -%}
  {%-   for secret in monitoring_diun__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-     set target = secret.target | string -%}
  {%-     set file = monitoring_diun__secrets_dir ~ '/' ~ secret.name -%}
  {%-     if target in monitoring_diun__secrets_allowed and '<name>' not in target -%}
  {%-       set _ = result.options.update({ target: file }) -%}
  {%-     elif target is match('^regopts\.[^.]+\.(username|password)$') -%}
  {%-       set parts = target.split('.') -%}
  {%-       set _ = result.regopts.update({ parts[1]: (result.regopts[parts[1]] | default({})) | combine({ parts[2] ~ 'File': file }) }) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ result }}

# The content of diun.yml: the configuration with the files of the secrets
monitoring_diun__config_file: >-
  {%- set ns = namespace(config=monitoring_diun__config, option={}) -%}
  {%- for target, file in monitoring_diun__config_secrets.options.items() -%}
  {%-   set path = target.split('.') -%}
  {%-   set ns.option = { path[-1] ~ 'File': file } -%}
  {%-   for key in path[:-1] | reverse -%}
  {%-     set ns.option = { key: ns.option } -%}
  {%-   endfor -%}
  {%-   set ns.config = ns.config | combine(ns.option, recursive=true) -%}
  {%- endfor -%}
  {%- if ns.config.regopts is defined and ns.config.regopts is sequence and ns.config.regopts is not string -%}
  {%-   set regopts = [] -%}
  {%-   for entry in ns.config.regopts -%}
  {%-     set _ = regopts.append(entry | combine(monitoring_diun__config_secrets.regopts[entry.name | default('')] | default({}))
                                  if entry is mapping else entry) -%}
  {%-   endfor -%}
  {%-   set ns.config = ns.config | combine({ 'regopts': regopts }) -%}
  {%- endif -%}
  {{ ns.config }}

monitoring_diun__podman_name: 'diun'
monitoring_diun__podman_image: 'docker.io/crazymax/diun'
monitoring_diun__podman_tag: "{{ monitoring_diun__version }}"

monitoring_diun__podman_home: "{{ monitoring_diun__home }}"
monitoring_diun__podman_etc_dir: "{{ monitoring_diun__podman_home }}/etc"
monitoring_diun__podman_data_dir: "{{ monitoring_diun__podman_home }}/data"
monitoring_diun__config_path: "{{ monitoring_diun__podman_home }}/diun.yml"

monitoring_diun__podman_container_default:
  name: "{{ monitoring_diun__podman_name }}"
  hostname: "{{ monitoring_diun__hostname }}"
  image: "{{ monitoring_diun__podman_image }}:{{ monitoring_diun__podman_tag }}"
  ip: "{{ monitoring_diun__ip }}"
  ipv6: "{{ monitoring_diun__ipv6 | default(omit) }}"
  network: "{{ monitoring_diun__network }}"
  timezone: "{{ monitoring_diun__timezone }}"
  environment: "{{ monitoring_diun__environment | default(omit) }}"
  labels: "{{ monitoring_diun__labels | default(omit) }}"
  secrets: >-
    {{ (monitoring_diun__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ monitoring_diun__secrets_dir ~ '/\1') | list)
      if (monitoring_diun__secrets is sequence and monitoring_diun__secrets is not string and monitoring_diun__secrets | length > 0)
      else omit }}
  # diun_container.volumes replaces the list completely
  volumes: >-
    {{ [ monitoring_diun__config_path + ':/etc/diun/diun.yml:ro', monitoring_diun__podman_data_dir + ':/data' ]
       + ([monitoring_diun__podman_socket + ':/var/run/docker.sock:ro'] if monitoring_diun__provider_podman | bool else []) }}

# Generated from internal/config/config.go and internal/model of diun v4.33.1, update with new versions of diun:
# the options of diun.yml with their types, bool, int (a number), string (also durations and values of a list of names),
# list (a list of strings or numbers), map (free keys with strings, numbers or booleans), regopts is a list of entries
monitoring_diun__config_schema:
  db:
    path: 'string'
  watch:
    workers: 'int'
    schedule: 'string'
    jitter: 'string'
    firstCheckNotif: 'bool'
    runOnStartup: 'bool'
    compareDigest: 'bool'
    healthchecks:
      baseURL: 'string'
      uuid: 'string'
      uuidFile: 'string'
  defaults:
    watchRepo: 'bool'
    notifyOn: 'list'
    maxTags: 'int'
    sortTags: 'string'
    includeTags: 'list'
    excludeTags: 'list'
    metadata: 'map'
  metrics:
    enabled: 'bool'
    addr: 'string'
    path: 'string'
    token: 'string'
    tokenFile: 'string'
  notif:
    amqp:
      username: 'string'
      usernameFile: 'string'
      password: 'string'
      passwordFile: 'string'
      host: 'string'
      port: 'int'
      queue: 'string'
      exchange: 'string'
    apprise:
      endpoint: 'string'
      token: 'string'
      tokenFile: 'string'
      tags: 'list'
      urls: 'list'
      timeout: 'string'
      proxy: 'string'
      tlsSkipVerify: 'bool'
      tlsCaCertFiles: 'list'
      templateTitle: 'string'
      templateBody: 'string'
    discord:
      webhookURL: 'string'
      webhookURLFile: 'string'
      mentions: 'list'
      renderEmbeds: 'bool'
      renderFields: 'bool'
      timeout: 'string'
      proxy: 'string'
      templateBody: 'string'
    elasticsearch:
      address: 'string'
      username: 'string'
      usernameFile: 'string'
      password: 'string'
      passwordFile: 'string'
      client: 'string'
      index: 'string'
      timeout: 'string'
      proxy: 'string'
      tlsSkipVerify: 'bool'
      tlsCaCertFiles: 'list'
    gotify:
      endpoint: 'string'
      token: 'string'
      tokenFile: 'string'
      priority: 'int'
      timeout: 'string'
      proxy: 'string'
      tlsSkipVerify: 'bool'
      tlsCaCertFiles: 'list'
      templateTitle: 'string'
      templateBody: 'string'
    mail:
      host: 'string'
      port: 'int'
      ssl: 'bool'
      insecureSkipVerify: 'bool'
      localName: 'string'
      username: 'string'
      usernameFile: 'string'
      password: 'string'
      passwordFile: 'string'
      from: 'string'
      to: 'list'
      templateTitle: 'string'
      templateBody: 'string'
    matrix:
      homeserverURL: 'string'
      user: 'string'
      userFile: 'string'
      password: 'string'
      passwordFile: 'string'
      roomID: 'string'
      msgType: 'string'
      templateBody: 'string'
    mqtt:
      scheme: 'string'
      host: 'string'
      port: 'int'
      username: 'string'
      usernameFile: 'string'
      password: 'string'
      passwordFile: 'string'
      client: 'string'
      topic: 'string'
      qos: 'int'
    ntfy:
      endpoint: 'string'
      token: 'string'
      tokenFile: 'string'
      topic: 'string'
      priority: 'int'
      tags: 'list'
      icon: 'string'
      click: 'string'
      timeout: 'string'
      proxy: 'string'
      tlsSkipVerify: 'bool'
      tlsCaCertFiles: 'list'
      templateTitle: 'string'
      templateBody: 'string'
    pushover:
      token: 'string'
      tokenFile: 'string'
      recipient: 'string'
      recipientFile: 'string'
      priority: 'int'
      sound: 'string'
      timeout: 'string'
      proxy: 'string'
      templateTitle: 'string'
      templateBody: 'string'
    rocketchat:
      endpoint: 'string'
      channel: 'string'
      userID: 'string'
      token: 'string'
      tokenFile: 'string'
      renderAttachment: 'bool'
      timeout: 'string'
      proxy: 'string'
      tlsSkipVerify: 'bool'
      tlsCaCertFiles: 'list'
      templateTitle: 'string'
      templateBody: 'string'
    script:
      cmd: 'string'
      args: 'list'
      dir: 'string'
    signalrest:
      endpoint: 'string'
      number: 'string'
      recipients: 'list'
      headers: 'map'
      timeout: 'string'
      proxy: 'string'
      tlsSkipVerify: 'bool'
      tlsCaCertFiles: 'list'
      templateBody: 'string'
      textMode: 'string'
    slack:
      webhookURL: 'string'
      webhookURLFile: 'string'
      renderFields: 'bool'
      proxy: 'string'
      templateBody: 'string'
    teams:
      webhookURL: 'string'
      webhookURLFile: 'string'
      cardType: 'string'
      renderFacts: 'bool'
      timeout: 'string'
      proxy: 'string'
      tlsSkipVerify: 'bool'
      tlsCaCertFiles: 'list'
      templateBody: 'string'
    telegram:
      apiURL: 'string'
      proxy: 'string'
      token: 'string'
      tokenFile: 'string'
      chatIDs: 'list'
      chatIDsFile: 'string'
      templateBody: 'string'
      disableNotification: 'bool'
    webhook:
      endpoint: 'string'
      method: 'string'
      headers: 'map'
      timeout: 'string'
      proxy: 'string'
      tlsSkipVerify: 'bool'
      tlsCaCertFiles: 'list'
  regopts:
    - { name: 'string', selector: 'string', username: 'string', usernameFile: 'string', password: 'string', passwordFile: 'string', insecureTLS: 'bool', timeout: 'string' }
  providers:
    docker:
      endpoint: 'string'
      apiVersion: 'string'
      tlsCertsPath: 'string'
      tlsVerify: 'bool'
      watchByDefault: 'bool'
      watchStopped: 'bool'
    swarm:
      endpoint: 'string'
      apiVersion: 'string'
      tlsCertsPath: 'string'
      tlsVerify: 'bool'
      watchByDefault: 'bool'
    containerd:
      endpoint: 'string'
      namespaces: 'list'
      watchByDefault: 'bool'
      watchStopped: 'bool'
    kubernetes:
      endpoint: 'string'
      token: 'string'
      tokenFile: 'string'
      certAuthFilePath: 'string'
      tlsInsecure: 'bool'
      namespaces: 'list'
      watchByDefault: 'bool'
    file:
      filename: 'string'
      directory: 'string'
    dockerfile:
      patterns: 'list'
    nomad:
      address: 'string'
      region: 'string'
      secretID: 'string'
      namespace: 'string'
      namespaces: 'list'
      tlsInsecure: 'bool'
      watchByDefault: 'bool'

# The options carrying secrets with the option of their file, <name> is the name of an entry of regopts
monitoring_diun__secrets_allowed:
  'watch.healthchecks.uuid': 'uuidFile'
  'metrics.token': 'tokenFile'
  'notif.amqp.username': 'usernameFile'
  'notif.amqp.password': 'passwordFile'
  'notif.apprise.token': 'tokenFile'
  'notif.discord.webhookURL': 'webhookURLFile'
  'notif.elasticsearch.username': 'usernameFile'
  'notif.elasticsearch.password': 'passwordFile'
  'notif.gotify.token': 'tokenFile'
  'notif.mail.username': 'usernameFile'
  'notif.mail.password': 'passwordFile'
  'notif.matrix.user': 'userFile'
  'notif.matrix.password': 'passwordFile'
  'notif.mqtt.username': 'usernameFile'
  'notif.mqtt.password': 'passwordFile'
  'notif.ntfy.token': 'tokenFile'
  'notif.pushover.token': 'tokenFile'
  'notif.pushover.recipient': 'recipientFile'
  'notif.rocketchat.token': 'tokenFile'
  'notif.slack.webhookURL': 'webhookURLFile'
  'notif.teams.webhookURL': 'webhookURLFile'
  'notif.telegram.token': 'tokenFile'
  'notif.telegram.chatIDs': 'chatIDsFile'
  'regopts.<name>.username': 'usernameFile'
  'regopts.<name>.password': 'passwordFile'
  'providers.kubernetes.token': 'tokenFile'
