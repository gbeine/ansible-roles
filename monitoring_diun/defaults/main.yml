# The keys of diun_keys, entries of the wrong type are left out, the validation reports them
monitoring_diun__keys_valid: >-
  {%- set keys = {} -%}
  {%- for family in monitoring_diun__keys_families -%}
  {%-   set values = monitoring_diun__keys[family] | default([]) if monitoring_diun__keys is mapping else [] -%}
  {%-   set _ = keys.update({ family: (values | select('string') | list) if values is sequence and values is not string and values is not mapping else [] }) -%}
  {%- endfor -%}
  {{ keys }}

monitoring_diun__keys_families: [ 'regopts', 'notif_webhook_headers', 'notif_signalrest_recipients', 'notif_signalrest_headers', 'defaults_metadata' ]

# The options of the keys, the users and the passwords of the registries are secrets
monitoring_diun__environment_allowed_keys: >-
  {%- set names = [] -%}
  {%- for key in monitoring_diun__keys_valid.regopts -%}
  {%-   for option in [ 'NAME', 'SELECTOR', 'TIMEOUT', 'INSECURETLS', 'USERNAMEFILE', 'PASSWORDFILE' ] -%}
  {%-     set _ = names.append('DIUN_REGOPTS_' ~ key ~ '_' ~ option) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {%- for key in monitoring_diun__keys_valid.notif_webhook_headers -%}
  {%-   set _ = names.append('DIUN_NOTIF_WEBHOOK_HEADERS_' ~ key) -%}
  {%- endfor -%}
  {%- for key in monitoring_diun__keys_valid.notif_signalrest_recipients -%}
  {%-   set _ = names.append('DIUN_NOTIF_SIGNALREST_RECIPIENTS_' ~ key) -%}
  {%- endfor -%}
  {%- for key in monitoring_diun__keys_valid.notif_signalrest_headers -%}
  {%-   set _ = names.append('DIUN_NOTIF_SIGNALREST_HEADERS_' ~ key) -%}
  {%- endfor -%}
  {%- for key in monitoring_diun__keys_valid.defaults_metadata -%}
  {%-   set _ = names.append('DIUN_DEFAULTS_METADATA_' ~ key) -%}
  {%- endfor -%}
  {{ names }}

monitoring_diun__secret_files_keys: >-
  {%- set files = {} -%}
  {%- for key in monitoring_diun__keys_valid.regopts -%}
  {%-   set _ = files.update({ 'DIUN_REGOPTS_' ~ key ~ '_USERNAME': 'DIUN_REGOPTS_' ~ key ~ '_USERNAMEFILE',
                               'DIUN_REGOPTS_' ~ key ~ '_PASSWORD': 'DIUN_REGOPTS_' ~ key ~ '_PASSWORDFILE' }) -%}
  {%- endfor -%}
  {{ files }}

monitoring_diun__podman_name: 'diun'
monitoring_diun__podman_image: 'docker.io/crazymax/diun'
monitoring_diun__podman_tag: "{{ monitoring_diun__version }}"

monitoring_diun__podman_home: "{{ monitoring_diun__home }}"
monitoring_diun__podman_etc_dir: "{{ monitoring_diun__podman_home }}/etc"
monitoring_diun__podman_data_dir: "{{ monitoring_diun__podman_home }}/data"

monitoring_diun__podman_container_default:
  name: "{{ monitoring_diun__podman_name }}"
  hostname: "{{ monitoring_diun__hostname }}"
  image: "{{ monitoring_diun__podman_image }}:{{ monitoring_diun__podman_tag }}"
  ip: "{{ monitoring_diun__ip }}"
  ipv6: "{{ monitoring_diun__ipv6 | default(omit) }}"
  network: "{{ monitoring_diun__network }}"
  timezone: "{{ monitoring_diun__timezone }}"
  # Set with diun_environment and diun_secrets, merged over the default
  environment: "{{ monitoring_diun__environment | combine(monitoring_diun__environment_secrets_files) }}"
  labels: "{{ monitoring_diun__labels | default(omit) }}"
  secrets: >-
    {{ (monitoring_diun__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ monitoring_diun__secrets_dir ~ '/\1') | list)
      if (monitoring_diun__secrets is sequence and monitoring_diun__secrets is not string and monitoring_diun__secrets | length > 0)
      else omit }}
  # diun_container.volumes replaces the list completely
  volumes: >-
    {{ [monitoring_diun__podman_data_dir + ':/data']
       + ([monitoring_diun__podman_socket + ':/var/run/docker.sock:ro'] if monitoring_diun__provider_podman | bool else []) }}
