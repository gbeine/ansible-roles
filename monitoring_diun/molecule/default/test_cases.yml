---
# Network created by container_podman in prepare.yml
monitoring_diun__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24

monitoring_diun__test_image: 'docker.io/crazymax/diun:latest'

# Receives the notifications of Diun, started in prepare.yml
monitoring_diun__test_mailpit:
  name: 'molecule-mailpit'
  image: 'docker.io/axllent/mailpit:latest'
  ip: '10.89.0.20'

# Container watched by Diun through the podman socket, started in prepare.yml
monitoring_diun__test_watched:
  name: 'molecule-watched'
  image: 'docker.io/library/alpine:latest'

monitoring_diun__test_secret: 'molecule-diun-secret'
monitoring_diun__test_registry_user: 'molecule-registry-user'
monitoring_diun__test_registry_password: 'molecule-registry-password'
monitoring_diun__test_from: 'diun@example.test'
monitoring_diun__test_quadlet_path: '/etc/containers/systemd/diun.container'

monitoring_diun__test_vars:
  diun_home: '/opt/diun-molecule'
  diun_ip: '10.89.0.50'
  diun_network: 'podman-molecule'
  diun_hostname: 'diun-molecule'
  diun_timezone: 'Europe/Berlin'
  diun_config:
    notif:
      mail:
        host: '10.89.0.20'
        port: 1025
        ssl: false
        from: 'diun@example.test'
        to: [ 'admin@example.test' ]
    # The registry does not match the watched image
    regopts:
      - name: 'molecule'
        selector: 'name'
        timeout: '10s'
    defaults:
      metadata:
        team: 'molecule'
  # Go refuses SMTP authentication without TLS, the password is passed as secret but mailpit does not need it
  diun_secrets:
    - name: 'diun_mail_password'
      data: 'molecule-diun-secret'
      target: 'notif.mail.password'
    - name: 'diun_registry_user'
      data: 'molecule-registry-user'
      target: 'regopts.molecule.username'
    - name: 'diun_registry_password'
      data: 'molecule-registry-password'
      target: 'regopts.molecule.password'

# The number of workers changed in side_effect.yml, diun.yml changes and the running service must be restarted
monitoring_diun__test_side_effect_workers: 5

# Lines of diun.yml after side_effect.yml
monitoring_diun__test_config_lines:
  - '    passwordFile: /run/secrets/diun_mail_password'
  - '  passwordFile: /run/secrets/diun_registry_password'
  - '  usernameFile: /run/secrets/diun_registry_user'
  - '- name: molecule'
  - '    team: molecule'
  - '  workers: 5'
  - '    endpoint: unix:///var/run/docker.sock'
