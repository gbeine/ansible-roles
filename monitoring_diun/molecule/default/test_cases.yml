---
# Network created by container_podman in prepare.yml
monitoring_diun__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24

monitoring_diun__test_image: 'docker.io/crazymax/diun:latest'

# Receives the notifications of Diun, started in prepare.yml
monitoring_diun__test_mailpit:
  name: 'molecule-mailpit'
  image: 'docker.io/axllent/mailpit:latest'
  ip: '10.89.0.20'

# Container watched by Diun through the podman socket, started in prepare.yml
monitoring_diun__test_watched:
  name: 'molecule-watched'
  image: 'docker.io/library/alpine:latest'

monitoring_diun__test_secret: 'molecule-diun-secret'
monitoring_diun__test_from: 'diun@example.test'

monitoring_diun__test_vars:
  diun_home: '/opt/diun-molecule'
  diun_ip: '10.89.0.50'
  diun_network: 'podman-molecule'
  diun_hostname: 'diun-molecule'
  diun_timezone: 'Europe/Berlin'
  diun_environment:
    DIUN_NOTIF_MAIL_HOST: '10.89.0.20'
    DIUN_NOTIF_MAIL_PORT: '1025'
    DIUN_NOTIF_MAIL_SSL: 'false'
    DIUN_NOTIF_MAIL_FROM: 'diun@example.test'
    DIUN_NOTIF_MAIL_TO: 'admin@example.test'
  # Go refuses SMTP authentication without TLS, the password is passed as secret but mailpit does not need it
  diun_secrets:
    - name: 'diun_mail_password'
      data: 'molecule-diun-secret'
      target: 'DIUN_NOTIF_MAIL_PASSWORD'

# Environment changed in side_effect.yml, the running service must be restarted
monitoring_diun__test_side_effect_workers: '5'
