---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_diun__test_case: "{{ monitoring_diun__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_diun__test_vars: "{{ monitoring_diun__test_case.role_vars }}"
    monitoring_diun__test_config: "{{ monitoring_diun__test_vars.diun_config | default({}) }}"
    monitoring_diun__test_secrets: "{{ monitoring_diun__test_vars.diun_secrets | default([]) }}"
    monitoring_diun__test_checked_files:
      - "{{ monitoring_diun__test_quadlet_path }}"
      - "{{ monitoring_diun__test_home }}/diun.yml"

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_diun__test_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksums of the checked files before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ monitoring_diun__test_checked_files }}"
      register: 'monitoring_diun__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include

    - name: 'Run monitoring_diun with diun_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diun_container: [ 'environment' ]
        monitoring_diun__test_invalid:
          message: 'diun_container is not a dictionary'
          search: 'failed to combine variables, expected dicts'

    - name: 'Run monitoring_diun with diun_config not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diun_config: [ 'notif' ]
        monitoring_diun__test_invalid:
          message: 'diun_config is not a dictionary'
          search: 'failed to combine variables, expected dicts'

    - name: 'Run monitoring_diun with a secret without target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diun_secrets:
          - name: 'diun_mail_password'
            data: 'molecule-diun-secret'
        monitoring_diun__test_invalid:
          message: 'a secret without target'
          search: '^`diun_secrets` entries need name, data and target$'

    - name: 'Run monitoring_diun with unknown options and an option of the wrong type (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diun_config: >-
          {{ monitoring_diun__test_config | combine({ 'notif': { 'mail': { 'server': 'mail.example.test' } },
                                                      'regopts': [ { 'name': 'molecule', 'molecule': true } ],
                                                      'watch': { 'workers': 'five' } }, recursive=true) }}
        monitoring_diun__test_invalid:
          message: 'unknown options and an option of the wrong type'
          search: >-
            ^Unknown options in diun_config: notif\.mail\.server, regopts\.molecule\.molecule, allowed are the options of diun\.yml \(monitoring_diun__config_schema\)\.
            These options of diun_config have the wrong type \(monitoring_diun__config_schema\): watch\.workers\.$

    - name: 'Run monitoring_diun with the password and its file in the configuration (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diun_config: "{{ monitoring_diun__test_config | combine({ 'notif': { 'mail': { 'password': 'molecule', 'passwordFile': '/run/secrets/x' } } }, recursive=true) }}"
        monitoring_diun__test_invalid:
          message: 'the password and its file in the configuration'
          search: '^Secrets and their files are set with diun_secrets, not in diun_config: notif\.mail\.password, notif\.mail\.passwordFile\.$'

    - name: 'Run monitoring_diun with an option of diun in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diun_environment:
          DIUN_WATCH_WORKERS: '5'
        monitoring_diun__test_invalid:
          message: 'an option of diun in the environment'
          search: '^Unknown environment variables: DIUN_WATCH_WORKERS\.'

    - name: 'Run monitoring_diun with diun_environment not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diun_environment: [ 'LOG_LEVEL' ]
        monitoring_diun__test_invalid:
          message: 'diun_environment not a dictionary'
          search: '^`diun_environment` has to be a dictionary\.$'

    - name: 'Run monitoring_diun with an invalid watch mode and an invalid label of the metrics (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diun_config: >-
          {{ monitoring_diun__test_config | combine({ 'defaults': { 'watchMode': 'latest' },
                                                      'metrics': { 'enabled': true, 'addr': ':6080', 'path': '/metrics',
                                                                   'metadataLabels': [ 'team-name' ] } }, recursive=true) }}
        monitoring_diun__test_invalid:
          message: 'an invalid watch mode and an invalid label of the metrics'
          search: >-
            ^defaults\.watchMode has to be one of tag, all, semver, semver\+prereleases\.
            The labels of metrics\.metadataLabels may only contain letters, digits and underscores: team-name\.$

    - name: 'Run monitoring_diun with an unknown environment variable in diun_container (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diun_container:
          environment:
            FOO: 'bar'
        monitoring_diun__test_invalid:
          message: 'an unknown environment variable in diun_container'
          search: 'Unknown environment variables: FOO\.'

    - name: 'Run monitoring_diun with an unknown secret and the secret of an unknown registry (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diun_secrets: >-
          {{ monitoring_diun__test_secrets
             + [ { 'name': 'diun_molecule_nomad', 'data': 'x', 'target': 'providers.nomad.secretID' },
                 { 'name': 'diun_molecule_other', 'data': 'x', 'target': 'regopts.other.password' } ] }}
        monitoring_diun__test_invalid:
          message: 'an unknown secret and the secret of an unknown registry'
          search: >-
            ^Unknown secrets: providers\.nomad\.secretID\. Allowed are .*
            The secrets of a registry need its entry in diun_config\.regopts: regopts\.other\.password\.$

    - name: 'Change the configuration'
      when: monitoring_diun__test_case.side_effect is defined
      block:

        - name: 'Read the main PID of Diun before the change'
          ansible.builtin.command: 'systemctl show --property=MainPID --value diun'
          register: 'monitoring_diun__test_pid_before'
          changed_when: false

        - name: 'Set the changed configuration'
          ansible.builtin.set_fact:
            diun_config: "{{ monitoring_diun__test_config | combine({ 'watch': { 'workers': monitoring_diun__test_case.side_effect.workers } }, recursive=true) }}"

        - name: 'Run monitoring_diun with the changed configuration'
          ansible.builtin.include_role:
            name: 'monitoring_diun'

        - name: 'Read the main PID of Diun after the change'
          ansible.builtin.command: 'systemctl show --property=MainPID --value diun'
          register: 'monitoring_diun__test_pid_after'
          changed_when: false

        - name: 'Assert the changed diun.yml and the restart of Diun'
          ansible.builtin.assert:
            that:
              - monitoring_diun__config_result is changed
              - monitoring_diun__quadlet_result is not changed
              - monitoring_diun__secrets_result is not changed
              - monitoring_diun__test_pid_after.stdout != '0'
              - monitoring_diun__test_pid_after.stdout != monitoring_diun__test_pid_before.stdout
            fail_msg: >-
              diun.yml changed: {{ monitoring_diun__config_result is changed }},
              quadlet changed: {{ monitoring_diun__quadlet_result is changed }},
              secrets changed: {{ monitoring_diun__secrets_result is changed }},
              PID {{ monitoring_diun__test_pid_before.stdout }} -> {{ monitoring_diun__test_pid_after.stdout }}

    - name: 'Run the role again without a change'
      when: monitoring_diun__test_case.side_effect is not defined
      block:

        - name: 'Read the main PID of Diun before the run without a change'
          ansible.builtin.command: 'systemctl show --property=MainPID --value diun'
          register: 'monitoring_diun__test_unchanged_before'
          changed_when: false

        - name: 'Run monitoring_diun without a change'
          ansible.builtin.include_role:
            name: 'monitoring_diun'

        - name: 'Read the main PID of Diun after the run without a change'
          ansible.builtin.command: 'systemctl show --property=MainPID --value diun'
          register: 'monitoring_diun__test_unchanged_after'
          changed_when: false

        - name: 'Assert no restart and no change'
          ansible.builtin.assert:
            that:
              - monitoring_diun__config_result is not changed
              - monitoring_diun__quadlet_result is not changed
              - monitoring_diun__secrets_result is not changed
              - monitoring_diun__test_unchanged_after.stdout == monitoring_diun__test_unchanged_before.stdout
            fail_msg: >-
              diun.yml changed: {{ monitoring_diun__config_result is changed }},
              quadlet changed: {{ monitoring_diun__quadlet_result is changed }},
              secrets changed: {{ monitoring_diun__secrets_result is changed }},
              PID {{ monitoring_diun__test_unchanged_before.stdout }} -> {{ monitoring_diun__test_unchanged_after.stdout }}
