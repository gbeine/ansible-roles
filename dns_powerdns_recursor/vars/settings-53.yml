  - name: "snmp"
    settings:
      - name: "agent"
        description: "If set, register as an SNMP agent"
        default: false
      - name: "daemon_socket"
        description: "If set and snmp-agent is set, the socket to use to register to the SNMP daemon"
        default: ""
  - name: "webservice"
    settings:
      - name: "address"
        description: "IP Address of webserver to listen on"
        default: "127.0.0.1"
      - name: "allow_from"
        description: "Webserver access is only allowed from these subnets"
        default: ["127.0.0.1", "::1"]
      - name: "api_dir"
        description: "Directory where REST API stores config and zones"
        default: ""
      - name: "api_key"
        description: "Static pre-shared authentication key for access to the REST API"
        default: ""
      - name: "hash_plaintext_credentials"
        description: "Whether to hash passwords and api keys supplied in plaintext, to prevent keeping the plaintext version in memory at runtime"
        default: false
      - name: "loglevel"
        description: "Amount of logging in the webserver (none, normal, detailed)"
        default: "normal"
      - name: "max_request_size"
        description: "Maximum size for webserver requests in megabytes"
        default: 2
      - name: "password"
        description: "Password required for accessing the webserver"
        default: ""
      - name: "port"
        description: "Port of webserver to listen on"
        default: 8082
      - name: "webserver"
        description: "Start a webserver (for REST API)"
        default: false
