---
# yamllint disable rule:line-length
#
# Settings of PowerDNS Recursor 5.3
# Generated from: pdns_recursor --config=default (docker.io/powerdns/pdns-recursor-53)
#

dns_powerdns_recursor__release_settings:
  - name: "carbon"
    settings:
      - name: "instance"
        description: "If set overwrites the instance name default"
        default: "recursor"
      - name: "interval"
        description: "Number of seconds between carbon (graphite) updates"
        default: 30
      - name: "ns"
        description: "If set overwrites the first part of the carbon string"
        default: "pdns"
      - name: "ourname"
        description: "If set, overrides our reported hostname for carbon stats"
        default: ""
      - name: "server"
        description: "If set, send metrics in carbon (graphite) format to this server IP address"
        default: []
  - name: "dnssec"
    settings:
      - name: "aggressive_cache_max_nsec3_hash_cost"
        description: "Maximum estimated NSEC3 cost for a given query to consider aggressive use of the NSEC3 cache"
        default: 150
      - name: "aggressive_cache_min_nsec3_hit_ratio"
        description: "The minimum expected hit ratio to store NSEC3 records into the aggressive cache"
        default: 2000
      - name: "aggressive_nsec_cache_size"
        description: "The number of records to cache in the aggressive cache. If set to a value greater than 0, and DNSSEC processing or validation is enabled, the recursor will cache NSEC and NSEC3 records to generate negative answers, as defined in rfc8198"
        default: 100000
      - name: "disabled_algorithms"
        description: "List of DNSSEC algorithm numbers that are considered unsupported"
        default: []
      - name: "log_bogus"
        description: "Log DNSSEC bogus validations"
        default: false
      - name: "max_dnskeys"
        description: "Maximum number of DNSKEYs with the same algorithm and tag to consider when validating a given record"
        default: 2
      - name: "max_ds_per_zone"
        description: "Maximum number of DS records to consider per zone"
        default: 8
      - name: "max_nsec3_hash_computations_per_query"
        description: "Maximum number of NSEC3 hashes that we are willing to compute during DNSSEC validation, per incoming query"
        default: 600
      - name: "max_nsec3s_per_record"
        description: "Maximum number of NSEC3s to consider when validating a given denial of existence"
        default: 10
      - name: "max_rrsigs_per_record"
        description: "Maximum number of RRSIGs to consider when validating a given record"
        default: 2
      - name: "max_signature_validations_per_query"
        description: "Maximum number of RRSIG signatures we are willing to validate per incoming query"
        default: 30
      - name: "negative_trustanchors"
        description: "A sequence of negative trust anchors"
        default: []
      - name: "nsec3_max_iterations"
        description: "Maximum number of iterations allowed for an NSEC3 record"
        default: 50
      - name: "signature_inception_skew"
        description: "Allow the signature inception to be off by this number of seconds"
        default: 60
      - name: "trustanchorfile"
        description: "A path to a zone file containing trust anchors"
        default: ""
      - name: "trustanchorfile_interval"
        description: "Interval (in hours) to read the trust anchors file"
        default: 24
      - name: "trustanchors"
        description: "Sequence of trust anchors"
        default: []
      - name: "validation"
        description: "DNSSEC mode: off/process-no-validate/process (default)/log-fail/validate"
        default: "process"
      - name: "x_dnssec_names"
        description: "Collect DNSSEC statistics for names or suffixes in this list in separate x-dnssec counters"
        default: []
  - name: "ecs"
    settings:
      - name: "add_for"
        description: "List of client netmasks for which EDNS Client Subnet will be added"
        default: ["0.0.0.0/0", "::/0", "!127.0.0.0/8", "!10.0.0.0/8", "!100.64.0.0/10", "!169.254.0.0/16", "!192.168.0.0/16", "!172.16.0.0/12", "!::1/128", "!fc00::/7", "!fe80::/10"]
      - name: "cache_limit_ttl"
        description: "Minimum TTL to cache ECS response"
        default: 0
      - name: "ipv4_bits"
        description: "Number of bits of IPv4 address to pass for EDNS Client Subnet"
        default: 24
      - name: "ipv4_cache_bits"
        description: "Maximum number of bits of IPv4 mask to cache ECS response"
        default: 24
      - name: "ipv4_never_cache"
        description: "If we should never cache IPv4 ECS responses"
        default: false
      - name: "ipv6_bits"
        description: "Number of bits of IPv6 address to pass for EDNS Client Subnet"
        default: 56
      - name: "ipv6_cache_bits"
        description: "Maximum number of bits of IPv6 mask to cache ECS response"
        default: 56
      - name: "ipv6_never_cache"
        description: "If we should never cache IPv6 ECS responses"
        default: false
      - name: "minimum_ttl_override"
        description: "The minimum TTL for records in ECS-specific answers"
        default: 1
      - name: "scope_zero_address"
        description: "Address to send to allow-listed authoritative servers for incoming queries with ECS prefix-length source of 0"
        default: ""
  - name: "incoming"
    settings:
      - name: "allow_from"
        description: "If set, only allow these comma separated netmasks to recurse"
        default: ["127.0.0.0/8", "10.0.0.0/8", "100.64.0.0/10", "169.254.0.0/16", "192.168.0.0/16", "172.16.0.0/12", "::1/128", "fc00::/7", "fe80::/10"]
      - name: "allow_from_file"
        description: "If set, load allowed netmasks from this file"
        default: ""
      - name: "allow_no_rd"
        description: "Allow 'no recursion desired (RD=0)' queries."
        default: false
      - name: "allow_notify_for"
        description: "If set, NOTIFY requests for these zones will be allowed"
        default: []
      - name: "allow_notify_for_file"
        description: "If set, load NOTIFY-allowed zones from this file"
        default: ""
      - name: "allow_notify_from"
        description: "If set, NOTIFY requests from these comma separated netmasks will be allowed"
        default: []
      - name: "allow_notify_from_file"
        description: "If set, load NOTIFY-allowed netmasks from this file"
        default: ""
      - name: "distribution_load_factor"
        description: "The load factor used when PowerDNS is distributing queries to worker threads"
        default: 0.0
      - name: "distribution_pipe_buffer_size"
        description: "Size in bytes of the internal buffer of the pipe used by the distributor to pass incoming queries to a worker thread"
        default: 0
      - name: "distributor_threads"
        description: "Launch this number of distributor threads, distributing queries to other threads"
        default: 0
      - name: "edns_padding_from"
        description: "List of netmasks (proxy IP in case of proxy-protocol presence, client IP otherwise) for which EDNS padding will be enabled in responses, provided that 'edns-padding-mode' applies"
        default: []
      - name: "edns_padding_mode"
        description: "Whether to add EDNS padding to all responses ('always') or only to responses for queries containing the EDNS padding option ('padded-queries-only', the default). In both modes, padding will only be added to responses for queries coming from 'setting-edns-padding-from' sources"
        default: "padded-queries-only"
      - name: "edns_padding_tag"
        description: "Packetcache tag associated to responses sent with EDNS padding, to prevent sending these to clients for which padding is not enabled."
        default: 7830
      - name: "gettag_needs_edns_options"
        description: "If EDNS Options should be extracted before calling the gettag() hook"
        default: false
      - name: "listen"
        description: "IP addresses to listen on, separated by spaces or commas. Also accepts ports."
        default: ["127.0.0.1", "::1"]
      - name: "max_concurrent_requests_per_tcp_connection"
        description: "Maximum number of requests handled concurrently per TCP connection"
        default: 10
      - name: "max_tcp_clients"
        description: "Maximum number of simultaneous TCP clients"
        default: 1024
      - name: "max_tcp_per_client"
        description: "If set, maximum number of TCP sessions per client (IP address)"
        default: 0
      - name: "max_tcp_queries_per_connection"
        description: "If set, maximum number of TCP queries in a TCP connection"
        default: 0
      - name: "max_udp_queries_per_round"
        description: "Maximum number of UDP queries processed per recvmsg() round, before returning back to normal processing"
        default: 10000
      - name: "non_local_bind"
        description: "Enable binding to non-local addresses by using FREEBIND / BINDANY socket options"
        default: false
      - name: "pdns_distributes_queries"
        description: "If PowerDNS itself should distribute queries over threads"
        default: false
      - name: "port"
        description: "port to listen on"
        default: 53
      - name: "proxy_protocol_exceptions"
        description: "A Proxy Protocol header should not be used for these listen addresses."
        default: []
      - name: "proxy_protocol_from"
        description: "A Proxy Protocol header is required from these subnets"
        default: []
      - name: "proxy_protocol_maximum_size"
        description: "The maximum size of a proxy protocol payload, including the TLV values"
        default: 512
      - name: "proxymappings"
        description: "Sequence of ProxyMapping"
        default: []
      - name: "reuseport"
        description: "Enable SO_REUSEPORT allowing multiple recursors processes to listen to 1 address"
        default: true
      - name: "tcp_fast_open"
        description: "Enable TCP Fast Open support on the listening sockets, using the supplied numerical value as the queue size"
        default: 0
      - name: "tcp_timeout"
        description: "Timeout in seconds when talking to TCP clients"
        default: 2
      - name: "udp_truncation_threshold"
        description: "Maximum UDP response size before we truncate"
        default: 1232
      - name: "use_incoming_edns_subnet"
        description: "Pass along received EDNS Client Subnet information"
        default: false
  - name: "logging"
    settings:
      - name: "common_errors"
        description: "If we should log rather common errors"
        default: false
      - name: "disable_syslog"
        description: "Disable logging to syslog, useful when running inside a supervisor that logs stderr"
        default: false
      - name: "dnstap_framestream_servers"
        description: "Sequence of dnstap servers"
        default: []
      - name: "dnstap_nod_framestream_servers"
        description: "Sequence of NOD dnstap servers"
        default: []
      - name: "facility"
        description: "Facility to log messages as. 0 corresponds to local0"
        default: ""
      - name: "loglevel"
        description: "Amount of logging. Higher is more. Do not set below 3"
        default: 6
      - name: "outgoing_protobuf_servers"
        description: "List of outgoing protobuf servers"
        default: []
      - name: "protobuf_servers"
        description: "Sequence of protobuf servers"
        default: []
      - name: "protobuf_use_kernel_timestamp"
        description: "Compute the latency of queries in protobuf messages by using the timestamp set by the kernel when the query was received (when available)"
        default: false
      - name: "quiet"
        description: "Suppress logging of questions and answers"
        default: true
      - name: "rpz_changes"
        description: "Log additions and removals to RPZ zones at Info level"
        default: false
      - name: "statistics_interval"
        description: "Number of seconds between printing of recursor statistics, 0 to disable"
        default: 1800
      - name: "structured_logging"
        description: "Prefer structured logging"
        default: true
      - name: "structured_logging_backend"
        description: "Structured logging backend"
        default: "default"
      - name: "timestamp"
        description: "Print timestamps in log lines, useful to disable when running with a tool that timestamps stderr already"
        default: true
      - name: "trace"
        description: "if we should output heaps of logging. set to 'fail' to only log failing domains"
        default: "no"
  - name: "nod"
    settings:
      - name: "db_size"
        description: "Size of the DB used to track new domains in terms of number of cells. Defaults to 67108864"
        default: 67108864
      - name: "db_snapshot_interval"
        description: "Interval (in seconds) to write the NOD and UDR DB snapshots"
        default: 600
      - name: "history_dir"
        description: "Persist new domain tracking data here to persist between restarts"
        default: "/var/local/nod"
      - name: "ignore_list"
        description: "List of domains (and implicitly all subdomains) which will never be considered a new domain"
        default: []
      - name: "ignore_list_file"
        description: "File with a list of domains (and implicitly all subdomains) which will never be considered a new domain"
        default: ""
      - name: "log"
        description: "Log newly observed domains."
        default: true
      - name: "lookup"
        description: "Perform a DNS lookup newly observed domains as a subdomain of the configured domain"
        default: ""
      - name: "pb_tag"
        description: "If protobuf is configured, the tag to use for messages containing newly observed domains. Defaults to 'pdns-nod'"
        default: "pdns-nod"
      - name: "tracking"
        description: "Track newly observed domains (i.e. never seen before)."
        default: false
      - name: "unique_response_db_size"
        description: "Size of the DB used to track unique responses in terms of number of cells. Defaults to 67108864"
        default: 67108864
      - name: "unique_response_history_dir"
        description: "Persist unique response tracking data here to persist between restarts"
        default: "/var/local/udr"
      - name: "unique_response_ignore_list"
        description: "List of domains (and implicitly all subdomains) which will never be considered for UDR"
        default: []
      - name: "unique_response_ignore_list_file"
        description: "File with list of domains (and implicitly all subdomains) which will never be considered for UDR"
        default: ""
      - name: "unique_response_log"
        description: "Log unique responses"
        default: true
      - name: "unique_response_pb_tag"
        description: "If protobuf is configured, the tag to use for messages containing unique DNS responses. Defaults to 'pdns-udr'"
        default: "pdns-udr"
      - name: "unique_response_tracking"
        description: "Track unique responses (tuple of query name, type and RR)."
        default: false
  - name: "outgoing"
    settings:
      - name: "bypass_server_throttling_probability"
        description: "Determines the probability of a server marked down to be used anyway"
        default: 25
      - name: "dont_query"
        description: "If set, do not query these netmasks for DNS data"
        default: ["127.0.0.0/8", "10.0.0.0/8", "100.64.0.0/10", "169.254.0.0/16", "192.168.0.0/16", "172.16.0.0/12", "::1/128", "fc00::/7", "fe80::/10", "0.0.0.0/8", "192.0.0.0/24", "192.0.2.0/24", "198.51.100.0/24", "203.0.113.0/24", "240.0.0.0/4", "::/96", "::ffff:0:0/96", "100::/64", "2001:db8::/32"]
      - name: "dont_throttle_names"
        description: "Do not throttle nameservers with this name or suffix"
        default: []
      - name: "dont_throttle_netmasks"
        description: "Do not throttle nameservers with this IP netmask"
        default: []
      - name: "dot_to_auth_names"
        description: "Use DoT to authoritative servers with these names or suffixes"
        default: []
      - name: "dot_to_port_853"
        description: "Force DoT connection to target port 853 if DoT compiled in"
        default: true
      - name: "edns_bufsize"
        description: "Outgoing EDNS buffer size"
        default: 1232
      - name: "edns_padding"
        description: "Whether to add EDNS padding to outgoing DoT messages"
        default: true
      - name: "edns_subnet_allow_list"
        description: "List of netmasks and domains that we should enable EDNS subnet for"
        default: []
      - name: "edns_subnet_harden"
        description: "Do more strict checking or EDNS Client Subnet information returned by authoritative servers"
        default: false
      - name: "lowercase"
        description: "Force outgoing questions to lowercase"
        default: false
      - name: "max_busy_dot_probes"
        description: "Maximum number of concurrent DoT probes"
        default: 0
      - name: "max_bytesperq"
        description: "Maximum number of received bytes per client query"
        default: 100000
      - name: "max_ns_address_qperq"
        description: "Maximum outgoing NS address queries per query"
        default: 10
      - name: "max_ns_per_resolve"
        description: "Maximum number of NS records to consider to resolve a name, 0 is no limit"
        default: 13
      - name: "max_qperq"
        description: "Maximum outgoing queries per client query"
        default: 50
      - name: "network_timeout"
        description: "Wait this number of milliseconds for network i/o"
        default: 1500
      - name: "non_resolving_ns_max_fails"
        description: "Number of failed address resolves of a nameserver to start throttling it, 0 is disabled"
        default: 5
      - name: "non_resolving_ns_throttle_time"
        description: "Number of seconds to throttle a nameserver with a name failing to resolve"
        default: 60
      - name: "server_down_max_fails"
        description: "Maximum number of consecutive timeouts (and unreachables) to mark a server as down ( 0 => disabled )"
        default: 64
      - name: "server_down_throttle_time"
        description: "Number of seconds to throttle all queries to a server after being marked as down"
        default: 60
      - name: "single_socket"
        description: "If set, only use a single socket for outgoing queries"
        default: false
      - name: "source_address"
        description: "Source IP address for sending queries"
        default: ["0.0.0.0"]
      - name: "tcp_fast_open_connect"
        description: "Enable TCP Fast Open support on outgoing sockets"
        default: false
      - name: "tcp_max_idle_ms"
        description: "Time TCP/DoT connections are left idle in milliseconds or 0 if no limit"
        default: 10000
      - name: "tcp_max_idle_per_auth"
        description: "Maximum number of idle TCP/DoT connections to a specific IP per thread, 0 means do not keep idle connections open"
        default: 10
      - name: "tcp_max_idle_per_thread"
        description: "Maximum number of idle TCP/DoT connections per thread"
        default: 100
      - name: "tcp_max_queries"
        description: "Maximum total number of queries per TCP/DoT connection, 0 means no limit"
        default: 0
      - name: "udp_source_port_avoid"
        description: "List of comma separated UDP port numbers to avoid"
        default: ["4791", "11211"]
      - name: "udp_source_port_max"
        description: "Maximum UDP port to bind on"
        default: 65535
      - name: "udp_source_port_min"
        description: "Minimum UDP port to bind on"
        default: 1024
  - name: "packetcache"
    settings:
      - name: "disable"
        description: "Disable packetcache"
        default: false
      - name: "max_entries"
        description: "maximum number of entries to keep in the packetcache"
        default: 500000
      - name: "max_entry_size"
        description: "maximum size of a packet stored in the the packet cache"
        default: 8192
      - name: "negative_ttl"
        description: "maximum number of seconds to keep a cached NxDomain or NoData entry in packetcache"
        default: 60
      - name: "servfail_ttl"
        description: "maximum number of seconds to keep a cached servfail entry in packetcache"
        default: 60
      - name: "shards"
        description: "Number of shards in the packet cache"
        default: 1024
      - name: "ttl"
        description: "maximum number of seconds to keep a cached entry in packetcache"
        default: 86400
  - name: "recordcache"
    settings:
      - name: "limit_qtype_any"
        description: "Limit answers to ANY queries in size"
        default: true
      - name: "locked_ttl_perc"
        description: "Replace records in record cache only after this % of original TTL has passed"
        default: 0
      - name: "max_cache_bogus_ttl"
        description: "maximum number of seconds to keep a Bogus (positive or negative) cached entry in memory"
        default: 3600
      - name: "max_entries"
        description: "If set, maximum number of entries in the main cache"
        default: 1000000
      - name: "max_entry_size"
        description: "maximum storage size of a recordset stored in record cache"
        default: 8192
      - name: "max_negative_ttl"
        description: "maximum number of seconds to keep a negative cached entry in memory"
        default: 3600
      - name: "max_rrset_size"
        description: "Maximum size of RRSet in cache"
        default: 256
      - name: "max_ttl"
        description: "maximum number of seconds to keep a cached entry in memory"
        default: 86400
      - name: "refresh_on_ttl_perc"
        description: "If a record is requested from the cache and only this % of original TTL remains, refetch"
        default: 0
      - name: "serve_stale_extensions"
        description: "Number of times a record's ttl is extended by 30s to be served stale"
        default: 0
      - name: "shards"
        description: "Number of shards in the record cache"
        default: 1024
      - name: "zonetocaches"
        description: "Sequence of ZoneToCache entries"
        default: []
  - name: "recursor"
    settings:
      - name: "allow_trust_anchor_query"
        description: "Allow queries for trustanchor.server CH TXT and negativetrustanchor.server CH TXT"
        default: false
      - name: "allowed_additional_qtypes"
        description: "Sequence of AllowedAdditionalQType"
        default: []
      - name: "any_to_tcp"
        description: "Answer ANY queries with tc=1, shunting to TCP"
        default: false
      - name: "auth_zones"
        description: "Zones for which we have authoritative data, comma separated domain=file pairs"
        default: []
      - name: "chroot"
        description: "switch to chroot jail"
        default: ""
      - name: "config_dir"
        description: "Location of configuration directory (recursor.conf or recursor.yml)"
        default: "/etc/powerdns"
      - name: "config_name"
        description: "Name of this virtual configuration - will rename the binary image"
        default: ""
      - name: "cpu_map"
        description: "Thread to CPU mapping, space separated thread-id=cpu1,cpu2..cpuN pairs"
        default: ""
      - name: "daemon"
        description: "Operate as a daemon"
        default: false
      - name: "devonly_regression_test_mode"
        description: "internal use only"
        default: false
      - name: "dns64_prefix"
        description: "DNS64 prefix"
        default: ""
      - name: "etc_hosts_file"
        description: "Path to 'hosts' file"
        default: "/etc/hosts"
      - name: "event_trace_enabled"
        description: "If set, event traces are collected and send out via protobuf logging (1), logfile (2), opentelemetry trace data (4) or a combination"
        default: 0
      - name: "export_etc_hosts"
        description: "If we should serve up contents from /etc/hosts"
        default: false
      - name: "export_etc_hosts_search_suffix"
        description: "Also serve up the contents of /etc/hosts with this suffix"
        default: ""
      - name: "extended_resolution_errors"
        description: "If set, send an EDNS Extended Error extension on resolution failures, like DNSSEC validation errors"
        default: true
      - name: "forward_zones"
        description: "Zones for which we forward queries, comma separated domain=ip pairs"
        default: []
      - name: "forward_zones_file"
        description: "File with (+)domain=ip pairs for forwarding"
        default: ""
      - name: "forward_zones_recurse"
        description: "Zones for which we forward queries with recursion bit, comma separated domain=ip pairs"
        default: []
      - name: "forwarding_catalog_zones"
        description: "Sequence of ForwardingCatalogZone"
        default: []
      - name: "hint_file"
        description: "If set, load root hints from this file"
        default: ""
      - name: "ignore_unknown_settings"
        description: "Configuration settings to ignore if they are unknown"
        default: []
      - name: "include_dir"
        description: "Include settings files from this directory."
        default: ""
      - name: "latency_statistic_size"
        description: "Number of latency values to calculate the qa-latency average"
        default: 10000
      - name: "lua_config_file"
        description: "More powerful configuration options"
        default: ""
      - name: "lua_dns_script"
        description: "Filename containing an optional Lua script that will be used to modify dns answers"
        default: ""
      - name: "lua_global_include_dir"
        description: "More powerful configuration options"
        default: ""
      - name: "lua_maintenance_interval"
        description: "Number of seconds between calls to the lua user defined maintenance() function"
        default: 1
      - name: "max_chain_length"
        description: "maximum number of queries that can be chained to an outgoing request, 0 is no limit"
        default: 0
      - name: "max_cnames_followed"
        description: "Maximum number CNAME records followed"
        default: 10
      - name: "max_generate_steps"
        description: "Maximum number of $GENERATE steps when loading a zone from a file"
        default: 0
      - name: "max_include_depth"
        description: "Maximum nested $INCLUDE depth when loading a zone from a file"
        default: 20
      - name: "max_mthreads"
        description: "Maximum number of simultaneous Mtasker threads"
        default: 2048
      - name: "max_pointers_per_name"
        description: "Maximum number of name pointers followed per name."
        default: 10
      - name: "max_pointers_per_packet_byte"
        description: "Maximum number of name pointers per DNS packet byte followed."
        default: 4
      - name: "max_pointers_to_pointers"
        description: "Maximum number of name pointers pointing directly to another pointer per name."
        default: 4
      - name: "max_recursion_depth"
        description: "Maximum number of internal recursion calls per query, 0 for unlimited"
        default: 16
      - name: "max_total_msec"
        description: "Maximum total wall-clock time per query in milliseconds, 0 for unlimited"
        default: 7000
      - name: "minimum_ttl_override"
        description: "The minimum TTL"
        default: 1
      - name: "nothing_below_nxdomain"
