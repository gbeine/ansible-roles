---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/dns-powerdns-recursor
#

dns_powerdns_recursor__home: "{{ recursor_home | mandatory }}"
dns_powerdns_recursor__ip: "{{ recursor_ip | mandatory }}"
dns_powerdns_recursor__ipv6: "{{ recursor_ipv6 }}"
dns_powerdns_recursor__network: "{{ recursor_network | mandatory }}"
dns_powerdns_recursor__hostname: "{{ recursor_hostname | mandatory }}"
dns_powerdns_recursor__timezone: "{{ recursor_timezone | mandatory }}"
dns_powerdns_recursor__labels: "{{ recursor_labels }}"

dns_powerdns_recursor__release: "{{ recursor_release | default('53') }}"
dns_powerdns_recursor__version: "{{ recursor_version | default('latest') }}"

dns_powerdns_recursor__publish: "{{ recursor_publish | default([]) }}"

dns_powerdns_recursor__settings: >-
  {{ dns_powerdns_recursor__settings_default | combine(recursor_settings | default({}), recursive=true) }}

dns_powerdns_recursor__container: "{{ dns_powerdns_recursor__podman_container_default | combine(recursor_container | default({})) }}"

dns_powerdns_recursor__autoupdate_enabled: "{{ recursor_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

dns_powerdns_recursor__releases: [ '53', '54', '55' ]

dns_powerdns_recursor__config_dir: '/etc/powerdns'
dns_powerdns_recursor__include_subdir: 'recursor.d'

dns_powerdns_recursor__settings_default:
  incoming:
    # The default of the recursor listens on localhost only
    listen: [ '0.0.0.0', '::' ]
  recursor:
    include_dir: "{{ dns_powerdns_recursor__config_dir }}/{{ dns_powerdns_recursor__include_subdir }}"
    # Former versions of the role disabled the security polling
    security_poll_suffix: ''

dns_powerdns_recursor__uid: 953
dns_powerdns_recursor__gid: 953

dns_powerdns_recursor__podman_name: 'recursor'
dns_powerdns_recursor__podman_image: "docker.io/powerdns/pdns-recursor-{{ dns_powerdns_recursor__release }}"

dns_powerdns_recursor__podman_home: "{{ dns_powerdns_recursor__home }}"
dns_powerdns_recursor__podman_config_dir: "{{ dns_powerdns_recursor__podman_home }}/config"
dns_powerdns_recursor__podman_run_dir: "{{ dns_powerdns_recursor__podman_home }}/run"

dns_powerdns_recursor__port: "{{ dns_powerdns_recursor__settings.incoming.port | default(53) }}"
dns_powerdns_recursor__webservice_port: "{{ (dns_powerdns_recursor__settings.webservice | default({})).port | default(8082) }}"

dns_powerdns_recursor__podman_container_default:
  name: "{{ dns_powerdns_recursor__podman_name }}"
  hostname: "{{ dns_powerdns_recursor__hostname }}"
  image: "{{ dns_powerdns_recursor__podman_image }}:{{ dns_powerdns_recursor__version }}"
  ip: "{{ dns_powerdns_recursor__ip }}"
  ipv6: "{{ dns_powerdns_recursor__ipv6 | default(omit) }}"
  network: "{{ dns_powerdns_recursor__network }}"
  timezone: "{{ dns_powerdns_recursor__timezone }}"
  labels: "{{ dns_powerdns_recursor__labels | default(omit) }}"
  # The recursor runs as user pdns in the container and needs to bind to incoming.port
  sysctls:
    net.ipv4.ip_unprivileged_port_start: "{{ dns_powerdns_recursor__port | string }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ dns_powerdns_recursor__podman_config_dir }}:{{ dns_powerdns_recursor__config_dir }}:ro"
    - "{{ dns_powerdns_recursor__podman_run_dir }}:/var/run/pdns-recursor"
  expose:
    - "{{ dns_powerdns_recursor__port }}/tcp"
    - "{{ dns_powerdns_recursor__port }}/udp"
    - "{{ dns_powerdns_recursor__webservice_port }}/tcp"
  publish: "{{ dns_powerdns_recursor__publish }}"
