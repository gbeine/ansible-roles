---

#
# Substitutes - do not change
#

dns_powerdns_recursor__allow_from: "{{ recursor_allow_from | default(dns_powerdns_recursor__allow_from_default) }}"
dns_powerdns_recursor__config_dir: "{{ recursor_config_dir | default(dns_powerdns_recursor__etc) }}"
dns_powerdns_recursor__etc_hosts_file: "{{ recursor_etc_hosts_file | default('/etc/hosts') }}"
dns_powerdns_recursor__exports_etc_hosts: "{{ recursor_exports_etc_hosts | default(false) }}"
dns_powerdns_recursor__hint_file: "{{ recursor_hint_file | default('/usr/share/dns/root.hints') }}"
dns_powerdns_recursor__include_dir: "{{ recursor_include_dir | default(dns_powerdns_recursor__config_dir + '/recursor.d') }}"
dns_powerdns_recursor__local_address: "{{ recursor_local_address | default(dns_powerdns_recursor__local_address_default) }}"
dns_powerdns_recursor__lua_config_file: "{{ recursor_lua_config_file | default(dns_powerdns_recursor__config_dir + '/recursor.lua') }}"
dns_powerdns_recursor__public_suffix_list_file: "{{ recursor_public_suffix_list_file | default('/usr/share/publicsuffix/public_suffix_list.dat') }}"
dns_powerdns_recursor__quiet: "{{ recursor_quiet | default(true) }}"
dns_powerdns_recursor__security_poll_suffix: "{{ recursor_security_poll_suffix | default('') }}"
dns_powerdns_recursor__setgid: "{{ recursor_setgid | default(dns_powerdns_recursor__setuid) }}"
dns_powerdns_recursor__setuid: "{{ recursor_setuid | default('pdns') }}"

#
# Defaults - do not change
#

dns_powerdns_recursor__allow_from_default:
  - '127.0.0.0/8'
  - '10.0.0.0/8'
  - '100.64.0.0/10'
  - '169.254.0.0/16'
  - '192.168.0.0/16'
  - '172.16.0.0/12'
  - '::1/128'
  - 'fc00::/7'
  - 'fe80::/10'

dns_powerdns_recursor__local_address_default:
  - '127.0.0.1'

dns_powerdns_recursor__etc: '/etc/powerdns'

dns_powerdns_recursor__packages: "{{ dns_powerdns_recursor__packages_default[ansible_facts['distribution']] | default([]) }}"

dns_powerdns_recursor__packages_default:
  Debian:
    - 'pdns-recursor'
  Raspbian:
    - 'pdns-recursor'
