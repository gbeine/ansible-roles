---
# Network created by container_podman in prepare.yml, shared by all test cases
dns_powerdns_recursor__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

dns_powerdns_recursor__test_api_key: 'molecule-api-key'

# Role variables shared by all test cases, the release is set per test case
dns_powerdns_recursor__test_common:
  recursor_home: '/opt/recursor-molecule'
  recursor_ip: '10.89.0.10'
  recursor_ipv6: 'fd00:89::10'
  recursor_network: 'podman-molecule'
  recursor_hostname: 'recursor-molecule'
  recursor_timezone: 'Europe/Berlin'
  recursor_settings:
    logging:
      loglevel: 5
    webservice:
      webserver: true
      address: '0.0.0.0'
      allow_from: [ '10.89.0.0/24', '127.0.0.1', '::1' ]
      api_key: 'molecule-api-key'

# Settings changed in side_effect.yml, the running service must be restarted
dns_powerdns_recursor__test_side_effect_settings:
  recordcache:
    max_ttl: 3600

dns_powerdns_recursor__test_cases:
  - name: 'molecule-recursor-53'
    release: '53'
  - name: 'molecule-recursor-54'
    release: '54'
  - name: 'molecule-recursor-55'
    release: '55'
