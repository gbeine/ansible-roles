---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    dns_powerdns_recursor__test_case: "{{ dns_powerdns_recursor__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  tasks:

    - name: 'Read the start time of the service before the change'
      ansible.builtin.command: 'systemctl show --property=ActiveEnterTimestampMonotonic --value recursor'
      register: 'dns_powerdns_recursor__test_started_before'
      changed_when: false

    - name: 'Set the role variables with changed settings'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: >-
        {{ dns_powerdns_recursor__test_common
           | combine({'recursor_release': dns_powerdns_recursor__test_case.release,
                      'recursor_settings': dns_powerdns_recursor__test_common.recursor_settings
                                           | combine(dns_powerdns_recursor__test_side_effect_settings, recursive=true)})
           | dict2items }}
      loop_control:
        label: "{{ item.key }}"

    - name: 'Run dns_powerdns_recursor with changed settings'
      ansible.builtin.include_role:
        name: 'dns_powerdns_recursor'

    - name: 'Read the start time of the service after the change'
      ansible.builtin.command: 'systemctl show --property=ActiveEnterTimestampMonotonic --value recursor'
      register: 'dns_powerdns_recursor__test_started_after'
      changed_when: false

    - name: 'Assert the configuration changed and the service was restarted'
      ansible.builtin.assert:
        that:
          - dns_powerdns_recursor__config_result is changed
          - dns_powerdns_recursor__test_started_after.stdout | int > dns_powerdns_recursor__test_started_before.stdout | int
        fail_msg: "before {{ dns_powerdns_recursor__test_started_before.stdout }}, after {{ dns_powerdns_recursor__test_started_after.stdout }}"
