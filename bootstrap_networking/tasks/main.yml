---

- name: 'Setup network interfaces'
  tags: [ 'bootstrap', 'bootstrap_networking'  ]
  block:

    - name: 'Generate interfaces configuration'
      ansible.builtin.template:
        src: 'interfaces.j2'
        dest: "{{ bootstrap_networking__interfaces_file }}"
        owner: 'root'
        group: 'root'
        mode: '644'

    - name: 'Generate additional interfaces configuration'
      ansible.builtin.template:
        src: 'interface.j2'
        dest: "{{ bootstrap_networking__interfaces_dir }}/{{ item['priority'] }}-{{ item['name'] | default(item['interface']) }}"
        owner: 'root'
        group: 'root'
        mode: '644'
      with_items: "{{ bootstrap_networking__interfaces }}"

    - name: 'Bring additional interfaces up'
      ansible.builtin.shell: "ifup '{{ item.interface }}'"
      with_items: "{{ bootstrap_networking__interfaces }}"
      when: 'not ansible_check_mode'
