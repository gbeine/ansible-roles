---

#
# Substitutes - do not change
#

matrix_bridge_bluesky__hostname: "{{ matrix_bridge_bluesky_hostname | default('mautrix-bluesky.' + dns_hostname) }}"
matrix_bridge_bluesky__ip: "{{ matrix_bridge_bluesky_ip | mandatory }}"
matrix_bridge_bluesky__ipv6: "{{ matrix_bridge_bluesky_ipv6 | default('') }}"
matrix_bridge_bluesky__network: "{{ matrix_bridge_bluesky_network | mandatory }}"
matrix_bridge_bluesky__hosts: "{{ matrix_bridge_bluesky_hosts | default({}) }}"
matrix_bridge_bluesky__timezone: "{{ matrix_bridge_bluesky_timezone | default(bootstrap_timezone__timezone) }}"
matrix_bridge_bluesky__home: "{{ matrix_bridge_bluesky_home | mandatory }}"

matrix_bridge_bluesky__dns_servers: "{{ matrix_bridge_bluesky_dns_servers | default([]) }}"

matrix_bridge_bluesky__setup: "{{ matrix_bridge_bluesky_setup | default(true) }}"

matrix_bridge_bluesky__version: "{{ matrix_bridge_bluesky_version | default('latest') }}"
matrix_bridge_bluesky__container: "{{ matrix_bridge_bluesky__podman_container_default }}"

#
# Defaults - do not change
#

matrix_bridge_bluesky__uid: 1337
matrix_bridge_bluesky__gid: 1337

matrix_bridge_bluesky__podman_image: 'dock.mau.dev/mautrix/bluesky'

matrix_bridge_bluesky__podman_container_default:
  name: 'mautrix-bluesky'
  hostname: "{{ matrix_bridge_bluesky__hostname }}"
  image: "{{ matrix_bridge_bluesky__podman_image }}:{{ matrix_bridge_bluesky__version }}"
  ip: "{{ matrix_bridge_bluesky__ip }}"
  ipv6: "{{ matrix_bridge_bluesky__ipv6 }}"
  network: "{{ matrix_bridge_bluesky__network }}"
  restart_policy: 'always'
  hosts: "{{ matrix_bridge_bluesky__hosts }}"
  dns_servers: "{{ matrix_bridge_bluesky__dns_servers }}"
  environment:
    TZ: "{{ matrix_bridge_bluesky__timezone }}"
  timezone: "{{ matrix_bridge_bluesky__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ matrix_bridge_bluesky__home }}:/data"
