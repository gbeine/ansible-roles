---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/papra
#

app_papra__home: "{{ papra_home | mandatory }}"
app_papra__ip: "{{ papra_ip | mandatory }}"
app_papra__ipv6: "{{ papra_ipv6 }}"
app_papra__network: "{{ papra_network | mandatory }}"
app_papra__hostname: "{{ papra_hostname | mandatory }}"
app_papra__timezone: "{{ papra_timezone | mandatory }}"
app_papra__labels: "{{ papra_labels | default({}) }}"
app_papra__secrets: "{{ papra_secrets | default([]) }}"

app_papra__version: "{{ papra_version | default('latest') }}"

app_papra__container: "{{ app_papra__container_default | combine(papra_container | default({})) }}"

app_papra__autoupdate_enabled: "{{ papra_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

app_papra__uid: '999'
app_papra__gid: "{{ app_papra__uid }}"

app_papra__podman_name: 'papra'
app_papra__podman_image: 'ghcr.io/papra-hq/papra'
app_papra__podman_tag: "{{ app_papra__version }}"

app_papra__podman_home: "{{ app_papra__home }}"

app_papra__container_default:
  name: "{{ app_papra__podman_name }}"
  hostname: "{{ app_papra__hostname }}"
  image: "{{ app_papra__podman_image }}:{{ app_papra__podman_tag }}"
  ip: "{{ app_papra__ip }}"
  ipv6: "{{ app_papra__ipv6 | default(omit) }}"
  network: "{{ app_papra__network }}"
  timezone: "{{ app_papra__timezone }}"
  labels: "{{ app_papra__labels }}"
  secrets: >-
    {{ (app_papra__secrets | map(attribute='name') | zip(app_papra__secrets | map(attribute='target')) | map('join', ',type=env,target=') | list)
      if (app_papra__secrets | length > 0)
      else omit }}
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_papra__podman_home }}:/app/app-data:Z"
