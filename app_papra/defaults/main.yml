---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/papra
#

app_papra__home: "{{ papra_home | mandatory }}"
app_papra__ip: "{{ papra_ip | mandatory }}"
app_papra__ipv6: "{{ papra_ipv6 }}"
app_papra__network: "{{ papra_network | mandatory }}"
app_papra__hostname: "{{ papra_hostname | mandatory }}"
app_papra__timezone: "{{ papra_timezone | mandatory }}"
app_papra__labels: "{{ papra_labels }}"

app_papra__version: "{{ papra_version | default('latest') }}"

app_papra__container: "{{ app_papra__podman_container_default | combine(papra_container | default({})) }}"

# The options of papra.config.mjs, merged recursively over the default, appBaseUrl is mandatory
app_papra__config: "{{ app_papra__config_default | combine(papra_config | default({}), recursive=true) }}"

# The variables of the image that are no options of Papra, e.g. NODE_OPTIONS
app_papra__environment: "{{ papra_environment }}"

# Secrets with name, data and target, the target is the path of the option, auth.secret is mandatory
app_papra__secrets: "{{ papra_secrets | default([]) }}"

# The administrator of Papra with name, email and password, the role signs it up as first user
app_papra__admin: "{{ papra_admin | mandatory }}"

app_papra__autoupdate_enabled: "{{ papra_autoupdate_enabled | default(false) }}"
app_papra__autoupdate_schedule: "{{ papra_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The user nonroot of the rootless image
app_papra__uid: 999
app_papra__gid: 999

app_papra__podman_name: 'papra'
app_papra__podman_image: 'ghcr.io/papra-hq/papra'
app_papra__podman_tag: "{{ app_papra__version }}"

app_papra__podman_home: "{{ app_papra__home }}"
# Papra reads papra.config.mjs from PAPRA_CONFIG_DIR, /app/app-data in the image
app_papra__config_file: "{{ app_papra__podman_home }}/papra.config.mjs"

app_papra__port: 1221

app_papra__config_default: {}

# appBaseUrl is the public URL of Papra, better-auth only accepts requests from its origin
app_papra__config_required: [ 'appBaseUrl' ]
app_papra__url_pattern: '^https?://[^\s/]+(/\S*)?$'

# auth.secret signs the sessions, Papra requires at least 32 characters
app_papra__secrets_required: [ 'auth.secret' ]
app_papra__secret_length: 32
app_papra__secrets_dir: '/run/secrets'

app_papra__admin_keys: [ 'name', 'email', 'password' ]
app_papra__admin_email_pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
app_papra__password_length: 8

app_papra__podman_container_default:
  name: "{{ app_papra__podman_name }}"
  hostname: "{{ app_papra__hostname }}"
  image: "{{ app_papra__podman_image }}:{{ app_papra__podman_tag }}"
  ip: "{{ app_papra__ip }}"
  ipv6: "{{ app_papra__ipv6 | default(omit) }}"
  network: "{{ app_papra__network }}"
  timezone: "{{ app_papra__timezone }}"
  labels: "{{ app_papra__labels | default(omit) }}"
  # Set with papra_environment
  environment: "{{ app_papra__environment | default(omit) }}"
  volumes:
    - "{{ app_papra__podman_home }}:/app/app-data:Z"
  # The secrets are files, papra.config.mjs reads them, entries without name are left out, the validation reports them
  secrets: >-
    {{ (app_papra__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ app_papra__secrets_dir ~ '/\1,uid=' ~ app_papra__uid ~ ',gid=' ~ app_papra__gid ~ ',mode=0400') | list)
      if (app_papra__secrets is sequence and app_papra__secrets is not string and app_papra__secrets | length > 0)
      else omit }}

# The variables of the image that are no options of Papra
app_papra__environment_allowed: [ 'NODE_OPTIONS', 'TZ' ]

# The options of papra-config-schema.json of Papra 26.7.1 carrying keys, passwords, tokens or credentials,
# they are passed with papra_secrets
app_papra__secrets_allowed:
  - 'ai.adapters.anthropic.apiKey'
  - 'ai.adapters.cocore.apiKey'
  - 'ai.adapters.deepseek.apiKey'
  - 'ai.adapters.lmstudio.apiKey'
  - 'ai.adapters.mistral.apiKey'
  - 'ai.adapters.ollama.apiKey'
  - 'ai.adapters.openai.apiKey'
  - 'ai.adapters.openrouter.apiKey'
  - 'ai.adapters.vllm.apiKey'
  - 'auth.providers.github.clientSecret'
  - 'auth.providers.google.clientSecret'
  - 'auth.secret'
  - 'database.authToken'
  - 'database.encryptionKey'
  - 'documentContentExtraction.strategy.azureDi.apiKey'
  - 'documentContentExtraction.strategy.docling.apiKey'
  - 'documentsStorage.drivers.azureBlob.accountKey'
  - 'documentsStorage.drivers.azureBlob.connectionString'
  - 'documentsStorage.drivers.s3.secretAccessKey'
  - 'documentsStorage.encryption.documentKeyEncryptionKeys'
  - 'emails.drivers.resend.resendApiKey'
  - 'emails.drivers.smtp.password'
  - 'intakeEmails.drivers.owlrelay.owlrelayApiKey'
  - 'intakeEmails.webhookSecret'
  - 'planEntitlements.selfhst.entitlementVerification.token'
  - 'subscriptions.stripeApiSecretKey'
  - 'subscriptions.stripeWebhookSecret'
  - 'tasks.persistence.drivers.libSql.authToken'
  - 'tracking.posthog.apiKey'

# The booleanish options of papra-config-schema.json of Papra 26.7.1, the values are YAML booleans
app_papra__config_booleans:
  - 'ai.credits.isEnabled'
  - 'ai.isEnabled'
  - 'auth.firstUserAsAdmin'
  - 'auth.isEmailVerificationRequired'
  - 'auth.isPasswordResetEnabled'
  - 'auth.isRegistrationEnabled'
  - 'auth.providers.email.isEnabled'
  - 'auth.providers.github.isEnabled'
  - 'auth.providers.google.isEnabled'
  - 'auth.showLegalLinksOnAuthPage'
  - 'autoTagging.isEnabled'
  - 'documents.isContentExtractionEnabled'
  - 'documents.isReprocessingEnabled'
  - 'documentsStorage.drivers.s3.forcePathStyle'
  - 'documentsStorage.encryption.isEncryptionEnabled'
  - 'documentsStorage.pattern.enableRandomSuffixFallback'
  - 'documentsStorage.pattern.isStorageKeySyncEnabled'
  - 'documentsStorage.pattern.useLegacyStorageKeyDefinitionSystem'
  - 'emails.drivers.smtp.secure'
  - 'ingestionFolder.isEnabled'
  - 'ingestionFolder.watcher.usePolling'
  - 'intakeEmails.isEnabled'
  - 'intakeEmails.username.canCustomize'
  - 'organizationPlans.isFreePlanUnlimited'
  - 'planEntitlements.selfhst.isEnabledForNewClaims'
  - 'server.servePublicDir'
  - 'tasks.expireInvitations.runOnStartup'
  - 'tasks.hardDeleteExpiredDocuments.runOnStartup'
  - 'tasks.persistence.drivers.libSql.migrateWithPragma'
  - 'tasks.purgeExpiredKvEntries.runOnStartup'
  - 'tasks.purgeExpiredOrganizations.runOnStartup'
  - 'tasks.reverifyPlanEntitlements.runOnStartup'
  - 'tracking.posthog.isEnabled'
  - 'webhooks.isSsrfProtectionEnabled'

