---

- name: 'Install Traefik'
  tags: [ 'webserver_traefik' ]
  block:

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item }}"
        state: 'directory'
      with_items:
        - "{{ webserver_traefik__podman_home }}"
        - "{{ webserver_traefik__podman_config_dir }}"

    - name: 'Generate configuration'
      ansible.builtin.copy:
        content: "{{ webserver_traefik__config | to_nice_yaml(indent=2) }}"
        dest: "{{ webserver_traefik__podman_config_file }}"
      when: 'not podman___update_mode | bool and webserver_traefik__config | length > 0'
      notify: 'Restart traefik container'

    - name: 'Ensure acme.json exists'
      ansible.builtin.file:
        dest: "{{ webserver_traefik__podman_acme_file }}"
        mode: '0600'
        state: 'touch'

    - name: 'Generate dynamic configuration'
      ansible.builtin.copy:
        content: "{{ item.value | to_nice_yaml(indent=2) }}"
        dest: "{{ webserver_traefik__podman_config_dir }}/{{ item.key }}.yml"
      when: 'not podman___update_mode | bool and webserver_traefik__dynamic | length > 0'
      with_dict: "{{ webserver_traefik__dynamic }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      with_items: "{{ webserver_traefik__secrets }}"

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ webserver_traefik__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[webserver_traefik__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ webserver_traefik__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ webserver_traefik__container.name }}"
        hostname: "{{ webserver_traefik__container.hostname }}"
        image: "{{ webserver_traefik__container.image }}"
        ip: "{{ webserver_traefik__container.ip }}"
        network: "{{ webserver_traefik__container.network }}"
        timezone: "{{ webserver_traefik__container.timezone }}"
        etc_hosts: "{{ webserver_traefik__container.etc_hosts }}"
        env: "{{ webserver_traefik__container.environment }}"
        label: "{{ webserver_traefik__container.labels }}"
        publish: "{{ webserver_traefik__container.publish }}"
        secrets: "{{ webserver_traefik__container.secrets }}"
        volume: "{{ webserver_traefik__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'webserver_traefik__ipv6 | length == 0'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ webserver_traefik__container.name }}"
        hostname: "{{ webserver_traefik__container.hostname }}"
        image: "{{ webserver_traefik__container.image }}"
        ip: "{{ webserver_traefik__container.ip }}"
        ip6: "{{ webserver_traefik__container.ipv6 }}"
        network: "{{ webserver_traefik__container.network }}"
        timezone: "{{ webserver_traefik__container.timezone }}"
        etc_hosts: "{{ webserver_traefik__container.etc_hosts }}"
        env: "{{ webserver_traefik__container.environment }}"
        label: "{{ webserver_traefik__container.labels }}"
        publish: "{{ webserver_traefik__container.publish }}"
        secrets: "{{ webserver_traefik__container.secrets }}"
        volume: "{{ webserver_traefik__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'webserver_traefik__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ webserver_traefik__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode | bool else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'webserver_traefik__autoupdate_enabled'
      block:
        - name: 'Create autoupdate systemd service'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ webserver_traefik__container.name }} container

              [Service]
              Type=oneshot
              ExecStart=/usr/bin/podman pull {{ webserver_traefik__container.image }}
              ExecStartPost=/usr/bin/systemctl restart {{ webserver_traefik__container.name }}
            dest: "/etc/systemd/system/container-{{ webserver_traefik__container.name }}-update.service"
            mode: '0644'
            owner: root
            group: root

        - name: 'Create autoupdate systemd timer'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ webserver_traefik__container.name }} timer

              [Timer]
              OnCalendar=*-*-* 00/3:00:00
              RandomizedDelaySec=30m
              Persistent=true

              [Install]
              WantedBy=timers.target
            dest: "/etc/systemd/system/container-{{ webserver_traefik__container.name }}-update.timer"
            mode: '0644'
            owner: root
            group: root

        - name: 'Start and enable autoupdate timer'
          ansible.builtin.systemd:
            name: "container-{{ webserver_traefik__container.name }}-update.timer"
            daemon_reload: true
            state: 'started'
            enabled: true
          when: 'not ansible_check_mode'
