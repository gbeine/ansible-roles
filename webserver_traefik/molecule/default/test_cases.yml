---
# Network created by container_podman in prepare.yml, shared by all test cases
webserver_traefik__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

webserver_traefik__test_image: 'docker.io/traefik:v3'

webserver_traefik__test_cases:

  - name: 'molecule-traefik-ipv4-only'
    role_vars:
      traefik_home: '/opt/traefik-molecule'
      traefik_ip: '10.89.0.10'
      traefik_network: 'podman-molecule'
      traefik_hostname: 'traefik-molecule'
      traefik_timezone: 'Europe/Berlin'
    expect:
      ip: '10.89.0.10'
      ip6: ~

  - name: 'molecule-traefik-ipv6'
    role_vars:
      traefik_home: '/opt/traefik-molecule'
      traefik_ip: '10.89.0.10'
      traefik_ipv6: 'fd00:89::10'
      traefik_network: 'podman-molecule'
      traefik_hostname: 'traefik-molecule'
      traefik_timezone: 'Europe/Berlin'
    expect:
      ip: '10.89.0.10'
      ip6: 'fd00:89::10'
