---
# Network created by container_podman in prepare.yml, shared by all test cases
webserver_traefik__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

webserver_traefik__test_image: 'docker.io/traefik:v3'
webserver_traefik__test_quadlet_path: '/etc/containers/systemd/traefik.container'

# The backend of the routes, started in prepare.yml with the labels of the docker provider
webserver_traefik__test_whoami:
  name: 'molecule-whoami'
  image: 'docker.io/traefik/whoami:latest'
  ip: '10.89.0.20'
  labels:
    traefik.enable: 'true'
    traefik.http.routers.whoami.rule: 'Host(`whoami.molecule`)'
    traefik.http.routers.whoami.entrypoints: 'websecure'
    traefik.http.routers.whoami.tls: 'true'
    traefik.http.services.whoami.loadbalancer.server.port: '80'

# The directory of the realms, common_globals__pki_realms_dir
webserver_traefik__test_realms_dir: '/etc/pki/realms'

webserver_traefik__test_cases:

  # The mandatory values only, the docker provider routes to the labeled container through the podman socket
  - name: 'molecule-traefik-default'
    role_vars:
      traefik_home: '/opt/traefik-molecule'
      traefik_ip: '10.89.0.10'
      traefik_network: 'podman-molecule'
      traefik_hostname: 'traefik-molecule'
      traefik_timezone: 'Europe/Berlin'
    expect:
      home: '/opt/traefik-molecule'
      ip: '10.89.0.10'
      ip6: ~
      quadlet:
        - 'Volume=/opt/traefik-molecule/dynamic:/etc/traefik/dynamic:ro'
        - 'Volume=/opt/traefik-molecule/traefik.yml:/etc/traefik/traefik.yml:ro'
        - 'Volume=/opt/traefik-molecule/acme.json:/etc/traefik/acme.json'
        - 'Volume=/opt/traefik-molecule/users:/etc/traefik/users:ro'
        - 'Volume=/opt/traefik-molecule/certs:/etc/traefik/certs:ro'
        - 'Volume=/run/podman/podman.sock:/var/run/docker.sock:ro'
      quadlet_absent:
        - '/etc/localtime'
        - '/etc/timezone'
        - 'Environment='
        - 'Wants='
        - 'ExecStartPre='
      config:
        log:
          level: 'WARN'
        serversTransport:
          insecureSkipVerify: false
        providers:
          docker:
            endpoint: 'unix:///var/run/docker.sock'
            exposedByDefault: false
      config_absent: []
      dynamic: []
      dynamic_absent: [ 'realms' ]
      # The htpasswd files with their users, the removed files, the realms and the files of the certificates
      users: {}
      users_absent: []
      realms: []
      certs: []
      # Host header and the expected status of the requests on port 443
      routes:
        whoami.molecule: 200
        unknown.molecule: 404

  # IPv6, the dynamic configuration instead of the docker provider, a removed section, environment and dependencies
  - name: 'molecule-traefik'
    role_vars:
      traefik_home: '/srv/traefik-molecule'
      traefik_ip: '10.89.0.11'
      traefik_ipv6: 'fd00:89::11'
      traefik_network: 'podman-molecule'
      traefik_hostname: 'traefik-molecule'
      traefik_timezone: 'Europe/Berlin'
      traefik_provider_podman: false
      traefik_config:
        serversTransport: ~
        log:
          level: 'DEBUG'
        providers:
          file:
            directory: '/etc/traefik/dynamic'
            watch: true
      traefik_dynamic:
        molecule:
          http:
            routers:
              dynamic:
                rule: 'Host(`dynamic.molecule`)'
                entryPoints: [ 'websecure' ]
                service: 'dynamic'
                tls: {}
            services:
              dynamic:
                loadBalancer:
                  servers:
                    - url: 'http://10.89.0.20:80'
        # The dashboard of Traefik (api@internal) with the users of the htpasswd file dashboard
        dashboard:
          http:
            routers:
              dashboard:
                rule: 'Host(`dashboard.molecule`)'
                entryPoints: [ 'websecure' ]
                service: 'api@internal'
                middlewares: [ 'dashboard-auth' ]
                tls: {}
            middlewares:
              dashboard-auth:
                basicAuth:
                  usersFile: '/etc/traefik/users/dashboard.htpasswd'
        # Created in prepare.yml, null removes the file
        stale: ~
      traefik_usersfile:
        dashboard:
          admin: 'molecule-admin-password'
          viewer: 'molecule-viewer-password'
        # Created in prepare.yml, null removes the file
        stale: ~
      # The certificates are created in prepare.yml
      traefik_realms: [ 'realm1', 'realm2' ]
      traefik_environment:
        LEGO_DISABLE_CNAME_SUPPORT: 'true'
      traefik_container:
        wants: [ 'network-online.target' ]
        after: [ 'network-online.target' ]
        requires_mounts_for: [ '/srv/traefik-molecule' ]
    # side_effect changes the log level, traefik.yml changes and Traefik is restarted,
    # then it changes the password of admin, the htpasswd file changes and Traefik is restarted
    side_effect:
      config:
        log:
          level: 'INFO'
      usersfile:
        dashboard:
          admin: 'molecule-admin-changed'
    expect:
      home: '/srv/traefik-molecule'
      ip: '10.89.0.11'
      ip6: 'fd00:89::11'
      quadlet:
        - 'Volume=/srv/traefik-molecule/dynamic:/etc/traefik/dynamic:ro'
        - 'Volume=/srv/traefik-molecule/traefik.yml:/etc/traefik/traefik.yml:ro'
        - 'Volume=/srv/traefik-molecule/acme.json:/etc/traefik/acme.json'
        - 'Volume=/srv/traefik-molecule/users:/etc/traefik/users:ro'
        - 'Volume=/srv/traefik-molecule/certs:/etc/traefik/certs:ro'
        - 'ExecStartPre=install -m 0644 /etc/pki/realms/realm1/fullchain.pem /srv/traefik-molecule/certs/realm1.crt'
        - 'ExecStartPre=install -m 0400 /etc/pki/realms/realm1/privkey.pem /srv/traefik-molecule/certs/realm1.key'
        - 'ExecStartPre=install -m 0644 /etc/pki/realms/realm2/fullchain.pem /srv/traefik-molecule/certs/realm2.crt'
        - 'ExecStartPre=install -m 0400 /etc/pki/realms/realm2/privkey.pem /srv/traefik-molecule/certs/realm2.key'
        - 'Environment=LEGO_DISABLE_CNAME_SUPPORT=true'
        - 'Wants=network-online.target'
        - 'After=network-online.target'
        - 'RequiresMountsFor=/srv/traefik-molecule'
      quadlet_absent:
        - '/etc/localtime'
        - '/etc/timezone'
        - 'podman.sock'
      # traefik.yml after side_effect
      config:
        log:
          level: 'INFO'
        providers:
          file:
            directory: '/etc/traefik/dynamic'
            watch: true
      config_absent:
        - 'serversTransport'
        - 'docker'
      dynamic: [ 'molecule', 'dashboard', 'realms' ]
      dynamic_absent: [ 'stale' ]
      routes:
        dynamic.molecule: 200
        whoami.molecule: 404
      users:
        dashboard: [ 'admin', 'viewer' ]
      users_absent: [ 'stale' ]
      # The login on the dashboard after side_effect changed the password
      login:
        host: 'dashboard.molecule'
        user: 'admin'
        password: 'molecule-admin-changed'
      realms: [ 'realm1', 'realm2' ]
      # old.crt is created in prepare.yml and removed by the role
      certs: [ 'realm1.crt', 'realm1.key', 'realm2.crt', 'realm2.key' ]
