---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    webserver_traefik__test_case: "{{ webserver_traefik__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    podman_networks:
      - "{{ webserver_traefik__test_network }}"
    podman_default_network: "{{ webserver_traefik__test_network.name }}"
    # The docker provider of Traefik uses the podman socket
    podman_socket_enabled: true
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    # The role expects logrotate on the host, the base VM may lack it
    - name: 'Install logrotate'
      ansible.builtin.apt:
        name: 'logrotate'
        state: 'present'
        update_cache: true

    - name: 'Pull the images, so the first start of the services does not time out'
      containers.podman.podman_image:
        name: "{{ item }}"
      loop:
        - "{{ webserver_traefik__test_image }}"
        - "{{ webserver_traefik__test_whoami.image }}"
      register: 'webserver_traefik__test_pull'
      until: webserver_traefik__test_pull is succeeded
      retries: 5
      delay: 30

    - name: 'Start the backend of the routes'
      containers.podman.podman_container:
        name: "{{ webserver_traefik__test_whoami.name }}"
        image: "{{ webserver_traefik__test_whoami.image }}"
        network: "{{ webserver_traefik__test_network.name }}"
        ip: "{{ webserver_traefik__test_whoami.ip }}"
        label: "{{ webserver_traefik__test_whoami.labels }}"
        state: 'started'

    # The role removes the file with null in traefik_dynamic
    - name: 'Create the directory of the dynamic configuration'
      ansible.builtin.file:
        path: "{{ webserver_traefik__test_case.expect.home }}/dynamic"
        mode: '0755'
        state: 'directory'

    - name: 'Create a dynamic configuration that is removed'
      ansible.builtin.copy:
        dest: "{{ webserver_traefik__test_case.expect.home }}/dynamic/{{ item }}.yml"
        content: |
          http: {}
        mode: '0644'
      loop: "{{ webserver_traefik__test_case.expect.dynamic_absent }}"

    # The certificates of the realms, the role installs them on the start of Traefik
    - name: 'Create the directories of the realms'
      ansible.builtin.file:
        path: "{{ webserver_traefik__test_realms_dir }}/{{ item }}"
        mode: '0755'
        state: 'directory'
      loop: "{{ webserver_traefik__test_case.expect.realms }}"

    - name: 'Create the self-signed certificates of the realms'
      ansible.builtin.command:
        argv:
          - 'openssl'
          - 'req'
          - '-x509'
          - '-newkey'
          - 'rsa:2048'
          - '-nodes'
          - '-days'
          - '30'
          - '-subj'
          - "/CN={{ item }}.molecule"
          - '-addext'
          - "subjectAltName=DNS:{{ item }}.molecule"
          - '-keyout'
          - "{{ webserver_traefik__test_realms_dir }}/{{ item }}/privkey.pem"
          - '-out'
          - "{{ webserver_traefik__test_realms_dir }}/{{ item }}/fullchain.pem"
        creates: "{{ webserver_traefik__test_realms_dir }}/{{ item }}/fullchain.pem"
      loop: "{{ webserver_traefik__test_case.expect.realms }}"

    # The role removes the htpasswd file with null in traefik_usersfile and the certificates of removed realms
    - name: 'Create the directories of the users and the certificates'
      ansible.builtin.file:
        path: "{{ webserver_traefik__test_case.expect.home }}/{{ item }}"
        mode: '0700'
        state: 'directory'
      loop: [ 'users', 'certs' ]

    - name: 'Create an htpasswd file that is removed'
      ansible.builtin.copy:
        dest: "{{ webserver_traefik__test_case.expect.home }}/users/{{ item }}.htpasswd"
        content: "stale:$2y$10$invalid\n"
        mode: '0600'
      loop: "{{ webserver_traefik__test_case.expect.users_absent }}"

    - name: 'Create the certificate of a removed realm'
      ansible.builtin.copy:
        dest: "{{ webserver_traefik__test_case.expect.home }}/certs/old.crt"
        content: "molecule\n"
        mode: '0644'
