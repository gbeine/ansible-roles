---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    webserver_traefik__test_case: "{{ webserver_traefik__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    webserver_traefik__expect: "{{ webserver_traefik__test_case.expect }}"

  tasks:

    - name: 'Read the generated quadlet unit'
      ansible.builtin.slurp:
        src: "{{ webserver_traefik__test_quadlet_path }}"
      register: 'webserver_traefik__test_quadlet'

    - name: 'Assert the quadlet unit'
      ansible.builtin.assert:
        that:
          - ('IP=' + webserver_traefik__expect.ip) in webserver_traefik__test_lines
          - webserver_traefik__expect.ip6 is none or ('IP6=' + webserver_traefik__expect.ip6) in webserver_traefik__test_lines
          - webserver_traefik__expect.ip6 is not none or webserver_traefik__test_lines | select('match', 'IP6=') | list | length == 0
          - ('Network=' + webserver_traefik__test_case.role_vars.traefik_network) in webserver_traefik__test_lines
          - webserver_traefik__expect.quadlet | reject('in', webserver_traefik__test_lines) | list | length == 0
          - >-
            webserver_traefik__test_lines
            | select('search', webserver_traefik__expect.quadlet_absent | map('regex_escape') | join('|')) | list | length == 0
        fail_msg: "Quadlet: {{ webserver_traefik__test_quadlet.content | b64decode }}"
      vars:
        webserver_traefik__test_lines: "{{ (webserver_traefik__test_quadlet.content | b64decode | regex_replace('\"', '')).splitlines() }}"

    - name: 'Read traefik.yml'
      ansible.builtin.slurp:
        src: "{{ webserver_traefik__expect.home }}/traefik.yml"
      register: 'webserver_traefik__test_config'

    # The expected options are part of traefik.yml, the sections set to null are removed
    - name: 'Assert traefik.yml'
      ansible.builtin.assert:
        that:
          - webserver_traefik__test_yaml | combine(webserver_traefik__expect.config, recursive=true) == webserver_traefik__test_yaml
          - webserver_traefik__expect.config_absent | select('in', webserver_traefik__test_yaml) | list | length == 0
          - webserver_traefik__expect.config_absent | select('in', webserver_traefik__test_yaml.providers | default({})) | list | length == 0
        fail_msg: "traefik.yml: {{ webserver_traefik__test_config.content | b64decode }}"
      vars:
        webserver_traefik__test_yaml: "{{ webserver_traefik__test_config.content | b64decode | from_yaml }}"

    - name: 'Read the files of the dynamic configuration'
      ansible.builtin.stat:
        path: "{{ webserver_traefik__expect.home }}/dynamic/{{ item }}.yml"
      loop: "{{ webserver_traefik__expect.dynamic + webserver_traefik__expect.dynamic_absent }}"
      register: 'webserver_traefik__test_dynamic'

    - name: 'Assert the files of the dynamic configuration'
      ansible.builtin.assert:
        that:
          - >-
            webserver_traefik__test_dynamic.results | selectattr('item', 'in', webserver_traefik__expect.dynamic)
            | map(attribute='stat.mode', default='') | reject('eq', '0644') | list | length == 0
          - >-
            webserver_traefik__test_dynamic.results | selectattr('item', 'in', webserver_traefik__expect.dynamic_absent)
            | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          {{ webserver_traefik__test_dynamic.results | map(attribute='item')
             | zip(webserver_traefik__test_dynamic.results | map(attribute='stat') | map(attribute='mode', default='absent'))
             | map('join', ': ') | join(', ') }}

    - name: 'Read the state of the traefik service'
      ansible.builtin.command: 'systemctl is-active traefik'
      register: 'webserver_traefik__test_service'
      changed_when: false
      failed_when: false

    - name: 'Assert the traefik service is active'
      ansible.builtin.assert:
        that:
          - webserver_traefik__test_service.stdout == 'active'

    - name: 'Inspect the traefik container'
      ansible.builtin.command: 'podman inspect traefik'
      register: 'webserver_traefik__test_inspect'
      changed_when: false

    - name: 'Assert the container addresses'
      ansible.builtin.assert:
        that:
          - webserver_traefik__test_net.IPAddress == webserver_traefik__expect.ip
          - webserver_traefik__expect.ip6 is none or webserver_traefik__test_net.GlobalIPv6Address == webserver_traefik__expect.ip6
        fail_msg: "IPv4 {{ webserver_traefik__test_net.IPAddress }}, IPv6 {{ webserver_traefik__test_net.GlobalIPv6Address }}"
      vars:
        webserver_traefik__test_net: >-
          {{ (webserver_traefik__test_inspect.stdout | from_json)[0].NetworkSettings.Networks[webserver_traefik__test_case.role_vars.traefik_network] }}

    - name: 'Request http on the published port'
      ansible.builtin.uri:
        url: 'http://127.0.0.1/'
        follow_redirects: 'none'
        status_code: [ 301, 302, 307, 308 ]
      register: 'webserver_traefik__test_http'
      until: webserver_traefik__test_http.status in [ 301, 302, 307, 308 ]
      retries: 15
      delay: 2

    - name: 'Assert http is redirected to https'
      ansible.builtin.assert:
        that:
          - webserver_traefik__test_http.location is match('https://')

    # The docker provider and the file provider load the routes after the start, the requests are repeated until the status matches
    - name: 'Request the routes on the published https port'
      ansible.builtin.uri:
        url: 'https://127.0.0.1/'
        headers:
          Host: "{{ item.key }}"
        validate_certs: false
        status_code: [ 200, 404 ]
        return_content: true
      loop: "{{ webserver_traefik__expect.routes | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: 'webserver_traefik__test_routes'
      until: webserver_traefik__test_routes.status == item.value
      retries: 15
      delay: 2

    # whoami answers with the name of its container
    - name: 'Assert the routes reach the backend'
      ansible.builtin.assert:
        that:
          - >-
            webserver_traefik__test_routes.results | selectattr('item.value', 'eq', 200)
            | rejectattr('content', 'search', 'Hostname: ') | list | length == 0
        fail_msg: "{{ webserver_traefik__test_routes.results | map(attribute='content') | list }}"
