---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/webserver-traefik
#

webserver_traefik__home: "{{ traefik_home | mandatory }}"
webserver_traefik__ip: "{{ traefik_ip | mandatory }}"
webserver_traefik__ipv6: "{{ traefik_ipv6 | default('') }}"
webserver_traefik__network: "{{ traefik_network | mandatory }}"
webserver_traefik__hostname: "{{ traefik_hostname | mandatory }}"
webserver_traefik__timezone: "{{ traefik_timezone | mandatory }}"
webserver_traefik__hosts: "{{ traefik_hosts | default(omit) }}"
webserver_traefik__labels: "{{ traefik_labels | default(omit) }}"
webserver_traefik__secrets: "{{ traefik_secrets | default([]) }}"

webserver_traefik__config: "{{ traefik_config | default(webserver_traefik__config_default) }}"
webserver_traefik__dynamic: "{{ traefik_dynamic | default({}) }}"

webserver_traefik__container: "{{ webserver_traefik__podman_container_default | combine(traefik_container | default({})) }}"

webserver_traefik__autoupdate_enabled: "{{ traefik_autoupdate_enabled | default(false) }}"
webserver_traefik__autoupdate_schedule: "{{ traefik_autoupdate_schedule | default('*-*-* 00/4:00:00') }}"

#
# podman defaults
#

webserver_traefik__podman_name: 'traefik'
webserver_traefik__podman_image: 'docker.io/traefik'
webserver_traefik__podman_tag: 'v3'

webserver_traefik__podman_home: "{{ webserver_traefik__home }}"
webserver_traefik__podman_config_dir: "{{ webserver_traefik__podman_home }}/dynamic"
webserver_traefik__podman_config_file: "{{ webserver_traefik__podman_home }}/traefik.yml"
webserver_traefik__podman_acme_file: "{{ webserver_traefik__podman_home }}/acme.json"

webserver_traefik__podman_container_default:
  name: "{{ webserver_traefik__podman_name }}"
  hostname: "{{ webserver_traefik__hostname }}"
  image: "{{ webserver_traefik__podman_image }}:{{ webserver_traefik__podman_tag }}"
  ip: "{{ webserver_traefik__ip }}"
  ipv6: "{{ webserver_traefik__ipv6 }}"
  network: "{{ webserver_traefik__network }}"
  timezone: "{{ webserver_traefik__timezone }}"
  etc_hosts: "{{ webserver_traefik__hosts }}"
  environment: {}
  labels: "{{ webserver_traefik__labels }}"
  publish:
    - '80:80'
    - '[::]:80:80'
    - '443:443'
    - '[::]:443:443'
  secrets: []
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ webserver_traefik__podman_config_dir }}:/etc/traefik/dynamic:ro"
    - "{{ webserver_traefik__podman_config_file }}:/etc/traefik/traefik.yml:ro"
    - "{{ webserver_traefik__podman_acme_file }}:/etc/traefik/acme.json"

webserver_traefik__config_default:
  api:
    dashboard: false
    insecure: false
    debug: false
  entryPoints:
    web:
      address: ":80"
      http:
        redirections:
          entryPoint:
            to: "websecure"
            scheme: "https"
    websecure:
      address: ":443"
  serversTransport:
    insecureSkipVerify: false
  log:
    level: 'WARN'
  providers:
    docker:
      endpoint: "unix:///var/run/docker.sock"
      exposedByDefault: false
