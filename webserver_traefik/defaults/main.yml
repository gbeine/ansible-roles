---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/webserver-traefik
#

webserver_traefik__home: "{{ traefik_home | mandatory }}"
webserver_traefik__ip: "{{ traefik_ip | mandatory }}"
webserver_traefik__ipv6: "{{ traefik_ipv6 }}"
webserver_traefik__network: "{{ traefik_network | mandatory }}"
webserver_traefik__hostname: "{{ traefik_hostname | mandatory }}"
webserver_traefik__timezone: "{{ traefik_timezone | mandatory }}"
webserver_traefik__labels: "{{ traefik_labels }}"

# Route to the containers of the host with the docker provider through the podman socket
webserver_traefik__provider_podman: "{{ traefik_provider_podman | default(true) }}"

# Options of traefik.yml, merged recursively over the default, null removes an option or a section
webserver_traefik__config: >-
  {{ webserver_traefik__config_default
     | combine(webserver_traefik__config_provider_podman if webserver_traefik__provider_podman | bool else {}, recursive=true)
     | combine(traefik_config | default({}), recursive=true) }}

# Files of the dynamic configuration in <traefik_home>/dynamic, name without .yml and content, null removes the file
webserver_traefik__dynamic: "{{ traefik_dynamic | default({}) }}"

# Variables of the image that are no options of Traefik, the options are set with traefik_config
webserver_traefik__environment: "{{ traefik_environment }}"

webserver_traefik__container: "{{ webserver_traefik__podman_container_default | combine(traefik_container | default({})) }}"

webserver_traefik__autoupdate_enabled: "{{ traefik_autoupdate_enabled | default(false) }}"
webserver_traefik__autoupdate_schedule: "{{ traefik_autoupdate_schedule | default('*-*-* 00/4:00:00') }}"

#
# Defaults - do not change
#

webserver_traefik__config_default:
  api:
    dashboard: false
    insecure: false
    debug: false
  entryPoints:
    web:
      address: ':80'
      http:
        redirections:
          entryPoint:
            to: 'websecure'
            scheme: 'https'
    websecure:
      address: ':443'
  serversTransport:
    insecureSkipVerify: false
  log:
    level: 'WARN'

webserver_traefik__config_provider_podman:
  providers:
    docker:
      endpoint: 'unix:///var/run/docker.sock'
      exposedByDefault: false

# The options of traefik_config, the role checks that it is a dictionary
webserver_traefik__config_custom: "{{ traefik_config | default({}) }}"

# The content of traefik.yml: the configuration without the options and sections set to null
webserver_traefik__config_file: >-
  {%- macro clean(value) -%}
  {%-   if value is mapping -%}
  {{-     '{' -}}
  {%-     for key, item in value.items() if item is not none -%}
  {{-       key | string | to_json }}: {{ clean(item) }}{{ ', ' if not loop.last -}}
  {%-     endfor -%}
  {{-     '}' -}}
  {%-   elif value is sequence and value is not string -%}
  {{-     '[' -}}
  {%-     for item in value if item is not none -%}
  {{-       clean(item) }}{{ ', ' if not loop.last -}}
  {%-     endfor -%}
  {{-     ']' -}}
  {%-   else -%}
  {{-     value | to_json -}}
  {%-   endif -%}
  {%- endmacro -%}
  {{ clean(webserver_traefik__config) | from_json }}

# The TCP ports of the entry points on all addresses (':80' or ':8080/tcp'), Traefik opens them after loading traefik.yml
webserver_traefik__entrypoint_ports: >-
  {{ webserver_traefik__config_file.entryPoints | default({}) | dict2items | map(attribute='value') | select('mapping')
     | map(attribute='address', default='') | map('string') | select('match', '^:[0-9]+(/tcp)?$')
     | map('regex_replace', '^[^:]*:([0-9]+).*$', '\1') | map('int') | list }}

webserver_traefik__former_variables:
  traefik_secrets: 'Traefik has no secrets, the options are set in traefik_config'

webserver_traefik__dynamic_name_pattern: '^[A-Za-z0-9_.-]+$'

# The variables of lego v5.6.0 (the ACME client of Traefik v3.7.19) read by the library, the options of Traefik are set with traefik_config
webserver_traefik__environment_allowed:
  - 'LEGO_CA_CERTIFICATES'
  - 'LEGO_CA_SERVER_NAME'
  - 'LEGO_CA_SYSTEM_CERT_POOL'
  - 'LEGO_DISABLE_CNAME_SUPPORT'
  - 'LEGO_EXPERIMENTAL_DNS_TCP_ONLY'
  - 'LEGO_DEBUG_CLIENT_VERBOSE_ERROR'
  - 'LEGO_DEBUG_DNS_API_HTTP_CLIENT'

webserver_traefik__podman_socket: '/run/podman/podman.sock'

webserver_traefik__podman_name: 'traefik'
webserver_traefik__podman_image: 'docker.io/traefik'
webserver_traefik__podman_tag: 'v3'

webserver_traefik__podman_home: "{{ webserver_traefik__home }}"
webserver_traefik__podman_config_dir: "{{ webserver_traefik__podman_home }}/dynamic"
webserver_traefik__podman_config_file: "{{ webserver_traefik__podman_home }}/traefik.yml"
webserver_traefik__podman_acme_file: "{{ webserver_traefik__podman_home }}/acme.json"

webserver_traefik__podman_container_default:
  name: "{{ webserver_traefik__podman_name }}"
  hostname: "{{ webserver_traefik__hostname }}"
  image: "{{ webserver_traefik__podman_image }}:{{ webserver_traefik__podman_tag }}"
  ip: "{{ webserver_traefik__ip }}"
  ipv6: "{{ webserver_traefik__ipv6 | default(omit) }}"
  network: "{{ webserver_traefik__network }}"
  timezone: "{{ webserver_traefik__timezone }}"
  environment: "{{ webserver_traefik__environment | default(omit) }}"
  labels: "{{ webserver_traefik__labels | default(omit) }}"
  publish:
    - '80:80'
    - '[::]:80:80'
    - '443:443'
    - '[::]:443:443'
  # traefik_container.volumes replaces the list completely
  volumes: >-
    {{ [ webserver_traefik__podman_config_dir + ':/etc/traefik/dynamic:ro',
         webserver_traefik__podman_config_file + ':/etc/traefik/traefik.yml:ro',
         webserver_traefik__podman_acme_file + ':/etc/traefik/acme.json' ]
       + ([ webserver_traefik__podman_socket + ':/var/run/docker.sock:ro' ] if webserver_traefik__provider_podman | bool else []) }}

# Generated from docs/content/reference/static-configuration/file.yaml of Traefik v3.7.19, update with new versions of Traefik:
