---
- name: Reload network
  community.openwrt.nohup:
    command: /etc/init.d/network reload
    delay: 1

- name: Wait for connection after network reload
  community.openwrt.wait_for_connection:
    timeout: "{{ openwrt_wait_for_connection_timeout | default(600) }}"
    delay: 5
  when: openwrt_wait_for_connection | default(true)
  listen: Reload network

- name: Reload uhttpd
  community.openwrt.nohup:
    command: /etc/init.d/uhttpd reload
    delay: 1

- name: Reload odhcpd
  community.openwrt.service:
    name: odhcpd
    state: restarted

# Running sessions are kept, dropbear forks a process for every connection
- name: Restart dropbear
  community.openwrt.nohup:
    command: /etc/init.d/dropbear restart
    delay: 1

- name: Wait for connection after dropbear restart
  community.openwrt.wait_for_connection:
    timeout: "{{ openwrt_wait_for_connection_timeout | default(600) }}"
    delay: 5
  when: openwrt_wait_for_connection | default(true)
  listen: Restart dropbear
