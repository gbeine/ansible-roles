---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/bootstrap-openwrt
#

bootstrap_openwrt__services_enabled: "{{ openwrt_services_enabled | default([]) }}"
bootstrap_openwrt__services_disabled: "{{ openwrt_services_disabled | default([]) }}"

bootstrap_openwrt__packages: "{{ openwrt_packages | default([]) }}"

bootstrap_openwrt__timezone: "{{ openwrt_timezone | default(common_globals__timezone) }}"

bootstrap_openwrt__ntp_sources: "{{ openwrt_ntp_sources | default(common_globals__ntp_sources) }}"

bootstrap_openwrt__system: "{{ openwrt_system | default(bootstrap_openwrt__system_default) }}"
bootstrap_openwrt__network: "{{ openwrt_network | default(bootstrap_openwrt__network_default) }}"
bootstrap_openwrt__wireless: "{{ openwrt_wireless | default(bootstrap_openwrt__wireless_default) }}"
bootstrap_openwrt__attendedsysupgrade: "{{ openwrt_attendedsysupgrade | default(bootstrap_openwrt__attendedsysupgrade_default) }}"

bootstrap_openwrt__network_protect: "{{ openwrt_network_protect | default([]) }}"

bootstrap_openwrt__acme_enable: "{{ openwrt_acme_enable | default(false) }}"
bootstrap_openwrt__acme_issue_retries: "{{ openwrt_acme_issue_retries | default(30) }}"
bootstrap_openwrt__acme_issue_delay: "{{ openwrt_acme_issue_delay | default(10) }}"
bootstrap_openwrt__acme: "{{ openwrt_acme | default([]) }}"

bootstrap_openwrt__uhttpd_enable: "{{ openwrt_uhttpd_enable | default(false) }}"
bootstrap_openwrt__uhttpd: "{{ openwrt_uhttpd | default(bootstrap_openwrt__uhttpd_default) }}"

# Defaults - no not change
bootstrap_openwrt__system_default:
  - type: 'system'
    find: { compat_version: '1.1' }
    options:
      hostname: 'OpenWrt'
      timezone: "{{ bootstrap_openwrt__timezone_posix }}"
      zonename: "{{ bootstrap_openwrt__timezone_zonename }}"
      ttylogin: '0'
      log_size: '128'
      urandom_seed: '0'
      compat_version: '1.1'

  - type: 'timeserver'
    name: 'ntp'
    find: { enabled: '1' }
    options:
      enabled: '1'
      enable_server: '0'
      server: "{{ bootstrap_openwrt__ntp_servers }}"

# sysntpd knows no pools, the servers come first, then the pools
bootstrap_openwrt__ntp_servers: >-
  {{ (bootstrap_openwrt__ntp_sources | selectattr('type', 'eq', 'server') | list
      + bootstrap_openwrt__ntp_sources | selectattr('type', 'eq', 'pool') | list)
     | map(attribute='address') | list }}

bootstrap_openwrt__network_default:
  - type: 'interface'
    name: 'loopback'
    find: { device: 'lo' }
    options:
      device: 'lo'
      proto: 'static'
      ipaddr: ['127.0.0.1/8']

  - type: 'device'
    find: { name: 'br-lan' }
    options:
      name: 'br-lan'
      type: 'bridge'
      ports: ['lan']

  - type: 'interface'
    name: 'lan'
    find: { device: 'br-lan' }
    options:
      device: 'br-lan'
      proto: 'static'
      ipaddr: ['192.168.1.1/24']
      ip6assign: '60'

# there is no meaningful default therefore, we skip when the list is empty
bootstrap_openwrt__wireless_default: []

bootstrap_openwrt__attendedsysupgrade_default:
  - type: 'server'
    name: 'server'
    find: { url: 'https://sysupgrade.openwrt.org' }
    options:
      url: 'https://sysupgrade.openwrt.org'

  - type: 'client'
    name: 'client'
    find: { upgrade_packages: '1' }
    options:
      upgrade_packages: '1'
      auto_search: '0'
      advanced_mode: '0'

  # Section of owut without options
  - type: 'owut'
    name: 'owut'
    find: {}
    options: {}

bootstrap_openwrt__uhttpd_default:
  - type: 'uhttpd'
    name: 'main'
    find: { home: '/www' }
    options:
      listen_http: ['0.0.0.0:80', '[::]:80']
      listen_https: ['0.0.0.0:443', '[::]:443']
      redirect_https: '0'
      home: '/www'
      rfc1918_filter: '1'
      max_requests: '3'
      max_connections: '100'
      cert: '/etc/uhttpd.crt'
      key: '/etc/uhttpd.key'
      cgi_prefix: '/cgi-bin'
      lua_prefix: ['/cgi-bin/luci=/usr/lib/lua/luci/sgi/uhttpd.lua']
      script_timeout: '60'
      network_timeout: '30'
      http_keepalive: '20'
      tcp_keepalive: '1'
      ubus_prefix: '/ubus'

  - type: 'cert'
    name: 'defaults'
    find: { commonname: 'OpenWrt' }
    options:
      days: '397'
      key_type: 'ec'
      bits: '2048'
      ec_curve: 'P-256'
      country: 'ZZ'
      state: 'Somewhere'
      location: 'Unknown'
      commonname: 'OpenWrt'

# helper variables
bootstrap_openwrt__system_prune: "{{ openwrt_system_prune | default(true) }}"
bootstrap_openwrt__network_prune: "{{ openwrt_network_prune | default(true) }}"
bootstrap_openwrt__wireless_prune: "{{ openwrt_wireless_prune | default(true) }}"
bootstrap_openwrt__attendedsysupgrade_prune: "{{ openwrt_attendedsysupgrade_prune | default(true) }}"
bootstrap_openwrt__acme_prune: "{{ openwrt_acme_prune | default(true) }}"
bootstrap_openwrt__uhttpd_prune: "{{ openwrt_uhttpd_prune | default(true) }}"

bootstrap_openwrt__timezone_zonename: >-
  {{ bootstrap_openwrt__timezones[bootstrap_openwrt__timezone].zonename | default(bootstrap_openwrt__timezone) }}
bootstrap_openwrt__timezone_posix: >-
  {{ openwrt_timezone_posix | default(bootstrap_openwrt__timezones[bootstrap_openwrt__timezone].posix | default('')) }}

# Names and shell wildcards (* and ?) of openwrt_network_protect as one anchored regular expression,
# the parts between the wildcards are escaped,
# without valid patterns the expression matches nothing
bootstrap_openwrt__network_protect_valid: >-
  {{ bootstrap_openwrt__network_protect is sequence
     and bootstrap_openwrt__network_protect is not string
     and bootstrap_openwrt__network_protect is not mapping
     and bootstrap_openwrt__network_protect | reject('string') | list | length == 0
     and bootstrap_openwrt__network_protect | select('equalto', '') | list | length == 0 }}
bootstrap_openwrt__network_protect_regex: >-
  {{ ('^(?:' ~ (bootstrap_openwrt__network_protect
                | map('split', '*') | map('map', 'split', '?') | map('map', 'map', 'regex_escape')
                | map('map', 'join', '.') | map('join', '.*') | join('|')) ~ ')$')
     if bootstrap_openwrt__network_protect_valid | bool and bootstrap_openwrt__network_protect | length > 0
     else '(?!)' }}

# packages lists
bootstrap_openwrt__acme_packages:
  - acme-acmesh
  - acme-acmesh-dnsapi
