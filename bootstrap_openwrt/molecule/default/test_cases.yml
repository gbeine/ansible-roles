---
# Network of the tart VM openwrt-base, br-lan gets its address via DHCP.
# The ports of br-lan are read from the clone in converge.yml.
bootstrap_openwrt__test_network:
  - type: 'interface'
    name: 'loopback'
    find: { device: 'lo' }
    options:
      device: 'lo'
      proto: 'static'
      ipaddr: ['127.0.0.1/8']
  - type: 'device'
    find: { name: 'br-lan' }
    options:
      name: 'br-lan'
      type: 'bridge'
      ports: "{{ bootstrap_openwrt__test_lan_ports }}"
  - type: 'interface'
    name: 'lan'
    find: { device: 'br-lan' }
    options:
      device: 'br-lan'
      proto: 'dhcp'

# Created in prepare.yml, the role removes it
bootstrap_openwrt__test_stale_section: 'molecule_stale'

# Created in prepare.yml on molecule-openwrt-minimal, the role must neither change nor remove them:
# an interface (name), an unnamed peer section like WireGuard (type) and an unnamed device (option name)
bootstrap_openwrt__test_protect: [ 'wg_*', 'wireguard_*', 'molecule-dev0' ]

bootstrap_openwrt__test_ntp_sources:
  - type: 'server'
    address: 'ntp1.example.org'
  - type: 'pool'
    address: '0.de.pool.ntp.org'
  - type: 'server'
    address: '192.0.2.123'

bootstrap_openwrt__test_cases:

  - name: 'molecule-openwrt-minimal'
    prepare_protected: true
    role_vars:
      openwrt_network: "{{ bootstrap_openwrt__test_network }}"
      openwrt_network_protect: "{{ bootstrap_openwrt__test_protect }}"
      # Site settings of common_globals
      site_timezone: 'Europe/Berlin'
      site_ntp_sources: "{{ bootstrap_openwrt__test_ntp_sources }}"
    expect:
      hostname: 'OpenWrt'
      zonename: 'Europe/Berlin'
      timezone: 'CET-1CEST,M3.5.0,M10.5.0/3'
      # Servers first, then pools
      ntp_servers: [ 'ntp1.example.org', '192.0.2.123', '0.de.pool.ntp.org' ]
      attendedsysupgrade_url: 'https://sysupgrade.openwrt.org'
      packages: []
      services_disabled: []
      services_enabled: []
      protected: true
      # Values of uci get, absent for missing options, lists separated by spaces
      dhcp:
        dhcp.odhcpd.loglevel: '4'
        dhcp.odhcpd.piodir: '/tmp/odhcpd-piodir'
        dhcp.lan.ra: 'server'
        dhcp.lan.dhcpv6: 'server'
        dhcp.lan.ra_flags: 'managed-config other-config'
        dhcp.lan.start: '100'
        dhcp.wan.interface: 'wan'
        dhcp.wan.ignore: '1'
        dhcp.wan.ra: 'absent'

  - name: 'molecule-openwrt-full'
    prepare_uhttpd: true
    role_vars:
      openwrt_network: "{{ bootstrap_openwrt__test_network }}"
      openwrt_timezone: 'Etc/UTC'
      openwrt_ntp_sources:
        - type: 'pool'
          address: '0.openwrt.pool.ntp.org'
      openwrt_system:
        - type: 'system'
          find: { compat_version: '1.1' }
          options:
            hostname: 'molecule-full'
            timezone: 'GMT0'
            zonename: 'UTC'
            ttylogin: '0'
            log_size: '128'
            urandom_seed: '0'
            compat_version: '1.1'
        - type: 'timeserver'
          name: 'ntp'
          find: { enabled: '1' }
          options:
            enabled: '1'
            enable_server: '0'
            server: [ '0.openwrt.pool.ntp.org' ]
      openwrt_packages:
        - 'htop'
      # The DHCP server is disabled in openwrt-base anyway
      openwrt_services_disabled:
        - 'dnsmasq'
      # prepare disables and stops uhttpd, the role has to enable and start it
      openwrt_services_enabled:
        - 'uhttpd'
      openwrt_uhttpd_enable: true
      # Numbers and booleans become strings, molecule6 is created
      openwrt_odhcpd:
        - type: 'odhcpd'
          name: 'odhcpd'
          options:
            leasefile: '/tmp/odhcpd.leases'
            leasetrigger: '/usr/sbin/odhcpd-update'
            loglevel: 6
        - type: 'dhcp'
          name: 'lan'
          options:
            ra: 'server'
            ra_flags: [ 'none' ]
            ra_slaac: true
            dhcpv6_pd_min_len: 64
        - type: 'dhcp'
          name: 'molecule6'
          options:
            ra: 'server'
    expect:
      hostname: 'molecule-full'
      zonename: 'UTC'
      timezone: 'GMT0'
      ntp_servers: [ '0.openwrt.pool.ntp.org' ]
      attendedsysupgrade_url: 'https://sysupgrade.openwrt.org'
      packages: [ 'htop' ]
      services_disabled: [ 'dnsmasq' ]
      services_enabled: [ 'uhttpd' ]
      uhttpd: true
      dhcp:
        dhcp.odhcpd.loglevel: '6'
        dhcp.odhcpd.piodir: 'absent'
        dhcp.lan.ra: 'server'
        dhcp.lan.ra_flags: 'none'
        dhcp.lan.ra_slaac: '1'
        dhcp.lan.dhcpv6_pd_min_len: '64'
        dhcp.lan.dhcpv6: 'absent'
        dhcp.lan.start: '100'
        dhcp.molecule6.interface: 'molecule6'
        dhcp.molecule6.ignore: '1'
        dhcp.molecule6.ra: 'server'
        dhcp.wan.ra: 'absent'
