---
# OpenWrt has no Python, the role uses the modules of community.openwrt
- name: 'Converge'
  hosts: 'all'
  gather_facts: false

  vars_files:
    - 'test_cases.yml'

  vars:
    bootstrap_openwrt__test_case: "{{ bootstrap_openwrt__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  pre_tasks:

    - name: 'Read the ports of br-lan of the clone'
      ansible.builtin.raw: "uci -q get network.@device[0].ports"
      register: 'bootstrap_openwrt__test_ports'
      changed_when: false

    - name: 'Set the ports of br-lan'
      ansible.builtin.set_fact:
        bootstrap_openwrt__test_lan_ports: "{{ bootstrap_openwrt__test_ports.stdout | trim | split }}"

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ bootstrap_openwrt__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  tasks:

    - name: 'Run bootstrap_openwrt'
      ansible.builtin.include_role:
        name: 'bootstrap_openwrt'
