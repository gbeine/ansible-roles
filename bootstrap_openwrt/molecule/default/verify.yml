---
# OpenWrt has no Python, all checks use raw
- name: 'Verify'
  hosts: 'all'
  gather_facts: false

  vars_files:
    - 'test_cases.yml'

  vars:
    bootstrap_openwrt__test_case: "{{ bootstrap_openwrt__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    bootstrap_openwrt__test_expect: "{{ bootstrap_openwrt__test_case.expect }}"

  tasks:

    - name: 'Read the network, system and attendedsysupgrade configuration'
      ansible.builtin.raw: >-
        echo "lan_proto=$(uci -q get network.lan.proto)";
        echo "lan_device=$(uci -q get network.lan.device)";
        echo "stale=$(uci -q get network.{{ bootstrap_openwrt__test_stale_section }} || echo absent)";
        echo "hostname=$(uci -q get system.@system[0].hostname)";
        echo "zonename=$(uci -q get system.@system[0].zonename)";
        echo "timezone=$(uci -q get system.@system[0].timezone)";
        echo "ntp=$(uci -q get system.ntp.server)";
        echo "asu_url=$(uci -q get attendedsysupgrade.server.url)";
        echo "owut=$(uci -q get attendedsysupgrade.owut || echo absent)"
      register: 'bootstrap_openwrt__test_uci'
      changed_when: false

    - name: 'Assert the network, system and attendedsysupgrade configuration'
      ansible.builtin.assert:
        that:
          - bootstrap_openwrt__test_values.lan_proto == 'dhcp'
          - bootstrap_openwrt__test_values.lan_device == 'br-lan'
          - bootstrap_openwrt__test_values.stale == 'absent'
          - bootstrap_openwrt__test_values.hostname == bootstrap_openwrt__test_expect.hostname
          - bootstrap_openwrt__test_values.zonename == bootstrap_openwrt__test_expect.zonename
          - bootstrap_openwrt__test_values.timezone == bootstrap_openwrt__test_expect.timezone
          - bootstrap_openwrt__test_values.ntp.split() == bootstrap_openwrt__test_expect.ntp_servers
          - bootstrap_openwrt__test_values.asu_url == bootstrap_openwrt__test_expect.attendedsysupgrade_url
          # The section owut has no options in the default, prune must not remove it
          - bootstrap_openwrt__test_values.owut == 'owut'
        fail_msg: "{{ bootstrap_openwrt__test_uci.stdout_lines | map('trim') | join(', ') }}"
      vars:
        bootstrap_openwrt__test_values: >-
          {{ dict(bootstrap_openwrt__test_uci.stdout_lines | map('trim') | select('search', '=')
                  | map('split', '=', 1) | list) }}

    - name: 'Verify the protected network sections'
      when: bootstrap_openwrt__test_expect.protected | default(false)
      block:

        - name: 'Read the protected network sections'
          ansible.builtin.raw: >-
            echo "wg=$(uci -q get network.wg_molecule.proto || echo absent)";
            echo "peer=$(uci -q get network.@wireguard_wg_molecule[0].description || echo absent)";
            echo "device=$(uci show network | grep -c "\.name='molecule-dev0'$")"
          register: 'bootstrap_openwrt__test_protected'
          changed_when: false

        - name: 'Assert the protected network sections are unchanged'
          ansible.builtin.assert:
            that:
              - "'wg=none' in bootstrap_openwrt__test_protected.stdout_lines | map('trim')"
              - "'peer=molecule' in bootstrap_openwrt__test_protected.stdout_lines | map('trim')"
              - "'device=1' in bootstrap_openwrt__test_protected.stdout_lines | map('trim')"
            fail_msg: "{{ bootstrap_openwrt__test_protected.stdout_lines | map('trim') | join(', ') }}"

    - name: 'Read the dhcp configuration of odhcpd'
      ansible.builtin.raw: >-
        for k in {{ bootstrap_openwrt__test_expect.dhcp.keys() | join(' ') }};
        do echo "$k=$(uci -q get $k || echo absent)"; done
      register: 'bootstrap_openwrt__test_dhcp'
      changed_when: false

    - name: 'Assert the dhcp configuration of odhcpd'
      ansible.builtin.assert:
        that:
          - bootstrap_openwrt__test_values == bootstrap_openwrt__test_expect.dhcp
        fail_msg: >-
          expected {{ bootstrap_openwrt__test_expect.dhcp }}, found {{ bootstrap_openwrt__test_values }}
      vars:
        bootstrap_openwrt__test_values: >-
          {{ dict(bootstrap_openwrt__test_dhcp.stdout_lines | map('trim') | select('search', '=')
                  | map('split', '=', 1) | list) }}

    - name: 'Read the installed packages'
      ansible.builtin.raw: "for p in {{ bootstrap_openwrt__test_expect.packages | join(' ') }}; do apk info -e \"$p\" >/dev/null && echo \"$p\"; done; true"
      register: 'bootstrap_openwrt__test_packages'
      changed_when: false
      when: bootstrap_openwrt__test_expect.packages | length > 0

    - name: 'Read the disabled services'
      ansible.builtin.raw: "for s in {{ bootstrap_openwrt__test_expect.services_disabled | join(' ') }}; do /etc/init.d/$s enabled || echo \"$s\"; done; true"
      register: 'bootstrap_openwrt__test_services'
      changed_when: false
      when: bootstrap_openwrt__test_expect.services_disabled | length > 0

    - name: 'Read the enabled and running services'
      ansible.builtin.raw: >-
        for s in {{ bootstrap_openwrt__test_expect.services_enabled | join(' ') }};
        do /etc/init.d/$s enabled && /etc/init.d/$s running && echo "$s"; done; true
      register: 'bootstrap_openwrt__test_services_enabled'
      changed_when: false
      when: bootstrap_openwrt__test_expect.services_enabled | length > 0

    - name: 'Assert the packages and services'
      ansible.builtin.assert:
        that:
          - >-
            bootstrap_openwrt__test_expect.packages
            | difference(bootstrap_openwrt__test_packages.stdout_lines | default([]) | map('trim') | list) | length == 0
          - >-
            bootstrap_openwrt__test_expect.services_disabled
            | difference(bootstrap_openwrt__test_services.stdout_lines | default([]) | map('trim') | list) | length == 0
          - >-
            bootstrap_openwrt__test_expect.services_enabled
            | difference(bootstrap_openwrt__test_services_enabled.stdout_lines | default([]) | map('trim') | list) | length == 0
        fail_msg: >-
          installed: {{ bootstrap_openwrt__test_packages.stdout_lines | default([]) | map('trim') | join(', ') }},
          disabled: {{ bootstrap_openwrt__test_services.stdout_lines | default([]) | map('trim') | join(', ') }},
          enabled and running: {{ bootstrap_openwrt__test_services_enabled.stdout_lines | default([]) | map('trim') | join(', ') }}

    - name: 'Verify uhttpd'
      when: bootstrap_openwrt__test_expect.uhttpd | default(false)
      block:

        - name: 'Read the state and the HTTPS listeners of uhttpd'
          ansible.builtin.raw: >-
            pidof uhttpd >/dev/null && echo 'running=yes' || echo 'running=no';
            echo "https=$(uci -q get uhttpd.main.listen_https)"
          register: 'bootstrap_openwrt__test_uhttpd'
          changed_when: false

        - name: 'Assert uhttpd runs with HTTPS'
          ansible.builtin.assert:
            that:
              - "'running=yes' in bootstrap_openwrt__test_uhttpd.stdout_lines | map('trim')"
              - bootstrap_openwrt__test_uhttpd.stdout is search('https=0\.0\.0\.0:443')
            fail_msg: "{{ bootstrap_openwrt__test_uhttpd.stdout_lines | map('trim') | join(', ') }}"

    - name: 'Read the configuration and the state of dropbear, the SFTP server and the authorized keys'
      ansible.builtin.raw: >-
        for k in {{ bootstrap_openwrt__test_expect.dropbear.keys() | join(' ') }};
        do echo "$k=$(uci -q get $k || echo absent)"; done;
        echo "sections=$(uci show dropbear | grep -c '^dropbear[.][^.]*=dropbear$')";
        /etc/init.d/dropbear running && echo 'running=yes' || echo 'running=no';
        apk info -e {{ bootstrap_openwrt__test_sftp_package }} >/dev/null && echo 'sftp=yes' || echo 'sftp=no';
        test -x /usr/libexec/sftp-server && echo 'sftp_server=yes' || echo 'sftp_server=no';
        echo "root_attrs=$(ls -lnd /etc/dropbear/authorized_keys 2>/dev/null | awk '{print $3":"$4":"$1}')";
        grep -qxF '{{ bootstrap_openwrt__test_root_key }}' /etc/dropbear/authorized_keys 2>/dev/null && echo 'root_key=yes' || echo 'root_key=no';
        echo "user_dir=$(ls -lnd {{ bootstrap_openwrt__test_user.home }}/.ssh 2>/dev/null | awk '{print $3":"$4":"$1}')";
        echo "user_attrs=$(ls -lnd {{ bootstrap_openwrt__test_user.home }}/.ssh/authorized_keys 2>/dev/null | awk '{print $3":"$4":"$1}')";
        echo "user_keys=$(cat {{ bootstrap_openwrt__test_user.home }}/.ssh/authorized_keys 2>/dev/null | wc -l)";
        grep -qxF '{{ bootstrap_openwrt__test_user_key }}' {{ bootstrap_openwrt__test_user.home }}/.ssh/authorized_keys 2>/dev/null && echo 'user_key=yes' || echo 'user_key=no'
      register: 'bootstrap_openwrt__test_ssh'
      changed_when: false
      vars:
        bootstrap_openwrt__test_sftp_package: 'openssh-sftp-server'

    - name: 'Assert the configuration and the state of dropbear, the SFTP server and the authorized keys'
      ansible.builtin.assert:
        that:
          - bootstrap_openwrt__test_values | dict2items | selectattr('key', 'in', bootstrap_openwrt__test_expect.dropbear.keys() | list) | items2dict
            == bootstrap_openwrt__test_expect.dropbear
          # The second section of prepare.yml on molecule-openwrt-full is removed
          - bootstrap_openwrt__test_values.sections == '1'
          - bootstrap_openwrt__test_values.running == 'yes'
          - bootstrap_openwrt__test_values.sftp == ('yes' if bootstrap_openwrt__test_expect.sftp else 'no')
          - bootstrap_openwrt__test_values.sftp_server == ('yes' if bootstrap_openwrt__test_expect.sftp else 'no')
          - not bootstrap_openwrt__test_expect.root_key or bootstrap_openwrt__test_values.root_attrs == '0:0:-rw-------'
          - bootstrap_openwrt__test_values.root_key == ('yes' if bootstrap_openwrt__test_expect.root_key else 'no')
          - not bootstrap_openwrt__test_expect.user_key or bootstrap_openwrt__test_values.user_dir == bootstrap_openwrt__test_user_attrs ~ ':drwx------'
          - not bootstrap_openwrt__test_expect.user_key or bootstrap_openwrt__test_values.user_attrs == bootstrap_openwrt__test_user_attrs ~ ':-rw-------'
          - not bootstrap_openwrt__test_expect.user_key or bootstrap_openwrt__test_values.user_keys == '1'
          - bootstrap_openwrt__test_values.user_key == ('yes' if bootstrap_openwrt__test_expect.user_key else 'no')
        fail_msg: "{{ bootstrap_openwrt__test_ssh.stdout_lines | map('trim') | join(', ') }}"
      vars:
        bootstrap_openwrt__test_user_attrs: "{{ bootstrap_openwrt__test_user.uid }}:{{ bootstrap_openwrt__test_user.uid }}"
        bootstrap_openwrt__test_values: >-
          {{ dict(bootstrap_openwrt__test_ssh.stdout_lines | map('trim') | select('search', '=')
                  | map('split', '=', 1) | list) }}
