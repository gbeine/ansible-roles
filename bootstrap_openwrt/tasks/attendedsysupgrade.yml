---

- name: Validate openwrt_attendedsysupgrade is not empty
  ansible.builtin.assert:
    that:
      - bootstrap_openwrt__attendedsysupgrade | length > 0
    fail_msg: "openwrt_attendedsysupgrade ist leer. Das würde die komplette Konfiguration löschen."
    quiet: true

- name: Validate openwrt_attendedsysupgrade entries
  ansible.builtin.assert:
    that:
      - item.type is defined
      - item.find is defined
      - item.options is defined
    fail_msg: "Eintrag braucht type, find und options: {{ item.name | default(item.type | default('?')) }}"
    quiet: true
  loop: "{{ bootstrap_openwrt__attendedsysupgrade }}"
  loop_control:
    label: "{{ item.name | default(item.type | default('?')) }}"

- name: Create backup directory on the controller
  ansible.builtin.file:
    path: "{{ playbook_dir }}/backups/{{ inventory_hostname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  check_mode: false

- name: Read current attendedsysupgrade configuration
  community.openwrt.slurp:
    src: /etc/config/attendedsysupgrade
  register: bootstrap_openwrt__attendedsysupgrade_current
  check_mode: false

- name: Store backup on the controller
  ansible.builtin.copy:
    content: "{{ bootstrap_openwrt__attendedsysupgrade_current.content | b64decode }}"
    dest: "{{ playbook_dir }}/backups/{{ inventory_hostname }}/attendedsysupgrade"
    mode: '0600'
  delegate_to: localhost
  check_mode: false

- name: Set declared sections
  community.openwrt.uci:
    command: section
    config: attendedsysupgrade
    type: "{{ item.type }}"
    name: "{{ item.name | default(omit) }}"
    find: "{{ item.find }}"
    value: "{{ item.options }}"
    replace: true
  loop: "{{ bootstrap_openwrt__attendedsysupgrade }}"
  loop_control:
    label: "{{ item.name | default(item.type) }}"

- name: Look up IDs of unnamed sections
  community.openwrt.uci:
    command: find
    config: attendedsysupgrade
    type: "{{ item.type }}"
    find: "{{ item.find }}"
  loop: "{{ bootstrap_openwrt__attendedsysupgrade | rejectattr('name', 'defined') | list }}"
  loop_control:
    label: "{{ item.type }}"
  register: bootstrap_openwrt__attendedsysupgrade_found
  check_mode: false
  failed_when:
    - bootstrap_openwrt__attendedsysupgrade_found.failed | default(false)
    - not ansible_check_mode

- name: Read existing sections
  community.openwrt.uci:
    command: show
    config: attendedsysupgrade
  register: bootstrap_openwrt__attendedsysupgrade_show
  check_mode: false

- name: Determine sections to delete
  ansible.builtin.set_fact:
    bootstrap_openwrt__attendedsysupgrade_delete: >-
      {{ bootstrap_openwrt__attendedsysupgrade_show.result
         | regex_findall('(?m)^attendedsysupgrade\.([^.=\n]+)=([\w-]+)$')
         | reverse
         | map(attribute='0')
         | reject('in',
             (bootstrap_openwrt__attendedsysupgrade | selectattr('name', 'defined') | map(attribute='name') | list)
             + (bootstrap_openwrt__attendedsysupgrade_found.results | map(attribute='result') | list))
         | list }}

- name: Show sections to delete
  ansible.builtin.debug:
    var: bootstrap_openwrt__attendedsysupgrade_delete

- name: Delete undeclared sections
  community.openwrt.uci:
    command: delete
    key: "attendedsysupgrade.{{ item }}"
  loop: "{{ bootstrap_openwrt__attendedsysupgrade_delete }}"
  when: bootstrap_openwrt__attendedsysupgrade_prune | bool

- name: Read pending changes
  community.openwrt.uci:
    command: changes
    config: attendedsysupgrade
  register: bootstrap_openwrt__attendedsysupgrade_pending
  check_mode: false

- name: Commit changes
  community.openwrt.uci:
    command: commit
    config: attendedsysupgrade
  when: bootstrap_openwrt__attendedsysupgrade_pending.changes | default({}) | length > 0
