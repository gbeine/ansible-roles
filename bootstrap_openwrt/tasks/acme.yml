---

- name: Validate openwrt_acme is not empty
  ansible.builtin.assert:
    that:
      - bootstrap_openwrt__acme | length > 0
    fail_msg: "bootstrap_openwrt__acme_enable ist gesetzt, aber openwrt_acme ist leer. Das würde die komplette ACME-Konfiguration löschen."
    quiet: true

- name: Validate openwrt_acme entries
  ansible.builtin.assert:
    that:
      - item.type is defined
      - item.find is defined
      - item.options is defined
    fail_msg: "Eintrag braucht type, find und options: {{ item.name | default(item.type | default('?')) }}"
    quiet: true
  loop: "{{ bootstrap_openwrt__acme }}"
  loop_control:
    label: "{{ item.name | default(item.type | default('?')) }}"

- name: Install ACME packages
  community.openwrt.apk:
    name: "{{ bootstrap_openwrt__acme_packages | join(',') }}"
    state: present

- name: Create backup directory on the controller
  ansible.builtin.file:
    path: "{{ playbook_dir }}/backups/{{ inventory_hostname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  check_mode: false

- name: Read current ACME configuration
  community.openwrt.slurp:
    src: /etc/config/acme
  register: bootstrap_openwrt__acme_current
  no_log: true
  check_mode: false

- name: Store backup on the controller (secrets redacted)
  ansible.builtin.copy:
    content: >-
      {{ bootstrap_openwrt__acme_current.content | b64decode
         | regex_replace('(?mi)^(\s*(?:option|list)\s+(?!key_type\b)\S*(?:key|pass|secret|psk|token|credentials)\S*\s+).*$', "\g<1>'REDACTED'") }}
    dest: "{{ playbook_dir }}/backups/{{ inventory_hostname }}/acme"
    mode: '0600'
  delegate_to: localhost
  no_log: true
  check_mode: false

- name: Set declared sections
  community.openwrt.uci:
    command: section
    config: acme
    type: "{{ item.type }}"
    name: "{{ item.name | default(omit) }}"
    find: "{{ item.find }}"
    value: "{{ item.options }}"
    replace: true
    redact_keys: [credentials]
  loop: "{{ bootstrap_openwrt__acme }}"
  loop_control:
    label: "{{ item.name | default(item.type) }}"

- name: Look up IDs of unnamed sections
  community.openwrt.uci:
    command: find
    config: acme
    type: "{{ item.type }}"
    find: "{{ item.find }}"
  loop: "{{ bootstrap_openwrt__acme | rejectattr('name', 'defined') | list }}"
  loop_control:
    label: "{{ item.type }}"
  register: bootstrap_openwrt__acme_found
  check_mode: false
  failed_when:
    - bootstrap_openwrt__acme_found.failed | default(false)
    - not ansible_check_mode

- name: Read existing sections
  community.openwrt.uci:
    command: show
    config: acme
  register: bootstrap_openwrt__acme_show
  no_log: true
  check_mode: false

- name: Determine sections to delete
  ansible.builtin.set_fact:
    bootstrap_openwrt__acme_delete: >-
      {{ bootstrap_openwrt__acme_show.result
         | regex_findall('(?m)^acme\.([^.=\n]+)=([\w-]+)$')
         | reverse
         | map(attribute='0')
         | reject('in',
             (bootstrap_openwrt__acme | selectattr('name', 'defined') | map(attribute='name') | list)
             + (bootstrap_openwrt__acme_found.results | map(attribute='result') | list))
         | list }}

- name: Show sections to delete
  ansible.builtin.debug:
    var: bootstrap_openwrt__acme_delete

- name: Delete undeclared sections
  community.openwrt.uci:
    command: delete
    key: "acme.{{ item }}"
  loop: "{{ bootstrap_openwrt__acme_delete }}"
  when: bootstrap_openwrt__acme_prune | bool

- name: Read pending changes
  community.openwrt.uci:
    command: changes
    config: acme
  register: bootstrap_openwrt__acme_pending
  check_mode: false

- name: Commit changes
  community.openwrt.uci:
    command: commit
    config: acme
  when: bootstrap_openwrt__acme_pending.changes | default({}) | length > 0

- name: Determine enabled certificates
  ansible.builtin.set_fact:
    bootstrap_openwrt__acme_enabled_certs: >-
      {{ bootstrap_openwrt__acme
         | selectattr('type', 'equalto', 'cert')
         | selectattr('options.enabled', 'in', ['1', 1, true])
         | list }}

- name: Check certificate files
  community.openwrt.stat:
    path: "/etc/ssl/acme/{{ item.options.domains[0] }}.fullchain.crt"
  loop: "{{ bootstrap_openwrt__acme_enabled_certs }}"
  loop_control:
    label: "{{ item.name }}"
  register: bootstrap_openwrt__acme_certs
  check_mode: false

- name: Determine missing certificates
  ansible.builtin.set_fact:
    bootstrap_openwrt__acme_missing: >-
      {{ bootstrap_openwrt__acme_certs.results
         | rejectattr('stat.exists')
         | map(attribute='item.options.domains')
         | map('first')
         | list }}
- name: Show missing certificates
  ansible.builtin.debug:
    var: bootstrap_openwrt__acme_missing

- name: Issue missing certificates
  when:
    - bootstrap_openwrt__acme_missing | length > 0
    - not ansible_check_mode
  block:
    - name: Trigger certificate issuance
      community.openwrt.nohup:
        command: /etc/init.d/acme renew
        delay: 1

    - name: Wait for certificates
      community.openwrt.stat:
        path: "/etc/ssl/acme/{{ item }}.fullchain.crt"
      loop: "{{ bootstrap_openwrt__acme_missing }}"
      register: bootstrap_openwrt__acme_wait
      until: bootstrap_openwrt__acme_wait.stat.exists
      retries: "{{ bootstrap_openwrt__acme_issue_retries }}"
      delay: "{{ bootstrap_openwrt__acme_issue_delay }}"
  rescue:
    - name: Fail on incomplete certificate issuance
      ansible.builtin.fail:
        msg: >-
          Zertifikat für {{ bootstrap_openwrt__acme_missing | join(', ') }} wurde nicht rechtzeitig ausgestellt.
          Die Role startet keinen zweiten Versuch. Ursache auf dem AP prüfen:
          logread | grep -i acme
