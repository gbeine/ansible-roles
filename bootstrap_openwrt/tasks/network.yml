---
- name: Read current network configuration
  community.openwrt.slurp:
    src: /etc/config/network
  register: bootstrap_openwrt__network_current
  check_mode: false

- name: Create backup directory on the controller
  ansible.builtin.file:
    path: "{{ playbook_dir }}/backups/{{ inventory_hostname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  check_mode: false

- name: Set declared sections
  community.openwrt.uci:
    command: section
    config: network
    type: "{{ item.type }}"
    name: "{{ item.name | default(omit) }}"
    find: "{{ item.find }}"
    value: "{{ item.options }}"
    replace: true
  loop: "{{ bootstrap_openwrt__network }}"
  loop_control:
    label: "{{ item.name | default(item.find) }}"

- name: Look up IDs of unnamed sections
  community.openwrt.uci:
    command: find
    config: network
    type: "{{ item.type }}"
    find: "{{ item.find }}"
  loop: "{{ bootstrap_openwrt__network | rejectattr('name', 'defined') | list }}"
  loop_control:
    label: "{{ item.find }}"
  register: bootstrap_openwrt__found
  check_mode: false
  failed_when:
    - bootstrap_openwrt__found.failed | default(false)
    - not ansible_check_mode

- name: Read existing sections
  community.openwrt.uci:
    command: show
    config: network
  register: bootstrap_openwrt__show
  check_mode: false

- name: Determine sections to delete
  ansible.builtin.set_fact:
    bootstrap_openwrt__delete: >-
      {{ bootstrap_openwrt__show.result
         | regex_findall('(?m)^network\.([^.=\n]+)=([\w-]+)$')
         | reverse
         | rejectattr('1', 'equalto', 'globals')
         | map(attribute='0')
         | reject('in',
             (bootstrap_openwrt__network | selectattr('name', 'defined') | map(attribute='name') | list)
             + (bootstrap_openwrt__found.results | map(attribute='result') | list))
         | list }}

- name: Show sections to delete
  ansible.builtin.debug:
    var: bootstrap_openwrt__delete

- name: Delete undeclared sections
  community.openwrt.uci:
    command: delete
    key: "network.{{ item }}"
  loop: "{{ bootstrap_openwrt__delete }}"
  when: bootstrap_openwrt__network_prune | bool

- name: Read pending changes
  community.openwrt.uci:
    command: changes
    config: network
  register: bootstrap_openwrt__pending
  check_mode: false

- name: Commit changes
  community.openwrt.uci:
    command: commit
    config: network
  when: bootstrap_openwrt__pending.changes | default({}) | length > 0
  notify: Reload network
