---

- name: Validate openwrt_snmpd is not empty
  ansible.builtin.assert:
    that:
      - bootstrap_openwrt__snmpd | length > 0
    fail_msg: "bootstrap_openwrt__snmpd_enable ist gesetzt, aber openwrt_snmpd ist leer. Das würde die komplette snmpd-Konfiguration löschen."
    quiet: true

- name: Validate openwrt_snmpd entries
  ansible.builtin.assert:
    that:
      - item.type is defined
      - item.find is defined
      - item.options is defined
    fail_msg: "Eintrag braucht type, find und options: {{ item.name | default(item.type | default('?')) }}"
    quiet: true
  loop: "{{ bootstrap_openwrt__snmpd }}"
  loop_control:
    label: "{{ item.name | default(item.type | default('?')) }}"

- name: Install snmpd packages
  community.openwrt.apk:
    name: "{{ bootstrap_openwrt__snmpd_packages | join(',') }}"
    state: present
  notify: Restart snmpd

- name: Create backup directory on the controller
  ansible.builtin.file:
    path: "{{ playbook_dir }}/backups/{{ inventory_hostname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  check_mode: false

- name: Read current snmpd configuration
  community.openwrt.slurp:
    src: /etc/config/snmpd
  register: bootstrap_openwrt__snmpd_current
  no_log: true
  check_mode: false

- name: Store backup on the controller (secrets redacted)
  ansible.builtin.copy:
    content: >-
      {{ bootstrap_openwrt__snmpd_current.content | b64decode
         | regex_replace('(?mi)^(\s*(?:option|list)\s+\S*(?:community|secret|pass|key|priv|auth|trapsess)\S*\s+).*$', "\g<1>'REDACTED'") }}
    dest: "{{ playbook_dir }}/backups/{{ inventory_hostname }}/snmpd"
    mode: '0600'
  delegate_to: localhost
  no_log: true
  check_mode: false

- name: Set declared sections
  community.openwrt.uci:
    command: section
    config: snmpd
    type: "{{ item.type }}"
    name: "{{ item.name | default(omit) }}"
    find: "{{ item.find }}"
    value: "{{ item.options }}"
    replace: true
    redact_keys: "{{ bootstrap_openwrt__snmpd_redact_keys }}"
  loop: "{{ bootstrap_openwrt__snmpd }}"
  loop_control:
    label: "{{ item.name | default(item.type) }}"

- name: Look up IDs of unnamed sections
  community.openwrt.uci:
    command: find
    config: snmpd
    type: "{{ item.type }}"
    find: "{{ item.find }}"
  loop: "{{ bootstrap_openwrt__snmpd | rejectattr('name', 'defined') | list }}"
  loop_control:
    label: "{{ item.type }}"
  register: bootstrap_openwrt__snmpd_found
  check_mode: false
  failed_when:
    - bootstrap_openwrt__snmpd_found.failed | default(false)
    - not ansible_check_mode

- name: Read existing sections
  community.openwrt.uci:
    command: show
    config: snmpd
  register: bootstrap_openwrt__snmpd_show
  no_log: true
  check_mode: false

- name: Determine sections to delete
  ansible.builtin.set_fact:
    bootstrap_openwrt__snmpd_delete: >-
      {{ bootstrap_openwrt__snmpd_show.result
         | regex_findall('(?m)^snmpd\.([^.=\n]+)=([\w-]+)$')
         | reverse
         | map(attribute='0')
         | reject('in',
             (bootstrap_openwrt__snmpd | selectattr('name', 'defined') | map(attribute='name') | list)
             + (bootstrap_openwrt__snmpd_found.results | map(attribute='result') | list))
         | list }}

- name: Show sections to delete
  ansible.builtin.debug:
    var: bootstrap_openwrt__snmpd_delete

- name: Delete undeclared sections
  community.openwrt.uci:
    command: delete
    key: "snmpd.{{ item }}"
  loop: "{{ bootstrap_openwrt__snmpd_delete }}"
  when: bootstrap_openwrt__snmpd_prune | bool

- name: Read pending changes
  community.openwrt.uci:
    command: changes
    config: snmpd
  register: bootstrap_openwrt__snmpd_pending
  check_mode: false

- name: Commit changes
  community.openwrt.uci:
    command: commit
    config: snmpd
  when: bootstrap_openwrt__snmpd_pending.changes | default({}) | length > 0
  notify: Restart snmpd
