---

- name: Enable services at boot
  community.openwrt.service:
    name: "{{ item }}"
    enabled: false
    state: started
  loop: "{{ bootstrap_openwrt__services_enabled }}"

- name: Disable services at boot
  community.openwrt.service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ bootstrap_openwrt__services_disabled }}"
