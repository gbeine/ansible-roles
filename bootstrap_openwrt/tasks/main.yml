---

- name: Bootstrap OpenWRT
  tags: [ bootstrap, bootstrap_openwrt ]
  block:

    # Before any change, protected sections are managed elsewhere
    - name: Validate openwrt_network_protect
      ansible.builtin.assert:
        that:
          - bootstrap_openwrt__network_protect_valid | bool
          - bootstrap_openwrt__network_protect_conflicts | length == 0
        # Only the failing checks are reported
        fail_msg: >-
          {{ [ ('openwrt_network_protect has to be a list of names or patterns: ' ~ bootstrap_openwrt__network_protect)
                 if not bootstrap_openwrt__network_protect_valid | bool else '',
               ('openwrt_network declares protected sections: ' ~ bootstrap_openwrt__network_protect_conflicts | join(', '))
                 if bootstrap_openwrt__network_protect_conflicts | length > 0 else '' ]
             | select | join('. ') }}
        quiet: true
      vars:
        # Name, type and the option name (devices) of the declared sections
        bootstrap_openwrt__network_protect_conflicts: >-
          {%- set ns = namespace(conflicts=[]) -%}
          {%- for item in bootstrap_openwrt__network -%}
          {%-   set values = [ item.name | default(''), item.type | default(''),
                               (item.find | default({})).name | default(''),
                               (item.options | default({})).name | default('') ] -%}
          {%-   if values | select('string') | reject('equalto', '') | select('match', bootstrap_openwrt__network_protect_regex) | list | length > 0 -%}
          {%-     set ns.conflicts = ns.conflicts + [ item.name | default(item.type ~ ' ' ~ (item.find | default({}) | to_json)) ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.conflicts }}

    # Before any change, the options of dns_dnsmasq in the sections dhcp are not managed by this role
    - name: Validate openwrt_odhcpd
      ansible.builtin.assert:
        that:
          - bootstrap_openwrt__odhcpd_valid | bool
          - bootstrap_openwrt__odhcpd_invalid | length == 0
        # Only the failing checks are reported
        fail_msg: >-
          {{ [ ('openwrt_odhcpd has to be a list of dictionaries: ' ~ bootstrap_openwrt__odhcpd)
                 if not bootstrap_openwrt__odhcpd_valid | bool else '',
               ('openwrt_odhcpd has invalid entries: ' ~ bootstrap_openwrt__odhcpd_invalid | join(', '))
                 if bootstrap_openwrt__odhcpd_invalid | length > 0 else '' ]
             | select | join('. ') }}
        quiet: true
      vars:
        bootstrap_openwrt__odhcpd_valid: >-
          {{ bootstrap_openwrt__odhcpd is sequence and bootstrap_openwrt__odhcpd is not string
             and bootstrap_openwrt__odhcpd is not mapping
             and bootstrap_openwrt__odhcpd | reject('mapping') | list | length == 0 }}
        # Option names of UCI, values are booleans, strings, numbers or lists of strings and numbers without line breaks
        bootstrap_openwrt__odhcpd_invalid: >-
          {%- set ns = namespace(invalid=[]) -%}
          {%- set entries = bootstrap_openwrt__odhcpd if bootstrap_openwrt__odhcpd_valid | bool else [] -%}
          {%- set names = entries | selectattr('name', 'defined') | map(attribute='name') | map('string') | list -%}
          {%- for entry in entries -%}
          {%-   set reasons = [] -%}
          {%-   set name = entry.name | default('') | string -%}
          {%-   for key in entry.keys() | reject('in', ['type', 'name', 'options']) -%}
          {%-     set _ = reasons.append('unknown attribute ' ~ key) -%}
          {%-   endfor -%}
          {%-   if entry.type | default('') not in ['odhcpd', 'dhcp'] -%}
          {%-     set _ = reasons.append('unknown type ' ~ entry.type | default('')) -%}
          {%-   endif -%}
          {%-   if entry.name is not defined or name is not match('^[A-Za-z0-9_]+$') -%}
          {%-     set _ = reasons.append('needs a name of letters, digits and underscores') -%}
          {%-   elif names | select('equalto', name) | list | length > 1 -%}
          {%-     set _ = reasons.append('name used more than once') -%}
          {%-   elif (entry.type | default('') == 'odhcpd') != (name == 'odhcpd') -%}
          {%-     set _ = reasons.append('the section odhcpd needs type odhcpd and name odhcpd') -%}
          {%-   endif -%}
          {%-   set options = entry.options | default({}) -%}
          {%-   if options is not mapping -%}
          {%-     set _ = reasons.append('options has to be a dictionary') -%}
          {%-     set options = {} -%}
          {%-   endif -%}
          {%-   for key, value in options.items() -%}
          {%-     set values = value if value is sequence and value is not string and value is not mapping else [ value ] -%}
          {%-     if key is not string or key is not match('^[a-z0-9_]+$') or value is mapping
                     or (value is not boolean and values | reject('string') | reject('number') | list | length > 0)
                     or (value is not boolean and values | select('boolean') | list | length > 0)
                     or values | select('string') | select('search', '\n') | list | length > 0 -%}
          {%-       set _ = reasons.append('invalid option ' ~ key) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%-   set conflicts = options.keys() | select('in', bootstrap_openwrt__odhcpd_dnsmasq_options) | list
                                if entry.type | default('') == 'dhcp' else [] -%}
          {%-   if conflicts | length > 0 -%}
          {%-     set _ = reasons.append('options of dns_dnsmasq: ' ~ conflicts | join(', ')) -%}
          {%-   endif -%}
          {%-   if reasons | length > 0 -%}
          {%-     set ns.invalid = ns.invalid + [ (name if name != '' else '#' ~ loop.index) ~ ' (' ~ reasons | join(', ') ~ ')' ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.invalid }}

    # Before any change, openwrt_sshd not being a dictionary already fails in combine,
    # openwrt_ssh is the SSH command of the role defaults of community.openwrt.init
    - name: Validate openwrt_sshd
      ansible.builtin.assert:
        that:
          - bootstrap_openwrt__sshd_invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ bootstrap_openwrt__sshd_invalid | join('. ') }}"
        quiet: true
      vars:
        bootstrap_openwrt__sshd_invalid: >-
          {%- set errors = [] -%}
          {%- set ssh = bootstrap_openwrt__sshd -%}
          {%- set unknown = ssh.keys() | reject('in', ['dropbear', 'sftp', 'authorized_keys']) | list -%}
          {%- if unknown | length > 0 -%}
          {%-   set _ = errors.append('openwrt_sshd has unknown keys: ' ~ unknown | join(', ')) -%}
          {%- endif -%}
          {%- if ssh.dropbear is not mapping -%}
          {%-   set _ = errors.append('openwrt_sshd.dropbear has to be a dictionary') -%}
          {%- else -%}
          {%-   set unknown = ssh.dropbear.keys() | reject('in', bootstrap_openwrt__sshd_dropbear_options.keys() | list) | list -%}
          {%-   if unknown | length > 0 -%}
          {%-     set _ = errors.append('openwrt_sshd.dropbear has unknown options: ' ~ unknown | join(', ')) -%}
          {%-   endif -%}
          {%-   set invalid = [] -%}
          {%-   for key, value in ssh.dropbear.items() if value is not none and key not in unknown -%}
          {%-     set values = value if value is sequence and value is not string and value is not mapping else [ value ] -%}
          {%-     if value is mapping
                     or (value is not boolean and values | reject('string') | reject('number') | list | length > 0)
                     or (value is not boolean and values | select('boolean') | list | length > 0)
                     or values | select('string') | select('search', '\n') | list | length > 0 -%}
          {%-       set _ = invalid.append(key) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%-   if invalid | length > 0 -%}
          {%-     set _ = errors.append('openwrt_sshd.dropbear has invalid values: ' ~ invalid | join(', ')) -%}
          {%-   endif -%}
          {%- endif -%}
          {%- if ssh.sftp is not mapping or ssh.sftp.keys() | reject('eq', 'enable') | list | length > 0
                 or ssh.sftp.enable is not boolean -%}
          {%-   set _ = errors.append('openwrt_sshd.sftp has to be a dictionary with the boolean enable only') -%}
          {%- endif -%}
          {%- if ssh.authorized_keys is not mapping -%}
          {%-   set _ = errors.append('openwrt_sshd.authorized_keys has to be a dictionary of users and lists of keys') -%}
          {%- else -%}
          {%-   set invalid = [] -%}
          {%-   for user, keys in ssh.authorized_keys.items() -%}
          {%-     if user is not string or user is not match('^[a-z_][a-z0-9_-]*$')
                     or keys is not sequence or keys is string or keys is mapping
                     or keys | reject('string') | list | length > 0
                     or keys | select('string') | map('trim') | select('eq', '') | list | length > 0
                     or keys | select('string') | select('search', '[\n\r]') | list | length > 0 -%}
          {%-       set _ = invalid.append(user) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%-   if invalid | length > 0 -%}
          {%-     set _ = errors.append('openwrt_sshd.authorized_keys needs user names of lowercase letters, digits, _ and -'
                                         ~ ' with lists of keys in one line: ' ~ invalid | join(', ')) -%}
          {%-   endif -%}
          {%- endif -%}
          {{ errors }}

    - name: Initialise OpenWRT
      ansible.builtin.import_role:
        name: community.openwrt.init

    - name: Check reachability
      community.openwrt.ping:

    # Before any change, the users of openwrt_sshd.authorized_keys besides root have to exist
    - name: Read the users of the system
      community.openwrt.slurp:
        src: /etc/passwd
      register: bootstrap_openwrt__sshd_passwd
      check_mode: false

    - name: Validate the users of openwrt_sshd.authorized_keys
      ansible.builtin.assert:
        that:
          - bootstrap_openwrt__sshd_unknown_users | length == 0
        fail_msg: "openwrt_sshd.authorized_keys has users unknown to /etc/passwd: {{ bootstrap_openwrt__sshd_unknown_users | join(', ') }}"
        quiet: true
      vars:
        bootstrap_openwrt__sshd_unknown_users: >-
          {{ bootstrap_openwrt__sshd.authorized_keys.keys() | reject('eq', 'root')
             | reject('in', bootstrap_openwrt__sshd_users.keys() | list) | list }}

    - name: Install packages
      ansible.builtin.include_tasks: packages.yml
      when: bootstrap_openwrt__packages | length > 0

    - name: Configure services
      ansible.builtin.import_tasks: services.yml

    - name: Configure system
      ansible.builtin.import_tasks: system.yml

    - name: Configure network
      ansible.builtin.import_tasks: network.yml

    - name: Configure odhcpd
      ansible.builtin.include_tasks: odhcpd.yml

    - name: Configure wireless networks
      ansible.builtin.include_tasks: wireless.yml
      when: bootstrap_openwrt__wireless | length > 0

    - name: Configure attendedsysupgrade
      ansible.builtin.include_tasks: attendedsysupgrade.yml

    - name: Configure ACME
      ansible.builtin.include_tasks: acme.yml
      when: bootstrap_openwrt__acme_enable | bool

    - name: Configure uhttpd
      ansible.builtin.include_tasks: uhttpd.yml
      when: bootstrap_openwrt__uhttpd_enable | bool

    - name: Configure SSH
      ansible.builtin.include_tasks: ssh.yml
