---

- name: Validate openwrt_system entries
  ansible.builtin.assert:
    that:
      - item.type is defined
      - item.find is defined
      - item.options is defined
    fail_msg: "Eintrag braucht type, find und options: {{ item.name | default(item.type | default('?')) }}"
    quiet: true
  loop: "{{ bootstrap_openwrt__system }}"
  loop_control:
    label: "{{ item.name | default(item.find | default(item.type | default('?'))) }}"

- name: Create backup directory on the controller
  ansible.builtin.file:
    path: "{{ playbook_dir }}/backups/{{ inventory_hostname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  check_mode: false

- name: Read current system configuration
  community.openwrt.slurp:
    src: /etc/config/system
  register: bootstrap_openwrt__system_current
  check_mode: false

- name: Store backup on the controller
  ansible.builtin.copy:
    content: "{{ bootstrap_openwrt__system_current.content | b64decode }}"
    dest: "{{ playbook_dir }}/backups/{{ inventory_hostname }}/system"
    mode: '0600'
  delegate_to: localhost
  check_mode: false

- name: Set declared sections
  community.openwrt.uci:
    command: section
    config: system
    type: "{{ item.type }}"
    name: "{{ item.name | default(omit) }}"
    find: "{{ item.find }}"
    value: "{{ item.options }}"
    replace: true
  loop: "{{ bootstrap_openwrt__system }}"
  loop_control:
    label: "{{ item.name | default(item.find) }}"

- name: Look up IDs of unnamed sections
  community.openwrt.uci:
    command: find
    config: system
    type: "{{ item.type }}"
    find: "{{ item.find }}"
  loop: "{{ bootstrap_openwrt__system | rejectattr('name', 'defined') | list }}"
  loop_control:
    label: "{{ item.find }}"
  register: bootstrap_openwrt__system_found
  check_mode: false
  failed_when:
    - bootstrap_openwrt__system_found.failed | default(false)
    - not ansible_check_mode

- name: Read existing sections
  community.openwrt.uci:
    command: show
    config: system
  register: bootstrap_openwrt__system_show
  check_mode: false

- name: Determine sections to delete
  ansible.builtin.set_fact:
    bootstrap_openwrt__system_delete: >-
      {{ bootstrap_openwrt__system_show.result
         | regex_findall('(?m)^system\.([^.=\n]+)=([\w-]+)$')
         | reverse
         | map(attribute='0')
         | reject('in',
             (bootstrap_openwrt__system | selectattr('name', 'defined') | map(attribute='name') | list)
             + (bootstrap_openwrt__system_found.results | map(attribute='result') | list))
         | list }}

- name: Show sections to delete
  ansible.builtin.debug:
    var: bootstrap_openwrt__system_delete

- name: Delete undeclared sections
  community.openwrt.uci:
    command: delete
    key: "system.{{ item }}"
  loop: "{{ bootstrap_openwrt__system_delete }}"
  when: bootstrap_openwrt__system_prune | bool

- name: Read pending changes
  community.openwrt.uci:
    command: changes
    config: system
  register: bootstrap_openwrt__system_pending
  check_mode: false

- name: Commit changes
  community.openwrt.uci:
    command: commit
    config: system
  when: bootstrap_openwrt__system_pending.changes | default({}) | length > 0
