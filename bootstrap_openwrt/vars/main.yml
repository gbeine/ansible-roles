  'America/New_York': { posix: 'EST5EDT,M3.2.0,M11.1.0' }
  'Asia/Tokyo': { posix: 'JST-9' }
  'Australia/Sydney': { posix: 'AEST-10AEDT,M10.1.0,M4.1.0/3' }
