---

# POSIX time zone strings for the IANA time zones, OpenWrt uses them without the zoneinfo packages.
# zonename is only set where OpenWrt uses another name than the IANA time zone database.
# Other time zones need openwrt_timezone_posix.
bootstrap_openwrt__timezones:
  'Etc/UTC': { zonename: 'UTC', posix: 'GMT0' }
  'Europe/Amsterdam': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Athens': { posix: 'EET-2EEST,M3.5.0/3,M10.5.0/4' }
  'Europe/Berlin': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Brussels': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Budapest': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Copenhagen': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Dublin': { posix: 'GMT0IST,M3.5.0/1,M10.5.0' }
  'Europe/Helsinki': { posix: 'EET-2EEST,M3.5.0/3,M10.5.0/4' }
  'Europe/Lisbon': { posix: 'WET0WEST,M3.5.0/1,M10.5.0' }
  'Europe/London': { posix: 'GMT0BST,M3.5.0/1,M10.5.0' }
  'Europe/Madrid': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Oslo': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Paris': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Prague': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Rome': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Stockholm': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Vienna': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Warsaw': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'Europe/Zurich': { posix: 'CET-1CEST,M3.5.0,M10.5.0/3' }
  'America/Chicago': { posix: 'CST6CDT,M3.2.0,M11.1.0' }
  'America/Denver': { posix: 'MST7MDT,M3.2.0,M11.1.0' }
