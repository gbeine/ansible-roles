---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/common-globals
#
# Settings of the site, used by several roles.
# Roles read the resolved values common_globals__*, the inventory sets site_*.
#

#
# PKI
#

common_globals__pki_dir: "{{ site_pki_dir | default('/etc/pki') }}"
common_globals__pki_realms_dir: "{{ site_pki_realms_dir | default(common_globals__pki_dir + '/realms') }}"
common_globals__pki_realms: "{{ site_pki_realms | default([]) }}"
common_globals__pki_ca_certificates: "{{ site_pki_ca_certificates | default([]) }}"
common_globals__pki_ca_certificates_dir: "{{ site_pki_ca_certificates_dir | default('/usr/local/share/ca-certificates') }}"
common_globals__pki_secrets_dir: "{{ site_pki_secrets_dir | default(inventory_dir + '/secrets') }}"

#
# Mail
#

common_globals__mail_domain: "{{ site_mail_domain | default('localdomain') }}"
common_globals__mail_root_forward: "{{ site_mail_root_forward | default('') }}"
common_globals__mail_from: "{{ site_mail_from | default('') }}"
common_globals__mail_smtp_host: "{{ site_mail_smtp_host | default('localhost') }}"
common_globals__mail_smtp_port: "{{ site_mail_smtp_port | default(25) }}"
common_globals__mail_smtp_user: "{{ site_mail_smtp_user | default('') }}"
common_globals__mail_smtp_password: "{{ site_mail_smtp_password | default('') }}"

#
# Defaults - do not change
#

common_globals__pki_public_owner: 'root'
common_globals__pki_public_group: 'root'
common_globals__pki_public_dir_mode: '0755'
common_globals__pki_public_file_mode: '0644'
common_globals__pki_private_owner: 'root'
common_globals__pki_private_group: 'ssl-cert'
common_globals__pki_private_dir_mode: '0750'
common_globals__pki_private_file_mode: '0640'

common_globals__pki_realm_structure:
  - name: 'config'
    owner: "{{ common_globals__pki_public_owner }}"
    group: "{{ common_globals__pki_public_group }}"
    mode: "{{ common_globals__pki_public_dir_mode }}"
  - name: 'private'
    owner: "{{ common_globals__pki_private_owner }}"
    group: "{{ common_globals__pki_private_group }}"
    mode: "{{ common_globals__pki_private_dir_mode }}"
  - name: 'public'
    owner: "{{ common_globals__pki_public_owner }}"
    group: "{{ common_globals__pki_public_group }}"
    mode: "{{ common_globals__pki_public_dir_mode }}"
