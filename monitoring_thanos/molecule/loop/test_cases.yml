---
# Network created by container_podman in prepare.yml
monitoring_thanos__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24

monitoring_thanos__test_image: 'docker.io/thanosio/thanos:v0.42.5'
monitoring_thanos__test_prometheus_image: 'docker.io/prom/prometheus:latest'
monitoring_thanos__test_bucket_dir: '/opt/thanos-bucket'

# Two Prometheus started in prepare.yml with monitoring_prometheus, one for every sidecar,
# external labels and equal block durations are required by the sidecar
monitoring_thanos__test_prometheus:

  - prometheus_home: '/opt/prometheus-a'
    prometheus_ip: '10.89.0.60'
    prometheus_network: 'podman-molecule'
    prometheus_hostname: 'prometheus-a'
    prometheus_timezone: 'Europe/Berlin'
    prometheus_config:
      global:
        scrape_interval: '5s'
        external_labels:
          cluster: 'molecule'
          replica: 'a'
    prometheus_container:
      name: 'prometheus-a'
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.min-block-duration=2h'
        - '--storage.tsdb.max-block-duration=2h'

  - prometheus_home: '/opt/prometheus-b'
    prometheus_ip: '10.89.0.62'
    prometheus_network: 'podman-molecule'
    prometheus_hostname: 'prometheus-b'
    prometheus_timezone: 'Europe/Berlin'
    prometheus_config:
      global:
        scrape_interval: '5s'
        external_labels:
          cluster: 'molecule'
          replica: 'b'
    prometheus_container:
      name: 'prometheus-b'
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.min-block-duration=2h'
        - '--storage.tsdb.max-block-duration=2h'

# Instances deployed with tasks/loop.yml
thanos_instances:

  # Sidecar without object storage
  - component: 'sidecar'
    version: 'v0.42.5'
    ip: '10.89.0.61'
    network: 'podman-molecule'
    hostname: 'thanos-sidecar-a'
    timezone: 'Europe/Berlin'
    prometheus_url: 'http://10.89.0.60:9090'
    prometheus_data: '/opt/prometheus-a/data'
    container:
      name: 'thanos-sidecar-a'

  # Sidecar uploading to a bucket in the file system, the volume of the bucket is added with container
  - component: 'sidecar'
    version: 'v0.42.5'
    ip: '10.89.0.63'
    network: 'podman-molecule'
    hostname: 'thanos-sidecar-b'
    timezone: 'Europe/Berlin'
    prometheus_url: 'http://10.89.0.62:9090'
    prometheus_data: '/opt/prometheus-b/data'
    objstore:
      type: 'FILESYSTEM'
      config:
        directory: '/bucket'
    container:
      name: 'thanos-sidecar-b'
      volumes:
        - '/etc/localtime:/etc/localtime:ro'
        - '/etc/timezone:/etc/timezone:ro'
        - '/opt/prometheus-b/data:/prometheus'
        - '/opt/thanos-bucket:/bucket'

monitoring_thanos__test_expect:

  - name: 'thanos-sidecar-a'
    ip: '10.89.0.61'
    prometheus_url: 'http://10.89.0.60:9090'
    prometheus_data: '/opt/prometheus-a/data'
    secrets: []

  - name: 'thanos-sidecar-b'
    ip: '10.89.0.63'
    prometheus_url: 'http://10.89.0.62:9090'
    prometheus_data: '/opt/prometheus-b/data'
    secrets:
      - 'thanos-sidecar-b-objstore,type=mount,target=/etc/thanos/bucket.yml'
