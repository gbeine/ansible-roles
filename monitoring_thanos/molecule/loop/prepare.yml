---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks:
      - "{{ monitoring_thanos__test_network }}"
    podman_default_network: "{{ monitoring_thanos__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Ensure /etc/timezone exists'
      ansible.builtin.copy:
        dest: '/etc/timezone'
        content: |
          Etc/UTC
        force: false
        mode: '0644'

    - name: 'Pull the images, so the first start of the services does not time out'
      containers.podman.podman_image:
        name: "{{ item }}"
      loop:
        - "{{ monitoring_thanos__test_prometheus_image }}"
        - "{{ monitoring_thanos__test_image }}"

    # The bucket of the object storage FILESYSTEM, written by the sidecar as nobody
    - name: 'Create the directory of the bucket'
      ansible.builtin.file:
        path: "{{ monitoring_thanos__test_bucket_dir }}"
        owner: '65534'
        group: '65534'
        mode: '0755'
        state: 'directory'

    - name: 'Run monitoring_prometheus for every sidecar'
      ansible.builtin.include_role:
        name: 'monitoring_prometheus'
      loop: "{{ monitoring_thanos__test_prometheus }}"
      loop_control:
        loop_var: 'monitoring_thanos__test_prometheus_vars'
        label: "{{ monitoring_thanos__test_prometheus_vars.prometheus_container.name }}"
      vars:
        prometheus_home: "{{ monitoring_thanos__test_prometheus_vars.prometheus_home }}"
        prometheus_ip: "{{ monitoring_thanos__test_prometheus_vars.prometheus_ip }}"
        prometheus_network: "{{ monitoring_thanos__test_prometheus_vars.prometheus_network }}"
        prometheus_hostname: "{{ monitoring_thanos__test_prometheus_vars.prometheus_hostname }}"
        prometheus_timezone: "{{ monitoring_thanos__test_prometheus_vars.prometheus_timezone }}"
        prometheus_config: "{{ monitoring_thanos__test_prometheus_vars.prometheus_config }}"
        prometheus_container: "{{ monitoring_thanos__test_prometheus_vars.prometheus_container }}"
