---
# Checks one instance against monitoring_thanos__expect

- name: "Read the quadlet unit of {{ monitoring_thanos__expect.name }}"
  ansible.builtin.slurp:
    src: "/etc/containers/systemd/{{ monitoring_thanos__expect.name }}.container"
  register: 'monitoring_thanos__test_quadlet'

# Every instance only mounts its own secret
- name: "Assert the quadlet unit of {{ monitoring_thanos__expect.name }}"
  ansible.builtin.assert:
    that:
      - ('Image=' + monitoring_thanos__test_image) in monitoring_thanos__test_quadlet_lines
      - ('IP=' + monitoring_thanos__expect.ip) in monitoring_thanos__test_quadlet_lines
      - ('User=65534' in monitoring_thanos__test_quadlet_lines)
      - ('Group=65534' in monitoring_thanos__test_quadlet_lines)
      - ('Volume=' + monitoring_thanos__expect.prometheus_data + ':/prometheus') in monitoring_thanos__test_quadlet_lines
      - monitoring_thanos__test_exec is search('^Exec=sidecar ')
      - monitoring_thanos__test_exec is search('--prometheus.url=' + monitoring_thanos__expect.prometheus_url)
      - (monitoring_thanos__test_exec is search('--objstore.config-file=/etc/thanos/bucket.yml'))
        == (monitoring_thanos__expect.secrets | length > 0)
      - >-
        monitoring_thanos__test_quadlet_lines | select('match', 'Secret=') | map('regex_replace', '^Secret=', '') | list | sort
        == monitoring_thanos__expect.secrets | sort
    fail_msg: "{{ monitoring_thanos__test_quadlet.content | b64decode }}"
  vars:
    monitoring_thanos__test_quadlet_lines: "{{ (monitoring_thanos__test_quadlet.content | b64decode).splitlines() }}"
    monitoring_thanos__test_exec: "{{ monitoring_thanos__test_quadlet_lines | select('match', 'Exec=') | join(' ') }}"

- name: "Check the podman secrets of {{ monitoring_thanos__expect.name }}"
  ansible.builtin.command:
    argv: [ 'podman', 'secret', 'exists', "{{ item.split(',') | first }}" ]
  loop: "{{ monitoring_thanos__expect.secrets }}"
  changed_when: false

- name: "Read the state of the service {{ monitoring_thanos__expect.name }}"
  ansible.builtin.command:
    argv: [ 'systemctl', 'is-active', "{{ monitoring_thanos__expect.name }}" ]
  register: 'monitoring_thanos__test_service'
  changed_when: false
  failed_when: false

- name: "Assert the service is active: {{ monitoring_thanos__expect.name }}"
  ansible.builtin.assert:
    that:
      - monitoring_thanos__test_service.stdout == 'active'
    fail_msg: "service {{ monitoring_thanos__test_service.stdout }}"

# The sidecar is ready after it read the external labels of its Prometheus
- name: "Wait until {{ monitoring_thanos__expect.name }} is ready"
  ansible.builtin.uri:
    url: "http://{{ monitoring_thanos__expect.ip }}:10902/-/ready"
  register: 'monitoring_thanos__test_ready'
  until: monitoring_thanos__test_ready.status == 200
  retries: 15
  delay: 2

- name: "Read the metrics of {{ monitoring_thanos__expect.name }}"
  ansible.builtin.uri:
    url: "http://{{ monitoring_thanos__expect.ip }}:10902/metrics"
    return_content: true
  register: 'monitoring_thanos__test_metrics'

# The shipper only exists if the sidecar uploads to the object storage
- name: "Assert the connection to Prometheus and the uploads of {{ monitoring_thanos__expect.name }}"
  ansible.builtin.assert:
    that:
      - monitoring_thanos__test_metrics.content is search('^thanos_sidecar_prometheus_up 1$', multiline=true)
      - (monitoring_thanos__test_metrics.content is search('^thanos_shipper_uploads_total', multiline=true))
        == (monitoring_thanos__expect.secrets | length > 0)
    fail_msg: >-
      {{ monitoring_thanos__test_metrics.content.splitlines() | select('match', '^thanos_(sidecar|shipper)_') | list }}
