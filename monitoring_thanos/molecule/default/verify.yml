---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_thanos__test_case: "{{ monitoring_thanos__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_thanos__expect: "{{ monitoring_thanos__test_case.expect }}"
    monitoring_thanos__test_url: "http://{{ monitoring_thanos__expect.ip }}:10902"
    monitoring_thanos__test_secret_name: "{{ monitoring_thanos__expect.name }}-objstore"
    monitoring_thanos__test_quadlet_lines: "{{ (monitoring_thanos__test_quadlet.content | b64decode).splitlines() }}"
    monitoring_thanos__test_exec: "{{ monitoring_thanos__test_quadlet_lines | select('match', 'Exec=') | join(' ') }}"

  tasks:

    - name: 'Read the generated quadlet unit'
      ansible.builtin.slurp:
        src: "/etc/containers/systemd/{{ monitoring_thanos__expect.name }}.container"
      register: 'monitoring_thanos__test_quadlet'

    - name: 'Assert the quadlet unit'
      ansible.builtin.assert:
        that:
          - ('Image=' + monitoring_thanos__test_image) in monitoring_thanos__test_quadlet_lines
          - ('IP=' + monitoring_thanos__expect.ip) in monitoring_thanos__test_quadlet_lines
          # podman_container splits user 65534:65534 into User= and Group=
          - ('User=65534' in monitoring_thanos__test_quadlet_lines)
          - ('Group=65534' in monitoring_thanos__test_quadlet_lines)
          - monitoring_thanos__test_exec is search('^Exec=' + monitoring_thanos__expect.component + ' ')
          - (monitoring_thanos__test_exec is search('--objstore.config-file=/etc/thanos/bucket.yml')) == monitoring_thanos__expect.objstore
          - (monitoring_thanos__test_quadlet_lines
             | select('match', 'Secret=' + monitoring_thanos__test_secret_name + ',type=mount,target=/etc/thanos/bucket.yml') | list | length > 0)
            == monitoring_thanos__expect.objstore
          - ((monitoring_thanos__test_case.role_vars.thanos_container | default({})).volumes | default([]))
            | map('regex_replace', '^', 'Volume=') | reject('in', monitoring_thanos__test_quadlet_lines) | list | length == 0
        fail_msg: "{{ monitoring_thanos__test_quadlet.content | b64decode }}"

    - name: 'Assert the quadlet unit of the sidecar'
      when: monitoring_thanos__expect.component == 'sidecar'
      ansible.builtin.assert:
        that:
          - ('Volume=' + monitoring_thanos__test_case.role_vars.thanos_prometheus_data + ':/prometheus') in monitoring_thanos__test_quadlet_lines
          - monitoring_thanos__test_exec is search('--tsdb.path=/prometheus')
          - monitoring_thanos__test_exec is search('--prometheus.url=' + monitoring_thanos__test_case.role_vars.thanos_prometheus_url)
        fail_msg: "{{ monitoring_thanos__test_quadlet.content | b64decode }}"

    - name: 'Assert the quadlet unit of receive'
      when: monitoring_thanos__expect.component == 'receive'
      ansible.builtin.assert:
        that:
          - ('Volume=' + monitoring_thanos__test_case.role_vars.thanos_home + '/data:/var/thanos/receive') in monitoring_thanos__test_quadlet_lines
          - monitoring_thanos__test_exec is search('--tsdb.path=/var/thanos/receive')
          - monitoring_thanos__test_exec is search('receive_replica')
          - monitoring_thanos__test_exec is search(monitoring_thanos__test_case.role_vars.thanos_hostname)
        fail_msg: "{{ monitoring_thanos__test_quadlet.content | b64decode }}"

    - name: 'Read the command of the receive container'
      when: monitoring_thanos__expect.component == 'receive'
      ansible.builtin.command:
        argv: [ 'podman', 'inspect', '--format', '{{ "{{" }} json .Config.Cmd {{ "}}" }}', "{{ monitoring_thanos__expect.name }}" ]
      register: 'monitoring_thanos__test_cmd'
      changed_when: false

    # The label reaches Thanos with its double quotes, otherwise receive refuses to start
    - name: 'Assert the external label of receive'
      when: monitoring_thanos__expect.component == 'receive'
      ansible.builtin.assert:
        that:
          - ('--label=receive_replica="' + monitoring_thanos__test_case.role_vars.thanos_hostname + '"') in (monitoring_thanos__test_cmd.stdout | from_json)
        fail_msg: "{{ monitoring_thanos__test_cmd.stdout }}"

    - name: 'Read the data directory of receive'
      when: monitoring_thanos__expect.component == 'receive'
      ansible.builtin.stat:
        path: "{{ monitoring_thanos__test_case.role_vars.thanos_home }}/data"
      register: 'monitoring_thanos__test_data_dir'

    - name: 'Assert the data directory of receive is owned by nobody'
      when: monitoring_thanos__expect.component == 'receive'
      ansible.builtin.assert:
        that:
          - monitoring_thanos__test_data_dir.stat.isdir | default(false)
          - monitoring_thanos__test_data_dir.stat.uid == 65534
          - monitoring_thanos__test_data_dir.stat.gid == 65534
        fail_msg: "directory {{ monitoring_thanos__test_data_dir.stat.isdir | default(false) }}, uid {{ monitoring_thanos__test_data_dir.stat.uid | default('') }}, gid {{ monitoring_thanos__test_data_dir.stat.gid | default('') }}"

    - name: "Read the state of the service {{ monitoring_thanos__expect.name }}"
      ansible.builtin.command:
        argv: [ 'systemctl', 'is-active', "{{ monitoring_thanos__expect.name }}" ]
      register: 'monitoring_thanos__test_service'
      changed_when: false
      failed_when: false

    - name: 'Read the secret of the object storage'
      ansible.builtin.command:
        argv: [ 'podman', 'secret', 'exists', "{{ monitoring_thanos__test_secret_name }}" ]
      register: 'monitoring_thanos__test_secret'
      changed_when: false
      failed_when: false

    - name: 'Assert the service and the secret'
      ansible.builtin.assert:
        that:
          - monitoring_thanos__test_service.stdout == 'active'
          - (monitoring_thanos__test_secret.rc == 0) == monitoring_thanos__expect.objstore
        fail_msg: "service {{ monitoring_thanos__test_service.stdout }}, secret exists {{ monitoring_thanos__test_secret.rc == 0 }}"

    # The sidecar is ready after it read the external labels of Prometheus
    - name: "Wait until {{ monitoring_thanos__expect.name }} is ready"
      ansible.builtin.uri:
        url: "{{ monitoring_thanos__test_url }}/-/ready"
      register: 'monitoring_thanos__test_ready'
      until: monitoring_thanos__test_ready.status == 200
      retries: 15
      delay: 2

    - name: 'Read the metrics of the sidecar'
      when: monitoring_thanos__expect.component == 'sidecar'
      ansible.builtin.uri:
        url: "{{ monitoring_thanos__test_url }}/metrics"
        return_content: true
      register: 'monitoring_thanos__test_metrics'

    # The shipper only exists if the sidecar uploads to the object storage
    - name: 'Assert the connection to Prometheus and the uploads'
      when: monitoring_thanos__expect.component == 'sidecar'
      ansible.builtin.assert:
        that:
          - monitoring_thanos__test_metrics.content is search('^thanos_sidecar_prometheus_up 1$', multiline=true)
          - (monitoring_thanos__test_metrics.content is search('^thanos_shipper_uploads_total', multiline=true)) == monitoring_thanos__expect.objstore
        fail_msg: >-
          {{ monitoring_thanos__test_metrics.content.splitlines() | select('match', '^thanos_(sidecar|shipper)_') | list }}

    # Prometheus sends its samples with remote write, receive appends them to the TSDB of the default tenant
    - name: 'Wait until receive stored samples of Prometheus'
      when: monitoring_thanos__expect.component == 'receive'
      ansible.builtin.uri:
        url: "{{ monitoring_thanos__test_url }}/metrics"
        return_content: true
      register: 'monitoring_thanos__test_metrics'
      until: >-
        monitoring_thanos__test_metrics.content is
        search('^prometheus_tsdb_head_samples_appended_total\{[^}]*tenant="default-tenant"[^}]*\} [1-9]', multiline=true)
      retries: 30
      delay: 2
