---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_thanos__test_case: "{{ monitoring_thanos__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  pre_tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_thanos__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  tasks:

    - name: 'Run monitoring_thanos'
      block:

        - name: 'Run monitoring_thanos'
          ansible.builtin.include_role:
            name: 'monitoring_thanos'

      # The VMs are removed after a failed converge, the reason is only in the journal of the service
      rescue:

        - name: 'Show the quadlet unit and the journal of the failed service'
          ansible.builtin.include_tasks: 'tasks/diagnose.yml'
          vars:
            monitoring_thanos__test_names: [ "{{ monitoring_thanos__test_case.expect.name }}" ]
            monitoring_thanos__test_failure: "{{ ansible_failed_result.msg | default('') }}"
