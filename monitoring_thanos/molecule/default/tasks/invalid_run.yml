---
# Runs monitoring_thanos with the invalid role variables passed as include parameters,
# the role has to fail before the secret or the quadlet unit changes.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run monitoring_thanos with invalid variables (expect ERROR): {{ monitoring_thanos__test_invalid.message }}"
  block:

    - name: 'Run monitoring_thanos, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'monitoring_thanos'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ monitoring_thanos__test_invalid.message }}"

  rescue:

    - name: 'Read the checksum of the quadlet unit after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ monitoring_thanos__test_files }}"
      register: 'monitoring_thanos__test_md5_after'

    - name: 'Assert the run failed before the quadlet unit changed'
      ansible.builtin.assert:
        that:
          - monitoring_thanos__test_failure is search(monitoring_thanos__test_invalid.search, multiline=true)
          - monitoring_thanos__test_md5_before_sums | select | list | length == monitoring_thanos__test_files | length
          - monitoring_thanos__test_md5_after_sums == monitoring_thanos__test_md5_before_sums
        fail_msg: >-
          Failure: {{ monitoring_thanos__test_failure }}
          Checksums before: {{ monitoring_thanos__test_md5_before_sums | join(', ') }},
          after: {{ monitoring_thanos__test_md5_after_sums | join(', ') }}.
      vars:
        # Double quotes, so \n is a line break for the anchors of the searches
        monitoring_thanos__test_failure: "{{ [ ansible_failed_result.msg | default(''), ansible_failed_result.stderr | default('') ] | join('\n') }}"
        monitoring_thanos__test_md5_before_sums: "{{ monitoring_thanos__test_md5_before.results | map(attribute='stat.checksum', default='') | list }}"
        monitoring_thanos__test_md5_after_sums: "{{ monitoring_thanos__test_md5_after.results | map(attribute='stat.checksum', default='') | list }}"
