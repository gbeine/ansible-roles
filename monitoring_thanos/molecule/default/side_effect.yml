---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_thanos__test_case: "{{ monitoring_thanos__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_thanos__test_files:
      - "/etc/containers/systemd/{{ monitoring_thanos__test_case.expect.name }}.container"

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_thanos__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksum of the quadlet unit before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ monitoring_thanos__test_files }}"
      register: 'monitoring_thanos__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include
    - name: 'Run monitoring_thanos with thanos_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_container: [ 'volumes' ]
        monitoring_thanos__test_invalid:
          message: 'thanos_container is not a dictionary'
          # combine of the defaults fails before the role checks anything
          search: 'failed to combine variables, expected dicts'

    - name: 'Run monitoring_thanos with an unknown component (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_component: 'querier'
        monitoring_thanos__test_invalid:
          message: 'an unknown component'
          search: '^thanos_component has to be one of sidecar, receive, query, store, compact, rule$'

    - name: 'Run monitoring_thanos with store without object storage (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_component: 'store'
        thanos_home: '/opt/thanos-invalid'
        thanos_objstore: {}
        monitoring_thanos__test_invalid:
          message: 'store without object storage'
          search: '^thanos_objstore is required for store$'

    - name: 'Run monitoring_thanos with query endpoints not a list (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_component: 'query'
        thanos_query_endpoints: '10.89.0.51:10901'
        monitoring_thanos__test_invalid:
          message: 'query endpoints not a list'
          search: '^thanos_query_endpoints has to be a list of addresses$'

    - name: 'Run monitoring_thanos with an invalid name of a rule file (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_component: 'rule'
        thanos_home: '/opt/thanos-invalid'
        thanos_query_url: 'http://10.89.0.51:10902'
        thanos_rules:
          'bad name':
            groups: []
        monitoring_thanos__test_invalid:
          message: 'an invalid name of a rule file'
          search: '^thanos_rules has invalid names: bad name$'

    - name: 'Run monitoring_thanos with an object storage without type (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_objstore:
          config:
            directory: '/bucket'
        monitoring_thanos__test_invalid:
          message: 'an object storage without type'
          search: '^thanos_objstore needs type$'

    - name: 'Run monitoring_thanos with the changed role variables'
      when: monitoring_thanos__test_case.side_effect is defined
      block:

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', "{{ monitoring_thanos__test_case.expect.name }}" ]
          register: 'monitoring_thanos__test_started_before'
          changed_when: false

        - name: 'Set the changed role variables'
          ansible.builtin.set_fact:
            "{{ item.key }}": "{{ item.value }}"
          loop: "{{ monitoring_thanos__test_case.side_effect.role_vars | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: 'Run monitoring_thanos with the changed role variables'
          ansible.builtin.include_role:
            name: 'monitoring_thanos'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', "{{ monitoring_thanos__test_case.expect.name }}" ]
          register: 'monitoring_thanos__test_started_after'
          changed_when: false

        - name: 'Assert the changed secret and the restart of the service'
          ansible.builtin.assert:
            that:
              - monitoring_thanos__objstore_result is changed
              - monitoring_thanos__quadlet_result is not changed
              - monitoring_thanos__test_started_after.stdout | int > monitoring_thanos__test_started_before.stdout | int
            fail_msg: >-
              secret changed: {{ monitoring_thanos__objstore_result is changed }},
              quadlet changed: {{ monitoring_thanos__quadlet_result is changed }},
              start before {{ monitoring_thanos__test_started_before.stdout }}, after {{ monitoring_thanos__test_started_after.stdout }}
