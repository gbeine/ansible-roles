---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  tasks:

    # The same way as documented in docs/notes.md, thanos_instances is defined in test_cases.yml
    - name: 'Run monitoring_thanos for all instances'
      block:

        - name: 'Run monitoring_thanos for all instances'
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../../tasks/loop.yml"

      # The VMs are removed after a failed converge, the reason is only in the journal of the services
      rescue:

        - name: 'Show the quadlet units and the journals of the services'
          ansible.builtin.include_tasks: 'tasks/diagnose.yml'
          vars:
            monitoring_thanos__test_names: >-
              {{ thanos_instances | map(attribute='container', default={}) | map(attribute='name', default='')
                 | zip(thanos_instances | map(attribute='component') | map('regex_replace', '^', 'thanos-'))
                 | map('select') | map('first') | list }}
            monitoring_thanos__test_failure: "{{ ansible_failed_result.msg | default('') }}"
