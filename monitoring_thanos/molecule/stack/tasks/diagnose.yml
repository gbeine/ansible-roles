---
# Collects the quadlet units and the journals of the services in monitoring_thanos__test_names
# after a failed run of the role and fails with them, the VMs are removed after a failed converge

- name: 'Read the quadlet units'
  ansible.builtin.command:
    argv: [ 'cat', "/etc/containers/systemd/{{ item }}.container" ]
  loop: "{{ monitoring_thanos__test_names }}"
  register: 'monitoring_thanos__test_diag_quadlet'
  changed_when: false
  failed_when: false

- name: 'Read the journals of the services'
  ansible.builtin.command:
    argv: [ 'journalctl', '-u', "{{ item }}", '-n', '80', '--no-pager' ]
  loop: "{{ monitoring_thanos__test_names }}"
  register: 'monitoring_thanos__test_diag_journal'
  changed_when: false
  failed_when: false

- name: 'Fail with the quadlet units and the journals'
  ansible.builtin.fail:
    msg:
      failure: "{{ monitoring_thanos__test_failure }}"
      quadlet: "{{ dict(monitoring_thanos__test_names | zip(monitoring_thanos__test_diag_quadlet.results | map(attribute='stdout_lines'))) }}"
      journal: "{{ dict(monitoring_thanos__test_names | zip(monitoring_thanos__test_diag_journal.results | map(attribute='stdout_lines'))) }}"
