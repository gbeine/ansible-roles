---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-thanos
#

# The component of Thanos the role runs, sidecar, receive, query, store, compact or rule
monitoring_thanos__component: "{{ thanos_component | mandatory }}"

monitoring_thanos__home: "{{ thanos_home | mandatory }}"
monitoring_thanos__ip: "{{ thanos_ip | mandatory }}"
monitoring_thanos__ipv6: "{{ thanos_ipv6 }}"
monitoring_thanos__network: "{{ thanos_network | mandatory }}"
monitoring_thanos__hostname: "{{ thanos_hostname | mandatory }}"
monitoring_thanos__timezone: "{{ thanos_timezone | mandatory }}"
monitoring_thanos__labels: "{{ thanos_labels }}"

# The image has no tag latest
monitoring_thanos__version: "{{ thanos_version | mandatory }}"

# Content of bucket.yml, stored as podman secret, required by store and compact,
# without it sidecar, receive and rule upload nothing
monitoring_thanos__objstore: "{{ thanos_objstore | default({}) }}"

# Sidecar: the URL of Prometheus and the directory of its TSDB on the host
monitoring_thanos__prometheus_url: "{{ thanos_prometheus_url | default('http://prometheus:9090') }}"
monitoring_thanos__prometheus_data_dir: "{{ thanos_prometheus_data | mandatory }}"

# Query: the addresses of the StoreAPIs, e.g. 10.0.0.1:10901
monitoring_thanos__query_endpoints: "{{ thanos_query_endpoints | mandatory }}"

# Rule: the URL of query and the rule files, name without .yml and content
monitoring_thanos__query_url: "{{ thanos_query_url | mandatory }}"
monitoring_thanos__rules: "{{ thanos_rules | default({}) }}"

monitoring_thanos__container: "{{ monitoring_thanos__podman_container_default | combine(thanos_container | default({})) }}"

monitoring_thanos__autoupdate_enabled: "{{ thanos_autoupdate_enabled | default(false) }}"
monitoring_thanos__autoupdate_schedule: "{{ thanos_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_thanos__components: [ 'sidecar', 'receive', 'query', 'store', 'compact', 'rule' ]

# Names of rule files
monitoring_thanos__name_pattern: '^[A-Za-z0-9._-]+$'

monitoring_thanos__etc_dir: '/etc/thanos'
monitoring_thanos__objstore_file: "{{ monitoring_thanos__etc_dir }}/bucket.yml"
monitoring_thanos__rules_dir: "{{ monitoring_thanos__etc_dir }}/rules"
monitoring_thanos__sidecar_dir: '/prometheus'
monitoring_thanos__receive_dir: '/var/thanos/receive'
monitoring_thanos__store_dir: '/var/thanos/store'
monitoring_thanos__compact_dir: '/var/thanos/compact'
monitoring_thanos__rule_dir: '/var/thanos/rule'

# User and group nobody of the Prometheus image, the owner of the TSDB of Prometheus and the data directories
monitoring_thanos__uid: 65534
monitoring_thanos__gid: 65534

monitoring_thanos__objstore_flags: >-
  {{ [ '--objstore.config-file=' ~ monitoring_thanos__objstore_file ] if monitoring_thanos__objstore | length > 0 else [] }}

# Content of --endpoint.sd-config of query
monitoring_thanos__query_endpoints_config: >-
  {%- set endpoints = [] -%}
  {%- for address in monitoring_thanos__query_endpoints -%}
  {%-   set _ = endpoints.append({'address': address}) -%}
  {%- endfor -%}
  {{ {'endpoints': endpoints} | to_json }}

# The podman module writes the command space separated into the quadlet unit,
# arguments containing " are enclosed in ' so they reach Thanos unchanged
monitoring_thanos__command_default:
  sidecar: >-
    {{ [ 'sidecar',
         '--tsdb.path=' ~ monitoring_thanos__sidecar_dir,
         '--prometheus.url=' ~ monitoring_thanos__prometheus_url ]
       + monitoring_thanos__objstore_flags }}
  # receive refuses to start without an external label, the ports are the defaults of Thanos
  receive: >-
    {{ [ 'receive',
         '--tsdb.path=' ~ monitoring_thanos__receive_dir,
         "'" ~ '--label=receive_replica="' ~ monitoring_thanos__hostname ~ '"' ~ "'" ]
       + monitoring_thanos__objstore_flags }}
  # Deduplicates the replica labels of receive, rule and the example of Prometheus
  query: >-
    {{ [ 'query',
         "'--endpoint.sd-config=" ~ monitoring_thanos__query_endpoints_config ~ "'",
         '--query.replica-label=replica',
         '--query.replica-label=receive_replica',
         '--query.replica-label=rule_replica' ] }}
  store: >-
    {{ [ 'store',
         '--data-dir=' ~ monitoring_thanos__store_dir ]
       + monitoring_thanos__objstore_flags }}
  # Without --wait compact exits after one run
  compact: >-
    {{ [ 'compact',
         '--wait',
         '--data-dir=' ~ monitoring_thanos__compact_dir ]
       + monitoring_thanos__objstore_flags }}
  rule: >-
    {{ [ 'rule',
         '--data-dir=' ~ monitoring_thanos__rule_dir,
         '--rule-file=' ~ monitoring_thanos__rules_dir ~ '/*.yml',
         '--query=' ~ monitoring_thanos__query_url,
         "'" ~ '--label=rule_replica="' ~ monitoring_thanos__hostname ~ '"' ~ "'" ]
       + monitoring_thanos__objstore_flags }}

monitoring_thanos__volumes_timezone:
  - '/etc/localtime:/etc/localtime:ro'
  - '/etc/timezone:/etc/timezone:ro'

monitoring_thanos__volumes_default:
  sidecar: >-
    {{ monitoring_thanos__volumes_timezone
       + [ monitoring_thanos__prometheus_data_dir ~ ':' ~ monitoring_thanos__sidecar_dir ] }}
  receive: >-
    {{ monitoring_thanos__volumes_timezone
       + [ monitoring_thanos__podman_data_dir ~ ':' ~ monitoring_thanos__receive_dir ] }}
  query: "{{ monitoring_thanos__volumes_timezone }}"
  store: >-
    {{ monitoring_thanos__volumes_timezone
       + [ monitoring_thanos__podman_data_dir ~ ':' ~ monitoring_thanos__store_dir ] }}
  compact: >-
    {{ monitoring_thanos__volumes_timezone
       + [ monitoring_thanos__podman_data_dir ~ ':' ~ monitoring_thanos__compact_dir ] }}
  rule: >-
    {{ monitoring_thanos__volumes_timezone
       + [ monitoring_thanos__podman_data_dir ~ ':' ~ monitoring_thanos__rule_dir,
           monitoring_thanos__podman_rules_dir ~ ':' ~ monitoring_thanos__rules_dir ~ ':ro' ] }}

# Directories on the host created by the role, owned by monitoring_thanos__uid
monitoring_thanos__directories_default:
  sidecar: []
  receive: [ "{{ monitoring_thanos__podman_data_dir }}" ]
  query: []
  store: [ "{{ monitoring_thanos__podman_data_dir }}" ]
  compact: [ "{{ monitoring_thanos__podman_data_dir }}" ]
  rule: [ "{{ monitoring_thanos__podman_data_dir }}", "{{ monitoring_thanos__podman_rules_dir }}" ]

monitoring_thanos__podman_name: "thanos-{{ monitoring_thanos__component }}"
monitoring_thanos__podman_image: 'docker.io/thanosio/thanos'
monitoring_thanos__podman_tag: "{{ monitoring_thanos__version }}"
monitoring_thanos__podman_data_dir: "{{ monitoring_thanos__home }}/data"
monitoring_thanos__podman_rules_dir: "{{ monitoring_thanos__home }}/rules"
# Named after the container, so instances with their own container.name have their own secret
monitoring_thanos__podman_objstore_secret: "{{ (thanos_container | default({})).name | default(monitoring_thanos__podman_name) }}-objstore"

monitoring_thanos__podman_container_default:
  name: "{{ monitoring_thanos__podman_name }}"
  hostname: "{{ monitoring_thanos__hostname }}"
  image: "{{ monitoring_thanos__podman_image }}:{{ monitoring_thanos__podman_tag }}"
  ip: "{{ monitoring_thanos__ip }}"
  ipv6: "{{ monitoring_thanos__ipv6 | default(omit) }}"
  network: "{{ monitoring_thanos__network }}"
  timezone: "{{ monitoring_thanos__timezone }}"
  # thanos_container.environment replaces the dictionary completely
  environment:
    TZ: "{{ monitoring_thanos__timezone }}"
  labels: "{{ monitoring_thanos__labels | default(omit) }}"
  user: "{{ monitoring_thanos__uid }}:{{ monitoring_thanos__gid }}"
  # thanos_container.command replaces the list completely
  command: "{{ monitoring_thanos__command_default[monitoring_thanos__component] | default([]) }}"
  secrets: >-
    {{ [ monitoring_thanos__podman_objstore_secret ~ ',type=mount,target=' ~ monitoring_thanos__objstore_file ]
       if monitoring_thanos__objstore | length > 0 else omit }}
  # thanos_container.volumes replaces the list completely
  volumes: "{{ monitoring_thanos__volumes_default[monitoring_thanos__component] | default([]) }}"
