---

# Every entry of thanos_instances takes the variables of the role without the prefix thanos_,
# missing keys get the defaults of the role
- name: 'Loop over Thanos instances'
  tags: [ 'monitoring', 'monitoring_thanos' ]
  ansible.builtin.include_role:
    name: 'monitoring_thanos'
  loop: "{{ thanos_instances }}"
  loop_control:
    loop_var: 'thanos'
    label: "{{ thanos.hostname }}"
  vars:
    thanos_component: "{{ thanos.component }}"
    thanos_version: "{{ thanos.version }}"
    thanos_home: "{{ thanos.home }}"
    thanos_ip: "{{ thanos.ip }}"
    thanos_ipv6: "{{ thanos.ipv6 }}"
    thanos_network: "{{ thanos.network }}"
    thanos_hostname: "{{ thanos.hostname }}"
    thanos_timezone: "{{ thanos.timezone }}"
    thanos_labels: "{{ thanos.labels }}"
    thanos_objstore: "{{ thanos.objstore }}"
    thanos_prometheus_url: "{{ thanos.prometheus_url }}"
    thanos_prometheus_data: "{{ thanos.prometheus_data }}"
    thanos_query_endpoints: "{{ thanos.query_endpoints }}"
    thanos_query_url: "{{ thanos.query_url }}"
    thanos_rules: "{{ thanos.rules }}"
    thanos_container: "{{ thanos.container }}"
    thanos_autoupdate_enabled: "{{ thanos.autoupdate_enabled }}"
    thanos_autoupdate_schedule: "{{ thanos.autoupdate_schedule }}"
