---

- name: 'Install Thanos'
  tags: [ 'monitoring', 'monitoring_thanos' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or thanos_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - (monitoring_thanos__container | length) + (monitoring_thanos__objstore | to_json | length)
            + (monitoring_thanos__rules | to_json | length) > 0
        quiet: true

    - name: 'Validate the role variables'
      ansible.builtin.assert:
        that:
          - monitoring_thanos__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_thanos__invalid | join('. ') }}"
        quiet: true
      vars:
        monitoring_thanos__invalid: >-
          {%- set errors = [] -%}
          {%- if monitoring_thanos__component not in monitoring_thanos__components -%}
          {%-   set _ = errors.append('thanos_component has to be one of ' ~ monitoring_thanos__components | join(', ')) -%}
          {%- endif -%}
          {%- set objstore = monitoring_thanos__objstore -%}
          {%- if objstore is not mapping -%}
          {%-   set _ = errors.append('thanos_objstore has to be a dictionary') -%}
          {%- elif objstore | length > 0 and objstore.type is not defined -%}
          {%-   set _ = errors.append('thanos_objstore needs type') -%}
          {%- elif objstore | length == 0 and monitoring_thanos__component in [ 'store', 'compact' ] -%}
          {%-   set _ = errors.append('thanos_objstore is required for ' ~ monitoring_thanos__component) -%}
          {%- endif -%}
          {%- if monitoring_thanos__component == 'query' -%}
          {%-   set endpoints = monitoring_thanos__query_endpoints -%}
          {%-   if endpoints is string or endpoints is mapping or endpoints is not iterable
                   or endpoints | length == 0 or endpoints | reject('string') | list | length > 0 -%}
          {%-     set _ = errors.append('thanos_query_endpoints has to be a list of addresses') -%}
          {%-   endif -%}
          {%- endif -%}
          {%- set rules = monitoring_thanos__rules -%}
          {%- if rules is not mapping -%}
          {%-   set _ = errors.append('thanos_rules has to be a dictionary') -%}
          {%- else -%}
          {%-   set names = rules.keys() | map('string') | reject('match', monitoring_thanos__name_pattern) | list -%}
          {%-   if names | length > 0 -%}
          {%-     set _ = errors.append('thanos_rules has invalid names: ' ~ names | join(', ')) -%}
          {%-   endif -%}
          {%-   set values = rules | dict2items | rejectattr('value', 'mapping') | map(attribute='key') | list -%}
          {%-   if values | length > 0 -%}
          {%-     set _ = errors.append('thanos_rules entries have to be dictionaries: ' ~ values | join(', ')) -%}
          {%-   endif -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create the directories'
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ monitoring_thanos__uid }}"
        group: "{{ monitoring_thanos__gid }}"
        mode: '0755'
        state: 'directory'
      loop: "{{ monitoring_thanos__directories_default[monitoring_thanos__component] }}"

    # The thanos tool of the image checks the rule files in a throwaway container before they are replaced
    - name: 'Generate the rule files'
      when: monitoring_thanos__component == 'rule'
      ansible.builtin.copy:
        content: |
          #
          # {{ lookup('ansible.builtin.config', 'DEFAULT_MANAGED_STR') }}
          #

          {{ item.value | to_nice_yaml(indent=2, sort_keys=false) }}
        dest: "{{ monitoring_thanos__podman_rules_dir }}/{{ item.key }}.yml"
        owner: 'root'
        group: 'root'
        mode: '0644'
        validate: >-
          podman run --rm --network none --user 0
          --volume %s:/tmp/rules.yml:ro {{ monitoring_thanos__container.image }}
          tools rules-check --rules=/tmp/rules.yml
      loop: "{{ monitoring_thanos__rules | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: 'monitoring_thanos__rules_result'

    - name: 'Find the rule files'
      when: monitoring_thanos__component == 'rule'
      ansible.builtin.find:
        paths: "{{ monitoring_thanos__podman_rules_dir }}"
        file_type: 'any'
        hidden: true
      register: 'monitoring_thanos__rules_found'

    - name: 'Remove the undeclared rule files'
      when: monitoring_thanos__component == 'rule'
      ansible.builtin.file:
        path: "{{ item }}"
        state: 'absent'
      # The loop is templated before when, it only uses the directory of the rule files for rule
      loop: >-
        {{ (monitoring_thanos__rules_found.files | map(attribute='path')
            | reject('in', monitoring_thanos__rules.keys()
                           | map('regex_replace', '^(.*)$', monitoring_thanos__podman_rules_dir ~ '/\1.yml') | list)
            | list)
           if monitoring_thanos__component == 'rule' else [] }}
      register: 'monitoring_thanos__rules_removed'

    # The content of bucket.yml contains the credentials of the object storage,
    # it is neither part of a file on the host nor of the quadlet unit
    - name: 'Create or remove the secret of the object storage'
      no_log: true
      containers.podman.podman_secret:
        name: "{{ monitoring_thanos__podman_objstore_secret }}"
        data: "{{ (monitoring_thanos__objstore | to_nice_yaml(indent=2, sort_keys=false)) if monitoring_thanos__objstore | length > 0 else omit }}"
        state: "{{ 'present' if monitoring_thanos__objstore | length > 0 else 'absent' }}"
      register: 'monitoring_thanos__objstore_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ monitoring_thanos__container.name }}"
        hostname: "{{ monitoring_thanos__container.hostname }}"
        image: "{{ monitoring_thanos__container.image }}"
        ip: "{{ monitoring_thanos__container.ip }}"
        ip6: "{{ monitoring_thanos__container.ipv6 | default(omit) }}"
        network: "{{ monitoring_thanos__container.network }}"
        timezone: "{{ monitoring_thanos__container.timezone }}"
        user: "{{ monitoring_thanos__container.user | default(omit) }}"
        command: "{{ monitoring_thanos__container.command | default(omit) }}"
        env: "{{ monitoring_thanos__container.environment | default(omit) }}"
        etc_hosts: "{{ monitoring_thanos__container.etc_hosts | default(omit) }}"
        expose: "{{ monitoring_thanos__container.expose | default(omit) }}"
        label: "{{ monitoring_thanos__container.labels | default(omit) }}"
        publish: "{{ monitoring_thanos__container.publish | default(omit) }}"
        secrets: "{{ monitoring_thanos__container.secrets | default(omit) }}"
        volume: "{{ monitoring_thanos__container.volumes | default(omit) }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if monitoring_thanos__container.requires is defined %}
          Requires={{ monitoring_thanos__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'monitoring_thanos__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ monitoring_thanos__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if monitoring_thanos__restart | bool else 'started' }}"
        enabled: true
      vars:
        monitoring_thanos__running: >-
          {{ (ansible_facts.services[monitoring_thanos__container.name + '.service'].state | default('')) == 'running' }}
        monitoring_thanos__restart: >-
          {{ monitoring_thanos__running | bool
             and (monitoring_thanos__objstore_result is changed
                  or monitoring_thanos__rules_result is changed
                  or monitoring_thanos__rules_removed is changed
                  or monitoring_thanos__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'monitoring_thanos__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ monitoring_thanos__container.name }}"
        container_image: "{{ monitoring_thanos__container.image }}"
        container_schedule: "{{ monitoring_thanos__autoupdate_schedule }}"
