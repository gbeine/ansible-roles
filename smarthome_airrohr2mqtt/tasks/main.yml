---

- name: 'Install airrohr2mqtt'
  tags: [ 'smarthome_airrohr2mqtt' ]
  block:

    - name: 'Create airrohr2mqtt directories'
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ smarthome_airrohr2mqtt__podman_home }}"

    - name: 'Generate configuration'
      ansible.builtin.copy:
        content: "{{ smarthome_airrohr2mqtt__config | to_nice_json(indent=4) }}"
        dest: "{{ smarthome_airrohr2mqtt__podman_home }}/airrohr2mqtt.conf"
        mode: '400'
      notify:
        - 'Restart airrohr2mqtt container'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ smarthome_airrohr2mqtt__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[smarthome_airrohr2mqtt__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ smarthome_airrohr2mqtt__container.image }}"
        force: true
      when: 'podman___update_mode'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ smarthome_airrohr2mqtt__container.name }}"
        hostname: "{{ smarthome_airrohr2mqtt__container.hostname }}"
        image: "{{ smarthome_airrohr2mqtt__container.image }}"
        ip: "{{ smarthome_airrohr2mqtt__container.ip }}"
        network: "{{ smarthome_airrohr2mqtt__container.network }}"
        timezone: "{{ smarthome_airrohr2mqtt__container.timezone }}"
        publish: "{{ smarthome_airrohr2mqtt__container.publish }}"
        volume: "{{ smarthome_airrohr2mqtt__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'smarthome_airrohr2mqtt__ipv6 | length == 0'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ smarthome_airrohr2mqtt__container.name }}"
        hostname: "{{ smarthome_airrohr2mqtt__container.hostname }}"
        image: "{{ smarthome_airrohr2mqtt__container.image }}"
        ip: "{{ smarthome_airrohr2mqtt__container.ip }}"
        ip6: "{{ smarthome_airrohr2mqtt__container.ipv6 }}"
        network: "{{ smarthome_airrohr2mqtt__container.network }}"
        timezone: "{{ smarthome_airrohr2mqtt__container.timezone }}"
        publish: "{{ smarthome_airrohr2mqtt__container.publish }}"
        volume: "{{ smarthome_airrohr2mqtt__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'smarthome_airrohr2mqtt__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ smarthome_airrohr2mqtt__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode is defined and podman___update_mode else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'
