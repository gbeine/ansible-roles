---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/smarthome-airrohr2mqtt
#

smarthome_airrohr2mqtt__home: "{{ airrohr2mqtt_home | mandatory }}"
smarthome_airrohr2mqtt__ip: "{{ airrohr2mqtt_ip | mandatory }}"
smarthome_airrohr2mqtt__ipv6: "{{ airrohr2mqtt_ipv6 | default('') }}"
smarthome_airrohr2mqtt__network: "{{ airrohr2mqtt_network | mandatory }}"
smarthome_airrohr2mqtt__hostname: "{{ airrohr2mqtt_hostname | mandatory }}"
smarthome_airrohr2mqtt__timezone: "{{ airrohr2mqtt_timezone | mandatory }}"

smarthome_airrohr2mqtt__version: "{{ airrohr2mqtt_version | default('latest') }}"

smarthome_airrohr2mqtt__container: "{{ smarthome_airrohr2mqtt__container_default | combine(airrohr2mqtt_container | default({})) }}"

smarthome_airrohr2mqtt__config: "{{ airrohr2mqtt_config | default({}) }}"

#
# Defaults - do not change
#

smarthome_airrohr2mqtt__podman_name: 'airrohr2mqtt'
smarthome_airrohr2mqtt__podman_image: 'docker.io/gbeine/airrohr2mqtt'
smarthome_airrohr2mqtt__podman_tag: "{{ smarthome_airrohr2mqtt__version }}"

smarthome_airrohr2mqtt__podman_home: "{{ smarthome_airrohr2mqtt__home }}"

smarthome_airrohr2mqtt__container_default:
  name: "{{ smarthome_airrohr2mqtt__podman_name }}"
  hostname: "{{ smarthome_airrohr2mqtt__hostname }}"
  image: "{{ smarthome_airrohr2mqtt__podman_image }}:{{ smarthome_airrohr2mqtt__podman_tag }}"
  ip: "{{ smarthome_airrohr2mqtt__ip }}"
  ipv6: "{{ smarthome_airrohr2mqtt__ipv6 }}"
  network: "{{ smarthome_airrohr2mqtt__network }}"
  timezone: "{{ smarthome_airrohr2mqtt__timezone }}"
  publish: []
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ smarthome_airrohr2mqtt__podman_home }}/airrohr2mqtt.conf:/etc/airrohr2mqtt.conf:ro"
