---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/mautrix-bridges
#

mautrix_bridge_whatsapp__home: "{{ mautrix_bridge_whatsapp_home | mandatory }}"
mautrix_bridge_whatsapp__ip: "{{ mautrix_bridge_whatsapp_ip | mandatory }}"
mautrix_bridge_whatsapp__ipv6: "{{ mautrix_bridge_whatsapp_ipv6 | default('') }}"
mautrix_bridge_whatsapp__network: "{{ mautrix_bridge_whatsapp_network | mandatory }}"
mautrix_bridge_whatsapp__hostname: "{{ mautrix_bridge_whatsapp_hostname | mandatory }}"
mautrix_bridge_whatsapp__timezone: "{{ mautrix_bridge_whatsapp_timezone | mandatory }}"

mautrix_bridge_whatsapp__version: "{{ mautrix_bridge_whatsapp_version | default('latest') }}"

mautrix_bridge_whatsapp__dns_servers: "{{ mautrix_bridge_whatsapp_dns_servers | default([]) }}"

mautrix_bridge_whatsapp__setup: "{{ mautrix_bridge_whatsapp_setup | default(true) }}"

mautrix_bridge_whatsapp__container: "{{ mautrix_bridge_whatsapp__container_default | combine(mautrix_bridge_whatsapp_container | default({}))  }}"

#
# Defaults - do not change
#

mautrix_bridge_whatsapp__uid: 1337
mautrix_bridge_whatsapp__gid: "{{ mautrix_bridge_whatsapp__uid }}"

mautrix_bridge_whatsapp__podman_name: 'mautrix-whatsapp'
mautrix_bridge_whatsapp__podman_image: 'dock.mau.dev/mautrix/whatsapp'
mautrix_bridge_whatsapp__podman_tag: "{{ mautrix_bridge_whatsapp__version }}"

mautrix_bridge_whatsapp__podman_home: "{{ mautrix_bridge_whatsapp__home }}"

mautrix_bridge_whatsapp__container_default:
  name: "{{ mautrix_bridge_whatsapp__podman_name }}"
  hostname: "{{ mautrix_bridge_whatsapp__hostname }}"
  image: "{{ mautrix_bridge_whatsapp__podman_image }}:{{ mautrix_bridge_whatsapp__podman_tag }}"
  ip: "{{ mautrix_bridge_whatsapp__ip }}"
  ipv6: "{{ mautrix_bridge_whatsapp__ipv6 }}"
  network: "{{ mautrix_bridge_whatsapp__network }}"
  timezone: "{{ mautrix_bridge_whatsapp__timezone }}"
  dns_servers: "{{ mautrix_bridge_whatsapp__dns_servers }}"
  environment:
    TZ: "{{ mautrix_bridge_whatsapp__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ mautrix_bridge_whatsapp__podman_home }}:/data"
