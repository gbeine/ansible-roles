backup_foundryvtt__base_dir: "{{ backup_foundryvtt_base_dir | mandatory }}"
backup_foundryvtt__repo: "{{ backup_foundryvtt_repo | mandatory }}"
backup_foundryvtt__podman_filter: "{{ backup_foundryvtt_podman_filter | default('foundry-.*') }}"
backup_foundryvtt__exclude: "{{ backup_foundryvtt_exclude | default([]) }}"
backup_foundryvtt__keep_days: "{{ backup_foundryvtt_keep_days | default(14) }}"
