---

- name: 'Configure FoundryVTT backup'
  tags: [ 'backup_foundryvtt'  ]
  block:

    - name: 'Install borg backup packages'
      ansible.builtin.apt:
        update_cache: 'yes'
        install_recommends: 'no'
        pkg: "{{ backup_foundryvtt__packages }}"

    - name: 'Copy borg backup scripts to host'
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ backup_common__lib_dir }}/{{ item }}"
        mode: '755'
      with_items: "{{ backup_foundryvtt__files }}"

    - name: 'Generate borg backup configuration file'
      ansible.builtin.template:
        src: 'foundryvtt.j2'
        dest: "{{ backup_common__etc_dir }}/foundryvtt"
        owner: 'root'
        group: 'root'
        mode: '640'
