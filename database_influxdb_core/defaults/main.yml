---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-influxdb-core
#

database_influxdb_core__home: "{{ influxdb_core_home | mandatory }}"
database_influxdb_core__ip: "{{ influxdb_core_ip | mandatory }}"
database_influxdb_core__ipv6: "{{ influxdb_core_ipv6 | default('') }}"
database_influxdb_core__network: "{{ influxdb_core_network | mandatory }}"
database_influxdb_core__hostname: "{{ influxdb_core_hostname | mandatory }}"
database_influxdb_core__timezone: "{{ influxdb_core_timezone | mandatory }}"
database_influxdb_core__labels: "{{ influxdb_core_labels | default({}) }}"
database_influxdb_core__publish: "{{ influxdb_core_publish | default([]) }}"

database_influxdb_core__version: "{{ influxdb_core_version | default('3-core') }}"

database_influxdb_core__container: "{{ database_influxdb_core__podman_container_default | combine(influxdb_core_container | default({})) }}"

database_influxdb_core__autoupdate_enabled: "{{ influxdb_core_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

database_influxdb_core__uid: 1500
database_influxdb_core__gid: "{{ database_influxdb_core__uid }}"

database_influxdb_core__port: 8181

database_influxdb_core__podman_name: 'influxdb-core'
database_influxdb_core__podman_image: 'docker.io/influxdb'
database_influxdb_core__podman_tag: "{{ database_influxdb_core__version }}"

database_influxdb_core__podman_home: "{{ database_influxdb_core__home }}"
database_influxdb_core__podman_data_dir: "{{ database_influxdb_core__podman_home }}/data"
database_influxdb_core__podman_plugins_dir: "{{ database_influxdb_core__podman_home }}/plugins"
database_influxdb_core__podman_backup_dir: "{{ database_influxdb_core__podman_home }}/backup"


database_influxdb_core__podman_container_default:
  name: "{{ database_influxdb_core__podman_name }}"
  hostname: "{{ database_influxdb_core__hostname }}"
  image: "{{ database_influxdb_core__podman_image }}:{{ database_influxdb_core__podman_tag }}"
  ip: "{{ database_influxdb_core__ip }}"
  ipv6: "{{ database_influxdb_core__ipv6 }}"
  network: "{{ database_influxdb_core__network }}"
  timezone: "{{ database_influxdb_core__timezone }}"
  labels: "{{ database_influxdb_core__labels }}"
  publish: "{{ database_influxdb_core__publish }}"
  volumes:
    - "/etc/localtime:/etc/localtime:ro"
    - "/etc/timezone:/etc/timezone:ro"
    - "{{ database_influxdb_core__podman_data_dir }}:/var/lib/influxdb3/data"
    - "{{ database_influxdb_core__podman_plugins_dir }}:/var/lib/influxdb3/plugins"
  command:
    - 'influxdb3'
    - 'serve'
    - '--node-id=node0'
    - '--object-store=file'
    - '--data-dir=/var/lib/influxdb3/data'
    - '--plugin-dir=/var/lib/influxdb3/plugins'
