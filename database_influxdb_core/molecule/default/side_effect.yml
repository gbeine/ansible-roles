---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    database_influxdb_core__test_case: "{{ database_influxdb_core__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    database_influxdb_core__test_vars: "{{ database_influxdb_core__test_case.role_vars }}"
    database_influxdb_core__test_env: "{{ database_influxdb_core__test_vars.influxdb_core_environment | default({}) }}"
    database_influxdb_core__test_secrets: "{{ database_influxdb_core__test_vars.influxdb_core_secrets | default([]) }}"
    database_influxdb_core__test_checked_files:
      - "{{ database_influxdb_core__test_quadlet_path }}"

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ database_influxdb_core__test_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksum of the quadlet unit before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ database_influxdb_core__test_checked_files }}"
      register: 'database_influxdb_core__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include

    - name: 'Run database_influxdb_core with influxdb_core_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        influxdb_core_container: [ 'environment' ]
        database_influxdb_core__test_invalid:
          message: 'influxdb_core_container not a dictionary'
          # combine of the defaults fails before the role checks anything
          search: 'failed to combine variables, expected dicts'

    - name: 'Run database_influxdb_core with a secret without target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        influxdb_core_secrets: [ { name: 'influxdb_core_admin_token', data: 'x' } ]
        database_influxdb_core__test_invalid:
          message: 'a secret without target'
          search: '^influxdb_core_secrets entries need name, data and target$'

    - name: 'Run database_influxdb_core with an empty INFLUXDB3_NODE_ID (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        influxdb_core_environment: "{{ database_influxdb_core__test_env | combine({'INFLUXDB3_NODE_ID': ''}) }}"
        database_influxdb_core__test_invalid:
          message: 'an empty INFLUXDB3_NODE_ID'
          search: '^InfluxDB 3 Core needs the environment variables INFLUXDB3_NODE_ID, INFLUXDB3_OBJECT_STORE, missing or empty: INFLUXDB3_NODE_ID\.$'

    - name: 'Run database_influxdb_core with the file of the admin token in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        influxdb_core_environment: "{{ database_influxdb_core__test_env | combine({'INFLUXDB3_ADMIN_TOKEN_FILE': '/run/secrets/token'}) }}"
        database_influxdb_core__test_invalid:
          message: 'the file of the admin token in the environment'
          search: '^Secrets and their file variables must not be set in influxdb_core_environment: INFLUXDB3_ADMIN_TOKEN_FILE\.$'

    - name: 'Run database_influxdb_core with the secret access key of S3 in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        influxdb_core_environment: "{{ database_influxdb_core__test_env | combine({'AWS_SECRET_ACCESS_KEY': 'molecule'}) }}"
        database_influxdb_core__test_invalid:
          message: 'the secret access key of S3 in the environment'
          search: '^Secrets and their file variables must not be set in influxdb_core_environment: AWS_SECRET_ACCESS_KEY\.$'

    - name: 'Run database_influxdb_core with an admin token without apiv3_ (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        influxdb_core_secrets:
          - name: 'influxdb_core_admin_token'
            data: '{"token": "molecule", "name": "molecule"}'
            target: 'INFLUXDB3_ADMIN_TOKEN'
        database_influxdb_core__test_invalid:
          message: 'an admin token without apiv3_'
          search: '^The secret INFLUXDB3_ADMIN_TOKEN needs JSON with token \(apiv3_\.\.\.\) and name, InfluxDB 3 does not start otherwise\.$'

    - name: 'Run database_influxdb_core with an admin token that is no JSON (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        influxdb_core_secrets:
          - name: 'influxdb_core_admin_token'
            data: 'apiv3_molecule'
            target: 'INFLUXDB3_ADMIN_TOKEN'
        database_influxdb_core__test_invalid:
          message: 'an admin token that is no JSON'
          search: '^The secret INFLUXDB3_ADMIN_TOKEN needs JSON with token \(apiv3_\.\.\.\) and name, InfluxDB 3 does not start otherwise\.$'

    - name: 'Run database_influxdb_core with an unknown environment variable (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        influxdb_core_environment: "{{ database_influxdb_core__test_env | combine({'INFLUXDB3_HOST': '0.0.0.0'}) }}"
        database_influxdb_core__test_invalid:
          message: 'an unknown environment variable'
          search: '^Unknown environment variables: INFLUXDB3_HOST\.'

    - name: 'Run database_influxdb_core with an unknown environment variable in influxdb_core_container (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        influxdb_core_container: { environment: { FOO: 'bar' } }
        database_influxdb_core__test_invalid:
          message: 'an unknown environment variable in influxdb_core_container'
          search: '^Unknown environment variables: FOO\.'

    - name: 'Run database_influxdb_core with an unknown secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        influxdb_core_secrets: "{{ database_influxdb_core__test_secrets + [{'name': 'influxdb_core_unknown', 'data': 'x', 'target': 'INFLUXDB3_TOKEN'}] }}"
        database_influxdb_core__test_invalid:
          message: 'an unknown secret'
          search: '^Unknown secrets: INFLUXDB3_TOKEN\.'

    - name: 'Run database_influxdb_core with the changed environment'
      when: database_influxdb_core__test_case.side_effect | default(false)
      block:

        # The change is only a restart if InfluxDB runs
        - name: 'Wait until InfluxDB answers'
          ansible.builtin.uri:
            url: "http://{{ database_influxdb_core__test_vars.influxdb_core_ip }}:8181/health"
            status_code: [ 200, 401 ]
          register: 'database_influxdb_core__test_ready'
          until: database_influxdb_core__test_ready.status | default(0) in [ 200, 401 ]
          retries: 30
          delay: 5
          failed_when: false

        - name: 'Read the log of InfluxDB'
          when: database_influxdb_core__test_ready.status | default(0) not in [ 200, 401 ]
          ansible.builtin.command:
            argv: [ 'journalctl', '-u', 'influxdb-core', '-n', '50', '--no-pager' ]
          register: 'database_influxdb_core__test_journal'
          changed_when: false

        - name: 'Assert that InfluxDB runs'
          ansible.builtin.assert:
            that:
              - database_influxdb_core__test_ready.status | default(0) in [ 200, 401 ]
            fail_msg: "{{ database_influxdb_core__test_journal.stdout_lines | default([]) }}"

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'influxdb-core' ]
          register: 'database_influxdb_core__test_started_before'
          changed_when: false

        - name: 'Set the changed environment'
          ansible.builtin.set_fact:
            influxdb_core_environment: "{{ database_influxdb_core__test_env | combine(database_influxdb_core__test_side_effect_environment) }}"

        - name: 'Run database_influxdb_core with the changed environment'
          ansible.builtin.include_role:
            name: 'database_influxdb_core'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'influxdb-core' ]
          register: 'database_influxdb_core__test_started_after'
          changed_when: false

        - name: 'Assert the changed quadlet unit and the restart of the service'
          ansible.builtin.assert:
            that:
              - database_influxdb_core__quadlet_result is changed
              - database_influxdb_core__test_started_after.stdout | int > database_influxdb_core__test_started_before.stdout | int
            fail_msg: >-
              quadlet changed: {{ database_influxdb_core__quadlet_result is changed }},
              start before {{ database_influxdb_core__test_started_before.stdout }}, after {{ database_influxdb_core__test_started_after.stdout }}
