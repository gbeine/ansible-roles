---

- name: 'Install InfluxDB 3 Core'
  tags: [ 'database', 'database_influxdb_core' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or influxdb_core_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - database_influxdb_core__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - database_influxdb_core__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_influxdb_core__invalid | join('. ') }}"
        quiet: true
      vars:
        database_influxdb_core__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = database_influxdb_core__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('influxdb_core_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('influxdb_core_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of influxdb_core_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - database_influxdb_core__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_influxdb_core__errors | join(' ') }}"
        quiet: true
      vars:
        database_influxdb_core__secret_targets: "{{ database_influxdb_core__secrets | map(attribute='target') | list }}"
        database_influxdb_core__environment_set: >-
          {{ database_influxdb_core__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list }}
        database_influxdb_core__environment_missing: >-
          {{ database_influxdb_core__environment_required | reject('in', database_influxdb_core__environment_set) | list }}
        database_influxdb_core__secrets_missing: >-
          {{ database_influxdb_core__secrets_required | reject('in', database_influxdb_core__secret_targets) | list }}
        database_influxdb_core__secrets_in_environment: >-
          {{ (database_influxdb_core__secret_targets + database_influxdb_core__secret_variables + database_influxdb_core__secret_files.values() | list)
             | select('in', database_influxdb_core__environment.keys() | list) | unique | list }}
        database_influxdb_core__errors: >-
          {%- set errors = [] -%}
          {%- if database_influxdb_core__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('InfluxDB 3 Core needs the environment variables ' ~ (database_influxdb_core__environment_required | join(', ')) ~ ', missing or empty: ' ~ (database_influxdb_core__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- for secret in database_influxdb_core__secrets if secret.target == 'INFLUXDB3_ADMIN_TOKEN' -%}
          {%-   set token = secret.data | from_json if (secret.data is string and secret.data.startswith('{')) else none -%}
          {%-   if token is not mapping or token.token is not string or not token.token.startswith('apiv3_') or token.name is not string -%}
          {%-     set _ = errors.append('The secret INFLUXDB3_ADMIN_TOKEN needs JSON with token (apiv3_...) and name, InfluxDB 3 does not start otherwise.') -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- if database_influxdb_core__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('InfluxDB 3 Core needs the secrets ' ~ (database_influxdb_core__secrets_required | join(', ')) ~ ', missing: ' ~ (database_influxdb_core__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if database_influxdb_core__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets and their file variables must not be set in influxdb_core_environment: ' ~ (database_influxdb_core__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging influxdb_core_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - database_influxdb_core__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_influxdb_core__errors | join(' ') }}"
        quiet: true
      vars:
        database_influxdb_core__environment_unknown: >-
          {{ (database_influxdb_core__container.environment | default({})).keys() | reject('in', database_influxdb_core__environment_allowed) | list }}
        database_influxdb_core__secrets_unknown: >-
          {{ database_influxdb_core__secrets | map(attribute='target')
             | reject('in', database_influxdb_core__secret_files.keys() | list + database_influxdb_core__secrets_env) | list }}
        database_influxdb_core__errors: >-
          {%- set errors = [] -%}
          {%- if database_influxdb_core__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (database_influxdb_core__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if database_influxdb_core__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (database_influxdb_core__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the options of InfluxDB 3 (database_influxdb_core__environment_allowed) and the secrets ' ~ ((database_influxdb_core__secret_files.keys() | list + database_influxdb_core__secrets_env) | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create the directories'
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        state: 'directory'
      loop:
        - path: "{{ database_influxdb_core__home }}"
          owner: 'root'
          group: 'root'
          mode: '0750'
        # InfluxDB 3 runs as the user influxdb3 of the image
        - path: "{{ database_influxdb_core__data_dir }}"
          owner: "{{ database_influxdb_core__data_owner }}"
          group: "{{ database_influxdb_core__data_group }}"
          mode: '0700'
        - path: "{{ database_influxdb_core__plugins_dir }}"
          owner: "{{ database_influxdb_core__data_owner }}"
          group: "{{ database_influxdb_core__data_group }}"
          mode: '0700'
      loop_control:
        label: "{{ item.path }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ database_influxdb_core__secrets }}"
      register: 'database_influxdb_core__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ database_influxdb_core__container.name }}"
        hostname: "{{ database_influxdb_core__container.hostname }}"
        image: "{{ database_influxdb_core__container.image }}"
        ip: "{{ database_influxdb_core__container.ip }}"
        ip6: "{{ database_influxdb_core__container.ipv6 | default(omit) }}"
        network: "{{ database_influxdb_core__container.network }}"
        timezone: "{{ database_influxdb_core__container.timezone }}"
        env: "{{ database_influxdb_core__container.environment | default(omit) }}"
        etc_hosts: "{{ database_influxdb_core__container.etc_hosts | default(omit) }}"
        expose: "{{ database_influxdb_core__container.expose | default(omit) }}"
        label: "{{ database_influxdb_core__container.labels | default(omit) }}"
        publish: "{{ database_influxdb_core__container.publish | default(omit) }}"
        secrets: "{{ database_influxdb_core__container.secrets | default(omit) }}"
        volume: "{{ database_influxdb_core__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if database_influxdb_core__container.requires is defined %}
          Requires={{ database_influxdb_core__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'database_influxdb_core__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ database_influxdb_core__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if database_influxdb_core__restart | bool else 'started' }}"
        enabled: true
      vars:
        database_influxdb_core__running: >-
          {{ (ansible_facts.services[database_influxdb_core__container.name + '.service'].state | default('')) == 'running' }}
        database_influxdb_core__restart: >-
          {{ database_influxdb_core__running | bool
             and (database_influxdb_core__secrets_result is changed
                  or database_influxdb_core__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    # Roles depending on InfluxDB 3 start after the port is open
    - name: 'Wait for the port of InfluxDB'
      ansible.builtin.wait_for:
        host: "{{ database_influxdb_core__container.ip }}"
        port: "{{ database_influxdb_core__port }}"
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'database_influxdb_core__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ database_influxdb_core__container.name }}"
        container_image: "{{ database_influxdb_core__container.image }}"
        container_schedule: "{{ database_influxdb_core__autoupdate_schedule }}"
