---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_freescout__test_case: "{{ app_freescout__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    app_freescout__test_checked_files:
      - "{{ app_freescout__test_quadlet_path }}"

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ app_freescout__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksum of the quadlet unit before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ app_freescout__test_checked_files }}"
      register: 'app_freescout__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include
    - name: 'Run app_freescout with freescout_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        freescout_container: [ 'environment' ]
        app_freescout__test_invalid:
          message: 'freescout_container is not a dictionary'
          # combine of the defaults fails before the role checks anything
          search: 'failed to combine variables, expected dicts'

    - name: 'Run app_freescout with an empty APP_URL (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        freescout_environment: "{{ app_freescout__test_case.role_vars.freescout_environment | combine({'APP_URL': ''}) }}"
        app_freescout__test_invalid:
          message: 'an empty APP_URL'
          search: 'missing or empty: APP_URL\.'

    - name: 'Run app_freescout with a secret without data (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        freescout_secrets:
          - name: 'freescout_admin_password'
        app_freescout__test_invalid:
          message: 'a secret without data'
          search: '^freescout_secrets entries need name and data$'

    - name: 'Run app_freescout without the secret of the database password (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        freescout_secrets:
          - name: 'freescout_admin_password'
            data: 'molecule-admin-password'
        app_freescout__test_invalid:
          message: 'no secret of the database password'
          # molecule-freescout misses the secret of the mail password as well
          search: '^the environment references missing secrets in freescout_secrets: freescout_database_password(, |$)'

    - name: 'Run app_freescout with the admin password in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        freescout_environment: "{{ app_freescout__test_case.role_vars.freescout_environment | combine({'ADMIN_PASS': 'molecule'}) }}"
        app_freescout__test_invalid:
          message: 'the admin password in the environment'
          search: 'Unknown environment variables: ADMIN_PASS\.'

    - name: 'Run app_freescout with an unknown environment variable (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        freescout_environment: "{{ app_freescout__test_case.role_vars.freescout_environment | combine({'FREESCOUT_FOO': 'bar'}) }}"
        app_freescout__test_invalid:
          message: 'an unknown environment variable'
          search: 'Unknown environment variables: FREESCOUT_FOO\.'

    - name: 'Run app_freescout with an unknown environment variable in freescout_container (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        freescout_container:
          environment:
            FOO: 'bar'
        app_freescout__test_invalid:
          message: 'an unknown environment variable in freescout_container'
          search: 'Unknown environment variables: FOO\.'

    - name: 'Run app_freescout with an unknown secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        freescout_secrets: "{{ app_freescout__test_case.role_vars.freescout_secrets + [{'name': 'freescout_unknown', 'data': 'secret'}] }}"
        app_freescout__test_invalid:
          message: 'an unknown secret'
          search: 'Unknown secrets: freescout_unknown\.'

    - name: 'Run app_freescout with the changed role variables'
      when: app_freescout__test_case.side_effect is defined
      block:

        # The first start creates the admin after migrating the database,
        # a restart before would leave FreeScout without admin
        - name: 'Wait until FreeScout finished the first start'
          ansible.builtin.uri:
            url: "http://{{ app_freescout__test_case.expect.ip }}/login"
          register: 'app_freescout__test_first_start'
          until: app_freescout__test_first_start.status | default(0) == 200
          retries: 60
          delay: 5

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'freescout' ]
          register: 'app_freescout__test_started_before'
          changed_when: false

        - name: 'Set the changed role variables'
          ansible.builtin.set_fact:
            "{{ item.key }}": "{{ item.value }}"
          loop: "{{ app_freescout__test_case.side_effect.role_vars | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: 'Run app_freescout with the changed role variables'
          ansible.builtin.include_role:
            name: 'app_freescout'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'freescout' ]
          register: 'app_freescout__test_started_after'
          changed_when: false

        - name: 'Assert the changed quadlet unit and the restart of the service'
          ansible.builtin.assert:
            that:
              - app_freescout__quadlet_result is changed
              - app_freescout__test_started_after.stdout | int > app_freescout__test_started_before.stdout | int
            fail_msg: >-
              quadlet changed: {{ app_freescout__quadlet_result is changed }},
              start before {{ app_freescout__test_started_before.stdout }}, after {{ app_freescout__test_started_after.stdout }}
