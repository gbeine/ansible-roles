---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/freescout
#

app_freescout__home: "{{ freescout_home | mandatory }}"
app_freescout__ip: "{{ freescout_ip | mandatory }}"
app_freescout__ipv6: "{{ freescout_ipv6 | default('') }}"
app_freescout__network: "{{ freescout_network | mandatory }}"
app_freescout__hostname: "{{ freescout_hostname | mandatory }}"
app_freescout__timezone: "{{ freescout_timezone | mandatory }}"
app_freescout__labels: "{{ freescout_labels | default({}) }}"

app_freescout__version: "{{ freescout_version | default('latest') }}"

app_freescout__container: "{{ app_freescout__podman_container_default | combine(freescout_container | default({})) }}"

app_freescout__db_host: "{{ freescout_db_host | mandatory }}"
app_freescout__db_port: "{{ freescout_db_port | default('3306') }}"
app_freescout__db_type: "{{ freescout_db_type | default('mariadb') }}"
app_freescout__db_name: "{{ freescout_db_name | default('freescout') }}"
app_freescout__db_user: "{{ freescout_db_user | default('freescout') }}"
app_freescout__db_pass: "{{ freescout_db_pass | mandatory }}"

app_freescout__admin_email: "{{ freescout_admin_email | mandatory }}"
app_freescout__admin_first_name: "{{ freescout_admin_first_name | default('Admin') }}"
app_freescout__admin_last_name: "{{ freescout_admin_last_name | default('User') }}"
app_freescout__admin_pass: "{{ freescout_admin_pass | mandatory }}"
app_freescout__enable_auto_update: "{{ freescout_enable_auto_update | default(true) }}"

app_freescout__app_url: "{{ freescout_url | mandatory }}"

app_freescout__mail_host: "{{ freescout_mail_host | mandatory }}"

app_freescout__autoupdate_enabled: "{{ freescout_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

app_freescout__podman_name: 'freescout'
app_freescout__podman_image: 'ghcr.io/nfrastack/container-freescout'
app_freescout__podman_tag: "{{ app_freescout__version }}"

app_freescout__podman_home: "{{ app_freescout__home }}"

app_freescout__podman_container_default:
  name: "{{ app_freescout__podman_name }}"
  hostname: "{{ app_freescout__hostname }}"
  image: "{{ app_freescout__podman_image }}:{{ app_freescout__podman_tag }}"
  ip: "{{ app_freescout__ip }}"
  ipv6: "{{ app_freescout__ipv6 }}"
  network: "{{ app_freescout__network }}"
  timezone: "{{ app_freescout__timezone }}"
  environment:
    ADMIN_EMAIL: "{{ app_freescout__admin_email }}"
    ADMIN_FIRST_NAME: "{{ app_freescout__admin_first_name }}"
    ADMIN_LAST_NAME: "{{ app_freescout__admin_last_name }}"
    ENABLE_AUTO_UPDATE: "{{ app_freescout__enable_auto_update | ternary('TRUE', 'FALSE') }}"
    APP_URL: "{{ app_freescout__app_url }}"
    APP_TIMEZONE: "{{ app_freescout__timezone }}"
    DB_HOST: "{{ app_freescout__db_host }}"
    DB_PORT: "{{ app_freescout__db_port }}"
    DB_TYPE: "{{ app_freescout__db_type }}"
    DB_USER: "{{ app_freescout__db_user }}"
    DB_NAME: "{{ app_freescout__db_name }}"
    FREESCOUT_APP_TIMEZONE: "{{ app_freescout__timezone }}"
    FREESCOUT_MAIL_HOST: "{{ app_freescout__mail_host }}"
  labels: "{{ app_freescout__labels }}"
  secrets:
    - "freescout_admin_password,type=env,target=ADMIN_PASS"
    - "freescout_database_password,type=env,target=DB_PASS"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_freescout__home }}/data:/data"
    - "{{ app_freescout__home }}/logs:/logs"
