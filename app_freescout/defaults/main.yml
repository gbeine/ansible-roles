---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/freescout
#

app_freescout__home: "{{ freescout_home | mandatory }}"
app_freescout__ip: "{{ freescout_ip | mandatory }}"
app_freescout__ipv6: "{{ freescout_ipv6 }}"
app_freescout__network: "{{ freescout_network | mandatory }}"
app_freescout__hostname: "{{ freescout_hostname | mandatory }}"
app_freescout__timezone: "{{ freescout_timezone | mandatory }}"
app_freescout__labels: "{{ freescout_labels }}"

app_freescout__version: "{{ freescout_version | default('latest') }}"

# Files below /run/secrets in the container, referenced with <VARIABLE>_FILE in the environment
app_freescout__secrets: "{{ freescout_secrets | default([]) }}"

# The configuration of the image, FREESCOUT_<KEY> sets <KEY> in the .env file of FreeScout
app_freescout__environment: "{{ app_freescout__environment_default | combine(freescout_environment | default({})) }}"

app_freescout__container: "{{ app_freescout__podman_container_default | combine(freescout_container | default({})) }}"

app_freescout__autoupdate_enabled: "{{ freescout_autoupdate_enabled | default(false) }}"
app_freescout__autoupdate_schedule: "{{ freescout_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The passwords are read from the secrets freescout_admin_password and freescout_database_password
app_freescout__environment_default:
  TIMEZONE: "{{ app_freescout__timezone }}"
  ADMIN_PASS_FILE: '/run/secrets/freescout_admin_password'
  DB_PASS_FILE: '/run/secrets/freescout_database_password'

app_freescout__environment_required:
  - 'APP_URL'
  - 'ADMIN_EMAIL'
  - 'DB_HOST'
  - 'DB_NAME'
  - 'DB_USER'

# The variables of the image and the keys of FreeScout as FREESCOUT_<KEY>.
# Passwords are only allowed as <VARIABLE>_FILE referencing a secret.
# The keys of FreeScout are generated from config/*.php of FreeScout 1.8.250, update with new versions of the image,
# except the keys the image writes from its own variables (APP_URL, APP_TIMEZONE, APP_KEY, DB_*) and DB_TEST_*
app_freescout__environment_allowed:
  - 'TIMEZONE'
  - 'SETUP_TYPE'
  - 'ENABLE_AUTO_UPDATE'
  - 'ADMIN_EMAIL'
  - 'ADMIN_FIRST_NAME'
  - 'ADMIN_LAST_NAME'
  - 'ADMIN_PASS_FILE'
  - 'DB_TYPE'
  - 'DB_HOST'
  - 'DB_PORT'
  - 'DB_NAME'
  - 'DB_USER'
  - 'DB_PASS_FILE'
  - 'DB_SSL'
  - 'APP_URL'
  - 'APP_KEY_FILE'
  - 'SCHEDULER_TYPE'
