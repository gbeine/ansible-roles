app_freescout__secrets_allowed:
  - 'freescout_admin_password'
  - 'freescout_database_password'
  - 'freescout_app_key'
  - 'freescout_mail_password'
  - 'freescout_imap_password'

app_freescout__secrets_dir: '/run/secrets'

app_freescout__podman_name: 'freescout'
app_freescout__podman_image: 'ghcr.io/nfrastack/container-freescout'
app_freescout__podman_tag: "{{ app_freescout__version }}"

app_freescout__podman_home: "{{ app_freescout__home }}"

app_freescout__podman_data_dir: "{{ app_freescout__podman_home }}/data"
app_freescout__podman_logs_dir: "{{ app_freescout__podman_home }}/logs"

app_freescout__podman_container_default:
  name: "{{ app_freescout__podman_name }}"
  hostname: "{{ app_freescout__hostname }}"
  image: "{{ app_freescout__podman_image }}:{{ app_freescout__podman_tag }}"
  ip: "{{ app_freescout__ip }}"
  ipv6: "{{ app_freescout__ipv6 | default(omit) }}"
  network: "{{ app_freescout__network }}"
  timezone: "{{ app_freescout__timezone }}"
  # Set with freescout_environment, merged over the default
  environment: "{{ app_freescout__environment }}"
  labels: "{{ app_freescout__labels | default(omit) }}"
  secrets: >-
    {{ (app_freescout__secrets | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ app_freescout__secrets_dir ~ '/\1') | list)
      if (app_freescout__secrets | default([]) | length > 0)
      else omit }}
  # freescout_container.volumes replaces the list completely
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_freescout__podman_data_dir }}:/data"
    - "{{ app_freescout__podman_logs_dir }}:/logs"
