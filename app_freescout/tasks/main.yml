---

- name: 'Install FreeScout'
  tags: [ 'app', 'app_freescout' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or freescout_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - app_freescout__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - app_freescout__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_freescout__invalid | join('. ') }}"
        quiet: true
      vars:
        app_freescout__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = app_freescout__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('freescout_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('freescout_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of freescout_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - app_freescout__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_freescout__errors | join(' ') }}"
        quiet: true
      vars:
        app_freescout__secret_targets: "{{ app_freescout__secrets | map(attribute='target') | list }}"
        app_freescout__environment_missing: >-
          {{ app_freescout__environment_required
             | reject('in', app_freescout__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        app_freescout__secrets_missing: >-
          {{ app_freescout__secrets_required | reject('in', app_freescout__secret_targets) | list }}
        app_freescout__secrets_in_environment: >-
          {{ (app_freescout__secret_targets + app_freescout__secret_variables + app_freescout__secret_files.values() | list)
             | select('in', app_freescout__environment.keys() | list) | unique | list }}
        app_freescout__errors: >-
          {%- set errors = [] -%}
          {%- if app_freescout__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('FreeScout needs the environment variables ' ~ (app_freescout__environment_required | join(', ')) ~ ', missing or empty: ' ~ (app_freescout__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_freescout__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('FreeScout needs the secrets ' ~ (app_freescout__secrets_required | join(', ')) ~ ', missing: ' ~ (app_freescout__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_freescout__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets and their file variables must not be set in freescout_environment: ' ~ (app_freescout__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging freescout_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - app_freescout__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_freescout__errors | join(' ') }}"
        quiet: true
      vars:
        app_freescout__environment_unknown: >-
          {{ (app_freescout__container.environment | default({})).keys() | reject('in', app_freescout__environment_allowed) | list }}
        app_freescout__secrets_unknown: >-
          {{ app_freescout__secrets | map(attribute='target') | reject('in', app_freescout__secret_files.keys() | list) | list }}
        app_freescout__errors: >-
          {%- set errors = [] -%}
          {%- if app_freescout__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (app_freescout__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_freescout__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (app_freescout__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the variables of the image and the keys of FreeScout as FREESCOUT_<KEY> (app_freescout__environment_allowed) and the secrets ' ~ (app_freescout__secret_files.keys() | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
        state: 'directory'
      loop:
        - dest: "{{ app_freescout__podman_home }}"
          mode: '0700'
        - dest: "{{ app_freescout__podman_data_dir }}"
          mode: '0750'
        - dest: "{{ app_freescout__podman_logs_dir }}"
          mode: '0755'
      loop_control:
        label: "{{ item.dest }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ app_freescout__secrets }}"
      register: 'app_freescout__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_freescout__container.name }}"
        hostname: "{{ app_freescout__container.hostname }}"
        image: "{{ app_freescout__container.image }}"
        ip: "{{ app_freescout__container.ip }}"
        ip6: "{{ app_freescout__container.ipv6 | default(omit) }}"
        network: "{{ app_freescout__container.network }}"
        timezone: "{{ app_freescout__container.timezone }}"
        env: "{{ app_freescout__container.environment | default(omit) }}"
        etc_hosts: "{{ app_freescout__container.etc_hosts | default(omit) }}"
        expose: "{{ app_freescout__container.expose | default(omit) }}"
        label: "{{ app_freescout__container.labels | default(omit) }}"
        publish: "{{ app_freescout__container.publish | default(omit) }}"
        secrets: "{{ app_freescout__container.secrets | default(omit) }}"
        volume: "{{ app_freescout__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_freescout__container.requires is defined %}
          Requires={{ app_freescout__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'app_freescout__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ app_freescout__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if app_freescout__restart | bool else 'started' }}"
        enabled: true
      vars:
        app_freescout__running: >-
          {{ (ansible_facts.services[app_freescout__container.name + '.service'].state | default('')) == 'running' }}
        app_freescout__restart: >-
          {{ app_freescout__running | bool
             and (app_freescout__secrets_result is changed
                  or app_freescout__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'app_freescout__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_freescout__container.name }}"
        container_image: "{{ app_freescout__container.image }}"
        container_schedule: "{{ app_freescout__autoupdate_schedule }}"
