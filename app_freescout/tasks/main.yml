---

- name: 'Deploy FreeScout container'
  tags: [ 'app_freescout' ]
  block:

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0700') }}"
        state: 'directory'
      with_items:
        - dest: "{{ app_freescout__podman_home }}"
        - dest: "{{ app_freescout__podman_home }}/data"
          mode: '0750'
        - dest: "{{ app_freescout__podman_home }}/logs"
          mode: '0755'

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      with_items:
        - name: 'freescout_admin_password'
          data: "{{ app_freescout__admin_pass }}"
        - name: 'freescout_database_password'
          data: "{{ app_freescout__db_pass }}"

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ app_freescout__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[app_freescout__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ app_freescout__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_freescout__container.name }}"
        hostname: "{{ app_freescout__container.hostname }}"
        image: "{{ app_freescout__container.image }}"
        ip: "{{ app_freescout__container.ip }}"
        network: "{{ app_freescout__container.network }}"
        timezone: "{{ app_freescout__container.timezone }}"
        env: "{{ app_freescout__container.environment }}"
        label: "{{ app_freescout__container.labels }}"
        secrets: "{{ app_freescout__container.secrets }}"
        volume: "{{ app_freescout__container.volumes }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if app_freescout__container.requires is defined %}
          Requires={{ app_freescout__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'app_freescout__ipv6 | length == 0'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_freescout__container.name }}"
        hostname: "{{ app_freescout__container.hostname }}"
        image: "{{ app_freescout__container.image }}"
        ip: "{{ app_freescout__container.ip }}"
        ip6: "{{ app_freescout__container.ipv6 }}"
        network: "{{ app_freescout__container.network }}"
        timezone: "{{ app_freescout__container.timezone }}"
        env: "{{ app_freescout__container.environment }}"
        label: "{{ app_freescout__container.labels }}"
        secrets: "{{ app_freescout__container.secrets }}"
        volume: "{{ app_freescout__container.volumes }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if app_freescout__container.requires is defined %}
          Requires={{ app_freescout__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'app_freescout__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ app_freescout__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode | bool else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'app_freescout__autoupdate_enabled'
      include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_freescout__container.name }}"
        container_image: "{{ app_freescout__container.image }}"
