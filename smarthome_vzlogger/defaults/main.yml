---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/smarthome-vzlogger
#

smarthome_vzlogger__home: "{{ vzlogger_home | mandatory }}"
smarthome_vzlogger__ip: "{{ vzlogger_ip | mandatory }}"
smarthome_vzlogger__ipv6: "{{ vzlogger_ipv6 }}"
smarthome_vzlogger__network: "{{ vzlogger_network | mandatory }}"
smarthome_vzlogger__hostname: "{{ vzlogger_hostname | mandatory }}"
smarthome_vzlogger__timezone: "{{ vzlogger_timezone | mandatory }}"

smarthome_vzlogger__version: "{{ vzlogger_version | default('latest') }}"

smarthome_vzlogger__container: "{{ smarthome_vzlogger__container_default | combine(vzlogger_container | default({})) }}"

smarthome_vzlogger__config: "{{ vzlogger_config | mandatory }}"

#
# Defaults - do not change
#

smarthome_vzlogger__uid: 65534
smarthome_vzlogger__gid: 65534

smarthome_vzlogger__podman_name: 'vzlogger'
smarthome_vzlogger__podman_image: 'docker.io/gbeine/vzlogger'
smarthome_vzlogger__podman_tag: "{{ smarthome_vzlogger__version }}"

smarthome_vzlogger__podman_home: "{{ smarthome_vzlogger__home }}"

smarthome_vzlogger__container_default:
  name: "{{ smarthome_vzlogger__podman_name }}"
  hostname: "{{ smarthome_vzlogger__hostname }}"
  image: "{{ smarthome_vzlogger__podman_image }}:{{ smarthome_vzlogger__podman_tag }}"
  ip: "{{ smarthome_vzlogger__ip }}"
  ipv6: "{{ smarthome_vzlogger__ipv6 }}"
  network: "{{ smarthome_vzlogger__network }}"
  timezone: "{{ bootstrap_timezone__timezone }}"
  devices: []
  labels: {}
  publish: []
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ smarthome_vzlogger__podman_home }}/vzlogger.conf:/etc/vzlogger.conf:ro"
