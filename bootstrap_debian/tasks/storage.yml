---

- name: Mount storage devices
  ansible.posix.mount:
    src: "{{ item.disk }}"
    path: "{{ item.path }}"
    opts: "{{ item.options }}"
    fstype: "{{ item.fs }}"
    state: mounted
  loop: "{{ bootstrap_debian__storage }}"
  loop_control:
    label: "{{ item.path }}"

- name: Create bind mount source directories
  ansible.builtin.file:
    path: "{{ item.src }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('755') }}"
    state: directory
  loop: "{{ bootstrap_debian__mounts }}"
  loop_control:
    label: "{{ item.src }}"

- name: Create bind mount points
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('755') }}"
    state: directory
  loop: "{{ bootstrap_debian__mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount bind mounts
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    opts: "{{ item.options | default('rw,bind') }}"
    fstype: "{{ item.fs | default('none') }}"
    state: mounted
  loop: "{{ bootstrap_debian__mounts }}"
  loop_control:
    label: "{{ item.src }} -> {{ item.path }}"
