---

# Devices with noauto are mounted later, e.g. by systemd after cryptsetup opened them,
# the device may not exist yet, so they are only written to /etc/fstab
- name: Mount storage devices
  ansible.posix.mount:
    src: "{{ item.disk }}"
    path: "{{ item.path }}"
    opts: "{{ item.options }}"
    fstype: "{{ item.fs }}"
    state: "{{ 'present' if 'noauto' in (item.options | split(',')) else 'mounted' }}"
  loop: "{{ bootstrap_debian__storage }}"
  loop_control:
    label: "{{ item.path }}"
  register: bootstrap_debian__storage_result

# The fstab generator of systemd creates the mount units (e.g. mnt-storage.mount) only after a reload
- name: Reload systemd for the mount units of /etc/fstab
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: bootstrap_debian__storage_result is changed

- name: Create bind mount source directories
  ansible.builtin.file:
    path: "{{ item.src }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('755') }}"
    state: directory
  loop: "{{ bootstrap_debian__mounts }}"
  loop_control:
    label: "{{ item.src }}"

- name: Create bind mount points
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('755') }}"
    state: directory
  loop: "{{ bootstrap_debian__mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount bind mounts
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    opts: "{{ item.options | default('rw,bind') }}"
    fstype: "{{ item.fs | default('none') }}"
    state: mounted
  loop: "{{ bootstrap_debian__mounts }}"
  loop_control:
    label: "{{ item.src }} -> {{ item.path }}"
