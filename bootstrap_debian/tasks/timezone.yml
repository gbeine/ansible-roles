---

- name: Install timezone packages
  ansible.builtin.apt:
    cache_valid_time: "{{ bootstrap_debian__apt_cache_valid_time }}"
    install_recommends: false
    pkg: "{{ bootstrap_debian__timezone_packages }}"

- name: Generate timezone configuration
  ansible.builtin.copy:
    dest: '/etc/timezone'
    content: |
      {{ bootstrap_debian__timezone }}
    owner: 'root'
    group: 'root'
    mode: '644'

- name: Generate zoneinfo configuration
  ansible.builtin.file:
    src: "{{ bootstrap_debian__zoneinfo_dir }}/{{ bootstrap_debian__timezone }}"
    dest: '/etc/localtime'
    state: link
