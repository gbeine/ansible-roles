---

# The users of the dotfiles, their home and primary group, read before anything changes
- name: 'Read the users of the dotfiles'
  ansible.builtin.getent:
    database: 'passwd'

- name: 'Validate the dotfiles'
  ansible.builtin.assert:
    that:
      - bootstrap_debian__dotfiles_errors | length == 0
    # Only the failing checks are reported
    fail_msg: "{{ bootstrap_debian__dotfiles_errors | join(' ') }}"
    quiet: true
  vars:
    bootstrap_debian__dotfiles_errors: >-
      {%- set errors = [] -%}
      {%- set dotfiles = bootstrap_debian__dotfiles -%}
      {%- if dotfiles is not sequence or dotfiles is string or dotfiles is mapping -%}
      {%-   set _ = errors.append('debian_dotfiles has to be a list of names or dictionaries.') -%}
      {%- else -%}
      {%-   set invalid = dotfiles | reject('string') | reject('mapping') | list
                          + dotfiles | select('mapping') | rejectattr('name', 'defined') | list -%}
      {%-   if invalid | length > 0 -%}
      {%-     set _ = errors.append('The entries of debian_dotfiles are names or dictionaries with name: ' ~ (invalid | map('to_json') | join(', ')) ~ '.') -%}
      {%-   endif -%}
      {%-   set ns = namespace(unknown=[]) -%}
      {%-   for item in dotfiles | select('mapping') -%}
      {%-     set ns.unknown = ns.unknown + (item.keys() | map('string') | reject('in', bootstrap_debian__dotfiles_keys) | list) -%}
      {%-   endfor -%}
      {%-   if ns.unknown | length > 0 -%}
      {%-     set _ = errors.append('Unknown keys in debian_dotfiles: ' ~ (ns.unknown | unique | join(', ')) ~ ', allowed are ' ~ (bootstrap_debian__dotfiles_keys | join(', ')) ~ '.') -%}
      {%-   endif -%}
      {%-   set entries = bootstrap_debian__dotfiles_entries -%}
      {%-   set names = entries | map(attribute='name') | reject('match', bootstrap_debian__dotfiles_name_pattern) | list -%}
      {%-   if names | length > 0 -%}
      {%-     set _ = errors.append('The names of debian_dotfiles consist of letters, digits, _, . and - without a leading dot: ' ~ (names | join(', ')) ~ '.') -%}
      {%-   endif -%}
      {%-   set missing = entries | map(attribute='name') | select('match', bootstrap_debian__dotfiles_name_pattern)
                          | reject('in', entries | map(attribute='name') | select('match', bootstrap_debian__dotfiles_name_pattern)
                                          | map('regex_replace', '^', bootstrap_debian__dotfiles_dir ~ '/') | select('file')
                                          | map('basename') | list) | unique | list -%}
      {%-   if missing | length > 0 -%}
      {%-     set _ = errors.append('The files of debian_dotfiles do not exist in ' ~ bootstrap_debian__dotfiles_dir ~ ': ' ~ (missing | join(', ')) ~ '.') -%}
      {%-   endif -%}
      {%-   set users = entries | map(attribute='user') | reject('in', bootstrap_debian__dotfiles_users.keys() | list) | unique | list -%}
      {%-   if users | length > 0 -%}
      {%-     set _ = errors.append('The users of debian_dotfiles do not exist: ' ~ (users | join(', ')) ~ '.') -%}
      {%-   endif -%}
      {%-   set dests = entries | map(attribute='dest') | reject('match', '^/[^\n\r]*\Z') | list -%}
      {%-   if dests | length > 0 -%}
      {%-     set _ = errors.append('The targets of debian_dotfiles have to be absolute paths: ' ~ (dests | join(', ')) ~ '.') -%}
      {%-   endif -%}
      {%-   set accounts = (entries | map(attribute='owner') | list + entries | map(attribute='group') | list)
                           | reject('match', '^[A-Za-z0-9_][A-Za-z0-9_.-]*[$]?$') | unique | list -%}
      {%-   if accounts | length > 0 -%}
      {%-     set _ = errors.append('The owners and groups of debian_dotfiles are names or numbers: ' ~ (accounts | join(', ')) ~ '.') -%}
      {%-   endif -%}
      {%-   set modes = entries | rejectattr('mode', 'string') | map(attribute='name') | list
                        + entries | selectattr('mode', 'string') | rejectattr('mode', 'match', '^[0-7]{3,4}$') | map(attribute='name') | list -%}
      {%-   if modes | length > 0 -%}
      {%-     set _ = errors.append('The modes of debian_dotfiles are strings of three or four octal digits, e.g. 0644: ' ~ (modes | join(', ')) ~ '.') -%}
      {%-   endif -%}
      {%-   set targets = entries | map(attribute='dest') | list -%}
      {%-   set ns2 = namespace(seen=[], dup=[]) -%}
      {%-   for target in targets -%}
      {%-     if target in ns2.seen -%}{%- set ns2.dup = ns2.dup + [ target ] -%}{%- endif -%}
      {%-     set ns2.seen = ns2.seen + [ target ] -%}
      {%-   endfor -%}
      {%-   if ns2.dup | length > 0 -%}
      {%-     set _ = errors.append('The targets of debian_dotfiles have to be unique: ' ~ (ns2.dup | unique | join(', ')) ~ '.') -%}
      {%-   endif -%}
      {%- endif -%}
      {{ errors }}
