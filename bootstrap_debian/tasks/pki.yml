---

- name: Install PKI packages
  ansible.builtin.apt:
    cache_valid_time: "{{ bootstrap_debian__apt_cache_valid_time }}"
    install_recommends: false
    pkg: "{{ bootstrap_debian__pki_packages }}"

- name: Copy CA certificates of the site
  ansible.builtin.copy:
    src: "{{ bootstrap_debian__pki_ca_certificates_src_dir }}/{{ item }}"
    dest: "{{ bootstrap_debian__pki_ca_certificates_dir }}/{{ item }}"
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop: "{{ bootstrap_debian__pki_ca_certificates }}"
  register: 'bootstrap_debian__ca_certificates_result'

- name: Update the CA certificates
  ansible.builtin.command: 'update-ca-certificates'
  changed_when: true
  when: bootstrap_debian__ca_certificates_result is changed
