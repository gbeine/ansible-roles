---

- name: Generate /etc/hostname
  ansible.builtin.copy:
    dest: '/etc/hostname'
    content: |
      {{ bootstrap_debian__hostname | hostname_short }}
    owner: 'root'
    group: 'root'
    mode: '644'

- name: Generate /etc/hosts
  ansible.builtin.template:
    src: 'hosts.j2'
    dest: '/etc/hosts'
    owner: 'root'
    group: 'root'
    mode: '644'

- name: Check if cloud config is used
  ansible.builtin.stat:
    path: '/etc/cloud/cloud.cfg'
  register: bootstrap_debian__cloud_cfg

- name: Generate cloud-init hosts configuration
  ansible.builtin.template:
    src: 'manage_etc_hosts.cfg.j2'
    dest: '/etc/cloud/cloud.cfg.d/99-manage_etc_hosts.cfg'
    owner: 'root'
    group: 'root'
    mode: '644'
  when: bootstrap_debian__cloud_cfg.stat.exists
