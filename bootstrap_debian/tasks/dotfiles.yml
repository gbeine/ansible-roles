---

- name: 'Copy the dotfiles'
  ansible.builtin.copy:
    src: "{{ bootstrap_debian__dotfiles_dir }}/{{ item.name }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ bootstrap_debian__dotfiles_entries }}"
  loop_control:
    label: "{{ item.dest }}"
