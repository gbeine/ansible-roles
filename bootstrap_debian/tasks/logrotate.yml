---

- name: Install logrotate packages
  ansible.builtin.apt:
    cache_valid_time: "{{ bootstrap_debian__apt_cache_valid_time }}"
    install_recommends: false
    pkg: "{{ bootstrap_debian__logrotate_packages }}"

- name: Generate logrotate main configuration
  ansible.builtin.template:
    src: 'logrotate.conf.j2'
    dest: '/etc/logrotate.conf'
    owner: 'root'
    group: 'root'
    mode: '644'

- name: Generate logrotate configuration files
  ansible.builtin.template:
    src: 'logrotate.j2'
    dest: "{{ bootstrap_debian__logrotate_etc_dir }}/{{ item.name }}"
    owner: 'root'
    group: 'root'
    mode: '640'
  loop: "{{ bootstrap_debian__logrotate_files }}"
  loop_control:
    label: "{{ item.name }}"
