---

- name: Bootstrap Debian
  tags: [ bootstrap, bootstrap_debian ]
  block:

    - name: Include OS-specific variables
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"

    - name: Update package lists
      ansible.builtin.command: apt-get update
      changed_when: false
      check_mode: false

    - name: Install apt related packages
      ansible.builtin.apt:
        install_recommends: false
        pkg: "{{ bootstrap_debian__apt_packages }}"

    - name: Configure repositories
      ansible.builtin.import_tasks: repositories.yml

    - name: Configure storage
      ansible.builtin.include_tasks: storage.yml
      when: (bootstrap_debian__storage + bootstrap_debian__mounts) | length > 0

    - name: Configure timezone
      ansible.builtin.import_tasks: timezone.yml

    - name: Configure hostname and hosts
      ansible.builtin.import_tasks: hosts.yml

    - name: Install packages
      ansible.builtin.import_tasks: packages.yml

    - name: Configure network interfaces
      ansible.builtin.include_tasks: networking.yml
      when: bootstrap_debian__networking_enable | bool

    - name: Create accounts
      ansible.builtin.include_tasks: accounts.yml
      when: (bootstrap_debian__groups + bootstrap_debian__users) | length > 0

    - name: Configure logrotate
      ansible.builtin.include_tasks: logrotate.yml
      when: bootstrap_debian__logrotate_enable | bool

    - name: Configure unattended upgrades
      ansible.builtin.include_tasks: unattended_upgrades.yml
      when: bootstrap_debian__unattended_upgrades_enable | bool
