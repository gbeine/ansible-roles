---

- name: Generate interfaces configuration
  ansible.builtin.template:
    src: 'interfaces.j2'
    dest: "{{ bootstrap_debian__network_interfaces_file }}"
    owner: 'root'
    group: 'root'
    mode: '644'

- name: Generate additional interfaces configuration
  ansible.builtin.template:
    src: 'interface.j2'
    dest: "{{ bootstrap_debian__network_interfaces_dir }}/{{ item['priority'] }}-{{ item['name'] | default(item['interface']) }}"
    owner: 'root'
    group: 'root'
    mode: '644'
  loop: "{{ bootstrap_debian__network_interfaces }}"
  loop_control:
    label: "{{ item['interface'] }}"
  register: bootstrap_debian__network_interfaces_result

- name: Bring changed interfaces up
  ansible.builtin.command: "ifup '{{ item.item.interface }}'"
  loop: "{{ bootstrap_debian__network_interfaces_result.results | select('changed') | list }}"
  loop_control:
    label: "{{ item.item.interface }}"
  changed_when: true
  when: not ansible_check_mode
