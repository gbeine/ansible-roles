---

- name: Install unattended upgrades packages
  ansible.builtin.apt:
    cache_valid_time: "{{ bootstrap_debian__apt_cache_valid_time }}"
    install_recommends: false
    pkg: "{{ bootstrap_debian__unattended_upgrades_packages }}"

- name: Generate unattended upgrades configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: 'root'
    group: 'root'
    mode: '644'
  loop:
    - src: '50unattended-upgrades.j2'
      dest: "{{ bootstrap_debian__apt_conf_dir }}/50unattended-upgrades"
    - src: '20auto-upgrades.j2'
      dest: "{{ bootstrap_debian__apt_conf_dir }}/20auto-upgrades"
  loop_control:
    label: "{{ item.dest }}"
