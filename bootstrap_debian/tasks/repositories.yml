---

- name: Add repositories
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: "{{ item.types | default('deb') }}"
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components | default(omit) }}"
    signed_by: "{{ item.signed_by | default(omit) }}"
    architectures: "{{ item.architectures | default(omit) }}"
    enabled: "{{ item.enabled | default(true) }}"
    state: present
  loop: "{{ bootstrap_debian__repositories }}"
  loop_control:
    label: "{{ item.name }}"
  register: bootstrap_debian__repositories_result

- name: Update package cache
  ansible.builtin.apt:
    update_cache: true
  when: bootstrap_debian__repositories_result is changed
