---

- name: Install essential, additional and host specific packages
  ansible.builtin.apt:
    cache_valid_time: "{{ bootstrap_debian__apt_cache_valid_time }}"
    install_recommends: false
    pkg: "{{ (bootstrap_debian__packages_essential + bootstrap_debian__packages_additional + bootstrap_debian__packages) | unique }}"

- name: Copy local packages to host
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ bootstrap_debian__local_packages_dir }}/{{ item | basename }}"
    owner: 'root'
    group: 'root'
    mode: '644'
  loop: "{{ bootstrap_debian__local_packages }}"

- name: Install local packages
  ansible.builtin.apt:
    deb: "{{ bootstrap_debian__local_packages_dir }}/{{ item | basename }}"
    install_recommends: false
  loop: "{{ bootstrap_debian__local_packages }}"
