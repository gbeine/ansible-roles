---

bootstrap_debian__repositories_default:
  - name: 'debian'
    types: 'deb'
    uris: 'http://deb.debian.org/debian'
    suites:
      - 'trixie'
      - 'trixie-updates'
    components:
      - 'main'
      - 'contrib'
      - 'non-free-firmware'
  - name: 'debian-security'
    types: 'deb'
    uris: 'http://security.debian.org/debian-security'
    suites:
      - 'trixie-security'
    components:
      - 'main'
      - 'contrib'
      - 'non-free-firmware'

bootstrap_debian__packages_essential:
  - 'apt'
  - 'base-files'
  - 'base-passwd'
  - 'bash'
  - 'bsdutils'
  - 'coreutils'
  - 'dash'
  - 'debianutils'
  - 'diffutils'
  - 'dpkg'
  - 'findutils'
  - 'grep'
  - 'gzip'
  - 'hostname'
  - 'ifupdown'
  - 'init-system-helpers'
  - 'libc-bin'
  - 'login'
  - 'ncurses-base'
  - 'ncurses-bin'
  - 'perl-base'
  - 'sed'
  - 'sysvinit-utils'
  - 'tar'
  - 'util-linux'

bootstrap_debian__packages_additional:
  - 'curl'
  - 'dns-root-data'
  - 'gpg-agent'
  - 'gpg'
  - 'htop'
  - 'iso-codes'
  - 'libglib2.0-data'
  - 'libsecret-tools'
  - 'lz4'
  - 'lzop'
  - 'mailcap'
  - 'mc'
  - 'mmv'
  - 'pass'
  - 'perl'
  - 'pinentry-tty'
  - 'psmisc'
  - 'pv'
  - 'python3-pyasyncore'
  - 'python3-setuptools'
  - 'rclone'
  - 'rsync'
  - 'screen'
  - 'shared-mime-info'
  - 'sqlite3'
  - 'sudo'
  - 'sysstat'
  - 'tcpdump'
  - 'telnet'
  - 'unzip'
  - 'wget'
  - 'whois'
  - 'zip'
