---

bootstrap_debian__repositories_default:
  - name: 'debian'
    types: 'deb'
    uris: 'http://deb.debian.org/debian'
    suites:
      - 'bookworm'
      - 'bookworm-updates'
    components:
      - 'main'
      - 'contrib'
      - 'non-free-firmware'
  - name: 'debian-security'
    types: 'deb'
    uris: 'http://security.debian.org/debian-security'
    suites:
      - 'bookworm-security'
    components:
      - 'main'
      - 'contrib'
      - 'non-free-firmware'

bootstrap_debian__packages_essential:
  - 'apt'
  - 'base-files'
  - 'base-passwd'
  - 'bash'
  - 'bsdutils'
  - 'coreutils'
  - 'dash'
  - 'debianutils'
  - 'diffutils'
  - 'dpkg'
  - 'findutils'
  - 'grep'
  - 'gzip'
  - 'hostname'
  - 'ifupdown'
  - 'init-system-helpers'
  - 'libc-bin'
  - 'login'
  - 'ncurses-base'
  - 'ncurses-bin'
  - 'perl-base'
  - 'sed'
  - 'sysvinit-utils'
  - 'tar'
  - 'util-linux'

bootstrap_debian__packages_additional:
  - 'acl'
  - 'bzip2'
  - 'dns-root-data'
  - 'file'
  - 'gpg-agent'
  - 'gpg'
  - 'htop'
  - 'iso-codes'
  - 'libglib2.0-data'
  - 'libterm-readkey-perl'
  - 'lsb-release'
  - 'lsof'
  - 'mailcap'
  - 'mc'
  - 'mmv'
  - 'net-tools'
  - 'pass'
  - 'perl'
  - 'pinentry-tty'
  - 'psmisc'
  - 'pv'
  - 'python-is-python3'
  - 'python3-tz'
  - 'rclone'
  - 'renameutils'
  - 'rsync'
  - 'screen'
  - 'shared-mime-info'
  - 'sqlite3'
  - 'strace'
  - 'sudo'
  - 'sysstat'
  - 'tcpdump'
  - 'telnet'
  - 'unzip'
