---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    bootstrap_debian__test_case: "{{ bootstrap_debian__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    bootstrap_debian__expect: "{{ bootstrap_debian__test_case.expect }}"

  tasks:

    - name: 'Verify hostname and hosts'
      block:

        - name: 'Read /etc/hostname and /etc/hosts'
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop:
            - '/etc/hostname'
            - '/etc/hosts'
          register: 'bootstrap_debian__test_hosts'

        - name: 'Assert hostname and hosts'
          ansible.builtin.assert:
            that:
              - (bootstrap_debian__test_hosts.results[0].content | b64decode | trim) == bootstrap_debian__expect.hostname_short
              - >-
                not bootstrap_debian__expect.etc_hosts_managed
                or ('127.0.1.1 ' + bootstrap_debian__expect.hostname) in bootstrap_debian__test_etc_hosts
              - >-
                not bootstrap_debian__expect.etc_hosts_managed
                or ('127.0.1.1 ' + bootstrap_debian__expect.hostname_short) in bootstrap_debian__test_etc_hosts
              - >-
                bootstrap_debian__expect.etc_hosts_managed
                or lookup('ansible.builtin.config', 'DEFAULT_MANAGED_STR') not in bootstrap_debian__test_etc_hosts
            fail_msg: "/etc/hosts: {{ bootstrap_debian__test_etc_hosts }}"
          vars:
            bootstrap_debian__test_etc_hosts: "{{ bootstrap_debian__test_hosts.results[1].content | b64decode }}"

        - name: 'Check if cloud config is used'
          ansible.builtin.stat:
            path: '/etc/cloud/cloud.cfg'
          register: 'bootstrap_debian__test_cloud_cfg'

        - name: 'Read the cloud-init hosts configuration'
          ansible.builtin.slurp:
            src: '/etc/cloud/cloud.cfg.d/99-manage_etc_hosts.cfg'
          register: 'bootstrap_debian__test_cloud_hosts'
          when: bootstrap_debian__test_cloud_cfg.stat.exists

        - name: 'Assert the cloud-init hosts configuration'
          ansible.builtin.assert:
            that:
              - >-
                ('manage_etc_hosts: ' + ('False' if bootstrap_debian__expect.etc_hosts_managed else 'True'))
                in (bootstrap_debian__test_cloud_hosts.content | b64decode)
            fail_msg: "cloud-init: {{ bootstrap_debian__test_cloud_hosts.content | b64decode }}"
          when: bootstrap_debian__test_cloud_cfg.stat.exists

    - name: 'Verify PKI and the root forward'
      block:

        - name: 'Read the fingerprints of the CA certificates of the site'
          ansible.builtin.command:
            argv: [ 'openssl', 'x509', '-noout', '-fingerprint', '-sha256', '-in', "/usr/local/share/ca-certificates/{{ item }}" ]
          loop: "{{ bootstrap_debian__expect.ca_certificates }}"
          register: 'bootstrap_debian__test_ca_fingerprints'
          changed_when: false

        - name: 'Read the fingerprints of the CA bundle'
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              tmp=$(mktemp -d)
              && awk -v d="$tmp" '/BEGIN CERTIFICATE/{c++} {print > (d "/" c ".pem")}' /etc/ssl/certs/ca-certificates.crt
              && for f in "$tmp"/*.pem; do openssl x509 -noout -fingerprint -sha256 -in "$f"; done;
              rm -rf "$tmp"
            executable: '/bin/bash'
          register: 'bootstrap_debian__test_bundle'
          changed_when: false
          when: bootstrap_debian__expect.ca_certificates | length > 0

        - name: 'Assert the CA certificates of the site are trusted'
          ansible.builtin.assert:
            that:
              - item.stdout in bootstrap_debian__test_bundle.stdout_lines
            fail_msg: "{{ item.item }} is not in /etc/ssl/certs/ca-certificates.crt"
            quiet: true
          loop: "{{ bootstrap_debian__test_ca_fingerprints.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: 'Read the state of /root/.forward'
          ansible.builtin.stat:
            path: '/root/.forward'
          register: 'bootstrap_debian__test_forward_stat'

        - name: 'Read /root/.forward'
          ansible.builtin.slurp:
            src: '/root/.forward'
          register: 'bootstrap_debian__test_forward'
          when: bootstrap_debian__test_forward_stat.stat.exists

        - name: 'Assert /root/.forward'
          ansible.builtin.assert:
            that:
              - bootstrap_debian__test_forward_stat.stat.exists == (bootstrap_debian__expect.root_forward | length > 0)
              - >-
                not bootstrap_debian__test_forward_stat.stat.exists
                or (bootstrap_debian__test_forward.content | b64decode | trim) == bootstrap_debian__expect.root_forward
            fail_msg: "/root/.forward exists: {{ bootstrap_debian__test_forward_stat.stat.exists }}"

        - name: 'Gather the package facts for the PKI packages'
          ansible.builtin.package_facts:
          when: bootstrap_debian__expect.ca_certificates | length > 0

        - name: 'Assert the PKI packages are installed'
          ansible.builtin.assert:
            that:
              - "'ca-certificates' in ansible_facts.packages"
              - "'ssl-cert' in ansible_facts.packages"
              - "'openssl' in ansible_facts.packages"
          when: bootstrap_debian__expect.ca_certificates | length > 0

    - name: 'Verify timezone'
      block:

        - name: 'Read /etc/timezone'
          ansible.builtin.slurp:
            src: '/etc/timezone'
          register: 'bootstrap_debian__test_timezone'

        - name: 'Read /etc/localtime'
          ansible.builtin.stat:
            path: '/etc/localtime'
          register: 'bootstrap_debian__test_localtime'

        - name: 'Assert timezone'
          ansible.builtin.assert:
            that:
              - (bootstrap_debian__test_timezone.content | b64decode | trim) == bootstrap_debian__expect.timezone
              - bootstrap_debian__test_localtime.stat.islnk
              - bootstrap_debian__test_localtime.stat.lnk_target == '/usr/share/zoneinfo/' + bootstrap_debian__expect.timezone

    - name: 'Verify repositories'
      block:

        - name: 'Check repository files'
          ansible.builtin.stat:
            path: "/etc/apt/sources.list.d/{{ item }}.sources"
          loop: "{{ bootstrap_debian__expect.repositories }}"
          register: 'bootstrap_debian__test_repositories'

        - name: 'Assert repository files exist'
          ansible.builtin.assert:
            that:
              - bootstrap_debian__test_repositories.results | map(attribute='stat.exists') | min

        - name: 'Check the repository files that are not configured'
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: "{{ bootstrap_debian__test_stale_sources }}"
          register: 'bootstrap_debian__test_stale'

        - name: 'Find all repository files'
          ansible.builtin.find:
            paths: '/etc/apt/sources.list.d'
            patterns: [ '*.sources', '*.list' ]
          register: 'bootstrap_debian__test_sources'

        - name: 'Assert the repository files that are not configured are removed or kept'
          ansible.builtin.assert:
            that:
              - >-
                bootstrap_debian__test_stale.results | selectattr('stat.exists') | list | length
                == (0 if bootstrap_debian__expect.stale_sources_removed else bootstrap_debian__test_stale_sources | length)
              - >-
                not bootstrap_debian__expect.stale_sources_removed
                or (bootstrap_debian__test_sources.files | map(attribute='path') | map('basename') | sort)
                   == (bootstrap_debian__expect.repositories | map('regex_replace', '$', '.sources') | sort)
            fail_msg: >-
              Existing: {{ bootstrap_debian__test_stale.results | selectattr('stat.exists') | map(attribute='item') | join(', ') }},
              files: {{ bootstrap_debian__test_sources.files | map(attribute='path') | map('basename') | sort | join(', ') }}

    - name: 'Verify packages'
      block:

        - name: 'Gather package facts'
          ansible.builtin.package_facts:

        - name: 'Assert packages are installed'
          ansible.builtin.assert:
            that:
              - item in ansible_facts.packages
            quiet: true
          loop: "{{ bootstrap_debian__expect.packages }}"

    - name: 'Verify storage'
      when: bootstrap_debian__expect.storage is defined
      block:

        - name: 'Read the storage mount'
          ansible.builtin.command: "findmnt -n -o SOURCE,FSTYPE '{{ bootstrap_debian__expect.storage.path }}'"
          register: 'bootstrap_debian__test_findmnt'
          changed_when: false

        - name: 'Assert the storage mount'
          ansible.builtin.assert:
            that:
              - bootstrap_debian__test_findmnt.stdout.split() == [ bootstrap_debian__expect.storage.disk, bootstrap_debian__expect.storage.fs ]

        - name: 'Write a file to the bind mount source'
          ansible.builtin.copy:
            content: "{{ inventory_hostname }}\n"
            dest: "{{ bootstrap_debian__expect.storage.bind_src }}/molecule.txt"
            mode: '644'

        - name: 'Read the file from the bind mount'
          ansible.builtin.slurp:
            src: "{{ bootstrap_debian__expect.storage.bind_path }}/molecule.txt"
          register: 'bootstrap_debian__test_bind'

        - name: 'Assert the bind mount'
          ansible.builtin.assert:
            that:
              - (bootstrap_debian__test_bind.content | b64decode | trim) == inventory_hostname

    - name: 'Verify networking'
      when: bootstrap_debian__expect.networking is defined
      block:

        - name: 'Read the interface addresses'
          ansible.builtin.command: "ip -4 -o addr show '{{ bootstrap_debian__expect.networking.interface }}'"
          register: 'bootstrap_debian__test_ip'
          changed_when: false

        - name: 'Assert the interface address'
          ansible.builtin.assert:
            that:
              - ('inet ' + bootstrap_debian__expect.networking.address + ' ') in bootstrap_debian__test_ip.stdout

    - name: 'Verify accounts'
      when: bootstrap_debian__expect.accounts is defined
      block:

        - name: 'Read groups and users'
          ansible.builtin.getent:
            database: "{{ item }}"
          loop:
            - 'group'
            - 'passwd'

        - name: 'Assert group and user'
          ansible.builtin.assert:
            that:
              - (ansible_facts.getent_group[bootstrap_debian__expect.accounts.group][1] | int) == bootstrap_debian__expect.accounts.gid
              - (ansible_facts.getent_passwd[bootstrap_debian__expect.accounts.user][1] | int) == bootstrap_debian__expect.accounts.uid
              - (ansible_facts.getent_passwd[bootstrap_debian__expect.accounts.user][2] | int) == bootstrap_debian__expect.accounts.gid
              - ansible_facts.getent_passwd[bootstrap_debian__expect.accounts.user][5] == bootstrap_debian__expect.accounts.shell

    - name: 'Verify logrotate'
      when: bootstrap_debian__expect.logrotate is defined
      block:

        - name: 'Check the logrotate file'
          ansible.builtin.stat:
            path: "{{ bootstrap_debian__expect.logrotate.file }}"
          register: 'bootstrap_debian__test_logrotate_file'

        - name: 'Assert the logrotate file'
          ansible.builtin.assert:
            that:
              - bootstrap_debian__test_logrotate_file.stat.exists
              - bootstrap_debian__test_logrotate_file.stat.mode == '0640'

        - name: 'Check the logrotate configuration'
          ansible.builtin.command: 'logrotate -d /etc/logrotate.conf'
          changed_when: false

    - name: 'Verify unattended upgrades'
      when: bootstrap_debian__expect.unattended_upgrades is defined
      block:

        - name: 'Read the apt configuration'
          ansible.builtin.command: 'apt-config dump'
          register: 'bootstrap_debian__test_apt_config'
          changed_when: false

        - name: 'Assert the unattended upgrades configuration'
          ansible.builtin.assert:
            that:
              - ('APT::Periodic::Unattended-Upgrade "1";') in bootstrap_debian__test_apt_config.stdout_lines
              - ('Unattended-Upgrade::Mail "' + bootstrap_debian__expect.unattended_upgrades.mail + '";') in bootstrap_debian__test_apt_config.stdout_lines

    - name: 'Verify mail'
      when: bootstrap_debian__expect.mail is defined
      block:

        - name: 'Read the msmtp configuration and the aliases'
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop:
            - '/etc/msmtprc'
            - '/etc/aliases'
          register: 'bootstrap_debian__test_mail_files'

        - name: 'Read the mode of the msmtp configuration'
          ansible.builtin.stat:
            path: '/etc/msmtprc'
          register: 'bootstrap_debian__test_msmtprc'

        - name: 'Assert the msmtp configuration and the aliases'
          ansible.builtin.assert:
            that:
              - bootstrap_debian__test_msmtprc.stat.mode == bootstrap_debian__expect.mail.config_mode
              - bootstrap_debian__test_msmtprc.stat.pw_name == 'root'
              - >-
                ('account default : ' + bootstrap_debian__expect.mail.default_account) in bootstrap_debian__test_msmtprc_lines
              - >-
                bootstrap_debian__test_msmtprc_lines | select('match', '^account [^d]') | map('regex_replace', '^account ', '') | list
                == bootstrap_debian__expect.mail.accounts
              - "'aliases /etc/aliases' in bootstrap_debian__test_msmtprc_lines"
              - >-
                ('root: ' + bootstrap_debian__expect.mail.alias_root) in bootstrap_debian__test_aliases_lines
            quiet: true
          vars:
            bootstrap_debian__test_msmtprc_lines: "{{ (bootstrap_debian__test_mail_files.results[0].content | b64decode).splitlines() }}"
            bootstrap_debian__test_aliases_lines: "{{ (bootstrap_debian__test_mail_files.results[1].content | b64decode).splitlines() }}"

        - name: 'Read the sendmail binary'
          ansible.builtin.command: 'readlink -f /usr/sbin/sendmail'
          register: 'bootstrap_debian__test_sendmail'
          changed_when: false

        - name: 'Assert sendmail is msmtp'
          ansible.builtin.assert:
            that:
              - bootstrap_debian__test_sendmail.stdout is search('msmtp')
            fail_msg: "{{ bootstrap_debian__test_sendmail.stdout }}"

        - name: 'Choose a unique subject for the test mail'
          ansible.builtin.set_fact:
            bootstrap_debian__test_mail_subject: "molecule-mail-{{ now(utc=true).strftime('%Y%m%d%H%M%S') }}"

        - name: 'Send a mail to root'
          ansible.builtin.shell: "echo 'molecule test' | mail -s '{{ bootstrap_debian__test_mail_subject }}' root"
          changed_when: false

        - name: 'Read the journal of the SMTP sink'
          ansible.builtin.command: 'journalctl -u molecule-smtp-sink --no-pager'
          register: 'bootstrap_debian__test_sink_journal'
          changed_when: false
          until: bootstrap_debian__test_mail_subject in bootstrap_debian__test_sink_journal.stdout
          retries: 10
          delay: 2

        - name: 'Assert the mail was delivered to the SMTP sink'
          ansible.builtin.assert:
            that:
              - bootstrap_debian__test_mail_subject in bootstrap_debian__test_sink_journal.stdout
            fail_msg: "{{ bootstrap_debian__test_sink_journal.stdout_lines[-40:] }}"

        # The sink does not log envelope recipients, the SMTP dialog of msmtp shows the alias
        - name: 'Send a mail to root with msmtp in verbose mode'
          ansible.builtin.shell: >-
            printf 'Subject: {{ bootstrap_debian__test_mail_subject }}-alias\n\nmolecule alias test\n'
            | msmtp -v root
          register: 'bootstrap_debian__test_msmtp_verbose'
          changed_when: false
          failed_when: false

        - name: 'Assert msmtp delivered the mail to the alias of root'
          ansible.builtin.assert:
            that:
              - bootstrap_debian__test_msmtp_verbose.rc == 0
              - >-
                ('RCPT TO:<' + bootstrap_debian__expect.mail.alias_root + '>')
                in (bootstrap_debian__test_msmtp_verbose.stdout + bootstrap_debian__test_msmtp_verbose.stderr)
            fail_msg: "{{ (bootstrap_debian__test_msmtp_verbose.stdout_lines + bootstrap_debian__test_msmtp_verbose.stderr_lines)[-30:] }}"
