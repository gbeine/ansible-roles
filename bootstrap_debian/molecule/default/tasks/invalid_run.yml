---
# Runs bootstrap_debian with the invalid role variables passed as include parameters,
# the role has to fail before the files of sshd_config.d and ssh_config.d change.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run bootstrap_debian with invalid variables (expect ERROR): {{ bootstrap_debian__test_invalid.message }}"
  block:

    - name: 'Run bootstrap_debian, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'bootstrap_debian'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ bootstrap_debian__test_invalid.message }}"

  rescue:

    - name: 'Read the checksums of the checked files after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ bootstrap_debian__test_checked_files }}"
      register: 'bootstrap_debian__test_md5_after'

    - name: 'Assert the run failed before the checked files changed'
      ansible.builtin.assert:
        that:
          - bootstrap_debian__test_failure is search(bootstrap_debian__test_invalid.search, multiline=true)
          - bootstrap_debian__test_before | select('equalto', '') | list | length == 0
          - bootstrap_debian__test_after == bootstrap_debian__test_before
        fail_msg: >-
          Failure: {{ bootstrap_debian__test_failure }}
          Checksums before: {{ bootstrap_debian__test_before | join(', ') }},
          after: {{ bootstrap_debian__test_after | join(', ') }}.
      vars:
        # Double quotes, so \n is a line break for the anchors of the searches
        bootstrap_debian__test_failure: "{{ [ ansible_failed_result.msg | default(''), ansible_failed_result.stderr | default('') ] | join('\n') }}"
        bootstrap_debian__test_before: "{{ bootstrap_debian__test_md5_before.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
        bootstrap_debian__test_after: "{{ bootstrap_debian__test_md5_after.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
