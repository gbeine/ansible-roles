---
# Repository files created in prepare.yml, the role removes them unless debian_repositories_prune is false
bootstrap_debian__test_stale_sources:
  - '/etc/apt/sources.list.d/molecule-stale.sources'
  - '/etc/apt/sources.list.d/molecule-stale.list'
  - '/etc/apt/sources.list'

bootstrap_debian__test_cases:

  - name: 'molecule-bootstrap-debian-minimal'
    role_vars:
      debian_hostname: 'molecule-minimal.example.org'
    expect:
      hostname: 'molecule-minimal.example.org'
      hostname_short: 'molecule-minimal'
      etc_hosts_managed: true
      stale_sources_removed: true
      timezone: 'Etc/UTC'
      repositories:
        - 'debian'
        - 'debian-security'
      packages:
        - 'htop'
        - 'ifupdown'
        - 'python3-apt'
        - 'python3-debian'
        - 'sudo'
        - 'tzdata'

  - name: 'molecule-bootstrap-debian-full'
    role_vars:
      debian_hostname: 'molecule-full.example.org'
      # cloud-init manages /etc/hosts, the role must not generate it
      debian_cloud_manage_etc_hosts: true
      # Repositories that are not configured stay
      debian_repositories_prune: false
      debian_timezone: 'Europe/Berlin'
      debian_packages:
        - 'jq'
      debian_storage:
        - disk: '/dev/vdb'
          path: '/srv/data'
          fs: 'ext4'
          options: 'defaults'
      debian_mounts:
        - src: '/srv/data/bind'
          path: '/srv/bind'
      debian_networking_enable: true
      debian_network_interfaces:
        - interface: 'dummy0'
          priority: 50
          comment: 'molecule test interface'
          inet:
            method: 'static'
            address: '10.99.0.1'
            netmask: '255.255.255.0'
            pre-up:
              - 'ip link add dummy0 type dummy'
            post-down:
              - 'ip link del dummy0'
      debian_groups:
        - group: 'molecule'
          gid: 2500
      debian_users:
        - user: 'molecule'
          uid: 2500
          comment: 'molecule test user'
      debian_logrotate_enable: true
      debian_logrotate_files:
        - name: 'molecule'
          definitions:
            - logs:
                - '/var/log/molecule/*.log'
              options:
                - 'weekly'
                - 'rotate 4'
                - 'missingok'
                - 'notifempty'
                - 'compress'
      debian_unattended_upgrades_enable: true
      debian_unattended_upgrades_mail: 'root'
      debian_mail_enable: true
      debian_mail_accounts:
        # SMTP sink started in prepare.yml
        - name: 'sink'
          smtp_host: '127.0.0.1'
          smtp_port: 2525
          tls: false
        # Never used, makes /etc/msmtprc readable for root only
        - name: 'smarthost'
          smtp_host: 'smtp.example.test'
          smtp_port: 587
          tls: true
          starttls: true
          auth: true
          user: 'molecule'
          password: 'molecule-smtp-password'
      debian_mail_aliases:
        root: 'molecule@example.test'
    expect:
      hostname: 'molecule-full.example.org'
      hostname_short: 'molecule-full'
      etc_hosts_managed: false
      stale_sources_removed: false
      timezone: 'Europe/Berlin'
      repositories:
        - 'debian'
        - 'debian-security'
      packages:
        - 'htop'
        - 'ifupdown'
        - 'jq'
        - 'bsd-mailx'
        - 'logrotate'
        - 'msmtp'
        - 'msmtp-mta'
        - 'sudo'
        - 'unattended-upgrades'
      storage:
        disk: '/dev/vdb'
        path: '/srv/data'
        fs: 'ext4'
        bind_src: '/srv/data/bind'
        bind_path: '/srv/bind'
      networking:
        interface: 'dummy0'
        address: '10.99.0.1/24'
      accounts:
        group: 'molecule'
        gid: 2500
        user: 'molecule'
        uid: 2500
        shell: '/usr/bin/false'
      logrotate:
        file: '/etc/logrotate.d/molecule'
      unattended_upgrades:
        mail: 'root'
      mail:
        sink_port: 2525
        default_account: 'sink'
        accounts: [ 'sink', 'smarthost' ]
        config_mode: '0600'
        alias_root: 'molecule@example.test'
