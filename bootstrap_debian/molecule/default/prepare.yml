---
- name: 'Prepare'
  hosts: 'all'
  become: true
  gather_facts: false

  vars_files:
    - 'test_cases.yml'

  vars:
    bootstrap_debian__test_case: "{{ bootstrap_debian__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  tasks:

    # Valid duplicates of the Debian repositories, apt-get update must not fail
    - name: 'Create repository files that are not configured'
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        mode: '0644'
      loop:
        - dest: '/etc/apt/sources.list.d/molecule-stale.sources'
          content: |
            Types: deb
            URIs: http://deb.debian.org/debian
            Suites: trixie
            Components: main
        - dest: '/etc/apt/sources.list.d/molecule-stale.list'
          content: |
            deb http://deb.debian.org/debian trixie main
        - dest: '/etc/apt/sources.list'
          content: |
            deb http://deb.debian.org/debian trixie main
      loop_control:
        label: "{{ item.dest }}"

    - name: 'Prepare the storage disk'
      when: bootstrap_debian__test_case.expect.storage is defined
      block:

        - name: 'Check the storage disk'
          ansible.builtin.stat:
            path: "{{ bootstrap_debian__test_case.expect.storage.disk }}"
          register: 'bootstrap_debian__test_disk'

        - name: 'Assert the storage disk exists'
          ansible.builtin.assert:
            that:
              - bootstrap_debian__test_disk.stat.exists
              - bootstrap_debian__test_disk.stat.isblk
            fail_msg: >-
              {{ bootstrap_debian__test_case.expect.storage.disk }} is missing,
              check the device name of the additional tart disk (lsblk) and adjust test_cases.yml

        - name: 'Check for an existing filesystem'
          ansible.builtin.command: "blkid -o value -s TYPE '{{ bootstrap_debian__test_case.expect.storage.disk }}'"
          register: 'bootstrap_debian__test_blkid'
          changed_when: false
          failed_when: false

        - name: 'Create the filesystem'
          ansible.builtin.command: "mkfs.{{ bootstrap_debian__test_case.expect.storage.fs }} -q '{{ bootstrap_debian__test_case.expect.storage.disk }}'"
          when: bootstrap_debian__test_blkid.stdout | trim | length == 0
          changed_when: true

    - name: 'Start an SMTP sink logging every mail to the journal'
      when: bootstrap_debian__test_case.expect.mail is defined
      block:

        - name: 'Install aiosmtpd'
          ansible.builtin.apt:
            name: 'python3-aiosmtpd'
            install_recommends: false
            update_cache: true

        - name: 'Check for the SMTP sink'
          ansible.builtin.command: 'systemctl is-active molecule-smtp-sink'
          register: 'bootstrap_debian__test_sink'
          changed_when: false
          failed_when: false

        - name: 'Start the SMTP sink'
          ansible.builtin.command: >-
            systemd-run --unit=molecule-smtp-sink
            python3 -u -m aiosmtpd -n -l 127.0.0.1:{{ bootstrap_debian__test_case.expect.mail.sink_port }}
          when: bootstrap_debian__test_sink.stdout != 'active'
          changed_when: true

        - name: 'Wait for the SMTP sink'
          ansible.builtin.wait_for:
            host: '127.0.0.1'
            port: "{{ bootstrap_debian__test_case.expect.mail.sink_port }}"
            timeout: 30

    # The role must not change sshd_config and ssh_config of the package
    - name: 'Store the checksums of sshd_config and ssh_config'
      ansible.builtin.shell: "md5sum /etc/ssh/sshd_config /etc/ssh/ssh_config > {{ bootstrap_debian__test_ssh_checksums }}"
      args:
        creates: "{{ bootstrap_debian__test_ssh_checksums }}"

    - name: 'Create a file of the former role security_ssh'
      ansible.builtin.copy:
        dest: "{{ bootstrap_debian__test_ssh_legacy_file }}"
        content: |
          ListenAddress 0.0.0.0
          ListenAddress ::
        mode: '0644'

    - name: 'Prepare the SSH test'
      when: bootstrap_debian__test_case.expect.ssh.login is not none
      block:

        - name: 'Create the key pair of the SSH test'
          ansible.builtin.command:
            argv: [ 'ssh-keygen', '-q', '-t', 'ed25519', '-N', '', '-C', 'molecule', '-f', "{{ bootstrap_debian__test_ssh_key }}" ]
            creates: "{{ bootstrap_debian__test_ssh_key }}"

        # The role removes the authorized keys of a user with an empty list
        - name: 'Create a user with authorized keys'
          ansible.builtin.user:
            name: 'stale'
            create_home: true
            shell: '/bin/bash'

        - name: 'Create the .ssh directory of the user'
          ansible.builtin.file:
            path: '/home/stale/.ssh'
            owner: 'stale'
            group: 'stale'
            mode: '0700'
            state: 'directory'

        - name: 'Write the authorized keys of the user'
          ansible.builtin.copy:
            dest: '/home/stale/.ssh/authorized_keys'
            content: |
              ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMoleculeStaleKeyMoleculeStaleKeyMolecule stale
            owner: 'stale'
            group: 'stale'
            mode: '0600'
