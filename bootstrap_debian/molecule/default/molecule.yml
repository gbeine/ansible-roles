---
prerun: false
driver:
  name: 'default'
  options:
    managed: true
platforms:
  - name: 'molecule-bootstrap-debian-minimal'
  - name: 'molecule-bootstrap-debian-full'
    disk_size: '1g'
provisioner:
  name: 'ansible'
  playbooks:
    create: '../../../.molecule/tart/create.yml'
    destroy: '../../../.molecule/tart/destroy.yml'
  config_options:
    defaults:
      callback_result_format: 'yaml'
      gathering: 'smart'
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_ROLES_PATH: '../../../'
  inventory:
    group_vars:
      all:
        ansible_become_password: '${MOLECULE_TART_PASSWORD:-admin}'
verifier:
  name: 'ansible'
scenario:
  test_sequence:
    - 'destroy'
    - 'syntax'
    - 'create'
    - 'prepare'
    - 'converge'
    - 'idempotence'
    - 'verify'
    - 'destroy'
