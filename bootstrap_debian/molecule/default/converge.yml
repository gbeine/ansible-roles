---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    bootstrap_debian__test_case: "{{ bootstrap_debian__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  pre_tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ bootstrap_debian__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # The public key of the key pair created in prepare.yml replaces the placeholder of the authorized keys
    - name: 'Read the public key of the SSH test'
      ansible.builtin.slurp:
        src: "{{ bootstrap_debian__test_ssh_key }}.pub"
      register: 'bootstrap_debian__test_ssh_public_key'
      when: debian_sshd is defined and debian_sshd.authorized_keys is defined

    - name: 'Set the public key of the SSH test'
      ansible.builtin.set_fact:
        debian_sshd: >-
          {{ debian_sshd | to_json
             | replace(bootstrap_debian__test_ssh_key_placeholder, bootstrap_debian__test_ssh_public_key.content | b64decode | trim)
             | from_json }}
      when: debian_sshd is defined and debian_sshd.authorized_keys is defined

  roles:
    - role: 'common_filters'

  tasks:

    - name: 'Run bootstrap_debian'
      ansible.builtin.include_role:
        name: 'bootstrap_debian'
