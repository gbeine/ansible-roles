---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/bootstrap-debian
#

bootstrap_debian__repositories: "{{ debian_repositories | default(bootstrap_debian__repositories_default) }}"

bootstrap_debian__packages: "{{ debian_packages | default([]) }}"
bootstrap_debian__local_packages: "{{ debian_local_packages | default([]) }}"

bootstrap_debian__timezone: "{{ debian_timezone | default('Etc/UTC') }}"

bootstrap_debian__hostname: "{{ debian_hostname | mandatory }}"
bootstrap_debian__hosts: "{{ debian_hosts | default(bootstrap_debian__hosts_ipv4_default + bootstrap_debian__hosts_ipv6_default) }}"
bootstrap_debian__cloud_manage_etc_hosts: "{{ debian_cloud_manage_etc_hosts | default(true) }}"

bootstrap_debian__storage: "{{ debian_storage | default([]) }}"
bootstrap_debian__mounts: "{{ debian_mounts | default([]) }}"

bootstrap_debian__networking_enable: "{{ debian_networking_enable | default(false) }}"
bootstrap_debian__network_interfaces: "{{ debian_network_interfaces | default([]) }}"

bootstrap_debian__groups: "{{ debian_groups | default([]) }}"
bootstrap_debian__users: "{{ debian_users | default([]) }}"

bootstrap_debian__logrotate_enable: "{{ debian_logrotate_enable | default(false) }}"
bootstrap_debian__logrotate_files: "{{ debian_logrotate_files | default([]) }}"

bootstrap_debian__unattended_upgrades_enable: "{{ debian_unattended_upgrades_enable | default(false) }}"
bootstrap_debian__unattended_upgrades_auto_fix_interrupted_dpkg: "{{ debian_unattended_upgrades_auto_fix_interrupted_dpkg | default(true) }}"
bootstrap_debian__unattended_upgrades_minimal_steps: "{{ debian_unattended_upgrades_minimal_steps | default(true) }}"
bootstrap_debian__unattended_upgrades_install_on_shutdown: "{{ debian_unattended_upgrades_install_on_shutdown | default(false) }}"
bootstrap_debian__unattended_upgrades_mail: "{{ debian_unattended_upgrades_mail | default('') }}"
bootstrap_debian__unattended_upgrades_mail_report: "{{ debian_unattended_upgrades_mail_report | default('on-change') }}"
bootstrap_debian__unattended_upgrades_remove_unused_kernel_packages: "{{ debian_unattended_upgrades_remove_unused_kernel_packages | default(true) }}"
bootstrap_debian__unattended_upgrades_remove_new_unused_dependencies: "{{ debian_unattended_upgrades_remove_new_unused_dependencies | default(true) }}"
bootstrap_debian__unattended_upgrades_remove_unused_dependencies: "{{ debian_unattended_upgrades_remove_unused_dependencies | default(false) }}"
bootstrap_debian__unattended_upgrades_automatic_reboot: "{{ debian_unattended_upgrades_automatic_reboot | default(false) }}"
bootstrap_debian__unattended_upgrades_automatic_reboot_with_users: "{{ debian_unattended_upgrades_automatic_reboot_with_users | default(true) }}"
bootstrap_debian__unattended_upgrades_automatic_reboot_time: "{{ debian_unattended_upgrades_automatic_reboot_time | default('now') }}"
bootstrap_debian__unattended_upgrades_syslog_enable: "{{ debian_unattended_upgrades_syslog_enable | default(false) }}"
bootstrap_debian__unattended_upgrades_syslog_facility: "{{ debian_unattended_upgrades_syslog_facility | default('daemon') }}"
bootstrap_debian__unattended_upgrades_only_on_ac_power: "{{ debian_unattended_upgrades_only_on_ac_power | default(true) }}"
bootstrap_debian__unattended_upgrades_skip_updates_on_metered_connections: "{{ debian_unattended_upgrades_skip_updates_on_metered_connections | default(true) }}"
bootstrap_debian__unattended_upgrades_verbose: "{{ debian_unattended_upgrades_verbose | default(false) }}"
bootstrap_debian__unattended_upgrades_debug: "{{ debian_unattended_upgrades_debug | default(false) }}"
bootstrap_debian__unattended_upgrades_allow_downgrade: "{{ debian_unattended_upgrades_allow_downgrade | default(false) }}"
bootstrap_debian__unattended_upgrades_allow_apt_mark_fallback: "{{ debian_unattended_upgrades_allow_apt_mark_fallback | default(true) }}"
bootstrap_debian__unattended_upgrades_origin_pattern: "{{ debian_unattended_upgrades_origin_pattern | default(bootstrap_debian__unattended_upgrades_origin_pattern_default) }}"

# Defaults - do not change
bootstrap_debian__apt_packages:
  - 'python3-apt'
  - 'python3-debian'

bootstrap_debian__apt_cache_valid_time: 3600
bootstrap_debian__apt_conf_dir: '/etc/apt/apt.conf.d'

bootstrap_debian__local_packages_dir: '/root'

bootstrap_debian__timezone_packages:
  - 'tzdata'
bootstrap_debian__zoneinfo_dir: '/usr/share/zoneinfo'

bootstrap_debian__hosts_ipv4_default:
  - address: '127.0.0.1'
    hostname: 'localhost'
  - address: '127.0.1.1'
    hostname: "{{ bootstrap_debian__hostname }}"
  - address: '127.0.1.1'
    hostname: "{{ bootstrap_debian__hostname | hostname_short }}"

bootstrap_debian__hosts_ipv6_default:
  - address: '::1'
    hostname: 'localhost'
  - address: '::1'
    hostname: 'ip6-localhost'
  - address: '::1'
    hostname: 'ip6-loopback'
  - address: 'fe00::0'
    hostname: 'ip6-localnet'
  - address: 'ff00::0'
    hostname: 'ip6-mcastprefix'
  - address: 'ff02::1'
    hostname: 'ip6-allnodes'
  - address: 'ff02::2'
    hostname: 'ip6-allrouters'
  - address: 'ff02::3'
    hostname: 'ip6-allhosts'

bootstrap_debian__network_etc_dir: '/etc/network'
bootstrap_debian__network_interfaces_dir: "{{ bootstrap_debian__network_etc_dir }}/interfaces.d"
bootstrap_debian__network_interfaces_file: "{{ bootstrap_debian__network_etc_dir }}/interfaces"

bootstrap_debian__logrotate_packages:
  - 'logrotate'
bootstrap_debian__logrotate_etc_dir: '/etc/logrotate.d'

bootstrap_debian__unattended_upgrades_packages:
  - 'unattended-upgrades'
  - 'powermgmt-base'
  - 'python3-gi'

bootstrap_debian__unattended_upgrades_origin_pattern_default:
  - 'origin=Debian,codename=${distro_codename},label=Debian'
  - 'origin=Debian,codename=${distro_codename},label=Debian-Security'
  - 'origin=Debian,codename=${distro_codename}-security,label=Debian-Security'
  - 'origin=Debian,codename=${distro_codename}-proposed-updates,label=Debian'
  - 'origin=Debian,codename=${distro_codename}-updates,label=Debian'
  - 'origin=Debian Backports,codename=${distro_codename}-backports,label=Debian Backports'
