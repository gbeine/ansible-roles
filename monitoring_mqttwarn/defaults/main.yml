---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-mqttwarn
#

monitoring_mqttwarn__home: "{{ mqttwarn_home | mandatory }}"
monitoring_mqttwarn__ip: "{{ mqttwarn_ip | mandatory }}"
monitoring_mqttwarn__ipv6: "{{ mqttwarn_ipv6 }}"
monitoring_mqttwarn__network: "{{ mqttwarn_network | mandatory }}"
monitoring_mqttwarn__hostname: "{{ mqttwarn_hostname | mandatory }}"
monitoring_mqttwarn__timezone: "{{ mqttwarn_timezone | mandatory }}"

monitoring_mqttwarn__version: "{{ mqttwarn_version | default('latest') }}"

monitoring_mqttwarn__container: "{{ monitoring_mqttwarn__container_default | combine(mqttwarn_container | default({})) }}"

monitoring_mqttwarn__mqtt_hostname: "{{ mqttwarn_mqtt_hostname | mandatory }}"
monitoring_mqttwarn__mqtt_realm: "{{ mqttwarn_mqtt_realm | default(monitoring_mqttwarn__mqtt_hostname) }}"
monitoring_mqttwarn__mqtt_port: "{{ mqttwarn_mqtt_port | default(1883) }}"
monitoring_mqttwarn__mqtt_username: "{{ mqttwarn_mqtt_username }}"
monitoring_mqttwarn__mqtt_password: "{{ mqttwarn_mqtt_password }}"
monitoring_mqttwarn__mqtt_clientid: "{{ mqttwarn_mqtt_clientid | default('mqttwarn') }}"
monitoring_mqttwarn__mqtt_lwt: "{{ mqttwarn_mqtt_lwt | default('clients/mqttwarn') }}"
monitoring_mqttwarn__mqtt_lwt_alive: "{{ mqttwarn_mqtt_lwt_alive | default('1') }}"
monitoring_mqttwarn__mqtt_lwt_dead: "{{ mqttwarn_mqtt_lwt_dead | default('0') }}"
monitoring_mqttwarn__mqtt_skipretained: "{{ mqttwarn_mqtt_skipretained | default(true) }}"
monitoring_mqttwarn__mqtt_cleansession: "{{ mqttwarn_mqtt_cleansession | default(false) }}"

monitoring_mqttwarn__mqtt_protocol: "{{ mqttwarn_mqtt_protocol | default(3) }}"
monitoring_mqttwarn__mqtt_tls: "{{ mqttwarn_mqtt_tls | default(false) }}"
monitoring_mqttwarn__mqtt_tls_version: "{{ mqttwarn_mqtt_tls_version | default('tlsv1_2') }}"
monitoring_mqttwarn__mqtt_tls_insecure: "{{ mqttwarn_mqtt_tls_insecure | default(false) }}"
monitoring_mqttwarn__mqtt_tls_ca_certs: "{{ mqttwarn_ca_certs | default('') }}"
monitoring_mqttwarn__mqtt_tls_certfile: "{{ mqttwarn_certfile | default('') }}"
monitoring_mqttwarn__mqtt_tls_keyfile: "{{ mqttwarn_keyfile | default('') }}"

monitoring_mqttwarn__logfile: "{{ mqttwarn_logfile | default('stream://sys.stderr') }}"
# CRITICAL, DEBUG, ERROR, INFO, WARN
monitoring_mqttwarn__loglevel: "{{ mqttwarn_loglevel | default('INFO') }}"
# CRITICAL, DEBUG, ERROR, INFO, WARN
monitoring_mqttwarn__filteredmessagesloglevel: "{{ mqttwarn_filteredmessagesloglevel | default('INFO') }}"
monitoring_mqttwarn__logformat: "{{ mqttwarn_logformat | default('%(asctime)-15s %(levelname)-8s [%(name)-25s] %(message)s') }}"

monitoring_mqttwarn__functions: "{{ mqttwarn_functions | default([]) }}"
monitoring_mqttwarn__launch: "{{ mqttwarn_launch | default(monitoring_mqttwarn__launch_default) }}"
monitoring_mqttwarn__status_publish: "{{ mqttwarn_status_publish | default(true) }}"
monitoring_mqttwarn__status_topic: "{{ mqttwarn_status_topic | default('mqttwarn/$SYS') }}"

monitoring_mqttwarn__config: "{{ mqttwarn_config | default(monitoring_mqttwarn__config_default) }}"
monitoring_mqttwarn__failover: "{{ mqttwarn_failover | default(monitoring_mqttwarn__failover_default) }}"

monitoring_mqttwarn__topics: "{{ mqttwarn_topics | default([]) }}"

monitoring_mqttwarn__files: "{{ mqttwarn_files | default([]) }}"
#
# Defaults - do not change
#

monitoring_mqttwarn__uid: 999
monitoring_mqttwarn__gid: 999

monitoring_mqttwarn__podman_name: 'mqttwarn'
monitoring_mqttwarn__podman_image: 'c0d3.sh/container/mqttwarn-docker'
monitoring_mqttwarn__podman_tag: "{{ monitoring_mqttwarn__version }}"

monitoring_mqttwarn__podman_home: "{{ monitoring_mqttwarn__home }}"
monitoring_mqttwarn__podman_etc_dir: "{{ monitoring_mqttwarn__podman_home }}/etc"

monitoring_mqttwarn__container_default:
  name: "{{ monitoring_mqttwarn__podman_name }}"
  hostname: "{{ monitoring_mqttwarn__hostname }}"
  image: "{{ monitoring_mqttwarn__podman_image }}:{{ monitoring_mqttwarn__podman_tag }}"
  ip: "{{ monitoring_mqttwarn__ip }}"
  ipv6: "{{ monitoring_mqttwarn__ipv6 }}"
  network: "{{ monitoring_mqttwarn__network }}"
  timezone: "{{ monitoring_mqttwarn__timezone }}"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ monitoring_mqttwarn__podman_etc_dir }}:/etc/mqttwarn"

monitoring_mqttwarn__launch_default:
  - 'log'

monitoring_mqttwarn__config_default:
  - name: 'log'
    targets:
      - name: 'debug'
        options:
          - 'debug'
      - name: 'info'
        options:
          - 'info'
      - name: 'warn'
        options:
          - 'warn'
      - name: 'crit'
        options:
          - 'crit'
      - name: 'error'
        options:
          - 'error'

monitoring_mqttwarn__failover_default:
  - 'log:error'
  - 'file:mqttwarn'
