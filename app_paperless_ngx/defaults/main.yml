---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/paperless-ngx
#

app_paperless_ngx__home: "{{ paperless_ngx_home | mandatory }}"
app_paperless_ngx__ip: "{{ paperless_ngx_ip | mandatory }}"
app_paperless_ngx__ipv6: "{{ paperless_ngx_ipv6 }}"
app_paperless_ngx__network: "{{ paperless_ngx_network | mandatory }}"
app_paperless_ngx__hostname: "{{ paperless_ngx_hostname | mandatory }}"
app_paperless_ngx__timezone: "{{ paperless_ngx_timezone | mandatory }}"
app_paperless_ngx__labels: "{{ paperless_ngx_labels | default({}) }}"

# The user and group of the directories, the image runs Paperless-ngx as the user paperless with this uid and gid
app_paperless_ngx__uid: "{{ paperless_ngx_uid | default(1000) }}"
app_paperless_ngx__gid: "{{ paperless_ngx_gid | default(app_paperless_ngx__uid) }}"

app_paperless_ngx__version: "{{ paperless_ngx_version | default('latest') }}"

app_paperless_ngx__container: "{{ app_paperless_ngx__podman_container_default | combine(paperless_ngx_container | default({})) }}"

# The configuration of Paperless-ngx, merged over the default
app_paperless_ngx__environment: "{{ app_paperless_ngx__environment_default | combine(paperless_ngx_environment | default({})) }}"

# Secrets with name, data and target, e.g. PAPERLESS_SECRET_KEY, PAPERLESS_REDIS or PAPERLESS_DBPASS
app_paperless_ngx__secrets: "{{ paperless_ngx_secrets | default([]) }}"

# The administrator of Paperless-ngx with name, email and password
app_paperless_ngx__admin: "{{ paperless_ngx_admin | mandatory }}"

app_paperless_ngx__autoupdate_enabled: "{{ paperless_ngx_autoupdate_enabled | default(false) }}"
app_paperless_ngx__autoupdate_schedule: "{{ paperless_ngx_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_paperless_ngx__podman_name: 'paperless-ngx'
app_paperless_ngx__podman_image: 'ghcr.io/paperless-ngx/paperless-ngx'

app_paperless_ngx__port: "{{ app_paperless_ngx__environment.PAPERLESS_PORT | default(8000) }}"

app_paperless_ngx__environment_default:
  USERMAP_UID: "{{ app_paperless_ngx__uid | string }}"
  USERMAP_GID: "{{ app_paperless_ngx__gid | string }}"
  PAPERLESS_TIME_ZONE: "{{ app_paperless_ngx__timezone }}"

app_paperless_ngx__database_engines: [ 'sqlite', 'postgresql', 'mariadb' ]

# Without PAPERLESS_SECRET_KEY Paperless-ngx does not start, the broker Redis is always needed
app_paperless_ngx__secrets_required: [ 'PAPERLESS_SECRET_KEY', 'PAPERLESS_REDIS' ]

app_paperless_ngx__secret_variables: "{{ app_paperless_ngx__secret_files.keys() | list }}"
app_paperless_ngx__secrets_dir: '/run/secrets'

# The file variables of the secrets
app_paperless_ngx__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if app_paperless_ngx__secrets is sequence and app_paperless_ngx__secrets is not string and app_paperless_ngx__secrets is not mapping -%}
  {%-   for secret in app_paperless_ngx__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in app_paperless_ngx__secret_files -%}
  {%-     set _ = environment.update({ app_paperless_ngx__secret_files[secret.target]: app_paperless_ngx__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The environment of the container, the role writes booleans in lower case
app_paperless_ngx__environment_container: >-
  {%- set environment = {} -%}
  {%- for key, value in (app_paperless_ngx__environment | combine(app_paperless_ngx__environment_secrets_files)).items() -%}
  {%-   set _ = environment.update({ key: (value | string | lower) if value is boolean else value }) -%}
  {%- endfor -%}
  {{ environment }}

app_paperless_ngx__admin_keys: [ 'name', 'email', 'password' ]
# The names of users of Django
app_paperless_ngx__admin_name_pattern: '^[A-Za-z0-9@.+_-]{1,150}$'
app_paperless_ngx__admin_email_pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
app_paperless_ngx__password_length: 8

app_paperless_ngx__podman_container_default:
  name: "{{ app_paperless_ngx__podman_name }}"
  hostname: "{{ app_paperless_ngx__hostname }}"
  image: "{{ app_paperless_ngx__podman_image }}:{{ app_paperless_ngx__version }}"
  ip: "{{ app_paperless_ngx__ip }}"
  ipv6: "{{ app_paperless_ngx__ipv6 | default(omit) }}"
  network: "{{ app_paperless_ngx__network }}"
  timezone: "{{ app_paperless_ngx__timezone }}"
  labels: "{{ app_paperless_ngx__labels | default(omit) }}"
  # Set with paperless_ngx_environment and paperless_ngx_secrets, merged over the default
  environment: "{{ app_paperless_ngx__environment_container }}"
  volumes:
    - "{{ app_paperless_ngx__home }}/data:/usr/src/paperless/data:Z"
    - "{{ app_paperless_ngx__home }}/media:/usr/src/paperless/media:Z"
    - "{{ app_paperless_ngx__home }}/export:/usr/src/paperless/export:Z"
    - "{{ app_paperless_ngx__home }}/consume:/usr/src/paperless/consume:Z"
  # Entries without name are left out, the validation of the secrets reports them
  secrets: >-
    {{ (app_paperless_ngx__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ app_paperless_ngx__secrets_dir ~ '/\1') | list)
      if (app_paperless_ngx__secrets is sequence and app_paperless_ngx__secrets is not string and app_paperless_ngx__secrets | length > 0)
      else omit }}

# Generated from the secrets of src of Paperless-ngx v3.4.2, the image reads every PAPERLESS_*_FILE into the variable without _FILE
app_paperless_ngx__secret_files:
  PAPERLESS_SECRET_KEY: 'PAPERLESS_SECRET_KEY_FILE'
  PAPERLESS_DBPASS: 'PAPERLESS_DBPASS_FILE'
  PAPERLESS_REDIS: 'PAPERLESS_REDIS_FILE'
  PAPERLESS_READ_CACHE_REDIS_URL: 'PAPERLESS_READ_CACHE_REDIS_URL_FILE'
  PAPERLESS_EMAIL_HOST_PASSWORD: 'PAPERLESS_EMAIL_HOST_PASSWORD_FILE'
  PAPERLESS_AI_LLM_API_KEY: 'PAPERLESS_AI_LLM_API_KEY_FILE'
  PAPERLESS_AI_LLM_EMBEDDING_API_KEY: 'PAPERLESS_AI_LLM_EMBEDDING_API_KEY_FILE'
  PAPERLESS_GMAIL_OAUTH_CLIENT_SECRET: 'PAPERLESS_GMAIL_OAUTH_CLIENT_SECRET_FILE'
  PAPERLESS_OUTLOOK_OAUTH_CLIENT_SECRET: 'PAPERLESS_OUTLOOK_OAUTH_CLIENT_SECRET_FILE'
  PAPERLESS_REMOTE_OCR_API_KEY: 'PAPERLESS_REMOTE_OCR_API_KEY_FILE'
  PAPERLESS_SOCIALACCOUNT_PROVIDERS: 'PAPERLESS_SOCIALACCOUNT_PROVIDERS_FILE'

# The options read with get_bool_from_env in src of Paperless-ngx v3.4.2
