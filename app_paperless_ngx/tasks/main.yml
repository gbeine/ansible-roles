---

- name: 'Deploy Paperless-ngx container'
  tags: [ 'app_paperless_ngx' ]
  block:

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        owner: "{{ app_paperless_ngx__uid }}"
        group: "{{ app_paperless_ngx__gid }}"
        mode: "{{ item.mode | default('0700') }}"
        state: 'directory'
      with_items:
        - dest: "{{ app_paperless_ngx__podman_home }}/data"
        - dest: "{{ app_paperless_ngx__podman_home }}/media"
        - dest: "{{ app_paperless_ngx__podman_home }}/export"
        - dest: "{{ app_paperless_ngx__podman_home }}/consume"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      with_items: "{{ app_paperless_ngx__secrets }}"

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ app_paperless_ngx__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[app_paperless_ngx__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ app_paperless_ngx__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name:  'Install container'
      containers.podman.podman_container:
        name: "{{ app_paperless_ngx__container.name }}"
        hostname: "{{ app_paperless_ngx__container.hostname }}"
        image: "{{ app_paperless_ngx__container.image }}"
        ip: "{{ app_paperless_ngx__container.ip }}"
        ip6: "{{ app_paperless_ngx__container.ipv6 | default(omit) }}"
        network: "{{ app_paperless_ngx__container.network }}"
        timezone: "{{ app_paperless_ngx__container.timezone }}"
        env: "{{ app_paperless_ngx__container.environment | default(omit) }}"
        etc_hosts: "{{ app_paperless_ngx__container.etc_hosts | default(omit) }}"
        expose: "{{ app_paperless_ngx__container.expose | default(omit) }}"
        label: "{{ app_paperless_ngx__container.labels | default(omit) }}"
        publish: "{{ app_paperless_ngx__container.publish | default(omit) }}"
        secrets: "{{ app_paperless_ngx__container.secrets | default(omit) }}"
        volume: "{{ app_paperless_ngx__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_paperless_ngx__container.requires is defined %}
          Requires={{ app_paperless_ngx__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ app_paperless_ngx__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode | bool else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'app_paperless_ngx__autoupdate_enabled'
      include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_paperless_ngx__container.name }}"
        container_image: "{{ app_paperless_ngx__container.image }}"
