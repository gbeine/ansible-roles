---

- name: 'Deploy Paperless-ngx'
  tags: [ 'app', 'app_paperless_ngx' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or paperless_ngx_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - app_paperless_ngx__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - app_paperless_ngx__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_paperless_ngx__invalid | join('. ') }}"
        quiet: true
      vars:
        app_paperless_ngx__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = app_paperless_ngx__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('paperless_ngx_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('paperless_ngx_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of paperless_ngx_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    # postgresql and mariadb need the host and the password of the database
    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - app_paperless_ngx__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_paperless_ngx__errors | join(' ') }}"
        quiet: true
      vars:
        app_paperless_ngx__set: "{{ app_paperless_ngx__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list }}"
        app_paperless_ngx__database: >-
          {{ app_paperless_ngx__environment.PAPERLESS_DBENGINE | default('', true)
             or ('postgresql' if 'PAPERLESS_DBHOST' in app_paperless_ngx__set else 'sqlite') }}
        app_paperless_ngx__targets: "{{ app_paperless_ngx__secrets | map(attribute='target') | list }}"
        app_paperless_ngx__secrets_needed: >-
          {{ app_paperless_ngx__secrets_required + ([] if app_paperless_ngx__database == 'sqlite' else [ 'PAPERLESS_DBPASS' ]) }}
        app_paperless_ngx__secrets_missing: "{{ app_paperless_ngx__secrets_needed | reject('in', app_paperless_ngx__targets) | list }}"
        app_paperless_ngx__secrets_in_environment: >-
          {{ (app_paperless_ngx__targets + app_paperless_ngx__secret_variables + app_paperless_ngx__secret_files.values() | list)
             | select('in', app_paperless_ngx__environment.keys() | list) | unique | list }}
        app_paperless_ngx__secrets_lines: >-
          {{ app_paperless_ngx__secrets | selectattr('data', 'string') | selectattr('data', 'search', '[\r\n]') | map(attribute='name') | list }}
        app_paperless_ngx__errors: >-
          {%- set errors = [] -%}
          {%- if app_paperless_ngx__database not in app_paperless_ngx__database_engines -%}
          {%-   set _ = errors.append('PAPERLESS_DBENGINE has to be one of ' ~ (app_paperless_ngx__database_engines | join(', ')) ~ ', got ' ~ app_paperless_ngx__database ~ '.') -%}
          {%- elif app_paperless_ngx__database != 'sqlite' and 'PAPERLESS_DBHOST' not in app_paperless_ngx__set -%}
          {%-   set _ = errors.append('PAPERLESS_DBENGINE ' ~ app_paperless_ngx__database ~ ' needs PAPERLESS_DBHOST.') -%}
          {%- endif -%}
          {%- if app_paperless_ngx__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('Paperless-ngx needs the secrets ' ~ (app_paperless_ngx__secrets_needed | join(', ')) ~ ', missing: ' ~ (app_paperless_ngx__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_paperless_ngx__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets and their file variables must not be set in paperless_ngx_environment: ' ~ (app_paperless_ngx__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_paperless_ngx__secrets_lines | length > 0 -%}
          {%-   set _ = errors.append('Secrets must not contain line breaks: ' ~ (app_paperless_ngx__secrets_lines | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the values of the environment'
      ansible.builtin.assert:
        that:
          - app_paperless_ngx__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_paperless_ngx__errors | join(' ') }}"
        quiet: true
      vars:
        app_paperless_ngx__errors: >-
          {%- set errors = [] -%}
          {%- set ns = namespace(booleans=[], lines=[]) -%}
          {%- for key, value in app_paperless_ngx__environment.items() if value is not none -%}
          {%-   if key in app_paperless_ngx__environment_booleans and value is not boolean and (value | string | lower) not in [ 'true', 'false' ] -%}
          {%-     set ns.booleans = ns.booleans + [ key ] -%}
          {%-   elif value is string and (value ~ '.').splitlines() | length > 1 -%}
          {%-     set ns.lines = ns.lines + [ key ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- if ns.booleans | length > 0 -%}
          {%-   set _ = errors.append('These variables are booleans, allowed are true and false: ' ~ (ns.booleans | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.lines | length > 0 -%}
          {%-   set _ = errors.append('Values must not contain line breaks: ' ~ (ns.lines | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the administrator'
      ansible.builtin.assert:
        that:
          - app_paperless_ngx__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_paperless_ngx__errors | join(' ') }}"
        quiet: true
      vars:
        app_paperless_ngx__errors: >-
          {%- set errors = [] -%}
          {%- set admin = app_paperless_ngx__admin -%}
          {%- if admin is not mapping -%}
          {%-   set _ = errors.append('paperless_ngx_admin has to be a dictionary with name, email and password.') -%}
          {%- else -%}
          {%-   set unknown = admin.keys() | reject('in', app_paperless_ngx__admin_keys) | list -%}
          {%-   if unknown | length > 0 -%}
          {%-     set _ = errors.append('Unknown keys in paperless_ngx_admin: ' ~ (unknown | join(', ')) ~ ', allowed are ' ~ (app_paperless_ngx__admin_keys | join(', ')) ~ '.') -%}
          {%-   endif -%}
          {%-   if (admin.name | default('') | string) is not match(app_paperless_ngx__admin_name_pattern) -%}
          {%-     set _ = errors.append('paperless_ngx_admin needs a name of up to 150 letters, digits and @ . + - _.') -%}
          {%-   endif -%}
          {%-   if (admin.email | default('') | string) is not match(app_paperless_ngx__admin_email_pattern) -%}
          {%-     set _ = errors.append('paperless_ngx_admin needs a valid email.') -%}
          {%-   endif -%}
          {%-   if admin.password is not defined or admin.password is none -%}
          {%-     set _ = errors.append('paperless_ngx_admin needs a password.') -%}
          {%-   elif (admin.password | string | length) < app_paperless_ngx__password_length -%}
          {%-     set _ = errors.append('The password of paperless_ngx_admin needs at least ' ~ app_paperless_ngx__password_length ~ ' characters.') -%}
          {%-   endif -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging paperless_ngx_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - app_paperless_ngx__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_paperless_ngx__errors | join(' ') }}"
        quiet: true
      vars:
        app_paperless_ngx__environment_unknown: >-
          {{ (app_paperless_ngx__container.environment | default({})).keys() | reject('in', app_paperless_ngx__environment_allowed) | list }}
        app_paperless_ngx__secrets_unknown: >-
          {{ app_paperless_ngx__secrets | map(attribute='target') | reject('in', app_paperless_ngx__secret_variables) | list }}
        app_paperless_ngx__errors: >-
          {%- set errors = [] -%}
          {%- if app_paperless_ngx__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (app_paperless_ngx__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_paperless_ngx__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (app_paperless_ngx__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the variables of Paperless-ngx (app_paperless_ngx__environment_allowed) and the secrets ' ~ (app_paperless_ngx__secret_variables | join(', '))
                                    ~ ', the administrator is set with paperless_ngx_admin.') -%}
          {%- endif -%}
          {{ errors }}

    # The image changes the owner of the directories to USERMAP_UID and USERMAP_GID
    - name: 'Create the directories of Paperless-ngx'
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ app_paperless_ngx__uid }}"
        group: "{{ app_paperless_ngx__gid }}"
        mode: '0700'
        state: 'directory'
      loop:
        - "{{ app_paperless_ngx__home }}"
        - "{{ app_paperless_ngx__home }}/data"
        - "{{ app_paperless_ngx__home }}/media"
        - "{{ app_paperless_ngx__home }}/export"
        - "{{ app_paperless_ngx__home }}/consume"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ app_paperless_ngx__secrets }}"
      register: 'app_paperless_ngx__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_paperless_ngx__container.name }}"
        hostname: "{{ app_paperless_ngx__container.hostname }}"
        image: "{{ app_paperless_ngx__container.image }}"
        ip: "{{ app_paperless_ngx__container.ip }}"
        ip6: "{{ app_paperless_ngx__container.ipv6 | default(omit) }}"
        network: "{{ app_paperless_ngx__container.network }}"
        timezone: "{{ app_paperless_ngx__container.timezone }}"
        command: "{{ app_paperless_ngx__container.command | default(omit) }}"
        env: "{{ app_paperless_ngx__container.environment | default(omit) }}"
        etc_hosts: "{{ app_paperless_ngx__container.etc_hosts | default(omit) }}"
        expose: "{{ app_paperless_ngx__container.expose | default(omit) }}"
        label: "{{ app_paperless_ngx__container.labels | default(omit) }}"
        publish: "{{ app_paperless_ngx__container.publish | default(omit) }}"
        secrets: "{{ app_paperless_ngx__container.secrets | default(omit) }}"
        volume: "{{ app_paperless_ngx__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_paperless_ngx__container.requires is defined %}
          Requires={{ app_paperless_ngx__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'app_paperless_ngx__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ app_paperless_ngx__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if app_paperless_ngx__restart | bool else 'started' }}"
        enabled: true
      vars:
        app_paperless_ngx__running: >-
          {{ (ansible_facts.services[app_paperless_ngx__container.name + '.service'].state | default('')) == 'running' }}
        app_paperless_ngx__restart: >-
          {{ app_paperless_ngx__running | bool
             and (app_paperless_ngx__secrets_result is changed or app_paperless_ngx__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    # Paperless-ngx migrates the database before the webserver starts, the first start takes a while
    - name: 'Wait for Paperless-ngx'
      ansible.builtin.uri:
        url: "http://{{ app_paperless_ngx__ip }}:{{ app_paperless_ngx__port }}/accounts/login/"
      register: 'app_paperless_ngx__ready'
      until: app_paperless_ngx__ready.status | default(-1) == 200
      retries: 150
      delay: 2
      failed_when: false
      when: 'not ansible_check_mode'

    - name: 'Read the log of Paperless-ngx'
      when:
        - not ansible_check_mode
        - app_paperless_ngx__ready.status | default(-1) != 200
      ansible.builtin.command:
        argv: [ 'journalctl', '-u', "{{ app_paperless_ngx__container.name }}", '-n', '50', '--no-pager' ]
      register: 'app_paperless_ngx__journal'
      changed_when: false

    - name: 'Assert that Paperless-ngx answers'
      when: 'not ansible_check_mode'
      ansible.builtin.assert:
        that:
          - app_paperless_ngx__journal is skipped
        fail_msg: "{{ app_paperless_ngx__journal.stdout_lines | default([]) }}"
        quiet: true

    # The password is an option with no_log, it is passed to the Django shell on stdin
    - name: 'Create the administrator'
      when: 'not ansible_check_mode'
      app_paperless_ngx_admin:
        container: "{{ app_paperless_ngx__container.name }}"
        name: "{{ app_paperless_ngx__admin.name | string }}"
        email: "{{ app_paperless_ngx__admin.email | string }}"
        password: "{{ app_paperless_ngx__admin.password | string }}"
      register: 'app_paperless_ngx__admin_result'

    - name: 'Enable autoupdate on container'
      when: 'app_paperless_ngx__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_paperless_ngx__container.name }}"
        container_image: "{{ app_paperless_ngx__container.image }}"
        container_schedule: "{{ app_paperless_ngx__autoupdate_schedule }}"
