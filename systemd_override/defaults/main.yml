---

systemd_override__service_name: "{{ systemd_override_service_name | mandatory }}"
systemd_override__unit: "{{ systemd_override_unit | default([]) }}"
systemd_override__service: "{{ systemd_override_service | default([]) }}"

systemd_override__etc_dir: "{{ systemd_common__etc_dir }}/system"
systemd_override__service_dir: "{{ systemd_override__etc_dir }}/{{ systemd_override__service_name }}.service.d"
