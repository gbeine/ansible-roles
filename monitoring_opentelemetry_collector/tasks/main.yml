---

- name: 'Install and configure the OpenTelemetry Collector'
  tags: [ 'monitoring', 'monitoring_opentelemetry_collector' ]
  vars:
    monitoring_opentelemetry_collector__other_distributions: >-
      {{ monitoring_opentelemetry_collector__distributions | reject('eq', monitoring_opentelemetry_collector__distribution) | list }}
    monitoring_opentelemetry_collector__config_file: "/etc/{{ monitoring_opentelemetry_collector__distribution }}/config.yaml"
    # The package restarts the collector on its installation, the configuration and the secrets are written afterwards
    monitoring_opentelemetry_collector__restart_needed: >-
      {{ monitoring_opentelemetry_collector__config_result is changed
         or monitoring_opentelemetry_collector__secrets_result is changed
         or monitoring_opentelemetry_collector__secrets_removed is changed }}
    monitoring_opentelemetry_collector__installed_version: >-
      {{ (ansible_facts['packages'][monitoring_opentelemetry_collector__distribution] | default([{}]) | first).version | default('') }}
    monitoring_opentelemetry_collector__package: >-
      {{ monitoring_opentelemetry_collector__distribution ~ '_' ~ monitoring_opentelemetry_collector__release
         ~ '_linux_' ~ monitoring_opentelemetry_collector__architecture ~ '.deb' }}
    monitoring_opentelemetry_collector__package_url: >-
      {{ monitoring_opentelemetry_collector__download_url ~ '/v' ~ monitoring_opentelemetry_collector__release
         ~ '/' ~ monitoring_opentelemetry_collector__package }}
  block:

    # A failing template in the variables (e.g. an unknown filter or otelcol_config not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__config_rendered | to_json | length > 0
        quiet: true

    - name: 'Validate the variables'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_opentelemetry_collector__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_opentelemetry_collector__errors: >-
          {%- set errors = [] -%}
          {%- if monitoring_opentelemetry_collector__distribution is not string
                 or monitoring_opentelemetry_collector__distribution not in monitoring_opentelemetry_collector__distributions -%}
          {%-   set _ = errors.append('`otelcol_distribution` has to be one of ' ~ (monitoring_opentelemetry_collector__distributions | join(', '))
                                    ~ ': ' ~ monitoring_opentelemetry_collector__distribution ~ '.') -%}
          {%- endif -%}
          {%- if monitoring_opentelemetry_collector__version is not string
                 or monitoring_opentelemetry_collector__version is not match('^(latest|v?[0-9]+[.][0-9]+[.][0-9]+)$') -%}
          {%-   set _ = errors.append("`otelcol_version` has to be 'latest' or a release like 0.165.0: " ~ monitoring_opentelemetry_collector__version ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_opentelemetry_collector__invalid | join('. ') }}"
        quiet: true
      vars:
        monitoring_opentelemetry_collector__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = monitoring_opentelemetry_collector__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('`otelcol_secrets` has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('`otelcol_secrets` entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of `otelcol_secrets` have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    # The collector checks the configuration with validate before config.yaml is replaced
    - name: 'Validate the configuration'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_opentelemetry_collector__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_opentelemetry_collector__unknown: >-
          {{ monitoring_opentelemetry_collector__config.keys() | map('string') | reject('in', monitoring_opentelemetry_collector__config_allowed) | list }}
        # Fields carrying secrets with a value that is no reference of the environment, null and an empty string are allowed,
        # the lookahead also rejects white space, otherwise \s* would backtrack in front of the value
        monitoring_opentelemetry_collector__plain_secrets: >-
          {{ monitoring_opentelemetry_collector__config | to_json
             | regex_findall('"(' ~ (monitoring_opentelemetry_collector__config_secret_keys | join('|')) ~ ')"\s*:\s*(?![\s]|null|""|"\$\{env:)', ignorecase=true)
             | unique | list }}
        monitoring_opentelemetry_collector__errors: >-
          {%- set errors = [] -%}
          {%- if monitoring_opentelemetry_collector__unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown keys in `otelcol_config`: ' ~ (monitoring_opentelemetry_collector__unknown | join(', '))
                                    ~ ', allowed are ' ~ (monitoring_opentelemetry_collector__config_allowed | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if monitoring_opentelemetry_collector__plain_secrets | length > 0 -%}
          {%-   set _ = errors.append('These fields carry secrets, they are set with `otelcol_secrets`, not in `otelcol_config`: '
                                    ~ (monitoring_opentelemetry_collector__plain_secrets | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # The role writes the references of the secrets into the dictionaries of the paths,
    # a list or a value on the path would be replaced by the references
    - name: 'Validate the targets of the secrets'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_opentelemetry_collector__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_opentelemetry_collector__targets: "{{ monitoring_opentelemetry_collector__secrets | map(attribute='target') | map('string') | list }}"
        monitoring_opentelemetry_collector__names: >-
          {{ monitoring_opentelemetry_collector__secrets | map(attribute='name') | map('string')
             | reject('match', monitoring_opentelemetry_collector__secret_name_pattern) | list }}
        monitoring_opentelemetry_collector__unknown: >-
          {{ monitoring_opentelemetry_collector__targets
             | reject('in', monitoring_opentelemetry_collector__secrets_valid | map(attribute='path') | map('join', '.') | list) | list }}
        monitoring_opentelemetry_collector__errors: >-
          {%- set errors = [] -%}
          {%- set ns = namespace(set=[], paths=[]) -%}
          {%- for secret in monitoring_opentelemetry_collector__secrets_valid -%}
          {%-   set node = namespace(value=monitoring_opentelemetry_collector__config, broken=false) -%}
          {%-   for key in secret.path -%}
          {%-     if not node.broken and node.value is not none -%}
          {%-       if node.value is not mapping -%}
          {%-         set node.broken = true -%}
          {%-       else -%}
          {%-         set node.value = node.value[key] | default(none) -%}
          {%-       endif -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%-   if node.broken -%}
          {%-     set ns.paths = ns.paths + [ secret.path | join('.') ] -%}
          {%-   elif node.value is not none -%}
          {%-     set ns.set = ns.set + [ secret.path | join('.') ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- set duplicates = monitoring_opentelemetry_collector__targets | community.general.counter | dict2items | selectattr('value', 'gt', 1) | map(attribute='key') | list -%}
          {%- set data = monitoring_opentelemetry_collector__secrets | rejectattr('data', 'string') | map(attribute='name') | list
                         + monitoring_opentelemetry_collector__secrets | selectattr('data', 'string') | selectattr('data', 'search', '^$|[\r\n]') | map(attribute='name') | list -%}
          {%- if monitoring_opentelemetry_collector__names | length > 0 -%}
          {%-   set _ = errors.append('The names of `otelcol_secrets` are the names of their files and match '
                                    ~ monitoring_opentelemetry_collector__secret_name_pattern ~ ': ' ~ (monitoring_opentelemetry_collector__names | join(', ')) ~ '.') -%}
          {%- elif monitoring_opentelemetry_collector__unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (monitoring_opentelemetry_collector__unknown | join(', '))
                                    ~ ', the targets are paths of options of `otelcol_config` below '
                                    ~ (monitoring_opentelemetry_collector__config_allowed | join(', ')) ~ ', e.g. exporters.otlphttp/backend.headers.authorization.') -%}
          {%- endif -%}
          {%- if duplicates | length > 0 -%}
          {%-   set _ = errors.append('Every target of `otelcol_secrets` is set once: ' ~ (duplicates | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.set | length > 0 -%}
          {%-   set _ = errors.append('The targets of `otelcol_secrets` must not be set in `otelcol_config`: ' ~ (ns.set | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.paths | length > 0 -%}
          {%-   set _ = errors.append('The paths of these secrets lead through values of `otelcol_config` that are no dictionaries: ' ~ (ns.paths | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if data | length > 0 -%}
          {%-   set _ = errors.append('Secrets are strings that are not empty and without line breaks: ' ~ (data | unique | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Read the architecture of dpkg'
      ansible.builtin.command: 'dpkg --print-architecture'
      register: 'monitoring_opentelemetry_collector__dpkg_architecture'
      changed_when: false
      check_mode: false

    - name: 'Set the architecture of the package'
      ansible.builtin.set_fact:
        monitoring_opentelemetry_collector__architecture: >-
          {{ monitoring_opentelemetry_collector__architectures[monitoring_opentelemetry_collector__dpkg_architecture.stdout | trim] | default('') }}

    - name: 'Validate the architecture'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__architecture | length > 0
        fail_msg: >-
          No package of the OpenTelemetry Collector for the architecture {{ monitoring_opentelemetry_collector__dpkg_architecture.stdout | trim }},
          supported are {{ monitoring_opentelemetry_collector__architectures.keys() | join(', ') }}
        quiet: true

    - name: 'Read the releases of the OpenTelemetry Collector'
      ansible.builtin.uri:
        url: "{{ monitoring_opentelemetry_collector__releases_url }}"
        headers:
          Accept: 'application/vnd.github+json'
      register: 'monitoring_opentelemetry_collector__releases'
      check_mode: false
      when: monitoring_opentelemetry_collector__version == 'latest'

    # latest is the newest release of the collector with a package for the distribution and the architecture
    - name: 'Set the release'
      ansible.builtin.set_fact:
        monitoring_opentelemetry_collector__release: "{{ monitoring_opentelemetry_collector__release_json | trim | from_json }}"
      vars:
        monitoring_opentelemetry_collector__release_json: >-
          {% if monitoring_opentelemetry_collector__version == 'latest' %}
          {%   set ns = namespace(release='') %}
          {%   for release in monitoring_opentelemetry_collector__releases.json | rejectattr('draft') | rejectattr('prerelease')
                 if ns.release == '' and release.tag_name is match('^v[0-9]+[.][0-9]+[.][0-9]+$') %}
          {%     set version = release.tag_name[1:] %}
          {%     set package = monitoring_opentelemetry_collector__distribution ~ '_' ~ version ~ '_linux_'
                            ~ monitoring_opentelemetry_collector__architecture ~ '.deb' %}
          {%     if package in release.assets | map(attribute='name') %}
          {%       set ns.release = version %}
          {%     endif %}
          {%   endfor %}
          {{ ns.release | to_json }}
          {% else %}
          {{ monitoring_opentelemetry_collector__version | regex_replace('^v', '') | to_json }}
          {% endif %}

    - name: 'Validate the release'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__release | length > 0
        fail_msg: >-
          No release of the OpenTelemetry Collector with a package of {{ monitoring_opentelemetry_collector__distribution }}
          for {{ monitoring_opentelemetry_collector__architecture }} in {{ monitoring_opentelemetry_collector__releases_url }}
        quiet: true

    - name: 'Gather the installed packages'
      ansible.builtin.package_facts:
        manager: 'apt'

    # The distributions use the same ports with the default configuration, the other one is removed before the installation
    - name: 'Remove the other distributions'
      ansible.builtin.apt:
        name: "{{ monitoring_opentelemetry_collector__other_distributions }}"
        state: 'absent'
        purge: true

    # The package is downloaded only if the release is not installed, also in check mode to check the checksum
    - name: 'Install the package of the release'
      when: monitoring_opentelemetry_collector__installed_version != monitoring_opentelemetry_collector__release
      block:

        - name: 'Create a temporary directory for the package'
          ansible.builtin.tempfile:
            state: 'directory'
            suffix: '.otelcol'
          register: 'monitoring_opentelemetry_collector__tempdir'
          check_mode: false

        - name: 'Download the package and verify its checksum'
          ansible.builtin.get_url:
            url: "{{ monitoring_opentelemetry_collector__package_url }}"
            dest: "{{ monitoring_opentelemetry_collector__tempdir.path }}/{{ monitoring_opentelemetry_collector__package }}"
            checksum: "sha256:{{ monitoring_opentelemetry_collector__package_url }}.sha256"
            mode: '0644'
          check_mode: false

        # apt uses force-confdef and force-confold, the managed configuration is kept
        - name: 'Install the package'
          ansible.builtin.apt:
            deb: "{{ monitoring_opentelemetry_collector__tempdir.path }}/{{ monitoring_opentelemetry_collector__package }}"
          register: 'monitoring_opentelemetry_collector__package_result'

      always:

        - name: 'Remove the temporary directory of the package'
          ansible.builtin.file:
            path: "{{ monitoring_opentelemetry_collector__tempdir.path }}"
            state: 'absent'
          check_mode: false
          when: monitoring_opentelemetry_collector__tempdir.path is defined

    # The group is created by the package, in check mode of a first installation it is missing
    - name: 'Create the directory of the secrets'
      ansible.builtin.file:
        path: "{{ monitoring_opentelemetry_collector__secrets_dir }}"
        owner: 'root'
        group: "{{ monitoring_opentelemetry_collector__groups[monitoring_opentelemetry_collector__distribution] }}"
        mode: '0750'
        state: 'directory'

    # The collector uses the content of the file verbatim for string fields (the original of confmap),
    # the secret is written as it is without a line break, quotes would become part of the value
    - name: 'Write the secrets'
      no_log: true
      ansible.builtin.copy:
        content: "{{ item.data | string }}"
        dest: "{{ monitoring_opentelemetry_collector__secrets_dir }}/{{ item.name }}"
        owner: 'root'
        group: "{{ monitoring_opentelemetry_collector__groups[monitoring_opentelemetry_collector__distribution] }}"
        mode: '0640'
      loop: "{{ monitoring_opentelemetry_collector__secrets }}"
      register: 'monitoring_opentelemetry_collector__secrets_result'

    - name: 'Find the files of the secrets'
      ansible.builtin.find:
        paths: "{{ monitoring_opentelemetry_collector__secrets_dir }}"
        file_type: 'file'
      register: 'monitoring_opentelemetry_collector__secret_files'
      check_mode: false

    - name: 'Remove the files of removed secrets'
      ansible.builtin.file:
        path: "{{ item }}"
        state: 'absent'
      loop: >-
        {{ monitoring_opentelemetry_collector__secret_files.files | map(attribute='path')
           | reject('in', monitoring_opentelemetry_collector__secrets | map(attribute='name')
                          | map('regex_replace', '^', monitoring_opentelemetry_collector__secrets_dir ~ '/') | list) | list }}
      register: 'monitoring_opentelemetry_collector__secrets_removed'

    # validate resolves the references of the secrets, copy does not run it in check mode
    - name: 'Write the configuration'
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (monitoring_opentelemetry_collector)
          # To limit exposure to denial of service attacks, change the host in endpoints below from 0.0.0.0 to a specific network interface.
          # See https://github.com/open-telemetry/opentelemetry-collector/blob/main/docs/security-best-practices.md#safeguards-against-denial-of-service-attacks

          {{ monitoring_opentelemetry_collector__config_rendered | to_nice_yaml(indent=2, sort_keys=false) }}
        dest: "{{ monitoring_opentelemetry_collector__config_file }}"
        owner: 'root'
        group: "{{ monitoring_opentelemetry_collector__groups[monitoring_opentelemetry_collector__distribution] }}"
        mode: '0640'
        validate: "/usr/bin/{{ monitoring_opentelemetry_collector__distribution }} validate --config=%s"
      register: 'monitoring_opentelemetry_collector__config_result'

    # In check mode of a first installation the unit of the package is missing
    - name: 'Enable and start the collector'
      ansible.builtin.systemd_service:
        name: "{{ monitoring_opentelemetry_collector__distribution }}.service"
        enabled: true
        state: 'started'
      when: not ansible_check_mode or monitoring_opentelemetry_collector__installed_version | length > 0

    - name: 'Restart the collector with the changed configuration'
      ansible.builtin.systemd_service:
        name: "{{ monitoring_opentelemetry_collector__distribution }}.service"
        state: 'restarted'
      when:
        - monitoring_opentelemetry_collector__restart_needed | bool
        - not ansible_check_mode or monitoring_opentelemetry_collector__installed_version | length > 0
