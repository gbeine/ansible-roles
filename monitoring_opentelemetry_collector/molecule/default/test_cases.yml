---
# Release of the collector installed by prepare and the releases of the test case of otelcol-contrib
monitoring_opentelemetry_collector__test_prepare_release: '0.164.0'

# Own configuration of otelcol-contrib, OTLP on localhost only
monitoring_opentelemetry_collector__test_contrib_config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: '127.0.0.1:4317'
  processors:
    batch:
  exporters:
    debug:
      verbosity: 'basic'
  service:
    pipelines:
      metrics:
        receivers: [ 'otlp' ]
        processors: [ 'batch' ]
        exporters: [ 'debug' ]
      traces:
        receivers: [ 'otlp' ]
        processors: [ 'batch' ]
        exporters: [ 'debug' ]

monitoring_opentelemetry_collector__test_cases:

  # Defaults: the latest release of otelcol with the default configuration
  - name: 'molecule-otelcol'
    prepare: false
    role_vars: {}
    expect:
      package: 'otelcol'
      # latest is determined like by the role
      version: 'latest'
      absent: [ 'otelcol-contrib' ]
      config: 'default'
      group: 'otel'
      address: '0.0.0.0'

  # otelcol-contrib with a fixed release and an own configuration, prepare installs otelcol that has to be removed
  - name: 'molecule-otelcol-contrib'
    prepare: true
    role_vars:
      otelcol_distribution: 'otelcol-contrib'
      otelcol_version: 'v0.163.2'
      otelcol_config: "{{ monitoring_opentelemetry_collector__test_contrib_config }}"
    side_effect:
      otelcol_version: '0.164.0'
    expect:
      package: 'otelcol-contrib'
      # After the update in side_effect
      version: '0.164.0'
      absent: [ 'otelcol' ]
      config: "{{ monitoring_opentelemetry_collector__test_contrib_config }}"
      group: 'otelcol-contrib'
      address: '127.0.0.1'
