---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'
    # The default configuration of the role
    - '../../defaults/main.yml'

  vars:
    monitoring_opentelemetry_collector__test_case: "{{ monitoring_opentelemetry_collector__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_opentelemetry_collector__test_expect: "{{ monitoring_opentelemetry_collector__test_case.expect }}"
    # The configuration is merged over the default, the role adds the references of the secrets
    monitoring_opentelemetry_collector__test_config: >-
      {{ monitoring_opentelemetry_collector__config_default | combine(monitoring_opentelemetry_collector__test_expect.config)
         | combine(monitoring_opentelemetry_collector__test_expect.references, recursive=true) }}

  tasks:

    - name: 'Read the architecture of dpkg'
      ansible.builtin.command: 'dpkg --print-architecture'
      register: 'monitoring_opentelemetry_collector__test_architecture'
      changed_when: false

    - name: 'Read the releases of the OpenTelemetry Collector'
      ansible.builtin.uri:
        url: "{{ monitoring_opentelemetry_collector__releases_url }}"
        headers:
          Accept: 'application/vnd.github+json'
      register: 'monitoring_opentelemetry_collector__test_releases'
      when: monitoring_opentelemetry_collector__test_expect.version == 'latest'

    - name: 'Set the expected version'
      ansible.builtin.set_fact:
        monitoring_opentelemetry_collector__test_version: "{{ monitoring_opentelemetry_collector__test_version_json | trim | from_json }}"
      vars:
        monitoring_opentelemetry_collector__test_version_json: >-
          {% if monitoring_opentelemetry_collector__test_expect.version == 'latest' %}
          {%   set ns = namespace(release='') %}
          {%   for release in monitoring_opentelemetry_collector__test_releases.json | rejectattr('draft') | rejectattr('prerelease')
                 if ns.release == '' and release.tag_name is match('^v[0-9]+[.][0-9]+[.][0-9]+$') %}
          {%     set package = monitoring_opentelemetry_collector__test_expect.package ~ '_' ~ release.tag_name[1:] ~ '_linux_'
                                ~ (monitoring_opentelemetry_collector__test_architecture.stdout | trim) ~ '.deb' %}
          {%     if package in release.assets | map(attribute='name') %}{% set ns.release = release.tag_name[1:] %}{% endif %}
          {%   endfor %}
          {{ ns.release | to_json }}
          {% else %}
          {{ monitoring_opentelemetry_collector__test_expect.version | to_json }}
          {% endif %}

    - name: 'Read the installed distributions'
      ansible.builtin.command:
        argv: [ 'dpkg-query', '--show', '--showformat=${Version} ${db:Status-Status}', "{{ item }}" ]
      loop: "{{ [monitoring_opentelemetry_collector__test_expect.package] + monitoring_opentelemetry_collector__test_expect.absent }}"
      register: 'monitoring_opentelemetry_collector__test_packages'
      changed_when: false
      failed_when: false

    - name: 'Assert the distribution is installed in the expected version and the other one is removed'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__test_version | length > 0
          - monitoring_opentelemetry_collector__test_packages.results[0].stdout == monitoring_opentelemetry_collector__test_version ~ ' installed'
          - >-
            monitoring_opentelemetry_collector__test_packages.results[1:] | map(attribute='stdout')
            | select('search', 'installed|config-files') | list | length == 0
        fail_msg: >-
          expected {{ monitoring_opentelemetry_collector__test_expect.package }} {{ monitoring_opentelemetry_collector__test_version }}:
          {{ monitoring_opentelemetry_collector__test_packages.results | map(attribute='item')
             | zip(monitoring_opentelemetry_collector__test_packages.results | map(attribute='stdout')) | list }}

    - name: 'Read the state of the collector'
      ansible.builtin.command:
        argv: [ 'systemctl', "{{ item }}", "{{ monitoring_opentelemetry_collector__test_expect.package }}" ]
      loop: [ 'is-active', 'is-enabled' ]
      register: 'monitoring_opentelemetry_collector__test_service'
      changed_when: false
      failed_when: false

    - name: 'Assert the collector is active and enabled'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__test_service.results[0].stdout == 'active'
          - monitoring_opentelemetry_collector__test_service.results[1].stdout == 'enabled'
        fail_msg: "{{ monitoring_opentelemetry_collector__test_service.results | map(attribute='stdout') | join(', ') }}"

    - name: 'Read the configuration'
      ansible.builtin.slurp:
        src: "/etc/{{ monitoring_opentelemetry_collector__test_expect.package }}/config.yaml"
      register: 'monitoring_opentelemetry_collector__test_config_file'

    - name: 'Read the attributes of the configuration'
      ansible.builtin.stat:
        path: "/etc/{{ monitoring_opentelemetry_collector__test_expect.package }}/config.yaml"
      register: 'monitoring_opentelemetry_collector__test_config_stat'

    - name: 'Assert the configuration'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__test_config_file.content | b64decode | from_yaml == monitoring_opentelemetry_collector__test_config
          - monitoring_opentelemetry_collector__test_config_stat.stat.pw_name == 'root'
          - monitoring_opentelemetry_collector__test_config_stat.stat.gr_name == monitoring_opentelemetry_collector__test_expect.group
          - monitoring_opentelemetry_collector__test_config_stat.stat.mode == '0640'
        fail_msg: "{{ monitoring_opentelemetry_collector__test_config_file.content | b64decode }}"

    - name: 'Read the files of the secrets'
      ansible.builtin.slurp:
        src: "/etc/{{ monitoring_opentelemetry_collector__test_expect.package }}/secrets/{{ item.key }}"
      loop: "{{ monitoring_opentelemetry_collector__test_expect.secrets | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: 'monitoring_opentelemetry_collector__test_secret_files'

    - name: 'Read the attributes of the files of the secrets'
      ansible.builtin.stat:
        path: "/etc/{{ monitoring_opentelemetry_collector__test_expect.package }}/secrets/{{ item.key }}"
      loop: "{{ monitoring_opentelemetry_collector__test_expect.secrets | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: 'monitoring_opentelemetry_collector__test_secret_stat'

    # The files contain the secrets verbatim
    - name: 'Assert the files of the secrets and that config.yaml does not contain them'
      ansible.builtin.assert:
        that:
          - >-
            monitoring_opentelemetry_collector__test_secret_files.results | map(attribute='content') | map('b64decode') | list
            == monitoring_opentelemetry_collector__test_expect.secrets.values() | list
          - monitoring_opentelemetry_collector__test_secret_stat.results | map(attribute='stat.pw_name') | reject('eq', 'root') | list | length == 0
          - >-
            monitoring_opentelemetry_collector__test_secret_stat.results | map(attribute='stat.gr_name')
            | reject('eq', monitoring_opentelemetry_collector__test_expect.group) | list | length == 0
          - monitoring_opentelemetry_collector__test_secret_stat.results | map(attribute='stat.mode') | reject('eq', '0640') | list | length == 0
          - >-
            monitoring_opentelemetry_collector__test_expect.secrets.values()
            | select('in', monitoring_opentelemetry_collector__test_config_file.content | b64decode) | list | length == 0
        fail_msg: >-
          content {{ monitoring_opentelemetry_collector__test_secret_files.results | map(attribute='content') | map('b64decode') | list | to_json }},
          owner {{ monitoring_opentelemetry_collector__test_secret_stat.results | map(attribute='stat.pw_name') | list | to_json }},
          group {{ monitoring_opentelemetry_collector__test_secret_stat.results | map(attribute='stat.gr_name') | list | to_json }},
          mode {{ monitoring_opentelemetry_collector__test_secret_stat.results | map(attribute='stat.mode') | list | to_json }}

    # systemd counts only the restarts after a crash, a restart loop is reported with the journal
    - name: 'Read the automatic restarts of the collector'
      ansible.builtin.command:
        argv: [ 'systemctl', 'show', '--property=NRestarts', '--value', "{{ monitoring_opentelemetry_collector__test_expect.package }}" ]
      register: 'monitoring_opentelemetry_collector__test_restarts'
      changed_when: false

    - name: 'Read the journal of the collector'
      ansible.builtin.command:
        argv: [ 'journalctl', '-u', "{{ monitoring_opentelemetry_collector__test_expect.package }}", '-n', '80', '--no-pager' ]
      register: 'monitoring_opentelemetry_collector__test_journal'
      changed_when: false
      failed_when: false

    - name: 'Assert that the collector did not restart by itself'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__test_restarts.stdout | int == 0
        fail_msg: >-
          {{ [ 'automatic restarts: ' ~ monitoring_opentelemetry_collector__test_restarts.stdout ]
             + monitoring_opentelemetry_collector__test_journal.stdout_lines | default([]) }}

    - name: 'Wait for the OTLP port'
      ansible.builtin.wait_for:
        host: >-
          {{ '127.0.0.1' if monitoring_opentelemetry_collector__test_expect.address == '0.0.0.0'
             else monitoring_opentelemetry_collector__test_expect.address }}
        port: 4317
        timeout: 30

    - name: 'Read the listening address of the OTLP port'
      ansible.builtin.command: 'ss -Hltn sport = :4317'
      register: 'monitoring_opentelemetry_collector__test_listen'
      changed_when: false

    - name: 'Assert the OTLP port listens on the expected address'
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__test_listen.stdout is search(monitoring_opentelemetry_collector__test_expect.address ~ ':4317|[*]:4317')
          - >-
            monitoring_opentelemetry_collector__test_expect.address == '0.0.0.0'
            or monitoring_opentelemetry_collector__test_listen.stdout is not search('[*]:4317|0[.]0[.]0[.]0:4317')
        fail_msg: "{{ monitoring_opentelemetry_collector__test_listen.stdout }}"

    # The collector reads the secret from its file and sends it as header of the export, the header must not contain quotes
    - name: 'Send a trace and receive the export with the secret'
      when: monitoring_opentelemetry_collector__test_expect.export_authorization is defined
      monitoring_opentelemetry_collector_test_export:
        receiver: 'http://127.0.0.1:4318/v1/traces'
        listen_port: 4319
      register: 'monitoring_opentelemetry_collector__test_export'

    - name: 'Assert the export carries the secret verbatim'
      when: monitoring_opentelemetry_collector__test_expect.export_authorization is defined
      ansible.builtin.assert:
        that:
          - monitoring_opentelemetry_collector__test_export.path == '/v1/traces'
          - monitoring_opentelemetry_collector__test_export.headers['authorization'] | default('') == monitoring_opentelemetry_collector__test_expect.export_authorization
          - monitoring_opentelemetry_collector__test_export.headers['x-molecule'] | default('') == 'molecule'
        fail_msg: "{{ monitoring_opentelemetry_collector__test_export.headers | default({}) | to_json }}"

    - name: 'Read the groups'
      ansible.builtin.getent:
        database: 'group'

    # The running process only has the groups it was started with, the restart has to take the new group over
    - name: 'Read the groups of the running collector'
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          grep '^Groups:' /proc/$(systemctl show --property=MainPID --value {{ monitoring_opentelemetry_collector__test_expect.package }})/status
        executable: '/bin/bash'
      register: 'monitoring_opentelemetry_collector__test_process_groups'
      changed_when: false

    # systemd-journal with otelcol_journal_enabled, adm with otelcol_logs_enabled
    - name: 'Assert the memberships of the service user and the groups of the running collector'
      ansible.builtin.assert:
        that:
          - (monitoring_opentelemetry_collector__test_user in monitoring_opentelemetry_collector__test_members) == (item.expect | bool)
          - (monitoring_opentelemetry_collector__test_gid in monitoring_opentelemetry_collector__test_process_groups.stdout.split()[1:]) == (item.expect | bool)
        fail_msg: >-
          {{ item.group }}: members {{ monitoring_opentelemetry_collector__test_members }}, gid {{ monitoring_opentelemetry_collector__test_gid }},
          process {{ monitoring_opentelemetry_collector__test_process_groups.stdout }}
      loop:
        - { group: 'systemd-journal', expect: "{{ monitoring_opentelemetry_collector__test_expect.journal }}" }
        - { group: 'adm', expect: "{{ monitoring_opentelemetry_collector__test_expect.logs }}" }
      loop_control:
        label: "{{ item.group }}"
      vars:
        monitoring_opentelemetry_collector__test_user: >-
          {{ 'otel' if monitoring_opentelemetry_collector__test_expect.package == 'otelcol' else 'otelcol-contrib' }}
        monitoring_opentelemetry_collector__test_gid: "{{ ansible_facts.getent_group[item.group][1] }}"
        monitoring_opentelemetry_collector__test_members: "{{ ansible_facts.getent_group[item.group][2].split(',') | select | list }}"
