---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_opentelemetry_collector__test_case: "{{ monitoring_opentelemetry_collector__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_opentelemetry_collector__test_package: >-
      otelcol_{{ monitoring_opentelemetry_collector__test_prepare_release }}_linux_{{ monitoring_opentelemetry_collector__test_architecture.stdout | trim }}.deb
    monitoring_opentelemetry_collector__test_download_url: >-
      https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ monitoring_opentelemetry_collector__test_prepare_release }}

  tasks:

    # The test architectures amd64 and arm64 have the same names in dpkg and in the packages
    - name: 'Read the architecture of dpkg'
      ansible.builtin.command: 'dpkg --print-architecture'
      register: 'monitoring_opentelemetry_collector__test_architecture'
      changed_when: false
      when: monitoring_opentelemetry_collector__test_case.prepare | bool

    - name: 'Download otelcol, the role has to remove it'
      ansible.builtin.get_url:
        url: "{{ monitoring_opentelemetry_collector__test_download_url }}/{{ monitoring_opentelemetry_collector__test_package }}"
        dest: "/root/{{ monitoring_opentelemetry_collector__test_package }}"
        mode: '0644'
      when: monitoring_opentelemetry_collector__test_case.prepare | bool

    - name: 'Install otelcol, the role has to remove it'
      ansible.builtin.apt:
        deb: "/root/{{ monitoring_opentelemetry_collector__test_package }}"
      when: monitoring_opentelemetry_collector__test_case.prepare | bool
