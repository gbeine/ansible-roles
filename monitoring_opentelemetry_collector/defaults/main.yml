---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-opentelemetry-collector
#

# 'latest' or a release like '0.165.0' or 'v0.165.0'
monitoring_opentelemetry_collector__version: "{{ otelcol_version | default('latest') }}"
# 'otelcol' or 'otelcol-contrib'
monitoring_opentelemetry_collector__distribution: "{{ otelcol_distribution | default('otelcol') }}"
# The configuration of the collector, every key replaces the key of the default, null removes a key
monitoring_opentelemetry_collector__config: "{{ monitoring_opentelemetry_collector__config_default | combine(otelcol_config | default({})) }}"

# Secrets with name, data and target, the target is the path of the option in otelcol_config,
# e.g. exporters.otlphttp/backend.headers.authorization, the configuration reads the file of the secret
monitoring_opentelemetry_collector__secrets: "{{ otelcol_secrets | default([]) }}"

# The service user becomes a member of systemd-journal and reads the journal, e.g. for the receiver journald of otelcol-contrib
monitoring_opentelemetry_collector__journal_enabled: "{{ otelcol_journal_enabled | default(false) }}"

# The service user becomes a member of adm and reads the logs of /var/log, e.g. for the receiver filelog of otelcol-contrib
monitoring_opentelemetry_collector__logs_enabled: "{{ otelcol_logs_enabled | default(false) }}"

#
# Defaults - do not change
#

# otelcol-prometheus and otelcol-otlp come without configuration and without the components of the default configuration
monitoring_opentelemetry_collector__distributions: [ 'otelcol', 'otelcol-contrib' ]
# Group of the user the service runs as, created by the package
monitoring_opentelemetry_collector__groups:
  otelcol: 'otel'
  otelcol-contrib: 'otelcol-contrib'
# The user the service runs as, created by the package
monitoring_opentelemetry_collector__users:
  otelcol: 'otel'
  otelcol-contrib: 'otelcol-contrib'
# The members of this group read the journal of systemd
monitoring_opentelemetry_collector__journal_group: 'systemd-journal'
# The members of this group read the logs of Debian and of webserver_traefik
monitoring_opentelemetry_collector__logs_group: 'adm'

monitoring_opentelemetry_collector__repository: 'open-telemetry/opentelemetry-collector-releases'
# The repository releases other tools too (cmd/builder/..., cmd/opampsupervisor/...), the collector has tags v<version>
monitoring_opentelemetry_collector__releases_url: "https://api.github.com/repos/{{ monitoring_opentelemetry_collector__repository }}/releases?per_page=30"
monitoring_opentelemetry_collector__download_url: "https://github.com/{{ monitoring_opentelemetry_collector__repository }}/releases/download"

# Architecture of dpkg to the architecture in the names of the packages
monitoring_opentelemetry_collector__architectures:
  amd64: 'amd64'
  arm64: 'arm64'
  i386: '386'
  armhf: 'armv7'
  ppc64el: 'ppc64le'
  s390x: 's390x'

# /etc/otelcol/config.yaml of the package otelcol 0.165.0, the same in otelcol-contrib
monitoring_opentelemetry_collector__config_default:
  extensions:
    health_check:
    pprof:
      endpoint: '0.0.0.0:1777'
    zpages:
      endpoint: '0.0.0.0:55679'
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: '0.0.0.0:4317'
        http:
          endpoint: '0.0.0.0:4318'
    # Collect own metrics
    prometheus:
      config:
        scrape_configs:
          - job_name: 'otel-collector'
            scrape_interval: '10s'
            static_configs:
              - targets: [ '0.0.0.0:8888' ]
    jaeger:
      protocols:
        grpc:
          endpoint: '0.0.0.0:14250'
        thrift_binary:
          endpoint: '0.0.0.0:6832'
        thrift_compact:
          endpoint: '0.0.0.0:6831'
        thrift_http:
          endpoint: '0.0.0.0:14268'
    zipkin:
      endpoint: '0.0.0.0:9411'
  processors:
    batch:
  exporters:
    debug:
      verbosity: 'detailed'
  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: '127.0.0.1'
                  port: 8888
                  without_scope_info: true
                  without_type_suffix: true
                  without_units: true
                  with_resource_constant_labels:
                    included: []
    pipelines:
      traces:
        receivers: [ 'otlp', 'jaeger', 'zipkin' ]
        processors: [ 'batch' ]
        exporters: [ 'debug' ]
      metrics:
        receivers: [ 'otlp', 'prometheus' ]
        processors: [ 'batch' ]
        exporters: [ 'debug' ]
      logs:
        receivers: [ 'otlp' ]
        processors: [ 'batch' ]
        exporters: [ 'debug' ]
    extensions: [ 'health_check', 'pprof', 'zpages' ]

# Generated from Config in otelcol/config.go of the OpenTelemetry Collector v0.165.0, the collector checks the keys below
monitoring_opentelemetry_collector__config_allowed: [ 'receivers', 'exporters', 'processors', 'connectors', 'extensions', 'service' ]

# Fields carrying secrets, they are set with otelcol_secrets, a reference of the environment (${env:NAME}) is allowed
monitoring_opentelemetry_collector__config_secret_keys: [ 'password', 'client_secret', 'bearer_token', 'api_key', 'token', 'authorization' ]

# The names of the secrets are the names of their files
monitoring_opentelemetry_collector__secret_name_pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'

# The keys of the paths of the targets, component IDs contain / (e.g. otlphttp/backend)
monitoring_opentelemetry_collector__secret_target_pattern: '^[A-Za-z0-9_/-]+([.][A-Za-z0-9_/-]+)+$'

monitoring_opentelemetry_collector__secrets_dir: "/etc/{{ monitoring_opentelemetry_collector__distribution }}/secrets"

# The valid secrets with their path, broken entries are left out, the validation reports them
monitoring_opentelemetry_collector__secrets_valid: >-
  {%- set result = [] -%}
  {%- set secrets = monitoring_opentelemetry_collector__secrets -%}
  {%- if secrets is sequence and secrets is not string and secrets is not mapping -%}
  {%-   for secret in secrets if secret is mapping and secret.name is defined and secret.target is defined and secret.target is string
                                and secret.name | string is match(monitoring_opentelemetry_collector__secret_name_pattern)
                                and secret.target is match(monitoring_opentelemetry_collector__secret_target_pattern)
                                and (secret.target | split('.') | first) in monitoring_opentelemetry_collector__config_allowed -%}
  {%-     set _ = result.append({ 'name': secret.name | string, 'path': secret.target | split('.') }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ result }}

# The references of the secrets as nested dictionaries, e.g. { 'exporters': { 'otlphttp': { 'headers': { 'authorization': '${file:…}' } } } }
monitoring_opentelemetry_collector__config_secrets: >-
  {%- set ns = namespace(result={}) -%}
  {%- for secret in monitoring_opentelemetry_collector__secrets_valid -%}
  {%-   set node = namespace(value='${file:' ~ monitoring_opentelemetry_collector__secrets_dir ~ '/' ~ secret.name ~ '}') -%}
  {%-   for key in secret.path | reverse -%}
  {%-     set node.value = { key: node.value } -%}
  {%-   endfor -%}
  {%-   set ns.result = ns.result | combine(node.value, recursive=true) -%}
  {%- endfor -%}
  {{ ns.result }}

# The content of config.yaml: the configuration without the removed keys and with the references of the secrets
monitoring_opentelemetry_collector__config_rendered: >-
  {{ monitoring_opentelemetry_collector__config | dict2items | rejectattr('value', 'none') | items2dict
     | combine(monitoring_opentelemetry_collector__config_secrets, recursive=true) }}
