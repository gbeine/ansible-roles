---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-opentelemetry-collector
#

# 'latest' or a release like '0.164.0' or 'v0.164.0'
monitoring_opentelemetry_collector__version: "{{ otelcol_version | default('latest') }}"
# 'otelcol' or 'otelcol-contrib'
monitoring_opentelemetry_collector__distribution: "{{ otelcol_distribution | default('otelcol') }}"
# Replaces the configuration completely
monitoring_opentelemetry_collector__config: "{{ otelcol_config | default(monitoring_opentelemetry_collector__config_default) }}"

#
# Defaults - do not change
#

# otelcol-prometheus and otelcol-otlp come without configuration and without the components of the default configuration
monitoring_opentelemetry_collector__distributions: [ 'otelcol', 'otelcol-contrib' ]
# Group of the user the service runs as, created by the package
monitoring_opentelemetry_collector__groups:
  otelcol: 'otel'
  otelcol-contrib: 'otelcol-contrib'

monitoring_opentelemetry_collector__repository: 'open-telemetry/opentelemetry-collector-releases'
# The repository releases other tools too (cmd/builder/..., cmd/opampsupervisor/...), the collector has tags v<version>
monitoring_opentelemetry_collector__releases_url: "https://api.github.com/repos/{{ monitoring_opentelemetry_collector__repository }}/releases?per_page=30"
monitoring_opentelemetry_collector__download_url: "https://github.com/{{ monitoring_opentelemetry_collector__repository }}/releases/download"

# Architecture of dpkg to the architecture in the names of the packages
monitoring_opentelemetry_collector__architectures:
  amd64: 'amd64'
  arm64: 'arm64'
  i386: '386'
  armhf: 'armv7'
  ppc64el: 'ppc64le'
  s390x: 's390x'

# /etc/otelcol/config.yaml of the package otelcol 0.164.0, the same in otelcol-contrib
monitoring_opentelemetry_collector__config_default:
  extensions:
    health_check:
    pprof:
      endpoint: '0.0.0.0:1777'
    zpages:
      endpoint: '0.0.0.0:55679'
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: '0.0.0.0:4317'
        http:
          endpoint: '0.0.0.0:4318'
    # Collect own metrics
    prometheus:
      config:
        scrape_configs:
          - job_name: 'otel-collector'
            scrape_interval: '10s'
            static_configs:
              - targets: [ '0.0.0.0:8888' ]
    jaeger:
      protocols:
        grpc:
          endpoint: '0.0.0.0:14250'
        thrift_binary:
          endpoint: '0.0.0.0:6832'
        thrift_compact:
          endpoint: '0.0.0.0:6831'
        thrift_http:
          endpoint: '0.0.0.0:14268'
    zipkin:
      endpoint: '0.0.0.0:9411'
  processors:
    batch:
  exporters:
    debug:
      verbosity: 'detailed'
  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: '127.0.0.1'
                  port: 8888
                  without_scope_info: true
                  without_type_suffix: true
                  without_units: true
                  with_resource_constant_labels:
                    included: []
    pipelines:
      traces:
        receivers: [ 'otlp', 'jaeger', 'zipkin' ]
        processors: [ 'batch' ]
        exporters: [ 'debug' ]
      metrics:
        receivers: [ 'otlp', 'prometheus' ]
        processors: [ 'batch' ]
        exporters: [ 'debug' ]
      logs:
        receivers: [ 'otlp' ]
        processors: [ 'batch' ]
        exporters: [ 'debug' ]
    extensions: [ 'health_check', 'pprof', 'zpages' ]
