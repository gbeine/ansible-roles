---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/container-podman
#

container_podman__networks: "{{ podman_networks | default([]) }}"
container_podman__networks_prune: "{{ podman_networks_prune | default(true) }}"
container_podman__networks_protected: "{{ podman_networks_protected | default(['podman']) }}"

container_podman__socket_enabled: "{{ podman_socket_enabled | default(true) }}"

container_podman__tcp_address: "{{ podman_tcp_address | default('') }}"
container_podman__tcp_port: "{{ podman_tcp_port | default(2376) }}"
container_podman__tcp_requires: "{{ podman_tcp_requires | default([]) }}"

container_podman__cleanup_enabled: "{{ podman_cleanup_enabled | default(true) }}"
container_podman__cleanup_on_calendar: "{{ podman_cleanup_on_calendar | default('*-*-* 02:00:00') }}"

# Defaults - do not change
container_podman__apt_cache_valid_time: 3600
container_podman__quadlet_dir: '/etc/containers/systemd'
container_podman__systemd_dir: '/etc/systemd/system'
