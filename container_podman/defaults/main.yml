---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/container-podman
#

container_podman__networks: "{{ podman_networks | default([]) }}"
container_podman__default_network: "{{ podman_default_network | default('') }}"
container_podman__networks_prune: "{{ podman_networks_prune | default(true) }}"
# The default network is always protected
container_podman__networks_protected: "{{ (podman_networks_protected | default(['podman'])) + [container_podman__default_network] }}"

container_podman__socket_enabled: "{{ podman_socket_enabled | default(true) }}"
# With podman_socket_group_assign the role creates the system group and writes a drop-in of podman.socket,
# members of the group can write to the socket of podman, the GID is allocated by adduser unless podman_socket_gid is set
container_podman__socket_group_assign: "{{ podman_socket_group_assign | default(false) }}"
container_podman__socket_group: "{{ podman_socket_group | default('podman') }}"
container_podman__socket_gid: "{{ podman_socket_gid }}"
container_podman__socket_mode: "{{ podman_socket_mode | default('0660') }}"

# podman_tcp_enable starts podman-tcp.service, podman_tcp_address is mandatory then and unused without it
container_podman__tcp_enable: "{{ podman_tcp_enable | default(false) }}"
container_podman__tcp_address: "{{ podman_tcp_address | mandatory }}"
container_podman__tcp_port: "{{ podman_tcp_port | default(2376) }}"
container_podman__tcp_requires: "{{ podman_tcp_requires | default([]) }}"

container_podman__cleanup_enabled: "{{ podman_cleanup_enabled | default(true) }}"
container_podman__cleanup_on_calendar: "{{ podman_cleanup_on_calendar | default('*-*-* 02:00:00') }}"

# Defaults - do not change
container_podman__apt_cache_valid_time: 3600
container_podman__quadlet_dir: '/etc/containers/systemd'
container_podman__podman_binary: '/usr/bin/podman'
container_podman__systemd_dir: '/etc/systemd/system'
container_podman__socket_dropin_dir: '/etc/systemd/system/podman.socket.d'
# Names of groups
container_podman__group_pattern: '^[a-z_][a-z0-9_-]{0,31}$'
