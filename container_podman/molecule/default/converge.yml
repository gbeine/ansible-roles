---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    container_podman__test_case: "{{ container_podman__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  pre_tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ container_podman__test_case.converge.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  roles:
    - role: 'common_filters'

  tasks:

    - name: 'Run container_podman'
      ansible.builtin.include_role:
        name: 'container_podman'
