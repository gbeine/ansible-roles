---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    container_podman__test_case: "{{ container_podman__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  roles:
    - role: 'common_filters'

  tasks:

    - name: 'Set the role variables of the first run'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ container_podman__test_case.converge.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # apt does not update the package lists in check mode
    - name: 'Update the package lists, as on a host that is already in use'
      ansible.builtin.apt:
        update_cache: true

    # podman is not installed yet, in check mode the role has to stop after the installation
    - name: 'Run container_podman in check mode without podman'
      ansible.builtin.include_role:
        name: 'container_podman'
        apply:
          check_mode: true

    - name: 'Read podman and the network quadlets after the check mode run'
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - '/usr/bin/podman'
        - '/etc/containers/systemd/molnet-a.network'
      register: 'container_podman__test_check_mode'

    - name: 'Assert the check mode run changed nothing'
      ansible.builtin.assert:
        that:
          - container_podman__test_check_mode.results | selectattr('stat.exists') | list | length == 0
        fail_msg: "Exists after the check mode run: {{ container_podman__test_check_mode.results | selectattr('stat.exists') | map(attribute='item') | join(', ') }}"

    - name: 'Install podman'
      ansible.builtin.apt:
        pkg: 'podman'
        install_recommends: false
        update_cache: true

    - name: 'Read existing networks'
      ansible.builtin.command: 'podman network ls --format {% raw %}"{{.Name}}"{% endraw %}'
      register: 'container_podman__test_networks'
      changed_when: false

    - name: 'Create unused networks'
      ansible.builtin.command:
        argv: [ 'podman', 'network', 'create', "{{ item }}" ]
      loop: "{{ container_podman__test_case.prepare.networks_unused + container_podman__test_case.prepare.networks_in_use | map(attribute='network') | list }}"
      when: item not in container_podman__test_networks.stdout_lines
      changed_when: true

    - name: 'Read existing containers'
      ansible.builtin.command: 'podman ps --all --format {% raw %}"{{.Names}}"{% endraw %}'
      register: 'container_podman__test_containers'
      changed_when: false

    - name: 'Attach containers to networks in use'
      ansible.builtin.command:
        argv:
          - 'podman'
          - 'create'
          - '--name'
          - "{{ item.container }}"
          - '--network'
          - "{{ item.network }}"
          - "{{ container_podman__test_case.image }}"
          - 'sleep'
          - 'infinity'
      loop: "{{ container_podman__test_case.prepare.networks_in_use }}"
      loop_control:
        label: "{{ item.container }}"
      when: item.container not in container_podman__test_containers.stdout_lines
      changed_when: true

    - name: 'Create the quadlet directory'
      ansible.builtin.file:
        path: '/etc/containers/systemd'
        state: directory
        mode: '755'

    - name: 'Create orphaned network quadlets'
      ansible.builtin.copy:
        dest: "/etc/containers/systemd/{{ item }}.network"
        content: |
          [Network]
          NetworkName={{ item }}
        mode: '644'
      loop: "{{ container_podman__test_case.prepare.quadlets_orphaned }}"
