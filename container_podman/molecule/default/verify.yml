---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    container_podman__test_case: "{{ container_podman__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  roles:
    - role: 'common_filters'

  tasks:

    - name: 'Check the state after the second run'
      ansible.builtin.include_tasks: 'tasks/check_state.yml'
      vars:
        container_podman__test_expect: "{{ container_podman__test_case.expect.side_effect }}"
