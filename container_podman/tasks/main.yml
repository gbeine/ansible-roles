---

- name: Install and configure podman
  tags: [ container, container_podman ]
  block:

    - name: Check supported distribution
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_major_version'] | int >= 13
        fail_msg: "container_podman requires Debian 13 or later (quadlet support), found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
        quiet: true

    - name: Validate the default network
      ansible.builtin.assert:
        that:
          - container_podman__default_network | length > 0
          - container_podman__default_network in (container_podman__networks | selectattr('name', 'defined') | map(attribute='name') | list)
        fail_msg: >-
          Default network: podman_default_network must be set to a network declared in podman_networks,
          found '{{ container_podman__default_network }}',
          declared: {{ container_podman__networks | selectattr('name', 'defined') | map(attribute='name') | join(', ') }}
        quiet: true

    - name: Validate the group of the socket
      ansible.builtin.assert:
        that:
          - container_podman__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ container_podman__errors | join(' ') }}"
        quiet: true
      vars:
        container_podman__errors: >-
          {%- set errors = [] -%}
          {%- if container_podman__socket_group_assign is not boolean -%}
          {%-   set _ = errors.append('`podman_socket_group_assign` has to be true or false.') -%}
          {%- elif container_podman__socket_group_assign -%}
          {%-   if container_podman__socket_group is not string or container_podman__socket_group is not match(container_podman__group_pattern) -%}
          {%-     set _ = errors.append('`podman_socket_group` is a name of a group of lower case letters, digits, _ and -, starting with a letter or _.') -%}
          {%-   endif -%}
          {%-   if container_podman__socket_mode is not string or container_podman__socket_mode is not match('^0?[0-7]{3}$') -%}
          {%-     set _ = errors.append('`podman_socket_mode` is an octal mode as string, e.g. "0660".') -%}
          {%-   endif -%}
          {%-   if container_podman__socket_gid is defined
                   and (container_podman__socket_gid is not integer or container_podman__socket_gid is boolean
                        or container_podman__socket_gid < 100 or container_podman__socket_gid > 999) -%}
          {%-     set _ = errors.append('`podman_socket_gid` is a GID of the dynamic system range from 100 to 999, without it adduser allocates one.') -%}
          {%-   endif -%}
          {%- endif -%}
          {{ errors }}

    # groupmod would change the GID of an existing group and leave files with the former GID
    - name: Read the group of the socket
      ansible.builtin.command:
        argv: [ 'getent', 'group', "{{ container_podman__socket_group }}" ]
      register: container_podman__socket_group_entry
      changed_when: false
      failed_when: container_podman__socket_group_entry.rc not in [ 0, 2 ]
      check_mode: false
      when:
        - container_podman__socket_group_assign | bool
        - container_podman__socket_gid is defined

    - name: Validate the GID of the existing group of the socket
      ansible.builtin.assert:
        that:
          - container_podman__socket_group_entry.rc != 0
            or (container_podman__socket_group_entry.stdout.split(':')[2] | int) == container_podman__socket_gid
        fail_msg: >-
          The group `{{ container_podman__socket_group }}` exists with the GID {{ container_podman__socket_group_entry.stdout.split(':')[2] | default('') }},
          `podman_socket_gid` is {{ container_podman__socket_gid }}, the role does not change the GID of an existing group.
        quiet: true
      when:
        - container_podman__socket_group_assign | bool
        - container_podman__socket_gid is defined

    - name: Validate the TCP service
      ansible.builtin.assert:
        that:
          - container_podman__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ container_podman__errors | join(' ') }}"
        quiet: true
      vars:
        container_podman__errors: >-
          {%- set errors = [] -%}
          {%- if container_podman__tcp_enable is not boolean -%}
          {%-   set _ = errors.append('`podman_tcp_enable` has to be true or false.') -%}
          {%- elif container_podman__tcp_enable -%}
          {%-   if container_podman__tcp_address is not string or container_podman__tcp_address is not match('^[A-Za-z0-9.:\[\]-]+$') -%}
          {%-     set _ = errors.append('`podman_tcp_address` is the address of the podman API, a host name or an IP address, IPv6 in brackets.') -%}
          {%-   endif -%}
          {%-   if container_podman__tcp_port is not integer or container_podman__tcp_port is boolean
                   or container_podman__tcp_port < 1 or container_podman__tcp_port > 65535 -%}
          {%-     set _ = errors.append('`podman_tcp_port` is a port from 1 to 65535.') -%}
          {%-   endif -%}
          {%-   set requires = container_podman__tcp_requires -%}
          {%-   if requires is string or requires is mapping or requires is not iterable
                   or requires | reject('string') | list | length > 0
                   or requires | reject('match', '^[^/ ]+[.][a-z]+$') | list | length > 0 -%}
          {%-     set _ = errors.append('`podman_tcp_requires` is a list of unit names, e.g. wg-quick@wg0.service.') -%}
          {%-   endif -%}
          {%- endif -%}
          {{ errors }}

    - name: Include OS-specific variables
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"

    - name: Install packages
      ansible.builtin.import_tasks: packages.yml

    # In check mode the packages are not installed, the podman commands of the following tasks would fail
    - name: Check for podman
      ansible.builtin.stat:
        path: "{{ container_podman__podman_binary }}"
      register: container_podman__podman_stat

    - name: Report the missing podman
      ansible.builtin.debug:
        msg: "podman is not installed (check mode), the configuration of podman is skipped"
      when: not container_podman__podman_stat.stat.exists

    - name: Configure podman
      when: container_podman__podman_stat.stat.exists
      block:

        - name: Configure networks
          ansible.builtin.import_tasks: networks.yml

        - name: Remove undeclared networks
          ansible.builtin.include_tasks: networks_prune.yml
          when: container_podman__networks_prune | bool

        - name: Configure podman socket
          ansible.builtin.import_tasks: socket.yml

        - name: Configure podman TCP service
          ansible.builtin.import_tasks: tcp.yml

        - name: Configure image cleanup
          ansible.builtin.import_tasks: cleanup.yml
