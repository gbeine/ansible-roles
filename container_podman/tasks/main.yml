---

- name: Install and configure podman
  tags: [ container, container_podman ]
  block:

    - name: Check supported distribution
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_major_version'] | int >= 13
        fail_msg: "container_podman requires Debian 13 or later (quadlet support), found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
        quiet: true

    - name: Include OS-specific variables
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"

    - name: Install packages
      ansible.builtin.import_tasks: packages.yml

    - name: Configure networks
      ansible.builtin.import_tasks: networks.yml

    - name: Remove undeclared networks
      ansible.builtin.include_tasks: networks_prune.yml
      when: container_podman__networks_prune | bool

    - name: Configure podman socket
      ansible.builtin.import_tasks: socket.yml

    - name: Configure podman TCP service
      ansible.builtin.import_tasks: tcp.yml

    - name: Configure image cleanup
      ansible.builtin.import_tasks: cleanup.yml
