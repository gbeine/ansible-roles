---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/systemd-service
#

systemd_service__name: "{{ service_name | mandatory }}"

# [Unit] section
systemd_service__description: "{{ service_description | default(systemd_service__name) }}"
systemd_service__documentation:  "{{ service_documentation | default('') }}"
systemd_service__wants: "{{ service_wants | default([]) }}"
systemd_service__requires: "{{ service_requires | default([]) }}"
systemd_service__requisite: "{{ service_requisite | default([]) }}"
systemd_service__binds_to: "{{ service_binds_to | default([]) }}"
systemd_service__part_of: "{{ service_part_of | default([]) }}"
systemd_service__upholds: "{{ service_upholds | default([]) }}"
systemd_service__conflicts: "{{ service_conflicts | default([]) }}"
systemd_service__before: "{{ service_before | default([]) }}"
systemd_service__after: "{{ service_after | default([]) }}"
systemd_service__on_failure: "{{ service_on_failure | default([]) }}"
systemd_service__on_success: "{{ service_on_success | default([]) }}"
systemd_service__propagates_reload_to: "{{ service_propagates_reload_to | default([]) }}"
systemd_service__reload_propagated_from: "{{ service_reload_propagated_from | default([]) }}"
systemd_service__propagates_stop_to: "{{ service_propagates_stop_to | default([]) }}"
systemd_service__stop_propagated_from: "{{ service_stop_propagated_from | default([]) }}"
systemd_service__joins_namespace_of: "{{ service_joins_namespace_of | default([]) }}"
systemd_service__requires_mounts_for: "{{ service_requires_mounts_for | default([]) }}"
systemd_service__wants_mounts_for: "{{ service_wants_mounts_for | default([]) }}"
systemd_service__on_success_job_mode: "{{ service_on_success_job_mode | default('') }}"
systemd_service__on_failure_job_mode: "{{ service_on_failure_job_mode | default('') }}"
systemd_service__ignore_on_isolate: "{{ service_ignore_on_isolate | default('') }}"
systemd_service__stop_when_unneeded: "{{ service_stop_when_unneeded | default('') }}"
systemd_service__refuse_manual_start: "{{ service_refuse_manual_start | default('') }}"
systemd_service__refuse_manual_stop: "{{ service_refuse_manual_stop | default('') }}"
systemd_service__allow_isolate: "{{ service_allow_isolate | default('') }}"
systemd_service__default_dependencies: "{{ service_default_dependencies | default('') }}"
systemd_service__survive_final_kill_signal: "{{ service_survive_final_kill_signal | default('') }}"
systemd_service__collect_mode: "{{ service_collect_mode | default('') }}"
systemd_service__failure_action: "{{ service_failure_action | default('') }}"
systemd_service__success_action: "{{ service_success_action | default('') }}"
systemd_service__failure_action_exit_status: "{{ service_failure_action_exit_status | default('') }}"
systemd_service__success_action_exit_status: "{{ service_success_action_exit_status | default('') }}"
systemd_service__job_timeout_sec: "{{ service_job_timeout_sec | default('') }}"
systemd_service__job_running_timeout_sec: "{{ service_job_running_timeout_sec | default('') }}"
systemd_service__job_timeout_action: "{{ service_job_timeout_action | default('') }}"
systemd_service__job_timeout_reboot_argument: "{{ service_job_timeout_reboot_argument | default('') }}"
systemd_service__start_limit_interval_sec: "{{ service_start_limit_interval_sec | default('') }}"
systemd_service__start_limit_burst: "{{ service_start_limit_burst | default('') }}"
systemd_service__start_limit_action: "{{ service_start_limit_action | default('') }}"
systemd_service__reboot_argument: "{{ service_reboot_argument | default('') }}"

# [Service] section
systemd_service__type: "{{ service_type | mandatory }}"
systemd_service__exit_type: "{{ service_exit_type | default('') }}"
systemd_service__remain_after_exit: "{{ service_remain_after_exit | default('') }}" # yes/no
systemd_service__guess_main_pid: "{{ service_guess_main_pid | default('') }}" # yes/no
systemd_service__pid_file: "{{ service_pid_file | default('') }}"
systemd_service__bus_name: "{{ service_bus_name | default('') }}"
systemd_service__exec_start: "{{ service_exec_start | default([]) }}"
systemd_service__exec_start_pre: "{{ service_exec_start_pre | default([]) }}"
systemd_service__exec_start_post: "{{ service_exec_start_post | default([]) }}"
systemd_service__exec_condition: "{{ service_exec_condition | default([]) }}"
systemd_service__exec_reload: "{{ service_exec_reload | default([]) }}"
systemd_service__exec_stop: "{{ service_exec_stop | default([]) }}"
systemd_service__exec_stop_post: "{{ service_exec_stop_post | default([]) }}"
systemd_service__restart_sec: "{{ service_restart_sec | default('''') }}"
systemd_service__restart_steps: "{{ service_restart_steps | default('') }}"
systemd_service__restart_max_delay_sec: "{{ service_restart_max_delay_sec | default('') }}"
systemd_service__timeout_start_sec: "{{ service_timeout_start_sec | default('') }}"
systemd_service__timeout_stop_sec: "{{ service_timeout_stop_sec | default('') }}"
systemd_service__timeout_abort_sec: "{{ service_timeout_abort_sec | default('') }}"
systemd_service__timeout_start_failure_mode: "{{ service_timeout_start_failure_mode | default('') }}"
systemd_service__timeout_stop_failure_mode: "{{ service_timeout_stop_failure_mode | default('') }}"
systemd_service__runtime_max_sec: "{{ service_runtime_max_sec | default('') }}"
systemd_service__runtime_randomized_extra_sec: "{{ service_runtime_randomized_extra_sec | default('') }}"
systemd_service__watchdog_sec: "{{ service_watchdog_sec | default('') }}"
systemd_service__restart: "{{ service_restart | default('') }}"
systemd_service__restart_mode: "{{ service_restart_mode | default('') }}"
systemd_service__success_exit_status: "{{ service_success_exit_status | default([]) }}"
systemd_service__restart_prevent_exit_status: "{{ service_restart_prevent_exit_status | default([]) }}"
systemd_service__restart_force_exit_status: "{{ service_restart_force_exit_status | default([]) }}"
systemd_service__root_directory_start_only: "{{ service_root_directory_start_only | default('') }}"
systemd_service__non_blocking: "{{ service_non_blocking | default('') }}"
systemd_service__notify_access: "{{ service_notify_access | default('') }}"
systemd_service__sockets: "{{ service_sockets | default([]) }}"
systemd_service__file_descriptor_store_max: "{{ service_file_descriptor_store_max | default('') }}"
systemd_service__file_descriptor_store_preserve: "{{ service_file_descriptor_store_preserve | default('') }}"
systemd_service__usb_function_descriptors: "{{ service_usb_function_descriptors | default('') }}"
systemd_service__usb_function_strings: "{{ service_usb_function_strings | default('') }}"
systemd_service__oom_policy: "{{ service_oom_policy | default('') }}"
systemd_service__open_file: "{{ service_open_file | default([]) }}"
systemd_service__reload_signal: "{{ service_reload_signal | default('') }}"
systemd_service__environment: "{{ service_environment | default([]) }}"

# [Install] section
systemd_service__alias: "{{ service_alias | default([]) }}"
systemd_service__wanted_by: "{{ service_wanted_by | default([]) }}"
systemd_service__required_by: "{{ service_required_by | default([]) }}"
systemd_service__upheld_by: "{{ service_upheld_by | default([]) }}"
systemd_service__also: "{{ service_also | default([]) }}"
