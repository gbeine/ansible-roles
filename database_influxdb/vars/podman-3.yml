---

database_influxdb__uid: 1500
database_influxdb__gid: "{{ database_influxdb__uid }}"
database_influxdb__port: 8181
database_influxdb__tag: "{{ influxdb_tag | default('3-core') }}"
database_influxdb__command: "{{ influxdb_command | default(database_influxdb__command_default) }}"

database_influxdb__command_default:
  - 'influxdb3'
  - 'serve'
  - '--node-id=node0'
  - '--object-store=file'
  - '--data-dir=/var/lib/influxdb3/data'
  - '--plugin-dir=/var/lib/influxdb3/plugins'

database_influxdb__volumes_default:
  - "/etc/localtime:/etc/localtime:ro"
  - "/etc/timezone:/etc/timezone:ro"
  - "{{ database_influxdb__podman_data_dir }}:/var/lib/influxdb3/data"
  - "{{ database_influxdb__podman_plugins_dir }}:/var/lib/influxdb3/plugins"
  - "{{ database_influxdb__podman_backup_dir }}:/backup"

database_influxdb__container_default:
  name: "{{ database_influxdb__name }}"
  hostname: "{{ database_influxdb__hostname }}"
  image: "{{ database_influxdb__image }}:{{ database_influxdb__tag }}"
  ip: "{{ database_influxdb__ip }}"
  ipv6: "{{ database_influxdb__ipv6 }}"
  network: "{{ database_influxdb__network }}"
  timezone: "{{ database_influxdb__timezone }}"
  expose: "{{ database_influxdb__expose }}"
  publish: "{{ database_influxdb__publish }}"
  volumes: "{{ database_influxdb__volumes }}"
  command: "{{ database_influxdb__command }}"
  restart_policy: 'always'
