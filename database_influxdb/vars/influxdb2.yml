---
#
# Values of InfluxDB 2.x, included for the releases 2.7, 2.8 and 2.9
#

database_influxdb__product_name: 'InfluxDB 2.x'

# User influxdb of the image, the entrypoint starts as root, fixes the owner of the data and changes to this user
database_influxdb__data_owner: 1000
database_influxdb__data_group: 1000

# The entrypoint finds config.yml in /etc/influxdb2 and changes its owner to influxdb, the role uses the same owner
database_influxdb__config_file: "{{ database_influxdb__home }}/etc/config.yml"
database_influxdb__config_owner: "{{ database_influxdb__data_owner }}"
database_influxdb__config_format: 'yaml'

database_influxdb__volumes:
  - "{{ database_influxdb__home }}/etc:/etc/influxdb2"
  - "{{ database_influxdb__home }}/data:/var/lib/influxdb2"
  - "{{ database_influxdb__home }}/backup:/backup"

# The entrypoint sets the modes of /etc/influxdb2 and /var/lib/influxdb2 on every start, the role uses the same modes
database_influxdb__directories:
  - path: "{{ database_influxdb__home }}/etc"
    mode: '0775'
  - path: "{{ database_influxdb__home }}/data"
    mode: '0700'
  - path: "{{ database_influxdb__home }}/backup"
    mode: '0750'

database_influxdb__config_default: {}

# The paths of the volume, as in default-config.yml of the image, they must not be set in influxdb_config
database_influxdb__config_role:
  bolt-path: '/var/lib/influxdb2/influxd.bolt'
  engine-path: '/var/lib/influxdb2/engine'

database_influxdb__config_arrays: []

# The options of the API of the role
database_influxdb__bind_option: "{{ database_influxdb__config['http-bind-address'] | default(':8086') }}"
database_influxdb__tls_option: "{{ database_influxdb__config['tls-cert'] | default('') }}"

# The setup creates the admin, the organization and the bucket
database_influxdb__environment_default:
  DOCKER_INFLUXDB_INIT_USERNAME: 'admin'
  DOCKER_INFLUXDB_INIT_BUCKET: 'default'

database_influxdb__environment_required: [ 'DOCKER_INFLUXDB_INIT_USERNAME', 'DOCKER_INFLUXDB_INIT_ORG', 'DOCKER_INFLUXDB_INIT_BUCKET' ]

# Read by entrypoint.sh of the image for the setup
database_influxdb__environment_allowed:
  - 'DOCKER_INFLUXDB_INIT_USERNAME'
  - 'DOCKER_INFLUXDB_INIT_ORG'
  - 'DOCKER_INFLUXDB_INIT_BUCKET'
  - 'DOCKER_INFLUXDB_INIT_RETENTION'
  - 'TZ'

# The variables only read by the initialization, they are not part of the quadlet unit
database_influxdb__environment_init:
  - 'DOCKER_INFLUXDB_INIT_USERNAME'
  - 'DOCKER_INFLUXDB_INIT_ORG'
  - 'DOCKER_INFLUXDB_INIT_BUCKET'
  - 'DOCKER_INFLUXDB_INIT_RETENTION'

# The upgrade from InfluxDB 1.x is not supported by the role.
# The entrypoint logs the end of the setup with the level info, it follows log-level of the configuration otherwise
database_influxdb__init_environment_role:
  DOCKER_INFLUXDB_INIT_MODE: 'setup'
  INFLUXD_LOG_LEVEL: 'info'

# The entrypoint reads the password and the token of the setup from the file variables
database_influxdb__secret_files:
  DOCKER_INFLUXDB_INIT_PASSWORD: 'DOCKER_INFLUXDB_INIT_PASSWORD_FILE'
  DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: 'DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE'

# influxd reads the token of Vault only from the environment or the configuration
database_influxdb__secrets_env: [ 'INFLUXD_VAULT_TOKEN' ]

# The secrets of the initialization, only passed to the container of the initialization
database_influxdb__secrets_init: [ 'DOCKER_INFLUXDB_INIT_PASSWORD', 'DOCKER_INFLUXDB_INIT_ADMIN_TOKEN' ]

database_influxdb__secrets_required: [ 'DOCKER_INFLUXDB_INIT_PASSWORD', 'DOCKER_INFLUXDB_INIT_ADMIN_TOKEN' ]

# The secret options of the configuration, they are passed as secrets in the environment
database_influxdb__config_secrets:
  'vault-token': 'INFLUXD_VAULT_TOKEN'

database_influxdb__admin_user_variable: 'DOCKER_INFLUXDB_INIT_USERNAME'

# The setup only runs without the bolt file, the entrypoint logs the end of the setup
database_influxdb__initialized_path: "{{ database_influxdb__home }}/data/influxd.bolt"
database_influxdb__init_message: 'initialization complete'
database_influxdb__init_command: []
