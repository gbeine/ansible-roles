---
#
# Values of InfluxDB 2.x, included for the releases 2.7, 2.8 and 2.9
#

database_influxdb__product_name: 'InfluxDB 2.x'

# User influxdb of the image, the entrypoint starts as root, fixes the owner of the data and changes to this user
database_influxdb__data_owner: 1000
database_influxdb__data_group: 1000

database_influxdb__volumes:
  - "{{ database_influxdb__home }}/etc:/etc/influxdb2"
  - "{{ database_influxdb__home }}/data:/var/lib/influxdb2"
  - "{{ database_influxdb__home }}/backup:/backup"

# The entrypoint sets the modes of /etc/influxdb2 and /var/lib/influxdb2 on every start, the role uses the same modes
database_influxdb__directories:
  - path: "{{ database_influxdb__home }}/etc"
    mode: '0775'
  - path: "{{ database_influxdb__home }}/data"
    mode: '0700'
  - path: "{{ database_influxdb__home }}/backup"
    mode: '0750'

database_influxdb__environment_default:
  TZ: "{{ database_influxdb__timezone }}"
  # The setup creates the admin, the organization and the bucket on the first start
  DOCKER_INFLUXDB_INIT_MODE: 'setup'
  DOCKER_INFLUXDB_INIT_USERNAME: 'admin'
  DOCKER_INFLUXDB_INIT_BUCKET: 'default'

database_influxdb__environment_required: [ 'DOCKER_INFLUXDB_INIT_USERNAME', 'DOCKER_INFLUXDB_INIT_ORG', 'DOCKER_INFLUXDB_INIT_BUCKET' ]

database_influxdb__environment_managed: []

# The entrypoint reads the password and the token of the setup from the file variables
database_influxdb__secret_files:
  DOCKER_INFLUXDB_INIT_PASSWORD: 'DOCKER_INFLUXDB_INIT_PASSWORD_FILE'
  DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: 'DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE'

# influxd reads the token of Vault only from the environment
database_influxdb__secrets_env: [ 'INFLUXD_VAULT_TOKEN' ]

database_influxdb__secrets_required: [ 'DOCKER_INFLUXDB_INIT_PASSWORD', 'DOCKER_INFLUXDB_INIT_ADMIN_TOKEN' ]

# The variables of the admin, the address and HTTPS, the role reaches the API with them
database_influxdb__admin_user_variable: 'DOCKER_INFLUXDB_INIT_USERNAME'
database_influxdb__bind_variable: 'INFLUXD_HTTP_BIND_ADDRESS'
database_influxdb__tls_variable: 'INFLUXD_TLS_CERT'
