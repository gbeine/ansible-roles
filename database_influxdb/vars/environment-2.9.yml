---
# yamllint disable rule:line-length
#
# Environment variables of InfluxDB 2.9.1
# Generated from the flags in cmd/influxd/launcher/cmd.go of InfluxDB 2.9.1 as INFLUXD_<FLAG>, without the testing flags,
# and entrypoint.sh of the image (DOCKER_INFLUXDB_INIT_*, INFLUXD_CONFIG_PATH, INFLUX_CONFIGS_PATH), without the secrets
#

