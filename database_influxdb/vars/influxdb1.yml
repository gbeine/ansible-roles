---
#
# Values of InfluxDB 1.x, included for the releases 1.11, 1.12 and 1.13
#

database_influxdb__product_name: 'InfluxDB 1.x'

# User influxdb of the image, the image runs as this user
database_influxdb__data_owner: 1500
database_influxdb__data_group: 1500

database_influxdb__volumes:
  - "{{ database_influxdb__home }}/data:/var/lib/influxdb"
  - "{{ database_influxdb__home }}/backup:/backup"

database_influxdb__directories:
  - path: "{{ database_influxdb__home }}/data"
    mode: '0750'
  - path: "{{ database_influxdb__home }}/backup"
    mode: '0750'

database_influxdb__environment_default:
  TZ: "{{ database_influxdb__timezone }}"
  # The role manages databases and users with the admin
  INFLUXDB_HTTP_AUTH_ENABLED: 'true'
  INFLUXDB_ADMIN_USER: 'admin'

database_influxdb__environment_required: [ 'INFLUXDB_ADMIN_USER' ]

# The admin is created by init-influxdb.sh of the image, the other users of the image are managed by the role
database_influxdb__environment_managed:
  - 'INFLUXDB_DB'
  - 'INFLUXDB_USER'
  - 'INFLUXDB_USER_PASSWORD'
  - 'INFLUXDB_WRITE_USER'
  - 'INFLUXDB_WRITE_USER_PASSWORD'
  - 'INFLUXDB_READ_USER'
  - 'INFLUXDB_READ_USER_PASSWORD'

# The image reads no secret from a file, init-influxdb.sh and influxd read them from the environment
database_influxdb__secret_files: {}
database_influxdb__secrets_env: [ 'INFLUXDB_ADMIN_PASSWORD', 'INFLUXDB_HTTP_SHARED_SECRET' ]

# Without the password of the admin init-influxdb.sh writes a random password to the log
database_influxdb__secrets_required: [ 'INFLUXDB_ADMIN_PASSWORD' ]

# The variables of the admin, the address and HTTPS, the role reaches the API with them
database_influxdb__admin_user_variable: 'INFLUXDB_ADMIN_USER'
database_influxdb__bind_variable: 'INFLUXDB_HTTP_BIND_ADDRESS'
database_influxdb__tls_variable: 'INFLUXDB_HTTP_HTTPS_ENABLED'
