---
# Network created by container_podman in prepare.yml
database_influxdb__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

database_influxdb__test_images:
  - 'docker.io/library/influxdb:2.9-alpine'
  - 'docker.io/library/influxdb:1.13-alpine'

database_influxdb__test_quadlet_path: '/etc/containers/systemd/influxdb.container'

# The secrets required by the major versions, test passwords and tokens only
database_influxdb__test_secrets_2:
  - name: 'influxdb_password'
    data: 'molecule-admin-password'
    target: 'DOCKER_INFLUXDB_INIT_PASSWORD'
  - name: 'influxdb_admin_token'
    data: 'molecule-admin-token'
    target: 'DOCKER_INFLUXDB_INIT_ADMIN_TOKEN'
database_influxdb__test_secrets_1:
  - name: 'influxdb_admin_password'
    data: 'molecule-admin-password'
    target: 'INFLUXDB_ADMIN_PASSWORD'

# Neither the variables nor the secrets of the initialization nor the time zone are part of the quadlet unit
database_influxdb__test_quadlet_absent:
  - 'Environment=DOCKER_INFLUXDB_INIT_'
  - 'Environment=INFLUXDB_'
  - 'Environment=TZ='
  - 'Secret=influxdb_password'
  - 'Secret=influxdb_admin_token'
  - 'Secret=influxdb_admin_password'

database_influxdb__test_shared_secret:
  name: 'influxdb_shared_secret'
  data: 'molecule-shared-secret'
  target: 'INFLUXDB_HTTP_SHARED_SECRET'

database_influxdb__test_cases:

  # InfluxDB 2.9 with the mandatory variables, the organization of the setup and the secrets of the setup
  - name: 'molecule-influxdb-default'
    role_vars:
      influxdb_home: '/opt/influxdb'
      influxdb_ip: '10.89.0.80'
      influxdb_network: 'podman-molecule'
      influxdb_hostname: 'influxdb-default'
      influxdb_timezone: 'Europe/Berlin'
      influxdb_environment:
        DOCKER_INFLUXDB_INIT_ORG: 'molecule'
      influxdb_secrets: "{{ database_influxdb__test_secrets_2 }}"
    # Runs again without a change, InfluxDB must not restart
    side_effect:
      role_vars: {}
    expect:
      major: '2'
      image: 'docker.io/library/influxdb:2.9-alpine'
      ip: '10.89.0.80'
      ip6: ~
      owner: 1000
      restart: false
      config_path: '/opt/influxdb/etc/config.yml'
      config_owner: 1000
      config:
        - 'bolt-path: /var/lib/influxdb2/influxd.bolt'
        - 'engine-path: /var/lib/influxdb2/engine'
      # The log level as InfluxDB reads it
      log_level: 'info'
      quadlet:
        - 'Volume=/opt/influxdb/etc:/etc/influxdb2'
        - 'Volume=/opt/influxdb/data:/var/lib/influxdb2'
        - 'Volume=/opt/influxdb/backup:/backup'
      quadlet_absent: "{{ database_influxdb__test_quadlet_absent + [ 'Environment=', 'Secret=' ] }}"
      buckets:
        - { name: 'default', seconds: 0 }
      users: []
      owners: []

  # InfluxDB 2.9 with IPv6, labels, a log level, buckets with retention, users and a second organization
  - name: 'molecule-influxdb'
    role_vars:
      influxdb_home: '/opt/influxdb'
      influxdb_ip: '10.89.0.81'
      influxdb_ipv6: 'fd00:89::81'
      influxdb_network: 'podman-molecule'
      influxdb_hostname: 'influxdb-molecule'
      influxdb_timezone: 'Europe/Berlin'
      influxdb_labels:
        traefik.enable: 'false'
      influxdb_container:
        wants: [ 'network-online.target' ]
        after: [ 'network-online.target' ]
        requires_mounts_for: [ '/opt/influxdb' ]
      influxdb_environment:
        DOCKER_INFLUXDB_INIT_ORG: 'molecule'
      influxdb_config:
        log-level: 'warn'
        # null removes the option
        flux-log-enabled: ~
      influxdb_secrets: "{{ database_influxdb__test_secrets_2 }}"
      influxdb_buckets:
        - name: 'metrics'
          retention: '7d'
        - name: 'logs'
        - name: 'other'
          org: 'second'
          retention: '1w2d'
      influxdb_users:
        - name: 'molecule'
        - name: 'owner'
          role: 'owner'
        - name: 'second'
          org: 'second'
      influxdb_passwords:
        molecule: 'molecule-user-password'
        owner: 'molecule-owner-password'
        second: 'molecule-second-password'
    # The service restarts with the changed log level, a bucket is added and a password changed
    side_effect:
      role_vars:
        influxdb_config:
          log-level: 'error'
        influxdb_buckets:
          - name: 'metrics'
            retention: '7d'
          - name: 'logs'
          - name: 'other'
            org: 'second'
            retention: '1w2d'
          - name: 'extra'
            retention: '12h'
        influxdb_passwords:
          molecule: 'molecule-changed-password'
          owner: 'molecule-owner-password'
          second: 'molecule-second-password'
    expect:
      major: '2'
      image: 'docker.io/library/influxdb:2.9-alpine'
      ip: '10.89.0.81'
      ip6: 'fd00:89::81'
      owner: 1000
      restart: true
      config_path: '/opt/influxdb/etc/config.yml'
      config_owner: 1000
      config:
        - 'bolt-path: /var/lib/influxdb2/influxd.bolt'
        - 'engine-path: /var/lib/influxdb2/engine'
        - 'log-level: error'
      log_level: 'error'
      quadlet:
        - 'Volume=/opt/influxdb/data:/var/lib/influxdb2'
        - 'Label=traefik.enable=false'
        - 'Wants=network-online.target'
        - 'After=network-online.target'
        - 'RequiresMountsFor=/opt/influxdb'
      quadlet_absent: "{{ database_influxdb__test_quadlet_absent + [ 'Environment=', 'Secret=' ] }}"
      buckets:
        - { name: 'metrics', seconds: 604800 }
        - { name: 'logs', seconds: 0 }
        - { name: 'other', seconds: 777600 }
        - { name: 'extra', seconds: 43200 }
      users:
        - { name: 'molecule', password: 'molecule-changed-password' }
        - { name: 'owner', password: 'molecule-owner-password' }
        - { name: 'second', password: 'molecule-second-password' }
      owners: [ 'owner' ]

  # InfluxDB 1.13 with databases with retention, users with privileges and an admin
  - name: 'molecule-influxdb-1'
    role_vars:
      influxdb_home: '/opt/influxdb'
      influxdb_ip: '10.89.0.82'
      influxdb_network: 'podman-molecule'
      influxdb_hostname: 'influxdb-1'
      influxdb_timezone: 'Europe/Berlin'
      influxdb_release: '1.13'
      # The shared secret of JWT is a secret of the configuration, passed in the environment
      influxdb_secrets: "{{ database_influxdb__test_secrets_1 + [ database_influxdb__test_shared_secret ] }}"
      influxdb_databases:
        - name: 'telegraf'
          retention: '30d'
        - name: 'app'
      influxdb_users:
        - name: 'writer'
          grants:
            - { database: 'telegraf', privilege: 'WRITE' }
        - name: 'reader'
          grants:
            - { database: 'telegraf', privilege: 'READ' }
            - { database: 'app', privilege: 'ALL' }
        - name: 'admin2'
          admin: true
      influxdb_passwords:
        writer: 'molecule-writer-password'
        reader: "molecule-reader-pass'word"
        admin2: 'molecule-admin2-password'
    # The service restarts with the changed log level, a database is added and a password changed
    side_effect:
      role_vars:
        influxdb_config:
          logging:
            level: 'warn'
        influxdb_databases:
          - name: 'telegraf'
            retention: '30d'
          - name: 'app'
          - name: 'extra'
            retention: '2d'
        influxdb_passwords:
          writer: 'molecule-writer-password'
          reader: 'molecule-reader-changed'
          admin2: 'molecule-admin2-password'
    expect:
      major: '1'
      image: 'docker.io/library/influxdb:1.13-alpine'
      ip: '10.89.0.82'
      ip6: ~
      owner: 1500
      restart: true
      config_path: '/opt/influxdb/influxdb.conf'
      config_owner: 0
      config:
        - '[http]'
        - 'auth-enabled = true'
        - '[logging]'
        - 'level = "warn"'
        - 'dir = "/var/lib/influxdb/meta"'
      log_level: 'warn'
      quadlet:
        - 'Volume=/opt/influxdb/data:/var/lib/influxdb'
        - 'Volume=/opt/influxdb/backup:/backup'
        - 'Volume=/opt/influxdb/influxdb.conf:/etc/influxdb/influxdb.conf:ro'
        - 'Secret=influxdb_shared_secret,type=env,target=INFLUXDB_HTTP_SHARED_SECRET'
      quadlet_absent: "{{ database_influxdb__test_quadlet_absent + [ 'Environment=' ] }}"
      databases:
        - { name: 'telegraf', duration: '720h0m0s' }
        - { name: 'app', duration: '0s' }
        - { name: 'extra', duration: '48h0m0s' }
      users:
        - { name: 'writer', password: 'molecule-writer-password' }
        - { name: 'reader', password: 'molecule-reader-changed' }
        - { name: 'admin2', password: 'molecule-admin2-password' }
