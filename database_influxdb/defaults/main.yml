---

#
# Substitutes - do not change
#

database_influxdb__version: "{{ influxdb_version | default(3) }}"
database_influxdb__use_podman: true

database_influxdb__home: "{{ influxdb_home | mandatory }}"
database_influxdb__ip: "{{ influxdb_ip | mandatory }}"
database_influxdb__ipv6: "{{ influxdb_ipv6 | default('') }}"
database_influxdb__network: "{{ influxdb_network | mandatory }}"
database_influxdb__hostname: "{{ influxdb_hostname | mandatory }}"
database_influxdb__timezone: "{{ influxdb_timezone | mandatory }}"

database_influxdb__container: "{{ database_influxdb__container_default }}"
database_influxdb__environment: "{{ database_influxdb__environment_default }}"
database_influxdb__secrets: "{{ database_influxdb__secrets_default }}"
database_influxdb__volumes: "{{ database_influxdb__volumes_default }}"

#
# Defaults - do not change
#

database_influxdb__name: 'influxdb'
database_influxdb__image: 'docker.io/influxdb'
database_influxdb__expose: "{{ influxdb_expose | default([ database_influxdb__port | string ]) }}"
database_influxdb__publish: "{{ influxdb_publish | default([ database_influxdb__port | string  + ':' + database_influxdb__port | string ]) }}"

database_influxdb__podman_home: "{{ database_influxdb__home }}"
database_influxdb__podman_etc_dir: "{{ database_influxdb__podman_home }}/etc"
database_influxdb__podman_data_dir: "{{ database_influxdb__podman_home }}/data"
database_influxdb__podman_plugins_dir: "{{ database_influxdb__podman_home }}/plugins"
database_influxdb__podman_backup_dir: "{{ database_influxdb__podman_home }}/backup"
