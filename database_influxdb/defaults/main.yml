---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-influxdb
#

database_influxdb__home: "{{ influxdb_home | mandatory }}"
database_influxdb__ip: "{{ influxdb_ip | mandatory }}"
database_influxdb__ipv6: "{{ influxdb_ipv6 }}"
database_influxdb__network: "{{ influxdb_network | mandatory }}"
database_influxdb__hostname: "{{ influxdb_hostname | mandatory }}"
database_influxdb__timezone: "{{ influxdb_timezone | mandatory }}"
database_influxdb__labels: "{{ influxdb_labels }}"

# The release selects the major version, the variables and the defaults, the version is the tag of the image
database_influxdb__release: "{{ influxdb_release | default('2.9') }}"
database_influxdb__version: "{{ influxdb_version | default(database_influxdb__release ~ '-alpine') }}"

database_influxdb__container: "{{ database_influxdb__podman_container_default | combine(influxdb_container | default({})) }}"

# The configuration of InfluxDB, INFLUXDB_<SECTION>_<KEY> for 1.x and INFLUXD_<FLAG> for 2.x, and the variables of the image
database_influxdb__environment: "{{ database_influxdb__environment_default | combine(influxdb_environment | default({})) }}"

# Secrets with name, data and target, the target is the name of the variable, e.g. DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
database_influxdb__secrets: "{{ influxdb_secrets | default([]) }}"

# Databases (1.x) or buckets (2.x) and users managed by the role, the passwords of the users are set with influxdb_passwords
database_influxdb__databases: "{{ influxdb_databases | default([]) }}"
database_influxdb__buckets: "{{ influxdb_buckets | default([]) }}"
database_influxdb__users: "{{ influxdb_users | default([]) }}"
database_influxdb__passwords: "{{ influxdb_passwords | default({}) }}"

database_influxdb__autoupdate_enabled: "{{ influxdb_autoupdate_enabled | default(false) }}"
database_influxdb__autoupdate_schedule: "{{ influxdb_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The supported releases, vars/influxdb<major>.yml contains the values of the major version,
# vars/environment-<release>.yml the allowed variables of the release
database_influxdb__releases: [ '1.11', '1.12', '1.13', '2.7', '2.8', '2.9' ]

database_influxdb__major: "{{ database_influxdb__release | string | split('.') | first }}"

# The targets of the secrets, they must not be set in influxdb_environment
database_influxdb__secret_variables: "{{ database_influxdb__secret_files.keys() | list + database_influxdb__secrets_env }}"

database_influxdb__secrets_dir: '/run/secrets'

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
database_influxdb__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if database_influxdb__secrets is sequence and database_influxdb__secrets is not string and database_influxdb__secrets is not mapping -%}
  {%-   for secret in database_influxdb__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in database_influxdb__secret_files -%}
  {%-     set _ = environment.update({ database_influxdb__secret_files[secret.target]: database_influxdb__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The data of a secret by its target, used by the role to manage databases and users
database_influxdb__secret_data: >-
  {%- set data = {} -%}
  {%- if database_influxdb__secrets is sequence and database_influxdb__secrets is not string and database_influxdb__secrets is not mapping -%}
  {%-   for secret in database_influxdb__secrets if secret is mapping and secret.target is defined and secret.data is defined -%}
  {%-     set _ = data.update({ secret.target: secret.data }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ data }}

# The admin of InfluxDB, created by the image, the role manages the databases and users with it
database_influxdb__admin_user: "{{ database_influxdb__environment[database_influxdb__admin_user_variable] | default('') }}"
database_influxdb__admin_password: "{{ database_influxdb__secret_data.INFLUXDB_ADMIN_PASSWORD | default('') }}"
database_influxdb__admin_token: "{{ database_influxdb__secret_data.DOCKER_INFLUXDB_INIT_ADMIN_TOKEN | default('') }}"

# The organization of the setup, the default of buckets and users of 2.x
database_influxdb__organization: "{{ database_influxdb__environment.DOCKER_INFLUXDB_INIT_ORG | default('') }}"

# The API of InfluxDB on the address of the container, the port and https follow the configuration
database_influxdb__port: >-
  {{ (database_influxdb__environment[database_influxdb__bind_variable] | default(':8086')
      | string | split(':') | last) or '8086' }}
database_influxdb__api_scheme: >-
  {{ 'https' if (database_influxdb__environment[database_influxdb__tls_variable] | default('') | string | lower) not in ['', 'false']
     else 'http' }}
database_influxdb__api_url: "{{ database_influxdb__api_scheme }}://{{ database_influxdb__ip }}:{{ database_influxdb__port }}"

# The names of databases, buckets and users, they are quoted in InfluxQL and passed to the API
database_influxdb__object_name_pattern: '^[A-Za-z0-9_.-]+$'

# The privileges of InfluxDB 1.x
database_influxdb__privileges: [ 'READ', 'WRITE', 'ALL' ]

# The roles of users in an organization of InfluxDB 2.x
database_influxdb__roles: [ 'member', 'owner' ]

# A duration of InfluxQL, e.g. 30d or 1w2d, INF or 0 is infinite
database_influxdb__duration_pattern: '^(INF|0|([0-9]+(w|d|h|m|s))+)$'
database_influxdb__duration_seconds:
  w: 604800
  d: 86400
  h: 3600
  m: 60
  s: 1

database_influxdb__podman_name: 'influxdb'
database_influxdb__podman_image: 'docker.io/library/influxdb'

database_influxdb__podman_container_default:
  name: "{{ database_influxdb__podman_name }}"
  hostname: "{{ database_influxdb__hostname }}"
  image: "{{ database_influxdb__podman_image }}:{{ database_influxdb__version }}"
  ip: "{{ database_influxdb__ip }}"
  ipv6: "{{ database_influxdb__ipv6 | default(omit) }}"
  network: "{{ database_influxdb__network }}"
  timezone: "{{ database_influxdb__timezone }}"
  labels: "{{ database_influxdb__labels | default(omit) }}"
  # Set with influxdb_environment and influxdb_secrets, merged over the default
  environment: "{{ database_influxdb__environment | combine(database_influxdb__environment_secrets_files) }}"
  # backup_influxdb backs up to /backup in the container
  volumes: "{{ database_influxdb__volumes }}"
  secrets: "{{ database_influxdb__podman_secrets if database_influxdb__podman_secrets | length > 0 else omit }}"

# The podman secrets of influxdb_secrets, as file for the user of the image or in the environment,
# entries without name or target are left out, the validation of the secrets reports them
database_influxdb__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- if database_influxdb__secrets is sequence and database_influxdb__secrets is not string and database_influxdb__secrets is not mapping -%}
  {%-   for secret in database_influxdb__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-     if secret.target in database_influxdb__secret_files -%}
  {%-       set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ database_influxdb__secrets_dir ~ '/' ~ secret.name
                                   ~ ',uid=' ~ database_influxdb__data_owner ~ ',gid=' ~ database_influxdb__data_group ~ ',mode=0400') -%}
  {%-     elif secret.target in database_influxdb__secrets_env -%}
  {%-       set _ = secrets.append(secret.name ~ ',type=env,target=' ~ secret.target) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ secrets }}
