---

#
# Substitutes - do not change
#

database_influxdb__home: "{{ influxdb_home | mandatory }}"

database_influxdb__hostname: "{{ influxdb_hostname | mandatory }}"
database_influxdb__ip: "{{ influxdb_ip | mandatory }}"
database_influxdb__ipv6: "{{ influxdb_ipv6 | default('') }}"
database_influxdb__network: "{{ influxdb_network | mandatory }}"
database_influxdb__hosts: "{{ influxdb_hosts | default({}) }}"
database_influxdb__version: "{{ influxdb_version | default('alpine') }}"
database_influxdb__timezone: "{{ influxdb_timezone | default(bootstrap_timezone__timezone) }}"

database_influxdb__container: "{{ database_influxdb__container_default | combine(influxdb_container | default({})) }}"

database_influxdb__port: "{{ influxdb_port | default(8086) }}"
database_influxdb__publish_port: "{{ influxdb_publish_port | default(false) }}"

database_influxdb__username: "{{ influxdb_username | default('admin') }}"
database_influxdb__password: "{{ influxdb_password | mandatory }}"
database_influxdb__organization: "{{ influxdb_org | mandatory }}"
database_influxdb__bucket: "{{ influxdb_bucket | default('default') }}"
database_influxdb__retention: "{{ influxdb_retention | default(0) }}"
database_influxdb__admin_token: "{{ influxdb_admin_token | mandatory }}"

#
# Defaults - do not change
#

database_influxdb__etc_dir: "{{ database_influxdb__home }}/etc"
database_influxdb__data_dir: "{{ database_influxdb__home }}/data"

database_influxdb__name: 'influxdb'
database_influxdb__image: 'docker.io/influxdb'

database_influxdb__publish: "{{
  [ database_influxdb__port + ':' + database_influxdb__port ] if  database_influxdb__publish_port else []
}}"

database_influxdb__init_environment_default:
    DOCKER_INFLUXDB_INIT_MODE: 'setup'
    DOCKER_INFLUXDB_INIT_USERNAME: "{{ database_influxdb__username }}"
    DOCKER_INFLUXDB_INIT_PASSWORD: "{{ database_influxdb__password }}"
    DOCKER_INFLUXDB_INIT_ORG: "{{ database_influxdb__organization }}"
    DOCKER_INFLUXDB_INIT_BUCKET: "{{ database_influxdb__bucket }}"
    DOCKER_INFLUXDB_INIT_RETENTION: "{{ database_influxdb__retention }}"
    DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:  "{{ database_influxdb__admin_token }}"

database_influxdb__volumes_default:
    - "/etc/localtime:/etc/localtime:ro"
    - "/etc/timezone:/etc/timezone:ro"
    - "{{ database_influxdb__etc_dir }}:/etc/influxdb2"
    - "{{ database_influxdb__data_dir }}:/var/lib/influxdb2"

database_influxdb__container_default:
    name: "{{ database_influxdb__name }}"
    hostname: "{{ database_influxdb__hostname }}"
    image: "{{ database_influxdb__image }}:{{ database_influxdb__version }}"
    ip: "{{ database_influxdb__ip }}"
    network: "{{ database_influxdb__network }}"
    restart_policy: 'always'
    hosts: "{{ database_influxdb__hosts }}"
    expose:
      - "{{ database_influxdb__port }}"
    publish: "{{ database_influxdb__publish }}"
    timezone: "{{ database_influxdb__timezone }}"
    volumes: "{{ database_influxdb__volumes_default }}"
