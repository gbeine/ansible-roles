---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/smarthome-mosquitto
#

smarthome_mosquitto__home: "{{ mosquitto_home | mandatory }}"
smarthome_mosquitto__ip: "{{ mosquitto_ip | mandatory }}"
smarthome_mosquitto__ipv6: "{{ mosquitto_ipv6 }}"
smarthome_mosquitto__network: "{{ mosquitto_network | mandatory }}"
smarthome_mosquitto__hostname: "{{ mosquitto_hostname | mandatory }}"
smarthome_mosquitto__timezone: "{{ mosquitto_timezone | mandatory }}"

smarthome_mosquitto__version: "{{ mosquitto_version | default('latest') }}"

smarthome_mosquitto__container: "{{ smarthome_mosquitto__podman_container_default | combine(mosquitto_container | default({})) }}"

# The options of mosquitto.conf, the lists listener and connection are the sections of the listeners and the bridges
smarthome_mosquitto__config: "{{ smarthome_mosquitto__config_default | combine(mosquitto_config | default({})) }}"

# The users by their names with password and acl, the lines of the ACL file of the user
smarthome_mosquitto__users: "{{ mosquitto_users | default({}) }}"

# The lines of the ACL file for clients without user (anonymous) and the patterns of all users (pattern)
smarthome_mosquitto__acl: "{{ smarthome_mosquitto__acl_default | combine(mosquitto_acl | default({})) }}"

# Secrets with name, data and target, the target is the path of the option, e.g. listener.8883.keyfile
smarthome_mosquitto__secrets: "{{ mosquitto_secrets | default([]) }}"

# The realms of PKI with local certificates, <realm>/fullchain.pem and <realm>/privkey.pem in the directory of the realms,
# the certificates are installed on every start of Mosquitto and used by listeners and bridges with realm
smarthome_mosquitto__realms: "{{ mosquitto_realms | default([]) }}"
smarthome_mosquitto__realms_dir: "{{ common_globals__pki_realms_dir }}"

# The timer of pki_update restarts Mosquitto after the renewal of the certificate of a realm
smarthome_mosquitto__pki_update_enabled: "{{ mosquitto_pki_update_enabled | default(true) }}"
smarthome_mosquitto__pki_update_schedule: "{{ mosquitto_pki_update_schedule | default('*-*-* 00/4:00:00') }}"

# The variables of the image, without default
smarthome_mosquitto__environment: "{{ mosquitto_environment }}"

smarthome_mosquitto__autoupdate_enabled: "{{ mosquitto_autoupdate_enabled | default(false) }}"
smarthome_mosquitto__autoupdate_schedule: "{{ mosquitto_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The user of the image (adduser -u 1883 in docker/2.1-alpine/Dockerfile of Mosquitto v2.1.4)
smarthome_mosquitto__uid: 1883
smarthome_mosquitto__gid: 1883

# The broker logs to the journal of the service, persistence keeps retained messages and sessions across restarts
smarthome_mosquitto__config_default:
  persistence: true
  persistence_location: '/mosquitto/data/'
  log_dest: 'stdout'
  allow_anonymous: false
  listener:
    - port: 1883

smarthome_mosquitto__acl_default:
  anonymous: []
  pattern: []

# The sections of mosquitto.conf, written after the general options
smarthome_mosquitto__config_sections: [ 'listener', 'connection' ]

# The options of the general section.
# Generated from the general options of man/mosquitto.conf.5.xml of Mosquitto v2.1.4
# without the options set by the role (smarthome_mosquitto__config_role) and the secret psk_file
smarthome_mosquitto__config_allowed:
  - 'allow_anonymous'
  - 'allow_duplicate_messages'
  - 'allow_zero_length_clientid'
  - 'auth_plugin_deny_special_chars'
  - 'auto_id_prefix'
  - 'autosave_interval'
  - 'autosave_on_changes'
  - 'check_retain_source'
  - 'clientid_prefixes'
  - 'connection_messages'
  - 'enable_control_api'
  - 'global_max_clients'
  - 'global_max_connections'
  - 'log_dest'
  - 'log_facility'
  - 'log_timestamp'
  - 'log_timestamp_format'
  - 'log_type'
  - 'max_inflight_bytes'
  - 'max_inflight_messages'
  - 'max_keepalive'
  - 'max_packet_size'
  - 'max_queued_bytes'
  - 'max_queued_messages'
  - 'memory_limit'
  - 'message_size_limit'
  - 'persistence'
  - 'persistence_file'
  - 'persistence_location'
  - 'persistent_client_expiration'
  - 'pid_file'
  - 'queue_qos0_messages'
  - 'retain_available'
  - 'retain_expiry_interval'
  - 'set_tcp_nodelay'
  - 'sys_interval'
  - 'upgrade_outgoing_qos'
  - 'user'

# The options of a listener.
# Generated from the listener options of man/mosquitto.conf.5.xml of Mosquitto v2.1.4 (general, certificate and PSK based TLS)
# without listener and port, which start the section, and the secret keyfile
smarthome_mosquitto__config_listener_allowed:
  - 'accept_protocol_versions'
  - 'bind_address'
  - 'bind_interface'
  - 'enable_proxy_protocol'
  - 'http_dir'
  - 'listener_allow_anonymous'
  - 'auto_id_prefix'
  - 'max_connections'
  - 'max_qos'
  - 'max_topic_alias_broker'
  - 'max_topic_alias'
  - 'mount_point'
  - 'protocol'
  - 'proxy_protocol_v2_require_tls'
  - 'socket_domain'
  - 'use_username_as_clientid'
  - 'packet_buffer_size'
  - 'websockets_headers_size'
  - 'websockets_log_level'
  - 'websockets_origin'
  - 'cafile'
  - 'capath'
  - 'certfile'
  - 'ciphers'
  - 'ciphers_tls1.3'
  - 'crlfile'
  - 'dhparamfile'
  - 'disable_client_cert_date_checks'
  - 'require_certificate'
  - 'tls_engine'
  - 'tls_engine_kpass_sha1'
  - 'tls_keyform'
  - 'tls_version'
  - 'use_identity_as_username'
  - 'use_subject_as_username'
  - 'psk_hint'

# The options of a bridge.
# Generated from the bridge options of man/mosquitto.conf.5.xml of Mosquitto v2.1.4
# without connection, which starts the section, and the secrets remote_password, local_password, bridge_psk and bridge_keyfile
smarthome_mosquitto__config_connection_allowed:
  - 'address'
  - 'addresses'
  - 'bridge_attempt_unsubscribe'
  - 'bridge_bind_address'
  - 'bridge_max_packet_size'
  - 'bridge_max_topic_alias'
  - 'bridge_outgoing_retain'
  - 'bridge_protocol_version'
  - 'bridge_receive_maximum'
  - 'bridge_session_expiry_interval'
  - 'bridge_tcp_keepalive'
  - 'bridge_tcp_user_timeout'
  - 'cleansession'
  - 'local_cleansession'
  - 'keepalive_interval'
  - 'idle_timeout'
  - 'local_clientid'
  - 'local_username'
  - 'notifications'
  - 'notifications_local_only'
  - 'notification_topic'
  - 'remote_clientid'
  - 'remote_username'
  - 'restart_timeout'
  - 'round_robin'
  - 'start_type'
  - 'threshold'
  - 'topic'
  - 'try_private'
  - 'bridge_reload_type'
  - 'bridge_alpn'
  - 'bridge_cafile'
  - 'bridge_capath'
  - 'bridge_certfile'
  - 'bridge_identity'
  - 'bridge_insecure'
  - 'bridge_require_ocsp'
  - 'bridge_tls_use_os_certs'
  - 'bridge_tls_version'
  - 'bridge_ciphers'
  - 'bridge_ciphers_tls1.3'

# Options set by the role: the users and the ACL are read by the plugins of the role, include_dir reads the bridges with secrets,
# per_listener_settings is deprecated since Mosquitto 2.1
smarthome_mosquitto__config_role:
  - 'acl_file'
  - 'auth_plugin'
  - 'global_plugin'
  - 'include_dir'
  - 'password_file'
  - 'per_listener_settings'
  - 'plugin'

# The secrets, mounted as files the option names, or written into the section of the bridge, which becomes a podman secret
smarthome_mosquitto__secrets_file_options:
  general: [ 'psk_file' ]
  listener: [ 'keyfile' ]
  connection: [ 'bridge_keyfile' ]
smarthome_mosquitto__secrets_value_options:
  connection: [ 'remote_password', 'local_password', 'bridge_psk' ]

# Values Mosquitto reads as booleans, true or false
smarthome_mosquitto__config_booleans:
  - 'allow_anonymous'
  - 'allow_duplicate_messages'
  - 'allow_zero_length_clientid'
  - 'auth_plugin_deny_special_chars'
  - 'autosave_on_changes'
  - 'bridge_attempt_unsubscribe'
  - 'bridge_insecure'
  - 'bridge_outgoing_retain'
  - 'bridge_require_ocsp'
  - 'bridge_tls_use_os_certs'
  - 'check_retain_source'
  - 'cleansession'
  - 'connection_messages'
  - 'disable_client_cert_date_checks'
  - 'enable_control_api'
  - 'enable_proxy_protocol'
  - 'listener_allow_anonymous'
  - 'local_cleansession'
  - 'log_timestamp'
  - 'notifications'
  - 'notifications_local_only'
  - 'persistence'
  - 'proxy_protocol_v2_require_tls'
  - 'queue_qos0_messages'
  - 'require_certificate'
  - 'retain_available'
  - 'round_robin'
  - 'set_tcp_nodelay'
  - 'try_private'
  - 'upgrade_outgoing_qos'
  - 'use_identity_as_username'
  - 'use_subject_as_username'
  - 'use_username_as_clientid'

# The names of the bridges become file and secret names, the names of the users are written to the password and ACL files
smarthome_mosquitto__bridge_name_pattern: '^[A-Za-z0-9_.-]+$'
smarthome_mosquitto__user_name_pattern: '^[A-Za-z0-9_.@-]+$'
# An ACL line is the access and the topic (acl_file__parse of plugins/acl-file/acl_parse.c of Mosquitto v2.1.4)
smarthome_mosquitto__acl_pattern: '^(read|write|readwrite|deny) [^ \r\n][^\r\n]*$'
smarthome_mosquitto__acl_keys: [ 'anonymous', 'pattern' ]

# The realms are directories and file names
smarthome_mosquitto__realm_pattern: '^[A-Za-z0-9_.-]+$'
smarthome_mosquitto__realms_valid: >-
  {{ (smarthome_mosquitto__realms if smarthome_mosquitto__realms is sequence and smarthome_mosquitto__realms is not string
                                      and smarthome_mosquitto__realms is not mapping else [])
     | map('string') | select('match', smarthome_mosquitto__realm_pattern) | unique | list }}
# The options a realm sets in a listener and in a bridge, the certificate and the key
smarthome_mosquitto__realm_options:
  listener: [ 'certfile', 'keyfile' ]
  connection: [ 'bridge_certfile', 'bridge_keyfile' ]
smarthome_mosquitto__user_keys: [ 'password', 'acl' ]

# The variables of the image or of the broker that are no options of mosquitto.conf (src/mosquitto.c of Mosquitto v2.1.4).
# PUID and PGID are left out, the role writes the files for the user 1883 of the image,
# MOSQUITTO_PERSISTENCE_LOCATION is persistence_location of mosquitto_config,
# MOSQUITTO_UNSAFE_ALLOW_SYMLINKS allows symbolic links to the password and ACL files
smarthome_mosquitto__environment_allowed:
  - 'UMASK_SET'

# The name of the container, the names of the secrets of the bridges start with it
smarthome_mosquitto__podman_name: "{{ (mosquitto_container | default({})).name | default('mosquitto') }}"
smarthome_mosquitto__podman_image: 'docker.io/eclipse-mosquitto'
smarthome_mosquitto__podman_tag: "{{ smarthome_mosquitto__version }}"

smarthome_mosquitto__podman_home: "{{ smarthome_mosquitto__home }}"
smarthome_mosquitto__podman_config_dir: "{{ smarthome_mosquitto__podman_home }}/config"
smarthome_mosquitto__podman_data_dir: "{{ smarthome_mosquitto__podman_home }}/data"
# The certificates of the realms, installed on every start of Mosquitto
smarthome_mosquitto__certs_dir: "{{ smarthome_mosquitto__podman_home }}/certs"

smarthome_mosquitto__config_file: "{{ smarthome_mosquitto__podman_config_dir }}/mosquitto.conf"
smarthome_mosquitto__passwd_file: "{{ smarthome_mosquitto__podman_config_dir }}/passwd"
smarthome_mosquitto__acl_file: "{{ smarthome_mosquitto__podman_config_dir }}/acl"

# The paths in the container
smarthome_mosquitto__container_config_dir: '/mosquitto/config'
smarthome_mosquitto__container_data_dir: '/mosquitto/data'
smarthome_mosquitto__certs_container_dir: '/mosquitto/certs'
smarthome_mosquitto__secrets_dir: '/run/secrets'
smarthome_mosquitto__bridges_dir: '/run/mosquitto/bridges'

# The plugins of the users and the ACL (docker/2.1-alpine/Dockerfile of Mosquitto v2.1.4), both read their files again on SIGHUP
smarthome_mosquitto__plugins:
  - plugin: '/usr/lib/mosquitto_password_file.so'
    option: 'plugin_opt_password_file'
    path: "{{ smarthome_mosquitto__container_config_dir }}/passwd"
  - plugin: '/usr/lib/mosquitto_acl_file.so'
    option: 'plugin_opt_acl_file'
    path: "{{ smarthome_mosquitto__container_config_dir }}/acl"

# The secrets with a valid target, by target, entries the validation rejects are left out
smarthome_mosquitto__secrets_by_target: >-
  {%- set targets = {} -%}
  {%- if smarthome_mosquitto__secrets is sequence and smarthome_mosquitto__secrets is not string and smarthome_mosquitto__secrets is not mapping -%}
  {%-   for secret in smarthome_mosquitto__secrets
          if secret is mapping and secret.name is defined and secret.data is defined and secret.target is defined and secret.target is string -%}
  {%-     set _ = targets.update({ secret.target: secret }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ targets }}

# The names of the bridges with a secret value, their sections become podman secrets
smarthome_mosquitto__bridges_secret: >-
  {%- set names = [] -%}
  {%- for target in smarthome_mosquitto__secrets_by_target.keys() -%}
  {%-   set parts = target.split('.') -%}
  {%-   if parts | length == 3 and parts[0] == 'connection' and parts[2] in smarthome_mosquitto__secrets_value_options.connection -%}
  {%-     set _ = names.append(parts[1]) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ names | unique | list }}

# The lines of the configuration: general options, plugins, listeners, bridges without secret values, include_dir.
# A string or number writes the option with the value, a list one line per element, booleans true or false, null removes the option.
# The sections of the bridges with secret values are smarthome_mosquitto__bridges_content.
smarthome_mosquitto__config_lines: >-
  {%- set config = smarthome_mosquitto__config if smarthome_mosquitto__config is mapping else {} -%}
  {%- set secrets = smarthome_mosquitto__secrets_by_target -%}
  {%- set lines = [] -%}
  {%- for key, value in config.items() if key not in smarthome_mosquitto__config_sections and value is not none -%}
  {%-   for item in (value if value is sequence and value is not string and value is not mapping else [ value ]) -%}
  {%-     set _ = lines.append(key ~ ' ' ~ ((item | string | lower) if item is boolean else item | string)) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {%- for option in smarthome_mosquitto__secrets_file_options.general if option in secrets -%}
  {%-   set _ = lines.append(option ~ ' ' ~ smarthome_mosquitto__secrets_dir ~ '/' ~ secrets[option].name) -%}
  {%- endfor -%}
  {%- for plugin in smarthome_mosquitto__plugins -%}
  {%-   set _ = lines.append('plugin ' ~ plugin.plugin) -%}
  {%-   set _ = lines.append(plugin.option ~ ' ' ~ plugin.path) -%}
  {%- endfor -%}
  {%- set listeners = config.listener if config.listener is defined and config.listener is sequence and config.listener is not string else [] -%}
  {%- for listener in listeners if listener is mapping and listener.port is defined -%}
  {%-   set _ = lines.append('') -%}
  {%-   set _ = lines.append(('listener ' ~ listener.port ~ ' ' ~ (listener.bind_address | default('', true))) | trim) -%}
  {%-   for key, value in listener.items() if key not in [ 'port', 'bind_address', 'realm' ] and value is not none -%}
  {%-     for item in (value if value is sequence and value is not string and value is not mapping else [ value ]) -%}
  {%-       set _ = lines.append(key ~ ' ' ~ ((item | string | lower) if item is boolean else item | string)) -%}
  {%-     endfor -%}
  {%-   endfor -%}
  {%-   if listener.realm is defined and listener.realm is not none -%}
  {%-     set _ = lines.append('certfile ' ~ smarthome_mosquitto__certs_container_dir ~ '/' ~ listener.realm ~ '.crt') -%}
  {%-     set _ = lines.append('keyfile ' ~ smarthome_mosquitto__certs_container_dir ~ '/' ~ listener.realm ~ '.key') -%}
  {%-   endif -%}
  {%-   for option in smarthome_mosquitto__secrets_file_options.listener if ('listener.' ~ listener.port ~ '.' ~ option) in secrets -%}
  {%-     set _ = lines.append(option ~ ' ' ~ smarthome_mosquitto__secrets_dir ~ '/' ~ secrets['listener.' ~ listener.port ~ '.' ~ option].name) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {%- for name, content in smarthome_mosquitto__bridges_sections.items() if name not in smarthome_mosquitto__bridges_secret -%}
  {%-   set _ = lines.append('') -%}
  {%-   set _ = lines.extend(content) -%}
  {%- endfor -%}
  {%- if smarthome_mosquitto__bridges_secret | length > 0 -%}
  {%-   set _ = lines.append('') -%}
  {%-   set _ = lines.append('# The bridges with secrets, mounted as podman secrets') -%}
  {%-   set _ = lines.append('include_dir ' ~ smarthome_mosquitto__bridges_dir) -%}
  {%- endif -%}
  {{ lines }}

# The lines of the sections of the bridges by their names, with the secret files and values
smarthome_mosquitto__bridges_sections: >-
  {%- set config = smarthome_mosquitto__config if smarthome_mosquitto__config is mapping else {} -%}
  {%- set secrets = smarthome_mosquitto__secrets_by_target -%}
  {%- set sections = {} -%}
  {%- set bridges = config.connection if config.connection is defined and config.connection is sequence and config.connection is not string else [] -%}
  {%- for bridge in bridges if bridge is mapping and bridge.name is defined -%}
  {%-   set lines = [ 'connection ' ~ bridge.name ] -%}
  {%-   for key, value in bridge.items() if key not in [ 'name', 'realm' ] and value is not none -%}
  {%-     for item in (value if value is sequence and value is not string and value is not mapping else [ value ]) -%}
  {%-       set _ = lines.append(key ~ ' ' ~ ((item | string | lower) if item is boolean else item | string)) -%}
  {%-     endfor -%}
  {%-   endfor -%}
  {%-   if bridge.realm is defined and bridge.realm is not none -%}
  {%-     set _ = lines.append('bridge_certfile ' ~ smarthome_mosquitto__certs_container_dir ~ '/' ~ bridge.realm ~ '.crt') -%}
  {%-     set _ = lines.append('bridge_keyfile ' ~ smarthome_mosquitto__certs_container_dir ~ '/' ~ bridge.realm ~ '.key') -%}
  {%-   endif -%}
  {%-   for option in smarthome_mosquitto__secrets_file_options.connection if ('connection.' ~ bridge.name ~ '.' ~ option) in secrets -%}
  {%-     set _ = lines.append(option ~ ' ' ~ smarthome_mosquitto__secrets_dir ~ '/' ~ secrets['connection.' ~ bridge.name ~ '.' ~ option].name) -%}
  {%-   endfor -%}
  {%-   for option in smarthome_mosquitto__secrets_value_options.connection if ('connection.' ~ bridge.name ~ '.' ~ option) in secrets -%}
  {%-     set _ = lines.append(option ~ ' ' ~ secrets['connection.' ~ bridge.name ~ '.' ~ option].data | string) -%}
  {%-   endfor -%}
  {%-   set _ = sections.update({ bridge.name | string: lines }) -%}
  {%- endfor -%}
  {{ sections }}

# The podman secrets of the bridges with secret values, the whole section of a bridge is one secret
smarthome_mosquitto__bridges_podman_secrets: >-
  {%- set result = [] -%}
  {%- for name in smarthome_mosquitto__bridges_secret if name in smarthome_mosquitto__bridges_sections -%}
  {%-   set _ = result.append({ 'name': smarthome_mosquitto__podman_name ~ '-bridge-' ~ name, 'bridge': name,
                               'data': ([ '#', '# Ansible managed', '#' ] + smarthome_mosquitto__bridges_sections[name]) | join('\n') ~ '\n' }) -%}
  {%- endfor -%}
  {{ result }}

# The lines of the ACL file: the topics of anonymous clients, the patterns of all users and the topics of every user
smarthome_mosquitto__acl_lines: >-
  {%- set lines = [] -%}
  {%- set acl = smarthome_mosquitto__acl if smarthome_mosquitto__acl is mapping else {} -%}
  {%- for line in acl.anonymous | default([], true) -%}
  {%-   set _ = lines.append('topic ' ~ line) -%}
  {%- endfor -%}
  {%- for line in acl.pattern | default([], true) -%}
  {%-   set _ = lines.append('pattern ' ~ line) -%}
  {%- endfor -%}
  {%- if smarthome_mosquitto__users is mapping -%}
  {%-   for name, user in smarthome_mosquitto__users.items() | sort -%}
  {%-     set _ = lines.append('') -%}
  {%-     set _ = lines.append('user ' ~ name) -%}
  {%-     for line in (user.acl | default([], true) if user is mapping else []) -%}
  {%-       set _ = lines.append('topic ' ~ line) -%}
  {%-     endfor -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ lines }}

# The podman secrets mounted as files, the secrets of bridges with secret values are part of the section of the bridge
smarthome_mosquitto__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- for target, secret in smarthome_mosquitto__secrets_by_target.items() -%}
  {%-   set parts = target.split('.') -%}
  {%-   if target in smarthome_mosquitto__secrets_file_options.general
           or (parts | length == 3 and parts[2] in (smarthome_mosquitto__secrets_file_options[parts[0]] | default([]))) -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ smarthome_mosquitto__secrets_dir ~ '/' ~ secret.name
                                 ~ ',uid=' ~ smarthome_mosquitto__uid ~ ',gid=' ~ smarthome_mosquitto__gid ~ ',mode=0400') -%}
  {%-   endif -%}
  {%- endfor -%}
  {%- for secret in smarthome_mosquitto__bridges_podman_secrets -%}
  {%-   set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ smarthome_mosquitto__bridges_dir ~ '/' ~ secret.bridge ~ '.conf'
                               ~ ',uid=' ~ smarthome_mosquitto__uid ~ ',gid=' ~ smarthome_mosquitto__gid ~ ',mode=0400') -%}
  {%- endfor -%}
  {{ secrets }}

smarthome_mosquitto__podman_container_default:
  name: "{{ smarthome_mosquitto__podman_name }}"
  hostname: "{{ smarthome_mosquitto__hostname }}"
  image: "{{ smarthome_mosquitto__podman_image }}:{{ smarthome_mosquitto__podman_tag }}"
  ip: "{{ smarthome_mosquitto__ip }}"
  ipv6: "{{ smarthome_mosquitto__ipv6 | default(omit) }}"
  network: "{{ smarthome_mosquitto__network }}"
  timezone: "{{ smarthome_mosquitto__timezone }}"
  environment: "{{ smarthome_mosquitto__environment | default(omit) }}"
  publish:
    - '1883:1883/tcp'
    - '8883:8883/tcp'
  secrets: "{{ smarthome_mosquitto__podman_secrets if smarthome_mosquitto__podman_secrets | length > 0 else omit }}"
  # The configuration, the users, the ACL and the certificates are read only, the broker writes the persistence to data,
  # mosquitto_container.volumes replaces the list completely
  volumes:
    - "{{ smarthome_mosquitto__podman_config_dir }}:{{ smarthome_mosquitto__container_config_dir }}:ro"
    - "{{ smarthome_mosquitto__podman_data_dir }}:{{ smarthome_mosquitto__container_data_dir }}"
    - "{{ smarthome_mosquitto__certs_dir }}:{{ smarthome_mosquitto__certs_container_dir }}:ro"
  # Installs the certificates of the realms on every start, install follows the links of the source and sets owner and mode.
  # A renewed certificate is used after the next restart, the timer of pki_update restarts Mosquitto after a renewal.
  exec_start_pre: >-
    {%- set commands = [] -%}
    {%- for realm in smarthome_mosquitto__realms_valid -%}
    {%-   set _ = commands.append('install -o ' ~ smarthome_mosquitto__uid ~ ' -g ' ~ smarthome_mosquitto__gid ~ ' -m 0644 '
                                  ~ smarthome_mosquitto__realms_dir ~ '/' ~ realm ~ '/fullchain.pem ' ~ smarthome_mosquitto__certs_dir ~ '/' ~ realm ~ '.crt') -%}
    {%-   set _ = commands.append('install -o ' ~ smarthome_mosquitto__uid ~ ' -g ' ~ smarthome_mosquitto__gid ~ ' -m 0400 '
                                  ~ smarthome_mosquitto__realms_dir ~ '/' ~ realm ~ '/privkey.pem ' ~ smarthome_mosquitto__certs_dir ~ '/' ~ realm ~ '.key') -%}
    {%- endfor -%}
    {{ commands }}
