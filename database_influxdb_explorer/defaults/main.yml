---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-influxdb-explorer
#

database_influxdb_explorer__home: "{{ influxdb_explorer_home | mandatory }}"
database_influxdb_explorer__ip: "{{ influxdb_explorer_ip | mandatory }}"
database_influxdb_explorer__ipv6: "{{ influxdb_explorer_ipv6 | default('') }}"
database_influxdb_explorer__network: "{{ influxdb_explorer_network | mandatory }}"
database_influxdb_explorer__hostname: "{{ influxdb_explorer_hostname | mandatory }}"
database_influxdb_explorer__timezone: "{{ influxdb_explorer_timezone | mandatory }}"
database_influxdb_explorer__labels: "{{ influxdb_explorer_labels | default({}) }}"

database_influxdb_explorer__version: "{{ influxdb_explorer_version | default('latest') }}"

database_influxdb_explorer__container: "{{ database_influxdb_explorer__podman_container_default | combine(influxdb_explorer_container | default({})) }}"

database_influxdb_explorer__default_server: "{{ influxdb_explorer_default_server | mandatory }}"
database_influxdb_explorer__default_database: "{{ influxdb_explorer_default_database | mandatory }}"
database_influxdb_explorer__default_token: "{{ influxdb_explorer_default_token | mandatory }}"
database_influxdb_explorer__default_name: "{{ influxdb_explorer_default_name | mandatory }}"

database_influxdb_explorer__session_secret: "{{ influxdb_explorer_session_secret | mandatory }}"

database_influxdb_explorer__autoupdate_enabled: "{{ influxdb_explorer_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

database_influxdb_explorer__podman_name: 'influxdb-explorer'
database_influxdb_explorer__podman_image: 'docker.io/influxdata/influxdb3-ui'
database_influxdb_explorer__podman_tag: "{{ database_influxdb_explorer__version }}"

database_influxdb_explorer__podman_home: "{{ database_influxdb_explorer__home }}"
database_influxdb_explorer__podman_data_dir: "{{ database_influxdb_explorer__podman_home }}/db"
database_influxdb_explorer__podman_config_dir: "{{ database_influxdb_explorer__podman_home }}/config"


database_influxdb_explorer__podman_container_default:
  name: "{{ database_influxdb_explorer__podman_name }}"
  hostname: "{{ database_influxdb_explorer__hostname }}"
  image: "{{ database_influxdb_explorer__podman_image }}:{{ database_influxdb_explorer__podman_tag }}"
  ip: "{{ database_influxdb_explorer__ip }}"
  ipv6: "{{ database_influxdb_explorer__ipv6 }}"
  network: "{{ database_influxdb_explorer__network }}"
  timezone: "{{ database_influxdb_explorer__timezone }}"
  labels: "{{ database_influxdb_explorer__labels }}"
  secrets:
    - "influxdb_explorer_session_secret,type=env,target=SESSION_SECRET_KEY"
  volumes:
    - "/etc/localtime:/etc/localtime:ro"
    - "/etc/timezone:/etc/timezone:ro"
    - "{{ database_influxdb_explorer__podman_data_dir }}:/db"
    - "{{ database_influxdb_explorer__podman_config_dir }}:/app-root/config:ro"
