---

#
# Substitutes - do not change
#

app_jellyfin__home: "{{ jellyfin_home | mandatory }}"

app_jellyfin__hostname: "{{ jellyfin_hostname | mandatory }}"
app_jellyfin__ip: "{{ jellyfin_ip | mandatory }}"
app_jellyfin__ipv6: "{{ jellyfin_ipv6 | default('') }}"
app_jellyfin__network: "{{ jellyfin_network | mandatory }}"
app_jellyfin__hosts: "{{ jellyfin_hosts | default({}) }}"
app_jellyfin__version: "{{ jellyfin_version | default('latest') }}"
app_jellyfin__timezone: "{{ jellyfin_timezone | mandatory }}"
app_jellyfin__uid: "{{ jellyfin_uid | default(app_jellyfin__uid_default) }}"
app_jellyfin__gid: "{{ jellyfin_gid | default(app_jellyfin__gid_default) }}"

app_jellyfin__container: "{{ app_jellyfin__container_default | combine(jellyfin_container | default({})) }}"

app_jellyfin__url: "{{ jellyfin_url | default('') }}"
app_jellyfin__port: "{{ jellyfin_port | default(8096) }}"
app_jellyfin__library_dir: "{{ jellyfin_library | mandatory }}"
app_jellyfin__discovery_enable: "{{ jellyfin_discovery | default(false) }}"

app_jellyfin__dri_enable: "{{ jellyfin_dri | default(false) }}"
app_jellyfin__v4l_enable: "{{ jellyfin_v4l | default(false) }}"
app_jellyfin__openmax_enable: "{{ jellyfin_openmax | default(false) }}"

#
# Defaults - do not change
#

app_jellyfin__data_dir: "{{ app_jellyfin__home }}"

app_jellyfin__uid_default: '911'
app_jellyfin__gid_default: '911'

app_jellyfin__name: 'jellyfin'
app_jellyfin__image: 'lscr.io/linuxserver/jellyfin'

app_jellyfin__environment_default: "{{
  {
    'PUID': app_jellyfin__uid,
    'PGID': app_jellyfin__gid,
    'TZ': app_jellyfin__timezone
  } | combine(app_jellyfin__environment_url_default)
}}"

app_jellyfin__environment_url_default: "{{
  {
    'JELLYFIN_PublishedServerUrl': app_jellyfin__url
  } if app_jellyfin__url | length > 0 else {}
}}"

app_jellyfin__device_dri_default: "{{
  [
    '/dev/dri:/dev/dri'
  ] if app_jellyfin__dri_enable else []
}}"

app_jellyfin__device_v4l_default: "{{
  [
    '/dev/video10:/dev/video10',
    '/dev/video11:/dev/video11',
    '/dev/video12:/dev/video12'
  ] if app_jellyfin__v4l_enable else []
}}"

app_jellyfin__device_openmax_default: "{{
  [
    '/dev/vcsm:/dev/vcsm',
    '/dev/vchiq:/dev/vchiq'
  ] if app_jellyfin__openmax_enable else []
}}"

app_jellyfin__devices_default: "{{
  app_jellyfin__device_dri_default +
  app_jellyfin__device_v4l_default +
  app_jellyfin__device_openmax_default
}}"

app_jellyfin__volume_openmax_default: "{{
  [
    '/opt/vc/lib:/opt/vc/lib'
  ] if app_jellyfin__openmax_enable else []
}}"

app_jellyfin__volumes_default: "{{
  [
    '/etc/localtime:/etc/localtime:ro',
    '/etc/timezone:/etc/timezone:ro',
    app_jellyfin__data_dir + ':/config',
    app_jellyfin__library_dir + ':/data'
  ] + app_jellyfin__volume_openmax_default
}}"

app_jellyfin__publish_default: "{{
  [
    '7359:7359/udp',
    '1900:1900/udp'
  ] if app_jellyfin__discovery_enable else []
}}"

app_jellyfin__container_default:
    name: "{{ app_jellyfin__name }}"
    hostname: "{{ app_jellyfin__hostname }}"
    image: "{{ app_jellyfin__image }}:{{ app_jellyfin__version }}"
    ip: "{{ app_jellyfin__ip }}"
    network: "{{ app_jellyfin__network }}"
    restart_policy: 'always'
    environment: "{{ app_jellyfin__environment_default }}"
    hosts: "{{ app_jellyfin__hosts }}"
    timezone: "{{ app_jellyfin__timezone }}"
    publish: "{{ app_jellyfin__publish_default }}"
    devices: "{{ app_jellyfin__devices_default }}"
    volumes: "{{ app_jellyfin__volumes_default }}"

