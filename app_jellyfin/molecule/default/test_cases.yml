---
# Network created by container_podman in prepare.yml
app_jellyfin__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_jellyfin__test_image: 'lscr.io/linuxserver/jellyfin:latest'
app_jellyfin__test_quadlet_path: '/etc/containers/systemd/jellyfin.container'

app_jellyfin__test_cases:

  # Only the mandatory variables, no public URL
  - name: 'molecule-jellyfin-default'
    role_vars:
      jellyfin_home: '/opt/jellyfin'
      jellyfin_library: '/srv/media'
      jellyfin_ip: '10.89.0.90'
      jellyfin_network: 'podman-molecule'
      jellyfin_hostname: 'jellyfin-default'
      jellyfin_timezone: 'Europe/Berlin'
    expect:
      ip: '10.89.0.90'
      ip6: ~
      home: '/opt/jellyfin'
      url: ~
      quadlet:
        - 'Volume=/opt/jellyfin:/config'
        - 'Volume=/srv/media:/data'
        - 'PublishPort=7359:7359/udp'
        - 'PublishPort=1900:1900/udp'
      env:
        - 'PUID=911'
        - 'PGID=911'
        - 'TZ=Europe/Berlin'
      absent_env:
        - 'JELLYFIN_PublishedServerUrl'

  # IPv6, labels and a public URL
  - name: 'molecule-jellyfin'
    role_vars:
      jellyfin_home: '/srv/jellyfin'
      jellyfin_library: '/srv/media'
      jellyfin_ip: '10.89.0.91'
      jellyfin_ipv6: 'fd00:89::91'
      jellyfin_network: 'podman-molecule'
      jellyfin_hostname: 'jellyfin-molecule'
      jellyfin_timezone: 'Europe/Berlin'
      jellyfin_url: 'https://jellyfin.example.org'
      jellyfin_labels:
        traefik.enable: 'true'
    # side_effect changes the public URL, the quadlet unit changes and Jellyfin has to restart
    side_effect:
      role_vars:
        jellyfin_url: 'https://media.example.org'
    expect:
      ip: '10.89.0.91'
      ip6: 'fd00:89::91'
      home: '/srv/jellyfin'
      url: 'https://media.example.org'
      quadlet:
        - 'Volume=/srv/jellyfin:/config'
        - 'Volume=/srv/media:/data'
        - 'Label=traefik.enable=true'
      env:
        - 'PUID=911'
        - 'PGID=911'
        - 'TZ=Europe/Berlin'
        - 'JELLYFIN_PublishedServerUrl=https://media.example.org'
      absent_env: []
