---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/app-karakeep-chrome
#

app_karakeep_chrome__ip: "{{ karakeep_chrome_ip | mandatory }}"
app_karakeep_chrome__ipv6: "{{ karakeep_chrome_ipv6 }}"
app_karakeep_chrome__network: "{{ karakeep_chrome_network | mandatory }}"
app_karakeep_chrome__hostname: "{{ karakeep_chrome_hostname | mandatory }}"
app_karakeep_chrome__timezone: "{{ karakeep_chrome_timezone | mandatory }}"
app_karakeep_chrome__labels: "{{ karakeep_chrome_labels }}"

app_karakeep_chrome__version: "{{ karakeep_chrome_version | default('release') }}"

# The flags of Chrome are the command of the container, they are changed with karakeep_chrome_container.command
app_karakeep_chrome__container: "{{ app_karakeep_chrome__podman_container_default | combine(karakeep_chrome_container | default({})) }}"

app_karakeep_chrome__autoupdate_enabled: "{{ karakeep_chrome_autoupdate_enabled | default(false) }}"
app_karakeep_chrome__autoupdate_schedule: "{{ karakeep_chrome_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_karakeep_chrome__podman_name: 'karakeep-chrome'
app_karakeep_chrome__podman_image: 'ghcr.io/karakeep-app/karakeep-chrome'

# The DevTools endpoint, forwarded by socat in the entrypoint of the image
app_karakeep_chrome__port: 9222

app_karakeep_chrome__environment_default:
  TZ: "{{ app_karakeep_chrome__timezone }}"

# The flags of docker/docker-compose.yml of Karakeep v0.34.1, docker/chrome/entrypoint.sh adds the flags for the headless mode
app_karakeep_chrome__command_default:
  - '--disable-gpu'
  - '--disable-dev-shm-usage'
  - '--hide-scrollbars'
  - '--disable-blink-features=AutomationControlled'
  - '--window-size=1440,900'

# docker/chrome/Dockerfile and entrypoint.sh of Karakeep v0.34.1 read no environment variables,
# TZ sets the timezone of Chrome
app_karakeep_chrome__environment_allowed:
  - 'TZ'

app_karakeep_chrome__podman_container_default:
  name: "{{ app_karakeep_chrome__podman_name }}"
  hostname: "{{ app_karakeep_chrome__hostname }}"
  image: "{{ app_karakeep_chrome__podman_image }}:{{ app_karakeep_chrome__version }}"
  ip: "{{ app_karakeep_chrome__ip }}"
  ipv6: "{{ app_karakeep_chrome__ipv6 | default(omit) }}"
  network: "{{ app_karakeep_chrome__network }}"
  timezone: "{{ app_karakeep_chrome__timezone }}"
  environment: "{{ app_karakeep_chrome__environment_default }}"
  labels: "{{ app_karakeep_chrome__labels | default(omit) }}"
  command: "{{ app_karakeep_chrome__command_default }}"
  # An init reaps the processes of Chrome, like init: true of the compose file
  init: true
