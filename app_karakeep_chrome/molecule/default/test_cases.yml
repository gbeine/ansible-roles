---
# Network created by container_podman in prepare.yml
app_karakeep_chrome__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_karakeep_chrome__test_image: 'ghcr.io/karakeep-app/karakeep-chrome:release'
app_karakeep_chrome__test_quadlet_path: '/etc/containers/systemd/karakeep-chrome.container'

# The flags of the compose file of Karakeep, the default of the role
app_karakeep_chrome__test_flags:
  - '--disable-gpu'
  - '--disable-dev-shm-usage'
  - '--hide-scrollbars'
  - '--disable-blink-features=AutomationControlled'
  - '--window-size=1440,900'

app_karakeep_chrome__test_cases:

  # Only the mandatory variables
  - name: 'molecule-karakeep-chrome-default'
    role_vars:
      karakeep_chrome_ip: '10.89.0.90'
      karakeep_chrome_network: 'podman-molecule'
      karakeep_chrome_hostname: 'karakeep-chrome-default'
      karakeep_chrome_timezone: 'Europe/Berlin'
    expect:
      ip: '10.89.0.90'
      ip6: ~
      flags: "{{ app_karakeep_chrome__test_flags }}"
      quadlet: []
      env:
        - 'TZ=Europe/Berlin'

  # IPv6, labels and an additional flag of Chrome
  - name: 'molecule-karakeep-chrome'
    role_vars:
      karakeep_chrome_ip: '10.89.0.91'
      karakeep_chrome_ipv6: 'fd00:89::91'
      karakeep_chrome_network: 'podman-molecule'
      karakeep_chrome_hostname: 'karakeep-chrome-molecule'
      karakeep_chrome_timezone: 'Europe/Berlin'
      karakeep_chrome_labels:
        traefik.enable: 'false'
      karakeep_chrome_container:
        command: "{{ app_karakeep_chrome__test_flags + [ '--lang=de-DE' ] }}"
    # A valid change of the side effect, the quadlet unit changes and Chrome has to restart
    side_effect:
      karakeep_chrome_container:
        command: "{{ app_karakeep_chrome__test_flags[:-1] + [ '--window-size=1280,800', '--lang=de-DE' ] }}"
    expect:
      ip: '10.89.0.91'
      ip6: 'fd00:89::91'
      flags: "{{ app_karakeep_chrome__test_flags[:-1] + [ '--window-size=1280,800', '--lang=de-DE' ] }}"
      quadlet:
        - 'Label=traefik.enable=false'
      env:
        - 'TZ=Europe/Berlin'
