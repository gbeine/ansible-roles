---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/vpn-wireguard
#

vpn_wireguard__networks: "{{ wireguard_networks | default([]) }}"
vpn_wireguard__networks_prune: "{{ wireguard_networks_prune | default(true) }}"

# OpenWrt: wait for the connection after the restart of the network that follows the installation of WireGuard
vpn_wireguard__openwrt_wait_for_connection: "{{ wireguard_openwrt_wait_for_connection | default(true) }}"
vpn_wireguard__openwrt_wait_for_connection_timeout: "{{ wireguard_openwrt_wait_for_connection_timeout | default(600) }}"

# Defaults - do not change
vpn_wireguard__etc_dir: '/etc/wireguard'
