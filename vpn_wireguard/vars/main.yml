---
# General interface options of netifd and LuCI (tab Advanced), OpenWrt only, e.g. defaultroute, delegate, multipath
vpn_wireguard__openwrt_netifd_boolean_options: ['auto', 'defaultroute', 'peerdns', 'delegate', 'force_link']
vpn_wireguard__openwrt_netifd_number_options: ['dns_metric', 'ip6assign', 'ip6weight']
vpn_wireguard__openwrt_netifd_list_options: ['dns', 'dns_search', 'ip6class']
vpn_wireguard__openwrt_netifd_string_options: ['ip4table', 'ip6table', 'ip6hint', 'ip6ifaceid', 'multipath']
vpn_wireguard__openwrt_netifd_options: >-
  {{ vpn_wireguard__openwrt_netifd_boolean_options + vpn_wireguard__openwrt_netifd_number_options
     + vpn_wireguard__openwrt_netifd_list_options + vpn_wireguard__openwrt_netifd_string_options }}

# Attributes of the entries of wireguard_networks and of their peers, peers is optional
vpn_wireguard__network_required: ['interface', 'address', 'private_key']
vpn_wireguard__network_options: >-
  {{ ['interface', 'address', 'private_key', 'peers', 'listen_port', 'mtu', 'postup', 'postdown', 'fwmark',
      'metric', 'ip6prefix', 'nohostroute', 'tunlink'] + vpn_wireguard__openwrt_netifd_options }}

vpn_wireguard__peer_required: ['public_key', 'allowed_ips']
vpn_wireguard__peer_options:
  - 'public_key'
  - 'allowed_ips'
  - 'preshared_key'
  - 'endpoint'
  - 'persistent_keepalive'
  - 'description'
  - 'route_allowed_ips'
  - 'disabled'
  # Written on OpenWrt like LuCI (Generate configuration), not on Debian
  - 'private_key'

# Attributes with a list of values, strings are separated by commas
vpn_wireguard__list_options: "{{ ['address', 'ip6prefix'] + vpn_wireguard__openwrt_netifd_list_options }}"
vpn_wireguard__boolean_options: "{{ ['nohostroute', 'route_allowed_ips', 'disabled'] + vpn_wireguard__openwrt_netifd_boolean_options }}"
vpn_wireguard__number_options: "{{ ['listen_port', 'mtu', 'metric', 'persistent_keepalive'] + vpn_wireguard__openwrt_netifd_number_options }}"

# Attributes of the interface without counterpart in wg-quick, ignored with a warning on Debian
vpn_wireguard__openwrt_only: "{{ ['metric', 'ip6prefix', 'nohostroute', 'tunlink'] + vpn_wireguard__openwrt_netifd_options }}"
