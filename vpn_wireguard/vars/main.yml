---
# Attributes of the entries of wireguard_networks and of their peers
vpn_wireguard__network_required: ['interface', 'address', 'private_key', 'peers']
vpn_wireguard__network_options:
  - 'interface'
  - 'address'
  - 'private_key'
  - 'peers'
  - 'listen_port'
  - 'mtu'
  - 'postup'
  - 'postdown'
  - 'fwmark'
  - 'metric'
  - 'ip6prefix'
  - 'nohostroute'
  - 'tunlink'

vpn_wireguard__peer_required: ['public_key', 'allowed_ips']
vpn_wireguard__peer_options:
  - 'public_key'
  - 'allowed_ips'
  - 'preshared_key'
  - 'endpoint'
  - 'persistent_keepalive'
  - 'description'
  - 'route_allowed_ips'
  - 'disabled'

# Attributes with a list of values, strings are separated by commas
vpn_wireguard__list_options: ['address', 'ip6prefix']
vpn_wireguard__boolean_options: ['nohostroute', 'route_allowed_ips', 'disabled']
vpn_wireguard__number_options: ['listen_port', 'mtu', 'metric', 'persistent_keepalive']

# Attributes of the interface without counterpart in wg-quick, ignored with a warning on Debian
vpn_wireguard__openwrt_only: ['metric', 'ip6prefix', 'nohostroute', 'tunlink']
