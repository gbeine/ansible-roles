---
# Included by tasks/openwrt.yml on OpenWrt

# wireguard-tools pulls in kmod-wireguard
vpn_wireguard__openwrt_packages: ['wireguard-tools']

# Optional attributes of the interface written as UCI options of the same name,
# taken from the protocol handler wireguard of OpenWrt (proto_setup)
vpn_wireguard__openwrt_interface_options: ['listen_port', 'mtu', 'fwmark', 'metric', 'ip6prefix', 'nohostroute', 'tunlink']

# Options never shown in diffs and redacted in the backup
vpn_wireguard__openwrt_secret_options: ['private_key', 'preshared_key']
