---
# Container started by prepare.yml as quadlet, updated by the role
container_update__test_container:
  name: 'molupd'
  image: 'docker.io/library/alpine:3'

container_update__test_cases:

  # Without pushover, with the default schedule
  - name: 'molecule-container-update'
    role_vars:
      container_name: 'molupd'
      container_image: 'docker.io/library/alpine:3'
    expect:
      pushover: false
      schedule: '*-*-* 00/4:00:00'

  # With pushover (test credentials, never used) and an own schedule
  - name: 'molecule-container-update-pushover'
    role_vars:
      container_name: 'molupd'
      container_image: 'docker.io/library/alpine:3'
      container_schedule: '*-*-* 03:30:00'
      container_pushover_key: 'molecule-test-user-key'
      container_pushover_token: 'molecule-test-app-token'
    expect:
      pushover: true
      schedule: '*-*-* 03:30:00'
