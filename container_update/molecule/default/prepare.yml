---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks: []
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Pull the image of the test container'
      containers.podman.podman_image:
        name: "{{ container_update__test_container.image }}"

    - name: 'Create the quadlet of the test container'
      ansible.builtin.copy:
        dest: "/etc/containers/systemd/{{ container_update__test_container.name }}.container"
        content: |
          [Container]
          ContainerName={{ container_update__test_container.name }}
          Image={{ container_update__test_container.image }}
          Exec=sleep infinity
        mode: '644'

    - name: 'Start the test container'
      ansible.builtin.systemd_service:
        name: "{{ container_update__test_container.name }}.service"
        daemon_reload: true
        state: 'started'
