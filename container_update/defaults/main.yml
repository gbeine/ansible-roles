---

container_update__container_name: "{{ container_name | default('') }}"
container_update__container_image: "{{ container_image | mandatory }}"
container_update__schedule: "{{ container_schedule | default('') }}"
container_update__pushover_key: "{{ container_pushover_key | default('') }}"
container_update__pushover_token: "{{ container_pushover_token | default('') }}"

# Defaults - do not change
container_update__pushover_enabled: "{{ container_update__pushover_key | length > 0 and container_update__pushover_token | length > 0 }}"
container_update__environment_file: '/etc/systemd/container-update.env'
container_update__systemd_dir: '/etc/systemd/system'
