---

- name: 'Install container update'
  tags: [ 'container_update' ]
  block:

    - name: 'Include OS-specific variables'
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"

    - name: 'Install container update packages'
      ansible.builtin.apt:
        update_cache: true
        install_recommends: false
        pkg: "{{ container_update__packages }}"

    - name: 'Create environment file'
      ansible.builtin.copy:
        content: |
          PUSHOVER_APP_TOKEN="{{ container_update__pushover_token }}"
          PUSHOVER_USER_KEY="{{ container_update__pushover_key }}"
        dest: "{{ container_update__environment_file }}"
        owner: 'root'
        group: 'root'
        mode: '600'
      no_log: true
      when: container_update__pushover_enabled | bool

    - name: 'Remove environment file'
      ansible.builtin.file:
        path: "{{ container_update__environment_file }}"
        state: absent
      when: not container_update__pushover_enabled | bool

    - name: 'Create systemd unit templates'
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ container_update__systemd_dir }}/{{ item | regex_replace('\\.(service|timer)$', '@.\\1') }}"
        owner: 'root'
        group: 'root'
        mode: '644'
      loop:
        - 'container-update.service'
        - 'container-update.timer'
      register: 'container_update__units'

    - name: 'Create failure notification unit template'
      ansible.builtin.template:
        src: 'container-update-notify-failure.service.j2'
        dest: "{{ container_update__systemd_dir }}/container-update-notify-failure@.service"
        owner: 'root'
        group: 'root'
        mode: '644'
      register: 'container_update__notify_unit'
      when: container_update__pushover_enabled | bool

    - name: 'Remove failure notification unit template'
      ansible.builtin.file:
        path: "{{ container_update__systemd_dir }}/container-update-notify-failure@.service"
        state: absent
      register: 'container_update__notify_unit_removed'
      when: not container_update__pushover_enabled | bool

    - name: 'Configure the container'
      when: container_update__container_name | length > 0
      block:

        - name: 'Create directories for the overrides'
          ansible.builtin.file:
            path: "{{ container_update__systemd_dir }}/container-update@{{ container_update__container_name }}.{{ item }}.d"
            state: 'directory'
            owner: 'root'
            group: 'root'
            mode: '755'
          loop:
            - 'service'
            - 'timer'

        - name: 'Create override for the service'
          ansible.builtin.template:
            src: 'service.override.conf.j2'
            dest: "{{ container_update__systemd_dir }}/container-update@{{ container_update__container_name }}.service.d/override.conf"
            owner: 'root'
            group: 'root'
            mode: '644'
          register: 'container_update__service_override'

        - name: 'Create override for the timer'
          ansible.builtin.template:
            src: 'timer.override.conf.j2'
            dest: "{{ container_update__systemd_dir }}/container-update@{{ container_update__container_name }}.timer.d/override.conf"
            owner: 'root'
            group: 'root'
            mode: '644'
          register: 'container_update__timer_override'
          when: container_update__schedule | length > 0

        - name: 'Remove override for the timer'
          ansible.builtin.file:
            path: "{{ container_update__systemd_dir }}/container-update@{{ container_update__container_name }}.timer.d/override.conf"
            state: absent
          register: 'container_update__timer_override_removed'
          when: container_update__schedule | length == 0

    - name: 'Reload systemd'
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: >-
        container_update__units is changed
        or container_update__notify_unit is changed
        or container_update__notify_unit_removed is changed
        or container_update__service_override is changed
        or container_update__timer_override is changed
        or container_update__timer_override_removed is changed

    - name: 'Start and enable the timer'
      ansible.builtin.systemd_service:
        name: "container-update@{{ container_update__container_name }}.timer"
        state: "{{ 'restarted' if container_update__timer_changed | bool else 'started' }}"
        enabled: true
      vars:
        container_update__timer_changed: >-
          {{ container_update__units is changed
             or container_update__timer_override is changed
             or container_update__timer_override_removed is changed }}
      when: not ansible_check_mode and container_update__container_name | length > 0
