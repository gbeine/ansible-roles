---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/nextcloud
#

app_nextcloud__home: "{{ nextcloud_home | mandatory }}"
app_nextcloud__ip: "{{ nextcloud_ip | mandatory }}"
app_nextcloud__ipv6: "{{ nextcloud_ipv6 | default('') }}"
app_nextcloud__network: "{{ nextcloud_network | mandatory }}"
app_nextcloud__hostname: "{{ nextcloud_hostname | mandatory }}"
app_nextcloud__timezone: "{{ nextcloud_timezone | mandatory }}"
app_nextcloud__labels: "{{ nextcloud_labels | default({}) }}"
app_nextcloud__publish: "{{ nextcloud_publish | default([]) }}"

app_nextcloud__version: "{{ nextcloud_version | default('latest') }}"

app_nextcloud__container: "{{ app_nextcloud__container_default | combine(nextcloud_container | default({})) }}"

app_nextcloud__config: "{{ nextcloud_config | default('') }}"

#
# Defaults - do not change
#

app_nextcloud__uid: "{{ nextcloud_uid | mandatory }}"
app_nextcloud__gid: "{{ nextcloud_gid | default(app_nextcloud__uid) }}"

app_nextcloud__podman_name: 'nextcloud'
app_nextcloud__podman_image: 'lscr.io/linuxserver/nextcloud'
app_nextcloud__podman_tag: "{{ app_nextcloud__version }}"

app_nextcloud__podman_home: "{{ app_nextcloud__home }}"
app_nextcloud__podman_config_dir: "{{ app_nextcloud__podman_home }}/config"
app_nextcloud__podman_data_dir: "{{ app_nextcloud__podman_home }}/data"
app_nextcloud__podman_redis_dir: "{{ app_nextcloud__podman_home }}/redis"

app_nextcloud__container_default:
  name: "{{ app_nextcloud__podman_name }}"
  hostname: "{{ app_nextcloud__hostname }}"
  image: "{{ app_nextcloud__podman_image }}:{{ app_nextcloud__podman_tag }}"
  ip: "{{ app_nextcloud__ip }}"
  ipv6: "{{ app_nextcloud__ipv6 }}"
  network: "{{ app_nextcloud__network }}"
  timezone: "{{ app_nextcloud__timezone }}"
  environment:
    PUID: "{{ app_nextcloud__uid }}"
    PGID: "{{ app_nextcloud__gid }}"
    TZ: "{{ app_nextcloud__timezone }}"
  labels: "{{ app_nextcloud__labels }}"
  volumes:
    - "{{ app_nextcloud__home }}/config:/config"
    - "{{ app_nextcloud__home }}/data:/data"
    - '/usr/local/share/ca-certificates:/usr/local/share/ca-certificates'
