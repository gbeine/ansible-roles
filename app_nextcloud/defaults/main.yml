---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/nextcloud
#

app_nextcloud__home: "{{ nextcloud_home | mandatory }}"
app_nextcloud__ip: "{{ nextcloud_ip | mandatory }}"
app_nextcloud__ipv6: "{{ nextcloud_ipv6 }}"
app_nextcloud__network: "{{ nextcloud_network | mandatory }}"
app_nextcloud__hostname: "{{ nextcloud_hostname | mandatory }}"
app_nextcloud__timezone: "{{ nextcloud_timezone | mandatory }}"
app_nextcloud__labels: "{{ nextcloud_labels | default({}) }}"

# The user and group of /config and /data, the image runs Nextcloud as this user
app_nextcloud__uid: "{{ nextcloud_uid | mandatory }}"
app_nextcloud__gid: "{{ nextcloud_gid | default(app_nextcloud__uid) }}"

app_nextcloud__version: "{{ nextcloud_version | default('latest') }}"

app_nextcloud__container: "{{ app_nextcloud__podman_container_default | combine(nextcloud_container | default({})) }}"

# Variables of the image, e.g. UMASK, the role sets PUID, PGID and TZ
app_nextcloud__environment: "{{ app_nextcloud__environment_default | combine(nextcloud_environment | default({})) }}"

# The passwords of config.php with name, data and target, the targets are dbpassword and mail_smtppassword
app_nextcloud__secrets: "{{ nextcloud_secrets | default([]) }}"

# The system values of config.php, merged over the default, null removes the value
app_nextcloud__config: "{{ app_nextcloud__config_default | combine(nextcloud_config | default({})) }}"

# Users with name, display_name, email, groups and admin, the passwords of the users
app_nextcloud__users: "{{ nextcloud_users | default([]) }}"
app_nextcloud__passwords: "{{ nextcloud_passwords | default({}) }}"

app_nextcloud__autoupdate_enabled: "{{ nextcloud_autoupdate_enabled | default(false) }}"
app_nextcloud__autoupdate_schedule: "{{ nextcloud_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_nextcloud__config_default:
  dbtype: 'mysql'
  trusted_domains: [ "{{ app_nextcloud__hostname }}" ]
  overwrite.cli.url: "https://{{ app_nextcloud__hostname }}"
  upgrade.disable-web: true

# The values set by Nextcloud, the installation and the role, the passwords are set with nextcloud_secrets
app_nextcloud__config_role:
  - 'installed'
  - 'version'
  - 'instanceid'
  - 'passwordsalt'
  - 'secret'
  - 'datadirectory'
  - 'data-fingerprint'
  - 'copied_sample_config'
  - 'dbpassword'
  - 'mail_smtppassword'

# The allowed values, sqlite is not supported by the role
app_nextcloud__config_values:
  dbtype: [ 'mysql', 'pgsql' ]

# The database needs these values and the secret dbpassword
app_nextcloud__config_database: [ 'dbhost', 'dbname', 'dbuser' ]

# The passwords of config.php, they are written by the role and not created as podman secrets,
# Nextcloud reads them only from config.php
app_nextcloud__secret_variables: [ 'dbpassword', 'mail_smtppassword' ]
app_nextcloud__secrets_required: [ 'dbpassword' ]

# The data of a secret by its target
app_nextcloud__secret_data: >-
  {%- set data = {} -%}
  {%- if app_nextcloud__secrets is sequence and app_nextcloud__secrets is not string and app_nextcloud__secrets is not mapping -%}
  {%-   for secret in app_nextcloud__secrets if secret is mapping and secret.target is defined and secret.data is defined -%}
  {%-     set _ = data.update({ secret.target: secret.data | string }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ data }}

# The first administrator of nextcloud_users, created by the installation
app_nextcloud__admin: >-
  {{ (app_nextcloud__users | select('mapping') | selectattr('admin', 'defined') | selectattr('admin', 'equalto', true) | first | default({}))
     if app_nextcloud__users is sequence and app_nextcloud__users is not string and app_nextcloud__users is not mapping else {} }}

# The names of the users, stricter than Nextcloud: no spaces and no quotes
app_nextcloud__user_name_pattern: '^[a-zA-Z0-9_.@-]{1,64}$'
app_nextcloud__user_keys: [ 'name', 'display_name', 'email', 'groups', 'admin' ]

# The minimal length of the password policy of Nextcloud
app_nextcloud__password_length: 10

app_nextcloud__environment_default:
  PUID: "{{ app_nextcloud__uid | string }}"
  PGID: "{{ app_nextcloud__gid | string }}"
  TZ: "{{ app_nextcloud__timezone }}"

# The variables of the linuxserver image (readme-vars.yml of linuxserver/docker-nextcloud and the base image),
# Nextcloud itself reads its configuration from config.php
app_nextcloud__environment_allowed: [ 'PUID', 'PGID', 'TZ', 'UMASK' ]

app_nextcloud__podman_name: 'nextcloud'
app_nextcloud__podman_image: 'lscr.io/linuxserver/nextcloud'

app_nextcloud__podman_container_default:
  name: "{{ app_nextcloud__podman_name }}"
  hostname: "{{ app_nextcloud__hostname }}"
  image: "{{ app_nextcloud__podman_image }}:{{ app_nextcloud__version }}"
  ip: "{{ app_nextcloud__ip }}"
  ipv6: "{{ app_nextcloud__ipv6 | default(omit) }}"
  network: "{{ app_nextcloud__network }}"
  timezone: "{{ app_nextcloud__timezone }}"
  labels: "{{ app_nextcloud__labels | default(omit) }}"
  environment: "{{ app_nextcloud__environment }}"
  volumes:
    - "{{ app_nextcloud__home }}/config:/config"
    - "{{ app_nextcloud__home }}/data:/data"
    - '/usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro'

