---

- name: 'Deploy nextcloud container'
  tags: [ 'app_nextcloud' ]
  block:

    - name: 'Create nextcloud directories'
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ app_nextcloud__uid }}"
        group: "{{ app_nextcloud__gid }}"
        mode: "{{ item.mode | default('0750') }}"
        state: 'directory'
      with_items:
        - "{{ app_nextcloud__podman_config_dir }}"
        - "{{ app_nextcloud__podman_config_dir }}/www/nextcloud/config"
        - "{{ app_nextcloud__podman_data_dir }}"

    - name: 'Write nextcloud config file'
      no_log: true
      ansible.builtin.copy:
        dest: "{{ app_nextcloud__podman_config_dir }}/www/nextcloud/config/config.php"
        owner: "{{ app_nextcloud__uid }}"
        group: "{{ app_nextcloud__gid }}"
        mode: '600'
        content: |
          {{ app_nextcloud__config }}
      when: 'not podman___update_mode | bool'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ app_nextcloud__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[app_nextcloud__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ app_nextcloud__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name:  'Install container'
      containers.podman.podman_container:
        name: "{{ app_nextcloud__container.name }}"
        hostname: "{{ app_nextcloud__container.hostname }}"
        image: "{{ app_nextcloud__container.image }}"
        ip: "{{ app_nextcloud__container.ip }}"
        ip6: "{{ app_nextcloud__container.ipv6 | default(omit) }}"
        network: "{{ app_nextcloud__container.network }}"
        timezone: "{{ app_nextcloud__container.timezone }}"
        env: "{{ app_nextcloud__container.environment | default(omit) }}"
        etc_hosts: "{{ app_nextcloud__container.hosts | default(omit) }}"
        expose: "{{ app_nextcloud__container.expose | default(omit) }}"
        label: "{{ app_nextcloud__container.labels | default(omit) }}"
        publish: "{{ app_nextcloud__container.publish | default(omit) }}"
        secrets: "{{ app_nextcloud__container.secrets | default(omit) }}"
        volume: "{{ app_nextcloud__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_nextcloud__container.requires is defined %}
          Requires={{ app_nextcloud__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ app_nextcloud__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode | bool else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'
