---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/voting-system
#

app_voting_system__ip: "{{ voting_system_ip | mandatory }}"
app_voting_system__ipv6: "{{ voting_system_ipv6 | default('') }}"
app_voting_system__network: "{{ voting_system_network | mandatory }}"
app_voting_system__hostname: "{{ voting_system_hostname | mandatory }}"
app_voting_system__timezone: "{{ voting_system_timezone | mandatory }}"
app_voting_system__labels: "{{ voting_system_labels | default({}) }}"

app_voting_system__version: "{{ voting_system_version | default('latest') }}"

app_voting_system__container: "{{ app_voting_system__podman_container_default | combine(voting_system_container | default({})) }}"

app_voting_system__db_host: "{{ voting_system_db_host | mandatory }}"
app_voting_system__db_pass: "{{ voting_system_db_pass | mandatory }}"

app_voting_system__mail_from: "{{ voting_system_mail_from | mandatory }}"
app_voting_system__url: "{{ voting_system_url | mandatory }}"
app_voting_system__url_short: "{{ voting_system_url | mandatory }}"

#
# Defaults - do not change
#

app_voting_system__podman_name: 'voting-system'
app_voting_system__podman_image: 'c0d3.sh/container/voting-system'
app_voting_system__podman_tag: "{{ app_voting_system__version }}"

app_voting_system__podman_container_default:
  name: "{{ app_voting_system__podman_name }}"
  hostname: "{{ app_voting_system__hostname }}"
  image: "{{ app_voting_system__podman_image }}:{{ app_voting_system__podman_tag }}"
  ip: "{{ app_voting_system__ip }}"
  ipv6: "{{ app_voting_system__ipv6 }}"
  network: "{{ app_voting_system__network }}"
  timezone: "{{ app_voting_system__timezone }}"
  environment:
    DATABASE_SERVER: "{{ voting_system_db_host }}"
    MAIL_FROM: "{{ voting_system_mail_from }}"
    VOTING_URL: "{{ voting_system_url }}"
    VOTING_URL_SHORT: "{{ voting_system_url }}"
  labels: "{{ app_voting_system__labels }}"
  secrets:
    - "voting_system_database_password,type=env,target=DATABASE_PASSWORD"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
