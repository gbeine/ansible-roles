---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-chronograf
#

database_chronograf__home: "{{ chronograf_home | mandatory }}"
database_chronograf__ip: "{{ chronograf_ip | mandatory }}"
database_chronograf__ipv6: "{{ chronograf_ipv6 }}"
database_chronograf__network: "{{ chronograf_network | mandatory }}"
database_chronograf__hostname: "{{ chronograf_hostname | mandatory }}"
database_chronograf__timezone: "{{ chronograf_timezone | mandatory }}"
database_chronograf__labels: "{{ chronograf_labels }}"

database_chronograf__version: "{{ chronograf_version | default('latest') }}"

database_chronograf__container: "{{ database_chronograf__podman_container_default | combine(chronograf_container | default({})) }}"

# The configuration of Chronograf, every option is set with its environment variable
database_chronograf__environment: "{{ database_chronograf__environment_default | combine(chronograf_environment | default({})) }}"

# Secrets with name, data and target, passed in the environment, Chronograf reads no secret from a file
database_chronograf__secrets: "{{ chronograf_secrets | default([]) }}"

database_chronograf__autoupdate_enabled: "{{ chronograf_autoupdate_enabled | default(false) }}"
database_chronograf__autoupdate_schedule: "{{ chronograf_autoupdate_schedule }}"

#
# Defaults - do not change
#

database_chronograf__environment_default:
  TZ: "{{ database_chronograf__timezone }}"

database_chronograf__environment_required: []

database_chronograf__secrets_required: []

# Targets of the secrets in chronograf_secrets, the options of Chronograf carrying passwords, tokens and client secrets
database_chronograf__secrets_allowed:
  - 'AUTH0_CLIENT_SECRET'
  - 'ETCD_PASSWORD'
  - 'GENERIC_CLIENT_SECRET'
  - 'GH_CLIENT_SECRET'
  - 'GOOGLE_CLIENT_SECRET'
  - 'HEROKU_SECRET'
  - 'INFLUXDB_MGMT_TOKEN'
  - 'INFLUXDB_PASSWORD'
  - 'INFLUXDB_TOKEN'
  - 'KAPACITOR_PASSWORD'
  - 'TOKEN_SECRET'

# The secrets must not be set in chronograf_environment
database_chronograf__secret_variables: "{{ database_chronograf__secrets_allowed }}"

# Generated from server/server.go of Chronograf 1.11.7 without the options carrying secrets, update with new versions of the image
database_chronograf__environment_allowed:
  - 'AUTH0_CLIENT_ID'
  - 'AUTH0_DOMAIN'
  - 'AUTH0_ORGS'
  - 'AUTH0_SUPERADMIN_ORG'
  - 'AUTH_DURATION'
  - 'BASE_PATH'
  - 'BASICAUTH_REALM'
  - 'BOLT_PATH'
  - 'CANNED_PATH'
  - 'CUSTOM_AUTO_REFRESH'
  - 'CUSTOM_LINKS'
  - 'DISABLE_GZIP'
  - 'ETCD_CERTIFICATE'
  - 'ETCD_DIAL_TIMEOUT'
  - 'ETCD_ENDPOINTS'
  - 'ETCD_PRIVATE_KEY'
  - 'ETCD_REQUEST_TIMEOUT'
  - 'ETCD_ROOT_CA'
  - 'ETCD_USERNAME'
  - 'GENERIC_API_KEY'
  - 'GENERIC_API_URL'
  - 'GENERIC_AUTH_URL'
  - 'GENERIC_CLIENT_ID'
  - 'GENERIC_DOMAINS'
  - 'GENERIC_INSECURE'
  - 'GENERIC_NAME'
  - 'GENERIC_ROOT_CA'
  - 'GENERIC_SCOPES'
  - 'GENERIC_TOKEN_URL'
  - 'GH_CLIENT_ID'
  - 'GH_ORGS'
  - 'GH_URL'
  - 'GOOGLE_CLIENT_ID'
  - 'GOOGLE_DOMAINS'
  - 'HEROKU_CLIENT_ID'
  - 'HEROKU_ORGS'
  - 'HOST'
  - 'HOST_PAGE_DISABLED'
  - 'HTPASSWD'
  - 'INACTIVITY_DURATION'
  - 'INFLUXDB_ACCOUNT_ID'
  - 'INFLUXDB_CLOUD_DEDICATED_MGMT_URL'
  - 'INFLUXDB_CLUSTERED_ACCOUNT_ID'
  - 'INFLUXDB_CLUSTERED_CLUSTER_ID'
  - 'INFLUXDB_CLUSTER_ID'
  - 'INFLUXDB_DEFAULT_DB'
  - 'INFLUXDB_ORG'
  - 'INFLUXDB_TYPE'
  - 'INFLUXDB_URL'
  - 'INFLUXDB_USERNAME'
  - 'INFLUXDB_V3_SUPPORT_ENABLED'
  - 'INFLUXDB_V3_TIME_CONDITION'
  - 'JWKS_URL'
  - 'KAPACITOR_URL'
  - 'KAPACITOR_USERNAME'
  - 'LOGIN_HINT'
  - 'LOG_LEVEL'
  - 'NONCE_EXPIRATION'
  - 'OAUTH_LOGOUT_ENDPOINT'
  - 'OAUTH_NO_PKCE'
  - 'PORT'
  - 'PPROF_ENABLED'
  - 'PROTOBOARDS_PATH'
  - 'PUBLIC_URL'
  - 'PUB_KEY'
  - 'PUB_KEY_FILE'
  - 'REDIR_AUTH_LOGIN'
  - 'REPORTING_DISABLED'
  - 'RESOURCES_PATH'
  - 'STATUS_FEED_URL'
  - 'TAGS_CSV_PATH'
  - 'TELEGRAF_SYSTEM_INTERVAL'
  - 'TLS_CERTIFICATE'
  - 'TLS_CIPHERS'
  - 'TLS_MAX_VERSION'
  - 'TLS_MIN_VERSION'
  - 'TLS_PRIVATE_KEY'
  - 'USE_ID_TOKEN'
  - 'TZ'

# The OAuth 2.0 providers, a provider is started if one of started is set and needs all of required,
# TOKEN_SECRET without a started provider stops Chronograf. From validateAuth in server/server.go of Chronograf 1.11.7
database_chronograf__oauth_providers:
  - name: 'GitHub'
    started: [ 'GH_CLIENT_ID', 'GH_CLIENT_SECRET' ]
    required: [ 'GH_CLIENT_ID', 'GH_CLIENT_SECRET', 'TOKEN_SECRET' ]
  - name: 'Google'
    started: [ 'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET' ]
    required: [ 'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'PUBLIC_URL', 'TOKEN_SECRET' ]
  - name: 'Heroku'
    started: [ 'HEROKU_CLIENT_ID', 'HEROKU_SECRET' ]
    required: [ 'HEROKU_CLIENT_ID', 'HEROKU_SECRET', 'TOKEN_SECRET' ]
  - name: 'Generic'
    started: [ 'GENERIC_CLIENT_ID', 'GENERIC_CLIENT_SECRET', 'GENERIC_AUTH_URL', 'GENERIC_TOKEN_URL' ]
    required: [ 'GENERIC_CLIENT_ID', 'GENERIC_CLIENT_SECRET', 'GENERIC_AUTH_URL', 'GENERIC_TOKEN_URL', 'TOKEN_SECRET' ]
  - name: 'Auth0'
    started: [ 'AUTH0_CLIENT_ID', 'AUTH0_CLIENT_SECRET' ]
    required: [ 'AUTH0_CLIENT_ID', 'AUTH0_CLIENT_SECRET' ]

# The data directory with the BoltDB database, owned by the user chronograf of the image
database_chronograf__data_dir: "{{ database_chronograf__home }}/data"
database_chronograf__data_owner: 999
database_chronograf__data_group: 999

database_chronograf__podman_name: 'chronograf'
database_chronograf__podman_image: 'docker.io/library/chronograf'
database_chronograf__podman_tag: "{{ database_chronograf__version }}"

database_chronograf__podman_container_default:
  name: "{{ database_chronograf__podman_name }}"
  hostname: "{{ database_chronograf__hostname }}"
  image: "{{ database_chronograf__podman_image }}:{{ database_chronograf__podman_tag }}"
  ip: "{{ database_chronograf__ip }}"
  ipv6: "{{ database_chronograf__ipv6 | default(omit) }}"
  network: "{{ database_chronograf__network }}"
  timezone: "{{ database_chronograf__timezone }}"
  # Set with chronograf_environment, merged over the default
  environment: "{{ database_chronograf__environment }}"
  labels: "{{ database_chronograf__labels | default(omit) }}"
  # Entries without name or target are left out, the validation of the secrets reports them
  secrets: >-
    {{ (database_chronograf__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='name')
        | zip(database_chronograf__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='target'))
        | map('join', ',type=env,target=') | list)
      if (database_chronograf__secrets is sequence and database_chronograf__secrets is not string and database_chronograf__secrets | length > 0)
      else omit }}
  # chronograf_container.volumes replaces the list completely
  volumes:
    - "{{ database_chronograf__data_dir }}:/var/lib/chronograf"
