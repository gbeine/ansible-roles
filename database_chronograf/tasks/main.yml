---

- name: 'Install Chronograf'
  tags: [ 'database', 'database_chronograf' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or chronograf_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - database_chronograf__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - database_chronograf__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_chronograf__invalid | join('. ') }}"
        quiet: true
      vars:
        database_chronograf__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = database_chronograf__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('chronograf_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('chronograf_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of chronograf_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - database_chronograf__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_chronograf__errors | join(' ') }}"
        quiet: true
      vars:
        database_chronograf__environment_missing: >-
          {{ database_chronograf__environment_required
             | reject('in', database_chronograf__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        database_chronograf__secrets_missing: >-
          {{ database_chronograf__secrets_required
             | reject('in', database_chronograf__secrets | selectattr('target', 'defined') | map(attribute='target') | list)
             | list }}
        database_chronograf__secrets_in_environment: >-
          {{ (database_chronograf__secrets | selectattr('target', 'defined') | map(attribute='target') | list + database_chronograf__secret_variables)
             | select('in', database_chronograf__environment.keys() | list) | unique | list }}
        # The options set in chronograf_environment and the targets of chronograf_secrets
        database_chronograf__options_set: >-
          {{ database_chronograf__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list
             + database_chronograf__secrets | selectattr('target', 'defined') | map(attribute='target') | list }}
        database_chronograf__errors: >-
          {%- set errors = [] -%}
          {%- set started = [] -%}
          {%- for provider in database_chronograf__oauth_providers
                if provider.started | select('in', database_chronograf__options_set) | list | length > 0 -%}
          {%-   set _ = started.append(provider.name) -%}
          {%-   set missing = provider.required | reject('in', database_chronograf__options_set) | list -%}
          {%-   if missing | length > 0 -%}
          {%-     set _ = errors.append('The OAuth 2.0 provider ' ~ provider.name ~ ' needs ' ~ (provider.required | join(', ')) ~ ', missing: ' ~ (missing | join(', ')) ~ '.') -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- if 'TOKEN_SECRET' in database_chronograf__options_set and started | length == 0 -%}
          {%-   set _ = errors.append('TOKEN_SECRET needs an OAuth 2.0 provider, Chronograf does not start with it alone.') -%}
          {%- endif -%}
          {%- if database_chronograf__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('Chronograf needs the environment variables ' ~ (database_chronograf__environment_required | join(', ')) ~ ', missing or empty: ' ~ (database_chronograf__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if database_chronograf__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('Chronograf needs the secrets ' ~ (database_chronograf__secrets_required | join(', ')) ~ ', missing: ' ~ (database_chronograf__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if database_chronograf__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets must not be set in chronograf_environment: ' ~ (database_chronograf__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging chronograf_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - database_chronograf__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_chronograf__errors | join(' ') }}"
        quiet: true
      vars:
        # The secrets of the container are omit without secrets
        database_chronograf__container_secrets: >-
          {{ database_chronograf__container.secrets
             if database_chronograf__container.secrets is sequence and database_chronograf__container.secrets is not string
             else [] }}
        database_chronograf__environment_unknown: >-
          {{ (database_chronograf__container.environment | default({})).keys() | reject('in', database_chronograf__environment_allowed) | list }}
        database_chronograf__secrets_unknown: >-
          {{ database_chronograf__container_secrets | map('regex_replace', '^.*,target=([^,]+).*$', '\1') | map('basename')
             | reject('in', database_chronograf__secrets_allowed) | list }}
        database_chronograf__errors: >-
          {%- set errors = [] -%}
          {%- if database_chronograf__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (database_chronograf__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if database_chronograf__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (database_chronograf__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the options of Chronograf (database_chronograf__environment_allowed) and the secrets ' ~ (database_chronograf__secrets_allowed | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create the directories'
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        state: 'directory'
      loop:
        - path: "{{ database_chronograf__home }}"
          owner: 'root'
          group: 'root'
          mode: '0750'
        # Chronograf runs as the user chronograf of the image and keeps its BoltDB database in /var/lib/chronograf
        - path: "{{ database_chronograf__data_dir }}"
          owner: "{{ database_chronograf__data_owner }}"
          group: "{{ database_chronograf__data_group }}"
          mode: '0700'
      loop_control:
        label: "{{ item.path }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ database_chronograf__secrets }}"
      register: 'database_chronograf__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ database_chronograf__container.name }}"
        hostname: "{{ database_chronograf__container.hostname }}"
        image: "{{ database_chronograf__container.image }}"
        ip: "{{ database_chronograf__container.ip }}"
        ip6: "{{ database_chronograf__container.ipv6 | default(omit) }}"
        network: "{{ database_chronograf__container.network }}"
        timezone: "{{ database_chronograf__container.timezone }}"
        command: "{{ database_chronograf__container.command | default(omit) }}"
        env: "{{ database_chronograf__container.environment | default(omit) }}"
        etc_hosts: "{{ database_chronograf__container.etc_hosts | default(omit) }}"
        expose: "{{ database_chronograf__container.expose | default(omit) }}"
        label: "{{ database_chronograf__container.labels | default(omit) }}"
        publish: "{{ database_chronograf__container.publish | default(omit) }}"
        secrets: "{{ database_chronograf__container.secrets | default(omit) }}"
        volume: "{{ database_chronograf__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if database_chronograf__container.requires is defined %}
          Requires={{ database_chronograf__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'database_chronograf__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ database_chronograf__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if database_chronograf__restart | bool else 'started' }}"
        enabled: true
      vars:
        database_chronograf__running: >-
          {{ (ansible_facts.services[database_chronograf__container.name + '.service'].state | default('')) == 'running' }}
        database_chronograf__restart: >-
          {{ database_chronograf__running | bool
             and (database_chronograf__secrets_result is changed
                  or database_chronograf__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'database_chronograf__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ database_chronograf__container.name }}"
        container_image: "{{ database_chronograf__container.image }}"
        container_schedule: "{{ database_chronograf__autoupdate_schedule }}"
