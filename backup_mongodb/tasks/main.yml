---

- name: 'Configure MongoDB backup'
  tags: [ 'backup_mongodb'  ]
  block:

    - name: 'Include OS-specific variables (native)'
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"

    - name: 'Install MongoDB packages'
      ansible.builtin.apt:
        update_cache: 'yes'
        install_recommends: 'no'
        pkg: "{{ backup_mongodb__packages }}"

    - name: 'Copy MongoDB backup scripts to host'
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ backup__lib_dir }}/{{ item }}"
        mode: '755'
      with_items: "{{ backup_mongodb__files }}"

    - name: 'Generate MongoDB backup configuration file'
      ansible.builtin.template:
        src: 'mongodb.j2'
        dest: "{{ backup__etc_dir }}/mongodb"
        owner: 'root'
        group: 'root'
        mode: '640'

    - name: 'Create MongoDB backup directory'
      ansible.builtin.file:
        mode: '750'
        owner: 'root'
        group: 'root'
        path: "{{ backup_mongodb__backup_dir }}"
        state: 'directory'
