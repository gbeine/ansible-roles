---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/joplin
#

app_joplin__ip: "{{ joplin_ip | mandatory }}"
app_joplin__ipv6: "{{ joplin_ipv6 }}"
app_joplin__network: "{{ joplin_network | mandatory }}"
app_joplin__hostname: "{{ joplin_hostname | mandatory }}"
app_joplin__timezone: "{{ joplin_timezone | mandatory }}"
app_joplin__labels: "{{ joplin_labels | default({}) }}"

app_joplin__version: "{{ joplin_version | default('latest') }}"

app_joplin__base_url: "{{ joplin_base_url | mandatory }}"
app_joplin__port: "{{ joplin_port | default(22300) }}"

app_joplin__db_type: 'pg'
app_joplin__db_host: "{{ joplin_db_host | mandatory }}"
app_joplin__db_port: "{{ joplin_db_port | default(5432) }}"
app_joplin__db_user: "{{ joplin_db_user | default('joplin') }}"
app_joplin__db_pass: "{{ joplin_db_pass | mandatory }}"
app_joplin__db_name: "{{ joplin_db_name | default('joplin') }}"

app_joplin__mailer_enabled: "{{ joplin_mailer_enabled | default(false) }}"
app_joplin__mailer_host: "{{ joplin_mailer_host | default('localhost') }}"
app_joplin__mailer_port: "{{ joplin_mailer_port | default(25) }}"
app_joplin__mailer_security: "{{ joplin_mailer_security | default('starttls') }}"
app_joplin__mailer_auth_user: "{{ joplin_mailer_auth_user | default('') }}"
app_joplin__mailer_auth_password: "{{ joplin_mailer_auth_password | default('') }}"
app_joplin__mailer_noreply_name: "{{ joplin_mailer_noreply_name | default('Joplin Server')}}"
app_joplin__mailer_noreply_mail: "{{ joplin_mailer_noreply_mail | default('no-reply') }}"

app_joplin__container: "{{ app_joplin__container_default | combine(joplin_container | default({})) }}"

#
# Defaults - do not change
#

app_joplin__podman_name: 'joplin'
app_joplin__podman_image: 'docker.io/joplin/server'
app_joplin__podman_tag: "{{ app_joplin__version }}"

app_joplin__container_default:
  name: "{{ app_joplin__podman_name }}"
  hostname: "{{ app_joplin__hostname }}"
  image: "{{ app_joplin__podman_image }}:{{ app_joplin__version }}"
  ip: "{{ app_joplin__ip }}"
  ipv6: "{{ app_joplin__ipv6 }}"
  network: "{{ app_joplin__network }}"
  timezone: "{{ app_joplin__timezone }}"
  environment:
    APP_BASE_URL: "{{ app_joplin__base_url }}"
    APP_PORT: "{{ app_joplin__port }}"
    DB_CLIENT: "{{ app_joplin__db_type }}"
    POSTGRES_DATABASE: "{{ app_joplin__db_name }}"
    POSTGRES_USER: "{{ app_joplin__db_user }}"
    POSTGRES_PORT: "{{ app_joplin__db_port }}"
    POSTGRES_HOST: "{{ app_joplin__db_host }}"
    MAILER_ENABLED: "{{ app_joplin__mailer_enabled | ternary(1,0) }}"
    MAILER_HOST: "{{ app_joplin__mailer_host }}"
    MAILER_PORT: "{{ app_joplin__mailer_port }}"
    MAILER_SECURITY: "{{ app_joplin__mailer_security }}"
    MAILER_AUTH_USER: "{{ app_joplin__mailer_auth_user }}"
    MAILER_NOREPLY_NAME: "{{ app_joplin__mailer_noreply_name }}"
    MAILER_NOREPLY_EMAIL: "{{ app_joplin__mailer_noreply_mail }}"
  labels: "{{ app_joplin__labels }}"
  secrets:
    - "joplin_database_password,type=env,target=POSTGRES_PASSWORD"
    - "joplin_smtp_password,type=env,target=MAILER_AUTH_PASSWORD"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
