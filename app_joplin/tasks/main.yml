---

- name: 'Deploy Joplin Server'
  tags: [ 'app', 'app_joplin' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or joplin_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - app_joplin__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - app_joplin__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_joplin__invalid | join('. ') }}"
        quiet: true
      vars:
        app_joplin__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = app_joplin__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('joplin_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('joplin_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of joplin_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    # pg needs the host and the password of the database or a connection string
    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - app_joplin__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_joplin__errors | join(' ') }}"
        quiet: true
      vars:
        app_joplin__set: "{{ app_joplin__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list }}"
        app_joplin__environment_missing: "{{ app_joplin__environment_required | reject('in', app_joplin__set) | list }}"
        app_joplin__database: "{{ app_joplin__environment.DB_CLIENT | default('', true) | string }}"
        app_joplin__targets: "{{ app_joplin__secrets | map(attribute='target') | list }}"
        app_joplin__secrets_in_environment: >-
          {{ (app_joplin__targets + app_joplin__secret_variables) | select('in', app_joplin__environment.keys() | list) | unique | list }}
        app_joplin__secrets_lines: >-
          {{ app_joplin__secrets | selectattr('data', 'string') | selectattr('data', 'search', '[\r\n]') | map(attribute='name') | list }}
        app_joplin__errors: >-
          {%- set errors = [] -%}
          {%- if app_joplin__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('Joplin Server needs the environment variables ' ~ (app_joplin__environment_required | join(', ')) ~ ', missing or empty: ' ~ (app_joplin__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_joplin__database not in app_joplin__database_clients -%}
          {%-   set _ = errors.append('DB_CLIENT has to be one of ' ~ (app_joplin__database_clients | join(', ')) ~ ', got ' ~ app_joplin__database ~ '.') -%}
          {%- elif app_joplin__database == 'pg' and 'POSTGRES_CONNECTION_STRING' not in app_joplin__targets
                   and ('POSTGRES_HOST' not in app_joplin__set or 'POSTGRES_PASSWORD' not in app_joplin__targets) -%}
          {%-   set _ = errors.append('DB_CLIENT pg needs POSTGRES_HOST and the secret POSTGRES_PASSWORD or the secret POSTGRES_CONNECTION_STRING.') -%}
          {%- endif -%}
          {%- if app_joplin__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets must not be set in joplin_environment: ' ~ (app_joplin__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_joplin__secrets_lines | length > 0 -%}
          {%-   set _ = errors.append('Secrets must not contain line breaks: ' ~ (app_joplin__secrets_lines | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the values of the environment'
      ansible.builtin.assert:
        that:
          - app_joplin__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_joplin__errors | join(' ') }}"
        quiet: true
      vars:
        app_joplin__errors: >-
          {%- set errors = [] -%}
          {%- set ns = namespace(booleans=[], lines=[]) -%}
          {%- for key, value in app_joplin__environment.items() if value is not none -%}
          {%-   if key in app_joplin__environment_booleans and value is not boolean and (value | string | lower) not in [ 'true', 'false' ] -%}
          {%-     set ns.booleans = ns.booleans + [ key ] -%}
          {%-   elif value is string and (value ~ '.').splitlines() | length > 1 -%}
          {%-     set ns.lines = ns.lines + [ key ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- if ns.booleans | length > 0 -%}
          {%-   set _ = errors.append('These variables are booleans, allowed are true and false: ' ~ (ns.booleans | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.lines | length > 0 -%}
          {%-   set _ = errors.append('Values must not contain line breaks: ' ~ (ns.lines | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the administrator'
      ansible.builtin.assert:
        that:
          - app_joplin__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_joplin__errors | join(' ') }}"
        quiet: true
      vars:
        app_joplin__errors: >-
          {%- set errors = [] -%}
          {%- set admin = app_joplin__admin -%}
          {%- if admin is not mapping -%}
          {%-   set _ = errors.append('joplin_admin has to be a dictionary with email, password and optionally full_name.') -%}
          {%- else -%}
          {%-   set unknown = admin.keys() | reject('in', app_joplin__admin_keys) | list -%}
          {%-   if unknown | length > 0 -%}
          {%-     set _ = errors.append('Unknown keys in joplin_admin: ' ~ (unknown | join(', ')) ~ ', allowed are ' ~ (app_joplin__admin_keys | join(', ')) ~ '.') -%}
          {%-   endif -%}
          {%-   if (admin.email | default('') | string) is not match(app_joplin__admin_email_pattern) -%}
          {%-     set _ = errors.append('joplin_admin needs a valid email.') -%}
          {%-   elif (admin.email | string) == app_joplin__default_admin_email -%}
          {%-     set _ = errors.append('joplin_admin needs another email than ' ~ app_joplin__default_admin_email ~ '.') -%}
          {%-   endif -%}
          {%-   if admin.password is not defined or admin.password is none -%}
          {%-     set _ = errors.append('joplin_admin needs a password.') -%}
          {%-   elif (admin.password | string | length) < app_joplin__password_length -%}
          {%-     set _ = errors.append('The password of joplin_admin needs at least ' ~ app_joplin__password_length ~ ' characters.') -%}
          {%-   endif -%}
          {%-   if admin.full_name is defined and admin.full_name is not none and ((admin.full_name | string) ~ '.').splitlines() | length > 1 -%}
          {%-     set _ = errors.append('The full_name of joplin_admin must not contain line breaks.') -%}
          {%-   endif -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging joplin_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - app_joplin__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_joplin__errors | join(' ') }}"
        quiet: true
      vars:
        # The secrets of the container are omit without joplin_secrets
        app_joplin__container_secrets: >-
          {{ app_joplin__container.secrets
             if (app_joplin__container.secrets is defined and app_joplin__container.secrets is sequence and app_joplin__container.secrets is not string)
             else [] }}
        app_joplin__environment_unknown: >-
          {{ (app_joplin__container.environment | default({})).keys() | reject('in', app_joplin__environment_allowed) | list }}
        app_joplin__secrets_unknown: >-
          {{ app_joplin__container_secrets | map('regex_replace', '^.*,target=([^,]+).*$', '\1') | map('basename')
             | reject('in', app_joplin__secrets_allowed) | list }}
        app_joplin__errors: >-
          {%- set errors = [] -%}
          {%- if app_joplin__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (app_joplin__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_joplin__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (app_joplin__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the variables of Joplin Server (app_joplin__environment_allowed) and the secrets ' ~ (app_joplin__secrets_allowed | join(', '))
                                    ~ ', the administrator is set with joplin_admin.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create the directory of Joplin Server'
      ansible.builtin.file:
        path: "{{ app_joplin__home }}"
        mode: '0755'
        state: 'directory'

    # The image runs Joplin Server as the user joplin, the sqlite database lives in data
    - name: 'Create the data directory of Joplin Server'
      ansible.builtin.file:
        path: "{{ app_joplin__home }}/data"
        owner: "{{ app_joplin__uid }}"
        group: "{{ app_joplin__uid }}"
        mode: '0700'
        state: 'directory'

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ app_joplin__secrets }}"
      register: 'app_joplin__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_joplin__container.name }}"
        hostname: "{{ app_joplin__container.hostname }}"
        image: "{{ app_joplin__container.image }}"
        ip: "{{ app_joplin__container.ip }}"
        ip6: "{{ app_joplin__container.ipv6 | default(omit) }}"
        network: "{{ app_joplin__container.network }}"
        timezone: "{{ app_joplin__container.timezone }}"
        command: "{{ app_joplin__container.command | default(omit) }}"
        env: "{{ app_joplin__container.environment | default(omit) }}"
        etc_hosts: "{{ app_joplin__container.etc_hosts | default(omit) }}"
        expose: "{{ app_joplin__container.expose | default(omit) }}"
        label: "{{ app_joplin__container.labels | default(omit) }}"
        publish: "{{ app_joplin__container.publish | default(omit) }}"
        secrets: "{{ app_joplin__container.secrets | default(omit) }}"
        volume: "{{ app_joplin__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_joplin__container.requires is defined %}
          Requires={{ app_joplin__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'app_joplin__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ app_joplin__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if app_joplin__restart | bool else 'started' }}"
        enabled: true
      vars:
        app_joplin__running: >-
          {{ (ansible_facts.services[app_joplin__container.name + '.service'].state | default('')) == 'running' }}
        app_joplin__restart: >-
          {{ app_joplin__running | bool
             and (app_joplin__secrets_result is changed or app_joplin__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    # Joplin Server migrates the database before it listens, the first start takes a while
    - name: 'Wait for Joplin Server'
      ansible.builtin.uri:
        url: "http://{{ app_joplin__ip }}:{{ app_joplin__port }}/api/ping"
      register: 'app_joplin__ready'
      until: app_joplin__ready.status | default(-1) == 200
      retries: 90
      delay: 2
      failed_when: false
      when: 'not ansible_check_mode'

    - name: 'Read the log of Joplin Server'
      when:
        - not ansible_check_mode
        - app_joplin__ready.status | default(-1) != 200
      ansible.builtin.command:
        argv: [ 'journalctl', '-u', "{{ app_joplin__container.name }}", '-n', '50', '--no-pager' ]
      register: 'app_joplin__journal'
      changed_when: false

    - name: 'Assert that Joplin Server answers'
      when: 'not ansible_check_mode'
      ansible.builtin.assert:
        that:
          - app_joplin__journal is skipped
        fail_msg: "{{ app_joplin__journal.stdout_lines | default([]) }}"
        quiet: true

    # The password is an option with no_log, it is passed to node in the container on stdin
    - name: 'Create the administrator'
      when: 'not ansible_check_mode'
      app_joplin_admin:
        container: "{{ app_joplin__container.name }}"
        email: "{{ app_joplin__admin.email | string }}"
        password: "{{ app_joplin__admin.password | string }}"
        full_name: "{{ app_joplin__admin.full_name | default(omit, true) }}"
        default_email: "{{ app_joplin__default_admin_email }}"
      register: 'app_joplin__admin_result'

    - name: 'Enable autoupdate on container'
      when: 'app_joplin__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_joplin__container.name }}"
        container_image: "{{ app_joplin__container.image }}"
        container_schedule: "{{ app_joplin__autoupdate_schedule }}"
