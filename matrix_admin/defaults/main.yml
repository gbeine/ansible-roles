---

#
# Substitutes - do not change
#

matrix_admin__ip: "{{ matrix_admin_ip | mandatory }}"
matrix_admin__ipv6: "{{ matrix_admin_ipv6 }}"
matrix_admin__network: "{{ matrix_admin_network | mandatory }}"
matrix_admin__hostname: "{{ matrix_admin_hostname | mandatory }}"
matrix_admin__timezone: "{{ matrix_admin_timezone | mandatory }}"
matrix_admin__labels: "{{ matrix_admin_labels | default({}) }}"

matrix_admin__version: "{{ matrix_admin_version | default('latest') }}"

matrix_admin__base_path: "{{ matrix_admin_base_path | default('/synapse-admin') }}"

matrix_admin__container: "{{ matrix_admin__container_default | combine(matrix_admin_container | default({})) }}"

matrix_admin__autoupdate_enabled: "{{ matrix_admin_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

matrix_admin__port: 80

matrix_admin__podman_name: 'matrix-admin'
matrix_admin__podman_image: 'docker.io/awesometechnologies/synapse-admin'
matrix_admin__podman_tag: "{{ matrix_admin__version }}"

matrix_admin__container_default:
  name: "{{ matrix_admin__podman_name }}"
  hostname: "{{ matrix_admin__hostname }}"
  image: "{{ matrix_admin__podman_image }}:{{ matrix_admin__podman_tag }}"
  ip: "{{ matrix_admin__ip }}"
  ipv6: "{{ matrix_admin__ipv6 }}"
  network: "{{ matrix_admin__network }}"
  timezone: "{{ matrix_admin__timezone }}"
  environment:
    TZ: "{{ matrix_admin__timezone }}"
  labels: "{{ matrix_admin__labels }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
