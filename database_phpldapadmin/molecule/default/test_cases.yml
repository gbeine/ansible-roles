---
# Network created by container_podman in prepare.yml
database_phpldapadmin__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

database_phpldapadmin__test_image: 'docker.io/phpldapadmin/phpldapadmin:2.3.13'
database_phpldapadmin__test_quadlet_path: '/etc/containers/systemd/phpldapadmin.container'

# slapd of Debian on the VM, the container reaches it through the gateway of the network
database_phpldapadmin__test_ldap_host: '10.89.0.1'
database_phpldapadmin__test_domain: 'molecule.test'
database_phpldapadmin__test_base_dn: 'dc=molecule,dc=test'
database_phpldapadmin__test_admin_dn: 'cn=admin,dc=molecule,dc=test'
database_phpldapadmin__test_admin_password: 'molecule-ldap-admin'
# The user of the login test, created by prepare
database_phpldapadmin__test_user: 'molecule'
database_phpldapadmin__test_user_password: 'molecule-user-password'

database_phpldapadmin__test_cases:

  # Only the mandatory variables: the LDAP server and the key of Laravel
  - name: 'molecule-phpldapadmin-default'
    role_vars:
      phpldapadmin_ip: '10.89.0.105'
      phpldapadmin_network: 'podman-molecule'
      phpldapadmin_hostname: 'phpldapadmin-default'
      phpldapadmin_timezone: 'Europe/Berlin'
      phpldapadmin_version: '2.3.13'
      phpldapadmin_environment:
        LDAP_HOST: '10.89.0.1'
        LDAP_BASE_DN: 'dc=molecule,dc=test'
      phpldapadmin_secrets:
        - name: 'phpldapadmin_app_key'
          data: 'base64:ygnJBHtgZmDOBs5BtfZX5CPwAyRIucqlLON3kFMRYds='
          target: 'APP_KEY'
    expect:
      ip: '10.89.0.105'
      ip6: ~
      secrets: [ 'base64:ygnJBHtgZmDOBs5BtfZX5CPwAyRIucqlLON3kFMRYds=' ]
      quadlet:
        - 'Environment=APP_TIMEZONE=Europe/Berlin'
        - 'Environment=LDAP_HOST=10.89.0.1'
        - 'Secret=phpldapadmin_app_key,type=env,target=APP_KEY'
      name: 'LDAP Server'
      login: false

  # IPv6, labels, the name of the server, the user for the search with its password and the lifetime of the session
  - name: 'molecule-phpldapadmin'
    role_vars:
      phpldapadmin_ip: '10.89.0.106'
      phpldapadmin_ipv6: 'fd00:89::106'
      phpldapadmin_network: 'podman-molecule'
      phpldapadmin_hostname: 'phpldapadmin-molecule'
      phpldapadmin_timezone: 'Europe/Berlin'
      phpldapadmin_version: '2.3.13'
      phpldapadmin_labels:
        traefik.enable: 'false'
      phpldapadmin_environment:
        LDAP_HOST: '10.89.0.1'
        LDAP_BASE_DN: 'dc=molecule,dc=test'
        LDAP_NAME: 'Molecule LDAP'
        LDAP_USERNAME: 'cn=admin,dc=molecule,dc=test'
        SESSION_LIFETIME: '60'
      phpldapadmin_secrets:
        - name: 'phpldapadmin_app_key'
          data: 'base64:u58HdqgmIowYCZI1msWvEZyT9Bu6f7Oc01HsBrNv7ic='
          target: 'APP_KEY'
        - name: 'phpldapadmin_ldap_password'
          data: 'molecule-ldap-admin'
          target: 'LDAP_PASSWORD'
    # A valid change of the side effect, the quadlet unit changes and phpLDAPadmin has to restart
    side_effect:
      phpldapadmin_environment:
        SESSION_LIFETIME: '30'
    expect:
      ip: '10.89.0.106'
      ip6: 'fd00:89::106'
      secrets: [ 'base64:u58HdqgmIowYCZI1msWvEZyT9Bu6f7Oc01HsBrNv7ic=', 'molecule-ldap-admin' ]
      quadlet:
        - 'Environment=APP_TIMEZONE=Europe/Berlin'
        - 'Environment=LDAP_NAME=Molecule LDAP'
        - 'Environment=SESSION_LIFETIME=30'
        - 'Secret=phpldapadmin_app_key,type=env,target=APP_KEY'
        - 'Secret=phpldapadmin_ldap_password,type=env,target=LDAP_PASSWORD'
        - 'Label=traefik.enable=false'
      name: 'Molecule LDAP'
      login: true
