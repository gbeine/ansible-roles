---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-phpldapadmin
#

database_phpldapadmin__ip: "{{ phpldapadmin_ip | mandatory }}"
database_phpldapadmin__ipv6: "{{ phpldapadmin_ipv6 }}"
database_phpldapadmin__network: "{{ phpldapadmin_network | mandatory }}"
database_phpldapadmin__hostname: "{{ phpldapadmin_hostname | mandatory }}"
database_phpldapadmin__timezone: "{{ phpldapadmin_timezone | mandatory }}"
database_phpldapadmin__labels: "{{ phpldapadmin_labels }}"

database_phpldapadmin__version: "{{ phpldapadmin_version | default('latest') }}"

database_phpldapadmin__container: "{{ database_phpldapadmin__podman_container_default | combine(phpldapadmin_container | default({})) }}"

# The configuration of phpLDAPadmin (config/*.php), LDAP_HOST is mandatory
database_phpldapadmin__environment: "{{ database_phpldapadmin__environment_default | combine(phpldapadmin_environment | default({})) }}"

# Secrets with name, data and target, APP_KEY is mandatory, passed in the environment
database_phpldapadmin__secrets: "{{ phpldapadmin_secrets | default([]) }}"

database_phpldapadmin__autoupdate_enabled: "{{ phpldapadmin_autoupdate_enabled | default(false) }}"
database_phpldapadmin__autoupdate_schedule: "{{ phpldapadmin_autoupdate_schedule }}"

#
# Defaults - do not change
#

# Laravel reads its time zone from APP_TIMEZONE (config/app.php), without it the time zone is UTC
database_phpldapadmin__environment_default:
  APP_TIMEZONE: "{{ database_phpldapadmin__timezone }}"

# Without LDAP_HOST phpLDAPadmin connects to 127.0.0.1 in the container
database_phpldapadmin__environment_required: [ 'LDAP_HOST' ]

# The secrets passed in the environment, Laravel reads its configuration only from the environment and .env of the image
# (config/*.php of phpLDAPadmin 2.3.13), there are no file variables
database_phpldapadmin__secrets_allowed: [ 'APP_KEY', 'LDAP_PASSWORD', 'MEMCACHED_PASSWORD', 'AWS_SECRET_ACCESS_KEY' ]
database_phpldapadmin__secret_variables: "{{ database_phpldapadmin__secrets_allowed }}"

# The key of Laravel encrypts the sessions and the password of the login, without it the image generates a new one for every container
database_phpldapadmin__secrets_required: [ 'APP_KEY' ]

# The format of php artisan key:generate, 32 bytes in base64
database_phpldapadmin__app_key_pattern: '^base64:[A-Za-z0-9+/]{43}=$'

# The port of FrankenPHP in the container (SERVER_NAME of the image)
database_phpldapadmin__port: 8080

# Generated from the env() calls of config/*.php of phpLDAPadmin 2.3.13 without the secrets,
# SERVER_NAME and the variables of /sbin/init-docker are set by the image, update with new versions of the image
database_phpldapadmin__environment_allowed:
  - 'APP_DEBUG'
  - 'APP_ENV'
  - 'APP_FAKER_LOCALE'
  - 'APP_FALLBACK_LOCALE'
  - 'APP_LOCALE'
  - 'APP_MAINTENANCE_DRIVER'
  - 'APP_MAINTENANCE_STORE'
  - 'APP_NAME'
  - 'APP_PREVIOUS_KEYS'
  - 'APP_TIMEZONE'
  - 'APP_TRUST_PROXIES'
  - 'AUTH_GUARD'
  - 'AUTH_MODEL'
  - 'AUTH_PASSWORD_BROKER'
  - 'AUTH_PASSWORD_RESET_TOKEN_TABLE'
  - 'AUTH_PASSWORD_TIMEOUT'
  - 'AWS_ACCESS_KEY_ID'
  - 'AWS_DEFAULT_REGION'
  - 'CACHE_DRIVER'
  - 'CACHE_PREFIX'
  - 'CACHE_STORE'
  - 'DB_CACHE_CONNECTION'
  - 'DB_CACHE_LOCK_CONNECTION'
  - 'DB_CACHE_LOCK_TABLE'
  - 'DB_CACHE_TABLE'
  - 'DYNAMODB_CACHE_TABLE'
  - 'DYNAMODB_ENDPOINT'
  - 'LDAP_ALERT_ROOTDN'
  - 'LDAP_ALLOW_GUEST'
  - 'LDAP_ATTRTAG_BINARY_ONLY'
  - 'LDAP_BASE_DN'
  - 'LDAP_CACHE'
  - 'LDAP_CACHE_TIME'
  - 'LDAP_CONNECTION'
  - 'LDAP_FORCE_MANAGED'
  - 'LDAP_GUIDKEY'
  - 'LDAP_HOST'
  - 'LDAP_LIMIT_VALUES'
  - 'LDAP_LOGGING'
  - 'LDAP_LOGIN_ATTR'
  - 'LDAP_LOGIN_ATTR_DESC'
  - 'LDAP_LOGIN_OBJECTCLASS'
  - 'LDAP_NAME'
  - 'LDAP_PASSWORD_ENC'
  - 'LDAP_PORT'
  - 'LDAP_SASL'
  - 'LDAP_SSL'
  - 'LDAP_TEMPLATE_DIR'
  - 'LDAP_TEMPLATE_DRIVER'
  - 'LDAP_TEMPLATE_EXCLUDE_SYSTEM'
  - 'LDAP_TEMPLATE_GIDNUMBER_START'
  - 'LDAP_TEMPLATE_UIDNUMBER_START'
  - 'LDAP_TIMEOUT'
  - 'LDAP_TLS'
  - 'LDAP_UPDATE_ENABLED'
  - 'LDAP_UPDATE_PROXY'
  - 'LDAP_USERNAME'
  - 'LOG_CHANNEL'
  - 'LOG_DAILY_DAYS'
  - 'LOG_DEPRECATIONS_CHANNEL'
  - 'LOG_DEPRECATIONS_TRACE'
  - 'LOG_LEVEL'
  - 'LOG_PAPERTRAIL_HANDLER'
  - 'LOG_SLACK_EMOJI'
  - 'LOG_SLACK_USERNAME'
  - 'LOG_SLACK_WEBHOOK_URL'
  - 'LOG_STACK'
  - 'LOG_STDERR_FORMATTER'
  - 'LOG_SYSLOG_FACILITY'
  - 'MEMCACHED_HOST'
  - 'MEMCACHED_PERSISTENT_ID'
  - 'MEMCACHED_PORT'
  - 'MEMCACHED_USERNAME'
  - 'PAPERTRAIL_PORT'
  - 'PAPERTRAIL_URL'
  - 'REDIS_CACHE_CONNECTION'
  - 'REDIS_CACHE_LOCK_CONNECTION'
  - 'SESSION_CONNECTION'
  - 'SESSION_DOMAIN'
  - 'SESSION_DRIVER'
  - 'SESSION_ENCRYPT'
  - 'SESSION_EXPIRE_ON_CLOSE'
  - 'SESSION_HTTP_ONLY'
  - 'SESSION_LIFETIME'
  - 'SESSION_PARTITIONED_COOKIE'
  - 'SESSION_PATH'
  - 'SESSION_SAME_SITE'
  - 'SESSION_SECURE_COOKIE'
  - 'SESSION_STORE'
  - 'SESSION_TABLE'

database_phpldapadmin__podman_name: 'phpldapadmin'
database_phpldapadmin__podman_image: 'docker.io/phpldapadmin/phpldapadmin'
database_phpldapadmin__podman_tag: "{{ database_phpldapadmin__version }}"

database_phpldapadmin__podman_container_default:
  name: "{{ database_phpldapadmin__podman_name }}"
  hostname: "{{ database_phpldapadmin__hostname }}"
  image: "{{ database_phpldapadmin__podman_image }}:{{ database_phpldapadmin__podman_tag }}"
  ip: "{{ database_phpldapadmin__ip }}"
  ipv6: "{{ database_phpldapadmin__ipv6 | default(omit) }}"
  network: "{{ database_phpldapadmin__network }}"
  timezone: "{{ database_phpldapadmin__timezone }}"
  labels: "{{ database_phpldapadmin__labels | default(omit) }}"
  # Set with phpldapadmin_environment, merged over the default
  environment: "{{ database_phpldapadmin__environment }}"
  # phpLDAPadmin reads the secrets only from the environment,
  # entries without name or target are left out, the validation of the secrets reports them
  secrets: >-
    {{ (database_phpldapadmin__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='name')
        | zip(database_phpldapadmin__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='target'))
        | map('join', ',type=env,target=') | list)
      if (database_phpldapadmin__secrets is sequence and database_phpldapadmin__secrets is not string and database_phpldapadmin__secrets | length > 0)
      else omit }}
