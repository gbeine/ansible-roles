---
# Network created by container_podman in prepare.yml
app_collabora__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_collabora__test_image: 'docker.io/collabora/code:latest'
app_collabora__test_quadlet_path: '/etc/containers/systemd/collabora.container'

app_collabora__test_cases:

  # Only the mandatory variables, Collabora serves HTTP for a reverse proxy terminating TLS
  - name: 'molecule-collabora-default'
    role_vars:
      collabora_ip: '10.89.0.50'
      collabora_network: 'podman-molecule'
      collabora_hostname: 'collabora-default'
      collabora_timezone: 'Europe/Berlin'
      collabora_secrets:
        - name: 'collabora_password'
          data: 'molecule-password'
          target: 'password'
    expect:
      ip: '10.89.0.50'
      ip6: ~
      url: 'http://10.89.0.50:9980'
      username: 'admin'
      password: 'molecule-password'
      secrets:
        - 'collabora_password,type=env,target=password'
      env:
        - 'TZ=Europe/Berlin'
        - 'username=admin'
        - 'extra_params=--o:ssl.enable=false --o:ssl.termination=true'

  # IPv6, an own admin user, aliasgroup1 and an empty extra_params,
  # Collabora serves HTTPS with the self-signed certificate of the image
  - name: 'molecule-collabora'
    role_vars:
      collabora_ip: '10.89.0.51'
      collabora_ipv6: 'fd00:89::51'
      collabora_network: 'podman-molecule'
      collabora_hostname: 'collabora-molecule'
      collabora_timezone: 'Europe/Berlin'
      # Merged over the default, TZ is kept
      collabora_environment:
        username: 'molecule'
        aliasgroup1: 'https://nextcloud.example.org:443'
        extra_params: ''
      collabora_secrets:
        - name: 'collabora_molecule_password'
          data: 'molecule-password'
          target: 'password'
    # side_effect changes the password, the secret changes and Collabora has to restart
    side_effect:
      role_vars:
        collabora_secrets:
          - name: 'collabora_molecule_password'
            data: 'molecule-password-changed'
            target: 'password'
    expect:
      ip: '10.89.0.51'
      ip6: 'fd00:89::51'
      url: 'https://10.89.0.51:9980'
      username: 'molecule'
      password: 'molecule-password-changed'
      secrets:
        - 'collabora_molecule_password,type=env,target=password'
      env:
        - 'TZ=Europe/Berlin'
        - 'username=molecule'
        - 'aliasgroup1=https://nextcloud.example.org:443'
        - 'extra_params='
