---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/collabora
#

app_collabora__ip: "{{ collabora_ip | mandatory }}"
app_collabora__ipv6: "{{ collabora_ipv6 }}"
app_collabora__network: "{{ collabora_network | mandatory }}"
app_collabora__hostname: "{{ collabora_hostname | mandatory }}"
app_collabora__timezone: "{{ collabora_timezone | mandatory }}"
app_collabora__labels: "{{ collabora_labels | default({}) }}"

app_collabora__version: "{{ collabora_version | default('latest') }}"

app_collabora__container: "{{ app_collabora__container_default | combine(collabora_container | default({})) }}"

app_collabora__password: "{{ collabora_password | mandatory }}"

app_collabora__autoupdate_enabled: "{{ collabora_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

app_collabora__podman_name: 'collabora'
app_collabora__podman_image: 'docker.io/collabora/code'
app_collabora__podman_tag: "{{ app_collabora__version }}"

app_collabora__container_default:
  name: "{{ app_collabora__podman_name }}"
  hostname: "{{ app_collabora__hostname }}"
  image: "{{ app_collabora__podman_image }}:{{ app_collabora__podman_tag }}"
  ip: "{{ app_collabora__ip }}"
  ipv6: "{{ app_collabora__ipv6 | default(omit) }}"
  network: "{{ app_collabora__network }}"
  timezone: "{{ app_collabora__timezone }}"
  labels: "{{ app_collabora__labels }}"
  secrets:
    - "collabora_password,type=env,target=password"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'

