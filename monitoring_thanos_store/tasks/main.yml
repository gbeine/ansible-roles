---

- name: 'Install Thanos Store'
  tags: [ 'monitoring', 'monitoring_thanos_store' ]
  block:

    # A failing template in the variables (e.g. an unknown filter, thanos_store_container not a dictionary
    # or a missing thanos_store_objstore) stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - monitoring_thanos_store__container | length > 0
          - (monitoring_thanos_store__objstore | to_json | length) + (monitoring_thanos_store__secrets | to_json | length) > 0
          # thanos_store_environment has no default, a failing template stops the role here as well
          - monitoring_thanos_store__environment | default({}) | length >= 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_store__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_thanos_store__invalid | join('. ') }}"
        quiet: true
      vars:
        monitoring_thanos_store__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = monitoring_thanos_store__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('`thanos_store_secrets` has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('`thanos_store_secrets` entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of `thanos_store_secrets` have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the object storage'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_store__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_thanos_store__errors | join(' ') }}"
        quiet: true
      vars:
        # Fields carrying secrets with a value, null and an empty string are allowed,
        # the lookahead also rejects white space, otherwise \s* would backtrack in front of the value
        monitoring_thanos_store__plain_secrets: >-
          {{ monitoring_thanos_store__objstore | to_json
             | regex_findall('"(' ~ (monitoring_thanos_store__objstore_secret_keys | join('|')) ~ ')"\s*:\s*(?![\s]|null|"")')
             | unique | list }}
        monitoring_thanos_store__errors: >-
          {%- set errors = [] -%}
          {%- set objstore = monitoring_thanos_store__objstore -%}
          {%- if objstore is not mapping -%}
          {%-   set _ = errors.append('`thanos_store_objstore` has to be a dictionary.') -%}
          {%- else -%}
          {%-   set unknown = objstore.keys() | map('string') | reject('in', monitoring_thanos_store__objstore_allowed) | list -%}
          {%-   if unknown | length > 0 -%}
          {%-     set _ = errors.append('Unknown keys in `thanos_store_objstore`: ' ~ (unknown | join(', ')) ~ ', allowed are '
                                      ~ (monitoring_thanos_store__objstore_allowed | join(', ')) ~ '.') -%}
          {%-   endif -%}
          {%-   if objstore.type | default('') not in monitoring_thanos_store__objstore_types -%}
          {%-     set _ = errors.append('`thanos_store_objstore.type` has to be one of ' ~ (monitoring_thanos_store__objstore_types | join(', ')) ~ '.') -%}
          {%-   endif -%}
          {%-   if objstore.config is defined and objstore.config is not mapping -%}
          {%-     set _ = errors.append('`thanos_store_objstore.config` has to be a dictionary.') -%}
          {%-   endif -%}
          {%-   if monitoring_thanos_store__plain_secrets | length > 0 -%}
          {%-     set _ = errors.append('These fields carry secrets, they are set with `thanos_store_secrets`, not in `thanos_store_objstore`: '
                                      ~ (monitoring_thanos_store__plain_secrets | join(', ')) ~ '.') -%}
          {%-   endif -%}
          {%- endif -%}
          {{ errors }}

    # The role writes the references of the secrets into the dictionaries of the paths,
    # a list or a value on the path would be replaced by the references,
    # the references are double-quoted in bucket.yml, " and \ would end the string or start an escape sequence
    - name: 'Validate the targets of the secrets'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_store__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_thanos_store__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_thanos_store__targets: "{{ monitoring_thanos_store__secrets | map(attribute='target') | map('string') | list }}"
        monitoring_thanos_store__unknown: >-
          {{ monitoring_thanos_store__targets
             | reject('in', monitoring_thanos_store__secrets_valid | map(attribute='path') | map('join', '.') | list) | list }}
        monitoring_thanos_store__errors: >-
          {%- set errors = [] -%}
          {%- set ns = namespace(set=[], paths=[]) -%}
          {%- for secret in monitoring_thanos_store__secrets_valid -%}
          {%-   set node = namespace(value=monitoring_thanos_store__objstore, broken=false) -%}
          {%-   for key in secret.path -%}
          {%-     if not node.broken and node.value is not none -%}
          {%-       if node.value is not mapping -%}
          {%-         set node.broken = true -%}
          {%-       else -%}
          {%-         set node.value = node.value[key] | default(none) -%}
          {%-       endif -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%-   if node.broken -%}
          {%-     set ns.paths = ns.paths + [ secret.path | join('.') ] -%}
          {%-   elif node.value is not none -%}
          {%-     set ns.set = ns.set + [ secret.path | join('.') ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- set duplicates = monitoring_thanos_store__targets | community.general.counter | dict2items
                               | selectattr('value', 'gt', 1) | map(attribute='key') | list -%}
          {%- set data = monitoring_thanos_store__secrets | rejectattr('data', 'string') | map(attribute='name') | list
                         + monitoring_thanos_store__secrets | selectattr('data', 'string') | selectattr('data', 'search', '^$|[\r\n"\\\\]')
                           | map(attribute='name') | list -%}
          {%- if monitoring_thanos_store__unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (monitoring_thanos_store__unknown | join(', '))
                                    ~ ', the targets are paths of options of `thanos_store_objstore` ending in '
                                    ~ (monitoring_thanos_store__objstore_secret_keys | join(', ')) ~ ', e.g. config.secret_key.') -%}
          {%- endif -%}
          {%- if duplicates | length > 0 -%}
          {%-   set _ = errors.append('Every target of `thanos_store_secrets` is set once: ' ~ (duplicates | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.set | length > 0 -%}
          {%-   set _ = errors.append('The targets of `thanos_store_secrets` must not be set in `thanos_store_objstore`: ' ~ (ns.set | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.paths | length > 0 -%}
          {%-   set _ = errors.append('The paths of these secrets lead through values of `thanos_store_objstore` that are no dictionaries: '
                                    ~ (ns.paths | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if data | length > 0 -%}
          {%-   set _ = errors.append('Secrets are strings that are not empty and without line breaks, " and \\: ' ~ (data | unique | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the environment'
      when: monitoring_thanos_store__environment is defined
      ansible.builtin.assert:
        that:
          - monitoring_thanos_store__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_thanos_store__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_thanos_store__errors: >-
          {%- set errors = [] -%}
          {%- if monitoring_thanos_store__environment is not mapping -%}
          {%-   set _ = errors.append('`thanos_store_environment` has to be a dictionary.') -%}
          {%- else -%}
          {%-   set lines = monitoring_thanos_store__environment | dict2items | selectattr('value', 'string')
                            | selectattr('value', 'search', '[\r\n]') | map(attribute='key') | list -%}
          {%-   if lines | length > 0 -%}
          {%-     set _ = errors.append('The values of `thanos_store_environment` must not contain line breaks: ' ~ (lines | join(', ')) ~ '.') -%}
          {%-   endif -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment of the container after merging thanos_store_container,
    # unknown variables would change the behavior unexpectedly
    # An environment that is no mapping is not checked here, the validation of thanos_store_environment reports it
    - name: 'Validate the allowed environment variables'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_store__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_thanos_store__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_thanos_store__container_environment: >-
          {{ monitoring_thanos_store__container.environment if monitoring_thanos_store__container.environment | default(none) is mapping else {} }}
        monitoring_thanos_store__unknown: >-
          {{ monitoring_thanos_store__container_environment.keys() | map('string') | reject('in', monitoring_thanos_store__environment_allowed) | list }}
        monitoring_thanos_store__line_breaks: >-
          {{ monitoring_thanos_store__container_environment | dict2items | selectattr('value', 'string')
             | selectattr('value', 'search', '[\n\r]') | map(attribute='key') | list }}
        monitoring_thanos_store__errors: >-
          {%- set errors = [] -%}
          {%- if monitoring_thanos_store__unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (monitoring_thanos_store__unknown | join(', ')) ~ ', Thanos only reads '
                                    ~ (monitoring_thanos_store__environment_allowed | join(', ')) ~ ', the secrets are set with `thanos_store_secrets`.') -%}
          {%- endif -%}
          {%- if monitoring_thanos_store__line_breaks | length > 0 -%}
          {%-   set _ = errors.append('The environment variables must not contain line breaks: ' ~ (monitoring_thanos_store__line_breaks | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create directories'
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0755'
        state: 'directory'
      loop:
        - { path: "{{ monitoring_thanos_store__home }}", owner: 'root', group: 'root' }
        - { path: "{{ monitoring_thanos_store__podman_data_dir }}", owner: "{{ monitoring_thanos_store__uid }}", group: "{{ monitoring_thanos_store__gid }}" }
      loop_control:
        label: "{{ item.path }}"

    # bucket.yml contains no credentials, only the references $(THANOS_SECRET_…) Thanos replaces with the secrets of the environment,
    # the references are double-quoted, so the replaced secrets stay strings
    - name: 'Generate bucket.yml'
      ansible.builtin.copy:
        content: |
          #
          # Ansible managed
          #

          {{ monitoring_thanos_store__bucket_content }}
        dest: "{{ monitoring_thanos_store__podman_objstore_file }}"
        owner: 'root'
        group: 'root'
        mode: '0644'
      register: 'monitoring_thanos_store__objstore_result'
      vars:
        monitoring_thanos_store__bucket_content: >-
          {%- set ns = namespace(text=monitoring_thanos_store__objstore_rendered | to_nice_yaml(indent=2, sort_keys=false)) -%}
          {%- for secret in monitoring_thanos_store__secrets_valid -%}
          {%-   set ns.text = ns.text | replace(': $(' ~ secret.variable ~ ')', ': "$(' ~ secret.variable ~ ')"') -%}
          {%- endfor -%}
          {{ ns.text }}

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ monitoring_thanos_store__secrets }}"
      register: 'monitoring_thanos_store__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ monitoring_thanos_store__container.name }}"
        hostname: "{{ monitoring_thanos_store__container.hostname }}"
        image: "{{ monitoring_thanos_store__container.image }}"
        ip: "{{ monitoring_thanos_store__container.ip }}"
        ip6: "{{ monitoring_thanos_store__container.ipv6 | default(omit) }}"
        network: "{{ monitoring_thanos_store__container.network }}"
        timezone: "{{ monitoring_thanos_store__container.timezone }}"
        user: "{{ monitoring_thanos_store__container.user | default(omit) }}"
        command: "{{ monitoring_thanos_store__container.command | default(omit) }}"
        env: "{{ monitoring_thanos_store__container.environment | default(omit) }}"
        etc_hosts: "{{ monitoring_thanos_store__container.etc_hosts | default(omit) }}"
        expose: "{{ monitoring_thanos_store__container.expose | default(omit) }}"
        label: "{{ monitoring_thanos_store__container.labels | default(omit) }}"
        publish: "{{ monitoring_thanos_store__container.publish | default(omit) }}"
        secrets: "{{ monitoring_thanos_store__container.secrets | default(omit) }}"
        volume: "{{ monitoring_thanos_store__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if monitoring_thanos_store__container.requires is defined %}
          Requires={{ monitoring_thanos_store__container.requires | join(' ') }}
          {% endif %}
          {% if monitoring_thanos_store__container.wants is defined %}
          Wants={{ monitoring_thanos_store__container.wants | join(' ') }}
          {% endif %}
          {% if monitoring_thanos_store__container.after is defined %}
          After={{ monitoring_thanos_store__container.after | join(' ') }}
          {% endif %}
          {% if monitoring_thanos_store__container.part_of is defined %}
          PartOf={{ monitoring_thanos_store__container.part_of | join(' ') }}
          {% endif %}
          {% if monitoring_thanos_store__container.binds_to is defined %}
          BindsTo={{ monitoring_thanos_store__container.binds_to | join(' ') }}
          {% endif %}
          {% if monitoring_thanos_store__container.requires_mounts_for is defined %}
          RequiresMountsFor={{ monitoring_thanos_store__container.requires_mounts_for | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'monitoring_thanos_store__quadlet_result'

    # A failed start of the service only reports the exit code, the reason is in the journal
    - name: 'Start Thanos Store'
      when: 'not ansible_check_mode'
      block:

        - name: 'Start and enable container'
          ansible.builtin.systemd_service:
            name: "{{ monitoring_thanos_store__container.name }}"
            daemon_reload: true
            state: "{{ 'restarted' if monitoring_thanos_store__restart | bool else 'started' }}"
            enabled: true
          vars:
            monitoring_thanos_store__running: >-
              {{ (ansible_facts.services[monitoring_thanos_store__container.name + '.service'].state | default('')) == 'running' }}
            monitoring_thanos_store__restart: >-
              {{ monitoring_thanos_store__running | bool
                 and (monitoring_thanos_store__objstore_result is changed
                      or monitoring_thanos_store__secrets_result is changed
                      or monitoring_thanos_store__quadlet_result is changed) }}

      rescue:

        - name: 'Read the log of the failed start'
          ansible.builtin.command:
            argv: [ 'journalctl', '-u', "{{ monitoring_thanos_store__container.name }}", '-n', '80', '--no-pager' ]
          register: 'monitoring_thanos_store__start_journal'
          changed_when: false

        - name: 'Fail with the log of the failed start'
          ansible.builtin.fail:
            msg: >-
              {{ [ monitoring_thanos_store__container.name ~ ' did not start: ' ~ (ansible_failed_result.msg | default('')) ]
                 + monitoring_thanos_store__start_journal.stdout_lines }}

    - name: 'Wait for Thanos Store'
      ansible.builtin.uri:
        url: "http://{{ monitoring_thanos_store__container.ip }}:{{ monitoring_thanos_store__http_port }}/-/ready"
        status_code: [ 200, 503 ]
        # Without the container the address does not answer, a short timeout ends the wait in time
        timeout: 5
      register: 'monitoring_thanos_store__ready'
      until: monitoring_thanos_store__ready.status | default(-1) == 200
      retries: 60
      delay: 2
      failed_when: false
      when: 'not ansible_check_mode'

    - name: 'Read the log of Thanos Store'
      when:
        - not ansible_check_mode
        - monitoring_thanos_store__ready.status | default(-1) != 200
      ansible.builtin.command:
        argv: [ 'journalctl', '-u', "{{ monitoring_thanos_store__container.name }}", '-n', '50', '--no-pager' ]
      register: 'monitoring_thanos_store__journal'
      changed_when: false

    - name: 'Assert that Thanos Store is ready'
      when: 'not ansible_check_mode'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_store__journal is skipped
        fail_msg: "{{ monitoring_thanos_store__journal.stdout_lines | default([]) }}"
        quiet: true

    - name: 'Enable autoupdate on container'
      when: 'monitoring_thanos_store__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ monitoring_thanos_store__container.name }}"
        container_image: "{{ monitoring_thanos_store__container.image }}"
        container_schedule: "{{ monitoring_thanos_store__autoupdate_schedule }}"
