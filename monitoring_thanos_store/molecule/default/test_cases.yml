---
# Network created by container_podman in prepare.yml
monitoring_thanos_store__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

monitoring_thanos_store__test_image: 'docker.io/thanosio/thanos:v0.42.5'
monitoring_thanos_store__test_bucket_dir: '/opt/thanos-bucket'

monitoring_thanos_store__test_cases:

  # Only the mandatory variables, store serves the blocks of a bucket in the file system,
  # the volume of the bucket is added with thanos_store_container
  - name: 'molecule-thanos-store-default'
    role_vars:
      thanos_store_version: 'v0.42.5'
      thanos_store_home: '/opt/thanos-store'
      thanos_store_ip: '10.89.0.64'
      thanos_store_network: 'podman-molecule'
      thanos_store_hostname: 'thanos-store-default'
      thanos_store_timezone: 'Europe/Berlin'
      thanos_store_objstore:
        type: 'FILESYSTEM'
        config:
          directory: '/bucket'
      thanos_store_container:
        volumes:
          - '/opt/thanos-store/data:/var/thanos/store'
          - '/opt/thanos-bucket:/bucket'
    expect:
      ip: '10.89.0.64'
      ip6: ~
      objstore: true
      quadlet:
        - 'Volume=/opt/thanos-store/data:/var/thanos/store'
        - 'Volume=/opt/thanos-bucket:/bucket'

  # IPv6 and labels
  - name: 'molecule-thanos-store'
    role_vars:
      thanos_store_version: 'v0.42.5'
      thanos_store_home: '/opt/thanos-store'
      thanos_store_ip: '10.89.0.65'
      thanos_store_ipv6: 'fd00:89::65'
      thanos_store_network: 'podman-molecule'
      thanos_store_hostname: 'thanos-store-molecule'
      thanos_store_timezone: 'Europe/Berlin'
      thanos_store_labels:
        traefik.enable: 'false'
      thanos_store_objstore:
        type: 'FILESYSTEM'
        config:
          directory: '/bucket'
      thanos_store_container:
        volumes:
          - '/opt/thanos-store/data:/var/thanos/store'
          - '/opt/thanos-bucket:/bucket'
    # side_effect changes the object storage, the secret changes and store has to restart
    side_effect:
      role_vars:
        thanos_store_objstore:
          type: 'FILESYSTEM'
          config:
            directory: '/bucket/changed'
    expect:
      ip: '10.89.0.65'
      ip6: 'fd00:89::65'
      objstore: true
      quadlet:
        - 'Volume=/opt/thanos-store/data:/var/thanos/store'
        - 'Volume=/opt/thanos-bucket:/bucket'
        - 'Label=traefik.enable=false'
