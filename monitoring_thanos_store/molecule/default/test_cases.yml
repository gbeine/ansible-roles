---
# Network created by container_podman in prepare.yml
monitoring_thanos_store__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

monitoring_thanos_store__test_image: 'docker.io/thanosio/thanos:v0.42.5'
monitoring_thanos_store__test_quadlet_path: '/etc/containers/systemd/thanos-store.container'
monitoring_thanos_store__test_home: '/opt/thanos-store'
monitoring_thanos_store__test_bucket_dir: '/opt/thanos-bucket'

# S3 server of prepare.yml, rclone serves the directories of /data as buckets
monitoring_thanos_store__test_s3_image: 'docker.io/rclone/rclone:1.76.0'
monitoring_thanos_store__test_s3_ip: '10.89.0.63'
monitoring_thanos_store__test_s3_dir: '/opt/thanos-s3'
monitoring_thanos_store__test_s3_access_key: 'molecule'
monitoring_thanos_store__test_s3_secret_key: 'molecule-s3-secret-key'

monitoring_thanos_store__test_cases:

  # Only the mandatory variables, store serves the blocks of a bucket in the file system,
  # the volume of the bucket is added with thanos_store_container
  - name: 'molecule-thanos-store-default'
    role_vars:
      thanos_store_version: 'v0.42.5'
      thanos_store_home: '/opt/thanos-store'
      thanos_store_ip: '10.89.0.64'
      thanos_store_network: 'podman-molecule'
      thanos_store_hostname: 'thanos-store-default'
      thanos_store_timezone: 'Europe/Berlin'
      thanos_store_objstore:
        type: 'FILESYSTEM'
        config:
          directory: '/bucket'
      thanos_store_container:
        volumes:
          - '/opt/thanos-store/data:/var/thanos/store'
          - '/opt/thanos-store/bucket.yml:/etc/thanos/bucket.yml:ro'
          - '/opt/thanos-bucket:/bucket'
    expect:
      ip: '10.89.0.64'
      ip6: ~
      secrets: []
      quadlet:
        - 'Volume=/opt/thanos-store/data:/var/thanos/store'
        - 'Volume=/opt/thanos-store/bucket.yml:/etc/thanos/bucket.yml:ro'
        - 'Volume=/opt/thanos-bucket:/bucket'

  # IPv6, labels and S3 with the secret key as secret
  - name: 'molecule-thanos-store'
    role_vars:
      thanos_store_version: 'v0.42.5'
      thanos_store_home: '/opt/thanos-store'
      thanos_store_ip: '10.89.0.65'
      thanos_store_ipv6: 'fd00:89::65'
      thanos_store_network: 'podman-molecule'
      thanos_store_hostname: 'thanos-store-molecule'
      thanos_store_timezone: 'Europe/Berlin'
      thanos_store_labels:
        traefik.enable: 'false'
      thanos_store_objstore:
        type: 'S3'
        config:
          bucket: 'thanos'
          endpoint: '10.89.0.63:9000'
          region: 'us-east-1'
          insecure: true
          bucket_lookup_type: 'path'
          access_key: 'molecule'
      thanos_store_secrets:
        - name: 'thanos_store_s3_secret_key'
          data: 'molecule-s3-secret-key'
          target: 'config.secret_key'
    # side_effect changes the prefix of the object storage, bucket.yml changes and store has to restart
    side_effect:
      role_vars:
        thanos_store_objstore:
          type: 'S3'
          prefix: 'molecule'
          config:
            bucket: 'thanos'
            endpoint: '10.89.0.63:9000'
            region: 'us-east-1'
            insecure: true
            bucket_lookup_type: 'path'
            access_key: 'molecule'
    expect:
      ip: '10.89.0.65'
      ip6: 'fd00:89::65'
      secrets:
        - 'Secret=thanos_store_s3_secret_key,type=env,target=THANOS_SECRET_CONFIG_SECRET_KEY'
      bucket:
        - 'prefix: molecule'
        - '  secret_key: "$(THANOS_SECRET_CONFIG_SECRET_KEY)"'
      quadlet:
        - 'Volume=/opt/thanos-store/data:/var/thanos/store'
        - 'Volume=/opt/thanos-store/bucket.yml:/etc/thanos/bucket.yml:ro'
        - 'Label=traefik.enable=false'
