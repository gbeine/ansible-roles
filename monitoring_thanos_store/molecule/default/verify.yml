---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_thanos_store__test_case: "{{ monitoring_thanos_store__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_thanos_store__expect: "{{ monitoring_thanos_store__test_case.expect }}"
    monitoring_thanos_store__test_url: "http://{{ monitoring_thanos_store__expect.ip }}:10902"

  tasks:

    - name: 'Read the generated quadlet unit'
      ansible.builtin.slurp:
        src: "{{ monitoring_thanos_store__test_quadlet_path }}"
      register: 'monitoring_thanos_store__test_quadlet'

    # podman may quote values, the quotes are removed before the lines are compared
    - name: 'Assert the quadlet unit'
      ansible.builtin.assert:
        that:
          - ('Image=' + monitoring_thanos_store__test_image) in monitoring_thanos_store__test_quadlet_lines
          - ('IP=' + monitoring_thanos_store__expect.ip) in monitoring_thanos_store__test_quadlet_lines
          - monitoring_thanos_store__expect.ip6 is none or ('IP6=' + monitoring_thanos_store__expect.ip6) in monitoring_thanos_store__test_quadlet_lines
          - monitoring_thanos_store__expect.ip6 is not none or monitoring_thanos_store__test_quadlet_lines | select('match', 'IP6=') | list | length == 0
          # podman_container splits user 65534:65534 into User= and Group=
          - ('User=65534' in monitoring_thanos_store__test_quadlet_lines)
          - ('Group=65534' in monitoring_thanos_store__test_quadlet_lines)
          - monitoring_thanos_store__expect.quadlet | reject('in', monitoring_thanos_store__test_quadlet_lines) | list | length == 0
          # The time zone is set by podman, /etc/localtime is not mounted and TZ is not set
          - monitoring_thanos_store__test_quadlet_lines | select('search', '/etc/localtime|/etc/timezone|TZ=') | list | length == 0
          - ('Timezone=' + monitoring_thanos_store__test_case.role_vars.thanos_store_timezone) in monitoring_thanos_store__test_quadlet_lines
          - monitoring_thanos_store__test_exec is search('^Exec=store ')
          - monitoring_thanos_store__test_exec is search('--data-dir=/var/thanos/store')
          - monitoring_thanos_store__test_exec is search('--objstore.config-file=/etc/thanos/bucket.yml')
          - monitoring_thanos_store__test_quadlet_lines | select('match', 'Secret=') | list == monitoring_thanos_store__expect.secrets
          - monitoring_thanos_store__test_quadlet_lines | select('search', monitoring_thanos_store__test_s3_secret_key) | list | length == 0
        fail_msg: "{{ monitoring_thanos_store__test_quadlet_lines | to_json }}"
      vars:
        monitoring_thanos_store__test_quadlet_lines: "{{ (monitoring_thanos_store__test_quadlet.content | b64decode | regex_replace('\"', '')).splitlines() }}"
        monitoring_thanos_store__test_exec: "{{ monitoring_thanos_store__test_quadlet_lines | select('match', 'Exec=') | join(' ') }}"

    - name: 'Read the state of the service'
      ansible.builtin.command:
        argv: [ 'systemctl', 'is-active', 'thanos-store' ]
      register: 'monitoring_thanos_store__test_service'
      changed_when: false
      failed_when: false

    - name: 'Read the time zone and the environment of the container'
      ansible.builtin.command:
        argv: [ 'podman', 'inspect', '--format', '{{ "{{" }} .Config.Timezone {{ "}}" }} {{ "{{" }} json .Config.Env {{ "}}" }}', 'thanos-store' ]
      register: 'monitoring_thanos_store__test_inspect'
      changed_when: false

    # systemd counts only the restarts after a crash
    - name: 'Read the automatic restarts of the service'
      ansible.builtin.command:
        argv: [ 'systemctl', 'show', '--property=NRestarts', '--value', 'thanos-store' ]
      register: 'monitoring_thanos_store__test_restarts'
      changed_when: false

    - name: 'Read bucket.yml'
      ansible.builtin.slurp:
        src: "{{ monitoring_thanos_store__test_home }}/bucket.yml"
      register: 'monitoring_thanos_store__test_bucket'

    - name: 'Read the state of bucket.yml'
      ansible.builtin.stat:
        path: "{{ monitoring_thanos_store__test_home }}/bucket.yml"
      register: 'monitoring_thanos_store__test_bucket_stat'

    - name: 'Assert the service, the time zone, the environment and bucket.yml'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_store__test_service.stdout == 'active'
          - monitoring_thanos_store__test_restarts.stdout | int == 0
          - (monitoring_thanos_store__test_inspect.stdout.split(' ', 1) | first) == monitoring_thanos_store__test_case.role_vars.thanos_store_timezone
          - monitoring_thanos_store__test_env | select('match', 'TZ=') | list | length == 0
          # The secrets are passed in the environment of the container, not in bucket.yml,
          # store reaching the bucket of the S3 server shows the replaced reference
          - monitoring_thanos_store__expect.bucket | default([]) | reject('in', monitoring_thanos_store__test_bucket_lines) | list | length == 0
          - monitoring_thanos_store__test_bucket_lines | select('search', monitoring_thanos_store__test_s3_secret_key) | list | length == 0
          - monitoring_thanos_store__test_bucket_stat.stat.mode == '0644'
          - monitoring_thanos_store__test_bucket_stat.stat.uid == 0
        fail_msg: >-
          service {{ monitoring_thanos_store__test_service.stdout }}, automatic restarts {{ monitoring_thanos_store__test_restarts.stdout }},
          time zone {{ monitoring_thanos_store__test_inspect.stdout.split(' ', 1) | first }}, bucket.yml {{ monitoring_thanos_store__test_bucket_lines }}
      vars:
        monitoring_thanos_store__test_env: "{{ monitoring_thanos_store__test_inspect.stdout.split(' ', 1) | last | from_json }}"
        monitoring_thanos_store__test_bucket_lines: "{{ (monitoring_thanos_store__test_bucket.content | b64decode).splitlines() }}"

    - name: 'Read the data directory'
      ansible.builtin.stat:
        path: "{{ monitoring_thanos_store__test_case.role_vars.thanos_store_home }}/data"
      register: 'monitoring_thanos_store__test_data_dir'

    - name: 'Assert the data directory owned by nobody'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_store__test_data_dir.stat.isdir | default(false)
          - monitoring_thanos_store__test_data_dir.stat.uid == 65534
          - monitoring_thanos_store__test_data_dir.stat.gid == 65534
        fail_msg: >-
          directory {{ monitoring_thanos_store__test_data_dir.stat.isdir | default(false) }},
          uid {{ monitoring_thanos_store__test_data_dir.stat.uid | default('') }}, gid {{ monitoring_thanos_store__test_data_dir.stat.gid | default('') }}

    - name: 'Wait until store is ready'
      ansible.builtin.uri:
        url: "{{ monitoring_thanos_store__test_url }}/-/ready"
      register: 'monitoring_thanos_store__test_ready'
      until: monitoring_thanos_store__test_ready.status == 200
      retries: 15
      delay: 2

    - name: 'Read the metrics of store'
      ansible.builtin.uri:
        url: "{{ monitoring_thanos_store__test_url }}/metrics"
        return_content: true
      register: 'monitoring_thanos_store__test_metrics'
      # store lists the bucket at once after the start
      until: >-
        monitoring_thanos_store__test_metrics.content is
        search('^thanos_objstore_bucket_operations_total\{[^}]*operation="iter"[^}]*\} [1-9]', multiline=true)
      retries: 15
      delay: 2

    # The bucket is empty, store lists it and serves no blocks, on S3 the listing needs the secret key of the environment
    - name: 'Assert the bucket store'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_store__test_metrics.content is search('^thanos_bucket_store_blocks_loaded 0$', multiline=true)
          - monitoring_thanos_store__test_metrics.content is not search('^thanos_objstore_bucket_operation_failures_total\{[^}]*operation="iter"[^}]*\} [1-9]', multiline=true)
        fail_msg: >-
          {{ monitoring_thanos_store__test_metrics.content.splitlines() | select('match', '^thanos_(bucket_store_blocks_loaded|objstore_bucket_operation)') | list }}
