---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-thanos-store
#

# The image has no tag latest
monitoring_thanos_store__version: "{{ thanos_store_version | mandatory }}"

monitoring_thanos_store__home: "{{ thanos_store_home | mandatory }}"
monitoring_thanos_store__ip: "{{ thanos_store_ip | mandatory }}"
monitoring_thanos_store__ipv6: "{{ thanos_store_ipv6 }}"
monitoring_thanos_store__network: "{{ thanos_store_network | mandatory }}"
monitoring_thanos_store__hostname: "{{ thanos_store_hostname | mandatory }}"
monitoring_thanos_store__timezone: "{{ thanos_store_timezone | mandatory }}"
monitoring_thanos_store__labels: "{{ thanos_store_labels }}"

# Content of bucket.yml without credentials, store serves the blocks of this object storage
monitoring_thanos_store__objstore: "{{ thanos_store_objstore | mandatory }}"

# Secrets with name, data and target, the target is the path of the option in thanos_store_objstore,
# e.g. config.secret_key, the role references the secret in bucket.yml
monitoring_thanos_store__secrets: "{{ thanos_store_secrets | default([]) }}"

monitoring_thanos_store__container: "{{ monitoring_thanos_store__podman_container_default | combine(thanos_store_container | default({})) }}"

# Thanos reads no variables besides TZ, without thanos_store_environment the container has no environment
monitoring_thanos_store__environment: "{{ thanos_store_environment }}"

monitoring_thanos_store__autoupdate_enabled: "{{ thanos_store_autoupdate_enabled | default(false) }}"
monitoring_thanos_store__autoupdate_schedule: "{{ thanos_store_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_thanos_store__environment_allowed: [ 'TZ' ]

# User and group nobody of the image, the owner of the data directory
monitoring_thanos_store__uid: 65534
monitoring_thanos_store__gid: 65534

# HTTP endpoints (/-/ready, /metrics), the StoreAPI listens on 10901
monitoring_thanos_store__http_port: 10902

# Generated from the yaml tags of BucketConfig in client/factory.go and the providers of objstore.go
# of github.com/thanos-io/objstore 71d60dfee488 (Thanos v0.42.5), MEMORY is left out, it only exists for tests
monitoring_thanos_store__objstore_allowed: [ 'type', 'config', 'prefix' ]
monitoring_thanos_store__objstore_types:
  - 'FILESYSTEM'
  - 'GCS'
  - 'S3'
  - 'AZURE'
  - 'SWIFT'
  - 'COS'
  - 'ALIYUNOSS'
  - 'BOS'
  - 'OCI'
  - 'OBS'

# Options of the providers of github.com/thanos-io/objstore 71d60dfee488 carrying secrets,
# they are set with thanos_store_secrets, the last key of a target is one of them
monitoring_thanos_store__objstore_secret_keys:
  - 'secret_key'
  - 'session_token'
  - 'encryption_key'
  - 'service_account'
  - 'client_secret'
  - 'storage_account_key'
  - 'password'
  - 'application_credential_secret'
  - 'access_key_secret'
  - 'passphrase'
  - 'privatekey'

# The environment variables of the secrets are the prefix and the target in upper case, dots replaced by _
monitoring_thanos_store__secret_prefix: 'THANOS_SECRET_'

# The valid secrets with their path and environment variable, broken entries are left out, the validation reports them
monitoring_thanos_store__secrets_valid: >-
  {%- set result = [] -%}
  {%- if monitoring_thanos_store__secrets is sequence and monitoring_thanos_store__secrets is not string
         and monitoring_thanos_store__secrets is not mapping -%}
  {%-   for secret in monitoring_thanos_store__secrets if secret is mapping and secret.name is defined and secret.target is defined
                                                          and secret.target is string and secret.target is match('^[a-z0-9_]+(\.[a-z0-9_]+)+$')
                                                          and (secret.target | split('.') | last) in monitoring_thanos_store__objstore_secret_keys -%}
  {%-     set _ = result.append({ 'name': secret.name, 'path': secret.target | split('.'),
                                  'variable': monitoring_thanos_store__secret_prefix ~ (secret.target | replace('.', '_') | upper) }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ result }}

# The references of the secrets as nested dictionaries, e.g. { 'config': { 'secret_key': '$(THANOS_SECRET_CONFIG_SECRET_KEY)' } },
# Thanos replaces $(…) in bucket.yml with the environment
monitoring_thanos_store__objstore_secrets: >-
  {%- set ns = namespace(result={}) -%}
  {%- for secret in monitoring_thanos_store__secrets_valid -%}
  {%-   set node = namespace(value='$(' ~ secret.variable ~ ')') -%}
  {%-   for key in secret.path | reverse -%}
  {%-     set node.value = { key: node.value } -%}
  {%-   endfor -%}
  {%-   set ns.result = ns.result | combine(node.value, recursive=true) -%}
  {%- endfor -%}
  {{ ns.result }}

# The content of bucket.yml: the object storage with the references of the secrets
monitoring_thanos_store__objstore_rendered: >-
  {{ monitoring_thanos_store__objstore | combine(monitoring_thanos_store__objstore_secrets, recursive=true) }}

# The data directory is a cache of the index of the blocks
monitoring_thanos_store__command_default:
  - 'store'
  - '--data-dir=/var/thanos/store'
  - '--objstore.config-file=/etc/thanos/bucket.yml'

monitoring_thanos_store__podman_name: 'thanos-store'
monitoring_thanos_store__podman_image: 'docker.io/thanosio/thanos'
monitoring_thanos_store__podman_tag: "{{ monitoring_thanos_store__version }}"
monitoring_thanos_store__podman_data_dir: "{{ monitoring_thanos_store__home }}/data"
monitoring_thanos_store__podman_objstore_file: "{{ monitoring_thanos_store__home }}/bucket.yml"

monitoring_thanos_store__podman_container_default:
  name: "{{ monitoring_thanos_store__podman_name }}"
  hostname: "{{ monitoring_thanos_store__hostname }}"
  image: "{{ monitoring_thanos_store__podman_image }}:{{ monitoring_thanos_store__podman_tag }}"
  ip: "{{ monitoring_thanos_store__ip }}"
  ipv6: "{{ monitoring_thanos_store__ipv6 | default(omit) }}"
  network: "{{ monitoring_thanos_store__network }}"
  timezone: "{{ monitoring_thanos_store__timezone }}"
  environment: "{{ monitoring_thanos_store__environment | default(omit) }}"
  labels: "{{ monitoring_thanos_store__labels | default(omit) }}"
  user: "{{ monitoring_thanos_store__uid }}:{{ monitoring_thanos_store__gid }}"
  # thanos_store_container.command replaces the list completely
  command: "{{ monitoring_thanos_store__command_default }}"
  # The providers read no files, the secrets are variables referenced in bucket.yml
  secrets: >-
    {{ (monitoring_thanos_store__secrets_valid | map(attribute='name')
        | zip(monitoring_thanos_store__secrets_valid | map(attribute='variable')) | map('join', ',type=env,target=') | list)
       if monitoring_thanos_store__secrets_valid | length > 0 else omit }}
  # thanos_store_container.volumes replaces the list completely
  volumes:
    - "{{ monitoring_thanos_store__podman_data_dir }}:/var/thanos/store"
    - "{{ monitoring_thanos_store__podman_objstore_file }}:/etc/thanos/bucket.yml:ro"
