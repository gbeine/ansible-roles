---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-thanos-store
#

# The image has no tag latest
monitoring_thanos_store__version: "{{ thanos_store_version | mandatory }}"

monitoring_thanos_store__home: "{{ thanos_store_home | mandatory }}"
monitoring_thanos_store__ip: "{{ thanos_store_ip | mandatory }}"
monitoring_thanos_store__ipv6: "{{ thanos_store_ipv6 }}"
monitoring_thanos_store__network: "{{ thanos_store_network | mandatory }}"
monitoring_thanos_store__hostname: "{{ thanos_store_hostname | mandatory }}"
monitoring_thanos_store__timezone: "{{ thanos_store_timezone | mandatory }}"
monitoring_thanos_store__labels: "{{ thanos_store_labels }}"

# Content of bucket.yml, stored as podman secret, store serves the blocks of this object storage
monitoring_thanos_store__objstore: "{{ thanos_store_objstore | default({}) }}"

monitoring_thanos_store__container: "{{ monitoring_thanos_store__podman_container_default | combine(thanos_store_container | default({})) }}"

# Thanos reads no variables besides TZ
monitoring_thanos_store__environment: "{{ monitoring_thanos_store__environment_default | combine(thanos_store_environment | default({})) }}"

monitoring_thanos_store__autoupdate_enabled: "{{ thanos_store_autoupdate_enabled | default(false) }}"
monitoring_thanos_store__autoupdate_schedule: "{{ thanos_store_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_thanos_store__environment_default:
  TZ: "{{ monitoring_thanos_store__timezone }}"

monitoring_thanos_store__environment_allowed: [ 'TZ' ]

# User and group nobody of the image, the owner of the data directory
monitoring_thanos_store__uid: 65534
monitoring_thanos_store__gid: 65534

# HTTP endpoints (/-/ready, /metrics), the StoreAPI listens on 10901
monitoring_thanos_store__http_port: 10902

monitoring_thanos_store__objstore_file: '/etc/thanos/bucket.yml'
monitoring_thanos_store__data_dir: '/var/thanos/store'

monitoring_thanos_store__objstore_flags: >-
  {{ [ '--objstore.config-file=' ~ monitoring_thanos_store__objstore_file ] if monitoring_thanos_store__objstore | length > 0 else [] }}

# The data directory is a cache of the index of the blocks
monitoring_thanos_store__command_default: >-
  {{ [ 'store',
       '--data-dir=' ~ monitoring_thanos_store__data_dir ]
     + monitoring_thanos_store__objstore_flags }}

monitoring_thanos_store__podman_name: 'thanos-store'
monitoring_thanos_store__podman_image: 'docker.io/thanosio/thanos'
monitoring_thanos_store__podman_tag: "{{ monitoring_thanos_store__version }}"
monitoring_thanos_store__podman_data_dir: "{{ monitoring_thanos_store__home }}/data"
# Named after the container, a container with another name has its own secret
monitoring_thanos_store__podman_objstore_secret: >-
  {{ (thanos_store_container | default({})).name | default(monitoring_thanos_store__podman_name) }}-objstore

monitoring_thanos_store__podman_container_default:
  name: "{{ monitoring_thanos_store__podman_name }}"
  hostname: "{{ monitoring_thanos_store__hostname }}"
  image: "{{ monitoring_thanos_store__podman_image }}:{{ monitoring_thanos_store__podman_tag }}"
  ip: "{{ monitoring_thanos_store__ip }}"
  ipv6: "{{ monitoring_thanos_store__ipv6 | default(omit) }}"
  network: "{{ monitoring_thanos_store__network }}"
  timezone: "{{ monitoring_thanos_store__timezone }}"
  environment: "{{ monitoring_thanos_store__environment }}"
  labels: "{{ monitoring_thanos_store__labels | default(omit) }}"
  user: "{{ monitoring_thanos_store__uid }}:{{ monitoring_thanos_store__gid }}"
  # thanos_store_container.command replaces the list completely
  command: "{{ monitoring_thanos_store__command_default }}"
  secrets: >-
    {{ [ monitoring_thanos_store__podman_objstore_secret ~ ',type=mount,target=' ~ monitoring_thanos_store__objstore_file ]
       if monitoring_thanos_store__objstore | length > 0 else omit }}
  # thanos_store_container.volumes replaces the list completely
  volumes:
    - "{{ monitoring_thanos_store__podman_data_dir }}:{{ monitoring_thanos_store__data_dir }}"
