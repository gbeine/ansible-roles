---

- name: 'Bootstrapping...'
  tags: [ 'bootstrap'  ]
  block:

    - name: 'Run pre-setup scripts'
      ansible.builtin.shell: |
        {{ item }}
      with_items: "{{ bootstrap__pre_setup_scripts }}"

    - name: 'Storage...'
      ansible.builtin.import_role:
        name: 'bootstrap_storage'
      when: 'bootstrap_storage__enable'

    - name: 'Networking...'
      ansible.builtin.import_role:
        name: 'bootstrap_networking'
      when: 'bootstrap_networking__enable'

    - name: 'Timezone...'
      ansible.builtin.import_role:
        name: 'bootstrap_timezone'
      when: 'bootstrap_timezone__enable'

    - name: 'Packages...'
      ansible.builtin.import_role:
        name: 'bootstrap_packages'
      when: 'bootstrap_packages__enable'

    - name: 'Accounts...'
      ansible.builtin.import_role:
        name: 'bootstrap_accounts'
      when: 'bootstrap_accounts__enable'

    - name: 'Dotfiles...'
      ansible.builtin.import_role:
        name: 'bootstrap_dotfiles'
      when: 'bootstrap_dotfiles__enable'

    - name: 'logrotate...'
      ansible.builtin.import_role:
        name: 'bootstrap_logrotate'
      when: 'bootstrap_logrotate__enable'

    - name: 'podman...'
      ansible.builtin.import_role:
        name: 'bootstrap_podman'
      when: 'bootstrap_podman__enable'

