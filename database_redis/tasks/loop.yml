---

- name: 'Loop over Redis instances'
  tags: [ 'database', 'database_redis' ]
  ansible.builtin.include_role:
    name: 'database_redis'
  loop: "{{ redis_instances }}"
  loop_control:
    loop_var: 'redis'
    label: "{{ redis.hostname }}"
  vars:
    redis_home: "{{ redis.home }}"
    redis_ip: "{{ redis.ip }}"
    redis_ipv6: "{{ redis.ipv6 }}"
    redis_network: "{{ redis.network }}"
    redis_hostname: "{{ redis.hostname }}"
    redis_timezone: "{{ redis.timezone }}"
    redis_labels: "{{ redis.labels }}"
    redis_version: "{{ redis.version }}"
    redis_container: "{{ redis.container }}"
    redis_environment: "{{ redis.environment }}"
    redis_config: "{{ redis.config }}"
    redis_users: "{{ redis.users }}"
    redis_passwords: "{{ redis.passwords }}"
    redis_secrets: "{{ redis.secrets }}"
    redis_autoupdate_enabled: "{{ redis.autoupdate_enabled }}"
    redis_autoupdate_schedule: "{{ redis.autoupdate_schedule }}"
