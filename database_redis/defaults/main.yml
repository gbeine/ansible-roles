---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-redis
#

database_redis__home: "{{ redis_home | mandatory }}"
database_redis__ip: "{{ redis_ip | mandatory }}"
database_redis__ipv6: "{{ redis_ipv6 }}"
database_redis__network: "{{ redis_network | mandatory }}"
database_redis__hostname: "{{ redis_hostname | mandatory }}"
database_redis__timezone: "{{ redis_timezone | mandatory }}"
database_redis__labels: "{{ redis_labels }}"

database_redis__version: "{{ redis_version | default('8-alpine') }}"

database_redis__container: "{{ database_redis__podman_container_default | combine(redis_container | default({})) }}"
database_redis__environment: "{{ redis_environment | default({}) }}"
database_redis__secrets: "{{ redis_secrets | default([]) }}"

# The options of redis.conf, a string or number writes "option value", a list one line per element,
# false or null removes the option
database_redis__config: "{{ database_redis__config_default | combine(redis_config | default({})) }}"

# ACL users with name, rules and enabled, the passwords are set with redis_passwords
database_redis__users: "{{ redis_users | default([]) }}"
database_redis__passwords: "{{ redis_passwords | default({}) }}"

database_redis__autoupdate_enabled: "{{ redis_autoupdate_enabled | default(false) }}"
database_redis__autoupdate_schedule: "{{ redis_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The variables of docker-entrypoint.sh of redis/docker-library-redis 8.10.3, TZ is set by the timezone of the container
database_redis__environment_allowed:
  - 'SKIP_FIX_PERMS'
  - 'SKIP_DROP_PRIVS'

database_redis__config_default:
  bind: '* -::*'
  port: 6379

# The options set by the role, they are written before the options of redis_config and must not be set there
database_redis__config_role:
  daemonize: 'no'
  dir: "{{ database_redis__data_dir }}"
  aclfile: "{{ database_redis__acl_file }}"

# Options that are replaced by the role: include by the secrets, user and requirepass by redis_users
database_redis__config_rejected:
  include: 'the role includes the secrets of redis_secrets'
  user: 'users are defined in redis_users'
  requirepass: 'the password of the user default is set with redis_users and redis_passwords'

# The options carrying a password, they are set with redis_secrets
database_redis__secrets_allowed:
  - 'masterauth'
  - 'tls-key-file-pass'
  - 'tls-client-key-file-pass'

database_redis__secrets_dir: '/run/secrets'

# Password rules of ACL, the passwords are set with redis_passwords and enabled controls on and off
database_redis__acl_rules_rejected: [ 'nopass', 'on', 'off' ]
database_redis__acl_rules_rejected_prefixes: [ '>', '<', '#', '!' ]

# The user default of Redis, used if redis_users does not contain default
database_redis__acl_default: 'user default on nopass sanitize-payload ~* &* +@all'

# The names of the users of redis_users
database_redis__user_name_pattern: '^[A-Za-z0-9_.@-]+$'

database_redis__config_allowed: "{{ database_redis__config_allowed_server + database_redis__config_allowed_modules }}"

# User and group redis of the image
database_redis__data_owner: 999
database_redis__data_group: 1000

database_redis__port: "{{ database_redis__config.port | default(6379) }}"

database_redis__podman_name: 'redis'
database_redis__podman_image: 'docker.io/library/redis'

database_redis__podman_data_dir: "{{ database_redis__home }}/data"
database_redis__podman_config_file: "{{ database_redis__home }}/redis.conf"
database_redis__podman_acl_file: "{{ database_redis__home }}/users.acl"

database_redis__data_dir: '/data'
database_redis__config_file: '/usr/local/etc/redis/redis.conf'
# Outside the directory of redis.conf, the entrypoint only checks the permissions if redis.conf is alone there
database_redis__acl_file: '/etc/redis/users.acl'

database_redis__podman_container_default:
  name: "{{ database_redis__podman_name }}"
  hostname: "{{ database_redis__hostname }}"
  image: "{{ database_redis__podman_image }}:{{ database_redis__version }}"
  ip: "{{ database_redis__ip }}"
  ipv6: "{{ database_redis__ipv6 | default(omit) }}"
  network: "{{ database_redis__network }}"
  timezone: "{{ database_redis__timezone }}"
  labels: "{{ database_redis__labels | default(omit) }}"
  environment: "{{ database_redis__environment }}"
  command: [ 'redis-server', "{{ database_redis__config_file }}" ]
  volumes:
    - "{{ database_redis__podman_data_dir }}:{{ database_redis__data_dir }}"
    - "{{ database_redis__podman_config_file }}:{{ database_redis__config_file }}:ro"
    - "{{ database_redis__podman_acl_file }}:{{ database_redis__acl_file }}:ro"
  # The secrets are mounted for the user of the image
  secrets: >-
    {{ database_redis__podman_secrets
       if (database_redis__secrets is sequence and database_redis__secrets is not string and database_redis__secrets | length > 0)
       else omit }}

# The podman secrets of redis_secrets, entries without name are left out, the validation of the secrets reports them
database_redis__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- for secret in database_redis__secrets if secret is mapping and secret.name is defined -%}
  {%-   set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ database_redis__secrets_dir ~ '/' ~ secret.name
                               ~ ',uid=' ~ database_redis__data_owner ~ ',gid=' ~ database_redis__data_group ~ ',mode=0400') -%}
  {%- endfor -%}
  {{ secrets }}

