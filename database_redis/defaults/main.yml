---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-redis
#

database_redis__use_podman: "{{ redis_use_podman | default(true) }}"

database_redis__home: "{{ redis_home | mandatory }}"
database_redis__ip: "{{ redis_ip | mandatory }}"
database_redis__ipv6: "{{ redis_ipv6 | default('') }}"
database_redis__network: "{{ redis_network | mandatory }}"
database_redis__hostname: "{{ redis_hostname | mandatory }}"
database_redis__timezone: "{{ redis_timezone | mandatory }}"

database_redis__container: "{{ database_redis__podman_container_default | combine(redis_container | default({})) }}"

database_redis__port: "{{ redis_port | default(6379) }}"

database_redis__bind: "{{ redis_bind | default('127.0.0.1 ::1') }}"

database_redis__config: "{{ redis_config | default('') }}"

#
# Defaults - do not change
#

database_redis__uid: 999
database_redis__gid: "{{ database_redis__uid }}"

database_redis__podman_name: 'redis'
database_redis__podman_image: 'docker.io/redis'
database_redis__podman_tag: "{{ redis_podman_tag | default('8-alpine') }}"

database_redis__podman_home: "{{ database_redis__home }}"

database_redis__podman_container_default:
  name: "{{ database_redis__podman_name }}"
  hostname: "{{ database_redis__hostname }}"
  image: "{{ database_redis__podman_image }}:{{ database_redis__podman_tag }}"
  ip: "{{ database_redis__ip }}"
  ipv6: "{{ database_redis__ipv6 }}"
  network: "{{ database_redis__network }}"
  timezone: "{{ database_redis__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ database_redis__podman_home }}/data:/data"
    - "{{ database_redis__podman_home }}/redis.conf:/etc/redis.conf:ro"
