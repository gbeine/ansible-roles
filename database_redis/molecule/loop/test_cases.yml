---
# Network created by container_podman in prepare.yml
database_redis__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

database_redis__test_image: 'docker.io/library/redis:8-alpine'

# Instances deployed with tasks/loop.yml, test passwords only
redis_instances:

  # IPv4 only, the user default without password like the image
  - home: '/opt/redis-cache'
    hostname: 'redis-cache'
    ip: '10.89.0.72'
    network: 'podman-molecule'
    timezone: 'Europe/Berlin'
    container:
      name: 'redis-cache'
    config:
      maxmemory: '32mb'
      maxmemory-policy: 'allkeys-lru'
      save: ''
    secrets:
      - name: 'redis_cache_masterauth'
        data: 'molecule-cache-masterauth'
        target: 'masterauth'

  # IPv6, a user with password
  - home: '/opt/redis-queue'
    hostname: 'redis-queue'
    ip: '10.89.0.73'
    ipv6: 'fd00:89::73'
    network: 'podman-molecule'
    timezone: 'Europe/Berlin'
    container:
      name: 'redis-queue'
    config:
      appendonly: 'yes'
    users:
      - name: 'default'
        rules: [ '~*', '&*', '+@all' ]
    passwords:
      default: 'molecule-queue-password'
    secrets:
      - name: 'redis_queue_masterauth'
        data: 'molecule-queue-masterauth'
        target: 'masterauth'

database_redis__test_expect:

  - name: 'redis-cache'
    home: '/opt/redis-cache'
    ip: '10.89.0.72'
    ip6: ~
    password: ~
    config:
      - 'maxmemory 32mb'
      - 'maxmemory-policy allkeys-lru'
      - 'save ""'
      - 'include /run/secrets/redis_cache_masterauth'
    secrets:
      - 'redis_cache_masterauth,type=mount,target=/run/secrets/redis_cache_masterauth,uid=999,gid=1000,mode=0400'
    masterauth: 'molecule-cache-masterauth'

  - name: 'redis-queue'
    home: '/opt/redis-queue'
    ip: '10.89.0.73'
    ip6: 'fd00:89::73'
    password: 'molecule-queue-password'
    config:
      - 'appendonly yes'
      - 'include /run/secrets/redis_queue_masterauth'
    secrets:
      - 'redis_queue_masterauth,type=mount,target=/run/secrets/redis_queue_masterauth,uid=999,gid=1000,mode=0400'
    masterauth: 'molecule-queue-masterauth'
