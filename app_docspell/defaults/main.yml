---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/docspell
#

app_docspell__home: "{{ docspell_home | mandatory }}"
app_docspell__ip: "{{ docspell_ip | mandatory }}"
app_docspell__ipv6: "{{ docspell_ipv6 }}"
app_docspell__network: "{{ docspell_network | mandatory }}"
app_docspell__hostname: "{{ docspell_hostname | mandatory }}"
app_docspell__timezone: "{{ docspell_timezone | mandatory }}"
app_docspell__labels: "{{ docspell_labels | default({}) }}"

app_docspell__joex_ip: "{{ docspell_joex_ip | mandatory }}"
app_docspell__joex_ipv6: "{{ docspell_joex_ipv6 }}"
app_docspell__joex_hostname: "{{ docspell_joex_hostname | mandatory }}"

app_docspell__version: "{{ docspell_version | default('latest') }}"

app_docspell__rest_container: "{{ app_docspell__rest_container_default | combine(docspell_container | default({})) }}"
app_docspell__joex_container: "{{ app_docspell__joex_container_default | combine(docspell_joex_container | default({})) }}"

app_docspell__autoupdate_enabled: "{{ docspell_autoupdate_enabled | default(false) }}"

app_docspell__config: "{{ docspell_config | mandatory }}"

#
# Defaults - do not change
#

app_docspell__podman_tag: "{{ app_docspell__version }}"

app_docspell__podman_home: "{{ app_docspell__home }}"
app_docspell__podman_config_file: "{{ app_docspell__podman_home }}/docspell.conf"

app_docspell__rest_podman_name: 'docspell'
app_docspell__rest_podman_image: 'docker.io/docspell/restserver'

app_docspell__rest_container_default:
  name: "{{ app_docspell__rest_podman_name }}"
  hostname: "{{ app_docspell__hostname }}"
  image: "{{ app_docspell__rest_podman_image }}:{{ app_docspell__podman_tag }}"
  ip: "{{ app_docspell__ip }}"
  ipv6: "{{ app_docspell__ipv6 | default(omit) }}"
  network: "{{ app_docspell__network }}"
  timezone: "{{ app_docspell__timezone }}"
  labels: "{{ app_docspell__labels }}"
  command:
    - '/opt/docspell.conf'
  environment:
    TZ: "{{ app_docspell__timezone }}"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_docspell__podman_config_file }}:/opt/docspell.conf:ro,Z"
    - "{{ app_docspell__podman_home }}/files:/srv/docspell/files:Z"

app_docspell__joex_podman_name: 'joex'
app_docspell__joex_podman_image: 'docker.io/docspell/joex'

app_docspell__joex_container_default:
  name: "{{ app_docspell__joex_podman_name }}"
  hostname: "{{ app_docspell__joex_hostname }}"
  image: "{{ app_docspell__joex_podman_image }}:{{ app_docspell__podman_tag }}"
  ip: "{{ app_docspell__joex_ip }}"
  ipv6: "{{ app_docspell__joex_ipv6 | default(omit) }}"
  network: "{{ app_docspell__network }}"
  timezone: "{{ app_docspell__timezone }}"
  command:
    - '/opt/docspell.conf'
  environment:
    TZ: "{{ app_docspell__timezone }}"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_docspell__podman_config_file }}:/opt/docspell.conf:ro,Z"
    - "{{ app_docspell__podman_home }}/files:/srv/docspell/files:Z"
