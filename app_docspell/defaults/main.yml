  - 'docspell.server.backend.files.stores.minio.enabled'
  - 'docspell.server.backend.files.stores.minio.type'
  - 'docspell.server.backend.files.stores.minio.endpoint'
  - 'docspell.server.backend.files.stores.minio.access-key'
  - 'docspell.server.backend.files.stores.minio.bucket'
  - 'docspell.server.backend.files.stores.minio.region'
  - 'docspell.server.backend.addons.enabled'
  - 'docspell.server.backend.addons.allow-impure'
  - 'docspell.server.backend.addons.allowed-urls'
