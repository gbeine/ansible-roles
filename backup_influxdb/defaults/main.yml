backup_influxdb__backup_dir: "{{ backup_influxdb_backup_dir | default('/backup') }}"
backup_influxdb__token: "{{ backup_influxdb_token | mandatory }}"
backup_influxdb__keep_days: "{{ backup_influxdb_keep_days | default('14') }}"
backup_influxdb__container_name: "{{ backup_influxdb_container_name | default('influxdb') }}"
backup_influxdb__container_backup_dir: "{{ backup_influxdb_container_backup_dir | default('/var/backups/influxdb') }}"

#
# Defaults - do not change
#

backup_influxdb__files:
  - '910.backup.influxdb'
