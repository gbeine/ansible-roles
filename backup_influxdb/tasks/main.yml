---

- name: 'Configure InfluxDB backup'
  tags: [ 'backup_mongodb'  ]
  block:

    - name: 'Copy InfluxDB backup scripts to host'
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ backup_common__lib_dir }}/{{ item }}"
        mode: '755'
      with_items: "{{ backup_influxdb__files }}"

    - name: 'Generate InfluxDB backup configuration file'
      ansible.builtin.template:
        src: 'influxdb.j2'
        dest: "{{ backup_common__etc_dir }}/influxdb"
        owner: 'root'
        group: 'root'
        mode: '640'

    - name: 'Create InfluxDB backup directory'
      ansible.builtin.file:
        mode: '750'
        owner: 'root'
        group: 'root'
        path: "{{ backup_influxdb__backup_dir }}"
        state: 'directory'
