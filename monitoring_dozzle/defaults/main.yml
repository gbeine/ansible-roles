---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-dozzle
#

monitoring_dozzle__home: "{{ dozzle_home | mandatory }}"
monitoring_dozzle__ip: "{{ dozzle_ip | mandatory }}"
monitoring_dozzle__ipv6: "{{ dozzle_ipv6 }}"
monitoring_dozzle__network: "{{ dozzle_network | mandatory }}"
monitoring_dozzle__hostname: "{{ dozzle_hostname | mandatory }}"
monitoring_dozzle__timezone: "{{ dozzle_timezone | mandatory }}"
monitoring_dozzle__labels: "{{ dozzle_labels }}"

monitoring_dozzle__version: "{{ dozzle_version | default('latest') }}"

monitoring_dozzle__container: "{{ monitoring_dozzle__podman_container_default | combine(dozzle_container | default({})) }}"

# The configuration of Dozzle, see internal/cli/args.go of Dozzle
monitoring_dozzle__environment: "{{ monitoring_dozzle__environment_default | combine(dozzle_environment | default({})) }}"

# Secrets with name, data and target, the secrets of Dozzle without file variable are passed in the environment,
# the others are mounted below /run/secrets and the role sets the file variable of the target
monitoring_dozzle__secrets: "{{ dozzle_secrets | default([]) }}"

# The users of the provider simple, the key is the name of the user to log in,
# the values are name, email, password, github, filter and roles
monitoring_dozzle__users: "{{ dozzle_users | default({}) }}"

monitoring_dozzle__autoupdate_enabled: "{{ dozzle_autoupdate_enabled | default(false) }}"
monitoring_dozzle__autoupdate_schedule: "{{ dozzle_autoupdate_schedule }}"

#
# Defaults - do not change
#

# Settings set by a variable are locked, the file dozzle.yml in /data cannot change them
monitoring_dozzle__environment_default:
  TZ: "{{ monitoring_dozzle__timezone }}"
  DOZZLE_AUTH_PROVIDER: 'simple'
  DOZZLE_NO_ANALYTICS: true
  DOZZLE_ENABLE_ACTIONS: false
  DOZZLE_ENABLE_SHELL: false
  # The image is updated by container_update, not by Dozzle
  DOZZLE_AUTO_UPDATE: 'off'
  DOZZLE_AUTO_CLEANUP: 'off'

# Set by the role, without login anybody may create an account with the setup wizard,
# swarm and k8s do not exist with podman and the port is fixed
monitoring_dozzle__environment_role:
  DOZZLE_DISABLE_SETUP_WIZARD: 'true'
  DOZZLE_MODE: 'server'
  DOZZLE_ADDR: ':8080'

monitoring_dozzle__port: 8080

# The ways to log in to Dozzle, there is no way without login,
# github and google are aliases of simple
monitoring_dozzle__auth_providers: [ 'simple', 'oidc', 'forward-proxy' ]
monitoring_dozzle__auth_provider: "{{ monitoring_dozzle__environment.DOZZLE_AUTH_PROVIDER | default('') | string }}"

# The variables and secrets each way to log in needs, simple needs users in dozzle_users
monitoring_dozzle__auth_environment_required:
  simple: []
  oidc: [ 'DOZZLE_AUTH_OIDC_ISSUER', 'DOZZLE_AUTH_OIDC_CLIENT_ID' ]
  forward-proxy: []
monitoring_dozzle__auth_secrets_required:
  simple: []
  oidc: [ 'DOZZLE_AUTH_OIDC_CLIENT_SECRET' ]
  forward-proxy: []

# Dozzle reads these values as booleans, true or false
monitoring_dozzle__environment_booleans:
  - 'DOZZLE_DISABLE_AVATARS'
  - 'DOZZLE_DISABLE_SETUP_WIZARD'
  - 'DOZZLE_ENABLE_ACTIONS'
  - 'DOZZLE_ENABLE_MCP'
  - 'DOZZLE_ENABLE_SHELL'
  - 'DOZZLE_NO_ANALYTICS'

# The targets of the secrets, they must not be set in dozzle_environment
monitoring_dozzle__secret_variables: "{{ monitoring_dozzle__secret_files.keys() | list + monitoring_dozzle__secrets_env }}"

# The secrets mounted as files, Dozzle reads the variable target from the file variable
# (fileBackedEnvNames in internal/cli/secrets.go of Dozzle v11.4.3)
monitoring_dozzle__secret_files:
  DOZZLE_AUTH_GITHUB_CLIENT_SECRET: 'DOZZLE_AUTH_GITHUB_CLIENT_SECRET_FILE'
  DOZZLE_AUTH_OIDC_CLIENT_SECRET: 'DOZZLE_AUTH_OIDC_CLIENT_SECRET_FILE'

# The secrets passed in the environment, Dozzle has no file variable for them
monitoring_dozzle__secrets_env: [ 'DOZZLE_MCP_TOKEN' ]

# The token of MCP needs at least 32 characters without whitespace (validateServer of Dozzle)
monitoring_dozzle__mcp_token_length: 32

monitoring_dozzle__secrets_dir: '/run/secrets'

# The users of Dozzle
monitoring_dozzle__name_pattern: '^[A-Za-z0-9_.@-]+$'
monitoring_dozzle__email_pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
monitoring_dozzle__user_keys: [ 'name', 'email', 'password', 'github', 'filter', 'roles' ]
# bcrypt only uses the first 72 bytes of a password
monitoring_dozzle__password_length_min: 8
monitoring_dozzle__password_length_max: 72
# The roles of docs/guide/authentication/simple.md of Dozzle v11.4.3, a role with ^ is excluded
monitoring_dozzle__user_roles: [ 'shell', 'actions', 'update', 'download', 'notifications', 'cloud', 'all', 'none' ]
monitoring_dozzle__users_file: "{{ monitoring_dozzle__podman_data_dir }}/users.yml"

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
monitoring_dozzle__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if monitoring_dozzle__secrets is sequence and monitoring_dozzle__secrets is not string and monitoring_dozzle__secrets is not mapping -%}
  {%-   for secret in monitoring_dozzle__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in monitoring_dozzle__secret_files -%}
  {%-     set _ = environment.update({ monitoring_dozzle__secret_files[secret.target]: monitoring_dozzle__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The environment of the container, booleans in lower case
monitoring_dozzle__environment_container: >-
  {%- set environment = {} -%}
  {%- for key, value in (monitoring_dozzle__environment | combine(monitoring_dozzle__environment_role)).items() -%}
  {%-   set _ = environment.update({ key: (value | string | lower) if value is boolean else value }) -%}
  {%- endfor -%}
  {{ environment | combine(monitoring_dozzle__environment_secrets_files) }}

# The variables of Dozzle, the variables set by the role and the file variables of the secrets.
# Generated from the env tags of internal/cli/args.go of Dozzle v11.4.3 without the secrets,
# DOZZLE_NAMESPACE (k8s) and DOZZLE_CERT and DOZZLE_KEY (agents), update with new versions of the image
monitoring_dozzle__environment_allowed:
  - 'TZ'
  - 'DOZZLE_AUTH_GITHUB_CLIENT_ID'
  - 'DOZZLE_AUTH_HEADER_EMAIL'
  - 'DOZZLE_AUTH_HEADER_FILTER'
  - 'DOZZLE_AUTH_HEADER_NAME'
  - 'DOZZLE_AUTH_HEADER_ROLES'
  - 'DOZZLE_AUTH_HEADER_USER'
  - 'DOZZLE_AUTH_LOGOUT_URL'
  - 'DOZZLE_AUTH_OIDC_CLIENT_ID'
  - 'DOZZLE_AUTH_OIDC_FILTERS_CLAIM'
  - 'DOZZLE_AUTH_OIDC_ISSUER'
  - 'DOZZLE_AUTH_OIDC_NAME'
  - 'DOZZLE_AUTH_OIDC_ROLES_CLAIM'
  - 'DOZZLE_AUTH_OIDC_SCOPES'
  - 'DOZZLE_AUTH_PROVIDER'
  - 'DOZZLE_AUTH_TTL'
  - 'DOZZLE_AUTO_CLEANUP'
  - 'DOZZLE_AUTO_CLEANUP_TIME'
  - 'DOZZLE_AUTO_UPDATE'
  - 'DOZZLE_AUTO_UPDATE_TIME'
  - 'DOZZLE_BASE'
  - 'DOZZLE_DISABLE_AVATARS'
  - 'DOZZLE_ENABLE_ACTIONS'
  - 'DOZZLE_ENABLE_MCP'
  - 'DOZZLE_ENABLE_SHELL'
  - 'DOZZLE_FILTER'
  - 'DOZZLE_HOST_ID'
  - 'DOZZLE_HOSTNAME'
  - 'DOZZLE_IMAGE_CHECK_INTERVAL'
  - 'DOZZLE_IMAGE_CHECK_MODE'
  - 'DOZZLE_LEVEL'
  - 'DOZZLE_NO_ANALYTICS'
  - 'DOZZLE_RELEASE_CHECK_MODE'
  - 'DOZZLE_REMOTE_AGENT'
  - 'DOZZLE_REMOTE_HOST'
  - 'DOZZLE_TIMEOUT'
  - 'DOZZLE_UPDATE_CONTAINERS'
  # Set by the role
  - 'DOZZLE_ADDR'
  - 'DOZZLE_DISABLE_SETUP_WIZARD'
  - 'DOZZLE_MODE'
  # The file variables of the secrets, set by the role
  - 'DOZZLE_AUTH_GITHUB_CLIENT_SECRET_FILE'
  - 'DOZZLE_AUTH_OIDC_CLIENT_SECRET_FILE'

monitoring_dozzle__podman_name: 'dozzle'
monitoring_dozzle__podman_image: 'docker.io/amir20/dozzle'
monitoring_dozzle__podman_tag: "{{ monitoring_dozzle__version }}"

monitoring_dozzle__podman_home: "{{ monitoring_dozzle__home }}"
monitoring_dozzle__podman_data_dir: "{{ monitoring_dozzle__podman_home }}/data"
monitoring_dozzle__podman_socket: '/run/podman/podman.sock'

monitoring_dozzle__podman_container_default:
  name: "{{ monitoring_dozzle__podman_name }}"
  hostname: "{{ monitoring_dozzle__hostname }}"
  image: "{{ monitoring_dozzle__podman_image }}:{{ monitoring_dozzle__podman_tag }}"
  ip: "{{ monitoring_dozzle__ip }}"
  ipv6: "{{ monitoring_dozzle__ipv6 | default(omit) }}"
  network: "{{ monitoring_dozzle__network }}"
  timezone: "{{ monitoring_dozzle__timezone }}"
  # Set with dozzle_environment and dozzle_secrets, merged over the default
  environment: "{{ monitoring_dozzle__environment_container }}"
  labels: "{{ monitoring_dozzle__labels | default(omit) }}"
  # The secrets of monitoring_dozzle__secrets_env are passed in the environment, the others are mounted
  secrets: >-
    {{ monitoring_dozzle__podman_secrets
       if (monitoring_dozzle__secrets is sequence and monitoring_dozzle__secrets is not string and monitoring_dozzle__secrets | length > 0)
       else omit }}
  # Dozzle reads the containers of the host with the Docker API of podman
  volumes:
    - "{{ monitoring_dozzle__podman_data_dir }}:/data:Z"
    - "{{ monitoring_dozzle__podman_socket }}:/var/run/docker.sock"

# The podman secrets of dozzle_secrets, entries without name or target are left out, the validation of the secrets reports them
monitoring_dozzle__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- for secret in monitoring_dozzle__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-   if secret.target in monitoring_dozzle__secrets_env -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=env,target=' ~ secret.target) -%}
  {%-   else -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ monitoring_dozzle__secrets_dir ~ '/' ~ secret.name) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ secrets }}
