---

- name: 'Configure QuestDB backup'
  tags: [ 'backup_questdb'  ]
  block:

    - name: 'Include OS-specific variables'
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"

    - name: 'Install packages'
      ansible.builtin.apt:
        update_cache: 'yes'
        install_recommends: 'no'
        pkg: "{{ backup_questdb__packages }}"

    - name: 'Copy QuestDB backup scripts to host'
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ backup__lib_dir }}/{{ item }}"
        mode: '755'
      with_items: "{{ backup_questdb__files }}"

    - name: 'Generate QuestDB backup configuration file'
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ backup__etc_dir }}/{{ item }}"
        owner: 'root'
        group: 'root'
        mode: '640'
      with_items:
        - 'questdb'
