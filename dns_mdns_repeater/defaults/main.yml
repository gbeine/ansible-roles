---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/dns-mdns-repeater
#

# Options of the section main, every key replaces the key of the default completely, null removes it
dns_mdns_repeater__config_user: "{{ mdns_repeater_config | default({}) }}"
dns_mdns_repeater__config: >-
  {{ dns_mdns_repeater__config_default | combine(dns_mdns_repeater__config_user)
     if dns_mdns_repeater__config_user is mapping else dns_mdns_repeater__config_user }}

#
# Defaults - do not change
#

# The configuration of the package mdns-repeater (net/mdns-repeater/files/mdns_repeater.conf of the packages feed)
dns_mdns_repeater__config_default:
  enabled: true
  interface: [ 'br-lan', 'eth0.2' ]

dns_mdns_repeater__packages: [ 'mdns-repeater' ]
dns_mdns_repeater__binary: '/usr/sbin/mdns-repeater'
dns_mdns_repeater__service: 'mdns-repeater'
dns_mdns_repeater__uci_config: '/etc/config/mdns_repeater'
dns_mdns_repeater__section: 'main'
