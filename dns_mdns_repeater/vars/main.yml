---
# Options of the section main, mdns-repeater.init passes the devices of interface to mdns-repeater
dns_mdns_repeater__list_options: [ 'interface' ]
# Written as 0 and 1, enabled switches the service like in LuCI
dns_mdns_repeater__boolean_options: [ 'enabled' ]

# Linux device names, at most 15 characters
dns_mdns_repeater__device_pattern: '^[A-Za-z0-9_.@-]{1,15}$'
