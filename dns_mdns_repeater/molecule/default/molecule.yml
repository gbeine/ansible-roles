---
prerun: false
driver:
  name: 'default'
  options:
    managed: true
platforms:
  # Clones of the tart VM openwrt-base, the base VM itself is never changed
  - name: 'molecule-mdns-repeater-openwrt-default'
    image: '${MOLECULE_TART_OPENWRT_IMAGE:-openwrt-base}'
    user: 'root'
    password: '${MOLECULE_TART_OPENWRT_PASSWORD:-OpenWRT}'
    authorized_keys: '/etc/dropbear/authorized_keys'
  - name: 'molecule-mdns-repeater-openwrt'
    image: '${MOLECULE_TART_OPENWRT_IMAGE:-openwrt-base}'
    user: 'root'
    password: '${MOLECULE_TART_OPENWRT_PASSWORD:-OpenWRT}'
    authorized_keys: '/etc/dropbear/authorized_keys'
provisioner:
  name: 'ansible'
  playbooks:
    create: '../../../.molecule/tart/create.yml'
    destroy: '../../../.molecule/tart/destroy.yml'
  config_options:
    defaults:
      callback_result_format: 'yaml'
      gathering: 'explicit'
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_ROLES_PATH: '../../../'
verifier:
  name: 'ansible'
scenario:
  test_sequence:
    - 'destroy'
    - 'syntax'
    - 'create'
    - 'prepare'
    - 'converge'
    - 'idempotence'
    - 'side_effect'
    - 'verify'
    - 'destroy'
