---
dns_mdns_repeater__test_cases:

  # Without variables the role installs mdns-repeater with the delivered configuration, eth0.2 does not exist on the VM
  - name: 'molecule-mdns-repeater-openwrt-default'
    prepare_package: false
    role_vars: {}
    expect:
      uci:
        - 'mdns_repeater.main=mdns_repeater'
        - 'mdns_repeater.main.interface=br-lan eth0.2'
        - 'mdns_repeater.main.enabled=1'
      absent: [ 'mdns_repeater.molecule', 'mdns_repeater.main.molecule' ]
      # Without eth0.2 mdns-repeater does not start
      process: ''

  # prepare installs mdns-repeater, sets an option and a section the role has to remove and creates br-molecule
  - name: 'molecule-mdns-repeater-openwrt'
    prepare_package: true
    role_vars:
      mdns_repeater_config:
        enabled: true
        interface: [ 'br-lan', 'br-molecule' ]
    # side_effect changes the order of the devices, mdns-repeater has to restart with the new order
    side_effect:
      mdns_repeater_config:
        enabled: true
        interface: [ 'br-molecule', 'br-lan' ]
    expect:
      uci:
        - 'mdns_repeater.main=mdns_repeater'
        - 'mdns_repeater.main.interface=br-molecule br-lan'
        - 'mdns_repeater.main.enabled=1'
      absent: [ 'mdns_repeater.molecule', 'mdns_repeater.main.molecule' ]
      process: 'br-molecule br-lan'
