---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/openwrt-sdk
#

app_openwrt_sdk__home: "{{ openwrt_home | mandatory }}"
app_openwrt_sdk__ip: "{{ openwrt_ip | mandatory }}"
app_openwrt_sdk__ipv6: "{{ openwrt_ipv6 }}"
app_openwrt_sdk__network: "{{ openwrt_network | mandatory }}"
app_openwrt_sdk__hostname: "{{ openwrt_hostname | mandatory }}"
app_openwrt_sdk__timezone: "{{ openwrt_timezone | mandatory }}"
app_openwrt_sdk__volumes: "{{ openwrt_volumes | default([]) }}"

app_openwrt_sdk__version: "{{ openwrt_version | default('latest') }}"

app_openwrt_sdk__container: "{{ app_openwrt_sdk__podman_container_default | combine(openwrt_container | default({})) }}"

app_openwrt_sdk__autoupdate_enabled: "{{ openwrt_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

app_openwrt_sdk__uid: '1000'
app_openwrt_sdk__gid: "{{ app_openwrt_sdk__uid }}"

app_openwrt_sdk__podman_name: 'openwrt'
app_openwrt_sdk__podman_image: 'docker.io/openwrt/sdk'
app_openwrt_sdk__podman_tag: "{{ app_openwrt_sdk__version }}"

app_openwrt_sdk__podman_home: "{{ app_openwrt_sdk__home }}"

app_openwrt_sdk__openwrt_dir: "{{ app_openwrt_sdk__podman_home }}/openwrt"

app_openwrt_sdk__podman_container_default:
  name: "{{ app_openwrt_sdk__podman_name }}"
  hostname: "{{ app_openwrt_sdk__hostname }}"
  image: "{{ app_openwrt_sdk__podman_image }}:{{ app_openwrt_sdk__podman_tag }}"
  ip: "{{ app_openwrt_sdk__ip }}"
  ipv6: "{{ app_openwrt_sdk__ipv6 }}"
  network: "{{ app_openwrt_sdk__network }}"
  timezone: "{{ app_openwrt_sdk__timezone }}"
  volumes: "{{ app_openwrt_sdk__podman_volumes_default + app_openwrt_sdk__volumes }}"
  entrypoint: '["sh", "-c", "while true; do sleep 314; done"]'

app_openwrt_sdk__podman_volumes_default:
  - '/etc/timezone:/etc/timezone:ro'
  - '/etc/localtime:/etc/localtime:ro'
  - "{{ app_openwrt_sdk__openwrt_dir }}:/openwrt:rw"
