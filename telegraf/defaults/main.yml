---

#
# Substitutes - do not change
#

telegraf__home: "{{ telegraf_home | mandatory }}"

telegraf__hostname: "{{ telegraf_hostname | mandatory }}"
telegraf__ip: "{{ telegraf_ip | mandatory }}"
telegraf__ipv6: "{{ telegraf_ipv6 | default('') }}"
telegraf__network: "{{ telegraf_network | mandatory }}"
telegraf__hosts: "{{ telegraf_hosts | default({}) }}"
telegraf__version: "{{ telegraf_version | default('alpine') }}"
telegraf__timezone: "{{ telegraf_timezone | default(bootstrap_timezone__timezone) }}"

telegraf__container: "{{ telegraf__container_default | combine(telegraf_container | default({})) }}"

telegraf__agent_interval: "{{ telegraf_agent_interval | default('10s') }}"
telegraf__agent_round_interval: "{{ telegraf_agent_round_interval | default(true) }}"
telegraf__agent_metric_batch_size: "{{ telegraf_agent_metric_batch_size | default(1000) }}"
telegraf__agent_metric_buffer_limit: "{{ telegraf_agent_metric_buffer_limit | default(10000) }}"
telegraf__agent_collection_jitter: "{{ telegraf_agent_collection_jitter | default('0s') }}"
telegraf__agent_flush_interval: "{{ telegraf_agent_flush_interval | default('10s') }}"
telegraf__agent_flush_jitter: "{{ telegraf_agent_flush_jitter | default('0s') }}"
telegraf__agent_precision: "{{ telegraf_agent_precision | default('0s') }}"
telegraf__agent_omit_hostname: "{{ telegraf_agent_omit_hostname | default(true) }}"


telegraf__outputs: "{{ telegraf_outputs | mandatory }}"
telegraf__inputs: "{{ telegraf_inputs | mandatory }}"

#
# Defaults - do not change
#

telegraf__name: 'telegraf'
telegraf__image: 'docker.io/telegraf'

telegraf__volumes_default:
    - "/etc/localtime:/etc/localtime:ro"
    - "/etc/timezone:/etc/timezone:ro"
    - "{{ telegraf__home }}/telegraf.conf:/etc/telegraf/telegraf.conf"

telegraf__container_default:
    name: "{{ telegraf__name }}"
    hostname: "{{ telegraf__hostname }}"
    image: "{{ telegraf__image }}:{{ telegraf__version }}"
    ip: "{{ telegraf__ip }}"
    network: "{{ telegraf__network }}"
    restart_policy: 'always'
    hosts: "{{ telegraf__hosts }}"
    timezone: "{{ telegraf__timezone }}"
    volumes: "{{ telegraf__volumes_default }}"
