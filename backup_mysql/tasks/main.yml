---

- name: 'Configure MySQL/MariaDB backup'
  tags: [ 'backup_mysql'  ]
  block:

    - name: 'Include OS-specific variables (podman)'
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}-podman.yml"
        - "{{ ansible_distribution }}-podman.yml"
      when: 'backup_mysql__use_podman'

    - name: 'Include OS-specific variables (native)'
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_os_family }}.yml"
      when: 'not backup_mysql__use_podman'

    - name: 'Install MySQL/MariaDB packages'
      ansible.builtin.apt:
        update_cache: 'yes'
        install_recommends: 'no'
        pkg: "{{ backup_mysql__packages }}"

    - name: 'Copy MySQL/MariaDB backup scripts to host'
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ backup__lib_dir }}/{{ item }}"
        mode: '755'
      with_items: "{{ backup_mysql__files }}"

    - name: 'Generate MySQL/MariaDB backup configuration file'
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ backup__etc_dir }}/{{ item }}"
        owner: 'root'
        group: 'root'
        mode: '640'
      with_items:
        - 'mysql'
        - 'mariadb'

    - name: 'Create MySQL/MariaDB backup directory'
      ansible.builtin.file:
        mode: '750'
        owner: 'root'
        group: 'root'
        path: "{{ backup_mysql__backup_dir }}"
        state: 'directory'
