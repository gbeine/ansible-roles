---
# Network created by container_podman in prepare.yml
database_pgadmin__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

database_pgadmin__test_image: 'docker.io/dpage/pgadmin4:latest'
database_pgadmin__test_quadlet_path: '/etc/containers/systemd/pgadmin.container'

# Database started by prepare.yml, test credentials only
database_pgadmin__test_database:
  name: 'molecule-postgres'
  image: 'docker.io/library/postgres:17'
  ip: '10.89.0.20'
  user: 'molecule'
  password: 'molecule-database-password'

database_pgadmin__test_config_path: '/opt/pgadmin/config_system.py'

database_pgadmin__test_cases:

  # Only the mandatory variables, the email and the password of the admin
  - name: 'molecule-pgadmin-default'
    role_vars:
      pgadmin_home: '/opt/pgadmin'
      pgadmin_ip: '10.89.0.60'
      pgadmin_network: 'podman-molecule'
      pgadmin_hostname: 'pgadmin-default'
      pgadmin_timezone: 'Europe/Berlin'
      pgadmin_environment:
        PGADMIN_DEFAULT_EMAIL: 'molecule@molecule.dev'
      pgadmin_secrets:
        - name: 'pgadmin_default_password'
          data: 'molecule-admin-password'
          target: 'PGADMIN_DEFAULT_PASSWORD'
    # Runs again without a change, pgAdmin must not restart
    side_effect:
      role_vars: {}
    expect:
      ip: '10.89.0.60'
      ip6: ~
      quadlet:
        - 'Volume=/opt/pgadmin/data:/var/lib/pgadmin'
        - 'Volume=/opt/pgadmin/config_system.py:/etc/pgadmin/config_system.py:ro'
      # The email of the admin is only passed to the initialization, the quadlet unit has no environment
      quadlet_absent:
        - 'Environment='
        - 'Secret='
        - 'Volume=.*servers.json'
      config:
        - 'import json as _json'
      settings: {}
      login:
        email: 'molecule@molecule.dev'
        password: 'molecule-admin-password'
      servers: []
      restart: false

  # IPv6, labels, dependencies, a server in servers.json, settings of pgAdmin and the password of the mail server
  - name: 'molecule-pgadmin'
    role_vars:
      pgadmin_home: '/opt/pgadmin'
      pgadmin_ip: '10.89.0.61'
      pgadmin_ipv6: 'fd00:89::61'
      pgadmin_network: 'podman-molecule'
      pgadmin_hostname: 'pgadmin-molecule'
      pgadmin_timezone: 'Europe/Berlin'
      pgadmin_labels:
        traefik.enable: 'true'
      pgadmin_container:
        wants: [ 'network-online.target' ]
        after: [ 'network-online.target' ]
        requires_mounts_for: [ '/opt/pgadmin' ]
      pgadmin_environment:
        PGADMIN_DEFAULT_EMAIL: 'molecule@molecule.dev'
        GUNICORN_THREADS: '10'
      pgadmin_config:
        LOGIN_BANNER: 'Molecule login'
        MAIL_SERVER: 'mail.molecule.dev'
        MAIL_PORT: 25
      pgadmin_secrets:
        - name: 'pgadmin_default_password'
          data: 'molecule-admin-password'
          target: 'PGADMIN_DEFAULT_PASSWORD'
        - name: 'pgadmin_mail_password'
          data: 'molecule-mail-password'
          target: 'MAIL_PASSWORD'
      pgadmin_servers:
        Servers:
          '1':
            Name: 'Molecule PostgreSQL'
            Group: 'Servers'
            Host: '10.89.0.20'
            Port: 5432
            MaintenanceDB: 'postgres'
            Username: 'molecule'
            SSLMode: 'prefer'
    # Changes the login banner, only config_system.py changes and pgAdmin has to restart
    side_effect:
      role_vars:
        pgadmin_config:
          LOGIN_BANNER: 'Molecule login, changed'
          MAIL_SERVER: 'mail.molecule.dev'
          MAIL_PORT: 25
    expect:
      ip: '10.89.0.61'
      ip6: 'fd00:89::61'
      quadlet:
        - 'Volume=/opt/pgadmin/data:/var/lib/pgadmin'
        - 'Volume=/opt/pgadmin/config_system.py:/etc/pgadmin/config_system.py:ro'
        - 'Secret=pgadmin_mail_password,type=mount,target=/run/secrets/pgadmin_mail_password,uid=5050,gid=0,mode=0400'
        - 'Label=traefik.enable=true'
        - 'Wants=network-online.target'
        - 'After=network-online.target'
        - 'RequiresMountsFor=/opt/pgadmin'
        - 'Environment=GUNICORN_THREADS=10'
      quadlet_absent:
        - 'Environment=PGADMIN_'
        - 'Environment=TZ='
        - 'Secret=pgadmin_default_password'
        - 'Volume=.*servers.json'
      # After the change of the side effect
      config:
        - 'import json as _json'
        - 'LOGIN_BANNER = _json.loads("\"Molecule login, changed\"")'
        - 'MAIL_PORT = _json.loads("25")'
        - 'MAIL_SERVER = _json.loads("\"mail.molecule.dev\"")'
        - 'MAIL_PASSWORD = open("/run/secrets/pgadmin_mail_password").read().rstrip(chr(10))'
      # The settings as pgAdmin reads them in the container, including the password of the secret
      settings:
        LOGIN_BANNER: 'Molecule login, changed'
        MAIL_PORT: 25
        MAIL_SERVER: 'mail.molecule.dev'
        MAIL_PASSWORD: 'molecule-mail-password'
      login:
        email: 'molecule@molecule.dev'
        password: 'molecule-admin-password'
      servers:
        - 'Molecule PostgreSQL'
      restart: true
