# The data directory of pgAdmin, owned by the user of the image
database_pgadmin__data_dir: "{{ database_pgadmin__home }}/data"
database_pgadmin__data_owner: 5050
database_pgadmin__data_group: 0
database_pgadmin__servers_file: "{{ database_pgadmin__home }}/servers.json"

database_pgadmin__podman_name: 'pgadmin'
database_pgadmin__podman_image: 'docker.io/dpage/pgadmin4'
database_pgadmin__podman_tag: "{{ database_pgadmin__version }}"

database_pgadmin__podman_container_default:
  name: "{{ database_pgadmin__podman_name }}"
  hostname: "{{ database_pgadmin__hostname }}"
  image: "{{ database_pgadmin__podman_image }}:{{ database_pgadmin__podman_tag }}"
  ip: "{{ database_pgadmin__ip }}"
  ipv6: "{{ database_pgadmin__ipv6 | default(omit) }}"
  network: "{{ database_pgadmin__network }}"
  timezone: "{{ database_pgadmin__timezone }}"
  # Set with pgadmin_environment and pgadmin_secrets, merged over the default
  environment: "{{ database_pgadmin__environment | combine(database_pgadmin__environment_secrets_files) }}"
  labels: "{{ database_pgadmin__labels | default(omit) }}"
  volumes: >-
    {{ [ database_pgadmin__data_dir ~ ':/var/lib/pgadmin' ]
       + ([ database_pgadmin__servers_file ~ ':/pgadmin4/servers.json:ro' ] if database_pgadmin__servers | length > 0 else []) }}
  # The secrets of database_pgadmin__secrets_env are passed in the environment, the others are mounted
  secrets: >-
    {{ database_pgadmin__podman_secrets
       if (database_pgadmin__secrets is sequence and database_pgadmin__secrets is not string and database_pgadmin__secrets | length > 0)
       else omit }}

# The podman secrets of pgadmin_secrets, entries without name or target are left out, the validation of the secrets reports them
database_pgadmin__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- for secret in database_pgadmin__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-   if secret.target in database_pgadmin__secrets_env -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=env,target=' ~ secret.target) -%}
  {%-   else -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ database_pgadmin__secrets_dir ~ '/' ~ secret.name) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ secrets }}
