---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-pgadmin
#

database_pgadmin__home: "{{ pgadmin_home | mandatory }}"
database_pgadmin__ip: "{{ pgadmin_ip | mandatory }}"
database_pgadmin__ipv6: "{{ pgadmin_ipv6 }}"
database_pgadmin__network: "{{ pgadmin_network | mandatory }}"
database_pgadmin__hostname: "{{ pgadmin_hostname | mandatory }}"
database_pgadmin__timezone: "{{ pgadmin_timezone | mandatory }}"
database_pgadmin__labels: "{{ pgadmin_labels }}"

database_pgadmin__version: "{{ pgadmin_version | default('latest') }}"

database_pgadmin__container: "{{ database_pgadmin__podman_container_default | combine(pgadmin_container | default({})) }}"

# The configuration of the image, the settings of pgAdmin are set with PGADMIN_CONFIG_<SETTING> as Python literals
database_pgadmin__environment: "{{ database_pgadmin__environment_default | combine(pgadmin_environment | default({})) }}"

# Secrets with name, data and target, the passwords of the settings of pgAdmin without file variable are passed in the environment,
# the others are mounted below /run/secrets and the role sets the file variable of the target
database_pgadmin__secrets: "{{ pgadmin_secrets | default([]) }}"

# The content of servers.json, loaded by pgAdmin at the first start
database_pgadmin__servers: "{{ pgadmin_servers | default({}) }}"

database_pgadmin__autoupdate_enabled: "{{ pgadmin_autoupdate_enabled | default(false) }}"
database_pgadmin__autoupdate_schedule: "{{ pgadmin_autoupdate_schedule }}"

#
# Defaults - do not change
#

database_pgadmin__environment_default:
  TZ: "{{ database_pgadmin__timezone }}"

database_pgadmin__environment_required: [ 'PGADMIN_DEFAULT_EMAIL' ]

# The targets of the secrets, they must not be set in pgadmin_environment
database_pgadmin__secret_variables: "{{ database_pgadmin__secret_files.keys() | list + database_pgadmin__secrets_env }}"

# The secrets mounted as files, the image reads the variable target from the file variable
# (file_env in pkg/docker/entrypoint.sh of pgAdmin 9.19)
database_pgadmin__secret_files:
  PGADMIN_DEFAULT_PASSWORD: 'PGADMIN_DEFAULT_PASSWORD_FILE'
  PGADMIN_CONFIG_CONFIG_DATABASE_URI: 'PGADMIN_CONFIG_CONFIG_DATABASE_URI_FILE'

# The secrets passed in the environment, the image has no file variable for these settings of pgAdmin
database_pgadmin__secrets_env:
  - 'PGADMIN_CONFIG_MAIL_PASSWORD'
  - 'PGADMIN_CONFIG_LDAP_BIND_PASSWORD'
  - 'PGADMIN_CONFIG_WEBSERVER_SHARED_SECRET'

database_pgadmin__secrets_required: [ 'PGADMIN_DEFAULT_PASSWORD' ]

database_pgadmin__secrets_dir: '/run/secrets'

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
database_pgadmin__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if database_pgadmin__secrets is sequence and database_pgadmin__secrets is not string and database_pgadmin__secrets is not mapping -%}
  {%-   for secret in database_pgadmin__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in database_pgadmin__secret_files -%}
  {%-     set _ = environment.update({ database_pgadmin__secret_files[secret.target]: database_pgadmin__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The variables of pkg/docker/entrypoint.sh of pgAdmin 9.19 and the settings of web/config.py, update with new versions of the image
database_pgadmin__environment_allowed:
  - 'PGADMIN_DEFAULT_EMAIL'
  - 'PGADMIN_DISABLE_POSTFIX'
  - 'PGADMIN_ENABLE_TLS'
  - 'PGADMIN_ENABLE_SOCK'
  - 'PGADMIN_LISTEN_ADDRESS'
