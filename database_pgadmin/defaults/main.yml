# The data directory of pgAdmin, owned by the user of the image
database_pgadmin__data_dir: "{{ database_pgadmin__home }}/data"
database_pgadmin__data_owner: 5050
database_pgadmin__data_group: 0
database_pgadmin__servers_file: "{{ database_pgadmin__home }}/servers.json"

database_pgadmin__podman_name: 'pgadmin'
database_pgadmin__podman_image: 'docker.io/dpage/pgadmin4'
database_pgadmin__podman_tag: "{{ database_pgadmin__version }}"

database_pgadmin__config_file: "{{ database_pgadmin__home }}/config_system.py"

# The variables and the secrets of the initialization are not part of the quadlet unit
database_pgadmin__podman_container_default:
  name: "{{ database_pgadmin__podman_name }}"
  hostname: "{{ database_pgadmin__hostname }}"
  image: "{{ database_pgadmin__podman_image }}:{{ database_pgadmin__podman_tag }}"
  ip: "{{ database_pgadmin__ip }}"
  ipv6: "{{ database_pgadmin__ipv6 | default(omit) }}"
  network: "{{ database_pgadmin__network }}"
  timezone: "{{ database_pgadmin__timezone }}"
  # Without pgadmin_environment the quadlet unit has no environment
  environment: >-
    {{ (database_pgadmin__environment | dict2items | rejectattr('key', 'in', database_pgadmin__environment_init) | items2dict)
       if (database_pgadmin__environment is defined and database_pgadmin__environment is mapping
           and database_pgadmin__environment.keys() | reject('in', database_pgadmin__environment_init) | list | length > 0)
       else omit }}
  labels: "{{ database_pgadmin__labels | default(omit) }}"
  volumes:
    - "{{ database_pgadmin__data_dir }}:/var/lib/pgadmin"
    - "{{ database_pgadmin__config_file }}:/etc/pgadmin/config_system.py:ro"
  # The secrets of the settings, read by config_system.py as the user of the image
  secrets: "{{ database_pgadmin__podman_secrets if database_pgadmin__podman_secrets | length > 0 else omit }}"

database_pgadmin__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- for target, name in database_pgadmin__secret_names.items() if target in database_pgadmin__secrets_config -%}
  {%-   set _ = secrets.append(name ~ ',type=mount,target=' ~ database_pgadmin__secrets_dir ~ '/' ~ name
                               ~ ',uid=' ~ database_pgadmin__data_owner ~ ',gid=' ~ database_pgadmin__data_group ~ ',mode=0400') -%}
  {%- endfor -%}
  {{ secrets }}

# The environment of the container of the initialization: pgadmin_environment, the file variable of the password of the admin,
# the settings the entrypoint reads from the environment for the desktop mode and an external configuration database
database_pgadmin__init_environment: >-
  {%- set environment = dict(database_pgadmin__environment if database_pgadmin__environment is defined and database_pgadmin__environment is mapping else {}) -%}
  {%- for target, name in database_pgadmin__secret_names.items() -%}
  {%-   if target in database_pgadmin__secret_files -%}
  {%-     set _ = environment.update({ database_pgadmin__secret_files[target]: database_pgadmin__secrets_dir ~ '/' ~ name }) -%}
  {%-   elif target == 'CONFIG_DATABASE_URI' -%}
  {%-     set _ = environment.update({ 'PGADMIN_CONFIG_CONFIG_DATABASE_URI_FILE': database_pgadmin__secrets_dir ~ '/' ~ name }) -%}
  {%-   endif -%}
  {%- endfor -%}
  {%- if database_pgadmin__config is mapping and database_pgadmin__config.SERVER_MODE is defined and database_pgadmin__config.SERVER_MODE is false -%}
  {%-   set _ = environment.update({ 'PGADMIN_CONFIG_SERVER_MODE': 'False' }) -%}
  {%- endif -%}
  {{ environment }}

# The image creates pgadmin4.db with the admin and loads servers.json if the database is missing
database_pgadmin__initialized_path: "{{ database_pgadmin__data_dir }}/pgadmin4.db"

# The message of gunicorn after the initialization
database_pgadmin__init_message: 'Listening at:'

database_pgadmin__podman_init_name: "{{ database_pgadmin__container.name }}-init"

# All secrets are mounted in the container of the initialization for the user of the image
database_pgadmin__podman_init_secrets: >-
  {%- set secrets = [] -%}
  {%- for target, name in database_pgadmin__secret_names.items() -%}
  {%-   set _ = secrets.append(name ~ ',type=mount,target=' ~ database_pgadmin__secrets_dir ~ '/' ~ name
                               ~ ',uid=' ~ database_pgadmin__data_owner ~ ',gid=' ~ database_pgadmin__data_group ~ ',mode=0400') -%}
  {%- endfor -%}
  {{ secrets }}

database_pgadmin__podman_init_volumes: >-
  {{ database_pgadmin__container.volumes
     + ([ database_pgadmin__servers_file ~ ':/pgadmin4/servers.json:ro' ] if database_pgadmin__servers is mapping and database_pgadmin__servers | length > 0 else []) }}
