---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-pgadmin
#

database_pgadmin__home: "{{ pgadmin_home | mandatory }}"
database_pgadmin__ip: "{{ pgadmin_ip | mandatory }}"
database_pgadmin__ipv6: "{{ pgadmin_ipv6 }}"
database_pgadmin__network: "{{ pgadmin_network | mandatory }}"
database_pgadmin__hostname: "{{ pgadmin_hostname | mandatory }}"
database_pgadmin__timezone: "{{ pgadmin_timezone | mandatory }}"
database_pgadmin__labels: "{{ pgadmin_labels }}"

database_pgadmin__version: "{{ pgadmin_version | default('latest') }}"

database_pgadmin__container: "{{ database_pgadmin__podman_container_default | combine(pgadmin_container | default({})) }}"

# The settings of pgAdmin, written to /etc/pgadmin/config_system.py, there is no default
database_pgadmin__config: "{{ pgadmin_config | default({}) }}"

# The variables of the image that are no settings of pgAdmin, there is no default
database_pgadmin__environment: "{{ pgadmin_environment }}"

# Secrets with name, data and target, mounted below /run/secrets: the passwords of the settings are read in config_system.py,
# the password of the admin is only mounted in the container of the initialization
database_pgadmin__secrets: "{{ pgadmin_secrets | default([]) }}"

# The content of servers.json, loaded by the initialization
database_pgadmin__servers: "{{ pgadmin_servers | default({}) }}"

database_pgadmin__autoupdate_enabled: "{{ pgadmin_autoupdate_enabled | default(false) }}"
database_pgadmin__autoupdate_schedule: "{{ pgadmin_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The settings of pgAdmin checked for their type (validate_config_variable in web/pgadmin/evaluate_config.py of pgAdmin 9.19)
database_pgadmin__config_boolean: [ 'SERVER_MODE', 'ENHANCED_COOKIE_PROTECTION', 'SUPPORT_SSH_TUNNEL', 'ALLOW_SAVE_TUNNEL_PASSWORD', 'MASTER_PASSWORD_REQUIRED' ]
database_pgadmin__config_integer:
  - 'DEFAULT_SERVER_PORT'
  - 'SERVER_HEARTBEAT_TIMEOUT'
  - 'LOG_ROTATION_SIZE'
  - 'LOG_ROTATION_AGE'
  - 'LOG_ROTATION_MAX_LOG_FILES'
  - 'MAX_SESSION_IDLE_TIME'

# The settings carrying secrets, config_system.py reads them from the files of the secrets
database_pgadmin__secrets_config: [ 'MAIL_PASSWORD', 'LDAP_BIND_PASSWORD', 'WEBSERVER_SHARED_SECRET', 'CONFIG_DATABASE_URI' ]

# The password of the admin, the initialization reads it from the file variable (file_env in pkg/docker/entrypoint.sh of pgAdmin 9.19)
database_pgadmin__secret_files:
  PGADMIN_DEFAULT_PASSWORD: 'PGADMIN_DEFAULT_PASSWORD_FILE'

database_pgadmin__secrets_allowed: "{{ database_pgadmin__secrets_config + database_pgadmin__secret_files.keys() | list }}"

# The targets and the file variables must not be set in pgadmin_environment
database_pgadmin__secret_variables: "{{ database_pgadmin__secrets_allowed + database_pgadmin__secret_files.values() | list + [ 'PGADMIN_CONFIG_CONFIG_DATABASE_URI_FILE' ] }}"

database_pgadmin__secrets_required: [ 'PGADMIN_DEFAULT_PASSWORD' ]

database_pgadmin__secrets_dir: '/run/secrets'

# The secrets by their target, entries without name or target are left out, the validation of the secrets reports them
database_pgadmin__secret_names: >-
  {%- set names = {} -%}
  {%- if database_pgadmin__secrets is sequence and database_pgadmin__secrets is not string and database_pgadmin__secrets is not mapping -%}
  {%-   for secret in database_pgadmin__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-     set _ = names.update({ secret.target: secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ names }}

# The lines of config_system.py: every setting is a JSON literal read with json.loads, the secrets are read from their files,
# null removes a setting
database_pgadmin__config_lines: >-
  {%- set lines = [ '#', '# Ansible managed', '#', 'import json as _json', '' ] -%}
  {%- if database_pgadmin__config is mapping -%}
  {%-   for key, value in (database_pgadmin__config.items() | sort) if value is not none -%}
  {%-     set _ = lines.append(key ~ ' = _json.loads(' ~ (value | to_json | to_json) ~ ')') -%}
  {%-   endfor -%}
  {%- endif -%}
  {%- for target, name in (database_pgadmin__secret_names.items() | sort) if target in database_pgadmin__secrets_config -%}
  {%-   set _ = lines.append(target ~ ' = open(' ~ (database_pgadmin__secrets_dir ~ '/' ~ name) | to_json ~ ').read().rstrip(chr(10))') -%}
  {%- endfor -%}
  {{ lines }}

database_pgadmin__environment_required: [ 'PGADMIN_DEFAULT_EMAIL' ]

# The variables only read by the initialization (pkg/docker/entrypoint.sh of pgAdmin 9.19)
database_pgadmin__environment_init: [ 'PGADMIN_DEFAULT_EMAIL' ]

# The variables of pkg/docker/entrypoint.sh of pgAdmin 9.19 without the settings PGADMIN_CONFIG_*, which are set with pgadmin_config,
# and without the variables of the initialization managed by the role (servers.json, preferences, pgpass, config_distro.py),
# update with new versions of the image
database_pgadmin__environment_allowed:
  - 'PGADMIN_DEFAULT_EMAIL'
  - 'PGADMIN_DISABLE_POSTFIX'
  - 'PGADMIN_ENABLE_TLS'
  - 'PGADMIN_ENABLE_SOCK'
  - 'PGADMIN_LISTEN_ADDRESS'
  - 'PGADMIN_LISTEN_PORT'
  - 'PUID'
  - 'PGID'
  - 'GUNICORN_ACCESS_LOGFILE'
  - 'GUNICORN_LIMIT_REQUEST_FIELDS'
  - 'GUNICORN_LIMIT_REQUEST_FIELD_SIZE'
  - 'GUNICORN_LIMIT_REQUEST_LINE'
  - 'GUNICORN_THREADS'
  - 'TZ'

# Generated from the settings of web/config.py of pgAdmin 9.19 without the settings carrying secrets, update with new versions of the image
