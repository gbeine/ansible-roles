---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-pgadmin
#

database_pgadmin__ip: "{{ pgadmin_ip | mandatory }}"
database_pgadmin__ipv6: "{{ pgadmin_ipv6 | default('') }}"
database_pgadmin__network: "{{ pgadmin_network | mandatory }}"
database_pgadmin__hostname: "{{ pgadmin_hostname | mandatory }}"
database_pgadmin__timezone: "{{ pgadmin_timezone | mandatory }}"
database_pgadmin__labels: "{{ pgadmin_labels | default({}) }}"

database_pgadmin__user: "{{ pgadmin_user | mandatory }}"
database_pgadmin__pass: "{{ pgadmin_pass | mandatory }}"

database_pgadmin__container: "{{ database_pgadmin__podman_container_default | combine(pgadmin_container | default({})) }}"

#
# Defaults - do not change
#

database_pgadmin__podman_name: 'pgadmin'
database_pgadmin__podman_image: 'docker.io/dpage/pgadmin4'
database_pgadmin__podman_tag: "{{ pgadmin_version | default('latest') }}"

database_pgadmin__podman_container_default:
  name: "{{ database_pgadmin__podman_name }}"
  hostname: "{{ database_pgadmin__hostname }}"
  image: "{{ database_pgadmin__podman_image }}:{{ database_pgadmin__podman_tag }}"
  ip: "{{ database_pgadmin__ip }}"
  ipv6: "{{ database_pgadmin__ipv6 }}"
  network: "{{ database_pgadmin__network }}"
  timezone: "{{ database_pgadmin__timezone }}"
  environment:
    PGADMIN_DEFAULT_EMAIL: "{{ database_pgadmin__user }}"
  labels: "{{ database_pgadmin__labels }}"
  secrets:
    - "pgadmin_password,type=env,target=PGADMIN_DEFAULT_PASSWORD"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
  restart_policy: 'always'
