---

- name: 'Install pgAdmin'
  tags: [ 'database', 'database_pgadmin' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or pgadmin_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - database_pgadmin__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - database_pgadmin__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_pgadmin__invalid | join('. ') }}"
        quiet: true
      vars:
        database_pgadmin__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = database_pgadmin__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('pgadmin_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('pgadmin_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of pgadmin_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - database_pgadmin__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_pgadmin__errors | join(' ') }}"
        quiet: true
      vars:
        database_pgadmin__secret_targets: "{{ database_pgadmin__secrets | map(attribute='target') | list }}"
        database_pgadmin__environment_set: >-
          {{ database_pgadmin__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list }}
        database_pgadmin__environment_missing: >-
          {{ database_pgadmin__environment_required | reject('in', database_pgadmin__environment_set) | list }}
        database_pgadmin__secrets_missing: >-
          {{ database_pgadmin__secrets_required | reject('in', database_pgadmin__secret_targets) | list }}
        database_pgadmin__secrets_in_environment: >-
          {{ (database_pgadmin__secret_targets + database_pgadmin__secret_variables + database_pgadmin__secret_files.values() | list)
             | select('in', database_pgadmin__environment.keys() | list) | unique | list }}
        database_pgadmin__errors: >-
          {%- set errors = [] -%}
          {%- if database_pgadmin__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('pgAdmin needs the environment variables ' ~ (database_pgadmin__environment_required | join(', ')) ~ ', missing or empty: ' ~ (database_pgadmin__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if database_pgadmin__servers is not mapping
                 or (database_pgadmin__servers | length > 0 and database_pgadmin__servers.get('Servers') is not mapping) -%}
          {%-   set _ = errors.append('pgadmin_servers has to be a dictionary with Servers, the content of servers.json.') -%}
          {%- endif -%}
          {%- if database_pgadmin__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('pgAdmin needs the secrets ' ~ (database_pgadmin__secrets_required | join(', ')) ~ ', missing: ' ~ (database_pgadmin__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if database_pgadmin__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets and their file variables must not be set in pgadmin_environment: ' ~ (database_pgadmin__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging pgadmin_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - database_pgadmin__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_pgadmin__errors | join(' ') }}"
        quiet: true
      vars:
        database_pgadmin__environment_unknown: >-
          {{ (database_pgadmin__container.environment | default({})).keys() | reject('in', database_pgadmin__environment_allowed) | list }}
        database_pgadmin__secrets_unknown: >-
          {{ database_pgadmin__secrets | map(attribute='target')
             | reject('in', database_pgadmin__secret_files.keys() | list + database_pgadmin__secrets_env) | list }}
        database_pgadmin__errors: >-
          {%- set errors = [] -%}
          {%- if database_pgadmin__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (database_pgadmin__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if database_pgadmin__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (database_pgadmin__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the variables of the image and the settings of pgAdmin (database_pgadmin__environment_allowed) and the secrets ' ~ ((database_pgadmin__secret_files.keys() | list + database_pgadmin__secrets_env) | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create the directories'
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        state: 'directory'
      loop:
        - path: "{{ database_pgadmin__home }}"
          owner: 'root'
          group: 'root'
          mode: '0750'
        # pgAdmin runs as the user of the image and keeps its database, sessions and storage below /var/lib/pgadmin
        - path: "{{ database_pgadmin__data_dir }}"
          owner: "{{ database_pgadmin__data_owner }}"
          group: "{{ database_pgadmin__data_group }}"
          mode: '0700'
      loop_control:
        label: "{{ item.path }}"

    - name: 'Create servers.json'
      ansible.builtin.copy:
        content: "{{ database_pgadmin__servers | to_nice_json }}\n"
        dest: "{{ database_pgadmin__servers_file }}"
        owner: 'root'
        group: 'root'
        mode: '0644'
      when: 'database_pgadmin__servers | length > 0'
      register: 'database_pgadmin__servers_result'

    - name: 'Remove servers.json without pgadmin_servers'
      ansible.builtin.file:
        path: "{{ database_pgadmin__servers_file }}"
        state: 'absent'
      when: 'database_pgadmin__servers | length == 0'

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ database_pgadmin__secrets }}"
      register: 'database_pgadmin__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ database_pgadmin__container.name }}"
        hostname: "{{ database_pgadmin__container.hostname }}"
        image: "{{ database_pgadmin__container.image }}"
        ip: "{{ database_pgadmin__container.ip }}"
        ip6: "{{ database_pgadmin__container.ipv6 | default(omit) }}"
        network: "{{ database_pgadmin__container.network }}"
        timezone: "{{ database_pgadmin__container.timezone }}"
        env: "{{ database_pgadmin__container.environment | default(omit) }}"
        etc_hosts: "{{ database_pgadmin__container.etc_hosts | default(omit) }}"
        expose: "{{ database_pgadmin__container.expose | default(omit) }}"
        label: "{{ database_pgadmin__container.labels | default(omit) }}"
        publish: "{{ database_pgadmin__container.publish | default(omit) }}"
        secrets: "{{ database_pgadmin__container.secrets | default(omit) }}"
        volume: "{{ database_pgadmin__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if database_pgadmin__container.requires is defined %}
          Requires={{ database_pgadmin__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'database_pgadmin__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ database_pgadmin__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if database_pgadmin__restart | bool else 'started' }}"
        enabled: true
      vars:
        database_pgadmin__running: >-
          {{ (ansible_facts.services[database_pgadmin__container.name + '.service'].state | default('')) == 'running' }}
        database_pgadmin__restart: >-
          {{ database_pgadmin__running | bool
             and (database_pgadmin__secrets_result is changed
                  or database_pgadmin__quadlet_result is changed
                  or database_pgadmin__servers_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'database_pgadmin__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ database_pgadmin__container.name }}"
        container_image: "{{ database_pgadmin__container.image }}"
        container_schedule: "{{ database_pgadmin__autoupdate_schedule }}"
