---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/open-webui
#

app_open_webui__home: "{{ open_webui_home | mandatory }}"
app_open_webui__ip: "{{ open_webui_ip | mandatory }}"
app_open_webui__ipv6: "{{ open_webui_ipv6 }}"
app_open_webui__network: "{{ open_webui_network | mandatory }}"
app_open_webui__hostname: "{{ open_webui_hostname | mandatory }}"
app_open_webui__timezone: "{{ open_webui_timezone | mandatory }}"
app_open_webui__labels: "{{ open_webui_labels }}"

app_open_webui__version: "{{ open_webui_version | default('0.13') }}"

app_open_webui__container: "{{ app_open_webui__podman_container_default | combine(open_webui_container | default({})) }}"

# The configuration of Open WebUI, the values are stored in its database on the first start
app_open_webui__environment: "{{ open_webui_environment | default({}) }}"

# Secrets with name, data and target, WEBUI_SECRET_KEY is mandatory
app_open_webui__secrets: "{{ open_webui_secrets | default([]) }}"

# The first administrator with name, email and password, created by the initialization
app_open_webui__admin: "{{ open_webui_admin | mandatory }}"

app_open_webui__autoupdate_enabled: "{{ open_webui_autoupdate_enabled | default(false) }}"
app_open_webui__autoupdate_schedule: "{{ open_webui_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_open_webui__podman_name: 'open-webui'
app_open_webui__podman_image: 'ghcr.io/open-webui/open-webui'
app_open_webui__podman_tag: "{{ app_open_webui__version }}"

app_open_webui__podman_home: "{{ app_open_webui__home }}"
app_open_webui__podman_data_dir: "{{ app_open_webui__podman_home }}/data"

app_open_webui__port: 8080

# WEBUI_SECRET_KEY signs the sessions, without it start.sh creates a new key outside of the volume with every container
app_open_webui__secrets_required: [ 'WEBUI_SECRET_KEY' ]
app_open_webui__secrets_dir: '/run/secrets'

# start.sh reads WEBUI_SECRET_KEY from the file WEBUI_SECRET_KEY_FILE, the other secrets only from the environment
app_open_webui__secret_files:
  WEBUI_SECRET_KEY: 'WEBUI_SECRET_KEY_FILE'

# The variables of the initialization, set by the role from open_webui_admin
app_open_webui__environment_init: [ 'WEBUI_ADMIN_EMAIL', 'WEBUI_ADMIN_NAME', 'WEBUI_ADMIN_PASSWORD' ]

# The database of SQLite, Open WebUI is initialized if it exists or the quadlet unit exists
app_open_webui__initialized_file: "{{ app_open_webui__podman_data_dir }}/webui.db"
app_open_webui__podman_init_name: "{{ app_open_webui__container.name }}-init"

# The podman secret of the password of the administrator, only used by the initialization
app_open_webui__admin_secret: "{{ (open_webui_container | default({})).name | default(app_open_webui__podman_name) | replace('-', '_') }}_admin_password"
app_open_webui__admin_keys: [ 'name', 'email', 'password' ]
app_open_webui__admin_email_pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
app_open_webui__password_length: 8

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
app_open_webui__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if app_open_webui__secrets is sequence and app_open_webui__secrets is not string and app_open_webui__secrets is not mapping -%}
  {%-   for secret in app_open_webui__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in app_open_webui__secret_files -%}
  {%-     set _ = environment.update({ app_open_webui__secret_files[secret.target]: app_open_webui__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The podman secrets of open_webui_secrets, WEBUI_SECRET_KEY as file, the others in the environment
app_open_webui__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- if app_open_webui__secrets is sequence and app_open_webui__secrets is not string and app_open_webui__secrets is not mapping -%}
  {%-   for secret in app_open_webui__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-     if secret.target in app_open_webui__secret_files -%}
  {%-       set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ app_open_webui__secrets_dir ~ '/' ~ secret.name) -%}
  {%-     else -%}
  {%-       set _ = secrets.append(secret.name ~ ',type=env,target=' ~ secret.target) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ secrets }}

app_open_webui__podman_container_default:
  name: "{{ app_open_webui__podman_name }}"
  hostname: "{{ app_open_webui__hostname }}"
  image: "{{ app_open_webui__podman_image }}:{{ app_open_webui__podman_tag }}"
  ip: "{{ app_open_webui__ip }}"
  ipv6: "{{ app_open_webui__ipv6 | default(omit) }}"
  network: "{{ app_open_webui__network }}"
  timezone: "{{ app_open_webui__timezone }}"
  labels: "{{ app_open_webui__labels | default(omit) }}"
  # Set with open_webui_environment, the file of WEBUI_SECRET_KEY is set by the role
  environment: "{{ app_open_webui__environment_secrets_files | combine(app_open_webui__environment) }}"
  volumes:
    - "{{ app_open_webui__podman_data_dir }}:/app/backend/data"
  secrets: "{{ app_open_webui__podman_secrets if app_open_webui__podman_secrets | length > 0 else omit }}"

