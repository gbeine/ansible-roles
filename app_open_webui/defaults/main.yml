---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/open-webui
#

app_open_webui__home: "{{ open_webui_home | mandatory }}"
app_open_webui__ip: "{{ open_webui_ip | mandatory }}"
app_open_webui__ipv6: "{{ open_webui_ipv6 }}"
app_open_webui__network: "{{ open_webui_network | mandatory }}"
app_open_webui__hostname: "{{ open_webui_hostname | mandatory }}"
app_open_webui__timezone: "{{ open_webui_timezone | mandatory }}"
app_open_webui__labels: "{{ open_webui_labels | default({}) }}"
app_open_webui__secrets: "{{ open_webui_secrets | default([]) }}"

app_open_webui__version: "{{ open_webui_version | default('main') }}"

app_open_webui__container: "{{ app_open_webui__container_default | combine(open_webui_container | default({})) }}"

app_open_webui__autoupdate_enabled: "{{ open_webui_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

app_open_webui__podman_name: 'open-webui'
app_open_webui__podman_image: 'ghcr.io/open-webui/open-webui'
app_open_webui__podman_tag: "{{ app_open_webui__version }}"

app_open_webui__podman_home: "{{ app_open_webui__home }}"

app_open_webui__container_default:
  name: "{{ app_open_webui__podman_name }}"
  hostname: "{{ app_open_webui__hostname }}"
  image: "{{ app_open_webui__podman_image }}:{{ app_open_webui__podman_tag }}"
  ip: "{{ app_open_webui__ip }}"
  ipv6: "{{ app_open_webui__ipv6 | default(omit) }}"
  network: "{{ app_open_webui__network }}"
  timezone: "{{ app_open_webui__timezone }}"
  labels: "{{ app_open_webui__labels }}"
  secrets: >-
    {{ (app_open_webui__secrets | map(attribute='name') | zip(app_open_webui__secrets | map(attribute='target')) | map('join', ',type=env,target=') | list)
      if (app_open_webui__secrets | default([]) | length > 0)
      else omit }}
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_open_webui__podman_home }}:/app/backend/data"
