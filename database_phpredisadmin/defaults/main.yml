---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-phpredisadmin
#

database_phpredisadmin__ip: "{{ phpredisadmin_ip | mandatory }}"
database_phpredisadmin__ipv6: "{{ phpredisadmin_ipv6 }}"
database_phpredisadmin__network: "{{ phpredisadmin_network | mandatory }}"
database_phpredisadmin__hostname: "{{ phpredisadmin_hostname | mandatory }}"
database_phpredisadmin__timezone: "{{ phpredisadmin_timezone | mandatory }}"
database_phpredisadmin__labels: "{{ phpredisadmin_labels | default({}) }}"

database_phpredisadmin__admin_user: "{{ phpredisadmin_admin_user | default('pra') }}"
database_phpredisadmin__admin_password: "{{ phpredisadmin_admin_password | mandatory }}"

database_phpredisadmin__container: "{{ database_phpredisadmin__podman_container_default | combine(phpredisadmin_container | default({})) }}"

database_phpredisadmin__autoupdate_enabled: "{{ phpredisadmin_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

database_phpredisadmin__podman_name: 'phpredisadmin'
database_phpredisadmin__podman_image: 'docker.io/erikdubbelboer/phpredisadmin'
database_phpredisadmin__podman_tag: 'latest'

database_phpredisadmin__podman_container_default:
  name: "{{ database_phpredisadmin__podman_name }}"
  hostname: "{{ database_phpredisadmin__hostname }}"
  image: "{{ database_phpredisadmin__podman_image }}:{{ database_phpredisadmin__podman_tag }}"
  ip: "{{ database_phpredisadmin__ip }}"
  ipv6: "{{ database_phpredisadmin__ipv6 }}"
  network: "{{ database_phpredisadmin__network }}"
  timezone: "{{ database_phpredisadmin__timezone }}"
  environment:
    ADMIN_USER: "{{ database_phpredisadmin__admin_user }}"
  labels: "{{ database_phpredisadmin__labels }}"
  secrets:
    - "pra_admin_password,type=env,target=ADMIN_PASS"
