---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-phpredisadmin
#

database_phpredisadmin__ip: "{{ phpredisadmin_ip | mandatory }}"
database_phpredisadmin__ipv6: "{{ phpredisadmin_ipv6 }}"
database_phpredisadmin__network: "{{ phpredisadmin_network | mandatory }}"
database_phpredisadmin__hostname: "{{ phpredisadmin_hostname | mandatory }}"
database_phpredisadmin__timezone: "{{ phpredisadmin_timezone | mandatory }}"
database_phpredisadmin__labels: "{{ phpredisadmin_labels }}"

database_phpredisadmin__version: "{{ phpredisadmin_version | default('latest') }}"

database_phpredisadmin__container: "{{ database_phpredisadmin__podman_container_default | combine(phpredisadmin_container | default({})) }}"

# The configuration of the image, see includes/config.environment.inc.php of phpRedisAdmin
database_phpredisadmin__environment: "{{ database_phpredisadmin__environment_default | combine(phpredisadmin_environment | default({})) }}"

# The numbers of the Redis servers, e.g. { redis: [ 1, 2 ] } allows REDIS_1_* and REDIS_2_*
database_phpredisadmin__keys: "{{ phpredisadmin_keys | default({}) }}"

# Secrets with name, data and target, ADMIN_PASS is passed in the environment,
# the others are mounted below /run/secrets and the role sets the file variable of the target
database_phpredisadmin__secrets: "{{ phpredisadmin_secrets | default([]) }}"

database_phpredisadmin__autoupdate_enabled: "{{ phpredisadmin_autoupdate_enabled | default(false) }}"
database_phpredisadmin__autoupdate_schedule: "{{ phpredisadmin_autoupdate_schedule }}"

#
# Defaults - do not change
#

database_phpredisadmin__environment_default:
  TZ: "{{ database_phpredisadmin__timezone }}"

database_phpredisadmin__environment_required: []

database_phpredisadmin__keys_families: [ 'redis' ]

# The valid keys of phpredisadmin_keys, entries of the wrong type are left out, the validation reports them
database_phpredisadmin__keys_valid: >-
  {%- set keys = {} -%}
  {%- for family in database_phpredisadmin__keys_families -%}
  {%-   set values = database_phpredisadmin__keys[family] | default([]) if database_phpredisadmin__keys is mapping else [] -%}
  {%-   set _ = keys.update({ family: (values | select('integer') | select('ge', 1) | list)
                                      if values is sequence and values is not string and values is not mapping else [] }) -%}
  {%- endfor -%}
  {{ keys }}

# The targets of the secrets, they must not be set in phpredisadmin_environment
database_phpredisadmin__secret_variables: "{{ database_phpredisadmin__secret_files.keys() | list + database_phpredisadmin__secrets_env }}"

# The secrets mounted as files, the image reads the variable target from the file variable
database_phpredisadmin__secret_files: "{{ database_phpredisadmin__secret_files_options | combine(database_phpredisadmin__secret_files_keys) }}"

database_phpredisadmin__secret_files_options: {}

# Generated from includes/config.environment.inc.php of phpRedisAdmin v1.28.0, REDIS_<n>_AUTH is read from REDIS_<n>_AUTH_FILE
database_phpredisadmin__secret_files_keys: >-
  {%- set files = {} -%}
  {%- for key in database_phpredisadmin__keys_valid.redis -%}
  {%-   set _ = files.update({ 'REDIS_' ~ key ~ '_AUTH': 'REDIS_' ~ key ~ '_AUTH_FILE' }) -%}
  {%- endfor -%}
  {{ files }}

# The secrets passed in the environment, the image reads ADMIN_PASS only with getenv
database_phpredisadmin__secrets_env: [ 'ADMIN_PASS' ]

database_phpredisadmin__secrets_required: []

database_phpredisadmin__secrets_dir: '/run/secrets'

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
database_phpredisadmin__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if database_phpredisadmin__secrets is sequence and database_phpredisadmin__secrets is not string and database_phpredisadmin__secrets is not mapping -%}
  {%-   for secret in database_phpredisadmin__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in database_phpredisadmin__secret_files -%}
  {%-     set _ = environment.update({ database_phpredisadmin__secret_files[secret.target]: database_phpredisadmin__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

database_phpredisadmin__environment_allowed: "{{ database_phpredisadmin__environment_allowed_options + database_phpredisadmin__environment_allowed_keys }}"

# Generated from includes/config.environment.inc.php and Dockerfile of phpRedisAdmin v1.28.0,
# update with new versions of the image
database_phpredisadmin__environment_allowed_options:
  - 'COOKIE_AUTH'
  - 'COUNT_ELEMENTS_PAGE'
  - 'FASTER'
  - 'FILTER'
  - 'HIDE_EMPTY_DBS'
  - 'KEYS'
  - 'MAX_KEY_LEN'
  - 'SCAN_SIZE'
  - 'SCAN_MAX'
  - 'SEPERATOR'
  - 'SHOW_EMPTY_NAMESPACE_AS_KEY'
  - 'ADMIN_USER'
  - 'ALLOW_NO_AUTH'
  - 'PORT'
  - 'TZ'

# The options of the Redis servers and the file variables of their passwords, set by the role
database_phpredisadmin__environment_allowed_keys: >-
  {%- set names = [] -%}
  {%- for key in database_phpredisadmin__keys_valid.redis -%}
  {%-   for option in [ 'NAME', 'HOST', 'PORT', 'SCHEME', 'DATABASES', 'AUTH_FILE' ] -%}
  {%-     set _ = names.append('REDIS_' ~ key ~ '_' ~ option) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ names }}

database_phpredisadmin__podman_name: 'phpredisadmin'
database_phpredisadmin__podman_image: 'docker.io/erikdubbelboer/phpredisadmin'
database_phpredisadmin__podman_tag: "{{ database_phpredisadmin__version }}"

database_phpredisadmin__podman_container_default:
  name: "{{ database_phpredisadmin__podman_name }}"
  hostname: "{{ database_phpredisadmin__hostname }}"
  image: "{{ database_phpredisadmin__podman_image }}:{{ database_phpredisadmin__podman_tag }}"
  ip: "{{ database_phpredisadmin__ip }}"
  ipv6: "{{ database_phpredisadmin__ipv6 | default(omit) }}"
  network: "{{ database_phpredisadmin__network }}"
  timezone: "{{ database_phpredisadmin__timezone }}"
  # Set with phpredisadmin_environment and phpredisadmin_secrets, merged over the default
  environment: "{{ database_phpredisadmin__environment | combine(database_phpredisadmin__environment_secrets_files) }}"
  labels: "{{ database_phpredisadmin__labels | default(omit) }}"
  # The secrets of database_phpredisadmin__secrets_env are passed in the environment, the others are mounted
  secrets: >-
    {{ database_phpredisadmin__podman_secrets
       if (database_phpredisadmin__secrets is sequence and database_phpredisadmin__secrets is not string and database_phpredisadmin__secrets | length > 0)
       else omit }}

# The podman secrets of phpredisadmin_secrets, entries without name or target are left out, the validation of the secrets reports them
database_phpredisadmin__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- for secret in database_phpredisadmin__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-   if secret.target in database_phpredisadmin__secrets_env -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=env,target=' ~ secret.target) -%}
  {%-   else -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ database_phpredisadmin__secrets_dir ~ '/' ~ secret.name) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ secrets }}
