---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    database_phpredisadmin__test_case: "{{ database_phpredisadmin__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    database_phpredisadmin__expect: "{{ database_phpredisadmin__test_case.expect }}"
    database_phpredisadmin__test_url: "http://{{ database_phpredisadmin__expect.ip }}"

  tasks:

    - name: 'Read the generated quadlet unit'
      ansible.builtin.slurp:
        src: "{{ database_phpredisadmin__test_quadlet_path }}"
      register: 'database_phpredisadmin__test_quadlet'

    # podman may quote values, the quotes are removed before the lines are compared
    - name: 'Assert the quadlet unit'
      ansible.builtin.assert:
        that:
          - ('Image=' + database_phpredisadmin__test_image) in database_phpredisadmin__test_quadlet_lines
          - ('IP=' + database_phpredisadmin__expect.ip) in database_phpredisadmin__test_quadlet_lines
          - database_phpredisadmin__expect.ip6 is none or ('IP6=' + database_phpredisadmin__expect.ip6) in database_phpredisadmin__test_quadlet_lines
          - database_phpredisadmin__expect.ip6 is not none or database_phpredisadmin__test_quadlet_lines | select('match', 'IP6=') | list | length == 0
          - database_phpredisadmin__expect.quadlet | reject('in', database_phpredisadmin__test_quadlet_lines) | list | length == 0
          # Only ADMIN_PASS is passed in the environment, the passwords of the servers are mounted as files
          - database_phpredisadmin__test_quadlet_lines | select('search', 'type=env') | reject('search', 'target=ADMIN_PASS$') | list | length == 0
        fail_msg: "{{ database_phpredisadmin__test_quadlet.content | b64decode }}"
      vars:
        database_phpredisadmin__test_quadlet_lines: "{{ (database_phpredisadmin__test_quadlet.content | b64decode | regex_replace('\"', '')).splitlines() }}"

    - name: 'Read the state of the phpredisadmin service'
      ansible.builtin.command: 'systemctl is-active phpredisadmin'
      register: 'database_phpredisadmin__test_service'
      changed_when: false
      failed_when: false

    - name: 'Inspect the phpredisadmin container'
      ansible.builtin.command: 'podman inspect phpredisadmin'
      register: 'database_phpredisadmin__test_inspect'
      changed_when: false

    # podman inspect shows the secrets of type env as environment variables, they are not part of the quadlet unit
    - name: 'Assert the service, the container addresses and the environment'
      ansible.builtin.assert:
        that:
          - database_phpredisadmin__test_service.stdout == 'active'
          - database_phpredisadmin__test_net.IPAddress == database_phpredisadmin__expect.ip
          - database_phpredisadmin__expect.ip6 is none or database_phpredisadmin__test_net.GlobalIPv6Address == database_phpredisadmin__expect.ip6
          - database_phpredisadmin__expect.env | reject('in', database_phpredisadmin__test_env) | list | length == 0
          - database_phpredisadmin__test_env | select('match', 'REDIS_[0-9]+_AUTH=') | list | length == 0
        fail_msg: >-
          service {{ database_phpredisadmin__test_service.stdout }},
          IPv4 {{ database_phpredisadmin__test_net.IPAddress }}, IPv6 {{ database_phpredisadmin__test_net.GlobalIPv6Address }},
          environment {{ database_phpredisadmin__test_env | reject('search', 'PASS=|AUTH=') | join(', ') }}
      vars:
        database_phpredisadmin__test_container: "{{ (database_phpredisadmin__test_inspect.stdout | from_json)[0] }}"
        database_phpredisadmin__test_net: "{{ database_phpredisadmin__test_container.NetworkSettings.Networks[database_phpredisadmin__test_case.role_vars.phpredisadmin_network] }}"
        database_phpredisadmin__test_env: "{{ database_phpredisadmin__test_container.Config.Env }}"

    - name: 'Read the files of the secrets in the container'
      ansible.builtin.command:
        argv: [ 'podman', 'exec', 'phpredisadmin', 'cat', "{{ item.path }}" ]
      loop: "{{ database_phpredisadmin__expect.secret_files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      register: 'database_phpredisadmin__test_secret_files'
      changed_when: false
      no_log: true

    - name: 'Assert the files of the secrets'
      ansible.builtin.assert:
        that:
          - database_phpredisadmin__test_secret_files.results | map(attribute='stdout') | list
            == database_phpredisadmin__expect.secret_files | default([]) | map(attribute='content') | list
        fail_msg: 'The files of the secrets differ from the expected values'
      no_log: true

    - name: 'Wait until phpRedisAdmin answers'
      ansible.builtin.uri:
        url: "{{ database_phpredisadmin__test_url }}/"
        status_code: [ 200, 401 ]
      register: 'database_phpredisadmin__test_ready'
      until: database_phpredisadmin__test_ready.status | default(0) in [ 200, 401 ]
      retries: 30
      delay: 5

    - name: 'Read the overview without credentials'
      ansible.builtin.command:
        argv: [ 'curl', '--silent', '--show-error', '--output', '/dev/null', '--write-out', '%{http_code}',
                "{{ database_phpredisadmin__test_url }}/overview.php" ]
      register: 'database_phpredisadmin__test_anonymous'
      changed_when: false

    # phpRedisAdmin uses the digest authentication, overview.php connects to every server and stops on a failed authentication
    - name: 'Read the overview of the servers'
      ansible.builtin.command:
        argv: "{{ [ 'curl', '--silent', '--show-error', '--fail' ]
                  + ([ '--digest', '--user', database_phpredisadmin__expect.login.user ~ ':' ~ database_phpredisadmin__expect.login.password ]
                     if database_phpredisadmin__expect.login else [])
                  + [ database_phpredisadmin__test_url ~ '/overview.php' ] }}"
      register: 'database_phpredisadmin__test_overview'
      changed_when: false
      no_log: true

    - name: 'Assert the authentication and the servers'
      ansible.builtin.assert:
        that:
          - database_phpredisadmin__test_anonymous.stdout == ('401' if database_phpredisadmin__expect.login else '200')
          - database_phpredisadmin__test_overview.stdout is not search('ERROR')
          - database_phpredisadmin__test_overview.stdout | regex_findall('Redis version:') | length == database_phpredisadmin__expect.servers
        fail_msg: >-
          status without credentials {{ database_phpredisadmin__test_anonymous.stdout }},
          errors {{ database_phpredisadmin__test_overview.stdout | regex_findall('ERROR[^<]*') | join(', ') }},
          servers {{ database_phpredisadmin__test_overview.stdout | regex_findall('Redis version:') | length }}
