---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/forward-domain
#

# Mounted to /app/.certs, contains the certificates, db.sqlite and .env
webserver_forward_domain__home: "{{ forward_domain_home | mandatory }}"
webserver_forward_domain__ip: "{{ forward_domain_ip | mandatory }}"
webserver_forward_domain__ipv6: "{{ forward_domain_ipv6 }}"
webserver_forward_domain__network: "{{ forward_domain_network | mandatory }}"
webserver_forward_domain__hostname: "{{ forward_domain_hostname | mandatory }}"
webserver_forward_domain__timezone: "{{ forward_domain_timezone | mandatory }}"
webserver_forward_domain__labels: "{{ forward_domain_labels }}"

webserver_forward_domain__version: "{{ forward_domain_version | default('latest') }}"

# The options of /app/.env, a list is joined with commas, true writes true, false and null remove the option
webserver_forward_domain__config: "{{ webserver_forward_domain__config_default | combine(forward_domain_config | default({})) }}"

# Only the variables of the image that are no options of forward-domain
webserver_forward_domain__environment: "{{ forward_domain_environment }}"

webserver_forward_domain__container: "{{ webserver_forward_domain__podman_container_default | combine(forward_domain_container | default({})) }}"

webserver_forward_domain__autoupdate_enabled: "{{ forward_domain_autoupdate_enabled | default(false) }}"
webserver_forward_domain__autoupdate_schedule: "{{ forward_domain_autoupdate_schedule }}"

#
# Defaults - do not change
#

webserver_forward_domain__podman_name: 'forward-domain'
webserver_forward_domain__podman_image: 'ghcr.io/willnode/forward-domain'
webserver_forward_domain__podman_tag: "{{ webserver_forward_domain__version }}"

# The image runs as nobody
webserver_forward_domain__uid: 65534
webserver_forward_domain__gid: 65534

webserver_forward_domain__config_file: "{{ webserver_forward_domain__home }}/.env"

# /stat and /health answer for the home domain
webserver_forward_domain__config_default:
  HOME_DOMAIN: "{{ webserver_forward_domain__hostname }}"

# The ports in the container are fixed, the ports of the host are set with forward_domain_container.publish
webserver_forward_domain__config_role: [ 'HTTP_PORT', 'HTTPS_PORT' ]

# Generated from HOSTING.md, src/util.js and src/client.js of forward-domain main f91f186
webserver_forward_domain__config_allowed:
  - 'WHITELIST_HOSTS'
  - 'BLACKLIST_HOSTS'
  - 'BLACKLIST_REDIRECT'
  - 'HOME_DOMAIN'
  - 'USE_LOCAL_DNS'
  - 'CACHE_EXPIRY_SECONDS'
  - 'DEBUG_LEVEL'

# Options that are only true or false
webserver_forward_domain__config_booleans: [ 'USE_LOCAL_DNS' ]

# Options that are numbers, DEBUG_LEVEL is 0 to 3
webserver_forward_domain__config_numbers: [ 'CACHE_EXPIRY_SECONDS', 'DEBUG_LEVEL' ]

# The variables of the image that are no options of forward-domain
webserver_forward_domain__environment_allowed: [ 'TZ', 'NODE_OPTIONS' ]

# The lines of .env, false and null remove an option, the values are quoted with single quotes, they are literal in dotenv
webserver_forward_domain__config_lines: >-
  {%- set lines = [] -%}
  {%- for key, value in (webserver_forward_domain__config if webserver_forward_domain__config is mapping else {}) | dictsort -%}
  {%-   if value is sameas true -%}
  {%-     set _ = lines.append(key ~ "='true'") -%}
  {%-   elif value is not none and value is not sameas false -%}
  {%-     set text = (value | map('string') | join(',')) if value is sequence and value is not string and value is not mapping else value | string -%}
  {%-     set _ = lines.append(key ~ "='" ~ text ~ "'") -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ lines }}

webserver_forward_domain__podman_container_default:
  name: "{{ webserver_forward_domain__podman_name }}"
  hostname: "{{ webserver_forward_domain__hostname }}"
  image: "{{ webserver_forward_domain__podman_image }}:{{ webserver_forward_domain__podman_tag }}"
  ip: "{{ webserver_forward_domain__ip }}"
  ipv6: "{{ webserver_forward_domain__ipv6 | default(omit) }}"
  network: "{{ webserver_forward_domain__network }}"
  timezone: "{{ webserver_forward_domain__timezone }}"
  labels: "{{ webserver_forward_domain__labels | default(omit) }}"
  # Without forward_domain_environment the quadlet unit has no environment
  environment: "{{ webserver_forward_domain__environment | default(omit) }}"
  publish:
    - '8080:8080'
    - '[::]:8080:8080'
    - '8443:8443'
    - '[::]:8443:8443'
  # forward_domain_container.volumes replaces the list completely
  volumes:
    - "{{ webserver_forward_domain__home }}:/app/.certs"
    - "{{ webserver_forward_domain__config_file }}:/app/.env:ro"
