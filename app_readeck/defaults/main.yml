---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/app-readeck
#

app_readeck__home: "{{ readeck_home | mandatory }}"
app_readeck__ip: "{{ readeck_ip | mandatory }}"
app_readeck__ipv6: "{{ readeck_ipv6 }}"
app_readeck__network: "{{ readeck_network | mandatory }}"
app_readeck__hostname: "{{ readeck_hostname | mandatory }}"
app_readeck__timezone: "{{ readeck_timezone | mandatory }}"
app_readeck__labels: "{{ readeck_labels }}"

app_readeck__version: "{{ readeck_version | default('latest') }}"

app_readeck__container: "{{ app_readeck__podman_container_default | combine(readeck_container | default({})) }}"

# The sections of config.toml of Readeck, merged recursively over the default, null removes an option
app_readeck__config: "{{ app_readeck__config_default | combine(readeck_config | default({}), recursive=true) }}"

# Variables of the image, the options of Readeck are set with readeck_config
app_readeck__environment: "{{ readeck_environment }}"

# Secrets with name, data and target, the target is the variable of Readeck, READECK_SECRET_KEY is mandatory
app_readeck__secrets: "{{ readeck_secrets | default([]) }}"

app_readeck__autoupdate_enabled: "{{ readeck_autoupdate_enabled | default(false) }}"
app_readeck__autoupdate_schedule: "{{ readeck_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_readeck__podman_name: 'readeck'
app_readeck__podman_image: 'codeberg.org/readeck/readeck'
app_readeck__podman_tag: "{{ app_readeck__version }}"

app_readeck__podman_home: "{{ app_readeck__home }}"

app_readeck__port: 8000

# The image runs Readeck as root, the role runs it as this user, the data directory belongs to it
app_readeck__uid: 1000
app_readeck__gid: 1000

app_readeck__config_file: "{{ app_readeck__podman_home }}/config.toml"
app_readeck__config_path: '/etc/readeck/config.toml'

# Everything else are the defaults of Readeck (internal/configs/configs.go of the image)
app_readeck__config_default: {}

# The options of readeck_config, the role checks that it is a dictionary
app_readeck__config_custom: "{{ readeck_config | default({}) }}"

# The content of config.toml, null removes a section or an option, the sections have at most three levels (auth.oidc.providers)
app_readeck__config_content: >-
  {%- set result = {} -%}
  {%- if app_readeck__config is mapping -%}
  {%-   for k1, v1 in app_readeck__config.items() if v1 is not none -%}
  {%-     if v1 is mapping -%}
  {%-       set section = {} -%}
  {%-       for k2, v2 in v1.items() if v2 is not none -%}
  {%-         set _ = section.update({ k2: (v2 | dict2items | rejectattr('value', 'none') | items2dict) if v2 is mapping else v2 }) -%}
  {%-       endfor -%}
  {%-       set _ = result.update({ k1: section }) -%}
  {%-     else -%}
  {%-       set _ = result.update({ k1: v1 }) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ result }}

# The options of config.toml as paths with their values, e.g. { 'path': 'server.session.max_age', 'value': 43200 }
app_readeck__config_paths: >-
  {%- set result = [] -%}
  {%- for k1, v1 in app_readeck__config_content.items() -%}
  {%-   if v1 is mapping -%}
  {%-     for k2, v2 in v1.items() -%}
  {%-       if v2 is mapping -%}
  {%-         for k3, v3 in v2.items() -%}
  {%-           set _ = result.append({ 'path': k1 ~ '.' ~ k2 ~ '.' ~ k3, 'value': v3 }) -%}
  {%-         endfor -%}
  {%-       else -%}
  {%-         set _ = result.append({ 'path': k1 ~ '.' ~ k2, 'value': v2 }) -%}
  {%-       endif -%}
  {%-     endfor -%}
  {%-   else -%}
  {%-     set _ = result.append({ 'path': k1 | string, 'value': v1 }) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ result }}

# Generated from the fields of config and its sections in internal/configs/configs.go of Readeck 0.23.6
# without the secrets and the options set by the role, Readeck ignores unknown options, update with new versions of the image
app_readeck__config_allowed:
  - 'main.log_level'
  - 'main.log_format'
  - 'main.log_time_format'
  - 'server.base_url'
  - 'server.prefix'
  - 'server.trusted_proxies'
  - 'server.allowed_hosts'
  - 'server.cert_file'
  - 'server.key_file'
  - 'server.client_ca_file'
  - 'server.session.cookie_name'
  - 'server.session.max_age'
  - 'auth.oidc.providers'
  - 'email.debug'
  - 'email.host'
  - 'email.port'
  - 'email.username'
  - 'email.encryption'
  - 'email.insecure'
  - 'email.from'
  - 'email.from_noreply'
  - 'accounts.username_denylist'
  - 'accounts.email_denylist'
  - 'extractor.workers'
  - 'extractor.content_scripts'
  - 'extractor.denied_ips'
  - 'extractor.proxy_match'
  - 'bookmarks.public_share_ttl'
  - 'worker.num_workers'
  - 'worker.start_worker'
  - 'metrics.host'
  - 'metrics.port'
  - 'customize.extra_permissions'
  - 'customize.extra_templates'

# The options fixed by the role and the image: the data directory is the volume /readeck/data,
# the image sets READECK_SERVER_HOST, the port is the port of the container
app_readeck__config_role:
  - 'main.data_directory'
  - 'server.host'
  - 'server.port'

# The options of internal/configs/configs.go of Readeck 0.23.6 that are secrets, they are passed with readeck_secrets
app_readeck__config_secrets:
  main.secret_key: 'READECK_SECRET_KEY'
  database.source: 'READECK_DATABASE_SOURCE'
  email.password: 'READECK_MAIL_PASSWORD'
  worker.dsn: 'READECK_WORKER_DSN'

# The booleans and integers of internal/configs/configs.go of Readeck 0.23.6, TOML is typed
app_readeck__config_booleans: [ 'email.debug', 'email.insecure', 'worker.start_worker' ]
app_readeck__config_integers:
  - 'server.session.max_age'
  - 'email.port'
  - 'extractor.workers'
  - 'bookmarks.public_share_ttl'
  - 'worker.num_workers'
  - 'metrics.port'

# The fields of OIDCProvider in internal/configs/oidc.go of Readeck 0.23.6 without client_secret, it is passed with readeck_secrets
app_readeck__oidc_allowed: [ 'name', 'url', 'client_id', 'groups', 'provisioning' ]
app_readeck__oidc_required: [ 'name', 'url', 'client_id' ]

# The providers of readeck_config, an invalid list is reported by the validation of the configuration
app_readeck__oidc_providers: >-
  {%- set auth = app_readeck__config_content.auth | default({}) -%}
  {%- set oidc = (auth.oidc | default({})) if auth is mapping else {} -%}
  {%- set providers = (oidc.providers | default([])) if oidc is mapping else [] -%}
  {{ providers if (providers is sequence and providers is not string and providers is not mapping) else [] }}

# Readeck merges READECK_AUTH_OIDC_PROVIDERS_<n>_CLIENT_SECRET into the provider <n> of the configuration file,
# every provider needs its client secret
app_readeck__secrets_oidc: >-
  {{ range(app_readeck__oidc_providers | length) | map('string')
     | map('regex_replace', '^', 'READECK_AUTH_OIDC_PROVIDERS_') | map('regex_replace', '$', '_CLIENT_SECRET') | list }}

# Targets of the secrets in readeck_secrets, Readeck reads them only from the environment
app_readeck__secrets_allowed_options: "{{ app_readeck__config_secrets.values() | list }}"
app_readeck__secrets_allowed: "{{ app_readeck__secrets_allowed_options + app_readeck__secrets_oidc }}"
app_readeck__secrets_required: "{{ [ 'READECK_SECRET_KEY' ] + app_readeck__secrets_oidc }}"

# The variables of the image without the options of Readeck (READECK_*), they are set with readeck_config
app_readeck__environment_allowed: [ 'TZ' ]

app_readeck__podman_container_default:
  name: "{{ app_readeck__podman_name }}"
  hostname: "{{ app_readeck__hostname }}"
  image: "{{ app_readeck__podman_image }}:{{ app_readeck__podman_tag }}"
  ip: "{{ app_readeck__ip }}"
  ipv6: "{{ app_readeck__ipv6 | default(omit) }}"
  network: "{{ app_readeck__network }}"
  timezone: "{{ app_readeck__timezone }}"
  labels: "{{ app_readeck__labels | default(omit) }}"
  user: "{{ app_readeck__uid }}:{{ app_readeck__gid }}"
  # The configuration file is mounted outside of the volume of the image, the data directory is /readeck/data
  command: [ '/bin/readeck', 'serve', '-config', "{{ app_readeck__config_path }}" ]
  environment: "{{ app_readeck__environment | default(omit) }}"
  volumes:
    - "{{ app_readeck__podman_home }}/data:/readeck:Z"
    - "{{ app_readeck__config_file }}:{{ app_readeck__config_path }}:ro,Z"
  # Readeck reads the secrets only from the environment,
  # entries without name or target are left out, the validation of the secrets reports them
  secrets: >-
    {{ (app_readeck__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='name')
        | zip(app_readeck__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='target'))
        | map('join', ',type=env,target=') | list)
      if (app_readeck__secrets is sequence and app_readeck__secrets is not string and app_readeck__secrets | length > 0)
      else omit }}
