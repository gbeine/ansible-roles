---

- name: 'Install evcc'
  tags: [ 'app', 'app_evcc' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or evcc_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - app_evcc__container | length > 0
        quiet: true

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - app_evcc__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_evcc__errors | join(' ') }}"
        quiet: true
      vars:
        app_evcc__environment_missing: >-
          {{ app_evcc__environment_required
             | reject('in', app_evcc__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        app_evcc__secrets_missing: >-
          {{ app_evcc__secrets_required
             | reject('in', app_evcc__secrets | selectattr('target', 'defined') | map(attribute='target') | list)
             | list }}
        app_evcc__secrets_in_environment: >-
          {{ app_evcc__secrets | selectattr('target', 'defined') | map(attribute='target')
             | select('in', app_evcc__environment.keys() | list) | list }}
        app_evcc__errors: >-
          {%- set errors = [] -%}
          {%- if app_evcc__secrets | rejectattr('name', 'defined') | list | length > 0 or app_evcc__secrets | rejectattr('data', 'defined') | list | length > 0 or app_evcc__secrets | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('evcc_secrets entries need name, data and target.') -%}
          {%- endif -%}
          {%- if app_evcc__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('evcc needs the environment variables ' ~ (app_evcc__environment_required | join(', ')) ~ ', missing or empty: ' ~ (app_evcc__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_evcc__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('evcc needs the secrets ' ~ (app_evcc__secrets_required | join(', ')) ~ ', missing: ' ~ (app_evcc__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_evcc__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secret targets must not be set in evcc_environment: ' ~ (app_evcc__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the role variables'
      ansible.builtin.assert:
        that:
          - app_evcc__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_evcc__invalid | join('. ') }}"
        quiet: true
      vars:
        app_evcc__invalid: >-
          {%- set errors = [] -%}
          {%- if app_evcc__podman_home is not string or app_evcc__podman_home is not match('^/') -%}
          {%-   set _ = errors.append('evcc_home has to be an absolute path') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging evcc_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - app_evcc__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_evcc__errors | join(' ') }}"
        quiet: true
      vars:
        # The secrets of the container are omit without secrets
        app_evcc__container_secrets: >-
          {{ app_evcc__container.secrets
             if app_evcc__container.secrets is sequence and app_evcc__container.secrets is not string
             else [] }}
        app_evcc__environment_unknown: >-
          {{ (app_evcc__container.environment | default({})).keys() | reject('in', app_evcc__environment_allowed) | list }}
        app_evcc__secrets_unknown: >-
          {{ app_evcc__container_secrets | map('regex_replace', '^.*,target=([^,]+).*$', '\1') | map('basename')
             | reject('in', app_evcc__secrets_allowed) | list }}
        app_evcc__errors: >-
          {%- set errors = [] -%}
          {%- if app_evcc__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (app_evcc__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_evcc__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (app_evcc__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the environment variables ' ~ (app_evcc__environment_allowed | join(', ')) ~ ' and the secrets ' ~ (app_evcc__secrets_allowed | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # The container runs as root
    - name: 'Create the data directory'
      ansible.builtin.file:
        path: "{{ app_evcc__podman_home }}"
        mode: '0700'
        state: 'directory'

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ app_evcc__secrets }}"
      register: 'app_evcc__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_evcc__container.name }}"
        hostname: "{{ app_evcc__container.hostname }}"
        image: "{{ app_evcc__container.image }}"
        ip: "{{ app_evcc__container.ip }}"
        ip6: "{{ app_evcc__container.ipv6 | default(omit) }}"
        network: "{{ app_evcc__container.network }}"
        timezone: "{{ app_evcc__container.timezone }}"
        command: "{{ app_evcc__container.command | default(omit) }}"
        env: "{{ app_evcc__container.environment | default(omit) }}"
        etc_hosts: "{{ app_evcc__container.etc_hosts | default(omit) }}"
        expose: "{{ app_evcc__container.expose | default(omit) }}"
        label: "{{ app_evcc__container.labels | default(omit) }}"
        publish: "{{ app_evcc__container.publish | default(omit) }}"
        secrets: "{{ app_evcc__container.secrets | default(omit) }}"
        volume: "{{ app_evcc__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_evcc__container.requires is defined %}
          Requires={{ app_evcc__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'app_evcc__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ app_evcc__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if app_evcc__restart | bool else 'started' }}"
        enabled: true
      vars:
        app_evcc__running: >-
          {{ (ansible_facts.services[app_evcc__container.name + '.service'].state | default('')) == 'running' }}
        app_evcc__restart: >-
          {{ app_evcc__running | bool
             and (app_evcc__secrets_result is changed
                  or app_evcc__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'app_evcc__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_evcc__container.name }}"
        container_image: "{{ app_evcc__container.image }}"
        container_schedule: "{{ app_evcc__autoupdate_schedule }}"
