---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/evcc
#

# Data directory, contains the database evcc.db with the configuration from the UI
app_evcc__home: "{{ evcc_home | mandatory }}"
app_evcc__ip: "{{ evcc_ip | mandatory }}"
app_evcc__ipv6: "{{ evcc_ipv6 }}"
app_evcc__network: "{{ evcc_network | mandatory }}"
app_evcc__hostname: "{{ evcc_hostname | mandatory }}"
app_evcc__timezone: "{{ evcc_timezone | mandatory }}"
app_evcc__labels: "{{ evcc_labels }}"

app_evcc__version: "{{ evcc_version | default('latest') }}"

app_evcc__container: "{{ app_evcc__podman_container_default | combine(evcc_container | default({})) }}"
app_evcc__environment: "{{ app_evcc__environment_default | combine(evcc_environment | default({})) }}"
app_evcc__secrets: "{{ evcc_secrets | default([]) }}"

app_evcc__autoupdate_enabled: "{{ evcc_autoupdate_enabled | default(false) }}"
app_evcc__autoupdate_schedule: "{{ evcc_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_evcc__podman_name: 'evcc'
app_evcc__podman_image: 'docker.io/evcc/evcc'
app_evcc__podman_tag: "{{ app_evcc__version }}"

app_evcc__podman_home: "{{ app_evcc__home }}"

app_evcc__environment_default: {}

app_evcc__environment_required: []

app_evcc__secrets_required: []

# Environment variables read by evcc, EVCC_ and the key of evcc.yaml
app_evcc__environment_allowed:
  - 'EVCC_LOG'
  - 'EVCC_INTERVAL'
  - 'EVCC_PLANT'
  - 'EVCC_TELEMETRY'
  - 'EVCC_METRICS'
  - 'EVCC_PROFILE'
  - 'EVCC_NETWORK_SCHEMA'
  - 'EVCC_NETWORK_HOST'
  - 'EVCC_NETWORK_PORT'
  - 'EVCC_DATABASE_DSN'
  - 'EVCC_MQTT_BROKER'
  - 'EVCC_MQTT_TOPIC'
  - 'EVCC_MQTT_USER'
  - 'EVCC_CUSTOM_CSS'
  - 'EVCC_CUSTOM_LOGO_LIGHT'
  - 'EVCC_CUSTOM_LOGO_DARK'
  - 'EVCC_CUSTOM_ICON'
  - 'EVCC_CUSTOM_BRAND'
  - 'EVCC_CUSTOM_WEBSITE'
  - 'EVCC_CUSTOM_EMAIL'
  - 'EVCC_CUSTOM_PHONE'
  - 'EVCC_CUSTOM_THEME'

# Targets of the secrets in evcc_secrets
app_evcc__secrets_allowed:
  - 'EVCC_SPONSORTOKEN'
  - 'EVCC_MQTT_PASSWORD'

app_evcc__podman_container_default:
  name: "{{ app_evcc__podman_name }}"
  hostname: "{{ app_evcc__hostname }}"
  image: "{{ app_evcc__podman_image }}:{{ app_evcc__podman_tag }}"
  ip: "{{ app_evcc__ip }}"
  ipv6: "{{ app_evcc__ipv6 | default(omit) }}"
  network: "{{ app_evcc__network }}"
  timezone: "{{ app_evcc__timezone }}"
  # Set with evcc_environment, merged over the default
  environment: "{{ app_evcc__environment }}"
  labels: "{{ app_evcc__labels | default(omit) }}"
  secrets: >-
    {{ (app_evcc__secrets | map(attribute='name') | zip(app_evcc__secrets | map(attribute='target')) | map('join', ',type=env,target=') | list)
      if (app_evcc__secrets | default([]) | length > 0)
      else omit }}
  # evcc_container.publish replaces the list completely
  publish:
    - '7070:7070'
    - '8887:8887'
  # evcc_container.volumes replaces the list completely
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_evcc__podman_home }}:/root/.evcc"
