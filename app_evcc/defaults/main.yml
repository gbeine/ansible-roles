---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/evcc
#

# Data directory, contains the database evcc.db with the configuration from the UI
app_evcc__home: "{{ evcc_home | mandatory }}"
app_evcc__ip: "{{ evcc_ip | mandatory }}"
app_evcc__ipv6: "{{ evcc_ipv6 }}"
app_evcc__network: "{{ evcc_network | mandatory }}"
app_evcc__hostname: "{{ evcc_hostname | mandatory }}"
app_evcc__timezone: "{{ evcc_timezone | mandatory }}"
app_evcc__labels: "{{ evcc_labels }}"

app_evcc__version: "{{ evcc_version | default('latest') }}"

# The content of evcc.yaml, the whole file is a podman secret
app_evcc__config: "{{ evcc_config }}"

# Only the variables of the image, the options of evcc are set with evcc_config
app_evcc__environment: "{{ app_evcc__environment_default | combine(evcc_environment | default({})) }}"

# Secrets with name, data and target, the target is the path of the option, e.g. mqtt.password
app_evcc__secrets: "{{ evcc_secrets | default([]) }}"

app_evcc__container: "{{ app_evcc__podman_container_default | combine(evcc_container | default({})) }}"

app_evcc__autoupdate_enabled: "{{ evcc_autoupdate_enabled | default(false) }}"
app_evcc__autoupdate_schedule: "{{ evcc_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_evcc__podman_name: 'evcc'
app_evcc__podman_image: 'docker.io/evcc/evcc'
app_evcc__podman_tag: "{{ app_evcc__version }}"

app_evcc__podman_home: "{{ app_evcc__home }}"

# evcc.yaml with the passwords is the podman secret <container name>-config, evcc runs as root
app_evcc__config_secret: "{{ app_evcc__podman_name }}-config"
app_evcc__config_target: '/etc/evcc.yaml'

# The image sets ENV TZ=Europe/Berlin, Go prefers TZ to /etc/localtime, so TZ follows evcc_timezone
app_evcc__environment_default:
  TZ: "{{ app_evcc__timezone }}"

# Generated from api/globalconfig/types.go of evcc 0.319.1, the keys of evcc.yaml,
# evcc checks the keys below them itself
app_evcc__config_allowed:
  - 'network'
  - 'ocpp'
  - 'log'
  - 'sponsortoken'
  - 'plant'
  - 'telemetry'
  - 'mcp'
  - 'metrics'
  - 'profile'
  - 'levels'
  - 'interval'
  - 'database'
  - 'mqtt'
  - 'modbusproxy'
  - 'javascript'
  - 'go'
  - 'influx'
  - 'eebus'
  - 'hems'
  - 'shm'
  - 'messaging'
  - 'messagingevents'
  - 'meters'
  - 'chargers'
  - 'vehicles'
  - 'tariffs'
  - 'site'
  - 'loadpoints'
  - 'circuits'
  - 'curtailers'

# The targets of evcc_secrets, the paths of the password options of evcc.yaml
app_evcc__secrets_allowed:
  - 'sponsortoken'
  - 'mqtt.password'
  - 'mqtt.clientkey'
  - 'influx.password'
  - 'influx.token'

# Generated from cmd/root.go of evcc 0.319.1, the variables evcc reads with os.Getenv, the options (EVCC_*) are set with evcc_config
app_evcc__environment_allowed:
  - 'TZ'
  - 'EVCC_CUSTOM_CSS'
  - 'EVCC_CUSTOM_LOGO_LIGHT'
  - 'EVCC_CUSTOM_LOGO_DARK'
  - 'EVCC_CUSTOM_ICON'
  - 'EVCC_CUSTOM_BRAND'
  - 'EVCC_CUSTOM_WEBSITE'
  - 'EVCC_CUSTOM_EMAIL'
  - 'EVCC_CUSTOM_PHONE'
  - 'EVCC_CUSTOM_THEME'

# Entries without name, data or target are left out, the validation of the secrets reports them
app_evcc__secrets_valid: >-
  {{ (app_evcc__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('data', 'defined')
      | selectattr('target', 'defined') | list)
     if (app_evcc__secrets is sequence and app_evcc__secrets is not string) else [] }}

# The configuration with the secrets, every target is a path, e.g. mqtt.password is { mqtt: { password: … } },
# without evcc_config only the secrets are written, evcc_config that is no dictionary is reported by the validation
app_evcc__config_file: >-
  {%- set options = [ app_evcc__config if app_evcc__config is defined and app_evcc__config is mapping else {} ] -%}
  {%- for secret in app_evcc__secrets_valid -%}
  {%-   set keys = (secret.target | string).split('.') -%}
  {%-   set prefix = [] -%}
  {%-   for key in keys -%}
  {%-     set _ = prefix.append('{' ~ (key | to_json) ~ ': ') -%}
  {%-   endfor -%}
  {%-   set _ = options.append((prefix | join) ~ (secret.data | to_json) ~ ('}' * (keys | length))) -%}
  {%- endfor -%}
  {{ ([ options[0] ] + (options[1:] | map('from_json') | list)) | combine(recursive=true) }}

# Without configuration and secrets there is no evcc.yaml, evcc runs in the database-only mode
app_evcc__config_enabled: "{{ app_evcc__config_file | length > 0 }}"

app_evcc__podman_container_default:
  name: "{{ app_evcc__podman_name }}"
  hostname: "{{ app_evcc__hostname }}"
  image: "{{ app_evcc__podman_image }}:{{ app_evcc__podman_tag }}"
  ip: "{{ app_evcc__ip }}"
  ipv6: "{{ app_evcc__ipv6 | default(omit) }}"
  network: "{{ app_evcc__network }}"
  timezone: "{{ app_evcc__timezone }}"
  environment: "{{ app_evcc__environment }}"
  labels: "{{ app_evcc__labels | default(omit) }}"
  # evcc.yaml is mounted from the podman secret, it never exists on the host
  secrets: >-
    {{ [ app_evcc__config_secret ~ ',type=mount,target=' ~ app_evcc__config_target ~ ',mode=0400' ]
       if app_evcc__config_enabled | bool else omit }}
  # evcc_container.publish replaces the list completely
  publish:
    - '7070:7070'
    - '8887:8887'
  # evcc_container.volumes replaces the list completely
  volumes:
    - "{{ app_evcc__podman_home }}:/root/.evcc"
