---
# Network created by container_podman in prepare.yml
app_evcc__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_evcc__test_image: 'docker.io/evcc/evcc:latest'
app_evcc__test_quadlet_path: '/etc/containers/systemd/evcc.container'

# The time zone of the image is replaced by TZ, the files of the host are not mounted
app_evcc__test_quadlet_absent: [ 'Volume=/etc/localtime', 'Volume=/etc/timezone' ]

app_evcc__test_cases:

  # Only the mandatory variables, without evcc.yaml evcc runs in the database-only mode, the ports 7070 and 8887 are published
  - name: 'molecule-evcc-default'
    role_vars:
      evcc_home: '/opt/evcc'
      evcc_ip: '10.89.0.70'
      evcc_network: 'podman-molecule'
      evcc_hostname: 'evcc-default'
      evcc_timezone: 'Europe/Berlin'
    # Runs again without a change, evcc must not restart
    side_effect:
      role_vars: {}
    expect:
      restart: false
      ip: '10.89.0.70'
      ip6: ~
      home: '/opt/evcc'
      port: 7070
      config: ~
      interval: ~
      quadlet:
        - 'Volume=/opt/evcc:/root/.evcc'
        - 'PublishPort=7070:7070'
        - 'PublishPort=8887:8887'
        - 'Environment=TZ=Europe/Berlin'
      quadlet_absent: "{{ app_evcc__test_quadlet_absent + [ 'Secret=' ] }}"
      env:
        - 'TZ=Europe/Berlin'

  # IPv6, labels, dependencies, an own port, a variable of the image, evcc.yaml with options and the password of MQTT as secret
  - name: 'molecule-evcc'
    role_vars:
      evcc_home: '/srv/evcc'
      evcc_ip: '10.89.0.71'
      evcc_ipv6: 'fd00:89::71'
      evcc_network: 'podman-molecule'
      evcc_hostname: 'evcc-molecule'
      evcc_timezone: 'Europe/Berlin'
      evcc_labels:
        traefik.enable: 'true'
      evcc_environment:
        EVCC_CUSTOM_BRAND: 'Molecule'
      evcc_config:
        log: 'debug'
        interval: '20s'
      # Without a broker MQTT is not used
      evcc_secrets:
        - name: 'evcc_molecule_mqtt_password'
          data: 'molecule-secret'
          target: 'mqtt.password'
      evcc_container:
        publish:
          - '17070:7070'
        wants: [ 'network-online.target' ]
        after: [ 'network-online.target' ]
        requires_mounts_for: [ '/var/lib/containers' ]
    # side_effect changes the interval, evcc.yaml changes and evcc has to restart
    side_effect:
      role_vars:
        evcc_config:
          log: 'debug'
          interval: '25s'
    expect:
      restart: true
      ip: '10.89.0.71'
      ip6: 'fd00:89::71'
      home: '/srv/evcc'
      port: 17070
      config:
        - 'interval: 25s'
        - 'log: debug'
        - 'mqtt:'
        - '  password: molecule-secret'
      interval: 25
      quadlet:
        - 'Volume=/srv/evcc:/root/.evcc'
        - 'PublishPort=17070:7070'
        - 'Label=traefik.enable=true'
        - 'Environment=EVCC_CUSTOM_BRAND=Molecule'
        - 'Secret=evcc-config,type=mount,target=/etc/evcc.yaml,mode=0400'
        - 'Wants=network-online.target'
        - 'After=network-online.target'
        - 'RequiresMountsFor=/var/lib/containers'
      quadlet_absent: "{{ app_evcc__test_quadlet_absent }}"
      env:
        - 'TZ=Europe/Berlin'
        - 'EVCC_CUSTOM_BRAND=Molecule'
