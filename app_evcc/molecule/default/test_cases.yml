---
# Network created by container_podman in prepare.yml
app_evcc__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_evcc__test_image: 'docker.io/evcc/evcc:latest'
app_evcc__test_quadlet_path: '/etc/containers/systemd/evcc.container'

app_evcc__test_cases:

  # Only the mandatory variables, the ports 7070 and 8887 are published
  - name: 'molecule-evcc-default'
    role_vars:
      evcc_home: '/opt/evcc'
      evcc_ip: '10.89.0.70'
      evcc_network: 'podman-molecule'
      evcc_hostname: 'evcc-default'
      evcc_timezone: 'Europe/Berlin'
    expect:
      ip: '10.89.0.70'
      ip6: ~
      home: '/opt/evcc'
      port: 7070
      quadlet:
        - 'Volume=/opt/evcc:/root/.evcc'
        - 'PublishPort=7070:7070'
        - 'PublishPort=8887:8887'
      env: []
      secrets: []

  # IPv6, labels, an environment variable, a secret and an own port published by evcc_container
  - name: 'molecule-evcc'
    role_vars:
      evcc_home: '/srv/evcc'
      evcc_ip: '10.89.0.71'
      evcc_ipv6: 'fd00:89::71'
      evcc_network: 'podman-molecule'
      evcc_hostname: 'evcc-molecule'
      evcc_timezone: 'Europe/Berlin'
      evcc_labels:
        traefik.enable: 'true'
      evcc_environment:
        EVCC_LOG: 'debug'
      # Without a broker MQTT is not used
      evcc_secrets:
        - name: 'evcc_molecule_mqtt_password'
          data: 'molecule-secret'
          target: 'EVCC_MQTT_PASSWORD'
      evcc_container:
        publish:
          - '17070:7070'
    # side_effect changes the data directory, the quadlet unit changes and evcc has to restart
    side_effect:
      role_vars:
        evcc_home: '/srv/evcc-changed'
    expect:
      ip: '10.89.0.71'
      ip6: 'fd00:89::71'
      home: '/srv/evcc-changed'
      port: 17070
      quadlet:
        - 'Volume=/srv/evcc-changed:/root/.evcc'
        - 'PublishPort=17070:7070'
        - 'Label=traefik.enable=true'
        - 'Secret=evcc_molecule_mqtt_password,type=env,target=EVCC_MQTT_PASSWORD'
      env:
        - 'EVCC_LOG=debug'
      secrets:
        - 'evcc_molecule_mqtt_password'
