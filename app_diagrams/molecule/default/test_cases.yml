---
# Network created by container_podman in prepare.yml
app_diagrams__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_diagrams__test_image: 'docker.io/jgraph/drawio:latest'
app_diagrams__test_quadlet_path: '/etc/containers/systemd/diagrams.container'

app_diagrams__test_cases:

  # Only the mandatory variables, draw.io serves the root context
  - name: 'molecule-diagrams-default'
    role_vars:
      diagrams_ip: '10.89.0.60'
      diagrams_network: 'podman-molecule'
      diagrams_hostname: 'diagrams-default'
      diagrams_timezone: 'Europe/Berlin'
      diagrams_environment:
        DRAWIO_BASE_URL: 'http://10.89.0.60:8080'
    expect:
      ip: '10.89.0.60'
      ip6: ~
      base_url: 'http://10.89.0.60:8080'
      context: ''
      quadlet: []
      env:
        - 'TZ=Europe/Berlin'
        - 'DRAWIO_BASE_URL=http://10.89.0.60:8080'
        - 'LETS_ENCRYPT_ENABLED=false'

  # IPv6, labels, additional hosts and a base URL with a path, the path sets the context of Tomcat
  - name: 'molecule-diagrams'
    role_vars:
      diagrams_ip: '10.89.0.61'
      diagrams_ipv6: 'fd00:89::61'
      diagrams_network: 'podman-molecule'
      diagrams_hostname: 'diagrams-molecule'
      diagrams_timezone: 'Europe/Berlin'
      diagrams_environment:
        DRAWIO_BASE_URL: 'https://diagrams.example.org/drawio'
      diagrams_labels:
        traefik.enable: 'true'
      diagrams_container:
        etc_hosts:
          nextcloud.example.org: '10.89.0.1'
    # side_effect changes the base URL, the quadlet unit changes and draw.io has to restart
    side_effect:
      role_vars:
        diagrams_environment:
          DRAWIO_BASE_URL: 'https://office.example.org/diagrams'
    expect:
      ip: '10.89.0.61'
      ip6: 'fd00:89::61'
      base_url: 'https://office.example.org/diagrams'
      context: '/diagrams'
      quadlet:
        - 'Label=traefik.enable=true'
        - 'AddHost=nextcloud.example.org:10.89.0.1'
      env:
        - 'TZ=Europe/Berlin'
        - 'DRAWIO_BASE_URL=https://office.example.org/diagrams'
        - 'LETS_ENCRYPT_ENABLED=false'
