---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_diagrams__test_case: "{{ app_diagrams__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ app_diagrams__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksum of the quadlet unit before the invalid runs'
      ansible.builtin.stat:
        path: "{{ app_diagrams__test_quadlet_path }}"
        checksum_algorithm: 'md5'
      register: 'app_diagrams__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include
    - name: 'Run app_diagrams with diagrams_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diagrams_container: [ 'environment' ]
        app_diagrams__test_invalid:
          message: 'diagrams_container is not a dictionary'
          # combine of the defaults fails before the role checks anything
          search: 'failed to combine variables, expected dicts'

    - name: 'Run app_diagrams with a secret without target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diagrams_secrets:
          - name: 'diagrams_molecule_secret'
            data: 'molecule-secret'
        app_diagrams__test_invalid:
          message: 'a secret without target'
          search: '^diagrams_secrets entries need name, data and target$'

    - name: 'Run app_diagrams with an empty base URL (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diagrams_environment:
          DRAWIO_BASE_URL: ''
        app_diagrams__test_invalid:
          message: 'an empty base URL'
          search: 'missing or empty: DRAWIO_BASE_URL\.'

    - name: 'Run app_diagrams with a secret target set in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diagrams_secrets:
          - name: 'diagrams_molecule_tz'
            data: 'UTC'
            target: 'TZ'
        app_diagrams__test_invalid:
          message: 'a secret target set in the environment'
          search: 'must not be set in diagrams_environment:\s+TZ\.'

    - name: 'Run app_diagrams with an unknown environment variable (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diagrams_environment:
          DRAWIO_BASE_URL: 'http://10.89.0.60:8080'
          DRAWIO_FOO: 'bar'
        app_diagrams__test_invalid:
          message: 'an unknown environment variable'
          search: 'Unknown environment variables: DRAWIO_FOO\.'

    - name: 'Run app_diagrams with an unknown environment variable in diagrams_container (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diagrams_container:
          environment:
            FOO: 'bar'
        app_diagrams__test_invalid:
          message: 'an unknown environment variable in diagrams_container'
          search: 'Unknown environment variables: FOO\.'

    - name: 'Run app_diagrams with an unknown secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        diagrams_secrets:
          - name: 'diagrams_molecule_secret'
            data: 'secret'
            target: 'DRAWIO_FOO_SECRET'
        app_diagrams__test_invalid:
          message: 'an unknown secret'
          search: 'Unknown secrets: DRAWIO_FOO_SECRET\.'

    - name: 'Run app_diagrams with the changed role variables'
      when: app_diagrams__test_case.side_effect is defined
      block:

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'diagrams' ]
          register: 'app_diagrams__test_started_before'
          changed_when: false

        - name: 'Set the changed role variables'
          ansible.builtin.set_fact:
            "{{ item.key }}": "{{ item.value }}"
          loop: "{{ app_diagrams__test_case.side_effect.role_vars | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: 'Run app_diagrams with the changed role variables'
          ansible.builtin.include_role:
            name: 'app_diagrams'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'diagrams' ]
          register: 'app_diagrams__test_started_after'
          changed_when: false

        - name: 'Assert the changed quadlet unit and the restart of the service'
          ansible.builtin.assert:
            that:
              - app_diagrams__quadlet_result is changed
              - app_diagrams__test_started_after.stdout | int > app_diagrams__test_started_before.stdout | int
            fail_msg: >-
              quadlet changed: {{ app_diagrams__quadlet_result is changed }},
              start before {{ app_diagrams__test_started_before.stdout }}, after {{ app_diagrams__test_started_after.stdout }}
