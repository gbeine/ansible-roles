---

- name: 'Install draw.io'
  tags: [ 'app', 'app_diagrams' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or diagrams_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - app_diagrams__container | length > 0
        quiet: true

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - app_diagrams__environment_missing | length == 0
          - app_diagrams__secrets | rejectattr('name', 'defined') | list | length == 0
          - app_diagrams__secrets | rejectattr('data', 'defined') | list | length == 0
          - app_diagrams__secrets | rejectattr('target', 'defined') | list | length == 0
          - app_diagrams__secrets_missing | length == 0
          - app_diagrams__secrets_in_environment | length == 0
        fail_msg: >-
          draw.io needs the environment variables {{ app_diagrams__environment_required | join(', ') }},
          missing or empty: {{ app_diagrams__environment_missing | join(', ') | default('none', true) }}.
          {% if app_diagrams__secrets_required | length > 0 %}
          draw.io needs the secrets {{ app_diagrams__secrets_required | join(', ') }},
          missing: {{ app_diagrams__secrets_missing | join(', ') | default('none', true) }}.
          {% endif %}
          Every secret needs name, data and target, secret targets must not be set in diagrams_environment:
          {{ app_diagrams__secrets_in_environment | join(', ') | default('none', true) }}.
        quiet: true
      vars:
        app_diagrams__environment_missing: >-
          {{ app_diagrams__environment_required
             | reject('in', app_diagrams__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        app_diagrams__secrets_missing: >-
          {{ app_diagrams__secrets_required
             | reject('in', app_diagrams__secrets | selectattr('target', 'defined') | map(attribute='target') | list)
             | list }}
        app_diagrams__secrets_in_environment: >-
          {{ app_diagrams__secrets | selectattr('target', 'defined') | map(attribute='target')
             | select('in', app_diagrams__environment.keys() | list) | list }}

    # Checks the environment and the secrets of the container after merging diagrams_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - app_diagrams__environment_unknown | length == 0
          - app_diagrams__secrets_unknown | length == 0
        fail_msg: >-
          Unknown environment variables: {{ app_diagrams__environment_unknown | join(', ') | default('none', true) }}.
          Unknown secrets: {{ app_diagrams__secrets_unknown | join(', ') | default('none', true) }}.
          Allowed are the environment variables {{ app_diagrams__environment_allowed | join(', ') }}
          and the secrets {{ app_diagrams__secrets_allowed | join(', ') }}.
        quiet: true
      vars:
        # The secrets of the container are omit without secrets
        app_diagrams__container_secrets: >-
          {{ app_diagrams__container.secrets
             if app_diagrams__container.secrets is sequence and app_diagrams__container.secrets is not string
             else [] }}
        app_diagrams__environment_unknown: >-
          {{ (app_diagrams__container.environment | default({})).keys() | reject('in', app_diagrams__environment_allowed) | list }}
        app_diagrams__secrets_unknown: >-
          {{ app_diagrams__container_secrets | map('regex_replace', '^.*,target=([^,]+).*$', '\1') | map('basename')
             | reject('in', app_diagrams__secrets_allowed) | list }}

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ app_diagrams__secrets }}"
      register: 'app_diagrams__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_diagrams__container.name }}"
        hostname: "{{ app_diagrams__container.hostname }}"
        image: "{{ app_diagrams__container.image }}"
        ip: "{{ app_diagrams__container.ip }}"
        ip6: "{{ app_diagrams__container.ipv6 | default(omit) }}"
        network: "{{ app_diagrams__container.network }}"
        timezone: "{{ app_diagrams__container.timezone }}"
        command: "{{ app_diagrams__container.command | default(omit) }}"
        env: "{{ app_diagrams__container.environment | default(omit) }}"
        etc_hosts: "{{ app_diagrams__container.etc_hosts | default(omit) }}"
        expose: "{{ app_diagrams__container.expose | default(omit) }}"
        label: "{{ app_diagrams__container.labels | default(omit) }}"
        publish: "{{ app_diagrams__container.publish | default(omit) }}"
        secrets: "{{ app_diagrams__container.secrets | default(omit) }}"
        volume: "{{ app_diagrams__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_diagrams__container.requires is defined %}
          Requires={{ app_diagrams__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'app_diagrams__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ app_diagrams__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if app_diagrams__restart | bool else 'started' }}"
        enabled: true
      vars:
        app_diagrams__running: >-
          {{ (ansible_facts.services[app_diagrams__container.name + '.service'].state | default('')) == 'running' }}
        app_diagrams__restart: >-
          {{ app_diagrams__running | bool
             and (app_diagrams__secrets_result is changed
                  or app_diagrams__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'app_diagrams__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_diagrams__container.name }}"
        container_image: "{{ app_diagrams__container.image }}"
        container_schedule: "{{ app_diagrams__autoupdate_schedule }}"
