---

- name: 'Install draw.io'
  tags: [ 'app', 'app_diagrams' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or diagrams_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - app_diagrams__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - app_diagrams__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_diagrams__invalid | join('. ') }}"
        quiet: true
      vars:
        app_diagrams__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = app_diagrams__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('diagrams_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('diagrams_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of diagrams_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - app_diagrams__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_diagrams__errors | join(' ') }}"
        quiet: true
      vars:
        app_diagrams__environment_missing: >-
          {{ app_diagrams__environment_required
             | reject('in', app_diagrams__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        app_diagrams__secrets_missing: >-
          {{ app_diagrams__secrets_required
             | reject('in', app_diagrams__secrets | selectattr('target', 'defined') | map(attribute='target') | list)
             | list }}
        app_diagrams__secrets_in_environment: >-
          {{ app_diagrams__secrets | selectattr('target', 'defined') | map(attribute='target')
             | select('in', app_diagrams__environment.keys() | list) | list }}
        app_diagrams__errors: >-
          {%- set errors = [] -%}
          {%- if app_diagrams__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('draw.io needs the environment variables ' ~ (app_diagrams__environment_required | join(', ')) ~ ', missing or empty: ' ~ (app_diagrams__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_diagrams__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('draw.io needs the secrets ' ~ (app_diagrams__secrets_required | join(', ')) ~ ', missing: ' ~ (app_diagrams__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_diagrams__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secret targets must not be set in diagrams_environment: ' ~ (app_diagrams__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging diagrams_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - app_diagrams__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_diagrams__errors | join(' ') }}"
        quiet: true
      vars:
        # The secrets of the container are omit without secrets
        app_diagrams__container_secrets: >-
          {{ app_diagrams__container.secrets
             if app_diagrams__container.secrets is sequence and app_diagrams__container.secrets is not string
             else [] }}
        app_diagrams__environment_container: >-
          {{ app_diagrams__container.environment if app_diagrams__container.environment is mapping else {} }}
        app_diagrams__environment_unknown: >-
          {{ app_diagrams__environment_container.keys() | reject('in', app_diagrams__environment_allowed) | list }}
        app_diagrams__environment_line_breaks: >-
          {{ app_diagrams__environment_container | dict2items | selectattr('value', 'string')
             | selectattr('value', 'search', '[\n\r]') | map(attribute='key') | list }}
        app_diagrams__secrets_unknown: >-
          {{ app_diagrams__container_secrets | map('regex_replace', '^.*,target=([^,]+).*$', '\1') | map('basename')
             | reject('in', app_diagrams__secrets_allowed) | list }}
        app_diagrams__errors: >-
          {%- set errors = [] -%}
          {%- if app_diagrams__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (app_diagrams__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_diagrams__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (app_diagrams__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the environment variables ' ~ (app_diagrams__environment_allowed | join(', ')) ~ ' and the secrets ' ~ (app_diagrams__secrets_allowed | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_diagrams__environment_line_breaks | length > 0 -%}
          {%-   set _ = errors.append('The environment variables must not contain line breaks: ' ~ (app_diagrams__environment_line_breaks | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ app_diagrams__secrets }}"
      register: 'app_diagrams__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_diagrams__container.name }}"
        hostname: "{{ app_diagrams__container.hostname }}"
        image: "{{ app_diagrams__container.image }}"
        ip: "{{ app_diagrams__container.ip }}"
        ip6: "{{ app_diagrams__container.ipv6 | default(omit) }}"
        network: "{{ app_diagrams__container.network }}"
        timezone: "{{ app_diagrams__container.timezone }}"
        command: "{{ app_diagrams__container.command | default(omit) }}"
        env: "{{ app_diagrams__container.environment | default(omit) }}"
        etc_hosts: "{{ app_diagrams__container.etc_hosts | default(omit) }}"
        expose: "{{ app_diagrams__container.expose | default(omit) }}"
        label: "{{ app_diagrams__container.labels | default(omit) }}"
        publish: "{{ app_diagrams__container.publish | default(omit) }}"
        secrets: "{{ app_diagrams__container.secrets | default(omit) }}"
        volume: "{{ app_diagrams__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_diagrams__container.requires is defined %}
          Requires={{ app_diagrams__container.requires | join(' ') }}
          {% endif %}
          {% if app_diagrams__container.wants is defined %}
          Wants={{ app_diagrams__container.wants | join(' ') }}
          {% endif %}
          {% if app_diagrams__container.after is defined %}
          After={{ app_diagrams__container.after | join(' ') }}
          {% endif %}
          {% if app_diagrams__container.part_of is defined %}
          PartOf={{ app_diagrams__container.part_of | join(' ') }}
          {% endif %}
          {% if app_diagrams__container.binds_to is defined %}
          BindsTo={{ app_diagrams__container.binds_to | join(' ') }}
          {% endif %}
          {% if app_diagrams__container.requires_mounts_for is defined %}
          RequiresMountsFor={{ app_diagrams__container.requires_mounts_for | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'app_diagrams__quadlet_result'

    # A failed start of the service only reports the exit code, the reason is in the journal
    - name: 'Start draw.io'
      when: 'not ansible_check_mode'
      block:

        - name: 'Start and enable container'
          ansible.builtin.systemd_service:
            name: "{{ app_diagrams__container.name }}"
            daemon_reload: true
            state: "{{ 'restarted' if app_diagrams__restart | bool else 'started' }}"
            enabled: true
          vars:
            app_diagrams__running: >-
              {{ (ansible_facts.services[app_diagrams__container.name + '.service'].state | default('')) == 'running' }}
            app_diagrams__restart: >-
              {{ app_diagrams__running | bool
                 and (app_diagrams__secrets_result is changed
                      or app_diagrams__quadlet_result is changed) }}

      rescue:

        - name: 'Read the log of the failed start'
          ansible.builtin.command:
            argv: [ 'journalctl', '-u', "{{ app_diagrams__container.name }}", '-n', '80', '--no-pager' ]
          register: 'app_diagrams__start_journal'
          changed_when: false

        - name: 'Fail with the log of the failed start'
          ansible.builtin.fail:
            msg: "{{ [ app_diagrams__container.name ~ ' did not start' ] + app_diagrams__start_journal.stdout_lines }}"

    - name: 'Enable autoupdate on container'
      when: 'app_diagrams__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_diagrams__container.name }}"
        container_image: "{{ app_diagrams__container.image }}"
        container_schedule: "{{ app_diagrams__autoupdate_schedule }}"
