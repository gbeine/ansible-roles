---

- name: 'Deploy phpMyAdmin container'
  tags: [ 'database_phpmyadmin' ]
  block:

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: 'pma_controluser_password'
        data: "{{ database_phpmyadmin__db_pass }}"

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ database_phpmyadmin__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[database_phpmyadmin__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ database_phpmyadmin__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name: 'Install phpMyAdmin container'
      containers.podman.podman_container:
        name: "{{ database_phpmyadmin__container.name }}"
        hostname: "{{ database_phpmyadmin__container.hostname }}"
        image: "{{ database_phpmyadmin__container.image }}"
        ip: "{{ database_phpmyadmin__container.ip }}"
        network: "{{ database_phpmyadmin__container.network }}"
        timezone: "{{ database_phpmyadmin__container.timezone }}"
        env: "{{ database_phpmyadmin__container.environment }}"
        label: "{{ database_phpmyadmin__container.labels }}"
        secrets: "{{ database_phpmyadmin__container.secrets }}"
        quadlet_options: |
          
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if database_phpmyadmin__container.requires is defined %}
          Requires={{ database_phpmyadmin__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'database_phpmyadmin__ipv6 | length == 0'

    - name: 'Install phpMyAdmin container'
      containers.podman.podman_container:
        name: "{{ database_phpmyadmin__container.name }}"
        hostname: "{{ database_phpmyadmin__container.hostname }}"
        image: "{{ database_phpmyadmin__container.image }}"
        ip: "{{ database_phpmyadmin__container.ip }}"
        ip6: "{{ database_phpmyadmin__container.ipv6 }}"
        network: "{{ database_phpmyadmin__container.network }}"
        timezone: "{{ database_phpmyadmin__container.timezone }}"
        env: "{{ database_phpmyadmin__container.environment }}"
        label: "{{ database_phpmyadmin__container.labels }}"
        secrets: "{{ database_phpmyadmin__container.secrets }}"
        quadlet_options: |
          
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if database_phpmyadmin__container.requires is defined %}
          Requires={{ database_phpmyadmin__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'database_phpmyadmin__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ database_phpmyadmin__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode | bool else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'database_phpmyadmin__autoupdate_enabled'
      block:
        - name: 'Create autoupdate systemd service'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ database_phpmyadmin__container.name }} container

              [Service]
              Type=oneshot
              ExecStart=/usr/bin/podman pull {{ database_phpmyadmin__container.image }}
              ExecStartPost=/usr/bin/systemctl restart {{ database_phpmyadmin__container.name }}
            dest: "/etc/systemd/system/container-{{ database_phpmyadmin__container.name }}-update.service"
            mode: '0644'
            owner: root
            group: root

        - name: 'Create autoupdate systemd timer'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ database_phpmyadmin__container.name }} timer

              [Timer]
              OnCalendar=*-*-* 08:00:00
              RandomizedDelaySec=30m
              Persistent=true

              [Install]
              WantedBy=timers.target
            dest: "/etc/systemd/system/container-{{ database_phpmyadmin__container.name }}-update.timer"
            mode: '0644'
            owner: root
            group: root

        - name: 'Start and enable autoupdate timer'
          ansible.builtin.systemd:
            name: "container-{{ database_phpmyadmin__container.name }}-update.timer"
            daemon_reload: true
            state: 'started'
            enabled: true
          when: 'not ansible_check_mode'

