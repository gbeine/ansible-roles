---

- name: 'Install phpMyAdmin'
  tags: [ 'database', 'database_phpmyadmin' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or phpmyadmin_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - database_phpmyadmin__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - database_phpmyadmin__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_phpmyadmin__invalid | join('. ') }}"
        quiet: true
      vars:
        database_phpmyadmin__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = database_phpmyadmin__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('phpmyadmin_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('phpmyadmin_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of phpmyadmin_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - database_phpmyadmin__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_phpmyadmin__errors | join(' ') }}"
        quiet: true
      vars:
        database_phpmyadmin__secret_targets: "{{ database_phpmyadmin__secrets | map(attribute='target') | list }}"
        database_phpmyadmin__environment_set: >-
          {{ database_phpmyadmin__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list }}
        database_phpmyadmin__environment_missing: >-
          {{ database_phpmyadmin__environment_required | reject('in', database_phpmyadmin__environment_set) | list }}
        database_phpmyadmin__secrets_missing: >-
          {{ database_phpmyadmin__secrets_required | reject('in', database_phpmyadmin__secret_targets) | list }}
        database_phpmyadmin__secrets_in_environment: >-
          {{ (database_phpmyadmin__secret_targets + database_phpmyadmin__secret_variables + database_phpmyadmin__secret_files.values() | list)
             | select('in', database_phpmyadmin__environment.keys() | list) | unique | list }}
        database_phpmyadmin__errors: >-
          {%- set errors = [] -%}
          {%- if database_phpmyadmin__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('phpMyAdmin needs the environment variables ' ~ (database_phpmyadmin__environment_required | join(', ')) ~ ', missing or empty: ' ~ (database_phpmyadmin__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if database_phpmyadmin__environment_server | select('in', database_phpmyadmin__environment_set) | list | length == 0 -%}
          {%-   set _ = errors.append('phpMyAdmin needs a server, set one of ' ~ (database_phpmyadmin__environment_server | join(', ')) ~ ' in phpmyadmin_environment.') -%}
          {%- endif -%}
          {%- if database_phpmyadmin__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('phpMyAdmin needs the secrets ' ~ (database_phpmyadmin__secrets_required | join(', ')) ~ ', missing: ' ~ (database_phpmyadmin__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if database_phpmyadmin__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets and their file variables must not be set in phpmyadmin_environment: ' ~ (database_phpmyadmin__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging phpmyadmin_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - database_phpmyadmin__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ database_phpmyadmin__errors | join(' ') }}"
        quiet: true
      vars:
        database_phpmyadmin__environment_unknown: >-
          {{ (database_phpmyadmin__container.environment | default({})).keys() | reject('in', database_phpmyadmin__environment_allowed) | list }}
        database_phpmyadmin__secrets_unknown: >-
          {{ database_phpmyadmin__secrets | map(attribute='target') | reject('in', database_phpmyadmin__secret_files.keys() | list) | list }}
        database_phpmyadmin__errors: >-
          {%- set errors = [] -%}
          {%- if database_phpmyadmin__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (database_phpmyadmin__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if database_phpmyadmin__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (database_phpmyadmin__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the variables of the image (database_phpmyadmin__environment_allowed) and the secrets ' ~ (database_phpmyadmin__secret_files.keys() | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ database_phpmyadmin__secrets }}"
      register: 'database_phpmyadmin__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ database_phpmyadmin__container.name }}"
        hostname: "{{ database_phpmyadmin__container.hostname }}"
        image: "{{ database_phpmyadmin__container.image }}"
        ip: "{{ database_phpmyadmin__container.ip }}"
        ip6: "{{ database_phpmyadmin__container.ipv6 | default(omit) }}"
        network: "{{ database_phpmyadmin__container.network }}"
        timezone: "{{ database_phpmyadmin__container.timezone }}"
        env: "{{ database_phpmyadmin__container.environment | default(omit) }}"
        etc_hosts: "{{ database_phpmyadmin__container.etc_hosts | default(omit) }}"
        expose: "{{ database_phpmyadmin__container.expose | default(omit) }}"
        label: "{{ database_phpmyadmin__container.labels | default(omit) }}"
        publish: "{{ database_phpmyadmin__container.publish | default(omit) }}"
        secrets: "{{ database_phpmyadmin__container.secrets | default(omit) }}"
        volume: "{{ database_phpmyadmin__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if database_phpmyadmin__container.requires is defined %}
          Requires={{ database_phpmyadmin__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'database_phpmyadmin__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ database_phpmyadmin__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if database_phpmyadmin__restart | bool else 'started' }}"
        enabled: true
      vars:
        database_phpmyadmin__running: >-
          {{ (ansible_facts.services[database_phpmyadmin__container.name + '.service'].state | default('')) == 'running' }}
        database_phpmyadmin__restart: >-
          {{ database_phpmyadmin__running | bool
             and (database_phpmyadmin__secrets_result is changed
                  or database_phpmyadmin__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'database_phpmyadmin__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ database_phpmyadmin__container.name }}"
        container_image: "{{ database_phpmyadmin__container.image }}"
        container_schedule: "{{ database_phpmyadmin__autoupdate_schedule }}"
