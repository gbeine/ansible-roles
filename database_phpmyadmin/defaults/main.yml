---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-phpmyadmin
#

database_phpmyadmin__ip: "{{ phpmyadmin_ip | mandatory }}"
database_phpmyadmin__ipv6: "{{ phpmyadmin_ipv6 }}"
database_phpmyadmin__network: "{{ phpmyadmin_network | mandatory }}"
database_phpmyadmin__hostname: "{{ phpmyadmin_hostname | mandatory }}"
database_phpmyadmin__timezone: "{{ phpmyadmin_timezone | mandatory }}"
database_phpmyadmin__labels: "{{ phpmyadmin_labels | default({}) }}"

database_phpmyadmin__db: "{{ phpmyadmin_db | default('phpmyadmin') }}"
database_phpmyadmin__db_user: "{{ phpmyadmin_db_user | default('phpmyadmin') }}"
database_phpmyadmin__db_pass: "{{ phpmyadmin_db_pass | mandatory }}"
database_phpmyadmin__db_host: "{{ phpmyadmin_db_host | mandatory }}"
database_phpmyadmin__db_port: "{{ phpmyadmin_db_port | default(3306) }}"
database_phpmyadmin__base_url: "{{ phpmyadmin_base_url | mandatory }}"

database_phpmyadmin__container: "{{ database_phpmyadmin__podman_container_default | combine(phpmyadmin_container | default({})) }}"

database_phpmyadmin__autoupdate_enabled: "{{ phpmyadmin_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

database_phpmyadmin__podman_name: 'phpmyadmin'
database_phpmyadmin__podman_image: 'docker.io/phpmyadmin'
database_phpmyadmin__podman_tag: 'latest'

database_phpmyadmin__podman_container_default:
  name: "{{ database_phpmyadmin__podman_name }}"
  hostname: "{{ database_phpmyadmin__hostname }}"
  image: "{{ database_phpmyadmin__podman_image }}:{{ database_phpmyadmin__podman_tag }}"
  ip: "{{ database_phpmyadmin__ip }}"
  ipv6: "{{ database_phpmyadmin__ipv6 | default(omit) }}"
  network: "{{ database_phpmyadmin__network }}"
  timezone: "{{ database_phpmyadmin__timezone }}"
  environment:
    PMA_PMADB: "{{ database_phpmyadmin__db }}"
    PMA_CONTROLUSER: "{{ database_phpmyadmin__db_user }}"
    PMA_HOST: "{{ database_phpmyadmin__db_host }}"
    PMA_PORT: "{{ database_phpmyadmin__db_port }}"
    PMA_ABSOLUTE_URI: "{{ database_phpmyadmin__base_url }}"
  labels: "{{ database_phpmyadmin__labels }}"
  secrets:
    - "pma_controluser_password,type=env,target=PMA_CONTROLPASS"
