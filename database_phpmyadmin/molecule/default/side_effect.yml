---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    database_phpmyadmin__test_case: "{{ database_phpmyadmin__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    database_phpmyadmin__test_vars: "{{ database_phpmyadmin__test_case.role_vars }}"
    database_phpmyadmin__test_checked_files:
      - "{{ database_phpmyadmin__test_quadlet_path }}"

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ database_phpmyadmin__test_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksum of the quadlet unit before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ database_phpmyadmin__test_checked_files }}"
      register: 'database_phpmyadmin__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include
    - name: 'Run database_phpmyadmin with phpmyadmin_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        phpmyadmin_container: [ 'environment' ]
        database_phpmyadmin__test_invalid:
          message: 'phpmyadmin_container is not a dictionary'
          # combine of the defaults fails before the role checks anything
          search: 'failed to combine variables, expected dicts'

    - name: 'Run database_phpmyadmin with a secret without target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        phpmyadmin_secrets:
          - name: 'phpmyadmin_controlpass'
            data: 'molecule-database-password'
        database_phpmyadmin__test_invalid:
          message: 'a secret without target'
          search: '^phpmyadmin_secrets entries need name, data and target$'

    - name: 'Run database_phpmyadmin without a server (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        phpmyadmin_environment:
          PMA_PORT: '3306'
        database_phpmyadmin__test_invalid:
          message: 'no server'
          search: '^phpMyAdmin needs a server, set one of PMA_HOST, PMA_HOSTS, PMA_SOCKET, PMA_SOCKETS, PMA_ARBITRARY in phpmyadmin_environment\.$'

    - name: 'Run database_phpmyadmin with the password of the control user in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        phpmyadmin_environment: "{{ database_phpmyadmin__test_vars.phpmyadmin_environment | combine({'PMA_CONTROLPASS': 'molecule'}) }}"
        database_phpmyadmin__test_invalid:
          message: 'the password of the control user in the environment'
          search: '^Secrets and their file variables must not be set in phpmyadmin_environment: PMA_CONTROLPASS\.$'

    - name: 'Run database_phpmyadmin with the file variable of the password of the control user in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        phpmyadmin_environment: "{{ database_phpmyadmin__test_vars.phpmyadmin_environment | combine({'PMA_CONTROLPASS_FILE': '/run/secrets/phpmyadmin_controlpass'}) }}"
        database_phpmyadmin__test_invalid:
          message: 'the file variable of the password of the control user in the environment'
          search: '^Secrets and their file variables must not be set in phpmyadmin_environment: PMA_CONTROLPASS_FILE\.$'

    - name: 'Run database_phpmyadmin with an unknown environment variable (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        phpmyadmin_environment: "{{ database_phpmyadmin__test_vars.phpmyadmin_environment | combine({'PMA_HOSTNAME': 'db'}) }}"
        database_phpmyadmin__test_invalid:
          message: 'an unknown environment variable'
          search: '^Unknown environment variables: PMA_HOSTNAME\.'

    - name: 'Run database_phpmyadmin with an unknown environment variable in phpmyadmin_container (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        phpmyadmin_container:
          environment:
            PMA_HOST: '10.89.0.20'
            FOO: 'bar'
        database_phpmyadmin__test_invalid:
          message: 'an unknown environment variable in phpmyadmin_container'
          search: '^Unknown environment variables: FOO\.'

    - name: 'Run database_phpmyadmin with an unknown secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        phpmyadmin_secrets: "{{ (database_phpmyadmin__test_vars.phpmyadmin_secrets | default([])) + [{'name': 'phpmyadmin_root', 'data': 'x', 'target': 'MYSQL_ROOT_PASSWORD'}] }}"
        database_phpmyadmin__test_invalid:
          message: 'an unknown secret'
          search: '^Unknown secrets: MYSQL_ROOT_PASSWORD\.'

    - name: 'Run database_phpmyadmin with the changed environment'
      when: database_phpmyadmin__test_case.side_effect | default(false)
      block:

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'phpmyadmin' ]
          register: 'database_phpmyadmin__test_started_before'
          changed_when: false

        - name: 'Set the changed environment'
          ansible.builtin.set_fact:
            phpmyadmin_environment: "{{ database_phpmyadmin__test_vars.phpmyadmin_environment | combine(database_phpmyadmin__test_side_effect_environment) }}"

        - name: 'Run database_phpmyadmin with the changed environment'
          ansible.builtin.include_role:
            name: 'database_phpmyadmin'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'phpmyadmin' ]
          register: 'database_phpmyadmin__test_started_after'
          changed_when: false

        - name: 'Assert the changed quadlet unit and the restart of the service'
          ansible.builtin.assert:
            that:
              - database_phpmyadmin__quadlet_result is changed
              - database_phpmyadmin__test_started_after.stdout | int > database_phpmyadmin__test_started_before.stdout | int
            fail_msg: >-
              quadlet changed: {{ database_phpmyadmin__quadlet_result is changed }},
              start before {{ database_phpmyadmin__test_started_before.stdout }}, after {{ database_phpmyadmin__test_started_after.stdout }}
