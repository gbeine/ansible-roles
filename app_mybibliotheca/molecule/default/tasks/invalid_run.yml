---
# Runs app_mybibliotheca with the invalid role variables passed as include parameters,
# the role has to fail before the quadlet unit or the secrets change.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run app_mybibliotheca with invalid variables (expect ERROR): {{ app_mybibliotheca__test_invalid.message }}"
  block:

    - name: 'Run app_mybibliotheca, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'app_mybibliotheca'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ app_mybibliotheca__test_invalid.message }}"

  rescue:

    - name: 'Read the checksums of the checked files after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ app_mybibliotheca__test_checked_files }}"
      register: 'app_mybibliotheca__test_md5_after'

    - name: 'Assert the run failed before the checked files changed'
      ansible.builtin.assert:
        that:
          - app_mybibliotheca__test_failure is search(app_mybibliotheca__test_invalid.search, multiline=true)
          - app_mybibliotheca__test_before | select('equalto', '') | list | length == 0
          - app_mybibliotheca__test_after == app_mybibliotheca__test_before
        fail_msg: >-
          Failure: {{ app_mybibliotheca__test_failure }}
          Checksums before: {{ app_mybibliotheca__test_before | join(', ') }},
          after: {{ app_mybibliotheca__test_after | join(', ') }}.
      vars:
        # Double quotes, so \n is a line break for the anchors of the searches
        app_mybibliotheca__test_failure: "{{ [ ansible_failed_result.msg | default(''), ansible_failed_result.stderr | default('') ] | join('\n') }}"
        app_mybibliotheca__test_before: "{{ app_mybibliotheca__test_md5_before.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
        app_mybibliotheca__test_after: "{{ app_mybibliotheca__test_md5_after.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
