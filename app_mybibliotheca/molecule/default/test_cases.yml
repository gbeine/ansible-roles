---
# Network created by container_podman in prepare.yml
app_mybibliotheca__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_mybibliotheca__test_image: 'docker.io/pickles4evaaaa/mybibliotheca:latest'
app_mybibliotheca__test_quadlet_path: '/etc/containers/systemd/mybibliotheca.container'

# PostgreSQL started by prepare.yml on both VMs, test credentials only
app_mybibliotheca__test_database:
  name: 'molecule-postgres'
  image: 'docker.io/library/postgres:17'
  ip: '10.89.0.20'
  database: 'bibliotheca'
  user: 'bibliotheca'
  password: 'molecule-database-password'

app_mybibliotheca__test_cases:

  # Only the mandatory variables, PostgreSQL with host, database and user
  - name: 'molecule-mybibliotheca-default'
    role_vars:
      mybibliotheca_home: '/opt/mybibliotheca'
      mybibliotheca_ip: '10.89.0.80'
      mybibliotheca_network: 'podman-molecule'
      mybibliotheca_hostname: 'mybibliotheca-default'
      mybibliotheca_timezone: 'Europe/Berlin'
      mybibliotheca_environment:
        POSTGRES_HOST: '10.89.0.20'
        POSTGRES_DB: 'bibliotheca'
        POSTGRES_USER: 'bibliotheca'
      mybibliotheca_secrets:
        - name: 'mybibliotheca_secret_key'
          data: 'molecule-secret-key-default'
          target: 'SECRET_KEY'
        - name: 'mybibliotheca_postgres_password'
          data: 'molecule-database-password'
          target: 'POSTGRES_PASSWORD'
      mybibliotheca_admin:
        name: 'molecule-admin'
        email: 'admin@molecule.test'
        password: 'molecule-admin-password-1'
    expect:
      ip: '10.89.0.80'
      ip6: ~
      admin:
        name: 'molecule-admin'
        password: 'molecule-admin-password-1'
      quadlet:
        - 'Secret=mybibliotheca_secret_key,type=env,target=SECRET_KEY'
        - 'Secret=mybibliotheca_postgres_password,type=env,target=POSTGRES_PASSWORD'
        - 'Volume=/opt/mybibliotheca/data:/app/data:Z'
      env:
        - 'TZ=Europe/Berlin'
        - 'TIMEZONE=Europe/Berlin'
        - 'POSTGRES_HOST=10.89.0.20'
        - 'POSTGRES_PORT=5432'
        - 'POSTGRES_DB=bibliotheca'
        - 'POSTGRES_USER=bibliotheca'

  # IPv6, labels, PostgreSQL with a DSN, the name of the site, the workers and a boolean
  - name: 'molecule-mybibliotheca'
    role_vars:
      mybibliotheca_home: '/opt/mybibliotheca'
      mybibliotheca_ip: '10.89.0.81'
      mybibliotheca_ipv6: 'fd00:89::81'
      mybibliotheca_network: 'podman-molecule'
      mybibliotheca_hostname: 'mybibliotheca-molecule'
      mybibliotheca_timezone: 'Europe/Berlin'
      mybibliotheca_labels:
        traefik.enable: 'true'
      mybibliotheca_environment:
        SITE_NAME: 'Molecule Library'
        WORKERS: '2'
        UPDATE_CHECK_ENABLED: false
      mybibliotheca_secrets:
        - name: 'mybibliotheca_secret_key'
          data: 'molecule-secret-key'
          target: 'SECRET_KEY'
        - name: 'mybibliotheca_postgres_dsn'
          data: 'postgresql://bibliotheca:molecule-database-password@10.89.0.20:5432/bibliotheca'
          target: 'POSTGRES_DSN'
      mybibliotheca_admin:
        name: 'molecule-admin'
        email: 'admin@molecule.test'
        password: 'molecule-admin-password-1'
    side_effect:
      environment:
        SITE_NAME: 'Molecule Changed'
        WORKERS: '2'
        UPDATE_CHECK_ENABLED: false
      admin:
        name: 'molecule-admin'
        email: 'library@molecule.test'
        password: 'molecule-admin-changed-2'
    expect:
      ip: '10.89.0.81'
      ip6: 'fd00:89::81'
      admin:
        name: 'molecule-admin'
        password: 'molecule-admin-changed-2'
        former_password: 'molecule-admin-password-1'
      quadlet:
        - 'Secret=mybibliotheca_secret_key,type=env,target=SECRET_KEY'
        - 'Secret=mybibliotheca_postgres_dsn,type=env,target=POSTGRES_DSN'
        - 'Label=traefik.enable=true'
      env:
        - 'TZ=Europe/Berlin'
        - 'TIMEZONE=Europe/Berlin'
        - 'SITE_NAME=Molecule Changed'
        - 'WORKERS=2'
        - 'UPDATE_CHECK_ENABLED=false'
