---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks:
      - "{{ app_mybibliotheca__test_network }}"
    podman_default_network: "{{ app_mybibliotheca__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    # verify logs in to the login form with curl, it keeps the cookies of the session in a file
    - name: 'Install curl'
      ansible.builtin.apt:
        name: 'curl'
        state: 'present'
        update_cache: true

    - name: 'Pull the images, so the first start of the services does not time out'
      containers.podman.podman_image:
        name: "{{ item }}"
      loop:
        - "{{ app_mybibliotheca__test_image }}"
        - "{{ app_mybibliotheca__test_database.image }}"
      register: 'app_mybibliotheca__test_pull'
      until: app_mybibliotheca__test_pull is succeeded
      retries: 5
      delay: 30

    # The database and its user are prepared, MyBibliotheca only creates the schema
    - name: 'Start PostgreSQL'
      containers.podman.podman_container:
        name: "{{ app_mybibliotheca__test_database.name }}"
        image: "{{ app_mybibliotheca__test_database.image }}"
        network: "{{ app_mybibliotheca__test_network.name }}"
        ip: "{{ app_mybibliotheca__test_database.ip }}"
        env:
          POSTGRES_DB: "{{ app_mybibliotheca__test_database.database }}"
          POSTGRES_USER: "{{ app_mybibliotheca__test_database.user }}"
          POSTGRES_PASSWORD: "{{ app_mybibliotheca__test_database.password }}"
        state: 'started'

    # The initialization runs PostgreSQL on the socket only, the network address answers after the restart
    - name: 'Wait for the initialization of PostgreSQL'
      ansible.builtin.command:
        argv: [ 'podman', 'exec', "{{ app_mybibliotheca__test_database.name }}", 'pg_isready', '-h', "{{ app_mybibliotheca__test_database.ip }}",
                '-U', "{{ app_mybibliotheca__test_database.user }}", '-d', "{{ app_mybibliotheca__test_database.database }}" ]
      register: 'app_mybibliotheca__test_ready'
      until: app_mybibliotheca__test_ready.rc == 0
      retries: 60
      delay: 2
      changed_when: false
