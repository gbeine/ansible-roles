---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/app-mybibliotheca
#

app_mybibliotheca__home: "{{ mybibliotheca_home | mandatory }}"
app_mybibliotheca__ip: "{{ mybibliotheca_ip | mandatory }}"
app_mybibliotheca__ipv6: "{{ mybibliotheca_ipv6 }}"
app_mybibliotheca__network: "{{ mybibliotheca_network | mandatory }}"
app_mybibliotheca__hostname: "{{ mybibliotheca_hostname | mandatory }}"
app_mybibliotheca__timezone: "{{ mybibliotheca_timezone | mandatory }}"
app_mybibliotheca__labels: "{{ mybibliotheca_labels }}"

app_mybibliotheca__version: "{{ mybibliotheca_version | default('latest') }}"

app_mybibliotheca__container: "{{ app_mybibliotheca__podman_container_default | combine(mybibliotheca_container | default({})) }}"

# The configuration of MyBibliotheca, merged over the default, the database is PostgreSQL
app_mybibliotheca__environment: "{{ app_mybibliotheca__environment_default | combine(mybibliotheca_environment | default({})) }}"

# Secrets with name, data and target, SECRET_KEY and the password or the DSN of PostgreSQL are mandatory
app_mybibliotheca__secrets: "{{ mybibliotheca_secrets | default([]) }}"

# The administrator of MyBibliotheca with name, email and password
app_mybibliotheca__admin: "{{ mybibliotheca_admin | mandatory }}"

app_mybibliotheca__autoupdate_enabled: "{{ mybibliotheca_autoupdate_enabled | default(false) }}"
app_mybibliotheca__autoupdate_schedule: "{{ mybibliotheca_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_mybibliotheca__podman_name: 'mybibliotheca'
app_mybibliotheca__podman_image: 'docker.io/pickles4evaaaa/mybibliotheca'
app_mybibliotheca__port: 5054

# The entrypoint sets the owner of the Kuzu data to 1000 and the mode to 0755
app_mybibliotheca__data_owner: 1000

app_mybibliotheca__environment_default:
  TZ: "{{ app_mybibliotheca__timezone }}"
  TIMEZONE: "{{ app_mybibliotheca__timezone }}"
  POSTGRES_PORT: '5432'
  KUZU_DB_PATH: '/app/data/kuzu'

# A new installation uses PostgreSQL if these variables or the secret POSTGRES_DSN are set, otherwise Kuzu
app_mybibliotheca__environment_database: [ 'POSTGRES_HOST', 'POSTGRES_DB', 'POSTGRES_USER' ]
app_mybibliotheca__environment_required: []

# Without SECRET_KEY the entrypoint generates a new key on every start, the sessions are lost
app_mybibliotheca__secrets_required: [ 'SECRET_KEY' ]
# One of them is needed for PostgreSQL
app_mybibliotheca__secrets_database: [ 'POSTGRES_PASSWORD', 'POSTGRES_DSN' ]

# The environment of the container, booleans in lower case
app_mybibliotheca__environment_container: >-
  {%- set environment = {} -%}
  {%- for key, value in app_mybibliotheca__environment.items() -%}
  {%-   set _ = environment.update({ key: (value | string | lower) if value is boolean else value }) -%}
  {%- endfor -%}
  {{ environment }}

app_mybibliotheca__admin_keys: [ 'name', 'email', 'password' ]
app_mybibliotheca__admin_name_pattern: '^[A-Za-z0-9_.-]{1,64}$'
app_mybibliotheca__admin_email_pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
# The minimum length of passwords of MyBibliotheca without PASSWORD_MIN_LENGTH (app/utils/password_policy.py)
app_mybibliotheca__password_length: 8
app_mybibliotheca__password_length_min: 6
app_mybibliotheca__password_length_max: 128

# The entrypoint caps the workers of Gunicorn
app_mybibliotheca__workers_min: 1
app_mybibliotheca__workers_max: 32

app_mybibliotheca__podman_container_default:
  name: "{{ app_mybibliotheca__podman_name }}"
  hostname: "{{ app_mybibliotheca__hostname }}"
  image: "{{ app_mybibliotheca__podman_image }}:{{ app_mybibliotheca__version }}"
  ip: "{{ app_mybibliotheca__ip }}"
  ipv6: "{{ app_mybibliotheca__ipv6 | default(omit) }}"
  network: "{{ app_mybibliotheca__network }}"
  timezone: "{{ app_mybibliotheca__timezone }}"
  labels: "{{ app_mybibliotheca__labels | default(omit) }}"
  # Set with mybibliotheca_environment, merged over the default
  environment: "{{ app_mybibliotheca__environment_container }}"
  volumes:
    - "{{ app_mybibliotheca__home }}/data:/app/data:Z"
  # MyBibliotheca reads the secrets only from the environment,
  # entries without name or target are left out, the validation of the secrets reports them
  secrets: >-
    {{ (app_mybibliotheca__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='name')
        | zip(app_mybibliotheca__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='target'))
        | map('join', ',type=env,target=') | list)
      if (app_mybibliotheca__secrets is sequence and app_mybibliotheca__secrets is not string and app_mybibliotheca__secrets | length > 0)
      else omit }}

# Targets of the secrets in mybibliotheca_secrets, MyBibliotheca reads them with os.getenv,
# the URLs of the databases and of Redis contain passwords
app_mybibliotheca__secrets_allowed:
  - 'SECRET_KEY'
  - 'POSTGRES_PASSWORD'
  - 'POSTGRES_DSN'
  - 'DATABASE_URL'
  - 'REDIS_PASSWORD'
  - 'REDIS_URL'
  - 'CACHE_REDIS_URL'
  - 'MAIL_PASSWORD'
  - 'GOOGLE_BOOKS_API_KEY'
  - 'GOOGLE_API_KEY'
  - 'ISBN_API_KEY'

app_mybibliotheca__secret_variables: "{{ app_mybibliotheca__secrets_allowed }}"

# The variables MyBibliotheca and the entrypoint compare with true
app_mybibliotheca__environment_booleans:
  - 'ABS_INSECURE'
  - 'ABS_LISTENING_DEBUG'
  - 'ACCESS_LOGS'
  - 'API_LIMITS_ENABLED'
  - 'AUTO_MIGRATE'
  - 'COVER_VERBOSE'
  - 'DISABLE_OWNS_MIGRATION'
  - 'DISABLE_OWNS_MIGRATION_BACKUP'
  - 'DISABLE_SCHEMA_PREFLIGHT'
  - 'ENABLE_OWNS_SCHEMA'
  - 'FLASK_DEBUG'
  - 'FORCE_OWNS_MIGRATION_BACKUP'
  - 'GRAPH_DATABASE_ENABLED'
  - 'IMPORT_VERBOSE'
  - 'KUZU_AUTO_RECOVER_CLEAR'
  - 'KUZU_BACKUP_QUIESCE'
  - 'KUZU_DEBUG'
  - 'KUZU_ENABLE_AUTO_RENAME_CORRUPT'
  - 'KUZU_QUERY_LOG'
  - 'KUZU_REDIS_CACHE_ENABLED'
  - 'MAIL_USE_TLS'
  - 'METADATA_DEBUG'
  - 'MYBIBLIOTHECA_DEBUG'
  - 'MYBIBLIOTHECA_DEBUG_AUTH'
  - 'MYBIBLIOTHECA_DEBUG_CSRF'
  - 'MYBIBLIOTHECA_DEBUG_REQUESTS'
  - 'MYBIBLIOTHECA_DEBUG_SESSION'
  - 'MYBIBLIOTHECA_REQUEST_LOG'
  - 'MYBIBLIOTHECA_VERBOSE_INIT'
  - 'OPENLIBRARY_USE_EDITION_API'
  - 'PREFLIGHT_NODES_ONLY'
  - 'PREFLIGHT_REL_ONLY'
  - 'SCHEMA_PREFLIGHT_AUTORUN'
  - 'SCHEMA_PREFLIGHT_FORCE'
  - 'SKIP_PREFLIGHT_BACKUP'
  - 'UNIFIED_METADATA_DISABLE_INTERNAL_PARALLEL'
  - 'UNIFIED_METADATA_SKIP_OPENLIB_IF_GOOGLE_COVER'
  - 'UPDATE_CHECK_ENABLED'
  - 'VERBOSE'

# Generated from the os.getenv and os.environ calls of app/, config.py and run.py, docker-entrypoint.sh and the Dockerfile
# of MyBibliotheca v3.0.3, without the secrets, the variables set by the application itself (HOSTNAME, PATH_INFO, REQUEST_METHOD,
# DEBUG_ENABLED_*, DEBUG_DISABLED_*, APP_VERSION, POSTGRES_WORKERS), the variables for development (DEV_ADMIN_USERNAME,
# DEV_ADMIN_PASSWORD, API_TEST_TOKEN, FLASK_ENV), the unused ADMIN_* and SECURITY_PASSWORD_SALT
# and KUZU_FORCE_RESET, which deletes the database at the start
