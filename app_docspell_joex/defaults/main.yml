---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/docspell-joex
#

app_docspell_joex__home: "{{ docspell_joex_home | mandatory }}"
app_docspell_joex__ip: "{{ docspell_joex_ip | mandatory }}"
app_docspell_joex__ipv6: "{{ docspell_joex_ipv6 }}"
app_docspell_joex__network: "{{ docspell_joex_network | mandatory }}"
app_docspell_joex__hostname: "{{ docspell_joex_hostname | mandatory }}"
app_docspell_joex__timezone: "{{ docspell_joex_timezone | mandatory }}"
app_docspell_joex__labels: "{{ docspell_joex_labels }}"

app_docspell_joex__version: "{{ docspell_joex_version | default('latest') }}"

# The content of joex.conf, merged recursively over the default, null removes an option
app_docspell_joex__config: "{{ app_docspell_joex__config_default | combine(docspell_joex_config | default({}), recursive=true) }}"

# Secrets with name, data and target, the target is the path of the option, e.g. docspell.joex.jdbc.password
app_docspell_joex__secrets: "{{ docspell_joex_secrets | default([]) }}"

# Only the variables of the image, the options of Docspell are set with docspell_joex_config
app_docspell_joex__environment: "{{ docspell_joex_environment }}"

app_docspell_joex__container: "{{ app_docspell_joex__podman_container_default | combine(docspell_joex_container | default({})) }}"

app_docspell_joex__autoupdate_enabled: "{{ docspell_joex_autoupdate_enabled | default(false) }}"
app_docspell_joex__autoupdate_schedule: "{{ docspell_joex_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_docspell_joex__podman_name: 'docspell-joex'
app_docspell_joex__podman_image: 'docker.io/docspell/joex'
app_docspell_joex__podman_tag: "{{ app_docspell_joex__version }}"

app_docspell_joex__config_file: "{{ app_docspell_joex__home }}/joex.conf"
app_docspell_joex__config_target: '/opt/joex.conf'
app_docspell_joex__files_dir: "{{ app_docspell_joex__home }}/files"
app_docspell_joex__secrets_dir: '/run/secrets'

app_docspell_joex__config_default:
  docspell:
    joex:
      base-url: "http://{{ app_docspell_joex__ip }}:7878"
      bind:
        address: '0.0.0.0'
        port: 7878

# Options set by the role, the container needs the address
app_docspell_joex__config_role:
  docspell.joex.bind.address: '0.0.0.0'

app_docspell_joex__config_required:
  - 'docspell.joex.jdbc.url'
  - 'docspell.joex.jdbc.user'

# Options whose values are dictionaries with free keys, they are not split into paths
app_docspell_joex__config_leaves:
  - 'docspell.joex.logging.levels'
  - 'docspell.joex.full-text-search.postgresql.pg-config'

# The targets of the secrets, the paths of the options carrying passwords
app_docspell_joex__secrets_allowed:
  - 'docspell.joex.jdbc.password'
  - 'docspell.joex.full-text-search.postgresql.jdbc.password'
  - 'docspell.joex.files.stores.minio.secret-key'
  - 'docspell.joex.convert.decrypt-pdf.passwords'

app_docspell_joex__secrets_required:
  - 'docspell.joex.jdbc.password'

# The variables of the start script of the image
app_docspell_joex__environment_allowed:
  - 'JAVA_OPTS'
  - 'TZ'

# The options of joex.conf as paths, the values of lists and of app_docspell_joex__config_leaves are not split,
# the macro returns JSON, a macro cannot change a list of the caller
app_docspell_joex__config_options: >-
  {%- macro flatten(prefix, value) -%}
  {%-   for key, item in value.items() -%}
  {%-     set path = prefix ~ key -%}
  {%-     if item is mapping and item | length > 0 and path not in app_docspell_joex__config_leaves -%}
  {{-       flatten(path ~ '.', item) -}}
  {%-     else -%}
  {{-       ',' ~ ({ 'path': path, 'value': item } | to_json) -}}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endmacro -%}
  {%- set options = flatten('', app_docspell_joex__config) -%}
  {{ ('[' ~ options[1:] ~ ']') | from_json }}

# Entries without name or target are left out, the validation of the secrets reports them
app_docspell_joex__secrets_valid: >-
  {{ (app_docspell_joex__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | list)
     if (app_docspell_joex__secrets is sequence and app_docspell_joex__secrets is not string) else [] }}

# One line per option with the value as JSON, JSON is valid HOCON, the secrets are included at the end
# The files of the secrets end with .conf, without an extension HOCON looks for <name>.conf, .json and .properties
app_docspell_joex__config_lines: >-
  {%- set lines = [ '#', '# Ansible managed', '#', '' ] -%}
  {%- for option in app_docspell_joex__config_options if option.value is not none -%}
  {%-   set _ = lines.append(option.path ~ ' = ' ~ (option.value | to_json)) -%}
  {%- endfor -%}
  {%- for secret in app_docspell_joex__secrets_valid -%}
  {%-   set _ = lines.append('include required(file("' ~ app_docspell_joex__secrets_dir ~ '/' ~ secret.name ~ '.conf"))') -%}
  {%- endfor -%}
  {{ lines }}

app_docspell_joex__podman_container_default:
  name: "{{ app_docspell_joex__podman_name }}"
  hostname: "{{ app_docspell_joex__hostname }}"
  image: "{{ app_docspell_joex__podman_image }}:{{ app_docspell_joex__podman_tag }}"
  ip: "{{ app_docspell_joex__ip }}"
  ipv6: "{{ app_docspell_joex__ipv6 | default(omit) }}"
  network: "{{ app_docspell_joex__network }}"
  timezone: "{{ app_docspell_joex__timezone }}"
  labels: "{{ app_docspell_joex__labels | default(omit) }}"
  command:
    - "{{ app_docspell_joex__config_target }}"
  # Without docspell_joex_environment the quadlet unit has no environment
  environment: "{{ app_docspell_joex__environment | default(omit) }}"
  # The secrets are HOCON files included by the configuration
  secrets: >-
    {%- set secrets = [] -%}
    {%- for secret in app_docspell_joex__secrets_valid -%}
    {%-   set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ app_docspell_joex__secrets_dir ~ '/' ~ secret.name ~ '.conf,mode=0400') -%}
    {%- endfor -%}
    {{ secrets if secrets | length > 0 else omit }}
  # docspell_joex_container.volumes replaces the list completely
  volumes:
    - "{{ app_docspell_joex__config_file }}:{{ app_docspell_joex__config_target }}:ro,Z"
    # The store filesystem, shared with app_docspell
    - "{{ app_docspell_joex__files_dir }}:/srv/docspell/files:z"

# Generated from modules/joex/src/main/resources/reference.conf of Docspell v0.42.0,
