---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    backup_scripts__test_case: "{{ backup_scripts__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    backup_scripts__test_expect: "{{ backup_scripts__test_case.expect }}"
    backup_scripts__test_restic_argv:
      - 'restic'
      - '--repo'
      - 'sftp:backup:repository'
      - '--option'
      - "sftp.command=ssh -i {{ backup_scripts__test_key }} {{ backup_scripts__test_user }}@localhost -s sftp"
      - '--password-file'
      - "{{ backup_scripts__test_password_file }}"
      - '--no-cache'

  tasks:

    - name: 'Find the files of the library and configuration directories'
      ansible.builtin.find:
        paths: [ "{{ backup_scripts__test_lib_dir }}", "{{ backup_scripts__test_etc_dir }}" ]
        file_type: 'any'
      register: 'backup_scripts__test_found'

    - name: 'Assert exactly the expected scripts and configurations exist'
      ansible.builtin.assert:
        that:
          - backup_scripts__test_found.files | map(attribute='path') | sort == backup_scripts__test_paths | sort
        fail_msg: "{{ backup_scripts__test_found.files | map(attribute='path') | sort | join(', ') }}"
      vars:
        backup_scripts__test_paths: >-
          {{ backup_scripts__test_expect.lib_files | map('regex_replace', '^', backup_scripts__test_lib_dir + '/') | list
             + backup_scripts__test_expect.etc_files | map('regex_replace', '^', backup_scripts__test_etc_dir + '/') | list }}

    - name: 'Read the state of the scripts'
      ansible.builtin.stat:
        path: "{{ backup_scripts__test_lib_dir }}/{{ item }}"
      loop: "{{ backup_scripts__test_expect.lib_files }}"
      register: 'backup_scripts__test_scripts'

    - name: 'Assert the scripts are executable'
      ansible.builtin.assert:
        that:
          - item.stat.executable
        fail_msg: "{{ item.item }}"
        quiet: true
      loop: "{{ backup_scripts__test_scripts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: 'Verify restic'
      when: "'restic' in backup_scripts__test_case.role_vars.backup_scripts | default([])"
      block:

        - name: 'Read the state of the password file'
          ansible.builtin.stat:
            path: "{{ backup_scripts__test_etc_dir }}/restic-password"
          register: 'backup_scripts__test_restic_password_stat'

        - name: 'Read the configuration of restic'
          ansible.builtin.slurp:
            src: "{{ backup_scripts__test_etc_dir }}/restic"
          register: 'backup_scripts__test_restic_config'

        - name: 'Assert the password file is only readable by root and used by the script'
          ansible.builtin.assert:
            that:
              - backup_scripts__test_restic_password_stat.stat.pw_name == 'root'
              - backup_scripts__test_restic_password_stat.stat.mode == '0400'
              - ('daily_backup_restic_password_file="' ~ backup_scripts__test_etc_dir ~ '/restic-password"') in backup_scripts__test_config
              - ('daily_backup_restic_backend="SFTP"') in backup_scripts__test_config
            fail_msg: "{{ backup_scripts__test_restic_password_stat.stat.mode | default('absent') }}: {{ backup_scripts__test_config }}"
          vars:
            backup_scripts__test_config: "{{ backup_scripts__test_restic_config.content | b64decode }}"

        # restic reads the password file of side_effect
        - name: 'Run the restic script with the password file'
          ansible.builtin.command:
            argv: [ "{{ backup_scripts__test_lib_dir }}/950.backup.restic" ]
            stdin: ''
          register: 'backup_scripts__test_main'
          changed_when: false
          failed_when: false

        - name: 'Assert the restic script succeeded'
          ansible.builtin.assert:
            that:
              - backup_scripts__test_main.rc == 0
            fail_msg: "{{ backup_scripts__test_main.stdout }} {{ backup_scripts__test_main.stderr }}"

        - name: 'Read the snapshots of the repository'
          ansible.builtin.command:
            argv: "{{ backup_scripts__test_restic_argv + ['snapshots', '--json'] }}"
          register: 'backup_scripts__test_snapshots'
          changed_when: false

        - name: 'List the files of the first and the latest snapshot'
          ansible.builtin.command:
            argv: "{{ backup_scripts__test_restic_argv + ['ls', item] }}"
          loop:
            - "{{ (backup_scripts__test_snapshots.stdout | from_json | first).id }}"
            - 'latest'
          register: 'backup_scripts__test_ls'
          changed_when: false

        # The first snapshot was taken in side_effect with the password on STDIN, the latest one with the password file and the exclude
        - name: 'Assert the snapshots contain the included directory and the latest one not the excluded directory'
          ansible.builtin.assert:
            that:
              - backup_scripts__test_snapshot_list | length >= 2
              - backup_scripts__test_snapshot_list | map(attribute='paths') | map('sort') | unique | list == [ [ backup_scripts__test_data_dir ] ]
              - (backup_scripts__test_data_dir ~ '/data.txt') in backup_scripts__test_ls.results[0].stdout_lines
              - (backup_scripts__test_excluded_dir ~ '/excluded.txt') in backup_scripts__test_ls.results[0].stdout_lines
              - (backup_scripts__test_data_dir ~ '/data.txt') in backup_scripts__test_ls.results[1].stdout_lines
              - (backup_scripts__test_excluded_dir ~ '/excluded.txt') not in backup_scripts__test_ls.results[1].stdout_lines
            fail_msg: >-
              snapshots: {{ backup_scripts__test_snapshot_list | map(attribute='paths') | list }},
              first: {{ backup_scripts__test_ls.results[0].stdout_lines }},
              latest: {{ backup_scripts__test_ls.results[1].stdout_lines }}
          vars:
            backup_scripts__test_snapshot_list: "{{ backup_scripts__test_snapshots.stdout | from_json }}"

    - name: 'Verify borg'
      when: "'borg' in backup_scripts__test_case.role_vars.backup_scripts | default([])"
      environment:
        BORG_PASSCOMMAND: "cat {{ backup_scripts__test_password_file }}"
        BORG_RSH: "ssh -i {{ backup_scripts__test_key }}"
      vars:
        backup_scripts__test_borg_repository: "ssh://{{ backup_scripts__test_user }}@localhost/./borg-repository"
      block:

        - name: 'Read the state of the password file of borg'
          ansible.builtin.stat:
            path: "{{ backup_scripts__test_etc_dir }}/borg-password"
          register: 'backup_scripts__test_borg_password_stat'

        - name: 'Read the configuration of borg'
          ansible.builtin.slurp:
            src: "{{ backup_scripts__test_etc_dir }}/borg"
          register: 'backup_scripts__test_borg_config'

        - name: 'Assert the password file of borg is only readable by root and used by the script'
          ansible.builtin.assert:
            that:
              - backup_scripts__test_borg_password_stat.stat.pw_name == 'root'
              - backup_scripts__test_borg_password_stat.stat.mode == '0400'
              - ('daily_backup_borg_password_command="cat ' ~ backup_scripts__test_etc_dir ~ '/borg-password"') in backup_scripts__test_config
            fail_msg: "{{ backup_scripts__test_borg_password_stat.stat.mode | default('absent') }}: {{ backup_scripts__test_config }}"
          vars:
            backup_scripts__test_config: "{{ backup_scripts__test_borg_config.content | b64decode }}"

        # borg reads the password file of side_effect
        - name: 'Run the borg script with the password file'
          ansible.builtin.command:
            argv: [ "{{ backup_scripts__test_lib_dir }}/950.backup.borgbackup" ]
            stdin: ''
          register: 'backup_scripts__test_borg_run'
          changed_when: false
          failed_when: false

        - name: 'Assert the borg script succeeded'
          ansible.builtin.assert:
            that:
              - backup_scripts__test_borg_run.rc == 0
            fail_msg: "{{ backup_scripts__test_borg_run.stdout }} {{ backup_scripts__test_borg_run.stderr }}"

        - name: 'Read the archives of the repository'
          ansible.builtin.command:
            argv: [ 'borg', 'list', '--json', "{{ backup_scripts__test_borg_repository }}" ]
          register: 'backup_scripts__test_borg_archives'
          changed_when: false

        - name: 'List the files of the first and the latest archive'
          ansible.builtin.command:
            argv: [ 'borg', 'list', '--format', '{path}{NL}', "{{ backup_scripts__test_borg_repository }}::{{ item }}" ]
          loop:
            - "{{ (backup_scripts__test_borg_list | first).name }}"
            - "{{ (backup_scripts__test_borg_list | last).name }}"
          register: 'backup_scripts__test_borg_ls'
          changed_when: false
          vars:
            backup_scripts__test_borg_list: "{{ (backup_scripts__test_borg_archives.stdout | from_json).archives }}"

        # The first archive was created in side_effect with the password on STDIN, the latest one with the password file and the exclude,
        # borg stores the paths without the leading slash
        - name: 'Assert the archives contain the included directory and the latest one not the excluded directory'
          ansible.builtin.assert:
            that:
              - (backup_scripts__test_borg_archives.stdout | from_json).archives | length >= 2
              - (backup_scripts__test_data ~ '/data.txt') in backup_scripts__test_borg_ls.results[0].stdout_lines
              - (backup_scripts__test_excluded ~ '/excluded.txt') in backup_scripts__test_borg_ls.results[0].stdout_lines
              - (backup_scripts__test_data ~ '/data.txt') in backup_scripts__test_borg_ls.results[1].stdout_lines
              - (backup_scripts__test_excluded ~ '/excluded.txt') not in backup_scripts__test_borg_ls.results[1].stdout_lines
            fail_msg: >-
              archives: {{ (backup_scripts__test_borg_archives.stdout | from_json).archives | map(attribute='name') | list }},
              first: {{ backup_scripts__test_borg_ls.results[0].stdout_lines }},
              latest: {{ backup_scripts__test_borg_ls.results[1].stdout_lines }}
          vars:
            backup_scripts__test_data: "{{ backup_scripts__test_data_dir | regex_replace('^/', '') }}"
            backup_scripts__test_excluded: "{{ backup_scripts__test_excluded_dir | regex_replace('^/', '') }}"

    - name: 'Verify MariaDB, MySQL and PostgreSQL'
      when: "'mariadb' in backup_scripts__test_case.role_vars.backup_scripts | default([])"
      block:

        - name: 'Read the state of the password files of the databases'
          ansible.builtin.stat:
            path: "{{ backup_scripts__test_etc_dir }}/{{ item.name }}-password"
          loop: "{{ backup_scripts__test_databases }}"
          loop_control:
            label: "{{ item.name }}"
          register: 'backup_scripts__test_database_password_stat'

        - name: 'Read the configurations of the databases'
          ansible.builtin.slurp:
            src: "{{ backup_scripts__test_etc_dir }}/{{ item.name }}"
          loop: "{{ backup_scripts__test_databases }}"
          loop_control:
            label: "{{ item.name }}"
          register: 'backup_scripts__test_database_config'

        - name: 'Assert the password files are only readable by root and used by the scripts'
          ansible.builtin.assert:
            that:
              - item.0.stat.pw_name == 'root'
              - item.0.stat.mode == '0400'
              - ('daily_backup_' ~ item.0.item.name ~ '_password_file="' ~ item.0.stat.path ~ '"') in backup_scripts__test_config
            fail_msg: "{{ item.0.stat.mode | default('absent') }}: {{ backup_scripts__test_config }}"
          loop: "{{ backup_scripts__test_database_password_stat.results | zip(backup_scripts__test_database_config.results) | list }}"
          loop_control:
            label: "{{ item.0.item.name }}"
          vars:
            backup_scripts__test_config: "{{ item.1.content | b64decode }}"

        # The scripts read the password files of side_effect
        - name: 'Run the scripts of the databases with the password files'
          ansible.builtin.command:
            argv: [ "{{ backup_scripts__test_lib_dir }}/910.backup.{{ item.name }}" ]
            stdin: ''
          loop: "{{ backup_scripts__test_databases }}"
          loop_control:
            label: "{{ item.name }}"
          register: 'backup_scripts__test_database_run'
          changed_when: false
          failed_when: false

        - name: 'Assert the scripts of the databases succeeded'
          ansible.builtin.assert:
            that:
              - item.rc == 0
            fail_msg: "{{ item.stdout }} {{ item.stderr }}"
          loop: "{{ backup_scripts__test_database_run.results }}"
          loop_control:
            label: "{{ item.item.name }}"

        - name: 'Find the dumps'
          ansible.builtin.find:
            paths: "{{ item.backup_dir }}"
          loop: "{{ backup_scripts__test_databases }}"
          loop_control:
            label: "{{ item.name }}"
          register: 'backup_scripts__test_dumps'

        - name: 'Read the dump of the database molecule'
          ansible.builtin.shell:
            cmd: "set -o pipefail; {{ item.read_dump | replace('{file}', item.backup_dir ~ '/molecule-*.' ~ item.extension) }}"
            executable: '/bin/bash'
          loop: "{{ backup_scripts__test_databases }}"
          loop_control:
            label: "{{ item.name }}"
          register: 'backup_scripts__test_dump'
          changed_when: false

        # The old dump of prepare is older than keep_days, the ignored databases are not dumped
        - name: 'Assert the dumps contain the row of the init script, the old dump is removed and the ignored databases are not dumped'
          ansible.builtin.assert:
            that:
              - backup_scripts__test_files | select('match', '^molecule-[0-9]{8}\.' ~ item.0.item.extension ~ '$') | list | length == 1
              - "'old-20000101.' ~ item.0.item.extension not in backup_scripts__test_files"
              - backup_scripts__test_files | select('match', '^(information_schema|performance_schema|sys|template0|template1)-') | list | length == 0
              - item.1.stdout is search(item.0.item.row)
            fail_msg: "{{ backup_scripts__test_files }}"
          loop: "{{ backup_scripts__test_dumps.results | zip(backup_scripts__test_dump.results) | list }}"
          loop_control:
            label: "{{ item.0.item.name }}"
          vars:
            backup_scripts__test_files: "{{ item.0.files | map(attribute='path') | map('basename') | list }}"
