---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  tasks:

    - name: 'Create the directories of the scripts'
      ansible.builtin.file:
        path: "{{ item }}"
        state: 'directory'
        mode: '0755'
      loop: [ "{{ backup_scripts__test_etc_dir }}", "{{ backup_scripts__test_lib_dir }}" ]
      when: inventory_hostname == 'molecule-backup-scripts-default'

    # borg, restic, mariadb and mysql are not selected, their files are pruned, the script of another role stays
    - name: 'Create files of borg, restic, mariadb and mysql and a script of another role'
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: "#!/bin/sh\n"
        mode: '0755'
      loop:
        - "{{ backup_scripts__test_lib_dir }}/950.backup.borgbackup"
        - "{{ backup_scripts__test_lib_dir }}/950.backup.restic"
        - "{{ backup_scripts__test_lib_dir }}/910.backup.mariadb"
        - "{{ backup_scripts__test_lib_dir }}/910.backup.mysql"
        - "{{ backup_scripts__test_lib_dir }}/910.backup.molecule"
        - "{{ backup_scripts__test_etc_dir }}/borg"
        - "{{ backup_scripts__test_etc_dir }}/restic"
        - "{{ backup_scripts__test_etc_dir }}/restic-password"
        - "{{ backup_scripts__test_etc_dir }}/mariadb"
        - "{{ backup_scripts__test_etc_dir }}/mysql-password"
      when: inventory_hostname == 'molecule-backup-scripts-default'

- name: 'Prepare the repositories of borg and restic'
  hosts: 'molecule-backup-scripts'
  become: true

  vars_files:
    - 'test_cases.yml'

  tasks:

    - name: 'Install borg, restic and the SSH server'
      ansible.builtin.apt:
        pkg: [ 'borgbackup', 'restic', 'openssh-server' ]
        install_recommends: false
        update_cache: true

    - name: 'Create the user of the repository'
      ansible.builtin.user:
        name: "{{ backup_scripts__test_user }}"
        shell: '/bin/sh'

    - name: 'Create the key like backup_ssh'
      community.crypto.openssh_keypair:
        path: "{{ backup_scripts__test_key }}"
        type: 'ed25519'

    - name: 'Read the public key'
      ansible.builtin.slurp:
        src: "{{ backup_scripts__test_key }}.pub"
      register: 'backup_scripts__test_public_key'

    - name: 'Authorize the key for the user of the repository'
      ansible.posix.authorized_key:
        user: "{{ backup_scripts__test_user }}"
        key: "{{ backup_scripts__test_public_key.content | b64decode }}"

    - name: 'Read the host keys of localhost'
      ansible.builtin.command: 'ssh-keyscan localhost'
      register: 'backup_scripts__test_host_keys'
      changed_when: false

    - name: 'Trust the host keys of localhost'
      ansible.builtin.copy:
        dest: '/root/.ssh/known_hosts'
        content: "{{ backup_scripts__test_host_keys.stdout }}\n"
        mode: '0644'

    - name: 'Create the directories of the data'
      ansible.builtin.file:
        path: "{{ item }}"
        state: 'directory'
        mode: '0755'
      loop: [ "{{ backup_scripts__test_data_dir }}", "{{ backup_scripts__test_excluded_dir }}" ]

    - name: 'Create the data to back up and the excluded file'
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: "molecule\n"
        mode: '0644'
      loop:
        - "{{ backup_scripts__test_data_dir }}/data.txt"
        - "{{ backup_scripts__test_excluded_dir }}/excluded.txt"

    - name: 'Write the password of the repository for the tests'
      ansible.builtin.copy:
        dest: "{{ backup_scripts__test_password_file }}"
        content: "{{ backup_scripts__test_password }}\n"
        mode: '0400'

    - name: 'Initialize the repository of restic'
      ansible.builtin.command:
        argv:
          - 'restic'
          - '--repo'
          - 'sftp:backup:repository'
          - '--option'
          - "sftp.command=ssh -i {{ backup_scripts__test_key }} {{ backup_scripts__test_user }}@localhost -s sftp"
          - '--password-file'
          - "{{ backup_scripts__test_password_file }}"
          - 'init'
        creates: "/home/{{ backup_scripts__test_user }}/repository/config"

    # borg runs on both sides of ssh, the passphrase comes from the password file of the tests
    - name: 'Initialize the repository of borg'
      ansible.builtin.command:
        argv: [ 'borg', 'init', '--encryption', 'repokey', 'ssh://{{ backup_scripts__test_user }}@localhost/./borg-repository' ]
        creates: "/home/{{ backup_scripts__test_user }}/borg-repository/config"
      environment:
        BORG_PASSCOMMAND: "cat {{ backup_scripts__test_password_file }}"
        BORG_RSH: "ssh -i {{ backup_scripts__test_key }}"

- name: 'Prepare the databases of MariaDB and MySQL'
  hosts: 'molecule-backup-scripts'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks:
      - "{{ backup_scripts__test_network }}"
    podman_default_network: "{{ backup_scripts__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Create the directory of init.sql'
      ansible.builtin.file:
        path: "{{ backup_scripts__test_init_sql | dirname }}"
        state: 'directory'
        mode: '0755'

    - name: 'Write init.sql, it creates the database molecule with one row'
      ansible.builtin.copy:
        dest: "{{ backup_scripts__test_init_sql }}"
        content: |
          CREATE DATABASE molecule;
          CREATE TABLE molecule.data (id INT PRIMARY KEY, name VARCHAR(32));
          INSERT INTO molecule.data VALUES (1, 'molecule');
        mode: '0644'

    - name: 'Pull the images of the databases'
      containers.podman.podman_image:
        name: "{{ item.image }}"
      loop: "{{ backup_scripts__test_databases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: 'Start the databases'
      containers.podman.podman_container:
        name: "{{ item.name }}"
        image: "{{ item.image }}"
        network: "{{ backup_scripts__test_network.name }}"
        env:
          "{{ {item.root_password_variable: backup_scripts__test_database_password} }}"
        volumes:
          - "{{ backup_scripts__test_init_sql }}:/docker-entrypoint-initdb.d/init.sql:ro,Z"
        state: 'started'
      loop: "{{ backup_scripts__test_databases }}"
      loop_control:
        label: "{{ item.name }}"

    # The init scripts of the images run before the server listens, the row exists if the query succeeds
    - name: 'Wait until the databases contain the row of init.sql'
      ansible.builtin.command:
        argv: [ 'podman', 'exec', '-i', "{{ item.name }}", "{{ item.client }}", '--user=root', '--password',
                '--batch', '--skip-column-names', '--execute=SELECT name FROM molecule.data' ]
        stdin: "{{ backup_scripts__test_database_password }}"
      register: 'backup_scripts__test_database_ready'
      until: backup_scripts__test_database_ready.stdout == 'molecule'
      retries: 30
      delay: 5
      changed_when: false
      loop: "{{ backup_scripts__test_databases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: 'Create the backup directories'
      ansible.builtin.file:
        path: "{{ item.backup_dir }}"
        state: 'directory'
        mode: '0750'
      loop: "{{ backup_scripts__test_databases }}"
      loop_control:
        label: "{{ item.name }}"

    # The scripts remove dumps older than keep_days (14)
    - name: 'Create an old dump'
      ansible.builtin.file:
        path: "{{ item.backup_dir }}/old-20000101.{{ item.extension }}"
        state: 'touch'
        mode: '0600'
        modification_time: "{{ '%Y%m%d%H%M.%S' | strftime(now().timestamp() | int - 30 * 86400) }}"
        modification_time_format: '%Y%m%d%H%M.%S'
      loop: "{{ backup_scripts__test_databases }}"
      loop_control:
        label: "{{ item.name }}"
