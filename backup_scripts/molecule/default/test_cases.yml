---
backup_scripts__test_etc_dir: '/etc/backup'
backup_scripts__test_lib_dir: '/usr/local/lib/backup'

# The repositories of borg and restic on localhost, reached with ssh and sftp as this user and the key of backup_ssh,
# both have the same password
backup_scripts__test_user: 'molecule-backup'
backup_scripts__test_key: '/root/.ssh/backup'
backup_scripts__test_password: 'molecule-backup-password'
backup_scripts__test_password_file: '/root/molecule-backup-password'
backup_scripts__test_data_dir: '/srv/molecule'
backup_scripts__test_excluded_dir: '/srv/molecule/excluded'

backup_scripts__test_cases:

  # Without scripts, prepare creates files of borg and restic, they are pruned, and a script of another role, it stays
  - name: 'molecule-backup-scripts-default'
    role_vars: {}
    expect:
      lib_files: [ '910.backup.molecule' ]
      etc_files: []

  - name: 'molecule-backup-scripts'
    role_vars:
      backup_scripts: [ 'borg', 'restic' ]
      # A unique archive per run, the default has one archive per day
      backup_borg:
        repository: 'ssh://molecule-backup@localhost/./borg-repository'
        archive: '{hostname}-{now}'
        include: [ '/srv/molecule' ]
      backup_restic:
        repository: 'sftp:backup:repository'
        backend: 'sftp'
        host: 'localhost'
        user: 'molecule-backup'
        include: [ '/srv/molecule' ]
    # side_effect excludes a directory and keeps the password on the host
    side_effect:
      role_vars:
        backup_scripts: [ 'borg', 'restic' ]
        backup_borg:
          repository: 'ssh://molecule-backup@localhost/./borg-repository'
          archive: '{hostname}-{now}'
          include: [ '/srv/molecule' ]
          exclude: [ '/srv/molecule/excluded' ]
          password: 'molecule-backup-password'
        backup_restic:
          repository: 'sftp:backup:repository'
          backend: 'sftp'
          host: 'localhost'
          user: 'molecule-backup'
          include: [ '/srv/molecule' ]
          exclude: [ '/srv/molecule/excluded' ]
          password: 'molecule-backup-password'
    expect:
      lib_files: [ '950.backup.borgbackup', '950.backup.restic' ]
      etc_files:
        - 'borg'
        - 'borg-excludes'
        - 'borg-includes'
        - 'borg-password'
        - 'restic'
        - 'restic-excludes'
        - 'restic-includes'
        - 'restic-password'
        - 'restic-sftp'
