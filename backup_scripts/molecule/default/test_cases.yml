---
backup_scripts__test_etc_dir: '/etc/backup'
backup_scripts__test_lib_dir: '/usr/local/lib/backup'

# The repository of restic on localhost, reached with sftp as this user and the key of backup_ssh
backup_scripts__test_restic_user: 'molecule-restic'
backup_scripts__test_restic_key: '/root/.ssh/backup'
backup_scripts__test_restic_password: 'molecule-restic-password'
backup_scripts__test_restic_password_file: '/root/molecule-restic-password'
backup_scripts__test_restic_data_dir: '/srv/molecule'
backup_scripts__test_restic_excluded_dir: '/srv/molecule/excluded'

backup_scripts__test_cases:

  # Without scripts, prepare creates files of restic, they are pruned, and a script of another role, it stays
  - name: 'molecule-backup-scripts-default'
    role_vars: {}
    expect:
      lib_files: [ '910.backup.molecule' ]
      etc_files: []

  - name: 'molecule-backup-scripts'
    role_vars:
      backup_scripts: [ 'restic' ]
      backup_restic:
        repository: 'sftp:backup:repository'
        backend: 'sftp'
        host: 'localhost'
        user: 'molecule-restic'
        include: [ '/srv/molecule' ]
    # side_effect excludes a directory and keeps the password on the host
    side_effect:
      role_vars:
        backup_scripts: [ 'restic' ]
        backup_restic:
          repository: 'sftp:backup:repository'
          backend: 'sftp'
          host: 'localhost'
          user: 'molecule-restic'
          include: [ '/srv/molecule' ]
          exclude: [ '/srv/molecule/excluded' ]
          password: 'molecule-restic-password'
    expect:
      lib_files: [ '950.backup.restic' ]
      etc_files: [ 'restic', 'restic-excludes', 'restic-includes', 'restic-password', 'restic-sftp' ]
