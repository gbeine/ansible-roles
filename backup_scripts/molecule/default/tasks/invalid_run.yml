---
# Runs backup_scripts with the invalid role variables passed as include parameters,
# the role has to fail before the checked files change.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run backup_scripts with invalid variables (expect ERROR): {{ backup_scripts__test_invalid.message }}"
  block:

    - name: 'Run backup_scripts, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'backup_scripts'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ backup_scripts__test_invalid.message }}"

  rescue:

    - name: 'Read the checksums of the checked files after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ backup_scripts__test_checked_files }}"
      register: 'backup_scripts__test_md5_after'

    - name: 'Assert the run failed before the checked files changed'
      ansible.builtin.assert:
        that:
          - backup_scripts__test_failure is search(backup_scripts__test_invalid.search)
          - backup_scripts__test_before | select('equalto', '') | list | length == 0
          - backup_scripts__test_after == backup_scripts__test_before
        fail_msg: >-
          Failure: {{ backup_scripts__test_failure }}
          Checksums before: {{ backup_scripts__test_before | join(', ') }},
          after: {{ backup_scripts__test_after | join(', ') }}.
      vars:
        backup_scripts__test_failure: "{{ ansible_failed_result.msg | default('') }}"
        backup_scripts__test_before: "{{ backup_scripts__test_md5_before.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
        backup_scripts__test_after: "{{ backup_scripts__test_md5_after.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
