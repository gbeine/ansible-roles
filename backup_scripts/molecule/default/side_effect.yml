---
- name: 'Side effect'
  hosts: 'molecule-backup-scripts'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    backup_scripts__test_case: "{{ backup_scripts__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    backup_scripts__test_restic: "{{ backup_scripts__test_case.role_vars.backup_restic }}"
    backup_scripts__test_borg: "{{ backup_scripts__test_case.role_vars.backup_borg }}"
    backup_scripts__test_checked_files:
      - "{{ backup_scripts__test_etc_dir }}/restic"
      - "{{ backup_scripts__test_etc_dir }}/restic-includes"
      - "{{ backup_scripts__test_etc_dir }}/borg"
      - "{{ backup_scripts__test_etc_dir }}/borg-includes"
      - "{{ backup_scripts__test_etc_dir }}/mariadb"
      - "{{ backup_scripts__test_etc_dir }}/mysql"
      - "{{ backup_scripts__test_etc_dir }}/postgresql"

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ backup_scripts__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksums of the checked files before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ backup_scripts__test_checked_files }}"
      register: 'backup_scripts__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include

    - name: 'Run backup_scripts with an unknown script (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        backup_scripts: [ 'restic', 'molecule' ]
        backup_scripts__test_invalid:
          message: 'an unknown script'
          search: 'Unknown scripts in backup_scripts: molecule, allowed are borg, restic, mariadb, mysql, postgresql\.'

    - name: 'Run backup_scripts with an unknown key in backup_restic (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        backup_restic: "{{ backup_scripts__test_restic | combine({'hostname': 'localhost'}) }}"
        backup_scripts__test_invalid:
          message: 'an unknown key in backup_restic'
          search: 'Unknown keys in backup_restic: hostname, allowed are repository, backend, '

    - name: 'Run backup_scripts with the backend sftp without host (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        backup_restic: "{{ backup_scripts__test_restic | dict2items | rejectattr('key', 'eq', 'host') | items2dict }}"
        backup_scripts__test_invalid:
          message: 'the backend sftp without host'
          search: 'backup_restic\.backend sftp needs host and user\.'

    - name: 'Run backup_scripts with password and password_command (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        backup_restic: "{{ backup_scripts__test_restic | combine({'password': 'molecule', 'password_command': 'cat /dev/null'}) }}"
        backup_scripts__test_invalid:
          message: 'password and password_command'
          search: 'Only one of backup_restic\.password, backup_restic\.password_command, backup_restic\.password_file can be set, set are password, password_command\.'

    - name: 'Run backup_scripts with a line break in the repository (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        backup_restic: "{{ backup_scripts__test_restic | combine({'repository': 'sftp:backup:repository\nrm -rf /'}) }}"
        backup_scripts__test_invalid:
          message: 'a line break in the repository'
          search: 'The values of backup_restic must not contain line breaks\.'

    - name: 'Run backup_scripts with an unknown key in backup_borg (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        backup_borg: "{{ backup_scripts__test_borg | combine({'passphrase': 'molecule'}) }}"
        backup_scripts__test_invalid:
          message: 'an unknown key in backup_borg'
          search: 'Unknown keys in backup_borg: passphrase, allowed are repository, rsh, '

    - name: 'Run backup_scripts with password and password_command in backup_borg (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        backup_borg: "{{ backup_scripts__test_borg | combine({'password': 'molecule', 'password_command': 'cat /dev/null'}) }}"
        backup_scripts__test_invalid:
          message: 'password and password_command in backup_borg'
          search: 'Only one of backup_borg\.password, backup_borg\.password_command, backup_borg\.password_file can be set, set are password, password_command\.'

    - name: 'Run backup_scripts with an unknown key in backup_mariadb (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        backup_mariadb: { user: 'root', container_name: 'mariadb' }
        backup_scripts__test_invalid:
          message: 'an unknown key in backup_mariadb'
          search: 'Unknown keys in backup_mariadb: container_name, allowed are container, host, '

    - name: 'Run backup_scripts with password and password_command in backup_mariadb (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        backup_mariadb: { user: 'root', password: 'molecule', password_command: 'cat /dev/null' }
        backup_scripts__test_invalid:
          message: 'password and password_command in backup_mariadb'
          search: 'Only one of backup_mariadb\.password, backup_mariadb\.password_command, backup_mariadb\.password_file can be set, set are password, password_command\.'

    - name: 'Run backup_scripts with compress no boolean in backup_mysql (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        backup_mysql: { user: 'root', compress: 'no' }
        backup_scripts__test_invalid:
          message: 'compress no boolean in backup_mysql'
          search: 'backup_mysql\.compress has to be a boolean\.'

    - name: 'Run backup_scripts with compress in backup_postgresql (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        backup_postgresql: { compress: true }
        backup_scripts__test_invalid:
          message: 'compress in backup_postgresql'
          search: 'Unknown keys in backup_postgresql: compress, allowed are container, host, '

    # Without password in the configuration the scripts read it from STDIN, like the password controller passes it
    - name: 'Run the scripts with the password on STDIN'
      ansible.builtin.command:
        argv: [ "{{ backup_scripts__test_lib_dir }}/{{ item.script }}" ]
        stdin: "{{ item.password }}"
      loop:
        - { script: '950.backup.borgbackup', password: "{{ backup_scripts__test_password }}" }
        - { script: '950.backup.restic', password: "{{ backup_scripts__test_password }}" }
        - { script: '910.backup.mariadb', password: "{{ backup_scripts__test_database_password }}" }
        - { script: '910.backup.mysql', password: "{{ backup_scripts__test_database_password }}" }
        - { script: '910.backup.postgresql', password: "{{ backup_scripts__test_database_password }}" }
      loop_control:
        label: "{{ item.script }}"
      register: 'backup_scripts__test_stdin_run'
      changed_when: true
      failed_when: false

    - name: 'Assert the scripts read the password from STDIN'
      ansible.builtin.assert:
        that:
          - item.rc == 0
        fail_msg: "{{ item.stdout }} {{ item.stderr }}"
      loop: "{{ backup_scripts__test_stdin_run.results }}"
      loop_control:
        label: "{{ item.item.script }}"

    - name: 'Set the changed role variables, an excluded directory and the passwords on the host'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ backup_scripts__test_case.side_effect.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Run backup_scripts with the changed variables, it warns about the password on the host'
      ansible.builtin.include_role:
        name: 'backup_scripts'
