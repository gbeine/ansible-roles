---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/backup
#

# The scripts of the catalog in vars/main.yml to install, e.g. [ 'restic' ]
backup_scripts__scripts: "{{ backup_scripts | default([]) }}"
backup_scripts__prune: "{{ backup_scripts_prune | default(true) }}"

backup_scripts__restic: "{{ backup_scripts__restic_default | combine(backup_restic | default({})) }}"

#
# Defaults - do not change
#

backup_scripts__etc_dir: '/etc/backup'
backup_scripts__lib_dir: '/usr/local/lib/backup'

# Without password, password_command or password_file restic reads the password from STDIN
backup_scripts__restic_default:
  backend: 'local'
  id_file: '/root/.ssh/backup'
  include:
    - '/etc'
    - '/home'
    - '/root'
    - '/usr/local/etc'
    - '/var/backups'
    - '/var/log'
  exclude: []
  options: '--compression max --one-file-system -v'
  cache_dir: '/var/cache/restic'
  pass_enable: false
  pass_command: 'pass'

backup_scripts__restic_keys:
  - 'repository'
  - 'backend'
  - 'host'
  - 'user'
  - 'id_file'
  - 'password'
  - 'password_command'
  - 'password_file'
  - 'include'
  - 'exclude'
  - 'options'
  - 'cache_dir'
  - 'pass_enable'
  - 'pass_command'
backup_scripts__restic_backends: [ 'local', 'sftp', 'rest' ]
backup_scripts__restic_password_keys: [ 'password', 'password_command', 'password_file' ]
