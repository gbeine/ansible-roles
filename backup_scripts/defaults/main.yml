---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/backup
#

# The scripts of the catalog in vars/main.yml to install, e.g. [ 'restic' ]
backup_scripts__scripts: "{{ backup_scripts | default([]) }}"
backup_scripts__prune: "{{ backup_scripts_prune | default(true) }}"

backup_scripts__borg: "{{ backup_scripts__borg_default | combine(backup_borg | default({})) }}"
backup_scripts__restic: "{{ backup_scripts__restic_default | combine(backup_restic | default({})) }}"
backup_scripts__mariadb: "{{ backup_scripts__mariadb_default | combine(backup_mariadb | default({})) }}"
backup_scripts__mysql: "{{ backup_scripts__mysql_default | combine(backup_mysql | default({})) }}"
backup_scripts__postgresql: "{{ backup_scripts__postgresql_default | combine(backup_postgresql | default({})) }}"

#
# Defaults - do not change
#

backup_scripts__etc_dir: '/etc/backup'
backup_scripts__lib_dir: '/usr/local/lib/backup'

# Without password, password_command or password_file the scripts read the password from STDIN,
# the password controller passes it
backup_scripts__password_keys: [ 'password', 'password_command', 'password_file' ]

# The archive has the placeholders of borg, the default is the name of the former role, one archive per day
backup_scripts__borg_default:
  rsh: 'ssh -i /root/.ssh/backup'
  archive: '{hostname}-{now:%Y-%m-%d}'
  include:
    - '/etc'
    - '/home'
    - '/root'
    - '/usr/local/etc'
    - '/var/backups'
    - '/var/log'
  exclude: []
  options: '-s -v -p'
  cache_dir: '/var/cache/borg'

backup_scripts__borg_keys:
  - 'repository'
  - 'rsh'
  - 'archive'
  - 'password'
  - 'password_command'
  - 'password_file'
  - 'include'
  - 'exclude'
  - 'options'
  - 'cache_dir'

backup_scripts__restic_default:
  backend: 'local'
  id_file: '/root/.ssh/backup'
  include:
    - '/etc'
    - '/home'
    - '/root'
    - '/usr/local/etc'
    - '/var/backups'
    - '/var/log'
  exclude: []
  options: '--compression max --one-file-system -v'
  cache_dir: '/var/cache/restic'
  pass_enable: false
  pass_command: 'pass'

backup_scripts__restic_keys:
  - 'repository'
  - 'backend'
  - 'host'
  - 'user'
  - 'id_file'
  - 'password'
  - 'password_command'
  - 'password_file'
  - 'include'
  - 'exclude'
  - 'options'
  - 'cache_dir'
  - 'pass_enable'
  - 'pass_command'
backup_scripts__restic_backends: [ 'local', 'sftp', 'rest' ]

# The scripts of MariaDB and MySQL run the clients in the container with podman exec
backup_scripts__mariadb_default:
  container: 'mariadb'
  host: 'localhost'
  user: '_backup_'
  backup_dir: '/var/backups/mariadb'
  options: '--flush-logs --add-locks --lock-tables --triggers --routines --events'
  ignore_databases:
    - 'information_schema'
    - 'performance_schema'
    - 'sys'
  keep_days: 14
  compress: true
  replication: false

backup_scripts__mysql_default: "{{ backup_scripts__mariadb_default | combine({'container': 'mysql', 'backup_dir': '/var/backups/mysql'}) }}"

backup_scripts__database_keys:
  - 'container'
  - 'host'
  - 'user'
  - 'password'
  - 'password_command'
  - 'password_file'
  - 'backup_dir'
  - 'options'
  - 'ignore_databases'
  - 'keep_days'
  - 'compress'
  - 'replication'

# The script of PostgreSQL runs the clients in the container with podman exec, host is the directory of the socket of the image,
# the custom format of pg_dump is compressed
backup_scripts__postgresql_default:
  container: 'postgresql'
  host: '/var/run/postgresql'
  user: 'postgres'
  backup_dir: '/var/backups/postgresql'
  options: '--format=custom'
  ignore_databases:
    - 'template0'
    - 'template1'
  keep_days: 14

backup_scripts__postgresql_keys:
  - 'container'
  - 'host'
  - 'user'
  - 'password'
  - 'password_command'
  - 'password_file'
  - 'backup_dir'
  - 'options'
  - 'ignore_databases'
  - 'keep_days'
