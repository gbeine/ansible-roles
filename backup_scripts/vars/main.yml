---

#
# Catalog of the scripts
#
# files:   copied from files/ to the library directory
# configs: files of the script in the configuration directory, removed if the script is not selected
# tasks:   name of tasks/<tasks>.yml and tasks/validate_<tasks>.yml, the default is the name of the script
#
backup_scripts__catalog:

  - name: 'borg'
    files: [ '950.backup.borgbackup' ]
    configs: [ 'borg', 'borg-includes', 'borg-excludes', 'borg-password' ]

  - name: 'restic'
    files: [ '950.backup.restic' ]
    configs: [ 'restic', 'restic-sftp', 'restic-includes', 'restic-excludes', 'restic-password' ]

  - name: 'mariadb'
    files: [ '910.backup.mariadb' ]
    configs: [ 'mariadb', 'mariadb-password' ]
    tasks: 'database'

  - name: 'mysql'
    files: [ '910.backup.mysql' ]
    configs: [ 'mysql', 'mysql-password' ]
    tasks: 'database'

backup_scripts__selected: "{{ backup_scripts__catalog | selectattr('name', 'in', backup_scripts__scripts) | list }}"
backup_scripts__unselected: "{{ backup_scripts__catalog | rejectattr('name', 'in', backup_scripts__scripts) | list }}"
