---

# Packages needed by the scripts, by name of the script
backup_scripts__packages:
  borg: [ 'bash', 'borgbackup' ]
  restic: [ 'bash', 'restic' ]
  # The clients run in the container with podman exec, podman is installed by container_podman
  mariadb: [ 'bash', 'xz-utils' ]
  mysql: [ 'bash', 'xz-utils' ]
  # The custom format of pg_dump is compressed
  postgresql: [ 'bash' ]
