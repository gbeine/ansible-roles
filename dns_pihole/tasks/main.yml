---

- name: 'Install Pi-hole'
  tags: [ 'dns_pihole' ]
  block:

    - name: 'Validate secrets'
      ansible.builtin.assert:
        that:
          - dns_pihole__secrets | rejectattr('name', 'defined') | list | length == 0
          - dns_pihole__secrets | rejectattr('data', 'defined') | list | length == 0
          - dns_pihole__secrets | rejectattr('target', 'defined') | list | length == 0
          - dns_pihole__secrets_missing | length == 0
          - dns_pihole__secrets_in_environment | length == 0
        fail_msg: >-
          Pi-hole needs the secrets {{ dns_pihole__secrets_required | join(', ') }},
          missing: {{ dns_pihole__secrets_missing | join(', ') | default('none', true) }}.
          Every secret needs name, data and target, secrets must not be set in pihole_environment:
          {{ dns_pihole__secrets_in_environment | join(', ') | default('none', true) }}.
        quiet: true
      vars:
        dns_pihole__secrets_missing: >-
          {{ dns_pihole__secrets_required
             | reject('in', dns_pihole__secrets | selectattr('target', 'defined') | map(attribute='target') | list)
             | list }}
        dns_pihole__secrets_in_environment: >-
          {{ (dns_pihole__secrets | selectattr('target', 'defined') | map(attribute='target') | list
              + dns_pihole__secret_variables)
             | select('in', dns_pihole__environment.keys() | list) | unique | list }}

    # The container sets owner and mode of /etc/pihole and /var/log/pihole itself on every start
    - name: 'Create directories'  # noqa: risky-file-permissions
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default(omit) }}"
        state: 'directory'
      loop:
        - dest: "{{ dns_pihole__podman_etc_dir }}"
        - dest: "{{ dns_pihole__podman_dnsmasq_dir }}"
          mode: '0750'
        - dest: "{{ dns_pihole__podman_log_dir }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ dns_pihole__secrets }}"
      register: 'dns_pihole__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ dns_pihole__container.name }}"
        hostname: "{{ dns_pihole__container.hostname }}"
        image: "{{ dns_pihole__container.image }}"
        ip: "{{ dns_pihole__container.ip }}"
        ip6: "{{ dns_pihole__container.ipv6 | default(omit) }}"
        network: "{{ dns_pihole__container.network }}"
        timezone: "{{ dns_pihole__container.timezone }}"
        env: "{{ dns_pihole__container.environment | default(omit) }}"
        etc_hosts: "{{ dns_pihole__container.etc_hosts | default(omit) }}"
        expose: "{{ dns_pihole__container.expose | default(omit) }}"
        label: "{{ dns_pihole__container.labels | default(omit) }}"
        publish: "{{ dns_pihole__container.publish | default(omit) }}"
        secrets: "{{ dns_pihole__container.secrets | default(omit) }}"
        volume: "{{ dns_pihole__container.volumes | default(omit) }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target

          [Service]
          {% if dns_pihole__container.exec_start_pre is defined %}
          {% for command in dns_pihole__container.exec_start_pre %}
          ExecStartPre={{ command }}
          {% endfor %}
          {% endif %}
          RestartSec=5
          Restart=always

          [Unit]
          {% if dns_pihole__container.requires is defined %}
          Requires={{ dns_pihole__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'dns_pihole__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ dns_pihole__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if dns_pihole__restart | bool else 'started' }}"
        enabled: true
      vars:
        dns_pihole__running: >-
          {{ (ansible_facts.services[dns_pihole__container.name + '.service'].state | default('')) == 'running' }}
        dns_pihole__restart: >-
          {{ dns_pihole__running | bool
             and (dns_pihole__secrets_result is changed or dns_pihole__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'dns_pihole__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ dns_pihole__container.name }}"
        container_image: "{{ dns_pihole__container.image }}"
        container_schedule: "{{ dns_pihole__autoupdate_schedule }}"
