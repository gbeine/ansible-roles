---
# Network created by container_podman in prepare.yml, shared by all test cases
dns_pihole__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

dns_pihole__test_image: 'docker.io/pihole/pihole:latest'
dns_pihole__test_password: 'molecule-pihole-password'

# Role variables shared by all test cases
dns_pihole__test_common:
  pihole_home: '/opt/pihole-molecule'
  pihole_ip: '10.89.0.10'
  pihole_network: 'podman-molecule'
  pihole_hostname: 'pihole-molecule'
  pihole_timezone: 'Europe/Berlin'
  pihole_environment:
    FTLCONF_dns_upstreams: '9.9.9.9'
  pihole_secrets:
    - name: 'pihole_web_password'
      data: 'molecule-pihole-password'
      target: 'FTLCONF_webserver_api_password'

# Environment changed in side_effect.yml, the running service must be restarted
dns_pihole__test_side_effect_environment:
  FTLCONF_dns_upstreams: '149.112.112.112'

dns_pihole__test_cases:

  - name: 'molecule-pihole-ipv4-only'
    role_vars: {}
    expect:
      ip: '10.89.0.10'
      ip6: ~

  - name: 'molecule-pihole-ipv6'
    role_vars:
      pihole_ipv6: 'fd00:89::10'
    expect:
      ip: '10.89.0.10'
      ip6: 'fd00:89::10'
