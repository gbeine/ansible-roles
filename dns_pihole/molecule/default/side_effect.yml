---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    dns_pihole__test_case: "{{ dns_pihole__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  tasks:

    - name: 'Read the start time of the service before the change'
      ansible.builtin.command: 'systemctl show --property=ActiveEnterTimestampMonotonic --value pihole'
      register: 'dns_pihole__test_started_before'
      changed_when: false

    - name: 'Set the role variables with changed environment'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: >-
        {{ dns_pihole__test_common
           | combine(dns_pihole__test_case.role_vars)
           | combine({'pihole_environment': dns_pihole__test_common.pihole_environment
                                                | combine(dns_pihole__test_side_effect_environment)})
           | dict2items }}
      loop_control:
        label: "{{ item.key }}"

    - name: 'Run dns_pihole with changed environment'
      ansible.builtin.include_role:
        name: 'dns_pihole'

    - name: 'Read the start time of the service after the change'
      ansible.builtin.command: 'systemctl show --property=ActiveEnterTimestampMonotonic --value pihole'
      register: 'dns_pihole__test_started_after'
      changed_when: false

    - name: 'Assert the quadlet changed and the service was restarted'
      ansible.builtin.assert:
        that:
          - dns_pihole__quadlet_result is changed
          - dns_pihole__test_started_after.stdout | int > dns_pihole__test_started_before.stdout | int
        fail_msg: "before {{ dns_pihole__test_started_before.stdout }}, after {{ dns_pihole__test_started_after.stdout }}"
