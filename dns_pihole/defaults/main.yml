---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/dns-pihole
#

dns_pihole__home: "{{ pihole_home | mandatory }}"
dns_pihole__ip: "{{ pihole_ip | mandatory }}"
dns_pihole__ipv6: "{{ pihole_ipv6 | default('') }}"
dns_pihole__network: "{{ pihole_network | mandatory }}"
dns_pihole__hostname: "{{ pihole_hostname | mandatory }}"
dns_pihole__timezone: "{{ pihole_timezone | mandatory }}"
dns_pihole__labels: "{{ pihole_labels | default({}) }}"

dns_pihole__version: "{{ pihole_version | default('latest') }}"

dns_pihole__container: "{{ dns_pihole__podman_container_default | combine(pihole_container | default({})) }}"

dns_pihole__password: "{{ pihole_password | mandatory }}"

dns_pihole__autoupdate_enabled: "{{ pihole_autoupdate_enabled | default(false) }}"
dns_pihole__autoupdate_schedule: "{{ pihole_autoupdate_schedule | default('*-*-* 04:00:00') }}"

#
# Defaults - do not change
#

dns_pihole__dns_port: 53
dns_pihole__http_port: 80

dns_pihole__podman_name: 'pihole'
dns_pihole__podman_image: 'docker.io/pihole/pihole'
dns_pihole__podman_tag: "{{ dns_pihole__version }}"

dns_pihole__podman_home: "{{ dns_pihole__home }}"
dns_pihole__podman_etc_dir: "{{ dns_pihole__home }}/pihole"
dns_pihole__podman_dnsmasq_dir: "{{ dns_pihole__home }}/dnsmasq"
dns_pihole__podman_log_dir: "{{ dns_pihole__home }}/log"

dns_pihole__podman_container_default:
  name: "{{ dns_pihole__podman_name }}"
  hostname: "{{ dns_pihole__hostname }}"
  image: "{{ dns_pihole__podman_image }}:{{ dns_pihole__podman_tag }}"
  ip: "{{ dns_pihole__ip }}"
  ipv6: "{{ dns_pihole__ipv6 }}"
  network: "{{ dns_pihole__network }}"
  timezone: "{{ dns_pihole__timezone }}"
  environment:
    FTLCONF_dns_listeningMode: 'all'
    TZ: "{{ dns_pihole__timezone }}"
  labels: "{{ dns_pihole__labels }}"
  publish:
    - "{{ dns_pihole__dns_port }}:53/tcp"
    - "{{ dns_pihole__dns_port }}:53/udp"
    - "{{ dns_pihole__http_port }}:80/tcp"
  secrets:
    - "webserver_api_password,type=env,target=FTLCONF_webserver_api_password"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ dns_pihole__podman_etc_dir }}:/etc/pihole"
    - "{{ dns_pihole__podman_dnsmasq_dir }}:/etc/dnsmasq.d"
    - "{{ dns_pihole__podman_log_dir }}:/var/log/pihole"
