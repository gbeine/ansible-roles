---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/app-linkding
#

app_linkding__home: "{{ linkding_home | mandatory }}"
app_linkding__ip: "{{ linkding_ip | mandatory }}"
app_linkding__ipv6: "{{ linkding_ipv6 }}"
app_linkding__network: "{{ linkding_network | mandatory }}"
app_linkding__hostname: "{{ linkding_hostname | mandatory }}"
app_linkding__timezone: "{{ linkding_timezone | mandatory }}"
app_linkding__labels: "{{ linkding_labels }}"

app_linkding__version: "{{ linkding_version | default('latest') }}"

app_linkding__container: "{{ app_linkding__podman_container_default | combine(linkding_container | default({})) }}"

# The options of linkding, merged over the default, booleans and numbers are YAML values, null removes a variable
app_linkding__environment: "{{ app_linkding__environment_default | combine(linkding_environment | default({})) }}"

# Secrets with name, data and target, the target is the variable of linkding, e.g. LD_DB_PASSWORD
app_linkding__secrets: "{{ linkding_secrets | default([]) }}"

# The administrator of linkding with name, password and optionally email
app_linkding__admin: "{{ linkding_admin | mandatory }}"

app_linkding__autoupdate_enabled: "{{ linkding_autoupdate_enabled | default(false) }}"
app_linkding__autoupdate_schedule: "{{ linkding_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_linkding__podman_name: 'linkding'
app_linkding__podman_image: 'docker.io/sissbruecker/linkding'
app_linkding__podman_tag: "{{ app_linkding__version }}"

app_linkding__podman_home: "{{ app_linkding__home }}"
app_linkding__podman_data_dir: "{{ app_linkding__podman_home }}/data"

app_linkding__port: 9090

# linkding reads the time zone from TZ (TIME_ZONE in bookmarks/settings/base.py), without it the time zone is UTC
app_linkding__environment_default:
  TZ: "{{ app_linkding__timezone }}"

# The environment of the container: booleans in the spelling linkding compares with, dictionaries as JSON, null removes a variable
app_linkding__environment_container: >-
  {%- set environment = {} -%}
  {%- if app_linkding__environment is mapping -%}
  {%-   for key, value in app_linkding__environment.items() if value is not none -%}
  {%-     if value is boolean -%}
  {%-       set _ = environment.update({ key: (value | string | lower) if key in app_linkding__environment_booleans_lower else (value | string) }) -%}
  {%-     elif value is mapping -%}
  {%-       set _ = environment.update({ key: value | to_json }) -%}
  {%-     else -%}
  {%-       set _ = environment.update({ key: value | string }) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# Generated from bookmarks/settings/base.py and prod.py, bootstrap.sh and uwsgi.ini of linkding v1.47.0,
# without the secrets, LD_SUPERUSER_NAME and LD_SUPERUSER_PASSWORD (the role manages the administrator)
# and LD_SERVER_HOST and LD_SERVER_PORT (the address of the container), update with new versions of the image
app_linkding__environment_allowed:
  - 'HOST_NAME'
  - 'LD_ALLOWED_INTERNAL_HOSTS'
  - 'LD_AUTH_PROXY_LOGOUT_URL'
  - 'LD_AUTH_PROXY_USERNAME_HEADER'
  - 'LD_CONTEXT_PATH'
  - 'LD_CORS_ALLOWED_ORIGINS'
  - 'LD_CSRF_TRUSTED_ORIGINS'
  - 'LD_DB_DATABASE'
  - 'LD_DB_ENGINE'
  - 'LD_DB_HOST'
  - 'LD_DB_OPTIONS'
  - 'LD_DB_PORT'
  - 'LD_DB_USER'
  - 'LD_DISABLE_ASSET_UPLOAD'
  - 'LD_DISABLE_BACKGROUND_TASKS'
  - 'LD_DISABLE_LOGIN_FORM'
  - 'LD_DISABLE_REQUEST_LOGS'
  - 'LD_DISABLE_URL_VALIDATION'
  - 'LD_ENABLE_AUTH_PROXY'
  - 'LD_ENABLE_OIDC'
  - 'LD_ENABLE_REFRESH_FAVICONS'
  - 'LD_ENABLE_SNAPSHOTS'
  - 'LD_FAVICON_PROVIDER'
  - 'LD_LOG_X_FORWARDED_FOR'
  - 'LD_MONOLITH_OPTIONS'
  - 'LD_MONOLITH_PATH'
  - 'LD_PREVIEW_MAX_SIZE'
  - 'LD_REQUEST_MAX_CONTENT_LENGTH'
  - 'LD_REQUEST_TIMEOUT'
  - 'LD_SESSION_COOKIE_AGE'
  - 'LD_SINGLEFILE_OPTIONS'
  - 'LD_SINGLEFILE_PATH'
  - 'LD_SINGLEFILE_TIMEOUT_SEC'
  - 'LD_SINGLEFILE_UBLOCK_OPTIONS'
  - 'LD_SNAPSHOT_PDF_MAX_SIZE'
  - 'LD_SUPERVISOR_MANAGED'
  - 'LD_USE_X_FORWARDED_HOST'
  - 'OIDC_OP_AUTHORIZATION_ENDPOINT'
  - 'OIDC_OP_JWKS_ENDPOINT'
  - 'OIDC_OP_TOKEN_ENDPOINT'
  - 'OIDC_OP_USER_ENDPOINT'
  - 'OIDC_RP_CLIENT_ID'
  - 'OIDC_RP_SCOPES'
  - 'OIDC_RP_SIGN_ALGO'
  - 'OIDC_USERNAME_CLAIM'
  - 'OIDC_USE_PKCE'
  - 'OIDC_VERIFY_SSL'
  - 'TZ'

# The variables set by linkding itself or the role, they must not be set
app_linkding__environment_role:
  LD_SERVER_HOST: 'the address of the container'
  LD_SERVER_PORT: 'the port of the container'
  LD_SUPERUSER_NAME: 'linkding_admin'
  LD_SUPERUSER_PASSWORD: 'linkding_admin'

# The booleans of bookmarks/settings/base.py, bootstrap.sh and uwsgi.ini of linkding v1.47.0,
# the settings accept True, bootstrap.sh compares LD_SUPERVISOR_MANAGED with True, uwsgi.ini compares with true
app_linkding__environment_booleans:
  - 'LD_DISABLE_ASSET_UPLOAD'
  - 'LD_DISABLE_BACKGROUND_TASKS'
  - 'LD_DISABLE_LOGIN_FORM'
  - 'LD_DISABLE_REQUEST_LOGS'
  - 'LD_DISABLE_URL_VALIDATION'
  - 'LD_ENABLE_AUTH_PROXY'
  - 'LD_ENABLE_OIDC'
  - 'LD_ENABLE_REFRESH_FAVICONS'
  - 'LD_ENABLE_SNAPSHOTS'
  - 'LD_LOG_X_FORWARDED_FOR'
  - 'LD_SUPERVISOR_MANAGED'
  - 'LD_USE_X_FORWARDED_HOST'
  - 'OIDC_USE_PKCE'
  - 'OIDC_VERIFY_SSL'
app_linkding__environment_booleans_lower: [ 'LD_DISABLE_REQUEST_LOGS', 'LD_LOG_X_FORWARDED_FOR' ]

# The integers of bookmarks/settings/base.py and uwsgi.ini of linkding v1.47.0, LD_SINGLEFILE_TIMEOUT_SEC is a number
app_linkding__environment_integers:
  - 'LD_DB_PORT'
  - 'LD_PREVIEW_MAX_SIZE'
  - 'LD_REQUEST_MAX_CONTENT_LENGTH'
  - 'LD_REQUEST_TIMEOUT'
  - 'LD_SESSION_COOKIE_AGE'
  - 'LD_SNAPSHOT_PDF_MAX_SIZE'
app_linkding__environment_numbers: [ 'LD_SINGLEFILE_TIMEOUT_SEC' ]

# LD_DB_OPTIONS is a dictionary, the role passes it as JSON
app_linkding__environment_json: [ 'LD_DB_OPTIONS' ]

app_linkding__db_engines: [ 'sqlite', 'postgres' ]

# OIDC (LD_ENABLE_OIDC) needs the endpoints of the provider, the client and the secret of the client
app_linkding__oidc_required: [ 'OIDC_OP_AUTHORIZATION_ENDPOINT', 'OIDC_OP_TOKEN_ENDPOINT', 'OIDC_OP_USER_ENDPOINT', 'OIDC_OP_JWKS_ENDPOINT', 'OIDC_RP_CLIENT_ID' ]
app_linkding__oidc_secret: 'OIDC_RP_CLIENT_SECRET'

app_linkding__podman_container_default:
  name: "{{ app_linkding__podman_name }}"
  hostname: "{{ app_linkding__hostname }}"
  image: "{{ app_linkding__podman_image }}:{{ app_linkding__podman_tag }}"
  ip: "{{ app_linkding__ip }}"
  ipv6: "{{ app_linkding__ipv6 | default(omit) }}"
  network: "{{ app_linkding__network }}"
  timezone: "{{ app_linkding__timezone }}"
  labels: "{{ app_linkding__labels | default(omit) }}"
  # Set with linkding_environment, merged over the default
  environment: "{{ app_linkding__environment_container }}"
  volumes:
    - "{{ app_linkding__podman_data_dir }}:/etc/linkding/data:Z"
  # linkding reads the secrets only from the environment,
  # entries without name or target are left out, the validation of the secrets reports them
  secrets: >-
    {{ (app_linkding__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='name')
        | zip(app_linkding__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined') | map(attribute='target'))
        | map('join', ',type=env,target=') | list)
      if (app_linkding__secrets is sequence and app_linkding__secrets is not string and app_linkding__secrets | length > 0)
      else omit }}

# Targets of the secrets in linkding_secrets, linkding reads them only from the environment
app_linkding__secrets_allowed: [ 'LD_DB_PASSWORD', 'OIDC_RP_CLIENT_SECRET' ]

app_linkding__admin_keys: [ 'name', 'email', 'password' ]
# The user names of Django (UnicodeUsernameValidator, max_length 150 of AbstractUser)
app_linkding__admin_name_pattern: '^[A-Za-z0-9@.+_-]{1,150}$'
app_linkding__admin_email_pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
