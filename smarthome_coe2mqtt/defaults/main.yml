---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/smarthome-coe2mqtt
#

smarthome_coe2mqtt__home: "{{ coe2mqtt_home | mandatory }}"
smarthome_coe2mqtt__ip: "{{ coe2mqtt_ip | mandatory }}"
smarthome_coe2mqtt__ipv6: "{{ coe2mqtt_ipv6 | default('') }}"
smarthome_coe2mqtt__network: "{{ coe2mqtt_network | mandatory }}"
smarthome_coe2mqtt__hostname: "{{ coe2mqtt_hostname | mandatory }}"
smarthome_coe2mqtt__timezone: "{{ coe2mqtt_timezone | mandatory }}"

smarthome_coe2mqtt__version: "{{ coe2mqtt_version | default('latest') }}"

smarthome_coe2mqtt__container: "{{ smarthome_coe2mqtt__container_default | combine(coe2mqtt_container | default({})) }}"

smarthome_coe2mqtt__config: "{{ coe2mqtt_config | default({}) }}"

#
# Defaults - do not change
#

smarthome_coe2mqtt__podman_name: 'coe2mqtt'
smarthome_coe2mqtt__podman_image: 'docker.io/gbeine/coe2mqtt'
smarthome_coe2mqtt__podman_tag: "{{ smarthome_coe2mqtt__version }}"

smarthome_coe2mqtt__podman_home: "{{ smarthome_coe2mqtt__home }}"

smarthome_coe2mqtt__container_default:
  name: "{{ smarthome_coe2mqtt__podman_name }}"
  hostname: "{{ smarthome_coe2mqtt__hostname }}"
  image: "{{ smarthome_coe2mqtt__podman_image }}:{{ smarthome_coe2mqtt__podman_tag }}"
  ip: "{{ smarthome_coe2mqtt__ip }}"
  ipv6: "{{ smarthome_coe2mqtt__ipv6 }}"
  network: "{{ smarthome_coe2mqtt__network }}"
  timezone: "{{ bootstrap_timezone__timezone }}"
  publish: []
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ smarthome_coe2mqtt__podman_home }}/coe2mqtt.conf:/etc/coe2mqtt.conf:ro"
