---

#
# Substitutes - do not change
#

smarthome_coe2mqtt__home: "{{ coe2mqtt_home | mandatory }}"

smarthome_coe2mqtt__hostname: "{{ coe2mqtt_hostname | mandatory }}"
smarthome_coe2mqtt__ip: "{{ coe2mqtt_ip | mandatory }}"
smarthome_coe2mqtt__ipv6: "{{ coe2mqtt_ipv6 | default('') }}"
smarthome_coe2mqtt__network: "{{ coe2mqtt_network | mandatory }}"
smarthome_coe2mqtt__hosts: "{{ coe2mqtt_hosts | default({}) }}"
smarthome_coe2mqtt__version: "{{ coe2mqtt_version | default('latest') }}"

smarthome_coe2mqtt__container: "{{ smarthome_coe2mqtt__container_default | combine(coe2mqtt_container | default({})) }}"

smarthome_coe2mqtt__mqtt_user: "{{ coe2mqtt_mqtt_user | default('coe2mqtt') }}"
smarthome_coe2mqtt__mqtt_password: "{{ coe2mqtt_mqtt_password | mandatory }}"
smarthome_coe2mqtt__mqtt_host: "{{ coe2mqtt_mqtt_host | mandatory }}"
smarthome_coe2mqtt__mqtt_port: "{{ coe2mqtt_mqtt_port | default(1883) }}"
smarthome_coe2mqtt__mqtt_topic: "{{ coe2mqtt_mqtt_topic | default('bus/can') }}"
smarthome_coe2mqtt__mqtt_clientid: "{{ coe2mqtt_mqtt_clientid | default(smarthome_coe2mqtt__mqtt_user) }}"
smarthome_coe2mqtt__mqtt_keepalive: "{{ coe2mqtt_mqtt_keepalive | default(30) }}"
smarthome_coe2mqtt__mqtt_tls: "{{ coe2mqtt_mqtt_tls | default(false) }}"
smarthome_coe2mqtt__mqtt_tls_version: "{{ coe2mqtt_mqtt_tls_version | default('TLSv1.2') }}"
smarthome_coe2mqtt__mqtt_verify_mode: "{{ coe2mqtt_mqtt_verify_mode | default('CERT_NONE') }}"
smarthome_coe2mqtt__mqtt_ssl_ca_path: "{{ coe2mqtt_mqtt_ssl_ca_path | default('') }}"
smarthome_coe2mqtt__mqtt_tls_no_verify: "{{ coe2mqtt_mqtt_tls_no_verify | default(false) }}"

smarthome_coe2mqtt__coe_bind_ip: "{{ coe2mqtt_bind_ip | default('') }}"
smarthome_coe2mqtt__coe_bind_port: "{{ coe2mqtt_bind_port | default(5442) }}"
smarthome_coe2mqtt__coe_peer_ip: "{{ coe2mqtt_peer_ip | default('') }}"
smarthome_coe2mqtt__coe_peer_port: "{{ coe2mqtt_peer_port | default(5442) }}"

smarthome_coe2mqtt__timestamp: "{{ coe2mqtt_timestamp | default(false) }}"
smarthome_coe2mqtt__verbose: "{{ coe2mqtt_verbose | default(false) }}"

smarthome_coe2mqtt__mqtt_subscribe: "{{ coe2mqtt_subscribe | default([]) }}"

#
# Defaults - do not change
#

smarthome_coe2mqtt__config_file: "{{ smarthome_coe2mqtt__home + '/coe2mqtt.conf' }}"

smarthome_coe2mqtt__name: 'coe2mqtt'
smarthome_coe2mqtt__image: 'docker.io/gbeine/coe2mqtt'

smarthome_coe2mqtt__container_default:
    name: "{{ smarthome_coe2mqtt__name }}"
    hostname: "{{ smarthome_coe2mqtt__hostname }}"
    image: "{{ smarthome_coe2mqtt__image }}:{{ smarthome_coe2mqtt__version }}"
    ip: "{{ smarthome_coe2mqtt__ip }}"
    network: "{{ smarthome_coe2mqtt__network }}"
    restart_policy: 'always'
    hosts: "{{ smarthome_coe2mqtt__hosts }}"
    timezone: "{{ bootstrap_timezone__timezone }}"
    volumes:
      - "{{ smarthome_coe2mqtt__config_file }}:/etc/coe2mqtt.conf:ro"
