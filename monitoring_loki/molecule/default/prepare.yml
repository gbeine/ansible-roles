---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks:
      - "{{ monitoring_loki__test_network }}"
    podman_default_network: "{{ monitoring_loki__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Install curl'
      ansible.builtin.apt:
        name: 'curl'
        state: 'present'
        update_cache: true

    - name: 'Pull the image, so the first start of the service does not time out'
      containers.podman.podman_image:
        name: "{{ monitoring_loki__test_image }}"
      register: 'monitoring_loki__test_pull'
      until: monitoring_loki__test_pull is succeeded
      retries: 5
      delay: 30
