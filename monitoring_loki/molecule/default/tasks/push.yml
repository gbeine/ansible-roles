---
# Pushes a log line with the label job to Loki, the timestamp is now in nanoseconds

- name: "Read the time of the log line of {{ monitoring_loki__test_job }}"
  ansible.builtin.command:
    argv: [ 'date', '+%s%N' ]
  register: 'monitoring_loki__test_now'
  changed_when: false

- name: "Push a log line of {{ monitoring_loki__test_job }}"
  ansible.builtin.uri:
    url: "http://{{ monitoring_loki__test_ip }}:3100/loki/api/v1/push"
    method: 'POST'
    body_format: 'json'
    body:
      streams:
        - stream:
            job: "{{ monitoring_loki__test_job }}"
          values:
            - [ "{{ monitoring_loki__test_now.stdout }}", "molecule log line of {{ monitoring_loki__test_job }}" ]
    status_code: [ 204 ]
