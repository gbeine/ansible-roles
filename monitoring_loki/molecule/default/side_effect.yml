---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_loki__test_case: "{{ monitoring_loki__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_loki__test_vars: "{{ monitoring_loki__test_case.role_vars }}"
    monitoring_loki__test_config: "{{ monitoring_loki__test_vars.loki_config | default({}) }}"
    monitoring_loki__test_secrets: "{{ monitoring_loki__test_vars.loki_secrets | default([]) }}"
    monitoring_loki__test_ip: "{{ monitoring_loki__test_vars.loki_ip }}"
    monitoring_loki__test_checked_files:
      - "{{ monitoring_loki__test_quadlet_path }}"
      - "{{ monitoring_loki__test_config_path }}"

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_loki__test_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksums of the checked files before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ monitoring_loki__test_checked_files }}"
      register: 'monitoring_loki__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include

    - name: 'Run monitoring_loki with loki_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_container: [ 'environment' ]
        monitoring_loki__test_invalid:
          message: 'loki_container not a dictionary'
          search: 'failed to combine variables, expected dicts'

    - name: 'Run monitoring_loki with loki_config not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_config: [ 'server' ]
        monitoring_loki__test_invalid:
          message: 'loki_config not a dictionary'
          search: 'failed to combine variables, expected dicts'

    - name: 'Run monitoring_loki with a secret without target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_secrets: "{{ monitoring_loki__test_secrets + [ { 'name': 'loki_other', 'data': 'x' } ] }}"
        monitoring_loki__test_invalid:
          message: 'a secret without target'
          search: '^loki_secrets entries need name, data and target$'

    - name: 'Run monitoring_loki with a target against the pattern (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_secrets: "{{ monitoring_loki__test_secrets + [ { 'name': 'loki_lowercase', 'data': 'x', 'target': 'lowercase' } ] }}"
        monitoring_loki__test_invalid:
          message: 'a target against the pattern'
          search: '^the targets of loki_secrets have to match \^LOKI_\[A-Z0-9_\]\+\$: lowercase$'

    - name: 'Run monitoring_loki with a secret not referenced in the configuration (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_secrets: "{{ monitoring_loki__test_secrets + [ { 'name': 'loki_unused', 'data': 'x', 'target': 'LOKI_UNUSED' } ] }}"
        monitoring_loki__test_invalid:
          message: 'a secret not referenced in the configuration'
          search: '^These secrets are not referenced in loki_config with \$\{TARGET\}: LOKI_UNUSED\.$'

    - name: 'Run monitoring_loki with a password in plain text (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_config: >-
          {{ monitoring_loki__test_config | combine({ 'ruler': { 'alertmanager_url': 'http://localhost:9093',
               'alertmanager_client': { 'basic_auth_username': 'molecule', 'basic_auth_password': 'molecule-plain-password' } } }) }}
        loki_secrets: []
        monitoring_loki__test_invalid:
          message: 'a password in plain text'
          search: '^These fields of loki_config carry secrets and have to reference a secret of loki_secrets with \$\{TARGET\}: basic_auth_password\.$'

    - name: 'Run monitoring_loki with a secret in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_config: >-
          {{ monitoring_loki__test_config | combine({ 'ruler': { 'alertmanager_url': 'http://localhost:9093',
               'alertmanager_client': { 'basic_auth_username': 'molecule', 'basic_auth_password': '${LOKI_ALERTMANAGER_PASSWORD}' } } }) }}
        loki_secrets: [ { 'name': 'loki_alertmanager_password', 'data': 'x', 'target': 'LOKI_ALERTMANAGER_PASSWORD' } ]
        loki_environment: { 'LOKI_ALERTMANAGER_PASSWORD': 'molecule-plain-password' }
        monitoring_loki__test_invalid:
          message: 'a secret in the environment'
          search: '^Secrets must not be set in loki_environment: LOKI_ALERTMANAGER_PASSWORD\.$'

    - name: 'Run monitoring_loki with an unknown variable (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_environment: { 'JAEGER_AGENT_HOST': 'localhost' }
        monitoring_loki__test_invalid:
          message: 'an unknown variable'
          search: '^Unknown environment variables: JAEGER_AGENT_HOST,'

    - name: 'Run monitoring_loki with a line break in a value (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_environment: { 'TZ': "Europe/Berlin\nUTC" }
        monitoring_loki__test_invalid:
          message: 'a line break in a value'
          search: '^Values and secrets must not contain line breaks: TZ\.$'

    # The key is valid for the checks of the role, Loki itself rejects it
    - name: 'Run monitoring_loki with an unknown key of Loki (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_config: "{{ monitoring_loki__test_config | combine({ 'limits_config': { 'molecule_unknown': true } }) }}"
        monitoring_loki__test_invalid:
          message: 'an unknown key of Loki'
          search: 'failed to validate(.|\n)*molecule_unknown'

    - name: 'Change the configuration'
      when: monitoring_loki__test_case.side_effect is defined
      block:

        # The line has to survive the restart
        - name: 'Push a log line before the change'
          ansible.builtin.include_tasks: 'tasks/push.yml'
          vars:
            monitoring_loki__test_job: 'molecule-before'

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'loki' ]
          register: 'monitoring_loki__test_started_before'
          changed_when: false

        - name: 'Set the changed values'
          ansible.builtin.set_fact:
            loki_config: "{{ monitoring_loki__test_config | combine(monitoring_loki__test_case.side_effect.config) }}"

        - name: 'Run monitoring_loki with the changed values'
          ansible.builtin.include_role:
            name: 'monitoring_loki'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'loki' ]
          register: 'monitoring_loki__test_started_after'
          changed_when: false

        - name: 'Assert the restart'
          ansible.builtin.assert:
            that:
              - monitoring_loki__config_result is changed
              - monitoring_loki__quadlet_result is not changed
              - monitoring_loki__test_started_after.stdout | int > monitoring_loki__test_started_before.stdout | int
            fail_msg: >-
              configuration changed: {{ monitoring_loki__config_result is changed }}, quadlet changed: {{ monitoring_loki__quadlet_result is changed }},
              start before {{ monitoring_loki__test_started_before.stdout }}, after {{ monitoring_loki__test_started_after.stdout }}
