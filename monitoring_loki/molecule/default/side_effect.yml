---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_loki__test_case: "{{ monitoring_loki__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_loki__test_vars: "{{ monitoring_loki__test_case.role_vars }}"
    monitoring_loki__test_config: "{{ monitoring_loki__test_vars.loki_config | default({}) }}"
    monitoring_loki__test_secrets: "{{ monitoring_loki__test_vars.loki_secrets | default([]) }}"
    monitoring_loki__test_ip: "{{ monitoring_loki__test_vars.loki_ip }}"
    monitoring_loki__test_checked_files:
      - "{{ monitoring_loki__test_quadlet_path }}"
      - "{{ monitoring_loki__test_config_path }}"

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_loki__test_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksums of the checked files before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ monitoring_loki__test_checked_files }}"
      register: 'monitoring_loki__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include

    - name: 'Run monitoring_loki with loki_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_container: [ 'environment' ]
        monitoring_loki__test_invalid:
          message: 'loki_container not a dictionary'
          search: 'failed to combine variables, expected dicts'

    - name: 'Run monitoring_loki with loki_config not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_config: [ 'server' ]
        monitoring_loki__test_invalid:
          message: 'loki_config not a dictionary'
          search: 'failed to combine variables, expected dicts'

    - name: 'Run monitoring_loki with an unknown key (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_config: "{{ monitoring_loki__test_config | combine({ 'storage': { 'type': 'filesystem' } }) }}"
        monitoring_loki__test_invalid:
          message: 'an unknown key'
          search: '^Unknown keys in `loki_config`: storage, allowed are the keys of `monitoring_loki__config_allowed`\.$'

    - name: 'Run monitoring_loki with a password in loki_config (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_config: >-
          {{ monitoring_loki__test_config | combine({ 'ruler': { 'alertmanager_url': 'http://localhost:9093',
               'alertmanager_client': { 'basic_auth_username': 'molecule', 'basic_auth_password': 'molecule-plain-password' } } }) }}
        loki_secrets: []
        monitoring_loki__test_invalid:
          message: 'a password in loki_config'
          search: '^These fields carry secrets, they are set with `loki_secrets`, not in `loki_config`: basic_auth_password\.$'

    - name: 'Run monitoring_loki with a secret without target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_secrets: "{{ monitoring_loki__test_secrets + [ { 'name': 'loki_other', 'data': 'x' } ] }}"
        monitoring_loki__test_invalid:
          message: 'a secret without target'
          search: '^`loki_secrets` entries need name, data and target$'

    - name: 'Run monitoring_loki with an unknown secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_secrets: "{{ monitoring_loki__test_secrets + [ { 'name': 'loki_port', 'data': 'x', 'target': 'server.http_listen_port' } ] }}"
        monitoring_loki__test_invalid:
          message: 'an unknown secret'
          search: '^Unknown secrets: server\.http_listen_port, the targets are paths of options of `loki_config` ending in '

    - name: 'Run monitoring_loki with a target set twice (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_secrets:
          - { 'name': 'loki_s3_one', 'data': 'x', 'target': 'common.storage.s3.secret_access_key' }
          - { 'name': 'loki_s3_two', 'data': 'y', 'target': 'common.storage.s3.secret_access_key' }
        monitoring_loki__test_invalid:
          message: 'a target set twice'
          search: '^Every target of `loki_secrets` is set once: common\.storage\.s3\.secret_access_key\.$'

    - name: 'Run monitoring_loki with a secret in a list (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_secrets: "{{ monitoring_loki__test_secrets + [ { 'name': 'loki_schema', 'data': 'x', 'target': 'schema_config.configs.secret_key' } ] }}"
        monitoring_loki__test_invalid:
          message: 'a secret in a list'
          search: '^The paths of these secrets lead through values of `loki_config` that are no dictionaries: schema_config\.configs\.secret_key\.$'

    # The reference is double-quoted in config.yaml, " and \ would end the string or start an escape sequence
    - name: 'Run monitoring_loki with a quote in a secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_secrets: [ { 'name': 'loki_quote', 'data': 'molecule"secret', 'target': 'common.storage.s3.secret_access_key' } ]
        monitoring_loki__test_invalid:
          message: 'a quote in a secret'
          search: '^Secrets are strings that are not empty and without line breaks, " and .: loki_quote\.$'

    - name: 'Run monitoring_loki with loki_environment not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_environment: [ 'TZ' ]
        monitoring_loki__test_invalid:
          message: 'loki_environment not a dictionary'
          search: '^`loki_environment` has to be a dictionary\.$'

    - name: 'Run monitoring_loki with an unknown variable (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_environment: { 'JAEGER_AGENT_HOST': 'localhost' }
        monitoring_loki__test_invalid:
          message: 'an unknown variable'
          search: '^Unknown environment variables: JAEGER_AGENT_HOST,'

    - name: 'Run monitoring_loki with a line break in a value (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_environment: { 'TZ': "Europe/Berlin\nUTC" }
        monitoring_loki__test_invalid:
          message: 'a line break in a value'
          search: '^The values of `loki_environment` must not contain line breaks: TZ\.$'

    # The key is valid for the checks of the role, Loki itself rejects it
    - name: 'Run monitoring_loki with an unknown key of Loki (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        loki_config: "{{ monitoring_loki__test_config | combine({ 'limits_config': { 'molecule_unknown': true } }) }}"
        monitoring_loki__test_invalid:
          message: 'an unknown key of Loki'
          search: 'failed to validate(.|\n)*molecule_unknown'

    - name: 'Change the configuration'
      when: monitoring_loki__test_case.side_effect is defined
      block:

        # The line has to survive the restart
        - name: 'Push a log line before the change'
          ansible.builtin.include_tasks: 'tasks/push.yml'
          vars:
            monitoring_loki__test_job: 'molecule-before'

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'loki' ]
          register: 'monitoring_loki__test_started_before'
          changed_when: false

        - name: 'Set the changed values'
          ansible.builtin.set_fact:
            loki_config: "{{ monitoring_loki__test_config | combine(monitoring_loki__test_case.side_effect.config) }}"

        - name: 'Run monitoring_loki with the changed values'
          ansible.builtin.include_role:
            name: 'monitoring_loki'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'loki' ]
          register: 'monitoring_loki__test_started_after'
          changed_when: false

        - name: 'Assert the restart'
          ansible.builtin.assert:
            that:
              - monitoring_loki__config_result is changed
              - monitoring_loki__quadlet_result is not changed
              - monitoring_loki__test_started_after.stdout | int > monitoring_loki__test_started_before.stdout | int
            fail_msg: >-
              configuration changed: {{ monitoring_loki__config_result is changed }}, quadlet changed: {{ monitoring_loki__quadlet_result is changed }},
              start before {{ monitoring_loki__test_started_before.stdout }}, after {{ monitoring_loki__test_started_after.stdout }}

    - name: 'Run the role again without a change'
      when: monitoring_loki__test_case.side_effect is not defined
      block:

        - name: 'Read the start time of the service before the run without a change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'loki' ]
          register: 'monitoring_loki__test_unchanged_before'
          changed_when: false

        - name: 'Run monitoring_loki without a change'
          ansible.builtin.include_role:
            name: 'monitoring_loki'

        - name: 'Read the start time of the service after the run without a change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'loki' ]
          register: 'monitoring_loki__test_unchanged_after'
          changed_when: false

        - name: 'Assert no restart and no change'
          ansible.builtin.assert:
            that:
              - monitoring_loki__config_result is not changed
              - monitoring_loki__secrets_result is not changed
              - monitoring_loki__quadlet_result is not changed
              - monitoring_loki__test_unchanged_after.stdout == monitoring_loki__test_unchanged_before.stdout
            fail_msg: >-
              configuration changed: {{ monitoring_loki__config_result is changed }},
              secrets changed: {{ monitoring_loki__secrets_result is changed }},
              quadlet changed: {{ monitoring_loki__quadlet_result is changed }},
              start before {{ monitoring_loki__test_unchanged_before.stdout }}, after {{ monitoring_loki__test_unchanged_after.stdout }}
