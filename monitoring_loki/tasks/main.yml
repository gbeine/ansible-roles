---

- name: 'Install Loki'
  tags: [ 'monitoring', 'monitoring_loki' ]
  block:

    # A failing template in the variables (e.g. an unknown filter, loki_config or loki_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - monitoring_loki__container | length > 0
          - monitoring_loki__config | to_json | length > 0
          # loki_environment has no default, a failing template stops the role here as well
          - monitoring_loki__environment | default({}) | length >= 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - monitoring_loki__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_loki__invalid | join('. ') }}"
        quiet: true
      vars:
        monitoring_loki__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = monitoring_loki__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('`loki_secrets` has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('`loki_secrets` entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of `loki_secrets` have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    # Loki checks the keys below the first level with -verify-config before config.yaml is replaced
    - name: 'Validate the configuration'
      ansible.builtin.assert:
        that:
          - monitoring_loki__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_loki__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_loki__unknown: "{{ monitoring_loki__config.keys() | map('string') | reject('in', monitoring_loki__config_allowed) | list }}"
        # Fields carrying secrets with a value, null and an empty string are allowed
        monitoring_loki__plain_secrets: >-
          {{ monitoring_loki__config | to_json
             | regex_findall('"(' ~ (monitoring_loki__config_secret_keys | join('|')) ~ ')"\s*:\s*(?!null)(?!"")')
             | unique | list }}
        monitoring_loki__errors: >-
          {%- set errors = [] -%}
          {%- if monitoring_loki__unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown keys in `loki_config`: ' ~ (monitoring_loki__unknown | join(', '))
                                    ~ ', allowed are the keys of `monitoring_loki__config_allowed`.') -%}
          {%- endif -%}
          {%- if monitoring_loki__plain_secrets | length > 0 -%}
          {%-   set _ = errors.append('These fields carry secrets, they are set with `loki_secrets`, not in `loki_config`: '
                                    ~ (monitoring_loki__plain_secrets | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # The role writes the references of the secrets into the dictionaries of the paths,
    # a list or a value on the path would be replaced by the references
    - name: 'Validate the targets of the secrets'
      ansible.builtin.assert:
        that:
          - monitoring_loki__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_loki__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_loki__targets: "{{ monitoring_loki__secrets | map(attribute='target') | map('string') | list }}"
        monitoring_loki__unknown: >-
          {{ monitoring_loki__targets | reject('in', monitoring_loki__secrets_valid | map(attribute='path') | map('join', '.') | list) | list }}
        monitoring_loki__errors: >-
          {%- set errors = [] -%}
          {%- set ns = namespace(set=[], paths=[]) -%}
          {%- for secret in monitoring_loki__secrets_valid -%}
          {%-   set node = namespace(value=monitoring_loki__config, broken=false) -%}
          {%-   for key in secret.path -%}
          {%-     if not node.broken and node.value is not none -%}
          {%-       if node.value is not mapping -%}
          {%-         set node.broken = true -%}
          {%-       else -%}
          {%-         set node.value = node.value[key] | default(none) -%}
          {%-       endif -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%-   if node.broken -%}
          {%-     set ns.paths = ns.paths + [ secret.path | join('.') ] -%}
          {%-   elif node.value is not none -%}
          {%-     set ns.set = ns.set + [ secret.path | join('.') ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- set duplicates = monitoring_loki__targets | community.general.counter | dict2items | selectattr('value', 'gt', 1) | map(attribute='key') | list -%}
          {%- set data = monitoring_loki__secrets | rejectattr('data', 'string') | map(attribute='name') | list
                         + monitoring_loki__secrets | selectattr('data', 'string') | selectattr('data', 'search', '^$|[\r\n]') | map(attribute='name') | list -%}
          {%- if monitoring_loki__unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (monitoring_loki__unknown | join(', ')) ~ ', the targets are paths of options of `loki_config`'
                                    ~ ' ending in ' ~ (monitoring_loki__config_secret_keys | join(', ')) ~ ', e.g. common.storage.s3.secret_access_key.') -%}
          {%- endif -%}
          {%- if duplicates | length > 0 -%}
          {%-   set _ = errors.append('Every target of `loki_secrets` is set once: ' ~ (duplicates | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.set | length > 0 -%}
          {%-   set _ = errors.append('The targets of `loki_secrets` must not be set in `loki_config`: ' ~ (ns.set | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.paths | length > 0 -%}
          {%-   set _ = errors.append('The paths of these secrets lead through values of `loki_config` that are no dictionaries: ' ~ (ns.paths | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if data | length > 0 -%}
          {%-   set _ = errors.append('Secrets are strings that are not empty and without line breaks: ' ~ (data | unique | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the environment'
      when: monitoring_loki__environment is defined
      ansible.builtin.assert:
        that:
          - monitoring_loki__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_loki__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_loki__errors: >-
          {%- set errors = [] -%}
          {%- if monitoring_loki__environment is not mapping -%}
          {%-   set _ = errors.append('`loki_environment` has to be a dictionary.') -%}
          {%- else -%}
          {%-   set lines = monitoring_loki__environment | dict2items | selectattr('value', 'string') | selectattr('value', 'search', '[\r\n]') | map(attribute='key') | list -%}
          {%-   if lines | length > 0 -%}
          {%-     set _ = errors.append('The values of `loki_environment` must not contain line breaks: ' ~ (lines | join(', ')) ~ '.') -%}
          {%-   endif -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging loki_container,
    # unknown variables would change the behavior unexpectedly
    # An environment that is no mapping is not checked here, the validation of loki_environment reports it
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - monitoring_loki__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_loki__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_loki__container_environment: >-
          {{ monitoring_loki__container.environment if monitoring_loki__container.environment | default(none) is mapping else {} }}
        monitoring_loki__unknown: >-
          {{ monitoring_loki__container_environment.keys() | map('string') | reject('in', monitoring_loki__environment_allowed) | list }}
        monitoring_loki__line_breaks: >-
          {{ monitoring_loki__container_environment | dict2items | selectattr('value', 'string')
             | selectattr('value', 'search', '[\n\r]') | map(attribute='key') | list }}
        # The targets of the secrets of the container, a secret without target is reported as a whole
        monitoring_loki__secrets_unknown: >-
          {%- set result = [] -%}
          {%- set secrets = monitoring_loki__container.secrets | default([]) -%}
          {%- if secrets is sequence and secrets is not string -%}
          {%-   for secret in secrets | map('string') -%}
          {%-     set target = (secret | regex_findall('target=([^,]+)') + [ secret ]) | first -%}
          {%-     if target not in monitoring_loki__secrets_valid | map(attribute='variable') | list -%}
          {%-       set _ = result.append(target) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%- endif -%}
          {{ result }}
        monitoring_loki__errors: >-
          {%- set errors = [] -%}
          {%- if monitoring_loki__unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (monitoring_loki__unknown | join(', ')) ~ ', Loki only reads '
                                    ~ (monitoring_loki__environment_allowed | join(', ')) ~ ', secrets are set with `loki_secrets`.') -%}
          {%- endif -%}
          {%- if monitoring_loki__line_breaks | length > 0 -%}
          {%-   set _ = errors.append('The environment variables must not contain line breaks: ' ~ (monitoring_loki__line_breaks | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if monitoring_loki__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (monitoring_loki__secrets_unknown | join(', ')) ~ ', the secrets are set with `loki_secrets`.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create the directories of Loki'
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
        state: 'directory'
      loop:
        - { path: "{{ monitoring_loki__podman_home }}", owner: 0, mode: '0755' }
        # The image runs Loki as loki (10001)
        - { path: "{{ monitoring_loki__podman_data_dir }}", owner: "{{ monitoring_loki__uid }}", mode: '0750' }
      loop_control:
        label: "{{ item.path }}"

    # Loki checks the configuration in a throwaway container before it is replaced, unknown fields are errors,
    # the secrets are replaced by placeholders there
    - name: 'Generate the configuration'
      ansible.builtin.copy:
        content: |
          #
          # Ansible managed
          #

          {{ monitoring_loki__config_rendered | to_nice_yaml(indent=2, sort_keys=false) }}
        dest: "{{ monitoring_loki__podman_config_file }}"
        owner: 'root'
        group: 'root'
        mode: '0644'
        validate: >-
          podman run --rm --network none --user 0
          {% for variable in monitoring_loki__secrets_valid | map(attribute='variable') %}--env {{ variable }}=verify {% endfor %}
          --volume %s:/etc/loki/config.yaml:ro {{ monitoring_loki__container.image }}
          -config.file=/etc/loki/config.yaml -config.expand-env=true -verify-config
      register: 'monitoring_loki__config_result'

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ monitoring_loki__secrets }}"
      register: 'monitoring_loki__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ monitoring_loki__container.name }}"
        hostname: "{{ monitoring_loki__container.hostname }}"
        image: "{{ monitoring_loki__container.image }}"
        ip: "{{ monitoring_loki__container.ip }}"
        ip6: "{{ monitoring_loki__container.ipv6 | default(omit) }}"
        network: "{{ monitoring_loki__container.network }}"
        timezone: "{{ monitoring_loki__container.timezone }}"
        command: "{{ monitoring_loki__container.command | default(omit) }}"
        env: "{{ monitoring_loki__container.environment | default(omit) }}"
        etc_hosts: "{{ monitoring_loki__container.etc_hosts | default(omit) }}"
        expose: "{{ monitoring_loki__container.expose | default(omit) }}"
        label: "{{ monitoring_loki__container.labels | default(omit) }}"
        publish: "{{ monitoring_loki__container.publish | default(omit) }}"
        secrets: "{{ monitoring_loki__container.secrets | default(omit) }}"
        volume: "{{ monitoring_loki__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if monitoring_loki__container.requires is defined %}
          Requires={{ monitoring_loki__container.requires | join(' ') }}
          {% endif %}
          {% if monitoring_loki__container.wants is defined %}
          Wants={{ monitoring_loki__container.wants | join(' ') }}
          {% endif %}
          {% if monitoring_loki__container.after is defined %}
          After={{ monitoring_loki__container.after | join(' ') }}
          {% endif %}
          {% if monitoring_loki__container.part_of is defined %}
          PartOf={{ monitoring_loki__container.part_of | join(' ') }}
          {% endif %}
          {% if monitoring_loki__container.binds_to is defined %}
          BindsTo={{ monitoring_loki__container.binds_to | join(' ') }}
          {% endif %}
          {% if monitoring_loki__container.requires_mounts_for is defined %}
          RequiresMountsFor={{ monitoring_loki__container.requires_mounts_for | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'monitoring_loki__quadlet_result'

    # A failed start of the service only reports the exit code, the reason is in the journal
    - name: 'Start Loki'
      when: 'not ansible_check_mode'
      block:

        - name: 'Start and enable container'
          ansible.builtin.systemd_service:
            name: "{{ monitoring_loki__container.name }}"
            daemon_reload: true
            state: "{{ 'restarted' if monitoring_loki__restart | bool else 'started' }}"
            enabled: true
          vars:
            monitoring_loki__running: >-
              {{ (ansible_facts.services[monitoring_loki__container.name + '.service'].state | default('')) == 'running' }}
            monitoring_loki__restart: >-
              {{ monitoring_loki__running | bool
                 and (monitoring_loki__secrets_result is changed or monitoring_loki__quadlet_result is changed or monitoring_loki__config_result is changed) }}

      rescue:

        - name: 'Read the log of the failed start'
          ansible.builtin.command:
            argv: [ 'journalctl', '-u', "{{ monitoring_loki__container.name }}", '-n', '80', '--no-pager' ]
          register: 'monitoring_loki__start_journal'
          changed_when: false

        - name: 'Fail with the log of the failed start'
          ansible.builtin.fail:
            msg: >-
              {{ [ monitoring_loki__container.name ~ ' did not start: ' ~ (ansible_failed_result.msg | default('')) ]
                 + monitoring_loki__start_journal.stdout_lines }}

    # The ingester reports ready some seconds after the start
    - name: 'Wait for Loki'
      ansible.builtin.uri:
        url: "http://{{ monitoring_loki__container.ip }}:{{ monitoring_loki__port }}/ready"
        return_content: true
        status_code: [ 200, 503 ]
        # Without the container the address does not answer, a short timeout ends the wait in time
        timeout: 5
      register: 'monitoring_loki__ready'
      until: monitoring_loki__ready.status | default(-1) == 200
      retries: 60
      delay: 2
      failed_when: false
      when: 'not ansible_check_mode'

    - name: 'Read the log of Loki'
      when:
        - not ansible_check_mode
        - monitoring_loki__ready.status | default(-1) != 200
      ansible.builtin.command:
        argv: [ 'journalctl', '-u', "{{ monitoring_loki__container.name }}", '-n', '50', '--no-pager' ]
      register: 'monitoring_loki__journal'
      changed_when: false

    - name: 'Assert that Loki answers'
      when: 'not ansible_check_mode'
      ansible.builtin.assert:
        that:
          - monitoring_loki__journal is skipped
        fail_msg: "{{ monitoring_loki__journal.stdout_lines | default([]) }}"
        quiet: true

    - name: 'Enable autoupdate on container'
      when: 'monitoring_loki__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ monitoring_loki__container.name }}"
        container_image: "{{ monitoring_loki__container.image }}"
        container_schedule: "{{ monitoring_loki__autoupdate_schedule }}"
