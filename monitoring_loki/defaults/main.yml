---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-loki
#

monitoring_loki__home: "{{ loki_home | mandatory }}"
monitoring_loki__ip: "{{ loki_ip | mandatory }}"
monitoring_loki__ipv6: "{{ loki_ipv6 }}"
monitoring_loki__network: "{{ loki_network | mandatory }}"
monitoring_loki__hostname: "{{ loki_hostname | mandatory }}"
monitoring_loki__timezone: "{{ loki_timezone | mandatory }}"
monitoring_loki__labels: "{{ loki_labels }}"

monitoring_loki__version: "{{ loki_version | default('latest') }}"

monitoring_loki__container: "{{ monitoring_loki__podman_container_default | combine(loki_container | default({})) }}"

# The configuration of Loki, every key replaces the key of the default (the local-config.yaml of the image)
monitoring_loki__config: "{{ monitoring_loki__config_default | combine(loki_config | default({})) }}"

# Loki reads no variables besides TZ, the configuration references the secrets with ${TARGET}
monitoring_loki__environment: "{{ monitoring_loki__environment_default | combine(loki_environment | default({})) }}"

# Secrets with name, data and target, passed in the environment and referenced in loki_config with ${TARGET}
monitoring_loki__secrets: "{{ loki_secrets | default([]) }}"

monitoring_loki__autoupdate_enabled: "{{ loki_autoupdate_enabled | default(false) }}"
monitoring_loki__autoupdate_schedule: "{{ loki_autoupdate_schedule }}"

#
# Defaults - do not change
#

# cmd/loki/loki-docker-config.yaml of Loki v3.7.10, without the reports of the usage to Grafana Labs
monitoring_loki__config_default:
  auth_enabled: false
  server:
    http_listen_port: 3100
  common:
    instance_addr: '127.0.0.1'
    path_prefix: "{{ monitoring_loki__data_dir }}"
    storage:
      filesystem:
        chunks_directory: "{{ monitoring_loki__data_dir }}/chunks"
        rules_directory: "{{ monitoring_loki__data_dir }}/rules"
    replication_factor: 1
    ring:
      kvstore:
        store: 'inmemory'
  schema_config:
    configs:
      - from: '2020-10-24'
        store: 'tsdb'
        object_store: 'filesystem'
        schema: 'v13'
        index:
          prefix: 'index_'
          period: '24h'
  ruler:
    alertmanager_url: 'http://localhost:9093'
  analytics:
    reporting_enabled: false

monitoring_loki__port: 3100

monitoring_loki__environment_default:
  TZ: "{{ monitoring_loki__timezone }}"

monitoring_loki__environment_allowed: [ 'TZ' ]

# The targets of the secrets, distinct from TZ and the variables of the image
monitoring_loki__secret_pattern: '^LOKI_[A-Z0-9_]+$'

# Fields of the configuration carrying secrets, their values have to reference a secret with ${TARGET}
monitoring_loki__config_secret_keys:
  - 'secret_access_key'
  - 'password'
  - 'basic_auth_password'
  - 'client_secret'
  - 'account_key'
  - 'sas_token'
  - 'session_token'
  - 'secret_key'
  - 'service_account'

# The user loki of the image
monitoring_loki__uid: 10001
monitoring_loki__gid: 10001

# The directories in the container
monitoring_loki__config_file: '/etc/loki/config.yaml'
monitoring_loki__data_dir: '/loki'

monitoring_loki__podman_name: 'loki'
monitoring_loki__podman_image: 'docker.io/grafana/loki'
monitoring_loki__podman_tag: "{{ monitoring_loki__version }}"

monitoring_loki__podman_home: "{{ monitoring_loki__home }}"
monitoring_loki__podman_config_file: "{{ monitoring_loki__podman_home }}/config.yaml"
monitoring_loki__podman_data_dir: "{{ monitoring_loki__podman_home }}/data"

monitoring_loki__podman_container_default:
  name: "{{ monitoring_loki__podman_name }}"
  hostname: "{{ monitoring_loki__hostname }}"
  image: "{{ monitoring_loki__podman_image }}:{{ monitoring_loki__podman_tag }}"
  ip: "{{ monitoring_loki__ip }}"
  ipv6: "{{ monitoring_loki__ipv6 | default(omit) }}"
  network: "{{ monitoring_loki__network }}"
  timezone: "{{ monitoring_loki__timezone }}"
  environment: "{{ monitoring_loki__environment }}"
  labels: "{{ monitoring_loki__labels | default(omit) }}"
  # loki_container.command replaces the flags completely, the secrets need -config.expand-env=true
  command:
    - "-config.file={{ monitoring_loki__config_file }}"
    - '-config.expand-env=true'
  secrets: >-
    {{ (monitoring_loki__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined')
        | map(attribute='name') | zip(monitoring_loki__secrets | select('mapping') | selectattr('name', 'defined')
                                      | selectattr('target', 'defined') | map(attribute='target'))
        | map('join', ',type=env,target=') | list)
       if (monitoring_loki__secrets is sequence and monitoring_loki__secrets is not string and monitoring_loki__secrets | length > 0)
       else omit }}
  # loki_container.volumes replaces the configuration and the data
  volumes:
    - "{{ monitoring_loki__podman_config_file }}:{{ monitoring_loki__config_file }}:ro,Z"
    - "{{ monitoring_loki__podman_data_dir }}:{{ monitoring_loki__data_dir }}:Z"
