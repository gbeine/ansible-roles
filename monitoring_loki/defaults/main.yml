---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-loki
#

monitoring_loki__home: "{{ loki_home | mandatory }}"
monitoring_loki__ip: "{{ loki_ip | mandatory }}"
monitoring_loki__ipv6: "{{ loki_ipv6 }}"
monitoring_loki__network: "{{ loki_network | mandatory }}"
monitoring_loki__hostname: "{{ loki_hostname | mandatory }}"
monitoring_loki__timezone: "{{ loki_timezone | mandatory }}"
monitoring_loki__labels: "{{ loki_labels }}"

monitoring_loki__version: "{{ loki_version | default('latest') }}"

monitoring_loki__container: "{{ monitoring_loki__podman_container_default | combine(loki_container | default({})) }}"

# The configuration of Loki, every key replaces the key of the default (the local-config.yaml of the image), null removes a key of the default
monitoring_loki__config: "{{ monitoring_loki__config_default | combine(loki_config | default({})) }}"

# Loki reads no variables besides TZ, without loki_environment the container has no environment
monitoring_loki__environment: "{{ loki_environment }}"

# Secrets with name, data and target, the target is the path of the option in loki_config,
# e.g. common.storage.s3.secret_access_key, the role references the secret in config.yaml
monitoring_loki__secrets: "{{ loki_secrets | default([]) }}"

monitoring_loki__autoupdate_enabled: "{{ loki_autoupdate_enabled | default(false) }}"
monitoring_loki__autoupdate_schedule: "{{ loki_autoupdate_schedule }}"

#
# Defaults - do not change
#

# cmd/loki/loki-docker-config.yaml of Loki v3.7.10, without the reports of the usage to Grafana Labs
monitoring_loki__config_default:
  auth_enabled: false
  server:
    http_listen_port: 3100
  common:
    instance_addr: '127.0.0.1'
    path_prefix: '/loki'
    storage:
      filesystem:
        chunks_directory: '/loki/chunks'
        rules_directory: '/loki/rules'
    replication_factor: 1
    ring:
      kvstore:
        store: 'inmemory'
  schema_config:
    configs:
      - from: '2020-10-24'
        store: 'tsdb'
        object_store: 'filesystem'
        schema: 'v13'
        index:
          prefix: 'index_'
          period: '24h'
  ruler:
    alertmanager_url: 'http://localhost:9093'
  analytics:
    reporting_enabled: false

monitoring_loki__port: 3100

# Generated from the yaml tags of Config in pkg/loki/loki.go of Loki v3.7.10, update with new versions of the image,
# Loki checks the keys below with -verify-config
monitoring_loki__config_allowed:
  - 'target'
  - 'auth_enabled'
  - 'http_prefix'
  - 'ballast_bytes'
  - 'server'
  - 'internal_server'
  - 'ui'
  - 'distributor'
  - 'querier'
  - 'query_engine'
  - 'query_scheduler'
  - 'frontend'
  - 'query_range'
  - 'ruler'
  - 'ruler_storage'
  - 'ingester_client'
  - 'ingester'
  - 'pattern_ingester'
  - 'index_gateway'
  - 'bloom_build'
  - 'bloom_gateway'
  - 'storage_config'
  - 'chunk_store_config'
  - 'schema_config'
  - 'compactor'
  - 'compactor_client'
  - 'compactor_grpc_client'
  - 'limits_config'
  - 'frontend_worker'
  - 'table_manager'
  - 'memberlist'
  - 'kafka_config'
  - 'dataobj'
  - 'ingest_limits'
  - 'ingest_limits_frontend'
  - 'ingest_limits_frontend_client'
  - 'runtime_config'
  - 'operational_config'
  - 'tracing'
  - 'analytics'
  - 'profiling'
  - 'tenant_limits_allow_publish'
  - 'legacy_read_target'
  - 'common'
  - 'shutdown_delay'
  - 'metrics_namespace'

# The variables of the image, Loki reads no other variables
monitoring_loki__environment_allowed: [ 'TZ' ]

# The environment variables of the secrets are the prefix and the target in upper case, dots replaced by _
monitoring_loki__secret_prefix: 'LOKI_SECRET_'

# Fields of the configuration carrying secrets, they are set with loki_secrets, the last key of a target is one of them
monitoring_loki__config_secret_keys:
  - 'secret_access_key'
  - 'password'
  - 'basic_auth_password'
  - 'client_secret'
  - 'account_key'
  - 'sas_token'
  - 'session_token'
  - 'secret_key'
  - 'service_account'

# The user loki of the image
monitoring_loki__uid: 10001
monitoring_loki__gid: 10001

monitoring_loki__podman_name: 'loki'
monitoring_loki__podman_image: 'docker.io/grafana/loki'
monitoring_loki__podman_tag: "{{ monitoring_loki__version }}"

monitoring_loki__podman_home: "{{ monitoring_loki__home }}"
monitoring_loki__podman_config_file: "{{ monitoring_loki__podman_home }}/config.yaml"
monitoring_loki__podman_data_dir: "{{ monitoring_loki__podman_home }}/data"

# The valid secrets with their path and environment variable, broken entries are left out, the validation reports them
monitoring_loki__secrets_valid: >-
  {%- set result = [] -%}
  {%- if monitoring_loki__secrets is sequence and monitoring_loki__secrets is not string and monitoring_loki__secrets is not mapping -%}
  {%-   for secret in monitoring_loki__secrets if secret is mapping and secret.name is defined and secret.target is defined
                                                and secret.target is string and secret.target is match('^[a-z0-9_]+(\.[a-z0-9_]+)+$')
                                                and (secret.target | split('.') | last) in monitoring_loki__config_secret_keys -%}
  {%-     set _ = result.append({ 'name': secret.name, 'path': secret.target | split('.'),
                                  'variable': monitoring_loki__secret_prefix ~ (secret.target | replace('.', '_') | upper) }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ result }}

# The references of the secrets as nested dictionaries, e.g. { 'ruler': { 'alertmanager_client': { 'basic_auth_password': '${LOKI_SECRET_…}' } } }
monitoring_loki__config_secrets: >-
  {%- set ns = namespace(result={}) -%}
  {%- for secret in monitoring_loki__secrets_valid -%}
  {%-   set node = namespace(value='${' ~ secret.variable ~ '}') -%}
  {%-   for key in secret.path | reverse -%}
  {%-     set node.value = { key: node.value } -%}
  {%-   endfor -%}
  {%-   set ns.result = ns.result | combine(node.value, recursive=true) -%}
  {%- endfor -%}
  {{ ns.result }}

# The content of config.yaml: the configuration without the removed keys and with the references of the secrets
monitoring_loki__config_rendered: >-
  {{ monitoring_loki__config | dict2items | rejectattr('value', 'none') | items2dict
     | combine(monitoring_loki__config_secrets, recursive=true) }}

monitoring_loki__podman_container_default:
  name: "{{ monitoring_loki__podman_name }}"
  hostname: "{{ monitoring_loki__hostname }}"
  image: "{{ monitoring_loki__podman_image }}:{{ monitoring_loki__podman_tag }}"
  ip: "{{ monitoring_loki__ip }}"
  ipv6: "{{ monitoring_loki__ipv6 | default(omit) }}"
  network: "{{ monitoring_loki__network }}"
  timezone: "{{ monitoring_loki__timezone }}"
  environment: "{{ monitoring_loki__environment | default(omit) }}"
  labels: "{{ monitoring_loki__labels | default(omit) }}"
  # loki_container.command replaces the flags completely, the secrets need -config.expand-env=true
  command:
    - '-config.file=/etc/loki/config.yaml'
    - '-config.expand-env=true'
  # Loki reads no files, the secrets are variables referenced in config.yaml
  secrets: >-
    {{ (monitoring_loki__secrets_valid | map(attribute='name')
        | zip(monitoring_loki__secrets_valid | map(attribute='variable')) | map('join', ',type=env,target=') | list)
       if monitoring_loki__secrets_valid | length > 0 else omit }}
  # loki_container.volumes replaces the configuration and the data
  volumes:
    - "{{ monitoring_loki__podman_config_file }}:/etc/loki/config.yaml:ro,Z"
    - "{{ monitoring_loki__podman_data_dir }}:/loki:Z"
