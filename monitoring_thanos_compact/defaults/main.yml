---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-thanos-compact
#

# The image has no tag latest
monitoring_thanos_compact__version: "{{ thanos_compact_version | mandatory }}"

monitoring_thanos_compact__home: "{{ thanos_compact_home | mandatory }}"
monitoring_thanos_compact__ip: "{{ thanos_compact_ip | mandatory }}"
monitoring_thanos_compact__ipv6: "{{ thanos_compact_ipv6 }}"
monitoring_thanos_compact__network: "{{ thanos_compact_network | mandatory }}"
monitoring_thanos_compact__hostname: "{{ thanos_compact_hostname | mandatory }}"
monitoring_thanos_compact__timezone: "{{ thanos_compact_timezone | mandatory }}"
monitoring_thanos_compact__labels: "{{ thanos_compact_labels }}"

# Content of bucket.yml without credentials, compact compacts and downsamples the blocks of this object storage
monitoring_thanos_compact__objstore: "{{ thanos_compact_objstore | mandatory }}"

# Secrets with name, data and target, the target is the path of the option in thanos_compact_objstore,
# e.g. config.secret_key, the role references the secret in bucket.yml
monitoring_thanos_compact__secrets: "{{ thanos_compact_secrets | default([]) }}"

monitoring_thanos_compact__container: "{{ monitoring_thanos_compact__podman_container_default | combine(thanos_compact_container | default({})) }}"

# Thanos reads no variables besides TZ, without thanos_compact_environment the container has no environment
monitoring_thanos_compact__environment: "{{ thanos_compact_environment }}"

monitoring_thanos_compact__autoupdate_enabled: "{{ thanos_compact_autoupdate_enabled | default(false) }}"
monitoring_thanos_compact__autoupdate_schedule: "{{ thanos_compact_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_thanos_compact__environment_allowed: [ 'TZ' ]

# User and group nobody of the image, the owner of the data directory
monitoring_thanos_compact__uid: 65534
monitoring_thanos_compact__gid: 65534

# HTTP endpoints (/-/ready, /metrics), compact serves no StoreAPI
monitoring_thanos_compact__http_port: 10902

# Generated from the yaml tags of BucketConfig in client/factory.go and the providers of objstore.go
# of github.com/thanos-io/objstore 71d60dfee488 (Thanos v0.42.5), MEMORY is left out, it only exists for tests
monitoring_thanos_compact__objstore_allowed: [ 'type', 'config', 'prefix' ]
monitoring_thanos_compact__objstore_types:
  - 'FILESYSTEM'
  - 'GCS'
  - 'S3'
  - 'AZURE'
  - 'SWIFT'
  - 'COS'
  - 'ALIYUNOSS'
  - 'BOS'
  - 'OCI'
  - 'OBS'

# Options of the providers of github.com/thanos-io/objstore 71d60dfee488 carrying secrets,
# they are set with thanos_compact_secrets, the last key of a target is one of them
monitoring_thanos_compact__objstore_secret_keys:
  - 'secret_key'
  - 'session_token'
  - 'encryption_key'
  - 'service_account'
  - 'client_secret'
  - 'storage_account_key'
  - 'password'
  - 'application_credential_secret'
  - 'access_key_secret'
  - 'passphrase'
  - 'privatekey'

# The environment variables of the secrets are the prefix and the target in upper case, dots replaced by _
monitoring_thanos_compact__secret_prefix: 'THANOS_SECRET_'

# The valid secrets with their path and environment variable, broken entries are left out, the validation reports them
monitoring_thanos_compact__secrets_valid: >-
  {%- set result = [] -%}
  {%- if monitoring_thanos_compact__secrets is sequence and monitoring_thanos_compact__secrets is not string
         and monitoring_thanos_compact__secrets is not mapping -%}
  {%-   for secret in monitoring_thanos_compact__secrets if secret is mapping and secret.name is defined and secret.target is defined
                                                          and secret.target is string and secret.target is match('^[a-z0-9_]+(\.[a-z0-9_]+)+$')
                                                          and (secret.target | split('.') | last) in monitoring_thanos_compact__objstore_secret_keys -%}
  {%-     set _ = result.append({ 'name': secret.name, 'path': secret.target | split('.'),
                                  'variable': monitoring_thanos_compact__secret_prefix ~ (secret.target | replace('.', '_') | upper) }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ result }}

# The references of the secrets as nested dictionaries, e.g. { 'config': { 'secret_key': '$(THANOS_SECRET_CONFIG_SECRET_KEY)' } },
# Thanos replaces $(…) in bucket.yml with the environment
monitoring_thanos_compact__objstore_secrets: >-
  {%- set ns = namespace(result={}) -%}
  {%- for secret in monitoring_thanos_compact__secrets_valid -%}
  {%-   set node = namespace(value='$(' ~ secret.variable ~ ')') -%}
  {%-   for key in secret.path | reverse -%}
  {%-     set node.value = { key: node.value } -%}
  {%-   endfor -%}
  {%-   set ns.result = ns.result | combine(node.value, recursive=true) -%}
  {%- endfor -%}
  {{ ns.result }}

# The content of bucket.yml: the object storage with the references of the secrets
monitoring_thanos_compact__objstore_rendered: >-
  {{ monitoring_thanos_compact__objstore | combine(monitoring_thanos_compact__objstore_secrets, recursive=true) }}

# The data directory is the working directory, without --wait compact exits after one run
monitoring_thanos_compact__command_default:
  - 'compact'
  - '--wait'
  - '--data-dir=/var/thanos/compact'
  - '--objstore.config-file=/etc/thanos/bucket.yml'

monitoring_thanos_compact__podman_name: 'thanos-compact'
monitoring_thanos_compact__podman_image: 'docker.io/thanosio/thanos'
monitoring_thanos_compact__podman_tag: "{{ monitoring_thanos_compact__version }}"
monitoring_thanos_compact__podman_data_dir: "{{ monitoring_thanos_compact__home }}/data"
monitoring_thanos_compact__podman_objstore_file: "{{ monitoring_thanos_compact__home }}/bucket.yml"

monitoring_thanos_compact__podman_container_default:
  name: "{{ monitoring_thanos_compact__podman_name }}"
  hostname: "{{ monitoring_thanos_compact__hostname }}"
  image: "{{ monitoring_thanos_compact__podman_image }}:{{ monitoring_thanos_compact__podman_tag }}"
  ip: "{{ monitoring_thanos_compact__ip }}"
  ipv6: "{{ monitoring_thanos_compact__ipv6 | default(omit) }}"
  network: "{{ monitoring_thanos_compact__network }}"
  timezone: "{{ monitoring_thanos_compact__timezone }}"
  environment: "{{ monitoring_thanos_compact__environment | default(omit) }}"
  labels: "{{ monitoring_thanos_compact__labels | default(omit) }}"
  user: "{{ monitoring_thanos_compact__uid }}:{{ monitoring_thanos_compact__gid }}"
  # thanos_compact_container.command replaces the list completely
  command: "{{ monitoring_thanos_compact__command_default }}"
  # The providers read no files, the secrets are variables referenced in bucket.yml
  secrets: >-
    {{ (monitoring_thanos_compact__secrets_valid | map(attribute='name')
        | zip(monitoring_thanos_compact__secrets_valid | map(attribute='variable')) | map('join', ',type=env,target=') | list)
       if monitoring_thanos_compact__secrets_valid | length > 0 else omit }}
  # thanos_compact_container.volumes replaces the list completely
  volumes:
    - "{{ monitoring_thanos_compact__podman_data_dir }}:/var/thanos/compact"
    - "{{ monitoring_thanos_compact__podman_objstore_file }}:/etc/thanos/bucket.yml:ro"
