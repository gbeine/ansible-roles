---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-thanos-compact
#

# The image has no tag latest
monitoring_thanos_compact__version: "{{ thanos_compact_version | mandatory }}"

monitoring_thanos_compact__home: "{{ thanos_compact_home | mandatory }}"
monitoring_thanos_compact__ip: "{{ thanos_compact_ip | mandatory }}"
monitoring_thanos_compact__ipv6: "{{ thanos_compact_ipv6 }}"
monitoring_thanos_compact__network: "{{ thanos_compact_network | mandatory }}"
monitoring_thanos_compact__hostname: "{{ thanos_compact_hostname | mandatory }}"
monitoring_thanos_compact__timezone: "{{ thanos_compact_timezone | mandatory }}"
monitoring_thanos_compact__labels: "{{ thanos_compact_labels }}"

# Content of bucket.yml, stored as podman secret, compact compacts and downsamples the blocks of this object storage
monitoring_thanos_compact__objstore: "{{ thanos_compact_objstore | default({}) }}"

monitoring_thanos_compact__container: "{{ monitoring_thanos_compact__podman_container_default | combine(thanos_compact_container | default({})) }}"

# Thanos reads no variables besides TZ
monitoring_thanos_compact__environment: "{{ monitoring_thanos_compact__environment_default | combine(thanos_compact_environment | default({})) }}"

monitoring_thanos_compact__autoupdate_enabled: "{{ thanos_compact_autoupdate_enabled | default(false) }}"
monitoring_thanos_compact__autoupdate_schedule: "{{ thanos_compact_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_thanos_compact__environment_default:
  TZ: "{{ monitoring_thanos_compact__timezone }}"

monitoring_thanos_compact__environment_allowed: [ 'TZ' ]

# User and group nobody of the image, the owner of the data directory
monitoring_thanos_compact__uid: 65534
monitoring_thanos_compact__gid: 65534

# HTTP endpoints (/-/ready, /metrics), compact serves no StoreAPI
monitoring_thanos_compact__http_port: 10902

monitoring_thanos_compact__objstore_file: '/etc/thanos/bucket.yml'
monitoring_thanos_compact__data_dir: '/var/thanos/compact'

monitoring_thanos_compact__objstore_flags: >-
  {{ [ '--objstore.config-file=' ~ monitoring_thanos_compact__objstore_file ] if monitoring_thanos_compact__objstore | length > 0 else [] }}

# The data directory is the working directory, without --wait compact exits after one run
monitoring_thanos_compact__command_default: >-
  {{ [ 'compact',
       '--wait',
       '--data-dir=' ~ monitoring_thanos_compact__data_dir ]
     + monitoring_thanos_compact__objstore_flags }}

monitoring_thanos_compact__podman_name: 'thanos-compact'
monitoring_thanos_compact__podman_image: 'docker.io/thanosio/thanos'
monitoring_thanos_compact__podman_tag: "{{ monitoring_thanos_compact__version }}"
monitoring_thanos_compact__podman_data_dir: "{{ monitoring_thanos_compact__home }}/data"
# Named after the container, a container with another name has its own secret
monitoring_thanos_compact__podman_objstore_secret: >-
  {{ (thanos_compact_container | default({})).name | default(monitoring_thanos_compact__podman_name) }}-objstore

monitoring_thanos_compact__podman_container_default:
  name: "{{ monitoring_thanos_compact__podman_name }}"
  hostname: "{{ monitoring_thanos_compact__hostname }}"
  image: "{{ monitoring_thanos_compact__podman_image }}:{{ monitoring_thanos_compact__podman_tag }}"
  ip: "{{ monitoring_thanos_compact__ip }}"
  ipv6: "{{ monitoring_thanos_compact__ipv6 | default(omit) }}"
  network: "{{ monitoring_thanos_compact__network }}"
  timezone: "{{ monitoring_thanos_compact__timezone }}"
  environment: "{{ monitoring_thanos_compact__environment }}"
  labels: "{{ monitoring_thanos_compact__labels | default(omit) }}"
  user: "{{ monitoring_thanos_compact__uid }}:{{ monitoring_thanos_compact__gid }}"
  # thanos_compact_container.command replaces the list completely
  command: "{{ monitoring_thanos_compact__command_default }}"
  secrets: >-
    {{ [ monitoring_thanos_compact__podman_objstore_secret ~ ',type=mount,target=' ~ monitoring_thanos_compact__objstore_file ]
       if monitoring_thanos_compact__objstore | length > 0 else omit }}
  # thanos_compact_container.volumes replaces the list completely
  volumes:
    - "{{ monitoring_thanos_compact__podman_data_dir }}:{{ monitoring_thanos_compact__data_dir }}"
