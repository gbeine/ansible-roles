---
# Network created by container_podman in prepare.yml
monitoring_thanos_compact__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

monitoring_thanos_compact__test_image: 'docker.io/thanosio/thanos:v0.42.5'
monitoring_thanos_compact__test_bucket_dir: '/opt/thanos-bucket'

monitoring_thanos_compact__test_cases:

  # Only the mandatory variables, compact works on a bucket in the file system,
  # the volume of the bucket is added with thanos_compact_container
  - name: 'molecule-thanos-compact-default'
    role_vars:
      thanos_compact_version: 'v0.42.5'
      thanos_compact_home: '/opt/thanos-compact'
      thanos_compact_ip: '10.89.0.66'
      thanos_compact_network: 'podman-molecule'
      thanos_compact_hostname: 'thanos-compact-default'
      thanos_compact_timezone: 'Europe/Berlin'
      thanos_compact_objstore:
        type: 'FILESYSTEM'
        config:
          directory: '/bucket'
      thanos_compact_container:
        volumes:
          - '/opt/thanos-compact/data:/var/thanos/compact'
          - '/opt/thanos-bucket:/bucket'
    expect:
      ip: '10.89.0.66'
      ip6: ~
      objstore: true
      quadlet:
        - 'Volume=/opt/thanos-compact/data:/var/thanos/compact'
        - 'Volume=/opt/thanos-bucket:/bucket'

  # IPv6 and labels
  - name: 'molecule-thanos-compact'
    role_vars:
      thanos_compact_version: 'v0.42.5'
      thanos_compact_home: '/opt/thanos-compact'
      thanos_compact_ip: '10.89.0.67'
      thanos_compact_ipv6: 'fd00:89::67'
      thanos_compact_network: 'podman-molecule'
      thanos_compact_hostname: 'thanos-compact-molecule'
      thanos_compact_timezone: 'Europe/Berlin'
      thanos_compact_labels:
        traefik.enable: 'false'
      thanos_compact_objstore:
        type: 'FILESYSTEM'
        config:
          directory: '/bucket'
      thanos_compact_container:
        volumes:
          - '/opt/thanos-compact/data:/var/thanos/compact'
          - '/opt/thanos-bucket:/bucket'
    # side_effect changes the object storage, the secret changes and compact has to restart
    side_effect:
      role_vars:
        thanos_compact_objstore:
          type: 'FILESYSTEM'
          config:
            directory: '/bucket/changed'
    expect:
      ip: '10.89.0.67'
      ip6: 'fd00:89::67'
      objstore: true
      quadlet:
        - 'Volume=/opt/thanos-compact/data:/var/thanos/compact'
        - 'Volume=/opt/thanos-bucket:/bucket'
        - 'Label=traefik.enable=false'
