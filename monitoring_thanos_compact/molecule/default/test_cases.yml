---
# Network created by container_podman in prepare.yml
monitoring_thanos_compact__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

monitoring_thanos_compact__test_image: 'docker.io/thanosio/thanos:v0.42.5'
monitoring_thanos_compact__test_quadlet_path: '/etc/containers/systemd/thanos-compact.container'
monitoring_thanos_compact__test_home: '/opt/thanos-compact'
monitoring_thanos_compact__test_bucket_dir: '/opt/thanos-bucket'

# S3 server of prepare.yml, rclone serves the directories of /data as buckets
monitoring_thanos_compact__test_s3_image: 'docker.io/rclone/rclone:1.76.0'
monitoring_thanos_compact__test_s3_ip: '10.89.0.65'
monitoring_thanos_compact__test_s3_dir: '/opt/thanos-s3'
monitoring_thanos_compact__test_s3_access_key: 'molecule'
monitoring_thanos_compact__test_s3_secret_key: 'molecule-s3-secret-key'

monitoring_thanos_compact__test_cases:

  # Only the mandatory variables, compact works on a bucket in the file system,
  # the volume of the bucket is added with thanos_compact_container
  - name: 'molecule-thanos-compact-default'
    role_vars:
      thanos_compact_version: 'v0.42.5'
      thanos_compact_home: '/opt/thanos-compact'
      thanos_compact_ip: '10.89.0.66'
      thanos_compact_network: 'podman-molecule'
      thanos_compact_hostname: 'thanos-compact-default'
      thanos_compact_timezone: 'Europe/Berlin'
      thanos_compact_objstore:
        type: 'FILESYSTEM'
        config:
          directory: '/bucket'
      thanos_compact_container:
        volumes:
          - '/opt/thanos-compact/data:/var/thanos/compact'
          - '/opt/thanos-compact/bucket.yml:/etc/thanos/bucket.yml:ro'
          - '/opt/thanos-bucket:/bucket'
    expect:
      ip: '10.89.0.66'
      ip6: ~
      secrets: []
      quadlet:
        - 'Volume=/opt/thanos-compact/data:/var/thanos/compact'
        - 'Volume=/opt/thanos-compact/bucket.yml:/etc/thanos/bucket.yml:ro'
        - 'Volume=/opt/thanos-bucket:/bucket'

  # IPv6, labels and S3 with the secret key as secret
  - name: 'molecule-thanos-compact'
    role_vars:
      thanos_compact_version: 'v0.42.5'
      thanos_compact_home: '/opt/thanos-compact'
      thanos_compact_ip: '10.89.0.67'
      thanos_compact_ipv6: 'fd00:89::67'
      thanos_compact_network: 'podman-molecule'
      thanos_compact_hostname: 'thanos-compact-molecule'
      thanos_compact_timezone: 'Europe/Berlin'
      thanos_compact_labels:
        traefik.enable: 'false'
      thanos_compact_objstore:
        type: 'S3'
        config:
          bucket: 'thanos'
          endpoint: '10.89.0.65:9000'
          region: 'us-east-1'
          insecure: true
          bucket_lookup_type: 'path'
          access_key: 'molecule'
      thanos_compact_secrets:
        - name: 'thanos_compact_s3_secret_key'
          data: 'molecule-s3-secret-key'
          target: 'config.secret_key'
    # side_effect changes the prefix of the object storage, bucket.yml changes and compact has to restart
    side_effect:
      role_vars:
        thanos_compact_objstore:
          type: 'S3'
          prefix: 'molecule'
          config:
            bucket: 'thanos'
            endpoint: '10.89.0.65:9000'
            region: 'us-east-1'
            insecure: true
            bucket_lookup_type: 'path'
            access_key: 'molecule'
    expect:
      ip: '10.89.0.67'
      ip6: 'fd00:89::67'
      secrets:
        - 'Secret=thanos_compact_s3_secret_key,type=env,target=THANOS_SECRET_CONFIG_SECRET_KEY'
      bucket:
        - 'prefix: molecule'
        - '  secret_key: "$(THANOS_SECRET_CONFIG_SECRET_KEY)"'
      quadlet:
        - 'Volume=/opt/thanos-compact/data:/var/thanos/compact'
        - 'Volume=/opt/thanos-compact/bucket.yml:/etc/thanos/bucket.yml:ro'
        - 'Label=traefik.enable=false'
