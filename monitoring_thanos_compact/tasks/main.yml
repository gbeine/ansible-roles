---

- name: 'Install Thanos Compact'
  tags: [ 'monitoring', 'monitoring_thanos_compact' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or thanos_compact_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - (monitoring_thanos_compact__container | length) + (monitoring_thanos_compact__objstore | to_json | length) > 0
        quiet: true

    - name: 'Validate the role variables'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_compact__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_thanos_compact__invalid | join('. ') }}"
        quiet: true
      vars:
        monitoring_thanos_compact__invalid: >-
          {%- set errors = [] -%}
          {%- set objstore = monitoring_thanos_compact__objstore -%}
          {%- if objstore is not mapping -%}
          {%-   set _ = errors.append('thanos_compact_objstore has to be a dictionary') -%}
          {%- elif objstore | length == 0 -%}
          {%-   set _ = errors.append('thanos_compact_objstore is required') -%}
          {%- elif objstore.type is not defined -%}
          {%-   set _ = errors.append('thanos_compact_objstore needs type') -%}
          {%- endif -%}
          {%- set lines = monitoring_thanos_compact__environment | dict2items | selectattr('value', 'string')
                          | selectattr('value', 'search', '[\r\n]') | map(attribute='key') | list -%}
          {%- if lines | length > 0 -%}
          {%-   set _ = errors.append('Values of thanos_compact_environment must not contain line breaks: ' ~ lines | join(', ')) -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment of the container after merging thanos_compact_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_compact__environment_unknown | length == 0
        fail_msg: >-
          Unknown environment variables: {{ monitoring_thanos_compact__environment_unknown | join(', ') }},
          Thanos only reads {{ monitoring_thanos_compact__environment_allowed | join(', ') }}.
        quiet: true
      vars:
        monitoring_thanos_compact__environment_unknown: >-
          {{ (monitoring_thanos_compact__container.environment | default({})).keys()
             | reject('in', monitoring_thanos_compact__environment_allowed) | list }}

    - name: 'Create the data directory'
      ansible.builtin.file:
        path: "{{ monitoring_thanos_compact__podman_data_dir }}"
        owner: "{{ monitoring_thanos_compact__uid }}"
        group: "{{ monitoring_thanos_compact__gid }}"
        mode: '0755'
        state: 'directory'

    # The content of bucket.yml contains the credentials of the object storage,
    # it is neither part of a file on the host nor of the quadlet unit
    - name: 'Create or remove the secret of the object storage'
      no_log: true
      containers.podman.podman_secret:
        name: "{{ monitoring_thanos_compact__podman_objstore_secret }}"
        data: >-
          {{ (monitoring_thanos_compact__objstore | to_nice_yaml(indent=2, sort_keys=false))
             if monitoring_thanos_compact__objstore | length > 0 else omit }}
        state: "{{ 'present' if monitoring_thanos_compact__objstore | length > 0 else 'absent' }}"
      register: 'monitoring_thanos_compact__objstore_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ monitoring_thanos_compact__container.name }}"
        hostname: "{{ monitoring_thanos_compact__container.hostname }}"
        image: "{{ monitoring_thanos_compact__container.image }}"
        ip: "{{ monitoring_thanos_compact__container.ip }}"
        ip6: "{{ monitoring_thanos_compact__container.ipv6 | default(omit) }}"
        network: "{{ monitoring_thanos_compact__container.network }}"
        timezone: "{{ monitoring_thanos_compact__container.timezone }}"
        user: "{{ monitoring_thanos_compact__container.user | default(omit) }}"
        command: "{{ monitoring_thanos_compact__container.command | default(omit) }}"
        env: "{{ monitoring_thanos_compact__container.environment | default(omit) }}"
        etc_hosts: "{{ monitoring_thanos_compact__container.etc_hosts | default(omit) }}"
        expose: "{{ monitoring_thanos_compact__container.expose | default(omit) }}"
        label: "{{ monitoring_thanos_compact__container.labels | default(omit) }}"
        publish: "{{ monitoring_thanos_compact__container.publish | default(omit) }}"
        secrets: "{{ monitoring_thanos_compact__container.secrets | default(omit) }}"
        volume: "{{ monitoring_thanos_compact__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if monitoring_thanos_compact__container.requires is defined %}
          Requires={{ monitoring_thanos_compact__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'monitoring_thanos_compact__quadlet_result'

    # A failed start of the service only reports the exit code, the reason is in the journal
    - name: 'Start Thanos Compact'
      when: 'not ansible_check_mode'
      block:

        - name: 'Start and enable container'
          ansible.builtin.systemd_service:
            name: "{{ monitoring_thanos_compact__container.name }}"
            daemon_reload: true
            state: "{{ 'restarted' if monitoring_thanos_compact__restart | bool else 'started' }}"
            enabled: true
          vars:
            monitoring_thanos_compact__running: >-
              {{ (ansible_facts.services[monitoring_thanos_compact__container.name + '.service'].state | default('')) == 'running' }}
            monitoring_thanos_compact__restart: >-
              {{ monitoring_thanos_compact__running | bool
                 and (monitoring_thanos_compact__objstore_result is changed or monitoring_thanos_compact__quadlet_result is changed) }}

      rescue:

        - name: 'Read the log of the failed start'
          ansible.builtin.command:
            argv: [ 'journalctl', '-u', "{{ monitoring_thanos_compact__container.name }}", '-n', '80', '--no-pager' ]
          register: 'monitoring_thanos_compact__start_journal'
          changed_when: false

        - name: 'Fail with the log of the failed start'
          ansible.builtin.fail:
            msg: "{{ [ monitoring_thanos_compact__container.name ~ ' did not start' ] + monitoring_thanos_compact__start_journal.stdout_lines }}"

    - name: 'Wait for Thanos Compact'
      ansible.builtin.uri:
        url: "http://{{ monitoring_thanos_compact__container.ip }}:{{ monitoring_thanos_compact__http_port }}/-/ready"
        status_code: [ 200, 503 ]
      register: 'monitoring_thanos_compact__ready'
      until: monitoring_thanos_compact__ready.status | default(-1) == 200
      retries: 60
      delay: 2
      failed_when: false
      when: 'not ansible_check_mode'

    - name: 'Read the log of Thanos Compact'
      when:
        - not ansible_check_mode
        - monitoring_thanos_compact__ready.status | default(-1) != 200
      ansible.builtin.command:
        argv: [ 'journalctl', '-u', "{{ monitoring_thanos_compact__container.name }}", '-n', '50', '--no-pager' ]
      register: 'monitoring_thanos_compact__journal'
      changed_when: false

    - name: 'Assert that Thanos Compact is ready'
      when: 'not ansible_check_mode'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_compact__journal is skipped
        fail_msg: "{{ monitoring_thanos_compact__journal.stdout_lines | default([]) }}"
        quiet: true

    - name: 'Enable autoupdate on container'
      when: 'monitoring_thanos_compact__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ monitoring_thanos_compact__container.name }}"
        container_image: "{{ monitoring_thanos_compact__container.image }}"
        container_schedule: "{{ monitoring_thanos_compact__autoupdate_schedule }}"
