---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-telegraf
#

monitoring_telegraf__home: "{{ telegraf_home | mandatory }}"
monitoring_telegraf__ip: "{{ telegraf_ip | mandatory }}"
monitoring_telegraf__ipv6: "{{ telegraf_ipv6 }}"
monitoring_telegraf__network: "{{ telegraf_network | mandatory }}"
monitoring_telegraf__hostname: "{{ telegraf_hostname | mandatory }}"
monitoring_telegraf__timezone: "{{ telegraf_timezone | mandatory }}"
monitoring_telegraf__labels: "{{ telegraf_labels }}"

monitoring_telegraf__version: "{{ telegraf_version | default('alpine') }}"

# Secrets with name and data, mounted to /run/secrets/<name>, telegraf_config references them with @{secrets:<name>}
monitoring_telegraf__secrets: "{{ telegraf_secrets | default([]) }}"

# Telegraf and gopsutil read only the variables of monitoring_telegraf__environment_allowed,
# without telegraf_environment the container has no environment
monitoring_telegraf__environment: "{{ telegraf_environment }}"

# telegraf.conf as dictionary, every key replaces the key of the default, outputs and inputs are mandatory
monitoring_telegraf__config: "{{ monitoring_telegraf__config_default | combine(telegraf_config | default({})) }}"

monitoring_telegraf__container: "{{ monitoring_telegraf__podman_container_default | combine(telegraf_container | default({})) }}"

monitoring_telegraf__autoupdate_enabled: "{{ telegraf_autoupdate_enabled | default(false) }}"
monitoring_telegraf__autoupdate_schedule: "{{ telegraf_autoupdate_schedule }}"

#
# Defaults - do not change
#

# User and group telegraf of the Alpine image, the entrypoint runs telegraf as this user
monitoring_telegraf__uid: 100
monitoring_telegraf__gid: 101

monitoring_telegraf__config_default:
  agent:
    interval: '10s'
    round_interval: true
    metric_batch_size: 1000
    metric_buffer_limit: 10000
    collection_jitter: '0s'
    flush_interval: '10s'
    flush_jitter: '0s'
    precision: '0s'
    omit_hostname: true

# Generated from the top-level tables of loadConfig in config/config.go of Telegraf v1.40.4,
# without the legacy aliases tags and plugins, telegraf config check checks the tables below
monitoring_telegraf__config_allowed:
  - 'agent'
  - 'global_tags'
  - 'outputs'
  - 'inputs'
  - 'processors'
  - 'aggregators'
  - 'secretstores'

# Sections with plugins, every plugin is a list of tables, e.g. [[inputs.cpu]]
monitoring_telegraf__config_plugin_sections: [ 'outputs', 'inputs', 'processors', 'aggregators', 'secretstores' ]

# Fields carrying secrets, they only take references of secret stores, e.g. @{secrets:<name>}
monitoring_telegraf__config_secret_keys:
  - 'password'
  - 'token'
  - 'basic_password'
  - 'api_key'
  - 'api_token'
  - 'client_secret'
  - 'secret_key'
  - 'auth_password'
  - 'priv_password'

# The secret store of telegraf_secrets, plugins reference a secret with @{secrets:<name>}
monitoring_telegraf__secret_store: 'secrets'

# TZ and the variables of gopsutil v4.26.10 (common/env.go) and of the disk input of Telegraf v1.40.4 (HOST_MOUNT_PREFIX),
# the entrypoint of the image reads no variables
monitoring_telegraf__environment_allowed:
  - 'TZ'
  - 'HOST_PROC'
  - 'HOST_SYS'
  - 'HOST_ETC'
  - 'HOST_VAR'
  - 'HOST_RUN'
  - 'HOST_DEV'
  - 'HOST_ROOT'
  - 'HOST_PROC_MOUNTINFO'
  - 'HOST_MOUNT_PREFIX'

# The configuration with the secret store of telegraf_secrets
monitoring_telegraf__config_rendered: >-
  {{ monitoring_telegraf__config
     | combine({'secretstores': (monitoring_telegraf__config.secretstores | default({}))
                                | combine({'docker': (monitoring_telegraf__config.secretstores.docker | default([]))
                                                     + [ {'id': monitoring_telegraf__secret_store} ]})})
     if monitoring_telegraf__secrets | length > 0 else monitoring_telegraf__config }}

monitoring_telegraf__podman_name: 'telegraf'
monitoring_telegraf__podman_image: 'docker.io/telegraf'
monitoring_telegraf__podman_tag: "{{ monitoring_telegraf__version }}"

monitoring_telegraf__podman_home: "{{ monitoring_telegraf__home }}"
monitoring_telegraf__podman_config_file: "{{ monitoring_telegraf__podman_home }}/telegraf.conf"

monitoring_telegraf__podman_container_default:
  name: "{{ monitoring_telegraf__podman_name }}"
  hostname: "{{ monitoring_telegraf__hostname }}"
  image: "{{ monitoring_telegraf__podman_image }}:{{ monitoring_telegraf__podman_tag }}"
  ip: "{{ monitoring_telegraf__ip }}"
  ipv6: "{{ monitoring_telegraf__ipv6 | default(omit) }}"
  network: "{{ monitoring_telegraf__network }}"
  timezone: "{{ monitoring_telegraf__timezone }}"
  environment: "{{ monitoring_telegraf__environment | default(omit) }}"
  labels: "{{ monitoring_telegraf__labels | default(omit) }}"
  # ping and other inputs send ICMP packets
  cap_add: [ 'cap_net_raw' ]
  # Only entries with a name, broken entries are reported by the validation,
  # the secret store reads the files as the user telegraf
  secrets: >-
    {{ (monitoring_telegraf__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name') | map('string')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=/run/secrets/\1,uid=' ~ monitoring_telegraf__uid
                                          ~ ',gid=' ~ monitoring_telegraf__gid ~ ',mode=0400') | list)
       if (monitoring_telegraf__secrets is sequence and monitoring_telegraf__secrets is not string
           and monitoring_telegraf__secrets | select('mapping') | selectattr('name', 'defined') | list | length > 0)
       else omit }}
  # telegraf_container.volumes replaces them completely
  volumes:
    - "{{ monitoring_telegraf__podman_config_file }}:/etc/telegraf/telegraf.conf:ro"
