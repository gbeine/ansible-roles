---
# Network created by container_podman in prepare.yml
monitoring_telegraf__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24

monitoring_telegraf__test_image: 'docker.io/telegraf:alpine'
monitoring_telegraf__test_secret: 'molecule-telegraf-secret'
monitoring_telegraf__test_metrics_dir: '/opt/telegraf-molecule-metrics'

monitoring_telegraf__test_vars:
  telegraf_home: '/opt/telegraf-molecule'
  telegraf_ip: '10.89.0.30'
  telegraf_network: 'podman-molecule'
  telegraf_hostname: 'telegraf-molecule'
  telegraf_timezone: 'Europe/Berlin'
  telegraf_agent_interval: '2s'
  telegraf_agent_flush_interval: '2s'
  telegraf_global_tags:
    secret: '${MOLECULE_SECRET}'
    env: '${MOLECULE_ENV}'
  telegraf_environment:
    MOLECULE_ENV: 'converge'
  telegraf_secrets:
    - name: 'telegraf_molecule_secret'
      data: 'molecule-telegraf-secret'
      target: 'MOLECULE_SECRET'
  telegraf_volumes:
    - '/opt/telegraf-molecule-metrics:/metrics'
  telegraf_outputs:
    - plugin: 'file'
      files: [ '/metrics/metrics.out' ]
      data_format: 'influx'
  telegraf_inputs:
    - plugin: 'cpu'
      percpu: false
      totalcpu: true
    - plugin: 'mem'

# Environment changed in side_effect.yml, the running service must be restarted
monitoring_telegraf__test_side_effect_env: 'side-effect'
