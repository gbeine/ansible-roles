---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks:
      - "{{ monitoring_telegraf__test_network }}"
    podman_default_network: "{{ monitoring_telegraf__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Ensure /etc/timezone exists'
      ansible.builtin.copy:
        dest: '/etc/timezone'
        content: |
          Etc/UTC
        force: false
        mode: '0644'

    - name: 'Create the directory for the metrics, writable by the telegraf user of the image'
      ansible.builtin.file:
        dest: "{{ monitoring_telegraf__test_metrics_dir }}"
        owner: 100
        group: 101
        mode: '0755'
        state: 'directory'

    - name: 'Pull the Telegraf image, so the first start of the service does not time out'
      containers.podman.podman_image:
        name: "{{ monitoring_telegraf__test_image }}"
