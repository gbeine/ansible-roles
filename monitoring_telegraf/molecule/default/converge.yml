---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  pre_tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_telegraf__test_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  tasks:

    - name: 'Run monitoring_telegraf'
      ansible.builtin.include_role:
        name: 'monitoring_telegraf'
