---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/security-fail2ban
#

security_fail2ban__settings: "{{ fail2ban_settings | default({}) }}"
security_fail2ban__jail_defaults: "{{ security_fail2ban__jail_defaults_default | combine(fail2ban_jail_defaults | default({})) }}"

security_fail2ban__jails: "{{ fail2ban_jails | default(security_fail2ban__jails_default) }}"
security_fail2ban__filters: "{{ fail2ban_filters | default([]) }}"

security_fail2ban__prune: "{{ fail2ban_prune | default(true) }}"

#
# Defaults - do not change
#

# Together with security_fail2ban__jails_default the same as jail.d/defaults-debian.conf of Debian 13
security_fail2ban__jail_defaults_default:
  banaction: 'nftables'
  banaction_allports: 'nftables[type=allports]'

security_fail2ban__jails_default:
  - name: 'sshd'
    settings:
      backend: 'systemd'
      journalmatch: '_SYSTEMD_UNIT=ssh.service + _COMM=sshd'

security_fail2ban__etc_dir: '/etc/fail2ban'
security_fail2ban__debian_defaults_file: "{{ security_fail2ban__etc_dir }}/jail.d/defaults-debian.conf"
