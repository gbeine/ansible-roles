---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  tasks:

    - name: 'Create the log file of the jail molecule, the polling backend needs it on start'
      ansible.builtin.copy:
        dest: "{{ security_fail2ban__test_logfile }}"
        content: ''
        force: false
        mode: '0640'
