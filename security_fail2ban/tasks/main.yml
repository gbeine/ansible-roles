---

- name: 'Install fail2ban'
  tags: [ 'security_fail2ban' ]
  block:

    - name: 'Include OS-specific variables'
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_os_family }}.yml"

    - name: 'Install fail2ban packages'
      ansible.builtin.apt:
        update_cache: 'yes'
        install_recommends: 'no'
        pkg: "{{ security_fail2ban__packages }}"

    - name: 'Configure fail2ban'
      ansible.builtin.template:
        src: 'jail.local.j2'
        dest: '/etc/fail2ban/jail.local'
        owner: 'root'
        group: 'root'
        mode: '644'
      notify:
        - 'Restart fail2ban'

    - name: 'Configure fail2ban filters'
      ansible.builtin.template:
        src: 'filter.conf.j2'
        dest: "/etc/fail2ban/filter.d/{{ item.name }}.conf"
        owner: 'root'
        group: 'root'
        mode: '644'
      with_items: "{{ security_fail2ban__filter }}"
      vars:
        filter: "{{ item }}"
      notify:
        - 'Restart fail2ban'

    - name: 'Configure fail2ban jails'
      ansible.builtin.template:
        src: 'jail.conf.j2'
        dest: "/etc/fail2ban/jail.d/{{ item.name }}.conf"
        owner: 'root'
        group: 'root'
        mode: '644'
      with_items: "{{ security_fail2ban__jails }}"
      vars:
        jail: "{{ item }}"
      notify:
        - 'Restart fail2ban'
