---
# yamllint disable rule:line-length
#
# Settings of fail2ban 1.1 with their defaults, from config/fail2ban.conf and the
# section [DEFAULT] of config/jail.conf of fail2ban 1.1.0 (unchanged in the Debian package 1.1.0-8).
# Settings with commented: true are commented out in the original files and stay
# commented out in the generated files unless they are set.
#

# fail2ban.local
security_fail2ban__release_daemon_sections:
  - name: 'DEFAULT'
    settings:
      - name: 'loglevel'
        description: |-
          Set the log level output: CRITICAL, ERROR, WARNING, NOTICE, INFO, DEBUG
        default: 'INFO'
      - name: 'logtarget'
        description: |-
          Set the log target. This could be a file, SYSTEMD-JOURNAL, SYSLOG, STDERR or STDOUT.
          Only one log target can be specified.
          If you change logtarget from the default value and you are using logrotate,
          also adjust or disable rotation in /etc/logrotate.d/fail2ban.
        default: '/var/log/fail2ban.log'
      - name: 'syslogsocket'
        description: |-
          Set the syslog socket file. Only used when logtarget is SYSLOG,
          auto uses platform.system() to determine predefined paths.
        default: 'auto'
      - name: 'socket'
        description: |-
          Set the socket file. This is used to communicate with the daemon.
        default: '/var/run/fail2ban/fail2ban.sock'
      - name: 'pidfile'
        description: |-
          Set the PID file. This is used to store the process ID of the fail2ban server.
        default: '/var/run/fail2ban/fail2ban.pid'
      - name: 'allowipv6'
        description: |-
          Allows IPv6 interface: auto, yes (on, true, 1), no (off, false, 0)
        default: 'auto'
        commented: true
      - name: 'dbfile'
        description: |-
          Set the file for the fail2ban persistent data to be stored.
          A value of ":memory:" means database is only stored in memory and data is lost when fail2ban is stopped.
          A value of "None" disables the database.
        default: '/var/lib/fail2ban/fail2ban.sqlite3'
      - name: 'dbpurgeage'
        description: |-
          Sets age at which bans should be purged from the database.
        default: '1d'
      - name: 'dbmaxmatches'
        description: |-
          Number of matches stored in database per ticket (resolvable via tags <ipmatches>/<ipjailmatches> in actions).
        default: '10'
  - name: 'Definition'
    settings: []
  - name: 'Thread'
    settings:
      - name: 'stacksize'
        description: |-
          Specifies the stack size (in KiB) to be used for subsequently created threads,
          and must be 0 or a positive integer value of at least 32.
        default: '0'
        commented: true

# Section [DEFAULT] of jail.local
security_fail2ban__release_jail_defaults:
  - name: 'bantime.increment'
    description: |-
      "bantime.increment" allows to use database for searching of previously banned ip's to increase a
      default ban time using special formula, default it is banTime * 1, 2, 4, 8, 16, 32...
    default: 'true'
    commented: true
  - name: 'bantime.rndtime'
    description: |-
      "bantime.rndtime" is the max number of seconds using for mixing with random time
      to prevent "clever" botnets calculate exact time IP can be unbanned again.
    default: ''
    commented: true
  - name: 'bantime.maxtime'
    description: |-
      "bantime.maxtime" is the max number of seconds using the ban time can reach (doesn't grow further).
    default: ''
    commented: true
  - name: 'bantime.factor'
    description: |-
      "bantime.factor" is a coefficient to calculate exponent growing of the formula or common multiplier,
      default value of factor is 1 and with default value of formula, the ban time grows by 1, 2, 4, 8, 16 ...
    default: '1'
    commented: true
  - name: 'bantime.formula'
    description: |-
      "bantime.formula" used by default to calculate next value of ban time,
      the same ban time growing will be reached by multipliers 1, 2, 4, 8, 16, 32...
      More aggressive example of formula has the same values only for factor "2.0 / 2.885385":
      ban.Time * math.exp(float(ban.Count+1)*banFactor)/math.exp(1*banFactor)
    default: 'ban.Time * (1<<(ban.Count if ban.Count<20 else 20)) * banFactor'
    commented: true
  - name: 'bantime.multipliers'
    description: |-
      "bantime.multipliers" used to calculate next value of ban time instead of formula, corresponding
      previously ban count and given "bantime.factor" (for multipliers default is 1).
      For small initial ban time (bantime=60) use e.g. 1 5 30 60 300 720 1440 2880.
    default: '1 2 4 8 16 32 64'
    commented: true
  - name: 'bantime.overalljails'
    description: |-
      "bantime.overalljails" (if true) specifies the search of IP in the database will be executed
      cross over all jails, if false (default), only current jail of the ban IP will be searched.
    default: 'false'
    commented: true
  - name: 'ignoreself'
    description: |-
      "ignoreself" specifies whether the local resp. own IP addresses should be ignored
      (default is true). Fail2ban will not ban a host which matches such addresses.
    default: 'true'
    commented: true
  - name: 'ignoreip'
    description: |-
      "ignoreip" can be a list of IP addresses, CIDR masks or DNS hosts. Fail2ban
      will not ban a host which matches an address in this list. Several addresses
      can be defined using space (and/or comma) separator.
    default: '127.0.0.1/8 ::1'
    commented: true
  - name: 'ignorecommand'
    description: |-
      External command that will take an tagged arguments to ignore, e.g. <ip>,
      and return true if the IP is to be ignored. False otherwise.
      Example: /path/to/command <ip>
    default: ''
  - name: 'bantime'
    description: |-
      "bantime" is the amount of time that a host is banned, integer in seconds or
      time abbreviation format (m - minutes, h - hours, d - days, w - weeks, mo - months, y - years).
      This is to consider as an initial time if bantime.increment gets enabled.
    default: '10m'
  - name: 'findtime'
    description: |-
      A host is banned if it has generated "maxretry" during the last "findtime" seconds.
    default: '10m'
  - name: 'maxretry'
    description: |-
      "maxretry" is the number of failures before a host get banned.
    default: '5'
  - name: 'maxmatches'
    description: |-
      "maxmatches" is the number of matches stored in ticket (resolvable via tag <matches> in actions).
    default: '%(maxretry)s'
  - name: 'backend'
    description: |-
      "backend" specifies the backend used to get files modification: pyinotify, polling, systemd, auto.
      This option can be overridden in each jail as well.
      systemd uses systemd python library to access the systemd journal, specifying "logpath" is not valid for this backend.
      auto will try to use the following backends, in order: pyinotify, polling.
    default: 'auto'
  - name: 'usedns'
    description: |-
      "usedns" specifies if jails should trust hostnames in logs: yes, warn, no, raw.
    default: 'warn'
  - name: 'logencoding'
    description: |-
      "logencoding" specifies the encoding of the log files handled by the jail, e.g. "ascii", "utf-8",
      auto will use the system locale setting.
    default: 'auto'
  - name: 'enabled'
    description: |-
      "enabled" enables the jails. By default all jails are disabled, and it should stay this way.
    default: 'false'
  - name: 'mode'
    description: |-
      "mode" defines the mode of the filter (see corresponding filter implementation for more info).
    default: 'normal'
  - name: 'filter'
    description: |-
      "filter" defines the filter to use by the jail. By default jails have names matching their filter name.
    default: '%(__name__)s[mode=%(mode)s]'
  - name: 'destemail'
    description: |-
      Destination email address used solely for the interpolations in jail.{conf,local,d/*} configuration files.
    default: 'root@localhost'
  - name: 'sender'
    description: |-
      Sender email address used solely for some actions.
    default: 'root@<fq-hostname>'
  - name: 'mta'
    description: |-
      E-mail action. Change mta configuration parameter to mail if you want to revert to conventional 'mail'.
    default: 'sendmail'
  - name: 'protocol'
    description: |-
      Default protocol.
    default: 'tcp'
  - name: 'chain'
    description: |-
      Specify chain where jumps would need to be added in ban-actions expecting parameter chain.
    default: '<known/chain>'
  - name: 'port'
    description: |-
      Ports to be banned. Usually should be overridden in a particular jail.
    default: '0:65535'
  - name: 'fail2ban_agent'
    description: |-
      Format of user-agent https://tools.ietf.org/html/rfc7231#section-5.5.3
    default: 'Fail2Ban/%(fail2ban_version)s'
  - name: 'banaction'
    description: |-
      Default banning action (e.g. iptables, iptables-new, iptables-multiport, nftables, shorewall, etc).
      It is used to define action_* variables. Can be overridden globally or per section.
    default: 'iptables-multiport'
  - name: 'banaction_allports'
    description: |-
      Banning action for all ports.
    default: 'iptables-allports'
  - name: 'action_'
    description: |-
      The simplest action to take: ban only.
    default: '%(banaction)s[port="%(port)s", protocol="%(protocol)s", chain="%(chain)s"]'
  - name: 'action_mw'
    description: |-
      Ban & send an e-mail with whois report to the destemail.
    default:
      - '%(action_)s'
      - '%(mta)s-whois[sender="%(sender)s", dest="%(destemail)s", protocol="%(protocol)s", chain="%(chain)s"]'
  - name: 'action_mwl'
    description: |-
      Ban & send an e-mail with whois report and relevant log lines to the destemail.
    default:
      - '%(action_)s'
      - '%(mta)s-whois-lines[sender="%(sender)s", dest="%(destemail)s", logpath="%(logpath)s", chain="%(chain)s"]'
  - name: 'action_xarf'
    description: |-
      Ban & send a xarf e-mail to abuse contact of IP address and include relevant log lines to the destemail.
      See the IMPORTANT note in action.d/xarf-login-attack for when to use this action.
    default:
      - '%(action_)s'
      - 'xarf-login-attack[service=%(__name__)s, sender="%(sender)s", logpath="%(logpath)s", port="%(port)s"]'
  - name: 'action_cf_mwl'
    description: |-
      Ban IP on CloudFlare & send an e-mail with whois report and relevant log lines to the destemail.
    default:
      - 'cloudflare[cfuser="%(cfemail)s", cftoken="%(cfapikey)s"]'
      - '%(mta)s-whois-lines[sender="%(sender)s", dest="%(destemail)s", logpath="%(logpath)s", chain="%(chain)s"]'
  - name: 'action_blocklist_de'
    description: |-
      Report block via blocklist.de fail2ban reporting service API.
      See the IMPORTANT note in action.d/blocklist_de.conf, set blocklist_de_apikey to use it.
    default: 'blocklist_de[email="%(sender)s", service="%(__name__)s", apikey="%(blocklist_de_apikey)s", agent="%(fail2ban_agent)s"]'
  - name: 'action_abuseipdb'
    description: |-
      Report ban via abuseipdb.com. See action.d/abuseipdb.conf for usage example and details.
    default: 'abuseipdb'
  - name: 'action'
    description: |-
      Choose default action. To change, override value of 'action' with the interpolation
      to the chosen action shortcut (e.g. action_mw, action_mwl, etc).
    default: '%(action_)s'
