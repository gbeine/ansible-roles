---

#
# Substitutes - do not change
#

app_n8n__hostname: "{{ n8n_hostname | default('n8n.' + dns_hostname) }}"
app_n8n__ip: "{{ n8n_ip | mandatory }}"
app_n8n__ipv6: "{{ n8n_ipv6 }}"
app_n8n__network: "{{ n8n_network | mandatory }}"
app_n8n__hosts: "{{ n8n_hosts | default({}) }}"
app_n8n__timezone: "{{ n8n_timezone | mandatory }}"
app_n8n__home: "{{ n8n_home | mandatory }}"

app_n8n__host: "{{ n8n_host | mandatory }}"
app_n8n__webhook_url: "{{ n8n_base_url | default('https://' + app_n8n__host ) }}"
app_n8n__port: "{{ n8n_port | default(5678) }}"
app_n8n__db_name: "{{ n8n_db_name | default('n8n') }}"
app_n8n__db_user: "{{ n8n_db_user | default('n8n') }}"
app_n8n__db_pass: "{{ n8n_db_pass | mandatory }}"
app_n8n__db_host: "{{ n8n_db_host | mandatory }}"
app_n8n__db_port: "{{ n8n_db_port | default(5432) }}"

app_n8n__version: "{{ n8n_version | default('latest') }}"
app_n8n__container: "{{ app_n8n__podman_container_default }}"

#
# Defaults - do not change
#

app_n8n__data_dir: "{{ n8n_home }}/data"

app_n8n__uid: 1000

app_n8n__enforce_file_permissions: true
app_n8n__runners_enabled: true
app_n8n__trust_proxy: true

app_n8n__podman_image: 'docker.io/n8nio/n8n'

app_n8n__podman_container_default:
  name: 'n8n'
  hostname: "{{ app_n8n__hostname }}"
  image: "{{ app_n8n__podman_image }}:{{ app_n8n__version }}"
  ip: "{{ app_n8n__ip }}"
  ipv6: "{{ app_n8n__ipv6 | default(omit) }}"
  network: "{{ app_n8n__network }}"
  environment:
    DB_TYPE: 'postgresdb'
    DB_POSTGRESDB_HOST: "{{ app_n8n__db_host }}"
    DB_POSTGRESDB_PORT: "{{ app_n8n__db_port }}"
    DB_POSTGRESDB_DATABASE: "{{ app_n8n__db_name }}"
    DB_POSTGRESDB_USER: "{{ app_n8n__db_user }}"
    DB_POSTGRESDB_PASSWORD: "{{ app_n8n__db_pass }}"
    N8N_HOST: "{{ app_n8n__host }}"
    N8N_PORT: "{{ app_n8n__port }}"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "{{ app_n8n__enforce_file_permissions | ternary('true', 'false') }}"
    N8N_RUNNERS_ENABLED: "{{ app_n8n__runners_enabled | ternary('true', 'false') }}"
    EXPRESS_TRUST_PROXY: "{{ app_n8n__trust_proxy | ternary('true', 'false') }}"
    WEBHOOK_URL: "{{ app_n8n__webhook_url }}"
    GENERIC_TIMEZONE: "{{ app_n8n__timezone }}"
    TZ: "{{ app_n8n__timezone }}"
  timezone: "{{ app_n8n__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ app_n8n__data_dir }}:/home/node/.n8n"
