---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/n8n
#

app_n8n__home: "{{ n8n_home | mandatory }}"
app_n8n__ip: "{{ n8n_ip | mandatory }}"
app_n8n__ipv6: "{{ n8n_ipv6 }}"
app_n8n__network: "{{ n8n_network | mandatory }}"
app_n8n__hostname: "{{ n8n_hostname | mandatory }}"
app_n8n__timezone: "{{ n8n_timezone | mandatory }}"
app_n8n__labels: "{{ n8n_labels }}"

app_n8n__version: "{{ n8n_version | default('latest') }}"

app_n8n__container: "{{ app_n8n__podman_container_default | combine(n8n_container | default({})) }}"

# The configuration of n8n, the role sets TZ, GENERIC_TIMEZONE and the variables of the owner
app_n8n__environment: "{{ app_n8n__environment_default | combine(n8n_environment | default({})) }}"

# Secrets with name, data and target, e.g. DB_POSTGRESDB_PASSWORD or N8N_ENCRYPTION_KEY
app_n8n__secrets: "{{ n8n_secrets | default([]) }}"

# The owner of n8n with email, first_name, last_name and password, n8n applies it on every start
app_n8n__owner: "{{ n8n_owner | default({}) }}"

app_n8n__autoupdate_enabled: "{{ n8n_autoupdate_enabled | default(false) }}"
app_n8n__autoupdate_schedule: "{{ n8n_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The user node of the image
app_n8n__uid: 1000
app_n8n__gid: 1000

app_n8n__port: "{{ app_n8n__container.environment.N8N_PORT | default(5678) }}"

app_n8n__environment_default:
  TZ: "{{ app_n8n__timezone }}"
  GENERIC_TIMEZONE: "{{ app_n8n__timezone }}"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true

# With DB_TYPE postgresdb these variables and the secret DB_POSTGRESDB_PASSWORD are needed
app_n8n__database_types: [ 'sqlite', 'postgresdb' ]
app_n8n__environment_postgres: [ 'DB_POSTGRESDB_HOST', 'DB_POSTGRESDB_DATABASE', 'DB_POSTGRESDB_USER' ]

# The variables of the owner, set by the role from n8n_owner
app_n8n__environment_managed:
  - 'N8N_INSTANCE_OWNER_MANAGED_BY_ENV'
  - 'N8N_INSTANCE_OWNER_EMAIL'
  - 'N8N_INSTANCE_OWNER_FIRST_NAME'
  - 'N8N_INSTANCE_OWNER_LAST_NAME'
  - 'N8N_INSTANCE_OWNER_PASSWORD_HASH'
  - 'N8N_INSTANCE_OWNER_PASSWORD_HASH_FILE'

app_n8n__environment_owner: >-
  {{ {} if app_n8n__owner | length == 0 else {
       'N8N_INSTANCE_OWNER_MANAGED_BY_ENV': 'true',
       'N8N_INSTANCE_OWNER_EMAIL': app_n8n__owner.email | default(''),
       'N8N_INSTANCE_OWNER_FIRST_NAME': app_n8n__owner.first_name | default('Instance'),
       'N8N_INSTANCE_OWNER_LAST_NAME': app_n8n__owner.last_name | default('Owner'),
       'N8N_INSTANCE_OWNER_PASSWORD_HASH_FILE': app_n8n__secrets_dir ~ '/' ~ app_n8n__owner_secret } }}

# The podman secret of the bcrypt hash of the password of the owner, created by the module app_n8n_owner_secret
app_n8n__owner_secret: "{{ (n8n_container | default({})).name | default(app_n8n__podman_name) }}_owner_password_hash"

# Password rules of n8n 2.47.5 (passwordSchema of @n8n/api-types)
app_n8n__owner_password_pattern: '^(?=.*[0-9])(?=.*[A-Z]).{8,64}$'
app_n8n__owner_email_pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

app_n8n__secret_variables: "{{ app_n8n__secret_files.keys() | list }}"
app_n8n__secrets_dir: '/run/secrets'

# The data of a secret by its target
app_n8n__secret_data: >-
  {%- set data = {} -%}
  {%- if app_n8n__secrets is sequence and app_n8n__secrets is not string and app_n8n__secrets is not mapping -%}
  {%-   for secret in app_n8n__secrets if secret is mapping and secret.target is defined and secret.data is defined -%}
  {%-     set _ = data.update({ secret.target: secret.data }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ data }}

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
app_n8n__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if app_n8n__secrets is sequence and app_n8n__secrets is not string and app_n8n__secrets is not mapping -%}
  {%-   for secret in app_n8n__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in app_n8n__secret_files -%}
  {%-     set _ = environment.update({ app_n8n__secret_files[secret.target]: app_n8n__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The environment of the container, n8n only reads true and false as booleans, so booleans are written in lower case
app_n8n__environment_container: >-
  {%- set environment = {} -%}
  {%- for key, value in (app_n8n__environment | combine(app_n8n__environment_secrets_files, app_n8n__environment_owner)).items() -%}
  {%-   set _ = environment.update({ key: (value | string | lower) if value is boolean else value }) -%}
  {%- endfor -%}
  {{ environment }}

# The podman secrets of n8n_secrets and the hash of the password of the owner
app_n8n__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- if app_n8n__secrets is sequence and app_n8n__secrets is not string and app_n8n__secrets is not mapping -%}
  {%-   for secret in app_n8n__secrets if secret is mapping and secret.name is defined -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ app_n8n__secrets_dir ~ '/' ~ secret.name) -%}
  {%-   endfor -%}
  {%- endif -%}
  {%- if app_n8n__owner | length > 0 -%}
  {%-   set _ = secrets.append(app_n8n__owner_secret ~ ',type=mount,target=' ~ app_n8n__secrets_dir ~ '/' ~ app_n8n__owner_secret) -%}
  {%- endif -%}
  {{ secrets }}

# The packages of the controlled host for the hash of the password of the owner
app_n8n__packages: [ 'python3-bcrypt' ]

app_n8n__podman_name: 'n8n'
app_n8n__podman_image: 'docker.io/n8nio/n8n'

app_n8n__podman_container_default:
  name: "{{ app_n8n__podman_name }}"
  hostname: "{{ app_n8n__hostname }}"
  image: "{{ app_n8n__podman_image }}:{{ app_n8n__version }}"
  ip: "{{ app_n8n__ip }}"
  ipv6: "{{ app_n8n__ipv6 | default(omit) }}"
  network: "{{ app_n8n__network }}"
  timezone: "{{ app_n8n__timezone }}"
  labels: "{{ app_n8n__labels | default(omit) }}"
  # Set with n8n_environment, n8n_secrets and n8n_owner, merged over the default
  environment: "{{ app_n8n__environment_container }}"
  volumes:
    - "{{ app_n8n__home }}/data:/home/node/.n8n"
  secrets: "{{ app_n8n__podman_secrets if app_n8n__podman_secrets | length > 0 else omit }}"

# n8n reads every variable of @Env from the file NAME_FILE as well (readEnv of @n8n/config 2.47.5), the secrets are mounted as files
app_n8n__secret_files:
  DB_POSTGRESDB_PASSWORD: 'DB_POSTGRESDB_PASSWORD_FILE'
  DB_POSTGRESDB_SSL_KEY: 'DB_POSTGRESDB_SSL_KEY_FILE'
  N8N_ENCRYPTION_KEY: 'N8N_ENCRYPTION_KEY_FILE'
  N8N_USER_MANAGEMENT_JWT_SECRET: 'N8N_USER_MANAGEMENT_JWT_SECRET_FILE'
  N8N_SMTP_PASS: 'N8N_SMTP_PASS_FILE'
  N8N_SMTP_OAUTH_PRIVATE_KEY: 'N8N_SMTP_OAUTH_PRIVATE_KEY_FILE'
  QUEUE_BULL_REDIS_PASSWORD: 'QUEUE_BULL_REDIS_PASSWORD_FILE'
  CREDENTIALS_OVERWRITE_DATA: 'CREDENTIALS_OVERWRITE_DATA_FILE'
  CREDENTIALS_OVERWRITE_ENDPOINT_AUTH_TOKEN: 'CREDENTIALS_OVERWRITE_ENDPOINT_AUTH_TOKEN_FILE'
  N8N_RUNNERS_AUTH_TOKEN: 'N8N_RUNNERS_AUTH_TOKEN_FILE'
  N8N_RUNNERS_GRANT_TOKEN: 'N8N_RUNNERS_GRANT_TOKEN_FILE'
  N8N_LICENSE_ACTIVATION_KEY: 'N8N_LICENSE_ACTIVATION_KEY_FILE'
  N8N_LICENSE_CERT: 'N8N_LICENSE_CERT_FILE'
  N8N_SSO_OIDC_CLIENT_SECRET: 'N8N_SSO_OIDC_CLIENT_SECRET_FILE'
  N8N_EXTERNAL_STORAGE_S3_ACCESS_SECRET: 'N8N_EXTERNAL_STORAGE_S3_ACCESS_SECRET_FILE'
  N8N_EXTERNAL_STORAGE_AZURE_ACCOUNT_KEY: 'N8N_EXTERNAL_STORAGE_AZURE_ACCOUNT_KEY_FILE'
  N8N_BINARY_DATA_SIGNING_SECRET: 'N8N_BINARY_DATA_SIGNING_SECRET_FILE'
  N8N_ENGINE_AUTH_SECRET: 'N8N_ENGINE_AUTH_SECRET_FILE'
  N8N_ENGINE_RESUME_SECRET: 'N8N_ENGINE_RESUME_SECRET_FILE'
  N8N_AI_ANTHROPIC_KEY: 'N8N_AI_ANTHROPIC_KEY_FILE'
  N8N_INSTANCE_AI_MODEL_API_KEY: 'N8N_INSTANCE_AI_MODEL_API_KEY_FILE'
