---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  tasks:

    - name: 'Check the state after the second run (single user mode)'
      ansible.builtin.include_tasks: 'tasks/check_state.yml'
      vars:
        backup_timemachine_server__test_expect: "{{ backup_timemachine_server__test_side_effect.expect }}"
