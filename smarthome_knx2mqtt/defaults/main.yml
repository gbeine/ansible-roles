---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/smarthome-knx2mqtt
#

smarthome_knx2mqtt__home: "{{ knx2mqtt_home | mandatory }}"
smarthome_knx2mqtt__ip: "{{ knx2mqtt_ip | mandatory }}"
smarthome_knx2mqtt__ipv6: "{{ knx2mqtt_ipv6 }}"
smarthome_knx2mqtt__network: "{{ knx2mqtt_network | mandatory }}"
smarthome_knx2mqtt__hostname: "{{ knx2mqtt_hostname | mandatory }}"
smarthome_knx2mqtt__timezone: "{{ knx2mqtt_timezone | mandatory }}"

smarthome_knx2mqtt__version: "{{ knx2mqtt_version | default('latest') }}"

smarthome_knx2mqtt__container: "{{ smarthome_knx2mqtt__container_default | combine(knx2mqtt_container | default({})) }}"

smarthome_knx2mqtt__config: "{{ knx2mqtt_config | mandatory }}"

#
# Defaults - do not change
#

smarthome_knx2mqtt__podman_name: 'knx2mqtt'
smarthome_knx2mqtt__podman_image: 'c0d3.sh/smarthome/knx2mqtt'
smarthome_knx2mqtt__podman_tag: "{{ smarthome_knx2mqtt__version }}"

smarthome_knx2mqtt__podman_home: "{{ smarthome_knx2mqtt__home }}"

smarthome_knx2mqtt__container_default:
  name: "{{ smarthome_knx2mqtt__podman_name }}"
  hostname: "{{ smarthome_knx2mqtt__hostname }}"
  image: "{{ smarthome_knx2mqtt__podman_image }}:{{ smarthome_knx2mqtt__podman_tag }}"
  ip: "{{ smarthome_knx2mqtt__ip }}"
  ipv6: "{{ smarthome_knx2mqtt__ipv6 }}"
  network: "{{ smarthome_knx2mqtt__network }}"
  timezone: "{{ smarthome_knx2mqtt__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ smarthome_knx2mqtt__podman_home }}/knx2mqtt.conf:/etc/knx2mqtt.conf:ro"
