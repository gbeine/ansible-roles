---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/mautrix-bridges
#

mautrix_bridge_discord__home: "{{ mautrix_bridge_discord_home | mandatory }}"
mautrix_bridge_discord__ip: "{{ mautrix_bridge_discord_ip | mandatory }}"
mautrix_bridge_discord__ipv6: "{{ mautrix_bridge_discord_ipv6 | default('') }}"
mautrix_bridge_discord__network: "{{ mautrix_bridge_discord_network | mandatory }}"
mautrix_bridge_discord__hostname: "{{ mautrix_bridge_discord_hostname | mandatory }}"
mautrix_bridge_discord__timezone: "{{ mautrix_bridge_discord_timezone | mandatory }}"

mautrix_bridge_discord__version: "{{ mautrix_bridge_discord_version | default('latest') }}"

mautrix_bridge_discord__dns_servers: "{{ mautrix_bridge_discord_dns_servers | default([]) }}"

mautrix_bridge_discord__setup: "{{ mautrix_bridge_discord_setup | default(true) }}"

mautrix_bridge_discord__container: "{{ mautrix_bridge_discord__container_default | combine(mautrix_bridge_discord_container | default({}))  }}"

mautrix_bridge_discord__autoupdate_enabled: "{{ mautrix_bridge_discord_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

mautrix_bridge_discord__uid: 1337
mautrix_bridge_discord__gid: "{{ mautrix_bridge_discord__uid }}"

mautrix_bridge_discord__podman_name: 'mautrix-discord'
mautrix_bridge_discord__podman_image: 'dock.mau.dev/mautrix/discord'
mautrix_bridge_discord__podman_tag: "{{ mautrix_bridge_discord__version }}"

mautrix_bridge_discord__podman_home: "{{ mautrix_bridge_discord__home }}"

mautrix_bridge_discord__container_default:
  name: "{{ mautrix_bridge_discord__podman_name }}"
  hostname: "{{ mautrix_bridge_discord__hostname }}"
  image: "{{ mautrix_bridge_discord__podman_image }}:{{ mautrix_bridge_discord__podman_tag }}"
  ip: "{{ mautrix_bridge_discord__ip }}"
  ipv6: "{{ mautrix_bridge_discord__ipv6 }}"
  network: "{{ mautrix_bridge_discord__network }}"
  timezone: "{{ mautrix_bridge_discord__timezone }}"
  dns_servers: "{{ mautrix_bridge_discord__dns_servers }}"
  environment:
    TZ: "{{ mautrix_bridge_discord__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ mautrix_bridge_discord__podman_home }}:/data"
