---
# OpenWrt has no Python, all tasks use raw
- name: 'Prepare'
  hosts: 'all'
  gather_facts: false

  vars_files:
    - 'test_cases.yml'

  vars:
    dns_adblock__test_case: "{{ dns_adblock__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  tasks:

    - name: 'Assert the clone is OpenWrt without adblock'
      ansible.builtin.raw: '. /etc/openwrt_release && ! test -x /usr/bin/adblock.sh'
      changed_when: false

    # The role has to keep the installation and remove options and sections set like in LuCI
    - name: 'Install adblock with options the role has to remove'
      ansible.builtin.raw: >-
        if command -v apk >/dev/null; then apk update >/dev/null && apk add adblock;
        else opkg update >/dev/null && opkg install adblock; fi
        && uci set adblock.global.adb_debug=1
        && uci set adblock.global.adb_molecule=1
        && uci set adblock.molecule=adblock
        && uci set adblock.molecule.adb_enabled=0
        && uci commit adblock
      changed_when: true
      when: dns_adblock__test_case.prepare_adblock | bool
