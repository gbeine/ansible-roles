---
dns_adblock__test_cases:

  # Without variables the role installs adblock with the delivered configuration, example.com is not blocked
  - name: 'molecule-adblock-openwrt-default'
    prepare_adblock: false
    role_vars: {}
    expect:
      uci:
        - 'adblock.global=adblock'
        - 'adblock.global.adb_enabled=1'
        - 'adblock.global.adb_debug=0'
        - 'adblock.global.adb_nftforce=0'
        - 'adblock.global.adb_dnsshift=0'
        - 'adblock.global.adb_safesearch=0'
        - 'adblock.global.adb_mail=0'
        - 'adblock.global.adb_report=0'
        - 'adblock.global.adb_feed=adguard adguard_tracking certpl'
        # Detected and stored by adblock, kept by the role
        - 'adblock.global.adb_dns=dnsmasq'
      absent: [ 'adb_tld' ]
      allowlist: []
      blocklist: []
      blocked: []
      resolved: [ 'example.com' ]

  # prepare installs adblock and sets options the role has to remove
  - name: 'molecule-adblock-openwrt'
    prepare_adblock: true
    role_vars:
      adblock_config:
        feed: [ 'certpl' ]
        dns: 'dnsmasq'
        trigger: [ 'wan' ]
        tld: false
      adblock_allowlist: [ 'allowed.molecule.test' ]
      adblock_blocklist: [ 'example.com' ]
    # side_effect blocks a second domain, adblock has to restart
    side_effect:
      adblock_blocklist: [ 'example.com', 'example.net' ]
    expect:
      uci:
        - 'adblock.global=adblock'
        - 'adblock.global.adb_enabled=1'
        - 'adblock.global.adb_debug=0'
        - 'adblock.global.adb_feed=certpl'
        - 'adblock.global.adb_dns=dnsmasq'
        - 'adblock.global.adb_trigger=wan'
        - 'adblock.global.adb_tld=0'
      absent: [ 'adb_molecule', 'adblock.molecule' ]
      allowlist: [ 'allowed.molecule.test' ]
      blocklist: [ 'example.com', 'example.net' ]
      blocked: [ 'example.com', 'example.net' ]
      resolved: []
