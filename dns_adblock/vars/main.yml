---
# Options of the section global without the prefix adb_, taken from the README of adblock and luci-app-adblock

# Flags, written as 0 and 1
dns_adblock__boolean_options:
  - 'enabled'
  - 'debug'
  - 'dnsflush'
  - 'dnsshift'
  - 'fetchinsecure'
  - 'jail'
  - 'mail'
  - 'map'
  - 'nftallow'
  - 'nftblock'
  - 'nftbridge'
  - 'nftforce'
  - 'nftremote'
  - 'report'
  - 'represolve'
  - 'safesearch'
  - 'tld'

# Numbers with their range
dns_adblock__number_options:
  cores: { min: 1 }
  fetchretry: { min: 1 }
  nicelimit: { min: 0, max: 19 }
  dnsinstance: { min: 0 }
  dnstimeout: { min: 1 }
  nftremotetimeout: { min: 1 }
  repchunkcnt: { min: 1 }
  repchunksize: { min: 1 }
  triggerdelay: { min: 0 }

# Lists, written as UCI list, a string is split at commas and spaces
dns_adblock__list_options:
  - 'feed'
  - 'safesearchlist'
  - 'hag_feed'
  - 'hst_feed'
  - 'ipf_feed'
  - 'stb_feed'
  - 'utc_feed'
  - 'nftmacallow'
  - 'nftmacblock'
  - 'nftmacremote'
  - 'nftdevallow'
  - 'nftdevblock'
  - 'nftdevforce'
  - 'nftportforce'
  - 'repport'
  - 'trigger'

# Options with a fixed set of values
dns_adblock__choice_options:
  dns: [ 'dnsmasq', 'unbound', 'named', 'kresd', 'smartdns', 'raw' ]
  fetchcmd: [ 'uclient-fetch', 'wget', 'curl' ]

# Other options, written as they are
dns_adblock__string_options:
  - 'allowdnsv4'
  - 'allowdnsv6'
  - 'blockdnsv4'
  - 'blockdnsv6'
  - 'bridgednsv4'
  - 'bridgednsv6'
  - 'remotednsv4'
  - 'remotednsv6'
  - 'backupdir'
  - 'basedir'
  - 'dnsdir'
  - 'reportdir'
  - 'feedfile'
  - 'customfeedfile'
  - 'fetchparm'
  - 'lookupdomain'
  - 'repfilter'
  - 'repiface'
  - 'mailprofile'
  - 'mailreceiver'
  - 'mailsender'
  - 'mailtopic'
