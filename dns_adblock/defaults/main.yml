---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/dns-adblock
#

# Options of the section global without the prefix adb_, every key replaces the key of the default completely, null removes it
dns_adblock__config: "{{ dns_adblock__config_default | combine(adblock_config | default({})) }}"

# Domains of /etc/adblock/adblock.allowlist and /etc/adblock/adblock.blocklist, empty like the delivery
dns_adblock__allowlist: "{{ adblock_allowlist | default([]) }}"
dns_adblock__blocklist: "{{ adblock_blocklist | default([]) }}"

# Seconds the role waits at most for a running processing of adblock before it restarts adblock
dns_adblock__wait_timeout: "{{ adblock_wait_timeout | default(600) }}"

#
# Defaults - do not change
#

# The configuration of the package adblock (net/adblock/files/adblock.conf of the packages feed) without the prefix adb_
dns_adblock__config_default:
  enabled: true
  debug: false
  nftforce: false
  dnsshift: false
  safesearch: false
  mail: false
  report: false
  feed: [ 'adguard', 'adguard_tracking', 'certpl' ]

dns_adblock__packages: [ 'adblock' ]
dns_adblock__uci_config: '/etc/config/adblock'
dns_adblock__section: 'global'
dns_adblock__feedfile: '/etc/adblock/adblock.feeds'
dns_adblock__customfeedfile: '/etc/adblock/adblock.custom.feeds'
# Lines <feed>;<name>;<path> or <feed>;<name> (utc), the last column is the value of the options with categories
dns_adblock__categoryfile: '/etc/adblock/adblock.categories'
dns_adblock__category_options:
  hag_feed: 'hag'
  hst_feed: 'hst'
  ipf_feed: 'ipf'
  stb_feed: 'stb'
  utc_feed: 'utc'
dns_adblock__allowlist_file: '/etc/adblock/adblock.allowlist'
dns_adblock__blocklist_file: '/etc/adblock/adblock.blocklist'
dns_adblock__pidfile: '/var/run/adblock/adblock.pid'
# adblock.sh detects these options itself if they are missing and stores them in /etc/config/adblock,
# the role keeps them if they are not declared
dns_adblock__detected_options: [ 'adb_dns', 'adb_fetchcmd', 'adb_repiface' ]
