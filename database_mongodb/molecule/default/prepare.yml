---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    database_mongodb__test_case: "{{ database_mongodb__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    podman_networks:
      - "{{ database_mongodb__test_network }}"
    podman_default_network: "{{ database_mongodb__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Pull the image, so the initialization and the first start of the service do not time out'
      containers.podman.podman_image:
        name: "{{ database_mongodb__test_case.expect.image }}"
