---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-mongodb
#

database_mongodb__home: "{{ mongodb_home | mandatory }}"
database_mongodb__ip: "{{ mongodb_ip | mandatory }}"
database_mongodb__ipv6: "{{ mongodb_ipv6 | default('') }}"
database_mongodb__network: "{{ mongodb_network | mandatory }}"
database_mongodb__hostname: "{{ mongodb_hostname | mandatory }}"
database_mongodb__timezone: "{{ mongodb_timezone | mandatory }}"
database_mongodb__labels: "{{ mongodb_labels | default({}) }}"
database_mongodb__publish: "{{ mongodb_publish | default([]) }}"

database_mongodb__flavor: "{{ mongodb_flavor | default('mongo') }}"
database_mongodb__version: "{{ mongodb_version | default('8.0') }}"

database_mongodb__init_root_username: "{{ mongodb_root_username | default('root') }}"
database_mongodb__init_root_password: "{{ mongodb_root_password | mandatory }}"
database_mongodb__keyfile: "{{ mongodb_keyfile | default('') }}"

database_mongodb__accounts: "{{ mongodb_accounts | default([]) }}"

database_mongodb__container: "{{ database_mongodb__podman_container_default | combine(mongodb_container | default({})) }}"

database_mongodb__autoupdate_enabled: "{{ mongodb_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

database_mongodb__uid: '999'
database_mongodb__gid: "{{ database_mongodb__uid }}"

database_mongodb__port: 27017

database_mongodb__podman_name: 'mongodb'
database_mongodb__podman_image: "{{ database_mongodb__podman_image_flavors[database_mongodb__flavor] }}"
database_mongodb__podman_tag: "{{ database_mongodb__version }}"

database_mongodb__podman_home: "{{ database_mongodb__home }}"
database_mongodb__podman_etc_dir: "{{ database_mongodb__podman_home }}/etc"
database_mongodb__podman_configdb_dir: "{{ database_mongodb__podman_home }}/configdb"
database_mongodb__podman_db_dir: "{{ database_mongodb__podman_home }}/db"
database_mongodb__podman_backup_dir: "{{ database_mongodb__podman_home }}/backup"

database_mongodb__podman_container_default:
  name: "{{ database_mongodb__podman_name }}"
  hostname: "{{ database_mongodb__hostname }}"
  image: "{{ database_mongodb__podman_image }}:{{ database_mongodb__podman_tag }}"
  ip: "{{ database_mongodb__ip }}"
  ipv6: "{{ database_mongodb__ipv6 }}"
  network: "{{ database_mongodb__network }}"
  timezone: "{{ database_mongodb__timezone }}"
  labels: "{{ database_mongodb__labels }}"
  publish: "{{ database_mongodb__publish }}"
  secrets:
    - "mongodb_init_root_username,type=env,target=MONGO_INITDB_ROOT_USERNAME"
    - "mongodb_init_root_password,type=env,target=MONGO_INITDB_ROOT_PASSWORD"
  volumes: "{{
    database_mongodb__podman_volumes_default
    + database_mongodb__podman_volume_keyfile
  }}"

database_mongodb__podman_volumes_default:
  - "/etc/localtime:/etc/localtime:ro"
  - "/etc/timezone:/etc/timezone:ro"
  - "{{ database_mongodb__podman_db_dir }}:/data/db"
  - "{{ database_mongodb__podman_configdb_dir }}:/data/configdb"

database_mongodb__podman_volume_keyfile: "{{
  [ database_mongodb__podman_etc_dir + '/mongo-keyfile:/data/mongo-keyfile:ro' ] if database_mongodb__keyfile | length > 0 else []
}}"

database_mongodb__podman_image_flavors:
  mongo: 'docker.io/mongo'
  community: 'docker.io/mongodb/mongodb-community-server'

database_mongodb__packages:
  - 'python3-pymongo'
