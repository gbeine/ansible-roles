---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/freshrss
#

app_freshrss__home: "{{ freshrss_home | mandatory }}"
app_freshrss__ip: "{{ freshrss_ip | mandatory }}"
app_freshrss__ipv6: "{{ freshrss_ipv6 | default('') }}"
app_freshrss__network: "{{ freshrss_network | mandatory }}"
app_freshrss__hostname: "{{ freshrss_hostname | mandatory }}"
app_freshrss__timezone: "{{ freshrss_timezone | default(bootstrap_timezone__timezone) }}"
app_freshrss__labels: "{{ freshrss_labels | default({}) }}"

app_freshrss__version: "{{ freshrss_version | default('latest') }}"

app_freshrss__container: "{{ app_freshrss__container_default | combine(freshrss_container | default({})) }}"

#
# Defaults - do not change
#

app_freshrss__uid: "{{ freshrss_uid | mandatory }}"
app_freshrss__gid: "{{ freshrss_gid | default(app_freshrss__uid) }}"

app_freshrss__podman_name: 'freshrss'
app_freshrss__podman_image: 'lscr.io/linuxserver/freshrss'
app_freshrss__podman_tag: "{{ app_freshrss__version }}"

app_freshrss__podman_home: "{{ app_freshrss__home }}"

app_freshrss__config_dir: "{{ app_freshrss__home }}/www"

app_freshrss__container_default:
  name: '{{ app_freshrss__podman_name }}'
  hostname: "{{ app_freshrss__hostname }}"
  image: "{{ app_freshrss__podman_image }}:{{ app_freshrss__podman_tag }}"
  ip: "{{ app_freshrss__ip }}"
  ipv6: "{{ app_freshrss__ipv6 }}"
  network: "{{ app_freshrss__network }}"
  timezone: "{{ app_freshrss__timezone }}"
  environment:
    PUID: "{{ app_freshrss__uid }}"
    PGID: "{{ app_freshrss__gid }}"
    TZ:  "{{ app_freshrss__timezone }}"
  labels: "{{ app_freshrss__labels }}"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_freshrss__podman_home }}:/config"
