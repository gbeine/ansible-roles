---

- name: 'Deploy FreshRSS container'
  tags: [ 'app_freshrss' ]
  block:

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        owner: "{{ app_freshrss__uid }}"
        group: "{{ app_freshrss__gid }}"
        mode: "{{ item.mode | default('0700') }}"
        state: 'directory'
      with_items:
        - dest: "{{ app_freshrss__podman_home }}"

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ app_freshrss__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[app_freshrss__container.name + ".service"] is defined'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ app_freshrss__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name:  'Install container'
      containers.podman.podman_container:
        name: "{{ app_freshrss__container.name }}"
        hostname: "{{ app_freshrss__container.hostname }}"
        image: "{{ app_freshrss__container.image }}"
        ip: "{{ app_freshrss__container.ip }}"
        network: "{{ app_freshrss__container.network }}"
        timezone: "{{ app_freshrss__container.timezone }}"
        env: "{{ app_freshrss__container.environment }}"
        label: "{{ app_freshrss__container.labels }}"
        volume: "{{ app_freshrss__container.volumes }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if app_freshrss__container.requires is defined %}
          Requires={{ app_freshrss__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | default(false) }}"
      when: 'app_freshrss__ipv6 | length == 0'

    - name:  'Install container'
      containers.podman.podman_container:
        name: "{{ app_freshrss__container.name }}"
        hostname: "{{ app_freshrss__container.hostname }}"
        image: "{{ app_freshrss__container.image }}"
        ip: "{{ app_freshrss__container.ip }}"
        ip6: "{{ app_freshrss__container.ipv6 }}"
        network: "{{ app_freshrss__container.network }}"
        timezone: "{{ app_freshrss__container.timezone }}"
        env: "{{ app_freshrss__container.environment }}"
        label: "{{ app_freshrss__container.labels }}"
        volume: "{{ app_freshrss__container.volumes }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if app_freshrss__container.requires is defined %}
          Requires={{ app_freshrss__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | default(false) }}"
      when: 'app_freshrss__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ app_freshrss__container.name }}"
        daemon_reload: true
        state: 'started'
        enabled: true
      when: 'not ansible_check_mode'
