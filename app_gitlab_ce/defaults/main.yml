---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/app-gitlab-ce
#

# Contains config (/etc/gitlab), data (/var/opt/gitlab) and logs (/var/log/gitlab)
app_gitlab_ce__home: "{{ gitlab_home | mandatory }}"
app_gitlab_ce__ip: "{{ gitlab_ip | mandatory }}"
app_gitlab_ce__ipv6: "{{ gitlab_ipv6 }}"
app_gitlab_ce__network: "{{ gitlab_network | mandatory }}"
app_gitlab_ce__hostname: "{{ gitlab_hostname | mandatory }}"
app_gitlab_ce__timezone: "{{ gitlab_timezone | mandatory }}"
app_gitlab_ce__labels: "{{ gitlab_labels }}"

app_gitlab_ce__version: "{{ gitlab_version | default('latest') }}"

# The options of gitlab.rb, merged recursively over the default, see Configuration in docs/notes.md
app_gitlab_ce__config: "{{ app_gitlab_ce__config_default | combine(app_gitlab_ce__config_tls, gitlab_config | default({}), recursive=true) }}"

# Secrets with name, data and target, the target is the path of an option in gitlab.rb, e.g. gitlab_rails.smtp_password
app_gitlab_ce__secrets: "{{ gitlab_secrets | default([]) }}"

# The keys of options composed from free keys, e.g. { ldap_servers: [ 'main' ] }
app_gitlab_ce__keys: "{{ gitlab_keys | default({}) }}"

# The certificate of the realm, { realm: <name>, dir: <directory of the realms> }, empty without TLS
app_gitlab_ce__tls: "{{ gitlab_tls | default({}) }}"

# GitLab has no default environment
app_gitlab_ce__environment: "{{ gitlab_environment }}"

app_gitlab_ce__container: "{{ app_gitlab_ce__podman_container_default | combine(gitlab_container | default({})) }}"

app_gitlab_ce__autoupdate_enabled: "{{ gitlab_autoupdate_enabled | default(false) }}"
app_gitlab_ce__autoupdate_schedule: "{{ gitlab_autoupdate_schedule }}"

# The timer of pki_update restarts GitLab after a renewal of the certificate of gitlab_tls
app_gitlab_ce__pki_update_enabled: "{{ gitlab_pki_update_enabled | default(true) }}"
app_gitlab_ce__pki_update_schedule: "{{ gitlab_pki_update_schedule | default('*-*-* 00/4:00:00') }}"

#
# Defaults - do not change
#

app_gitlab_ce__podman_name: 'gitlab-ce'
app_gitlab_ce__podman_image: 'docker.io/gitlab/gitlab-ce'
app_gitlab_ce__podman_tag: "{{ app_gitlab_ce__version }}"

app_gitlab_ce__config_dir: "{{ app_gitlab_ce__home }}/config"
app_gitlab_ce__data_dir: "{{ app_gitlab_ce__home }}/data"
app_gitlab_ce__logs_dir: "{{ app_gitlab_ce__home }}/logs"
app_gitlab_ce__ssl_dir: "{{ app_gitlab_ce__config_dir }}/ssl"
app_gitlab_ce__trusted_certs_dir: "{{ app_gitlab_ce__config_dir }}/trusted-certs"
app_gitlab_ce__config_file: "{{ app_gitlab_ce__config_dir }}/gitlab.rb"
app_gitlab_ce__secrets_dir: '/run/secrets'

# The time zone of Rails and the former default of the monitoring whitelist
app_gitlab_ce__config_default:
  gitlab_rails:
    time_zone: "{{ app_gitlab_ce__timezone }}"
    monitoring_whitelist: [ '127.0.0.0/8', '::1/128' ]

# The realms of common_globals (pki_easyrsa_deploy), gitlab_tls.dir for other realms (e.g. pki_certbot)
app_gitlab_ce__realms_dir: "{{ common_globals__pki_realms_dir }}"
# Names of realms, they are directories on the host
app_gitlab_ce__realm_pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
app_gitlab_ce__tls_keys: [ 'realm', 'dir' ]
app_gitlab_ce__tls_realm: "{{ app_gitlab_ce__tls.realm | default('') if app_gitlab_ce__tls is mapping else '' }}"
app_gitlab_ce__tls_dir: "{{ app_gitlab_ce__tls.dir | default(app_gitlab_ce__realms_dir) if app_gitlab_ce__tls is mapping else app_gitlab_ce__realms_dir }}"
app_gitlab_ce__tls_dir_valid: "{{ app_gitlab_ce__tls_dir is string and app_gitlab_ce__tls_dir is match('/') and app_gitlab_ce__tls_dir is not search('[\\n\\r]') }}"
app_gitlab_ce__tls_valid: >-
  {{ app_gitlab_ce__tls_realm is string and app_gitlab_ce__tls_realm is match(app_gitlab_ce__realm_pattern)
     and app_gitlab_ce__tls_dir_valid | bool }}
# ExecStartPre copies the files of the realm into the configuration of GitLab
app_gitlab_ce__tls_files:
  - src: "{{ app_gitlab_ce__tls_dir }}/{{ app_gitlab_ce__tls_realm }}/fullchain.pem"
    dest: "{{ app_gitlab_ce__ssl_dir }}/tls.crt"
    mode: '0644'
  - src: "{{ app_gitlab_ce__tls_dir }}/{{ app_gitlab_ce__tls_realm }}/privkey.pem"
    dest: "{{ app_gitlab_ce__ssl_dir }}/tls.key"
    mode: '0600'
  - src: "{{ app_gitlab_ce__tls_dir }}/{{ app_gitlab_ce__tls_realm }}/chain.pem"
    dest: "{{ app_gitlab_ce__trusted_certs_dir }}/{{ app_gitlab_ce__tls_realm }}.crt"
    mode: '0644'
# The registry uses the certificate of the realm
app_gitlab_ce__config_tls: >-
  {{ { 'registry': { 'nginx': { 'ssl_certificate': '/etc/gitlab/ssl/tls.crt', 'ssl_certificate_key': '/etc/gitlab/ssl/tls.key' } } }
     if app_gitlab_ce__tls_valid | bool else {} }}
# The paths of the options set for gitlab_tls, they must not be set in gitlab_config
app_gitlab_ce__config_tls_paths: [ 'registry.nginx.ssl_certificate', 'registry.nginx.ssl_certificate_key' ]

# The families of gitlab_keys and the secrets composed from their keys
app_gitlab_ce__keys_families: [ 'ldap_servers' ]
app_gitlab_ce__key_pattern: '^[a-z][a-z0-9_]*$'
app_gitlab_ce__keys_valid: >-
  {{ (app_gitlab_ce__keys.ldap_servers | default([]) | select('string') | select('match', app_gitlab_ce__key_pattern) | list)
     if app_gitlab_ce__keys is mapping and app_gitlab_ce__keys.ldap_servers | default([]) is sequence
        and app_gitlab_ce__keys.ldap_servers | default([]) is not string else [] }}
app_gitlab_ce__secrets_allowed_keys: "{{ app_gitlab_ce__keys_valid | map('regex_replace', '^(.*)$', 'gitlab_rails.ldap_servers.\\1.password') | list }}"
app_gitlab_ce__secrets_allowed: "{{ app_gitlab_ce__secrets_allowed_options + app_gitlab_ce__secrets_allowed_keys }}"

# Entries without name, data or target are left out, the validation of the secrets reports them
app_gitlab_ce__secrets_valid: >-
  {{ (app_gitlab_ce__secrets | select('mapping') | selectattr('name', 'defined') | selectattr('data', 'defined')
      | selectattr('target', 'defined') | list)
     if (app_gitlab_ce__secrets is sequence and app_gitlab_ce__secrets is not string) else [] }}

# gitlab-ctl reconfigure reads gitlab.rb as root
app_gitlab_ce__podman_secrets: >-
  {{ app_gitlab_ce__secrets_valid | map(attribute='name')
     | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ app_gitlab_ce__secrets_dir ~ '/\1,uid=0,gid=0,mode=0400') | list }}

# Generated from docker/assets/init-container and docker/assets/gitlab.rb of omnibus-gitlab 19-6-stable,
# GITLAB_OMNIBUS_CONFIG is gitlab_config, GITLAB_ROOT_PASSWORD is the secret gitlab_rails.initial_root_password
app_gitlab_ce__environment_allowed:
  - 'GITLAB_ALLOW_SHA1_RSA'
  - 'GITLAB_DISABLE_OPENSSH'
  - 'GITLAB_PRE_RECONFIGURE_SCRIPT'
  - 'GITLAB_POST_RECONFIGURE_SCRIPT'
  - 'GITLAB_SKIP_PG_UPGRADE'
  - 'GITLAB_SKIP_RECONFIGURE'
  - 'GITLAB_SKIP_TAIL_LOGS'
  - 'OPENSSL_FORCE_FIPS_MODE'
  - 'AWS_CONTAINER_CREDENTIALS_RELATIVE_URI'
  - 'AWS_DEFAULT_REGION'
  - 'AWS_REGION'
  - 'ECS_CONTAINER_METADATA_URI'
  - 'ECS_CONTAINER_METADATA_URI_V4'

app_gitlab_ce__podman_container_default:
  name: "{{ app_gitlab_ce__podman_name }}"
  hostname: "{{ app_gitlab_ce__hostname }}"
  image: "{{ app_gitlab_ce__podman_image }}:{{ app_gitlab_ce__podman_tag }}"
  ip: "{{ app_gitlab_ce__ip }}"
  ipv6: "{{ app_gitlab_ce__ipv6 | default(omit) }}"
  network: "{{ app_gitlab_ce__network }}"
  timezone: "{{ app_gitlab_ce__timezone }}"
  labels: "{{ app_gitlab_ce__labels | default(omit) }}"
  environment: "{{ app_gitlab_ce__environment | default(omit) }}"
  secrets: "{{ app_gitlab_ce__podman_secrets if app_gitlab_ce__podman_secrets | length > 0 else omit }}"
  shm_size: '256m'
  # The first start migrates the database, systemd must not stop it
  timeout_start: 900
  # GitLab stops PostgreSQL, Puma and Sidekiq, podman kills it after 10 seconds by default
  stop_timeout: 120
  # gitlab_container.volumes replaces the list completely
  volumes:
    - "{{ app_gitlab_ce__config_dir }}:/etc/gitlab"
    - "{{ app_gitlab_ce__data_dir }}:/var/opt/gitlab"
    - "{{ app_gitlab_ce__logs_dir }}:/var/log/gitlab"
  # Copies the certificate of the realm on every start, a renewed certificate is used after the next restart,
  # install follows the links of the realm
  exec_start_pre: >-
    {{ app_gitlab_ce__tls_files | map(attribute='mode') | zip(app_gitlab_ce__tls_files | map(attribute='src'), app_gitlab_ce__tls_files | map(attribute='dest'))
       | map('join', ' ') | map('regex_replace', '^', 'install -o root -g root -m ') | list
       if app_gitlab_ce__tls_valid | bool else [] }}

# Generated from files/gitlab-config-template/gitlab.rb.template of omnibus-gitlab 19-6-stable:
# the settings of the top level, e.g. external_url 'https://gitlab.example.org'
app_gitlab_ce__config_settings:
  - 'external_url'
  - 'gitlab_kas_external_url'
  - 'pages_external_url'
  - 'registry_external_url'
  - 'roles'
  - 'runtime_dir'

