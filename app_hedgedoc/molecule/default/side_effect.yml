---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_hedgedoc__test_case: "{{ app_hedgedoc__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    app_hedgedoc__test_vars: "{{ app_hedgedoc__test_case.role_vars }}"
    app_hedgedoc__test_config: "{{ app_hedgedoc__test_vars.hedgedoc_config }}"
    app_hedgedoc__test_environment: "{{ app_hedgedoc__test_vars.hedgedoc_environment | default({}) }}"
    app_hedgedoc__test_secrets: "{{ app_hedgedoc__test_vars.hedgedoc_secrets }}"
    app_hedgedoc__test_checked_files:
      - "{{ app_hedgedoc__test_quadlet_path }}"
      - "{{ app_hedgedoc__test_config_path }}"

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ app_hedgedoc__test_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksums of the checked files before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ app_hedgedoc__test_checked_files }}"
      register: 'app_hedgedoc__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include

    - name: 'Run app_hedgedoc with hedgedoc_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_container: [ 'environment' ]
        app_hedgedoc__test_invalid:
          message: 'hedgedoc_container not a dictionary'
          # combine of the defaults fails before the role checks anything
          search: 'failed to combine variables, expected dicts'

    - name: 'Run app_hedgedoc with hedgedoc_config not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_config: [ 'domain' ]
        app_hedgedoc__test_invalid:
          message: 'hedgedoc_config not a dictionary'
          search: 'failed to combine variables, expected dicts|^hedgedoc_config has to be a dictionary\.$'

    - name: 'Run app_hedgedoc without domain (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_config: "{{ app_hedgedoc__test_config | combine({ 'domain': '' }) }}"
        app_hedgedoc__test_invalid:
          message: 'without domain'
          search: '^HedgeDoc needs the options domain in hedgedoc_config, missing or empty: domain\.$'

    - name: 'Run app_hedgedoc with an unknown option (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_config: "{{ app_hedgedoc__test_config | combine({ 'allowAnonymus': true }) }}"
        app_hedgedoc__test_invalid:
          message: 'an unknown option'
          search: '^Unknown options in hedgedoc_config: allowAnonymus\.'

    - name: 'Run app_hedgedoc with the database in hedgedoc_config (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_config: "{{ app_hedgedoc__test_config | combine({ 'dbURL': 'sqlite:///config/other.sqlite' }) }}"
        app_hedgedoc__test_invalid:
          message: 'the database in hedgedoc_config'
          search: '^Options set by the role must not be set in hedgedoc_config: dbURL, '

    - name: 'Run app_hedgedoc with a secret in hedgedoc_config (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_config: "{{ app_hedgedoc__test_config | combine({ 'sessionSecret': 'plain', 'oauth2': { 'clientSecret': 'plain' } }, recursive=true) }}"
        app_hedgedoc__test_invalid:
          message: 'a secret in hedgedoc_config'
          search: '^Options set by the role must not be set in hedgedoc_config: (sessionSecret, oauth2\.clientSecret|oauth2\.clientSecret, sessionSecret), '

    - name: 'Run app_hedgedoc with an invalid boolean (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_config: "{{ app_hedgedoc__test_config | combine({ 'allowAnonymous': 'no', 'csp': { 'enable': 'true' } }) }}"
        app_hedgedoc__test_invalid:
          message: 'an invalid boolean'
          search: '^These options are booleans, allowed are true and false: (allowAnonymous, csp\.enable|csp\.enable, allowAnonymous)\.$'

    - name: 'Run app_hedgedoc with a line break in an option (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_config: "{{ app_hedgedoc__test_config | combine({ 'forbiddenNoteIDs': [ 'robots.txt', 'favicon.ico\nfoo' ] }) }}"
        app_hedgedoc__test_invalid:
          message: 'a line break in an option'
          search: '^Values must not contain line breaks: forbiddenNoteIDs\.$'

    - name: 'Run app_hedgedoc with hedgedoc_secrets not a list (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_secrets: 'hedgedoc_session_secret'
        app_hedgedoc__test_invalid:
          message: 'hedgedoc_secrets not a list'
          search: '^`hedgedoc_secrets` has to be a list$'

    - name: 'Run app_hedgedoc with a secret without target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_secrets: [ { name: 'hedgedoc_session_secret', data: 'x' } ]
        app_hedgedoc__test_invalid:
          message: 'a secret without target'
          search: '^`hedgedoc_secrets` entries need name, data and target$'

    - name: 'Run app_hedgedoc without the session secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_secrets: "{{ app_hedgedoc__test_secrets | rejectattr('target', 'eq', 'CMD_SESSION_SECRET') | list }}"
        app_hedgedoc__test_invalid:
          message: 'without the session secret'
          search: '^HedgeDoc needs the secrets CMD_SESSION_SECRET, missing: CMD_SESSION_SECRET\.'

    - name: 'Run app_hedgedoc with the session secret in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_environment: "{{ app_hedgedoc__test_environment | combine({ 'CMD_SESSION_SECRET': 'molecule' }) }}"
        app_hedgedoc__test_invalid:
          message: 'the session secret in the environment'
          search: 'Secrets and their file variables must not be set in hedgedoc_environment: CMD_SESSION_SECRET\.$'

    - name: 'Run app_hedgedoc with DB_HOST without the database password (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_environment: "{{ app_hedgedoc__test_environment | combine({ 'DB_HOST': '10.89.0.20', 'DB_PORT': '5432', 'DB_USER': 'hedgedoc', 'DB_NAME': 'hedgedoc', 'CMD_DB_DIALECT': 'postgres' }) }}"
        hedgedoc_secrets: "{{ app_hedgedoc__test_secrets | rejectattr('target', 'eq', 'DB_PASS') | list }}"
        app_hedgedoc__test_invalid:
          message: 'DB_HOST without the database password'
          search: '^DB_HOST needs CMD_DB_DIALECT, DB_PORT, DB_USER, DB_NAME and the secret DB_PASS, missing: DB_PASS\.$'

    - name: 'Run app_hedgedoc with DB_HOST without CMD_DB_DIALECT (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_environment: "{{ app_hedgedoc__test_environment | combine({ 'DB_HOST': '10.89.0.20', 'DB_PORT': '5432', 'DB_USER': 'hedgedoc', 'DB_NAME': 'hedgedoc', 'CMD_DB_DIALECT': none }) }}"
        hedgedoc_secrets: "{{ app_hedgedoc__test_secrets + ([] if 'DB_PASS' in app_hedgedoc__test_secrets | map(attribute='target') else [ { 'name': 'hedgedoc_db_pass', 'data': 'molecule', 'target': 'DB_PASS' } ]) }}"
        app_hedgedoc__test_invalid:
          message: 'DB_HOST without CMD_DB_DIALECT'
          search: '^DB_HOST needs CMD_DB_DIALECT, DB_PORT, DB_USER, DB_NAME and the secret DB_PASS, missing: CMD_DB_DIALECT\.$'

    - name: 'Run app_hedgedoc with a YAML boolean in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_environment: "{{ app_hedgedoc__test_environment | combine({ 'UMASK': true }) }}"
        app_hedgedoc__test_invalid:
          message: 'a YAML boolean in the environment'
          search: '^These environment variables are YAML booleans, use strings: UMASK\.$'

    - name: 'Run app_hedgedoc with a line break in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_environment: "{{ app_hedgedoc__test_environment | combine({ 'UMASK': '022\nfoo' }) }}"
        app_hedgedoc__test_invalid:
          message: 'a line break in the environment'
          search: 'The environment variables must not contain line breaks: UMASK\.$'

    # The options of HedgeDoc are set with hedgedoc_config, a former CMD_* variable is unknown
    - name: 'Run app_hedgedoc with CMD_DOMAIN in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_environment: "{{ app_hedgedoc__test_environment | combine({ 'CMD_DOMAIN': 'pad.example.org' }) }}"
        app_hedgedoc__test_invalid:
          message: 'CMD_DOMAIN in the environment'
          search: '^Unknown environment variables: CMD_DOMAIN\.'

    - name: 'Run app_hedgedoc with an unknown secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_secrets: "{{ app_hedgedoc__test_secrets + [ { 'name': 'hedgedoc_unknown', 'data': 'molecule', 'target': 'CMD_UNKNOWN_SECRET' } ] }}"
        app_hedgedoc__test_invalid:
          message: 'an unknown secret'
          search: '^Unknown secrets: CMD_UNKNOWN_SECRET\.'

    - name: 'Run app_hedgedoc with a relative home directory (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        hedgedoc_home: 'relative/hedgedoc'
        app_hedgedoc__test_invalid:
          message: 'a relative home directory'
          search: '^hedgedoc_home has to be an absolute path\.$'

    # molecule-hedgedoc changes config.json and has to restart, molecule-hedgedoc-default runs again without a change
    - name: 'Read the start time of the service before the change'
      ansible.builtin.command:
        argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'hedgedoc' ]
      register: 'app_hedgedoc__test_started_before'
      changed_when: false

    - name: 'Set the changed role variables'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ app_hedgedoc__test_case.side_effect.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Run app_hedgedoc with the changed role variables'
      ansible.builtin.include_role:
        name: 'app_hedgedoc'

    - name: 'Read the start time of the service after the change'
      ansible.builtin.command:
        argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'hedgedoc' ]
      register: 'app_hedgedoc__test_started_after'
      changed_when: false

    - name: 'Assert the changed config.json and the restart of the service'
      ansible.builtin.assert:
        that:
          - (app_hedgedoc__config_result is changed) == app_hedgedoc__test_case.expect.restart
          - app_hedgedoc__quadlet_result is not changed
          - app_hedgedoc__secrets_result is not changed
          - (app_hedgedoc__test_started_after.stdout | int > app_hedgedoc__test_started_before.stdout | int) == app_hedgedoc__test_case.expect.restart
        fail_msg: >-
          config.json changed: {{ app_hedgedoc__config_result is changed }},
          quadlet changed: {{ app_hedgedoc__quadlet_result is changed }}, secrets changed: {{ app_hedgedoc__secrets_result is changed }},
          start before {{ app_hedgedoc__test_started_before.stdout }}, after {{ app_hedgedoc__test_started_after.stdout }}
