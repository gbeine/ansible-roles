---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/hedgedoc
#

app_hedgedoc__home: "{{ hedgedoc_home | mandatory }}"
app_hedgedoc__ip: "{{ hedgedoc_ip | mandatory }}"
app_hedgedoc__ipv6: "{{ hedgedoc_ipv6 }}"
app_hedgedoc__network: "{{ hedgedoc_network | mandatory }}"
app_hedgedoc__hostname: "{{ hedgedoc_hostname | mandatory }}"
app_hedgedoc__timezone: "{{ hedgedoc_timezone | mandatory }}"
app_hedgedoc__labels: "{{ hedgedoc_labels }}"

# The user and group of /config, the image runs HedgeDoc as this user
app_hedgedoc__uid: "{{ hedgedoc_uid | mandatory }}"
app_hedgedoc__gid: "{{ hedgedoc_gid | default(app_hedgedoc__uid) }}"

app_hedgedoc__version: "{{ hedgedoc_version | default('latest') }}"

app_hedgedoc__container: "{{ app_hedgedoc__podman_container_default | combine(hedgedoc_container | default({})) }}"

# The configuration of HedgeDoc (CMD_*) and the database of the image (DB_*), the role sets PUID, PGID and TZ
app_hedgedoc__environment: "{{ app_hedgedoc__environment_default | combine(hedgedoc_environment | default({})) }}"

# Secrets with name, data and target, the target CMD_SESSION_SECRET is mandatory, DB_PASS is needed with DB_HOST
app_hedgedoc__secrets: "{{ hedgedoc_secrets | default([]) }}"

app_hedgedoc__autoupdate_enabled: "{{ hedgedoc_autoupdate_enabled | default(false) }}"
app_hedgedoc__autoupdate_schedule: "{{ hedgedoc_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_hedgedoc__environment_default:
  PUID: "{{ app_hedgedoc__uid | string }}"
  PGID: "{{ app_hedgedoc__gid | string }}"
  TZ: "{{ app_hedgedoc__timezone }}"

app_hedgedoc__environment_required: [ 'CMD_DOMAIN' ]

# The image builds CMD_DB_URL from these variables if DB_HOST is set (svc-hedgedoc of linuxserver/docker-hedgedoc)
app_hedgedoc__environment_database: [ 'CMD_DB_DIALECT', 'DB_PORT', 'DB_USER', 'DB_NAME' ]
app_hedgedoc__database_dialects: [ 'postgres', 'mariadb', 'mysql' ]

app_hedgedoc__secrets_required: [ 'CMD_SESSION_SECRET' ]

# The image puts DB_PASS into the URL of the database without encoding
app_hedgedoc__database_password_pattern: '^[A-Za-z0-9._~-]+$'

# The secrets are mounted as files, the linuxserver images read the variable target from FILE__<target>
app_hedgedoc__secret_files:
  CMD_SESSION_SECRET: 'FILE__CMD_SESSION_SECRET'
  DB_PASS: 'FILE__DB_PASS'
  CMD_DB_URL: 'FILE__CMD_DB_URL'
  CMD_DB_PASSWORD: 'FILE__CMD_DB_PASSWORD'
  CMD_S3_SECRET_ACCESS_KEY: 'FILE__CMD_S3_SECRET_ACCESS_KEY'
  CMD_MINIO_SECRET_KEY: 'FILE__CMD_MINIO_SECRET_KEY'
  CMD_AZURE_CONNECTION_STRING: 'FILE__CMD_AZURE_CONNECTION_STRING'
  CMD_FACEBOOK_CLIENTSECRET: 'FILE__CMD_FACEBOOK_CLIENTSECRET'
  CMD_GITHUB_CLIENTSECRET: 'FILE__CMD_GITHUB_CLIENTSECRET'
  CMD_GITLAB_CLIENTSECRET: 'FILE__CMD_GITLAB_CLIENTSECRET'
  CMD_MATTERMOST_CLIENTSECRET: 'FILE__CMD_MATTERMOST_CLIENTSECRET'
  CMD_DROPBOX_CLIENTSECRET: 'FILE__CMD_DROPBOX_CLIENTSECRET'
  CMD_GOOGLE_CLIENTSECRET: 'FILE__CMD_GOOGLE_CLIENTSECRET'
  CMD_TWITTER_CONSUMERSECRET: 'FILE__CMD_TWITTER_CONSUMERSECRET'
  CMD_OAUTH2_CLIENT_SECRET: 'FILE__CMD_OAUTH2_CLIENT_SECRET'
  CMD_LDAP_BINDCREDENTIALS: 'FILE__CMD_LDAP_BINDCREDENTIALS'

app_hedgedoc__secret_variables: "{{ app_hedgedoc__secret_files.keys() | list }}"
app_hedgedoc__secrets_dir: '/run/secrets'

# The data of a secret by its target
app_hedgedoc__secret_data: >-
  {%- set data = {} -%}
  {%- if app_hedgedoc__secrets is sequence and app_hedgedoc__secrets is not string and app_hedgedoc__secrets is not mapping -%}
  {%-   for secret in app_hedgedoc__secrets if secret is mapping and secret.target is defined and secret.data is defined -%}
  {%-     set _ = data.update({ secret.target: secret.data }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ data }}

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
app_hedgedoc__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if app_hedgedoc__secrets is sequence and app_hedgedoc__secrets is not string and app_hedgedoc__secrets is not mapping -%}
  {%-   for secret in app_hedgedoc__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in app_hedgedoc__secret_files -%}
  {%-     set _ = environment.update({ app_hedgedoc__secret_files[secret.target]: app_hedgedoc__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The podman secrets of hedgedoc_secrets, entries without name are left out, the validation of the secrets reports them
app_hedgedoc__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- if app_hedgedoc__secrets is sequence and app_hedgedoc__secrets is not string and app_hedgedoc__secrets is not mapping -%}
  {%-   for secret in app_hedgedoc__secrets if secret is mapping and secret.name is defined -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ app_hedgedoc__secrets_dir ~ '/' ~ secret.name) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ secrets }}

# The environment of the container, HedgeDoc only reads true and false as booleans, so booleans are written in lower case
app_hedgedoc__environment_container: >-
  {%- set environment = {} -%}
  {%- for key, value in (app_hedgedoc__environment | combine(app_hedgedoc__environment_secrets_files)).items() -%}
  {%-   set _ = environment.update({ key: (value | string | lower) if value is boolean else value }) -%}
  {%- endfor -%}
  {{ environment }}

# The port of HedgeDoc in the container
app_hedgedoc__port: "{{ app_hedgedoc__container.environment.CMD_PORT | default(3000) }}"

app_hedgedoc__podman_name: 'hedgedoc'
app_hedgedoc__podman_image: 'lscr.io/linuxserver/hedgedoc'

app_hedgedoc__podman_container_default:
  name: "{{ app_hedgedoc__podman_name }}"
  hostname: "{{ app_hedgedoc__hostname }}"
  image: "{{ app_hedgedoc__podman_image }}:{{ app_hedgedoc__version }}"
  ip: "{{ app_hedgedoc__ip }}"
  ipv6: "{{ app_hedgedoc__ipv6 | default(omit) }}"
  network: "{{ app_hedgedoc__network }}"
  timezone: "{{ app_hedgedoc__timezone }}"
  labels: "{{ app_hedgedoc__labels | default(omit) }}"
  # Set with hedgedoc_environment and hedgedoc_secrets, merged over the default
  environment: "{{ app_hedgedoc__environment_container }}"
  volumes:
    - "{{ app_hedgedoc__home }}:/config"
  secrets: "{{ app_hedgedoc__podman_secrets if app_hedgedoc__podman_secrets | length > 0 else omit }}"

# The variables HedgeDoc reads as booleans (toBooleanConfig of lib/config/environment.js of HedgeDoc 1.12.0)
app_hedgedoc__environment_booleans:
  - 'CMD_ALLOW_ANONYMOUS'
  - 'CMD_ALLOW_ANONYMOUS_EDITS'
  - 'CMD_ALLOW_EMAIL_REGISTER'
  - 'CMD_ALLOW_FREEURL'
  - 'CMD_ALLOW_GRAVATAR'
  - 'CMD_CSP_ADD_DISQUS'
  - 'CMD_CSP_ADD_GOOGLE_ANALYTICS'
  - 'CMD_CSP_ALLOW_FRAMING'
  - 'CMD_CSP_ALLOW_PDF_EMBED'
  - 'CMD_CSP_ENABLE'
  - 'CMD_DISABLE_NOTE_CREATION'
  - 'CMD_EMAIL'
  - 'CMD_ENABLE_STATS_API'
  - 'CMD_EXTERNAL_LINK_WARNING'
  - 'CMD_HSTS_ENABLE'
  - 'CMD_HSTS_INCLUDE_SUBDOMAINS'
  - 'CMD_HSTS_PRELOAD'
  - 'CMD_MINIO_SECURE'
  - 'CMD_OAUTH2_PKCE'
  - 'CMD_OPENID'
  - 'CMD_PROTOCOL_USESSL'
  - 'CMD_RATE_LIMIT_USING_CLOUDFLARE'
  - 'CMD_REQUIRE_FREEURL_AUTHENTICATION'
  - 'CMD_SAML_DISABLEREQUESTEDAUTHNCONTEXT'
  - 'CMD_SAML_WANT_ASSERTIONS_SIGNED'
  - 'CMD_SAML_WANT_AUTHN_RESPONSE_SIGNED'
  - 'CMD_URL_ADDPORT'
  - 'CMD_USESSL'

