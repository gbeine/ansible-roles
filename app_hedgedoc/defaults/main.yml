---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/hedgedoc
#

# Contains config.json, the uploads and the sqlite database, mounted as /config
app_hedgedoc__home: "{{ hedgedoc_home | mandatory }}"
app_hedgedoc__ip: "{{ hedgedoc_ip | mandatory }}"
app_hedgedoc__ipv6: "{{ hedgedoc_ipv6 }}"
app_hedgedoc__network: "{{ hedgedoc_network | mandatory }}"
app_hedgedoc__hostname: "{{ hedgedoc_hostname | mandatory }}"
app_hedgedoc__timezone: "{{ hedgedoc_timezone | mandatory }}"
app_hedgedoc__labels: "{{ hedgedoc_labels }}"

# The user and group of /config, the image runs HedgeDoc as this user
app_hedgedoc__uid: "{{ hedgedoc_uid | mandatory }}"
app_hedgedoc__gid: "{{ hedgedoc_gid | default(app_hedgedoc__uid) }}"

app_hedgedoc__version: "{{ hedgedoc_version | default('latest') }}"

# The section production of config.json, the options of HedgeDoc in camelCase, domain is mandatory
app_hedgedoc__config: "{{ hedgedoc_config | default({}) }}"

# The variables of the image (PUID, PGID, TZ, UMASK) and the database (DB_*, CMD_DB_DIALECT), the role sets PUID and PGID
app_hedgedoc__environment: "{{ app_hedgedoc__environment_default | combine(hedgedoc_environment | default({})) }}"

# Secrets with name, data and target, the target CMD_SESSION_SECRET is mandatory, DB_PASS is needed with DB_HOST
app_hedgedoc__secrets: "{{ hedgedoc_secrets | default([]) }}"

app_hedgedoc__container: "{{ app_hedgedoc__podman_container_default | combine(hedgedoc_container | default({})) }}"

app_hedgedoc__autoupdate_enabled: "{{ hedgedoc_autoupdate_enabled | default(false) }}"
app_hedgedoc__autoupdate_schedule: "{{ hedgedoc_autoupdate_schedule }}"

#
# Defaults - do not change
#

app_hedgedoc__podman_name: 'hedgedoc'
app_hedgedoc__podman_image: 'lscr.io/linuxserver/hedgedoc'
app_hedgedoc__podman_tag: "{{ app_hedgedoc__version }}"

app_hedgedoc__podman_home: "{{ app_hedgedoc__home }}"

# The image sets CMD_CONFIG_FILE to /config/config.json and NODE_ENV to production
app_hedgedoc__config_file: "{{ app_hedgedoc__podman_home }}/config.json"
app_hedgedoc__config_environment: 'production'

app_hedgedoc__config_required: [ 'domain' ]

# The port of HedgeDoc in the container
app_hedgedoc__port: "{{ app_hedgedoc__config.port | default(3000) }}"

# Generated from lib/config/default.js and lib/config/environment.js of HedgeDoc 1.12.0:
# the options of the configuration, the content of the nested options (e.g. csp, oauth2, ldap) is not checked
app_hedgedoc__config_allowed:
  - 'allowAnonymous'
  - 'allowAnonymousEdits'
  - 'allowEmailRegister'
  - 'allowFreeURL'
  - 'allowGravatar'
  - 'azure'
  - 'cookiePolicy'
  - 'csp'
  - 'db'
  - 'dbURL'
  - 'defaultNotePath'
  - 'defaultPermission'
  - 'dhParamPath'
  - 'disableNoteCreation'
  - 'docsPath'
  - 'documentMaxLength'
  - 'domain'
  - 'dropbox'
  - 'email'
  - 'enableStatsApi'
  - 'enableUploads'
  - 'externalLinkWarning'
  - 'externalLinkWhitelist'
  - 'facebook'
  - 'forbiddenNoteIDs'
  - 'github'
  - 'gitlab'
  - 'google'
  - 'heartbeatInterval'
  - 'heartbeatTimeout'
  - 'host'
  - 'hsts'
  - 'imageUploadType'
  - 'imgur'
  - 'ldap'
  - 'linkifyHeaderStyle'
  - 'loglevel'
  - 'lutim'
  - 'mattermost'
  - 'minio'
  - 'oauth2'
  - 'openID'
  - 'path'
  - 'port'
  - 'protocolUseSSL'
  - 'rateLimitNewNotes'
  - 'rateLimitUser'
  - 'rateLimitUsingCloudflare'
  - 'requireFreeURLAuthentication'
  - 's3'
  - 's3bucket'
  - 's3folder'
  - 's3publicFiles'
  - 'saml'
  - 'sessionLife'
  - 'sessionName'
  - 'sessionSecret'
  - 'sessionSecretLen'
  - 'sourceURL'
  - 'sslCAPath'
  - 'sslCertPath'
  - 'sslKeyPath'
  - 'staticCacheTime'
  - 'tmpPath'
  - 'tooBusyLag'
  - 'twitter'
  - 'uploadsPath'
  - 'urlAddPort'
  - 'urlPath'
  - 'useSSL'
  - 'viewPath'

# Generated from the options read with toBooleanConfig in lib/config/environment.js of HedgeDoc 1.12.0
app_hedgedoc__config_booleans:
  - 'urlAddPort'
  - 'useSSL'
  - 'hsts.enable'
  - 'hsts.includeSubdomains'
  - 'hsts.preload'
  - 'csp.enable'
  - 'csp.addDisqus'
  - 'csp.addGoogleAnalytics'
  - 'csp.allowFraming'
  - 'csp.allowPDFEmbed'
  - 'rateLimitUsingCloudflare'
  - 'protocolUseSSL'
  - 'allowAnonymous'
  - 'allowAnonymousEdits'
  - 'allowFreeURL'
  - 'requireFreeURLAuthentication'
  - 'disableNoteCreation'
  - 'minio.secure'
  - 'oauth2.pkce'
  - 'saml.disableRequestedAuthnContext'
  - 'saml.wantAssertionsSigned'
  - 'saml.wantAuthnResponseSigned'
  - 'email'
  - 'allowEmailRegister'
  - 'allowGravatar'
  - 'openID'
  - 'enableStatsApi'
  - 'externalLinkWarning'

# The image sets the database with the environment (svc-hedgedoc of linuxserver/docker-hedgedoc),
# it overrides db and dbURL of config.json
app_hedgedoc__config_database: [ 'db', 'dbURL' ]

# The options carrying secrets by the target of the secret, generated from lib/config/environment.js of HedgeDoc 1.12.0,
# DB_PASS is read by the image only
app_hedgedoc__secret_paths:
  CMD_SESSION_SECRET: 'sessionSecret'
  CMD_DB_URL: 'dbURL'
  CMD_DB_PASSWORD: 'db.password'
  CMD_S3_SECRET_ACCESS_KEY: 's3.secretAccessKey'
  CMD_MINIO_SECRET_KEY: 'minio.secretKey'
  CMD_AZURE_CONNECTION_STRING: 'azure.connectionString'
  CMD_FACEBOOK_CLIENTSECRET: 'facebook.clientSecret'
  CMD_GITHUB_CLIENTSECRET: 'github.clientSecret'
  CMD_GITLAB_CLIENTSECRET: 'gitlab.clientSecret'
  CMD_MATTERMOST_CLIENTSECRET: 'mattermost.clientSecret'
  CMD_DROPBOX_CLIENTSECRET: 'dropbox.clientSecret'
  CMD_GOOGLE_CLIENTSECRET: 'google.clientSecret'
  CMD_TWITTER_CONSUMERSECRET: 'twitter.consumerSecret'
  CMD_OAUTH2_CLIENT_SECRET: 'oauth2.clientSecret'
  CMD_LDAP_BINDCREDENTIALS: 'ldap.bindCredentials'

# Options set by the role, the database with the environment and the secrets with hedgedoc_secrets
app_hedgedoc__config_role_paths: "{{ (app_hedgedoc__config_database + app_hedgedoc__secret_paths.values() | list) | unique }}"

app_hedgedoc__environment_default:
  PUID: "{{ app_hedgedoc__uid | string }}"
  PGID: "{{ app_hedgedoc__gid | string }}"

# The image builds CMD_DB_URL from these variables if DB_HOST is set (svc-hedgedoc of linuxserver/docker-hedgedoc)
app_hedgedoc__environment_database: [ 'CMD_DB_DIALECT', 'DB_PORT', 'DB_USER', 'DB_NAME' ]
app_hedgedoc__database_dialects: [ 'postgres', 'mariadb', 'mysql' ]

# The image puts DB_PASS into the URL of the database without encoding
app_hedgedoc__database_password_pattern: '^[A-Za-z0-9._~-]+$'

app_hedgedoc__secrets_required: [ 'CMD_SESSION_SECRET' ]

# The secrets are mounted as files, the linuxserver images read the variable target from FILE__<target>
app_hedgedoc__secret_files:
  CMD_SESSION_SECRET: 'FILE__CMD_SESSION_SECRET'
  DB_PASS: 'FILE__DB_PASS'
  CMD_DB_URL: 'FILE__CMD_DB_URL'
  CMD_DB_PASSWORD: 'FILE__CMD_DB_PASSWORD'
  CMD_S3_SECRET_ACCESS_KEY: 'FILE__CMD_S3_SECRET_ACCESS_KEY'
  CMD_MINIO_SECRET_KEY: 'FILE__CMD_MINIO_SECRET_KEY'
  CMD_AZURE_CONNECTION_STRING: 'FILE__CMD_AZURE_CONNECTION_STRING'
  CMD_FACEBOOK_CLIENTSECRET: 'FILE__CMD_FACEBOOK_CLIENTSECRET'
  CMD_GITHUB_CLIENTSECRET: 'FILE__CMD_GITHUB_CLIENTSECRET'
  CMD_GITLAB_CLIENTSECRET: 'FILE__CMD_GITLAB_CLIENTSECRET'
  CMD_MATTERMOST_CLIENTSECRET: 'FILE__CMD_MATTERMOST_CLIENTSECRET'
  CMD_DROPBOX_CLIENTSECRET: 'FILE__CMD_DROPBOX_CLIENTSECRET'
  CMD_GOOGLE_CLIENTSECRET: 'FILE__CMD_GOOGLE_CLIENTSECRET'
  CMD_TWITTER_CONSUMERSECRET: 'FILE__CMD_TWITTER_CONSUMERSECRET'
  CMD_OAUTH2_CLIENT_SECRET: 'FILE__CMD_OAUTH2_CLIENT_SECRET'
  CMD_LDAP_BINDCREDENTIALS: 'FILE__CMD_LDAP_BINDCREDENTIALS'

app_hedgedoc__secret_variables: "{{ app_hedgedoc__secret_files.keys() | list }}"
app_hedgedoc__secrets_dir: '/run/secrets'

# The variables of the linuxserver image (readme-vars.yml and svc-hedgedoc of linuxserver/docker-hedgedoc and the base image),
# the options of HedgeDoc are set in hedgedoc_config
app_hedgedoc__environment_allowed:
  - 'PUID'
  - 'PGID'
  - 'TZ'
  - 'UMASK'
  - 'DB_HOST'
  - 'DB_PORT'
  - 'DB_USER'
  - 'DB_NAME'
  - 'CMD_DB_DIALECT'
  # The file variables of the secrets, set by the role
  - 'FILE__CMD_SESSION_SECRET'
  - 'FILE__DB_PASS'
  - 'FILE__CMD_DB_URL'
  - 'FILE__CMD_DB_PASSWORD'
  - 'FILE__CMD_S3_SECRET_ACCESS_KEY'
  - 'FILE__CMD_MINIO_SECRET_KEY'
  - 'FILE__CMD_AZURE_CONNECTION_STRING'
  - 'FILE__CMD_FACEBOOK_CLIENTSECRET'
  - 'FILE__CMD_GITHUB_CLIENTSECRET'
  - 'FILE__CMD_GITLAB_CLIENTSECRET'
  - 'FILE__CMD_MATTERMOST_CLIENTSECRET'
  - 'FILE__CMD_DROPBOX_CLIENTSECRET'
  - 'FILE__CMD_GOOGLE_CLIENTSECRET'
  - 'FILE__CMD_TWITTER_CONSUMERSECRET'
  - 'FILE__CMD_OAUTH2_CLIENT_SECRET'
  - 'FILE__CMD_LDAP_BINDCREDENTIALS'

# The data of a secret by its target
app_hedgedoc__secret_data: >-
  {%- set data = {} -%}
  {%- if app_hedgedoc__secrets is sequence and app_hedgedoc__secrets is not string and app_hedgedoc__secrets is not mapping -%}
  {%-   for secret in app_hedgedoc__secrets if secret is mapping and secret.target is defined and secret.data is defined -%}
  {%-     set _ = data.update({ secret.target: secret.data }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ data }}

# The file variables of the secrets, secrets with an unknown target are left out, the validation reports them
app_hedgedoc__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if app_hedgedoc__secrets is sequence and app_hedgedoc__secrets is not string and app_hedgedoc__secrets is not mapping -%}
  {%-   for secret in app_hedgedoc__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in app_hedgedoc__secret_files -%}
  {%-     set _ = environment.update({ app_hedgedoc__secret_files[secret.target]: app_hedgedoc__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The podman secrets of hedgedoc_secrets, entries without name are left out, the validation of the secrets reports them
app_hedgedoc__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- if app_hedgedoc__secrets is sequence and app_hedgedoc__secrets is not string and app_hedgedoc__secrets is not mapping -%}
  {%-   for secret in app_hedgedoc__secrets if secret is mapping and secret.name is defined -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ app_hedgedoc__secrets_dir ~ '/' ~ secret.name) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ secrets }}

app_hedgedoc__podman_container_default:
  name: "{{ app_hedgedoc__podman_name }}"
  hostname: "{{ app_hedgedoc__hostname }}"
  image: "{{ app_hedgedoc__podman_image }}:{{ app_hedgedoc__podman_tag }}"
  ip: "{{ app_hedgedoc__ip }}"
  ipv6: "{{ app_hedgedoc__ipv6 | default(omit) }}"
  network: "{{ app_hedgedoc__network }}"
  timezone: "{{ app_hedgedoc__timezone }}"
  labels: "{{ app_hedgedoc__labels | default(omit) }}"
  environment: "{{ app_hedgedoc__environment | combine(app_hedgedoc__environment_secrets_files) }}"
  # hedgedoc_container.volumes replaces the list completely
  volumes:
    - "{{ app_hedgedoc__podman_home }}:/config"
  secrets: "{{ app_hedgedoc__podman_secrets if app_hedgedoc__podman_secrets | length > 0 else omit }}"
