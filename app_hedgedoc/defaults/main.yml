---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/hedgedoc
#

app_hedgedoc__home: "{{ hedgedoc_home | mandatory }}"
app_hedgedoc__ip: "{{ hedgedoc_ip | mandatory }}"
app_hedgedoc__ipv6: "{{ hedgedoc_ipv6 }}"
app_hedgedoc__network: "{{ hedgedoc_network | mandatory }}"
app_hedgedoc__hostname: "{{ hedgedoc_hostname | mandatory }}"
app_hedgedoc__timezone: "{{ hedgedoc_timezone | mandatory }}"
app_hedgedoc__labels: "{{ hedgedoc_labels | default({}) }}"

app_hedgedoc__version: "{{ hedgedoc_version | default('latest') }}"

app_hedgedoc__container: "{{ app_hedgedoc__podman_container_default | combine(hedgedoc_container | default({})) }}"

app_hedgedoc__db_host: "{{ hedgedoc_db_host | mandatory }}"
app_hedgedoc__db_port: "{{ hedgedoc_db_port | default(5432) }}"
app_hedgedoc__db_user: "{{ hedgedoc_db_user | default('hedgedoc') }}"
app_hedgedoc__db_pass: "{{ hedgedoc_db_pass | mandatory }}"
app_hedgedoc__db_dialect: "{{ hedgedoc_db_dialect | default('postgres') }}"
app_hedgedoc__db_name: "{{ hedgedoc_db_name | default('hedgedoc') }}"

app_hedgedoc__domain: "{{ hedgedoc_domain | mandatory }}"
app_hedgedoc__port: "{{ hedgedoc_port | default(3000) }}"
app_hedgedoc__protocol_usessl: "{{ hedgedoc_protocol_usessl | default(false) }}"
app_hedgedoc__url_addport: "{{ hedgedoc_url_addport | default(false) }}"
app_hedgedoc__allow_origin: "{{ hedgedoc_allow_origin | default('localhost') }}"

app_hedgedoc__hsts_enable: "{{ hedgedoc_hsts_enable | default(true) }}"
app_hedgedoc__hsts_include_subdomains: "{{ hedgedoc_hsts_include_subdomains | default(true) }}"
app_hedgedoc__hsts_max_age: "{{ hedgedoc_hsts_max_age | default(31536000) }}"
app_hedgedoc__hsts_preload: "{{ hedgedoc_hsts_preload | default(false) }}"
app_hedgedoc__csp_enable: "{{ hedgedoc_csp_enable | default(true) }}"
app_hedgedoc__csp_add_disqus: "{{ hedgedoc_csp_add_disqus | default(false) }}"
app_hedgedoc__csp_add_google_analytics: "{{ hedgedoc_csp_add_google_analytics | default(false) }}"
app_hedgedoc__csp_report_uri: "{{ hedgedoc_csp_report_uri | default('') }}"
app_hedgedoc__csp_allow_framing: "{{ hedgedoc_csp_allow_framing | default(true) }}"
app_hedgedoc__csp_allow_pdf_embed: "{{ hedgedoc_csp_allow_pdf_embed | default(true) }}"
app_hedgedoc__cookie_policy: "{{ hedgedoc_cookie_policy | default('lax') }}"
app_hedgedoc__rate_limit_new_notes: "{{ hedgedoc_rate_limit_new_notes | default(20) }}"

app_hedgedoc__allow_gravatar: "{{ hedgedoc_allow_gravatar | default(true) }}"

app_hedgedoc__allow_anonymous: "{{ hedgedoc_allow_anonymous | default(true) }}"
app_hedgedoc__allow_anonymous_edits: "{{ hedgedoc_allow_anonymous_edits | default(false) }}"
app_hedgedoc__allow_free_url: "{{ hedgedoc_allow_free_url | default(false) }}"
app_hedgedoc__require_free_url_authentication: "{{ hedgedoc_require_free_url_authentication | default(false) }}"
app_hedgedoc__disable_note_creation: "{{ hedgedoc_disable_note_creation | default(false) }}"
app_hedgedoc__default_permission: "{{ hedgedoc_default_permission | default('editable') }}"
app_hedgedoc__enable_uploads: "{{ hedgedoc_enable_uploads | default('all') }}"
app_hedgedoc__session_life: "{{ hedgedoc_session_life | default(1209600000) }}"
app_hedgedoc__session_secret: "{{ hedgedoc_session_secret | mandatory }}"

app_hedgedoc__email: "{{ hedgedoc_email | default(false) }}"
app_hedgedoc__allow_email_register: "{{ hedgedoc_allow_email_register | default(false) }}"

app_hedgedoc__oauth2_user_profile_url: "{{ hedgedoc_oauth2_user_profile_url | mandatory }}"
app_hedgedoc__oauth2_user_profile_username_attr: "{{ hedgedoc_oauth2_user_profile_username_attr | default('preferred_username') }}"
app_hedgedoc__oauth2_user_profile_display_name_attr: "{{ hedgedoc_oauth2_user_profile_display_name_attr | default('name') }}"
app_hedgedoc__oauth2_user_profile_email_attr: "{{ hedgedoc_oauth2_user_profile_email_attr | default('email') }}"
app_hedgedoc__oauth2_user_profile_id_attr: "{{ hedgedoc_oauth2_user_profile_id_attr | default('user_uuid') }}"
app_hedgedoc__oauth2_token_url: "{{ hedgedoc_oauth2_token_url | mandatory }}"
app_hedgedoc__oauth2_authorization_url: "{{ hedgedoc_oauth2_authorization_url | mandatory }}"
app_hedgedoc__oauth2_client_id: "{{ hedgedoc_oauth2_client_id | mandatory }}"
app_hedgedoc__oauth2_client_secret: "{{ hedgedoc_oauth2_client_secret | mandatory }}"
app_hedgedoc__oauth2_providername: "{{ hedgedoc_oauth2_providername | mandatory }}"
app_hedgedoc__oauth2_scope: "{{ hedgedoc_oauth2_scope | default('openid email profile') }}"
app_hedgedoc__oauth2_pkce: "{{ hedgedoc_oauth2_pkce | default(false) }}"

app_hedgedoc__autoupdate_enabled: "{{ hedgedoc_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

app_hedgedoc__uid: "{{ hedgedoc_uid | mandatory }}"
app_hedgedoc__gid: "{{ hedgedoc_gid | default(app_hedgedoc__uid) }}"

app_hedgedoc__podman_name: 'hedgedoc'
app_hedgedoc__podman_image: 'lscr.io/linuxserver/hedgedoc'
app_hedgedoc__podman_tag: "{{ app_hedgedoc__version }}"

app_hedgedoc__podman_home: "{{ app_hedgedoc__home }}"
app_hedgedoc__podman_uploads_dir: "{{ app_hedgedoc__podman_home }}/uploads"

app_hedgedoc__podman_container_default:
  name: "{{ app_hedgedoc__podman_name }}"
  hostname: "{{ app_hedgedoc__hostname }}"
  image: "{{ app_hedgedoc__podman_image }}:{{ app_hedgedoc__podman_tag }}"
  ip: "{{ app_hedgedoc__ip }}"
  ipv6: "{{ app_hedgedoc__ipv6 | default(omit) }}"
  network: "{{ app_hedgedoc__network }}"
  timezone: "{{ app_hedgedoc__timezone }}"
  environment: >-
    {{
      app_hedgedoc__environment_base
      | combine(
        app_hedgedoc__environment_optional
        | dict2items
        | selectattr('value', 'ne', '')
        | items2dict
      )
    }}
  labels: "{{ app_hedgedoc__labels }}"
  secrets: >-
    {{
      [
        "hedgedoc_db_pass,type=env,target=DB_PASS",
        "hedgedoc_session_secret,type=env,target=CMD_SESSION_SECRET"
      ] + [
        "hedgedoc_oauth2_client_secret,type=env,target=CMD_OAUTH2_CLIENT_SECRET"
      ] if app_hedgedoc__oauth2_user_profile_url is defined else [] 
    }}
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_hedgedoc__podman_home }}:/config"

app_hedgedoc__environment_base:
  PUID: "{{ app_hedgedoc__uid }}"
  PGID: "{{ app_hedgedoc__gid }}"
  TZ: "{{ app_hedgedoc__timezone }}"
  DB_HOST: "{{ app_hedgedoc__db_host }}"
  DB_PORT: "{{ app_hedgedoc__db_port }}"
  DB_USER: "{{ app_hedgedoc__db_user }}"
  DB_NAME: "{{ app_hedgedoc__db_name }}"
  CMD_DOMAIN: "{{ app_hedgedoc__domain }}"
  CMD_PROTOCOL_USESSL: "{{ app_hedgedoc__protocol_usessl | lower }}"
  CMD_URL_ADDPORT: "{{ app_hedgedoc__url_addport | lower }}"
  CMD_PORT: "{{ app_hedgedoc__port }}"
  CMD_DB_DIALECT: "{{ app_hedgedoc__db_dialect }}"
  CMD_ALLOW_ORIGIN: "{{ app_hedgedoc__allow_origin }}"
  CMD_COOKIE_POLICY: "{{ app_hedgedoc__cookie_policy }}"
  CMD_RATE_LIMIT_NEW_NOTES: "{{ app_hedgedoc__rate_limit_new_notes }}"
  CMD_ALLOW_GRAVATAR: "{{ app_hedgedoc__allow_gravatar | lower }}"
  CMD_ALLOW_ANONYMOUS: "{{ app_hedgedoc__allow_anonymous | lower }}"
  CMD_ALLOW_ANONYMOUS_EDITS: "{{ app_hedgedoc__allow_anonymous_edits | lower }}"
  CMD_ALLOW_FREEURL: "{{ app_hedgedoc__allow_free_url | lower }}"
  CMD_REQUIRE_FREEURL_AUTHENTICATION: "{{ app_hedgedoc__require_free_url_authentication | lower }}"
  CMD_DISABLE_NOTE_CREATION: "{{ app_hedgedoc__disable_note_creation | lower }}"
  CMD_DEFAULT_PERMISSION: "{{ app_hedgedoc__default_permission }}"
  CMD_ENABLE_UPLOADS: "{{ app_hedgedoc__enable_uploads }}"
  CMD_SESSION_LIFE: "{{ app_hedgedoc__session_life }}"
  CMD_EMAIL: "{{ app_hedgedoc__email | lower }}"
  CMD_ALLOW_EMAIL_REGISTER: "{{ app_hedgedoc__allow_email_register | lower }}"

app_hedgedoc__environment_optional:
  CMD_HSTS_ENABLE: "{{ app_hedgedoc__hsts_enable | lower }}"
  CMD_HSTS_INCLUDE_SUBDOMAINS: "{{ app_hedgedoc__hsts_include_subdomains | lower if app_hedgedoc__hsts_enable else '' }}"
  CMD_HSTS_MAX_AGE: "{{ app_hedgedoc__hsts_max_age if app_hedgedoc__hsts_enable else '' }}"
  CMD_HSTS_PRELOAD: "{{ app_hedgedoc__hsts_preload | lower if app_hedgedoc__hsts_enable else ''  }}"
  CMD_CSP_ENABLE: "{{ app_hedgedoc__csp_enable | lower }}"
  CMD_CSP_ADD_DISQUS: "{{ app_hedgedoc__csp_add_disqus | lower if app_hedgedoc__csp_enable else '' }}"
  CMD_CSP_ADD_GOOGLE_ANALYTICS: "{{ app_hedgedoc__csp_add_google_analytics | lower if app_hedgedoc__csp_enable else '' }}"
  CMD_CSP_REPORTURI: "{{ app_hedgedoc__csp_report_uri if app_hedgedoc__csp_enable else '' }}"
  CMD_CSP_ALLOW_FRAMING: "{{ app_hedgedoc__csp_allow_framing | lower if app_hedgedoc__csp_enable else '' }}"
  CMD_CSP_ALLOW_PDF_EMBED: "{{ app_hedgedoc__csp_allow_pdf_embed | lower if app_hedgedoc__csp_enable else '' }}"
  CMD_OAUTH2_USER_PROFILE_URL: "{{ app_hedgedoc__oauth2_user_profile_url if app_hedgedoc__oauth2_user_profile_url is defined else '' }}"
  CMD_OAUTH2_USER_PROFILE_USERNAME_ATTR: "{{ app_hedgedoc__oauth2_user_profile_username_attr if app_hedgedoc__oauth2_user_profile_url is defined else '' }}"
  CMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR: "{{ app_hedgedoc__oauth2_user_profile_display_name_attr if app_hedgedoc__oauth2_user_profile_url is defined else '' }}"
  CMD_OAUTH2_USER_PROFILE_EMAIL_ATTR: "{{ app_hedgedoc__oauth2_user_profile_email_attr if app_hedgedoc__oauth2_user_profile_url is defined else '' }}"
  CMD_OAUTH2_USER_PROFILE_ID_ATTR: "{{ app_hedgedoc__oauth2_user_profile_id_attr if app_hedgedoc__oauth2_user_profile_url is defined else '' }}"
  CMD_OAUTH2_TOKEN_URL: "{{ app_hedgedoc__oauth2_token_url if app_hedgedoc__oauth2_user_profile_url is defined else '' }}"
  CMD_OAUTH2_AUTHORIZATION_URL: "{{ app_hedgedoc__oauth2_authorization_url if app_hedgedoc__oauth2_user_profile_url is defined else '' }}"
  CMD_OAUTH2_CLIENT_ID: "{{ app_hedgedoc__oauth2_client_id if app_hedgedoc__oauth2_user_profile_url is defined else '' }}"
  CMD_OAUTH2_PROVIDERNAME: "{{ app_hedgedoc__oauth2_providername if app_hedgedoc__oauth2_user_profile_url is defined else '' }}"
  CMD_OAUTH2_SCOPE: "{{ app_hedgedoc__oauth2_scope if app_hedgedoc__oauth2_user_profile_url is defined else '' }}"
  CMD_OAUTH2_PKCE: "{{ app_hedgedoc__oauth2_pkce | lower if app_hedgedoc__oauth2_user_profile_url is defined else '' }}"

app_hedgedoc__environment:

app_hedgedoc__secrets_base:
  hedgedoc_db_pass: "{{ app_hedgedoc__db_pass }}"
  hedgedoc_session_secret: "{{ app_hedgedoc__session_secret }}"

app_hedgedoc__secrets_optional:
  hedgedoc_oauth2_client_secret: "{{ app_hedgedoc__oauth2_client_secret }}"

app_hedgedoc__secrets: >-
  {{
    app_hedgedoc__secrets_base
    | combine(
      app_hedgedoc__secrets_optional
      | dict2items
      | selectattr('value', 'ne', '')
      | items2dict
    )
  }}