---
# Runs pki_stepca with the invalid role variables passed as include parameters,
# the role has to fail before the quadlet unit or the secrets change.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run pki_stepca with invalid variables (expect ERROR): {{ pki_stepca__test_invalid.message }}"
  block:

    - name: 'Run pki_stepca, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'pki_stepca'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ pki_stepca__test_invalid.message }}"

  rescue:

    - name: 'Read the checksums of the checked files after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ pki_stepca__test_checked_files }}"
      register: 'pki_stepca__test_md5_after'

    - name: 'Assert the run failed before the checked files changed'
      ansible.builtin.assert:
        that:
          - pki_stepca__test_failure is search(pki_stepca__test_invalid.search, multiline=true)
          - pki_stepca__test_before | select('equalto', '') | list | length == 0
          - pki_stepca__test_after == pki_stepca__test_before
        fail_msg: >-
          Failure: {{ pki_stepca__test_failure }}
          Checksums before: {{ pki_stepca__test_before | join(', ') }},
          after: {{ pki_stepca__test_after | join(', ') }}.
      vars:
        # Double quotes, so \n is a line break for the anchors of the searches
        pki_stepca__test_failure: "{{ [ ansible_failed_result.msg | default(''), ansible_failed_result.stderr | default('') ] | join('\n') }}"
        pki_stepca__test_before: "{{ pki_stepca__test_md5_before.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
        pki_stepca__test_after: "{{ pki_stepca__test_md5_after.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
