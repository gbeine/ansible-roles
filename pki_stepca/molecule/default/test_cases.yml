---
# Network created by container_podman in prepare.yml
pki_stepca__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

pki_stepca__test_image: 'docker.io/smallstep/step-ca:latest'
pki_stepca__test_quadlet_path: '/etc/containers/systemd/stepca.container'
pki_stepca__test_home: '/opt/stepca'

pki_stepca__test_cases:

  # Only the mandatory variables, remote management, SSH and ACME by default
  - name: 'molecule-stepca-default'
    role_vars:
      stepca_home: '/opt/stepca'
      stepca_ip: '10.89.0.130'
      stepca_network: 'podman-molecule'
      stepca_hostname: 'stepca-default'
      stepca_timezone: 'Europe/Berlin'
      stepca_init_environment:
        DOCKER_STEPCA_INIT_NAME: 'Molecule Default CA'
        DOCKER_STEPCA_INIT_DNS_NAMES: [ 'stepca-default.molecule.test', 'localhost' ]
      stepca_secrets:
        - name: 'stepca_init_password'
          data: 'molecule-stepca-default-password'
          target: 'DOCKER_STEPCA_INIT_PASSWORD'
    expect:
      ip: '10.89.0.130'
      ip6: ~
      password: 'molecule-stepca-default-password'
      acme: true
      quadlet:
        - 'Volume=/opt/stepca:/home/step:Z'
      env:
        - 'TZ=Europe/Berlin'
      config: {}
      # The durations a certificate may be issued with and those it may not
      durations_allowed: [ '24h' ]
      durations_refused: [ '100h' ]

  # IPv6, labels, without SSH, standalone and the configuration of the logger and of the durations
  - name: 'molecule-stepca'
    role_vars:
      stepca_home: '/opt/stepca'
      stepca_ip: '10.89.0.131'
      stepca_ipv6: 'fd00:89::131'
      stepca_network: 'podman-molecule'
      stepca_hostname: 'stepca-molecule'
      stepca_timezone: 'Europe/Berlin'
      stepca_labels:
        traefik.enable: 'true'
      stepca_init_environment:
        DOCKER_STEPCA_INIT_NAME: 'Molecule CA'
        DOCKER_STEPCA_INIT_DNS_NAMES: 'stepca.molecule.test,localhost'
        DOCKER_STEPCA_INIT_SSH: false
        DOCKER_STEPCA_INIT_DEPLOYMENT_TYPE: 'standalone'
      stepca_secrets:
        - name: 'stepca_init_password'
          data: 'molecule-stepca-password'
          target: 'DOCKER_STEPCA_INIT_PASSWORD'
      stepca_config:
        logger:
          format: 'json'
        authority:
          claims:
            defaultTLSCertDuration: '24h'
            maxTLSCertDuration: '48h'
    side_effect:
      config:
        logger:
          format: 'json'
        authority:
          claims:
            defaultTLSCertDuration: '24h'
            maxTLSCertDuration: '72h'
    expect:
      ip: '10.89.0.131'
      ip6: 'fd00:89::131'
      password: 'molecule-stepca-password'
      acme: true
      quadlet:
        - 'Volume=/opt/stepca:/home/step:Z'
        - 'Label=traefik.enable=true'
      env:
        - 'TZ=Europe/Berlin'
      config:
        logger:
          format: 'json'
        authority:
          claims:
            defaultTLSCertDuration: '24h'
            maxTLSCertDuration: '72h'
      durations_allowed: [ '60h' ]
      durations_refused: [ '100h' ]
