---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/pki-stepca
#

pki_stepca__home: "{{ stepca_home | mandatory }}"
pki_stepca__ip: "{{ stepca_ip | mandatory }}"
pki_stepca__ipv6: "{{ stepca_ipv6 }}"
pki_stepca__network: "{{ stepca_network | mandatory }}"
pki_stepca__hostname: "{{ stepca_hostname | mandatory }}"
pki_stepca__timezone: "{{ stepca_timezone | mandatory }}"
pki_stepca__labels: "{{ stepca_labels | default({}) }}"
pki_stepca__publish: "{{ stepca_publish | default([]) }}"

pki_stepca__init_name: "{{ stepca_init_name | mandatory }}"
pki_stepca__init_dns_name: "{{ stepca_init_dns_name | mandatory }}"
pki_stepca__init_remote_management: "{{ stepca_init_remote_management | default(true) }}"
pki_stepca__init_provisioner_name: "{{ stepca_init_provisioner_name | default('admin') }}"
pki_stepca__init_admin_subject: "{{ stepca_init_admin_subject | default('step') }}"
pki_stepca__init_address: "{{ stepca_init_address | default(':9000') }}"
pki_stepca__init_ssh: "{{ stepca_init_ssh | default(true) }}"
pki_stepca__init_acme: "{{ stepca_init_acme | default(true) }}"
pki_stepca__init_password: "{{ stepca_init_password | mandatory }}"

pki_stepca__container: "{{ pki_stepca__podman_container_default | combine(stepca_container | default({})) }}"

#
# podman defaults
#

pki_stepca__uid: 1000
pki_stepca__gid: "{{ pki_stepca__uid }}"

pki_stepca__podman_name: 'stepca'
pki_stepca__podman_image: 'docker.io/smallstep/step-ca'

pki_stepca__podman_home: "{{ pki_stepca__home }}"

pki_stepca__podman_container_default:
  name: "{{ pki_stepca__podman_name }}"
  hostname: "{{ pki_stepca__hostname }}"
  image: "{{ pki_stepca__podman_image }}"
  ip: "{{ pki_stepca__ip }}"
  ipv6: "{{ pki_stepca__ipv6 | default(omit) }}"
  network: "{{ pki_stepca__network }}"
  timezone: "{{ pki_stepca__timezone }}"
  environment:
    DOCKER_STEPCA_INIT_NAME: "{{ pki_stepca__init_name }}"
    DOCKER_STEPCA_INIT_DNS_NAMES: "{{ pki_stepca__init_dns_name | join(',') }}"
    DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT: "{{ pki_stepca__init_remote_management | ternary('true', 'false') }}"
    DOCKER_STEPCA_INIT_PROVISIONER_NAME: "{{ pki_stepca__init_provisioner_name }}"
    DOCKER_STEPCA_INIT_ADMIN_SUBJECT: "{{ pki_stepca__init_admin_subject }}"
    DOCKER_STEPCA_INIT_ADDRESS: "{{ pki_stepca__init_address }}"
    DOCKER_STEPCA_INIT_SSH: "{{ pki_stepca__init_ssh | ternary('true', 'false') }}"
    DOCKER_STEPCA_INIT_ACME: "{{ pki_stepca__init_acme | ternary('true', 'false') }}"
  labels: "{{ pki_stepca__labels }}"
  publish: "{{ pki_stepca__publish }}"
  secrets:
    - "stepca_init_password,type=env,target=DOCKER_STEPCA_INIT_PASSWORD"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ pki_stepca__podman_home }}:/home/step"
