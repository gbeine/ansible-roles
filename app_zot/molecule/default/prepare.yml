---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks:
      - "{{ app_zot__test_network }}"
    podman_default_network: "{{ app_zot__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    # verify reads the API with curl, copies an image with skopeo and checks the hashes of htpasswd with bcrypt
    - name: 'Install curl, skopeo and bcrypt'
      ansible.builtin.apt:
        name: [ 'curl', 'skopeo', 'python3-bcrypt' ]
        state: 'present'
        update_cache: true

    - name: 'Pull the image, so the first start of the service does not time out'
      containers.podman.podman_image:
        name: "{{ app_zot__test_image }}"
      register: 'app_zot__test_pull'
      until: app_zot__test_pull is succeeded
      retries: 5
      delay: 30
