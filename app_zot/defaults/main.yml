---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/app-zot
#

app_zot__home: "{{ zot_home | mandatory }}"
app_zot__ip: "{{ zot_ip | mandatory }}"
app_zot__ipv6: "{{ zot_ipv6 }}"
app_zot__network: "{{ zot_network | mandatory }}"
app_zot__hostname: "{{ zot_hostname | mandatory }}"
app_zot__timezone: "{{ zot_timezone | mandatory }}"
app_zot__labels: "{{ zot_labels }}"

app_zot__version: "{{ zot_version | default('latest') }}"

app_zot__container: "{{ app_zot__podman_container_default | combine(zot_container | default({})) }}"

# The configuration of zot (config.json), merged recursively, lists are replaced,
# the values set by the role are merged last
app_zot__config: "{{ app_zot__config_default | combine(zot_config | default({}), recursive=true) | combine(app_zot__config_role, recursive=true) }}"

# Only the SDKs of the storage drivers read the environment
app_zot__environment: "{{ app_zot__environment_default | combine(zot_environment | default({})) }}"

# Secrets with name, data and target, the secrets of zot are files referenced by the configuration,
# the secrets of the SDKs of the storage drivers are passed in the environment
app_zot__secrets: "{{ zot_secrets | default([]) }}"

# The users of htpasswd, the key is the name of the user, the value has the password
app_zot__users: "{{ zot_users | default({}) }}"

app_zot__autoupdate_enabled: "{{ zot_autoupdate_enabled | default(false) }}"
app_zot__autoupdate_schedule: "{{ zot_autoupdate_schedule }}"

#
# Defaults - do not change
#

# The search is needed by the web interface, the scans of CVEs are disabled
app_zot__config_default:
  distSpecVersion: '1.1.1'
  storage:
    dedupe: true
    gc: true
  http:
    realm: 'zot'
  log:
    level: 'info'
  extensions:
    search:
      enable: true
    ui:
      enable: true

# Set by the role, the port, the storage, the users and the files of the secrets
app_zot__config_role: >-
  {%- set ns = namespace(config={
        'http': { 'address': '0.0.0.0', 'port': app_zot__port | string },
        'storage': { 'rootDirectory': app_zot__registry_dir } }) -%}
  {%- if app_zot__users is mapping and app_zot__users | length > 0 -%}
  {%-   set ns.config = ns.config | combine({ 'http': { 'auth': { 'htpasswd': { 'path': app_zot__config_dir ~ '/htpasswd' } } } }, recursive=true) -%}
  {%- endif -%}
  {%- if app_zot__secrets is sequence and app_zot__secrets is not string and app_zot__secrets is not mapping -%}
  {%-   for secret in app_zot__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in app_zot__secret_files -%}
  {%-     set value = namespace(tree=app_zot__secrets_dir ~ '/' ~ secret.name ~ ('' if secret.target in app_zot__secrets_plain else '.json')) -%}
  {%-     for key in app_zot__secret_files[secret.target] | reverse -%}
  {%-       set value.tree = { key: value.tree } -%}
  {%-     endfor -%}
  {%-     set ns.config = ns.config | combine(value.tree, recursive=true) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ ns.config }}

app_zot__port: 5000

# The keys of the configuration set by the role, they must not be set in zot_config
app_zot__config_role_keys:
  - [ 'http', 'address' ]
  - [ 'http', 'port' ]
  - [ 'storage', 'rootDirectory' ]
  - [ 'http', 'auth', 'htpasswd' ]
  - [ 'http', 'tls', 'key' ]

# Keys carrying secrets or the files of secrets anywhere in zot_config, the secrets are set with zot_secrets
app_zot__config_secret_keys: [ 'credentialsFile', 'sessionKeysFile', 'clientsecret', 'accesskey', 'secretkey', 'accountkey' ]

# The ways to log in besides htpasswd (zot_users), the login is mandatory
app_zot__auth_methods: [ 'ldap', 'openid', 'bearer', 'mtls' ]

# The secrets mounted as files below /run/secrets, the role sets their path at these keys of the configuration
# (pkg/api/config/config.go of zot v2.1.23)
app_zot__secret_files:
  ZOT_LDAP_CREDENTIALS: [ 'http', 'auth', 'ldap', 'credentialsFile' ]
  ZOT_SESSION_KEYS: [ 'http', 'auth', 'sessionKeysFile' ]
  ZOT_SYNC_CREDENTIALS: [ 'extensions', 'sync', 'credentialsFile' ]
  ZOT_OPENID_GITHUB_CREDENTIALS: [ 'http', 'auth', 'openid', 'providers', 'github', 'credentialsFile' ]
  ZOT_OPENID_GOOGLE_CREDENTIALS: [ 'http', 'auth', 'openid', 'providers', 'google', 'credentialsFile' ]
  ZOT_OPENID_GITLAB_CREDENTIALS: [ 'http', 'auth', 'openid', 'providers', 'gitlab', 'credentialsFile' ]
  ZOT_OPENID_OIDC_CREDENTIALS: [ 'http', 'auth', 'openid', 'providers', 'oidc', 'credentialsFile' ]
  ZOT_TLS_KEY: [ 'http', 'tls', 'key' ]

# zot reads the files of the secrets with viper, it knows their format only by the extension, so they are mounted as <name>.json.
# The key of TLS is PEM, it is mounted without extension
app_zot__secrets_plain: [ 'ZOT_TLS_KEY' ]

# The secrets passed in the environment, the SDKs of S3 and Azure only read the environment
app_zot__secrets_env: [ 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN', 'AZURE_CLIENT_SECRET' ]

app_zot__secrets_allowed: "{{ app_zot__secret_files.keys() | list + app_zot__secrets_env }}"

app_zot__secrets_dir: '/run/secrets'

app_zot__environment_default:
  TZ: "{{ app_zot__timezone }}"

# zot reads no environment variables, only the SDKs of S3 and Azure (examples/README.md of zot v2.1.23) without the secrets
app_zot__environment_allowed:
  - 'TZ'
  - 'AWS_ACCESS_KEY_ID'
  - 'AWS_PROFILE'
  - 'AWS_REGION'
  - 'AZURE_CLIENT_CERTIFICATE_PATH'
  - 'AZURE_CLIENT_ID'
  - 'AZURE_TENANT_ID'

# The users of htpasswd
app_zot__name_pattern: '^[A-Za-z0-9_.@-]+$'
app_zot__user_keys: [ 'password' ]
# bcrypt only uses the first 72 bytes of a password
app_zot__password_length_min: 8
app_zot__password_length_max: 72

app_zot__podman_name: 'zot'
app_zot__podman_image: 'ghcr.io/project-zot/zot'
app_zot__podman_tag: "{{ app_zot__version }}"

app_zot__podman_home: "{{ app_zot__home }}"
app_zot__podman_etc_dir: "{{ app_zot__podman_home }}/etc"
app_zot__podman_data_dir: "{{ app_zot__podman_home }}/data"

# The directories in the container
app_zot__config_dir: '/etc/zot'
app_zot__registry_dir: '/var/lib/registry'

app_zot__podman_container_default:
  name: "{{ app_zot__podman_name }}"
  hostname: "{{ app_zot__hostname }}"
  image: "{{ app_zot__podman_image }}:{{ app_zot__podman_tag }}"
  ip: "{{ app_zot__ip }}"
  ipv6: "{{ app_zot__ipv6 | default(omit) }}"
  network: "{{ app_zot__network }}"
  timezone: "{{ app_zot__timezone }}"
  environment: "{{ app_zot__environment }}"
  labels: "{{ app_zot__labels | default(omit) }}"
  # The secrets of app_zot__secrets_env are passed in the environment, the others are mounted
  secrets: >-
    {{ app_zot__podman_secrets
       if (app_zot__secrets is sequence and app_zot__secrets is not string and app_zot__secrets | length > 0)
       else omit }}
  # zot watches config.json and htpasswd, the directory is mounted, not the files
  volumes:
    - "{{ app_zot__podman_etc_dir }}:{{ app_zot__config_dir }}:ro,Z"
    - "{{ app_zot__podman_data_dir }}:{{ app_zot__registry_dir }}:Z"

# The podman secrets of zot_secrets, entries without name or target are left out, the validation of the secrets reports them
app_zot__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- for secret in app_zot__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-   if secret.target in app_zot__secrets_env -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=env,target=' ~ secret.target) -%}
  {%-   else -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ app_zot__secrets_dir ~ '/' ~ secret.name ~ ('' if secret.target in app_zot__secrets_plain else '.json')) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ secrets }}
