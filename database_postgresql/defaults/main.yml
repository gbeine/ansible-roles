---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-postgresql
#

database_postgresql__version: "{{ postgresql_version | default(18) }}"
database_postgresql__tag: "{{ postgresql_tag | default(database_postgresql__versions[database_postgresql__version | int].tag | default('')) }}"

database_postgresql__home: "{{ postgresql_home | mandatory }}"
database_postgresql__ip: "{{ postgresql_ip | mandatory }}"
database_postgresql__ipv6: "{{ postgresql_ipv6 }}"
database_postgresql__network: "{{ postgresql_network | mandatory }}"
database_postgresql__hostname: "{{ postgresql_hostname | mandatory }}"
database_postgresql__timezone: "{{ postgresql_timezone | mandatory }}"
database_postgresql__labels: "{{ postgresql_labels }}"

database_postgresql__password: "{{ postgresql_password | default('') }}"
database_postgresql__passwords: "{{ postgresql_passwords | default({}) }}"

database_postgresql__accounts: "{{ postgresql_accounts | default([]) }}"
database_postgresql__databases: "{{ postgresql_databases | default([]) }}"
database_postgresql__privileges: "{{ postgresql_privileges | default([]) }}"
database_postgresql__slots: "{{ postgresql_slots | default([]) }}"

database_postgresql__settings: "{{ database_postgresql__settings_default | combine(postgresql_settings | default({})) }}"
database_postgresql__server_hba: "{{ postgresql_hba | default(database_postgresql__server_hba_default) }}"

# Standby: the configuration and the data are replicated from the primary
database_postgresql__configure_from_primary: "{{ postgresql_configure_from_primary | default(false) }}"

database_postgresql__container: "{{ database_postgresql__podman_container_default | combine(postgresql_container | default({})) }}"

# Variables of the image, e.g. POSTGRES_INITDB_ARGS, the role sets POSTGRES_PASSWORD_FILE itself
database_postgresql__environment: "{{ database_postgresql__environment_default | combine(postgresql_environment | default({})) }}"

database_postgresql__autoupdate_enabled: "{{ postgresql_autoupdate_enabled | default(false) }}"
database_postgresql__autoupdate_schedule: "{{ postgresql_autoupdate_schedule }}"

#
# Defaults - do not change
#

# Supported major versions, the data directory moved to /var/lib/postgresql/<major>/docker with 18
database_postgresql__versions:
  18:
    tag: '18-alpine'
    prerelease: false
  19:
    tag: '19rc1-alpine'
    prerelease: true

# The settings initdb writes into a new postgresql.conf of the image
database_postgresql__settings_default:
  listen_addresses: '*'
  max_connections: 100
  shared_buffers: '128MB'
  dynamic_shared_memory_type: 'posix'
  max_wal_size: '1GB'
  min_wal_size: '80MB'
  log_timezone: "{{ database_postgresql__timezone }}"
  datestyle: 'iso, mdy'
  timezone: "{{ database_postgresql__timezone }}"
  lc_messages: 'en_US.utf8'
  lc_monetary: 'en_US.utf8'
  lc_numeric: 'en_US.utf8'
  lc_time: 'en_US.utf8'
  default_text_search_config: 'pg_catalog.english'

# User and group postgres of the Alpine image
database_postgresql__uid: 70
database_postgresql__gid: 70

database_postgresql__port: 5432

database_postgresql__environment_default: {}

# The password of postgres is mounted as file, the image reads POSTGRES_PASSWORD from the file variable
database_postgresql__secret_name: 'postgres_password'
database_postgresql__secret_files:
  POSTGRES_PASSWORD: 'POSTGRES_PASSWORD_FILE'
database_postgresql__secrets_dir: '/run/secrets'

# Variables of the image (docker-entrypoint.sh of docker-library/postgres) that can be set with postgresql_environment,
# the other variables (POSTGRES_USER, POSTGRES_DB, PGDATA, …) are set by the role or would break it
database_postgresql__environment_allowed:
  - 'POSTGRES_INITDB_ARGS'
  - 'POSTGRES_INITDB_WALDIR'
  # The file variables of the secrets, set by the role
  - 'POSTGRES_PASSWORD_FILE'

database_postgresql__podman_name: 'postgresql'
database_postgresql__podman_image: 'docker.io/library/postgres'

database_postgresql__podman_home: "{{ database_postgresql__home }}"
database_postgresql__podman_data_root: "{{ database_postgresql__podman_home }}/data"
database_postgresql__podman_data_dir: "{{ database_postgresql__podman_data_root }}/{{ database_postgresql__version }}/docker"
database_postgresql__podman_backup_dir: "{{ database_postgresql__podman_home }}/backup"

database_postgresql__data_root: '/var/lib/postgresql'
database_postgresql__backup_dir: '/backup'

database_postgresql__podman_container_default:
  name: "{{ database_postgresql__podman_name }}"
  hostname: "{{ database_postgresql__hostname }}"
  image: "{{ database_postgresql__podman_image }}:{{ database_postgresql__tag }}"
  ip: "{{ database_postgresql__ip }}"
  ipv6: "{{ database_postgresql__ipv6 | default(omit) }}"
  network: "{{ database_postgresql__network }}"
  timezone: "{{ database_postgresql__timezone }}"
  labels: "{{ database_postgresql__labels | default(omit) }}"
  # Set with postgresql_environment, the file variable of the password is always set
  environment: >-
    {{ database_postgresql__environment
       | combine({ database_postgresql__secret_files.POSTGRES_PASSWORD: database_postgresql__secrets_dir ~ '/' ~ database_postgresql__secret_name }) }}
  secrets:
    - "{{ database_postgresql__secret_name }},type=mount,target={{ database_postgresql__secrets_dir }}/{{ database_postgresql__secret_name }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ database_postgresql__podman_data_root }}:{{ database_postgresql__data_root }}"
    - "{{ database_postgresql__podman_backup_dir }}:{{ database_postgresql__backup_dir }}"

database_postgresql__server_hba_default:
  # "local" is for Unix domain socket connections only
  - type: 'local'
    database: 'all'
    user: 'all'
    method: 'trust'
  # IPv4 local connections
  - type: 'host'
    database: 'all'
    user: 'all'
    address: '127.0.0.1/32'
    method: 'trust'
  # IPv6 local connections
  - type: 'host'
    database: 'all'
    user: 'all'
    address: '::1/128'
    method: 'trust'
  # Allow replication connections from localhost, by a user with the replication privilege.
  - type: 'local'
    database: 'replication'
    user: 'all'
    method: 'trust'
  - type: 'host'
    database: 'replication'
    user: 'all'
    address: '127.0.0.1/32'
    method: 'trust'
  - type: 'host'
    database: 'replication'
    user: 'all'
    address: '::1/128'
    method: 'trust'
  - type: 'host'
    database: 'all'
    user: 'all'
    address: 'all'
    method: 'scram-sha-256'
