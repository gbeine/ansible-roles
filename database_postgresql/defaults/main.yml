---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-postgresql
#

database_postgresql__version: "{{ postgresql_version | default(18) }}"
database_postgresql__use_podman: "{{ postgresql_use_podman | default(true) }}"

database_postgresql__home: "{{ postgresql_home | mandatory }}"
database_postgresql__ip: "{{ postgresql_ip | mandatory }}"
database_postgresql__ipv6: "{{ postgresql_ipv6 | default('') }}"
database_postgresql__network: "{{ postgresql_network | mandatory }}"
database_postgresql__hostname: "{{ postgresql_hostname | mandatory }}"
database_postgresql__timezone: "{{ postgresql_timezone | mandatory }}"

database_postgresql__accounts: "{{ postgresql_accounts | default([]) }}"
database_postgresql__databases: "{{ postgresql_databases | default([]) }}"
database_postgresql__privileges: "{{ postgresql_privileges | default([]) }}"
database_postgresql__slots: "{{ postgresql_slots | default([]) }}"
database_postgresql__passwords: "{{ postgresql_passwords | mandatory }}"
database_postgresql__password: "{{ postgresql_password | mandatory }}"

database_postgresql__server_hba: "{{ postgresql_hba | default(postgresql__server_hba_default) }}"

database_postgresql__port: "{{ postgresql_port | default(5432) }}"
database_postgresql__max_connections: "{{ postgresql_max_connections | default(100) }}"
database_postgresql__unix_socket_directories: "{{ postgresql_unix_socket_directories | default('/var/run/postgresql') }}"
database_postgresql__shared_buffers: "{{ postgresql_shared_buffers | default('128MB') }}"
database_postgresql__dynamic_shared_memory_type: "{{ postgresql_dynamic_shared_memory_type | default('posix') }}"

#
# SSL
#
database_postgresql__enable_ssl: "{{ postgresql_enable_ssl | default(false) }}"
database_postgresql__ssl_ca_file: "{{ postgresql_ssl_ca_file | default('ca.crt') }}"
database_postgresql__ssl_cert_file: "{{ postgresql_ssl_cert_file | default('server.crt') }}"
database_postgresql__ssl_key_file: "{{ postgresql_ssl_key_file | default('server.key') }}"

#
# Replication & WAL
#

database_postgresql__configure_from_primary: "{{ postgresql_configure_from_primary | default(false) }}"
database_postgresql__enable_wal: "{{ postgresql_enable_wal | default(false) }}"
database_postgresql__enable_replication_sending: "{{ postgresql_enable_replication_sending | default(false) }}"
database_postgresql__enable_replication_standby: "{{ postgresql_enable_replication_standby | default(false) }}"

# minimal, replica, or logical
database_postgresql__wal_level: "{{ postgresql_wal_level | default('replica') }}"
database_postgresql__fsync: "{{ postgresql_fsync | default(true) }}"
# off, local, remote_write, remote_apply, or on
database_postgresql__synchronous_commit: "{{ postgresql_synchronous_commit | default('on') }}"
database_postgresql__wal_sync_method: "{{ postgresql_wal_sync_method | default('fdatasync') }}"
database_postgresql__full_page_writes: "{{ postgresql_full_page_writes | default(true) }}"
database_postgresql__wal_log_hints: "{{ postgresql_wal_log_hints | default(false) }}"
# off, pglz, lz4, zstd, or on
database_postgresql__wal_compression: "{{ postgresql_wal_compression | default('off') }}"
database_postgresql__wal_init_zero: "{{ postgresql_wal_init_zero | default(true) }}"
database_postgresql__wal_recycle: "{{ postgresql_wal_recycle | default(true) }}"
database_postgresql__wal_buffers: "{{ postgresql_wal_buffers | default(-1) }}"
database_postgresql__wal_writer_delay: "{{ postgresql_wal_writer_delay | default('200ms') }}"
database_postgresql__wal_writer_flush_after: "{{ postgresql_wal_writer_flush_after | default('1MB') }}"
database_postgresql__wal_skip_threshold: "{{ postgresql_wal_skip_threshold | default('2MB') }}"
database_postgresql__commit_delay: "{{ postgresql_commit_delay | default(0) }}"
database_postgresql__commit_siblings: "{{ postgresql_commit_siblings | default(5) }}"

database_postgresql__checkpoint_timeout: "{{ postgresql_checkpoint_timeout | default('5min') }}"
database_postgresql__checkpoint_completion_target: "{{ postgresql_checkpoint_completion_target | default(0.9) }}"
database_postgresql__checkpoint_flush_after: "{{ postgresql_checkpoint_flush_after | default('256kB') }}"
database_postgresql__checkpoint_warning: "{{ postgresql_checkpoint_warning | default('30s') }}"
database_postgresql__max_wal_size: "{{ postgresql_max_wal_size | default('1GB') }}"
database_postgresql__min_wal_size: "{{ postgresql_min_wal_size | default('80MB') }}"

# off, on, or always
database_postgresql__archive_mode: "{{ postgresql_archive_mode | default('off') }}"
database_postgresql__archive_library: "{{ postgresql_archive_library | default(\"''\") }}"
database_postgresql__archive_command: "{{ postgresql_archive_command | default(\"''\") }}"
database_postgresql__archive_timeout: "{{ postgresql_archive_timeout | default(0) }}"

database_postgresql__max_wal_senders: "{{ postgresql_max_wal_senders | default(10) }}"
database_postgresql__max_replication_slots: "{{ postgresql_max_replication_slots | default(10) }}"
database_postgresql__wal_keep_size: "{{ postgresql_wal_keep_size | default(0) }}"
database_postgresql__max_slot_wal_keep_size: "{{ postgresql_max_slot_wal_keep_size | default(-1) }}"
database_postgresql__idle_replication_slot_timeout: "{{ postgresql_idle_replication_slot_timeout | default(0) }}"
database_postgresql__wal_sender_timeout: "{{ postgresql_wal_sender_timeout | default('60s') }}"
database_postgresql__track_commit_timestamp: "{{ postgresql_track_commit_timestamp | default(false) }}"

database_postgresql__primary_conninfo: "{{ postgresql_primary_conninfo | default('') }}"
database_postgresql__primary_slot_name: "{{ postgresql_primary_slot_name | default('') }}"
database_postgresql__hot_standby: "{{ postgresql_hot_standby | default(true) }}"

database_postgresql__log_timezone: "{{ postgresql_log_timezone | default(database_postgresql__timezone) }}"
database_postgresql__datestyle: "{{ postgresql_datestyle | default('iso, mdy') }}"

database_postgresql__lc_messages: "{{ postgresql_lc_messages | default('en_US.utf8') }}"
database_postgresql__lc_monetary: "{{ postgresql_lc_monetary | default('en_US.utf8') }}"
database_postgresql__lc_numeric: "{{ postgresql_lc_numeric | default('en_US.utf8') }}"
database_postgresql__lc_time: "{{ postgresql_lc_time | default('en_US.utf8') }}"

database_postgresql__default_text_search_config: "{{ postgresql_default_text_search_config | default('pg_catalog.english') }}"

database_postgresql__container: "{{ database_postgresql__podman_container_default | combine(postgresql_container | default({})) }}"

#
# Defaults - do not change
#

database_postgresql__podman_name: 'postgresql'
database_postgresql__podman_image: 'docker.io/library/postgres'
database_postgresql__podman_tag: "{{ postgresql_podman_tag | default(database_postgresql__podman_tag_default) }}"

database_postgresql__podman_home: "{{ database_postgresql__home }}"
database_postgresql__podman_data_dir: "{{ database_postgresql__podman_home + '/data/' + database_postgresql__version | string + '/docker' if database_postgresql__version | int >= 18 else database_postgresql__podman_home + '/data' }}"
database_postgresql__podman_backup_dir: "{{ database_postgresql__podman_home }}/backup"

database_postgresql__podman_tag_default: "{{ database_postgresql__version }}-alpine"

database_postgresql__podman_container_default:
  name: "{{ database_postgresql__podman_name }}"
  hostname: "{{ database_postgresql__hostname }}"
  image: "{{ database_postgresql__podman_image }}:{{ database_postgresql__podman_tag }}"
  ip: "{{ database_postgresql__ip }}"
  ipv6: "{{ database_postgresql__ipv6 }}"
  network: "{{ database_postgresql__network }}"
  timezone: "{{ database_postgresql__timezone }}"
  secrets:
    - "postgres_password,type=env,target=POSTGRES_PASSWORD"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ database_postgresql__podman_home }}/data:{{ database_postgresql__data_dir }}"
    - "{{ database_postgresql__podman_backup_dir }}:{{ database_postgresql__backup_dir }}"
  restart_policy: 'always'

postgresql__server_hba_default:
# "local" is for Unix domain socket connections only
  - type: 'local'
    database: 'all'
    user: 'all'
    method: 'trust'
# IPv4 local connections
  - type: 'host'
    database: 'all'
    user: 'all'
    address: '127.0.0.1/32'
    method: 'trust'
# IPv6 local connections
  - type: 'host'
    database: 'all'
    user: 'all'
    address: '::1/128'
    method: 'trust'
# Allow replication connections from localhost, by a user with the replication privilege.
  - type: 'local'
    database: 'replication'
    user: 'all'
    method: 'trust'
  - type: 'host'
    database: 'replication'
    user: 'all'
    address: '127.0.0.1/32'
    method: 'trust'
  - type: 'host'
    database: 'replication'
    user: 'all'
    address: '::1/128'
    method: 'trust'
