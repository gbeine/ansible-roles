---

- name: 'Install PostgreSQL using podman'
  block:

    - name: 'Create PostgreSQL directories'
      ansible.builtin.file:
        dest: "{{ item }}"
        state: 'directory'
      with_items:
        - "{{ database_postgresql__podman_data_dir }}"
        - "{{ database_postgresql__podman_backup_dir }}"

    - name: 'Create secrets'
      containers.podman.podman_secret:
        state: 'present'
        name: 'postgres_password'
        data: "{{ database_postgresql__password }}"

    - name: 'Install PostgreSQL container'
      containers.podman.podman_container:
        name: "{{ database_postgresql__container.name }}"
        hostname: "{{ database_postgresql__container.hostname }}"
        image: "{{ database_postgresql__container.image }}"
        ip: "{{ database_postgresql__container.ip }}"
        network: "{{ database_postgresql__container.network }}"
        expose: "{{ database_postgresql__container.expose | default([]) }}"
        publish: "{{ database_postgresql__container.publish | default([]) }}"
        restart_policy: "{{ database_postgresql__container.restart_policy }}"
        secrets: "{{ database_postgresql__container.secrets }}"
        timezone: "{{ database_postgresql__container.timezone }}"
        volume: "{{ database_postgresql__container.volumes }}"
        pull: 'always'
        recreate: "{{ podman___update_mode | default(false) }}"
      when: 'database_postgresql__ipv6 | length == 0'

    - name: 'Install PostgreSQL container'
      containers.podman.podman_container:
        name: "{{ database_postgresql__container.name }}"
        hostname: "{{ database_postgresql__container.hostname }}"
        image: "{{ database_postgresql__container.image }}"
        ip: "{{ database_postgresql__container.ip }}"
        ipv6: "{{ database_postgresql__container.ipv6 }}"
        network: "{{ database_postgresql__container.network }}"
        expose: "{{ database_postgresql__container.expose | default([]) }}"
        publish: "{{ database_postgresql__container.publish | default([]) }}"
        restart_policy: "{{ database_postgresql__container.restart_policy }}"
        secrets: "{{ database_postgresql__container.secrets }}"
        timezone: "{{ database_postgresql__container.timezone }}"
        volume: "{{ database_postgresql__container.volumes }}"
        pull: 'always'
        recreate: "{{ podman___update_mode | default(false) }}"
      when: 'database_postgresql__ipv6 | length > 0'

    - name: 'Wait for PostgreSQL port to be opened'
      ansible.builtin.wait_for:
        host: "{{ database_postgresql__container.ip }}"
        port: "{{ database_postgresql__port }}"

    - name: 'Copy SSL certificates to podman directory'
      ansible.builtin.copy:
        remote_src: yes
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: '70'
        group: '70'
        mode: '400'
      with_items:
        - src: "{{ database_postgresql__ssl_ca_file_src }}"
          dest: "{{ database_postgresql__podman_target_dir }}/{{ database_postgresql__ssl_ca_file }}"
        - src: "{{ database_postgresql__ssl_cert_file_src }}"
          dest: "{{ database_postgresql__podman_target_dir }}/{{ database_postgresql__ssl_cert_file }}"
        - src: "{{ database_postgresql__ssl_key_file_src }}"
          dest: "{{ database_postgresql__podman_target_dir }}/{{ database_postgresql__ssl_key_file }}"
      when: 'not ansible_check_mode and not database_postgresql__configure_from_primary and item.src | length > 0'
      notify: 'Restart PostgreSQL container'

    - name: 'Generate PostgreSQL configuration'
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      with_items:
        - src: 'pg_hba.conf.j2'
          dest: "{{ database_postgresql__podman_target_dir }}/pg_hba.conf"
        - src: 'pg_ident.conf.j2'
          dest: "{{ database_postgresql__podman_target_dir }}/pg_ident.conf"
        - src: 'postgresql.conf.j2'
          dest: "{{ database_postgresql__podman_target_dir }}/postgresql.conf"
      when: 'not database_postgresql__configure_from_primary'
      notify: 'Restart PostgreSQL container'

    - name: 'Generate systemd unit file'
      containers.podman.podman_generate_systemd:
        name: "{{ database_postgresql__container.name }}"
        restart_policy: "{{ database_postgresql__container.restart_policy }}"
        force: true
        dest: '/etc/systemd/system'

    - name: 'Started and enable container on systemd'
      ansible.builtin.systemd:
        name: "container-{{ database_postgresql__container.name }}"
        daemon_reload: true
        state: 'started'
        enabled: true
