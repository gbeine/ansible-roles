---

- name: 'Install PostgreSQL'
  tags: [ 'database_postgresql'  ]
  block:

    - name: 'Include OS-specific variables (podman)'
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}-podman.yml"
        - "{{ ansible_facts['distribution'] }}-podman.yml"
      when: 'database_postgresql__use_podman'

    - name: 'Include OS-specific variables (native)'
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
      when: 'not database_postgresql__use_podman'

    - name: 'Install PostgreSQL packages'
      ansible.builtin.apt:
        update_cache: 'yes'
        install_recommends: 'no'
        pkg: "{{ database_postgresql__packages }}"
      register: 'database_postgresql_packages_installation_result'

    - name: 'Install PostgreSQL using podman'
      ansible.builtin.include_tasks:
        file: 'podman.yml'
      when: 'database_postgresql__use_podman'

    - name: 'Initialize PostgreSQL'
      block:
        - name: 'Initialize PostgreSQL roles'
          ansible.builtin.include_tasks:
            file: 'roles.yml'
        - name: 'Initialize PostgreSQL databases'
          ansible.builtin.include_tasks:
            file: 'databases.yml'
        - name: 'Initialize PostgreSQL privileges'
          ansible.builtin.include_tasks:
            file: 'privileges.yml'
        - name: 'Initialize PostgreSQL slots'
          ansible.builtin.include_tasks:
            file: 'slots.yml'
      when: 'not ansible_check_mode and not podman___update_mode | bool and not database_postgresql__configure_from_primary'
