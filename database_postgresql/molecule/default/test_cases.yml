---
# Network created by container_podman in prepare.yml
database_postgresql__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24

database_postgresql__test_password: 'molecule-postgres-password'
database_postgresql__test_app_password: 'molecule-app-password'

# Role variables shared by all test cases
database_postgresql__test_common:
  postgresql_home: '/opt/postgresql-molecule'
  postgresql_ip: '10.89.0.40'
  postgresql_network: 'podman-molecule'
  postgresql_hostname: 'postgresql-molecule'
  postgresql_timezone: 'Europe/Berlin'
  postgresql_password: 'molecule-postgres-password'
  postgresql_settings:
    max_connections: 50
    log_min_duration_statement: '250ms'
    wal_level: 'logical'
  postgresql_accounts:
    - name: 'molecule_app'
      comment: 'Account of the molecule test'
  postgresql_passwords:
    molecule_app: 'molecule-app-password'
  postgresql_databases:
    - name: 'molecule_db'
      owner: 'molecule_app'
  postgresql_privileges:
    - database: 'molecule_db'
      type: 'database'
      privs: 'CONNECT'
      roles: 'molecule_app'
  postgresql_slots:
    - name: 'molecule_slot'
      type: 'logical'

# max_connections is changed in side_effect.yml, the running service must be restarted
database_postgresql__test_side_effect_max_connections: 60

database_postgresql__test_cases:

  - name: 'molecule-postgresql'
    role_vars:
      postgresql_version: 18
    image: 'docker.io/library/postgres:18-alpine'
    expect:
      version: '18'
      max_connections: '60'
      # Only in the configuration of PostgreSQL 18
      default_setting: '#standard_conforming_strings = on'

  - name: 'molecule-postgresql-19'
    role_vars:
      postgresql_version: 19
    image: 'docker.io/library/postgres:19rc1-alpine'
    expect:
      version: '19'
      max_connections: '50'
      # Only in the configuration of PostgreSQL 19
      default_setting: '#ssl_sni = off'
