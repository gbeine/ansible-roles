---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    database_postgresql__test_case: "{{ database_postgresql__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    podman_networks:
      - "{{ database_postgresql__test_network }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Ensure /etc/timezone exists'
      ansible.builtin.copy:
        dest: '/etc/timezone'
        content: |
          Etc/UTC
        force: false
        mode: '0644'

    - name: 'Pull the PostgreSQL image, so the first start of the service does not time out'
      containers.podman.podman_image:
        name: "{{ database_postgresql__test_case.image }}"
