      %h = remote host
      %L = local address
      %b = backend type
      %p = process ID
      %P = process ID of parallel group leader
      %t = timestamp without milliseconds
      %m = timestamp with milliseconds
      %n = timestamp with milliseconds (as a Unix epoch)
      %Q = query ID (0 if none or not computed)
