      (change requires restart)
  - name: max_standby_archive_delay
    section: REPLICATION
    subsection: Standby Servers
    default: '30s'
    description: |-
      max delay before canceling queries
      when reading WAL from archive;
      -1 allows indefinite delay
  - name: max_standby_streaming_delay
    section: REPLICATION
    subsection: Standby Servers
    default: '30s'
