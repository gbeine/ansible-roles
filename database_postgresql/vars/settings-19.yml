---
# yamllint disable rule:line-length
#
# Settings of PostgreSQL 19
# Generated from: src/backend/utils/misc/postgresql.conf.sample (REL_19_STABLE)
#

database_postgresql__release_settings:
  - name: data_directory
    section: FILE LOCATIONS
    default: '''ConfigDir'''
    description: |-
      use data in another directory
      (change requires restart)
    intro: |-
      The default values of these variables are driven from the -D command-line
      option or PGDATA environment variable, represented here as ConfigDir.
  - name: hba_file
    section: FILE LOCATIONS
    default: '''ConfigDir/pg_hba.conf'''
    description: |-
      host-based authentication file
      (change requires restart)
  - name: ident_file
    section: FILE LOCATIONS
    default: '''ConfigDir/pg_ident.conf'''
    description: |-
      ident configuration file
      (change requires restart)
  - name: hosts_file
    section: FILE LOCATIONS
    default: '''ConfigDir/pg_hosts.conf'''
    description: |-
      hosts configuration file
      (change requires restart)
  - name: external_pid_file
    section: FILE LOCATIONS
    default: ''''''
    description: |-
      write an extra PID file
      (change requires restart)
    intro: If external_pid_file is not explicitly set, no extra PID file is written.
  - name: listen_addresses
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Connection Settings
    default: '''localhost'''
    description: |-
      what IP address(es) to listen on;
      comma-separated list of addresses;
      defaults to 'localhost'; use '*' for all
      (change requires restart)
  - name: port
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Connection Settings
    default: '5432'
    description: (change requires restart)
  - name: max_connections
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Connection Settings
    default: '100'
    description: (change requires restart)
  - name: reserved_connections
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Connection Settings
    default: '0'
    description: (change requires restart)
  - name: superuser_reserved_connections
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Connection Settings
    default: '3'
    description: (change requires restart)
  - name: unix_socket_directories
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Connection Settings
    default: '''/tmp'''
    description: |-
      comma-separated list of directories
      (change requires restart)
  - name: unix_socket_group
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Connection Settings
    default: ''''''
    description: (change requires restart)
  - name: unix_socket_permissions
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Connection Settings
    default: '0777'
    description: |-
      begin with 0 to use octal notation
      (change requires restart)
  - name: bonjour
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Connection Settings
    default: 'off'
    description: |-
      advertise server via Bonjour
      (change requires restart)
  - name: bonjour_name
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Connection Settings
    default: ''''''
    description: |-
      defaults to the computer name
      (change requires restart)
  - name: tcp_keepalives_idle
    section: CONNECTIONS AND AUTHENTICATION
    subsection: TCP settings
    default: '0'
    description: |-
      TCP_KEEPIDLE, in seconds;
      0 selects the system default
    intro: see "man tcp" for details
  - name: tcp_keepalives_interval
    section: CONNECTIONS AND AUTHENTICATION
    subsection: TCP settings
    default: '0'
    description: |-
      TCP_KEEPINTVL, in seconds;
      0 selects the system default
  - name: tcp_keepalives_count
    section: CONNECTIONS AND AUTHENTICATION
    subsection: TCP settings
    default: '0'
    description: |-
      TCP_KEEPCNT;
      0 selects the system default
  - name: tcp_user_timeout
    section: CONNECTIONS AND AUTHENTICATION
    subsection: TCP settings
    default: '0'
    description: |-
      TCP_USER_TIMEOUT, in milliseconds;
      0 selects the system default
  - name: client_connection_check_interval
    section: CONNECTIONS AND AUTHENTICATION
    subsection: TCP settings
    default: '0'
    description: |-
      time between checks for client
      disconnection while running queries;
      0 for never
  - name: authentication_timeout
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Authentication
    default: '1min'
    description: '1s-600s'
  - name: password_encryption
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Authentication
    default: scram-sha-256
    description: scram-sha-256 or (deprecated) md5
  - name: scram_iterations
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Authentication
    default: '4096'
    description: ''
  - name: password_expiration_warning_threshold
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Authentication
    default: '7d'
    description: threshold for expiration warnings
  - name: md5_password_warnings
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Authentication
    default: 'on'
    description: display md5 deprecation warnings?
  - name: oauth_validator_libraries
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Authentication
    default: ''''''
    description: comma-separated list of trusted validator modules
  - name: krb_server_keyfile
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Authentication
    default: '''FILE:${sysconfdir}/krb5.keytab'''
    description: ''
    intro: GSSAPI using Kerberos
  - name: krb_caseins_users
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Authentication
    default: 'off'
    description: ''
  - name: gss_accept_delegation
    section: CONNECTIONS AND AUTHENTICATION
    subsection: Authentication
    default: 'off'
    description: ''
  - name: ssl
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: 'off'
    description: ''
  - name: ssl_ca_file
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: ''''''
    description: ''
  - name: ssl_cert_file
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: '''server.crt'''
    description: ''
  - name: ssl_crl_file
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: ''''''
    description: ''
  - name: ssl_crl_dir
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: ''''''
    description: ''
  - name: ssl_key_file
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: '''server.key'''
    description: ''
  - name: ssl_ciphers
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: '''HIGH:MEDIUM:+3DES:!aNULL'''
    description: allowed TLSv1.2 ciphers
  - name: ssl_tls13_ciphers
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: ''''''
    description: allowed TLSv1.3 cipher suites, blank for default
  - name: ssl_prefer_server_ciphers
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: 'on'
    description: ''
  - name: ssl_groups
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: '''X25519:prime256v1'''
    description: ''
  - name: ssl_min_protocol_version
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: '''TLSv1.2'''
    description: ''
  - name: ssl_max_protocol_version
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: ''''''
    description: ''
  - name: ssl_dh_params_file
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: ''''''
    description: ''
  - name: ssl_passphrase_command
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: ''''''
    description: ''
  - name: ssl_passphrase_command_supports_reload
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: 'off'
    description: ''
  - name: ssl_sni
    section: CONNECTIONS AND AUTHENTICATION
    subsection: SSL
    default: 'off'
    description: ''
  - name: shared_buffers
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '128MB'
    description: |-
      min 128kB
      (change requires restart)
  - name: huge_pages
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: try
    description: |-
      on, off, or try
      (change requires restart)
  - name: huge_page_size
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '0'
    description: |-
      zero for system default
      (change requires restart)
  - name: temp_buffers
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '8MB'
    description: min 800kB
  - name: max_prepared_transactions
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '0'
    description: |-
      zero disables the feature
      (change requires restart)
  - name: work_mem
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '4MB'
    description: min 64kB
    intro: |-
      Caution: it is not advisable to set max_prepared_transactions nonzero unless
      you actively intend to use prepared transactions.
  - name: hash_mem_multiplier
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '2.0'
    description: '1-1000.0 multiplier on hash table work_mem'
  - name: maintenance_work_mem
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '64MB'
    description: min 64kB
  - name: autovacuum_work_mem
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '-1'
    description: min 64kB, or -1 to use maintenance_work_mem
  - name: logical_decoding_work_mem
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '64MB'
    description: min 64kB
  - name: max_stack_depth
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '2MB'
    description: min 100kB
  - name: shared_memory_type
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: mmap
    description: |-
      the default is the first option
      supported by the operating system:
      mmap
      sysv
      windows
      (change requires restart)
  - name: dynamic_shared_memory_type
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: posix
    description: |-
      the default is usually the first option
      supported by the operating system:
      posix
      sysv
      windows
      mmap
      (change requires restart)
  - name: min_dynamic_shared_memory
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '0MB'
    description: (change requires restart)
  - name: vacuum_buffer_usage_limit
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '2MB'
    description: |-
      size of vacuum and analyze buffer access strategy ring;
      0 to disable vacuum buffer access strategy;
      range 128kB to 16GB
  - name: commit_timestamp_buffers
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '0'
    description: memory for pg_commit_ts (0 = auto)
    intro: SLRU buffers (change requires restart)
  - name: multixact_offset_buffers
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '16'
    description: memory for pg_multixact/offsets
  - name: multixact_member_buffers
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '32'
    description: memory for pg_multixact/members
  - name: notify_buffers
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '16'
    description: memory for pg_notify
  - name: serializable_buffers
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '32'
    description: memory for pg_serial
  - name: subtransaction_buffers
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '0'
    description: memory for pg_subtrans (0 = auto)
  - name: transaction_buffers
    section: RESOURCE USAGE (except WAL)
    subsection: Memory
    default: '0'
    description: memory for pg_xact (0 = auto)
  - name: temp_file_limit
    section: RESOURCE USAGE (except WAL)
    subsection: Disk
    default: '-1'
    description: |-
      limits per-process temp file space
      in kilobytes, or -1 for no limit
  - name: file_copy_method
    section: RESOURCE USAGE (except WAL)
    subsection: Disk
    default: copy
    description: copy, clone (if supported by OS)
  - name: file_extend_method
    section: RESOURCE USAGE (except WAL)
    subsection: Disk
    default: posix_fallocate
    description: |-
      the default is the first option supported
      by the operating system:
      posix_fallocate (most Unix-like systems)
      write_zeros
  - name: max_notify_queue_pages
    section: RESOURCE USAGE (except WAL)
    subsection: Disk
    default: '1048576'
    description: |-
      limits the number of SLRU pages allocated
      for NOTIFY / LISTEN queue
  - name: max_files_per_process
    section: RESOURCE USAGE (except WAL)
    subsection: Kernel Resources
    default: '1000'
    description: |-
      min 64
      (change requires restart)
  - name: timing_clock_source
    section: RESOURCE USAGE (except WAL)
    subsection: Time
    default: auto
    description: auto, system, tsc (if supported)
  - name: bgwriter_delay
    section: RESOURCE USAGE (except WAL)
    subsection: Background Writer
    default: '200ms'
    description: '10-10000ms between rounds'
  - name: bgwriter_lru_maxpages
    section: RESOURCE USAGE (except WAL)
    subsection: Background Writer
    default: '100'
    description: max buffers written/round, 0 disables
  - name: bgwriter_lru_multiplier
    section: RESOURCE USAGE (except WAL)
    subsection: Background Writer
    default: '2.0'
    description: '0-10.0 multiplier on buffers scanned/round'
  - name: bgwriter_flush_after
    section: RESOURCE USAGE (except WAL)
    subsection: Background Writer
    default: '0'
    description: measured in pages, 0 disables
  - name: backend_flush_after
    section: RESOURCE USAGE (except WAL)
    subsection: I/O
    default: '0'
    description: measured in pages, 0 disables
  - name: effective_io_concurrency
    section: RESOURCE USAGE (except WAL)
    subsection: I/O
    default: '16'
    description: '1-1000; 0 disables issuing multiple simultaneous IO requests'
  - name: maintenance_io_concurrency
    section: RESOURCE USAGE (except WAL)
    subsection: I/O
    default: '16'
    description: '1-1000; same as effective_io_concurrency'
  - name: io_max_combine_limit
    section: RESOURCE USAGE (except WAL)
    subsection: I/O
    default: '128kB'
    description: |-
      usually 1-128 blocks (depends on OS)
      (change requires restart)
  - name: io_combine_limit
    section: RESOURCE USAGE (except WAL)
    subsection: I/O
    default: '128kB'
    description: usually 1-128 blocks (depends on OS)
  - name: io_method
    section: RESOURCE USAGE (except WAL)
    subsection: I/O
    default: worker
    description: |-
      worker, io_uring, sync
      (change requires restart)
  - name: io_max_concurrency
    section: RESOURCE USAGE (except WAL)
    subsection: I/O
    default: '-1'
    description: |-
      Max number of IOs that one process
      can execute simultaneously
      -1 sets based on shared_buffers
      (change requires restart)
  - name: io_min_workers
    section: RESOURCE USAGE (except WAL)
    subsection: I/O
    default: '2'
    description: '1-32'
  - name: io_max_workers
    section: RESOURCE USAGE (except WAL)
    subsection: I/O
    default: '8'
    description: '1-32'
  - name: io_worker_idle_timeout
    section: RESOURCE USAGE (except WAL)
    subsection: I/O
    default: '60s'
    description: ''
  - name: io_worker_launch_interval
    section: RESOURCE USAGE (except WAL)
    subsection: I/O
    default: '100ms'
    description: ''
  - name: max_worker_processes
    section: RESOURCE USAGE (except WAL)
    subsection: Worker Processes
    default: '8'
    description: (change requires restart)
  - name: max_parallel_workers_per_gather
    section: RESOURCE USAGE (except WAL)
    subsection: Worker Processes
    default: '2'
    description: limited by max_parallel_workers
  - name: max_parallel_maintenance_workers
    section: RESOURCE USAGE (except WAL)
    subsection: Worker Processes
    default: '2'
    description: limited by max_parallel_workers
  - name: max_parallel_workers
    section: RESOURCE USAGE (except WAL)
    subsection: Worker Processes
    default: '8'
    description: |-
      number of max_worker_processes that
      can be used in parallel operations
  - name: parallel_leader_participation
    section: RESOURCE USAGE (except WAL)
    subsection: Worker Processes
    default: 'on'
    description: ''
  - name: wal_level
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: replica
    description: |-
      minimal, replica, or logical
      (change requires restart)
  - name: fsync
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: 'on'
    description: |-
      flush data to disk for crash safety
      (turning this off can cause
      unrecoverable data corruption)
  - name: synchronous_commit
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: 'on'
    description: |-
      synchronization level;
      off, local, remote_write, remote_apply, or on
  - name: wal_sync_method
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: fsync
    description: |-
      the default is the first option
      supported by the operating system:
      open_datasync
      fdatasync (default on Linux and FreeBSD)
      fsync
      fsync_writethrough
      open_sync
  - name: full_page_writes
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: 'on'
    description: recover from partial page writes
  - name: wal_log_hints
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: 'off'
    description: |-
      also do full page writes of non-critical updates
      (change requires restart)
  - name: wal_compression
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: 'off'
    description: |-
      enables compression of full-page writes;
      off, on, zstd, lz4, or pglz (on means the first
      of zstd, lz4 and pglz, supported by the build)
  - name: wal_init_zero
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: 'on'
    description: zero-fill new WAL files
  - name: wal_recycle
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: 'on'
    description: recycle WAL files
  - name: wal_buffers
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: '-1'
    description: |-
      min 32kB, -1 sets based on shared_buffers
      (change requires restart)
  - name: wal_writer_delay
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: '200ms'
    description: '1-10000 milliseconds'
  - name: wal_writer_flush_after
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: '1MB'
    description: measured in pages, 0 disables
  - name: wal_skip_threshold
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: '2MB'
    description: ''
  - name: commit_delay
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: '0'
    description: range 0-100000, in microseconds
  - name: commit_siblings
    section: WRITE-AHEAD LOG
    subsection: Settings
    default: '5'
    description: range 0-1000
  - name: checkpoint_timeout
    section: WRITE-AHEAD LOG
    subsection: Checkpoints
    default: '5min'
    description: range 30s-1d
  - name: checkpoint_completion_target
    section: WRITE-AHEAD LOG
    subsection: Checkpoints
    default: '0.9'
    description: checkpoint target duration, 0.0 - 1.0
  - name: checkpoint_flush_after
    section: WRITE-AHEAD LOG
    subsection: Checkpoints
    default: '0'
    description: measured in pages, 0 disables
  - name: checkpoint_warning
    section: WRITE-AHEAD LOG
    subsection: Checkpoints
    default: '30s'
    description: '0 disables'
  - name: max_wal_size
    section: WRITE-AHEAD LOG
    subsection: Checkpoints
    default: '1GB'
    description: ''
  - name: min_wal_size
    section: WRITE-AHEAD LOG
    subsection: Checkpoints
    default: '80MB'
    description: ''
  - name: recovery_prefetch
    section: WRITE-AHEAD LOG
    subsection: Prefetching during recovery
    default: try
    description: prefetch pages referenced in the WAL?
  - name: wal_decode_buffer_size
    section: WRITE-AHEAD LOG
    subsection: Prefetching during recovery
    default: '512kB'
    description: |-
      lookahead window used for prefetching
      (change requires restart)
  - name: archive_mode
    section: WRITE-AHEAD LOG
    subsection: Archiving
    default: 'off'
    description: |-
      enables archiving; off, on, or always
      (change requires restart)
  - name: archive_library
    section: WRITE-AHEAD LOG
    subsection: Archiving
    default: ''''''
    description: |-
      library to use to archive a WAL file
      (empty string indicates archive_command should
      be used)
  - name: archive_command
    section: WRITE-AHEAD LOG
    subsection: Archiving
    default: ''''''
    description: |-
      command to use to archive a WAL file
      placeholders: %p = path of file to archive
      %f = file name only
      e.g. 'test ! -f "/mnt/server/archivedir/%f" && cp "%p" "/mnt/server/archivedir/%f"'
  - name: archive_timeout
    section: WRITE-AHEAD LOG
    subsection: Archiving
    default: '0'
    description: |-
      force a WAL file switch after this
      number of seconds; 0 disables
  - name: restore_command
    section: WRITE-AHEAD LOG
    subsection: Archive Recovery
    default: ''''''
    description: |-
      command to use to restore an archived WAL file
      placeholders: %p = path of file to restore
      %f = file name only
      e.g. 'cp "/mnt/server/archivedir/%f" "%p"'
    intro: These are only used in recovery mode.
  - name: archive_cleanup_command
    section: WRITE-AHEAD LOG
    subsection: Archive Recovery
    default: ''''''
    description: command to execute at every restartpoint
  - name: recovery_end_command
    section: WRITE-AHEAD LOG
    subsection: Archive Recovery
    default: ''''''
    description: command to execute at completion of recovery
  - name: recovery_target
    section: WRITE-AHEAD LOG
    subsection: Recovery Target
    default: ''''''
    description: |-
      'immediate' to end recovery as soon as a
      consistent state is reached
      (change requires restart)
    intro: Set these only when performing a targeted recovery.
  - name: recovery_target_name
    section: WRITE-AHEAD LOG
    subsection: Recovery Target
    default: ''''''
    description: |-
      the named restore point to which recovery will proceed
      (change requires restart)
  - name: recovery_target_time
    section: WRITE-AHEAD LOG
    subsection: Recovery Target
    default: ''''''
    description: |-
      the time stamp up to which recovery will proceed
      (change requires restart)
  - name: recovery_target_xid
    section: WRITE-AHEAD LOG
    subsection: Recovery Target
    default: ''''''
    description: |-
      the transaction ID up to which recovery will proceed
      (change requires restart)
  - name: recovery_target_lsn
    section: WRITE-AHEAD LOG
    subsection: Recovery Target
    default: ''''''
    description: |-
      the WAL LSN up to which recovery will proceed
      (change requires restart)
  - name: recovery_target_inclusive
    section: WRITE-AHEAD LOG
    subsection: Recovery Target
    default: 'on'
    description: |-
      Specifies whether to stop:
      just after the specified recovery target (on)
      just before the recovery target (off)
      (change requires restart)
  - name: recovery_target_timeline
    section: WRITE-AHEAD LOG
    subsection: Recovery Target
    default: '''latest'''
    description: |-
      'current', 'latest', or timeline ID
      (change requires restart)
  - name: recovery_target_action
    section: WRITE-AHEAD LOG
    subsection: Recovery Target
    default: '''pause'''
    description: |-
      'pause', 'promote', 'shutdown'
      (change requires restart)
  - name: summarize_wal
    section: WRITE-AHEAD LOG
    subsection: WAL Summarization
    default: 'off'
    description: run WAL summarizer process?
  - name: wal_summary_keep_time
    section: WRITE-AHEAD LOG
    subsection: WAL Summarization
    default: '''10d'''
    description: when to remove old summary files, 0 = never
  - name: max_wal_senders
    section: REPLICATION
    subsection: Sending Servers
    default: '10'
    description: |-
      max number of walsender processes
      (change requires restart)
    intro: Set these on the primary and on any standby that will send replication data.
  - name: max_replication_slots
    section: REPLICATION
    subsection: Sending Servers
    default: '10'
    description: |-
      max number of replication slots
