      (change requires restart)
  - name: log_min_messages
    section: REPORTING AND LOGGING
    subsection: When to Log
    default: '''warning'''
    description: |-
      comma-separated list of
      process_type:level entries, plus
      one freestanding level as default.
      Valid process types are:
      archiver              autovacuum
      backend               bgworker
      bgwriter              checkpointer
      ioworker              postmaster
      slotsyncworker        startup
      syslogger             walreceiver
      walsummarizer         walwriter
      walsender

      Level values in order of decreasing
      detail:
      debug5
      debug4
      debug3
      debug2
      debug1
      info
      notice
      warning
      error
      log
      fatal
      panic
  - name: log_min_error_statement
    section: REPORTING AND LOGGING
    subsection: When to Log
    default: error
    description: |-
      values in order of decreasing detail:
      debug5
      debug4
      debug3
      debug2
      debug1
      info
      notice
      warning
      error
      log
      fatal
      panic (effectively off)
  - name: log_min_duration_statement
