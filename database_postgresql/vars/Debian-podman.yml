---

database_postgresql__packages:
  - 'libpq5'
  - 'python3-psycopg2'

database_postgresql__data_dir: "{{ '/var/lib/postgresql' if database_postgresql__version | int >= 18 else '/var/lib/postgresql/data' }}"
database_postgresql__backup_dir: '/backup'

database_postgresql__podman_target_dir: "{{ database_postgresql__podman_data_dir + '/' + database_postgresql__version | string + '/docker' if database_postgresql__version | int >= 18 else database_postgresql__podman_data_dir }}"

database_postgresql__addresses: '*'
