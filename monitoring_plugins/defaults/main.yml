---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-plugins
#

monitoring_plugins__plugins: "{{ monitoring_plugins | default([]) }}"
monitoring_plugins__prune: "{{ monitoring_plugins_prune | default(true) }}"

monitoring_plugins__mysql_credentials: "{{ monitoring_plugins_mysql_credentials | default({}) }}"
monitoring_plugins__postgresql_credentials: >-
  {{ {'host': 'localhost', 'port': 5432} | combine(monitoring_plugins_postgresql_credentials | default({})) }}

monitoring_plugins__user: "{{ icinga_user | default('nagios') }}"
monitoring_plugins__group: "{{ icinga_group | default(monitoring_plugins__user) }}"

monitoring_plugins__plugin_local_dir: "{{ monitoring_plugin_local_dir | default('/usr/local/lib/nagios/plugins') }}"
monitoring_plugins__plugin_etc_dir: "{{ monitoring_plugin_etc_dir | default('/usr/local/etc/icinga2') }}"
