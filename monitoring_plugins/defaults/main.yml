---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-plugins
#

monitoring_plugins__check_certexp: "{{ monitoring_check_certexp | default(false) }}"
monitoring_plugins__check_docker: "{{ monitoring_check_docker | default(false) }}"
monitoring_plugins__check_podman: "{{ monitoring_check_podman | default(false) }}"
monitoring_plugins__check_mem: "{{ monitoring_check_mem | default(false) }}"
monitoring_plugins__check_nginx: "{{ monitoring_check_nginx | default(false) }}"
monitoring_plugins__check_phpfpm: "{{ monitoring_check_phpfpm | default(false) }}"
monitoring_plugins__check_reboot: "{{ monitoring_check_reboot | default(false) }}"
monitoring_plugins__check_systemd: "{{ monitoring_check_systemd | default(false) }}"

monitoring_plugins__notification_pushover: "{{ monitoring_pushover | default(false) }}"
monitoring_plugins__notification_rocketchat: "{{ monitoring_rocketchat | default(false) }}"

monitoring_plugins__credentials_mariadb: "{{ monitoring_credentials_mariadb | default(false) }}"
monitoring_plugins__credentials_mariadb_user: "{{ monitoring_credentials_mariadb_user | mandatory }}"
monitoring_plugins__credentials_mariadb_password: "{{ monitoring_credentials_mariadb_password | mandatory }}"
monitoring_plugins__credentials_mysql: "{{ monitoring_credentials_mysql | default(false) }}"
monitoring_plugins__credentials_mysql_user: "{{ monitoring_credentials_mysql_user | mandatory }}"
monitoring_plugins__credentials_mysql_password: "{{ monitoring_credentials_mysql_password | mandatory }}"

monitoring_plugins__user: "{{ icinga_user | default('nagios') }}"
monitoring_plugins__group: "{{ icinga_group | default(monitoring_plugins__user) }}"

monitoring_plugins__plugin_local_dir: "{{ monitoring_plugin_local_dir | default('/usr/local/lib/nagios/plugins') }}"
monitoring_plugins__plugin_etc_dir: "{{ monitoring_plugin_etc_dir | default('/usr/local/etc/icinga2') }}"

#
# Defaults - do not change
#

monitoring_plugins__rocketchat_plugin: "{{ monitoring_plugins__rocketchat_plugins[ansible_architecture] }}"

monitoring_plugins__rocketchat_plugins:
  x86_64: 'notify_rocketchat.amd64'
  aarch64: 'notify_rocketchat.arm64'
  armv7l: 'notify_rocketchat.arm'

