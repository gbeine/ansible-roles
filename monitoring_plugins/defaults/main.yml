---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-plugins
#

monitoring_plugins__plugins: "{{ monitoring_plugins | default([]) }}"
monitoring_plugins__prune: "{{ monitoring_plugins_prune | default(true) }}"

monitoring_plugins__mysql_credentials: "{{ monitoring_plugins_mysql_credentials | default({}) }}"
monitoring_plugins__postgresql_credentials: "{{ monitoring_plugins__postgresql_credentials_default | combine(monitoring_plugins_postgresql_credentials | default({})) }}"

# The user and the group Icinga runs as
monitoring_plugins__user: "{{ monitoring_plugins_user | default('nagios') }}"
monitoring_plugins__group: "{{ monitoring_plugins_group | default(monitoring_plugins__user) }}"

monitoring_plugins__plugin_local_dir: "{{ monitoring_plugins_local_dir | default('/usr/local/lib/nagios/plugins') }}"
monitoring_plugins__plugin_etc_dir: "{{ monitoring_plugins_etc_dir | default('/usr/local/etc/icinga2') }}"

#
# Defaults - do not change
#

monitoring_plugins__postgresql_credentials_default:
  host: 'localhost'
  port: 5432

#
# Catalog of the plugins
#
# files:   copied from files/ to the local plugin directory
# configs: Icinga configuration generated from templates/<name>.j2 to the Icinga configuration directory
# sudo:    commands the Icinga user may run with sudo, written to sudoers.d/icinga-run-<name>
#
monitoring_plugins__catalog:

  - name: 'borg_repository_status'
    files: [ 'check_borg_repository_status' ]
    configs: [ 'check_borg_repository_status.conf' ]
    sudo: [ "{{ monitoring_plugins__plugin_local_dir }}/check_borg_repository_status" ]

  - name: 'certexp'
    files: [ 'check_certexp.pl' ]
    configs: [ 'check_certexp.conf' ]

  - name: 'container_stats_docker'
    files: [ 'check_container_stats_docker.py' ]
    configs: [ 'check_container_stats_docker.conf' ]

  - name: 'container_stats_podman'
    files: [ 'check_container_stats_podman.py' ]
    configs: [ 'check_container_stats_podman.conf' ]
    sudo: [ "{{ monitoring_plugins__plugin_local_dir }}/check_container_stats_podman.py" ]

  # The CheckCommands dsa-* of the plugins of DSA in monitoring-plugins-contrib
  - name: 'dsa'
    configs: [ 'commands-dsa.conf' ]

  - name: 'logfiles'

  # The CheckCommands madrisan-* of the plugins of Davide Madrisan
  - name: 'madrisan'
    configs: [ 'commands-madrisan.conf' ]

  # MySQL and MariaDB use the plugins of the packages, mariadb is an alias of mysql
  - name: 'mariadb'

  - name: 'mysql'

  - name: 'nginx'
    files: [ 'check_nginx_status.pl' ]
    configs: [ 'check_nginx_status.conf' ]

  - name: 'pass_alive'
    files: [ 'check_pass_alive' ]
    configs: [ 'check_pass_alive.conf' ]
    sudo: [ "{{ monitoring_plugins__plugin_local_dir }}/check_pass_alive" ]

  - name: 'pgactivity'
    files: [ 'check_pgactivity.pl' ]
    configs: [ 'check_pgactivity.conf' ]

  - name: 'phpfpm'
    files: [ 'check_phpfpm_status.pl' ]
    configs: [ 'check_phpfpm_status.conf' ]

  - name: 'printer_snmp'
    files: [ 'check_printer_snmp.py' ]
    configs: [ 'check_printer_snmp.conf' ]

  - name: 'pushover'
    files: [ 'pushover.sh' ]
    configs: [ 'pushover.conf' ]

  - name: 'raid'
    configs: [ 'check_raid.conf' ]
    sudo: [ '/sbin/dmsetup', '/usr/sbin/dmsetup' ]

  - name: 'reboot'
    files: [ 'check_reboot' ]
    configs: [ 'check_reboot.conf' ]

  - name: 'running_kernel'

  - name: 'smart'
    configs: [ 'check_smart.conf' ]
    sudo:
      - "{{ monitoring_plugins__plugin_dir }}/check_smart.pl"
      - '/usr/sbin/smartctl'

  - name: 'systemd'

  - name: 'tls_cert'
    files: [ 'check_tls_cert.py' ]
    configs: [ 'check_tls_cert.conf' ]

monitoring_plugins__selected: "{{ monitoring_plugins__catalog | selectattr('name', 'in', monitoring_plugins__plugins) | list }}"
monitoring_plugins__unselected: "{{ monitoring_plugins__catalog | rejectattr('name', 'in', monitoring_plugins__plugins) | list }}"

# The credentials of MySQL and MariaDB are only used with one of their plugins, they are ignored otherwise
monitoring_plugins__mysql_enabled: "{{ monitoring_plugins__plugins | select('in', [ 'mysql', 'mariadb' ]) | list | length > 0 }}"
monitoring_plugins__mysql_store: "{{ monitoring_plugins__mysql_enabled | bool and monitoring_plugins__mysql_credentials | length > 0 }}"
