---
monitoring_plugins__test_local_dir: '/usr/local/lib/nagios/plugins'
monitoring_plugins__test_etc_dir: '/usr/local/etc/icinga2'
monitoring_plugins__test_home_dir: '/var/lib/nagios'

monitoring_plugins__test_cases:

  # Without variables the role creates only the directories
  - name: 'molecule-plugins-default'
    role_vars: {}
    expect:
      files: []
      links: []
      configs: []
      sudoers: []
      credentials: []
      absent: []

  - name: 'molecule-plugins'
    role_vars:
      monitoring_plugins:
        - 'borg_repository_status'
        - 'certexp'
        - 'container_stats_docker'
        - 'container_stats_podman'
        - 'logfiles'
        - 'mem'
        - 'nginx'
        - 'pass_alive'
        - 'pgactivity'
        - 'phpfpm'
        - 'printer_snmp'
        - 'pushover'
        - 'raid'
        - 'reboot'
        - 'rocketchat'
        - 'running_kernel'
        - 'smart'
        - 'systemd'
        - 'tls_cert'
      monitoring_plugins_postgresql_credentials:
        user: 'molecule'
        password: 'molecule-pg-password'
      monitoring_plugins_mysql_credentials:
        user: 'molecule'
        password: 'molecule-mysql-password'
    # side_effect removes these plugins, verify expects them to be gone
    side_effect_remove: [ 'pushover', 'reboot' ]
    expect:
      files:
        - 'check_borg_repository_status'
        - 'check_certexp.pl'
        - 'check_container_stats_docker.py'
        - 'check_container_stats_podman.py'
        - 'check_mem.pl'
        - 'check_nginx_status.pl'
        - 'check_pass_alive'
        - 'check_pgactivity.pl'
        - 'check_phpfpm_status.pl'
        - 'check_printer_snmp.py'
        - 'check_tls_cert.py'
        - 'notify_rocketchat'
      links: [ 'check_logfiles', 'check_raid', 'check_running_kernel', 'check_systemd' ]
      configs:
        - 'check_borg_repository_status.conf'
        - 'check_certexp.conf'
        - 'check_container_stats_docker.conf'
        - 'check_container_stats_podman.conf'
        - 'check_nginx_status.conf'
        - 'check_pass_alive.conf'
        - 'check_pgactivity.conf'
        - 'check_phpfpm_status.conf'
        - 'check_printer_snmp.conf'
        - 'check_raid.conf'
        - 'check_smart.conf'
        - 'check_tls_cert.conf'
        - 'rocketchat.conf'
      sudoers:
        - 'icinga-run-borg-repository-status'
        - 'icinga-run-container-stats-podman'
        - 'icinga-run-pass-alive'
        - 'icinga-run-raid'
        - 'icinga-run-smart'
      credentials: [ '.my.cnf', '.pg_service.conf', '.pgpass' ]
      absent:
        - '/usr/local/lib/nagios/plugins/check_reboot'
        - '/usr/local/lib/nagios/plugins/pushover.sh'
        - '/usr/local/etc/icinga2/check_reboot.conf'
        - '/usr/local/etc/icinga2/pushover.conf'
      # Syntax checks, they need the Perl modules and Python of the packages
      syntax:
        - [ 'perl', '-c', 'check_certexp.pl' ]
        - [ 'perl', '-c', 'check_mem.pl' ]
        - [ 'perl', '-c', 'check_nginx_status.pl' ]
        - [ 'perl', '-c', 'check_pgactivity.pl' ]
        - [ 'perl', '-c', 'check_phpfpm_status.pl' ]
        - [ 'bash', '-n', 'check_pass_alive' ]
        - [ 'python3', 'check_borg_repository_status', '--help' ]
        - [ 'python3', 'check_container_stats_docker.py', '--help' ]
        - [ 'python3', 'check_container_stats_podman.py', '--help' ]
        - [ 'python3', 'check_printer_snmp.py', '--help' ]
        - [ 'python3', 'check_tls_cert.py', '--help' ]
      # Checks run as the Icinga user, they must return OK, WARNING or CRITICAL
      checks:
        - [ 'check_mem.pl', '-f', '-w', '10', '-c', '5' ]
        - [ 'check_systemd' ]
      # Checks run as the Icinga user that have to return UNKNOWN with the expected output,
      # without an SNMP agent snmpwalk fails, without snmpwalk the output would be 'snmpwalk not found'
      unknown_checks:
        - command: [ 'check_printer_snmp.py', '-H', '127.0.0.1', '--check', 'toner', '-t', '1' ]
          search: '^UNKNOWN - SNMP '
      sudo_commands:
        - '/usr/sbin/smartctl'
        - '/usr/lib/nagios/plugins/check_smart.pl'
        - '/usr/sbin/dmsetup'
        - '/usr/local/lib/nagios/plugins/check_container_stats_podman.py'
