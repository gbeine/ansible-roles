---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  tasks:

    - name: 'Install Icinga 2 and the monitoring plugins, they create the Icinga user'
      ansible.builtin.apt:
        pkg: [ 'icinga2', 'monitoring-plugins' ]
        install_recommends: false
        update_cache: true

    - name: 'Define the local plugin directory like monitoring_icinga_agent'
      ansible.builtin.lineinfile:
        path: '/etc/icinga2/constants.conf'
        line: 'const PluginLocalDir = "{{ monitoring_plugins__test_local_dir }}"'

    - name: 'Include the local Icinga configuration like monitoring_icinga_agent'
      ansible.builtin.lineinfile:
        path: '/etc/icinga2/icinga2.conf'
        line: 'include_recursive "{{ monitoring_plugins__test_etc_dir }}"'
