---
- name: 'Side effect'
  hosts: 'molecule-plugins'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_plugins__test_case: "{{ monitoring_plugins__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  tasks:

    - name: 'Set the role variables without the removed plugins'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: >-
        {{ monitoring_plugins__test_case.role_vars
           | combine({'monitoring_plugins': monitoring_plugins__test_case.role_vars.monitoring_plugins
                                            | reject('in', monitoring_plugins__test_case.side_effect_remove) | list})
           | dict2items }}
      loop_control:
        label: "{{ item.key }}"

    - name: 'Run monitoring_plugins without the removed plugins'
      ansible.builtin.include_role:
        name: 'monitoring_plugins'
