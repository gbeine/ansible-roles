---
# Runs monitoring_plugins with the invalid role variables passed as include parameters,
# the role has to fail before the checked files change.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run monitoring_plugins with invalid variables (expect ERROR): {{ monitoring_plugins__test_invalid.message }}"
  block:

    - name: 'Run monitoring_plugins, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'monitoring_plugins'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ monitoring_plugins__test_invalid.message }}"

  rescue:

    - name: 'Read the checksums of the checked files after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ monitoring_plugins__test_case.checked_files }}"
      register: 'monitoring_plugins__test_md5_after'

    - name: 'Assert the run failed before the checked files changed'
      ansible.builtin.assert:
        that:
          - monitoring_plugins__test_failure is search(monitoring_plugins__test_invalid.search, multiline=true)
          - monitoring_plugins__test_before | select('equalto', '') | list | length == 0
          - monitoring_plugins__test_after == monitoring_plugins__test_before
        fail_msg: >-
          Failure: {{ monitoring_plugins__test_failure }}
          Checksums before: {{ monitoring_plugins__test_before | join(', ') }},
          after: {{ monitoring_plugins__test_after | join(', ') }}.
      vars:
        monitoring_plugins__test_failure: "{{ ansible_failed_result.msg | default('') }}"
        monitoring_plugins__test_before: "{{ monitoring_plugins__test_md5_before.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
        monitoring_plugins__test_after: "{{ monitoring_plugins__test_md5_after.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
