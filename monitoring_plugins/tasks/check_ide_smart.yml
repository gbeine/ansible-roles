---

- name: 'Generate IDE S.M.A.R.T. monitoring plugin configuration file'
  ansible.builtin.template:
    src: 'check_ide_smart.conf.j2'
    dest: "{{ monitoring_plugins__plugin_etc_dir }}/check_ide_smart.conf"
    owner: "{{ monitoring_plugins__user }}"
    group: "{{ monitoring_plugins__group }}"
    mode: '644'

- name: 'Add sudoers entry for podman monitoring plugin'
  community.general.sudoers:
    name: 'icinga-run-ide-smart'
    state: 'present'
    user: 'nagios'
    commands:
      - '/usr/lib/nagios/plugins/check_ide_smart'
