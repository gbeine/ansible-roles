---

- name: 'Copy borg repository status monitoring plugin to host'
  ansible.builtin.copy:
    src: 'check_borg_repository_status'
    dest: "{{ monitoring_plugins__plugin_local_dir }}/check_borg_repository_status"
    mode: '755'

- name: 'Generate borg repository status monitoring plugin configuration file'
  ansible.builtin.template:
    src: 'check_borg_repository_status.conf.j2'
    dest: "{{ monitoring_plugins__plugin_etc_dir }}/check_borg_repository_status.conf"
    owner: "{{ monitoring_plugins__user }}"
    group: "{{ monitoring_plugins__group }}"
    mode: '644'

- name: 'Add sudoers entry for borg repository status monitoring plugin'
  community.general.sudoers:
    name: 'icinga-run-borg-repository-status'
    state: 'present'
    user: 'nagios'
    commands:
      - "{{ monitoring_plugins__plugin_local_dir }}/check_borg_repository_status"
