---

- name: 'Install and configure monitoring plugins'
  tags: [ 'monitoring_plugins' ]
  block:

    - name: 'Include OS-specific variables'
      ansible.builtin.include_vars: "{{ item }}"
      loop: "{{ query('ansible.builtin.first_found', monitoring_plugins__os_vars) }}"
      vars:
        monitoring_plugins__os_vars:
          - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
          - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"

    - name: 'Validate plugins and credentials'
      ansible.builtin.assert:
        that:
          - monitoring_plugins__plugins is iterable and monitoring_plugins__plugins is not string and monitoring_plugins__plugins is not mapping
          - monitoring_plugins__unknown | length == 0
          - "'rocketchat' not in monitoring_plugins__plugins or monitoring_plugins__rocketchat_plugin | length > 0"
          - >-
            'pgactivity' not in monitoring_plugins__plugins
            or (monitoring_plugins__postgresql_credentials.user | default('') | string | length > 0
                and monitoring_plugins__postgresql_credentials.password | default('') | string | length > 0)
          - >-
            monitoring_plugins__mysql_credentials | length == 0
            or (monitoring_plugins__mysql_credentials.user | default('') | string | length > 0
                and monitoring_plugins__mysql_credentials.password | default('') | string | length > 0)
        fail_msg: >-
          monitoring_plugins must be a list of known plugins ({{ monitoring_plugins__catalog | map(attribute='name') | join(', ') }}),
          unknown: {{ monitoring_plugins__unknown | join(', ') | default('none', true) }}.
          rocketchat needs one of the architectures {{ monitoring_plugins__rocketchat_plugins.keys() | join(', ') }}.
          pgactivity needs user and password in monitoring_plugins_postgresql_credentials,
          monitoring_plugins_mysql_credentials needs user and password if set.
        quiet: true
      vars:
        monitoring_plugins__unknown: >-
          {{ (monitoring_plugins__plugins if monitoring_plugins__plugins is not string else [monitoring_plugins__plugins])
             | reject('in', monitoring_plugins__catalog | map(attribute='name') | list) | list }}

    - name: 'Install packages of the plugins'
      ansible.builtin.apt:
        pkg: >-
          {{ (monitoring_plugins__base_packages
              + (monitoring_plugins__packages | dict2items | selectattr('key', 'in', monitoring_plugins__plugins)
                 | map(attribute='value') | flatten))
             | unique }}
        install_recommends: false
        cache_valid_time: 3600
      when: monitoring_plugins__plugins | length > 0

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0755'
        state: 'directory'
      loop:
        - dest: "{{ monitoring_plugins__plugin_local_dir }}"
          owner: 'root'
          group: 'root'
        - dest: "{{ monitoring_plugins__plugin_etc_dir }}"
          owner: "{{ monitoring_plugins__user }}"
          group: "{{ monitoring_plugins__group }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: 'Copy plugins'
      ansible.builtin.copy:
        src: "{{ monitoring_plugins__file_sources[item.1] | default(item.1) }}"
        dest: "{{ monitoring_plugins__plugin_local_dir }}/{{ item.1 }}"
        owner: 'root'
        group: 'root'
        mode: '0755'
      loop: "{{ monitoring_plugins__selected | subelements('files', skip_missing=true) }}"
      loop_control:
        label: "{{ item.0.name }}: {{ item.1 }}"

    - name: 'Link plugins of the packages'
      ansible.builtin.file:
        src: "{{ monitoring_plugins__plugin_dir }}/{{ item.1 }}"
        dest: "{{ monitoring_plugins__plugin_local_dir }}/{{ item.1 }}"
        state: 'link'
      loop: "{{ monitoring_plugins__selected | subelements('links', skip_missing=true) }}"
      loop_control:
        label: "{{ item.0.name }}: {{ item.1 }}"

    - name: 'Generate Icinga configuration of the plugins'
      ansible.builtin.template:
        src: "{{ item.1 }}.j2"
        dest: "{{ monitoring_plugins__plugin_etc_dir }}/{{ item.1 }}"
        owner: "{{ monitoring_plugins__user }}"
        group: "{{ monitoring_plugins__group }}"
        mode: '0644'
      loop: "{{ monitoring_plugins__selected | subelements('configs', skip_missing=true) }}"
      loop_control:
        label: "{{ item.0.name }}: {{ item.1 }}"

    - name: 'Add sudoers entries of the plugins'
      community.general.sudoers:
        name: "icinga-run-{{ item.name | replace('_', '-') }}"
        user: "{{ monitoring_plugins__user }}"
        commands: "{{ item.sudo }}"
        sudoers_path: "{{ monitoring_plugins__sudoers_dir }}"
        state: 'present'
      loop: "{{ monitoring_plugins__selected | selectattr('sudo', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: 'Store PostgreSQL credentials'
      no_log: true
      ansible.builtin.copy:
        dest: "{{ monitoring_plugins__home_dir }}/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "{{ monitoring_plugins__user }}"
        group: "{{ monitoring_plugins__group }}"
        mode: '0400'
      loop:
        - name: '.pg_service.conf'
          content: |
            [nagios]
            host={{ monitoring_plugins__postgresql_credentials.host }}
            port={{ monitoring_plugins__postgresql_credentials.port }}
            user={{ monitoring_plugins__postgresql_credentials.user }}
        - name: '.pgpass'
          content: |
            {{ [monitoring_plugins__postgresql_credentials.host, monitoring_plugins__postgresql_credentials.port, 'postgres',
                monitoring_plugins__postgresql_credentials.user, monitoring_plugins__postgresql_credentials.password] | join(':') }}
      when: "'pgactivity' in monitoring_plugins__plugins"

    - name: 'Store MySQL credentials'
      no_log: true
      ansible.builtin.copy:
        dest: "{{ monitoring_plugins__home_dir }}/.my.cnf"
        content: |
          [client]
          user={{ monitoring_plugins__mysql_credentials.user }}
          password={{ monitoring_plugins__mysql_credentials.password }}
        owner: "{{ monitoring_plugins__user }}"
        group: "{{ monitoring_plugins__group }}"
        mode: '0400'
      when: monitoring_plugins__mysql_credentials | length > 0

    - name: 'Remove plugins that are not selected'
      when: monitoring_plugins__prune | bool
      block:

        - name: 'Remove files of plugins that are not selected'
          ansible.builtin.file:
            dest: "{{ item }}"
            state: 'absent'
          loop: >-
            {{ (monitoring_plugins__unselected | map(attribute='files', default=[]) | flatten
                + monitoring_plugins__unselected | map(attribute='links', default=[]) | flatten)
               | map('regex_replace', '^', monitoring_plugins__plugin_local_dir + '/') | list
               + monitoring_plugins__unselected | map(attribute='configs', default=[]) | flatten
               | map('regex_replace', '^', monitoring_plugins__plugin_etc_dir + '/') | list
               + monitoring_plugins__legacy_files
               + ([] if 'pgactivity' in monitoring_plugins__plugins
                  else [monitoring_plugins__home_dir + '/.pg_service.conf', monitoring_plugins__home_dir + '/.pgpass'])
               + ([] if monitoring_plugins__mysql_credentials | length > 0 else [monitoring_plugins__home_dir + '/.my.cnf']) }}

        - name: 'Remove sudoers entries of plugins that are not selected'
          community.general.sudoers:
            name: "{{ item }}"
            sudoers_path: "{{ monitoring_plugins__sudoers_dir }}"
            state: 'absent'
          loop: >-
            {{ monitoring_plugins__unselected | selectattr('sudo', 'defined') | map(attribute='name')
               | map('replace', '_', '-') | map('regex_replace', '^', 'icinga-run-') | list
               + monitoring_plugins__legacy_sudoers }}
