---

- name: 'Install and configure monitoring plugins'
  tags: [ 'monitoring', 'monitoring_plugins' ]
  block:

    - name: 'Include OS-specific variables'
      ansible.builtin.include_vars: "{{ item }}"
      loop: "{{ query('ansible.builtin.first_found', monitoring_plugins__os_vars) }}"
      vars:
        monitoring_plugins__os_vars:
          - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
          - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"

    # A failing template in the variables (e.g. an unknown filter or monitoring_plugins_postgresql_credentials not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          - monitoring_plugins__plugins | length >= 0
          - monitoring_plugins__postgresql_credentials | length > 0
          - monitoring_plugins__mysql_credentials | length >= 0
        quiet: true

    - name: 'Validate the variables'
      ansible.builtin.assert:
        that:
          - monitoring_plugins__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_plugins__errors | join(' ') }}"
        quiet: true
      vars:
        monitoring_plugins__errors: >-
          {%- set errors = [] -%}
          {%- set plugins = monitoring_plugins__plugins -%}
          {%- set mysql = monitoring_plugins__mysql_credentials -%}
          {%- set postgresql = monitoring_plugins__postgresql_credentials -%}
          {%- if plugins is not sequence or plugins is string or plugins is mapping -%}
          {%-   set _ = errors.append('`monitoring_plugins` has to be a list of plugins.') -%}
          {%- else -%}
          {%-   set unknown = plugins | map('string') | reject('in', monitoring_plugins__catalog | map(attribute='name') | list) | list -%}
          {%-   if unknown | length > 0 -%}
          {%-     set _ = errors.append('Unknown plugins in `monitoring_plugins`: ' ~ (unknown | join(', ')) ~ ', allowed are '
                                      ~ (monitoring_plugins__catalog | map(attribute='name') | join(', ')) ~ '.') -%}
          {%-   endif -%}
          {%-   if 'pgactivity' in plugins and (postgresql.user | default('') | string | length == 0 or postgresql.password | default('') | string | length == 0) -%}
          {%-     set _ = errors.append('The plugin pgactivity needs user and password in `monitoring_plugins_postgresql_credentials`.') -%}
          {%-   endif -%}
          {%-   if mysql is mapping and plugins | select('in', [ 'mysql', 'mariadb' ]) | list | length > 0 and mysql | length > 0
                   and (mysql.user | default('') | string | length == 0 or mysql.password | default('') | string | length == 0) -%}
          {%-     set _ = errors.append('`monitoring_plugins_mysql_credentials` needs user and password.') -%}
          {%-   endif -%}
          {%- endif -%}
          {%- if monitoring_plugins__prune is not boolean -%}
          {%-   set _ = errors.append('`monitoring_plugins_prune` has to be true or false.') -%}
          {%- endif -%}
          {%- if mysql is not mapping -%}
          {%-   set _ = errors.append('`monitoring_plugins_mysql_credentials` has to be a dictionary.') -%}
          {%- endif -%}
          {%- set lines = (postgresql | dict2items | map(attribute='value') | map('string') | select('search', '[\r\n]') | list | length > 0)
                          or (mysql is mapping and mysql | dict2items | map(attribute='value') | map('string') | select('search', '[\r\n]') | list | length > 0) -%}
          {%- if lines -%}
          {%-   set _ = errors.append('The credentials must not contain line breaks.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Install packages of the plugins'
      ansible.builtin.apt:
        pkg: >-
          {{ (monitoring_plugins__base_packages
              + (monitoring_plugins__packages | dict2items | selectattr('key', 'in', monitoring_plugins__plugins)
                 | map(attribute='value') | flatten))
             | unique }}
        install_recommends: false
        cache_valid_time: 3600
      when: monitoring_plugins__plugins | length > 0

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0755'
        state: 'directory'
      loop:
        - dest: "{{ monitoring_plugins__plugin_local_dir }}"
          owner: 'root'
          group: 'root'
        - dest: "{{ monitoring_plugins__plugin_etc_dir }}"
          owner: "{{ monitoring_plugins__user }}"
          group: "{{ monitoring_plugins__group }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: 'Copy plugins'
      ansible.builtin.copy:
        src: "{{ item.1 }}"
        dest: "{{ monitoring_plugins__plugin_local_dir }}/{{ item.1 }}"
        owner: 'root'
        group: 'root'
        mode: '0755'
      loop: "{{ monitoring_plugins__selected | subelements('files', skip_missing=true) }}"
      loop_control:
        label: "{{ item.0.name }}: {{ item.1 }}"

    - name: 'Generate Icinga configuration of the plugins'
      ansible.builtin.template:
        src: "{{ item.1 }}.j2"
        dest: "{{ monitoring_plugins__plugin_etc_dir }}/{{ item.1 }}"
        owner: "{{ monitoring_plugins__user }}"
        group: "{{ monitoring_plugins__group }}"
        mode: '0644'
      loop: "{{ monitoring_plugins__selected | subelements('configs', skip_missing=true) }}"
      loop_control:
        label: "{{ item.0.name }}: {{ item.1 }}"

    - name: 'Add sudoers entries of the plugins'
      community.general.sudoers:
        name: "icinga-run-{{ item.name | replace('_', '-') }}"
        user: "{{ monitoring_plugins__user }}"
        commands: "{{ item.sudo }}"
        sudoers_path: "{{ monitoring_plugins__sudoers_dir }}"
        state: 'present'
      loop: "{{ monitoring_plugins__selected | selectattr('sudo', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: 'Store PostgreSQL credentials'
      no_log: true
      ansible.builtin.copy:
        dest: "{{ monitoring_plugins__home_dir }}/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "{{ monitoring_plugins__user }}"
        group: "{{ monitoring_plugins__group }}"
        mode: '0400'
      loop:
        - name: '.pg_service.conf'
          content: |
            [nagios]
            host={{ monitoring_plugins__postgresql_credentials.host }}
            port={{ monitoring_plugins__postgresql_credentials.port }}
            user={{ monitoring_plugins__postgresql_credentials.user }}
        # libpq reads \\ as \ and \: as : in the fields of .pgpass
        - name: '.pgpass'
          content: |
            {{ [monitoring_plugins__postgresql_credentials.host, monitoring_plugins__postgresql_credentials.port, 'postgres',
                monitoring_plugins__postgresql_credentials.user, monitoring_plugins__postgresql_credentials.password]
               | map('string') | map('replace', monitoring_plugins__backslash, monitoring_plugins__backslash ~ monitoring_plugins__backslash)
               | map('replace', ':', monitoring_plugins__backslash ~ ':') | join(':') }}
      when: "'pgactivity' in monitoring_plugins__plugins"
      vars:
        # A single backslash, Jinja keeps backslashes in strings of templates
        monitoring_plugins__backslash: '\'

    - name: 'Store MySQL credentials'
      no_log: true
      ansible.builtin.copy:
        dest: "{{ monitoring_plugins__home_dir }}/.my.cnf"
        content: |
          [client]
          user={{ monitoring_plugins__mysql_credentials.user }}
          password={{ monitoring_plugins__mysql_credentials.password }}
        owner: "{{ monitoring_plugins__user }}"
        group: "{{ monitoring_plugins__group }}"
        mode: '0400'
      when: monitoring_plugins__mysql_store | bool

    - name: 'Remove plugins that are not selected'
      when: monitoring_plugins__prune | bool
      block:

        - name: 'Remove files of plugins that are not selected'
          ansible.builtin.file:
            dest: "{{ item }}"
            state: 'absent'
          loop: >-
            {{ monitoring_plugins__unselected | map(attribute='files', default=[]) | flatten
               | map('regex_replace', '^', monitoring_plugins__plugin_local_dir + '/') | list
               + monitoring_plugins__unselected | map(attribute='configs', default=[]) | flatten
               | map('regex_replace', '^', monitoring_plugins__plugin_etc_dir + '/') | list
               + ([] if 'pgactivity' in monitoring_plugins__plugins
                  else [monitoring_plugins__home_dir + '/.pg_service.conf', monitoring_plugins__home_dir + '/.pgpass'])
               + ([] if monitoring_plugins__mysql_store | bool else [monitoring_plugins__home_dir + '/.my.cnf']) }}

        - name: 'Remove sudoers entries of plugins that are not selected'
          community.general.sudoers:
            name: "{{ item }}"
            sudoers_path: "{{ monitoring_plugins__sudoers_dir }}"
            state: 'absent'
          loop: >-
            {{ monitoring_plugins__unselected | selectattr('sudo', 'defined') | map(attribute='name')
               | map('replace', '_', '-') | map('regex_replace', '^', 'icinga-run-') | list }}
