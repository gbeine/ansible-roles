---

#
# Catalog of the plugins
#
# files:   copied from files/ to the local plugin directory, see monitoring_plugins__file_sources for different sources
# links:   plugins of Debian packages linked into the local plugin directory
# configs: Icinga configuration generated from templates/<name>.j2 to the Icinga configuration directory
# sudo:    commands the Icinga user may run with sudo, written to sudoers.d/icinga-run-<name>
#
monitoring_plugins__catalog:

  - name: 'borg_repository_status'
    files: [ 'check_borg_repository_status' ]
    configs: [ 'check_borg_repository_status.conf' ]
    sudo: [ "{{ monitoring_plugins__plugin_local_dir }}/check_borg_repository_status" ]

  - name: 'certexp'
    files: [ 'check_certexp.pl' ]
    configs: [ 'check_certexp.conf' ]

  - name: 'container_stats_docker'
    files: [ 'check_container_stats_docker.py' ]
    configs: [ 'check_container_stats_docker.conf' ]

  - name: 'container_stats_podman'
    files: [ 'check_container_stats_podman.py' ]
    configs: [ 'check_container_stats_podman.conf' ]
    sudo: [ "{{ monitoring_plugins__plugin_local_dir }}/check_container_stats_podman.py" ]

  - name: 'logfiles'
    links: [ 'check_logfiles' ]

  - name: 'mem'
    files: [ 'check_mem.pl' ]

  - name: 'nginx'
    files: [ 'check_nginx_status.pl' ]
    configs: [ 'check_nginx_status.conf' ]

  - name: 'pass_alive'
    files: [ 'check_pass_alive' ]
    configs: [ 'check_pass_alive.conf' ]
    sudo: [ "{{ monitoring_plugins__plugin_local_dir }}/check_pass_alive" ]

  - name: 'pgactivity'
    files: [ 'check_pgactivity.pl' ]
    configs: [ 'check_pgactivity.conf' ]

  - name: 'phpfpm'
    files: [ 'check_phpfpm_status.pl' ]
    configs: [ 'check_phpfpm_status.conf' ]

  - name: 'printer_snmp'
    files: [ 'check_printer_snmp.py' ]
    configs: [ 'check_printer_snmp.conf' ]

  - name: 'pushover'
    files: [ 'pushover.sh' ]
    configs: [ 'pushover.conf' ]

  - name: 'raid'
    links: [ 'check_raid' ]
    configs: [ 'check_raid.conf' ]
    sudo: [ '/sbin/dmsetup', '/usr/sbin/dmsetup' ]

  - name: 'reboot'
    files: [ 'check_reboot' ]
    configs: [ 'check_reboot.conf' ]

  - name: 'rocketchat'
    files: [ 'notify_rocketchat' ]
    configs: [ 'rocketchat.conf' ]

  - name: 'running_kernel'
    links: [ 'check_running_kernel' ]

  - name: 'smart'
    configs: [ 'check_smart.conf' ]
    sudo:
      - "{{ monitoring_plugins__plugin_dir }}/check_smart.pl"
      - '/usr/sbin/smartctl'

  - name: 'systemd'
    links: [ 'check_systemd' ]

  - name: 'tls_cert'
    files: [ 'check_tls_cert.py' ]
    configs: [ 'check_tls_cert.conf' ]

# Files and sudoers entries written by earlier versions of the role, removed when pruning
monitoring_plugins__legacy_files:
  - "{{ monitoring_plugins__plugin_etc_dir }}/check_ide_smart.conf"
  - "{{ monitoring_plugins__plugin_etc_dir }}/check_smartpl.conf"
  - "{{ monitoring_plugins__plugin_etc_dir }}/notifiy_rocketchat.conf"
  - "{{ monitoring_plugins__plugin_local_dir }}/check_tls_cert"
  - "{{ monitoring_plugins__plugin_local_dir }}/pushover.pl"
monitoring_plugins__legacy_sudoers:
  - 'icinga-run-ide-smart'
  - 'icinga-run-podman'

# Sources in files/ of plugins with a different name in the local plugin directory
monitoring_plugins__file_sources:
  notify_rocketchat: "{{ monitoring_plugins__rocketchat_plugin }}"

monitoring_plugins__rocketchat_plugin: "{{ monitoring_plugins__rocketchat_plugins[ansible_facts['architecture']] | default('') }}"
monitoring_plugins__rocketchat_plugins:
  x86_64: 'notify_rocketchat.amd64'
  aarch64: 'notify_rocketchat.arm64'
  armv7l: 'notify_rocketchat.arm'

monitoring_plugins__selected: "{{ monitoring_plugins__catalog | selectattr('name', 'in', monitoring_plugins__plugins) | list }}"
monitoring_plugins__unselected: "{{ monitoring_plugins__catalog | rejectattr('name', 'in', monitoring_plugins__plugins) | list }}"
