---
monitoring_plugins__home_dir: '/var/lib/nagios'
monitoring_plugins__plugin_dir: '/usr/lib/nagios/plugins'

monitoring_plugins__check_certexp_packages:
  - 'libdate-manip-perl'
  - 'libnet-ssleay-perl'

monitoring_plugins__check_logfiles_packages:
  - 'monitoring-plugins-check-logfiles'

monitoring_plugins__check_nginx_packages:
  - 'libwww-perl'

monitoring_plugins__check_pgactivity_packages:
  - 'postgresql-client'

monitoring_plugins__check_phpfpm_packages:
  - 'libfcgi-client-perl'

monitoring_plugins__check_raid_packages:
  - 'dmsetup'
  - 'monitoring-plugins-contrib'
  - 'sudo'

monitoring_plugins__check_reboot_packages:
  - 'bash'

monitoring_plugins__check_running_kernel_packages:
  - 'monitoring-plugins-contrib'

monitoring_plugins__check_smart_packages:
  - 'libjson-xs-perl'
  - 'monitoring-plugins-check-smart'
  - 'monitoring-plugins-check-smart-attributes'
  - 'smartmontools'
  - 'sudo'

monitoring_plugins__check_systemd_packages:
  - 'monitoring-plugins-systemd'
  - 'python3-nagiosplugin'

monitoring_plugins__pushover_packages:
  - 'curl'
