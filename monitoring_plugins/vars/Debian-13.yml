---

monitoring_plugins__home_dir: '/var/lib/nagios'
monitoring_plugins__plugin_dir: '/usr/lib/nagios/plugins'
monitoring_plugins__sudoers_dir: '/etc/sudoers.d'

# Packages needed by all selected plugins
monitoring_plugins__base_packages:
  - 'monitoring-plugins-common'
  - 'sudo'

# Packages needed by the plugins, by name of the plugin
monitoring_plugins__packages:
  borg_repository_status: [ 'python3' ]
  certexp: [ 'libdate-manip-perl', 'libnet-ssleay-perl' ]
  container_stats_docker: [ 'python3' ]
  container_stats_podman: [ 'python3' ]
  logfiles: [ 'monitoring-plugins-check-logfiles' ]
  mem: [ 'perl' ]
  nginx: [ 'libwww-perl' ]
  pass_alive: [ 'bash' ]
  pgactivity: [ 'postgresql-client' ]
  phpfpm: [ 'libfcgi-client-perl' ]
  pushover: [ 'bash', 'curl' ]
  raid: [ 'dmsetup', 'monitoring-plugins-contrib' ]
  reboot: [ 'bash' ]
  running_kernel: [ 'monitoring-plugins-contrib' ]
  smart: [ 'libjson-xs-perl', 'monitoring-plugins-check-smart', 'monitoring-plugins-check-smart-attributes', 'smartmontools' ]
  systemd: [ 'monitoring-plugins-systemd', 'python3-nagiosplugin' ]
  tls_cert: [ 'openssl', 'python3' ]
