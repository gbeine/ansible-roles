---

- name: 'Deploy mautrix Signal bridge container'
  tags: [ 'mautrix_bridge_signal' ]
  block:

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        owner: "{{ mautrix_bridge_signal__uid }}"
        group: "{{ mautrix_bridge_signal__gid }}"
        mode: "{{ item.mode | default('0755') }}"
        state: 'directory'
      with_items:
        - dest: "{{ mautrix_bridge_signal__podman_home }}"

    - name: "Has configuration been generate?"
      ansible.builtin.stat:
        path: "{{ mautrix_bridge_signal__podman_home }}/config.yaml"
      register: 'mautrix_bridge_signal_configuration_stat_result'

    - name: 'Generate mautrix whatsapp bridge configuration'
      when: 'not mautrix_bridge_signal_configuration_stat_result.stat.exists'
      block:
        - name: 'Generate mautrix whatsapp bridge configuration'
          containers.podman.podman_container:
            name: "{{ mautrix_bridge_signal__container.name }}-generate"
            hostname: "{{ mautrix_bridge_signal__container.hostname }}"
            image: "{{ mautrix_bridge_signal__container.image }}"
            ip: "{{ mautrix_bridge_signal__container.ip }}"
            network: "{{ mautrix_bridge_signal__container.network }}"
            env: "{{ mautrix_bridge_signal__container.environment }}"
            timezone: "{{ mautrix_bridge_signal__container.timezone }}"
            volume: "{{ mautrix_bridge_signal__container.volumes }}"
            rm: true
          when: 'mautrix_bridge_signal__ipv6 | length == 0'

        - name: 'Generate mautrix whatsapp bridge configuration'
          containers.podman.podman_container:
            name: "{{ mautrix_bridge_signal__container.name }}-generate"
            hostname: "{{ mautrix_bridge_signal__container.hostname }}"
            image: "{{ mautrix_bridge_signal__container.image }}"
            ip: "{{ mautrix_bridge_signal__container.ip }}"
            ip6: "{{ mautrix_bridge_signal__container.ipv6 }}"
            network: "{{ mautrix_bridge_signal__container.network }}"
            env: "{{ mautrix_bridge_signal__container.environment }}"
            timezone: "{{ mautrix_bridge_signal__container.timezone }}"
            volume: "{{ mautrix_bridge_signal__container.volumes }}"
            rm: true
          when: 'mautrix_bridge_signal__ipv6 | length > 0'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ mautrix_bridge_signal__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[mautrix_bridge_signal__container.name + ".service"] is defined'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ mautrix_bridge_signal__podman_image }}"
        tag: "{{ mautrix_bridge_signal__podman_tag }}"
      when: 'podman___update_mode | bool'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ mautrix_bridge_signal__container.name }}"
        hostname: "{{ mautrix_bridge_signal__container.hostname }}"
        image: "{{ mautrix_bridge_signal__container.image }}"
        ip: "{{ mautrix_bridge_signal__container.ip }}"
        network: "{{ mautrix_bridge_signal__container.network }}"
        timezone: "{{ mautrix_bridge_signal__container.timezone }}"
        dns_servers: "{{ mautrix_bridge_signal__container.dns_servers }}"
        env: "{{ mautrix_bridge_signal__container.environment }}"
        volume: "{{ mautrix_bridge_signal__container.volumes }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if mautrix_bridge_signal__container.requires is defined %}
          Requires={{ mautrix_bridge_signal__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | default(false) }}"
      when: |
        mautrix_bridge_signal__ipv6 | length == 0
        and mautrix_bridge_signal_configuration_stat_result.stat.exists
        and not mautrix_bridge_signal__setup

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ mautrix_bridge_signal__container.name }}"
        hostname: "{{ mautrix_bridge_signal__container.hostname }}"
        image: "{{ mautrix_bridge_signal__container.image }}"
        ip: "{{ mautrix_bridge_signal__container.ip }}"
        ip6: "{{ mautrix_bridge_signal__container.ipv6 }}"
        network: "{{ mautrix_bridge_signal__container.network }}"
        timezone: "{{ mautrix_bridge_signal__container.timezone }}"
        dns_servers: "{{ mautrix_bridge_signal__container.dns_servers }}"
        env: "{{ mautrix_bridge_signal__container.environment }}"
        volume: "{{ mautrix_bridge_signal__container.volumes }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
          
          [Unit]
          {% if mautrix_bridge_signal__container.requires is defined %}
          Requires={{ mautrix_bridge_signal__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | default(false) }}"
      when: |
        mautrix_bridge_signal__ipv6 | length > 0
        and mautrix_bridge_signal_configuration_stat_result.stat.exists
        and not mautrix_bridge_signal__setup

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ mautrix_bridge_signal__container.name }}"
        daemon_reload: true
        state: 'started'
        enabled: true
      when: |
        not ansible_check_mode
        and mautrix_bridge_signal_configuration_stat_result.stat.exists
        and not mautrix_bridge_signal__setup
