---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/mautrix-bridges
#

mautrix_bridge_signal__home: "{{ mautrix_bridge_signal_home | mandatory }}"
mautrix_bridge_signal__ip: "{{ mautrix_bridge_signal_ip | mandatory }}"
mautrix_bridge_signal__ipv6: "{{ mautrix_bridge_signal_ipv6 }}"
mautrix_bridge_signal__network: "{{ mautrix_bridge_signal_network | mandatory }}"
mautrix_bridge_signal__hostname: "{{ mautrix_bridge_signal_hostname | mandatory }}"
mautrix_bridge_signal__timezone: "{{ mautrix_bridge_signal_timezone | mandatory }}"

mautrix_bridge_signal__version: "{{ mautrix_bridge_signal_version | default('latest') }}"

mautrix_bridge_signal__dns_servers: "{{ mautrix_bridge_signal_dns_servers | default([]) }}"

mautrix_bridge_signal__setup: "{{ mautrix_bridge_signal_setup | default(true) }}"

mautrix_bridge_signal__container: "{{ mautrix_bridge_signal__container_default | combine(mautrix_bridge_signal_container | default({}))  }}"

mautrix_bridge_signal__autoupdate_enabled: "{{ mautrix_bridge_signal_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

mautrix_bridge_signal__uid: 1337
mautrix_bridge_signal__gid: "{{ mautrix_bridge_signal__uid }}"

mautrix_bridge_signal__podman_name: 'mautrix-signal'
mautrix_bridge_signal__podman_image: 'dock.mau.dev/mautrix/signal'
mautrix_bridge_signal__podman_tag: "{{ mautrix_bridge_signal__version }}"

mautrix_bridge_signal__podman_home: "{{ mautrix_bridge_signal__home }}"

mautrix_bridge_signal__container_default:
  name: "{{ mautrix_bridge_signal__podman_name }}"
  hostname: "{{ mautrix_bridge_signal__hostname }}"
  image: "{{ mautrix_bridge_signal__podman_image }}:{{ mautrix_bridge_signal__podman_tag }}"
  ip: "{{ mautrix_bridge_signal__ip }}"
  ipv6: "{{ mautrix_bridge_signal__ipv6 }}"
  network: "{{ mautrix_bridge_signal__network }}"
  timezone: "{{ mautrix_bridge_signal__timezone }}"
  dns_servers: "{{ mautrix_bridge_signal__dns_servers }}"
  environment:
    TZ: "{{ mautrix_bridge_signal__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ mautrix_bridge_signal__podman_home }}:/data"
