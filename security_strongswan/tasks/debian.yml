---

- name: 'Install strongSwan'
  ansible.builtin.apt:
    name: "{{ security_strongswan__debian_packages }}"
    state: 'present'
    update_cache: true
    cache_valid_time: 3600

# In check mode the packages of a first installation are missing, there is no configuration to compare.
# ansible_check_mode is only set by --check, the directory of swanctl shows the installation in every check mode.
- name: 'Find the directory of swanctl'
  ansible.builtin.stat:
    path: "{{ security_strongswan__swanctl_dir }}"
  register: 'security_strongswan__swanctl_stat'
  check_mode: false

- name: 'Configure strongSwan'
  ansible.builtin.include_tasks: 'debian_configure.yml'
  when: security_strongswan__swanctl_stat.stat.isdir | default(false)
