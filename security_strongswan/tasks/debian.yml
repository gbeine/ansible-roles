---

- name: 'Install strongSwan'
  ansible.builtin.apt:
    name: "{{ security_strongswan__debian_packages }}"
    state: 'present'
    update_cache: true
    cache_valid_time: 3600

- name: 'Write the configuration of swanctl'
  ansible.builtin.template:
    src: 'swanctl.conf.j2'
    dest: "{{ security_strongswan__config_file }}"
    owner: 'root'
    group: 'root'
    mode: '0640'
  register: 'security_strongswan__config_result'

- name: 'Copy the certificate from the controller'
  when: security_strongswan__certificate_merged.source | default('') == 'files'
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: 'root'
    group: 'root'
    mode: "{{ item.mode }}"
  loop: >-
    {{ [ { 'src': security_strongswan__certificate_merged.cert, 'dest': security_strongswan__cert_file, 'mode': '0644' },
         { 'src': security_strongswan__certificate_merged.key, 'dest': security_strongswan__key_file, 'mode': '0600' } ]
       + ([ { 'src': security_strongswan__certificate_merged.chain, 'dest': security_strongswan__chain_file, 'mode': '0644' } ]
          if security_strongswan__certificate_merged.chain is defined else []) }}
  loop_control:
    label: "{{ item.dest }}"
  register: 'security_strongswan__files_result'

# The root of the CA is not part of the files of certbot
- name: 'Copy the CA from the controller'
  when:
    - security_strongswan__certificate_merged | length > 0
    - security_strongswan__certificate_merged.source != 'realm'
  ansible.builtin.copy:
    src: "{{ security_strongswan__certificate_merged.ca }}"
    dest: "{{ security_strongswan__ca_file }}"
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'security_strongswan__ca_result'

# The certificate of pki_certbot has to exist before ExecStartPre copies it
- name: 'Validate the certificate of pki_certbot'
  when: security_strongswan__certificate_merged.source | default('') == 'certbot'
  vars:
    security_strongswan__certbot_message: >-
      {{ security_strongswan__certbot_live_dir }}/cert.pem does not exist, pki_certbot has to issue the certificate
      of the realm {{ security_strongswan__certificate_merged.realm }} first.
  block:

    - name: 'Find the certificate of pki_certbot'
      ansible.builtin.stat:
        path: "{{ security_strongswan__certbot_live_dir }}/cert.pem"
      register: 'security_strongswan__certbot_cert'

    # In check mode pki_certbot does not issue a new certificate, the missing certificate is only reported
    - name: 'Assert the certificate of pki_certbot'
      ansible.builtin.assert:
        that:
          - ansible_check_mode or security_strongswan__certbot_cert.stat.exists
        fail_msg: "{{ security_strongswan__certbot_message }}"
        quiet: true

    - name: 'Report the missing certificate of pki_certbot in check mode'
      ansible.builtin.debug:
        msg: "{{ security_strongswan__certbot_message }}"
      when:
        - ansible_check_mode
        - not security_strongswan__certbot_cert.stat.exists

# pki_easyrsa_deploy and pki_certbot renew the certificate outside of the role, ExecStartPre copies it at every start,
# the links of certbot are followed by install
- name: 'Create the directory of the drop-ins of strongSwan'
  when: security_strongswan__start_files | length > 0
  ansible.builtin.file:
    path: "{{ security_strongswan__debian_dropin_dir }}"
    owner: 'root'
    group: 'root'
    mode: '0755'
    state: 'directory'

- name: 'Write the copy of the certificate at the start of strongSwan'
  when: security_strongswan__start_files | length > 0
  ansible.builtin.template:
    src: 'strongswan-certificate.conf.j2'
    dest: "{{ security_strongswan__debian_dropin_file }}"
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'security_strongswan__dropin_result'

- name: 'Remove the copy of the certificate at the start of strongSwan'
  when: security_strongswan__start_files | length == 0
  ansible.builtin.file:
    path: "{{ security_strongswan__debian_dropin_file }}"
    state: 'absent'
  register: 'security_strongswan__dropin_removed'

# A file of a former source or ca_name would stay a trusted CA or a CRL of swanctl
- name: 'Remove the certificates of former sources'
  when: security_strongswan__certificate_merged | length > 0
  block:

    - name: 'Find the CA certificates and CRLs of swanctl'
      ansible.builtin.find:
        paths: "{{ security_strongswan__cleanup_dirs }}"
        file_type: 'any'
        hidden: true
      register: 'security_strongswan__cleanup_found'

    - name: 'Remove the CA certificates and CRLs of former sources'
      ansible.builtin.file:
        path: "{{ item }}"
        state: 'absent'
      loop: >-
        {{ security_strongswan__cleanup_found.files | rejectattr('isdir') | map(attribute='path')
           | reject('in', security_strongswan__managed_files) | list }}
      register: 'security_strongswan__cleanup_result'

# A changed drop-in takes effect with a restart, ExecStartPre copies the certificate and charon loads everything
- name: 'Start and enable strongSwan'
  ansible.builtin.systemd_service:
    name: "{{ security_strongswan__debian_service }}"
    daemon_reload: "{{ security_strongswan__dropin_changed | bool }}"
    enabled: true
    state: "{{ 'restarted' if security_strongswan__dropin_changed | bool else 'started' }}"
  register: 'security_strongswan__start_result'
  when:
    - not ansible_check_mode
    - security_strongswan__config.enabled | bool

# strongSwan loads the changed configuration and certificates without a restart, the security associations stay.
# --clear unloads the credentials first, so removed CA certificates and CRLs are no longer trusted.
- name: 'Load the configuration and the certificates'
  ansible.builtin.command:
    argv: "{{ [ 'swanctl', '--load-all', '--noprompt' ] + ([ '--clear' ] if (security_strongswan__cleanup_result | default({})) is changed else []) }}"
  register: 'security_strongswan__load_result'
  changed_when: true
  failed_when: false
  when:
    - not ansible_check_mode
    - security_strongswan__config.enabled | bool
    # The restart loaded everything
    - not security_strongswan__dropin_changed | bool
    - >-
      security_strongswan__config_result is changed
      or (security_strongswan__files_result | default({})) is changed
      or (security_strongswan__ca_result | default({})) is changed
      or (security_strongswan__cleanup_result | default({})) is changed

- name: 'Assert that swanctl loaded the configuration'
  ansible.builtin.assert:
    that:
      - security_strongswan__load_result.rc == 0
    fail_msg: "{{ [ 'swanctl --load-all failed:' ] + security_strongswan__load_result.stdout_lines + security_strongswan__load_result.stderr_lines }}"
    quiet: true
  when: security_strongswan__load_result is changed

# ExecStartPre copies the certificate only at the start, the timer restarts strongSwan after a renewal
- name: 'Enable the restart after a renewal of the certificate'
  when:
    - security_strongswan__pki_update_certificates | length > 0
    - security_strongswan__pki_update_enabled | bool
    - security_strongswan__config.enabled | bool
  ansible.builtin.include_role:
    name: 'pki_update'
  vars:
    pki_service: "{{ security_strongswan__debian_service }}"
    pki_certificate: "{{ security_strongswan__pki_update_certificates }}"
    pki_schedule: "{{ security_strongswan__pki_update_schedule }}"

- name: 'Stop and disable strongSwan'
  ansible.builtin.systemd_service:
    name: "{{ security_strongswan__debian_service }}"
    enabled: false
    state: 'stopped'
  when:
    - not ansible_check_mode
    - not security_strongswan__config.enabled | bool
