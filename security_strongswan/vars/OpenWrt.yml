---
# Included by tasks/main.yml on OpenWrt

# The plugins are packages of their own, the nonce plugin is part of strongswan,
# the openssl plugin provides AES-GCM, x25519 and ECDSA, the kernel modules provide ESP with AES-GCM
security_strongswan__openwrt_packages:
  - 'strongswan-charon'
  - 'strongswan-swanctl'
  - 'strongswan-mod-openssl'
  - 'strongswan-mod-random'
  - 'strongswan-mod-x509'
  - 'strongswan-mod-pem'
  - 'strongswan-mod-pkcs1'
  - 'strongswan-mod-pkcs8'
  - 'strongswan-mod-pubkey'
  - 'strongswan-mod-constraints'
  - 'strongswan-mod-kernel-netlink'
  - 'strongswan-mod-socket-default'
  - 'kmod-ipsec4'
  - 'kmod-ipsec6'
  - 'kmod-crypto-gcm'

# /etc/init.d/swanctl starts charon with procd, reload runs swanctl --load-all
security_strongswan__openwrt_service: 'swanctl'
security_strongswan__openwrt_uci_config: '/etc/config/ipsec'

# The certificates of acme of bootstrap_openwrt
security_strongswan__openwrt_acme_dir: '/etc/ssl/acme'
security_strongswan__openwrt_hotplug_file: '/etc/hotplug.d/acme/50-strongswan'
