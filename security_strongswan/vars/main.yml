---
# Options of the role, they are not written to the configuration of swanctl
security_strongswan__role_options: [ 'enabled' ]
security_strongswan__boolean_options: [ 'enabled' ]

# The sections of swanctl.conf the role writes, secrets would contain passwords or keys in plain text
security_strongswan__config_sections: [ 'connections', 'authorities', 'pools' ]

# Names of sections and options of swanctl.conf
security_strongswan__name_pattern: '^[A-Za-z0-9_.-]+$'
# Characters swanctl.conf interprets in values
security_strongswan__value_pattern: '[\r\n{}"#]'

# The sources of the certificate by platform
security_strongswan__certificate_sources:
  Debian: [ 'files', 'certbot' ]
  OpenWrt: [ 'files', 'acme' ]
security_strongswan__ca_name_pattern: '^[A-Za-z0-9_.-]+[.](pem|crt|der)$'
