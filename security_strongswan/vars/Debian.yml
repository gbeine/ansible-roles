---
# Included by tasks/main.yml on Debian

# charon-systemd provides strongswan.service, it loads the configuration with swanctl --load-all,
# libstrongswan contains the openssl plugin with AES-GCM, x25519 and ECDSA (strongSwan 6.0.1 of Debian 13)
security_strongswan__debian_packages: [ 'charon-systemd', 'strongswan-swanctl' ]
security_strongswan__debian_service: 'strongswan'

# Copies the certificate of pki_certbot after a renewal and loads it
security_strongswan__debian_deploy_script: '/usr/local/libexec/strongswan-certbot-deploy'
security_strongswan__debian_deploy_unit: 'strongswan-certificate'
