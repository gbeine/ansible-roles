---
# Included by tasks/main.yml on Debian

# charon-systemd provides strongswan.service, it loads the configuration with swanctl --load-all,
# libstrongswan contains the openssl plugin with AES-GCM, x25519 and ECDSA (strongSwan 6.0.1 of Debian 13)
security_strongswan__debian_packages: [ 'charon-systemd', 'strongswan-swanctl' ]
security_strongswan__debian_service: 'strongswan'

# The drop-in with ExecStartPre copying the certificate of the sources realm and certbot at every start
security_strongswan__debian_dropin_dir: '/etc/systemd/system/strongswan.service.d'
security_strongswan__debian_dropin_file: "{{ security_strongswan__debian_dropin_dir }}/certificate.conf"
# A written or removed drop-in restarts strongSwan
security_strongswan__dropin_changed: >-
  {{ (security_strongswan__dropin_result | default({})) is changed or (security_strongswan__dropin_removed | default({})) is changed }}
