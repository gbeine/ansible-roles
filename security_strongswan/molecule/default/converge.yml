---
- name: 'Converge'
  hosts: 'all'
  become: true
  gather_facts: false

  vars_files:
    - 'test_cases.yml'

  vars:
    security_strongswan__test_case: "{{ security_strongswan__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  pre_tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ security_strongswan__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  tasks:

    - name: 'Run security_strongswan'
      ansible.builtin.include_role:
        name: 'security_strongswan'
