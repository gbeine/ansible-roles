---
# Runs security_strongswan with the invalid variables passed as include parameters,
# the role has to fail before it changes anything.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run security_strongswan with invalid variables (expect ERROR): {{ security_strongswan__test_invalid.message }}"
  block:

    - name: 'Run security_strongswan, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'security_strongswan'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ security_strongswan__test_invalid.message }}"

  rescue:

    - name: 'Read the checksum of the configuration after the invalid run'
      ansible.builtin.raw: "md5sum {{ security_strongswan__test_config_path }}"
      register: 'security_strongswan__test_md5_after'
      changed_when: false

    # Only the checksums are compared, the raw output differs after community.openwrt.init changed the connection settings
    - name: 'Assert the run failed with the expected message before any change'
      vars:
        security_strongswan__test_sums_before: "{{ security_strongswan__test_md5_before.stdout | regex_findall('[0-9a-f]{32}') }}"
        security_strongswan__test_sums_after: "{{ security_strongswan__test_md5_after.stdout | regex_findall('[0-9a-f]{32}') }}"
      ansible.builtin.assert:
        that:
          - ansible_failed_result.msg | default('') is search(security_strongswan__test_invalid.search, multiline=true)
          - security_strongswan__test_sums_before | length == 1
          - security_strongswan__test_sums_after == security_strongswan__test_sums_before
        fail_msg: >-
          Failure: {{ ansible_failed_result.msg | default('') }}
          Checksums before: {{ security_strongswan__test_sums_before | join(', ') }}, after: {{ security_strongswan__test_sums_after | join(', ') }}.
