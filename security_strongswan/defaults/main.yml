---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/security-strongswan
#

# The configuration of swanctl (sections connections, authorities and pools), every key replaces the key of the default,
# a dictionary is a section, a list is written separated by commas, true and false are yes and no, null removes the option
security_strongswan__config: "{{ security_strongswan__config_default | combine(strongswan_config | default({})) }}"

# The certificate of the host, its key and the CA: source files (controller), certbot (pki_certbot on Debian),
# realm (pki_easyrsa_deploy on Debian) or acme (OpenWrt),
# empty if the role does not manage the certificates
security_strongswan__certificate: "{{ strongswan_certificate | default({}) }}"

# On Debian the timer of pki_update restarts strongSwan after a renewal of the certificate of the sources realm and certbot
security_strongswan__pki_update_enabled: "{{ strongswan_pki_update_enabled | default(true) }}"
security_strongswan__pki_update_schedule: "{{ strongswan_pki_update_schedule | default('*-*-* 00/4:00:00') }}"

#
# Defaults - do not change
#

security_strongswan__config_default:
  enabled: true

# The certificate with its defaults by source
security_strongswan__certificate_defaults:
  files: { ca_name: 'ca.pem' }
  certbot: { ca_name: 'ca.pem', home: '/opt/certbot' }
  acme: { ca_name: 'ca.pem' }
  realm: { ca_name: 'ca.pem' }
security_strongswan__certificate_merged: >-
  {{ (security_strongswan__certificate_defaults[security_strongswan__certificate.source | default('')] | default({}))
     | combine(security_strongswan__certificate)
     if security_strongswan__certificate is mapping else {} }}

# The keys of the certificate by source, the first list is mandatory
security_strongswan__certificate_keys:
  files: { required: [ 'source', 'cert', 'key', 'ca' ], optional: [ 'chain', 'ca_name' ] }
  certbot: { required: [ 'source', 'realm', 'ca' ], optional: [ 'home', 'ca_name' ] }
  acme: { required: [ 'source', 'domain', 'ca' ], optional: [ 'ca_name' ] }
  realm: { required: [ 'source', 'realm' ], optional: [ 'ca_name' ] }

# The realms deployed by pki_easyrsa_deploy, the source realm copies the certificate, the key and the CA of a realm on the host
security_strongswan__realms_dir: "{{ common_globals__pki_realms_dir }}"
security_strongswan__realm_name_pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
security_strongswan__realm_dir: "{{ security_strongswan__realms_dir }}/{{ security_strongswan__certificate_merged.realm | default('') }}"
security_strongswan__realm_files:
  - src: "{{ security_strongswan__realm_dir }}/public/{{ security_strongswan__certificate_merged.realm | default('') }}.crt"
    dest: "{{ security_strongswan__cert_file }}"
    mode: '0644'
  - src: "{{ security_strongswan__realm_dir }}/private/{{ security_strongswan__certificate_merged.realm | default('') }}.key"
    dest: "{{ security_strongswan__key_file }}"
    mode: '0600'
  - src: "{{ security_strongswan__realm_dir }}/public/ca.crt"
    dest: "{{ security_strongswan__ca_file }}"
    mode: '0644'
  - src: "{{ security_strongswan__realm_dir }}/public/crl.pem"
    dest: "{{ security_strongswan__crl_file }}"
    mode: '0644'
# The files of the realm of pki_certbot, links to its archive
security_strongswan__certbot_live_dir: >-
  {{ security_strongswan__certificate_merged.home | default('') }}/etc/live/{{ security_strongswan__certificate_merged.realm | default('') }}
security_strongswan__certbot_files:
  - src: "{{ security_strongswan__certbot_live_dir }}/cert.pem"
    dest: "{{ security_strongswan__cert_file }}"
    mode: '0644'
  - src: "{{ security_strongswan__certbot_live_dir }}/chain.pem"
    dest: "{{ security_strongswan__chain_file }}"
    mode: '0644'
  - src: "{{ security_strongswan__certbot_live_dir }}/privkey.pem"
    dest: "{{ security_strongswan__key_file }}"
    mode: '0600'

# On Debian ExecStartPre of strongswan.service copies these files at every start, the sources realm and certbot
security_strongswan__start_files: >-
  {%- set source = security_strongswan__certificate_merged.source | default('') -%}
  {{ security_strongswan__realm_files if source == 'realm'
     else (security_strongswan__certbot_files if source == 'certbot' else []) }}
# pki_update restarts strongSwan when the certificate or the key is newer than the start, a new CRL is loaded at the next start
security_strongswan__pki_update_certificates: >-
  {{ security_strongswan__start_files | selectattr('dest', 'in', [ security_strongswan__cert_file, security_strongswan__key_file ])
     | map(attribute='src') | list }}

# The files of the realm missing on the host, read by tasks/main.yml
security_strongswan__realm_missing: >-
  {{ security_strongswan__realm_stat.results | default([]) | rejectattr('stat.exists') | map(attribute='item.src') | list }}
security_strongswan__realm_message: >-
  These files of the realm {{ security_strongswan__certificate_merged.realm | default('') }} do not exist on the host,
  pki_easyrsa_deploy has to deploy the realm first: {{ security_strongswan__realm_missing | join(', ') }}.

# The files of swanctl, the configuration references host.pem with certs and the CA with cacerts
security_strongswan__swanctl_dir: '/etc/swanctl'
security_strongswan__config_file: "{{ security_strongswan__swanctl_dir }}/conf.d/ansible.conf"
security_strongswan__cert_file: "{{ security_strongswan__swanctl_dir }}/x509/host.pem"
security_strongswan__key_file: "{{ security_strongswan__swanctl_dir }}/private/host.key"
security_strongswan__chain_file: "{{ security_strongswan__swanctl_dir }}/x509ca/chain.pem"
security_strongswan__ca_file: "{{ security_strongswan__swanctl_dir }}/x509ca/{{ security_strongswan__certificate_merged.ca_name | default('ca.pem') }}"
security_strongswan__crl_file: "{{ security_strongswan__swanctl_dir }}/x509crl/crl.pem"

# swanctl loads every file of x509ca and x509crl, the role removes the files of former sources and names,
# so no former CA stays trusted. Without strongswan_certificate the role does not touch them.
security_strongswan__cleanup_dirs:
  - "{{ security_strongswan__swanctl_dir }}/x509ca"
  - "{{ security_strongswan__swanctl_dir }}/x509crl"
security_strongswan__managed_files: >-
  {%- set source = security_strongswan__certificate_merged.source | default('') -%}
  {{ [ security_strongswan__ca_file ]
     + ([ security_strongswan__chain_file ] if source in [ 'certbot', 'acme' ]
        or (source == 'files' and security_strongswan__certificate_merged.chain is defined) else [])
     + ([ security_strongswan__crl_file ] if source == 'realm' else []) }}
