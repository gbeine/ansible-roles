---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/security-strongswan
#

# The configuration of swanctl (sections connections, authorities and pools), every key replaces the key of the default,
# a dictionary is a section, a list is written separated by commas, true and false are yes and no, null removes the option
security_strongswan__config: "{{ security_strongswan__config_default | combine(strongswan_config | default({})) }}"

# The certificate of the host, its key and the CA: source files (controller), certbot (pki_certbot on Debian) or acme (OpenWrt),
# empty if the role does not manage the certificates
security_strongswan__certificate: "{{ strongswan_certificate | default({}) }}"

#
# Defaults - do not change
#

security_strongswan__config_default:
  enabled: true

# The certificate with its defaults by source
security_strongswan__certificate_defaults:
  files: { ca_name: 'ca.pem' }
  certbot: { ca_name: 'ca.pem', home: '/opt/certbot' }
  acme: { ca_name: 'ca.pem' }
security_strongswan__certificate_merged: >-
  {{ (security_strongswan__certificate_defaults[security_strongswan__certificate.source | default('')] | default({}))
     | combine(security_strongswan__certificate)
     if security_strongswan__certificate is mapping else {} }}

# The keys of the certificate by source, the first list is mandatory
security_strongswan__certificate_keys:
  files: { required: [ 'source', 'cert', 'key', 'ca' ], optional: [ 'chain', 'ca_name' ] }
  certbot: { required: [ 'source', 'realm', 'ca' ], optional: [ 'home', 'ca_name' ] }
  acme: { required: [ 'source', 'domain', 'ca' ], optional: [ 'ca_name' ] }

# The files of swanctl, the configuration references host.pem with certs and the CA with cacerts
security_strongswan__swanctl_dir: '/etc/swanctl'
security_strongswan__config_file: "{{ security_strongswan__swanctl_dir }}/conf.d/ansible.conf"
security_strongswan__cert_file: "{{ security_strongswan__swanctl_dir }}/x509/host.pem"
security_strongswan__key_file: "{{ security_strongswan__swanctl_dir }}/private/host.key"
security_strongswan__chain_file: "{{ security_strongswan__swanctl_dir }}/x509ca/chain.pem"
security_strongswan__ca_file: "{{ security_strongswan__swanctl_dir }}/x509ca/{{ security_strongswan__certificate_merged.ca_name | default('ca.pem') }}"
