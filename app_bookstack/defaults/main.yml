---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/bookstack
#

app_bookstack__home: "{{ bookstack_home | mandatory }}"
app_bookstack__ip: "{{ bookstack_ip | mandatory }}"
app_bookstack__ipv6: "{{ bookstack_ipv6 }}"
app_bookstack__network: "{{ bookstack_network | mandatory }}"
app_bookstack__hostname: "{{ bookstack_hostname | mandatory }}"
app_bookstack__timezone: "{{ bookstack_timezone | mandatory }}"
app_bookstack__labels: "{{ bookstack_labels | default(app_bookstack__labels_default) }}"

app_bookstack__version: "{{ bookstack_version | default(app_bookstack__version_default) }}"

app_bookstack__container: "{{ app_bookstack__podman_container_default | combine(bookstack_container | default(app_bookstack__container_default)) }}"

app_bookstack__autoupdate_enabled: "{{ bookstack_autoupdate_enabled | default(false) }}"

app_bookstack__db_host: "{{ bookstack_db_host | mandatory }}"
app_bookstack__db_port: "{{ bookstack_db_port | default(app_bookstack__db_port_default) }}"
app_bookstack__db_user: "{{ bookstack_db_user | default(app_bookstack__db_user_default) }}"
app_bookstack__db_pass: "{{ bookstack_db_pass | mandatory }}"
app_bookstack__db_name: "{{ bookstack_db_name | default(app_bookstack__db_name_default) }}"

app_bookstack__url: "{{ bookstack_url | mandatory }}"

app_bookstack__app_key: "{{ bookstack_app_key | mandatory }}"
app_bookstack__app_url: "{{ app_bookstack__url }}"

app_bookstack__mail_driver: "{{ bookstack_mail_driver | default(app_bookstack__mail_driver_default) }}"

app_bookstack__mail_from_name: "{{ bookstack_mail_from_name | default(app_bookstack__mail_from_name_default) }}"
app_bookstack__mail_from: "{{ bookstack_mail_from | mandatory }}"
app_bookstack__mail_host: "{{ bookstack_mail_host | default(app_bookstack__mail_host_default) }}"
app_bookstack__mail_port: "{{ bookstack_mail_port | default(app_bookstack__mail_port_default) }}"
app_bookstack__mail_username: "{{ bookstack_mail_username | default(app_bookstack__mail_username_default) }}"
app_bookstack__mail_password: "{{ bookstack_mail_password | default(app_bookstack__mail_password_default) }}"
app_bookstack__mail_encryption: "{{ bookstack_mail_encryption | default(app_bookstack__mail_encryption_default) }}"
app_bookstack__mail_sendmail_command: "{{ bookstack_mail_sendmail_command | default(app_bookstack__mail_sendmail_command_default) }}"

app_bookstack__auth_method: "{{ bookstack_auth_method | default(app_bookstack__auth_method_default) }}"

app_bookstack__ldap_server: "{{ bookstack_ldap_server | mandatory }}"
app_bookstack__ldap_base_dn: "{{ bookstack_ldap_base_dn | mandatory }}"
app_bookstack__ldap_dn: "{{ bookstack_ldap_dn | default(app_bookstack__ldap_dn_default) }}"
app_bookstack__ldap_pass: "{{ bookstack_ldap_pass | default(app_bookstack__ldap_pass_default) }}"
app_bookstack__ldap_filter: "{{ bookstack_ldap_filter | default(app_bookstack__ldap_filter_default) }}"
app_bookstack__ldap_version: "{{ bookstack_ldap_version | default(app_bookstack__ldap_version_default) }}"
app_bookstack__ldap_uid: "{{ bookstack_ldap_uid | default(app_bookstack__ldap_uid_default) }}"
app_bookstack__ldap_email_attribute: "{{ bookstack_ldap_email_attribute | default(app_bookstack__ldap_email_attribute_default) }}"
app_bookstack__ldap_display_name_attribute: "{{ bookstack_ldap_display_name_attribute | default(app_bookstack__ldap_display_name_attribute_default) }}"
app_bookstack__ldap_user_to_groups: "{{ bookstack_ldap_user_to_groups | default(app_bookstack__ldap_user_to_groups_default) }}"
app_bookstack__ldap_group_attribute: "{{ bookstack_ldap_group_attribute | default(app_bookstack__ldap_group_attribute_default) }}"
app_bookstack__ldap_remove_from_groups: "{{ bookstack_ldap_remove_from_groups | default(app_bookstack__ldap_remove_from_groups_default) }}"

app_bookstack__oidc_auto_initiate: "{{ bookstack_oidc_auto_initiate | default(app_bookstack__oidc_auto_initiate_default) }}"
app_bookstack__oidc_name: "{{ bookstack_oidc_name | default(app_bookstack__oidc_name_default) }}"
app_bookstack__oidc_display_name_claims: "{{ bookstack_oidc_display_name_claims | default(app_bookstack__oidc_display_name_claims_default) }}"
app_bookstack__oidc_client_id: "{{ bookstack_oidc_client_id | default(app_bookstack__oidc_client_id_default) }}"
app_bookstack__oidc_client_secret: "{{ bookstack_oidc_client_secret }}"
app_bookstack__oidc_issuer: "{{ bookstack_oidc_issuer }}"
app_bookstack__oidc_end_session_endpoint: "{{ bookstack_oidc_end_session_endpoint | default(app_bookstack__oidc_end_session_endpoint_default) }}"
app_bookstack__oidc_issuer_discover: "{{ bookstack_oidc_issuer_discover | default(app_bookstack__oidc_issuer_discover_default) }}"
app_bookstack__oidc_external_id_claim: "{{ bookstack_oidc_external_id_claim | default(app_bookstack__oidc_external_id_claim_default) }}"

app_bookstack__drawio: "{{ bookstack_drawio | default(app_bookstack__drawio_default) }}"
app_bookstack__memcached_servers: "{{ bookstack_memcached_servers | default(app_bookstack__memcached_servers_default) }}"
app_bookstack__redis_servers: "{{ bookstack_redis_servers | default(app_bookstack__redis_servers_default) }}"
app_bookstack__cache_driver: "{{ bookstack_cache_driver | default(app_bookstack__cache_driver_default) }}"
app_bookstack__session_driver: "{{ bookstack_session_driver | default(app_bookstack__session_driver_default) }}"

app_bookstack__session_cookie_name: "{{ bookstack_session_cookie_name | default(app_bookstack__session_cookie_name_default) }}"
app_bookstack__session_secure_cookie: "{{ bookstack_session_secure_cookie | default(app_bookstack__session_secure_cookie_default) }}"
app_bookstack__session_lifetime: "{{ bookstack_session_lifetime | default(app_bookstack__session_lifetime_default) }}"

app_bookstack__dark_mode: "{{ bookstack_dark_mode | default(app_bookstack__dark_mode_default) }}"
app_bookstack__view_books_as_grid: "{{ bookstack_view_books_as_grid | default(app_bookstack__view_books_as_grid_default) }}"

#
# Defaults - do not change
#

app_bookstack__uid: "{{ bookstack_uid | mandatory }}"
app_bookstack__gid: "{{ bookstack_gid | default(app_bookstack__uid) }}"

app_bookstack__podman_name: 'bookstack'
app_bookstack__podman_image: 'lscr.io/linuxserver/bookstack'
app_bookstack__podman_tag: "{{ app_bookstack__version }}"

app_bookstack__podman_home: "{{ app_bookstack__home }}"
app_bookstack__podman_config_dir: "{{ app_bookstack__podman_home }}/www"

app_bookstack__podman_container_default:
  name: "{{ app_bookstack__podman_name }}"
  hostname: "{{ app_bookstack__hostname }}"
  image: "{{ app_bookstack__podman_image }}:{{ app_bookstack__podman_tag }}"
  ip: "{{ app_bookstack__ip }}"
  ipv6: "{{ app_bookstack__ipv6 | default(omit) }}"
  network: "{{ app_bookstack__network }}"
  timezone: "{{ app_bookstack__timezone }}"
  environment:
    PUID: "{{ app_bookstack__uid }}"
    PGID: "{{ app_bookstack__gid }}"
    APP_URL: "{{ app_bookstack__url }}"
    DB_HOST: "{{ app_bookstack__db_host }}"
    DB_PORT: "{{ app_bookstack__db_port }}"
    DB_USER: "{{ app_bookstack__db_user }}"
    DB_DATABASE: "{{ app_bookstack__db_name }}"
  labels: "{{ app_bookstack__labels }}"
  secrets:
    - "bookstack_database_pass,type=env,target=DB_PASS"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_bookstack__podman_home }}:/config"

app_bookstack__labels_default: {}
app_bookstack__version_default: 'latest'
app_bookstack__container_default: {}
app_bookstack__db_port_default: 3306
app_bookstack__db_user_default: 'bookstack'
app_bookstack__db_name_default: 'bookstack'
app_bookstack__mail_driver_default: 'sendmail'
app_bookstack__mail_from_name_default: 'BookStack'
app_bookstack__mail_host_default: 'localhost'
app_bookstack__mail_port_default: 25
app_bookstack__mail_username_default: 'null'
app_bookstack__mail_password_default: 'null'
app_bookstack__mail_encryption_default: 'null'
app_bookstack__mail_sendmail_command_default: '/usr/sbin/sendmail -bs'
app_bookstack__auth_method_default: 'standard'
app_bookstack__ldap_dn_default: ''
app_bookstack__ldap_pass_default: ''
app_bookstack__ldap_filter_default: '(&(uid=${user}))'
app_bookstack__ldap_version_default: 3
app_bookstack__ldap_uid_default: 'uid'
app_bookstack__ldap_email_attribute_default: 'mail'
app_bookstack__ldap_display_name_attribute_default: 'cn'
app_bookstack__ldap_user_to_groups_default: false
app_bookstack__ldap_group_attribute_default: 'memberOf'
app_bookstack__ldap_remove_from_groups_default: true
app_bookstack__oidc_auto_initiate_default: false
app_bookstack__oidc_name_default: 'SSO'
app_bookstack__oidc_display_name_claims_default: 'name'
app_bookstack__oidc_client_id_default: 'bookstack'
app_bookstack__oidc_end_session_endpoint_default: false
app_bookstack__oidc_issuer_discover_default: true
app_bookstack__oidc_external_id_claim_default: 'sub'
app_bookstack__drawio_default: ''
app_bookstack__memcached_servers_default: []
app_bookstack__redis_servers_default: []
app_bookstack__cache_driver_default: 'database'
app_bookstack__session_driver_default: 'database'
app_bookstack__session_cookie_name_default: 'bookstack_session'
app_bookstack__session_secure_cookie_default: true
app_bookstack__session_lifetime_default: 120
app_bookstack__dark_mode_default: false
app_bookstack__view_books_as_grid_default: true