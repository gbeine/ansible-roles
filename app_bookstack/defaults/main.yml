app_bookstack__podman_container_default:
  name: "{{ app_bookstack__podman_name }}"
  hostname: "{{ app_bookstack__hostname }}"
  image: "{{ app_bookstack__podman_image }}:{{ app_bookstack__podman_tag }}"
  ip: "{{ app_bookstack__ip }}"
  ipv6: "{{ app_bookstack__ipv6 | default(omit) }}"
  network: "{{ app_bookstack__network }}"
  timezone: "{{ app_bookstack__timezone }}"
  # Set with bookstack_environment and bookstack_secrets, merged over the default
  environment: "{{ app_bookstack__environment | combine(app_bookstack__environment_secrets_files) }}"
  labels: "{{ app_bookstack__labels | default(omit) }}"
  secrets: >-
    {{ (app_bookstack__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ app_bookstack__secrets_dir ~ '/\1') | list)
      if (app_bookstack__secrets is sequence and app_bookstack__secrets is not string and app_bookstack__secrets | length > 0)
      else omit }}
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_bookstack__podman_home }}:/config"

app_bookstack__version_default: 'latest'
app_bookstack__container_default: {}
