---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/bookstack
#

app_bookstack__home: "{{ bookstack_home | mandatory }}"
app_bookstack__ip: "{{ bookstack_ip | mandatory }}"
app_bookstack__ipv6: "{{ bookstack_ipv6 }}"
app_bookstack__network: "{{ bookstack_network | mandatory }}"
app_bookstack__hostname: "{{ bookstack_hostname | mandatory }}"
app_bookstack__timezone: "{{ bookstack_timezone | mandatory }}"
app_bookstack__labels: "{{ bookstack_labels }}"

app_bookstack__version: "{{ bookstack_version | default(app_bookstack__version_default) }}"


app_bookstack__container: "{{ app_bookstack__podman_container_default | combine(bookstack_container | default(app_bookstack__container_default)) }}"
app_bookstack__environment: "{{ app_bookstack__environment_default | combine(bookstack_environment | default({})) }}"
app_bookstack__secrets: "{{ bookstack_secrets | default([]) }}"

app_bookstack__autoupdate_enabled: "{{ bookstack_autoupdate_enabled | default(false) }}"
app_bookstack__autoupdate_schedule: "{{ bookstack_autoupdate_schedule }}"

app_bookstack__uid: "{{ bookstack_uid | mandatory }}"
app_bookstack__gid: "{{ bookstack_gid | default(app_bookstack__uid) }}"

#
# Defaults - do not change
#

app_bookstack__podman_name: 'bookstack'
app_bookstack__podman_image: 'lscr.io/linuxserver/bookstack'
app_bookstack__podman_tag: "{{ app_bookstack__version }}"

app_bookstack__podman_home: "{{ app_bookstack__home }}"
app_bookstack__podman_config_dir: "{{ app_bookstack__podman_home }}/www"

app_bookstack__environment_default:
  PUID: "{{ app_bookstack__uid }}"
  PGID: "{{ app_bookstack__gid }}"
  DB_DATABASE: 'bookstack'
  DB_USERNAME: 'bookstack'

app_bookstack__environment_required:
  - 'APP_URL'
  - 'DB_HOST'
  - 'DB_DATABASE'
  - 'DB_USERNAME'

app_bookstack__secrets_required:
  - 'APP_KEY'
  - 'DB_PASSWORD'

# Variables carrying secrets, they must be passed with bookstack_secrets
app_bookstack__secret_variables:
  - 'APP_KEY'
  - 'DB_PASSWORD'
  - 'DATABASE_URL'
  - 'MYSQL_PASSWORD'
  - 'MAIL_PASSWORD'
  - 'LDAP_PASS'
  - 'OIDC_CLIENT_SECRET'
  - 'STORAGE_S3_KEY'
  - 'STORAGE_S3_SECRET'
  - 'AZURE_APP_SECRET'
  - 'DISCORD_APP_SECRET'
  - 'FACEBOOK_APP_SECRET'
  - 'GITHUB_APP_SECRET'
  - 'GITLAB_APP_SECRET'
  - 'GOOGLE_APP_SECRET'
  - 'OKTA_APP_SECRET'
  - 'SLACK_APP_SECRET'
  - 'TWITCH_APP_SECRET'
  - 'TWITTER_APP_SECRET'

# The secrets are mounted as files, the linuxserver images read the variable target from FILE__<target>
app_bookstack__secret_files:
  APP_KEY: 'FILE__APP_KEY'
  DB_PASSWORD: 'FILE__DB_PASSWORD'
  DATABASE_URL: 'FILE__DATABASE_URL'
  MYSQL_PASSWORD: 'FILE__MYSQL_PASSWORD'
  MAIL_PASSWORD: 'FILE__MAIL_PASSWORD'
  LDAP_PASS: 'FILE__LDAP_PASS'
  OIDC_CLIENT_SECRET: 'FILE__OIDC_CLIENT_SECRET'
  STORAGE_S3_KEY: 'FILE__STORAGE_S3_KEY'
  STORAGE_S3_SECRET: 'FILE__STORAGE_S3_SECRET'
  AZURE_APP_SECRET: 'FILE__AZURE_APP_SECRET'
  DISCORD_APP_SECRET: 'FILE__DISCORD_APP_SECRET'
  FACEBOOK_APP_SECRET: 'FILE__FACEBOOK_APP_SECRET'
  GITHUB_APP_SECRET: 'FILE__GITHUB_APP_SECRET'
  GITLAB_APP_SECRET: 'FILE__GITLAB_APP_SECRET'
  GOOGLE_APP_SECRET: 'FILE__GOOGLE_APP_SECRET'
  OKTA_APP_SECRET: 'FILE__OKTA_APP_SECRET'
  SLACK_APP_SECRET: 'FILE__SLACK_APP_SECRET'
  TWITCH_APP_SECRET: 'FILE__TWITCH_APP_SECRET'
  TWITTER_APP_SECRET: 'FILE__TWITTER_APP_SECRET'

app_bookstack__secrets_dir: '/run/secrets'

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
app_bookstack__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if app_bookstack__secrets is sequence and app_bookstack__secrets is not string and app_bookstack__secrets is not mapping -%}
  {%-   for secret in app_bookstack__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in app_bookstack__secret_files -%}
  {%-     set _ = environment.update({ app_bookstack__secret_files[secret.target]: app_bookstack__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The variables of the linuxserver image (PUID, PGID, TZ, UMASK) and the keys of BookStack,
# generated from .env.example.complete and app/Config/*.php of BookStack v26.09.3, update with new versions of BookStack,
# without the variables carrying secrets and TEST_DATABASE_URL
