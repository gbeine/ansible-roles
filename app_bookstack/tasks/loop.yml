---

- name: 'Loop over BookStack instances'
  tags: [ 'app_bookstack' ]
  ansible.builtin.include_role:
    name: 'app_bookstack'
  loop: "{{ bookstack_instances }}"
  loop_control:
    loop_var: 'bookstack'
    label: "{{ bookstack.hostname }}"
  vars:
    bookstack_home: "{{ bookstack.home }}"
    bookstack_ip: "{{ bookstack.ip }}"
    bookstack_ipv6: "{{ bookstack.ipv6 | default(omit) }}"
    bookstack_network: "{{ bookstack.network }}"
    bookstack_hostname: "{{ bookstack.hostname }}"
    bookstack_timezone: "{{ bookstack.timezone }}"
    bookstack_labels: "{{ bookstack.labels | default(app_bookstack__labels_default) }}"
    bookstack_version: "{{ bookstack.version | default(app_bookstack__version_default) }}"
    bookstack_container: "{{ bookstack.container | default(app_bookstack__container_default) }}"
    bookstack_environment: "{{ bookstack.environment | default({}) }}"
    bookstack_secrets: "{{ bookstack.secrets | default([]) }}"
    bookstack_uid: "{{ bookstack.uid }}"
    bookstack_gid: "{{ bookstack.gid | default(bookstack.uid) }}"
    bookstack_autoupdate_enabled: "{{ bookstack.autoupdate_enabled | default(false) }}"
