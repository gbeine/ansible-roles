---

- name: 'Loop over BookStack instances'
  tags: [ 'app', 'app_bookstack' ]
  ansible.builtin.include_role:
    name: 'app_bookstack'
  loop: "{{ bookstack_instances }}"
  loop_control:
    loop_var: 'bookstack'
    label: "{{ bookstack.hostname }}"
  vars:
    bookstack_home: "{{ bookstack.home }}"
    bookstack_ip: "{{ bookstack.ip }}"
    bookstack_ipv6: "{{ bookstack.ipv6 }}"
    bookstack_network: "{{ bookstack.network }}"
    bookstack_hostname: "{{ bookstack.hostname }}"
    bookstack_timezone: "{{ bookstack.timezone }}"
    bookstack_labels: "{{ bookstack.labels }}"
    bookstack_version: "{{ bookstack.version }}"
    bookstack_container: "{{ bookstack.container }}"
    bookstack_environment: "{{ bookstack.environment }}"
    bookstack_secrets: "{{ bookstack.secrets }}"
    bookstack_uid: "{{ bookstack.uid }}"
    bookstack_gid: "{{ bookstack.gid }}"
    bookstack_autoupdate_enabled: "{{ bookstack.autoupdate_enabled }}"
    bookstack_autoupdate_schedule: "{{ bookstack.autoupdate_schedule }}"
