---

- name: 'Deploy BookStack container'
  tags: [ 'app_bookstack' ]
  block:

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - app_bookstack__environment_missing | length == 0
          - app_bookstack__secrets | rejectattr('name', 'defined') | list | length == 0
          - app_bookstack__secrets | rejectattr('data', 'defined') | list | length == 0
          - app_bookstack__secrets | rejectattr('target', 'defined') | list | length == 0
          - app_bookstack__secrets_missing | length == 0
          - app_bookstack__secrets_in_environment | length == 0
        fail_msg: >-
          BookStack needs the environment variables {{ app_bookstack__environment_required | join(', ') }},
          missing or empty: {{ app_bookstack__environment_missing | join(', ') | default('none', true) }}.
          BookStack needs the secrets {{ app_bookstack__secrets_required | join(', ') }},
          missing: {{ app_bookstack__secrets_missing | join(', ') | default('none', true) }}.
          Every secret needs name, data and target, secret targets must not be set in bookstack_environment:
          {{ app_bookstack__secrets_in_environment | join(', ') | default('none', true) }}.
        quiet: true
      vars:
        app_bookstack__environment_missing: >-
          {{ app_bookstack__environment_required
             | reject('in', app_bookstack__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        app_bookstack__secrets_missing: >-
          {{ app_bookstack__secrets_required
             | reject('in', app_bookstack__secrets | selectattr('target', 'defined') | map(attribute='target') | list)
             | list }}
        app_bookstack__secrets_in_environment: >-
          {{ app_bookstack__secrets | selectattr('target', 'defined') | map(attribute='target')
             | select('in', app_bookstack__environment.keys() | list) | list }}

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        owner: "{{ app_bookstack__uid }}"
        group: "{{ app_bookstack__gid }}"
        mode: "{{ item.mode | default('0700') }}"
        state: 'directory'
      with_items:
        - dest: "{{ app_bookstack__podman_config_dir }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ app_bookstack__secrets }}"
      register: 'app_bookstack__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ app_bookstack__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[app_bookstack__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ app_bookstack__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_bookstack__container.name }}"
        hostname: "{{ app_bookstack__container.hostname }}"
        image: "{{ app_bookstack__container.image }}"
        ip: "{{ app_bookstack__container.ip }}"
        ip6: "{{ app_bookstack__container.ipv6 | default(omit) }}"
        network: "{{ app_bookstack__container.network }}"
        timezone: "{{ app_bookstack__container.timezone }}"
        env: "{{ app_bookstack__container.environment | default(omit) }}"
        etc_hosts: "{{ app_bookstack__container.etc_hosts | default(omit) }}"
        expose: "{{ app_bookstack__container.expose | default(omit) }}"
        label: "{{ app_bookstack__container.labels | default(omit) }}"
        publish: "{{ app_bookstack__container.publish | default(omit) }}"
        secrets: "{{ app_bookstack__container.secrets | default(omit) }}"
        volume: "{{ app_bookstack__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_bookstack__container.requires is defined %}
          Requires={{ app_bookstack__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      register: 'app_bookstack__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ app_bookstack__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if app_bookstack__restart | bool else 'started' }}"
        enabled: true
      vars:
        app_bookstack__running: >-
          {{ (ansible_facts.services[app_bookstack__container.name + '.service'].state | default('')) == 'running' }}
        app_bookstack__restart: >-
          {{ podman___update_mode | bool
             or (app_bookstack__running | bool
                 and (app_bookstack__secrets_result is changed or app_bookstack__quadlet_result is changed)) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'app_bookstack__autoupdate_enabled'
      include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_bookstack__container.name }}"
        container_image: "{{ app_bookstack__container.image }}"
