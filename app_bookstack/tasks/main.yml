---

- name: 'Deploy BookStack container'
  tags: [ 'app', 'app_bookstack' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or bookstack_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - app_bookstack__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - app_bookstack__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_bookstack__invalid | join('. ') }}"
        quiet: true
      vars:
        app_bookstack__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = app_bookstack__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('bookstack_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('bookstack_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of bookstack_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - app_bookstack__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_bookstack__errors | join(' ') }}"
        quiet: true
      vars:
        app_bookstack__environment_missing: >-
          {{ app_bookstack__environment_required
             | reject('in', app_bookstack__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        app_bookstack__secrets_missing: >-
          {{ app_bookstack__secrets_required
             | reject('in', app_bookstack__secrets | map(attribute='target') | list)
             | list }}
        app_bookstack__secrets_in_environment: >-
          {{ (app_bookstack__secrets | map(attribute='target') | list
              + app_bookstack__secret_variables + app_bookstack__secret_files.values() | list)
             | select('in', app_bookstack__environment.keys() | list) | unique | list }}
        app_bookstack__errors: >-
          {%- set errors = [] -%}
          {%- if app_bookstack__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('BookStack needs the environment variables ' ~ (app_bookstack__environment_required | join(', ')) ~ ', missing or empty: ' ~ (app_bookstack__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_bookstack__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('BookStack needs the secrets ' ~ (app_bookstack__secrets_required | join(', ')) ~ ', missing: ' ~ (app_bookstack__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_bookstack__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets and their file variables must not be set in bookstack_environment: ' ~ (app_bookstack__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging bookstack_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - app_bookstack__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_bookstack__errors | join(' ') }}"
        quiet: true
      vars:
        app_bookstack__environment_unknown: >-
          {{ (app_bookstack__container.environment | default({})).keys()
             | reject('in', app_bookstack__environment_allowed) | list }}
        app_bookstack__secrets_unknown: >-
          {{ app_bookstack__secrets | map(attribute='target') | reject('in', app_bookstack__secret_files.keys() | list) | list }}
        app_bookstack__errors: >-
          {%- set errors = [] -%}
          {%- if app_bookstack__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (app_bookstack__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_bookstack__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (app_bookstack__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the variables of the image (app_bookstack__environment_allowed) and the secrets ' ~ (app_bookstack__secret_files.keys() | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        owner: "{{ app_bookstack__uid }}"
        group: "{{ app_bookstack__gid }}"
        mode: "{{ item.mode | default('0700') }}"
        state: 'directory'
      loop:
        - dest: "{{ app_bookstack__podman_config_dir }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ app_bookstack__secrets }}"
      register: 'app_bookstack__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_bookstack__container.name }}"
        hostname: "{{ app_bookstack__container.hostname }}"
        image: "{{ app_bookstack__container.image }}"
        ip: "{{ app_bookstack__container.ip }}"
        ip6: "{{ app_bookstack__container.ipv6 | default(omit) }}"
        network: "{{ app_bookstack__container.network }}"
        timezone: "{{ app_bookstack__container.timezone }}"
        env: "{{ app_bookstack__container.environment | default(omit) }}"
        etc_hosts: "{{ app_bookstack__container.etc_hosts | default(omit) }}"
        expose: "{{ app_bookstack__container.expose | default(omit) }}"
        label: "{{ app_bookstack__container.labels | default(omit) }}"
        publish: "{{ app_bookstack__container.publish | default(omit) }}"
        secrets: "{{ app_bookstack__container.secrets | default(omit) }}"
        volume: "{{ app_bookstack__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_bookstack__container.requires is defined %}
          Requires={{ app_bookstack__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'app_bookstack__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ app_bookstack__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if app_bookstack__restart | bool else 'started' }}"
        enabled: true
      vars:
        app_bookstack__running: >-
          {{ (ansible_facts.services[app_bookstack__container.name + '.service'].state | default('')) == 'running' }}
        app_bookstack__restart: >-
          {{ app_bookstack__running | bool
             and (app_bookstack__secrets_result is changed or app_bookstack__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'app_bookstack__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_bookstack__container.name }}"
        container_image: "{{ app_bookstack__container.image }}"
        container_schedule: "{{ app_bookstack__autoupdate_schedule }}"
