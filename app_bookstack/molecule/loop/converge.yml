---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman___update_mode: false

  tasks:

    # The same way as documented in docs/notes.md, bookstack_instances is defined in test_cases.yml
    - name: 'Run app_bookstack for all instances'
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../tasks/loop.yml"
