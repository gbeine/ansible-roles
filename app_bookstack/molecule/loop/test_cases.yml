---
# Network created by container_podman in prepare.yml
app_bookstack__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_bookstack__test_image: 'lscr.io/linuxserver/bookstack:latest'

# Database started by prepare.yml, test credentials only
app_bookstack__test_database:
  name: 'molecule-mariadb'
  image: 'docker.io/library/mariadb:11'
  ip: '10.89.0.20'
  root_password: 'FGNuASkCxRWvIj26BiwUpUFc'
  accounts:
    - database: 'bookstack_docs'
      user: 'bookstack_docs'
      password: 'hkswSiZSObuXSbSIsAYNrGK_'
    - database: 'bookstack_wiki'
      user: 'bookstack_wiki'
      password: 'RrO_oovq_JSn2vyPHromTTAi'

# Instances deployed with tasks/loop.yml, test keys and passwords only
bookstack_instances:

  - home: '/opt/bookstack-docs'
    hostname: 'bookstack-docs'
    ip: '10.89.0.11'
    network: 'podman-molecule'
    timezone: 'Europe/Berlin'
    uid: 1031
    container:
      name: 'bookstack-docs'
    environment:
      APP_URL: 'http://10.89.0.11'
      DB_HOST: '10.89.0.20'
      DB_DATABASE: 'bookstack_docs'
      DB_USERNAME: 'bookstack_docs'
    secrets:
      - name: 'bookstack_docs_app_key'
        data: 'base64:utVtiJ8q5hlhx4ci5k8gfC1wpuQINWrFlcrxTuJWXbk='
        target: 'APP_KEY'
      - name: 'bookstack_docs_db_password'
        data: "{{ app_bookstack__test_database.accounts[0].password }}"
        target: 'DB_PASSWORD'

  - home: '/opt/bookstack-wiki'
    hostname: 'bookstack-wiki'
    ip: '10.89.0.12'
    ipv6: 'fd00:89::12'
    network: 'podman-molecule'
    timezone: 'Europe/Berlin'
    uid: 1032
    container:
      name: 'bookstack-wiki'
    environment:
      APP_URL: 'http://10.89.0.12'
      DB_HOST: '10.89.0.20'
      DB_DATABASE: 'bookstack_wiki'
      DB_USERNAME: 'bookstack_wiki'
    secrets:
      - name: 'bookstack_wiki_app_key'
        data: 'base64:4Z9ArDKbxRuZee2FkPVjEeRcFUMs3rORNVT4y9ai6HU='
        target: 'APP_KEY'
      - name: 'bookstack_wiki_db_password'
        data: "{{ app_bookstack__test_database.accounts[1].password }}"
        target: 'DB_PASSWORD'

app_bookstack__test_expect:

  - name: 'bookstack-docs'
    ip: '10.89.0.11'
    ip6: ~
    env:
      - 'APP_URL=http://10.89.0.11'
      - 'DB_HOST=10.89.0.20'
      - 'DB_DATABASE=bookstack_docs'
      - 'DB_USERNAME=bookstack_docs'
      - 'PUID=1031'
      - 'PGID=1031'
    secrets:
      - 'bookstack_docs_app_key,type=env,target=APP_KEY'
      - 'bookstack_docs_db_password,type=env,target=DB_PASSWORD'
    urls:
      - 'http://10.89.0.11/login'

  - name: 'bookstack-wiki'
    ip: '10.89.0.12'
    ip6: 'fd00:89::12'
    env:
      - 'APP_URL=http://10.89.0.12'
      - 'DB_HOST=10.89.0.20'
      - 'DB_DATABASE=bookstack_wiki'
      - 'DB_USERNAME=bookstack_wiki'
      - 'PUID=1032'
      - 'PGID=1032'
    secrets:
      - 'bookstack_wiki_app_key,type=env,target=APP_KEY'
      - 'bookstack_wiki_db_password,type=env,target=DB_PASSWORD'
    urls:
      - 'http://10.89.0.12/login'
      - 'http://[fd00:89::12]/login'
