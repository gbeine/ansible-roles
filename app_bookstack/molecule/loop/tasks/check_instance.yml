---
# Checks one instance against app_bookstack__expect

- name: "Read the quadlet unit of {{ app_bookstack__expect.name }}"
  ansible.builtin.slurp:
    src: "/etc/containers/systemd/{{ app_bookstack__expect.name }}.container"
  register: 'app_bookstack__test_quadlet'

- name: "Assert the addresses and secrets of {{ app_bookstack__expect.name }}"
  ansible.builtin.assert:
    that:
      - ('IP=' + app_bookstack__expect.ip) in app_bookstack__test_quadlet_lines
      - app_bookstack__expect.ip6 is none or ('IP6=' + app_bookstack__expect.ip6) in app_bookstack__test_quadlet_lines
      - app_bookstack__expect.ip6 is not none or app_bookstack__test_quadlet_lines | select('match', 'IP6=') | list | length == 0
      - >-
        app_bookstack__test_quadlet_lines | select('match', 'Secret=') | map('regex_replace', '^Secret=', '') | list | sort
        == app_bookstack__expect.secrets | sort
    fail_msg: "{{ app_bookstack__test_quadlet_lines | select('match', '(IP6?|Secret)=') | list }}"
  vars:
    app_bookstack__test_quadlet_lines: "{{ (app_bookstack__test_quadlet.content | b64decode).splitlines() }}"

- name: "Check the podman secrets of {{ app_bookstack__expect.name }}"
  ansible.builtin.command:
    argv: [ 'podman', 'secret', 'exists', "{{ item.split(',') | first }}" ]
  loop: "{{ app_bookstack__expect.secrets }}"
  changed_when: false

- name: "Read the state of the service {{ app_bookstack__expect.name }}"
  ansible.builtin.command:
    argv: [ 'systemctl', 'is-active', "{{ app_bookstack__expect.name }}" ]
  register: 'app_bookstack__test_service'
  changed_when: false
  failed_when: false

- name: "Assert the service is active: {{ app_bookstack__expect.name }}"
  ansible.builtin.assert:
    that:
      - app_bookstack__test_service.stdout == 'active'

- name: "Inspect the container {{ app_bookstack__expect.name }}"
  ansible.builtin.command:
    argv: [ 'podman', 'inspect', "{{ app_bookstack__expect.name }}" ]
  register: 'app_bookstack__test_inspect'
  changed_when: false

- name: "Assert the addresses and environment of {{ app_bookstack__expect.name }}"
  ansible.builtin.assert:
    that:
      - app_bookstack__test_net.IPAddress == app_bookstack__expect.ip
      - app_bookstack__expect.ip6 is none or app_bookstack__test_net.GlobalIPv6Address == app_bookstack__expect.ip6
      - app_bookstack__expect.env is subset(app_bookstack__test_container.Config.Env)
    fail_msg: >-
      IPv4 {{ app_bookstack__test_net.IPAddress }}, IPv6 {{ app_bookstack__test_net.GlobalIPv6Address }},
      missing environment {{ app_bookstack__expect.env | reject('in', app_bookstack__test_container.Config.Env) | list }}
  vars:
    app_bookstack__test_container: "{{ (app_bookstack__test_inspect.stdout | from_json)[0] }}"
    app_bookstack__test_net: "{{ app_bookstack__test_container.NetworkSettings.Networks['podman-molecule'] }}"

- name: "Request the login pages of {{ app_bookstack__expect.name }}"
  ansible.builtin.uri:
    url: "{{ item }}"
    return_content: true
  loop: "{{ app_bookstack__expect.urls }}"
  register: 'app_bookstack__test_login'
  until: app_bookstack__test_login.status == 200
  retries: 60
  delay: 5

- name: "Assert the login pages of {{ app_bookstack__expect.name }} are served by BookStack"
  ansible.builtin.assert:
    that:
      - "'bookstack' in app_bookstack__test_login.results[app_bookstack__test_index].content | lower"
    fail_msg: "{{ item }}: {{ app_bookstack__test_login.results[app_bookstack__test_index].content | truncate(300) }}"
    quiet: true
  loop: "{{ app_bookstack__expect.urls }}"
  loop_control:
    index_var: 'app_bookstack__test_index'
