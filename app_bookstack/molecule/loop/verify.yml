---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  tasks:

    - name: 'Check every instance'
      ansible.builtin.include_tasks: 'tasks/check_instance.yml'
      loop: "{{ app_bookstack__test_expect }}"
      loop_control:
        loop_var: 'app_bookstack__expect'
        label: "{{ app_bookstack__expect.name }}"
