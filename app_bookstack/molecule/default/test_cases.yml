---
# Network created by container_podman in prepare.yml, shared by all test cases
app_bookstack__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_bookstack__test_image: 'lscr.io/linuxserver/bookstack:latest'

# Database started by prepare.yml, test credentials only
app_bookstack__test_database:
  name: 'molecule-mariadb'
  image: 'docker.io/library/mariadb:11'
  ip: '10.89.0.20'
  database: 'bookstack'
  user: 'bookstack'
  password: '2KuwCD-s6v_GFy-GrNOvhIKz'

# Test key only, generated for this scenario
app_bookstack__test_app_key: 'base64:ENZ/nuxiEbr4eND1zEe6uoXupzlzpWSU2jcGZV6qSWk='

app_bookstack__test_cases:

  - name: 'molecule-bookstack-ipv4-only'
    role_vars:
      bookstack_home: '/opt/bookstack-molecule'
      bookstack_ip: '10.89.0.10'
      bookstack_network: 'podman-molecule'
      bookstack_hostname: 'bookstack-molecule'
      bookstack_timezone: 'Europe/Berlin'
      bookstack_uid: 1000
      bookstack_environment:
        APP_URL: 'http://10.89.0.10'
        DB_HOST: '10.89.0.20'
      bookstack_secrets:
        - name: 'bookstack_molecule_app_key'
          data: "{{ app_bookstack__test_app_key }}"
          target: 'APP_KEY'
        - name: 'bookstack_molecule_db_password'
          data: "{{ app_bookstack__test_database.password }}"
          target: 'DB_PASSWORD'
    expect:
      ip: '10.89.0.10'
      ip6: ~
      env:
        - 'APP_URL=http://10.89.0.10'
        - 'DB_HOST=10.89.0.20'
        - 'DB_DATABASE=bookstack'
        - 'DB_USERNAME=bookstack'
        - 'PUID=1000'
        - 'PGID=1000'
      secrets:
        - 'bookstack_molecule_app_key,type=env,target=APP_KEY'
        - 'bookstack_molecule_db_password,type=env,target=DB_PASSWORD'
      urls:
        - 'http://10.89.0.10/login'

  - name: 'molecule-bookstack-ipv6'
    role_vars:
      bookstack_home: '/opt/bookstack-molecule'
      bookstack_ip: '10.89.0.10'
      bookstack_ipv6: 'fd00:89::10'
      bookstack_network: 'podman-molecule'
      bookstack_hostname: 'bookstack-molecule'
      bookstack_timezone: 'Europe/Berlin'
      bookstack_uid: 1000
      bookstack_environment:
        APP_URL: 'http://10.89.0.10'
        DB_HOST: '10.89.0.20'
      bookstack_secrets:
        - name: 'bookstack_molecule_app_key'
          data: "{{ app_bookstack__test_app_key }}"
          target: 'APP_KEY'
        - name: 'bookstack_molecule_db_password'
          data: "{{ app_bookstack__test_database.password }}"
          target: 'DB_PASSWORD'
    expect:
      ip: '10.89.0.10'
      ip6: 'fd00:89::10'
      env:
        - 'APP_URL=http://10.89.0.10'
        - 'DB_HOST=10.89.0.20'
        - 'DB_DATABASE=bookstack'
        - 'DB_USERNAME=bookstack'
        - 'PUID=1000'
        - 'PGID=1000'
      secrets:
        - 'bookstack_molecule_app_key,type=env,target=APP_KEY'
        - 'bookstack_molecule_db_password,type=env,target=DB_PASSWORD'
      urls:
        - 'http://10.89.0.10/login'
        - 'http://[fd00:89::10]/login'
