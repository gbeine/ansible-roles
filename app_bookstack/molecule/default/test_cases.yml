---
# Network created by container_podman in prepare.yml, shared by all test cases
app_bookstack__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_bookstack__test_image: 'lscr.io/linuxserver/bookstack:latest'

# Database started by prepare.yml, test credentials only
app_bookstack__test_database:
  name: 'molecule-mariadb'
  image: 'docker.io/library/mariadb:11'
  ip: '10.89.0.20'
  database: 'bookstack'
  user: 'bookstack'
  password: '2KuwCD-s6v_GFy-GrNOvhIKz'

# Test key only, generated for this scenario
app_bookstack__test_app_key: 'base64:ENZ/nuxiEbr4eND1zEe6uoXupzlzpWSU2jcGZV6qSWk='

# The secrets of all test cases
app_bookstack__test_secrets:
  - name: 'bookstack_molecule_app_key'
    data: "{{ app_bookstack__test_app_key }}"
    target: 'APP_KEY'
  - name: 'bookstack_molecule_db_password'
    data: "{{ app_bookstack__test_database.password }}"
    target: 'DB_PASSWORD'

app_bookstack__test_secret_lines:
  - 'bookstack_molecule_app_key,type=mount,target=/run/secrets/bookstack_molecule_app_key'
  - 'bookstack_molecule_db_password,type=mount,target=/run/secrets/bookstack_molecule_db_password'

# The secrets are mounted as files, the image reads them with FILE__<variable>
app_bookstack__test_env:
  - 'PUID=1000'
  - 'PGID=1000'
  - 'FILE__APP_KEY=/run/secrets/bookstack_molecule_app_key'
  - 'FILE__DB_PASSWORD=/run/secrets/bookstack_molecule_db_password'

app_bookstack__test_cases:

  # Only the mandatory variables, IPv4 only
  - name: 'molecule-bookstack-default'
    role_vars:
      bookstack_home: '/opt/bookstack-molecule'
      bookstack_ip: '10.89.0.10'
      bookstack_network: 'podman-molecule'
      bookstack_hostname: 'bookstack-molecule'
      bookstack_timezone: 'Europe/Berlin'
      bookstack_uid: 1000
      bookstack_config:
        APP_URL: 'http://10.89.0.10'
        DB_HOST: '10.89.0.20'
      bookstack_secrets: "{{ app_bookstack__test_secrets }}"
    # Runs again without a change, BookStack must not restart
    side_effect:
      role_vars: {}
    expect:
      ip: '10.89.0.10'
      ip6: ~
      restart: false
      quadlet: []
      env: "{{ app_bookstack__test_env }}"
      secrets: "{{ app_bookstack__test_secret_lines }}"
      config:
        - 'DB_DATABASE="bookstack"'
        - 'DB_USERNAME="bookstack"'
        - 'APP_URL="http://10.89.0.10"'
        - 'DB_HOST="10.89.0.20"'
      config_absent: [ 'APP_DEFAULT_DARK_MODE' ]
      urls:
        - 'http://10.89.0.10/login'

  # IPv6, dependencies of the quadlet unit and options of BookStack
  - name: 'molecule-bookstack'
    role_vars:
      bookstack_home: '/opt/bookstack-molecule'
      bookstack_ip: '10.89.0.10'
      bookstack_ipv6: 'fd00:89::10'
      bookstack_network: 'podman-molecule'
      bookstack_hostname: 'bookstack-molecule'
      bookstack_timezone: 'Europe/Berlin'
      bookstack_uid: 1000
      bookstack_container:
        wants: [ 'network-online.target' ]
        after: [ 'network-online.target' ]
        requires_mounts_for: [ '/opt/bookstack-molecule' ]
      bookstack_config:
        APP_URL: 'http://10.89.0.10'
        DB_HOST: '10.89.0.20'
        MAIL_FROM_NAME: 'Molecule "Docs"'
        REVISION_LIMIT: 20
      bookstack_secrets: "{{ app_bookstack__test_secrets }}"
    # side_effect enables the dark mode, .env changes and BookStack has to restart
    side_effect:
      role_vars:
        bookstack_config:
          APP_URL: 'http://10.89.0.10'
          DB_HOST: '10.89.0.20'
          MAIL_FROM_NAME: 'Molecule "Docs"'
          REVISION_LIMIT: 20
          APP_DEFAULT_DARK_MODE: true
    expect:
      ip: '10.89.0.10'
      ip6: 'fd00:89::10'
      restart: true
      quadlet:
        - 'Wants=network-online.target'
        - 'After=network-online.target'
        - 'RequiresMountsFor=/opt/bookstack-molecule'
      env: "{{ app_bookstack__test_env }}"
      secrets: "{{ app_bookstack__test_secret_lines }}"
      config:
        - 'APP_URL="http://10.89.0.10"'
        - 'MAIL_FROM_NAME="Molecule \"Docs\""'
        - 'REVISION_LIMIT=20'
        - 'APP_DEFAULT_DARK_MODE=true'
      config_absent: []
      urls:
        - 'http://10.89.0.10/login'
        - 'http://[fd00:89::10]/login'
