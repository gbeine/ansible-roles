---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_bookstack__test_case: "{{ app_bookstack__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    app_bookstack__test_checked_files:
      - '/etc/containers/systemd/bookstack.container'

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ app_bookstack__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksum of the quadlet unit before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ app_bookstack__test_checked_files }}"
      register: 'app_bookstack__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include
    - name: 'Run app_bookstack with bookstack_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        bookstack_container: [ 'environment' ]
        app_bookstack__test_invalid:
          message: 'bookstack_container is not a dictionary'
          # combine of the defaults fails before the role checks anything
          search: 'failed to combine variables, expected dicts'

    - name: 'Run app_bookstack with a secret without name (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        bookstack_secrets:
          - data: "{{ app_bookstack__test_app_key }}"
            target: 'APP_KEY'
        app_bookstack__test_invalid:
          message: 'a secret without name'
          search: '^bookstack_secrets entries need name, data and target$'

    - name: 'Run app_bookstack without the secret of the application key (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        bookstack_secrets: "{{ app_bookstack__test_case.role_vars.bookstack_secrets | rejectattr('target', 'eq', 'APP_KEY') | list }}"
        app_bookstack__test_invalid:
          message: 'no secret of the application key'
          search: 'needs the secrets APP_KEY, DB_PASSWORD,\s+missing: APP_KEY\.'

    - name: 'Run app_bookstack with the mail password in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        bookstack_environment: "{{ app_bookstack__test_case.role_vars.bookstack_environment | combine({'MAIL_PASSWORD': 'molecule'}) }}"
        app_bookstack__test_invalid:
          message: 'the mail password in the environment'
          search: 'must not be set in bookstack_environment:\s+MAIL_PASSWORD\.'

    - name: 'Run app_bookstack with the file variable of the application key in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        bookstack_environment: "{{ app_bookstack__test_case.role_vars.bookstack_environment | combine({'FILE__APP_KEY': '/run/secrets/bookstack_molecule_app_key'}) }}"
        app_bookstack__test_invalid:
          message: 'the file variable of the application key in the environment'
          search: 'must not be set in bookstack_environment:\s+FILE__APP_KEY\.'

    - name: 'Run app_bookstack with an unknown environment variable (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        bookstack_environment: "{{ app_bookstack__test_case.role_vars.bookstack_environment | combine({'APP_NAMES': 'Molecule'}) }}"
        app_bookstack__test_invalid:
          message: 'an unknown environment variable'
          search: 'Unknown environment variables: APP_NAMES\.'

    - name: 'Run app_bookstack with an unknown environment variable in bookstack_container (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        bookstack_container:
          environment:
            FOO: 'bar'
        app_bookstack__test_invalid:
          message: 'an unknown environment variable in bookstack_container'
          search: 'Unknown environment variables: FOO\.'

    - name: 'Run app_bookstack with an unknown secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        bookstack_secrets: "{{ app_bookstack__test_case.role_vars.bookstack_secrets + [{'name': 'bookstack_molecule_token', 'data': 'x', 'target': 'API_TOKEN'}] }}"
        app_bookstack__test_invalid:
          message: 'an unknown secret'
          search: 'Unknown secrets: API_TOKEN\.'

    - name: 'Run app_bookstack with the changed role variables'
      when: app_bookstack__test_case.side_effect is defined
      block:

        # The first start migrates the database, the change restarts BookStack after it
        - name: 'Wait until BookStack finished the first start'
          ansible.builtin.uri:
            url: "http://{{ app_bookstack__test_case.expect.ip }}/login"
          register: 'app_bookstack__test_first_start'
          until: app_bookstack__test_first_start.status | default(0) == 200
          retries: 60
          delay: 5

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'bookstack' ]
          register: 'app_bookstack__test_started_before'
          changed_when: false

        - name: 'Set the changed role variables'
          ansible.builtin.set_fact:
            "{{ item.key }}": "{{ item.value }}"
          loop: "{{ app_bookstack__test_case.side_effect.role_vars | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: 'Run app_bookstack with the changed role variables'
          ansible.builtin.include_role:
            name: 'app_bookstack'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'bookstack' ]
          register: 'app_bookstack__test_started_after'
          changed_when: false

        - name: 'Assert the changed quadlet unit and the restart of the service'
          ansible.builtin.assert:
            that:
              - app_bookstack__quadlet_result is changed
              - app_bookstack__test_started_after.stdout | int > app_bookstack__test_started_before.stdout | int
            fail_msg: >-
              quadlet changed: {{ app_bookstack__quadlet_result is changed }},
              start before {{ app_bookstack__test_started_before.stdout }}, after {{ app_bookstack__test_started_after.stdout }}
