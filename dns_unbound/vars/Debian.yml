---
# Included by tasks/main.yml on Debian

# The configuration shipped with the image, unbound.conf of
# https://github.com/klutchell/unbound-docker, with the paths of the image.
dns_unbound__config_default:
  server:
    do-daemonize: false
    username: 'unbound'
    chroot: '""'
    logfile: '""'
    pidfile: '""'
    verbosity: 1
    interface: '0.0.0.0'
    do-ip4: true
    do-udp: true
    do-tcp: true
    prefer-ip6: false
    harden-glue: true
    harden-dnssec-stripped: true
    use-caps-for-id: false
    edns-buffer-size: 1232
    prefetch: true
    prefetch-key: true
    num-threads: 1
    so-sndbuf: 0
    msg-cache-size: '64m'
    rrset-cache-size: '128m'
    serve-expired: true
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800
    access-control:
      - '127.0.0.0/8 allow'
      - '192.168.0.0/16 allow'
      - '172.16.0.0/12 allow'
      - '10.0.0.0/8 allow'
    private-address:
      - '192.168.0.0/16'
      - '169.254.0.0/16'
      - '172.16.0.0/12'
      - '10.0.0.0/8'
      - 'fd00::/8'
      - 'fe80::/10'
    root-hints: '/var/unbound/root.hints'
    auto-trust-anchor-file: '/var/unbound/root.key'
    outgoing-range: 8192
    num-queries-per-thread: 4096
    tls-cert-bundle: '/etc/ssl/certs/ca-certificates.crt'
