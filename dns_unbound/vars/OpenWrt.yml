---
# Included by tasks/main.yml on OpenWrt

# The default configuration of unbound in OpenWrt (net/unbound/files/unbound.uci of the packages feed),
# written as options of unbound.conf and the UCI options without counterpart, the role translates them to /etc/config/unbound.
# The disabled example zones of the delivery are not part of the default.
dns_unbound__openwrt_config_default:
  server:
    # LuCI writes it on the first save
    enabled: true
    verbosity: 1
    port: 53
    edns-buffer-size: 1232
    num-threads: 1
    cache-min-ttl: 120
    cache-max-negative-ttl: 1000
    extended-statistics: false
    interface-automatic: true
    qname-minimisation: false
    qname-minimisation-strict: false
    hide-identity: true
    hide-version: true
    add_extra_dns: 0
    add_local_fqdn: 1
    add_wan_fqdn: 0
    dhcp_link: 'none'
    dhcp4_slaac6: false
    domain: 'lan'
    domain_type: 'static'
    exclude_ipv6_ga: false
    iface_trig: [ 'lan', 'wan' ]
    iface_wan: [ 'wan' ]
    localservice: true
    protocol: 'default'
    rebind_localhost: false
    rebind_protection: 1
    recursion: 'default'
    resource: 'default'
    root_age: 9
    unbound_control: 0
    validator: false
    validator_ntp: true

# Clauses and options are merged recursively like on Debian, null removes them
dns_unbound__openwrt_config: >-
  {{ dns_unbound__openwrt_config_default | combine(dns_unbound__config_user, recursive=true) }}

dns_unbound__openwrt_uci_config: '/etc/config/unbound'
dns_unbound__openwrt_packages: [ 'unbound-daemon' ]

# The role writes the section unbound with this name like the delivery of OpenWrt
dns_unbound__openwrt_main_section: 'ub_main'
# Section types managed by the role, prune removes undeclared sections of these types only
dns_unbound__openwrt_section_types: [ 'unbound', 'zone' ]

# Options of the clause server and their UCI options, taken from unbound_conf() and unbound_uci() of unbound.sh.
# Numbers outside min and max are replaced by unbound.sh without notice, the role fails instead.
dns_unbound__openwrt_server_options:
  verbosity: { uci: 'verbosity', type: 'number', min: 0, max: 5 }
  port: { uci: 'listen_port', type: 'number', min: 1024, max: 10240, also: [ 53 ] }
  edns-buffer-size: { uci: 'edns_size', type: 'number', min: 512, max: 4096 }
  num-threads: { uci: 'num_threads', type: 'number', min: 1, max: 2 }
  cache-min-ttl: { uci: 'ttl_min', type: 'number', min: 0, max: 1800 }
  cache-max-negative-ttl: { uci: 'ttl_neg_max', type: 'number', min: 0 }
  # 0 disables the rate limit
  ratelimit: { uci: 'rate_limit', type: 'number', min: 11, max: 99999, also: [ 0 ] }
  extended-statistics: { uci: 'extended_stats', type: 'boolean' }
  # unbound.sh enables it without the option, unbound does not
  interface-automatic: { uci: 'interface_auto', type: 'boolean', absent: '0' }
  qname-minimisation: { uci: 'query_minimize', type: 'boolean' }
  qname-minimisation-strict: { uci: 'query_min_strict', type: 'boolean' }
  domain-insecure: { uci: 'domain_insecure', type: 'list' }

# Options of the clause server that unbound.sh writes from other UCI options, named in the failure message
dns_unbound__openwrt_server_hints:
  access-control: 'localservice, iface_lan'
  interface: 'interface_auto, iface_lan'
  private-address: 'rebind_protection, rebind_localhost'
  module-config: 'validator, dns64-prefix'
  auto-trust-anchor-file: 'validator'
  harden-dnssec-stripped: 'validator'
  val-override-date: 'validator_ntp'
  ip-ratelimit: 'ratelimit (half of it)'
  prefetch: 'recursion'
  prefetch-key: 'recursion, validator'
  target-fetch-policy: 'recursion'
  aggressive-nsec: 'recursion, validator'
  do-ip4: 'protocol'
  do-ip6: 'protocol'
  prefer-ip4: 'protocol'
  prefer-ip6: 'protocol'
  msg-cache-size: 'resource'
  rrset-cache-size: 'resource'
  key-cache-size: 'resource'
  neg-cache-size: 'resource'
  outgoing-range: 'resource'
  num-queries-per-thread: 'resource'
  msg-buffer-size: 'resource'
  harden-glue: 'resource'
  use-caps-for-id: 'resource'
  so-sndbuf: 'resource'
  cache-max-ttl: 'unbound.sh, fixed 72000'
  root-hints: 'unbound.sh, /var/lib/unbound/root.hints'
  tls-cert-bundle: 'unbound.sh, package ca-bundle'
  username: 'unbound.sh'
  chroot: 'unbound.sh'
  directory: 'unbound.sh'
  pidfile: 'unbound.sh'
  do-daemonize: 'unbound.sh'
  logfile: 'unbound.sh, syslog'
  use-syslog: 'unbound.sh'

# Prefix of the names of the sections zone, like the example zones of OpenWrt (fwd_google, auth_icann)
dns_unbound__openwrt_zone_prefixes:
  forward-zone: 'fwd_'
  stub-zone: 'stub_'
  auth-zone: 'auth_'
