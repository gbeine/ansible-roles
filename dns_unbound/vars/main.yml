---
# Options of the UCI configuration of unbound on OpenWrt without counterpart in unbound.conf,
# they are written with their UCI names into the clause and ignored with a warning on Debian
dns_unbound__openwrt_only_options:
  server:
    # Written by LuCI (Enable Unbound), the role stops and disables unbound with false
    - 'enabled'
    - 'add_extra_dns'
    - 'add_local_fqdn'
    - 'add_wan_fqdn'
    - 'dhcp_link'
    - 'dhcp4_slaac6'
    - 'domain'
    - 'domain_type'
    - 'exclude_ipv6_ga'
    - 'iface_lan'
    - 'iface_trig'
    - 'iface_wan'
    - 'localservice'
    - 'prefetch_root'
    - 'protocol'
    - 'rebind_localhost'
    - 'rebind_protection'
    - 'recursion'
    - 'resource'
    - 'root_age'
    - 'unbound_control'
    - 'validator'
    - 'validator_ntp'
  forward-zone:
    - 'dns_assist'
    - 'enabled'
    - 'resolv_conf'
    - 'section'
  stub-zone:
    - 'enabled'
    - 'section'
  auth-zone:
    - 'enabled'
    - 'section'

# UCI options of the server clause with a list of values
dns_unbound__openwrt_only_list_options: [ 'iface_lan', 'iface_trig', 'iface_wan' ]

# Clauses of zones, name is one name or a list of names
dns_unbound__zone_clauses: [ 'forward-zone', 'stub-zone', 'auth-zone' ]
