---

- name: 'Warn about the ignored OpenWrt options'
  ansible.builtin.debug:
    msg: "WARNING: option of the UCI configuration of OpenWrt ignored, {{ dns_unbound__ignored }}"
  loop: >-
    {%- set ignored = [] -%}
    {%- for clause, value in dns_unbound__config.items() if value is not none -%}
    {%-   for options in (value if value is sequence and value is not mapping and value is not string else [ value ]) -%}
    {#-     enabled of a zone is applied, a disabled zone is not written -#}
    {%-     for option in options.keys() | select('in', dns_unbound__openwrt_only_options[clause] | default([]))
              | reject('eq', 'enabled' if clause in dns_unbound__zone_clauses else '') -%}
    {%-       set _ = ignored.append(clause ~ '.' ~ option) -%}
    {%-     endfor -%}
    {%-   endfor -%}
    {%- endfor -%}
    {{ ignored }}
  loop_control:
    loop_var: 'dns_unbound__ignored'

- name: 'Create directories'
  ansible.builtin.file:
    dest: "{{ dns_unbound__home }}"
    mode: '0755'
    state: 'directory'

# unbound-checkconf of the image checks the configuration in a throwaway container before it is replaced
- name: 'Generate the configuration'
  ansible.builtin.template:
    src: 'unbound.conf.j2'
    dest: "{{ dns_unbound__podman_config_file }}"
    mode: '0644'
    validate: >-
      podman run --rm --network none --entrypoint /usr/sbin/unbound-checkconf
      --volume %s:/etc/unbound/unbound.conf:ro {{ dns_unbound__container.image }}
  register: 'dns_unbound__config_result'

- name: 'Gathering facts about services...'
  ansible.builtin.service_facts:

- name: 'Install container'
  containers.podman.podman_container:
    name: "{{ dns_unbound__container.name }}"
    hostname: "{{ dns_unbound__container.hostname }}"
    image: "{{ dns_unbound__container.image }}"
    ip: "{{ dns_unbound__container.ip }}"
    ip6: "{{ dns_unbound__container.ipv6 | default(omit) }}"
    network: "{{ dns_unbound__container.network }}"
    timezone: "{{ dns_unbound__container.timezone }}"
    env: "{{ dns_unbound__container.environment | default(omit) }}"
    etc_hosts: "{{ dns_unbound__container.etc_hosts | default(omit) }}"
    expose: "{{ dns_unbound__container.expose | default(omit) }}"
    label: "{{ dns_unbound__container.labels | default(omit) }}"
    publish: "{{ dns_unbound__container.publish | default(omit) }}"
    secrets: "{{ dns_unbound__container.secrets | default(omit) }}"
    volume: "{{ dns_unbound__container.volumes | default(omit) }}"
    quadlet_options: |
      [Install]
      WantedBy=default.target

      [Service]
      RestartSec=5
      Restart=always

      [Unit]
      {% if dns_unbound__container.requires is defined %}
      Requires={{ dns_unbound__container.requires | join(' ') }}
      {% endif %}
    restart_policy: 'no'
    state: 'quadlet'
  register: 'dns_unbound__quadlet_result'

- name: 'Start and enable container'
  ansible.builtin.systemd_service:
    name: "{{ dns_unbound__container.name }}"
    daemon_reload: true
    state: "{{ 'restarted' if dns_unbound__restart | bool else 'started' }}"
    enabled: true
  vars:
    dns_unbound__running: >-
      {{ (ansible_facts.services[dns_unbound__container.name + '.service'].state | default('')) == 'running' }}
    dns_unbound__restart: >-
      {{ dns_unbound__running | bool
         and (dns_unbound__config_result is changed or dns_unbound__quadlet_result is changed) }}
  when: 'not ansible_check_mode'

- name: 'Enable autoupdate on container'
  when: 'dns_unbound__autoupdate_enabled | bool'
  ansible.builtin.include_role:
    name: 'container_update'
  vars:
    container_name: "{{ dns_unbound__container.name }}"
    container_image: "{{ dns_unbound__container.image }}"
    container_schedule: "{{ dns_unbound__autoupdate_schedule }}"
