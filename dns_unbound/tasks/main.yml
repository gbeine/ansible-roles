---

- name: Install unbound
  tags: [ 'dns_unbound'  ]
  block:

    - name: Install unbound using package management
      ansible.builtin.include_tasks:
        file: 'apt.yml'
      when: not dns_unbound__use_podman

    - name: Install unbound using podman
      ansible.builtin.include_tasks:
        file: 'podman.yml'
      when: dns_unbound__use_podman
