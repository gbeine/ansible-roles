---

- name: 'Install unbound'
  tags: [ 'dns_unbound' ]
  block:

    # OpenWrt has no Python, raw works without facts on every system
    - name: 'Detect OpenWrt'
      ansible.builtin.raw: 'cat /etc/openwrt_release 2>/dev/null || true'
      register: 'dns_unbound__release_file'
      changed_when: false
      check_mode: false

    - name: 'Set the platform'
      ansible.builtin.set_fact:
        dns_unbound__openwrt: "{{ dns_unbound__release_file.stdout is search('DISTRIB_ID=.?OpenWrt') }}"

    - name: 'Include OpenWrt specific variables'
      ansible.builtin.include_vars:
        file: 'OpenWrt.yml'
      when: dns_unbound__openwrt | bool

    - name: 'Validate the role variables'
      ansible.builtin.assert:
        that:
          - dns_unbound__config_user is mapping
          - dns_unbound__config_invalid_clauses | length == 0
          - dns_unbound__config_invalid_options | length == 0
          - dns_unbound__config_invalid_values | length == 0
          - dns_unbound__config_invalid_forwarders | length == 0
        # Only the failing checks are reported
        fail_msg: >-
          {{ [ ('unbound_config has to be a dictionary: ' ~ dns_unbound__config_user)
                 if dns_unbound__config_user is not mapping else '',
               ('unbound_config clauses have to be a dictionary, a list of dictionaries or null with a valid name: '
                ~ dns_unbound__config_invalid_clauses | join(', '))
                 if dns_unbound__config_invalid_clauses | length > 0 else '',
               ('unbound_config has invalid option names: ' ~ dns_unbound__config_invalid_options | join(', '))
                 if dns_unbound__config_invalid_options | length > 0 else '',
               ('unbound_config values have to be a boolean, a string, a number, a list of strings and numbers or null: '
                ~ dns_unbound__config_invalid_values | join(', '))
                 if dns_unbound__config_invalid_values | length > 0 else '',
               ('unbound_config forward-addr entries need the name of the certificate after # when forward-tls-upstream is set: '
                ~ dns_unbound__config_invalid_forwarders | join(', '))
                 if dns_unbound__config_invalid_forwarders | length > 0 else '' ]
             | select | join('. ') }}
        quiet: true
      vars:
        # Clause and option names of unbound consist of lowercase letters, digits and dashes
        dns_unbound__config_name_pattern: '^[a-z][a-z0-9-]*$'
        # The merged configuration of the platform, the defaults are valid, so every finding comes from unbound_config
        dns_unbound__config_clauses: >-
          {{ (dns_unbound__openwrt_config if dns_unbound__openwrt | bool else dns_unbound__config).items() | list
             if dns_unbound__config_user is mapping else [] }}
        # A clause is given once as a dictionary, repeated as a list of dictionaries or removed with null
        dns_unbound__config_invalid_clauses: >-
          {%- set ns = namespace(invalid=[]) -%}
          {%- for clause, value in dns_unbound__config_clauses -%}
          {%-   set clauses = value if value is sequence and value is not mapping and value is not string else [ value ] -%}
          {%-   if clause is not match(dns_unbound__config_name_pattern) or clauses | length == 0
                  or (value is not none and clauses | reject('mapping') | list | length > 0) -%}
          {%-     set ns.invalid = ns.invalid + [ clause ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.invalid }}
        dns_unbound__config_invalid_options: >-
          {%- set ns = namespace(invalid=[]) -%}
          {%- for clause, value in dns_unbound__config_clauses -%}
          {%-   for options in (value if value is sequence and value is not mapping and value is not string else [ value ]) | select('mapping') -%}
          {%-     for option in options.keys() | reject('match', dns_unbound__config_name_pattern)
                      | reject('in', dns_unbound__openwrt_only_options[clause] | default([])) -%}
          {%-       set ns.invalid = ns.invalid + [ clause ~ '.' ~ option ] -%}
          {%-     endfor -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ ns.invalid }}
        # Strings must not contain line breaks, they would add further options; null removes the option
        dns_unbound__config_invalid_values: >-
          {%- set ns = namespace(invalid=[]) -%}
          {%- for clause, value in dns_unbound__config_clauses -%}
          {%-   for options in (value if value is sequence and value is not mapping and value is not string else [ value ]) | select('mapping') -%}
          {%-     for option, setting in options.items() -%}
          {%-       set settings = setting if setting is sequence and setting is not string and setting is not mapping else [ setting ] -%}
          {%-       if setting is not none and setting is not boolean and (setting is mapping
                      or settings | select('boolean') | list | length > 0
                      or settings | reject('string') | reject('number') | list | length > 0
                      or settings | select('string') | select('search', '\n') | list | length > 0) -%}
          {%-         set ns.invalid = ns.invalid + [ clause ~ '.' ~ option ] -%}
          {%-       endif -%}
          {%-     endfor -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ ns.invalid }}
        # Unbound does not verify the certificate of a TLS forwarder without the name after #
        dns_unbound__config_invalid_forwarders: >-
          {%- set ns = namespace(invalid=[]) -%}
          {%- set zones = dict(dns_unbound__config_clauses)['forward-zone'] | default([], true) -%}
          {%- for zone in (zones if zones is sequence and zones is not mapping and zones is not string else [ zones ]) | select('mapping') -%}
          {%-   if zone['forward-tls-upstream'] | default(false) is sameas true -%}
          {%-     set addresses = zone['forward-addr'] | default([], true) -%}
          {%-     for address in (addresses if addresses is sequence and addresses is not string else [ addresses ]) | map('string') | reject('search', '#') -%}
          {%-       set ns.invalid = ns.invalid + [ address ] -%}
          {%-     endfor -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.invalid }}

    - name: 'Install unbound as container on Debian'
      ansible.builtin.include_tasks: 'debian.yml'
      when: not dns_unbound__openwrt | bool

    - name: 'Configure unbound on OpenWrt'
      ansible.builtin.include_tasks: 'openwrt.yml'
      when: dns_unbound__openwrt | bool
