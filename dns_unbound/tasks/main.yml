---

- name: 'Install unbound'
  tags: [ 'dns_unbound' ]
  block:

    - name: 'Validate the role variables'
      ansible.builtin.assert:
        that:
          - dns_unbound__config is mapping
          - not dns_unbound__podman_config_enabled | bool or dns_unbound__home is defined
          - dns_unbound__config_invalid_clauses | length == 0
          - dns_unbound__config_invalid_options | length == 0
          - dns_unbound__config_invalid_values | length == 0
          - dns_unbound__config_invalid_forwarders | length == 0
        # Only the failing checks are reported
        fail_msg: >-
          {{ [ ('unbound_config has to be a dictionary: ' ~ dns_unbound__config)
                 if dns_unbound__config is not mapping else '',
               ('unbound_home is required with unbound_config')
                 if dns_unbound__podman_config_enabled | bool and dns_unbound__home is not defined else '',
               ('unbound_config clauses have to be a dictionary or a list of dictionaries with a valid name: '
                ~ dns_unbound__config_invalid_clauses | join(', '))
                 if dns_unbound__config_invalid_clauses | length > 0 else '',
               ('unbound_config has invalid option names: ' ~ dns_unbound__config_invalid_options | join(', '))
                 if dns_unbound__config_invalid_options | length > 0 else '',
               ('unbound_config values have to be a boolean, a string, a number or a list of strings and numbers: '
                ~ dns_unbound__config_invalid_values | join(', '))
                 if dns_unbound__config_invalid_values | length > 0 else '',
               ('unbound_config forward-addr entries need the name of the certificate after # when forward-tls-upstream is set: '
                ~ dns_unbound__config_invalid_forwarders | join(', '))
                 if dns_unbound__config_invalid_forwarders | length > 0 else '' ]
             | select | join('. ') }}
        quiet: true
      vars:
        # Clause and option names of unbound consist of lowercase letters, digits and dashes
        dns_unbound__config_name_pattern: '^[a-z][a-z0-9-]*$'
        # A clause is given once as a dictionary or repeated as a list of dictionaries
        dns_unbound__config_invalid_clauses: >-
          {%- set ns = namespace(invalid=[]) -%}
          {%- for clause, value in (dns_unbound__config.items() if dns_unbound__config is mapping else []) -%}
          {%-   set clauses = value if value is sequence and value is not mapping and value is not string else [ value ] -%}
          {%-   if clause is not match(dns_unbound__config_name_pattern) or clauses | length == 0
                  or clauses | reject('mapping') | list | length > 0 -%}
          {%-     set ns.invalid = ns.invalid + [ clause ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.invalid }}
        dns_unbound__config_invalid_options: >-
          {%- set ns = namespace(invalid=[]) -%}
          {%- for clause, value in (dns_unbound__config.items() if dns_unbound__config is mapping else []) -%}
          {%-   for options in (value if value is sequence and value is not mapping and value is not string else [ value ]) | select('mapping') -%}
          {%-     for option in options.keys() | reject('match', dns_unbound__config_name_pattern) -%}
          {%-       set ns.invalid = ns.invalid + [ clause ~ '.' ~ option ] -%}
          {%-     endfor -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ ns.invalid }}
        # Strings must not contain line breaks, they would add further options
        dns_unbound__config_invalid_values: >-
          {%- set ns = namespace(invalid=[]) -%}
          {%- for clause, value in (dns_unbound__config.items() if dns_unbound__config is mapping else []) -%}
          {%-   for options in (value if value is sequence and value is not mapping and value is not string else [ value ]) | select('mapping') -%}
          {%-     for option, setting in options.items() -%}
          {%-       set settings = setting if setting is sequence and setting is not string and setting is not mapping else [ setting ] -%}
          {%-       if setting is not boolean and (setting is mapping
                      or settings | select('boolean') | list | length > 0
                      or settings | reject('string') | reject('number') | list | length > 0
                      or settings | select('string') | select('search', '\n') | list | length > 0) -%}
          {%-         set ns.invalid = ns.invalid + [ clause ~ '.' ~ option ] -%}
          {%-       endif -%}
          {%-     endfor -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ ns.invalid }}
        # Unbound does not verify the certificate of a TLS forwarder without the name after #
        dns_unbound__config_invalid_forwarders: >-
          {%- set ns = namespace(invalid=[]) -%}
          {%- set zones = dns_unbound__config['forward-zone'] | default([]) if dns_unbound__config is mapping else [] -%}
          {%- for zone in (zones if zones is sequence and zones is not mapping and zones is not string else [ zones ]) | select('mapping') -%}
          {%-   if zone['forward-tls-upstream'] | default(false) is sameas true -%}
          {%-     set addresses = zone['forward-addr'] | default([]) -%}
          {%-     for address in (addresses if addresses is sequence and addresses is not string else [ addresses ]) | map('string') | reject('search', '#') -%}
          {%-       set ns.invalid = ns.invalid + [ address ] -%}
          {%-     endfor -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.invalid }}

    - name: 'Create directories'
      when: 'dns_unbound__podman_config_enabled | bool'
      ansible.builtin.file:
        dest: "{{ item }}"
        mode: '0755'
        state: 'directory'
      loop:
        - "{{ dns_unbound__home }}"
        - "{{ dns_unbound__podman_config_dir }}"

    # unbound-checkconf of the image checks the file in a throwaway container before it is replaced
    - name: 'Generate the configuration'
      when: 'dns_unbound__podman_config_enabled | bool'
      ansible.builtin.template:
        src: 'unbound.conf.j2'
        dest: "{{ dns_unbound__podman_config_file }}"
        mode: '0644'
        validate: >-
          podman run --rm --network none --entrypoint /usr/sbin/unbound-checkconf
          --volume %s:/etc/unbound/custom.conf.d/unbound.conf:ro {{ dns_unbound__container.image }}
      register: 'dns_unbound__config_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ dns_unbound__container.name }}"
        hostname: "{{ dns_unbound__container.hostname }}"
        image: "{{ dns_unbound__container.image }}"
        ip: "{{ dns_unbound__container.ip }}"
        ip6: "{{ dns_unbound__container.ipv6 | default(omit) }}"
        network: "{{ dns_unbound__container.network }}"
        timezone: "{{ dns_unbound__container.timezone }}"
        env: "{{ dns_unbound__container.environment | default(omit) }}"
        etc_hosts: "{{ dns_unbound__container.etc_hosts | default(omit) }}"
        expose: "{{ dns_unbound__container.expose | default(omit) }}"
        label: "{{ dns_unbound__container.labels | default(omit) }}"
        publish: "{{ dns_unbound__container.publish | default(omit) }}"
        secrets: "{{ dns_unbound__container.secrets | default(omit) }}"
        volume: "{{ dns_unbound__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if dns_unbound__container.requires is defined %}
          Requires={{ dns_unbound__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'dns_unbound__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ dns_unbound__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if dns_unbound__restart | bool else 'started' }}"
        enabled: true
      vars:
        dns_unbound__running: >-
          {{ (ansible_facts.services[dns_unbound__container.name + '.service'].state | default('')) == 'running' }}
        dns_unbound__restart: >-
          {{ dns_unbound__running | bool
             and (dns_unbound__config_result is changed or dns_unbound__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'dns_unbound__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ dns_unbound__container.name }}"
        container_image: "{{ dns_unbound__container.image }}"
        container_schedule: "{{ dns_unbound__autoupdate_schedule }}"
