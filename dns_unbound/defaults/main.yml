---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/dns-unbound
#

dns_unbound__use_podman: "{{ unbound_use_podman | default(true) }}"

dns_unbound__ip: "{{ unbound_ip | mandatory }}"
dns_unbound__ipv6: "{{ unbound_ipv6 }}"
dns_unbound__network: "{{ unbound_network | mandatory }}"
dns_unbound__hostname: "{{ unbound_hostname | mandatory }}"
dns_unbound__timezone: "{{ unbound_timezone | mandatory }}"

dns_unbound__version: "{{ unbound_version | default('latest') }}"

dns_unbound__publish: "{{ unbound_publish | default([]) }}"

dns_unbound__container: "{{ dns_unbound__container_default | combine(unbound_container | default({})) }}"

dns_unbound__autoupdate_enabled: "{{ unbound_autoupdate_enabled | default(false) }}"
dns_unbound__autoupdate_schedule: "{{ unbound_autoupdate_schedule | default('*-*-* 03:00:00') }}"

dns_unbound__podman_name: 'unbound'
dns_unbound__podman_image: 'docker.io/mvance/unbound'
dns_unbound__podman_tag: "{{ dns_unbound__version }}"

dns_unbound__podman_home: "{{ dns_unbound__home }}"

dns_unbound__container_default:
  name: "{{ dns_unbound__podman_name }}"
  hostname: "{{ dns_unbound__hostname }}"
  image: "{{ dns_unbound__podman_image }}:{{ dns_unbound__podman_tag }}"
  ip: "{{ dns_unbound__ip }}"
  ipv6: "{{ dns_unbound__ipv6 }}"
  network: "{{ dns_unbound__network }}"
  timezone: "{{ dns_unbound__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
  publish: "{{ dns_unbound__publish }}"
