---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/dns-unbound
#

dns_unbound__home: "{{ unbound_home | mandatory }}"
dns_unbound__ip: "{{ unbound_ip | mandatory }}"
dns_unbound__ipv6: "{{ unbound_ipv6 }}"
dns_unbound__network: "{{ unbound_network | mandatory }}"
dns_unbound__hostname: "{{ unbound_hostname | mandatory }}"
dns_unbound__timezone: "{{ unbound_timezone | mandatory }}"
dns_unbound__labels: "{{ unbound_labels }}"

dns_unbound__version: "{{ unbound_version | default('latest') }}"

dns_unbound__publish: "{{ unbound_publish | default([]) }}"

dns_unbound__config_user: "{{ unbound_config | default({}) }}"
dns_unbound__config: >-
  {{ dns_unbound__config_default | combine(dns_unbound__config_user, recursive=true) }}

# Removes undeclared sections unbound and zone on OpenWrt
dns_unbound__prune: "{{ unbound_prune | default(true) }}"

dns_unbound__container: "{{ dns_unbound__container_default | combine(unbound_container | default({})) }}"

dns_unbound__autoupdate_enabled: "{{ unbound_autoupdate_enabled | default(false) }}"
dns_unbound__autoupdate_schedule: "{{ unbound_autoupdate_schedule }}"

#
# Defaults - do not change
#

dns_unbound__podman_name: 'unbound'
dns_unbound__podman_image: 'docker.io/klutchell/unbound'
dns_unbound__podman_tag: "{{ dns_unbound__version }}"

dns_unbound__podman_config_file: "{{ dns_unbound__home }}/unbound.conf"

# The configuration shipped with the image, unbound.conf of
# https://github.com/klutchell/unbound-docker, with the paths of the image.
dns_unbound__config_default:
  server:
    do-daemonize: false
    username: 'unbound'
    chroot: '""'
    logfile: '""'
    pidfile: '""'
    verbosity: 1
    interface: '0.0.0.0'
    do-ip4: true
    do-udp: true
    do-tcp: true
    prefer-ip6: false
    harden-glue: true
    harden-dnssec-stripped: true
    use-caps-for-id: false
    edns-buffer-size: 1232
    prefetch: true
    prefetch-key: true
    num-threads: 1
    so-sndbuf: 0
    msg-cache-size: '64m'
    rrset-cache-size: '128m'
    serve-expired: true
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800
    access-control:
      - '127.0.0.0/8 allow'
      - '192.168.0.0/16 allow'
      - '172.16.0.0/12 allow'
      - '10.0.0.0/8 allow'
    private-address:
      - '192.168.0.0/16'
      - '169.254.0.0/16'
      - '172.16.0.0/12'
      - '10.0.0.0/8'
      - 'fd00::/8'
      - 'fe80::/10'
    root-hints: '/var/unbound/root.hints'
    auto-trust-anchor-file: '/var/unbound/root.key'
    outgoing-range: 8192
    num-queries-per-thread: 4096
    tls-cert-bundle: '/etc/ssl/certs/ca-certificates.crt'

dns_unbound__container_default:
  name: "{{ dns_unbound__podman_name }}"
  hostname: "{{ dns_unbound__hostname }}"
  image: "{{ dns_unbound__podman_image }}:{{ dns_unbound__podman_tag }}"
  ip: "{{ dns_unbound__ip }}"
  ipv6: "{{ dns_unbound__ipv6 | default(omit) }}"
  network: "{{ dns_unbound__network }}"
  timezone: "{{ dns_unbound__timezone }}"
  labels: "{{ dns_unbound__labels | default(omit) }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ dns_unbound__podman_config_file }}:/etc/unbound/unbound.conf:ro"
  publish: "{{ dns_unbound__publish }}"
