---
dns_unbound__test_cases:

  # Without variables the role writes the delivered configuration of OpenWrt without the disabled example zones.
  # prepare disables the DNS of dnsmasq, unbound listens on port 53 then
  - name: 'molecule-unbound-openwrt-default'
    prepare_dnsmasq_port: '0'
    role_vars: {}
    expect:
      uci:
        - 'unbound.ub_main=unbound'
        - 'unbound.ub_main.enabled=1'
        - 'unbound.ub_main.manual_conf=0'
        - 'unbound.ub_main.listen_port=53'
        - 'unbound.ub_main.verbosity=1'
        - 'unbound.ub_main.hide_binddata=1'
        - 'unbound.ub_main.interface_auto=1'
        - 'unbound.ub_main.rebind_protection=1'
        - 'unbound.ub_main.dhcp_link=none'
        - 'unbound.ub_main.domain=lan'
        - 'unbound.ub_main.iface_trig=lan wan'
        - 'unbound.ub_main.dns64=0'
      # The example zones of the delivery are removed
      absent: [ 'unbound.auth_icann', 'unbound.fwd_isp', 'unbound.fwd_google', 'unbound.fwd_cloudflare' ]
      # Lines of the configuration generated by unbound.sh, without indentation
      generated:
        - 'port: 53'
        - 'verbosity: 1'
        - 'hide-identity: yes'
        - 'interface-automatic: yes'
        - 'private-address: 192.168.0.0/16'
      generated_absent: [ 'forward-zone:' ]
      port: 53

  # The role creates the section unbound in a configuration without it, prepare adds a zone the role has to remove
  - name: 'molecule-unbound-openwrt'
    prepare_zone: true
    role_vars:
      unbound_config:
        server:
          port: 1053
          verbosity: 2
          domain-insecure: [ 'molecule.test' ]
          resource: 'small'
          recursion: 'passive'
          # 0 disables the rate limit
          ratelimit: 0
        forward-zone:
          - name: '.'
            forward-tls-upstream: true
            forward-addr: [ '1.1.1.1@853#cloudflare-dns.com', '1.0.0.1@853#cloudflare-dns.com' ]
        stub-zone:
          - name: 'lab.example.org'
            stub-addr: '192.0.2.53'
            # Kept in UCI, unbound.sh does not write the zone
            enabled: false
        # Like the zone auth_icann of the delivery: one section with several names and the directory of the zone files
        auth-zone:
          - section: 'auth_icann'
            name: [ '.', 'arpa.', 'in-addr.arpa.', 'ip6.arpa.' ]
            enabled: false
            fallback-enabled: true
            primary: [ 'lax.xfr.dns.icann.org', 'iad.xfr.dns.icann.org' ]
            url: 'https://www.internic.net/domain/'
    # side_effect changes the verbosity, unbound has to restart and generate the configuration again
    side_effect:
      server:
        verbosity: 3
    expect:
      uci:
        - 'unbound.ub_main=unbound'
        - 'unbound.ub_main.listen_port=1053'
        - 'unbound.ub_main.verbosity=3'
        - 'unbound.ub_main.domain_insecure=molecule.test'
        - 'unbound.ub_main.resource=small'
        - 'unbound.ub_main.recursion=passive'
        - 'unbound.ub_main.rate_limit=0'
        - 'unbound.fwd_root=zone'
        - 'unbound.fwd_root.enabled=1'
        - 'unbound.fwd_root.zone_type=forward_zone'
        - 'unbound.fwd_root.zone_name=.'
        - 'unbound.fwd_root.server=1.1.1.1@853#cloudflare-dns.com 1.0.0.1@853#cloudflare-dns.com'
        - 'unbound.fwd_root.tls_upstream=1'
        - 'unbound.fwd_root.fallback=0'
        - 'unbound.stub_lab_example_org=zone'
        - 'unbound.stub_lab_example_org.zone_type=stub_zone'
        - 'unbound.stub_lab_example_org.server=192.0.2.53'
        - 'unbound.stub_lab_example_org.enabled=0'
        - 'unbound.auth_icann=zone'
        - 'unbound.auth_icann.enabled=0'
        - 'unbound.auth_icann.zone_type=auth_zone'
        - 'unbound.auth_icann.zone_name=. arpa. in-addr.arpa. ip6.arpa.'
        - 'unbound.auth_icann.url_dir=https://www.internic.net/domain/'
        - 'unbound.auth_icann.fallback=1'
        - 'unbound.auth_icann.server=lax.xfr.dns.icann.org iad.xfr.dns.icann.org'
      absent: [ 'unbound.fwd_molecule' ]
      generated:
        - 'port: 1053'
        - 'verbosity: 3'
        - 'domain-insecure: molecule.test'
        - 'msg-cache-size: 1024k'
        - 'forward-zone:'
        - 'name: .'
        - 'forward-addr: 1.1.1.1@853#cloudflare-dns.com'
        - 'forward-first: no'
        - 'forward-tls-upstream: yes'
      generated_absent: [ 'verbosity: 2', 'molecule.example', 'stub-zone:', 'lab.example.org', 'ratelimit:', 'auth-zone:' ]
      port: 1053
