---
# Network created by container_podman in prepare.yml, shared by all test cases
dns_unbound__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

dns_unbound__test_image: 'docker.io/klutchell/unbound:latest'

dns_unbound__test_config_file: '/srv/unbound/unbound.conf'

# Lines of the generated file without indentation that the defaults of the role produce
dns_unbound__test_config_default:
  - 'server:'
  - 'access-control: 127.0.0.0/8 allow'
  - 'access-control: 10.0.0.0/8 allow'
  - 'auto-trust-anchor-file: /var/unbound/root.key'
  - 'chroot: ""'
  - 'do-daemonize: no'
  - 'interface: 0.0.0.0'
  - 'root-hints: /var/unbound/root.hints'
  - 'tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt'
  - 'username: unbound'
  - 'verbosity: 1'

dns_unbound__test_cases:

  - name: 'molecule-unbound-ipv4-only'
    role_vars:
      unbound_home: '/srv/unbound'
      unbound_ip: '10.89.0.10'
      unbound_network: 'podman-molecule'
      unbound_hostname: 'unbound-molecule'
      unbound_timezone: 'Europe/Berlin'
    expect:
      ip: '10.89.0.10'
      ip6: ~
      config: "{{ dns_unbound__test_config_default }}"
      config_absent: [ 'forward-zone:' ]

  - name: 'molecule-unbound-ipv6'
    role_vars:
      unbound_home: '/srv/unbound'
      unbound_ip: '10.89.0.10'
      unbound_ipv6: 'fd00:89::10'
      unbound_network: 'podman-molecule'
      unbound_hostname: 'unbound-molecule'
      unbound_timezone: 'Europe/Berlin'
    expect:
      ip: '10.89.0.10'
      ip6: 'fd00:89::10'
      config: "{{ dns_unbound__test_config_default }}"
      config_absent: [ 'forward-zone:' ]

  # side_effect switches the forwarders, overrides and removes a server option; only the configuration changes,
  # verify checks the file and the TLS session afterwards
  - name: 'molecule-unbound-config'
    role_vars:
      unbound_home: '/srv/unbound'
      unbound_ip: '10.89.0.10'
      unbound_network: 'podman-molecule'
      unbound_hostname: 'unbound-molecule'
      unbound_timezone: 'Europe/Berlin'
      unbound_config:
        server:
          private-domain: [ 'molecule.test', 'home.arpa' ]
          # Option of the UCI configuration of OpenWrt, ignored with a warning
          dhcp_link: 'dnsmasq'
        forward-zone:
          - name: '.'
            forward-tls-upstream: true
            forward-addr:
              - '1.1.1.1@853#cloudflare-dns.com'
              - '1.0.0.1@853#cloudflare-dns.com'
        stub-zone:
          # A list of names gives a clause per name, section is ignored with a warning
          - name: [ 'lab.molecule.test', 'lab2.molecule.test' ]
            stub-addr: '192.0.2.53'
            section: 'stub_lab'
          # Disabled zones are not written
          - name: 'off.molecule.test'
            stub-addr: '192.0.2.54'
            enabled: false
    side_effect:
      changed: [ 'config' ]
      role_vars:
        unbound_config:
          server:
            private-domain: [ 'molecule.test', 'home.arpa' ]
            verbosity: 2
            so-sndbuf: ~
            dhcp_link: 'dnsmasq'
          forward-zone:
            - name: '.'
              forward-tls-upstream: true
              forward-addr:
                - '9.9.9.9@853#dns.quad9.net'
                - '149.112.112.112@853#dns.quad9.net'
          stub-zone:
            # A list of names gives a clause per name, section is ignored with a warning
            - name: [ 'lab.molecule.test', 'lab2.molecule.test' ]
              stub-addr: '192.0.2.53'
              section: 'stub_lab'
            # Disabled zones are not written
            - name: 'off.molecule.test'
              stub-addr: '192.0.2.54'
              enabled: false
    expect:
      ip: '10.89.0.10'
      ip6: ~
      # Lines of the generated file without indentation, clauses and options sorted by name, name first
      config:
        - 'forward-zone:'
        - 'name: .'
        - 'forward-addr: 9.9.9.9@853#dns.quad9.net'
        - 'forward-addr: 149.112.112.112@853#dns.quad9.net'
        - 'forward-tls-upstream: yes'
        - 'stub-zone:'
        - 'name: lab.molecule.test'
        - 'name: lab2.molecule.test'
        - 'stub-addr: 192.0.2.53'
        - 'server:'
        - 'access-control: 127.0.0.0/8 allow'
        - 'private-domain: molecule.test'
        - 'private-domain: home.arpa'
        - 'username: unbound'
        - 'verbosity: 2'
      config_absent:
        - 'verbosity: 1'
        - 'so-sndbuf: 0'
        - 'cloudflare'
        - 'dhcp_link'
        - 'section'
        - 'off.molecule.test'
        - '192.0.2.54'
      forwarder_ips:
        - '9.9.9.9'
        - '149.112.112.112'
