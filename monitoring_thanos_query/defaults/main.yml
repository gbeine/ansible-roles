---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-thanos-query
#

# The image has no tag latest
monitoring_thanos_query__version: "{{ thanos_query_version | mandatory }}"

monitoring_thanos_query__ip: "{{ thanos_query_ip | mandatory }}"
monitoring_thanos_query__ipv6: "{{ thanos_query_ipv6 }}"
monitoring_thanos_query__network: "{{ thanos_query_network | mandatory }}"
monitoring_thanos_query__hostname: "{{ thanos_query_hostname | mandatory }}"
monitoring_thanos_query__timezone: "{{ thanos_query_timezone | mandatory }}"
monitoring_thanos_query__labels: "{{ thanos_query_labels }}"

# The gRPC addresses of the StoreAPIs, e.g. thanos-sidecar:10901
monitoring_thanos_query__endpoints: "{{ thanos_query_endpoints | mandatory }}"

monitoring_thanos_query__container: "{{ monitoring_thanos_query__podman_container_default | combine(thanos_query_container | default({})) }}"

# Thanos reads no variables besides TZ
monitoring_thanos_query__environment: "{{ monitoring_thanos_query__environment_default | combine(thanos_query_environment | default({})) }}"

monitoring_thanos_query__autoupdate_enabled: "{{ thanos_query_autoupdate_enabled | default(false) }}"
monitoring_thanos_query__autoupdate_schedule: "{{ thanos_query_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_thanos_query__environment_default:
  TZ: "{{ monitoring_thanos_query__timezone }}"

monitoring_thanos_query__environment_allowed: [ 'TZ' ]

# Addresses of the endpoints, host or IP and port, IPv6 in brackets and the DNS prefixes of Thanos (dns+, dnssrv+),
# the characters keep the quoted argument of the quadlet unit intact
monitoring_thanos_query__endpoint_pattern: '^[A-Za-z0-9._+:\[\]-]+$'

# User and group nobody of the image
monitoring_thanos_query__uid: 65534
monitoring_thanos_query__gid: 65534

# HTTP API, UI and endpoints (/-/ready, /metrics), the StoreAPI listens on 10901
monitoring_thanos_query__http_port: 10902

# Content of --endpoint.sd-config, endpoints that are no list are reported by the validation
monitoring_thanos_query__endpoints_config: >-
  {%- set endpoints = [] -%}
  {%- set addresses = monitoring_thanos_query__endpoints -%}
  {%- if addresses is sequence and addresses is not string and addresses is not mapping -%}
  {%-   for address in addresses -%}
  {%-     set _ = endpoints.append({'address': address}) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ {'endpoints': endpoints} | to_json }}

# The podman module writes the command space separated into the quadlet unit,
# the configuration of the endpoints containing " and spaces is enclosed in ' so it reaches Thanos unchanged.
# Deduplicates the replica labels of Prometheus, receive and rule.
monitoring_thanos_query__command_default:
  - 'query'
  - "'--endpoint.sd-config={{ monitoring_thanos_query__endpoints_config }}'"
  - '--query.replica-label=replica'
  - '--query.replica-label=receive_replica'
  - '--query.replica-label=rule_replica'

monitoring_thanos_query__podman_name: 'thanos-query'
monitoring_thanos_query__podman_image: 'docker.io/thanosio/thanos'
monitoring_thanos_query__podman_tag: "{{ monitoring_thanos_query__version }}"

monitoring_thanos_query__podman_container_default:
  name: "{{ monitoring_thanos_query__podman_name }}"
  hostname: "{{ monitoring_thanos_query__hostname }}"
  image: "{{ monitoring_thanos_query__podman_image }}:{{ monitoring_thanos_query__podman_tag }}"
  ip: "{{ monitoring_thanos_query__ip }}"
  ipv6: "{{ monitoring_thanos_query__ipv6 | default(omit) }}"
  network: "{{ monitoring_thanos_query__network }}"
  timezone: "{{ monitoring_thanos_query__timezone }}"
  environment: "{{ monitoring_thanos_query__environment }}"
  labels: "{{ monitoring_thanos_query__labels | default(omit) }}"
  user: "{{ monitoring_thanos_query__uid }}:{{ monitoring_thanos_query__gid }}"
  # thanos_query_container.command replaces the list completely
  command: "{{ monitoring_thanos_query__command_default }}"
