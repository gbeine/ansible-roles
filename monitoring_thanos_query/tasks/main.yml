---

- name: 'Install Thanos Query'
  tags: [ 'monitoring', 'monitoring_thanos_query' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or thanos_query_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - monitoring_thanos_query__container | length > 0
        quiet: true

    - name: 'Validate the role variables'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_query__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ monitoring_thanos_query__invalid | join('. ') }}"
        quiet: true
      vars:
        monitoring_thanos_query__invalid: >-
          {%- set errors = [] -%}
          {%- set endpoints = monitoring_thanos_query__endpoints -%}
          {%- if endpoints is string or endpoints is mapping or endpoints is not sequence
                 or endpoints | length == 0 or endpoints | reject('string') | list | length > 0 -%}
          {%-   set _ = errors.append('thanos_query_endpoints has to be a list of addresses') -%}
          {%- else -%}
          {%-   set invalid = endpoints | reject('match', monitoring_thanos_query__endpoint_pattern) | list -%}
          {%-   if invalid | length > 0 -%}
          {%-     set _ = errors.append('thanos_query_endpoints has invalid addresses: ' ~ invalid | join(', ')) -%}
          {%-   endif -%}
          {%-   set duplicates = [] -%}
          {%-   for address in endpoints | unique -%}
          {%-     if endpoints | select('eq', address) | list | length > 1 -%}
          {%-       set _ = duplicates.append(address) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%-   if duplicates | length > 0 -%}
          {%-     set _ = errors.append('thanos_query_endpoints has duplicate addresses: ' ~ duplicates | join(', ')) -%}
          {%-   endif -%}
          {%- endif -%}
          {%- set lines = monitoring_thanos_query__environment | dict2items | selectattr('value', 'string')
                          | selectattr('value', 'search', '[\r\n]') | map(attribute='key') | list -%}
          {%- if lines | length > 0 -%}
          {%-   set _ = errors.append('Values of thanos_query_environment must not contain line breaks: ' ~ lines | join(', ')) -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment of the container after merging thanos_query_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_query__environment_unknown | length == 0
        fail_msg: >-
          Unknown environment variables: {{ monitoring_thanos_query__environment_unknown | join(', ') }},
          Thanos only reads {{ monitoring_thanos_query__environment_allowed | join(', ') }}.
        quiet: true
      vars:
        monitoring_thanos_query__environment_unknown: >-
          {{ (monitoring_thanos_query__container.environment | default({})).keys()
             | reject('in', monitoring_thanos_query__environment_allowed) | list }}

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ monitoring_thanos_query__container.name }}"
        hostname: "{{ monitoring_thanos_query__container.hostname }}"
        image: "{{ monitoring_thanos_query__container.image }}"
        ip: "{{ monitoring_thanos_query__container.ip }}"
        ip6: "{{ monitoring_thanos_query__container.ipv6 | default(omit) }}"
        network: "{{ monitoring_thanos_query__container.network }}"
        timezone: "{{ monitoring_thanos_query__container.timezone }}"
        user: "{{ monitoring_thanos_query__container.user | default(omit) }}"
        command: "{{ monitoring_thanos_query__container.command | default(omit) }}"
        env: "{{ monitoring_thanos_query__container.environment | default(omit) }}"
        etc_hosts: "{{ monitoring_thanos_query__container.etc_hosts | default(omit) }}"
        expose: "{{ monitoring_thanos_query__container.expose | default(omit) }}"
        label: "{{ monitoring_thanos_query__container.labels | default(omit) }}"
        publish: "{{ monitoring_thanos_query__container.publish | default(omit) }}"
        secrets: "{{ monitoring_thanos_query__container.secrets | default(omit) }}"
        volume: "{{ monitoring_thanos_query__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if monitoring_thanos_query__container.requires is defined %}
          Requires={{ monitoring_thanos_query__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'monitoring_thanos_query__quadlet_result'

    # A failed start of the service only reports the exit code, the reason is in the journal
    - name: 'Start Thanos Query'
      when: 'not ansible_check_mode'
      block:

        - name: 'Start and enable container'
          ansible.builtin.systemd_service:
            name: "{{ monitoring_thanos_query__container.name }}"
            daemon_reload: true
            state: "{{ 'restarted' if monitoring_thanos_query__restart | bool else 'started' }}"
            enabled: true
          vars:
            monitoring_thanos_query__running: >-
              {{ (ansible_facts.services[monitoring_thanos_query__container.name + '.service'].state | default('')) == 'running' }}
            monitoring_thanos_query__restart: >-
              {{ monitoring_thanos_query__running | bool
                 and monitoring_thanos_query__quadlet_result is changed }}

      rescue:

        - name: 'Read the log of the failed start'
          ansible.builtin.command:
            argv: [ 'journalctl', '-u', "{{ monitoring_thanos_query__container.name }}", '-n', '80', '--no-pager' ]
          register: 'monitoring_thanos_query__start_journal'
          changed_when: false

        - name: 'Fail with the log of the failed start'
          ansible.builtin.fail:
            msg: "{{ [ monitoring_thanos_query__container.name ~ ' did not start' ] + monitoring_thanos_query__start_journal.stdout_lines }}"

    # Query is ready after it started its HTTP server, the endpoints are connected in the background
    - name: 'Wait for Thanos Query'
      ansible.builtin.uri:
        url: "http://{{ monitoring_thanos_query__container.ip }}:{{ monitoring_thanos_query__http_port }}/-/ready"
        status_code: [ 200, 503 ]
      register: 'monitoring_thanos_query__ready'
      until: monitoring_thanos_query__ready.status | default(-1) == 200
      retries: 60
      delay: 2
      failed_when: false
      when: 'not ansible_check_mode'

    - name: 'Read the log of Thanos Query'
      when:
        - not ansible_check_mode
        - monitoring_thanos_query__ready.status | default(-1) != 200
      ansible.builtin.command:
        argv: [ 'journalctl', '-u', "{{ monitoring_thanos_query__container.name }}", '-n', '50', '--no-pager' ]
      register: 'monitoring_thanos_query__journal'
      changed_when: false

    - name: 'Assert that Thanos Query is ready'
      when: 'not ansible_check_mode'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_query__journal is skipped
        fail_msg: "{{ monitoring_thanos_query__journal.stdout_lines | default([]) }}"
        quiet: true

    - name: 'Enable autoupdate on container'
      when: 'monitoring_thanos_query__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ monitoring_thanos_query__container.name }}"
        container_image: "{{ monitoring_thanos_query__container.image }}"
        container_schedule: "{{ monitoring_thanos_query__autoupdate_schedule }}"
