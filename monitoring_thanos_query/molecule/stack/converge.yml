---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  pre_tasks:

    - name: 'Set the role variables of the stack'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_thanos_query__test_stack_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  tasks:

    # Every role runs once, rule starts before query and connects to it afterwards
    - name: 'Run the roles of the stack'
      ansible.builtin.include_role:
        name: "{{ monitoring_thanos_query__test_role }}"
      # The roles loop with item themselves
      loop_control:
        loop_var: 'monitoring_thanos_query__test_role'
      loop:
        - 'monitoring_thanos_sidecar'
        - 'monitoring_thanos_store'
        - 'monitoring_thanos_compact'
        - 'monitoring_thanos_rule'
        - 'monitoring_thanos_query'
