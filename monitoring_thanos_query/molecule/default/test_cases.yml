---
# Network created by container_podman in prepare.yml
monitoring_thanos_query__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

monitoring_thanos_query__test_image: 'docker.io/thanosio/thanos:v0.42.5'
monitoring_thanos_query__test_prometheus_image: 'docker.io/prom/prometheus:latest'

# Prometheus and the sidecar started in prepare.yml with monitoring_prometheus and monitoring_thanos_sidecar,
# external labels and equal block durations are required by the sidecar
monitoring_thanos_query__test_prometheus_container:
  command:
    - '--config.file=/etc/prometheus/prometheus.yml'
    - '--storage.tsdb.path=/prometheus'
    - '--storage.tsdb.min-block-duration=2h'
    - '--storage.tsdb.max-block-duration=2h'

monitoring_thanos_query__test_cases:

  # Only the mandatory variables, query is connected to one sidecar
  - name: 'molecule-thanos-query-default'
    prepare_vars:
      prometheus_home: '/opt/prometheus-molecule'
      prometheus_ip: '10.89.0.76'
      prometheus_network: 'podman-molecule'
      prometheus_hostname: 'prometheus-default'
      prometheus_timezone: 'Europe/Berlin'
      prometheus_config:
        global:
          scrape_interval: '5s'
          external_labels:
            cluster: 'molecule'
            replica: 'default'
      prometheus_container: "{{ monitoring_thanos_query__test_prometheus_container }}"
      thanos_sidecar_version: 'v0.42.5'
      thanos_sidecar_ip: '10.89.0.77'
      thanos_sidecar_network: 'podman-molecule'
      thanos_sidecar_hostname: 'thanos-sidecar-default'
      thanos_sidecar_timezone: 'Europe/Berlin'
      thanos_sidecar_prometheus_url: 'http://10.89.0.76:9090'
      thanos_sidecar_prometheus_data: '/opt/prometheus-molecule/data'
    role_vars:
      thanos_query_version: 'v0.42.5'
      thanos_query_ip: '10.89.0.78'
      thanos_query_network: 'podman-molecule'
      thanos_query_hostname: 'thanos-query-default'
      thanos_query_timezone: 'Europe/Berlin'
      thanos_query_endpoints:
        - '10.89.0.77:10901'
    expect:
      ip: '10.89.0.78'
      ip6: ~
      sidecar: '10.89.0.77:10901'
      endpoints:
        - '10.89.0.77:10901'
      quadlet: []

  # IPv6 and labels
  - name: 'molecule-thanos-query'
    prepare_vars:
      prometheus_home: '/opt/prometheus-molecule'
      prometheus_ip: '10.89.0.79'
      prometheus_network: 'podman-molecule'
      prometheus_hostname: 'prometheus-molecule'
      prometheus_timezone: 'Europe/Berlin'
      prometheus_config:
        global:
          scrape_interval: '5s'
          external_labels:
            cluster: 'molecule'
            replica: 'molecule'
      prometheus_container: "{{ monitoring_thanos_query__test_prometheus_container }}"
      thanos_sidecar_version: 'v0.42.5'
      thanos_sidecar_ip: '10.89.0.80'
      thanos_sidecar_network: 'podman-molecule'
      thanos_sidecar_hostname: 'thanos-sidecar-molecule'
      thanos_sidecar_timezone: 'Europe/Berlin'
      thanos_sidecar_prometheus_url: 'http://10.89.0.79:9090'
      thanos_sidecar_prometheus_data: '/opt/prometheus-molecule/data'
    role_vars:
      thanos_query_version: 'v0.42.5'
      thanos_query_ip: '10.89.0.81'
      thanos_query_ipv6: 'fd00:89::81'
      thanos_query_network: 'podman-molecule'
      thanos_query_hostname: 'thanos-query-molecule'
      thanos_query_timezone: 'Europe/Berlin'
      thanos_query_labels:
        traefik.enable: 'false'
      thanos_query_endpoints:
        - '10.89.0.80:10901'
    # side_effect adds an endpoint that does not run, the quadlet unit changes and query has to restart,
    # query stays ready and keeps the sidecar
    side_effect:
      role_vars:
        thanos_query_endpoints:
          - '10.89.0.80:10901'
          - '10.89.0.82:10901'
    expect:
      ip: '10.89.0.81'
      ip6: 'fd00:89::81'
      sidecar: '10.89.0.80:10901'
      endpoints:
        - '10.89.0.80:10901'
        - '10.89.0.82:10901'
      quadlet:
        - 'Label=traefik.enable=false'
