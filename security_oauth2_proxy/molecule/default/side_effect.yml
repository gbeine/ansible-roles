---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    security_oauth2_proxy__test_case: "{{ security_oauth2_proxy__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    security_oauth2_proxy__test_vars: "{{ security_oauth2_proxy__test_case.role_vars }}"
    security_oauth2_proxy__test_config: "{{ security_oauth2_proxy__test_vars.oauth2_proxy_config }}"
    security_oauth2_proxy__test_secrets: "{{ security_oauth2_proxy__test_vars.oauth2_proxy_secrets }}"
    security_oauth2_proxy__test_checked_files:
      - "{{ security_oauth2_proxy__test_quadlet_path }}"
      - "{{ security_oauth2_proxy__test_config_path }}"

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ security_oauth2_proxy__test_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksums of the checked files before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ security_oauth2_proxy__test_checked_files }}"
      register: 'security_oauth2_proxy__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include

    - name: 'Run security_oauth2_proxy with oauth2_proxy_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_container: [ 'environment' ]
        security_oauth2_proxy__test_invalid:
          message: 'oauth2_proxy_container not a dictionary'
          search: 'failed to combine variables, expected dicts'

    - name: 'Run security_oauth2_proxy with oauth2_proxy_secrets not a list (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_secrets: { 'name': 'oauth2_proxy_cookie_secret', 'data': 'x', 'target': 'OAUTH2_PROXY_COOKIE_SECRET' }
        security_oauth2_proxy__test_invalid:
          message: 'oauth2_proxy_secrets not a list'
          search: '^oauth2_proxy_secrets has to be a list$'

    - name: 'Run security_oauth2_proxy with a secret without target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_secrets: "{{ security_oauth2_proxy__test_secrets + [ { 'name': 'oauth2_proxy_other', 'data': 'x' } ] }}"
        security_oauth2_proxy__test_invalid:
          message: 'a secret without target'
          search: '^oauth2_proxy_secrets entries need name, data and target$'

    - name: 'Run security_oauth2_proxy with duplicate names of secrets (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_secrets: "{{ security_oauth2_proxy__test_secrets + [ security_oauth2_proxy__test_secrets | first ] }}"
        security_oauth2_proxy__test_invalid:
          message: 'duplicate names of secrets'
          search: '^the names of oauth2_proxy_secrets have to be unique$'

    - name: 'Run security_oauth2_proxy with an unknown secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_secrets: "{{ security_oauth2_proxy__test_secrets + [ { 'name': 'oauth2_proxy_other', 'data': 'x', 'target': 'OAUTH2_PROXY_UNKNOWN' } ] }}"
        security_oauth2_proxy__test_invalid:
          message: 'an unknown secret'
          search: 'Unknown secrets: OAUTH2_PROXY_UNKNOWN\.'

    - name: 'Run security_oauth2_proxy without cookie secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_secrets: "{{ security_oauth2_proxy__test_secrets | rejectattr('target', 'eq', 'OAUTH2_PROXY_COOKIE_SECRET') | list }}"
        security_oauth2_proxy__test_invalid:
          message: 'without cookie secret'
          search: '^OAuth2 Proxy needs the secrets OAUTH2_PROXY_COOKIE_SECRET, OAUTH2_PROXY_CLIENT_SECRET, missing: OAUTH2_PROXY_COOKIE_SECRET\.$'

    - name: 'Run security_oauth2_proxy without client secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_secrets: "{{ security_oauth2_proxy__test_secrets | rejectattr('target', 'eq', 'OAUTH2_PROXY_CLIENT_SECRET') | list }}"
        security_oauth2_proxy__test_invalid:
          message: 'without client secret'
          search: '^OAuth2 Proxy needs the secrets OAUTH2_PROXY_COOKIE_SECRET, OAUTH2_PROXY_CLIENT_SECRET, missing: OAUTH2_PROXY_CLIENT_SECRET\.$'

    - name: 'Run security_oauth2_proxy with a cookie secret of the wrong length (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_secrets: "{{ security_oauth2_proxy__test_secrets | rejectattr('target', 'eq', 'OAUTH2_PROXY_COOKIE_SECRET') | list
                                  + [ { 'name': 'oauth2_proxy_cookie_secret', 'data': 'too-short', 'target': 'OAUTH2_PROXY_COOKIE_SECRET' } ] }}"
        security_oauth2_proxy__test_invalid:
          message: 'a cookie secret of the wrong length'
          search: '^The cookie secret needs 16, 24 or 32 characters or their URL-safe base64 encoding: oauth2_proxy_cookie_secret\.$'

    - name: 'Run security_oauth2_proxy with a secret and a file variable in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_environment:
          OAUTH2_PROXY_CLIENT_SECRET: 'plain'
          OAUTH2_PROXY_COOKIE_SECRET_FILE: '/tmp/cookie'
        security_oauth2_proxy__test_invalid:
          message: 'a secret and a file variable in the environment'
          search: '^Secrets and their file variables must not be set in oauth2_proxy_environment: OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET_FILE\.$'

    - name: 'Run security_oauth2_proxy with an unknown environment variable (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_environment:
          OAUTH2_PROXY_EMAIL_DOMAINS: '*'
        security_oauth2_proxy__test_invalid:
          message: 'an unknown environment variable'
          search: 'Unknown environment variables: OAUTH2_PROXY_EMAIL_DOMAINS\.'

    - name: 'Run security_oauth2_proxy with oauth2_proxy_config not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_config: [ 'client_id' ]
        security_oauth2_proxy__test_invalid:
          message: 'oauth2_proxy_config not a dictionary'
          search: 'oauth2_proxy_config has to be a dictionary of the options of OAuth2 Proxy\.|failed to combine variables, expected dicts'

    - name: 'Run security_oauth2_proxy with unknown options, secrets and options of the role in the configuration (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_config: "{{ security_oauth2_proxy__test_config | combine({ 'molecule_unknown': 'x', 'client_secret': 'plain', 'http_address': '0.0.0.0:4180' }) }}"
        security_oauth2_proxy__test_invalid:
          message: 'unknown options, secrets and options of the role in the configuration'
          search: >-
            ^Unknown options in oauth2_proxy_config: molecule_unknown, allowed are the options of OAuth2 Proxy \(security_oauth2_proxy__config_allowed\)\.
            Secrets are set with oauth2_proxy_secrets, not in oauth2_proxy_config: client_secret\.
            These options are set by the role and must not be set in oauth2_proxy_config: http_address\.$

    - name: 'Run security_oauth2_proxy with a dictionary and a line break as values of the configuration (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_config: "{{ security_oauth2_proxy__test_config | combine({ 'scope': { 'openid': true }, 'footer': 'molecule\nfooter' }) }}"
        security_oauth2_proxy__test_invalid:
          message: 'a dictionary and a line break as values of the configuration'
          search: >-
            ^The values of oauth2_proxy_config have to be strings, numbers, booleans, null or lists of them: scope\.
            The values of oauth2_proxy_config must not contain line breaks: footer\.$

    - name: 'Run security_oauth2_proxy without client ID and email domains (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_config: "{{ security_oauth2_proxy__test_config | combine({ 'client_id': none, 'email_domains': [] }) }}"
        security_oauth2_proxy__test_invalid:
          message: 'without client ID and email domains'
          search: '^oauth2_proxy_config needs client_id\. oauth2_proxy_config needs email_domains, authenticated_emails_file or htpasswd_file, .*\.$'

    - name: 'Run security_oauth2_proxy with the provider oidc without issuer (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        oauth2_proxy_config: "{{ security_oauth2_proxy__test_config | combine({ 'provider': 'oidc', 'oidc_issuer_url': '' }) }}"
        security_oauth2_proxy__test_invalid:
          message: 'the provider oidc without issuer'
          search: '^The provider oidc needs oidc_issuer_url in oauth2_proxy_config\.$'

    - name: 'Change the configuration'
      when: security_oauth2_proxy__test_case.side_effect is defined
      block:

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'oauth2-proxy' ]
          register: 'security_oauth2_proxy__test_started_before'
          changed_when: false

        - name: 'Set the changed configuration'
          ansible.builtin.set_fact:
            oauth2_proxy_config: "{{ security_oauth2_proxy__test_config | combine(security_oauth2_proxy__test_case.side_effect.config) }}"

        - name: 'Run security_oauth2_proxy with the changed configuration'
          ansible.builtin.include_role:
            name: 'security_oauth2_proxy'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'oauth2-proxy' ]
          register: 'security_oauth2_proxy__test_started_after'
          changed_when: false

        - name: 'Assert the changed configuration and the restart of the service'
          ansible.builtin.assert:
            that:
              - security_oauth2_proxy__config_result is changed
              - security_oauth2_proxy__quadlet_result is not changed
              - security_oauth2_proxy__secrets_result is not changed
              - security_oauth2_proxy__test_started_after.stdout | int > security_oauth2_proxy__test_started_before.stdout | int
            fail_msg: >-
              configuration changed: {{ security_oauth2_proxy__config_result is changed }},
              quadlet changed: {{ security_oauth2_proxy__quadlet_result is changed }},
              secrets changed: {{ security_oauth2_proxy__secrets_result is changed }},
              start before {{ security_oauth2_proxy__test_started_before.stdout }}, after {{ security_oauth2_proxy__test_started_after.stdout }}
