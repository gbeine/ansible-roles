# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
security_oauth2_proxy__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if security_oauth2_proxy__secrets is sequence and security_oauth2_proxy__secrets is not string and security_oauth2_proxy__secrets is not mapping -%}
  {%-   for secret in security_oauth2_proxy__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in security_oauth2_proxy__secret_files -%}
  {%-     set _ = environment.update({ security_oauth2_proxy__secret_files[secret.target]: security_oauth2_proxy__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The podman secrets of oauth2_proxy_secrets, the secrets of security_oauth2_proxy__secrets_env are passed in the environment,
# the others are mounted, entries without name or target are left out, the validation of the secrets reports them
security_oauth2_proxy__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- if security_oauth2_proxy__secrets is sequence and security_oauth2_proxy__secrets is not string and security_oauth2_proxy__secrets is not mapping -%}
  {%-   for secret in security_oauth2_proxy__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-     if secret.target in security_oauth2_proxy__secrets_env -%}
  {%-       set _ = secrets.append(secret.name ~ ',type=env,target=' ~ secret.target) -%}
  {%-     else -%}
  {%-       set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ security_oauth2_proxy__secrets_dir ~ '/' ~ secret.name) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ secrets }}

security_oauth2_proxy__etc_dir: '/etc/oauth2-proxy'
security_oauth2_proxy__config_file: "{{ security_oauth2_proxy__home }}/oauth2-proxy.cfg"

security_oauth2_proxy__podman_name: 'oauth2-proxy'
security_oauth2_proxy__podman_image: 'quay.io/oauth2-proxy/oauth2-proxy'
security_oauth2_proxy__podman_tag: "{{ security_oauth2_proxy__version }}"

security_oauth2_proxy__podman_container_default:
  name: "{{ security_oauth2_proxy__podman_name }}"
  hostname: "{{ security_oauth2_proxy__hostname }}"
  image: "{{ security_oauth2_proxy__podman_image }}:{{ security_oauth2_proxy__podman_tag }}"
  ip: "{{ security_oauth2_proxy__ip }}"
  ipv6: "{{ security_oauth2_proxy__ipv6 | default(omit) }}"
  network: "{{ security_oauth2_proxy__network }}"
  timezone: "{{ security_oauth2_proxy__timezone }}"
  # Set with oauth2_proxy_environment and oauth2_proxy_secrets, merged over the default
  environment: "{{ security_oauth2_proxy__environment | combine(security_oauth2_proxy__environment_secrets_files) }}"
  labels: "{{ security_oauth2_proxy__labels | default(omit) }}"
  secrets: "{{ security_oauth2_proxy__podman_secrets if security_oauth2_proxy__podman_secrets | length > 0 else omit }}"
  # oauth2_proxy_container.command replaces the list completely
  command: [ "--config={{ security_oauth2_proxy__etc_dir }}/oauth2-proxy.cfg" ]
  # oauth2_proxy_container.volumes replaces the list completely
  volumes:
    - "{{ security_oauth2_proxy__config_file }}:{{ security_oauth2_proxy__etc_dir }}/oauth2-proxy.cfg:ro"
