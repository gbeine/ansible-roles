---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/security-oauth2-proxy
#

security_oauth2_proxy__home: "{{ oauth2_proxy_home | mandatory }}"
security_oauth2_proxy__ip: "{{ oauth2_proxy_ip | mandatory }}"
security_oauth2_proxy__ipv6: "{{ oauth2_proxy_ipv6 }}"
security_oauth2_proxy__network: "{{ oauth2_proxy_network | mandatory }}"
security_oauth2_proxy__hostname: "{{ oauth2_proxy_hostname | mandatory }}"
security_oauth2_proxy__timezone: "{{ oauth2_proxy_timezone | mandatory }}"
security_oauth2_proxy__labels: "{{ oauth2_proxy_labels }}"

security_oauth2_proxy__version: "{{ oauth2_proxy_version | default('latest') }}"

security_oauth2_proxy__container: "{{ security_oauth2_proxy__podman_container_default | combine(oauth2_proxy_container | default({})) }}"

# The configuration of OAuth2 Proxy, the options of the configuration file, e.g. provider, client_id, email_domains and upstreams
security_oauth2_proxy__config: "{{ security_oauth2_proxy__config_default | combine(oauth2_proxy_config | default({})) }}"

security_oauth2_proxy__environment: "{{ security_oauth2_proxy__environment_default | combine(oauth2_proxy_environment | default({})) }}"

# Secrets with name, data and target, OAUTH2_PROXY_COOKIE_SECRET and OAUTH2_PROXY_CLIENT_SECRET are mandatory
security_oauth2_proxy__secrets: "{{ oauth2_proxy_secrets | default([]) }}"

security_oauth2_proxy__autoupdate_enabled: "{{ oauth2_proxy_autoupdate_enabled | default(false) }}"
security_oauth2_proxy__autoupdate_schedule: "{{ oauth2_proxy_autoupdate_schedule }}"

#
# Defaults - do not change
#

security_oauth2_proxy__config_default: {}

# The options of oauth2_proxy_config, the default is empty, so the role checks that it is a dictionary
security_oauth2_proxy__config_custom: "{{ oauth2_proxy_config | default({}) }}"

# Set by the role, OAuth2 Proxy listens on 127.0.0.1:4180 by default, :4180 listens on IPv4 and IPv6
security_oauth2_proxy__config_role:
  http_address: ':4180'

security_oauth2_proxy__port: 4180

security_oauth2_proxy__environment_default:
  TZ: "{{ security_oauth2_proxy__timezone }}"

security_oauth2_proxy__secrets_dir: '/run/secrets'

# The secrets mounted as files, OAuth2 Proxy reads the target from the file variable (client-secret-file, cookie-secret-file, jwt-key-file)
security_oauth2_proxy__secret_files:
  OAUTH2_PROXY_CLIENT_SECRET: 'OAUTH2_PROXY_CLIENT_SECRET_FILE'
  OAUTH2_PROXY_COOKIE_SECRET: 'OAUTH2_PROXY_COOKIE_SECRET_FILE'
  OAUTH2_PROXY_JWT_KEY: 'OAUTH2_PROXY_JWT_KEY_FILE'

# The secrets passed in the environment, OAuth2 Proxy has no file variable for them
security_oauth2_proxy__secrets_env:
  - 'OAUTH2_PROXY_REDIS_PASSWORD'
  - 'OAUTH2_PROXY_REDIS_SENTINEL_PASSWORD'
  - 'OAUTH2_PROXY_BASIC_AUTH_PASSWORD'
  - 'OAUTH2_PROXY_GITHUB_TOKEN'
  - 'OAUTH2_PROXY_SIGNATURE_KEY'

# The targets of the secrets, they must not be set in oauth2_proxy_environment
security_oauth2_proxy__secret_variables: "{{ security_oauth2_proxy__secret_files.keys() | list + security_oauth2_proxy__secrets_env }}"

# The options of the secrets and their files, they must not be set in oauth2_proxy_config
security_oauth2_proxy__secret_options:
  - 'basic_auth_password'
  - 'client_secret'
  - 'client_secret_file'
  - 'cookie_secret'
  - 'cookie_secret_file'
  - 'github_token'
  - 'jwt_key'
  - 'jwt_key_file'
  - 'redis_password'
  - 'redis_sentinel_password'
  - 'signature_key'

# The cookie secret encrypts the sessions, OAuth2 Proxy does not start without the cookie secret and the client secret,
# the providers login.gov and entra-id with entra_id_federated_token_auth need no client secret
security_oauth2_proxy__secrets_required: >-
  {{ [ 'OAUTH2_PROXY_COOKIE_SECRET' ]
     + ([] if (security_oauth2_proxy__config.provider | default('') == 'login.gov'
               or (security_oauth2_proxy__config.provider | default('') == 'entra-id'
                   and security_oauth2_proxy__config.entra_id_federated_token_auth | default(false) | bool))
           else [ 'OAUTH2_PROXY_CLIENT_SECRET' ]) }}

# OAuth2 Proxy reads the options of the configuration file, the environment only carries the time zone and the file variables
security_oauth2_proxy__environment_allowed: "{{ [ 'TZ' ] + security_oauth2_proxy__secret_files.values() | list }}"

# Generated from the cfg tags of the options with flags of pkg/apis/options/*.go of OAuth2 Proxy v7.15.6
# without the secrets, their files and http_address set by the role, update with new versions of the image
