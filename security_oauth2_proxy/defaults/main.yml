---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/security-oauth2-proxy
#

security_oauth2_proxy__home: "{{ oauth2_proxy_home | mandatory }}"
security_oauth2_proxy__ip: "{{ oauth2_proxy_ip | mandatory }}"
security_oauth2_proxy__ipv6: "{{ oauth2_proxy_ipv6 }}"
security_oauth2_proxy__network: "{{ oauth2_proxy_network | mandatory }}"
security_oauth2_proxy__hostname: "{{ oauth2_proxy_hostname | mandatory }}"
security_oauth2_proxy__timezone: "{{ oauth2_proxy_timezone | mandatory }}"
security_oauth2_proxy__labels: "{{ oauth2_proxy_labels | default({}) }}"

security_oauth2_proxy__version: "{{ oauth2_proxy_version | default('latest') }}"

security_oauth2_proxy__container: "{{ security_oauth2_proxy__podman_container_default | combine(oauth2_proxy_container | default({})) }}"

security_oauth2_proxy__http_address: "{{ oauth2_proxy_http_address | default('0.0.0.0') }}"
security_oauth2_proxy__http_port: "{{ oauth2_proxy_http_port | default(4180) }}"
security_oauth2_proxy__cookie_secret: "{{ oauth2_proxy_cookie_secret | mandatory }}"
security_oauth2_proxy__email_domains: "{{ oauth2_proxy_email_domains | mandatory }}"
security_oauth2_proxy__cookie_secure: "{{ oauth2_proxy_cookie_secure | default(true) }}"
security_oauth2_proxy__upstreams: "{{ oauth2_proxy_upstreams | mandatory }}"
security_oauth2_proxy__cookie_domains: "{{ oauth2_proxy_cookie_domains | mandatory }}"
security_oauth2_proxy__whitelist_domains: "{{ oauth2_proxy_whitelist_domains | mandatory }}"
security_oauth2_proxy__client_secret: "{{ oauth2_proxy_client_secret | mandatory }}"

security_oauth2_proxy__client_id: "{{ oauth2_proxy_client_id | mandatory }}"
security_oauth2_proxy__redirect_url: "{{ oauth2_proxy_redirect_url | mandatory }}"
security_oauth2_proxy__oidc_issuer_url: "{{ oauth2_proxy_oidc_issuer_url | mandatory }}"
security_oauth2_proxy__provider: "{{ oauth2_proxy_provider | mandatory }}"
security_oauth2_proxy__provider_display_name: "{{ oauth2_proxy_provider_display_name | mandatory }}"
security_oauth2_proxy__skip_provider_button: "{{ oauth2_proxy_skip_provider_button | default(false) }}"
security_oauth2_proxy__code_challenge_method: "{{ oauth2_proxy_code_challenge_method | mandatory }}"
security_oauth2_proxy__scope: "{{ oauth2_proxy_scope | mandatory }}"

security_oauth2_proxy__set_xauthrequest: "{{ oauth2_proxy_set_xauthrequest | default(false) }}"
security_oauth2_proxy__set_authorization_header: "{{ oauth2_proxy_set_authorization_header | default(false) }}"
security_oauth2_proxy__pass_access_token: "{{ oauth2_proxy_pass_access_token | default(false) }}"
security_oauth2_proxy__pass_authorization_header: "{{ oauth2_proxy_pass_authorization_header | default(false) }}"
security_oauth2_proxy__pass_user_headers: "{{ oauth2_proxy_pass_access_token | default(true) }}"

security_oauth2_proxy__reverse_proxy: "{{ oauth2_proxy_reverse_proxy | default(false) }}"
security_oauth2_proxy__cookie_path: "{{ oauth2_proxy_cookie_path | default('/') }}"
security_oauth2_proxy__cookie_name: "{{ oauth2_proxy_cookie_name | default('_oauth2_proxy') }}"
security_oauth2_proxy__cookie_httponly: "{{ oauth2_proxy_cookie_httponly | default(true) }}"
security_oauth2_proxy__cookie_samesite: "{{ oauth2_proxy_cookie_samesite | default('') }}"

#
# Defaults - do not change
#

security_oauth2_proxy__podman_name: 'oauth2-proxy'
security_oauth2_proxy__podman_image: 'quay.io/oauth2-proxy/oauth2-proxy'
security_oauth2_proxy__podman_tag: "{{ security_oauth2_proxy__version }}"

security_oauth2_proxy__podman_home: "{{ security_oauth2_proxy__home }}"
security_oauth2_proxy__podman_config_file: "{{ security_oauth2_proxy__podman_home }}/oauth2-proxy.cfg"

security_oauth2_proxy__podman_container_default:
  name: "{{ security_oauth2_proxy__podman_name }}"
  hostname: "{{ security_oauth2_proxy__hostname }}"
  image: "{{ security_oauth2_proxy__podman_image }}:{{ security_oauth2_proxy__podman_tag }}"
  ip: "{{ security_oauth2_proxy__ip }}"
  ipv6: "{{ security_oauth2_proxy__ipv6 }}"
  network: "{{ security_oauth2_proxy__network }}"
  timezone: "{{ security_oauth2_proxy__timezone }}"
  labels: "{{ security_oauth2_proxy__labels }}"
  command: '--config /oauth2-proxy.cfg'
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ security_oauth2_proxy__podman_config_file }}:/oauth2-proxy.cfg:ro"
