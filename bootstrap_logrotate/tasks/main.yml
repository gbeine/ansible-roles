---

- name: 'Configure logrotate'
  tags: [ 'bootstrap', 'bootstrap_logrotate'  ]
  block:

    - name: 'Include OS-specific variables'
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_os_family }}.yml"

    - name: 'Install packages'
      ansible.builtin.apt:
        update_cache: yes
        install_recommends: no
        pkg: "{{ bootstrap_logrotate__packages }}"
      run_once: yes

    - name: 'Generate main configuration'
      ansible.builtin.template:
        src: 'logrotate.conf.j2'
        dest: '/etc/logrotate.conf'
        owner: 'root'
        group: 'root'
        mode: '644'
      run_once: yes

    - name: 'Generate logrotate configuration files'
      ansible.builtin.template:
        src: 'logrotate.j2'
        dest: "{{ bootstrap_logrotate__etc_dir }}/{{ item.name }}"
        owner: 'root'
        group: 'root'
        mode: '640'
      with_items: "{{ bootstrap_logrotate__files }}"
