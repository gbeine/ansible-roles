---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-thanos-receive
#

# The image has no tag latest
monitoring_thanos_receive__version: "{{ thanos_receive_version | mandatory }}"

monitoring_thanos_receive__home: "{{ thanos_receive_home | mandatory }}"
monitoring_thanos_receive__ip: "{{ thanos_receive_ip | mandatory }}"
monitoring_thanos_receive__ipv6: "{{ thanos_receive_ipv6 }}"
monitoring_thanos_receive__network: "{{ thanos_receive_network | mandatory }}"
monitoring_thanos_receive__hostname: "{{ thanos_receive_hostname | mandatory }}"
monitoring_thanos_receive__timezone: "{{ thanos_receive_timezone | mandatory }}"
monitoring_thanos_receive__labels: "{{ thanos_receive_labels }}"

# Content of bucket.yml, stored as podman secret, without it receive uploads nothing
monitoring_thanos_receive__objstore: "{{ thanos_receive_objstore | default({}) }}"

monitoring_thanos_receive__container: "{{ monitoring_thanos_receive__podman_container_default | combine(thanos_receive_container | default({})) }}"

# Thanos reads no variables besides TZ
monitoring_thanos_receive__environment: "{{ monitoring_thanos_receive__environment_default | combine(thanos_receive_environment | default({})) }}"

monitoring_thanos_receive__autoupdate_enabled: "{{ thanos_receive_autoupdate_enabled | default(false) }}"
monitoring_thanos_receive__autoupdate_schedule: "{{ thanos_receive_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_thanos_receive__environment_default:
  TZ: "{{ monitoring_thanos_receive__timezone }}"

monitoring_thanos_receive__environment_allowed: [ 'TZ' ]

# User and group nobody of the image, the owner of the data directory
monitoring_thanos_receive__uid: 65534
monitoring_thanos_receive__gid: 65534

# HTTP endpoints (/-/ready, /metrics), the StoreAPI listens on 10901, remote write on 19291
monitoring_thanos_receive__http_port: 10902

monitoring_thanos_receive__objstore_file: '/etc/thanos/bucket.yml'
monitoring_thanos_receive__tsdb_dir: '/var/thanos/receive'

monitoring_thanos_receive__objstore_flags: >-
  {{ [ '--objstore.config-file=' ~ monitoring_thanos_receive__objstore_file ] if monitoring_thanos_receive__objstore | length > 0 else [] }}

# Receive refuses to start without an external label, the podman module writes the command space separated into the quadlet unit,
# the label containing " is enclosed in ' so it reaches Thanos unchanged
monitoring_thanos_receive__command_default: >-
  {{ [ 'receive',
       '--tsdb.path=' ~ monitoring_thanos_receive__tsdb_dir,
       "'" ~ '--label=receive_replica="' ~ monitoring_thanos_receive__hostname ~ '"' ~ "'" ]
     + monitoring_thanos_receive__objstore_flags }}

monitoring_thanos_receive__podman_name: 'thanos-receive'
monitoring_thanos_receive__podman_image: 'docker.io/thanosio/thanos'
monitoring_thanos_receive__podman_tag: "{{ monitoring_thanos_receive__version }}"
monitoring_thanos_receive__podman_data_dir: "{{ monitoring_thanos_receive__home }}/data"
# Named after the container, a container with another name has its own secret
monitoring_thanos_receive__podman_objstore_secret: >-
  {{ (thanos_receive_container | default({})).name | default(monitoring_thanos_receive__podman_name) }}-objstore

monitoring_thanos_receive__podman_container_default:
  name: "{{ monitoring_thanos_receive__podman_name }}"
  hostname: "{{ monitoring_thanos_receive__hostname }}"
  image: "{{ monitoring_thanos_receive__podman_image }}:{{ monitoring_thanos_receive__podman_tag }}"
  ip: "{{ monitoring_thanos_receive__ip }}"
  ipv6: "{{ monitoring_thanos_receive__ipv6 | default(omit) }}"
  network: "{{ monitoring_thanos_receive__network }}"
  timezone: "{{ monitoring_thanos_receive__timezone }}"
  environment: "{{ monitoring_thanos_receive__environment }}"
  labels: "{{ monitoring_thanos_receive__labels | default(omit) }}"
  user: "{{ monitoring_thanos_receive__uid }}:{{ monitoring_thanos_receive__gid }}"
  # thanos_receive_container.command replaces the list completely
  command: "{{ monitoring_thanos_receive__command_default }}"
  secrets: >-
    {{ [ monitoring_thanos_receive__podman_objstore_secret ~ ',type=mount,target=' ~ monitoring_thanos_receive__objstore_file ]
       if monitoring_thanos_receive__objstore | length > 0 else omit }}
  # thanos_receive_container.volumes replaces the list completely
  volumes:
    - "{{ monitoring_thanos_receive__podman_data_dir }}:{{ monitoring_thanos_receive__tsdb_dir }}"
