---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_thanos_receive__test_case: "{{ monitoring_thanos_receive__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_thanos_receive__expect: "{{ monitoring_thanos_receive__test_case.expect }}"
    monitoring_thanos_receive__test_url: "http://{{ monitoring_thanos_receive__expect.ip }}:10902"

  tasks:

    - name: 'Read the generated quadlet unit'
      ansible.builtin.slurp:
        src: "{{ monitoring_thanos_receive__test_quadlet_path }}"
      register: 'monitoring_thanos_receive__test_quadlet'

    # podman may quote values, the quotes are removed before the lines are compared
    - name: 'Assert the quadlet unit'
      ansible.builtin.assert:
        that:
          - ('Image=' + monitoring_thanos_receive__test_image) in monitoring_thanos_receive__test_quadlet_lines
          - ('IP=' + monitoring_thanos_receive__expect.ip) in monitoring_thanos_receive__test_quadlet_lines
          - monitoring_thanos_receive__expect.ip6 is none or ('IP6=' + monitoring_thanos_receive__expect.ip6) in monitoring_thanos_receive__test_quadlet_lines
          - monitoring_thanos_receive__expect.ip6 is not none or monitoring_thanos_receive__test_quadlet_lines | select('match', 'IP6=') | list | length == 0
          # podman_container splits user 65534:65534 into User= and Group=
          - ('User=65534' in monitoring_thanos_receive__test_quadlet_lines)
          - ('Group=65534' in monitoring_thanos_receive__test_quadlet_lines)
          - monitoring_thanos_receive__expect.quadlet | reject('in', monitoring_thanos_receive__test_quadlet_lines) | list | length == 0
          # The time zone is set by podman, /etc/localtime is not mounted and TZ is not set
          - monitoring_thanos_receive__test_quadlet_lines | select('search', '/etc/localtime|/etc/timezone|TZ=') | list | length == 0
          - ('Timezone=' + monitoring_thanos_receive__test_case.role_vars.thanos_receive_timezone) in monitoring_thanos_receive__test_quadlet_lines
          - monitoring_thanos_receive__test_exec is search('^Exec=receive ')
          - monitoring_thanos_receive__test_exec is search('--tsdb.path=/var/thanos/receive')
          - (monitoring_thanos_receive__test_exec is search('--objstore.config-file=/etc/thanos/bucket.yml')) == monitoring_thanos_receive__expect.objstore
          - (monitoring_thanos_receive__test_quadlet_lines | select('search', '/etc/thanos/bucket.yml:ro') | list | length > 0) == monitoring_thanos_receive__expect.objstore
          - monitoring_thanos_receive__test_quadlet_lines | select('match', 'Secret=') | list == monitoring_thanos_receive__expect.secrets
          - monitoring_thanos_receive__test_quadlet_lines | select('search', monitoring_thanos_receive__test_s3_secret_key) | list | length == 0
        fail_msg: "{{ monitoring_thanos_receive__test_quadlet_lines | to_json }}"
      vars:
        monitoring_thanos_receive__test_quadlet_lines: "{{ (monitoring_thanos_receive__test_quadlet.content | b64decode | regex_replace('\"', '')).splitlines() }}"
        monitoring_thanos_receive__test_exec: "{{ monitoring_thanos_receive__test_quadlet_lines | select('match', 'Exec=') | join(' ') }}"

    - name: 'Read the state of the service'
      ansible.builtin.command:
        argv: [ 'systemctl', 'is-active', 'thanos-receive' ]
      register: 'monitoring_thanos_receive__test_service'
      changed_when: false
      failed_when: false

    - name: 'Read the time zone and the environment of the container'
      ansible.builtin.command:
        argv: [ 'podman', 'inspect', '--format', '{{ "{{" }} .Config.Timezone {{ "}}" }} {{ "{{" }} json .Config.Env {{ "}}" }}', 'thanos-receive' ]
      register: 'monitoring_thanos_receive__test_inspect'
      changed_when: false

    # systemd counts only the restarts after a crash
    - name: 'Read the automatic restarts of the service'
      ansible.builtin.command:
        argv: [ 'systemctl', 'show', '--property=NRestarts', '--value', 'thanos-receive' ]
      register: 'monitoring_thanos_receive__test_restarts'
      changed_when: false

    - name: 'Read the state of bucket.yml'
      ansible.builtin.stat:
        path: "{{ monitoring_thanos_receive__test_home }}/bucket.yml"
      register: 'monitoring_thanos_receive__test_bucket_stat'

    # Without object storage there is no bucket.yml
    - name: 'Read bucket.yml'
      when: monitoring_thanos_receive__expect.objstore
      ansible.builtin.slurp:
        src: "{{ monitoring_thanos_receive__test_home }}/bucket.yml"
      register: 'monitoring_thanos_receive__test_bucket'

    - name: 'Assert the service, the time zone, the environment and bucket.yml'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_receive__test_service.stdout == 'active'
          - monitoring_thanos_receive__test_restarts.stdout | int == 0
          - (monitoring_thanos_receive__test_inspect.stdout.split(' ', 1) | first) == monitoring_thanos_receive__test_case.role_vars.thanos_receive_timezone
          - monitoring_thanos_receive__test_env | select('match', 'TZ=') | list | length == 0
          - monitoring_thanos_receive__test_bucket_stat.stat.exists == monitoring_thanos_receive__expect.objstore
          # The secrets are passed in the environment of the container, bucket.yml contains the double-quoted references
          - monitoring_thanos_receive__expect.bucket | default([]) | reject('in', monitoring_thanos_receive__test_bucket_lines) | list | length == 0
          - monitoring_thanos_receive__test_bucket_lines | select('search', monitoring_thanos_receive__test_s3_secret_key) | list | length == 0
          - not monitoring_thanos_receive__expect.objstore or monitoring_thanos_receive__test_bucket_stat.stat.mode == '0644'
          - not monitoring_thanos_receive__expect.objstore or monitoring_thanos_receive__test_bucket_stat.stat.uid == 0
        fail_msg: >-
          service {{ monitoring_thanos_receive__test_service.stdout }}, automatic restarts {{ monitoring_thanos_receive__test_restarts.stdout }},
          time zone {{ monitoring_thanos_receive__test_inspect.stdout.split(' ', 1) | first }}, bucket.yml {{ monitoring_thanos_receive__test_bucket_lines }}
      vars:
        monitoring_thanos_receive__test_env: "{{ monitoring_thanos_receive__test_inspect.stdout.split(' ', 1) | last | from_json }}"
        monitoring_thanos_receive__test_bucket_lines: >-
          {{ (monitoring_thanos_receive__test_bucket.content | b64decode).splitlines() if monitoring_thanos_receive__test_bucket is not skipped else [] }}

    - name: 'Read the command of the container'
      ansible.builtin.command:
        argv: [ 'podman', 'inspect', '--format', '{{ "{{" }} json .Config.Cmd {{ "}}" }}', 'thanos-receive' ]
      register: 'monitoring_thanos_receive__test_cmd'
      changed_when: false

    # The label reaches Thanos with its double quotes, otherwise receive refuses to start
    - name: 'Assert the external label'
      ansible.builtin.assert:
        that:
          - ('--label=receive_replica="' + monitoring_thanos_receive__test_case.role_vars.thanos_receive_hostname + '"')
            in (monitoring_thanos_receive__test_cmd.stdout | from_json)
        fail_msg: "command {{ monitoring_thanos_receive__test_cmd.stdout }}"

    - name: 'Read the data directory'
      ansible.builtin.stat:
        path: "{{ monitoring_thanos_receive__test_case.role_vars.thanos_receive_home }}/data"
      register: 'monitoring_thanos_receive__test_data_dir'

    - name: 'Assert the data directory owned by nobody'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_receive__test_data_dir.stat.isdir | default(false)
          - monitoring_thanos_receive__test_data_dir.stat.uid == 65534
          - monitoring_thanos_receive__test_data_dir.stat.gid == 65534
        fail_msg: >-
          directory {{ monitoring_thanos_receive__test_data_dir.stat.isdir | default(false) }},
          uid {{ monitoring_thanos_receive__test_data_dir.stat.uid | default('') }}, gid {{ monitoring_thanos_receive__test_data_dir.stat.gid | default('') }}

    - name: 'Wait until receive is ready'
      ansible.builtin.uri:
        url: "{{ monitoring_thanos_receive__test_url }}/-/ready"
      register: 'monitoring_thanos_receive__test_ready'
      until: monitoring_thanos_receive__test_ready.status == 200
      retries: 15
      delay: 2

    # Prometheus sends its samples with remote write, receive appends them to the TSDB of the default tenant
    - name: 'Wait until receive stored samples of Prometheus'
      ansible.builtin.uri:
        url: "{{ monitoring_thanos_receive__test_url }}/metrics"
        return_content: true
      register: 'monitoring_thanos_receive__test_metrics'
      until: >-
        monitoring_thanos_receive__test_metrics.content is
        search('^prometheus_tsdb_head_samples_appended_total\{[^}]*tenant="default-tenant"[^}]*\} [1-9]', multiline=true)
      retries: 30
      delay: 2
