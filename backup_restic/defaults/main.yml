---

#
# Substitutes - do not change
#

backup_restic__password: "{{ backup_restic_password | mandatory }}"
backup_restic__cache_dir: "{{ backup_restic_cache_dir | default('/var/cache/restic') }}"
backup_restic__options: "{{ backup_restic_options | default('--compression max --one-file-system -v') }}"
backup_restic__include: "{{ backup_restic_include | default(backup_restic__include_default) }}"
backup_restic__exclude: "{{ backup_restic_exclude | default(backup_restic__exclude_default) }}"

backup_restic__repository: "{{ backup_restic_repository | default('backup') }}"
backup_restic__host: "{{ backup_restic_host | mandatory }}"
backup_restic__user: "{{ backup_restic_user | mandatory }}"
backup_restic__id_file: "{{ backup_restic_id_file | default('/root/.ssh/backup') }}"
backup_restic__ssh: "{{ backup_restic_ssh | default(false) }}"
backup_restic__sftp_command: "ssh -F /etc/backup/restic-ssh backup -s sftp"


#
# Do not change from here
#

backup_restic__exclude_default: []
backup_restic__include_default:
- '/etc'
- '/home'
- '/root'
- '/usr/local/etc'
- '/var/backups'
- '/var/log'

backup_restic__files:
  - '950.backup.restic'

backup_restic__packages: "{{ backup_restic__packages_default[ansible_distribution] | default([]) }}"

backup_restic__packages_default:
  Debian:
    - 'restic'
  Raspbian:
    - 'restic'
