---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/bookwyrm
#

app_bookwyrm__home: "{{ bookwyrm_home | mandatory }}"
app_bookwyrm__ip: "{{ bookwyrm_ip | mandatory }}"
app_bookwyrm__ipv6: "{{ bookwyrm_ipv6 | default('') }}"
app_bookwyrm__network: "{{ bookwyrm_network | mandatory }}"
app_bookwyrm__hostname: "{{ bookwyrm_hostname | mandatory }}"
app_bookwyrm__timezone: "{{ bookwyrm_timezone | mandatory }}"
app_bookwyrm__labels: "{{ bookwyrm_labels | default({}) }}"

app_bookwyrm__version: "{{ bookwyrm_version | default('latest') }}"

app_bookwyrm__container: "{{ app_bookwyrm__podman_container_default | combine(bookwyrm_container | default({})) }}"

app_bookwyrm__domain: "{{ bookwyrm_domain | mandatory }}"
app_bookwyrm__language_code: "{{ bookwyrm_language_code | default('en-us') }}"
app_bookwyrm__default_language: "{{ bookwyrm_default_language | default('English') }}"
app_bookwyrm__secret_key: "{{ bookwyrm_secret_key | mandatory }}"

app_bookwyrm__db_host: "{{ bookwyrm_db_host | mandatory }}"
app_bookwyrm__db_port: "{{ bookwyrm_db_port | default(5432) }}"
app_bookwyrm__db_user: "{{ bookwyrm_db_user | default('bookwyrm') }}"
app_bookwyrm__db_password: "{{ bookwyrm_db_pass | mandatory }}"
app_bookwyrm__db_name: "{{ bookwyrm_db_name | default('bookwyrm') }}"

app_bookwyrm__max_stream_length: "{{ bookwyrm_max_stream_length | default(200) }}"
app_bookwyrm__redis_activity_hostname: "{{ bookwyrm_redis_activity_hostname | mandatory }}"
app_bookwyrm__redis_activity_host: "{{ bookwyrm_redis_activity_host | mandatory }}"
app_bookwyrm__redis_activity_host6: "{{ bookwyrm_redis_activity_host6 | mandatory }}"
app_bookwyrm__redis_activity_port: "{{ bookwyrm_redis_activity_port | default(6379) }}"

app_bookwyrm__redis_broker_hostname: "{{ bookwyrm_redis_broker_hostname | mandatory }}"
app_bookwyrm__redis_broker_host: "{{ bookwyrm_redis_broker_host | mandatory }}"
app_bookwyrm__redis_broker_host6: "{{ bookwyrm_redis_broker_host6 | mandatory }}"
app_bookwyrm__redis_broker_port: "{{ bookwyrm_redis_broker_port | default(6379) }}"

app_bookwyrm__flower_port: "{{ bookwyrm_flower_port | default(8888) }}"
app_bookwyrm__flower_user: "{{ bookwyrm_flower_user | default('admin') }}"
app_bookwyrm__flower_password: "{{ bookwyrm_flower_password | mandatory }}"

app_bookwyrm__email_host: "{{ bookwyrm_email_host | mandatory }}"
app_bookwyrm__email_port: "{{ bookwyrm_email_port | default(587) }}"
app_bookwyrm__email_host_user: "{{ bookwyrm_email_host_user | mandatory }}"
app_bookwyrm__email_host_password: "{{ bookwyrm_email_host_password | mandatory }}"
app_bookwyrm__email_use_tls: "{{ bookwyrm_email_use_tls | default(true) }}"
app_bookwyrm__email_use_ssl: "{{ bookwyrm_email_use_ssl | default(false) }}"
app_bookwyrm__email_sender_name: "{{ bookwyrm_email_sender_name | default('admin') }}"
app_bookwyrm__email_sender_domain: "{{ bookwyrm_email_sender_domain | default(app_bookwyrm__domain) }}"

app_bookwyrm__enable_thumbnail_generation: "{{ bookwyrm_enable_thumbnail_generation | default(true) }}"
app_bookwyrm__enable_preview_images: "{{ bookwyrm_enable_preview_images | default(false) }}"

#
# Defaults - do not change
#

app_bookwyrm__podman_name: 'bookwyrm'
app_bookwyrm__podman_image: 'c0d3.sh/container/bookwyrm-docker'
app_bookwyrm__podman_tag: "{{ app_bookwyrm__version }}"

app_bookwyrm__podman_home: "{{ app_bookwyrm__home }}"
app_bookwyrm__podman_exports_dir: "{{ app_bookwyrm__podman_home }}/exports"
app_bookwyrm__podman_images_dir: "{{ app_bookwyrm__podman_home }}/images"
app_bookwyrm__podman_static_dir: "{{ app_bookwyrm__podman_home }}/static"

app_bookwyrm__podman_container_default:
  name: "{{ app_bookwyrm__podman_name }}"
  hostname: "{{ app_bookwyrm__hostname }}"
  image: "{{ app_bookwyrm__podman_image }}:{{ app_bookwyrm__podman_tag }}"
  ip: "{{ app_bookwyrm__ip }}"
  ipv6: "{{ app_bookwyrm__ipv6 }}"
  network: "{{ app_bookwyrm__network }}"
  timezone: "{{ app_bookwyrm__timezone }}"
  environment:
    DOMAIN: "{{ app_bookwyrm__domain }}"
    LANGUAGE_CODE: "{{ app_bookwyrm__language_code }}"
    DEFAULT_LANGUAGE: "{{ app_bookwyrm__default_language }}"
    PGPORT: "{{ app_bookwyrm__db_port }}"
    POSTGRES_HOST: "{{ app_bookwyrm__db_host }}"
    POSTGRES_USER: "{{ app_bookwyrm__db_user }}"
    POSTGRES_DB: "{{ app_bookwyrm__db_name }}"
    MAX_STREAM_LENGTH: "{{ app_bookwyrm__max_stream_length }}"
    REDIS_ACTIVITY_HOST: "{{ app_bookwyrm__redis_activity_host }}"
    REDIS_ACTIVITY_PORT: "{{ app_bookwyrm__redis_activity_port }}"
    REDIS_BROKER_HOST: "{{ app_bookwyrm__redis_broker_host }}"
    REDIS_BROKER_PORT: "{{ app_bookwyrm__redis_broker_port }}"
    FLOWER_PORT: "{{ app_bookwyrm__flower_port }}"
    FLOWER_USER: "{{ app_bookwyrm__flower_user }}"
    EMAIL_HOST: "{{ app_bookwyrm__email_host }}"
    EMAIL_PORT: "{{ app_bookwyrm__email_port }}"
    EMAIL_HOST_USER: "{{ app_bookwyrm__email_host_user }}"
    EMAIL_USE_TLS: "{{ app_bookwyrm__email_use_tls | ternary('true', 'false') }}"
    EMAIL_USE_SSL: "{{ app_bookwyrm__email_use_ssl | ternary('true', 'false') }}"
    EMAIL_SENDER_NAME: "{{ app_bookwyrm__email_sender_name }}"
    EMAIL_SENDER_DOMAIN: "{{ app_bookwyrm__email_sender_domain }}"
    ENABLE_THUMBNAIL_GENERATION: "{{ app_bookwyrm__enable_thumbnail_generation | ternary('true', 'false') }}"
    ENABLE_PREVIEW_IMAGES: "{{ app_bookwyrm__enable_preview_images | ternary('true', 'false') }}"
  labels: "{{ app_bookwyrm__labels }}"
  secrets:
    - "bookwyrm_secret_key,type=env,target=SECRET_KEY"
    - "bookwyrm_postgres_password,type=env,target=POSTGRES_PASSWORD"
    - "bookwyrm_flower_password,type=env,target=FLOWER_PASSWORD"
    - "bookwyrm_email_host_password,type=env,target=EMAIL_HOST_PASSWORD"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_bookwyrm__podman_exports_dir }}:/app/exports"
    - "{{ app_bookwyrm__podman_images_dir }}:/app/images"
    - "{{ app_bookwyrm__podman_static_dir }}:/app/static"
