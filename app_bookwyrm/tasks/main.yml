---

- name: 'Deploy Bookwyrm container'
  tags: [ 'app_bookwyrm' ]
  block:

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0700') }}"
        state: 'directory'
      with_items:
        - dest: "{{ app_bookwyrm__podman_exports_dir }}"
        - dest: "{{ app_bookwyrm__podman_images_dir }}"
        - dest: "{{ app_bookwyrm__podman_static_dir }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      with_items:
        - name: 'bookwyrm_secret_key'
          data: "{{ app_bookwyrm__secret_key }}"
        - name: 'bookwyrm_postgres_password'
          data: "{{ app_bookwyrm__db_password }}"
        - name: 'bookwyrm_flower_password'
          data: "{{ app_bookwyrm__flower_password }}"
        - name: 'bookwyrm_email_host_password'
          data: "{{ app_bookwyrm__email_host_password }}"

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ app_bookwyrm__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[app_bookwyrm__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ app_bookwyrm__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_bookwyrm__container.name }}"
        hostname: "{{ app_bookwyrm__container.hostname }}"
        image: "{{ app_bookwyrm__container.image }}"
        ip: "{{ app_bookwyrm__container.ip }}"
        ip6: "{{ app_bookwyrm__container.ipv6 | default(omit) }}"
        network: "{{ app_bookwyrm__container.network }}"
        timezone: "{{ app_bookwyrm__container.timezone }}"
        env: "{{ app_bookwyrm__container.environment | default(omit) }}"
        label: "{{ app_bookwyrm__container.labels | default(omit) }}"
        secrets: "{{ app_bookwyrm__container.secrets | default(omit) }}"
        volume: "{{ app_bookwyrm__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_bookwyrm__container.requires is defined %}
          Requires={{ app_bookwyrm__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ app_bookwyrm__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode | bool else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'
