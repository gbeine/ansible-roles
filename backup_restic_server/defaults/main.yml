---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/backup-restic-server
#

backup_restic_server__home: "{{ restic_server_home | mandatory }}"
backup_restic_server__ip: "{{ restic_server_ip | mandatory }}"
backup_restic_server__ipv6: "{{ restic_server_ipv6 | default('') }}"
backup_restic_server__network: "{{ restic_server_network | mandatory }}"
backup_restic_server__hostname: "{{ restic_server_hostname | mandatory }}"
backup_restic_server__timezone: "{{ restic_server_timezone | mandatory }}"
backup_restic_server__labels: "{{ restic_server_labels | default({}) }}"

backup_restic_server__version: "{{ restic_server_version | default('latest') }}"

backup_restic_server__container: "{{ backup_restic_server__podman_container_default | combine(restic_server_container | default({})) }}"

backup_restic_server__append_only: "{{ restic_server_append_only | default(false) }}"
backup_restic_server__private_repos: "{{ restic_server_private_repos | default(false) }}"

#
# Defaults - do not change
#

backup_restic_server__podman_name: 'restic-server'
backup_restic_server__podman_image: 'docker.io/restic/rest-server'
backup_restic_server__podman_tag: "{{ backup_restic_server__version }}"

backup_restic_server__podman_home: "{{ backup_restic_server__home }}"

backup_restic_server__podman_container_default:
  name: "{{ backup_restic_server__podman_name }}"
  hostname: "{{ backup_restic_server__hostname }}"
  image: "{{ backup_restic_server__podman_image }}:{{ backup_restic_server__podman_tag }}"
  ip: "{{ backup_restic_server__ip }}"
  ipv6: "{{ backup_restic_server__ipv6 }}"
  network: "{{ backup_restic_server__network }}"
  timezone: "{{ backup_restic_server__timezone }}"
  environment:
    OPTIONS: "{{ ' --append-only' if backup_restic_server__append_only else '' }}{{ ' --private-repos' if backup_restic_server__private_repos else '' }}"
  labels: "{{ backup_restic_server__labels }}"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ backup_restic_server__podman_home }}:/data"
