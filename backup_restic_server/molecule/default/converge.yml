---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman___update_mode: false

  pre_tasks:

    - name: 'Set the role variables of the first run'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ backup_restic_server__test_common | combine(backup_restic_server__test_converge.role_vars) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  tasks:

    - name: 'Run backup_restic_server'
      ansible.builtin.include_role:
        name: 'backup_restic_server'
