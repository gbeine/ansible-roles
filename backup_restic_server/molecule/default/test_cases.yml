---
# Network created by container_podman in prepare.yml
backup_restic_server__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

backup_restic_server__test_image: 'docker.io/restic/rest-server:latest'
backup_restic_server__test_home: '/opt/restic-server-molecule'
backup_restic_server__test_url: 'rest:http://10.89.0.10:8000'

# Test passwords only
backup_restic_server__test_passwords:
  alice: 'Ulf6Zvgj4N3gdhC6'
  alice_new: 'XCJJfo-P4bNVFscX'
  bob: 'iiQj9-Joa73ql54x'
  repository: '3LxqKOj4DdO4UHzY'

backup_restic_server__test_common:
  restic_server_home: "{{ backup_restic_server__test_home }}"
  restic_server_hostname: 'restic-server-molecule'
  restic_server_timezone: 'Europe/Berlin'
  restic_server_network: 'podman-molecule'
  restic_server_ip: '10.89.0.10'
  restic_server_environment:
    OPTIONS: '--append-only --private-repos'

# First run: alice and bob
backup_restic_server__test_converge:
  role_vars:
    restic_server_users:
      - name: 'alice'
        password: "{{ backup_restic_server__test_passwords.alice }}"
      - name: 'bob'
        password: "{{ backup_restic_server__test_passwords.bob }}"
  expect:
    users:
      - 'alice'
      - 'bob'
    logins:
      - user: 'alice'
        password: "{{ backup_restic_server__test_passwords.alice }}"
      - user: 'bob'
        password: "{{ backup_restic_server__test_passwords.bob }}"
    rejected:
      - user: 'alice'
        password: 'wrong-password'
        repository: 'alice'
      # private repositories: alice must not access the repository of bob
      - user: 'alice'
        password: "{{ backup_restic_server__test_passwords.alice }}"
        repository: 'bob'

# Second run (side_effect): bob removed, new password for alice
backup_restic_server__test_side_effect:
  role_vars:
    restic_server_users:
      - name: 'alice'
        password: "{{ backup_restic_server__test_passwords.alice_new }}"
  expect:
    users:
      - 'alice'
    logins:
      - user: 'alice'
        password: "{{ backup_restic_server__test_passwords.alice_new }}"
    rejected:
      - user: 'alice'
        password: "{{ backup_restic_server__test_passwords.alice }}"
        repository: 'alice'
      - user: 'bob'
        password: "{{ backup_restic_server__test_passwords.bob }}"
        repository: 'bob'
