---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman___update_mode: false

  tasks:

    - name: 'Check the state after the first run (alice and bob)'
      ansible.builtin.include_tasks: 'tasks/check_state.yml'
      vars:
        backup_restic_server__test_expect: "{{ backup_restic_server__test_converge.expect }}"

    - name: 'Set the role variables of the second run'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ backup_restic_server__test_common | combine(backup_restic_server__test_side_effect.role_vars) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Run backup_restic_server again (alice with a new password)'
      ansible.builtin.include_role:
        name: 'backup_restic_server'
