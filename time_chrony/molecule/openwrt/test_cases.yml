---
time_chrony__test_cases:

  # Without variables the sources of common_globals replace the pool of the delivery, the role installs chrony
  - name: 'molecule-chrony-openwrt-default'
    prepare_package: false
    role_vars: {}
    expect:
      uci:
        - 'chrony.allow=allow'
        - 'chrony.allow.interface=lan'
        - 'chrony.dhcp_ntp_server=dhcp_ntp_server'
        - 'chrony.makestep.threshold=1.0'
        - 'chrony.makestep.limit=3'
        - 'chrony.nts.rtccheck=1'
      absent: [ '2.openwrt.pool.ntp.org' ]
      # Lines of the configuration generated by chronyd.init
      generated:
        - 'server ptbtime1.ptb.de iburst'
        - 'pool 0.de.pool.ntp.org iburst'
        - 'makestep 1.0 3'
      generated_absent: [ '2.openwrt.pool.ntp.org' ]

  # prepare installs chrony and adds a section the role has to remove
  - name: 'molecule-chrony-openwrt'
    prepare_package: true
    role_vars:
      chrony_config:
        server: [ '192.0.2.123 iburst maxpoll 10' ]
        pool: []
        allow_interface: [ 'lan' ]
        logchange: 0.2
        smoothtime: '400 0.01 leaponly'
    # side_effect changes makestep, chronyd has to restart and generate the configuration again
    side_effect:
      makestep: '0.5 -1'
    expect:
      uci:
        - 'chrony.allow.interface=lan'
        - 'chrony.logging.logchange=0.2'
        - 'chrony.smoothtime.maxppm=400'
        - 'chrony.smoothtime.leaponly=1'
        - 'chrony.makestep.threshold=0.5'
        - 'chrony.makestep.limit=-1'
      absent: [ '2.openwrt.pool.ntp.org', 'ptbtime', 'molecule.example' ]
      generated:
        - 'server 192.0.2.123 maxpoll 10 iburst'
        - 'makestep 0.5 -1'
        - 'smoothtime 400 0.01 leaponly'
        - 'logchange 0.2'
      generated_absent: [ 'pool ', 'ptbtime', 'molecule.example', 'makestep 1.0 3' ]
