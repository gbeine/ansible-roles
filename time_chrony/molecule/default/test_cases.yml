---
time_chrony__test_config_file: '/etc/chrony/chrony.conf'

time_chrony__test_cases:

  # Without variables the sources of common_globals replace the pool of Debian
  - name: 'molecule-chrony-default'
    role_vars: {}
    expect:
      lines:
        - 'server ptbtime1.ptb.de iburst'
        - 'pool 0.de.pool.ntp.org iburst'
        - 'rtcsync'
        - 'makestep 1 3'
        - 'confdir /etc/chrony/conf.d'
      absent: [ 'pool 2.debian.pool.ntp.org', 'enabled' ]
      # The sources need DNS and access to the NTP servers
      sources: true
      listen: false

  # Own sources and an NTP server for the local network, dhcp_ntp_server is an option of OpenWrt
  - name: 'molecule-chrony'
    role_vars:
      chrony_config:
        server: [ '192.0.2.123 iburst prefer' ]
        pool: []
        allow: [ '192.168.0.0/16' ]
        local: 'stratum 10'
        dhcp_ntp_server: true
    # side_effect changes makestep, chrony has to restart
    side_effect:
      makestep: '0.5 -1'
    expect:
      lines:
        - 'server 192.0.2.123 iburst prefer'
        - 'allow 192.168.0.0/16'
        - 'local stratum 10'
        - 'makestep 0.5 -1'
      absent: [ 'pool ', 'ptbtime', 'dhcp_ntp_server', 'makestep 1 3' ]
      sources: false
      listen: true
