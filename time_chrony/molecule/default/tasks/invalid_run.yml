---
# Runs time_chrony with the invalid configuration passed as include parameter,
# the role has to fail before it changes the configuration.

- name: "Run time_chrony with an invalid configuration (expect ERROR): {{ time_chrony__test_invalid.message }}"
  block:

    - name: 'Run time_chrony, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'time_chrony'

    - name: 'Fail because the invalid configuration was accepted'
      ansible.builtin.fail:
        msg: "The invalid configuration was accepted: {{ time_chrony__test_invalid.message }}"

  rescue:

    - name: 'Read the configuration after the invalid run'
      ansible.builtin.stat:
        path: "{{ time_chrony__test_config_file }}"
        get_checksum: true
      register: 'time_chrony__test_config_after'

    - name: 'Assert the run failed with the expected message before the configuration changed'
      ansible.builtin.assert:
        that:
          - ansible_failed_result.msg | default('') is search(time_chrony__test_invalid.search)
          - time_chrony__test_config_after.stat.checksum == time_chrony__test_config_before.stat.checksum
        fail_msg: "Failure: {{ ansible_failed_result.msg | default('') }} {{ ansible_failed_result.stderr | default('') }}"
