---
# Included by tasks/main.yml on Debian

# chrony.conf of the package chrony of Debian 13 (4.6.1), the directives in the order of the file
time_chrony__config_default:
  enabled: true
  pool: [ '2.debian.pool.ntp.org iburst' ]
  sourcedir: [ '/run/chrony-dhcp', '/etc/chrony/sources.d' ]
  keyfile: '/etc/chrony/chrony.keys'
  driftfile: '/var/lib/chrony/chrony.drift'
  ntsdumpdir: '/var/lib/chrony'
  logdir: '/var/log/chrony'
  maxupdateskew: '100.0'
  rtcsync: true
  makestep: '1 3'
  leapseclist: '/usr/share/zoneinfo/leap-seconds.list'
  confdir: '/etc/chrony/conf.d'

time_chrony__debian_packages: [ 'chrony' ]
time_chrony__debian_service: 'chrony'
time_chrony__debian_config_file: '/etc/chrony/chrony.conf'
# Copy of the new configuration for chronyd -p, the AppArmor profile of chronyd allows reading /etc/chrony only
time_chrony__debian_check_file: '/etc/chrony/.chrony.conf.check'
