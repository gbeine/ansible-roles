---
# Included by tasks/main.yml on OpenWrt

# /etc/config/chrony of the package chrony (net/chrony/files/chrony.config of the packages feed) as directives of chrony.conf
# and the UCI options of the role
time_chrony__config_default:
  enabled: true
  pool: [ '2.openwrt.pool.ntp.org maxpoll 12 maxsources 4 iburst' ]
  dhcp_ntp_server: true
  allow_interface: [ 'lan' ]
  makestep: '1.0 3'
  rtccheck: true
  # systemcerts '1' of the section nts
  nosystemcert: false

time_chrony__openwrt_uci_config: '/etc/config/chrony'
time_chrony__openwrt_include_file: '/var/etc/chrony.d/10-uci.conf'
time_chrony__openwrt_service: 'chronyd'
time_chrony__openwrt_old_service: 'sysntpd'

# Options of the sections server, pool and peer, taken from handle_source of chronyd.init
time_chrony__openwrt_source_flags: [ 'iburst', 'nts', 'prefer', 'xleave' ]
time_chrony__openwrt_source_numbers: [ 'minpoll', 'maxpoll', 'maxdelay', 'mindelay', 'maxsamples', 'minsamples', 'port', 'ntsport', 'maxsources' ]

# Directives of /etc/chrony/chrony.conf of the package, the file is not managed by the role
time_chrony__openwrt_static_directives: [ 'confdir', 'sourcedir', 'noclientlog', 'rtcsync', 'driftfile', 'ntsdumpdir' ]

# Section types managed by the role, prune removes undeclared sections of these types only
time_chrony__openwrt_section_types:
  - 'server'
  - 'pool'
  - 'peer'
  - 'allow'
  - 'dhcp_ntp_server'
  - 'makestep'
  - 'nts'
  - 'smoothtime'
  - 'systemclock'
  - 'logging'
