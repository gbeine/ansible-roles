---
# Directives of the role without counterpart in chrony.conf, written with their UCI names on OpenWrt,
# ignored with a warning on Debian; enabled switches the service on both platforms
time_chrony__openwrt_only_options: [ 'allow_interface', 'dhcp_ntp_server', 'rtccheck' ]
time_chrony__boolean_options: [ 'enabled', 'dhcp_ntp_server', 'rtccheck' ]
time_chrony__role_options: [ 'enabled' ]

# Directive names of chrony.conf and the options of the role
time_chrony__name_pattern: '^[a-z][a-z0-9_]*$'

# Types of the time sources of common_globals__ntp_sources
time_chrony__source_types: [ 'server', 'pool', 'peer' ]
