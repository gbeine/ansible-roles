---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/time-chrony
#

# Directives of chrony.conf, every key replaces the key of the default of the platform (vars/Debian.yml, vars/OpenWrt.yml)
# and of the sources of common_globals completely, false and null remove it
time_chrony__config: "{{ time_chrony__config_default | combine(time_chrony__sources_config) | combine(chrony_config | default({})) }}"

# Time sources of the site, they replace the sources of the delivered configuration if there are any
time_chrony__ntp_sources: "{{ common_globals__ntp_sources }}"

#
# Defaults - do not change
#

# The sources of the site as directives server, pool and peer, nothing without sources
time_chrony__sources_config: >-
  {%- set config = {} -%}
  {%- if time_chrony__ntp_sources is sequence and time_chrony__ntp_sources is not string and time_chrony__ntp_sources | length > 0 -%}
  {%-   for type in ['server', 'pool', 'peer'] -%}
  {%-     set lines = [] -%}
  {%-     for source in time_chrony__ntp_sources | select('mapping') | selectattr('type', 'defined') | selectattr('type', 'eq', type) -%}
  {%-       set _ = lines.append(([source.address | default('') | string] + source.options | default([]) | map('string') | list) | join(' ')) -%}
  {%-     endfor -%}
  {%-     set _ = config.update({type: lines}) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ config }}
