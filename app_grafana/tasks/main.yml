---

- name: 'Install Grafana'
  tags: [ 'app', 'app_grafana' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or grafana_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - app_grafana__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - app_grafana__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_grafana__invalid | join('. ') }}"
        quiet: true
      vars:
        app_grafana__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = app_grafana__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('grafana_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('grafana_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of grafana_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - app_grafana__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_grafana__errors | join(' ') }}"
        quiet: true
      vars:
        app_grafana__environment_missing: >-
          {{ app_grafana__environment_required
             | reject('in', app_grafana__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        app_grafana__secrets_in_environment: >-
          {{ (app_grafana__secrets | map(attribute='target') | list
              + app_grafana__secret_variables + app_grafana__secret_files.values() | list)
             | select('in', app_grafana__environment.keys() | list) | unique | list }}
        app_grafana__errors: >-
          {%- set errors = [] -%}
          {%- if app_grafana__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('Grafana needs the environment variables ' ~ (app_grafana__environment_required | join(', ')) ~ ', missing or empty: ' ~ (app_grafana__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_grafana__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets and their file variables must not be set in grafana_environment: ' ~ (app_grafana__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging grafana_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - app_grafana__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_grafana__errors | join(' ') }}"
        quiet: true
      vars:
        app_grafana__environment_unknown: >-
          {{ (app_grafana__container.environment | default({})).keys() | reject('in', app_grafana__environment_allowed) | list }}
        app_grafana__secrets_unknown: >-
          {{ app_grafana__secrets | map(attribute='target') | reject('in', app_grafana__secret_files.keys() | list) | list }}
        app_grafana__errors: >-
          {%- set errors = [] -%}
          {%- if app_grafana__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (app_grafana__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_grafana__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (app_grafana__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the options of grafana.ini as GF_<SECTION>_<KEY> (app_grafana__environment_allowed) and the secrets in app_grafana__secret_files.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item }}"
        owner: "{{ app_grafana__uid }}"
        mode: '0700'
        state: 'directory'
      loop:
        - "{{ app_grafana__podman_data_dir }}"
        - "{{ app_grafana__podman_log_dir }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ app_grafana__secrets }}"
      register: 'app_grafana__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_grafana__container.name }}"
        hostname: "{{ app_grafana__container.hostname }}"
        image: "{{ app_grafana__container.image }}"
        ip: "{{ app_grafana__container.ip }}"
        ip6: "{{ app_grafana__container.ipv6 | default(omit) }}"
        network: "{{ app_grafana__container.network }}"
        timezone: "{{ app_grafana__container.timezone }}"
        command: "{{ app_grafana__container.command | default(omit) }}"
        env: "{{ app_grafana__container.environment | default(omit) }}"
        etc_hosts: "{{ app_grafana__container.etc_hosts | default(omit) }}"
        expose: "{{ app_grafana__container.expose | default(omit) }}"
        label: "{{ app_grafana__container.labels | default(omit) }}"
        publish: "{{ app_grafana__container.publish | default(omit) }}"
        secrets: "{{ app_grafana__container.secrets | default(omit) }}"
        volume: "{{ app_grafana__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_grafana__container.requires is defined %}
          Requires={{ app_grafana__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'app_grafana__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ app_grafana__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if app_grafana__restart | bool else 'started' }}"
        enabled: true
      vars:
        app_grafana__running: >-
          {{ (ansible_facts.services[app_grafana__container.name + '.service'].state | default('')) == 'running' }}
        app_grafana__restart: >-
          {{ app_grafana__running | bool
             and (app_grafana__secrets_result is changed
                  or app_grafana__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'app_grafana__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_grafana__container.name }}"
        container_image: "{{ app_grafana__container.image }}"
        container_schedule: "{{ app_grafana__autoupdate_schedule }}"
