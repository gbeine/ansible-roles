---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_grafana__test_case: "{{ app_grafana__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    app_grafana__test_checked_files:
      - "{{ app_grafana__test_quadlet_path }}"
      - "{{ app_grafana__test_case.role_vars.grafana_home }}/etc/grafana.ini"

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ app_grafana__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksums of the quadlet unit and the configuration before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ app_grafana__test_checked_files }}"
      register: 'app_grafana__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include
    - name: 'Run app_grafana with grafana_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        grafana_container: [ 'environment' ]
        app_grafana__test_invalid:
          message: 'grafana_container is not a dictionary'
          # combine of the defaults fails before the role checks anything
          search: 'failed to combine variables, expected dicts'

    - name: 'Run app_grafana with a section of grafana_config not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        grafana_config:
          server: 'x'
        app_grafana__test_invalid:
          message: 'a section of grafana_config is not a dictionary'
          search: '^grafana_config sections have to be dictionaries: server$'

    - name: 'Run app_grafana with an invalid name of a secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        grafana_secrets:
          - name: 'a/b'
            data: 'x'
        app_grafana__test_invalid:
          message: 'an invalid name of a secret'
          search: '^grafana_secrets entries need name of letters, digits, ., _ or - and data$'

    - name: 'Run app_grafana with the changed role variables'
      when: app_grafana__test_case.side_effect is defined
      block:

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'grafana' ]
          register: 'app_grafana__test_started_before'
          changed_when: false

        - name: 'Set the changed role variables'
          ansible.builtin.set_fact:
            "{{ item.key }}": "{{ item.value }}"
          loop: "{{ app_grafana__test_case.side_effect.role_vars | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: 'Run app_grafana with the changed role variables'
          ansible.builtin.include_role:
            name: 'app_grafana'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'grafana' ]
          register: 'app_grafana__test_started_after'
          changed_when: false

        - name: 'Assert the changed configuration and the restart of the service'
          ansible.builtin.assert:
            that:
              - app_grafana__config_result is changed
              - app_grafana__quadlet_result is not changed
              - app_grafana__test_started_after.stdout | int > app_grafana__test_started_before.stdout | int
            fail_msg: >-
              configuration changed: {{ app_grafana__config_result is changed }},
              quadlet changed: {{ app_grafana__quadlet_result is changed }},
              start before {{ app_grafana__test_started_before.stdout }}, after {{ app_grafana__test_started_after.stdout }}
