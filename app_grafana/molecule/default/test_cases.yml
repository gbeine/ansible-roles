---
# Network created by container_podman in prepare.yml
app_grafana__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_grafana__test_image: 'docker.io/grafana/grafana:latest'
app_grafana__test_quadlet_path: '/etc/containers/systemd/grafana.container'

app_grafana__test_cases:

  # Only the mandatory variables, the admin of Grafana is admin with the password admin
  - name: 'molecule-grafana-default'
    role_vars:
      grafana_home: '/opt/grafana'
      grafana_ip: '10.89.0.80'
      grafana_network: 'podman-molecule'
      grafana_hostname: 'grafana-default'
      grafana_timezone: 'Europe/Berlin'
    expect:
      ip: '10.89.0.80'
      ip6: ~
      home: '/opt/grafana'
      username: 'admin'
      password: 'admin'
      anonymous_status: 401
      header: ~
      quadlet:
        - 'Volume=/opt/grafana/grafana.ini:/etc/grafana/grafana.ini:ro'
        - 'Volume=/opt/grafana/data:/var/lib/grafana'
        - 'Volume=/opt/grafana/log:/var/log/grafana'
      ini:
        - '[server]'
        - 'domain = grafana-default'

  # IPv6, labels, an option of the default section, a free section, a plugin section with grafana_keys
  # and the password of the admin from a secret referenced with $__file{} in grafana.ini
  - name: 'molecule-grafana'
    role_vars:
      grafana_home: '/srv/grafana'
      grafana_ip: '10.89.0.81'
      grafana_ipv6: 'fd00:89::81'
      grafana_network: 'podman-molecule'
      grafana_hostname: 'grafana-molecule'
      grafana_timezone: 'Europe/Berlin'
      grafana_labels:
        traefik.enable: 'true'
      grafana_keys:
        plugin: [ 'molecule-panel' ]
      grafana_secrets:
        - name: 'grafana_admin_password'
          data: 'molecule-password'
          target: 'security.admin_password'
      grafana_config:
        instance_name: 'molecule'
        server:
          domain: 'grafana.example.org'
        log:
          level: 'warn'
        security:
          admin_user: 'molecule'
        server.custom_response_headers:
          X-Molecule: 'grafana'
        plugin.molecule-panel:
          enabled: true
    # side_effect enables the anonymous access, grafana.ini changes and Grafana has to restart
    side_effect:
      config:
        auth.anonymous:
          enabled: true
          org_role: 'Viewer'
    expect:
      ip: '10.89.0.81'
      ip6: 'fd00:89::81'
      home: '/srv/grafana'
      username: 'molecule'
      password: 'molecule-password'
      anonymous_status: 200
      header: 'grafana'
      quadlet:
        - 'Volume=/srv/grafana/grafana.ini:/etc/grafana/grafana.ini:ro'
        - 'Volume=/srv/grafana/data:/var/lib/grafana'
        - 'Secret=grafana_admin_password,type=mount,target=/run/secrets/grafana_admin_password'
        - 'Label=traefik.enable=true'
      ini:
        - 'instance_name = molecule'
        - '[auth.anonymous]'
        - 'enabled = true'
        - 'org_role = Viewer'
        - '[log]'
        - 'level = warn'
        - '[plugin.molecule-panel]'
        - '[security]'
        - 'admin_password = $__file{/run/secrets/grafana_admin_password}'
        - 'admin_user = molecule'
        - '[server]'
        - 'domain = grafana.example.org'
        - '[server.custom_response_headers]'
        - 'X-Molecule = grafana'
