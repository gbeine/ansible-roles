---
# Network created by container_podman in prepare.yml
app_grafana__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_grafana__test_image: 'docker.io/grafana/grafana:latest'
app_grafana__test_quadlet_path: '/etc/containers/systemd/grafana.container'

app_grafana__test_cases:

  # Only the mandatory variables, the admin of Grafana is admin with the password admin
  - name: 'molecule-grafana-default'
    role_vars:
      grafana_home: '/opt/grafana'
      grafana_ip: '10.89.0.80'
      grafana_network: 'podman-molecule'
      grafana_hostname: 'grafana-default'
      grafana_timezone: 'Europe/Berlin'
    expect:
      ip: '10.89.0.80'
      ip6: ~
      home: '/opt/grafana'
      username: 'admin'
      password: 'admin'
      anonymous_status: 401
      quadlet:
        - 'Volume=/opt/grafana/data:/var/lib/grafana'
        - 'Volume=/opt/grafana/log:/var/log/grafana'
      env:
        - 'GF_SERVER_DOMAIN=grafana-default'

  # IPv6, labels, a key without section and the password of the admin from a secret, the role sets GF_SECURITY_ADMIN_PASSWORD__FILE
  - name: 'molecule-grafana'
    role_vars:
      grafana_home: '/srv/grafana'
      grafana_ip: '10.89.0.81'
      grafana_ipv6: 'fd00:89::81'
      grafana_network: 'podman-molecule'
      grafana_hostname: 'grafana-molecule'
      grafana_timezone: 'Europe/Berlin'
      grafana_labels:
        traefik.enable: 'true'
      grafana_secrets:
        - name: 'grafana_admin_password'
          data: 'molecule-password'
          target: 'GF_SECURITY_ADMIN_PASSWORD'
      grafana_environment:
        GF_DEFAULT_INSTANCE_NAME: 'molecule'
        GF_SERVER_DOMAIN: 'grafana.example.org'
        GF_LOG_LEVEL: 'warn'
        GF_SECURITY_ADMIN_USER: 'molecule'
    # side_effect enables the anonymous access, the quadlet unit changes and Grafana has to restart
    side_effect:
      role_vars:
        grafana_environment:
          GF_DEFAULT_INSTANCE_NAME: 'molecule'
          GF_SERVER_DOMAIN: 'grafana.example.org'
          GF_LOG_LEVEL: 'warn'
          GF_SECURITY_ADMIN_USER: 'molecule'
          GF_AUTH_ANONYMOUS_ENABLED: 'true'
          GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
    expect:
      ip: '10.89.0.81'
      ip6: 'fd00:89::81'
      home: '/srv/grafana'
      username: 'molecule'
      password: 'molecule-password'
      anonymous_status: 200
      quadlet:
        - 'Volume=/srv/grafana/data:/var/lib/grafana'
        - 'Secret=grafana_admin_password,type=mount,target=/run/secrets/grafana_admin_password'
        - 'Label=traefik.enable=true'
      env:
        - 'GF_DEFAULT_INSTANCE_NAME=molecule'
        - 'GF_SERVER_DOMAIN=grafana.example.org'
        - 'GF_LOG_LEVEL=warn'
        - 'GF_SECURITY_ADMIN_USER=molecule'
        - 'GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password'
        - 'GF_AUTH_ANONYMOUS_ENABLED=true'
        - 'GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer'
