---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_grafana__test_case: "{{ app_grafana__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    app_grafana__expect: "{{ app_grafana__test_case.expect }}"
    app_grafana__test_url: "http://{{ app_grafana__expect.ip }}:3000"

  tasks:

    - name: 'Read the generated quadlet unit'
      ansible.builtin.slurp:
        src: "{{ app_grafana__test_quadlet_path }}"
      register: 'app_grafana__test_quadlet'

    # podman may quote values, the quotes are removed before the lines are compared
    - name: 'Assert the quadlet unit'
      ansible.builtin.assert:
        that:
          - ('Image=' + app_grafana__test_image) in app_grafana__test_quadlet_lines
          - ('IP=' + app_grafana__expect.ip) in app_grafana__test_quadlet_lines
          - app_grafana__expect.ip6 is none or ('IP6=' + app_grafana__expect.ip6) in app_grafana__test_quadlet_lines
          - app_grafana__expect.ip6 is not none or app_grafana__test_quadlet_lines | select('match', 'IP6=') | list | length == 0
          - app_grafana__expect.quadlet | reject('in', app_grafana__test_quadlet_lines) | list | length == 0
          # The time zone is set with timezone of the container, /etc/localtime is not mounted
          - app_grafana__test_quadlet_lines | select('search', '/etc/localtime|/etc/timezone') | list | length == 0
          # The options are part of grafana.ini, neither options, passwords nor an empty environment are part of the quadlet unit
          - app_grafana__test_quadlet_lines | select('search', 'GF_|molecule-password|Environment=') | list | length == 0
        fail_msg: "{{ app_grafana__test_quadlet.content | b64decode }}"
      vars:
        app_grafana__test_quadlet_lines: "{{ (app_grafana__test_quadlet.content | b64decode | regex_replace('\"', '')).splitlines() }}"

    - name: 'Read the state of the grafana service'
      ansible.builtin.command: 'systemctl is-active grafana'
      register: 'app_grafana__test_service'
      changed_when: false
      failed_when: false

    - name: 'Read the data and log directories'
      ansible.builtin.stat:
        path: "{{ app_grafana__expect.home }}/{{ item }}"
      loop: [ 'data', 'log' ]
      register: 'app_grafana__test_dirs'

    - name: 'Assert the service and the directories'
      ansible.builtin.assert:
        that:
          - app_grafana__test_service.stdout == 'active'
          - app_grafana__test_dirs.results | map(attribute='stat') | rejectattr('uid', 'eq', 472) | list | length == 0
          - app_grafana__test_dirs.results | map(attribute='stat') | rejectattr('mode', 'eq', '0700') | list | length == 0
        fail_msg: >-
          service {{ app_grafana__test_service.stdout }},
          directories {{ app_grafana__test_dirs.results | map(attribute='stat') | map(attribute='path') | join(', ') }}
          owners {{ app_grafana__test_dirs.results | map(attribute='stat') | map(attribute='uid') | join(', ') }}
          modes {{ app_grafana__test_dirs.results | map(attribute='stat') | map(attribute='mode') | join(', ') }}

    - name: 'Read grafana.ini'
      ansible.builtin.slurp:
        src: "{{ app_grafana__expect.home }}/grafana.ini"
      register: 'app_grafana__test_ini'

    - name: 'Read the state of grafana.ini'
      ansible.builtin.stat:
        path: "{{ app_grafana__expect.home }}/grafana.ini"
      register: 'app_grafana__test_ini_stat'

    # grafana.ini contains the reference to the file of the secret, not the password
    - name: 'Assert grafana.ini'
      ansible.builtin.assert:
        that:
          - app_grafana__expect.ini | reject('in', app_grafana__test_ini_lines) | list | length == 0
          - app_grafana__test_ini_lines | select('search', 'molecule-password') | list | length == 0
          - app_grafana__test_ini_stat.stat.uid == 0
          - app_grafana__test_ini_stat.stat.mode == '0644'
        fail_msg: >-
          missing {{ app_grafana__expect.ini | reject('in', app_grafana__test_ini_lines) | list }},
          owner {{ app_grafana__test_ini_stat.stat.uid }}, mode {{ app_grafana__test_ini_stat.stat.mode }}
      vars:
        app_grafana__test_ini_lines: "{{ (app_grafana__test_ini.content | b64decode).splitlines() }}"

    - name: 'Inspect the grafana container'
      ansible.builtin.command: 'podman inspect grafana'
      register: 'app_grafana__test_inspect'
      changed_when: false

    - name: 'Assert the container addresses and environment'
      ansible.builtin.assert:
        that:
          - app_grafana__test_net.IPAddress == app_grafana__expect.ip
          - app_grafana__expect.ip6 is none or app_grafana__test_net.GlobalIPv6Address == app_grafana__expect.ip6
          # The password is read by Grafana from the file of the secret, it is not part of the environment
          - app_grafana__test_env | select('search', 'molecule-password|GF_SECURITY') | list | length == 0
          - app_grafana__test_env | select('match', 'TZ=') | list | length == 0
          - app_grafana__test_container.Config.Timezone == app_grafana__test_case.role_vars.grafana_timezone
        fail_msg: >-
          IPv4 {{ app_grafana__test_net.IPAddress }}, IPv6 {{ app_grafana__test_net.GlobalIPv6Address }},
          time zone {{ app_grafana__test_container.Config.Timezone | default('') }},
          environment {{ app_grafana__test_env | join(', ') }}
      vars:
        app_grafana__test_container: "{{ (app_grafana__test_inspect.stdout | from_json)[0] }}"
        app_grafana__test_net: "{{ app_grafana__test_container.NetworkSettings.Networks[app_grafana__test_case.role_vars.grafana_network] }}"
        app_grafana__test_env: "{{ app_grafana__test_container.Config.Env }}"

    # systemd counts only the restarts after a crash, a restart loop is reported with the journal
    - name: 'Read the automatic restarts of the service'
      ansible.builtin.command:
        argv: [ 'systemctl', 'show', '--property=NRestarts', '--value', 'grafana' ]
      register: 'app_grafana__test_restarts'
      changed_when: false

    - name: 'Read the journal of the service'
      ansible.builtin.command:
        argv: [ 'journalctl', '-u', 'grafana', '-n', '80', '--no-pager' ]
      register: 'app_grafana__test_journal'
      changed_when: false
      failed_when: false

    - name: 'Assert the service did not restart by itself'
      ansible.builtin.assert:
        that:
          - app_grafana__test_restarts.stdout | int == 0
        fail_msg: "{{ [ 'automatic restarts: ' ~ app_grafana__test_restarts.stdout ] + app_grafana__test_journal.stdout_lines | default([]) }}"

    # The first start of Grafana migrates the database
    - name: 'Wait until Grafana is ready'
      ansible.builtin.uri:
        url: "{{ app_grafana__test_url }}/api/health"
        return_content: true
      register: 'app_grafana__test_ready'
      until: app_grafana__test_ready.status == 200 and (app_grafana__test_ready.json.database | default('')) == 'ok'
      retries: 30
      delay: 5

    # Grafana adds the headers of the section server.custom_response_headers to every response
    - name: 'Request the organization without credentials'
      ansible.builtin.uri:
        url: "{{ app_grafana__test_url }}/api/org"
        status_code: [ 200, 401 ]
      register: 'app_grafana__test_anonymous'

    - name: 'Request the organization with the credentials of the admin'
      ansible.builtin.uri:
        url: "{{ app_grafana__test_url }}/api/org"
        url_username: "{{ app_grafana__expect.username }}"
        url_password: "{{ app_grafana__expect.password }}"
        force_basic_auth: true
        status_code: [ 200, 401 ]
      register: 'app_grafana__test_admin'

    - name: 'Assert the anonymous access and the login of the admin'
      ansible.builtin.assert:
        that:
          - app_grafana__test_anonymous.status == app_grafana__expect.anonymous_status
          - app_grafana__test_admin.status == 200
          - app_grafana__expect.header is none or app_grafana__test_admin.x_molecule | default('') == app_grafana__expect.header
        fail_msg: >-
          without credentials {{ app_grafana__test_anonymous.status }} (expected {{ app_grafana__expect.anonymous_status }}),
          admin {{ app_grafana__expect.username }} {{ app_grafana__test_admin.status }},
          header X-Molecule {{ app_grafana__test_admin.x_molecule | default('missing') }}
