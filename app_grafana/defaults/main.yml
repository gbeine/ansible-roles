---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/grafana
#

app_grafana__home: "{{ grafana_home | mandatory }}"
app_grafana__ip: "{{ grafana_ip | mandatory }}"
app_grafana__ipv6: "{{ grafana_ipv6 }}"
app_grafana__network: "{{ grafana_network | mandatory }}"
app_grafana__hostname: "{{ grafana_hostname | mandatory }}"
app_grafana__timezone: "{{ grafana_timezone | mandatory }}"
app_grafana__labels: "{{ grafana_labels }}"

app_grafana__version: "{{ grafana_version | default('latest') }}"

app_grafana__container: "{{ app_grafana__podman_container_default | combine(grafana_container | default({})) }}"

# Variables of the image, the options of Grafana are set with grafana_config
app_grafana__environment: "{{ grafana_environment }}"

# Secrets with name, data and target, the target is section.key of grafana.ini, e.g. security.admin_password
app_grafana__secrets: "{{ grafana_secrets | default([]) }}"

# Options of grafana.ini: keys with a value belong to the default section (e.g. instance_name), keys with a dictionary are sections
app_grafana__config: "{{ app_grafana__config_default | combine(grafana_config | default({}), recursive=true) }}"

# Keys of the sections with a free name, e.g. { 'plugin': [ 'grafana-clock-panel' ] } for the section plugin.grafana-clock-panel
app_grafana__keys: "{{ grafana_keys | default({}) }}"

app_grafana__autoupdate_enabled: "{{ grafana_autoupdate_enabled | default(false) }}"
app_grafana__autoupdate_schedule: "{{ grafana_autoupdate_schedule }}"

#
# Defaults - do not change
#

# Everything else are the defaults of Grafana (conf/defaults.ini of the image)
app_grafana__config_default:
  server:
    domain: "{{ app_grafana__hostname }}"

# The options of grafana_config, the role checks that it is a dictionary
app_grafana__config_custom: "{{ grafana_config | default({}) }}"

# The variables of the image (packaging/docker/run.sh of Grafana v13.3.1) without the paths set by the image,
# the options of Grafana (GF_<SECTION>_<KEY>) are set with grafana_config
app_grafana__environment_allowed: [ 'TZ' ]

# The families of grafana_keys with the sections composed from a key, the keys of these sections are free
app_grafana__keys_families:
  plugin: 'plugin.<key>'

# Characters of the keys of grafana_keys and of the keys of the sections with free keys
app_grafana__key_pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'

# The valid keys of grafana_keys by family, invalid keys are reported by the validation of the keys
app_grafana__keys_valid: >-
  {%- set result = {} -%}
  {%- if app_grafana__keys is mapping -%}
  {%-   for family, keys in app_grafana__keys.items()
          if family in app_grafana__keys_families and keys is sequence and keys is not string and keys is not mapping -%}
  {%-     set _ = result.update({ family: keys | select('string') | select('match', app_grafana__key_pattern) | unique | list }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ result }}

# The sections with free keys: the sections of defaults.ini without keys and the sections composed from grafana_keys
app_grafana__config_free: >-
  {%- set sections = app_grafana__config_free_sections | list -%}
  {%- for family, keys in app_grafana__keys_valid.items() -%}
  {%-   for key in keys -%}
  {%-     set _ = sections.append(app_grafana__keys_families[family] | replace('<key>', key)) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ sections }}

# The configuration with the references to the files of the secrets, secrets with an unknown target are left out
app_grafana__config_secrets: >-
  {%- set config = {} -%}
  {%- if app_grafana__secrets is sequence and app_grafana__secrets is not string and app_grafana__secrets is not mapping -%}
  {%-   for secret in app_grafana__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in app_grafana__secrets_allowed -%}
  {%-     set option = app_grafana__secrets_allowed[secret.target] -%}
  {%-     set _ = config.update({ option.section: (config[option.section] | default({}))
                                  | combine({ option.key: '$__file{' ~ app_grafana__secrets_dir ~ '/' ~ secret.name ~ '}' }) }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ config }}

# The content of grafana.ini, the options of the default section first
app_grafana__ini: "{{ app_grafana__config | combine(app_grafana__config_secrets, recursive=true) }}"

# User grafana of the image
app_grafana__uid: 472

app_grafana__secrets_dir: '/run/secrets'

app_grafana__podman_name: 'grafana'
app_grafana__podman_image: 'docker.io/grafana/grafana'
app_grafana__podman_tag: "{{ app_grafana__version }}"

app_grafana__podman_home: "{{ app_grafana__home }}"

app_grafana__data_dir: "{{ app_grafana__podman_home }}/data"
app_grafana__log_dir: "{{ app_grafana__podman_home }}/log"
app_grafana__config_file: "{{ app_grafana__podman_home }}/grafana.ini"

app_grafana__podman_container_default:
  name: "{{ app_grafana__podman_name }}"
  hostname: "{{ app_grafana__hostname }}"
  image: "{{ app_grafana__podman_image }}:{{ app_grafana__podman_tag }}"
  ip: "{{ app_grafana__ip }}"
  ipv6: "{{ app_grafana__ipv6 | default(omit) }}"
  network: "{{ app_grafana__network }}"
  timezone: "{{ app_grafana__timezone }}"
  environment: "{{ app_grafana__environment | default(omit) }}"
  labels: "{{ app_grafana__labels | default(omit) }}"
  secrets: >-
    {{ (app_grafana__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ app_grafana__secrets_dir ~ '/\1') | list)
      if (app_grafana__secrets is sequence and app_grafana__secrets is not string and app_grafana__secrets | length > 0)
      else omit }}
  # grafana_container.volumes replaces the list completely
  volumes:
    - "{{ app_grafana__config_file }}:/etc/grafana/grafana.ini:ro"
    - "{{ app_grafana__data_dir }}:/var/lib/grafana"
    - "{{ app_grafana__log_dir }}:/var/log/grafana"

