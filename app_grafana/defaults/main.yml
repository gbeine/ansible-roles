# Options carrying secrets, they must be passed with grafana_secrets
app_grafana__secret_variables: "{{ app_grafana__secret_files.keys() | list }}"

# The secrets are mounted as files, the image (run.sh) reads every GF_<VARIABLE> from the file in GF_<VARIABLE>__FILE.
# Selected from conf/defaults.ini of Grafana v13.3.1: passwords, client secrets, tokens and keys of credentials,
# update with new versions of Grafana
app_grafana__secret_files:
  GF_SECURITY_ADMIN_PASSWORD: 'GF_SECURITY_ADMIN_PASSWORD__FILE'
  GF_SECURITY_SECRET_KEY: 'GF_SECURITY_SECRET_KEY__FILE'
  GF_DATABASE_PASSWORD: 'GF_DATABASE_PASSWORD__FILE'
  GF_NATS_TOKEN: 'GF_NATS_TOKEN__FILE'
  GF_SNAPSHOTS_EXTERNAL_SNAPSHOT_TOKEN: 'GF_SNAPSHOTS_EXTERNAL_SNAPSHOT_TOKEN__FILE'
  GF_AUTH_GITHUB_CLIENT_SECRET: 'GF_AUTH_GITHUB_CLIENT_SECRET__FILE'
  GF_AUTH_GITLAB_CLIENT_SECRET: 'GF_AUTH_GITLAB_CLIENT_SECRET__FILE'
  GF_AUTH_GOOGLE_CLIENT_SECRET: 'GF_AUTH_GOOGLE_CLIENT_SECRET__FILE'
  GF_AUTH_GRAFANANET_CLIENT_SECRET: 'GF_AUTH_GRAFANANET_CLIENT_SECRET__FILE'
  GF_AUTH_GRAFANA_COM_CLIENT_SECRET: 'GF_AUTH_GRAFANA_COM_CLIENT_SECRET__FILE'
  GF_AUTH_AZUREAD_CLIENT_SECRET: 'GF_AUTH_AZUREAD_CLIENT_SECRET__FILE'
  GF_AUTH_OKTA_CLIENT_SECRET: 'GF_AUTH_OKTA_CLIENT_SECRET__FILE'
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: 'GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE'
  GF_AZURE_USER_IDENTITY_CLIENT_SECRET: 'GF_AZURE_USER_IDENTITY_CLIENT_SECRET__FILE'
  GF_SMTP_PASSWORD: 'GF_SMTP_PASSWORD__FILE'
  GF_UNIFIED_ALERTING_HA_REDIS_PASSWORD: 'GF_UNIFIED_ALERTING_HA_REDIS_PASSWORD__FILE'
  GF_UNIFIED_ALERTING_HA_REDIS_SENTINEL_PASSWORD: 'GF_UNIFIED_ALERTING_HA_REDIS_SENTINEL_PASSWORD__FILE'
  GF_UNIFIED_ALERTING_STATE_HISTORY_LOKI_BASIC_AUTH_PASSWORD: 'GF_UNIFIED_ALERTING_STATE_HISTORY_LOKI_BASIC_AUTH_PASSWORD__FILE'
  GF_UNIFIED_ALERTING_NOTIFICATION_HISTORY_LOKI_BASIC_AUTH_PASSWORD: 'GF_UNIFIED_ALERTING_NOTIFICATION_HISTORY_LOKI_BASIC_AUTH_PASSWORD__FILE'
  GF_REMOTE_ALERTMANAGER_PASSWORD: 'GF_REMOTE_ALERTMANAGER_PASSWORD__FILE'
  GF_METRICS_BASIC_AUTH_PASSWORD: 'GF_METRICS_BASIC_AUTH_PASSWORD__FILE'
  GF_GRAFANA_COM_SSO_API_TOKEN: 'GF_GRAFANA_COM_SSO_API_TOKEN__FILE'
  GF_GRAFANA_COM_PROXY_TOKEN: 'GF_GRAFANA_COM_PROXY_TOKEN__FILE'
  GF_EXTERNAL_IMAGE_STORAGE_S3_SECRET_KEY: 'GF_EXTERNAL_IMAGE_STORAGE_S3_SECRET_KEY__FILE'
  GF_EXTERNAL_IMAGE_STORAGE_WEBDAV_PASSWORD: 'GF_EXTERNAL_IMAGE_STORAGE_WEBDAV_PASSWORD__FILE'
  GF_EXTERNAL_IMAGE_STORAGE_AZURE_BLOB_ACCOUNT_KEY: 'GF_EXTERNAL_IMAGE_STORAGE_AZURE_BLOB_ACCOUNT_KEY__FILE'
