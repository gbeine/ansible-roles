---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/grafana
#

app_grafana__home: "{{ grafana_home | mandatory }}"
app_grafana__ip: "{{ grafana_ip | mandatory }}"
app_grafana__ipv6: "{{ grafana_ipv6 }}"
app_grafana__network: "{{ grafana_network | mandatory }}"
app_grafana__hostname: "{{ grafana_hostname | mandatory }}"
app_grafana__timezone: "{{ grafana_timezone | mandatory }}"
app_grafana__labels: "{{ grafana_labels }}"

app_grafana__version: "{{ grafana_version | default('latest') }}"

app_grafana__container: "{{ app_grafana__podman_container_default | combine(grafana_container | default({})) }}"
app_grafana__environment: "{{ app_grafana__environment_default | combine(grafana_environment | default({})) }}"
app_grafana__secrets: "{{ grafana_secrets | default([]) }}"

app_grafana__autoupdate_enabled: "{{ grafana_autoupdate_enabled | default(false) }}"
app_grafana__autoupdate_schedule: "{{ grafana_autoupdate_schedule }}"

#
# Defaults - do not change
#

# Everything else are the defaults of Grafana (conf/defaults.ini of the image)
app_grafana__environment_default:
  GF_SERVER_DOMAIN: "{{ app_grafana__hostname }}"

app_grafana__environment_required: []

