# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
app_grafana__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if app_grafana__secrets is sequence and app_grafana__secrets is not string and app_grafana__secrets is not mapping -%}
  {%-   for secret in app_grafana__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in app_grafana__secret_files -%}
  {%-     set _ = environment.update({ app_grafana__secret_files[secret.target]: app_grafana__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# User grafana of the image
app_grafana__uid: 472

app_grafana__secrets_dir: '/run/secrets'

app_grafana__podman_name: 'grafana'
app_grafana__podman_image: 'docker.io/grafana/grafana'
app_grafana__podman_tag: "{{ app_grafana__version }}"

app_grafana__podman_home: "{{ app_grafana__home }}"

app_grafana__podman_data_dir: "{{ app_grafana__podman_home }}/data"
app_grafana__podman_log_dir: "{{ app_grafana__podman_home }}/log"

app_grafana__podman_container_default:
  name: "{{ app_grafana__podman_name }}"
  hostname: "{{ app_grafana__hostname }}"
  image: "{{ app_grafana__podman_image }}:{{ app_grafana__podman_tag }}"
  ip: "{{ app_grafana__ip }}"
  ipv6: "{{ app_grafana__ipv6 | default(omit) }}"
  network: "{{ app_grafana__network }}"
  timezone: "{{ app_grafana__timezone }}"
  # Set with grafana_environment and grafana_secrets, merged over the default
  environment: "{{ app_grafana__environment | combine(app_grafana__environment_secrets_files) }}"
  labels: "{{ app_grafana__labels | default(omit) }}"
  secrets: >-
    {{ (app_grafana__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ app_grafana__secrets_dir ~ '/\1') | list)
      if (app_grafana__secrets is sequence and app_grafana__secrets is not string and app_grafana__secrets | length > 0)
      else omit }}
  # grafana_container.volumes replaces the list completely
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_grafana__podman_data_dir }}:/var/lib/grafana"
    - "{{ app_grafana__podman_log_dir }}:/var/log/grafana"
