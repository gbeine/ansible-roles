---

#
# Substitutes - do not change
#

app_grafana__home: "{{ grafana_home | mandatory }}"

app_grafana__hostname: "{{ grafana_hostname | mandatory }}"
app_grafana__ip: "{{ grafana_ip | mandatory }}"
app_grafana__ipv6: "{{ grafana_ipv6 | default('') }}"
app_grafana__network: "{{ grafana_network | mandatory }}"
app_grafana__hosts: "{{ grafana_hosts | default({}) }}"
app_grafana__version: "{{ grafana_version | default('latest') }}"
app_grafana__timezone: "{{ grafana_timezone | default(bootstrap_timezone__timezone) }}"

app_grafana__container: "{{ app_grafana__container_default | combine(grafana_container | default({})) }}"

app_grafana__app_mode: "{{ grafana_app_mode | default('production') }}"
app_grafana__protocol: "{{ grafana_protocol | default('http') }}"
app_grafana__http_addr: "{{ grafana_http_addr | default(app_grafana__ip) }}"
app_grafana__http_port: "{{ grafana_http_port | default(3000) }}"
app_grafana__domain: "{{ grafana_domain | default('localhost') }}"
app_grafana__static_root_path: "{{ grafana_static_root_path | default('public') }}"

app_grafana__db_type: "{{ grafana_db_type | default('sqlite3') }}"
app_grafana__db_host: "{{ grafana_db_host | mandatory }}"
app_grafana__db_port: "{{ grafana_db_port | default(app_grafana__db_port_default) }}"
app_grafana__db_name: "{{ grafana_db_name | default('grafana') }}"
app_grafana__db_user: "{{ grafana_db_user | default('grafana') }}"
app_grafana__db_pass: "{{ grafana_db_password | mandatory }}"
app_grafana__db_path: "{{ grafana_db_path | mandatory }}"
app_grafana__base_url: "{{ grafana_base_url | mandatory }}"

app_grafana__auth_anonymous: "{{ grafana_auth_anonymous | default(false) }}"
app_grafana__auth_anonymous_org_name: "{{ grafana_auth_anonymous_org_name | mandatory }}"
app_grafana__auth_anonymous_org_role: "{{ grafana_auth_anonymous_org_role | default('Viewer') }}"

app_grafana__auth_basic: "{{ grafana_auth_basic | default(false) }}"

#
# Defaults - do not change
#

app_grafana__etc_dir: "{{ app_grafana__home }}/etc"
app_grafana__data_dir: "{{ app_grafana__home }}/data"

# Set to fix value in the docker image
app_grafana__uid: 472

app_grafana__name: 'grafana'
app_grafana__image: 'docker.io/grafana/grafana-oss'

# TODO: set to postgres default port if not mysql with template
app_grafana__db_port_default: 3306

app_grafana__volumes_default:
    - "/etc/localtime:/etc/localtime:ro"
    - "/etc/timezone:/etc/timezone:ro"
    - "{{ app_grafana__etc_dir }}:/etc/grafana"
    - "{{ app_grafana__data_dir }}:/var/lib/grafana"

app_grafana__container_default:
  name: "{{ app_grafana__name }}"
  hostname: "{{ app_grafana__hostname }}"
  image: "{{ app_grafana__image }}:{{ app_grafana__version }}"
  ip: "{{ app_grafana__ip }}"
  network: "{{ app_grafana__network }}"
  restart_policy: 'always'
  hosts: "{{ app_grafana__hosts }}"
  timezone: "{{ app_grafana__timezone }}"
  volumes: "{{ app_grafana__volumes_default }}"

