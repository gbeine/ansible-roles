---

#
# Substitutes - do not change
#

podman__default_network: "{{ podman_network | mandatory }}"
podman__default_environment: "{{ podman_environment | default({}) }}"

podman__networks: "{{ podman_networks | default([]) }}"

podman__containers: "{{ podman_containers | default([]) }}"

podman__socket_enabled: "{{ podman_socket_enabled | default(true) }}"

#
# Defaults - do not change
#

podman__packages: "{{ podman__packages_default[bootstrap_ansible__distribution] | default([]) }}"

podman__packages_default:
  Debian:
    - 'podman'
    - 'buildah'
    - 'tini'
    - 'dbus-user-session'
    - 'fuse-overlayfs'
    - 'golang-github-containernetworking-plugin-dnsname'
    - 'slirp4netns'
    - 'uidmap'
    - 'containers-storage'
    - 'iptables'
    - 'make'
    - 'aardvark-dns'
    - 'netavark'
  Raspbian:
    - 'podman'
    - 'buildah'
    - 'tini'
    - 'dbus-user-session'
    - 'fuse-overlayfs'
    - 'golang-github-containernetworking-plugin-dnsname'
    - 'slirp4netns'
    - 'uidmap'
    - 'containers-storage'
    - 'iptables'
    - 'make'
    - 'aardvark-dns'
    - 'netavark'
