---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    podman_networks:
      - "{{ database_mongo_express__test_network }}"
    podman_default_network: "{{ database_mongo_express__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    # verify logs in to the login form with curl, it keeps the cookies of the session in a file
    - name: 'Install curl'
      ansible.builtin.apt:
        name: 'curl'
        state: 'present'
        update_cache: true

    - name: 'Ensure /etc/timezone exists'
      ansible.builtin.copy:
        dest: '/etc/timezone'
        content: |
          Etc/UTC
        force: false
        mode: '0644'

    - name: 'Pull the images, so the first start of the services does not time out'
      containers.podman.podman_image:
        name: "{{ item }}"
      loop:
        - "{{ database_mongo_express__test_image }}"
        - "{{ database_mongo_express__test_database.image }}"
      register: 'database_mongo_express__test_pull'
      until: database_mongo_express__test_pull is succeeded
      retries: 3
      delay: 10

    - name: 'Start MongoDB'
      containers.podman.podman_container:
        name: "{{ database_mongo_express__test_database.name }}"
        image: "{{ database_mongo_express__test_database.image }}"
        network: "{{ database_mongo_express__test_network.name }}"
        ip: "{{ database_mongo_express__test_database.ip }}"
        env:
          MONGO_INITDB_ROOT_USERNAME: "{{ database_mongo_express__test_database.user }}"
          MONGO_INITDB_ROOT_PASSWORD: "{{ database_mongo_express__test_database.password }}"
          MONGO_INITDB_DATABASE: "{{ database_mongo_express__test_database.database }}"
        state: 'started'

    - name: 'Wait for MongoDB'
      ansible.builtin.command:
        argv: [ 'podman', 'exec', "{{ database_mongo_express__test_database.name }}",
                'mongosh', '--quiet', '-u', "{{ database_mongo_express__test_database.user }}",
                '-p', "{{ database_mongo_express__test_database.password }}", '--authenticationDatabase', 'admin',
                '--eval', "db.getSiblingDB('{{ database_mongo_express__test_database.database }}').molecule.updateOne({ _id: 1 }, { $set: { value: 42 } }, { upsert: true }).acknowledged" ]
      register: 'database_mongo_express__test_mongodb'
      until: database_mongo_express__test_mongodb.stdout | default('') == 'true'
      retries: 60
      delay: 2
      changed_when: false

    # The initialization runs MongoDB on localhost only, the network address answers after the restart
    - name: 'Wait for MongoDB on the network'
      ansible.builtin.wait_for:
        host: "{{ database_mongo_express__test_database.ip }}"
        port: 27017
        timeout: 120
