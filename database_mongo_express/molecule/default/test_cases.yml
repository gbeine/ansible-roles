---
# Network created by container_podman in prepare.yml
database_mongo_express__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

database_mongo_express__test_image: 'c0d3.sh/container/mongo-express:latest'
database_mongo_express__test_quadlet_path: '/etc/containers/systemd/mongo-express.container'

# The connection string set by the Dockerfile of the image, mongo-express prefers ME_CONFIG_MONGODB_URL_FILE
database_mongo_express__test_image_url: 'mongodb://mongo:27017'

# MongoDB started by prepare.yml, test credentials only
database_mongo_express__test_database:
  name: 'molecule-mongodb'
  image: 'docker.io/library/mongo:8.0'
  ip: '10.89.0.20'
  user: 'molecule-root'
  password: 'molecule-mongodb-password'
  database: 'molecule'
  url: 'mongodb://molecule-root:molecule-mongodb-password@10.89.0.20:27017/?authSource=admin'

# A valid change of the side effect, the quadlet unit changes and mongo-express has to restart
database_mongo_express__test_side_effect_environment:
  ME_CONFIG_DOCUMENTS_PER_PAGE: '25'

database_mongo_express__test_cases:

  # Only the mandatory variables, the login form is the default
  - name: 'molecule-mongo-express-default'
    role_vars:
      mongo_express_ip: '10.89.0.70'
      mongo_express_network: 'podman-molecule'
      mongo_express_hostname: 'mongo-express-default'
      mongo_express_timezone: 'Europe/Berlin'
      mongo_express_environment:
        ME_CONFIG_BASICAUTH_USERNAME: 'molecule-admin'
      mongo_express_secrets:
        - name: 'mongo_express_url'
          data: 'mongodb://molecule-root:molecule-mongodb-password@10.89.0.20:27017/?authSource=admin'
          target: 'ME_CONFIG_MONGODB_URL'
        - name: 'mongo_express_session'
          data: 'molecule-session-secret-default'
          target: 'ME_CONFIG_SITE_SESSIONSECRET'
        - name: 'mongo_express_password'
          data: 'molecule-admin-password'
          target: 'ME_CONFIG_BASICAUTH_PASSWORD'
    expect:
      ip: '10.89.0.70'
      ip6: ~
      strategy: 'form'
      base_url: '/'
      admin:
        name: 'molecule-admin'
        password: 'molecule-admin-password'
      quadlet:
        - 'Secret=mongo_express_url,type=mount,target=/run/secrets/mongo_express_url'
        - 'Secret=mongo_express_session,type=env,target=ME_CONFIG_SITE_SESSIONSECRET'
        - 'Secret=mongo_express_password,type=mount,target=/run/secrets/mongo_express_password'
      env:
        - 'TZ=Europe/Berlin'
        - 'ME_CONFIG_AUTH_STRATEGY=form'
        - 'ME_CONFIG_BASICAUTH_ENABLED=false'
        - 'ME_CONFIG_OIDCAUTH_ENABLED=false'
        - 'ME_CONFIG_BASICAUTH_USERNAME=molecule-admin'
        - 'ME_CONFIG_MONGODB_URL_FILE=/run/secrets/mongo_express_url'
        - 'ME_CONFIG_BASICAUTH_PASSWORD_FILE=/run/secrets/mongo_express_password'

  # IPv6, labels, basic authentication below /mongo/, a boolean and the secrets of the cookies and the sessions in the environment
  - name: 'molecule-mongo-express'
    role_vars:
      mongo_express_ip: '10.89.0.71'
      mongo_express_ipv6: 'fd00:89::71'
      mongo_express_network: 'podman-molecule'
      mongo_express_hostname: 'mongo-express-molecule'
      mongo_express_timezone: 'Europe/Berlin'
      mongo_express_labels:
        traefik.enable: 'true'
      mongo_express_environment:
        ME_CONFIG_AUTH_STRATEGY: 'basic'
        ME_CONFIG_BASICAUTH_USERNAME: 'molecule-admin'
        ME_CONFIG_SITE_BASEURL: '/mongo/'
        ME_CONFIG_OPTIONS_READONLY: true
      mongo_express_secrets:
        - name: 'mongo_express_url'
          data: 'mongodb://molecule-root:molecule-mongodb-password@10.89.0.20:27017/?authSource=admin'
          target: 'ME_CONFIG_MONGODB_URL'
        - name: 'mongo_express_session'
          data: 'molecule-session-secret'
          target: 'ME_CONFIG_SITE_SESSIONSECRET'
        - name: 'mongo_express_cookie'
          data: 'molecule-cookie-secret'
          target: 'ME_CONFIG_SITE_COOKIESECRET'
        - name: 'mongo_express_password'
          data: 'molecule-admin-password'
          target: 'ME_CONFIG_BASICAUTH_PASSWORD'
    side_effect: true
    expect:
      ip: '10.89.0.71'
      ip6: 'fd00:89::71'
      strategy: 'basic'
      base_url: '/mongo/'
      admin:
        name: 'molecule-admin'
        password: 'molecule-admin-password'
      quadlet:
        - 'Secret=mongo_express_url,type=mount,target=/run/secrets/mongo_express_url'
        - 'Secret=mongo_express_session,type=env,target=ME_CONFIG_SITE_SESSIONSECRET'
        - 'Secret=mongo_express_cookie,type=env,target=ME_CONFIG_SITE_COOKIESECRET'
        - 'Secret=mongo_express_password,type=mount,target=/run/secrets/mongo_express_password'
        - 'Label=traefik.enable=true'
      env:
        - 'TZ=Europe/Berlin'
        - 'ME_CONFIG_AUTH_STRATEGY=basic'
        - 'ME_CONFIG_BASICAUTH_ENABLED=true'
        - 'ME_CONFIG_OIDCAUTH_ENABLED=false'
        - 'ME_CONFIG_BASICAUTH_USERNAME=molecule-admin'
        - 'ME_CONFIG_SITE_BASEURL=/mongo/'
        - 'ME_CONFIG_OPTIONS_READONLY=true'
        - 'ME_CONFIG_MONGODB_URL_FILE=/run/secrets/mongo_express_url'
        - 'ME_CONFIG_BASICAUTH_PASSWORD_FILE=/run/secrets/mongo_express_password'
        - 'ME_CONFIG_DOCUMENTS_PER_PAGE=25'
