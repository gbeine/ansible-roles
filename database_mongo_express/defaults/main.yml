---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/database-mongo-express
#

database_mongo_express__ip: "{{ mongo_express_ip | mandatory }}"
database_mongo_express__ipv6: "{{ mongo_express_ipv6 }}"
database_mongo_express__network: "{{ mongo_express_network | mandatory }}"
database_mongo_express__hostname: "{{ mongo_express_hostname | mandatory }}"
database_mongo_express__timezone: "{{ mongo_express_timezone | mandatory }}"
database_mongo_express__labels: "{{ mongo_express_labels }}"

database_mongo_express__version: "{{ mongo_express_version | default('latest') }}"

database_mongo_express__container: "{{ database_mongo_express__podman_container_default | combine(mongo_express_container | default({})) }}"

# The configuration of mongo-express, see config.default.js of mongo-express
database_mongo_express__environment: "{{ database_mongo_express__environment_default | combine(mongo_express_environment | default({})) }}"

# Secrets with name, data and target, the secrets of mongo-express without file variable are passed in the environment,
# the others are mounted below /run/secrets and the role sets the file variable of the target
database_mongo_express__secrets: "{{ mongo_express_secrets | default([]) }}"

database_mongo_express__autoupdate_enabled: "{{ mongo_express_autoupdate_enabled | default(false) }}"
database_mongo_express__autoupdate_schedule: "{{ mongo_express_autoupdate_schedule }}"

#
# Defaults - do not change
#

database_mongo_express__environment_default:
  TZ: "{{ database_mongo_express__timezone }}"
  ME_CONFIG_AUTH_STRATEGY: 'form'

database_mongo_express__environment_required: []

# The ways to log in to mongo-express, there is no way without login
database_mongo_express__auth_strategies: [ 'basic', 'form', 'oidc' ]
database_mongo_express__auth_strategy: "{{ database_mongo_express__environment.ME_CONFIG_AUTH_STRATEGY | default('') | string }}"

# The variables and secrets each way to log in needs
database_mongo_express__auth_environment_required:
  basic: [ 'ME_CONFIG_BASICAUTH_USERNAME' ]
  form: [ 'ME_CONFIG_BASICAUTH_USERNAME' ]
  oidc: [ 'ME_CONFIG_OIDCAUTH_ISSUER', 'ME_CONFIG_OIDCAUTH_CLIENTID' ]
database_mongo_express__auth_secrets_required:
  basic: [ 'ME_CONFIG_BASICAUTH_PASSWORD' ]
  form: [ 'ME_CONFIG_BASICAUTH_PASSWORD' ]
  oidc: [ 'ME_CONFIG_OIDCAUTH_SECRET' ]

# Set by the role from ME_CONFIG_AUTH_STRATEGY, the router of mongo-express only applies basic authentication and OIDC
# if these flags are true, the strategy alone does not protect mongo-express
database_mongo_express__environment_role:
  ME_CONFIG_BASICAUTH_ENABLED: "{{ (database_mongo_express__auth_strategy == 'basic') | string | lower }}"
  ME_CONFIG_OIDCAUTH_ENABLED: "{{ (database_mongo_express__auth_strategy == 'oidc') | string | lower }}"

# mongo-express reads these values with getBoolean, true or false
database_mongo_express__environment_booleans:
  - 'ME_CONFIG_MONGODB_ENABLE_ADMIN'
  - 'ME_CONFIG_MONGODB_ALLOW_DISK_USE'
  - 'ME_CONFIG_MONGODB_TLS'
  - 'ME_CONFIG_MONGODB_TLS_ALLOW_CERTS'
  - 'ME_CONFIG_MONGODB_AWS_DOCUMENTDB'
  - 'ME_CONFIG_SITE_SSL_ENABLED'
  - 'ME_CONFIG_SITE_GRIDFS_ENABLED'
  - 'ME_CONFIG_OPTIONS_READONLY'
  - 'ME_CONFIG_OPTIONS_PERSIST_EDIT_MODE'
  - 'ME_CONFIG_OPTIONS_COLLAPSIBLE_JSON'
  - 'ME_CONFIG_OPTIONS_CONFIRM_DELETE'
  - 'ME_CONFIG_OPTIONS_NO_EXPORT'
  - 'ME_CONFIG_OPTIONS_FULLWIDTH_LAYOUT'
  - 'ME_CONFIG_OPTIONS_NO_DELETE'
  - 'ME_CONFIG_OPTIONS_NO_RAW_COMMAND'
  - 'ME_CONFIG_BASICAUTH_ENABLED'

# The targets of the secrets, they must not be set in mongo_express_environment
database_mongo_express__secret_variables: "{{ database_mongo_express__secret_files.keys() | list + database_mongo_express__secrets_env }}"

# The secrets mounted as files, mongo-express reads the variable target from the file variable
# (getFileEnv in config.default.js of mongo-express 1.1.0-rc-4)
database_mongo_express__secret_files:
  ME_CONFIG_MONGODB_URL: 'ME_CONFIG_MONGODB_URL_FILE'
  ME_CONFIG_BASICAUTH_PASSWORD: 'ME_CONFIG_BASICAUTH_PASSWORD_FILE'
  ME_CONFIG_OIDCAUTH_CLIENTSECRET: 'ME_CONFIG_OIDCAUTH_CLIENTSECRET_FILE'
  ME_CONFIG_OIDCAUTH_SECRET: 'ME_CONFIG_OIDCAUTH_SECRET_FILE'

# The secrets passed in the environment, mongo-express has no file variable for them
database_mongo_express__secrets_env:
  - 'ME_CONFIG_SITE_SESSIONSECRET'
  - 'ME_CONFIG_SITE_COOKIESECRET'
  - 'ME_CONFIG_MONGODB_TLS_CERT_KEY_FILE_PASSWORD'

# The connection string contains the password of MongoDB, express-session needs the secret of the sessions
database_mongo_express__secrets_required: [ 'ME_CONFIG_MONGODB_URL', 'ME_CONFIG_SITE_SESSIONSECRET' ]

database_mongo_express__secrets_dir: '/run/secrets'

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
database_mongo_express__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if database_mongo_express__secrets is sequence and database_mongo_express__secrets is not string and database_mongo_express__secrets is not mapping -%}
  {%-   for secret in database_mongo_express__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in database_mongo_express__secret_files -%}
  {%-     set _ = environment.update({ database_mongo_express__secret_files[secret.target]: database_mongo_express__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# The environment of the container, booleans in lower case
database_mongo_express__environment_container: >-
  {%- set environment = {} -%}
  {%- for key, value in (database_mongo_express__environment | combine(database_mongo_express__environment_role)).items() -%}
  {%-   set _ = environment.update({ key: (value | string | lower) if value is boolean else value }) -%}
  {%- endfor -%}
  {{ environment | combine(database_mongo_express__environment_secrets_files) }}

# The variables of mongo-express, the variables set by the role and the file variables of the secrets.
# Generated from config.default.js, app.js and Dockerfile of mongo-express 1.1.0-rc-4 without the secrets,
# NODE_ENV (test disables the CSRF protection), VCAP_SERVICES and the deprecated ME_CONFIG_BASICAUTH,
# update with new versions of the image
database_mongo_express__environment_allowed:
  - 'ME_CONFIG_AUTH_STRATEGY'
  - 'ME_CONFIG_BASICAUTH_USERNAME'
  - 'ME_CONFIG_DOCUMENTS_PER_PAGE'
  - 'ME_CONFIG_HEALTH_CHECK_PATH'
  - 'ME_CONFIG_MONGODB_ALLOW_DISK_USE'
  - 'ME_CONFIG_MONGODB_AWS_DOCUMENTDB'
  - 'ME_CONFIG_MONGODB_ENABLE_ADMIN'
  - 'ME_CONFIG_MONGODB_TLS'
  - 'ME_CONFIG_MONGODB_TLS_ALLOW_CERTS'
  - 'ME_CONFIG_MONGODB_TLS_CA_FILE'
  - 'ME_CONFIG_MONGODB_TLS_CERT_KEY_FILE'
  - 'ME_CONFIG_MONGODB_TLS_CRL_FILE'
  - 'ME_CONFIG_OIDCAUTH_BASEURL'
  - 'ME_CONFIG_OIDCAUTH_CLIENTID'
  - 'ME_CONFIG_OIDCAUTH_ISSUER'
  - 'ME_CONFIG_OPTIONS_COLLAPSIBLE_JSON'
  - 'ME_CONFIG_OPTIONS_CONFIRM_DELETE'
  - 'ME_CONFIG_OPTIONS_FULLWIDTH_LAYOUT'
  - 'ME_CONFIG_OPTIONS_NO_DELETE'
  - 'ME_CONFIG_OPTIONS_NO_EXPORT'
  - 'ME_CONFIG_OPTIONS_NO_RAW_COMMAND'
  - 'ME_CONFIG_OPTIONS_PERSIST_EDIT_MODE'
  - 'ME_CONFIG_OPTIONS_READONLY'
  - 'ME_CONFIG_REQUEST_SIZE'
  - 'ME_CONFIG_SITE_BASEURL'
  - 'ME_CONFIG_SITE_GRIDFS_ENABLED'
  - 'ME_CONFIG_SITE_SSL_CRT_PATH'
  - 'ME_CONFIG_SITE_SSL_ENABLED'
  - 'ME_CONFIG_SITE_SSL_KEY_PATH'
  - 'PORT'
  - 'VCAP_APP_HOST'
  - 'TZ'
  # Set by the role from ME_CONFIG_AUTH_STRATEGY
  - 'ME_CONFIG_BASICAUTH_ENABLED'
  - 'ME_CONFIG_OIDCAUTH_ENABLED'
  # The file variables of the secrets, set by the role
  - 'ME_CONFIG_MONGODB_URL_FILE'
  - 'ME_CONFIG_BASICAUTH_PASSWORD_FILE'
  - 'ME_CONFIG_OIDCAUTH_CLIENTSECRET_FILE'
  - 'ME_CONFIG_OIDCAUTH_SECRET_FILE'

database_mongo_express__podman_name: 'mongo-express'
database_mongo_express__podman_image: 'c0d3.sh/container/mongo-express'
database_mongo_express__podman_tag: "{{ database_mongo_express__version }}"

database_mongo_express__podman_container_default:
  name: "{{ database_mongo_express__podman_name }}"
  hostname: "{{ database_mongo_express__hostname }}"
  image: "{{ database_mongo_express__podman_image }}:{{ database_mongo_express__podman_tag }}"
  ip: "{{ database_mongo_express__ip }}"
  ipv6: "{{ database_mongo_express__ipv6 | default(omit) }}"
  network: "{{ database_mongo_express__network }}"
  timezone: "{{ database_mongo_express__timezone }}"
  # Set with mongo_express_environment and mongo_express_secrets, merged over the default
  environment: "{{ database_mongo_express__environment_container }}"
  labels: "{{ database_mongo_express__labels | default(omit) }}"
  # The secrets of database_mongo_express__secrets_env are passed in the environment, the others are mounted
  secrets: >-
    {{ database_mongo_express__podman_secrets
       if (database_mongo_express__secrets is sequence and database_mongo_express__secrets is not string and database_mongo_express__secrets | length > 0)
       else omit }}

# The podman secrets of mongo_express_secrets, entries without name or target are left out, the validation of the secrets reports them
database_mongo_express__podman_secrets: >-
  {%- set secrets = [] -%}
  {%- for secret in database_mongo_express__secrets if secret is mapping and secret.name is defined and secret.target is defined -%}
  {%-   if secret.target in database_mongo_express__secrets_env -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=env,target=' ~ secret.target) -%}
  {%-   else -%}
  {%-     set _ = secrets.append(secret.name ~ ',type=mount,target=' ~ database_mongo_express__secrets_dir ~ '/' ~ secret.name) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ secrets }}
