---

monitoring_icinga_agent__user: 'nagios'
monitoring_icinga_agent__group: 'nagios'

monitoring_icinga_agent__etc_dir: '/etc/icinga2'
monitoring_icinga_agent__data_dir: '/var/lib/icinga2'
monitoring_icinga_agent__log_dir: '/var/log/icinga2'
monitoring_icinga_agent__local_etc_dir: '/usr/local/etc/icinga2'
monitoring_icinga_agent__local_plugins_dir: '/usr/local/lib/nagios/plugins'

monitoring_icinga_agent__systemd_override_dir: '/etc/systemd/system/icinga2.service.d'

monitoring_icinga_agent__packages:
  - 'icinga2'
  - 'icinga2-bin'
  - 'icinga2-common'
  - 'monitoring-plugins'
  - 'monitoring-plugins-basic'
  - 'monitoring-plugins-common'
  - 'monitoring-plugins-standard'
  - 'monitoring-plugins-contrib'
