---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-icinga-agent
#

monitoring_icinga_agent__node_name: "{{ icinga_node_name | mandatory }}"

monitoring_icinga_agent__parent_name: "{{ icinga_parent_name | mandatory }}"
monitoring_icinga_agent__parent_port: "{{ icinga_parent_port | default(5665) }}"
monitoring_icinga_agent__ticket_salt: "{{ icinga_ticket_salt | mandatory }}"
monitoring_icinga_agent__zone_name: "{{ icinga_zone_name | mandatory }}"

monitoring_icinga_agent__api_accept_config: "{{ icinga_api_accept_config | default(false) }}"
monitoring_icinga_agent__api_accept_commands: "{{ icinga_api_accept_commands | default(false) }}"
monitoring_icinga_agent__api_bind_host: "{{ icinga_api_bind_host | default('0.0.0.0') }}"
monitoring_icinga_agent__api_bind_port: "{{ icinga_api_bind_port | default(5666) }}"

monitoring_icinga_agent__main_log_severity: "{{ icinga_main_log_severity | default('information') }}"
monitoring_icinga_agent__main_log_file: "{{ icinga_main_log_file | default(monitoring_icinga_agent__log_dir + '/icinga2.log') }}"

monitoring_icinga_agent__cert_dir: "{{ monitoring_icinga_agent__data_dir }}/certs"
monitoring_icinga_agent__cert_source_dir: "{{ icinga_cert_source_dir | default('') }}"
