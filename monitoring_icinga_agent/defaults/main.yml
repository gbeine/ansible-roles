---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-icinga-agent
#

monitoring_icinga_agent__node_name: "{{ icinga_node_name | default('') }}"
monitoring_icinga_agent__zone_name: "{{ icinga_zone_name | default('') }}"
monitoring_icinga_agent__ticket_salt: "{{ icinga_ticket_salt | default('') }}"

monitoring_icinga_agent__parent_name: "{{ icinga_parent_name | default('') }}"
monitoring_icinga_agent__parent_host: "{{ icinga_parent_host | default('') }}"
monitoring_icinga_agent__parent_port: "{{ icinga_parent_port | default(5665) }}"

monitoring_icinga_agent__api_accept_config: "{{ icinga_api_accept_config | default(false) }}"
monitoring_icinga_agent__api_accept_commands: "{{ icinga_api_accept_commands | default(false) }}"
monitoring_icinga_agent__api_bind_host: "{{ icinga_api_bind_host | default('0.0.0.0') }}"
monitoring_icinga_agent__api_bind_port: "{{ icinga_api_bind_port | default(5665) }}"

monitoring_icinga_agent__main_log_severity: "{{ icinga_main_log_severity | default('information') }}"
monitoring_icinga_agent__main_log_file: "{{ icinga_main_log_file | default(monitoring_icinga_agent__log_dir + '/icinga2.log') }}"

# The directory of the local plugins (PluginLocalDir), e.g. installed by monitoring_plugins
monitoring_icinga_agent__plugin_local_dir: "{{ icinga_plugin_local_dir | default('/usr/local/lib/nagios/plugins') }}"
# The directory of the contrib plugins (PluginContribDir), monitoring-plugins-contrib of Debian
monitoring_icinga_agent__plugin_contrib_dir: "{{ icinga_plugin_contrib_dir | default('/usr/lib/nagios/plugins') }}"

monitoring_icinga_agent__cert_dir: "{{ monitoring_icinga_agent__data_dir }}/certs"
monitoring_icinga_agent__cert_source_dir: "{{ icinga_cert_source_dir | default('') }}"
monitoring_icinga_agent__cert_source_ca_file: >-
  {{ icinga_cert_ca_file | default(monitoring_icinga_agent__cert_source_dir + '/' + monitoring_icinga_agent__node_name + '/chain.pem') }}
monitoring_icinga_agent__cert_source_cert_file: >-
  {{ icinga_cert_cert_file | default(monitoring_icinga_agent__cert_source_dir + '/' + monitoring_icinga_agent__node_name + '/fullchain.pem') }}
monitoring_icinga_agent__cert_source_key_file: >-
  {{ icinga_cert_key_file | default(monitoring_icinga_agent__cert_source_dir + '/' + monitoring_icinga_agent__node_name + '/privkey.pem') }}

# The timer of pki_update restarts Icinga 2 after a renewal of the certificate
monitoring_icinga_agent__pki_update_enabled: "{{ icinga_pki_update_enabled | default(true) }}"
monitoring_icinga_agent__pki_update_schedule: "{{ icinga_pki_update_schedule | default('*-*-* 00/4:00:00') }}"

# Dependencies of icinga2.service, written to [Unit] of the systemd override: requires, wants, after, part_of and binds_to are units,
# requires_mounts_for are paths, e.g. { 'after': [ 'network-online.target' ], 'wants': [ 'network-online.target' ] }
monitoring_icinga_agent__systemd_unit: "{{ icinga_systemd_unit | default({}) }}"

#
# Defaults - do not change
#

# The dependencies of icinga_systemd_unit and their directives in [Unit]
monitoring_icinga_agent__systemd_unit_directives:
  requires: 'Requires'
  wants: 'Wants'
  after: 'After'
  part_of: 'PartOf'
  binds_to: 'BindsTo'
  requires_mounts_for: 'RequiresMountsFor'
