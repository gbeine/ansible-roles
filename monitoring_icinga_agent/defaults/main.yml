---

#
# Substitutes - do not change
#

monitoring_icinga_agent__node_name: "{{ icinga_node_name | mandatory }}"
monitoring_icinga_agent__certificate_realm: "{{ icinga_certificate_realm | default(monitoring_icinga_agent__node_name) }}"

#
# Defaults - do not change
#

monitoring_icinga_agent__user: 'nagios'
monitoring_icinga_agent__group: 'nagios'

monitoring_icinga_agent__etc_dir: '/etc'

monitoring_icinga_agent__var_dir: '/var'
monitoring_icinga_agent__cert_dir: "{{ monitoring_icinga_agent__var_dir }}/lib/icinga2/certs"

monitoring_icinga_agent__packages: "{{ monitoring_icinga_agent__packages_default[bootstrap_ansible__distribution] | default([]) }}"

monitoring_icinga_agent__packages_default:
  Debian:
    - 'icinga2'
    - 'icinga2-bin'
    - 'icinga2-common'
    - 'monitoring-plugins'
    - 'monitoring-plugins-basic'
    - 'monitoring-plugins-common'
    - 'monitoring-plugins-standard'
    - 'monitoring-plugins-contrib'
    - 'libnet-snmp-perl'
  Raspbian:
    - 'icinga2'
    - 'icinga2-bin'
    - 'icinga2-common'
    - 'monitoring-plugins'
    - 'monitoring-plugins-basic'
    - 'monitoring-plugins-common'
    - 'monitoring-plugins-standard'
    - 'libnet-snmp-perl'
