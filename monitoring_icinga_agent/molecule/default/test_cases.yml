---
monitoring_icinga_agent__test_cert_source_dir: '/etc/molecule-certs'
monitoring_icinga_agent__test_ca_dir: '/etc/molecule-ca'

monitoring_icinga_agent__test_side_effect_severity: 'warning'

monitoring_icinga_agent__test_cases:

  # The mandatory values only, Icinga 2 is not installed before, check stops after the installation
  - name: 'molecule-icinga-agent-default'
    prepare:
      icinga2: false
    role_vars:
      icinga_node_name: 'molecule-icinga-agent-default'
      icinga_zone_name: 'molecule-icinga-agent-zone'
      icinga_parent_name: 'molecule-icinga-master'
      icinga_ticket_salt: 'molecule-ticket-salt'
      icinga_cert_source_dir: '/etc/molecule-certs'
    expect:
      parent_host: ''
      schedule: '*-*-* 00/4:00:00'
      plugin_local_dir: '/usr/local/lib/nagios/plugins'
      plugin_contrib_dir: '/usr/lib/nagios/plugins'

  # Icinga 2 installed with the defaults of the package (feature notification enabled, service running),
  # the agent connects to the parent and an own schedule of pki_update
  - name: 'molecule-icinga-agent'
    prepare:
      icinga2: true
    role_vars:
      icinga_node_name: 'molecule-icinga-agent'
      icinga_zone_name: 'molecule-icinga-agent-zone'
      icinga_parent_name: 'molecule-icinga-master'
      icinga_parent_host: 'master.molecule.test'
      icinga_ticket_salt: 'molecule-ticket-salt'
      icinga_cert_source_dir: '/etc/molecule-certs'
      icinga_pki_update_schedule: '*-*-* 00/6:00:00'
      icinga_plugin_local_dir: '/opt/molecule-plugins'
    expect:
      parent_host: 'master.molecule.test'
      schedule: '*-*-* 00/6:00:00'
      plugin_local_dir: '/opt/molecule-plugins'
      plugin_contrib_dir: '/usr/lib/nagios/plugins'
