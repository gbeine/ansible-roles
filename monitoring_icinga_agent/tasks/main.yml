---

- name: 'Install and configure Icinga 2 agent'
  tags: [ 'monitoring_icinga_agent' ]
  block:

    - name: 'Include OS-specific variables'
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"

    - name: 'Install packages'
      ansible.builtin.apt:
        update_cache: yes
        install_recommends: no
        pkg: "{{ monitoring_icinga_agent__packages }}"

    - name: 'Create directories'
      ansible.builtin.file:
        dest: "{{ item.name }}"
        owner: "{{ item.owner | default(monitoring_icinga_agent__user) }}"
        group: "{{ item.group | default(monitoring_icinga_agent__group) }}"
        mode: "{{ item.mode | default('0750') }}"
        state: 'directory'
      with_items:
        - name: "{{ monitoring_icinga_agent__local_etc_dir }}"
          mode: '0755'
        - name: "{{ monitoring_icinga_agent__local_plugins_dir }}"
          owner: 'root'
          group: 'root'
          mode: '0755'
        - name: "{{ monitoring_icinga_agent__cert_dir }}"

    - name: 'Configuration'
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ monitoring_icinga_agent__user }}"
        group: "{{ monitoring_icinga_agent__group }}"
        mode: '0400'
      with_items:
        - src: 'constants.conf.j2'
          dest: "{{ monitoring_icinga_agent__etc_dir }}/constants.conf"
        - src: 'icinga2.conf.j2'
          dest: "{{ monitoring_icinga_agent__etc_dir }}/icinga2.conf"
        - src: 'zones.conf.j2'
          dest: "{{ monitoring_icinga_agent__etc_dir }}/zones.conf"
        - src: 'features-api.conf.j2'
          dest: "{{ monitoring_icinga_agent__etc_dir }}/features-available/api.conf"
        - src: 'features-checker.conf.j2'
          dest: "{{ monitoring_icinga_agent__etc_dir }}/features-available/checker.conf"
        - src: 'features-mainlog.conf.j2'
          dest: "{{ monitoring_icinga_agent__etc_dir }}/features-available/mainlog.conf"
      notify:
        - 'Restart Icinga'

    - name: 'Disable features'
      ansible.builtin.file:
        path: "{{ monitoring_icinga_agent__etc_dir }}/features-enabled/{{ item }}"
        state: 'absent'
      with_items:
        - 'command.conf'
        - 'compatlog.conf'
        - 'debuglog.conf'
        - 'elasticsearch.conf'
        - 'gelf.conf'
        - 'graphite.conf'
        - 'icingadb.conf'
        - 'influxdb.conf'
        - 'influxdb2.conf'
        - 'journald.conf'
        - 'livestatus.conf'
        - 'notification.conf'
        - 'opentsdb.conf'
        - 'perfdata.conf'
        - 'syslog.conf'
      notify:
        - 'Restart Icinga'

    - name: 'Enable features'
      ansible.builtin.file:
        path: "{{ monitoring_icinga_agent__etc_dir }}/features-enabled/{{ item }}"
        src: "../features-available/{{ item }}"
        state: 'link'
      with_items:
        - 'api.conf'
        - 'checker.conf'
        - 'mainlog.conf'
      notify:
        - 'Restart Icinga'

    - name: 'Create systemd service override directory'
      ansible.builtin.file:
        path: "{{ monitoring_icinga_agent__systemd_override_dir }}"
        state: 'directory'
      when: 'monitoring_icinga_agent__cert_source_dir | length > 0'

    - name: 'Modify systemd service to copy certificates'
      ansible.builtin.template:
        src: 'override.conf.j2'
        dest: "{{ monitoring_icinga_agent__systemd_override_dir }}/override.conf"
      when: 'monitoring_icinga_agent__cert_source_dir | length > 0'
      notify:
        - 'Restart Icinga'
