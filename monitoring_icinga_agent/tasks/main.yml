---

- name: 'Install and configure Icinga 2 agent'
  tags: [ 'monitoring', 'monitoring_icinga_agent' ]
  block:

    - name: 'Include OS-specific variables'
      ansible.builtin.include_vars: "{{ item }}"
      loop: "{{ query('ansible.builtin.first_found', monitoring_icinga_agent__os_vars) }}"
      vars:
        monitoring_icinga_agent__os_vars:
          - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
          - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"

    - name: 'Validate settings'
      ansible.builtin.assert:
        that:
          - monitoring_icinga_agent__missing | length == 0
          - monitoring_icinga_agent__api_bind_port | string is match('^[0-9]+$')
          - monitoring_icinga_agent__parent_port | string is match('^[0-9]+$')
          - monitoring_icinga_agent__pki_update_enabled is boolean
        fail_msg: >-
          The Icinga 2 agent needs icinga_node_name, icinga_zone_name, icinga_parent_name, icinga_ticket_salt and icinga_cert_source_dir,
          missing: {{ monitoring_icinga_agent__missing | join(', ') | default('none', true) }}.
          icinga_api_bind_port and icinga_parent_port must be numbers, icinga_pki_update_enabled must be a boolean.
        quiet: true
      vars:
        monitoring_icinga_agent__missing: >-
          {{ {'icinga_node_name': monitoring_icinga_agent__node_name,
              'icinga_zone_name': monitoring_icinga_agent__zone_name,
              'icinga_parent_name': monitoring_icinga_agent__parent_name,
              'icinga_ticket_salt': monitoring_icinga_agent__ticket_salt,
              'icinga_cert_source_dir': monitoring_icinga_agent__cert_source_dir}
             | dict2items | selectattr('value', 'eq', '') | map(attribute='key') | list }}

    # certbot issues the certificates only in a real run, in check mode missing certificates are only reported
    - name: 'Find the certificates'
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ monitoring_icinga_agent__cert_source_ca_file }}"
        - "{{ monitoring_icinga_agent__cert_source_cert_file }}"
        - "{{ monitoring_icinga_agent__cert_source_key_file }}"
      register: 'monitoring_icinga_agent__cert_stat'

    - name: 'Validate the certificates'
      ansible.builtin.assert:
        that:
          - ansible_check_mode or monitoring_icinga_agent__cert_missing | length == 0
        fail_msg: "These certificates do not exist on the host, certbot has to issue them first: {{ monitoring_icinga_agent__cert_missing | join(', ') }}."
        quiet: true
      vars:
        monitoring_icinga_agent__cert_missing: "{{ monitoring_icinga_agent__cert_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

    - name: 'Report the missing certificates in check mode'
      ansible.builtin.debug:
        msg: "These certificates do not exist on the host, certbot has to issue them first: {{ monitoring_icinga_agent__cert_missing | join(', ') }}."
      when:
        - ansible_check_mode
        - monitoring_icinga_agent__cert_missing | length > 0
      vars:
        monitoring_icinga_agent__cert_missing: "{{ monitoring_icinga_agent__cert_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

    - name: 'Install packages'
      ansible.builtin.apt:
        pkg: "{{ monitoring_icinga_agent__packages }}"
        install_recommends: false
        cache_valid_time: 3600

    # In check mode the packages of a first installation are missing, there is no user nagios and no configuration to compare.
    # ansible_check_mode is only set by --check, the configuration directory shows the installation in every check mode.
    - name: 'Find the configuration directory of Icinga 2'
      ansible.builtin.stat:
        path: "{{ monitoring_icinga_agent__etc_dir }}"
      register: 'monitoring_icinga_agent__etc_stat'
      check_mode: false

    - name: 'Configure Icinga 2'
      ansible.builtin.include_tasks: 'configure.yml'
      when: monitoring_icinga_agent__etc_stat.stat.isdir | default(false)
