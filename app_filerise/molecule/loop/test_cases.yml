---
# Network created by container_podman in prepare.yml
app_filerise__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_filerise__test_image: 'docker.io/error311/filerise-docker:latest'

app_filerise__test_quadlet_absent: [ 'Environment=TZ=', 'Volume=/etc/localtime', 'Volume=/etc/timezone' ]

# The administrator created by the setup in verify.yml, test password only
app_filerise__test_admin:
  user: 'admin'
  password: 'Molecule-Admin-Password-1'

# Instances deployed with tasks/loop.yml, test keys only
filerise_instances:

  - home: '/opt/filerise-team'
    hostname: 'filerise-team'
    ip: '10.89.0.21'
    network: 'podman-molecule'
    timezone: 'Europe/Berlin'
    container:
      name: 'filerise-team'
    secrets:
      - name: 'filerise_team_tokens_key'
        data: 'molecule-team-tokens-key-0123456789abcdef'
        target: 'PERSISTENT_TOKENS_KEY'

  - home: '/opt/filerise-family'
    hostname: 'filerise-family'
    ip: '10.89.0.22'
    ipv6: 'fd00:89::22'
    network: 'podman-molecule'
    timezone: 'Europe/Berlin'
    container:
      name: 'filerise-family'
    environment:
      PUID: '1034'
      PGID: '1034'
    secrets:
      - name: 'filerise_family_tokens_key'
        data: 'molecule-family-tokens-key-0123456789abcdef'
        target: 'PERSISTENT_TOKENS_KEY'
      - name: 'filerise_family_license'
        data: 'molecule-family-license'
        target: 'FR_PRO_LICENSE'

app_filerise__test_expect:

  - name: 'filerise-team'
    ip: '10.89.0.21'
    ip6: ~
    home: '/opt/filerise-team'
    uid: 99
    gid: 100
    quadlet:
      - 'Volume=/opt/filerise-team/uploads:/var/www/uploads'
      - 'Secret=filerise_team_tokens_key,type=env,target=PERSISTENT_TOKENS_KEY'
    quadlet_absent: "{{ app_filerise__test_quadlet_absent }}"
    env:
      - 'TIMEZONE=Europe/Berlin'
      - 'PUID=99'
      - 'PGID=100'
    secret_files: []
    secret_env:
      - name: 'PERSISTENT_TOKENS_KEY'
        value: 'molecule-team-tokens-key-0123456789abcdef'
    urls:
      - 'http://10.89.0.21'

  - name: 'filerise-family'
    ip: '10.89.0.22'
    ip6: 'fd00:89::22'
    home: '/opt/filerise-family'
    uid: 1034
    gid: 1034
    quadlet:
      - 'Volume=/opt/filerise-family/uploads:/var/www/uploads'
      - 'Secret=filerise_family_tokens_key,type=env,target=PERSISTENT_TOKENS_KEY'
      - 'Secret=filerise_family_license,type=mount,target=/run/secrets/filerise_family_license,uid=1034,gid=1034,mode=0400'
    quadlet_absent: "{{ app_filerise__test_quadlet_absent }}"
    env:
      - 'TIMEZONE=Europe/Berlin'
      - 'PUID=1034'
      - 'PGID=1034'
      - 'FR_PRO_LICENSE_FILE=/run/secrets/filerise_family_license'
    secret_files:
      - path: '/run/secrets/filerise_family_license'
        content: 'molecule-family-license'
    secret_env:
      - name: 'PERSISTENT_TOKENS_KEY'
        value: 'molecule-family-tokens-key-0123456789abcdef'
    urls:
      - 'http://10.89.0.22'
      - 'http://[fd00:89::22]'
