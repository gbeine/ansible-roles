---

- name: 'Loop over FileRise instances'
  tags: [ 'app', 'app_filerise' ]
  ansible.builtin.include_role:
    name: 'app_filerise'
  loop: "{{ filerise_instances }}"
  loop_control:
    loop_var: 'filerise'
    label: "{{ filerise.hostname }}"
  vars:
    filerise_home: "{{ filerise.home }}"
    filerise_ip: "{{ filerise.ip }}"
    filerise_ipv6: "{{ filerise.ipv6 }}"
    filerise_network: "{{ filerise.network }}"
    filerise_hostname: "{{ filerise.hostname }}"
    filerise_timezone: "{{ filerise.timezone }}"
    filerise_labels: "{{ filerise.labels }}"
    filerise_version: "{{ filerise.version }}"
    filerise_container: "{{ filerise.container }}"
    filerise_environment: "{{ filerise.environment }}"
    filerise_secrets: "{{ filerise.secrets }}"
    filerise_autoupdate_enabled: "{{ filerise.autoupdate_enabled }}"
    filerise_autoupdate_schedule: "{{ filerise.autoupdate_schedule }}"
