---

#
# Substitutes - do not change
#

app_filerise__network: "{{ filerise_network | mandatory }}"
app_filerise__version: "{{ filerise_version | default('latest') }}"

app_filerise__environment: "{{ filerise_environment | default(app_filerise__environment_default) }}"
app_filerise__secure: "{{ filerise_secure | default(false) }}"
app_filerise__timezone: "{{ filerise_timezone | default(bootstrap_timezone__timezone) }}"
app_filerise__upload_size: "{{ filerise_upload_size | default('5G') }}"

app_filerise__containers: "{{ filerise_containers | default([]) }}"

#
# Defaults - do not change
#

app_filerise__environment_default:
  TIMEZONE: "{{ app_filerise__timezone }}"
  TOTAL_UPLOAD_SIZE: "{{ app_filerise__upload_size }}"
  SECURE: "{{ app_filerise__secure | ternary('true', 'false') }}"

app_filerise__container_default:
  image: "docker.io/error311/filerise-docker:{{ app_filerise__version }}"
  network: "{{ app_filerise__network }}"
  restart_policy: 'always'
  environment: "{{ app_filerise__environment }}"
  timezone: "{{ app_filerise__timezone }}"
