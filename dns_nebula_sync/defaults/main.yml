---

#
# Substitutes - do not change
#

dns_nebula_sync__hostname: "{{ nebula_sync_hostname | mandatory }}"
dns_nebula_sync__ip: "{{ nebula_sync_ip | mandatory }}"
dns_nebula_sync__ipv6: "{{ nebula_sync_ipv6 }}"
dns_nebula_sync__network: "{{ nebula_sync_network | mandatory }}"
dns_nebula_sync__timezone: "{{ nebula_sync_timezone | mandatory }}"
dns_nebula_sync__version: "{{ nebula_sync_version | default('latest') }}"

dns_nebula_sync__primary: "{{ nebula_sync_primary | mandatory }}"
dns_nebula_sync__replicas: "{{ nebula_sync_replicas | mandatory }}"

dns_nebula_sync__full_sync: "{{ nebula_sync_full_sync | default('false') }}"
dns_nebula_sync__run_gravity: "{{ nebula_sync_run_gravity | default('true') }}"
dns_nebula_sync__cron: "{{ nebula_sync_cron | default('0 */6 * * *') }}"

dns_nebula_sync__skip_tls_verification: "{{ nebula_sync_skip_tls_verification | default('false') }}"
dns_nebula_sync__retry_delay_seconds: "{{ nebula_sync_retry_delay_seconds | default('1') }}"
dns_nebula_sync__timeout_seconds: "{{ nebula_sync_timeout_seconds | default('20') }}"

# Granular sync control - Config tables (apply when FULL_SYNC=false)
dns_nebula_sync__sync_config_dns: "{{ nebula_sync_sync_config_dns | default('false') }}"
dns_nebula_sync__sync_config_dhcp: "{{ nebula_sync_sync_config_dhcp | default('false') }}"
dns_nebula_sync__sync_config_ntp: "{{ nebula_sync_sync_config_ntp | default('false') }}"
dns_nebula_sync__sync_config_resolver: "{{ nebula_sync_sync_config_resolver | default('false') }}"
dns_nebula_sync__sync_config_database: "{{ nebula_sync_sync_config_database | default('false') }}"
dns_nebula_sync__sync_config_misc: "{{ nebula_sync_sync_config_misc | default('false') }}"
dns_nebula_sync__sync_config_debug: "{{ nebula_sync_sync_config_debug | default('false') }}"

# Config filter variables (mutually exclusive pairs - only include if set)
dns_nebula_sync__sync_config_dns_include: "{{ nebula_sync_sync_config_dns_include | default('') }}"
dns_nebula_sync__sync_config_dns_exclude: "{{ nebula_sync_sync_config_dns_exclude | default('') }}"
dns_nebula_sync__sync_config_dhcp_include: "{{ nebula_sync_sync_config_dhcp_include | default('') }}"
dns_nebula_sync__sync_config_dhcp_exclude: "{{ nebula_sync_sync_config_dhcp_exclude | default('') }}"
dns_nebula_sync__sync_config_ntp_include: "{{ nebula_sync_sync_config_ntp_include | default('') }}"
dns_nebula_sync__sync_config_ntp_exclude: "{{ nebula_sync_sync_config_ntp_exclude | default('') }}"
dns_nebula_sync__sync_config_resolver_include: "{{ nebula_sync_sync_config_resolver_include | default('') }}"
dns_nebula_sync__sync_config_resolver_exclude: "{{ nebula_sync_sync_config_resolver_exclude | default('') }}"
dns_nebula_sync__sync_config_database_include: "{{ nebula_sync_sync_config_database_include | default('') }}"
dns_nebula_sync__sync_config_database_exclude: "{{ nebula_sync_sync_config_database_exclude | default('') }}"
dns_nebula_sync__sync_config_misc_include: "{{ nebula_sync_sync_config_misc_include | default('') }}"
dns_nebula_sync__sync_config_misc_exclude: "{{ nebula_sync_sync_config_misc_exclude | default('') }}"
dns_nebula_sync__sync_config_debug_include: "{{ nebula_sync_sync_config_debug_include | default('') }}"
dns_nebula_sync__sync_config_debug_exclude: "{{ nebula_sync_sync_config_debug_exclude | default('') }}"

# Granular sync control - Gravity tables (apply when FULL_SYNC=false)
dns_nebula_sync__sync_gravity_dhcp_leases: "{{ nebula_sync_sync_gravity_dhcp_leases | default('false') }}"
dns_nebula_sync__sync_gravity_group: "{{ nebula_sync_sync_gravity_group | default('false') }}"
dns_nebula_sync__sync_gravity_ad_list: "{{ nebula_sync_sync_gravity_ad_list | default('false') }}"
dns_nebula_sync__sync_gravity_ad_list_by_group: "{{ nebula_sync_sync_gravity_ad_list_by_group | default('false') }}"
dns_nebula_sync__sync_gravity_domain_list: "{{ nebula_sync_sync_gravity_domain_list | default('false') }}"
dns_nebula_sync__sync_gravity_domain_list_by_group: "{{ nebula_sync_sync_gravity_domain_list_by_group | default('false') }}"
dns_nebula_sync__sync_gravity_client: "{{ nebula_sync_sync_gravity_client | default('false') }}"
dns_nebula_sync__sync_gravity_client_by_group: "{{ nebula_sync_sync_gravity_client_by_group | default('false') }}"

dns_nebula_sync__webhook_sync_success_url: "{{ nebula_sync_webhook_sync_success_url | default('') }}"
dns_nebula_sync__webhook_sync_failure_url: "{{ nebula_sync_webhook_sync_failure_url | default('') }}"

dns_nebula_sync__container: "{{ dns_nebula_sync__container_default | combine(nebula_sync_container | default({})) }}"

# Base environment variables - always included
dns_nebula_sync__base_environment:
  PRIMARY: "{{ dns_nebula_sync__primary }}"
  REPLICAS: "{{ dns_nebula_sync__replicas }}"
  FULL_SYNC: "{{ dns_nebula_sync__full_sync }}"
  RUN_GRAVITY: "{{ dns_nebula_sync__run_gravity }}"
  CRON: "{{ dns_nebula_sync__cron }}"
  TZ: "{{ dns_nebula_sync__timezone }}"
  CLIENT_SKIP_TLS_VERIFICATION: "{{ dns_nebula_sync__skip_tls_verification }}"
  CLIENT_RETRY_DELAY_SECONDS: "{{ dns_nebula_sync__retry_delay_seconds }}"
  CLIENT_TIMEOUT_SECONDS: "{{ dns_nebula_sync__timeout_seconds }}"
  # Granular sync control - Config tables
  SYNC_CONFIG_DNS: "{{ dns_nebula_sync__sync_config_dns }}"
  SYNC_CONFIG_DHCP: "{{ dns_nebula_sync__sync_config_dhcp }}"
  SYNC_CONFIG_NTP: "{{ dns_nebula_sync__sync_config_ntp }}"
  SYNC_CONFIG_RESOLVER: "{{ dns_nebula_sync__sync_config_resolver }}"
  SYNC_CONFIG_DATABASE: "{{ dns_nebula_sync__sync_config_database }}"
  SYNC_CONFIG_MISC: "{{ dns_nebula_sync__sync_config_misc }}"
  SYNC_CONFIG_DEBUG: "{{ dns_nebula_sync__sync_config_debug }}"
  # Granular sync control - Gravity tables
  SYNC_GRAVITY_DHCP_LEASES: "{{ dns_nebula_sync__sync_gravity_dhcp_leases }}"
  SYNC_GRAVITY_GROUP: "{{ dns_nebula_sync__sync_gravity_group }}"
  SYNC_GRAVITY_AD_LIST: "{{ dns_nebula_sync__sync_gravity_ad_list }}"
  SYNC_GRAVITY_AD_LIST_BY_GROUP: "{{ dns_nebula_sync__sync_gravity_ad_list_by_group }}"
  SYNC_GRAVITY_DOMAIN_LIST: "{{ dns_nebula_sync__sync_gravity_domain_list }}"
  SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP: "{{ dns_nebula_sync__sync_gravity_domain_list_by_group }}"
  SYNC_GRAVITY_CLIENT: "{{ dns_nebula_sync__sync_gravity_client }}"
  SYNC_GRAVITY_CLIENT_BY_GROUP: "{{ dns_nebula_sync__sync_gravity_client_by_group }}"

# Optional environment variables - only include if they have non-empty values
dns_nebula_sync__optional_environment:
  SYNC_CONFIG_DNS_INCLUDE: "{{ dns_nebula_sync__sync_config_dns_include }}"
  SYNC_CONFIG_DNS_EXCLUDE: "{{ dns_nebula_sync__sync_config_dns_exclude }}"
  SYNC_CONFIG_DHCP_INCLUDE: "{{ dns_nebula_sync__sync_config_dhcp_include }}"
  SYNC_CONFIG_DHCP_EXCLUDE: "{{ dns_nebula_sync__sync_config_dhcp_exclude }}"
  SYNC_CONFIG_NTP_INCLUDE: "{{ dns_nebula_sync__sync_config_ntp_include }}"
  SYNC_CONFIG_NTP_EXCLUDE: "{{ dns_nebula_sync__sync_config_ntp_exclude }}"
  SYNC_CONFIG_RESOLVER_INCLUDE: "{{ dns_nebula_sync__sync_config_resolver_include }}"
  SYNC_CONFIG_RESOLVER_EXCLUDE: "{{ dns_nebula_sync__sync_config_resolver_exclude }}"
  SYNC_CONFIG_DATABASE_INCLUDE: "{{ dns_nebula_sync__sync_config_database_include }}"
  SYNC_CONFIG_DATABASE_EXCLUDE: "{{ dns_nebula_sync__sync_config_database_exclude }}"
  SYNC_CONFIG_MISC_INCLUDE: "{{ dns_nebula_sync__sync_config_misc_include }}"
  SYNC_CONFIG_MISC_EXCLUDE: "{{ dns_nebula_sync__sync_config_misc_exclude }}"
  SYNC_CONFIG_DEBUG_INCLUDE: "{{ dns_nebula_sync__sync_config_debug_include }}"
  SYNC_CONFIG_DEBUG_EXCLUDE: "{{ dns_nebula_sync__sync_config_debug_exclude }}"

# Filter to only include optional vars with non-empty values
dns_nebula_sync__filtered_optional_environment: >-
  {{
    dns_nebula_sync__optional_environment
    | dict2items
    | selectattr('value', 'ne', '')
    | items2dict
  }}

# Merge base and optional environments
dns_nebula_sync__merged_environment: >-
  {{
    dns_nebula_sync__base_environment
    | combine(dns_nebula_sync__filtered_optional_environment)
  }}

#
# Defaults - do not change
#

dns_nebula_sync__podman_name: 'nebula-sync'
dns_nebula_sync__podman_image: 'ghcr.io/lovelaze/nebula-sync'
dns_nebula_sync__podman_tag: "{{ dns_nebula_sync__version }}"

dns_nebula_sync__container_default:
  name: "{{ dns_nebula_sync__podman_name }}"
  hostname: "{{ dns_nebula_sync__hostname }}"
  image: "{{ dns_nebula_sync__podman_image }}:{{ dns_nebula_sync__podman_tag }}"
  ip: "{{ dns_nebula_sync__ip }}"
  ipv6: "{{ dns_nebula_sync__ipv6 | default(omit) }}"
  network: "{{ dns_nebula_sync__network }}"
  timezone: "{{ dns_nebula_sync__timezone }}"
  environment: "{{ dns_nebula_sync__merged_environment }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
