---

- name: 'Install nebula-sync'
  tags: [ 'dns', 'dns_nebula_sync' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or nebula_sync_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - dns_nebula_sync__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - dns_nebula_sync__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ dns_nebula_sync__invalid | join('. ') }}"
        quiet: true
      vars:
        dns_nebula_sync__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = dns_nebula_sync__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('nebula_sync_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('nebula_sync_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of nebula_sync_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - dns_nebula_sync__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ dns_nebula_sync__errors | join(' ') }}"
        quiet: true
      vars:
        dns_nebula_sync__secret_targets: "{{ dns_nebula_sync__secrets | map(attribute='target') | list }}"
        dns_nebula_sync__environment_missing: >-
          {{ dns_nebula_sync__environment_required
             | reject('in', dns_nebula_sync__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        dns_nebula_sync__secrets_missing: >-
          {{ dns_nebula_sync__secrets_required | reject('in', dns_nebula_sync__secret_targets) | list }}
        dns_nebula_sync__secrets_in_environment: >-
          {{ (dns_nebula_sync__secret_targets + dns_nebula_sync__secret_variables + dns_nebula_sync__secret_files.values() | list)
             | select('in', dns_nebula_sync__environment.keys() | list) | unique | list }}
        dns_nebula_sync__errors: >-
          {%- set errors = [] -%}
          {%- if dns_nebula_sync__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('nebula-sync needs the environment variables ' ~ (dns_nebula_sync__environment_required | join(', ')) ~ ', missing or empty: ' ~ (dns_nebula_sync__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if dns_nebula_sync__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('nebula-sync needs the secrets ' ~ (dns_nebula_sync__secrets_required | join(', ')) ~ ', missing: ' ~ (dns_nebula_sync__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if dns_nebula_sync__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets and their file variables must not be set in nebula_sync_environment: ' ~ (dns_nebula_sync__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging nebula_sync_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - dns_nebula_sync__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ dns_nebula_sync__errors | join(' ') }}"
        quiet: true
      vars:
        dns_nebula_sync__environment_unknown: >-
          {{ (dns_nebula_sync__container.environment | default({})).keys()
             | reject('in', dns_nebula_sync__environment_allowed) | list }}
        dns_nebula_sync__secrets_unknown: >-
          {{ dns_nebula_sync__secrets | map(attribute='target') | reject('in', dns_nebula_sync__secret_files.keys() | list) | list }}
        dns_nebula_sync__errors: >-
          {%- set errors = [] -%}
          {%- if dns_nebula_sync__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (dns_nebula_sync__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if dns_nebula_sync__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (dns_nebula_sync__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the variables of the image (dns_nebula_sync__environment_allowed) and the secrets ' ~ (dns_nebula_sync__secret_files.keys() | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ dns_nebula_sync__secrets }}"
      register: 'dns_nebula_sync__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ dns_nebula_sync__container.name }}"
        hostname: "{{ dns_nebula_sync__container.hostname }}"
        image: "{{ dns_nebula_sync__container.image }}"
        ip: "{{ dns_nebula_sync__container.ip }}"
        ip6: "{{ dns_nebula_sync__container.ipv6 | default(omit) }}"
        network: "{{ dns_nebula_sync__container.network }}"
        timezone: "{{ dns_nebula_sync__container.timezone }}"
        env: "{{ dns_nebula_sync__container.environment | default(omit) }}"
        etc_hosts: "{{ dns_nebula_sync__container.etc_hosts | default(omit) }}"
        expose: "{{ dns_nebula_sync__container.expose | default(omit) }}"
        label: "{{ dns_nebula_sync__container.labels | default(omit) }}"
        publish: "{{ dns_nebula_sync__container.publish | default(omit) }}"
        secrets: "{{ dns_nebula_sync__container.secrets | default(omit) }}"
        volume: "{{ dns_nebula_sync__container.volumes | default(omit) }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target

          [Service]
          {% if dns_nebula_sync__container.exec_start_pre is defined %}
          {% for command in dns_nebula_sync__container.exec_start_pre %}
          ExecStartPre={{ command }}
          {% endfor %}
          {% endif %}
          RestartSec=5
          Restart=always

          [Unit]
          {% if dns_nebula_sync__container.requires is defined %}
          Requires={{ dns_nebula_sync__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'dns_nebula_sync__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ dns_nebula_sync__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if dns_nebula_sync__restart | bool else 'started' }}"
        enabled: true
      vars:
        dns_nebula_sync__running: >-
          {{ (ansible_facts.services[dns_nebula_sync__container.name + '.service'].state | default('')) == 'running' }}
        dns_nebula_sync__restart: >-
          {{ dns_nebula_sync__running | bool
             and (dns_nebula_sync__secrets_result is changed or dns_nebula_sync__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'dns_nebula_sync__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ dns_nebula_sync__container.name }}"
        container_image: "{{ dns_nebula_sync__container.image }}"
        container_schedule: "{{ dns_nebula_sync__autoupdate_schedule }}"
