---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  tasks:

    - name: 'Read the start time of the service before the change'
      ansible.builtin.command: 'systemctl show --property=ActiveEnterTimestampMonotonic --value nebula-sync'
      register: 'dns_nebula_sync__test_started_before'
      changed_when: false

    - name: 'Set the role variables with changed environment'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: >-
        {{ dns_nebula_sync__test_vars
           | combine({'nebula_sync_environment': dns_nebula_sync__test_vars.nebula_sync_environment | combine(dns_nebula_sync__test_side_effect_environment)})
           | dict2items }}
      loop_control:
        label: "{{ item.key }}"

    - name: 'Run dns_nebula_sync with changed environment'
      ansible.builtin.include_role:
        name: 'dns_nebula_sync'

    - name: 'Read the start time of the service after the change'
      ansible.builtin.command: 'systemctl show --property=ActiveEnterTimestampMonotonic --value nebula-sync'
      register: 'dns_nebula_sync__test_started_after'
      changed_when: false

    - name: 'Assert the quadlet changed and the service was restarted'
      ansible.builtin.assert:
        that:
          - dns_nebula_sync__quadlet_result is changed
          - dns_nebula_sync__test_started_after.stdout | int > dns_nebula_sync__test_started_before.stdout | int
        fail_msg: "before {{ dns_nebula_sync__test_started_before.stdout }}, after {{ dns_nebula_sync__test_started_after.stdout }}"
