---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  pre_tasks:

    - name: 'Set the role variables of the test'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ dns_nebula_sync__test_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  tasks:

    - name: 'Run dns_nebula_sync'
      ansible.builtin.include_role:
        name: 'dns_nebula_sync'
