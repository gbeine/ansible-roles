---
# Network created by container_podman in prepare.yml
dns_nebula_sync__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

dns_nebula_sync__test_image: 'ghcr.io/lovelaze/nebula-sync:latest'
dns_nebula_sync__test_pihole_image: 'docker.io/pihole/pihole:latest'
dns_nebula_sync__test_pihole_password: 'molecule-pihole-password'

# Pi-hole instances started in prepare.yml.
# Settings set by environment are read-only in Pi-hole, so only the primary sets the upstreams.
dns_nebula_sync__test_piholes:
  - name: 'molecule-pihole-primary'
    ip: '10.89.0.20'
    environment:
      FTLCONF_dns_upstreams: '9.9.9.9'
  - name: 'molecule-pihole-replica'
    ip: '10.89.0.21'
    environment: {}

# Upstreams expected on the replica after the synchronization
dns_nebula_sync__test_expected_upstreams: [ '9.9.9.9' ]

dns_nebula_sync__test_vars:
  nebula_sync_ip: '10.89.0.10'
  nebula_sync_network: 'podman-molecule'
  nebula_sync_hostname: 'nebula-sync-molecule'
  nebula_sync_timezone: 'Europe/Berlin'
  nebula_sync_environment:
    FULL_SYNC: 'false'
    RUN_GRAVITY: 'false'
    SYNC_CONFIG_DNS: 'true'
    SYNC_CONFIG_DNS_INCLUDE: 'upstreams'
  nebula_sync_secrets:
    - name: 'nebula_sync_primary'
      data: 'http://10.89.0.20|molecule-pihole-password'
      target: 'PRIMARY'
    - name: 'nebula_sync_replicas'
      data: 'http://10.89.0.21|molecule-pihole-password'
      target: 'REPLICAS'

# Environment changed in side_effect.yml, the running service must be restarted
dns_nebula_sync__test_side_effect_environment:
  CLIENT_TIMEOUT_SECONDS: '30'
