---
# Runs dns_nebula_sync with the invalid role variables passed as include parameters,
# the role has to fail before the quadlet unit changes.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run dns_nebula_sync with invalid variables (expect ERROR): {{ dns_nebula_sync__test_invalid.message }}"
  block:

    - name: 'Run dns_nebula_sync, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'dns_nebula_sync'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ dns_nebula_sync__test_invalid.message }}"

  rescue:

    - name: 'Read the checksum of the quadlet unit after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ dns_nebula_sync__test_checked_files }}"
      register: 'dns_nebula_sync__test_md5_after'

    - name: 'Assert the run failed before the quadlet unit changed'
      ansible.builtin.assert:
        that:
          - dns_nebula_sync__test_failure is search(dns_nebula_sync__test_invalid.search, multiline=true)
          - dns_nebula_sync__test_before | select('equalto', '') | list | length == 0
          - dns_nebula_sync__test_after == dns_nebula_sync__test_before
        fail_msg: >-
          Failure: {{ dns_nebula_sync__test_failure }}
          Checksums before: {{ dns_nebula_sync__test_before | join(', ') }},
          after: {{ dns_nebula_sync__test_after | join(', ') }}.
      vars:
        # Double quotes, so \n is a line break for the anchors of the searches
        dns_nebula_sync__test_failure: "{{ [ ansible_failed_result.msg | default(''), ansible_failed_result.stderr | default('') ] | join('\n') }}"
        dns_nebula_sync__test_before: "{{ dns_nebula_sync__test_md5_before.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
        dns_nebula_sync__test_after: "{{ dns_nebula_sync__test_md5_after.results | map(attribute='stat') | map(attribute='checksum', default='') | list }}"
