---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_thanos_sidecar__test_case: "{{ monitoring_thanos_sidecar__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_thanos_sidecar__test_files:
      - "{{ monitoring_thanos_sidecar__test_quadlet_path }}"
      - "{{ monitoring_thanos_sidecar__test_home }}/bucket.yml"
    # The object storage of molecule-thanos-sidecar, the invalid runs of the secrets need an object storage on every VM
    monitoring_thanos_sidecar__test_objstore: "{{ (monitoring_thanos_sidecar__test_cases | selectattr('name', 'eq', 'molecule-thanos-sidecar') | first).role_vars.thanos_sidecar_objstore }}"
    monitoring_thanos_sidecar__test_secrets: "{{ monitoring_thanos_sidecar__test_case.role_vars.thanos_sidecar_secrets | default([]) }}"

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_thanos_sidecar__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksums of the quadlet unit and bucket.yml before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ monitoring_thanos_sidecar__test_files }}"
      register: 'monitoring_thanos_sidecar__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include
    - name: 'Run monitoring_thanos_sidecar with thanos_sidecar_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_container: [ 'volumes' ]
        monitoring_thanos_sidecar__test_invalid:
          message: 'thanos_sidecar_container is not a dictionary'
          # combine of the defaults fails before the role checks anything
          search: 'failed to combine variables, expected dicts'

    - name: 'Run monitoring_thanos_sidecar with an object storage not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_secrets: []
        thanos_sidecar_objstore: 'FILESYSTEM'
        monitoring_thanos_sidecar__test_invalid:
          message: 'an object storage not a dictionary'
          search: '^`thanos_sidecar_objstore` has to be a dictionary\.$'

    - name: 'Run monitoring_thanos_sidecar with an unknown type and an unknown key of the object storage (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_objstore: "{{ monitoring_thanos_sidecar__test_objstore | combine({ 'type': 'MEMORY', 'bucket': 'thanos' }) }}"
        thanos_sidecar_home: "{{ monitoring_thanos_sidecar__test_home }}"
        monitoring_thanos_sidecar__test_invalid:
          message: 'an unknown type and an unknown key of the object storage'
          search: '^Unknown keys in `thanos_sidecar_objstore`: bucket, allowed are type, config, prefix\. `thanos_sidecar_objstore\.type` has to be one of FILESYSTEM, '

    - name: 'Run monitoring_thanos_sidecar with a secret key in the object storage (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_secrets: []
        thanos_sidecar_objstore: "{{ monitoring_thanos_sidecar__test_objstore | combine({ 'config': { 'secret_key': 'molecule' } }, recursive=true) }}"
        thanos_sidecar_home: "{{ monitoring_thanos_sidecar__test_home }}"
        monitoring_thanos_sidecar__test_invalid:
          message: 'a secret key in the object storage'
          search: '^These fields carry secrets, they are set with `thanos_sidecar_secrets`, not in `thanos_sidecar_objstore`: secret_key\.$'

    - name: 'Run monitoring_thanos_sidecar with a secret without target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_secrets: [ { 'name': 'thanos_sidecar_molecule', 'data': 'molecule' } ]
        monitoring_thanos_sidecar__test_invalid:
          message: 'a secret without target'
          search: '^`thanos_sidecar_secrets` entries need name, data and target$'

    - name: 'Run monitoring_thanos_sidecar with an unknown target (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_objstore: "{{ monitoring_thanos_sidecar__test_objstore }}"
        thanos_sidecar_home: "{{ monitoring_thanos_sidecar__test_home }}"
        thanos_sidecar_secrets: [ { 'name': 'thanos_sidecar_molecule', 'data': 'molecule', 'target': 'config.bucket' } ]
        monitoring_thanos_sidecar__test_invalid:
          message: 'an unknown target'
          search: '^Unknown secrets: config\.bucket, the targets are paths of options of `thanos_sidecar_objstore` ending in '

    - name: 'Run monitoring_thanos_sidecar with a target set in the object storage (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_objstore: "{{ monitoring_thanos_sidecar__test_objstore | combine({ 'config': { 'password': '' } }, recursive=true) }}"
        thanos_sidecar_home: "{{ monitoring_thanos_sidecar__test_home }}"
        thanos_sidecar_secrets: [ { 'name': 'thanos_sidecar_molecule', 'data': 'molecule', 'target': 'config.password' } ]
        monitoring_thanos_sidecar__test_invalid:
          message: 'a target set in the object storage'
          search: '^The targets of `thanos_sidecar_secrets` must not be set in `thanos_sidecar_objstore`: config\.password\.$'

    - name: 'Run monitoring_thanos_sidecar with a quote in a secret (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_objstore: "{{ monitoring_thanos_sidecar__test_objstore }}"
        thanos_sidecar_home: "{{ monitoring_thanos_sidecar__test_home }}"
        thanos_sidecar_secrets: [ { 'name': 'thanos_sidecar_molecule', 'data': 'molecule"secret', 'target': 'config.secret_key' } ]
        monitoring_thanos_sidecar__test_invalid:
          message: 'a quote in a secret'
          search: 'Secrets are strings that are not empty and without line breaks, " and .: thanos_sidecar_molecule\.$'

    - name: 'Run monitoring_thanos_sidecar with secrets without object storage (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_objstore: {}
        thanos_sidecar_secrets: [ { 'name': 'thanos_sidecar_molecule', 'data': 'molecule', 'target': 'config.secret_key' } ]
        monitoring_thanos_sidecar__test_invalid:
          message: 'secrets without object storage'
          search: '^The secrets of `thanos_sidecar_secrets` are options of `thanos_sidecar_objstore`, it is not set\.$'

    - name: 'Run monitoring_thanos_sidecar with an object storage without home (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_home: 'opt/thanos-sidecar'
        thanos_sidecar_objstore: "{{ monitoring_thanos_sidecar__test_objstore }}"
        monitoring_thanos_sidecar__test_invalid:
          message: 'an object storage without home'
          search: '^`thanos_sidecar_home` is needed for bucket\.yml of `thanos_sidecar_objstore`, it is an absolute path\.$'

    - name: 'Run monitoring_thanos_sidecar with thanos_sidecar_environment not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_environment: [ 'TZ' ]
        monitoring_thanos_sidecar__test_invalid:
          message: 'thanos_sidecar_environment is not a dictionary'
          search: '^`thanos_sidecar_environment` has to be a dictionary\.$'

    - name: 'Run monitoring_thanos_sidecar with a line break in the environment of the container (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_container:
          environment:
            TZ: "Europe/Berlin\nUTC"
        monitoring_thanos_sidecar__test_invalid:
          message: 'a line break in the environment of the container'
          search: '^The environment variables must not contain line breaks: TZ\.$'

    - name: 'Run monitoring_thanos_sidecar with an unknown environment variable (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_sidecar_environment:
          AWS_SECRET_ACCESS_KEY: 'molecule'
        monitoring_thanos_sidecar__test_invalid:
          message: 'an unknown environment variable'
          search: '^Unknown environment variables: AWS_SECRET_ACCESS_KEY, Thanos only reads TZ, the secrets are set with `thanos_sidecar_secrets`\.$'

    - name: 'Run monitoring_thanos_sidecar with the changed role variables'
      when: monitoring_thanos_sidecar__test_case.side_effect is defined
      block:

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'thanos-sidecar' ]
          register: 'monitoring_thanos_sidecar__test_started_before'
          changed_when: false

        - name: 'Set the changed role variables'
          ansible.builtin.set_fact:
            "{{ item.key }}": "{{ item.value }}"
          loop: "{{ monitoring_thanos_sidecar__test_case.side_effect.role_vars | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: 'Run monitoring_thanos_sidecar with the changed role variables'
          ansible.builtin.include_role:
            name: 'monitoring_thanos_sidecar'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'thanos-sidecar' ]
          register: 'monitoring_thanos_sidecar__test_started_after'
          changed_when: false

        - name: 'Assert the changed bucket.yml and the restart of the service'
          ansible.builtin.assert:
            that:
              - monitoring_thanos_sidecar__objstore_result is changed
              - monitoring_thanos_sidecar__secrets_result is not changed
              - monitoring_thanos_sidecar__quadlet_result is not changed
              - monitoring_thanos_sidecar__test_started_after.stdout | int > monitoring_thanos_sidecar__test_started_before.stdout | int
            fail_msg: >-
              bucket.yml changed: {{ monitoring_thanos_sidecar__objstore_result is changed }},
              secrets changed: {{ monitoring_thanos_sidecar__secrets_result is changed }},
              quadlet changed: {{ monitoring_thanos_sidecar__quadlet_result is changed }},
              start before {{ monitoring_thanos_sidecar__test_started_before.stdout }}, after {{ monitoring_thanos_sidecar__test_started_after.stdout }}

    - name: 'Run the role again without a change'
      when: monitoring_thanos_sidecar__test_case.side_effect is not defined
      block:

        - name: 'Read the start time of the service before the run without a change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'thanos-sidecar' ]
          register: 'monitoring_thanos_sidecar__test_unchanged_before'
          changed_when: false

        - name: 'Run monitoring_thanos_sidecar without a change'
          ansible.builtin.include_role:
            name: 'monitoring_thanos_sidecar'

        - name: 'Read the start time of the service after the run without a change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'thanos-sidecar' ]
          register: 'monitoring_thanos_sidecar__test_unchanged_after'
          changed_when: false

        - name: 'Assert no restart and no change'
          ansible.builtin.assert:
            that:
              - monitoring_thanos_sidecar__objstore_result is not changed
              - monitoring_thanos_sidecar__secrets_result is not changed
              - monitoring_thanos_sidecar__quadlet_result is not changed
              - monitoring_thanos_sidecar__test_unchanged_after.stdout == monitoring_thanos_sidecar__test_unchanged_before.stdout
            fail_msg: >-
              bucket.yml changed: {{ monitoring_thanos_sidecar__objstore_result is changed }},
              secrets changed: {{ monitoring_thanos_sidecar__secrets_result is changed }},
              quadlet changed: {{ monitoring_thanos_sidecar__quadlet_result is changed }},
              start before {{ monitoring_thanos_sidecar__test_unchanged_before.stdout }}, after {{ monitoring_thanos_sidecar__test_unchanged_after.stdout }}
