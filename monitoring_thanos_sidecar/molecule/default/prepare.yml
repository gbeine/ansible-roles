---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_thanos_sidecar__test_case: "{{ monitoring_thanos_sidecar__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    podman_networks:
      - "{{ monitoring_thanos_sidecar__test_network }}"
    podman_default_network: "{{ monitoring_thanos_sidecar__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'common_globals'
    - role: 'container_podman'

  tasks:

    - name: 'Pull the images, so the first start of the services does not time out'
      containers.podman.podman_image:
        name: "{{ item }}"
      loop:
        - "{{ monitoring_thanos_sidecar__test_prometheus_image }}"
        - "{{ monitoring_thanos_sidecar__test_image }}"
        - "{{ monitoring_thanos_sidecar__test_s3_image }}"
      register: 'monitoring_thanos_sidecar__test_pull'
      until: monitoring_thanos_sidecar__test_pull is succeeded
      retries: 5
      delay: 30

    # rclone serves every directory of /data as bucket
    - name: 'Create the bucket thanos of the S3 server'
      ansible.builtin.file:
        path: "{{ monitoring_thanos_sidecar__test_s3_dir }}/thanos"
        mode: '0755'
        state: 'directory'

    # The S3 server of the object storage S3 of molecule-thanos-sidecar, the secret key is the secret of the test case
    - name: 'Start the S3 server'
      containers.podman.podman_container:
        name: 'molecule-s3'
        image: "{{ monitoring_thanos_sidecar__test_s3_image }}"
        network: "{{ monitoring_thanos_sidecar__test_network.name }}"
        ip: "{{ monitoring_thanos_sidecar__test_s3_ip }}"
        volume:
          - "{{ monitoring_thanos_sidecar__test_s3_dir }}:/data"
        command:
          - 'serve'
          - 's3'
          - '/data'
          - '--addr'
          - ':9000'
          - '--auth-key'
          - "{{ monitoring_thanos_sidecar__test_s3_access_key }},{{ monitoring_thanos_sidecar__test_s3_secret_key }}"
        state: 'started'

    - name: 'Set the role variables of Prometheus'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_thanos_sidecar__test_case.prometheus_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Run monitoring_prometheus'
      ansible.builtin.include_role:
        name: 'monitoring_prometheus'
