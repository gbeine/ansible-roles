---
# Network created by container_podman in prepare.yml
monitoring_thanos_sidecar__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

monitoring_thanos_sidecar__test_image: 'docker.io/thanosio/thanos:v0.42.5'
monitoring_thanos_sidecar__test_prometheus_image: 'docker.io/prom/prometheus:latest'
monitoring_thanos_sidecar__test_bucket_dir: '/opt/thanos-bucket'

monitoring_thanos_sidecar__test_cases:

  # Only the mandatory variables, the sidecar serves the StoreAPI without object storage
  - name: 'molecule-thanos-sidecar-default'
    # Prometheus started in prepare.yml with monitoring_prometheus,
    # external labels and equal block durations are required by the sidecar
    prometheus_vars:
      prometheus_home: '/opt/prometheus-molecule'
      prometheus_ip: '10.89.0.50'
      prometheus_network: 'podman-molecule'
      prometheus_hostname: 'prometheus-default'
      prometheus_timezone: 'Europe/Berlin'
      prometheus_config:
        global:
          scrape_interval: '5s'
          external_labels:
            cluster: 'molecule'
            replica: 'default'
      prometheus_container:
        command:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--storage.tsdb.min-block-duration=2h'
          - '--storage.tsdb.max-block-duration=2h'
    role_vars:
      thanos_sidecar_version: 'v0.42.5'
      thanos_sidecar_ip: '10.89.0.51'
      thanos_sidecar_network: 'podman-molecule'
      thanos_sidecar_hostname: 'thanos-sidecar-default'
      thanos_sidecar_timezone: 'Europe/Berlin'
      thanos_sidecar_prometheus_url: 'http://10.89.0.50:9090'
      thanos_sidecar_prometheus_data: '/opt/prometheus-molecule/data'
    expect:
      ip: '10.89.0.51'
      ip6: ~
      objstore: false
      quadlet:
        - 'Volume=/opt/prometheus-molecule/data:/prometheus'

  # IPv6, labels and the upload to a bucket in the file system, the volume of the bucket is added with thanos_sidecar_container
  - name: 'molecule-thanos-sidecar'
    prometheus_vars:
      prometheus_home: '/opt/prometheus-molecule'
      prometheus_ip: '10.89.0.52'
      prometheus_network: 'podman-molecule'
      prometheus_hostname: 'prometheus-molecule'
      prometheus_timezone: 'Europe/Berlin'
      prometheus_config:
        global:
          scrape_interval: '5s'
          external_labels:
            cluster: 'molecule'
            replica: 'molecule'
      prometheus_container:
        command:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--storage.tsdb.min-block-duration=2h'
          - '--storage.tsdb.max-block-duration=2h'
    role_vars:
      thanos_sidecar_version: 'v0.42.5'
      thanos_sidecar_ip: '10.89.0.53'
      thanos_sidecar_ipv6: 'fd00:89::53'
      thanos_sidecar_network: 'podman-molecule'
      thanos_sidecar_hostname: 'thanos-sidecar-molecule'
      thanos_sidecar_timezone: 'Europe/Berlin'
      thanos_sidecar_labels:
        traefik.enable: 'false'
      thanos_sidecar_prometheus_url: 'http://10.89.0.52:9090'
      thanos_sidecar_prometheus_data: '/opt/prometheus-molecule/data'
      thanos_sidecar_objstore:
        type: 'FILESYSTEM'
        config:
          directory: '/bucket'
      thanos_sidecar_container:
        volumes:
          - '/opt/prometheus-molecule/data:/prometheus'
          - '/opt/thanos-bucket:/bucket'
    # side_effect changes the object storage, the secret changes and the sidecar has to restart
    side_effect:
      role_vars:
        thanos_sidecar_objstore:
          type: 'FILESYSTEM'
          config:
            directory: '/bucket/changed'
    expect:
      ip: '10.89.0.53'
      ip6: 'fd00:89::53'
      objstore: true
      quadlet:
        - 'Volume=/opt/prometheus-molecule/data:/prometheus'
        - 'Volume=/opt/thanos-bucket:/bucket'
        - 'Label=traefik.enable=false'
