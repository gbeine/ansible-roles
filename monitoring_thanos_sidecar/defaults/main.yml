---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-thanos-sidecar
#

# The image has no tag latest
monitoring_thanos_sidecar__version: "{{ thanos_sidecar_version | mandatory }}"

monitoring_thanos_sidecar__ip: "{{ thanos_sidecar_ip | mandatory }}"
monitoring_thanos_sidecar__ipv6: "{{ thanos_sidecar_ipv6 }}"
monitoring_thanos_sidecar__network: "{{ thanos_sidecar_network | mandatory }}"
monitoring_thanos_sidecar__hostname: "{{ thanos_sidecar_hostname | mandatory }}"
monitoring_thanos_sidecar__timezone: "{{ thanos_sidecar_timezone | mandatory }}"
monitoring_thanos_sidecar__labels: "{{ thanos_sidecar_labels }}"

# The URL of Prometheus and the directory of its TSDB on the host
monitoring_thanos_sidecar__prometheus_url: "{{ thanos_sidecar_prometheus_url | default('http://prometheus:9090') }}"
monitoring_thanos_sidecar__prometheus_data: "{{ thanos_sidecar_prometheus_data | mandatory }}"

# Content of bucket.yml, stored as podman secret, without it the sidecar uploads nothing
monitoring_thanos_sidecar__objstore: "{{ thanos_sidecar_objstore | default({}) }}"

monitoring_thanos_sidecar__container: "{{ monitoring_thanos_sidecar__podman_container_default | combine(thanos_sidecar_container | default({})) }}"

# Thanos reads no variables besides TZ
monitoring_thanos_sidecar__environment: "{{ monitoring_thanos_sidecar__environment_default | combine(thanos_sidecar_environment | default({})) }}"

monitoring_thanos_sidecar__autoupdate_enabled: "{{ thanos_sidecar_autoupdate_enabled | default(false) }}"
monitoring_thanos_sidecar__autoupdate_schedule: "{{ thanos_sidecar_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_thanos_sidecar__environment_default:
  TZ: "{{ monitoring_thanos_sidecar__timezone }}"

monitoring_thanos_sidecar__environment_allowed: [ 'TZ' ]

# User and group nobody of the Prometheus image, the owner of the TSDB of Prometheus,
# the sidecar writes thanos.shipper.json there
monitoring_thanos_sidecar__uid: 65534
monitoring_thanos_sidecar__gid: 65534

# HTTP endpoints (/-/ready, /metrics), the StoreAPI listens on 10901
monitoring_thanos_sidecar__http_port: 10902

monitoring_thanos_sidecar__objstore_file: '/etc/thanos/bucket.yml'
monitoring_thanos_sidecar__tsdb_dir: '/prometheus'

monitoring_thanos_sidecar__objstore_flags: >-
  {{ [ '--objstore.config-file=' ~ monitoring_thanos_sidecar__objstore_file ] if monitoring_thanos_sidecar__objstore | length > 0 else [] }}

monitoring_thanos_sidecar__command_default: >-
  {{ [ 'sidecar',
       '--tsdb.path=' ~ monitoring_thanos_sidecar__tsdb_dir,
       '--prometheus.url=' ~ monitoring_thanos_sidecar__prometheus_url ]
     + monitoring_thanos_sidecar__objstore_flags }}

monitoring_thanos_sidecar__podman_name: 'thanos-sidecar'
monitoring_thanos_sidecar__podman_image: 'docker.io/thanosio/thanos'
monitoring_thanos_sidecar__podman_tag: "{{ monitoring_thanos_sidecar__version }}"
# Named after the container, a container with another name has its own secret
monitoring_thanos_sidecar__podman_objstore_secret: >-
  {{ (thanos_sidecar_container | default({})).name | default(monitoring_thanos_sidecar__podman_name) }}-objstore

monitoring_thanos_sidecar__podman_container_default:
  name: "{{ monitoring_thanos_sidecar__podman_name }}"
  hostname: "{{ monitoring_thanos_sidecar__hostname }}"
  image: "{{ monitoring_thanos_sidecar__podman_image }}:{{ monitoring_thanos_sidecar__podman_tag }}"
  ip: "{{ monitoring_thanos_sidecar__ip }}"
  ipv6: "{{ monitoring_thanos_sidecar__ipv6 | default(omit) }}"
  network: "{{ monitoring_thanos_sidecar__network }}"
  timezone: "{{ monitoring_thanos_sidecar__timezone }}"
  environment: "{{ monitoring_thanos_sidecar__environment }}"
  labels: "{{ monitoring_thanos_sidecar__labels | default(omit) }}"
  user: "{{ monitoring_thanos_sidecar__uid }}:{{ monitoring_thanos_sidecar__gid }}"
  # thanos_sidecar_container.command replaces the list completely
  command: "{{ monitoring_thanos_sidecar__command_default }}"
  secrets: >-
    {{ [ monitoring_thanos_sidecar__podman_objstore_secret ~ ',type=mount,target=' ~ monitoring_thanos_sidecar__objstore_file ]
       if monitoring_thanos_sidecar__objstore | length > 0 else omit }}
  # thanos_sidecar_container.volumes replaces the list completely
  volumes:
    - "{{ monitoring_thanos_sidecar__prometheus_data }}:{{ monitoring_thanos_sidecar__tsdb_dir }}"
