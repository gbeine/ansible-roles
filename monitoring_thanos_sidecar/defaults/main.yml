---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-thanos-sidecar
#

# The image has no tag latest
monitoring_thanos_sidecar__version: "{{ thanos_sidecar_version | mandatory }}"

# The directory of bucket.yml, only needed with thanos_sidecar_objstore
monitoring_thanos_sidecar__home: "{{ thanos_sidecar_home }}"
monitoring_thanos_sidecar__ip: "{{ thanos_sidecar_ip | mandatory }}"
monitoring_thanos_sidecar__ipv6: "{{ thanos_sidecar_ipv6 }}"
monitoring_thanos_sidecar__network: "{{ thanos_sidecar_network | mandatory }}"
monitoring_thanos_sidecar__hostname: "{{ thanos_sidecar_hostname | mandatory }}"
monitoring_thanos_sidecar__timezone: "{{ thanos_sidecar_timezone | mandatory }}"
monitoring_thanos_sidecar__labels: "{{ thanos_sidecar_labels }}"

# The URL of Prometheus and the directory of its TSDB on the host
monitoring_thanos_sidecar__prometheus_url: "{{ thanos_sidecar_prometheus_url | default('http://prometheus:9090') }}"
monitoring_thanos_sidecar__prometheus_data: "{{ thanos_sidecar_prometheus_data | mandatory }}"

# Content of bucket.yml without credentials, the sidecar uploads the blocks of Prometheus to this object storage, without it the sidecar uploads nothing
monitoring_thanos_sidecar__objstore: "{{ thanos_sidecar_objstore | default({}) }}"

# Secrets with name, data and target, the target is the path of the option in thanos_sidecar_objstore,
# e.g. config.secret_key, the role references the secret in bucket.yml
monitoring_thanos_sidecar__secrets: "{{ thanos_sidecar_secrets | default([]) }}"

monitoring_thanos_sidecar__container: "{{ monitoring_thanos_sidecar__podman_container_default | combine(thanos_sidecar_container | default({})) }}"

# Thanos reads no variables besides TZ, without thanos_sidecar_environment the container has no environment
monitoring_thanos_sidecar__environment: "{{ thanos_sidecar_environment }}"

monitoring_thanos_sidecar__autoupdate_enabled: "{{ thanos_sidecar_autoupdate_enabled | default(false) }}"
monitoring_thanos_sidecar__autoupdate_schedule: "{{ thanos_sidecar_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_thanos_sidecar__environment_allowed: [ 'TZ' ]

# User and group nobody of the Prometheus image, the owner of the TSDB of Prometheus,
# the sidecar writes thanos.shipper.json there
monitoring_thanos_sidecar__uid: 65534
monitoring_thanos_sidecar__gid: 65534

# HTTP endpoints (/-/ready, /metrics), the StoreAPI listens on 10901
monitoring_thanos_sidecar__http_port: 10902

# Generated from the yaml tags of BucketConfig in client/factory.go and the providers of objstore.go
# of github.com/thanos-io/objstore 71d60dfee488 (Thanos v0.42.5), MEMORY is left out, it only exists for tests
monitoring_thanos_sidecar__objstore_allowed: [ 'type', 'config', 'prefix' ]
monitoring_thanos_sidecar__objstore_types:
  - 'FILESYSTEM'
  - 'GCS'
  - 'S3'
  - 'AZURE'
  - 'SWIFT'
  - 'COS'
  - 'ALIYUNOSS'
  - 'BOS'
  - 'OCI'
  - 'OBS'

# Options of the providers of github.com/thanos-io/objstore 71d60dfee488 carrying secrets,
# they are set with thanos_sidecar_secrets, the last key of a target is one of them
monitoring_thanos_sidecar__objstore_secret_keys:
  - 'secret_key'
  - 'session_token'
  - 'encryption_key'
  - 'service_account'
  - 'client_secret'
  - 'storage_account_key'
  - 'password'
  - 'application_credential_secret'
  - 'access_key_secret'
  - 'passphrase'
  - 'privatekey'

# The environment variables of the secrets are the prefix and the target in upper case, dots replaced by _
monitoring_thanos_sidecar__secret_prefix: 'THANOS_SECRET_'

# The valid secrets with their path and environment variable, broken entries are left out, the validation reports them
monitoring_thanos_sidecar__secrets_valid: >-
  {%- set result = [] -%}
  {%- if monitoring_thanos_sidecar__secrets is sequence and monitoring_thanos_sidecar__secrets is not string
         and monitoring_thanos_sidecar__secrets is not mapping -%}
  {%-   for secret in monitoring_thanos_sidecar__secrets if secret is mapping and secret.name is defined and secret.target is defined
                                                          and secret.target is string and secret.target is match('^[a-z0-9_]+(\.[a-z0-9_]+)+$')
                                                          and (secret.target | split('.') | last) in monitoring_thanos_sidecar__objstore_secret_keys -%}
  {%-     set _ = result.append({ 'name': secret.name, 'path': secret.target | split('.'),
                                  'variable': monitoring_thanos_sidecar__secret_prefix ~ (secret.target | replace('.', '_') | upper) }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ result }}

# The references of the secrets as nested dictionaries, e.g. { 'config': { 'secret_key': '$(THANOS_SECRET_CONFIG_SECRET_KEY)' } },
# Thanos replaces $(…) in bucket.yml with the environment
monitoring_thanos_sidecar__objstore_secrets: >-
  {%- set ns = namespace(result={}) -%}
  {%- for secret in monitoring_thanos_sidecar__secrets_valid -%}
  {%-   set node = namespace(value='$(' ~ secret.variable ~ ')') -%}
  {%-   for key in secret.path | reverse -%}
  {%-     set node.value = { key: node.value } -%}
  {%-   endfor -%}
  {%-   set ns.result = ns.result | combine(node.value, recursive=true) -%}
  {%- endfor -%}
  {{ ns.result }}

# The content of bucket.yml: the object storage with the references of the secrets
monitoring_thanos_sidecar__objstore_rendered: >-
  {{ monitoring_thanos_sidecar__objstore | combine(monitoring_thanos_sidecar__objstore_secrets, recursive=true) }}

monitoring_thanos_sidecar__command_default: >-
  {{ [ 'sidecar',
       '--tsdb.path=/prometheus',
       '--prometheus.url=' ~ monitoring_thanos_sidecar__prometheus_url ]
     + ([ '--objstore.config-file=/etc/thanos/bucket.yml' ] if monitoring_thanos_sidecar__objstore | length > 0 else []) }}

monitoring_thanos_sidecar__podman_name: 'thanos-sidecar'
monitoring_thanos_sidecar__podman_image: 'docker.io/thanosio/thanos'
monitoring_thanos_sidecar__podman_tag: "{{ monitoring_thanos_sidecar__version }}"
# thanos_sidecar_home is only needed with object storage, the validation reports it if it is missing
monitoring_thanos_sidecar__podman_objstore_file: "{{ monitoring_thanos_sidecar__home | default('') }}/bucket.yml"

monitoring_thanos_sidecar__podman_container_default:
  name: "{{ monitoring_thanos_sidecar__podman_name }}"
  hostname: "{{ monitoring_thanos_sidecar__hostname }}"
  image: "{{ monitoring_thanos_sidecar__podman_image }}:{{ monitoring_thanos_sidecar__podman_tag }}"
  ip: "{{ monitoring_thanos_sidecar__ip }}"
  ipv6: "{{ monitoring_thanos_sidecar__ipv6 | default(omit) }}"
  network: "{{ monitoring_thanos_sidecar__network }}"
  timezone: "{{ monitoring_thanos_sidecar__timezone }}"
  environment: "{{ monitoring_thanos_sidecar__environment | default(omit) }}"
  labels: "{{ monitoring_thanos_sidecar__labels | default(omit) }}"
  user: "{{ monitoring_thanos_sidecar__uid }}:{{ monitoring_thanos_sidecar__gid }}"
  # thanos_sidecar_container.command replaces the list completely
  command: "{{ monitoring_thanos_sidecar__command_default }}"
  # The providers read no files, the secrets are variables referenced in bucket.yml
  secrets: >-
    {{ (monitoring_thanos_sidecar__secrets_valid | map(attribute='name')
        | zip(monitoring_thanos_sidecar__secrets_valid | map(attribute='variable')) | map('join', ',type=env,target=') | list)
       if monitoring_thanos_sidecar__secrets_valid | length > 0 else omit }}
  # thanos_sidecar_container.volumes replaces the list completely
  volumes: >-
    {{ [ monitoring_thanos_sidecar__prometheus_data ~ ':/prometheus' ]
       + ([ monitoring_thanos_sidecar__podman_objstore_file ~ ':/etc/thanos/bucket.yml:ro' ] if monitoring_thanos_sidecar__objstore | length > 0 else []) }}
