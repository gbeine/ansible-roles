---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/renovate
#

app_renovate__home: "{{ renovate_home | mandatory }}"
app_renovate__ip: "{{ renovate_ip | mandatory }}"
app_renovate__ipv6: "{{ renovate_ipv6 }}"
app_renovate__network: "{{ renovate_network | mandatory }}"
app_renovate__hostname: "{{ renovate_hostname | mandatory }}"
app_renovate__timezone: "{{ renovate_timezone | mandatory }}"

app_renovate__version: "{{ renovate_version | default('latest') }}"

app_renovate__container: "{{ app_renovate__container_default | combine(renovate_container | default({})) }}"

app_renovate__autoupdate_enabled: "{{ renovate_autoupdate_enabled | default(false) }}"

app_renovate__platform: "{{ renovate_platform | default('forgejo') }}"
app_renovate__endpoint: "{{ renovate_endpoint | mandatory }}"
app_renovate__log_level: "{{ renovate_log_level | default('info') }}"
app_renovate__autodiscover: "{{ renovate_autodiscover | default(false) }}"
app_renovate__optimize_for_disabled: "{{ renovate_optimize_for_disabled | default(false) }}"
app_renovate__git_author: "{{ renovate_git_author | mandatory }}"
app_renovate__interval: "{{ renovate_interval | default('21600') }}"

app_renovate__token: "{{ renovate_token | mandatory }}"

#
# Defaults - do not change
#

app_renovate__podman_name: 'renovate'
app_renovate__podman_image: 'ghcr.io/renovatebot/renovate'
app_renovate__podman_tag: "{{ app_renovate__version }}"

app_renovate__podman_home: "{{ app_renovate__home }}"

app_renovate__container_default:
  name: "{{ app_renovate__podman_name }}"
  hostname: "{{ app_renovate__hostname }}"
  image: "{{ app_renovate__podman_image }}:{{ app_renovate__podman_tag }}"
  ip: "{{ app_renovate__ip }}"
  ipv6: "{{ app_renovate__ipv6 }}"
  network: "{{ app_renovate__network }}"
  timezone: "{{ app_renovate__timezone }}"
  environment:
    RENOVATE_PLATFORM: "{{ app_renovate__platform }}"
    RENOVATE_ENDPOINT: "{{ app_renovate__endpoint }}"
    RENOVATE_AUTODISCOVER: "{{ app_renovate__autodiscover | ternary('true', 'false') }}"
    RENOVATE_OPTIMIZE_FOR_DISABLED: "{{ app_renovate__optimize_for_disabled | ternary('true', 'false') }}"
    RENOVATE_GIT_AUTHOR: "{{ app_renovate__git_author }}"
    LOG_LEVEL: "{{ app_renovate__log_level }}"
  secrets:
    - "renovate_token,type=env,target=RENOVATE_TOKEN"
  volumes:
    - '/etc/timezone:/etc/timezone:ro'
    - '/etc/localtime:/etc/localtime:ro'
    - "{{ app_renovate__podman_home }}:/tmp/renovate"
