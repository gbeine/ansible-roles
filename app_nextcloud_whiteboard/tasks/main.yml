---

- name: 'Install the Nextcloud Whiteboard server'
  tags: [ 'app', 'app_nextcloud_whiteboard' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or whiteboard_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - app_nextcloud_whiteboard__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - app_nextcloud_whiteboard__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_nextcloud_whiteboard__invalid | join('. ') }}"
        quiet: true
      vars:
        app_nextcloud_whiteboard__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = app_nextcloud_whiteboard__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('whiteboard_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('whiteboard_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of whiteboard_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - app_nextcloud_whiteboard__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_nextcloud_whiteboard__errors | join(' ') }}"
        quiet: true
      vars:
        app_nextcloud_whiteboard__targets: "{{ app_nextcloud_whiteboard__secrets | map(attribute='target') | list }}"
        app_nextcloud_whiteboard__environment_missing: >-
          {{ app_nextcloud_whiteboard__environment_required
             | reject('in', app_nextcloud_whiteboard__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        app_nextcloud_whiteboard__secrets_missing: >-
          {{ app_nextcloud_whiteboard__secrets_required | reject('in', app_nextcloud_whiteboard__targets) | list }}
        app_nextcloud_whiteboard__secrets_in_environment: >-
          {{ (app_nextcloud_whiteboard__targets + app_nextcloud_whiteboard__secret_variables)
             | select('in', app_nextcloud_whiteboard__environment.keys() | list) | unique | list }}
        app_nextcloud_whiteboard__secrets_lines: >-
          {{ app_nextcloud_whiteboard__secrets | selectattr('data', 'string') | selectattr('data', 'search', '[\r\n]') | map(attribute='name') | list }}
        app_nextcloud_whiteboard__errors: >-
          {%- set errors = [] -%}
          {%- if app_nextcloud_whiteboard__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('Nextcloud Whiteboard needs the environment variables ' ~ (app_nextcloud_whiteboard__environment_required | join(', ')) ~ ', missing or empty: ' ~ (app_nextcloud_whiteboard__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_nextcloud_whiteboard__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('Nextcloud Whiteboard needs the secrets ' ~ (app_nextcloud_whiteboard__secrets_required | join(', ')) ~ ', missing: ' ~ (app_nextcloud_whiteboard__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_nextcloud_whiteboard__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets must not be set in whiteboard_environment: ' ~ (app_nextcloud_whiteboard__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_nextcloud_whiteboard__secrets_lines | length > 0 -%}
          {%-   set _ = errors.append('Secrets must not contain line breaks: ' ~ (app_nextcloud_whiteboard__secrets_lines | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate the values of the environment'
      ansible.builtin.assert:
        that:
          - app_nextcloud_whiteboard__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_nextcloud_whiteboard__errors | join(' ') }}"
        quiet: true
      vars:
        app_nextcloud_whiteboard__errors: >-
          {%- set errors = [] -%}
          {%- set environment = app_nextcloud_whiteboard__environment -%}
          {%- set ns = namespace(booleans=[], lines=[], values=[]) -%}
          {%- for key, value in environment.items() if value is not none -%}
          {%-   if key in app_nextcloud_whiteboard__environment_booleans and value is not boolean and (value | string) not in [ 'true', 'false' ] -%}
          {%-     set ns.booleans = ns.booleans + [ key ] -%}
          {%-   elif value is string and (value ~ '.').splitlines() | length > 1 -%}
          {%-     set ns.lines = ns.lines + [ key ] -%}
          {%-   elif key in app_nextcloud_whiteboard__environment_values and value not in app_nextcloud_whiteboard__environment_values[key] -%}
          {%-     set ns.values = ns.values + [ key ~ ' (' ~ (app_nextcloud_whiteboard__environment_values[key] | join(', ')) ~ ')' ] -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- if (environment.NEXTCLOUD_URL | default('', true) | string | length > 0)
                 and (environment.NEXTCLOUD_URL | string) is not match('^https?://[^\s/]+') -%}
          {%-   set _ = errors.append('NEXTCLOUD_URL has to be the URL of Nextcloud starting with http:// or https://.') -%}
          {%- endif -%}
          {%- if ns.booleans | length > 0 -%}
          {%-   set _ = errors.append('These variables are booleans, allowed are true and false: ' ~ (ns.booleans | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.values | length > 0 -%}
          {%-   set _ = errors.append('Invalid values: ' ~ (ns.values | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if ns.lines | length > 0 -%}
          {%-   set _ = errors.append('Values must not contain line breaks: ' ~ (ns.lines | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging whiteboard_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - app_nextcloud_whiteboard__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ app_nextcloud_whiteboard__errors | join(' ') }}"
        quiet: true
      vars:
        # The secrets of the container are omit without secrets
        app_nextcloud_whiteboard__container_secrets: >-
          {{ app_nextcloud_whiteboard__container.secrets
             if app_nextcloud_whiteboard__container.secrets is sequence and app_nextcloud_whiteboard__container.secrets is not string
             else [] }}
        app_nextcloud_whiteboard__environment_unknown: >-
          {{ (app_nextcloud_whiteboard__container.environment | default({})).keys() | reject('in', app_nextcloud_whiteboard__environment_allowed) | list }}
        app_nextcloud_whiteboard__secrets_unknown: >-
          {{ app_nextcloud_whiteboard__container_secrets | map('regex_replace', '^.*,target=([^,]+).*$', '\1') | map('basename')
             | reject('in', app_nextcloud_whiteboard__secrets_allowed) | list }}
        app_nextcloud_whiteboard__errors: >-
          {%- set errors = [] -%}
          {%- if app_nextcloud_whiteboard__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (app_nextcloud_whiteboard__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if app_nextcloud_whiteboard__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (app_nextcloud_whiteboard__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the environment variables of app_nextcloud_whiteboard__environment_allowed and the secrets ' ~ (app_nextcloud_whiteboard__secrets_allowed | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ app_nextcloud_whiteboard__secrets }}"
      register: 'app_nextcloud_whiteboard__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_nextcloud_whiteboard__container.name }}"
        hostname: "{{ app_nextcloud_whiteboard__container.hostname }}"
        image: "{{ app_nextcloud_whiteboard__container.image }}"
        ip: "{{ app_nextcloud_whiteboard__container.ip }}"
        ip6: "{{ app_nextcloud_whiteboard__container.ipv6 | default(omit) }}"
        network: "{{ app_nextcloud_whiteboard__container.network }}"
        timezone: "{{ app_nextcloud_whiteboard__container.timezone }}"
        command: "{{ app_nextcloud_whiteboard__container.command | default(omit) }}"
        env: "{{ app_nextcloud_whiteboard__container.environment | default(omit) }}"
        etc_hosts: "{{ app_nextcloud_whiteboard__container.etc_hosts | default(omit) }}"
        expose: "{{ app_nextcloud_whiteboard__container.expose | default(omit) }}"
        label: "{{ app_nextcloud_whiteboard__container.labels | default(omit) }}"
        publish: "{{ app_nextcloud_whiteboard__container.publish | default(omit) }}"
        secrets: "{{ app_nextcloud_whiteboard__container.secrets | default(omit) }}"
        volume: "{{ app_nextcloud_whiteboard__container.volumes | default(omit) }}"
        quadlet_options: |
          [Install]
          WantedBy=default.target

          [Service]
          RestartSec=5
          Restart=always

          [Unit]
          {% if app_nextcloud_whiteboard__container.requires is defined %}
          Requires={{ app_nextcloud_whiteboard__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'app_nextcloud_whiteboard__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ app_nextcloud_whiteboard__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if app_nextcloud_whiteboard__restart | bool else 'started' }}"
        enabled: true
      vars:
        app_nextcloud_whiteboard__running: >-
          {{ (ansible_facts.services[app_nextcloud_whiteboard__container.name + '.service'].state | default('')) == 'running' }}
        app_nextcloud_whiteboard__restart: >-
          {{ app_nextcloud_whiteboard__running | bool
             and (app_nextcloud_whiteboard__secrets_result is changed or app_nextcloud_whiteboard__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Wait for the Nextcloud Whiteboard server'
      ansible.builtin.uri:
        url: "{{ 'https' if (app_nextcloud_whiteboard__container.environment.TLS | default('false')) == 'true' else 'http' }}://{{ app_nextcloud_whiteboard__ip }}:{{ app_nextcloud_whiteboard__port }}/"
        validate_certs: false
      register: 'app_nextcloud_whiteboard__ready'
      until: app_nextcloud_whiteboard__ready.status | default(-1) == 200
      retries: 60
      delay: 2
      failed_when: false
      when: 'not ansible_check_mode'

    - name: 'Read the log of the Nextcloud Whiteboard server'
      when:
        - not ansible_check_mode
        - app_nextcloud_whiteboard__ready.status | default(-1) != 200
      ansible.builtin.command:
        argv: [ 'journalctl', '-u', "{{ app_nextcloud_whiteboard__container.name }}", '-n', '50', '--no-pager' ]
      register: 'app_nextcloud_whiteboard__journal'
      changed_when: false

    - name: 'Assert that the Nextcloud Whiteboard server answers'
      when: 'not ansible_check_mode'
      ansible.builtin.assert:
        that:
          - app_nextcloud_whiteboard__journal is skipped
        fail_msg: "{{ app_nextcloud_whiteboard__journal.stdout_lines | default([]) }}"
        quiet: true

    - name: 'Enable autoupdate on container'
      when: 'app_nextcloud_whiteboard__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ app_nextcloud_whiteboard__container.name }}"
        container_image: "{{ app_nextcloud_whiteboard__container.image }}"
        container_schedule: "{{ app_nextcloud_whiteboard__autoupdate_schedule }}"
