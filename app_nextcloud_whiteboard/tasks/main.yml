---

- name: 'Install nextcloud whiteboard'
  tags: [ 'app_nextcloud_whiteboard' ]
  block:

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: 'whiteboard_jwt_secret'
        data: "{{ app_nextcloud_whiteboard__secret }}"

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Stop container when it is running'
      ansible.builtin.systemd:
        name: "{{ app_nextcloud_whiteboard__container.name }}.service"
        state: 'stopped'
      when: 'ansible_facts.services[app_nextcloud_whiteboard__container.name + ".service"] is defined and podman___update_mode | bool'

    - name: 'Pull image'
      containers.podman.podman_image:
        name: "{{ app_nextcloud_whiteboard__container.image }}"
        force: true
      when: 'podman___update_mode | bool'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_nextcloud_whiteboard__container.name }}"
        hostname: "{{ app_nextcloud_whiteboard__container.hostname }}"
        image: "{{ app_nextcloud_whiteboard__container.image }}"
        ip: "{{ app_nextcloud_whiteboard__container.ip }}"
        network: "{{ app_nextcloud_whiteboard__container.network }}"
        timezone: "{{ app_nextcloud_whiteboard__container.timezone }}"
        env: "{{ app_nextcloud_whiteboard__container.environment }}"
        label: "{{ app_nextcloud_whiteboard__container.labels }}"
        secrets: "{{ app_nextcloud_whiteboard__container.secrets }}"
        volume: "{{ app_nextcloud_whiteboard__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'app_nextcloud_whiteboard__ipv6 | length == 0'

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ app_nextcloud_whiteboard__container.name }}"
        hostname: "{{ app_nextcloud_whiteboard__container.hostname }}"
        image: "{{ app_nextcloud_whiteboard__container.image }}"
        ip: "{{ app_nextcloud_whiteboard__container.ip }}"
        ip6: "{{ app_nextcloud_whiteboard__container.ipv6 }}"
        network: "{{ app_nextcloud_whiteboard__container.network }}"
        timezone: "{{ app_nextcloud_whiteboard__container.timezone }}"
        env: "{{ app_nextcloud_whiteboard__container.environment }}"
        label: "{{ app_nextcloud_whiteboard__container.labels }}"
        secrets: "{{ app_nextcloud_whiteboard__container.secrets }}"
        volume: "{{ app_nextcloud_whiteboard__container.volumes }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target
          
          [Service]
          RestartSec=5
          Restart=always
        restart_policy: 'no'
        state: 'quadlet'
        recreate: "{{ podman___update_mode | bool }}"
      when: 'app_nextcloud_whiteboard__ipv6 | length > 0'

    - name: 'Start and enable container'
      ansible.builtin.systemd:
        name: "{{ app_nextcloud_whiteboard__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if podman___update_mode is defined and podman___update_mode else 'started' }}"
        enabled: true
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'app_nextcloud_whiteboard__autoupdate_enabled'
      block:
        - name: 'Create autoupdate systemd service'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ app_nextcloud_whiteboard__container.name }} container

              [Service]
              Type=oneshot
              ExecStart=/usr/bin/podman pull {{ app_nextcloud_whiteboard__container.image }}
              ExecStartPost=/usr/bin/systemctl restart {{ app_nextcloud_whiteboard__container.name }}
            dest: "/etc/systemd/system/container-{{ app_nextcloud_whiteboard__container.name }}-update.service"
            mode: '0644'
            owner: root
            group: root

        - name: 'Create autoupdate systemd timer'
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Auto-update {{ app_nextcloud_whiteboard__container.name }} timer

              [Timer]
              OnCalendar=*-*-* 04:00:00
              RandomizedDelaySec=30m
              Persistent=true

              [Install]
              WantedBy=timers.target
            dest: "/etc/systemd/system/container-{{ app_nextcloud_whiteboard__container.name }}-update.timer"
            mode: '0644'
            owner: root
            group: root

        - name: 'Start and enable autoupdate timer'
          ansible.builtin.systemd:
            name: "container-{{ app_nextcloud_whiteboard__container.name }}-update.timer"
            daemon_reload: true
            state: 'started'
            enabled: true
          when: 'not ansible_check_mode'

