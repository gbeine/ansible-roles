---
# Network created by container_podman in prepare.yml
app_nextcloud_whiteboard__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

app_nextcloud_whiteboard__test_image: 'ghcr.io/nextcloud-releases/whiteboard:stable'
app_nextcloud_whiteboard__test_quadlet_path: '/etc/containers/systemd/whiteboard.container'

app_nextcloud_whiteboard__test_cases:

  # Only the mandatory variables, the URL of Nextcloud and the JWT secret
  - name: 'molecule-whiteboard-default'
    role_vars:
      whiteboard_ip: '10.89.0.90'
      whiteboard_network: 'podman-molecule'
      whiteboard_hostname: 'whiteboard-default'
      whiteboard_timezone: 'Europe/Berlin'
      whiteboard_environment:
        NEXTCLOUD_URL: 'https://cloud.example.org'
      whiteboard_secrets:
        - name: 'whiteboard_jwt_secret'
          data: 'molecule-jwt-secret-default'
          target: 'JWT_SECRET_KEY'
    expect:
      ip: '10.89.0.90'
      ip6: ~
      origin: 'https://cloud.example.org'
      quadlet:
        - 'Secret=whiteboard_jwt_secret,type=env,target=JWT_SECRET_KEY'
      env:
        - 'TZ=Europe/Berlin'
        - 'NEXTCLOUD_URL=https://cloud.example.org'
      metrics: ~

  # IPv6, labels, options and the metrics token
  - name: 'molecule-whiteboard'
    role_vars:
      whiteboard_ip: '10.89.0.91'
      whiteboard_ipv6: 'fd00:89::91'
      whiteboard_network: 'podman-molecule'
      whiteboard_hostname: 'whiteboard-molecule'
      whiteboard_timezone: 'Europe/Berlin'
      whiteboard_labels:
        traefik.enable: 'false'
      whiteboard_environment:
        NEXTCLOUD_URL: 'https://molecule.example.org/nextcloud'
        COMPRESSION_ENABLED: false
        MAX_UPLOAD_FILE_SIZE: 4
      whiteboard_secrets:
        - name: 'whiteboard_jwt_secret'
          data: 'molecule-jwt-secret'
          target: 'JWT_SECRET_KEY'
        - name: 'whiteboard_metrics_token'
          data: 'molecule-metrics-token'
          target: 'METRICS_TOKEN'
    # The metrics token changes, the secret changes and the server has to restart
    side_effect:
      secrets:
        - name: 'whiteboard_jwt_secret'
          data: 'molecule-jwt-secret'
          target: 'JWT_SECRET_KEY'
        - name: 'whiteboard_metrics_token'
          data: 'molecule-metrics-changed'
          target: 'METRICS_TOKEN'
    expect:
      ip: '10.89.0.91'
      ip6: 'fd00:89::91'
      origin: 'https://molecule.example.org'
      quadlet:
        - 'Label=traefik.enable=false'
        - 'Secret=whiteboard_jwt_secret,type=env,target=JWT_SECRET_KEY'
        - 'Secret=whiteboard_metrics_token,type=env,target=METRICS_TOKEN'
      env:
        - 'COMPRESSION_ENABLED=false'
        - 'MAX_UPLOAD_FILE_SIZE=4'
      metrics: { token: 'molecule-metrics-changed', former_token: 'molecule-metrics-token' }
