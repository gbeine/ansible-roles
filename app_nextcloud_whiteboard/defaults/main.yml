---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/nextcloud-whiteboard
#

app_nextcloud_whiteboard__ip: "{{ whiteboard_ip | mandatory }}"
app_nextcloud_whiteboard__ipv6: "{{ whiteboard_ipv6 }}"
app_nextcloud_whiteboard__network: "{{ whiteboard_network | mandatory }}"
app_nextcloud_whiteboard__hostname: "{{ whiteboard_hostname | mandatory }}"
app_nextcloud_whiteboard__timezone: "{{ whiteboard_timezone | mandatory }}"
app_nextcloud_whiteboard__labels: "{{ whiteboard_labels | default({}) }}"

app_nextcloud_whiteboard__version: "{{ whiteboard_version | default('stable') }}"

app_nextcloud_whiteboard__container: "{{ app_nextcloud_whiteboard__podman_container_default | combine(whiteboard_container | default({})) }}"

app_nextcloud_whiteboard__nextcloud_url: "{{ whiteboard_nextcloud_url | mandatory }}"
app_nextcloud_whiteboard__secret: "{{ whiteboard_secret | mandatory }}"

app_nextcloud_whiteboard__autoupdate_enabled: "{{ whiteboard_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

app_nextcloud_whiteboard__podman_name: 'whiteboard'
app_nextcloud_whiteboard__podman_image: 'ghcr.io/nextcloud-releases/whiteboard'
app_nextcloud_whiteboard__podman_tag: "{{ app_nextcloud_whiteboard__version }}"

app_nextcloud_whiteboard__podman_container_default:
  name: "{{ app_nextcloud_whiteboard__podman_name }}"
  hostname: "{{ app_nextcloud_whiteboard__hostname }}"
  image: "{{ app_nextcloud_whiteboard__podman_image }}:{{ app_nextcloud_whiteboard__podman_tag }}"
  ip: "{{ app_nextcloud_whiteboard__ip }}"
  ipv6: "{{ app_nextcloud_whiteboard__ipv6 | default(omit) }}"
  network: "{{ app_nextcloud_whiteboard__network }}"
  timezone: "{{ app_nextcloud_whiteboard__timezone }}"
  environment:
    NEXTCLOUD_URL: "{{ app_nextcloud_whiteboard__nextcloud_url }}"
  labels: "{{ app_nextcloud_whiteboard__labels }}"
  secrets:
    - "whiteboard_jwt_secret,type=env,target=JWT_SECRET_KEY"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
