---

- name: 'Install Poweradmin'
  tags: [ 'dns', 'dns_poweradmin' ]
  block:

    # A failing template in the variables (e.g. an unknown filter or poweradmin_container not a dictionary)
    # stops the role here before anything changes
    - name: 'Render the configuration'
      ansible.builtin.assert:
        that:
          # The container contains omit (e.g. ipv6), it is counted, not serialized
          - dns_poweradmin__container | length > 0
        quiet: true

    - name: 'Validate the secrets'
      ansible.builtin.assert:
        that:
          - dns_poweradmin__invalid | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ dns_poweradmin__invalid | join('. ') }}"
        quiet: true
      vars:
        dns_poweradmin__invalid: >-
          {%- set errors = [] -%}
          {%- set secrets = dns_poweradmin__secrets -%}
          {%- if secrets is not sequence or secrets is string or secrets is mapping -%}
          {%-   set _ = errors.append('poweradmin_secrets has to be a list') -%}
          {%- elif secrets | reject('mapping') | list | length > 0
                   or secrets | select('mapping') | rejectattr('name', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('data', 'defined') | list | length > 0
                   or secrets | select('mapping') | rejectattr('target', 'defined') | list | length > 0 -%}
          {%-   set _ = errors.append('poweradmin_secrets entries need name, data and target') -%}
          {%- elif secrets | map(attribute='name') | unique | list | length != secrets | length -%}
          {%-   set _ = errors.append('the names of poweradmin_secrets have to be unique') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Validate environment and secrets'
      ansible.builtin.assert:
        that:
          - dns_poweradmin__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ dns_poweradmin__errors | join(' ') }}"
        quiet: true
      vars:
        dns_poweradmin__db_server: "{{ dns_poweradmin__environment.DB_TYPE | default('') in ['mysql', 'pgsql'] }}"
        dns_poweradmin__environment_required_all: >-
          {{ dns_poweradmin__environment_required
             + (dns_poweradmin__environment_required_db if dns_poweradmin__db_server | bool else []) }}
        dns_poweradmin__secrets_required_all: >-
          {{ dns_poweradmin__secrets_required_db if dns_poweradmin__db_server | bool else [] }}
        dns_poweradmin__environment_missing: >-
          {{ dns_poweradmin__environment_required_all
             | reject('in', dns_poweradmin__environment | dict2items | rejectattr('value', 'in', ['', none]) | map(attribute='key') | list)
             | list }}
        dns_poweradmin__secrets_missing: >-
          {{ dns_poweradmin__secrets_required_all
             | reject('in', dns_poweradmin__secrets | map(attribute='target') | list)
             | list }}
        dns_poweradmin__secrets_in_environment: >-
          {{ (dns_poweradmin__secrets | map(attribute='target') | list
              + dns_poweradmin__secret_variables + dns_poweradmin__secret_files.values() | list)
             | select('in', dns_poweradmin__environment.keys() | list) | unique | list }}
        dns_poweradmin__errors: >-
          {%- set errors = [] -%}
          {%- if dns_poweradmin__environment_missing | length > 0 -%}
          {%-   set _ = errors.append('Poweradmin needs the environment variables ' ~ (dns_poweradmin__environment_required_all | join(', ')) ~ ', missing or empty: ' ~ (dns_poweradmin__environment_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if dns_poweradmin__secrets_missing | length > 0 -%}
          {%-   set _ = errors.append('Poweradmin needs the secrets ' ~ (dns_poweradmin__secrets_required_all | join(', ')) ~ ', missing: ' ~ (dns_poweradmin__secrets_missing | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if dns_poweradmin__secrets_in_environment | length > 0 -%}
          {%-   set _ = errors.append('Secrets and their file variables must not be set in poweradmin_environment: ' ~ (dns_poweradmin__secrets_in_environment | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    # Checks the environment and the secrets of the container after merging poweradmin_container,
    # unknown variables would change the behavior unexpectedly
    - name: 'Validate the allowed environment variables and secrets'
      ansible.builtin.assert:
        that:
          - dns_poweradmin__errors | length == 0
        # Only the failing checks are reported
        fail_msg: "{{ dns_poweradmin__errors | join(' ') }}"
        quiet: true
      vars:
        dns_poweradmin__environment_unknown: >-
          {{ (dns_poweradmin__container.environment | default({})).keys()
             | reject('in', dns_poweradmin__environment_allowed) | list }}
        dns_poweradmin__secrets_unknown: >-
          {{ dns_poweradmin__secrets | map(attribute='target') | reject('in', dns_poweradmin__secret_files.keys() | list) | list }}
        dns_poweradmin__errors: >-
          {%- set errors = [] -%}
          {%- if dns_poweradmin__environment_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown environment variables: ' ~ (dns_poweradmin__environment_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if dns_poweradmin__secrets_unknown | length > 0 -%}
          {%-   set _ = errors.append('Unknown secrets: ' ~ (dns_poweradmin__secrets_unknown | join(', ')) ~ '.') -%}
          {%- endif -%}
          {%- if errors | length > 0 -%}
          {%-   set _ = errors.append('Allowed are the variables of the image (dns_poweradmin__environment_allowed) and the secrets ' ~ (dns_poweradmin__secret_files.keys() | join(', ')) ~ '.') -%}
          {%- endif -%}
          {{ errors }}

    - name: 'Create Poweradmin directories'
      ansible.builtin.file:
        dest: "{{ item.dest }}"
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0755') }}"
        state: 'directory'
      loop:
        - dest: "{{ dns_poweradmin__podman_home }}"
        - dest: "{{ dns_poweradmin__podman_db_dir }}"
          owner: "{{ dns_poweradmin__uid }}"
          group: "{{ dns_poweradmin__gid }}"
          mode: '0750'
      loop_control:
        label: "{{ item.dest }}"

    - name: 'Create secrets'
      no_log: true
      containers.podman.podman_secret:
        state: 'present'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
      loop: "{{ dns_poweradmin__secrets }}"
      register: 'dns_poweradmin__secrets_result'

    - name: 'Gathering facts about services...'
      ansible.builtin.service_facts:

    - name: 'Install container'
      containers.podman.podman_container:
        name: "{{ dns_poweradmin__container.name }}"
        hostname: "{{ dns_poweradmin__container.hostname }}"
        image: "{{ dns_poweradmin__container.image }}"
        ip: "{{ dns_poweradmin__container.ip }}"
        ip6: "{{ dns_poweradmin__container.ipv6 | default(omit) }}"
        network: "{{ dns_poweradmin__container.network }}"
        timezone: "{{ dns_poweradmin__container.timezone }}"
        env: "{{ dns_poweradmin__container.environment | default(omit) }}"
        etc_hosts: "{{ dns_poweradmin__container.etc_hosts | default(omit) }}"
        expose: "{{ dns_poweradmin__container.expose | default(omit) }}"
        label: "{{ dns_poweradmin__container.labels | default(omit) }}"
        publish: "{{ dns_poweradmin__container.publish | default(omit) }}"
        secrets: "{{ dns_poweradmin__container.secrets | default(omit) }}"
        volume: "{{ dns_poweradmin__container.volumes | default(omit) }}"
        quadlet_options: |

          [Install]
          WantedBy=default.target

          [Service]
          {% if dns_poweradmin__container.exec_start_pre is defined %}
          {% for command in dns_poweradmin__container.exec_start_pre %}
          ExecStartPre={{ command }}
          {% endfor %}
          {% endif %}
          RestartSec=5
          Restart=always

          [Unit]
          {% if dns_poweradmin__container.requires is defined %}
          Requires={{ dns_poweradmin__container.requires | join(' ') }}
          {% endif %}
        restart_policy: 'no'
        state: 'quadlet'
      register: 'dns_poweradmin__quadlet_result'

    - name: 'Start and enable container'
      ansible.builtin.systemd_service:
        name: "{{ dns_poweradmin__container.name }}"
        daemon_reload: true
        state: "{{ 'restarted' if dns_poweradmin__restart | bool else 'started' }}"
        enabled: true
      vars:
        dns_poweradmin__running: >-
          {{ (ansible_facts.services[dns_poweradmin__container.name + '.service'].state | default('')) == 'running' }}
        dns_poweradmin__restart: >-
          {{ dns_poweradmin__running | bool
             and (dns_poweradmin__secrets_result is changed or dns_poweradmin__quadlet_result is changed) }}
      when: 'not ansible_check_mode'

    - name: 'Enable autoupdate on container'
      when: 'dns_poweradmin__autoupdate_enabled | bool'
      ansible.builtin.include_role:
        name: 'container_update'
      vars:
        container_name: "{{ dns_poweradmin__container.name }}"
        container_image: "{{ dns_poweradmin__container.image }}"
        container_schedule: "{{ dns_poweradmin__autoupdate_schedule }}"
