dns_poweradmin__gid: 82

dns_poweradmin__podman_name: 'poweradmin'
dns_poweradmin__podman_image: 'docker.io/poweradmin/poweradmin'
dns_poweradmin__podman_tag: "{{ dns_poweradmin__version }}"

dns_poweradmin__podman_home: "{{ dns_poweradmin__home }}"
dns_poweradmin__podman_db_dir: "{{ dns_poweradmin__podman_home }}/db"

dns_poweradmin__podman_container_default:
  name: "{{ dns_poweradmin__podman_name }}"
  hostname: "{{ dns_poweradmin__hostname }}"
  image: "{{ dns_poweradmin__podman_image }}:{{ dns_poweradmin__podman_tag }}"
  ip: "{{ dns_poweradmin__ip }}"
  ipv6: "{{ dns_poweradmin__ipv6 | default(omit) }}"
  network: "{{ dns_poweradmin__network }}"
  timezone: "{{ dns_poweradmin__timezone }}"
  # Set with poweradmin_environment and poweradmin_secrets, merged over the default
  environment: "{{ dns_poweradmin__environment | combine(dns_poweradmin__environment_secrets_files) }}"
  labels: "{{ dns_poweradmin__labels | default(omit) }}"
  secrets: >-
    {{ (dns_poweradmin__secrets | select('mapping') | selectattr('name', 'defined') | map(attribute='name')
        | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ dns_poweradmin__secrets_dir ~ '/\1') | list)
      if (dns_poweradmin__secrets is sequence and dns_poweradmin__secrets is not string and dns_poweradmin__secrets | length > 0)
      else omit }}
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ dns_poweradmin__podman_db_dir }}:/db"
