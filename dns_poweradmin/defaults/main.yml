---

dns_poweradmin__home: "{{ poweradmin_home | mandatory }}"
dns_poweradmin__ip: "{{ poweradmin_ip | mandatory }}"
dns_poweradmin__ipv6: "{{ poweradmin_ipv6 }}"
dns_poweradmin__network: "{{ poweradmin_network | mandatory }}"
dns_poweradmin__hostname: "{{ poweradmin_hostname | mandatory }}"
dns_poweradmin__timezone: "{{ poweradmin_timezone | mandatory }}"
dns_poweradmin__labels: "{{ poweradmin_labels | default({}) }}"

dns_poweradmin__db_host: "{{ poweradmin_db_host | mandatory }}"
dns_poweradmin__db_port: "{{ poweradmin_db_port | mandatory }}"
dns_poweradmin__db_user: "{{ poweradmin_db_user | default('poweradmin') }}"
dns_poweradmin__db_pass: "{{ poweradmin_db_pass | mandatory }}"
dns_poweradmin__db_name: "{{ poweradmin_db_name | default('powerdns') }}"
dns_poweradmin__db_type: "{{ poweradmin_db_type | default('sqlite') }}"
dns_poweradmin__db_charset: "{{ poweradmin_db_charset | default('latin1') }}"
dns_poweradmin__db_file: "{{ poweradmin_db_file | default('/db/pdns.db') }}"

dns_poweradmin__dns_ns1: "{{ poweradmin_dns_ns1 | mandatory }}"
dns_poweradmin__dns_ns2: "{{ poweradmin_dns_ns2 | mandatory }}"
dns_poweradmin__dns_ns3: "{{ poweradmin_dns_ns3 | default('') }}"
dns_poweradmin__dns_ns4: "{{ poweradmin_dns_ns4 | default('') }}"
dns_poweradmin__dns_hostmaster: "{{ poweradmin_dns_hostmaster | mandatory }}"

dns_poweradmin__pa_dns_ttl: "{{ poweradmin_pa_dns_ttl | default(86400) }}"
dns_poweradmin__pa_dns_soa_refresh: "{{ poweradmin_pa_dns_soa_refresh | default(28800) }}"
dns_poweradmin__pa_dns_soa_retry: "{{ poweradmin_pa_dns_soa_retry | default(7200) }}"
dns_poweradmin__pa_dns_soa_expire: "{{ poweradmin_pa_dns_soa_expire | default(604800) }}"
dns_poweradmin__pa_dns_soa_minimum: "{{ poweradmin_pa_dns_soa_minimum | default(86400) }}"
dns_poweradmin__pa_dns_zone_type_default: "{{ poweradmin_pa_dns_zone_type_default | default('MASTER') }}"

dns_poweradmin__pa_dns_strict_tld_check: "{{ poweradmin_pa_dns_strict_tld_check | default(false) }}"
dns_poweradmin__pa_dns_top_level_tld_check: "{{ poweradmin_pa_dns_top_level_tld_check | default(false) }}"
dns_poweradmin__pa_dns_third_level_check: "{{ poweradmin_pa_dns_third_level_check | default(false) }}"
dns_poweradmin__pa_dns_txt_auto_quote: "{{ poweradmin_pa_dns_txt_auto_quote | default(false) }}"
dns_poweradmin__pa_dns_prevent_duplicate_ptr: "{{ poweradmin_pa_dns_prevent_duplicate_ptr | default(true) }}"

dns_poweradmin__pa_dnssec_enabled: "{{ poweradmin_pa_dnssec_enabled | default(false) }}"
dns_poweradmin__pa_dnssec_debug: "{{ poweradmin_pa_dnssec_debug | default(false) }}"

dns_poweradmin__pa_session_key: "{{ poweradmin_pa_session_key | mandatory }}"

dns_poweradmin__pa_mfa_enabled: "{{ poweradmin_pa_mfa_enabled | default(false) }}"
dns_poweradmin__pa_mfa_app_enabled: "{{ poweradmin_pa_mfa_app_enabled | default(true) }}"
dns_poweradmin__pa_mfa_mail_enabled: "{{ poweradmin_pa_mfa_mail_enabled | default(true) }}"
dns_poweradmin__pa_mfa_recovery_codes: "{{ poweradmin_pa_mfa_recovery_codes | default(8) }}"
dns_poweradmin__pa_mfa_recovery_code_length: "{{ poweradmin_pa_mfa_recovery_code_length | default(10) }}"

dns_poweradmin__pa_api_enabled: "{{ poweradmin_pa_api_enabled | default(false) }}"
dns_poweradmin__pa_api_basic_auth_enabled: "{{ poweradmin_pa_api_basic_auth_enabled | default(false) }}"
dns_poweradmin__pa_api_docs_enabled: "{{ poweradmin_pa_api_docs_enabled | default(false) }}"

dns_poweradmin__pa_pdns_api_url: "{{ poweradmin_pa_pdns_api_url | default('') }}"
dns_poweradmin__pa_pdns_api_key: "{{ poweradmin_pa_pdns_api_key | default('') }}"
dns_poweradmin__pa_pdns_server_name: "{{ poweradmin_pa_pdns_server_name | default('') }}"

dns_poweradmin__pa_display_stats: "{{ poweradmin_pa_display_stats | default(false) }}"
dns_poweradmin__pa_timezone: "{{ dns_poweradmin__timezone }}"

dns_poweradmin__pa_whois_enabled: "{{ poweradmin_pa_whois_enabled | default(false) }}"
dns_poweradmin__pa_rdap_enabled: "{{ poweradmin_pa_rdap_enabled | default(false) }}"

dns_poweradmin__container: "{{ dns_poweradmin__podman_container_default | combine(poweradmin_container | default({})) }}"

dns_poweradmin__autoupdate_enabled: "{{ poweradmin_autoupdate_enabled | default(false) }}"

#
# podman defaults
#

dns_poweradmin__podman_name: 'poweradmin'
dns_poweradmin__podman_image: 'docker.io/poweradmin/poweradmin'
dns_poweradmin__podman_version: 'latest'

dns_poweradmin__podman_home: "{{ dns_poweradmin__home }}"
dns_poweradmin__podman_db_dir: "{{ dns_poweradmin__podman_home }}/db"
dns_poweradmin__podman_config_file: "{{ dns_poweradmin__podman_home }}/settings.php"

dns_poweradmin__podman_container_default:
  name: "{{ dns_poweradmin__podman_name }}"
  hostname: "{{ dns_poweradmin__hostname }}"
  image: "{{ dns_poweradmin__podman_image }}:{{ dns_poweradmin__podman_version }}"
  ip: "{{ dns_poweradmin__ip }}"
  ipv6: "{{ dns_poweradmin__ipv6 }}"
  network: "{{ dns_poweradmin__network }}"
  timezone: "{{ dns_poweradmin__timezone }}"
  environment:
    PA_CONFIG_PATH: '/config/custom.php'
  labels: "{{ dns_poweradmin__labels }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ dns_poweradmin__podman_db_dir }}:/db"
    - "{{ dns_poweradmin__podman_config_file }}:/config/custom.php"
  restart_policy: 'always'
