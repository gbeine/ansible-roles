---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/dns-poweradmin
#

dns_poweradmin__home: "{{ poweradmin_home | mandatory }}"
dns_poweradmin__ip: "{{ poweradmin_ip | mandatory }}"
dns_poweradmin__ipv6: "{{ poweradmin_ipv6 }}"
dns_poweradmin__network: "{{ poweradmin_network | mandatory }}"
dns_poweradmin__hostname: "{{ poweradmin_hostname | mandatory }}"
dns_poweradmin__timezone: "{{ poweradmin_timezone | mandatory }}"
dns_poweradmin__labels: "{{ poweradmin_labels | default({}) }}"

dns_poweradmin__version: "{{ poweradmin_version | default('stable') }}"

dns_poweradmin__publish: "{{ poweradmin_publish | default([]) }}"

dns_poweradmin__environment: "{{ dns_poweradmin__environment_default | combine(poweradmin_environment | default({})) }}"
dns_poweradmin__secrets: "{{ poweradmin_secrets | default([]) }}"

dns_poweradmin__container: "{{ dns_poweradmin__podman_container_default | combine(poweradmin_container | default({})) }}"

dns_poweradmin__autoupdate_enabled: "{{ poweradmin_autoupdate_enabled | default(false) }}"

#
# Defaults - do not change
#

dns_poweradmin__environment_default:
  DB_TYPE: 'sqlite'
  DB_FILE: '/db/pdns.db'
  PA_TIMEZONE: "{{ dns_poweradmin__timezone }}"

dns_poweradmin__environment_required:
  - 'DB_TYPE'
  - 'DNS_NS1'
  - 'DNS_NS2'
  - 'DNS_HOSTMASTER'

# Required for DB_TYPE mysql and pgsql
dns_poweradmin__environment_required_db:
  - 'DB_HOST'
  - 'DB_USER'
  - 'DB_NAME'
dns_poweradmin__secrets_required_db:
  - 'DB_PASS'

# Variables carrying secrets, they must be passed with poweradmin_secrets
dns_poweradmin__secret_variables:
  - 'DB_PASS'
  - 'PA_SESSION_KEY'
  - 'PA_ADMIN_PASSWORD'
  - 'PA_PDNS_API_KEY'
  - 'PA_PDNS_WEBSERVER_PASSWORD'
  - 'PA_SMTP_PASSWORD'
  - 'PA_RECAPTCHA_SECRET_KEY'
  - 'PA_LDAP_BIND_PASSWORD'
  - 'PA_OIDC_AZURE_CLIENT_SECRET'
  - 'PA_OIDC_GOOGLE_CLIENT_SECRET'
  - 'PA_OIDC_GENERIC_CLIENT_SECRET'
  - 'PA_SAML_SP_PRIVATE_KEY'
  - 'PA_HEALTH_TOKEN'

dns_poweradmin__uid: 82
dns_poweradmin__gid: 82

dns_poweradmin__podman_name: 'poweradmin'
dns_poweradmin__podman_image: 'docker.io/poweradmin/poweradmin'

dns_poweradmin__podman_home: "{{ dns_poweradmin__home }}"
dns_poweradmin__podman_db_dir: "{{ dns_poweradmin__podman_home }}/db"

dns_poweradmin__podman_container_default:
  name: "{{ dns_poweradmin__podman_name }}"
  hostname: "{{ dns_poweradmin__hostname }}"
  image: "{{ dns_poweradmin__podman_image }}:{{ dns_poweradmin__version }}"
  ip: "{{ dns_poweradmin__ip }}"
  ipv6: "{{ dns_poweradmin__ipv6 | default(omit) }}"
  network: "{{ dns_poweradmin__network }}"
  timezone: "{{ dns_poweradmin__timezone }}"
  environment: "{{ dns_poweradmin__environment }}"
  labels: "{{ dns_poweradmin__labels }}"
  secrets: >-
    {{ (dns_poweradmin__secrets | map(attribute='name') | zip(dns_poweradmin__secrets | map(attribute='target')) | map('join', ',type=env,target=') | list)
      if (dns_poweradmin__secrets | default([]) | length > 0)
      else omit }}
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ dns_poweradmin__podman_db_dir }}:/db"
  publish: "{{ dns_poweradmin__publish }}"
