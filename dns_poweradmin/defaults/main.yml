---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/dns-poweradmin
#

dns_poweradmin__home: "{{ poweradmin_home | mandatory }}"
dns_poweradmin__ip: "{{ poweradmin_ip | mandatory }}"
dns_poweradmin__ipv6: "{{ poweradmin_ipv6 }}"
dns_poweradmin__network: "{{ poweradmin_network | mandatory }}"
dns_poweradmin__hostname: "{{ poweradmin_hostname | mandatory }}"
dns_poweradmin__timezone: "{{ poweradmin_timezone | mandatory }}"
dns_poweradmin__labels: "{{ poweradmin_labels }}"

dns_poweradmin__version: "{{ poweradmin_version | default('stable') }}"

dns_poweradmin__environment: "{{ dns_poweradmin__environment_default | combine(poweradmin_environment | default({})) }}"
dns_poweradmin__secrets: "{{ poweradmin_secrets | default([]) }}"

dns_poweradmin__container: "{{ dns_poweradmin__podman_container_default | combine(poweradmin_container | default({})) }}"

dns_poweradmin__autoupdate_enabled: "{{ poweradmin_autoupdate_enabled | default(false) }}"
dns_poweradmin__autoupdate_schedule: "{{ poweradmin_autoupdate_schedule }}"

#
# Defaults - do not change
#

dns_poweradmin__environment_default:
  DB_TYPE: 'sqlite'
  DB_FILE: '/db/pdns.db'
  PA_TIMEZONE: "{{ dns_poweradmin__timezone }}"

dns_poweradmin__environment_required:
  - 'DB_TYPE'
  - 'DNS_NS1'
  - 'DNS_NS2'
  - 'DNS_HOSTMASTER'

# Required for DB_TYPE mysql and pgsql
dns_poweradmin__environment_required_db:
  - 'DB_HOST'
  - 'DB_USER'
  - 'DB_NAME'
dns_poweradmin__secrets_required_db:
  - 'DB_PASS'

# The targets of the secrets, they must not be set in poweradmin_environment
dns_poweradmin__secret_variables: "{{ dns_poweradmin__secret_files.keys() | list }}"

# The secrets are mounted as files, the image reads the variable target from <target>__FILE
dns_poweradmin__secret_files:
  DB_PASS: 'DB_PASS__FILE'
  PA_SESSION_KEY: 'PA_SESSION_KEY__FILE'
  PA_ADMIN_PASSWORD: 'PA_ADMIN_PASSWORD__FILE'
  PA_PDNS_API_KEY: 'PA_PDNS_API_KEY__FILE'
  PA_PDNS_WEBSERVER_PASSWORD: 'PA_PDNS_WEBSERVER_PASSWORD__FILE'
  PA_SMTP_PASSWORD: 'PA_SMTP_PASSWORD__FILE'
  PA_RECAPTCHA_SECRET_KEY: 'PA_RECAPTCHA_SECRET_KEY__FILE'
  PA_LDAP_BIND_PASSWORD: 'PA_LDAP_BIND_PASSWORD__FILE'
  PA_OIDC_AZURE_CLIENT_SECRET: 'PA_OIDC_AZURE_CLIENT_SECRET__FILE'
  PA_OIDC_GOOGLE_CLIENT_SECRET: 'PA_OIDC_GOOGLE_CLIENT_SECRET__FILE'
  PA_OIDC_GENERIC_CLIENT_SECRET: 'PA_OIDC_GENERIC_CLIENT_SECRET__FILE'
  PA_SAML_SP_PRIVATE_KEY: 'PA_SAML_SP_PRIVATE_KEY__FILE'

dns_poweradmin__secrets_dir: '/run/secrets'

# The environment variables of the files of the secrets, secrets with an unknown target are left out, the validation reports them
dns_poweradmin__environment_secrets_files: >-
  {%- set environment = {} -%}
  {%- if dns_poweradmin__secrets is sequence and dns_poweradmin__secrets is not string and dns_poweradmin__secrets is not mapping -%}
  {%-   for secret in dns_poweradmin__secrets
          if secret is mapping and secret.name is defined and secret.target is defined and secret.target in dns_poweradmin__secret_files -%}
  {%-     set _ = environment.update({ dns_poweradmin__secret_files[secret.target]: dns_poweradmin__secrets_dir ~ '/' ~ secret.name }) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ environment }}

# Generated from docker-entrypoint.sh of Poweradmin v4.4.3 (the tag stable), update with new versions of Poweradmin,
# without the internal variables of the script and the variables carrying secrets
