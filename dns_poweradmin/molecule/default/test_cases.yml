---
# Network created by container_podman in prepare.yml, shared by all test cases
dns_poweradmin__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

dns_poweradmin__test_image: 'docker.io/poweradmin/poweradmin:stable'

# Role variables shared by all test cases
dns_poweradmin__test_common:
  poweradmin_home: '/opt/poweradmin-molecule'
  poweradmin_ip: '10.89.0.10'
  poweradmin_network: 'podman-molecule'
  poweradmin_hostname: 'poweradmin-molecule'
  poweradmin_timezone: 'Europe/Berlin'
  poweradmin_environment:
    DNS_NS1: 'ns1.example.test'
    DNS_NS2: 'ns2.example.test'
    DNS_HOSTMASTER: 'hostmaster.example.test'
  poweradmin_secrets:
    - name: 'poweradmin_session_key'
      data: 'molecule-session-key-0123456789abcdef'
      target: 'PA_SESSION_KEY'

# Environment changed in side_effect.yml, the running service must be restarted
dns_poweradmin__test_side_effect_environment:
  PA_APP_TITLE: 'Molecule DNS Admin'

dns_poweradmin__test_cases:

  - name: 'molecule-poweradmin-ipv4-only'
    role_vars: {}
    expect:
      ip: '10.89.0.10'
      ip6: ~

  - name: 'molecule-poweradmin-ipv6'
    role_vars:
      poweradmin_ipv6: 'fd00:89::10'
    expect:
      ip: '10.89.0.10'
      ip6: 'fd00:89::10'
