---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/backup-timemachine
#

backup_timemachine__home: "{{ timemachine_home | mandatory }}"
backup_timemachine__ip: "{{ timemachine_ip }}"
backup_timemachine__ipv6: "{{ timemachine_ipv6 }}"
backup_timemachine__network: "{{ timemachine_network }}"
backup_timemachine__hostname: "{{ timemachine_hostname | mandatory }}"
backup_timemachine__timezone: "{{ timemachine_timezone | mandatory }}"
backup_timemachine__secrets: "{{ timemachine_secrets | default([]) }}"

backup_timemachine__version: "{{ timemachine_version | default('latest') }}"

backup_timemachine__container: "{{ backup_timemachine__podman_container_default | combine(timemachine_container | default({})) }}"

backup_timemachine__autoupdate_enabled: "{{ timemachine_autoupdate_enabled | default(false) }}"
backup_timemachine__autoupdate_schedule:  "{{ timemachine_autoupdate_schedule | default('*-*-* 02:00:00') }}"

backup_timemachine__advertised_hostname: "{{ timemachine_advertised_hostname }}"
backup_timemachine__username: "{{ timemachine_username | default('timemachine') }}"
backup_timemachine__groupname: "{{ timemachine_groupname | default('timemachine') }}"
backup_timemachine__volume_size: "{{ timemachine_volume_size | default(0) }}"
backup_timemachine__workgroup: "{{ timemachine_workgroup | default('WORKGROUP') }}"
backup_timemachine__users: "{{ timemachine_users | default([]) }}"
backup_timemachine__passwords: "{{ timemachine_passwords | default({}) }}"
backup_timemachine__interfaces: "{{ timemachine_interfaces | default([]) }}"

#
# Defaults - do not change
#

backup_timemachine__uid: 1000
backup_timemachine__gid: "{{ backup_timemachine__uid }}"

backup_timemachine__podman_name: 'timemachine'
backup_timemachine__podman_image: 'docker.io/mbentley/timemachine'
backup_timemachine__podman_tag: "{{ backup_timemachine__version }}"

backup_timemachine__podman_home: "{{ backup_timemachine__home }}"

backup_timemachine__podman_container_default:
  name: "{{ backup_timemachine__podman_name }}"
  hostname: "{{ backup_timemachine__hostname }}"
  image: "{{ backup_timemachine__podman_image }}:{{ backup_timemachine__podman_tag }}"
  ip: "{{ backup_timemachine__ip | default(omit) }}"
  ipv6: "{{ backup_timemachine__ipv6 | default(omit) }}"
  network: "{{ backup_timemachine__network | default('host') }}"
  timezone: "{{ backup_timemachine__timezone }}"
  environment:
    ADVERTISED_HOSTNAME: "{{ backup_timemachine__advertised_hostname | default(omit) }}"
    EXTERNAL_CONF: "{{ '/etc/samba/external' if (backup_timemachine__users | length > 0) else omit }}"
    TM_USERNAME: "{{ backup_timemachine__username }}"
    TM_GROUPNAME: "{{ backup_timemachine__groupname }}"
    TM_UID: "{{ backup_timemachine__uid }}"
    TM_GID: "{{ backup_timemachine__gid }}"
    VOLUME_SIZE_LIMIT: "{{ backup_timemachine__volume_size }}"
    WORKGROUP: "{{ backup_timemachine__workgroup }}"
    SET_PERMISSIONS: 'false'
  secrets: >-
    {{ (backup_timemachine__secrets | map(attribute='name') | zip(backup_timemachine__secrets | map(attribute='target')) | map('join', ',type=env,target=') | list)
      if (backup_timemachine__secrets | default([]) | length > 0)
      else omit }}
  tmpfs:
    /run/samba: ''
  volumes: >-
    {{
      [
        '/etc/timezone:/etc/timezone:ro',
        '/etc/localtime:/etc/localtime:ro',
        backup_timemachine__podman_home ~ '/opt:/opt:Z',
      ]
      +
      (
        [ backup_timemachine__podman_home ~ '/external:/etc/samba/external:ro,Z' ]
        if (backup_timemachine__users | length > 0)
        else []
      )
      +
      (
        [ backup_timemachine__podman_home ~ '/avahi-daemon.conf:/etc/avahi/avahi-daemon.conf:ro,Z' ]
        if (backup_timemachine__interfaces | length > 0)
        else []
      )
    }}

