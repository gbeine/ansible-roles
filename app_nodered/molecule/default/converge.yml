---
- name: 'Converge'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_nodered__test_case: "{{ app_nodered__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  pre_tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ app_nodered__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  tasks:

    - name: 'Run app_nodered'
      ansible.builtin.include_role:
        name: 'app_nodered'
