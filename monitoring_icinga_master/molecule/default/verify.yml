---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_icinga_master__test_case: "{{ monitoring_icinga_master__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_icinga_master__test_vars: "{{ monitoring_icinga_master__test_case.role_vars }}"
    monitoring_icinga_master__test_expect: "{{ monitoring_icinga_master__test_case.expect }}"
    monitoring_icinga_master__test_etc: "{{ monitoring_icinga_master__test_expect.home }}/etc/icinga2"

  tasks:

    - name: 'Read the generated quadlet unit'
      ansible.builtin.slurp:
        src: "{{ monitoring_icinga_master__test_quadlet_path }}"
      register: 'monitoring_icinga_master__test_quadlet'

    - name: 'Assert the quadlet unit'
      ansible.builtin.assert:
        that:
          - ('IP=' + monitoring_icinga_master__test_expect.ip) in monitoring_icinga_master__test_lines
          - monitoring_icinga_master__test_expect.quadlet | reject('in', monitoring_icinga_master__test_lines) | list | length == 0
          - >-
            monitoring_icinga_master__test_lines
            | select('search', monitoring_icinga_master__test_expect.quadlet_absent | map('regex_escape') | join('|')) | list | length == 0
          # The passwords are neither part of the quadlet unit nor of the environment
          - >-
            monitoring_icinga_master__test_expect.secrets | length == 0
            or monitoring_icinga_master__test_lines | select('search', monitoring_icinga_master__test_expect.secrets | join('|')) | list | length == 0
        fail_msg: "Quadlet: {{ monitoring_icinga_master__test_quadlet.content | b64decode }}"
      vars:
        monitoring_icinga_master__test_lines: "{{ (monitoring_icinga_master__test_quadlet.content | b64decode | regex_replace('\"', '')).splitlines() }}"

    - name: 'Find the enabled features'
      ansible.builtin.find:
        paths: "{{ monitoring_icinga_master__test_etc }}/features-enabled"
        patterns: [ '*' ]
        file_type: 'any'
      register: 'monitoring_icinga_master__test_features'

    - name: 'Assert the enabled features are files of the role'
      ansible.builtin.assert:
        that:
          - monitoring_icinga_master__test_names == monitoring_icinga_master__test_expect.features
          - monitoring_icinga_master__test_features.files | rejectattr('isreg') | list | length == 0
          - monitoring_icinga_master__test_features.files | rejectattr('uid', 'eq', 5665) | list | length == 0
          - monitoring_icinga_master__test_features.files | rejectattr('mode', 'eq', '0400') | list | length == 0
        fail_msg: >-
          features {{ monitoring_icinga_master__test_names }},
          files {{ monitoring_icinga_master__test_features.files | map(attribute='path') | list }}
      vars:
        monitoring_icinga_master__test_names: >-
          {{ monitoring_icinga_master__test_features.files | map(attribute='path') | map('basename') | map('regex_replace', '\.conf$', '') | sort }}

    - name: 'Read the files of the configuration'
      ansible.builtin.slurp:
        src: "{{ monitoring_icinga_master__test_etc }}/{{ item }}"
      loop: "{{ monitoring_icinga_master__test_expect.config.keys() | list }}"
      register: 'monitoring_icinga_master__test_files'

    - name: 'Assert the lines of the configuration'
      ansible.builtin.assert:
        that:
          - item.item in monitoring_icinga_master__test_expect.config
          - monitoring_icinga_master__test_missing | length == 0
        fail_msg: "{{ item.item }}: missing {{ monitoring_icinga_master__test_missing }} in {{ item.content | b64decode }}"
      loop: "{{ monitoring_icinga_master__test_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      vars:
        monitoring_icinga_master__test_missing: >-
          {{ monitoring_icinga_master__test_expect.config[item.item] | reject('in', (item.content | b64decode).splitlines()) | list }}

    # The secrets are only part of the podman secret, the configuration on the host references the constants
    - name: 'Search the passwords in the files of the role'
      when: monitoring_icinga_master__test_expect.secrets | length > 0
      ansible.builtin.command:
        argv: [ 'grep', '-rlE', "{{ monitoring_icinga_master__test_expect.secrets | join('|') }}", "{{ monitoring_icinga_master__test_expect.home }}/etc" ]
      register: 'monitoring_icinga_master__test_grep'
      changed_when: false
      failed_when: monitoring_icinga_master__test_grep.rc != 1

    - name: 'Read the state of the Icinga service'
      ansible.builtin.command: 'systemctl is-active icinga-master'
      register: 'monitoring_icinga_master__test_service'
      changed_when: false
      failed_when: false
      until: monitoring_icinga_master__test_service.stdout == 'active'
      retries: 10
      delay: 3

    - name: 'Assert the Icinga service is active'
      ansible.builtin.assert:
        that:
          - monitoring_icinga_master__test_service.stdout == 'active'
        fail_msg: "Service: {{ monitoring_icinga_master__test_service.stdout }}"

    - name: 'Validate the configuration with Icinga'
      ansible.builtin.command:
        argv: [ 'podman', 'exec', 'icinga-master', 'icinga2', 'daemon', '-C' ]
      register: 'monitoring_icinga_master__test_check'
      changed_when: false
      failed_when: monitoring_icinga_master__test_check.rc != 0

    - name: 'Read the secret of the constants and the environment in the container'
      ansible.builtin.command:
        argv: [ 'podman', 'exec', 'icinga-master', 'sh', '-c',
                'stat -c "%a %u" /run/secrets/icinga-master-config 2>/dev/null || echo missing; env' ]
      register: 'monitoring_icinga_master__test_container'
      changed_when: false

    - name: 'Assert the secret of the constants and the environment'
      ansible.builtin.assert:
        that:
          - >-
            monitoring_icinga_master__test_container.stdout_lines[0]
            == ('400 5665' if monitoring_icinga_master__test_expect.secrets | length > 0 else 'missing')
          - >-
            monitoring_icinga_master__test_expect.secrets | length == 0
            or monitoring_icinga_master__test_container.stdout is not search(monitoring_icinga_master__test_expect.secrets | join('|'))
          - monitoring_icinga_master__test_container.stdout is not search('ICINGA_MASTER')
        fail_msg: "Secret: {{ monitoring_icinga_master__test_container.stdout_lines[0] }}, the environment contains a password or ICINGA_MASTER"

    # /data comes from the image, the role mounts its configuration and the state only
    - name: 'Read the files of the image and the enabled features in the container'
      ansible.builtin.command:
        argv: [ 'podman', 'exec', 'icinga-master', 'sh', '-c',
                'test -x /etc/icinga2/scripts/mail-host-notification.sh && test -x /etc/icinga2/scripts/mail-service-notification.sh && echo scripts;
                 command -v mail >/dev/null && echo mail;
                 test -f /etc/icinga2/features-available/checker.conf && echo available;
                 ls /etc/icinga2/features-enabled | sed "s/\\.conf$//" | sort | tr "\\n" " "' ]
      register: 'monitoring_icinga_master__test_image'
      changed_when: false

    - name: 'Assert the files of the image and the enabled features in the container'
      ansible.builtin.assert:
        that:
          - monitoring_icinga_master__test_image.stdout_lines[:3] == [ 'scripts', 'mail', 'available' ]
          - monitoring_icinga_master__test_image.stdout_lines[3] | trim == monitoring_icinga_master__test_expect.features | join(' ')
        fail_msg: "Container: {{ monitoring_icinga_master__test_image.stdout_lines }}"

    - name: 'Request the API without login'
      ansible.builtin.uri:
        url: "https://{{ monitoring_icinga_master__test_expect.ip }}:5665/v1/status"
        validate_certs: false
        status_code: [ 401 ]

    - name: 'Request the hosts with the API user'
      when: monitoring_icinga_master__test_expect.api_user is not none
      ansible.builtin.uri:
        url: "https://{{ monitoring_icinga_master__test_expect.ip }}:5665/v1/objects/hosts"
        url_username: "{{ monitoring_icinga_master__test_expect.api_user }}"
        url_password: "{{ monitoring_icinga_master__test_expect.api_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: 'monitoring_icinga_master__test_hosts'

    - name: 'Assert the API returns the host of the test case'
      when: monitoring_icinga_master__test_expect.api_user is not none
      ansible.builtin.assert:
        that:
          - "'molecule-host' in (monitoring_icinga_master__test_hosts.json.results | map(attribute='name') | list)"
        fail_msg: "Hosts: {{ monitoring_icinga_master__test_hosts.json.results | map(attribute='name') | list }}"

    # Icinga writes the objects to Redis after the login with the password of the secret
    - name: 'Read the objects of Icinga in Redis'
      when: "'icingadb' in monitoring_icinga_master__test_expect.features"
      ansible.builtin.command:
        argv: [ 'podman', 'exec', '-e', "REDISCLI_AUTH={{ monitoring_icinga_master__test_redis.password }}",
                "{{ monitoring_icinga_master__test_redis.name }}", 'redis-cli', 'HKEYS', 'icinga:host' ]
      register: 'monitoring_icinga_master__test_redis_hosts'
      changed_when: false
      until: monitoring_icinga_master__test_redis_hosts.stdout_lines | length > 0
      retries: 20
      delay: 3
      failed_when: false

    - name: 'Assert Icinga writes to Redis'
      when: "'icingadb' in monitoring_icinga_master__test_expect.features"
      ansible.builtin.assert:
        that:
          - monitoring_icinga_master__test_redis_hosts.stdout_lines | length > 0
        fail_msg: "Redis: {{ monitoring_icinga_master__test_redis_hosts.stdout }} {{ monitoring_icinga_master__test_redis_hosts.stderr }}"

    - name: 'Read the overrides of pki_update'
      ansible.builtin.slurp:
        src: "/etc/systemd/system/pki-update@icinga-master.{{ item }}.d/override.conf"
      loop: [ 'service', 'timer' ]
      register: 'monitoring_icinga_master__test_pki_update'

    - name: 'Read the state of the timer of pki_update'
      ansible.builtin.command: 'systemctl is-active pki-update@icinga-master.timer'
      register: 'monitoring_icinga_master__test_pki_update_timer'
      changed_when: false
      failed_when: false

    - name: 'Read the owner and mode of the key'
      ansible.builtin.stat:
        path: "{{ monitoring_icinga_master__test_expect.home }}/lib/certs/{{ monitoring_icinga_master__test_vars.icinga_master_node_name }}.key"
      register: 'monitoring_icinga_master__test_key'

    # install of ExecStartPre sets owner and mode, pki_update restarts Icinga after a renewal of fullchain.pem
    - name: 'Assert the key and the timer of pki_update'
      ansible.builtin.assert:
        that:
          - monitoring_icinga_master__test_key.stat.uid == 5665
          - monitoring_icinga_master__test_key.stat.mode == '0400'
          - monitoring_icinga_master__test_pki_update_timer.stdout == 'active'
          - ('Environment=PKI_CERTIFICATE=' ~ monitoring_icinga_master__test_expect.pki_certificate) in monitoring_icinga_master__test_lines[0]
          - ('OnCalendar=' ~ monitoring_icinga_master__test_expect.schedule) in monitoring_icinga_master__test_lines[1]
        fail_msg: >-
          key {{ monitoring_icinga_master__test_key.stat.uid | default('absent') }} {{ monitoring_icinga_master__test_key.stat.mode | default('') }},
          timer {{ monitoring_icinga_master__test_pki_update_timer.stdout }}, overrides {{ monitoring_icinga_master__test_lines }}
      vars:
        monitoring_icinga_master__test_lines: "{{ monitoring_icinga_master__test_pki_update.results | map(attribute='content') | map('b64decode') | map('split', '\n') | list }}"
