---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-icinga-agent
#

monitoring_icinga_master__use_podman: "{{ icinga_master_use_podman | default(true) }}"

monitoring_icinga_master__home: "{{ icinga_master_home | mandatory }}"
monitoring_icinga_master__ip: "{{ icinga_master_ip | mandatory }}"
monitoring_icinga_master__ipv6: "{{ icinga_master_ipv6 | default('') }}"
monitoring_icinga_master__network: "{{ icinga_master_network | mandatory }}"
monitoring_icinga_master__hostname: "{{ icinga_master_hostname | mandatory }}"
monitoring_icinga_master__timezone: "{{ icinga_master_timezone | mandatory }}"

monitoring_icinga_master__container: "{{ monitoring_icinga_master__podman_container_default | combine(icinga_master_container | default({})) }}"

monitoring_icinga_master__node_name: "{{ icinga_master_node_name | mandatory }}"
monitoring_icinga_master__zone_name: "{{ icinga_master_zone_name | mandatory }}"
monitoring_icinga_master__ticket_salt: "{{ icinga_master_ticket_salt | mandatory }}"

monitoring_icinga_master__zones: "{{ icinga_master_zones | default([]) }}"
monitoring_icinga_master__zone_hosts: "{{ icinga_master_zone_hosts | default({}) }}"
monitoring_icinga_master__zone_services: "{{ icinga_master_zone_services | default({}) }}"

monitoring_icinga_master__api_accept_config: "{{ icinga_master_api_accept_config | default(false) }}"
monitoring_icinga_master__api_accept_commands: "{{ icinga_master_api_accept_commands | default(false) }}"
monitoring_icinga_master__api_bind_host: "{{ icinga_master_api_bind_host | default('0.0.0.0') }}"
monitoring_icinga_master__api_bind_port: "{{ icinga_master_api_bind_port | default(5665) }}"
monitoring_icinga_master__debug_log_file: "{{ icinga_master_debug_log_file | default('/var/log/icinga2/debug.log') }}"
monitoring_icinga_master__debug_log_severity: "{{ icinga_master_debug_log_severity | default('debug') }}"
monitoring_icinga_master__icingadb_host: "{{ icinga_master_icingadb_host | default('127.0.0.1') }}"
monitoring_icinga_master__icingadb_port: "{{ icinga_master_icingadb_port | default(6380) }}"
monitoring_icinga_master__icingadb_password: "{{ icinga_master_icingadb_password | default('') }}"
monitoring_icinga_master__influxdb_host: "{{ icinga_master_influxdb_host | default('127.0.0.1') }}"
monitoring_icinga_master__influxdb_port: "{{ icinga_master_influxdb_port | default(8086) }}"
monitoring_icinga_master__influxdb_organization: "{{ icinga_master_influxdb_organization | default('monitoring') }}"
monitoring_icinga_master__influxdb_bucket: "{{ icinga_master_influxdb_bucket | default('icinga2') }}"
monitoring_icinga_master__influxdb_auth_token: "{{ icinga_master_influxdb_auth_token | default('') }}"
monitoring_icinga_master__main_log_file: "{{ icinga_master_main_log_file | default('/var/log/icinga2/icinga2.log') }}"
monitoring_icinga_master__main_log_severity: "{{ icinga_master_main_log_severity | default('information') }}"

monitoring_icinga_master__api_users: "{{ icinga_master_api_users | default([]) }}"
monitoring_icinga_master__commands: "{{ icinga_master_commands | default([]) }}"
monitoring_icinga_master__host_dependencies: "{{ icinga_master_host_dependencies | default([]) }}"
monitoring_icinga_master__host_groups: "{{ icinga_master_host_groups | default([]) }}"
monitoring_icinga_master__hosts: "{{ icinga_master_hosts | default([]) }}"
monitoring_icinga_master__notifications: "{{ icinga_master_notifications | default([]) }}"
monitoring_icinga_master__service_dependencies: "{{ icinga_master_service_dependencies | default([]) }}"
monitoring_icinga_master__service_groups: "{{ icinga_master_service_groups | default([]) }}"
monitoring_icinga_master__services: "{{ icinga_master_services | default([]) }}"
monitoring_icinga_master__templates: "{{ icinga_master_templates | default([]) }}"
monitoring_icinga_master__timeperiods: "{{ icinga_master_timeperiods | default([]) }}"
monitoring_icinga_master__user_groups: "{{ icinga_master_user_groups | default([]) }}"
monitoring_icinga_master__users: "{{ icinga_master_users | default([]) }}"

monitoring_icinga_master__cert_source_dir: "{{ icinga_cert_source_dir | default('') }}"
monitoring_icinga_master__cert_source_ca_file: "{{ icinga_cert_ca_file | default(monitoring_icinga_master__cert_source_dir + '/' + monitoring_icinga_master__node_name  + '/chain.pem') }}"
monitoring_icinga_master__cert_source_cert_file: "{{ monitoring_icinga_master__cert_source_dir }}/{{ monitoring_icinga_master__node_name }}/fullchain.pem"
monitoring_icinga_master__cert_source_key_file: "{{ monitoring_icinga_master__cert_source_dir }}/{{ monitoring_icinga_master__node_name }}/privkey.pem"

monitoring_icinga_master__features_enabled: "{{ icinga_master_features_enabled | default(monitoring_icinga_master__features_enabled_default) }}"
monitoring_icinga_master__features_disabled: "{{ icinga_master_features_disabled | default(monitoring_icinga_master__features_disabled_default) }}"

#
# Defaults - do not change
#

monitoring_icinga_master__uid: 5665
monitoring_icinga_master__gid: "{{ monitoring_icinga_master__uid }}"

monitoring_icinga_master__podman_name: 'icinga-master'
monitoring_icinga_master__podman_image: 'docker.io/icinga/icinga2'
monitoring_icinga_master__podman_tag: "{{ icinga_master_podman_tag | default('latest') }}"

monitoring_icinga_master__podman_home: "{{ monitoring_icinga_master__home }}"

monitoring_icinga_master__data_dir: "{{ monitoring_icinga_master__home }}/data"
monitoring_icinga_master__cert_dir: "{{ monitoring_icinga_master__data_dir }}/var/lib/icinga2/certs"
monitoring_icinga_master__etc_dir: "{{ monitoring_icinga_master__data_dir }}/etc/icinga2"
monitoring_icinga_master__log_dir: "{{ monitoring_icinga_master__data_dir }}/var/log/icinga2"
monitoring_icinga_master__plugins_dir: "{{ monitoring_icinga_master__home }}/plugins"

monitoring_icinga_master__features_disabled_default:
  - 'command.conf'
  - 'compatlog.conf'
  - 'debuglog.conf'
  - 'elasticsearch.conf'
  - 'gelf.conf'
  - 'graphite.conf'
  - 'icingadb.conf'
  - 'ido-mysql.conf'
  - 'ido-pgsql.conf'
  - 'influxdb.conf'
  - 'influxdb2.conf'
  - 'journald.conf'
  - 'livestatus.conf'
  - 'opentsdb.conf'
  - 'perfdata.conf'
  - 'syslog.conf'

monitoring_icinga_master__features_enabled_default:
  - 'api.conf'
  - 'checker.conf'
  - 'mainlog.conf'
  - 'notification.conf'

monitoring_icinga_master__podman_container_default:
  name: "{{ monitoring_icinga_master__podman_name }}"
  hostname: "{{ monitoring_icinga_master__hostname }}"
  image: "{{ monitoring_icinga_master__podman_image }}:{{ monitoring_icinga_master__podman_tag }}"
  ip: "{{ monitoring_icinga_master__ip }}"
  ipv6: "{{ monitoring_icinga_master__ipv6 }}"
  network: "{{ monitoring_icinga_master__network }}"
  cap_add:
    - 'NET_RAW'
  env:
    ICINGA_MASTER: 1
  timezone: "{{ monitoring_icinga_master__timezone }}"
  volumes:
    - '/etc/localtime:/etc/localtime:ro'
    - '/etc/timezone:/etc/timezone:ro'
    - "{{ monitoring_icinga_master__data_dir }}:/data"
    - "{{ monitoring_icinga_master__plugins_dir }}:/usr/local/lib/nagios/plugins:ro"
