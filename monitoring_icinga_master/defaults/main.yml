---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-icinga-master
#

monitoring_icinga_master__home: "{{ icinga_master_home | mandatory }}"
monitoring_icinga_master__ip: "{{ icinga_master_ip | mandatory }}"
monitoring_icinga_master__ipv6: "{{ icinga_master_ipv6 }}"
monitoring_icinga_master__network: "{{ icinga_master_network | mandatory }}"
monitoring_icinga_master__hostname: "{{ icinga_master_hostname | mandatory }}"
monitoring_icinga_master__timezone: "{{ icinga_master_timezone | mandatory }}"

monitoring_icinga_master__version: "{{ icinga_master_version | default('latest') }}"

monitoring_icinga_master__container: "{{ monitoring_icinga_master__podman_container_default | combine(icinga_master_container | default({})) }}"

# Variables of the image, the features of Icinga are set with icinga_master_config
monitoring_icinga_master__environment: "{{ icinga_master_environment }}"

# Secrets with name, data and target, the target is feature.attribute (e.g. icingadb.password)
# or api_users.<name>.password, the role writes them as constants Secret_<name> to the podman secret <container name>-config
monitoring_icinga_master__secrets: "{{ icinga_master_secrets | default([]) }}"

# The features of Icinga: a dictionary of the attributes of the object of the feature enables it, null or false disables it
monitoring_icinga_master__config: "{{ monitoring_icinga_master__config_default | combine(icinga_master_config | default({}), recursive=true) }}"

monitoring_icinga_master__node_name: "{{ icinga_master_node_name | mandatory }}"
monitoring_icinga_master__zone_name: "{{ icinga_master_zone_name | mandatory }}"

monitoring_icinga_master__zones: "{{ icinga_master_zones | default([]) }}"
monitoring_icinga_master__zone_hosts: "{{ icinga_master_zone_hosts | default({}) }}"
monitoring_icinga_master__zone_services: "{{ icinga_master_zone_services | default({}) }}"

monitoring_icinga_master__api_users: "{{ icinga_master_api_users | default([]) }}"
monitoring_icinga_master__commands: "{{ icinga_master_commands | default(monitoring_icinga_master__commands_default) }}"
monitoring_icinga_master__host_dependencies: "{{ icinga_master_host_dependencies | default([]) }}"
monitoring_icinga_master__host_groups: "{{ icinga_master_host_groups | default([]) }}"
monitoring_icinga_master__hosts: "{{ icinga_master_hosts | default([]) }}"
monitoring_icinga_master__notifications: "{{ icinga_master_notifications | default([]) }}"
monitoring_icinga_master__service_dependencies: "{{ icinga_master_service_dependencies | default([]) }}"
monitoring_icinga_master__service_groups: "{{ icinga_master_service_groups | default([]) }}"
monitoring_icinga_master__services: "{{ icinga_master_services | default([]) }}"
monitoring_icinga_master__templates: "{{ icinga_master_templates | default([]) }}"
monitoring_icinga_master__timeperiods: "{{ icinga_master_timeperiods | default([]) }}"
monitoring_icinga_master__user_groups: "{{ icinga_master_user_groups | default([]) }}"
monitoring_icinga_master__users: "{{ icinga_master_users | default([]) }}"

monitoring_icinga_master__cert_source_dir: "{{ icinga_cert_source_dir | mandatory }}"
monitoring_icinga_master__cert_source_ca_file: "{{ icinga_cert_ca_file | default(monitoring_icinga_master__cert_source_dir + '/' + monitoring_icinga_master__node_name + '/chain.pem') }}"
monitoring_icinga_master__cert_source_cert_file: "{{ monitoring_icinga_master__cert_source_dir }}/{{ monitoring_icinga_master__node_name }}/fullchain.pem"
monitoring_icinga_master__cert_source_key_file: "{{ monitoring_icinga_master__cert_source_dir }}/{{ monitoring_icinga_master__node_name }}/privkey.pem"

monitoring_icinga_master__autoupdate_enabled: "{{ icinga_master_autoupdate_enabled | default(false) }}"
monitoring_icinga_master__autoupdate_schedule: "{{ icinga_master_autoupdate_schedule }}"

# The timer of pki_update restarts Icinga after a renewal of the certificate
monitoring_icinga_master__pki_update_enabled: "{{ icinga_master_pki_update_enabled | default(true) }}"
monitoring_icinga_master__pki_update_schedule: "{{ icinga_master_pki_update_schedule | default('*-*-* 00/4:00:00') }}"

#
# Defaults - do not change
#

# The features enabled by the former versions of the role, the attributes are the former defaults
monitoring_icinga_master__config_default:
  api:
    accept_config: false
    accept_commands: false
    bind_host: '0.0.0.0'
    bind_port: 5665
  checker: {}
  mainlog:
    severity: 'information'
    path: '/var/log/icinga2/icinga2.log'
  notification: {}

monitoring_icinga_master__uid: 5665
monitoring_icinga_master__gid: "{{ monitoring_icinga_master__uid }}"

monitoring_icinga_master__podman_name: 'icinga-master'
monitoring_icinga_master__podman_image: 'docker.io/icinga/icinga2'
monitoring_icinga_master__podman_tag: "{{ monitoring_icinga_master__version | default('latest') }}"

monitoring_icinga_master__lib_dir: "{{ monitoring_icinga_master__home }}/lib"
monitoring_icinga_master__log_dir: "{{ monitoring_icinga_master__home }}/log"
monitoring_icinga_master__spool_dir: "{{ monitoring_icinga_master__home }}/spool"
monitoring_icinga_master__tmp_dir: "{{ monitoring_icinga_master__home }}/tmp"
monitoring_icinga_master__cert_dir: "{{ monitoring_icinga_master__lib_dir }}/certs"
monitoring_icinga_master__etc_dir: "{{ monitoring_icinga_master__home }}/etc"
monitoring_icinga_master__plugins_dir: "{{ monitoring_icinga_master__home }}/plugins"

# The directories of the role, /data of the container comes from the image (e.g. the scripts of the notifications)
monitoring_icinga_master__data_dirs:
  - "{{ monitoring_icinga_master__lib_dir }}"
  - "{{ monitoring_icinga_master__cert_dir }}"
  - "{{ monitoring_icinga_master__log_dir }}"
  - "{{ monitoring_icinga_master__spool_dir }}"
  - "{{ monitoring_icinga_master__etc_dir }}"
  - "{{ monitoring_icinga_master__etc_dir }}/features-enabled"
  - "{{ monitoring_icinga_master__etc_dir }}/conf.d"
  - "{{ monitoring_icinga_master__etc_dir }}/conf.d/commands"
  - "{{ monitoring_icinga_master__etc_dir }}/zones.d"

# The files and directories of the configuration of the role, mounted read-only to /etc (/data/etc/icinga2) of the container
monitoring_icinga_master__etc_mounts:
  - 'icinga2.conf'
  - 'constants.conf'
  - 'zones.conf'
  - 'endpoints.conf'
  - 'conf.d'
  - 'features-enabled'
  - 'zones.d'

# The files of the configuration in etc, the features are written to features-enabled
monitoring_icinga_master__config_files:
  - 'constants.conf'
  - 'endpoints.conf'
  - 'icinga2.conf'
  - 'zones.conf'
  - 'conf.d/api-users.conf'
  - 'conf.d/app.conf'
  - 'conf.d/commands.conf'
  - 'conf.d/host_dependencies.conf'
  - 'conf.d/host_groups.conf'
  - 'conf.d/hosts.conf'
  - 'conf.d/notifications.conf'
  - 'conf.d/service_dependencies.conf'
  - 'conf.d/service_groups.conf'
  - 'conf.d/services.conf'
  - 'conf.d/templates.conf'
  - 'conf.d/timeperiods.conf'
  - 'conf.d/user_groups.conf'
  - 'conf.d/users.conf'
  - 'conf.d/commands/check_certexp.conf'
  - 'conf.d/commands/check_container_stats_docker.conf'
  - 'conf.d/commands/check_container_stats_podman.conf'
  - 'conf.d/commands/check_ide_smart.conf'
  - 'conf.d/commands/check_smartpl.conf'
  - 'conf.d/commands/check_nginx_status.conf'
  - 'conf.d/commands/check_pass_alive.conf'
  - 'conf.d/commands/check_pgactivity.conf'
  - 'conf.d/commands/check_phpfpm_status.conf'
  - 'conf.d/commands/check_raid.conf'
  - 'conf.d/commands/check_reboot.conf'
  - 'conf.d/commands/pushover.conf'
  - 'conf.d/commands/rocketchat.conf'

# The enabled features, the keys of icinga_master_config with a dictionary
monitoring_icinga_master__features_enabled: >-
  {{ monitoring_icinga_master__config | dict2items | selectattr('value', 'mapping') | map(attribute='key') | list }}

# The object of every feature as in etc/features-available of Icinga 2 v2.16.0
monitoring_icinga_master__features:
  api: { type: 'ApiListener', name: 'api' }
  checker: { type: 'CheckerComponent', name: 'checker' }
  command: { type: 'ExternalCommandListener', name: 'command' }
  compatlog: { type: 'CompatLogger', name: 'compatlog' }
  debuglog: { type: 'FileLogger', name: 'debug-file' }
  elasticsearch: { type: 'ElasticsearchWriter', name: 'elasticsearch' }
  gelf: { type: 'GelfWriter', name: 'gelf' }
  graphite: { type: 'GraphiteWriter', name: 'graphite' }
  icingadb: { type: 'IcingaDB', name: 'icingadb' }
  influxdb: { type: 'InfluxdbWriter', name: 'influxdb' }
  influxdb2: { type: 'Influxdb2Writer', name: 'influxdb2' }
  journald: { type: 'JournaldLogger', name: 'journald' }
  livestatus: { type: 'LivestatusListener', name: 'livestatus' }
  mainlog: { type: 'FileLogger', name: 'main-log' }
  notification: { type: 'NotificationComponent', name: 'notification' }
  opentsdb: { type: 'OpenTsdbWriter', name: 'opentsdb' }
  perfdata: { type: 'PerfdataWriter', name: 'perfdata' }
  syslog: { type: 'SyslogLogger', name: 'syslog' }

# The former variables of the role and their replacement
monitoring_icinga_master__former_variables:
  icinga_master_api_accept_config: 'api.accept_config'
  icinga_master_api_accept_commands: 'api.accept_commands'
  icinga_master_api_bind_host: 'api.bind_host'
  icinga_master_api_bind_port: 'api.bind_port'
  icinga_master_debug_log_file: 'debuglog.path'
  icinga_master_debug_log_severity: 'debuglog.severity'
  icinga_master_icingadb_host: 'icingadb.host'
  icinga_master_icingadb_port: 'icingadb.port'
  icinga_master_icingadb_password: 'the secret icingadb.password'
  icinga_master_influxdb_host: 'influxdb2.host'
  icinga_master_influxdb_port: 'influxdb2.port'
  icinga_master_influxdb_organization: 'influxdb2.organization'
  icinga_master_influxdb_bucket: 'influxdb2.bucket'
  icinga_master_influxdb_auth_token: 'the secret influxdb2.auth_token'
  icinga_master_influxdb_send_metadata: 'influxdb2.enable_send_metadata'
  icinga_master_influxdb_send_thresholds: 'influxdb2.enable_send_thresholds'
  icinga_master_main_log_file: 'mainlog.path'
  icinga_master_main_log_severity: 'mainlog.severity'
  icinga_master_features_enabled: 'the keys of icinga_master_config'
  icinga_master_features_disabled: 'null for the feature in icinga_master_config'
  icinga_master_ticket_salt: 'the secret api.ticket_salt'

# Names of secrets, they are names of constants of Icinga
monitoring_icinga_master__name_pattern: '^[A-Za-z_][A-Za-z0-9_]*$'

monitoring_icinga_master__environment_allowed: [ 'ICINGA_LOG_LEVEL' ]

# The secrets are constants in the podman secret <container name>-config, Icinga includes it from icinga2.conf
monitoring_icinga_master__secrets_dir: '/run/secrets'
monitoring_icinga_master__config_secret: "{{ monitoring_icinga_master__container.name }}-config"
monitoring_icinga_master__config_secret_mount: >-
  type=mount,target={{ monitoring_icinga_master__secrets_dir }}/{{ monitoring_icinga_master__config_secret }},uid={{ monitoring_icinga_master__uid }},gid={{ monitoring_icinga_master__gid }},mode=0400

# The constant of every target of a secret, e.g. { 'icingadb.password': 'Secret_icinga_icingadb' }
monitoring_icinga_master__secret_constants: >-
  {{ dict(monitoring_icinga_master__secrets | map(attribute='target')
          | zip(monitoring_icinga_master__secrets | map(attribute='name') | map('regex_replace', '^', 'Secret_'))) }}

monitoring_icinga_master__podman_container_default:
  name: "{{ monitoring_icinga_master__podman_name }}"
  hostname: "{{ monitoring_icinga_master__hostname }}"
  image: "{{ monitoring_icinga_master__podman_image }}:{{ monitoring_icinga_master__podman_tag }}"
  ip: "{{ monitoring_icinga_master__ip }}"
  ipv6: "{{ monitoring_icinga_master__ipv6 | default(omit) }}"
  network: "{{ monitoring_icinga_master__network }}"
  timezone: "{{ monitoring_icinga_master__timezone }}"
  environment: "{{ monitoring_icinga_master__environment | default(omit) }}"
  cap_add:
    - 'NET_RAW'
  # icinga_master_container.volumes replaces the list completely
  volumes: >-
    {{ [ monitoring_icinga_master__lib_dir ~ ':/data/var/lib/icinga2',
         monitoring_icinga_master__log_dir ~ ':/data/var/log/icinga2',
         monitoring_icinga_master__spool_dir ~ ':/data/var/spool/icinga2' ]
       + (monitoring_icinga_master__etc_mounts | map('regex_replace', '^(.*)$', monitoring_icinga_master__etc_dir ~ '/\1:/data/etc/icinga2/\1:ro') | list)
       + [ monitoring_icinga_master__tmp_dir ~ ':/tmp',
           monitoring_icinga_master__plugins_dir ~ ':/usr/local/lib/nagios/plugins:ro' ] }}
  # Installs the certificates on every start, install follows the links of the source and sets owner and mode.
  # A renewed certificate is used after the next restart, the timer of pki_update restarts Icinga after a renewal.
  # The image runs the node setup only without ca.crt, the role configures the node itself.
  exec_start_pre:
    - "install -o {{ monitoring_icinga_master__uid }} -g {{ monitoring_icinga_master__gid }} -m 0644 {{ monitoring_icinga_master__cert_source_ca_file }} {{ monitoring_icinga_master__cert_dir }}/ca.crt"
    - "install -o {{ monitoring_icinga_master__uid }} -g {{ monitoring_icinga_master__gid }} -m 0644 {{ monitoring_icinga_master__cert_source_cert_file }} {{ monitoring_icinga_master__cert_dir }}/{{ monitoring_icinga_master__node_name }}.crt"
    - "install -o {{ monitoring_icinga_master__uid }} -g {{ monitoring_icinga_master__gid }} -m 0400 {{ monitoring_icinga_master__cert_source_key_file }} {{ monitoring_icinga_master__cert_dir }}/{{ monitoring_icinga_master__node_name }}.key"

# Generated from lib/*/*.ti of Icinga 2 v2.16.0, update with new versions of Icinga 2:
# the attributes of the object of every feature (without deprecated attributes and without the secrets)
monitoring_icinga_master__config_allowed:
  api: [ 'crl_path', 'cipher_list', 'tls_protocolmin', 'bind_host', 'bind_port', 'accept_config', 'accept_commands', 'max_anonymous_clients', 'connect_timeout', 'access_control_allow_origin', 'http_response_headers' ]
  checker: []
  command: [ 'command_path' ]
  compatlog: [ 'log_dir', 'rotation_method' ]
  debuglog: [ 'severity', 'path' ]
  elasticsearch: [ 'host', 'port', 'index', 'enable_send_perfdata', 'username', 'enable_tls', 'host_tags_template', 'service_tags_template', 'insecure_noverify', 'ca_path', 'cert_path', 'key_path', 'disconnect_timeout', 'flush_interval', 'flush_threshold', 'enable_ha' ]
  gelf: [ 'host', 'port', 'source', 'enable_send_perfdata', 'disconnect_timeout', 'enable_ha', 'enable_tls', 'insecure_noverify', 'ca_path', 'cert_path', 'key_path' ]
  graphite: [ 'host', 'port', 'host_name_template', 'service_name_template', 'enable_send_thresholds', 'enable_send_metadata', 'disconnect_timeout', 'enable_ha' ]
  icingadb: [ 'host', 'port', 'path', 'username', 'db_index', 'enable_tls', 'insecure_noverify', 'cert_path', 'key_path', 'ca_path', 'crl_path', 'cipher_list', 'tls_protocolmin', 'connect_timeout' ]
  influxdb: [ 'host', 'port', 'ssl_enable', 'ssl_insecure_noverify', 'ssl_ca_cert', 'ssl_cert', 'ssl_key', 'host_template', 'service_template', 'disconnect_timeout', 'enable_send_thresholds', 'enable_send_metadata', 'flush_interval', 'flush_threshold', 'enable_ha', 'database', 'username' ]
  influxdb2: [ 'host', 'port', 'ssl_enable', 'ssl_insecure_noverify', 'ssl_ca_cert', 'ssl_cert', 'ssl_key', 'host_template', 'service_template', 'disconnect_timeout', 'enable_send_thresholds', 'enable_send_metadata', 'flush_interval', 'flush_threshold', 'enable_ha', 'organization', 'bucket' ]
  journald: [ 'severity', 'facility', 'identifier' ]
  livestatus: [ 'socket_type', 'socket_path', 'bind_host', 'bind_port', 'compat_log_path' ]
  mainlog: [ 'severity', 'path' ]
  notification: [ 'enable_ha' ]
  opentsdb: [ 'host', 'port', 'enable_ha', 'host_template', 'service_template', 'enable_generic_metrics', 'disconnect_timeout' ]
  perfdata: [ 'host_perfdata_path', 'service_perfdata_path', 'host_temp_path', 'service_temp_path', 'host_format_template', 'service_format_template', 'rotation_interval', 'enable_ha' ]
  syslog: [ 'severity', 'facility' ]

# Generated from lib/*/*.ti of Icinga 2 v2.16.0: the boolean attributes, false is written as false
monitoring_icinga_master__config_booleans:
  api: [ 'accept_config', 'accept_commands' ]
  elasticsearch: [ 'enable_send_perfdata', 'enable_tls', 'insecure_noverify', 'enable_ha' ]
  gelf: [ 'enable_send_perfdata', 'enable_ha', 'enable_tls', 'insecure_noverify' ]
  graphite: [ 'enable_send_thresholds', 'enable_send_metadata', 'enable_ha' ]
  icingadb: [ 'enable_tls', 'insecure_noverify' ]
  influxdb: [ 'ssl_enable', 'ssl_insecure_noverify', 'enable_send_thresholds', 'enable_send_metadata', 'enable_ha' ]
  influxdb2: [ 'ssl_enable', 'ssl_insecure_noverify', 'enable_send_thresholds', 'enable_send_metadata', 'enable_ha' ]
  notification: [ 'enable_ha' ]
  opentsdb: [ 'enable_ha', 'enable_generic_metrics' ]
  perfdata: [ 'enable_ha' ]

# Generated from lib/*/*.ti of Icinga 2 v2.16.0: the attributes hidden from the API (no_user_view),
# basic_auth of influxdb is a dictionary with a password, it is replaced by username and the secret influxdb.password
monitoring_icinga_master__secrets_allowed:
  - 'api.ticket_salt'
  - 'elasticsearch.password'
  - 'icingadb.password'
  - 'influxdb.password'
  - 'influxdb2.auth_token'

monitoring_icinga_master__commands_default:
  - name: 'mail-host-notification'
    object: 'NotificationCommand'
    command: '[ ConfigDir + "/scripts/mail-host-notification.sh" ]'
    arguments:
      - key: '-4'
        value: '"$notification_address$"'
      - key: '-6'
        value: '"$notification_address6$"'
      - key: '-b'
        value: '"$notification_author$"'
      - key: '-c'
        value: '"$notification_comment$"'
      - key: '-d'
        value:
          required: 'true'
          value: '"$notification_date$"'
      - key: '-f'
        value:
          value: '"$notification_from$"'
          description: '"Set from address. Requires GNU mailutils (Debian/Ubuntu) or mailx (RHEL/SUSE)"'
      - key: '-i'
        value: '"$notification_icingaweb2url$"'
      - key: '-l'
        value:
          required: 'true'
          value: '"$notification_hostname$"'
      - key: '-n'
        value:
          required: 'true'
          value: '"$notification_hostdisplayname$"'
      - key: '-o'
        value:
          required: 'true'
          value: '"$notification_hostoutput$"'
      - key: '-r'
        value:
          required: 'true'
          value: '"$notification_useremail$"'
      - key: '-s'
        value:
          required: 'true'
          value: '"$notification_hoststate$"'
      - key: '-t'
        value:
          required: 'true'
          value: '"$notification_type$"'
      - key: '-v'
        value: '"$notification_logtosyslog$"'
    vars:
      - key: 'notification_address'
        value: '"$address$"'
      - key: 'notification_address6'
        value: '"$address6$"'
      - key: 'notification_author'
        value: '"$notification.author$"'
      - key: 'notification_comment'
        value: '"$notification.comment$"'
      - key: 'notification_type'
        value: '"$notification.type$"'
      - key: 'notification_date'
        value: '"$icinga.long_date_time$"'
      - key: 'notification_hostname'
        value: '"$host.name$"'
      - key: 'notification_hostdisplayname'
        value: '"$host.display_name$"'
      - key: 'notification_hostoutput'
        value: '"$host.output$"'
      - key: 'notification_hoststate'
        value: '"$host.state$"'
      - key: 'notification_useremail'
        value: '"$user.email$"'
  - name: 'mail-service-notification'
    object: 'NotificationCommand'
    command: '[ ConfigDir + "/scripts/mail-service-notification.sh" ]'
    arguments:
      - key: '-4'
        value: '"$notification_address$"'
      - key: '-6'
        value: '"$notification_address6$"'
      - key: '-b'
        value: '"$notification_author$"'
      - key: '-c'
        value: '"$notification_comment$"'
      - key: '-d'
        value:
          required: 'true'
          value: '"$notification_date$"'
      - key: '-e'
        value:
          required: 'true'
          value: '"$notification_servicename$"'
      - key: '-f'
        value:
          value: '"$notification_from$"'
          description: '"Set from address. Requires GNU mailutils (Debian/Ubuntu) or mailx (RHEL/SUSE)"'
      - key: '-i'
        value: '"$notification_icingaweb2url$"'
      - key: '-l'
        value:
          required: 'true'
          value: '"$notification_hostname$"'
      - key: '-n'
        value:
          required: 'true'
          value: '"$notification_hostdisplayname$"'
      - key: '-o'
        value:
          required: 'true'
          value: '"$notification_serviceoutput$"'
      - key: '-r'
        value:
          required: 'true'
          value: '"$notification_useremail$"'
      - key: '-s'
        value:
          required: 'true'
          value: '"$notification_servicestate$"'
      - key: '-t'
        value:
          required: 'true'
          value: '"$notification_type$"'
      - key: '-u'
        value:
          required: 'true'
          value: '"$notification_servicedisplayname$"'
      - key: '-v'
        value: '"$notification_logtosyslog$"'
    vars:
      - key: 'notification_address'
        value: '"$address$"'
      - key: 'notification_address6'
        value: '"$address6$"'
      - key: 'notification_author'
        value: '"$notification.author$"'
      - key: 'notification_comment'
        value: '"$notification.comment$"'
      - key: 'notification_type'
        value: '"$notification.type$"'
      - key: 'notification_date'
        value: '"$icinga.long_date_time$"'
      - key: 'notification_hostname'
        value: '"$host.name$"'
      - key: 'notification_hostdisplayname'
        value: '"$host.display_name$"'
      - key: 'notification_servicename'
        value: '"$service.name$"'
      - key: 'notification_serviceoutput'
        value: '"$service.output$"'
      - key: 'notification_servicestate'
        value: '"$service.state$"'
      - key: 'notification_useremail'
        value: '"$user.email$"'
      - key: 'notification_servicedisplayname'
        value: '"$service.display_name$"'
