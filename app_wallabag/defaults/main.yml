---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/wallabag
#

app_wallabag__home: "{{ wallabag_home | mandatory }}"
app_wallabag__ip: "{{ wallabag_ip | mandatory }}"
app_wallabag__ipv6: "{{ wallabag_ipv6 | default('') }}"
app_wallabag__network: "{{ wallabag_network | mandatory }}"
app_wallabag__hostname: "{{ wallabag_hostname | mandatory }}"
app_wallabag__timezone: "{{ wallabag_timezone | mandatory }}"
app_wallabag__labels: "{{ wallabag_labels | default({}) }}"

app_wallabag__version: "{{ wallabag_version | default('latest') }}"

app_wallabag__db_type: "{{ wallabag_db_type | default('pdo_mysql') }}"
app_wallabag__db_host: "{{ wallabag_db_host | mandatory }}"
app_wallabag__db_port: "{{ wallabag_db_port | default(3306) }}"
app_wallabag__db_user: "{{ wallabag_db_user | default('wallabag') }}"
app_wallabag__db_pass: "{{ wallabag_db_pass | mandatory }}"
app_wallabag__db_name: "{{ wallabag_db_name | default('wallabag') }}"
app_wallabag__db_charset: "{{ wallabag_db_charset | default('utf8mb4') }}"

app_wallabag__url: "{{ wallabag_url | mandatory }}"
app_wallabag__secret: "{{ wallabag_secret | mandatory }}"
app_wallabag__locale: "{{ wallabag_locale | default('en') }}"
app_wallabag__server_name: "{{ wallabag_server_name | default('Wallabag') }}"
app_wallabag__mailer_dsn: "smtp://{{ app_wallabag__mail_user if app_wallabag__mail_user | length > 0 }}{{':' + app_wallabag__mail_password if app_wallabag__mail_user | length > 0 and app_wallabag__mail_password | length > 0}}{{ '@' if app_wallabag__mail_user | length > 0 }}{{ app_wallabag__mail_host + ':' + app_wallabag__mail_port | string }}/"
app_wallabag__from_email: "{{ wallabag_from_email | mandatory }}"
app_wallabag__fosuser_registration: "{{ wallabag_user_registration | default(false) }}"
app_wallabag__fosuser_confirmation: "{{ wallabag_user_confirmation | default(true) }}"

app_wallabag__container: "{{ app_wallabag__container_default | combine(wallabag_container | default({})) }}"

app_wallabag__mail_host: "{{ wallabag_mail_host | default('127.0.0.1') }}"
app_wallabag__mail_port: "{{ wallabag_mail_port | default(25) }}"
app_wallabag__mail_user: "{{ wallabag_mail_user | default('') }}"
app_wallabag__mail_password: "{{ wallabag_mail_password | default('') }}"

app_wallabag__mysql_root_password: "{{ wallabag_mysql_root_password | default('') }}"
app_wallabag__postgres_password: "{{ wallabag_postgres_password | default('') }}"
app_wallabag__postgres_user: "{{ wallabag_postgres_user | default('') }}"

#
# Defaults - do not change
#

app_wallabag__podman_name: 'wallabag'
app_wallabag__podman_image: 'docker.io/wallabag/wallabag'
app_wallabag__podman_tag: "{{ app_wallabag__version }}"

app_wallabag__podman_home: "{{ app_wallabag__home }}"

app_wallabag__podman_data_dir: "{{ app_wallabag__podman_home }}/data"
app_wallabag__podman_images_dir: "{{ app_wallabag__podman_home }}/images"
app_wallabag__podman_var_dir: "{{ app_wallabag__podman_home }}/var"

app_wallabag__container_default:
  name: "{{ app_wallabag__podman_name }}"
  hostname: "{{ app_wallabag__hostname }}"
  image: "{{ app_wallabag__podman_image }}:{{ app_wallabag__podman_tag }}"
  ip: "{{ app_wallabag__ip }}"
  ipv6: "{{ app_wallabag__ipv6 }}"
  network: "{{ app_wallabag__network }}"
  timezone: "{{ app_wallabag__timezone }}"
  environment:
    POSTGRES_USER: "{{ app_wallabag__postgres_user }}"
    SYMFONY__ENV__DATABASE_DRIVER: "{{ app_wallabag__db_type }}"
    SYMFONY__ENV__DATABASE_HOST: "{{ app_wallabag__db_host }}"
    SYMFONY__ENV__DATABASE_PORT: "{{ app_wallabag__db_port }}"
    SYMFONY__ENV__DATABASE_NAME: "{{ app_wallabag__db_name }}"
    SYMFONY__ENV__DATABASE_USER: "{{ app_wallabag__db_user }}"
    SYMFONY__ENV__DATABASE_CHARSET: "{{ app_wallabag__db_charset }}"
    SYMFONY__ENV__DOMAIN_NAME: "{{ app_wallabag__url }}"
    SYMFONY__ENV__LOCALE: "{{ app_wallabag__locale }}"
    SYMFONY__ENV__SERVER_NAME: "{{ app_wallabag__server_name }}"
    SYMFONY__ENV__FROM_EMAIL: "{{ app_wallabag__from_email }}"
    SYMFONY__ENV__FOSUSER_REGISTRATION: "{{ app_wallabag__fosuser_registration }}"
    SYMFONY__ENV__FOSUSER_CONFIRMATION: "{{ app_wallabag__fosuser_confirmation }}"
  labels: "{{ app_wallabag__labels }}"
  secrets:
    - "wallabag_mysql_root_password,type=env,target=MYSQL_ROOT_PASSWORD"
    - "wallabag_postgres_password,type=env,target=POSTGRES_PASSWORD"
    - "wallabag_symfony_env_database_password,type=env,target=SYMFONY__ENV__DATABASE_PASSWORD"
    - "wallabag_symfony_env_mailer_dsn,type=env,target=SYMFONY__ENV__MAILER_DSN"
    - "wallabag_symfony_env_secret,type=env,target=SYMFONY__ENV__SECRET"
  volumes:
    - "{{ app_wallabag__podman_data_dir }}:/var/www/wallabag/data"
    - "{{ app_wallabag__podman_images_dir }}:/var/www/wallabag/web/assets/images"
    - "{{ app_wallabag__podman_var_dir }}:/var/www/wallabag/var"

