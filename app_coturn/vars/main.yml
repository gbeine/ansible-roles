---
# Options of the role without counterpart in turnserver.conf, enabled switches the service
app_coturn__boolean_options: [ 'enabled' ]
app_coturn__role_options: [ 'enabled' ]

# Option names of turnserver.conf and the options of the role
app_coturn__name_pattern: '^[a-z][a-z0-9-]*$'

app_coturn__config_file: '/etc/turnserver.conf'
