---
# Included by tasks/main.yml on Debian

# turnserver.conf of the package coturn of Debian 13 (4.6.1), the active options in the order of the file
app_coturn__config_default:
  enabled: true
  syslog: true
  no-rfc5780: true
  no-stun-backward-compatibility: true
  response-origin-only-with-rfc5780: true

app_coturn__debian_packages: [ 'coturn' ]
app_coturn__debian_service: 'coturn'
# The service runs as turnserver, the package sets root:turnserver 0640 with dpkg-statoverride
app_coturn__debian_group: 'turnserver'
