---
# Included by tasks/main.yml on OpenWrt

# turnserver.conf of the package coturn of the telephony feed (4.6.2), the active options in the order of the file
app_coturn__config_default:
  enabled: true
  syslog: true
  no-rfc5780: true
  no-stun-backward-compatibility: true
  response-origin-only-with-rfc5780: true

app_coturn__openwrt_package: 'coturn'
app_coturn__openwrt_service: 'turnserver'
app_coturn__openwrt_uci_config: '/etc/config/turnserver'
