---
- name: 'Verify'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    app_coturn__test_case: "{{ app_coturn__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    app_coturn__test_expect: "{{ app_coturn__test_case.expect }}"

  tasks:

    - name: 'Read the configuration'
      ansible.builtin.slurp:
        src: "{{ app_coturn__test_config_file }}"
      register: 'app_coturn__test_config'

    - name: 'Read the owner and the mode of the configuration'
      ansible.builtin.stat:
        path: "{{ app_coturn__test_config_file }}"
      register: 'app_coturn__test_config_stat'

    - name: 'Read the state of coturn and the sockets'
      ansible.builtin.shell: >-
        systemctl is-active coturn; systemctl is-enabled coturn;
        echo '---'; ss -Hlun 'sport = :{{ app_coturn__test_expect.port }}';
        echo '---'; ss -Hltn 'sport = :{{ app_coturn__test_expect.port }}'
      register: 'app_coturn__test_state'
      changed_when: false

    - name: 'Assert the configuration and the state'
      vars:
        app_coturn__test_lines: >-
          {{ (app_coturn__test_config.content | b64decode).splitlines() | map('trim') | reject('match', '#') | select | list }}
        app_coturn__test_parts: "{{ app_coturn__test_state.stdout.split('---') }}"
        app_coturn__test_status: "{{ app_coturn__test_parts[0].splitlines() | map('trim') | select | list }}"
      ansible.builtin.assert:
        that:
          - app_coturn__test_expect.lines | difference(app_coturn__test_lines) | length == 0
          - app_coturn__test_lines | select('search', '^(' ~ (app_coturn__test_expect.absent | map('regex_escape') | join('|')) ~ ')($|=)') | list | length == 0
          - app_coturn__test_config_stat.stat.pw_name == 'root'
          - app_coturn__test_config_stat.stat.gr_name == 'turnserver'
          - app_coturn__test_config_stat.stat.mode == '0640'
          - app_coturn__test_status[0] == 'active'
          - app_coturn__test_status[1] == 'enabled'
          - app_coturn__test_parts[1] | trim | length > 0
          - app_coturn__test_parts[2] | trim | length > 0
        fail_msg: >-
          state: {{ app_coturn__test_status }},
          udp: {{ app_coturn__test_parts[1] | trim }}, tcp: {{ app_coturn__test_parts[2] | trim }},
          owner: {{ app_coturn__test_config_stat.stat.pw_name }}:{{ app_coturn__test_config_stat.stat.gr_name }}
          {{ app_coturn__test_config_stat.stat.mode }},
          configuration: {{ app_coturn__test_lines | reject('match', 'static-auth-secret') | list }}

    # A STUN binding request, coturn answers with the reflexive address of the client
    - name: 'Send a STUN binding request'
      ansible.builtin.command:
        argv: [ 'turnutils_stunclient', '-p', "{{ app_coturn__test_expect.port }}", '127.0.0.1' ]
      register: 'app_coturn__test_stun'
      changed_when: false
      until: app_coturn__test_stun.stdout is search('reflexive addr')
      retries: 5
      delay: 2
