---
app_coturn__test_config_file: '/etc/turnserver.conf'

app_coturn__test_cases:

  # Without variables the configuration of the package is written
  - name: 'molecule-coturn-default'
    role_vars: {}
    expect:
      lines:
        - 'syslog'
        - 'no-rfc5780'
        - 'no-stun-backward-compatibility'
        - 'response-origin-only-with-rfc5780'
      absent: [ 'enabled', 'listening-port' ]
      port: 3478

  # An own port, a realm with the shared secret of the TURN REST API and the peers of the private networks denied
  - name: 'molecule-coturn'
    role_vars:
      coturn_config:
        listening-port: 3479
        realm: 'turn.example.org'
        use-auth-secret: true
        static-auth-secret: 'molecule-secret'
        no-multicast-peers: true
        denied-peer-ip: [ '10.0.0.0-10.255.255.255', '192.168.0.0-192.168.255.255' ]
        syslog: false
    # side_effect changes the realm, coturn has to restart
    side_effect:
      realm: 'turn2.example.org'
    expect:
      lines:
        - 'listening-port=3479'
        - 'realm=turn2.example.org'
        - 'use-auth-secret'
        - 'static-auth-secret=molecule-secret'
        - 'no-multicast-peers'
        - 'denied-peer-ip=10.0.0.0-10.255.255.255'
        - 'denied-peer-ip=192.168.0.0-192.168.255.255'
        - 'no-rfc5780'
      absent: [ 'syslog', 'enabled', 'realm=turn.example.org' ]
      port: 3479
