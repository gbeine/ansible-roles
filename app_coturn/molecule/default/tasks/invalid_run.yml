---
# Runs app_coturn with the invalid configuration passed as include parameter,
# the role has to fail before it changes the configuration.

- name: "Run app_coturn with an invalid configuration (expect ERROR): {{ app_coturn__test_invalid.message }}"
  block:

    - name: 'Run app_coturn, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'app_coturn'

    - name: 'Fail because the invalid configuration was accepted'
      ansible.builtin.fail:
        msg: "The invalid configuration was accepted: {{ app_coturn__test_invalid.message }}"

  rescue:

    - name: 'Read the configuration after the invalid run'
      ansible.builtin.stat:
        path: "{{ app_coturn__test_config_file }}"
        checksum_algorithm: 'md5'
      register: 'app_coturn__test_config_after'

    - name: 'Assert the run failed with the expected message before the configuration changed'
      ansible.builtin.assert:
        that:
          - ansible_failed_result.msg | default('') is search(app_coturn__test_invalid.search)
          - app_coturn__test_config_after.stat.checksum == app_coturn__test_config_before.stat.checksum
        fail_msg: "Failure: {{ ansible_failed_result.msg | default('') }} {{ ansible_failed_result.stderr | default('') }}"
