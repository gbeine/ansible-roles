---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/bootstrap-repositories
#

bootstrap_repositories: "{{ bootstrap_repositories__default[ansible_facts['distribution']] | mandatory }}"

#
# Defaults - do not change
#

bootstrap_repositories__default:
  Debian:
    - archive: deb
      url: http://deb.debian.org/debian
      distribution: bookworm
      components:
        - main
        - contrib
        - non-free-firmware
    - archive: deb
      url: http://deb.debian.org/debian
      distribution: bookworm-updates
      components:
        - main
        - contrib
        - non-free-firmware
    - archive: deb
      url: http://security.debian.org/debian-security
      distribution: bookworm-security
      components:
        - main
        - contrib
        - non-free-firmware

bootstrap_repositories__packages: "{{ bootstrap_repositories__packages_default[ansible_facts['distribution']] | default([]) }}"

bootstrap_repositories__packages_default:
  Debian:
    - python3-apt
  Raspbian:
    - python3-apt
