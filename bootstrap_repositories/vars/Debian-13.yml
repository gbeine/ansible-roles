bootstrap_repositories:
  - archive: 'deb'
    url: 'http://deb.debian.org/debian'
    distribution: 'trixie'
    components:
      - 'main'
      - 'contrib'
      - 'non-free-firmware'
  - archive: 'deb'
    url: 'http://deb.debian.org/debian'
    distribution: 'trixie-updates'
    components:
      - 'main'
      - 'contrib'
      - 'non-free-firmware'
  - archive: 'deb'
    url: 'http://security.debian.org/debian-security'
    distribution: 'trixie-security'
    components:
      - 'main'
      - 'contrib'
      - 'non-free-firmware'
