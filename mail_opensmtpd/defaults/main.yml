---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/mail-opensmtpd
#

mail_opensmtpd__home: "{{ opensmtpd_home | mandatory }}"
mail_opensmtpd__ip: "{{ opensmtpd_ip | mandatory }}"
mail_opensmtpd__ipv6: "{{ opensmtpd_ipv6 }}"
mail_opensmtpd__network: "{{ opensmtpd_network | mandatory }}"
mail_opensmtpd__hostname: "{{ opensmtpd_hostname | mandatory }}"
mail_opensmtpd__timezone: "{{ opensmtpd_timezone | mandatory }}"
mail_opensmtpd__labels: "{{ opensmtpd_labels }}"

# The statements of smtpd.conf, merged recursively over the default of the role and the pki and table written by the role:
# a string or number writes '<statement> <value>', a list one line per element, true the statement alone, null or false removes it,
# the named statements (mail_opensmtpd__config_named) are dictionaries of names, e.g. { 'action': { 'relay': 'relay' } }
mail_opensmtpd__config: >-
  {{ mail_opensmtpd__config_default
     | combine(mail_opensmtpd__config_tls, mail_opensmtpd__config_secrets, opensmtpd_config | default({}), recursive=true) }}

# The certificate of the host: { realm: <name> } copies fullchain.pem and privkey.pem of <dir>/<name> to <home>/tls
# on every start of the container and writes the pki <name>, empty without TLS; dir defaults to the realms of common_globals, e.g. /opt/certbot/etc/live for pki_certbot
mail_opensmtpd__tls: "{{ opensmtpd_tls | default({}) }}"

# One secret with name, data and the target secrets: the table mounted as /config/secrets, written as table secrets
mail_opensmtpd__secrets: "{{ opensmtpd_secrets | default([]) }}"

# The mail name of the host, written to <home>/mailname and mounted read-only as /etc/smtpd/mailname, empty without the file
mail_opensmtpd__mailname: "{{ opensmtpd_mailname | default('') }}"

# Variables of the image that are no options of OpenSMTPD, the options are set with opensmtpd_config
mail_opensmtpd__environment: "{{ opensmtpd_environment }}"

mail_opensmtpd__container: "{{ mail_opensmtpd__podman_container_default | combine(opensmtpd_container | default({})) }}"

mail_opensmtpd__autoupdate_enabled: "{{ opensmtpd_autoupdate_enabled | default(false) }}"
mail_opensmtpd__autoupdate_schedule: "{{ opensmtpd_autoupdate_schedule | default('*-*-* 00/4:00:00') }}"

# The timer of pki_update restarts OpenSMTPD after a renewal of the certificate of opensmtpd_tls
mail_opensmtpd__pki_update_enabled: "{{ opensmtpd_pki_update_enabled | default(true) }}"
mail_opensmtpd__pki_update_schedule: "{{ opensmtpd_pki_update_schedule | default('*-*-* 00/4:00:00') }}"

#
# Defaults - do not change
#

# Accepts mails on port 25 and relays only the mails of the container itself
mail_opensmtpd__config_default:
  listen: [ 'on 0.0.0.0' ]
  action:
    relay: 'relay'
  match: [ 'from local for any action "relay"' ]

# The statements of opensmtpd_config, the role checks that it is a dictionary
mail_opensmtpd__config_custom: "{{ opensmtpd_config | default({}) }}"

# Generated from the grammar of usr.sbin/smtpd/parse.y of OpenSMTPD 7.8.0p0 (opensmtpd 7.8.0_p0-r0 of the image),
# the statements of smtpd.conf without include and macros, in the order of smtpd.conf:
# definitions before listen, action before match
mail_opensmtpd__config_allowed:
  - 'bounce'
  - 'admd'
  - 'ca'
  - 'mda'
  - 'mta'
  - 'pki'
  - 'proc'
  - 'queue'
  - 'scheduler'
  - 'smtp'
  - 'srs'
  - 'table'
  - 'filter'
  - 'listen'
  - 'action'
  - 'match'

# The statements with a name, '<statement> "<name>" <value>'
mail_opensmtpd__config_named: [ 'ca', 'pki', 'proc', 'table', 'filter', 'action' ]

mail_opensmtpd__name_pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'

# The lines of smtpd.conf, one line per statement, the names are quoted, broken values are reported by the validation
mail_opensmtpd__config_lines: >-
  {%- set lines = [ '# Ansible managed' ] -%}
  {%- set config = mail_opensmtpd__config if mail_opensmtpd__config is mapping else {} -%}
  {%- for statement in mail_opensmtpd__config_allowed if config[statement] is defined
        and config[statement] is not none and config[statement] is not false -%}
  {%-   set value = config[statement] -%}
  {%-   if statement in mail_opensmtpd__config_named -%}
  {%-     for name, item in (value.items() | list if value is mapping else []) if item is not none and item is not false -%}
  {%-       for entry in (item if item is sequence and item is not string else [ item ]) -%}
  {%-         set _ = lines.append(statement ~ ' "' ~ name ~ '"' ~ ('' if entry is true else ' ' ~ entry)) -%}
  {%-       endfor -%}
  {%-     endfor -%}
  {%-   else -%}
  {%-     for entry in (value if value is sequence and value is not string and value is not mapping else [ value ]) -%}
  {%-       set _ = lines.append(statement ~ ('' if entry is true else ' ' ~ entry)) -%}
  {%-     endfor -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ lines }}
# YAML turns \n of the double quotes into a line break
mail_opensmtpd__config_content: "{{ (mail_opensmtpd__config_lines | join('\n')) ~ '\n' }}"

# The ports of the listeners on the address of the container: port <n>, smtps (465) or 25, listeners on the loopback are left out
mail_opensmtpd__listen_ports: >-
  {%- set ports = [] -%}
  {%- set listen = mail_opensmtpd__config.listen | default([]) -%}
  {%- for line in (listen if listen is sequence and listen is not string else [ listen ]) | select('string')
        | reject('match', '^on\s+(lo|127\.|::1)') -%}
  {%-   set port = line | regex_findall('(?:^|\s)port\s+[0-9]+') -%}
  {%-   set _ = ports.append((port | first).split() | last if port else ('465' if line is search('(^|\s)smtps(\s|$)') else '25')) -%}
  {%- endfor -%}
  {{ ports | map('int') | unique | list }}

# The certificate of the realm in the realms of common_globals (pki_easyrsa_deploy) or in opensmtpd_tls.dir (e.g. pki_certbot),
# ExecStartPre of the quadlet unit copies the files to <home>/tls
mail_opensmtpd__realms_dir: "{{ common_globals__pki_realms_dir }}"
mail_opensmtpd__tls_keys: [ 'realm', 'dir' ]
mail_opensmtpd__tls_realm: "{{ mail_opensmtpd__tls.realm | default('') if mail_opensmtpd__tls is mapping else '' }}"
mail_opensmtpd__tls_dir: "{{ mail_opensmtpd__tls.dir | default(mail_opensmtpd__realms_dir) if mail_opensmtpd__tls is mapping else mail_opensmtpd__realms_dir }}"
mail_opensmtpd__tls_dir_valid: "{{ mail_opensmtpd__tls_dir is string and mail_opensmtpd__tls_dir is match('/') and mail_opensmtpd__tls_dir is not search('[\\n\\r]') }}"
mail_opensmtpd__tls_valid: >-
  {{ mail_opensmtpd__tls_realm is string and mail_opensmtpd__tls_realm is match(mail_opensmtpd__name_pattern)
     and mail_opensmtpd__tls_dir_valid | bool }}
mail_opensmtpd__tls_files:
  - src: "{{ mail_opensmtpd__tls_dir }}/{{ mail_opensmtpd__tls_realm }}/fullchain.pem"
    dest: "{{ mail_opensmtpd__podman_tls_dir }}/fullchain.pem"
    mode: '0644'
  # OpenSMTPD reads keys of root with at most 0740
  - src: "{{ mail_opensmtpd__tls_dir }}/{{ mail_opensmtpd__tls_realm }}/privkey.pem"
    dest: "{{ mail_opensmtpd__podman_tls_dir }}/privkey.pem"
    mode: '0600'
mail_opensmtpd__config_tls: >-
  {{ { 'pki': { mail_opensmtpd__tls_realm: [ 'cert "/config/tls/fullchain.pem"', 'key "/config/tls/privkey.pem"' ] } }
     if mail_opensmtpd__tls_valid | bool else {} }}

# The table of the secret, the image reads it as /config/secrets
mail_opensmtpd__secrets_allowed: [ 'secrets' ]
mail_opensmtpd__secrets_file: '/config/secrets'
mail_opensmtpd__secrets_list: >-
  {{ mail_opensmtpd__secrets if (mail_opensmtpd__secrets is sequence and mail_opensmtpd__secrets is not string
                                 and mail_opensmtpd__secrets is not mapping) else [] }}
mail_opensmtpd__config_secrets: >-
  {{ { 'table': { 'secrets': 'file:' ~ mail_opensmtpd__secrets_file } } if mail_opensmtpd__secrets_list | length > 0 else {} }}
# lka of OpenSMTPD opens the tables as user smtpd (uid 101, gid 100 in the image)
mail_opensmtpd__secrets_mount: >-
  {{ mail_opensmtpd__secrets_list | select('mapping') | selectattr('name', 'defined') | selectattr('target', 'defined')
     | selectattr('target', 'in', mail_opensmtpd__secrets_allowed) | map(attribute='name')
     | map('regex_replace', '^(.*)$', '\1,type=mount,target=' ~ mail_opensmtpd__secrets_file ~ ',uid=0,gid=100,mode=0440') | list }}

# The variables of baseimage-alpine of linuxserver.io read by its init scripts, the options of OpenSMTPD are set with opensmtpd_config
mail_opensmtpd__environment_allowed: [ 'TZ', 'PUID', 'PGID', 'UMASK' ]

mail_opensmtpd__podman_name: 'opensmtpd'
mail_opensmtpd__podman_image: 'c0d3cr.io/container/opensmtpd'
mail_opensmtpd__podman_tag: 'latest'

mail_opensmtpd__podman_home: "{{ mail_opensmtpd__home }}"
mail_opensmtpd__podman_tls_dir: "{{ mail_opensmtpd__podman_home }}/tls"
mail_opensmtpd__config_file: "{{ mail_opensmtpd__podman_home }}/smtpd.conf"
# Checked with smtpd -n before it replaces smtpd.conf
mail_opensmtpd__config_check_file: "{{ mail_opensmtpd__podman_home }}/smtpd.conf.check"
# The mount point of the secret, podman cannot create it in the read-only home of the check
mail_opensmtpd__secrets_mount_point: "{{ mail_opensmtpd__podman_home }}/secrets"
# The image starts smtpd -f /etc/smtpd/smtpd.conf, smtpd.conf and mailname of the home are mounted there read-only
mail_opensmtpd__config_target: '/etc/smtpd/smtpd.conf'
mail_opensmtpd__mailname_file: "{{ mail_opensmtpd__podman_home }}/mailname"
mail_opensmtpd__mailname_target: '/etc/smtpd/mailname'
mail_opensmtpd__mailname_pattern: '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$'

# The filters of files/ (opensmtpd-rewrite-from of Jakub Jirutka and filter-rewrite-to, ISC license), installed to <home>/filters,
# used with proc-exec "/config/filters/<filter> <arguments>"
mail_opensmtpd__filters_dir: "{{ mail_opensmtpd__podman_home }}/filters"
mail_opensmtpd__filters: [ 'filter-rewrite-from', 'filter-rewrite-to' ]

mail_opensmtpd__podman_container_default:
  name: "{{ mail_opensmtpd__podman_name }}"
  hostname: "{{ mail_opensmtpd__hostname }}"
  image: "{{ mail_opensmtpd__podman_image }}:{{ mail_opensmtpd__podman_tag }}"
  ip: "{{ mail_opensmtpd__ip }}"
  ipv6: "{{ mail_opensmtpd__ipv6 | default(omit) }}"
  network: "{{ mail_opensmtpd__network }}"
  timezone: "{{ mail_opensmtpd__timezone }}"
  environment: "{{ mail_opensmtpd__environment | default(omit) }}"
  labels: "{{ mail_opensmtpd__labels | default(omit) }}"
  secrets: "{{ mail_opensmtpd__secrets_mount if mail_opensmtpd__secrets_mount | length > 0 else omit }}"
  publish:
    - '25:25'
    - '[::]:25:25'
  # opensmtpd_container.volumes replaces the list completely, /config contains tls, the filters and the spool
  volumes: >-
    {{ [ mail_opensmtpd__podman_home ~ ':/config',
         mail_opensmtpd__config_file ~ ':' ~ mail_opensmtpd__config_target ~ ':ro' ]
       + ([ mail_opensmtpd__mailname_file ~ ':' ~ mail_opensmtpd__mailname_target ~ ':ro' ]
          if mail_opensmtpd__mailname is string and mail_opensmtpd__mailname | length > 0 else []) }}
  # Copies the certificate of the realm on every start, a renewed certificate is used after the next restart.
  # install follows the links of the realm, the image changes the mode of a mounted key on the host.
  exec_start_pre: >-
    {{ mail_opensmtpd__tls_files | map(attribute='mode') | zip(mail_opensmtpd__tls_files | map(attribute='src'), mail_opensmtpd__tls_files | map(attribute='dest'))
       | map('join', ' ') | map('regex_replace', '^', 'install -o root -g root -m ') | list
       if mail_opensmtpd__tls_valid | bool else [] }}
