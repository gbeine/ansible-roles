---

#
# Substitutes - do not change
#

monitoring_icinga_config__node_name: "{{ icinga_node_name | mandatory }}"
monitoring_icinga_config__ticket_salt: "{{ icinga_ticket_salt | mandatory }}"

monitoring_icinga_config__user: "{{ icinga_user | default('nagios') }}"
monitoring_icinga_config__group: "{{ icinga_group | default(monitoring_icinga_config__user) }}"

# directory structure
monitoring_icinga_config__etc_dir: "{{ icinga_etc_dir | default('/etc') }}"
monitoring_icinga_config__dir: "{{ icinga_config_dir | default(monitoring_icinga_config__etc_dir + '/icinga2') }}"

monitoring_icinga_config__conf_dir: "{{ icinga_conf_dir | default(monitoring_icinga_config__dir + '/conf.d') }}"
monitoring_icinga_config__features_available_dir: "{{ icinga_features_available_dir | default(monitoring_icinga_config__dir + '/features-available') }}"
monitoring_icinga_config__features_enabled_dir: "{{ icinga_features_enabled_dir | default(monitoring_icinga_config__dir + '/features-enabled') }}"
monitoring_icinga_config__zones_dir: "{{ icinga_zones_dir | default(monitoring_icinga_config__dir + '/zones.d') }}"

monitoring_icinga_config__plugin_dir: "{{ icinga_plugin_dir | default('/usr/lib/nagios/plugins') }}"
monitoring_icinga_config__manubulon_plugin_dir: "{{ icinga_manubulon_plugin_dir | default(monitoring_icinga_config__plugin_dir) }}"
monitoring_icinga_config__plugin_contrib_dir: "{{ icinga_plugin_contrib_dir | default(monitoring_icinga_config__plugin_dir) }}"

# features
monitoring_icinga_config__features_enabled: "{{ icinga_features_enabled | default(monitoring_icinga_config__features_enabled_default) }}"

# configuration files
monitoring_icinga_config__configuration_files: "{{ icinga_configuration_files | default(monitoring_icinga_config__configuration_files_default) }}"
monitoring_icinga_config__configuration_files_absent: "{{ icinga_configuration_files_absent | default(monitoring_icinga_config__configuration_files_absent_default) }}"

# api.conf
monitoring_icinga_config__api_accept_config: "{{ icinga_api_accept_config | default(true) }}"
monitoring_icinga_config__api_accept_commands: "{{ icinga_api_accept_commands | default(true) }}"
monitoring_icinga_config__api_bind_host: "{{ icinga_api_bind_host | default('localhost') }}"
monitoring_icinga_config__api_bind_port: "{{ icinga_api_bind_port | default(5665) }}"

# api-users.conf
monitoring_icinga_config__api_users: "{{ icinga_api_users | default([]) }}"

# commands.conf
monitoring_icinga_config__commands: "{{ icinga_commands | default(monitoring_icinga_config__commands_default) }}"

# constants.conf
monitoring_icinga_config__constants: "{{ icinga_constants | default(monitoring_icinga_config__constants_default) }}"

# debug.conf
monitoring_icinga_config__debug_log_file: "{{ icinga_debug_log_file | default('LogDir + \"/debug.log\"') }}"
monitoring_icinga_config__debug_log_severity: "{{ icinga_debug_log_severity | default('debug') }}"

# endpoints.conf
monitoring_icinga_config__endpoints: "{{ icinga_endpoints | default(monitoring_icinga_config__endpoints_default) }}"

# host_dependencies.conf
monitoring_icinga_config__host_dependencies: "{{ icinga_host_dependencies | default([]) }}"
# host_groups.conf
monitoring_icinga_config__host_groups: "{{ icinga_host_groups | default(monitoring_icinga_config__host_groups_default) }}"
# hosts.conf
monitoring_icinga_config__hosts: "{{ icinga_hosts | default([]) }}"

# icinga2.conf
monitoring_icinga_config__includes: "{{ icinga_includes | default(monitoring_icinga_config__includes_default) }}"

# ido-mysql.conf
monitoring_icinga_config__mysql_user: "{{ icinga_mysql_user | default('icinga') }}"
monitoring_icinga_config__mysql_password: "{{ icinga_mysql_password | mandatory }}"
monitoring_icinga_config__mysql_host: "{{ icinga_mysql_host | default('localhost') }}"
monitoring_icinga_config__mysql_database: "{{ icinga_mysql_database | default('icinga') }}"

# mainlog.conf
monitoring_icinga_config__main_log_file: "{{ icinga_main_log_file | default('LogDir + \"/icinga2.log\"') }}"
monitoring_icinga_config__main_log_severity: "{{ icinga_main_log_severity | default('information') }}"

# notifications.conf
monitoring_icinga_config__notifications: "{{ icinga_notifications | default(monitoring_icinga_config__notifications_default) }}"

# service_dependencies.conf
monitoring_icinga_config__service_dependencies: "{{ icinga_service_dependencies | default([]) }}"
# service_groups.conf
monitoring_icinga_config__service_groups: "{{ icinga_service_groups | default(monitoring_icinga_config__service_groups_default) }}"
# services.conf
monitoring_icinga_config__services: "{{ icinga_services | default(monitoring_icinga_config__services_default) }}"

# templates.conf
monitoring_icinga_config__templates: "{{ icinga_templates | default(monitoring_icinga_config__templates_default) }}"

# timeperiods.conf
monitoring_icinga_config__timeperiods: "{{ icinga_timeperiods | default(monitoring_icinga_config__timeperiods_default) }}"

# user_groups.conf
monitoring_icinga_config__user_groups: "{{ icinga_user_groups | default(monitoring_icinga_config__user_groups_default) }}"
# users.conf
monitoring_icinga_config__users: "{{ icinga_users | default(monitoring_icinga_config__users_default) }}"

# zones.conf
monitoring_icinga_config__zones: "{{ icinga_zones | default(monitoring_icinga_config__zones_default) }}"

# zones
monitoring_icinga_config__zone_hosts: "{{ icinga_zone_hosts | default({}) }}"
monitoring_icinga_config__zone_services: "{{ icinga_zone_services | default({}) }}"

#
# Defaults - do not change
#

monitoring_icinga_config__commands_default:
  - name: 'mail-host-notification'
    object: 'NotificationCommand'
    command: '[ ConfigDir + "/scripts/mail-host-notification.sh" ]'
    arguments:
      - key: '-4'
        value: '"$notification_address$"'
      - key: '-6'
        value: '"$notification_address6$"'
      - key: '-b'
        value: '"$notification_author$"'
      - key: '-c'
        value: '"$notification_comment$"'
      - key: '-d'
        value:
          required: 'true'
          value: '"$notification_date$"'
      - key: '-f'
        value:
          value: '"$notification_from$"'
          description: '"Set from address. Requires GNU mailutils (Debian/Ubuntu) or mailx (RHEL/SUSE)"'
      - key: '-i'
        value: '"$notification_icingaweb2url$"'
      - key: '-l'
        value:
          required: 'true'
          value: '"$notification_hostname$"'
      - key: '-n'
        value:
          required: 'true'
          value: '"$notification_hostdisplayname$"'
      - key: '-o'
        value:
          required: 'true'
          value: '"$notification_hostoutput$"'
      - key: '-r'
        value:
          required: 'true'
          value: '"$notification_useremail$"'
      - key: '-s'
        value:
          required: 'true'
          value: '"$notification_hoststate$"'
      - key: '-t'
        value:
          required: 'true'
          value: '"$notification_type$"'
      - key: '-v'
        value: '"$notification_logtosyslog$"'
    vars:
      - key: 'notification_address'
        value: '"$address$"'
      - key: 'notification_address6'
        value: '"$address6$"'
      - key: 'notification_author'
        value: '"$notification.author$"'
      - key: 'notification_comment'
        value: '"$notification.comment$"'
      - key: 'notification_type'
        value: '"$notification.type$"'
      - key: 'notification_date'
        value: '"$icinga.long_date_time$"'
      - key: 'notification_hostname'
        value: '"$host.name$"'
      - key: 'notification_hostdisplayname'
        value: '"$host.display_name$"'
      - key: 'notification_hostoutput'
        value: '"$host.output$"'
      - key: 'notification_hoststate'
        value: '"$host.state$"'
      - key: 'notification_useremail'
        value: '"$user.email$"'
  - name: 'mail-service-notification'
    object: 'NotificationCommand'
    command: '[ ConfigDir + "/scripts/mail-service-notification.sh" ]'
    arguments:
      - key: '-4'
        value: '"$notification_address$"'
      - key: '-6'
        value: '"$notification_address6$"'
      - key: '-b'
        value: '"$notification_author$"'
      - key: '-c'
        value: '"$notification_comment$"'
      - key: '-d'
        value:
          required: 'true'
          value: '"$notification_date$"'
      - key: '-e'
        value:
          required: 'true'
          value: '"$notification_servicename$"'
      - key: '-f'
        value:
          value: '"$notification_from$"'
          description: '"Set from address. Requires GNU mailutils (Debian/Ubuntu) or mailx (RHEL/SUSE)"'
      - key: '-i'
        value: '"$notification_icingaweb2url$"'
      - key: '-l'
        value:
          required: 'true'
          value: '"$notification_hostname$"'
      - key: '-n'
        value:
          required: 'true'
          value: '"$notification_hostdisplayname$"'
      - key: '-o'
        value:
          required: 'true'
          value: '"$notification_serviceoutput$"'
      - key: '-r'
        value:
          required: 'true'
          value: '"$notification_useremail$"'
      - key: '-s'
        value:
          required: 'true'
          value: '"$notification_servicestate$"'
      - key: '-t'
        value:
          required: 'true'
          value: '"$notification_type$"'
      - key: '-u'
        value:
          required: 'true'
          value: '"$notification_servicedisplayname$"'
      - key: '-v'
        value: '"$notification_logtosyslog$"'
    vars:
      - key: 'notification_address'
        value: '"$address$"'
      - key: 'notification_address6'
        value: '"$address6$"'
      - key: 'notification_author'
        value: '"$notification.author$"'
      - key: 'notification_comment'
        value: '"$notification.comment$"'
      - key: 'notification_type'
        value: '"$notification.type$"'
      - key: 'notification_date'
        value: '"$icinga.long_date_time$"'
      - key: 'notification_hostname'
        value: '"$host.name$"'
      - key: 'notification_hostdisplayname'
        value: '"$host.display_name$"'
      - key: 'notification_servicename'
        value: '"$service.name$"'
      - key: 'notification_serviceoutput'
        value: '"$service.output$"'
      - key: 'notification_servicestate'
        value: '"$service.state$"'
      - key: 'notification_useremail'
        value: '"$user.email$"'
      - key: 'notification_servicedisplayname'
        value: '"$service.display_name$"'

monitoring_icinga_config__constants_default:
  - name: 'PluginDir'
    value: "\"{{ monitoring_icinga_config__plugin_dir }}\""
  - name: 'ManubulonPluginDir'
    value: "\"{{ monitoring_icinga_config__manubulon_plugin_dir }}\""
  - name: 'PluginContribDir'
    value: "\"{{ monitoring_icinga_config__plugin_contrib_dir }}\""
  - name: 'NodeName'
    value: "\"{{ monitoring_icinga_config__node_name }}\""
  - name: 'ZoneName'
    value: 'NodeName'
  - name: 'TicketSalt'
    value: "\"{{monitoring_icinga_config__ticket_salt}}\""

monitoring_icinga_config__endpoints_default:
  - name: 'NodeName'
    host: 'NodeName'

monitoring_icinga_config__host_groups_default:
  - name: 'linux-servers'
    display_name: 'Linux Servers'
    assign:
      - 'host.vars.os == "Linux"'
  - name: 'windows-servers'
    display_name: 'Windows Servers'
    assign:
      - 'host.vars.os == "Windows"'

monitoring_icinga_config__includes_default:
  - '"constants.conf"'
  - '"endpoints.conf"'
  - '"zones.conf"'
  - '<itl>'
  - '<plugins>'
  - '<plugins-contrib>'
  - '<manubulon>'
  - '<windows-plugins>'
  - '<nscp>'

monitoring_icinga_config__notifications_default:
  - name: 'mail-icingaadmin'
    apply: 'Host'
    import:
      - 'mail-host-notification'
    user_groups: 'host.vars.notification.mail.groups'
    users: 'host.vars.notification.mail.users'
    assign:
      - 'host.vars.notification.mail'
  - name: 'mail-icingaadmin'
    apply: 'Service'
    import:
      - 'mail-service-notification'
    user_groups: 'host.vars.notification.mail.groups'
    users: 'host.vars.notification.mail.users'
    assign:
      - 'host.vars.notification.mail'

monitoring_icinga_config__service_groups_default:
  - name: 'ping'
    display_name: 'Ping Checks'
    assign:
      - 'match("ping*", service.name)'
  - name: 'http'
    display_name: 'HTTP Checks'
    assign:
      - 'match("http*", service.check_command)'
  - name: 'disk'
    display_name: 'Disk Checks'
    assign:
      - 'match("disk*", service.check_command)'

monitoring_icinga_config__services_default:
  - name: 'ping4'
    import:
      - 'generic-service'
    check_command: 'ping4'
    assign:
      - 'host.address'
  - name: 'ping6'
    import:
      - 'generic-service'
    check_command: 'ping6'
    assign:
      - 'host.address6'
  - name: 'ssh'
    import:
      - 'generic-service'
    check_command: 'ssh'
    assign:
      - '(host.address || host.address6) && host.vars.os == "Linux"'
  - for: 'http_vhost => config in host.vars.http_vhosts'
    import:
      - 'generic-service'
    check_command: 'http'
    options:
      - 'vars += config'
  - for: 'disk => config in host.vars.disks'
    import:
      - 'generic-service'
    check_command: 'disk'
    options:
      - 'vars += config'
  - name: 'icinga'
    import:
      - 'generic-service'
    check_command: 'icinga'
    assign:
      - 'host.name == NodeName'
  - name: 'load'
    import:
      - 'generic-service'
    check_command: 'load'
    vars:
      - key: 'backup_downtime'
        value: '"02:00-03:00"'
    assign:
      - 'host.name == NodeName'
  - name: 'procs'
    import:
      - 'generic-service'
    check_command: 'procs'
    assign:
      - 'host.name == NodeName'
  - name: 'swap'
    import:
      - 'generic-service'
    check_command: 'swap'
    assign:
      - 'host.name == NodeName'
  - name: 'users'
    import:
      - 'generic-service'
    check_command: 'users'
    assign:
      - 'host.name == NodeName'

monitoring_icinga_config__templates_default:
  - name: 'generic-host'
    object: 'Host'
    max_check_attempts: 3
    check_interval: '1m'
    retry_interval: '30s'
    check_command: 'hostalive'
  - name: 'generic-service'
    object: 'Service'
    max_check_attempts: 5
    check_interval: '1m'
    retry_interval: '30s'
  - name: 'generic-user'
    object: 'User'
  - name: 'mail-host-notification'
    object: 'Notification'
    command: 'mail-host-notification'
    states:
      - 'Up'
      - 'Down'
    types:
      - 'Problem'
      - 'Acknowledgement'
      - 'Recovery'
      - 'Custom'
      - 'FlappingStart'
      - 'FlappingEnd'
      - 'DowntimeStart'
      - 'DowntimeEnd'
      - 'DowntimeRemoved'
    period: '24x7'
    vars:
      - key: 'notification_logtosyslog'
        value: 'false'
  - name: 'mail-service-notification'
    object: 'Notification'
    command: 'mail-service-notification'
    states:
      - 'OK'
      - 'Warning'
      - 'Critical'
      - 'Unknown'
    types:
      - 'Problem'
      - 'Acknowledgement'
      - 'Recovery'
      - 'Custom'
      - 'FlappingStart'
      - 'FlappingEnd'
      - 'DowntimeStart'
      - 'DowntimeEnd'
      - 'DowntimeRemoved'
    period: '24x7'
    vars:
      - key: 'notification_logtosyslog'
        value: 'false'

monitoring_icinga_config__timeperiods_default:
  - name: '24x7'
    display_name: 'Icinga 2 24x7 TimePeriod'
    ranges:
      - day: 'monday'
        timeframe: '00:00-24:00'
      - day: 'tuesday'
        timeframe: '00:00-24:00'
      - day: 'wednesday'
        timeframe: '00:00-24:00'
      - day: 'thursday'
        timeframe: '00:00-24:00'
      - day: 'friday'
        timeframe: '00:00-24:00'
      - day: 'saturday'
        timeframe: '00:00-24:00'
      - day: 'sunday'
        timeframe: '00:00-24:00'
  - name: '9to5'
    display_name: 'Icinga 2 9to5 TimePeriod'
    ranges:
      - day: 'monday'
        timeframe: '09:00-17:00'
      - day: 'tuesday'
        timeframe: '09:00-17:00'
      - day: 'wednesday'
        timeframe: '09:00-17:00'
      - day: 'thursday'
        timeframe: '09:00-17:00'
      - day: 'friday'
        timeframe: '09:00-17:00'
  - name: 'never'
    display_name: 'Icinga 2 never TimePeriod'

monitoring_icinga_config__user_groups_default:
  - name: 'icingaadmins'
    display_name: 'Icinga 2 Admin Group'

monitoring_icinga_config__users_default:
  - name: 'icingaadmin'
    import:
      - 'generic-user'
    display_name: 'Icinga 2 Admin'
    groups:
      - 'icingaadmins'
    email: 'root@localhost'

monitoring_icinga_config__zones_default:
  - name: 'ZoneName'
    endpoints:
      - 'NodeName'
  - name: '"global-templates"'
    global: 'true'
  - name: '"director-global"'
    global: 'true'

monitoring_icinga_config__configuration_files_default:
  - src: 'api.conf.j2'
    dest: "{{ monitoring_icinga_config__features_available_dir }}/api.conf"
  - src: 'checker.conf.j2'
    dest: "{{ monitoring_icinga_config__features_available_dir }}/checker.conf"
  - src: 'debuglog.conf.j2'
    dest: "{{ monitoring_icinga_config__features_available_dir }}/debuglog.conf"
  - src: 'mainlog.conf.j2'
    dest: "{{ monitoring_icinga_config__features_available_dir }}/mainlog.conf"
  - src: 'notification.conf.j2'
    dest: "{{ monitoring_icinga_config__features_available_dir }}/notification.conf"
  - src: 'constants.conf.j2'
    dest: "{{ monitoring_icinga_config__dir }}/constants.conf"
  - src: 'endpoints.conf.j2'
    dest: "{{ monitoring_icinga_config__dir }}/endpoints.conf"
  - src: 'icinga2.conf.j2'
    dest: "{{ monitoring_icinga_config__dir }}/icinga2.conf"
  - src: 'zones.conf.j2'
    dest: "{{ monitoring_icinga_config__dir }}/zones.conf"

monitoring_icinga_config__configuration_files_absent_default:
  - "{{ monitoring_icinga_config__conf_dir }}/app.conf"
  - "{{ monitoring_icinga_config__conf_dir }}/apt.conf"
  - "{{ monitoring_icinga_config__conf_dir }}/commands.conf"
  - "{{ monitoring_icinga_config__conf_dir }}/downtimes.conf"
  - "{{ monitoring_icinga_config__conf_dir }}/groups.conf"
  - "{{ monitoring_icinga_config__conf_dir }}/hosts.conf"
  - "{{ monitoring_icinga_config__conf_dir }}/notifications.conf"
  - "{{ monitoring_icinga_config__conf_dir }}/services.conf"
  - "{{ monitoring_icinga_config__conf_dir }}/templates.conf"
  - "{{ monitoring_icinga_config__conf_dir }}/timeperiods.conf"
  - "{{ monitoring_icinga_config__conf_dir }}/users.conf"

monitoring_icinga_config__features_enabled_default:
  - 'api'
  - 'checker'
  - 'mainlog'
  - 'notification'
