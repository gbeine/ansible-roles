---

- name: 'Create /etc/hosts'
  tags: [ 'bootstrap', 'bootstrap_hosts'  ]
  block:

    - name: 'Generate /etc/hostname'
      ansible.builtin.copy:
        dest: '/etc/hostname'
        content: |
          {{ bootstrap_hosts__hostname | bootstrap_hosts__shortname }}

    - name: 'Generate /etc/hosts'
      ansible.builtin.template:
        src: 'hosts.j2'
        dest: '/etc/hosts'
        owner: 'root'
        group: 'root'
        mode: '644'

    - name: 'Check if cloud config is used'
      ansible.builtin.stat:
        path: '/etc/cloud/cloud.cfg'
      register: 'cloud_cfg_stat_result'

    - name: 'Generate /etc/cloud config'
      ansible.builtin.template:
        src: '99-manage_etc_hosts.cfg.j2'
        dest: '/etc/cloud/cloud.cfg.d/99-manage_etc_hosts.cfg'
        owner: 'root'
        group: 'root'
        mode: '644'
      when: 'cloud_cfg_stat_result.stat.exists'
