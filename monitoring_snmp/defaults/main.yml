---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-snmp
#

# Every key of snmpd_config replaces the key of the default of the platform (vars/Debian.yml, vars/OpenWrt.yml)
monitoring_snmp__config: "{{ monitoring_snmp__config_default | combine(snmpd_config | default({})) }}"
monitoring_snmp__configs: "{{ snmpd_configs | default([]) }}"

monitoring_snmp__prune: "{{ snmpd_prune | default(true) }}"

monitoring_snmp__unit: "{{ snmpd_unit | default({}) }}"

# OpenWrt only, installs snmpd and the tools with SSL (snmpd-ssl, snmp-utils-ssl)
monitoring_snmp__ssl: "{{ snmpd_ssl | default(false) }}"

#
# Defaults - do not change
#

monitoring_snmp__apt_cache_valid_time: 3600
monitoring_snmp__service: 'snmpd'
monitoring_snmp__etc_dir: '/etc/snmp'
monitoring_snmp__conf_d_dir: "{{ monitoring_snmp__etc_dir }}/snmpd.conf.d"
monitoring_snmp__persistent_file: '/var/lib/snmp/snmpd.conf'
monitoring_snmp__unit_dropin_dir: '/etc/systemd/system/snmpd.service.d'
monitoring_snmp__unit_dropin: "{{ monitoring_snmp__unit_dropin_dir }}/50-monitoring-snmp.conf"
monitoring_snmp__unit_types: "{{ common_globals__systemd_unit_types }}"
monitoring_snmp__unit_directives: "{{ common_globals__systemd_unit_directives }}"

# Directives snmpd applies on a restart only, not on a reload (SIGHUP)
monitoring_snmp__restart_directives:
  - 'agentaddress'
  - 'master'
  - 'agentXSocket'
  - 'agentXPerms'
  - 'engineID'
  - 'engineIDType'
  - 'engineIDNic'
  - 'createUser'
