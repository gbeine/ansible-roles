---
# Included by tasks/main.yml on OpenWrt

# Same behaviour as the former default of bootstrap_openwrt (bootstrap_openwrt__snmpd_default),
# written as directives of snmpd.conf, the role translates them to the UCI configuration /etc/config/snmpd
monitoring_snmp__config_default:
  agentaddress: 'UDP:161,UDP6:161'
  master: 'agentx'
  agentXSocket: '/var/run/agentx.sock'
  com2sec:
    - 'ro default public'
    - 'rw localhost private'
  com2sec6:
    - 'ro default public'
    - 'rw localhost private'
  group:
    - 'public v1 ro'
    - 'public v2c ro'
    - 'public usm ro'
    - 'private v1 rw'
    - 'private v2c rw'
    - 'private usm rw'
  view:
    - 'all included .1'
  access:
    - 'public "" any noauth exact all none none'
    - 'private "" any noauth exact all all all'
  sysLocation: 'office'
  sysContact: 'bofh@example.com'
  sysName: 'HeartOfGold'
  exec:
    - 'filedescriptors /bin/cat /proc/sys/fs/file-nr'
  engineIDType: '3'
  engineIDNic: 'eth0'

monitoring_snmp__openwrt_packages: >-
  {{ ['snmp-mibs'] + (['snmpd-ssl', 'snmp-utils-ssl'] if monitoring_snmp__ssl | bool else ['snmpd-nossl', 'snmp-utils-nossl']) }}
monitoring_snmp__openwrt_packages_absent: >-
  {{ ['snmpd-nossl', 'snmp-utils-nossl'] if monitoring_snmp__ssl | bool else ['snmpd-ssl', 'snmp-utils-ssl'] }}

monitoring_snmp__openwrt_config: '/etc/config/snmpd'

# SNMPv3 protocols of createUser, the nossl variant is built without OpenSSL and supports MD5 and SHA without privacy only
monitoring_snmp__openwrt_auth_types: >-
  {{ ['MD5', 'SHA', 'SHA-224', 'SHA-256', 'SHA-384', 'SHA-512'] if monitoring_snmp__ssl | bool else ['MD5', 'SHA'] }}
monitoring_snmp__openwrt_privacy_types: >-
  {{ ['DES', 'AES', 'AES-192', 'AES-256'] if monitoring_snmp__ssl | bool else [] }}

# UCI options with secrets, hidden in diffs and backups
monitoring_snmp__openwrt_redact_keys: [ 'community', 'CommunityName', 'auth_pass', 'privacy_pass', 'trapsess' ]

# Directives the snmpd init script of OpenWrt can configure
monitoring_snmp__openwrt_directives:
  - 'agentaddress'
  - 'master'
  - 'agentXSocket'
  - 'sysLocation'
  - 'sysContact'
  - 'sysName'
  - 'sysServices'
  - 'sysDescr'
  - 'sysObjectID'
  - 'com2sec'
  - 'com2sec6'
  - 'group'
  - 'view'
  - 'access'
  - 'rocommunity'
  - 'rwcommunity'
  - 'rocommunity6'
  - 'rwcommunity6'
  - 'createUser'
  - 'rouser'
  - 'rwuser'
  - 'exec'
  - 'extend'
  - 'pass'
  - 'pass_persist'
  - 'disk'
  - 'engineID'
  - 'engineIDType'
  - 'engineIDNic'
  - 'trapsink'
  - 'trap2sink'
  - 'informsink'
  - 'trapcommunity'
  - 'authtrapenable'
  - 'v1trapaddress'
  - 'trapsess'
