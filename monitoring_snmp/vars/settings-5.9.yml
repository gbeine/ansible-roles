---
# yamllint disable rule:line-length
#
# Settings of snmpd of Net-SNMP 5.9 with their defaults, from debian/snmpd.conf of the
# Debian package net-snmp 5.9.4+dfsg-2+deb13u1 (Debian 13). Settings with a list as value
# are written once per value. includeDir is written by the role.
#

monitoring_snmp__release_sections:
  - name: 'System Information Setup'
    description: ''
    settings:
      - name: 'sysLocation'
        description: |-
          syslocation: The [typically physical] location of the system.
            Note that setting this value here means that when trying to
            perform an snmp SET operation to the sysLocation.0 variable will make
            the agent return the "notWritable" error code.  IE, including
            this token in the snmpd.conf file will disable write access to
            the variable.
            arguments:  location_string
        default: 'Sitting on the Dock of the Bay'
      - name: 'sysContact'
        description: ''
        default: 'Me <me@example.org>'
      - name: 'sysServices'
        description: |-
          sysservices: The proper value for the sysServices object.
            arguments:  sysservices_number
        default: '72'
  - name: 'Agent Operating Mode'
    description: |-
      This section defines how the agent will operate when it
      is running.
    settings:
      - name: 'master'
        description: |-
          master: Should the agent operate as a master agent or not.
            Currently, the only supported master agent type for this token
            is "agentx".

            arguments: (on|yes|agentx|all|off|no)
        default: 'agentx'
      - name: 'agentaddress'
        description: |-
          agentaddress: The IP address and port number that the agent will listen on.
            By default the agent listens to any and all traffic from any
            interface on the default SNMP port (161).  This allows you to
            specify which address, interface, transport type and port(s) that you
            want the agent to listen on.  Multiple definitions of this token
            are concatenated together (using ':'s).
            arguments: [transport:]port[@interface/address],...
        default: '127.0.0.1,[::1]'
  - name: 'Access Control Setup'
    description: |-
      This section defines who is allowed to talk to your running
      snmp agent.
    settings:
      - name: 'view'
        description: |-
          Views
            arguments viewname included [oid]

           system + hrSystem groups only
        default:
          - 'systemonly  included   .1.3.6.1.2.1.1'
          - 'systemonly  included   .1.3.6.1.2.1.25.1'
      - name: 'rocommunity'
        description: |-
          rocommunity: a SNMPv1/SNMPv2c read-only access community name
            arguments:  community [default|hostname|network/bits] [oid | -V view]

          Read-only access to everyone to the systemonly view
        default:
          - 'public default -V systemonly'
      - name: 'rocommunity6'
        description: ''
        default:
          - 'public default -V systemonly'
      - name: 'rouser'
        description: |-
          SNMPv3 doesn't use communities, but users with (optionally) an
          authentication and encryption string. This user needs to be created
          with what they can view with rouser/rwuser lines in this file.

          createUser username (MD5|SHA|SHA-512|SHA-384|SHA-256|SHA-224) authpassphrase [DES|AES] [privpassphrase]
          e.g.
          createuser authPrivUser SHA-512 myauthphrase AES myprivphrase

          rouser: a SNMPv3 read-only access username
             arguments: username [noauth|auth|priv [OID | -V VIEW [CONTEXT]]]
        default:
          - 'authPrivUser authpriv -V systemonly'

