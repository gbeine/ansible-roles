---
# Options of the role without counterpart in snmpd.conf, enabled switches the service on both platforms
monitoring_snmp__role_options: [ 'enabled' ]
monitoring_snmp__boolean_options: [ 'enabled' ]

# Names of snmpd_configs, the file names in snmpd.conf.d
monitoring_snmp__name_pattern: '^[A-Za-z0-9._-]+$'
