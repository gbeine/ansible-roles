---
- name: 'Side effect'
  hosts: 'molecule-snmp-openwrt'
  gather_facts: false

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_snmp__test_case: "{{ monitoring_snmp__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_snmp__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Run monitoring_snmp with snmpd disabled'
      ansible.builtin.include_role:
        name: 'monitoring_snmp'
      vars:
        snmpd_config: "{{ monitoring_snmp__test_case.role_vars.snmpd_config | combine({'enabled': false}) }}"

    # /etc/init.d/snmpd enabled exits with 0 if the service is enabled
    - name: 'Read the state of snmpd after the run with snmpd disabled'
      ansible.builtin.raw: >-
        uci get snmpd.general.enabled;
        /etc/init.d/snmpd enabled && echo 'boot=enabled' || echo 'boot=disabled';
        pidof snmpd >/dev/null && echo 'process=running' || echo 'process=stopped'
      register: 'monitoring_snmp__test_disabled'
      changed_when: false

    - name: 'Run monitoring_snmp with snmpd enabled again'
      ansible.builtin.include_role:
        name: 'monitoring_snmp'

    - name: 'Read the state of snmpd after the run with snmpd enabled again'
      ansible.builtin.raw: >-
        uci get snmpd.general.enabled;
        /etc/init.d/snmpd enabled && echo 'boot=enabled' || echo 'boot=disabled';
        pidof snmpd >/dev/null && echo 'process=running' || echo 'process=stopped'
      register: 'monitoring_snmp__test_enabled'
      changed_when: false

    - name: 'Assert enabled switches snmpd'
      ansible.builtin.assert:
        that:
          - monitoring_snmp__test_disabled.stdout_lines | map('trim') | list == [ '0', 'boot=disabled', 'process=stopped' ]
          - monitoring_snmp__test_enabled.stdout_lines | map('trim') | list == [ '1', 'boot=enabled', 'process=running' ]
        fail_msg: >-
          Disabled: {{ monitoring_snmp__test_disabled.stdout_lines | map('trim') | join(', ') }},
          enabled: {{ monitoring_snmp__test_enabled.stdout_lines | map('trim') | join(', ') }}

    - name: 'Read the checksum of the snmpd configuration before the invalid runs'
      ansible.builtin.raw: 'md5sum /etc/config/snmpd'
      register: 'monitoring_snmp__test_md5_before'
      changed_when: false

    - name: 'Run monitoring_snmp with invalid variables (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      loop: "{{ monitoring_snmp__test_case.side_effect.invalid }}"
      loop_control:
        loop_var: 'monitoring_snmp__test_invalid'
        label: "{{ monitoring_snmp__test_invalid.message }}"

    # Include parameters stay lazy like inventory variables and take precedence over set_fact,
    # set_fact would render the template itself and fail before the role runs
    - name: 'Run monitoring_snmp with a failing template in the settings (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_config:
          com2sec: [ "ro {{ '127.0.0.1' | monitoring_snmp_test_unknown_filter }} public" ]
        monitoring_snmp__test_invalid:
          message: 'a failing template in the settings'
          role_vars: {}
          search: "No filter named 'monitoring_snmp_test_unknown_filter'"
