---
- name: 'Side effect'
  hosts: 'molecule-snmp-openwrt'
  gather_facts: false

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_snmp__test_case: "{{ monitoring_snmp__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"

  tasks:

    - name: 'Read the checksum of the snmpd configuration before the invalid runs'
      ansible.builtin.raw: 'md5sum /etc/config/snmpd'
      register: 'monitoring_snmp__test_md5_before'
      changed_when: false

    - name: 'Run monitoring_snmp with invalid variables (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      loop: "{{ monitoring_snmp__test_case.side_effect.invalid }}"
      loop_control:
        loop_var: 'monitoring_snmp__test_invalid'
        label: "{{ monitoring_snmp__test_invalid.message }}"

    # Include parameters stay lazy like inventory variables and take precedence over set_fact,
    # set_fact would render the template itself and fail before the role runs
    - name: 'Run monitoring_snmp with a failing template in the settings (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_settings:
          com2sec: [ "ro {{ '127.0.0.1' | monitoring_snmp_test_unknown_filter }} public" ]
        monitoring_snmp__test_invalid:
          message: 'a failing template in the settings'
          role_vars: {}
          search: "No filter named 'monitoring_snmp_test_unknown_filter'"
