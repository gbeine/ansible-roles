---
# Runs monitoring_snmp with the role variables of the test case combined with monitoring_snmp__test_invalid.role_vars,
# the role has to fail at the validation before it changes anything

- name: "Run monitoring_snmp with invalid variables (expect ERROR): {{ monitoring_snmp__test_invalid.message }}"
  block:

    - name: 'Set the invalid role variables (expect ERROR)'
      ansible.builtin.set_fact:
        "{{ item.key }}": >-
          {{ (monitoring_snmp__test_case.role_vars[item.key] | default({})) | combine(item.value)
             if item.value is mapping else item.value }}
      loop: "{{ monitoring_snmp__test_invalid.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Run monitoring_snmp, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'monitoring_snmp'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ monitoring_snmp__test_invalid.message }}"

  rescue:

    - name: 'Read the checksum of the snmpd configuration after the invalid run'
      ansible.builtin.raw: 'md5sum /etc/config/snmpd'
      register: 'monitoring_snmp__test_md5_after'
      changed_when: false

    - name: 'Assert the run failed at the validation before any change'
      vars:
        monitoring_snmp__test_md5_regex: '[0-9a-f]{32}'
        monitoring_snmp__test_md5_before_sum: "{{ monitoring_snmp__test_md5_before.stdout | regex_search(monitoring_snmp__test_md5_regex) }}"
        monitoring_snmp__test_md5_after_sum: "{{ monitoring_snmp__test_md5_after.stdout | regex_search(monitoring_snmp__test_md5_regex) }}"
      ansible.builtin.assert:
        that:
          - ansible_failed_result.msg | default('') is search(monitoring_snmp__test_invalid.search)
          - monitoring_snmp__test_md5_before_sum | length == 32
          - monitoring_snmp__test_md5_after_sum == monitoring_snmp__test_md5_before_sum
        fail_msg: >-
          Failure: {{ ansible_failed_result.msg | default('') }}
          Checksum before: {{ monitoring_snmp__test_md5_before_sum }}, after: {{ monitoring_snmp__test_md5_after_sum }}.

  always:

    - name: 'Restore the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_snmp__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
