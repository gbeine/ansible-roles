---
# OpenWrt has no Python, all tasks use raw
- name: 'Prepare'
  hosts: 'all'
  gather_facts: false

  tasks:

    - name: 'Assert the clone is OpenWrt with apk'
      ansible.builtin.raw: '. /etc/openwrt_release && command -v apk'
      changed_when: false

    - name: 'Update the package lists'
      ansible.builtin.raw: 'apk update'
      changed_when: false
