---
- name: 'Side effect'
  hosts: 'molecule-snmp'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_snmp__test_case: "{{ monitoring_snmp__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_snmp__test_side_effect: "{{ monitoring_snmp__test_case.side_effect }}"
    # The configs of the test case with the changed community, then additionally with the changed users
    monitoring_snmp__test_configs_community: >-
      {{ monitoring_snmp__test_case.role_vars.snmpd_configs | rejectattr('name', 'eq', 'access') | list
         + [ monitoring_snmp__test_side_effect.community ] }}
    monitoring_snmp__test_configs_users: >-
      {{ monitoring_snmp__test_configs_community | rejectattr('name', 'eq', 'users') | list
         + [ monitoring_snmp__test_side_effect.users ] }}

  # Like every playbook, common_filters and common_globals come first
  roles:
    - role: 'common_filters'
    - role: 'common_globals'

  tasks:

    - name: 'Read the main PID of snmpd before the changed community'
      ansible.builtin.command: 'systemctl show --property=MainPID --value snmpd'
      register: 'monitoring_snmp__test_pid_before'
      changed_when: false

    - name: 'Set the role variables with the changed community'
      ansible.builtin.set_fact:
        snmpd_config: "{{ monitoring_snmp__test_case.role_vars.snmpd_config }}"
        snmpd_configs: "{{ monitoring_snmp__test_configs_community }}"
        snmpd_unit: "{{ monitoring_snmp__test_case.role_vars.snmpd_unit }}"

    - name: 'Run monitoring_snmp with the changed community'
      ansible.builtin.include_role:
        name: 'monitoring_snmp'

    - name: 'Read the main PID of snmpd after the changed community'
      ansible.builtin.command: 'systemctl show --property=MainPID --value snmpd'
      register: 'monitoring_snmp__test_pid_community'
      changed_when: false

    - name: 'Assert snmpd was reloaded, not restarted'
      ansible.builtin.assert:
        that:
          - monitoring_snmp__configs_result is changed
          - monitoring_snmp__test_pid_community.stdout == monitoring_snmp__test_pid_before.stdout
        fail_msg: >-
          PID {{ monitoring_snmp__test_pid_before.stdout }} -> {{ monitoring_snmp__test_pid_community.stdout }}

    - name: 'Set the role variables with the changed passwords of the user'
      ansible.builtin.set_fact:
        snmpd_configs: "{{ monitoring_snmp__test_configs_users }}"

    - name: 'Run monitoring_snmp with the changed passwords of the user'
      ansible.builtin.include_role:
        name: 'monitoring_snmp'

    - name: 'Read the main PID of snmpd after the changed passwords'
      ansible.builtin.command: 'systemctl show --property=MainPID --value snmpd'
      register: 'monitoring_snmp__test_pid_users'
      changed_when: false

    - name: 'Assert snmpd was restarted'
      ansible.builtin.assert:
        that:
          - monitoring_snmp__configs_result is changed
          - monitoring_snmp__test_pid_users.stdout != monitoring_snmp__test_pid_community.stdout
        fail_msg: >-
          PID {{ monitoring_snmp__test_pid_community.stdout }} -> {{ monitoring_snmp__test_pid_users.stdout }}

    - name: 'Restart the unit snmpd is part of'
      ansible.builtin.systemd_service:
        name: "{{ monitoring_snmp__test_unit }}"
        state: 'restarted'

    # snmpd has Type=notify and is activating for a moment
    - name: 'Read the state of snmpd after the restart of the unit'
      ansible.builtin.command: 'systemctl show --property=MainPID --property=ActiveState snmpd'
      register: 'monitoring_snmp__test_unit_restart'
      changed_when: false
      until: "'ActiveState=active' in monitoring_snmp__test_unit_restart.stdout_lines"
      retries: 10
      delay: 1

    - name: 'Stop the unit snmpd requires'
      ansible.builtin.systemd_service:
        name: "{{ monitoring_snmp__test_unit }}"
        state: 'stopped'

    - name: 'Read the state of snmpd after the stop of the unit'
      ansible.builtin.command: 'systemctl is-active snmpd'
      register: 'monitoring_snmp__test_unit_stop'
      changed_when: false
      failed_when: false
      until: monitoring_snmp__test_unit_stop.stdout in ['inactive', 'failed']
      retries: 10
      delay: 1

    - name: 'Start the unit and snmpd again'
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: 'started'
      loop:
        - "{{ monitoring_snmp__test_unit }}"
        - 'snmpd'

    - name: 'Assert snmpd follows the restart and the stop of the unit'
      ansible.builtin.assert:
        that:
          - ('MainPID=' + monitoring_snmp__test_pid_users.stdout) not in monitoring_snmp__test_unit_restart.stdout_lines
          - monitoring_snmp__test_unit_stop.stdout != 'active'
        fail_msg: >-
          After restart: {{ monitoring_snmp__test_unit_restart.stdout_lines | join(', ') }}
          (PID before {{ monitoring_snmp__test_pid_users.stdout }}), after stop: {{ monitoring_snmp__test_unit_stop.stdout }}

    - name: 'Run monitoring_snmp with snmpd disabled'
      ansible.builtin.include_role:
        name: 'monitoring_snmp'
      vars:
        snmpd_config: "{{ monitoring_snmp__test_case.role_vars.snmpd_config | combine({'enabled': false}) }}"

    - name: 'Read the state of snmpd after the run with snmpd disabled'
      ansible.builtin.command:
        argv: [ 'systemctl', 'show', '--property=ActiveState', '--property=UnitFileState', 'snmpd' ]
      register: 'monitoring_snmp__test_disabled'
      changed_when: false

    - name: 'Run monitoring_snmp with snmpd enabled again'
      ansible.builtin.include_role:
        name: 'monitoring_snmp'

    - name: 'Read the state of snmpd after the run with snmpd enabled again'
      ansible.builtin.command:
        argv: [ 'systemctl', 'show', '--property=ActiveState', '--property=UnitFileState', 'snmpd' ]
      register: 'monitoring_snmp__test_enabled'
      changed_when: false

    - name: 'Assert enabled switches snmpd'
      ansible.builtin.assert:
        that:
          - "'ActiveState=inactive' in monitoring_snmp__test_disabled.stdout_lines"
          - "'UnitFileState=disabled' in monitoring_snmp__test_disabled.stdout_lines"
          - "'ActiveState=active' in monitoring_snmp__test_enabled.stdout_lines"
          - "'UnitFileState=enabled' in monitoring_snmp__test_enabled.stdout_lines"
        fail_msg: >-
          Disabled: {{ monitoring_snmp__test_disabled.stdout_lines | join(', ') }},
          enabled: {{ monitoring_snmp__test_enabled.stdout_lines | join(', ') }}

    - name: 'Find the configuration files before the invalid runs'
      ansible.builtin.find:
        paths: [ '/etc/snmp', '/etc/snmp/snmpd.conf.d', '/etc/systemd/system/snmpd.service.d' ]
        patterns: '*.conf'
        get_checksum: true
      register: 'monitoring_snmp__test_files_before'

    # Include parameters take precedence over set_fact and only exist inside the include
    - name: 'Run monitoring_snmp with snmpd_config not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_config: 'molecule'
        monitoring_snmp__test_invalid:
          message: 'snmpd_config not a dictionary'
          search: 'expected dicts'

    - name: 'Run monitoring_snmp with an unknown directive (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_config: "{{ monitoring_snmp__test_case.role_vars.snmpd_config | combine(monitoring_snmp__test_side_effect.invalid_settings) }}"
        monitoring_snmp__test_invalid:
          message: 'an unknown directive'
          search: '^Unknown directives in `snmpd_config` or `snmpd_configs` for Net-SNMP 5\.9: molecule_unknown\.$'

    - name: 'Run monitoring_snmp with an unknown directive in a config (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_configs: [ { 'name': 'molecule', 'settings': { 'molecule_unknown': 'molecule' } } ]
        monitoring_snmp__test_invalid:
          message: 'an unknown directive in a config'
          search: 'for Net-SNMP 5\.9: molecule: molecule_unknown\.$'

    - name: 'Run monitoring_snmp with an invalid unit (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_unit: "{{ monitoring_snmp__test_side_effect.invalid_unit }}"
        monitoring_snmp__test_invalid:
          message: 'the quadlet file of a podman network as unit'
          search: '^Invalid `snmpd_unit` entries .*: requires: podman99\.network\.$'

    - name: 'Run monitoring_snmp with an empty value (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_config: { 'sysLocation': '' }
        monitoring_snmp__test_invalid:
          message: 'an empty value'
          search: '^Empty values are not allowed, false removes a directive: sysLocation\.$'

    - name: 'Run monitoring_snmp with a dictionary as value (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_config: { 'sysLocation': { 'molecule': 'molecule' } }
        monitoring_snmp__test_invalid:
          message: 'a dictionary as value'
          search: '^Values are strings, numbers, booleans or lists of them: sysLocation\.$'

    - name: 'Run monitoring_snmp with a line break in a value (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_configs: [ { 'name': 'molecule', 'settings': { 'rocommunity': "molecule\nro" } } ]
        monitoring_snmp__test_invalid:
          message: 'a line break in a value'
          search: '^Values must not contain line breaks: molecule: rocommunity\.$'

    - name: 'Run monitoring_snmp with an invalid name of a config (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_configs: [ { 'name': 'molecule config', 'settings': {} } ]
        monitoring_snmp__test_invalid:
          message: 'an invalid name of a config'
          search: '^`snmpd_configs` entries need a name of letters, digits, \., _ and - and settings as a dictionary: 0\.$'

    - name: 'Run monitoring_snmp with duplicate names of configs (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_configs: [ { 'name': 'molecule', 'settings': {} }, { 'name': 'molecule', 'settings': {} } ]
        monitoring_snmp__test_invalid:
          message: 'duplicate names of configs'
          search: '^The names of `snmpd_configs` have to be unique\.$'

    - name: 'Run monitoring_snmp with enabled in a config (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_configs: [ { 'name': 'molecule', 'settings': { 'enabled': false } } ]
        monitoring_snmp__test_invalid:
          message: 'enabled in a config'
          search: '^Options of the role are only set in `snmpd_config`: molecule: enabled\.$'

    - name: 'Run monitoring_snmp with enabled not a boolean (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_config: { 'enabled': 'no' }
        monitoring_snmp__test_invalid:
          message: 'enabled not a boolean'
          search: '^`snmpd_config\.enabled` has to be true or false\.$'

    - name: 'Run monitoring_snmp with snmpd_prune not a boolean (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        snmpd_prune: 'yes'
        monitoring_snmp__test_invalid:
          message: 'snmpd_prune not a boolean'
          search: '^`snmpd_prune` has to be true or false\.$'
