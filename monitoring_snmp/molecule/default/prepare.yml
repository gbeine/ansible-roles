---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  tasks:

    - name: 'Create a unit snmpd can depend on, a stand-in for a VPN'
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ monitoring_snmp__test_unit }}"
        content: |
          [Unit]
          Description=Molecule stand-in for a VPN

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true
        mode: '0644'

    - name: 'Start the unit snmpd can depend on'
      ansible.builtin.systemd_service:
        name: "{{ monitoring_snmp__test_unit }}"
        state: 'started'
        daemon_reload: true

    - name: 'Create the directory of the configs'
      ansible.builtin.file:
        path: "{{ monitoring_snmp__test_stale_file | dirname }}"
        state: 'directory'
        mode: '0755'

    - name: 'Create a config that is not managed by the role'
      ansible.builtin.copy:
        dest: "{{ monitoring_snmp__test_stale_file }}"
        content: |
          rocommunity molecule-stale default
        mode: '0644'
