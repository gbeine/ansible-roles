---

- name: 'Install and configure Net-SNMP'
  tags: [ 'monitoring', 'monitoring_snmp' ]
  block:

    # OpenWrt has no Python, raw works without facts on every system
    - name: 'Detect OpenWrt'
      ansible.builtin.raw: 'cat /etc/openwrt_release 2>/dev/null || true'
      register: 'monitoring_snmp__release_file'
      changed_when: false
      check_mode: false

    - name: 'Set the platform'
      ansible.builtin.set_fact:
        monitoring_snmp__openwrt: "{{ monitoring_snmp__release_file.stdout is search('DISTRIB_ID=.?OpenWrt') }}"

    - name: 'Gather the facts of the system'
      ansible.builtin.setup:
        gather_subset: [ 'min' ]
      when:
        - not monitoring_snmp__openwrt | bool
        - ansible_facts['distribution'] is not defined

    - name: 'Configure Net-SNMP on Debian'
      ansible.builtin.include_tasks: 'debian.yml'
      when: not monitoring_snmp__openwrt | bool

    - name: 'Configure Net-SNMP on OpenWrt'
      ansible.builtin.include_tasks: 'openwrt.yml'
      when: monitoring_snmp__openwrt | bool
