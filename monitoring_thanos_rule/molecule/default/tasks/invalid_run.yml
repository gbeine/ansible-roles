---
# Runs monitoring_thanos_rule with the invalid role variables passed as include parameters,
# the role has to fail before bucket.yml or the quadlet unit changes.
# Include parameters only exist inside the include, the invalid values are gone afterwards.

- name: "Run monitoring_thanos_rule with invalid variables (expect ERROR): {{ monitoring_thanos_rule__test_invalid.message }}"
  block:

    - name: 'Run monitoring_thanos_rule, it has to fail (expect ERROR)'
      ansible.builtin.include_role:
        name: 'monitoring_thanos_rule'

    - name: 'Fail because the invalid variables were accepted'
      ansible.builtin.fail:
        msg: "The invalid variables were accepted: {{ monitoring_thanos_rule__test_invalid.message }}"

  rescue:

    - name: 'Read the checksums of the quadlet unit and bucket.yml after the invalid run'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ monitoring_thanos_rule__test_files }}"
      register: 'monitoring_thanos_rule__test_md5_after'

    - name: 'Assert the run failed before the quadlet unit and bucket.yml changed'
      ansible.builtin.assert:
        that:
          - monitoring_thanos_rule__test_failure is search(monitoring_thanos_rule__test_invalid.search, multiline=true)
          # The quadlet unit exists on every VM, bucket.yml only with object storage, a missing file has to stay missing
          - monitoring_thanos_rule__test_md5_before_sums | first | length > 0
          - monitoring_thanos_rule__test_md5_after_sums == monitoring_thanos_rule__test_md5_before_sums
        fail_msg: >-
          Failure: {{ monitoring_thanos_rule__test_failure }}
          Checksums before: {{ monitoring_thanos_rule__test_md5_before_sums | join(', ') }},
          after: {{ monitoring_thanos_rule__test_md5_after_sums | join(', ') }}.
      vars:
        # Double quotes, so \n is a line break for the anchors of the searches
        # A loop reports the messages and stderr of thanos tools rules-check in the results of the items
        monitoring_thanos_rule__test_failure: "{{ ([ ansible_failed_result.msg | default(''), ansible_failed_result.stderr | default('') ]
          + (ansible_failed_result.results | default([]) | map(attribute='msg', default='') | list)
          + (ansible_failed_result.results | default([]) | map(attribute='stderr', default='') | list))
          | join('\n') }}"
        monitoring_thanos_rule__test_md5_before_sums: "{{ monitoring_thanos_rule__test_md5_before.results | map(attribute='stat.checksum', default='') | list }}"
        monitoring_thanos_rule__test_md5_after_sums: "{{ monitoring_thanos_rule__test_md5_after.results | map(attribute='stat.checksum', default='') | list }}"
