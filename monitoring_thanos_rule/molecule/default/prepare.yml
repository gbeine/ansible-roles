---
- name: 'Prepare'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_thanos_rule__test_case: "{{ monitoring_thanos_rule__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    podman_networks:
      - "{{ monitoring_thanos_rule__test_network }}"
    podman_default_network: "{{ monitoring_thanos_rule__test_network.name }}"
    podman_socket_enabled: false
    podman_cleanup_enabled: false

  roles:
    - role: 'common_filters'
    - role: 'container_podman'

  tasks:

    - name: 'Pull the images, so the first start of the services and the check of the rules do not time out'
      containers.podman.podman_image:
        name: "{{ item }}"
      loop:
        - "{{ monitoring_thanos_rule__test_image }}"
        - "{{ monitoring_thanos_rule__test_s3_image }}"
      register: 'monitoring_thanos_rule__test_pull'
      until: monitoring_thanos_rule__test_pull is succeeded
      retries: 5
      delay: 30

    # rclone serves every directory of /data as bucket
    - name: 'Create the bucket thanos of the S3 server'
      ansible.builtin.file:
        path: "{{ monitoring_thanos_rule__test_s3_dir }}/thanos"
        mode: '0755'
        state: 'directory'

    # The S3 server of the object storage S3 of molecule-thanos-rule, the secret key is the secret of the test case
    - name: 'Start the S3 server'
      containers.podman.podman_container:
        name: 'molecule-s3'
        image: "{{ monitoring_thanos_rule__test_s3_image }}"
        network: "{{ monitoring_thanos_rule__test_network.name }}"
        ip: "{{ monitoring_thanos_rule__test_s3_ip }}"
        volume:
          - "{{ monitoring_thanos_rule__test_s3_dir }}:/data"
        command:
          - 'serve'
          - 's3'
          - '/data'
          - '--addr'
          - ':9000'
          - '--auth-key'
          - "{{ monitoring_thanos_rule__test_s3_access_key }},{{ monitoring_thanos_rule__test_s3_secret_key }}"
        state: 'started'

    # The role has to remove rule files that are not declared
    - name: 'Create the directory of the rule files'
      ansible.builtin.file:
        path: "{{ monitoring_thanos_rule__test_stale_rule | dirname }}"
        mode: '0755'
        state: 'directory'

    - name: 'Create a rule file that is not declared'
      ansible.builtin.copy:
        dest: "{{ monitoring_thanos_rule__test_stale_rule }}"
        content: |
          groups: []
        mode: '0644'
