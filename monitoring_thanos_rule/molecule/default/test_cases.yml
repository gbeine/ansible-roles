---
# Network created by container_podman in prepare.yml
monitoring_thanos_rule__test_network:
  name: 'podman-molecule'
  address: '10.89.0.0'
  gateway: '10.89.0.1'
  netmask: 24
  ipv6: true
  ipv6_gateway: 'fd00:89::1'
  ipv6_prefixlength: 64

monitoring_thanos_rule__test_image: 'docker.io/thanosio/thanos:v0.42.5'
monitoring_thanos_rule__test_quadlet_path: '/etc/containers/systemd/thanos-rule.container'
monitoring_thanos_rule__test_home: '/opt/thanos-rule'

# S3 server of prepare.yml, rclone serves the directories of /data as buckets
monitoring_thanos_rule__test_s3_image: 'docker.io/rclone/rclone:1.76.0'
monitoring_thanos_rule__test_s3_ip: '10.89.0.65'
monitoring_thanos_rule__test_s3_dir: '/opt/thanos-s3'
monitoring_thanos_rule__test_s3_access_key: 'molecule'
monitoring_thanos_rule__test_s3_secret_key: 'molecule-s3-secret-key'
# A rule file in the directory of the rule files that is not declared, prepare creates it and the role has to remove it
monitoring_thanos_rule__test_stale_rule: '/opt/thanos-rule/rules/stale.yml'

monitoring_thanos_rule__test_cases:

  # Only the mandatory variables, without query rule starts, serves the StoreAPI and fails the evaluations
  - name: 'molecule-thanos-rule-default'
    role_vars:
      thanos_rule_version: 'v0.42.5'
      thanos_rule_home: '/opt/thanos-rule'
      thanos_rule_ip: '10.89.0.68'
      thanos_rule_network: 'podman-molecule'
      thanos_rule_hostname: 'thanos-rule-default'
      thanos_rule_timezone: 'Europe/Berlin'
      thanos_rule_query_url: 'http://10.89.0.1:10902'
    expect:
      ip: '10.89.0.68'
      ip6: ~
      objstore: false
      secrets: []
      rules: []
      quadlet:
        - 'Volume=/opt/thanos-rule/data:/var/thanos/rule'
        - 'Volume=/opt/thanos-rule/rules:/etc/thanos/rules:ro'

  # IPv6, labels, two rule files and the object storage S3 on the S3 server of prepare.yml with the secret key as secret
  - name: 'molecule-thanos-rule'
    role_vars:
      thanos_rule_version: 'v0.42.5'
      thanos_rule_home: '/opt/thanos-rule'
      thanos_rule_ip: '10.89.0.69'
      thanos_rule_ipv6: 'fd00:89::69'
      thanos_rule_network: 'podman-molecule'
      thanos_rule_hostname: 'thanos-rule-molecule'
      thanos_rule_timezone: 'Europe/Berlin'
      thanos_rule_labels:
        traefik.enable: 'false'
      thanos_rule_query_url: 'http://10.89.0.1:10902'
      thanos_rule_rules:
        molecule:
          groups:
            - name: 'molecule'
              interval: '5s'
              rules:
                - record: 'molecule:up:count'
                  expr: 'count(up)'
        alerts:
          groups:
            - name: 'alerts'
              rules:
                - alert: 'MoleculeDown'
                  expr: 'up == 0'
                  for: '5m'
      thanos_rule_objstore:
        type: 'S3'
        config:
          bucket: 'thanos'
          endpoint: '10.89.0.65:9000'
          region: 'us-east-1'
          insecure: true
          bucket_lookup_type: 'path'
          access_key: 'molecule'
      thanos_rule_secrets:
        - name: 'thanos_rule_s3_secret_key'
          data: 'molecule-s3-secret-key'
          target: 'config.secret_key'
    # side_effect changes a rule, the rule file changes and rule has to restart
    side_effect:
      role_vars:
        thanos_rule_rules:
          molecule:
            groups:
              - name: 'molecule'
                interval: '5s'
                rules:
                  - record: 'molecule:up:count'
                    expr: 'count(up) or vector(0)'
          alerts:
            groups:
              - name: 'alerts'
                rules:
                  - alert: 'MoleculeDown'
                    expr: 'up == 0'
                    for: '5m'
    expect:
      ip: '10.89.0.69'
      ip6: 'fd00:89::69'
      objstore: true
      secrets:
        - 'Secret=thanos_rule_s3_secret_key,type=env,target=THANOS_SECRET_CONFIG_SECRET_KEY'
      bucket:
        - '  secret_key: "$(THANOS_SECRET_CONFIG_SECRET_KEY)"'
      rules: [ 'alerts', 'molecule' ]
      quadlet:
        - 'Volume=/opt/thanos-rule/data:/var/thanos/rule'
        - 'Volume=/opt/thanos-rule/rules:/etc/thanos/rules:ro'
        - 'Volume=/opt/thanos-rule/bucket.yml:/etc/thanos/bucket.yml:ro'
        - 'Label=traefik.enable=false'
