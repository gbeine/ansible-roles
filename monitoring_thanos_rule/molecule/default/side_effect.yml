---
- name: 'Side effect'
  hosts: 'all'
  become: true

  vars_files:
    - 'test_cases.yml'

  vars:
    monitoring_thanos_rule__test_case: "{{ monitoring_thanos_rule__test_cases | selectattr('name', 'eq', inventory_hostname) | first }}"
    monitoring_thanos_rule__test_files:
      - '/etc/containers/systemd/thanos-rule.container'

  tasks:

    - name: 'Set the role variables of the test case'
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ monitoring_thanos_rule__test_case.role_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: 'Read the checksum of the quadlet unit before the invalid runs'
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: 'md5'
      loop: "{{ monitoring_thanos_rule__test_files }}"
      register: 'monitoring_thanos_rule__test_md5_before'

    # Include parameters take precedence over set_fact and only exist inside the include
    - name: 'Run monitoring_thanos_rule with thanos_rule_container not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_rule_container: [ 'volumes' ]
        monitoring_thanos_rule__test_invalid:
          message: 'thanos_rule_container is not a dictionary'
          # combine of the defaults fails before the role checks anything
          search: 'failed to combine variables, expected dicts'

    - name: 'Run monitoring_thanos_rule with an object storage without type (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_rule_objstore:
          config:
            directory: '/bucket'
        monitoring_thanos_rule__test_invalid:
          message: 'an object storage without type'
          search: '^thanos_rule_objstore needs type$'

    - name: 'Run monitoring_thanos_rule with an object storage not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_rule_objstore: 'FILESYSTEM'
        monitoring_thanos_rule__test_invalid:
          message: 'an object storage not a dictionary'
          search: '^thanos_rule_objstore has to be a dictionary$'

    - name: 'Run monitoring_thanos_rule with an invalid name of a rule file (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_rule_rules:
          'bad name':
            groups: []
        monitoring_thanos_rule__test_invalid:
          message: 'an invalid name of a rule file'
          search: '^thanos_rule_rules has invalid names: bad name$'

    - name: 'Run monitoring_thanos_rule with a rule file not a dictionary (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_rule_rules:
          molecule: 'groups: []'
        monitoring_thanos_rule__test_invalid:
          message: 'a rule file not a dictionary'
          search: '^thanos_rule_rules entries have to be dictionaries: molecule$'

    - name: 'Run monitoring_thanos_rule with a URL of query without scheme (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_rule_query_url: '10.89.0.1:10902'
        monitoring_thanos_rule__test_invalid:
          message: 'a URL of query without scheme'
          search: '^thanos_rule_query_url has to be the HTTP URL of query$'

    - name: 'Run monitoring_thanos_rule with a line break in the environment (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_rule_environment:
          TZ: "Europe/Berlin\nUTC"
        monitoring_thanos_rule__test_invalid:
          message: 'a line break in the environment'
          search: '^Values of thanos_rule_environment must not contain line breaks: TZ$'

    - name: 'Run monitoring_thanos_rule with an unknown environment variable (expect ERROR)'
      ansible.builtin.include_tasks: 'tasks/invalid_run.yml'
      vars:
        thanos_rule_environment:
          MOLECULE_UNKNOWN: 'molecule'
        monitoring_thanos_rule__test_invalid:
          message: 'an unknown environment variable'
          search: '^Unknown environment variables: MOLECULE_UNKNOWN, Thanos only reads TZ.$'

    - name: 'Run monitoring_thanos_rule with the changed role variables'
      when: monitoring_thanos_rule__test_case.side_effect is defined
      block:

        - name: 'Read the start time of the service before the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'thanos-rule' ]
          register: 'monitoring_thanos_rule__test_started_before'
          changed_when: false

        - name: 'Set the changed role variables'
          ansible.builtin.set_fact:
            "{{ item.key }}": "{{ item.value }}"
          loop: "{{ monitoring_thanos_rule__test_case.side_effect.role_vars | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: 'Run monitoring_thanos_rule with the changed role variables'
          ansible.builtin.include_role:
            name: 'monitoring_thanos_rule'

        - name: 'Read the start time of the service after the change'
          ansible.builtin.command:
            argv: [ 'systemctl', 'show', '--property=ActiveEnterTimestampMonotonic', '--value', 'thanos-rule' ]
          register: 'monitoring_thanos_rule__test_started_after'
          changed_when: false

        - name: 'Assert the changed rule file and the restart of the service'
          ansible.builtin.assert:
            that:
              - monitoring_thanos_rule__rules_result is changed
              - monitoring_thanos_rule__objstore_result is not changed
              - monitoring_thanos_rule__quadlet_result is not changed
              - monitoring_thanos_rule__test_started_after.stdout | int > monitoring_thanos_rule__test_started_before.stdout | int
            fail_msg: >-
              rule files changed: {{ monitoring_thanos_rule__rules_result is changed }},
              secret changed: {{ monitoring_thanos_rule__objstore_result is changed }},
              quadlet changed: {{ monitoring_thanos_rule__quadlet_result is changed }},
              start before {{ monitoring_thanos_rule__test_started_before.stdout }}, after {{ monitoring_thanos_rule__test_started_after.stdout }}
