---
#
# Do not edit this file.
# Replace variables using substitutions described
# https://ansible-roles.org/roles/monitoring-thanos-rule
#

# The image has no tag latest
monitoring_thanos_rule__version: "{{ thanos_rule_version | mandatory }}"

monitoring_thanos_rule__home: "{{ thanos_rule_home | mandatory }}"
monitoring_thanos_rule__ip: "{{ thanos_rule_ip | mandatory }}"
monitoring_thanos_rule__ipv6: "{{ thanos_rule_ipv6 }}"
monitoring_thanos_rule__network: "{{ thanos_rule_network | mandatory }}"
monitoring_thanos_rule__hostname: "{{ thanos_rule_hostname | mandatory }}"
monitoring_thanos_rule__timezone: "{{ thanos_rule_timezone | mandatory }}"
monitoring_thanos_rule__labels: "{{ thanos_rule_labels }}"

# The HTTP URL of query, e.g. http://thanos-query:10902
monitoring_thanos_rule__query_url: "{{ thanos_rule_query_url | mandatory }}"

# The rule files, the name without .yml and the content
monitoring_thanos_rule__rules: "{{ thanos_rule_rules | default({}) }}"

# Content of bucket.yml, stored as podman secret, without it rule uploads nothing
monitoring_thanos_rule__objstore: "{{ thanos_rule_objstore | default({}) }}"

monitoring_thanos_rule__container: "{{ monitoring_thanos_rule__podman_container_default | combine(thanos_rule_container | default({})) }}"

# Thanos reads no variables besides TZ
monitoring_thanos_rule__environment: "{{ monitoring_thanos_rule__environment_default | combine(thanos_rule_environment | default({})) }}"

monitoring_thanos_rule__autoupdate_enabled: "{{ thanos_rule_autoupdate_enabled | default(false) }}"
monitoring_thanos_rule__autoupdate_schedule: "{{ thanos_rule_autoupdate_schedule }}"

#
# Defaults - do not change
#

monitoring_thanos_rule__environment_default:
  TZ: "{{ monitoring_thanos_rule__timezone }}"

monitoring_thanos_rule__environment_allowed: [ 'TZ' ]

# Names of the rule files
monitoring_thanos_rule__name_pattern: '^[A-Za-z0-9._-]+$'

# User and group nobody of the image, the owner of the data directory
monitoring_thanos_rule__uid: 65534
monitoring_thanos_rule__gid: 65534

# HTTP endpoints (/-/ready, /metrics), the StoreAPI listens on 10901
monitoring_thanos_rule__http_port: 10902

monitoring_thanos_rule__objstore_file: '/etc/thanos/bucket.yml'
monitoring_thanos_rule__rules_dir: '/etc/thanos/rules'
monitoring_thanos_rule__data_dir: '/var/thanos/rule'

monitoring_thanos_rule__objstore_flags: >-
  {{ [ '--objstore.config-file=' ~ monitoring_thanos_rule__objstore_file ] if monitoring_thanos_rule__objstore | length > 0 else [] }}

# The podman module writes the command space separated into the quadlet unit,
# the label containing " is enclosed in ' so it reaches Thanos unchanged
monitoring_thanos_rule__command_default: >-
  {{ [ 'rule',
       '--data-dir=' ~ monitoring_thanos_rule__data_dir,
       '--rule-file=' ~ monitoring_thanos_rule__rules_dir ~ '/*.yml',
       '--query=' ~ monitoring_thanos_rule__query_url,
       "'" ~ '--label=rule_replica="' ~ monitoring_thanos_rule__hostname ~ '"' ~ "'" ]
     + monitoring_thanos_rule__objstore_flags }}

monitoring_thanos_rule__podman_name: 'thanos-rule'
monitoring_thanos_rule__podman_image: 'docker.io/thanosio/thanos'
monitoring_thanos_rule__podman_tag: "{{ monitoring_thanos_rule__version }}"
monitoring_thanos_rule__podman_data_dir: "{{ monitoring_thanos_rule__home }}/data"
monitoring_thanos_rule__podman_rules_dir: "{{ monitoring_thanos_rule__home }}/rules"
# Named after the container, a container with another name has its own secret
monitoring_thanos_rule__podman_objstore_secret: >-
  {{ (thanos_rule_container | default({})).name | default(monitoring_thanos_rule__podman_name) }}-objstore

monitoring_thanos_rule__podman_container_default:
  name: "{{ monitoring_thanos_rule__podman_name }}"
  hostname: "{{ monitoring_thanos_rule__hostname }}"
  image: "{{ monitoring_thanos_rule__podman_image }}:{{ monitoring_thanos_rule__podman_tag }}"
  ip: "{{ monitoring_thanos_rule__ip }}"
  ipv6: "{{ monitoring_thanos_rule__ipv6 | default(omit) }}"
  network: "{{ monitoring_thanos_rule__network }}"
  timezone: "{{ monitoring_thanos_rule__timezone }}"
  environment: "{{ monitoring_thanos_rule__environment }}"
  labels: "{{ monitoring_thanos_rule__labels | default(omit) }}"
  user: "{{ monitoring_thanos_rule__uid }}:{{ monitoring_thanos_rule__gid }}"
  # thanos_rule_container.command replaces the list completely
  command: "{{ monitoring_thanos_rule__command_default }}"
  secrets: >-
    {{ [ monitoring_thanos_rule__podman_objstore_secret ~ ',type=mount,target=' ~ monitoring_thanos_rule__objstore_file ]
       if monitoring_thanos_rule__objstore | length > 0 else omit }}
  # thanos_rule_container.volumes replaces the list completely
  volumes:
    - "{{ monitoring_thanos_rule__podman_data_dir }}:{{ monitoring_thanos_rule__data_dir }}"
    - "{{ monitoring_thanos_rule__podman_rules_dir }}:{{ monitoring_thanos_rule__rules_dir }}:ro"
